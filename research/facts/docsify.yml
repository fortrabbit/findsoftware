unreadable:
  - https://docsify.js.org (client-rendered shell: the fetched HTML has no page content; the README names the address as the project site)
  - https://docsify.js.org/#/quickstart (same site; the quickstart text is read from docs/quickstart.md in the repository)
notes: >
  The docs site renders client-side, so the docs are read from the docs/ folder of the develop branch, the branch the repository marks as default. The README lists "No statically built HTML files" and the docs README says it "doesn't need to build HTML files"; the runsAs values rest on the README statement that a site is served by "a static web server or GitHub Pages" and the docs statement that docsify loads and parses the Markdown in the reader's browser; the docs use no rendering-mode term, so renderingModes stays unknown. The docsify-cli package (npm 5.0.0, 31781 downloads in the week of 2026-10-12 to 2026-10-18) is the scaffolder the quickstart names and is not the record's npmName; the figures are for the library package docsify, which the CDN instructions load. The CSV's 43k weekly figure is from an earlier read; the fetched 40625 is recorded. The configuration docs say "For statically-deployed sites (f.e. on GitHub Pages) hash-based routing is" the default. The maintainer is the copyright holder named in LICENSE, "Docsify Contributors", which is not a legal entity.
