notes: >
  The homepage is https and answers 200; the same page is served over http, but only the https address is recorded. The GitHub API description is the source of the categories fact. The README says the features in its list (Markdown or AsciiDoc, tags, sitemap, RSS, Sass) and its usage section name the Leiningen and Clojure CLI tools; the install page is the README. The README says the configuration section is documented on cryogenweb.org. The releases are tagged 0.3.0 (2017-08-08) to 0.6.6 (2021-10-15), with no prerelease; the repository was last pushed 2026-06-01 but has no release after 2021-10-15, so the four-year rule in AGENTS.md will move this record to stub on the next import; a reviewer should decide whether it stays accepted. The Clojars artifact cryogen-core is not recorded because Clojars is not one of the registries in the write-record skill. No page names Java or the JVM, so runtime is not recorded. The maintainer name is copied from the homepage copyright line, which reads "Carmen La" with no further words; the LICENSE file carries no copyright line. The GitHub language detection reports HTML; the language is Clojure from the source tree.
