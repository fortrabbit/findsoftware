notes: >
  The docs say Qwik UI "is currently in its beta phase" and expect breaking changes until version 1.0, so currentMajor is 0. Two install paths are recorded: the headless kit as the npm package @qwik-ui/headless, and the styled kit as copy-paste components added by the qwik-ui CLI (npx qwik-ui init, then qwik-ui add), which the install page describes as the styled kit's CLI. The CLI package qwik-ui (npm latest 0.4.3, 270 downloads in the week 2026-10-19 to 2026-10-25) is not recorded as npmName: npmWeeklyDownloads counts @qwik-ui/headless only. The GitHub release list lags npm: the newest GitHub release is @qwik-ui/headless@0.7.4 (2025-10-26), while npm latest is 0.7.7 (2026-06-14); both are major 0 and the npm date is used for latestReleaseDate. firstRelease is 2023 from the npm creation time (0.1.0 published 2023-01-24) and the oldest GitHub release headless-0.1.1 (2023-02-09). The homepage's discord link and the docs' Discord link are the same invite. The README names the Qwik documentation, Discord and Qwik GitHub as related links, and a twitter.com/QwikDev link that belongs to Qwik, not to Qwik UI, so x is not recorded. The footer of the homepage reads "© 2023 Qwik UI", while the LICENSE names HiRez.io and Qwikifiers; the LICENSE copyright line is used for maintainer, with both holders named as worded. The install page names @qwik-ui/headless. HTTP Archive lists Qwik, the framework, but no Qwik UI entry. A sponsor (Kunaico) is listed in the README and not recorded. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header (last page 72).
