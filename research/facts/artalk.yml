notes: >
  Artalk is the Go server (binary, Docker image artalk/artalk-go) plus the browser client (npm package artalk, TypeScript, about 40KB); npmWeeklyDownloads and the npm name count the client package, which the install page names. The server stores comments in SQLite by default (the database page names SQLite, MySQL, PostgreSQL and SQL Server); Redis is an optional cache, not a store. The CSV row dates the tag v2.10.1 at 2026-10-11, the releases API has it at 2026-10-25; the record uses the API date. The nightly prerelease (2026-10-28) is a build tag, not an alpha, beta or RC, so latestPrereleaseDate is left out. Maintainer follows the LICENSE copyright line; the GitHub owner is the ArtalkJS organization, whose name the docs use for the source. The intro page puts the documentation under a CC BY-NC-SA 4.0 license; that covers the documentation only, so it is not a license entry of the software. The server has an optional token exchange with an OpenID Connect issuer (ATK_AUTH_SSO_ENABLED, ATK_AUTH_SSO_ISSUER, /sso/exchange in the OpenAPI reference); it is no login protocol for the software's users, so sso is not recorded. Social login (GitHub, Google, and other OAuth providers) is for commenters and is not recorded as sso. headlessApi is left out: the API reference (OpenAPI 3, /api/v2) never uses the word REST, so a reviewer may record rest. Embedding is a script tag or the npm import, with an ES-module CDN (esm.sh, esm.run) or cdnjs, jsdelivr and unpkg for the client; coined kind embedMethod, kept here. Linux packages are Fedora Copr, Arch AUR, NixOS and Termux. The "docker compose" file is a Docker install route, not a separate installMethod. The project was first pushed to GitHub on 2018-10-02 (intro page); firstRelease is the year of the oldest tag, 1.0.4 (2020). The importsFrom list comes from the transfer page's sections; Valine is described on the transfer page through LeanCloud exports and is not recorded as an importsFrom value, since its section does not name Valine as the source. Artalk v1 (PHP backend) is the project's own earlier version and is not recorded.
