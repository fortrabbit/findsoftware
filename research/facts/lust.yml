notes: >
  Status stays accepted as the CSV row has it, but the import moves a record with no release in four years to stub: the newest release is 2.1.0 (2022-04-03), the repository was last pushed 2025-09-11 and is not archived. Reviewer decision: whether to set stub now or let the import move it. No homepage: the project has no site beyond its repository, so the record is a repository-only record and carries no homepage fact. Criterion 1 holds on the README's own words: the software is an image server serving variants by a size query parameter ("Build your own image CDN system your way with lust"); a site points its image URLs at it. Storage backends named in the README: a file system (testing only, per the README), ScyllaDB and S3-compatible blob stores; ScyllaDB is recorded in databases, the blob store is not a database. Sizing presets are set in a configuration file and served by the size query parameter; caching is an in-memory least recently used cache sized by cache_size in the configuration file, and the README warns that bigger images can raise RAM use. Output formats (png, jpeg, gif, webp) and the processing modes (aot, jit, realtime) are coined kinds recorded here, not as fields; the image library and URL signing are not stated in the README, so they are not recorded. The OpenAPI docs are served at /ui by the server (README). The Cargo.toml at master says version 2.0.0 while the newest release is 2.1.0; the major is 2 in both. The README's runtime is a Rust binary built with cargo or shipped in a Docker image; runtimeMin is left out because the software ships as a binary and a Docker image. Docker Hub pulls for chillfish8/lust, the image the README names in its docker run example, were 8311 on 2026-11-03 (hub.docker.com/v2/repositories/chillfish8/lust/); the count is not a field. Maintainer: the MIT copyright line names Harrison Burt; the GitHub owner is the same user.
