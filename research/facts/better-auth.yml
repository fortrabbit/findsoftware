notes: >
  Category: the import has no key for authentication, so authorization is the mapped word. Monorepo: stars, contributors and the npm package come from better-auth/better-auth; the npm package better-auth is packages/better-auth in that repository. The homepage claims "992+ contributors"; the GitHub contributors endpoint counts 472 across all pages, which is the figure recorded. The homepage top banner and a blog post dated 2026-07-07 say Better Auth is joining Vercel; the project's own site still serves the software and the repository is active, so this is no end signal; the announcement names Vercel, which is recorded as parent. The same post says Auth.js / NextAuth.js joined Better Auth; that is not a record here. The privacy page names Better Auth, Inc. with the address 49 Powell St, 2nd Floor, San Francisco, CA, 94102; hqCountry is not recorded because the LICENSE names an individual as maintainer and the address belongs to the company. The pricing page says "The Better Auth framework is free and open source" and lists Starter, Pro and Enterprise tiers for the managed Infrastructure dashboard; prices are not recorded, and the tiers are no paidEdition. The homepage and enterprise page list SSO, SCIM, directory sync and RBAC as enterprise features of the managed infrastructure; the sso fact holds the protocols of the open-source SSO plugin page only. The installation page shows pnpm, yarn and bun tabs next to npm; only npm is recorded as an install route. The OpenAPI reference plugin generates an OpenAPI 3.1.1 reference from the endpoints; it is not recorded as a field. No page names a runtime for the library itself; the Node.js runtime mention is about Next.js middleware. ecosyste.ms reports 0 dependent packages with latest release 1.7.15, a stale index, so no dependentPackages figure is recorded. The latest stable release is v1.7.16 (2026-11-03T21:22Z); v1.8.0-beta.5 (2026-11-03T21:48Z) is the newer prerelease.
