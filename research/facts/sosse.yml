notes: >
  Doubt: the homepage sosse.io does not load over TLS, because the certificate it serves is for a Netlify host, so no homepage is recorded; a working https page on sosse.io, or a new homepage the project names, would settle it. Criterion 1 needs a reviewer's judgement too: Sosse is a standalone search and archive application that crawls pages, not a search component added to a site. The README and PyPI metadata name sosse.io as the official website, and the PyPI project names gitlab.com/biolds1/sosse as its source; the GitHub repository is recorded as the repository. The project has tags up to v1.14.2 but no GitHub releases, so currentMajor and latestReleaseDate come from PyPI, and firstRelease matches the v1.0.0 tag commit (2023-04-30). The PyPI pypistats recent endpoint reports last_week 22 and last_month 4, which is inconsistent; the last-month figure is recorded per the convention and the last-week figure differs. The Python package names Django in its classifiers and the uWSGI config comments mention Django; the docs do not state the parent, so no basedOn is recorded. Debian packages come from a repository on piggledy.org that the Debian install page names. No license statement other than AGPL-3.0 was found, and the README and LICENSE agree. The docs footer gives the name Laurent Defert; no legal notice was found.
