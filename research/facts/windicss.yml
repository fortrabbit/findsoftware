notes: >
  In doubt: the README and homepage say Windi CSS is sunsetting, while the sunsetting post says "Windi CSS is not deprecated" and that security fixes continue (sunsetting notice vs not deprecated). An archived repository, an npm deprecation or a stated end would settle it. Status is stub until then.
  The sunsetting post says the team no longer has the time to work on the project. The post recommends UnoCSS and Tailwind CSS for new projects; that is a recommendation, not a fact, and is not recorded. The npm package carries no deprecated flag and the last GitHub commit on the default branch is dated 2023-04-15. The docs pages for integrations (Vite, CLI, JavaScript API) are the install routes; the npm package is windicss. The GitHub organization is windicss; the npm author and the LICENSE copyright name an individual, Veritas Raven, and the project's own sunsetting post names its team, which is the maintainer recorded here. The docs state no Node minimum; runtimeMin is the npm engines field at tag v3.5.6. The HTTP Archive list has no Windi CSS entry. The discord link is the README badge, whose alt text the quote check cannot read, so it carries no quote.
