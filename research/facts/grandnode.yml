notes: >
  The latest stable release is 2.4.0 (2026-10-04) on the main branch; the 2.4.0-beta prerelease (2026-09-13) is older, so no latestPrereleaseDate is recorded. The repository default branch is develop, which the README describes as the development version. The about page says work started in 2015 with a first beta that December and the first stable version came in January 2016; 2.0 (2021) is a rebuild on ASP.NET Core and the only line developed, so firstRelease is 2016. The about page's company line reads "developed by [COMPANY LEGAL NAME], [CITY], Poland", a template placeholder, so no legal name and no hqCountry are recorded; maintainer is the name the page uses. GrandNode Official (LTS releases with backported security fixes, private vulnerability notifications, a compliance pack, support) is a service around the same code: its page says Official "is not a different product", so no paidEdition is recorded. The README names the .NET 10 SDK as the build requirement. Tracking parameters in the README links are not recorded in any URL. The homepage has no x or chat link in its markup. The newsletter is the subscription form on the about page.
