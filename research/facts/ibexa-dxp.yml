unreadable: ["https://ibexa.co (301 to ibexa.ai/en)", "https://doc.ibexa.co/en/5.0/getting_started/install_ibexa/ (404)"]
notes: >
  The homepage in the CSV, ibexa.co, redirects to ibexa.ai/en, which shows Ibexa's agentic marketing platform and does not mention the open source edition; the homepage is recorded as ibexa.ai/en because that address serves the product. The repository's default branch is 6.0, whose composer.json requires PHP >=8.5 and has no tag in the repository; the latest tagged release is v5.0.10, and the docs call v5.0 the latest LTS, so the facts use the 5.0.10 files. The metapackage ibexa/oss (920,744 total downloads on Packagist) is not used because it is a meta package; the install docs name ibexa/oss-skeleton, which is recorded. The OSS license is a dual statement: the LICENSE file lists the Ibexa Business Use License Agreement and GPL version 2, and Packagist shows "(GPL-2.0-only or proprietary)"; each statement is recorded as its own entry. The LICENSE file says the Ibexa BUL is granted by having a valid Ibexa DXP subscription. The install page for production says it is only supported on Linux. The docs say a cron job runs ibexa:cron:run; the messenger consumer is not documented on the pages read, so no always-on value is recorded. The GitHub API reports the license as NOASSERTION. The docs page on the installation requires subscription tokens for the commercial packages, which the OSS install does not use.
