notes: >
  The repository has no releases and no tags, so criterion 4 is judged by lastCommitDate, the committer date of the newest commit on main (2026-09-21), as the rule for projects without a release says; the record is listed as accepted. Criterion 2 holds because the readme names the shadcn CLI and jsrepo against direct HTTPS registry items on sveltebits.xyz, the shadcn registry model. The installation guide page returns only a script shell, so its text is unread and the install routes are taken from the readme. Installs fetch from the project's own registry, so there is no npm figure for the components; the npm package named svelte-bits belongs to another project ("Everything you need to build a Svelte library, powered by sv") and is not recorded. The LICENSE.md says the components may be used "as part of an application, website, or product" and may not be sold, sublicensed or redistributed, so the wording is kept as the one license statement and the import derives the license model from it (the react-bits precedent). The homepage says "Open source. Always free.", which the license does not match. GitHub reports the license as NOASSERTION, so no SPDX id is recorded. The readme calls the project "an official Svelte port inspired by React Bits"; the port relation is not basedOn, and the sibling sites reactbits.dev and vue-bits.dev linked from the homepage are separate candidates. The Node.js 20 requirement in the readme applies to building the project's own docs site on Cloudflare, so no runtime is recorded. No paid tier appears on the homepage or readme. The homepage links x.com/davidhaz, the maintainer's personal account, which is not recorded as a project social field. The maintainer is the LICENSE copyright holder; the repository owner is the user account DavidHDev.
