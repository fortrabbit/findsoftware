notes: >
  Cmssy is a hosted service with a visual editor and a GraphQL delivery API, and its Next.js SDK, CLI and examples are client code, so none of them is recorded. The docs point to a separate examples repository (cmssy-io/examples) and to the CLI; they hold no fact about the platform itself.
  The pricing page lists Cart and checkout from the Pro plan and the homepage calls the product "HEADLESS CMS + COMMERCE", so categories include headless-commerce. The homepage and the docs describe an AI assistant and an MCP server that edit workspace content, and the homepage says the frontend is the user's own and cmssy never hosts the site; these have no field in the starter list.
  The SSO docs page says single sign-on works with OpenID Connect providers and is part of the Enterprise plan, so sso is OIDC and paidEdition records the Enterprise plan feature.
  The changelog lists v1.0.0 under "October 2025 Initial Release". The About page lists MongoDB as the database of the platform's own stack.
  The pricing page and the rate limits docs give request allowances per plan; they are plan limits and are not recorded. The free Hobby plan is recorded as freeTier.
  The terms text sits in the page's script payload and not in visible page text, so no quote from it can be checked and hqCountry is left unknown; the maintainer is recorded as the site names the product, cmssy, with no personal name.
  The docs' installation page mentions self-hosting the admin with environment variables, but gives no install steps for it, so selfHostOption records only that mention.
