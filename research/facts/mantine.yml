notes: >
  The README, the homepage, the about page and the core package page are read; the install tabs show yarn and npm, and the recorded installMethod is the npm registry, with the yarn command quoted from the tab text. The about page places the 1.0 release on May 3rd, 2021, matching the GitHub release 1.0.0 dated 2021-05-03; the 0.x tags carry no date. The GitHub latest release is 9.7.4 and the npm latest for @mantine/core is the same version. The npm weekly figure is the @mantine/core package, the one the install command names; the sibling @mantine/hooks package is not counted. The about page reports more than 500 contributors across the project, while the GitHub contributors endpoint counts 460 accounts; the endpoint figure is recorded. The framework guides for Next.js, Vite, React Router and TanStack Start describe integrations, not runtimes, so no runtime is recorded. No pricing or paid edition page was found under the homepage navigation.
