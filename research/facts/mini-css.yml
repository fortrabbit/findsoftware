notes: >
  Status is discontinued on the archived flag of github.com/Chalarangelo/mini.css, the repository the README links as its source; the API reports archived true and the last push on 2022-04-04. The README read in full states no end, and the project's site minicss.org (named by the README and the npm package) fails its TLS handshake, while its http address redirects to an unrelated blog, so the site and its docs are unread and no docs link is recorded. The npm package mini.css, latest 3.0.1 from 2018-10-27, carries no deprecation flag. The highest stable GitHub release is v3.0.1; the tags v3.0.0-alpha.1 to alpha.3 are prereleases and the 1.0.0 release is the first. The GitHub Pages address in the repository's homepage field answers 301 to http://minicss.org, which does not serve the project, so no homepage is recorded. The README names GitCDN, RawGit and cdnjs as hosted copies and npm, yarn and bower as package managers.
