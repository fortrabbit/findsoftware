notes: >
  The npm name apollo-server is a separate package for Apollo Server v2 and v3. Its latest version (3.13.0) is deprecated on npm and the docs state v3 has been end-of-life since October 2024, quoted as "AS3 has been end-of-life since October 2024." Those versions are not this record; npmName is @apollo/server, which is not deprecated, so no discontinued signal is set. Runtime minimum comes from the engines field of @apollo/server 5.5.1. The docs also list AWS Lambda, Azure Functions and Cloudflare as targets, which is why runsAs carries per-request as well as always-on.
