notes: >
  Flotiq is a hosted service; the pricing page lists Cloud plans and a custom plan that adds on-premise and hybrid deployment. The docs state the API is provided as RESTful and GraphQL APIs and that the Dynamic Content API is generated from the content model, and the docs offer native OpenAPI support, which is recorded in notes only. The About page says Flotiq took its public shape in 2019 within the CodeWave ecosystem; that is not a release date, so firstRelease is unknown. The Codewave terms name the company as the operator; the About page calls the product a part of the CodeWave ecosystem, and no parent company is recorded. The GitHub organization flotiq holds starters, SDK and CLI tooling, plugins and the flotiq-docs source; none of its repositories is the CMS itself by their descriptions, so no repository is recorded. The Enterprise SSO page covers Active Directory; the protocol is not named, so sso keeps the product's own wording. The Enterprise plan is listed on the pricing page, and no prices are recorded. flotiq.com redirects to www.flotiq.com, which is recorded as the homepage. Webhooks are offered as hosted webhooks counted in a webhook quota on the pricing page; the starter list has no field for them. The importers for WordPress and Contentful are documented as Flotiq CLI commands.
