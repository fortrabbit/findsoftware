notes: >
  Discontinued on the project's own README, which says the documentation and code are "not currently being actively maintained and may be outdated" and asks readers to contact Rocket Communications for support. The status rests on that statement alone: the newest web-components release is v8.0.0 (2026-06-24) and the repository was pushed on 2026-10-09, so a reviewer should confirm the README warning before the record ships. The homepage https://astrouxds.com/ and the Storybook documentation answer 200 but are client-rendered shells with no readable text, so both are listed as unreadable; the homepage fact cites the address the LICENSE gives for the site. The license is stated two ways: the repository LICENSE grants the software as public domain in the United States with a royalty-free license elsewhere on conditions, and the npm package reports MIT; GitHub reports NOASSERTION for the repository. Each statement is its own license entry. The npm package is the Stencil web-components core, the first package in the README table; the React and Angular packages are wrappers and not separate candidates. The npm weekly figure is the sum of the daily downloads API for 2026-10-18 to 2026-10-24. The README warning was added on 2026-07-01, after the v8 release of 2026-06-24. The homepage https://astrouxds.com now serves a client-rendered shell titled "Astro UXDS: NOVA"; what NOVA is could not be read, so no successor is recorded. firstRelease is 2021 from the first npm upload (2021-06-24), earlier than the oldest GitHub release (2021-10-12). The repository has no homepage field set.
