notes: >
  The homepage and documentation are on the same GitHub Pages site, lbliii.github.io/bengal. The homepage links and the docs carry no discord, x, bluesky, mastodon or newsletter link. The PyPI JSON reports the download figures as -1 (not available), so no pypiDownloads is recorded. The PyPI package bengal is the one the install page names; its version 0.5.1 matches the highest GitHub release v0.5.1 (2026-06-17), and its classifier and README badge say Development Status Alpha, which is a stated status and not an end signal. The first GitHub release is v0.1.9 (2026-02-08), the oldest on the list of 18. The README names Patitas, Rosettes, Kida and Pounce as the libraries in its pipeline and says Kida is the built-in template engine; no parent project is stated, so basedOn is absent. The README says the software "ships zero npm dependencies". The maintainer is the copyright holder named in LICENSE ("Bengal Contributors"), which the pyproject also gives as the author; the author email is not recorded. The Markdown parser (Patitas, default; Python-Markdown optional) is not a field and sits in the README.
  The README describes bengal new site, bengal serve (dev server with live reload) and bengal build (production build). It names Kida as the built-in template engine, with Jinja2-compatible syntax, and Patitas as the default Markdown parser, with Python-Markdown as an option. It lists Patitas, Rosettes, Kida and Pounce under The Bengal Ecosystem.
