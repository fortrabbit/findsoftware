notes: >
  The README of github.com/fern-api/fern says "This open-source project is no longer maintained." and points to the hosted product. The repository is not archived and has had recent pushes, and the hosted Fern product on buildwithfern.com is published, so the status stays hosted-service with the end of the open source part noted here. The footer on the docs pages names the legal entity as "Birch Solutions, Inc., a Postman company"; the privacy policy names it "Birch Solutions, Inc. dba Fern". The contributor count is from the contributors endpoint with per_page=1 and the rel="last" page. The npm package fern-api reports a different version string than the GitHub releases; the major is 5 in both. The GitHub releases start at 0.0.0 on 2022-04-07, so firstRelease is 2022. Self-hosted docs are an Enterprise feature. The sso field refers to the hosted docs product, not to the CLI.
