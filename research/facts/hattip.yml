notes: >
  The homepage hattip.dev did not resolve when checked again on 2026-10-22, and the npm package names no homepage, so no homepage is recorded. The repository is a monorepo of packages, and the npm figures are for @hattip/core, the core package, which is type-only. The package named hattip on npm (latest 0.0.33) had 196 weekly downloads for the same period and is not the record's package. The README lists Bun among its adapters. The README shows adapter usage for Node.js and Cloudflare Workers but no install command, so installMethod is not recorded. The README states that Hattip can be used as an Express middleware; the adapter is documented, and the relationship is not recorded as a field. The candidate CSV spells the name HatTip; the README spells it Hattip. The GitHub API returns no releases, so latestReleaseDate is the npm date of 0.0.49. The LICENSE copyright line dates from 2021, and the repository was created in 2022.
