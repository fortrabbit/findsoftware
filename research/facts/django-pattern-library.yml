notes: >
  The record is component-workshop (dev-tool) with basedOn django: the README says the library is for Django projects and its docs say it depends on Django for rendering. The repository's contributors count is taken across all pages (30). The PyPI first upload is 0.1.14 (2019-02-07), and the GitHub repository was created 2020-02-19; the tags v0.1.12 to v0.1.14 are in this repository, so firstRelease is 2019 from the oldest registry upload. The oldest GitHub release is v0.3.0 (2020-11-03). Maintainer: the LICENSE copyright line names Torchbox Ltd, recorded with its legal form; pyproject.toml names the author Thibaud Colas. The company's registered address is 3rd Floor, 15 Colston St, Bristol, BS1 5AP, registered in England and Wales, from the company contact page at torchbox.com. The v1.5.0 GitHub release is titled "Experimental Jinja support", and the docs mark Jinja as experimental. Nightly builds named on the README are not releases. runsAs static is recorded from the static export guide, whose render_patterns command writes the templates out as .html files and which describes publishing the library as a static site; runsAs local is recorded from the getting-started security note that the package is only for testing environments; the live Django-rendered mode is not stated as a runtime, so no always-on or per-request value is recorded. The PyPI classifiers list Framework :: Django; the docs compatibility page states Django 4.2 to 6.1 and Python 3.10 to 3.14, and the Poetry constraint ^3.10 is recorded as runtimeMin. The pypistats figure is the last-month count from the recent endpoint.
