notes: >
  Stable release 4.0.0 (2026-01-18) is the highest stable GitHub release and the npm latest tag; the 4.0.0-rc.2 prerelease carries the same day and is older than the stable release, so no latestPrereleaseDate is recorded. The jquery.com homepage names jQuery UI and jQuery Mobile as related projects; jQuery UI is in maintenance-only mode and jQuery Mobile is deprecated, as the homepage states, and neither is a basedOn of this record. The README says "jQuery also supports Node, browser extensions, and other non-browser environments" beside the browser support list, so runsAs is browser, from the homepage sentence on browsers, and no runtime is recorded: the README names Node and other environments without a single runtime. The support page lists a Matrix channel and an IRC channel on Libera Chat, which have no field; the README's forum link is the one for developing jQuery Core. The maintainer is the OpenJS Foundation, which the LICENSE copyright line and the site footer name; no legal form or country is stated in the pages read. The firstRelease year comes from the project's 4.0 announcement post, which dates the library's introduction to January 14, 2006; the repository itself was created in 2009 and the oldest npm version is 1.5.1 (2011). The httpArchiveSites figure is the mobile origin count of the HTTP Archive technology "jQuery", following the adoption script's convention. The stated x link is the Twitter account on the homepage.
