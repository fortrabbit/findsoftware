notes: >
  Twig is a PHP template engine, accepted as a templating library used by PHP sites and applications. The composer.json at the latest release tag v3.30.0 gives PHP 8.1 as the minimum, the same figure the docs state in their prerequisites, so runtimeMin is 8.1.0 and the runtime is php. The LICENSE copyright line names the Twig Team, the composer.json authors list names Fabien Potencier as Lead Developer and Armin Ronacher as Project Founder; those people are notes and the maintainer follows the LICENSE. The docs state the documentation is under the new BSD license; that is the documentation's license, so it is notes and not a second license entry. The GitHub API reports the repository default branch as 3.x; the release figures come from the releases API. The newest pre-release is v4.0.0-alpha1, dated 2026-05-17, which is older than the 3.30.0 release, so it is not latestPrereleaseDate. The README says Twig's syntax is similar to the Django and Jinja template languages; that is a description of syntax, not an alternative named by the project, so no alternativeTo. The docs list Symfony, Drupal, phpBB and other projects as users of Twig, and that is a list of users, not a basedOn or importsFrom relation. The README's sponsor block names Blackfire.io and is left out. The Packagist total counts all downloads of twig/twig since its first upload; the ecosyste.ms counts are its dependent Packagist packages and repositories. The homepage says Twig compiles templates down to plain optimized PHP code, and its sandbox mode evaluates templates in which the user has access to a limited set of tags, filters and object methods defined by the developer; the docs introduction says a loader finds templates, an environment stores the configuration, and render() loads a named template with variables, with a cache option for compiled templates. Automatic output escaping is also a feature the homepage names.
