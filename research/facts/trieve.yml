notes: >
  In doubt, so stub, and no homepage. The project site trieve.ai does not resolve, and docs.trieve.ai, the documentation the README links for self-hosting guides, did not connect (curl error 28). The README names the self-hosting guides (AWS, GCP, Kubernetes, docker compose) and the Local Development section lists cargo and yarn steps, but no install page could be read. What would settle it: a live docs site or self-hosting guide, or a live project site. Releases: seven GitHub releases; v0.13.0 (2024-12-06) is the highest stable application release, and trieve-helm-0.2.2 (2025-03-07) is the newest stable release, a Helm chart; latestReleaseDate takes GitHub's newest. No prerelease is listed; the repository has a v0.11.9-pre tag. The LICENSE file on main returns 404, so the MIT license is taken from the repository's license field (api). The GitHub organization profile gives the location "United States of America", which is not a legal notice and is not recorded as hqCountry. Hosted offering: the README links dashboard.trieve.ai with "Sign Up (1k chunks free)"; that host did not connect and no plan page was read. The README links three Discord invites; the one on the Join Discord badge is recorded. The README's "docker compose" embedding files are for local development.
