notes: >
  Authgear's repository is the open-source server, Apache-2.0 on its LICENSE.txt and GitHub. Its releases are calendar tags such as 2026-10-22.0, so currentMajor is not recorded and the latest release is recorded by date only. The repository also carries a separate authgear-once product line (tags such as authgear-once/1.1.0-alpha.1, prereleases from 2025), which is not the server's release history; the docs describe Authgear ONCE as an easy-install version of Authgear for any Linux server, and its license and terms are not read, so no paidEdition is recorded. The homepage describes plans for Authgear Cloud, and the pricing page lists Free, Developers, Business and Enterprise plans; plan tiers of the hosted service are not a paidEdition, and no prices are recorded. The pricing page says an EU data region is coming soon, so regions is unknown. The homepage names ISO 27001 and SOC 2 Type II on its page, recorded here only as stated: not recorded as a field. The docs name the server image as quay.io/theauthgear/authgear-server in the Helm and migration pages; Quay is not Docker Hub, so no dockerPulls figure is recorded. The terms name Skymakers Digital Limited, registered in England and Wales with a Stockport address. The footer link Enterprise Licenses leads to a separate Authgear Enterprise Edition license, including self-hosted use, from Oursky Limited, a Hong Kong limited company; it names no features the open version lacks, so no paidEdition is recorded. The ONCE install page says anyone can purchase a one-time license for Authgear ONCE, so that route is a paid package; its terms were not read. The homepage footer lists compare pages for Okta, Auth0, Cognito, Firebase and Keycloak; Okta has no record id. The SDK languages the homepage names (Swift, Kotlin, Flutter, React Native and a web SDK) are a coined kind and stay in notes. The homepage's "Migrate to Authgear" link and migration docs name Auth0 among the services migrated from. The GitHub organization authgear is the repository owner; the company name is taken from the terms page.
