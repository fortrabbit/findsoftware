notes: >
  The GitHub repository is archived and its README says the project moved to sourcehut on 2026-06-16, so the repository fact names the sourcehut repository and the status stays accepted; the archive flag is a move, not an end. The stargazer count (78) and the contributor count come from the archived GitHub repository, the only place those figures exist. The latest release is v680-0 of 2026-06-18, announced on the project site, which says it is the first release that uses Convergent Versioning instead of semantic versioning, with semantic versioning kept for Nimble. That version has no major in the semantic sense, so currentMajor is not recorded; the highest stable GitHub release is v1.4.1 (2026-05-22) and the sourcehut tag list stops at v1.3.7. The first release is Version 0.1.0 of 2017-10-15 on the news page. The language value Nim comes from the project's pages; GitHub reports the primary language as CSS. The usage page describes the default build as copying contents and assets into the output directory, which supports the static value. The project site lists three sites it powers, all by the maintainer or the project, which is not recorded as an install count.
