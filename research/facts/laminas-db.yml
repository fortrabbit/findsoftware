notes: >
  Accepted: a database layer that a PHP application calls to build and run queries, so it meets criterion 1 as a helper library. The README and the docs landing page both say the package is in security-only maintenance: the README says it is considered feature-complete and is now in security-only maintenance mode following a decision by the Technical Steering Committee, and it asks people who want to take on the maintainer role to nominate themselves. The docs sidebar carries the same status, and the Maintenance Overview page at getlaminas.org describes the security-only mode as receiving only critical security support, with laminas-db listed in it. The project states no end date and still publishes security support, which is not an end under criterion 4, so status stays accepted; the reviewer should decide whether the security-only mode should be a field (maintenanceStatus is a coined kind and is kept here). The latest stable release is 2.22.0 on 2026-05-21; the default branch is 2.23.x, last pushed 2026-11-03, and no release from it is recorded. The maintainer is the copyright holder in the LICENSE, Laminas Project; the copyright line adds that the project is a Series of LF Projects, LLC, and the docs site calls the Laminas project the Linux Foundation's only PHP project, so the foundation goes here and not into the maintainer field. The docs landing page says the code is licensed under BSD 3-Clause, which agrees with composer.json. The adapter page lists the drivers Mysqli, Pdo_Mysql, Pdo_Sqlite, Pdo_Pgsql and IbmDb2; IBM DB2 has no vocabulary value and stays in notes. The Mastodon link in the docs footer is the Laminas project's account, not one of the package alone. The README says the test suites need MySQL, PostgreSQL and SQL Server through a Vagrant box. The package is Laminas\Db, the component of the Laminas project named in the README, and the docs site lists it under Components for Enterprise Applications; no page names a parent project the package is built on, so basedOn is not recorded. The migration page on docs.laminas.dev describes moving from Zend Framework, which is archived; no page names laminas-db as the successor of a Zend package, so successorOf is not recorded. The composer.json at 2.22.0 requires php in the 8.2 to 8.5 range and laminas/laminas-stdlib; runtimeMin follows that manifest at the latest release tag. The Packagist figure is the total of all downloads of laminas/laminas-db; the dependent counts are from ecosyste.ms for the Packagist package. The first release is 2.0.0 on 2019-12-31, the oldest tag and the first Packagist upload. Stars and contributors are for the repository.
