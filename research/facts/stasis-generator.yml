notes: >
  The homepage getstasis.com, listed as the homepage in the candidate row and the GitHub repository, answers 404 Not Found on /, /docs, /docs/, /getting-started, /en and /index.html (checked 2026-10-23). /robots.txt answers 200 with only "User-agent: *" and an empty "Disallow:", which is not the software's page. Under the decision on this candidate no homepage is recorded and the dead domain is cited only for status. The README says "This project is currently in alpha status" and that the API is likely to change; it is not a field and is not recorded as a status. Install steps are present in the README: npm i -g stasis-generator, npm i --save-dev stasis-generator, and the stasis-cli build and serve scripts; the README's Netlify deploy button points at a separate example project, which is not recorded. The README does not name Node.js and package.json has no engines field, so runtime is unknown. The output directory appears only in the example stasis.config.json (publicPath "dist"), which is not recorded as a default. License is stated two ways: LICENSE says MIT License, copyright "Jonas D.", and package.json says "ISC"; the GitHub API reports MIT. Both are recorded as separate license entries. Maintainer is "Jonas D." as LICENSE states it; the GitHub owner is Gioni06, a user account, so the reviewer should decide whether the maintainer is the owner. The repository has no GitHub releases; the highest stable tag is v0.3.3, which matches npm latest, so currentMajor is 0 and latestReleaseDate is the npm publish time of 0.3.3. firstRelease 2019 comes from the first npm version (0.0.2, 2019-03-01). The GitHub repository was pushed last on 2023-06-13. npm weekly downloads of 5 cover 2026-10-12 to 2026-10-18; the candidate row recorded 8 per week. The last release is from 2019, so the import moves the record to stub on its own rules as well.
