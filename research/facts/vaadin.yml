notes: >
  Homepage vaadin.com answers 200 and is the project's own site; the GitHub homepage field is empty. Repository is vaadin/flow (Apache-2.0, Java); its highest stable release is 25.3.5 (2026-10-26), so currentMajor is 25. The flow tags 2.13.x are the older line and are below 25 in the highest-version rule. Maven Central com.vaadin:vaadin is the artifact whose metadata was read; its 6.0.0 pom Last-Modified is 2009-08-31, the oldest upload found, which predates the GitHub tags and sets firstRelease; no changelog states an earlier date. The 25.4.0-alpha releases are older than the latest stable release, so latestPrereleaseDate is not set. endoflife.date has no vaadin product (404). Maven Central publishes no download figure. The homepage says "Loved by 100,000+ developers"; that counts developers, not sites or installs, so reportedInstalls is not recorded. Copilot and the hosted Vaadin MCP server are online services that are not open source, described on the licensing page; they are not recorded as hostedOffering because they are tools for building apps, not a hosted place to run them. The Vaadin Start project generator and the build pages say the production build needs Node.js only when an application adds frontend code of its own (the pre-compiled bundle needs none); this is a build requirement, not a runtime one, and is not recorded as a field. The Enterprise Edition page offers 15 years of maintenance per major release; no field for that was added. The docs say Vaadin Start and Spring Initializr create Spring Boot projects and that Spring Boot is the easiest starting point; that is a starter choice, not the project stating a parent, so basedOn is not recorded. The Vaadin Start template is a default, not the framework's parent. Community link list: homepage links to twitter.com/vaadin, which is recorded as x; no discord, bluesky, mastodon or newsletter link was found on the homepage, pricing or docs pages.
