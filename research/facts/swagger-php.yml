notes: >
  Checked 2026-11-16. The CSV homepage http://zircote.github.io/swagger-php/ redirects over plain http to http://zircote.com/swagger-php/, and the https github.io address redirects to that same http page; the https address zircote.com/swagger-php/ answers 200 and is recorded as the homepage. The docs link in the README points at the github.io address, so the docs fact is the https site. Stable 7.6.0 (2026-11-12) is the highest stable release, so currentMajor is 7; the newest prerelease, 6.0.0-RC1 (2025-11-24), is older than it and is not recorded as latestPrereleaseDate. The firstRelease year is the commit of tag 0.1.0 (2012-04-19); the first GitHub release is 2.0.0 (2017-12-01). The LICENSE file is the Apache 2.0 text with no copyright line; the maintainer comes from the first author in composer.json, and the other two authors (Bob Fanger, Martin Rademacher) are not recorded. The Packagist figure is the total downloads from the package API; its monthly figure is not recorded. The README's related-projects page lists framework integrations (NelmioApiDocBundle, Lumen and Laravel integrations, yii2-swagger) and two web interfaces (Swagger UI, Scalar); integrations are not alternativeTo and nothing on that page names a replacement, so no alternativeTo is recorded. The openapi command line interface is part of the package, and no page states a process model, so runsAs is not recorded. The Packagist abandoned field is empty. The contributors count covers all pages of the repository.
