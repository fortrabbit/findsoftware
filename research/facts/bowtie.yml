notes: >
  Stub: bowtie.io/lander answers with a redirect to a GoDaddy page offering bowtie.io for sale, that page answers 403 to the research user agent, and the docs are an empty script shell, so it is unknown whether the BowTie.io development platform still exists and what the project's own site says about it; a later pass checks bowtie.io again and the docs, and settles the record as active, discontinued or rejected. The repository and the gem are the only readable sources; the README points to the official documentation for installation on Windows, which could not be read. The CSV's git-cms category is not stated by any readable source, so no categories are recorded. The gem's info line calls the service a frontend development service. The repository has no GitHub release, and the gem's last version is from 2016-01-22. The GitHub organization's own description reads "SeedWorthy (org retired)", which is not recorded because it names no project fact. The gem page names no homepage_uri other than https://bowtie.io, which leads to the for-sale redirect.
