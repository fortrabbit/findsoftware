notes: >
  The homepage is the project's own documentation at feincms3.readthedocs.io; the README names it as the official documentation. The PyPI metadata links github.com/matthiask/feincms3 as its homepage, while the candidate row and the GitHub repository are feincms/feincms3; the feincms/feincms3 repository is recorded. The docs state the minimum Django version is 4.2; Django's minimum has no field, so it is not recorded. The docs landing page says the project builds on Django, django-content-editor and django-tree-queries, which are recorded in basedOn. The docs describe the project as a library and not a framework ("library-not-framework approach"). firstRelease is the oldest tag 0.1 (2016-06-25). The LICENSE copyright line reads 2016-now; PyPI names no author. The major 6 and the latest release date come from the PyPI release 6.1.1 (2026-10-20), which matches the highest GitHub tag.
