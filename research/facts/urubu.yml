notes: >
  The homepage, the README and the PyPI summary call Urubu a micro CMS for static websites, but the pages describe no admin interface and the start page says it is a tool to build static websites, so categories records ssg only. The homepage and the about page state that the content is CC-BY-SA while the software is AGPL; both statements are recorded in their own terms and only the software license goes in the license field. The repository has no GitHub releases; the 18 tags run from 0.1 to 1.4.1, and the homepage announces "30-Mar-2026: Urubu 1.4.1 released", which matches the commit date of tag 1.4.1. The GitHub language field reads HTML, while the project's pages say it is built with Python, so language is recorded from the pages. The start page says the folder tree sets the order of content; the homepage lists a navbar, a table of contents sidebar, breadcrumbs and pagers, Python hooks for templating, and deployment by pushing to an upstream repository. The building page says urubu serve starts a local server at localhost:8000. The PyPI JSON gives no download counts, so pypiDownloads comes from pypistats.org. The homepage's Tweet button links to a share URL, not a project account, so no social link is recorded. The homepage was read over https, which answers 200; the CSV's bare host is not linked as http.
