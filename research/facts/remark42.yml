notes: >
  The CSV row dates the latest release v1.18.0 (2026-10-11), which matches the GitHub release. Remark42 has no paid edition on the pages read. The maintainer is recorded as the GitHub account that owns the repository, since the pages name no company. The Go module lives in backend/, so the go.mod is read at that path. The docs say the Docker install is the recommended way to run Remark42; the installation list in the docs includes the binary archive, the systemd service and a source build. The "databases" field holds the storage backends the parameters page offers, which are BoltDB and an RPC store. The buildRequirements, serverNeeds and docker fields are coined kinds for the source build, the memory figure and the image.
