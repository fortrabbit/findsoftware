notes: >
  The puma.io site says Puma was "created by Evan Phoenix in late 2011 as a derivative of Mongrel", which is the project's own first-release year; the GitHub repository was created 2011-09-23 and the oldest RubyGems upload is 0.8.0 (2011-10-25). The changelog starts at 1.0.0 (2012-03-29). The README says the HTTP parser is "inherited from Mongrel" and the site says the project "comes from a long line of ruby webservers derived from Zed Shaw's seminal work on Mongrel"; no Mongrel record exists and no source says "fork of" or "based on", so no forkOf or basedOn is written. The README says Puma "is currently the most popular Ruby webserver" and "is the default server for Ruby on Rails"; the first is a comparison without a figure and the second is a Rails statement, so neither is recorded as a relation or as reportedInstalls. Two release lines are maintained: 8.0.2 is the highest stable version (currentMajor 8) and 7.2.1 was published the same day (2026-05-27, the newest stable release by date); v7.0.0.pre1 is the only prerelease tag on the releases list since 2025. The LICENSE copyright line names Evan Phoenix (2019) with "Some code by Zed Shaw, (c) 2005"; the maintainer follows the LICENSE copyright line. The RubyGems figure is the total downloads of the puma gem, which is the package the install docs name; the CSV's earlier figure (617.0M) is older. The gemspec sets required_ruby_version to ">= 3.0" at the v8.0.2 tag. The puma.io site and README name no social, forum or plugin link, and no paid edition or hosted service. The homepage section "Puma Vs. Other Webservers" charts Puma against Unicorn and Rainbows!; Unicorn has a record, so it is recorded as alternativeTo, and Rainbows! has none.
