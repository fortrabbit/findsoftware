notes: >
  The project has no GitHub release but has tags (2.3.3, 2.3.2, 2.3.1), so the stable version and its date come from PyPI: 2.3.3, uploaded 2025-04-27. The first upload on PyPI is version 0.0.0 (2021-02-01), so firstRelease is 2021. The repository was pushed on 2026-08-23 (a dependency update merge), which is a commit, not a release, and does not change latestReleaseDate. The README says blag "runs on Linux, Mac and Windows and requires Python >= 3.10"; the registry metadata agrees. The Debian package is named by the README and is not a separate record field. The docs and README name no discord, x, bluesky, mastodon or newsletter channel. The PyPI JSON reports no usable download figure in the fields read, so pypiDownloads is absent. The README says the name is taken from the xkcd comic blag, which is not a relationship to another software project.
  The manual describes pages and articles: a document with a date metadata element is an article and uses article.html, the rest are pages and use page.html. Only articles go into the Atom feed and the tag pages. The manual says blag mirrors the content directory in the build directory and converts relative Markdown links to HTML links. The README lists an integrated devserver and the Debian package for Debian and Ubuntu.
