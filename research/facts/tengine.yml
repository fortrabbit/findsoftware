notes: >
  Status and criterion 4: the last stable release is 3.1.0 (GitHub release 2023-10-27); the only releases since are release candidates 3.2.0-rc1 to rc5, the newest on 2026-09-04. Criterion 4 counts a pre-release for listing, so the record stays accepted. No page declares the project ended. The project's changelog dates 3.1.0 as "[06 Nov 2023]" while the GitHub release is dated 2023-10-27; the changelog date is recorded. The README names a 3.2.0 package URL and says every release ships packages, but there is no 3.2.0 release or tag on GitHub (the lookup returned 404), so no stable 3.2.0 date is recorded. The license is BSD-2-Clause on GitHub; the LICENSE file lists Alibaba Group Holding Limited, Nginx, Inc. and Igor Sysoev as copyright holders, and the maintainer is recorded from the Alibaba line. No page found gives Alibaba Group's headquarters country or address, so hqCountry is not recorded. The README says the container images are published on every release, which the install fact does not quote. The Tengine-Ingress controller (github.com/alibaba/tengine-ingress) is a separate repository and is not recorded here. The README states all features of nginx-1.31.5 are inherited, a version figure that is not recorded. Fields coined here: none.
