notes: >
  Repository only: the author's site (reactivematter.github.io) lists Passage as a project but has no page for it, and the README links no project site, so homepage stays unknown. No tagged release (releases and tags are empty), no composer.json, so no PHP minimum and no registry package. The repository listing shows no LICENSE file and GitHub reports no license; the README's License section ("licensed under GPLv3") is the only license statement, recorded as GPL-3.0-only. The README says the build uses Parsedown and the Symphony YAML component; they are not recorded as basedOn because the project states them as libraries it uses, not as a parent. Criterion 5 is open: one GitHub star and one contributor, no company named; the threshold is for the reviewer. Last push 2025-03-09 (api); no archive or end notice found.
