notes: >
  Operating systems: the README title says "for macOS and Linux"; Linux needs extra steps for the root CA, .test resolution and ports 80 and 443, and the README says Linux does not run in the background automatically. The README says puma-dev is "the emotional successor to pow"; no record exists for pow, so no successorOf is written. The apps it serves are Rack and Rails apps run by Puma, and the README tells users to add the puma gem to each app's Gemfile; puma is a gem the apps use, not the parent of this tool, so no basedOn is written, because no puma-dev page says it is built on Puma. The Homebrew formula is in the puma/puma tap; formulae.brew.sh has no page for it, so install counts are not recorded. Several early GitHub releases (v0.2 to v0.18.0, and 0.11) are flagged as pre-releases; the highest stable release is v0.18.3 (2023-02-25); the default branch's last commit has the same date; the major is 0. Criterion 4: the last release is under four years old, so it is accepted now; without a new release by 2027-02-25 the import moves it to stub. The repository's pushed_at (2024-05-13) is later than the last commit; the commit date is used. The README links the project webpage at puma.dev, which is recorded as homepage. The README highlights are easy startup and idle shutdown of Rack and Rails apps, access through the .test subdomain (configurable), and https; apps are added by symlinking their directory into ~/.puma-dev, and a proxy file can point a name at another port or host; the README says the server supports Linux as well as macOS.
