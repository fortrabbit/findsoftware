notes: >
  The GitHub repository is archived and its README says the project has moved to SourceHut, so the archive is no signal under the move rule: repository is the SourceHut repository, status stays accepted, and the GitHub figures (stars, contributors, releases, license) come from the archived GitHub mirror that the project still names. Reviewer decision: the candidate row marks discontinued; the move is a reason to keep it listed, and the import will move it to stub on its release age (2020-09-05). The SourceHut page shows its newest commit as about three years old; no end or unmaintained statement was found on any page. The README on SourceHut is the install source; cabal install needs ghc and cabal. The SourceHut README says the default converter is Pandoc and that the templates are header and footer HTML files with {placeholders}; neither is recorded as a field. Its config has i8n_* label translations, which are not recorded as i18n. The GitHub API lists no language and the SourceHut summary names Haskell. Highest stable GitHub release is v0.4.0.0 (2020-09-05), so the major is 0.
