notes: >
  The install page requires React version 18 or above. That is a React requirement, not a runtime, so no runtime or runtimeMin is recorded. The basedOn react fact rests on the repository description "React notification made easy", the project's own words naming React as the target; the version requirement alone would not state it. The category component comes from the install page's ToastContainer, the only wording read that names a component; the README's notifications wording is not recorded as a category. The latest stable release is v11.2.0 (2026-10-28), and its release candidate v11.2.0-rc.0 is older than it, so no latestPrereleaseDate. The README names the Reactiflux Discord as the author's community, not the project's own forum, so no discord fact. Stars and contributors belong to the repository; npmWeeklyDownloads and the ecosyste.ms counts are for the react-toastify package the install page names. The maintainer is the LICENSE copyright line; the npm author field gives the same name. The install page's gist calls toast with a message from a button handler, which is the basis for the toast call described in the prose.
