notes: >
  Hosted service: no installable part was found, so selfHostOption and repository are absent; the GitHub search for searchanise returns only third-party repositories and no repository under the company's own name. The company is Bolide Network LLC per the terms and privacy policy, which give San Diego, California as the address; the about page says the company was founded in 2013 and that it started with a Magento extension, but no first release year is stated, so firstRelease is absent. The about page's "16K+ shop owners" is the one reportedInstalls entry; the homepage says "16 000+ companies"; the about page also gives 40M searches per day, which has no field. The platform list on the platforms page (Shopify, Shopify Plus, BigCommerce, WooCommerce, Magento, CS-Cart, Wix and a custom option) names where the app is installed, and no field fits it. The API docs say the search API returns results over REST and the signup, update and search endpoints are REST calls; no GraphQL is stated. apiLimits holds the API docs value of 200,000 products; the pricing page's plan limits, such as up to 2,000,000 products on the Enterprise plan, are plan values and stay in notes. The pricing page lists plans by name with prices, which are not recorded; it states a 14-day trial, which is not a free tier. The pricing page has a Usergroup Rules feature for shoppers and no user roles for the merchant account, so userRoles is absent. No sso, i18n or livePreview statement was found on the homepage, pricing, about, API or policy pages. The homepage footer links x.com/searchanise, facebook.com/searchaniseapp, LinkedIn and YouTube; only X and Facebook have fields. The Shopify app store listing and the review sites Capterra and G2 are not sources and their ratings are not recorded. The httpArchiveSites value is the mobile origin count for the Searchanise technology in the HTTP Archive technology list. The Terms of Service are governed by the laws of California, and the privacy policy lists sub-processors without naming a data region, so regions is absent.
