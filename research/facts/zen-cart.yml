notes: >
  GitHub reports license NOASSERTION for the repository, so the license facts come from composer.json at the release tag and from the about page; both state GPL version 2, and composer.json narrows it to GPL-2.0-only. The about page's "Version 2 of the GNU General Public License" is kept as its own entry because it is the project's own statement, and the two entries do not differ in meaning. The project's requirements page labels 2.2.2 as the "final version" of the v2.2.x line and lists v3.0.x as in development. Read literally that marks the 2.2 line as closed, not the project; currentMajor stays 2 because the latest stable release tag is v2.2.2. The reviewer should decide whether that wording needs a status fact. The README at the tag still says "Zen Cart v2.2.1 is the latest major update", so the readme lags the tag. pluginCount and reportedInstalls are the project's homepage claims, and the homepage gives no date for them; reportedInstalls is a coined camelCase field, not in the starter list. The homepage's PA-DSS and PCI DSS statements are compliance claims and are not recorded.