notes: >
  The record follows the statelyai/xstate repository: the GitHub API, the default branch next and the LICENSE line all name it. The release figures come from the monorepo's releases, and the record uses the xstate package, the newest stable release of which is 5.33.4 (2026-11-07). The newest prerelease is xstate 6.0.0-beta.3 (2026-11-15), recorded as latestPrereleaseDate; the README and docs present the v6 beta as the install route, while the npm latest tag is the stable line. The stars and the 361 contributors belong to the whole monorepo, which also ships @xstate/store, @xstate/react, @xstate/vue, @xstate/svelte, @xstate/solid and @xstate/effect; the npm weekly figure and the dependent counts are for the xstate package, the package the install docs name. The npm package xstate is first uploaded on 2017-05-24, earlier than the oldest GitHub release (2017-09-04), so firstRelease takes the npm upload. The LICENSE file names David Khourshid; the docs page says Stately is a small team founded by David Khourshid. The legal entity on Stately's own platform agreement is Stately Software, Inc. (the Stately Platform Agreement); it belongs to Stately Studio, not to the library, and it is not recorded as the maintainer. Stately Studio, a visual editor the README and docs link and describe with premium features, is a separate hosted product next to the open-source library, and its terms are not a fact of this record. The social link on the docs page is the maintainer's personal Twitter account and is not recorded as the project's. The docs page lists a Self-hosting page, which describes the Stately editor and not the XState library, and is not a selfHostOption of this record. The README calls XState useful for frontend and backend application logic, and it names no runtime, so no runtime or runsAs is recorded. The npm registry reports no deprecation for xstate.
