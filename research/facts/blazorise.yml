notes: >
  The repository has no GitHub license detected (GitHub reports NOASSERTION, "Other"), and the GitHub releases stop at 0.9.0 in 2020; the registry major 2 (NuGet Blazorise 2.3.3) is used because it is higher. The install page names Blazorise.Bootstrap5 and Blazorise.Icons.FontAwesome, provider and icon packages; the core package Blazorise is recorded. The license statements disagree: the license page calls the Blazorise Software License Agreement source-available; the pricing page offers a Community License free to eligible individual developers, confirmed through LinkedIn; the repository LICENSE.md only links the agreement PDF (SLA-2023-07), which states that the Community plan is used "under the APACHE License" and that corporations and other commercial entities must buy a commercial license. No HTML page repeats the Apache statement, so it is kept here and not recorded as a license entry. The maintainer is Megabit d.o.o., the registered Croatian company on the about page company details (Hrvojeva 11, Dugopolje); the site footer copyright reads Megabit Ltd. The NuGet author is Megabit. The homepage lists "7.2M Core NuGet downloads", a figure from the homepage; the recorded figure is the NuGet API value. The paid tiers are Professional, Enterprise and Enterprise Plus on the pricing page, with prices omitted. The homepage calls Blazorise a component library that renders the CSS frameworks Bootstrap, Tailwind, Bulma, Ant Design, Material and Fluent 2; those are not recorded as fields. The docs page names "one of the world's most popular Blazor UI framework", a superlative not recorded. The pricing FAQ says companies, non-profit organizations, government entities, agencies and other organizations need a commercial license when Blazorise is used for work, internal systems, client work or commercial products, and that individual developers can use the Community License when they meet its eligibility requirements. The README prerequisites list .NET 8 to .NET 11 as target frameworks.
