notes: >
  Discontinued: the README opens with "Vidstack is in security-only maintenance." and says the teams behind Vidstack, Plyr, Media Chrome and Video.js now focus on Video.js 10; the repository description and the npm latest version carry the maintainers' "deprecated" statements (security fixes only until January 2028), and the project's own homepage shows "Vidstack has a new home: Video.js 10." The status follows Plyr's record, which is discontinued on the same grounds. The homepage stays recorded because it is live. The README calls Vidstack "the successor to Plyr 3.x and Vime 5.x", recorded as successorOf for Plyr, which has a fact file; Vime has none and stays here. The Video.js 10 migration guides for Vidstack are on videojs.org and are recorded on the videojs record as importsFrom. The repository has no GitHub release objects: its 165 tags include v0.0.0 (commit 2022-12-02) and the -next prerelease tags. The npm registry is the stable source: latest 1.15.7 published 2026-10-06, the same version as the next dist-tag, which sets currentMajor and latestReleaseDate. The npm first upload is 0.0.1 (2022-11-16), which sets firstRelease; the repository was created 2021-01-25. The package.json engines field (node 18 or later) is a browser library's Node requirement and is not recorded as runtime. The docs state that the JavaScript option works with any framework and that there are React, Angular, Svelte, Vue and Solid routes; the React route is also the @vidstack/react npm package, which is not a separate record. The site and the README name Mux, Vercel and BrowserStack as sponsors, which is not recorded. The LICENSE copyright line names Rahim Alwer; the repository owner is the vidstack organization.
