notes: >
  The Getting started page in the repository source (packages/svelte-ux/src/routes/+page.svelte, served at the homepage) gives npm install svelte-ux, so criterion 3 holds on the library's own install line. The same page says Svelte UX 1.0.0 requires Tailwind 3 and supports Svelte 3 to 5, and that the upcoming 2.0.0 requires Svelte 5 and Tailwind 4; the Svelte statement is compatibility and is not recorded as basedOn. The create-svelte-ux package README on npm gives a second install route, a scaffolder; its package directory (packages/create-svelte-ux) is absent from the main branch and it was last published in January 2025, so it is a reviewer decision whether to keep that route. The homepage site answers 200 with an empty SvelteKit shell whose text is client-rendered, so the docs quote comes from the page source in the repository. The GitHub release list holds 2.0.0 prereleases (latest 2.0.0-next.26, 2026-08-12); a prerelease is older than the stable 1.0.11 release, so no latestPrereleaseDate is recorded. The npm figure is the svelte-ux package. The root package.json names the author Sean Lynch with an email address; only the name is recorded. The GitHub API language is Svelte. The README says the components are built using Tailwind; the project's Tailwind plugin (@layerstack/tailwind/plugin) is named in the customization page and is not recorded as a fact.
