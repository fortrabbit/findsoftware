notes: >
  GitHub reports the license as NOASSERTION; the license entries come from LICENSE.md on main, which states the Dragonfly Business Source License 1.1 with a change date and an Apache-2.0 change license. The Additional Use Grant excludes an in-memory data store product or service and offering the work as a Service. The docs give Docker images at docker.dragonflydb.io, not Docker Hub, so no dockerPulls figure is recorded. The HTTP console on the main port is a status view with little information per the README, and the README names it as a Prometheus metrics endpoint; not recorded as adminUi. The privacy page names the law of the State of Israel and courts in Tel Aviv as governing law; that is not an HQ statement, so hqCountry is left out. LinkedIn is linked from the homepage and is not a field here. The Dragonfly Cloud tiers Flex and Business on the pricing page are hosting plans, not paid editions. The Self-Managed plan is listed as contact-for-pricing with LDAP and RBAC; the paidEdition value copies only those two features. Fields coined here: none.
