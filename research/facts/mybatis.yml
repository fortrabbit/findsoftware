notes: >
  Release: the GitHub release mybatis-3.6.0 (2026-10-23, not a prerelease) is the newest stable release. The project's own site still shows version 3.5.19 and "Last Published: 02 Jan 2025"; the site is older than the release and is not used for the version.
  firstRelease 2010 comes from the oldest upload of org.mybatis:mybatis on Maven Central (version 3.0.1, uploaded 2010-05-20), which is older than the oldest GitHub release (3.0.1, 2013-11-08). The repository itself was created in 2013.
  Databases: the configuration page names database vendors only as examples of a DB_VENDOR databaseIdProvider mapping (SQL Server, DB2) and says MyBatis works through JDBC. No list of supported databases is stated, so databases is not recorded.
  runtimeMin: the pom compiler setting is a build requirement and the docs mention Java 8 only for a parameter-name feature, so no runtimeMin is recorded.
  Maintainer: the site footer reads "2009–2025 MyBatis.org" and the Apache LICENSE names no copyright holder, so the maintainer is the project's own name for itself, MyBatis.org.
  The Stack Overflow tag and the mailing-lists page are links from the site and the README, not recorded as forum.
  The Bluesky and X links are on the homepage, which says the accounts are run by Alejandro Duarte.
  The installMethod entries are the two routes on the getting-started page: the Maven dependency and the JAR on the classpath.
  The getting-started page says a SqlSessionFactory is built from an XML configuration or from a Java Configuration object, and that the MyBatis-Spring and MyBatis-Guice sub-projects suit dependency injection frameworks.
  The README says MyBatis couples objects with stored procedures or SQL statements through an XML descriptor or annotations, and the homepage says it removes most of the JDBC code and manual setting of parameters.
