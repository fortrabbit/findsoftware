notes: >
  In doubt: whether the software still lives under this name, because www.fiction.com now redirects (301) to pagelines.com, an unrelated AI agent product, and the docs and support paths redirect there too; a Fiction homepage again, or a maintainer statement naming a new home, would settle it. Stub without homepage per the dead-homepage rule, modelled on bowman. The repository dev branch is the default, its README and package.json name version 6.0.41, and the terms and docs folder are read from it. The highest stable GitHub release is 5.5.26 (2022-08-19), but the repository also carries stable tags v6.0.8 to v6.0.41 with no GitHub release, and v6.0.41 is the highest stable tag and matches package.json, but currentMajor follows the highest stable GitHub release, 5; the v6 tag commit is dated 2025-10-16. The docs introduction says "You are reading the documentation for Fiction 10!", which conflicts with both; a reviewer may revisit the major. The repository has no LICENSE file (the path returns 404 on dev and on the root listing), and the GitHub license field is null. The README says GPLv2 with no only or or-later, so the GPL-2.0 SPDX id is recorded without that distinction. The package.json says MIT but names the package fiction-os, which is private, so that statement may not be the project's license. The v1.0.0-alpha.0 release from 2019 is recorded as firstRelease and is older than the stable line, so no latestPrereleaseDate is recorded. The terms say commercial use of the hosted Services requires a separate agreement; this is recorded in prose only, not as a license. The package.json deploy script runs flyctl deploy and fly/ holds Fly app configs, but no page states the runtime model, so runsAs is not recorded. The docker-compose file starts ClickHouse and Redis for local development; it does not state a database for the software, so databases is not recorded.
