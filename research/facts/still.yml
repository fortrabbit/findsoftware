notes: >
  The repository is archived on GitHub (api) and the project's own site links it as its GitHub source, which is the end signal behind status discontinued; the README still reads "This package is still in progress" and no end statement was found. The project's own site answers with the project's pages, so the homepage is kept next to the end signal. The GitHub releases are prereleases (v0.2.1 and v0.3.0), so the stable version and date come from the Hex package still 0.8.0, released 2022-08-20, the release the install docs name; the Hex package's first release is 0.1.0 from 2020-11-26. The Hex download figure is the all-time total. The runtime minimum is the Elixir version the getting-started page names; the page also names an Erlang version. The maintainer is recorded as the LICENSE states it, Subvisual; the README says the project is maintained by Subvisual. The site lists contributors by GitHub handle and does not name a fork or successor.
