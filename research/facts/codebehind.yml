notes: >
  The CSV homepage elanat.net is the author's site; its header reads Elanat Framework and it carries the CodeBehind release posts, so it is recorded as the project's own site. The repository now lives at elanatframework/CodeBehind; the README image and documentation links still point at elanatframework/Code_behind, and the docs are cited under the new name. The GitHub API and the LICENSE file both give MIT. The NuGet page says the package targets .NET 10.0 and is compatible with that framework or higher, which implies a minimum but no page states one, so runtimeMin stays out. The README's Visual Studio walkthrough names .NET 7.0 as an example only. The earliest NuGet upload (2023-06-30) predates the earliest GitHub tag (CodeBehind_1.9.2, 2023-12-10), so firstRelease comes from NuGet. No page states whether the live site runs as an always-on process or in one rendering mode, so runsAs and renderingModes stay unknown. The NuGet figure is the total downloads of the CodeBehind package.
  The README says the view files are aspx pages that take Razor or standard syntax and can follow MVC, Model-View, Controller-View or view-only patterns; its Program.cs setup is AddCodeBehind and UseCodeBehind; it calls the framework an alternative to ASP.NET Core and says it can be used with Razor Pages and ASP.NET Core MVC. The how-to guide, cited under docs, walks through a Visual Studio setup, and its first run without a wwwroot folder creates a default layout with a header and footer.
