notes: >
  Embla is a browser library; the docs also show a server-rendering setup that uses the embla-carousel-ssr plugin with a client-side initialisation, and framework bindings for React, Vue, Svelte and Solid. The docs header says version 9 is the latest, but 9.0.0-rc04 is a release candidate and npm's latest tag is 8.6.0; currentMajor records 8 and the release candidate is not recorded as a release. The GitHub latest release v8.6.0 is dated 2025-04-04. maintainer is the GitHub user davidjerleke, who is also the sponsor target; the repository owner is a user, not an organization. The plugin list on the plugins page was not counted, so pluginCount is left out.
