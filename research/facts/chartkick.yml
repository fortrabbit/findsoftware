notes: >
  The gem's quick start sets Chartkick up with Chart.js, which is recorded here as a setup step, not as basedOn: the README says "This sets up Chartkick with Chart.js" and names Google Charts and Highcharts as other options. The JavaScript side ships in the same repository and runs in the browser, but no page states it as browser-only, so runsAs is left out. The npm package chartkick (5.0.1) is published from the ankane/chartkick.js repository and is named in the Bun and yarn install step; its download figure is not recorded here because the gem is the package the repository is about. The homepage navigation lists Python, React, Vue and Elixir versions of Chartkick; those are sibling projects, not recorded. The repository has no GitHub releases; the RubyGems version history is the release record. The first gem version is 0.0.1 from 2013-05-07. The runtimeMin is the required_ruby_version of the latest gem release as RubyGems reports it. HTTP Archive does not list Chartkick. The README has a Sinatra and Padrino section: chartkick.js is downloaded and included by hand there, and the Rails setups (Importmap, Bun/esbuild/rollup.js/Webpack, Sprockets) are the quick start routes.
