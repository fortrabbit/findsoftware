notes: >
  "Vuelidate is currently in LTS mode, so you may want to look at similar form libraries that are currently actively maintained." This sentence is on the docs home page and in the README. It is a maintenance statement by the maintainers, so the status is stub, not discontinued; it is settled when the maintainers change the statement or state an end. The README section "Possible alternatives" names Regle, Vee-Validate and VueForm; only vee-validate has a fact file, so it is the alternativeTo value and the other two stay here. The docs say Vue 2 use needs the @vue/composition-api plugin below Vue 2.7, a setup note, not a field. The install page's CDN route names jsDelivr files for vue, vue-demi, @vuelidate/core and @vuelidate/validators; the route is recorded as script tag from the sentence before the tags. The unscoped npm package named vuelidate is the 0.x line for Vue 2, last at 0.7.7 on 2021-12-08, and its 0.8.1 version carries a deprecation flag; the install docs name @vuelidate/core, so the npm figures and the registry id are for @vuelidate/core, and firstRelease is the earliest upload of the vuelidate name on npm. The GitHub release v2.0.1 (2023-03-26) is older than the registry's 2.0.3 (2023-06-29), so the registry version and date are recorded. The default branch of the repository is next; the LICENSE copyright line names Vuelidate, and the README lists three current contributors and a monorepo of packages, so stars and contributors belong to the repository. The README's sponsor logos are not facts.
