notes: >
  Accepted. The homepage says "Vitess is a Cloud Native Computing Foundation graduated project" and the community page says the project "joined the Cloud Native Computing Foundation in 2018" and is "not controlled by any single company"; the CNCF is the foundation, not a company, so no parent is recorded and the maintainer is the project name the community page gives. The homepage describes Vitess as "built around MySQL" only in the README; it manages MySQL instances rather than extending a MySQL codebase, so basedOn is absent and a reviewer decides. firstRelease is the year the project's own pages give for its creation ("born at YouTube in 2010"); the README says Vitess "was a core component of YouTube's database infrastructure from 2011", and the GitHub repository dates from 2013-06-27, so a reviewer may prefer another year. The GitHub release v24.0.5 (2026-10-13) is the highest stable release; v25 is the development line in the docs and has no release. The docs name Vitess Operator for Kubernetes as a PlanetScale-provided project under Apache 2.0; the operator is recorded as an installMethod, and no hosted service is stated on the pages read, so hostedOffering is absent. The local install guide names "Ubuntu is the only fully supported OS". Coined fields: none; the Slack channel (vitess.io/slack) and the monthly CNCF meetings are not fields. The docs site has an English and a Chinese version, which is not recorded as i18n. VTAdmin is the browser interface, with optional role-based access control, so adminUi and userRoles are recorded from its docs. The vttestserver Docker image is documented for testing only, so no Docker Hub pull count is recorded. The homepage links Slack and Stack Overflow, which have no field.
