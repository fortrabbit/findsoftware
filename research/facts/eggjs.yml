notes: >
  The English docs are the default at eggjs.org, and the Chinese docs sit under /zh-CN/; quotes come from the English pages. The install step is npm init egg, which runs the create-egg scaffolder; the npm figures come from the core egg package, which create-egg does not replace (create-egg shows 112 downloads in the same week and is not used). The npm registry lists a version 0.0.0 dated 2013-08-08 for egg, so firstRelease is left unset rather than taken from that entry. The license copyright line names Alibaba Group Holding Limited while the site footer says "Copyright © 2017-present Egg.js"; the LICENSE line is recorded as the maintainer. The repository README gives a different quickstart with the utoo tool (ut create egg@beta); the record follows the install page on the site. Pages read: the home page, the quick start, the Egg and Koa page, the structure page, the deployment page and the README. The deployment page starts the application with egg-scripts start, which runs a master process and worker processes through egg-cluster, and the page names Node.js 22.18.0 or later as the runtime to install. The basedOn value Koa matches the koa record in candidates-js-framework.csv. The Egg and Koa page says Egg 1.x was based on Koa 1.x, and that Egg 2.x was released based on Koa 2.x, with the framework and built-in plugins written as async functions.
