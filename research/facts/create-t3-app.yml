notes: >
  The record describes the scaffolder. The deployment guide has pages for Vercel, Netlify and Docker (deployTargets is not a dictionary field, so it is not recorded). The apps it generates are Next.js apps, and its CLI offers optional tRPC, Prisma, Drizzle, NextAuth.js and Tailwind CSS; those are options, not dependencies, so none is recorded as basedOn. The maintainer is the copyright holder in the LICENSE file; the GitHub organization is "T3 Open Source" (t3-oss) and the project pages say the T3 Stack is "made by Theo", which is not recorded as the maintainer. The npm package create-t3-app is the core package named by the install docs. runsAs records only the scaffolder; renderingModes is unknown because the CLI pages do not state how the generated app is run on a host. The Next.js basis is stated by the CLI README and by the homepage, which says the project is "proud to build on top of" Next.js in its Next.js entry.
