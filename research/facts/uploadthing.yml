notes: >
  hqCountry is not recorded: the only address in the terms (San Francisco, CA 94114) is given for the copyright agent, not as a notice address.
  Hosted-service record: the open-source part is the pingdotgg/uploadthing repository (MIT, 5.4k stars, the uploadthing npm package at 129.5k weekly downloads in the candidates row), the SDK and framework adapters for the hosted service; its license, stars, npm figures, language and versions are not recorded here, and the repository field is left empty for that reason. The docs have no self-hosting page (the docs URL for self-hosting answers 404), and the repository README names no self-host install. The copyright footer reads Ping Labs; the terms and privacy policy name T3 Tools, Inc. as the operator, so the footer name is noted and not recorded as maintainer. hqCountry rests on the postal address the terms give for T3 Tools, Inc. as its designated copyright agent (San Francisco, CA); the terms' choice of law and venue are not used. Regions and private files are stated as paid-plan features; the regions page (docs.uploadthing.com/concepts/regions-acl) lists EU Central (Frankfurt, Zurich), EU West (Dublin), US East (Ohio), US West (San Francisco, Seattle) and Asia (Mumbai, Seoul, Sydney), and the list is kept here and not in a field. The pricing page lists App plans with audit log retention and no team or role features, and the homepage names no SSO. The pricing page lists a 2GB App plan and paid tiers; prices are not recorded, and the audit log retention stated per plan is not a field. The homepage's Theo quote and the customer and framework pages are not used for fields. The docs' Backend Adapters and Frontend Libraries pages describe SDK packages and were not used for fields.
