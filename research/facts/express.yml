notes: >
  The endoflife.date entry lists Express 5 as the current cycle and Express 4 as not yet end-of-life, so its dates come from that API and are not typed here. The repository was created in 2009 per the API, but no first-release statement was found on the pages read, so firstRelease is not recorded. The OpenJS Foundation copyright line is the only maintainer statement on the homepage. The Express 5 upgrade guide is the project's own migration page and is not recorded as a fact.
