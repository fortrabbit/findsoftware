notes: >
  Boundary settled for this wave: a desktop database client is a developer tool that runs on the developer's machine, so the row is accepted with runsAs local. The website and README list more engines than the four in the databases fact (MariaDB, Oracle, MongoDB, Redshift, Snowflake and others); the README table marks which are in the Community Edition, and the four named in the quote are the ones the homepage names in its first sentence. The README states the license split: the code in the repository is GPLv3, paid features are in the same repository under a commercial source-available license, and the Ultimate Edition is under a commercial end user agreement (EULA) linked from the README. The LICENSE.md file gives GPL version 3 or any later version, so the SPDX id is GPL-3.0-or-later; the README wording "GPLv3" is the same license and is not a second entry. The pricing page sells paid licenses (Indie, Pro and above) and says a Community Edition is free to use. The homepage calls the Cloud Workspaces product a sync service for teams; the hostedOffering value is its name. The highest stable release is v6.1.6 (2026-10-07); the newest beta is v6.2.0-beta.3 (2026-10-23), recorded as latestPrereleaseDate. The first release is v0.1.3 (2020-03-27), the oldest entry on the GitHub releases list; the older tags named sqltools-v1.x are not counted, because only GitHub releases are dated here. The runtime is not stated on the pages read (the README gives Node.js 20 only as a build step), so runtime is left out. The homepage's Community Slack link has no field and stays here. The legal page carries the copyright line "Beekeeper Studio, Inc" and the commercial EULA names Texas as governing law; neither gives a headquarters country, so hqCountry is left out.
