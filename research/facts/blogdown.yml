notes: 'This is the JavaScript (Polymer 1.x) markdown blogging platform by Jam Risser from the candidates row, not the R package of the same name and not the npm package "blogdown" (mantoni/blogdown, a different project), so no npm figures are recorded. The domain blogdown.info does not resolve (curl: Could not resolve host) on 2026-10-22, so no quote is given, no homepage is recorded and status is stub under AGENTS.md. The README itself says the demo URL blogdown.info is dead. The README is marked "Beta" and carries a section "2026 preservation notes" describing a revival in August 2026 as a working historical artifact; the last push is 2026-08-13. The GitHub release list holds only v0.1.0 (2017-02-21), while the README and CHANGELOG name 0.2.0 and the README download links point to the thingdown/blogdown repository; the release data recorded is the releases API of clayrisser/blogdown. The repository is not archived and no end statement was found. The README says the app needs no compilation and no database, but names no hosting model in a quotable sentence, so runsAs and renderingModes are unknown.'
