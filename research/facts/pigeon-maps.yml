notes: >
  The GitHub releases list stops at v0.7.0 (2016-12-26), but the npm registry carries 0.22.1 dated 2024-12-26, and the project's npm tag is the newer stable release, so latestReleaseDate follows npm, as the rule for a registry stable tag without a GitHub release object says. The major is 0 on both sources, so currentMajor is 0. The npm package is the one the install page names; a beta dist-tag (0.7.0-beta4) is older than the stable release and is not recorded. The README and the install page describe the library as React-centric and say it can be used "100% static server rendered", which is a server rendering capability and not a hosting need, so no renderingModes or runsAs is recorded. The React peer dependency is a dependency, not a basedOn statement; basedOn react rests on the homepage line "ReactJS maps without external dependencies". The install page shows yarn and npm commands for one route. The homepage footer copyright links the maintainer's personal X account, recorded as the x link. The homepage's tile-provider and map layer list is a feature, not a field. The ecosyste.ms figures are for the npm package pigeon-maps. The first tag v0.1.0 and the repository are dated 2016-12-16, the year of firstRelease. The README and introduction contrast the library's size with Google Maps JavaScript and Leaflet, recorded as alternativeTo leaflet. The Choosing a Tile Provider page says Pigeon Maps defaults to loading map tiles from OpenStreetMap.org and that a function returning a tile URL selects another provider; the tiles therefore come from a tile server outside the library.
