notes: >
  The project has two lines: v2.x is the Go binary in this repository, and the 1.x branch is the PHP version, which the docs and README point to. The record follows v2 (highest stable release v2.4.1, 2026-08-17). The first GitHub release is 1.0-rc.1 (2022-12-28), a prerelease that starts the Go line's release history in this repository; the repository itself was created 2022-05-10. Prerelease tags on the repository are all from 2025 or earlier, so latestPrereleaseDate is not recorded. The docs call the server a "single ~30 MB" binary and the install routes are the binary download, Docker from ghcr.io and a source build; no Docker Hub image is named by the install docs, so no dockerPulls is recorded (the README badge points to Docker Hub butschster/buggregator, which is not the image the install docs name). Two Discord invite links appear: the homepage's discord.gg/uxr5gw2p, recorded, and the README badge's discord.gg/vDsCD3EKUB, which is not recorded. The x field comes from the README badge only, not the homepage. The homepage lists PostgreSQL/MySQL as an external database, but the database docs page says SQLite is the database, so only sqlite is recorded. The homepage states "3M+ Downloads", a download count without a date or a registry; it is not recorded. The alternativeTo statement names Sentry (local), Mailhog, Mailtrap, Ray, Blackfire, XHProf, RequestBin, Inspector.dev, Charles, Fiddler and mitmproxy; only sentry has a record here, so the other names stay in these notes. The homepage describes the project as a debugging server for PHP; the record describes what it receives from SDKs and shows, since the SDK list also covers JavaScript, Python and Ruby on the homepage. Buggregator Trap is a separate PHP package from the same organization, installed with composer; it is not recorded here. The docs say "Free forever. No paid plans. No feature gates." and are recorded here only in notes, since no free-tier field applies to a self-hosted tool. The MCP server is a built-in module of the binary and the docs have an MCP page; no field exists for it. The copyright line on the homepage reads "© 2026 Buggregator", and no legal entity or country was found, so maintainer is the organization name and hqCountry is absent. Go version for building from source is 1.22 per the README; the binary itself has no runtimeMin stated on any page read. The runtime is recorded as binary per the compiled-server rule.
