notes: >
  Bridgetown started as a Jekyll fork in early 2020. Whitefusion is described as Portland-based without a country, so hqCountry stays absent. Node is needed for frontend asset bundling (esbuild, PostCSS), Ruby for the generator itself. The deploy page has static targets plus Docker examples for dynamic sites that run Falcon or Puma; serverNeeds records both cases. databases rests on the homepage saying the server API can support databases like PostgreSQL. pluginCount is a hand count of the directory (9 main plus 22 additional), which states no total. The homepage states a sponsorship goal of $300/month for Q4 2026. Coined fields: rubygemsName, rubygemsDownloads (all-time RubyGems total). No Wikidata item was found.
