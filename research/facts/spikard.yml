notes: >
  Experimental and pre-1.0 per the README, the homepage and the repository description, so the homepage quote carries that; the major is 0 (v0.17.2, 2026-10-09, the highest stable GitHub release). The repository is a monorepo with many bindings, so the registry figure is the Rust core crate spikard, which the installation table names first; the npm, PyPI and other binding packages are not recorded. The crate had 3617 downloads in total at the check (the CSV's 886 was a 90-day figure from an earlier pull). Axum is recorded as basedOn from the crate description on crates.io, the project's own registry metadata; the README names tower-http middleware, not Axum. The maintainer is the copyright holder named in the LICENSE. The README names no template engine and no REST API, so neither is recorded. The README lists the bindings: Python, TypeScript, Ruby, PHP, Elixir, Go, Java, C#, Kotlin, Dart, Swift, Zig, WASM and C FFI.
