notes: >
  Apache Solr is a separate server the extension talks to, and it is not a record here: the install page says "First you need to install Solr itself", and the docs name a hosted option and a Docker image for it. No page states the extension's own runtime model, so runsAs is left out. The license is stated as GPL-3.0-or-later in composer.json at the 14.0.2 tag; the LICENSE file is the GPL version 3 text and GitHub reports GPL-3.0, the same license in two wordings. Homepage and docs name a funding partner programme with "additional features" and a comparison chart; it is sponsorship, not a published edition, so no paidEdition fact (reviewer decision). The TER extension page gives "2,772,108" downloads; TER is not one of the registries AGENTS.md names, so no adoption figure from it (reviewer decision). firstRelease is the TER first upload, 2009, older than the GitHub repository (2015). The composer.json at 14.0.2 requires typo3/cms-core ^v14.3.0, the TYPO3 version the release runs on. The legal notice of hosted-solr.com names dkd Internet Service GmbH, the same company as the extension's legal notice. Fields coined: none.
