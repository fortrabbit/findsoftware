notes: >
  The site answers 200 with a JavaScript shell (title and root element, no page text), so homepage is the repository's homepage field and the site is listed as unreadable. The README's install route is npm; the getting-started page in the repository adds an unpkg script route (cdn). The package manifest at tag tdesign-vue-next@1.20.10 (packages/tdesign-vue-next/package.json) has an engines field of node >= 18; for a UI library that goes to notes and not to runtime or runtimeMin. The README names Vue 3; the package's peer dependency is vue >=3.1.0. The oldest GitHub release is 0.6.0 (2021-12-24); the npm first upload is 0.0.1-alpha.0 (2021-10-26); both give 2021. The HTTP Archive technology TDesign (mobile origins 140) covers both the React and Vue packages and is not recorded for either. The sibling tdesign-react is its own record. The README usage example imports Button from the package and the stylesheet tdesign-vue-next/es/style/index.css. The Tencent/tdesign page docs/develop-install.md lists the build outputs dist (UMD), esm, es and lib (CommonJS).
