notes: >
  Hosted service: the vendor cloud at marblecms.com is the product, and the docs quickstart starts with sign-up and a workspace. The source is public but the docs give no self-install guide: the repository (github.com/usemarble/marble, AGPL-3.0, 384 stars on 2026-11-04, no GitHub release or tag, TypeScript) has a contributing guide that runs the stack locally for development, with PostgreSQL, Redis, Google and GitHub OAuth apps and a Cloudflare R2 bucket, and the docs index has no self-hosting or production deployment page. Under the wave 45 rule a contributor setup is no self-install guide, so the status is hosted-service and no installMethod, license or repository is recorded. The SDK and the Next.js, Astro and TanStack example repositories are separate repositories and are not recorded. The terms and privacy pages name no legal entity and give only a support address, and the terms' governing law (Nigeria) is not a headquarters statement, so the maintainer is the product name and hqCountry is unknown. The compare page covers Ghost, Sanity, Payload, Strapi, WordPress and Contentful. Plans (Free, Hobby, Pro) carry request, author, media and webhook limits that change often and are not recorded. Realtime webhooks, the MCP server, Markdown and MDX import, JSON export and Content Intelligence (readability scoring) appear on the homepage and docs and are not recorded as fields. The sign-in providers (email, Google, GitHub) are the dashboard login and are not recorded as sso.
