notes: 'Accepted: the repository has tags up to v5.0.2 and no GitHub Releases, so currentMajor and latestReleaseDate come from the tag and from the npm release of 5.0.2, which carry the same date. The project name is shared with the Racket Pollen record (pollen), which is a different project. The repository moved: the README badges, the npm repository field and the homepage GitHub link name heybokeh/pollen, which now resolves to ostastudio/pollen, the repository the candidate row names. The maintainer is Hyperfocal on the homepage; the README says "Made and maintained with love by the fine people at Bokeh", the LICENSE.md copyright line reads "2021 Madeleine Ostoja", and the npm author is Madeleine Ostoja, so the current site names the maintainer, and the README, LICENSE and npm statements are recorded here only. No page read gives Hyperfocal a legal form. The first tag is v0.1.0, whose commit is dated 2019-02-10; the first npm release is 0.4.0 on 2020-05-11, and the GitHub tags are older, so firstRelease follows the tag. The npm weekly figure is the sum of the daily counts for the period in the value. The license is MIT in the npm and GitHub metadata. The getting-started page says Pollen is just CSS variables that work without any preprocessor or environment requirements, and that Internet Explorer 11 and below needs a shim; it says the pollen command line build tool generates a custom stylesheet from a config file, which is why runsAs is local. No Node requirement is stated, so no runtime is recorded.'
