notes: >
  Major 5 is the GA line on the project's download page (5.0.9, released 2026-08-07, maintained per endoflife.date); 6.0-alpha1 and 6.0-alpha2 are tags with commit dates before the 5.0 release (2026-07-28 for alpha2), so no latestPrereleaseDate is recorded. The GitHub repository has no releases; the oldest tag is cassandra-0.3.0-rc1 (commit 2010-03-13), so firstRelease is 2010 and the cassandra-0.3.0 tags are pre-1.0 release candidates. The docs at doc/latest are headed "prerelease version" in the page banner and the 5.0 install page carries the same banner; the Java and Docker lines are read from the 5.0 install page. The Docker Hub figure is library/cassandra, the official image; the CSV's 273.3M is superseded. Social: LinkedIn (linkedin.com/company/apache-cassandra) and YouTube (youtube.com/c/PlanetCassandra) appear on the homepage with no starter field; not recorded. The Java 17 support matrix on the reference page names Java 11 and 17 for running 5.0. The ASF maintainer entry is the Apache Software Foundation, the project's legal owner, named on the foundation page. The download page lists the 4.1 and 4.0 lines with their own latest dates; these are in endoflife.date and not recorded.
