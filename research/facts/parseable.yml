notes: >
  Rust server in parseablehq/parseable that ingests over HTTP (the README quickstart posts JSON to /api/v1/ingest) and OpenTelemetry, with an SQL query layer and an object-store data lake. The pricing page lists an OSS plan under AGPLv3 ("AGPLv3 licensed") and a cloud plan with a 14-day free trial; the free trial and the per-GB rate are not recorded (no prices, and freeTier is a coined field held here). The pricing page lists "OIDC SSO" under the OSS plan and the Enterprise plan adds "Custom partitioning, multi-tenant cluster, audit logging", so multisite stays unknown for the open source edition. The Terms of Use name Parseable, Inc., a Delaware corporation at the San Francisco address, which gives maintainer and hqCountry; the footer also lists a Bengaluru office. userRoles is left out: the pricing comparison lists role-based access control with the note "Groups not supported" and the download page ties RBAC to the Enterprise Edition, so the open source scope is unclear. The footer also links LinkedIn (linkedin.com/company/parseable), YouTube, a community Slack (logg.ing/community), a status page, and a trust center (trust.parseable.com); these are notes, not fields. The docs call the standalone and distributed modes the two variants; the distributed variant needs an object store. The release line v3 starts with v3.0.0 (2026-08-10). runtimeMin is left out because the software ships as a binary and the Rust toolchain version is a build requirement. The README quickstart installs with a shell script (and a PowerShell script on Windows) that has no quotable sentence; the install guide also covers a standalone Docker run from quay.io, so the Docker Hub pull count is not recorded. The pricing page marks PromQL queries and a high availability cluster for the Cloud and Enterprise plans and states "Only 1 query node supported" for the open source plan.
