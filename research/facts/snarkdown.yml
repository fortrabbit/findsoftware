notes: >
  Status: accepted from the candidate row; no end signal. The repository is not archived, and the README and LICENSE were read from the default branch main. Four-year rule: the latest stable release 2.0.0 is dated 2020-08-31 and the repository was last pushed 2022-11-29, so the import moves this record to stub unless a reviewer decides otherwise. No homepage: the candidate row names a JSFiddle demo at http, which is not the project's own site, and the README names no site. The README states no npm command; the only install route stated is the unpkg dist link, recorded as CDN. An npm route is not recorded because the README names none, so the npm figure counts the package the registry serves. No runtime or runsAs: the README names neither a browser nor Node.js as the place it runs. Stated but not recorded as fields: tables are not supported; the README says Snarkdown doesn't sanitize HTML; snarkdown-loader for Webpack is a third-party add-on; the Snarky demo is built with Preact. Contributors counted with per_page=1 across all pages.
