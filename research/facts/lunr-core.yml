notes: >
  Stub: criterion 3 cannot be judged from the sources. The README's Installation section sits inside an HTML comment, so the rendered page shows no install step; its Documentation item is a to-do; no docs site exists. This is settled by a rendered install section, a published docs page or a NuGet readme with install steps. The CSV row names the NuGet package Lunr-Core, but the NuGet id is LunrCore; the Lunr-Core query returns no package, and LunrCore holds the 409010 downloads recorded here. The LunrCoreLmdb and Carbon.Lunr packages are separate packages and are not counted. The README says the library is 100% compatible with lunr.js, so an index built with it can be read by lunr.js; this is recorded as a README statement and not as a field. The maintainer is Bertrand Le Roy as the LICENSE copyright line and the csproj Authors line name him; the csproj Company line names Decent Consulting, which is noted here and not recorded as the maintainer. The releases list holds 2.3.8 (2020-07-26) as the oldest release and 2.3.10 (2021-12-03) as the newest, which the NuGet registry matches. The csproj targets netstandard2.0 next to net6.0, net8.0 and net10.0; no single minimum runtime is stated, so runtimeMin is absent. The repository has no homepage in its metadata, so no homepage is recorded.
