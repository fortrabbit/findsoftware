notes: >
  The homepage's X link is a share intent, not an account, so no x fact. The homepage line "601K React downloads a month on React alone" is a monthly download figure from an unnamed source, not an install count, so reportedInstalls is absent. The FAQ names further packages (React Native, Solid, Flutter) and says there is no premium tier, so no paidEdition. The npm package iconoir is the SVG package the introduction names; the framework packages (iconoir-react, @iconoir/vue) are sibling packages and carry no figures here. firstRelease 2021 matches both the oldest GitHub release (v4.2, 2021-05-11) and the first npm upload (1.0.0, 2021-07-05). The copyright line reads "Iconoir contributors", so the maintainer is taken from the FAQ's named person. The icon set kind is in scope per the CSV note on the boundary row.
