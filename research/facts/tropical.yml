notes: >
  Vite is the build tool here, not a parent, so basedOn leaves it out. The project is a GitHub template repository ("Use this template"), and its package.json is private, so no npm package exists; the docs describe the template, not an installable package. The README links a Netlify deploy button for the repository, a deploy path the docs do not describe. Tropical's own package.json names the template package "tropical" at version 11.4.2 and requires Node 16 or later; those values come from the v11.4.2 tag because the main branch was last pushed later. The homepage says "There's no Tropical package to update" and that releases "provide guides for updating dependencies and conventions", which is why no package-based install is recorded. The latest GitHub release is v11.4.2 (2022-09-06); no prerelease exists. The oldest GitHub release is v2.0.1 (2020-06-30). The homepage names "Vite" and "React" as the base; no parent project is recorded beyond those two names. The docs say pages are server-rendered by default and that the tropical-islands package hydrates components wrapped in Island through hydrateIslands in src/entry-client.jsx; a site can use plain JavaScript or a library such as Stimulus instead. The homepage's JSON Feed feature and the Ladle stories are not recorded as fields. The docs and README were read in full for installation, build and deployment; the comparisons page redirects and was not read.
