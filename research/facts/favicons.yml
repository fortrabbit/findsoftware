notes: >
  No project website: the npm and GitHub homepage fields both point at the repository, so homepage is not recorded and the repository is the source. The npm package named favicons is this project (the same version line, 7.3.1, and the same homepage field). The package.json author names Hayden Bleasel, which is the maintainer under the wave 33 rule; the LICENSE copyright line reads "Copyright (c) 2016-present time", which names a different holder and is not recorded as the maintainer. The readme says the module was "Originally built for Google's Web Starter Kit and Catalyst"; those are origins, not a parent software, so no basedOn is recorded. The readme says it is tested on Node 14 and above, which is older than the engines field of the current release (>=20.0.0); runtimeMin uses the registry manifest, not the readme. The GitHub organization itgalaxy names the repository owner; the repository holds a single package. The CSV's npm figure (320.1k/week) is not the range sum used here, which is 637841 for 2026-09-28 to 2026-10-04. Category image-processing comes from the readme's "generating favicons" wording and replaces the CSV's asset-optimizer; this is a reviewer call. The npm first upload is 1.2.0 on 2014-07-12, older than the first GitHub release (2015-11-22), so firstRelease is 2014.
