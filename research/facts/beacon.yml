notes: "Hex lists versions 1.0.0 (2017) and 1.1.0 (2017) for the package \"beacon\"; Hex marks both as retired with the message \"This version is from a previous project unrelated to Beacon CMS\", so they are not this project. currentMajor therefore follows the GitHub releases (0.5.1, 2025-04-01), and the Hex download total is not recorded because it counts the old project's versions too. The README says the project is pre-1.0: \"You can expect incomplete features and breaking changes before a stable v1.0 is released.\" The main branch carries a 0.6.0-dev version with an unreleased changelog section. The homepage names a #beacon-cms channel on the Elixir Slack and links DockYard's newsletter; neither is recorded as a project field. The admin UI is the separate beacon_live_admin package named in the README. The installation guide says only PostgreSQL is supported. The Fly.io guide is the one deployment guide in the docs."
