notes: >
  Repository-only project: the vendor site typesense.org is Typesense, Inc.'s, not this adapter's own site, so no homepage is recorded. Two license statements disagree: the LICENSE file on master and the GitHub license field say MIT (copyright "Copyright (c) 2020 Typesense, Inc."), while the npm package.json of the latest release 3.0.2 says Apache-2.0; both are recorded and the reviewer decides which describes the latest release. The npm figure counts npm installs only; installs by script tag from jsDelivr (README) are not counted. The npm package engines field names node >=22 for the latest release; the package is a browser library, so no runtime or runtimeMin is recorded. The README states no runtime for the browser environment in those words, so no runsAs is recorded. v3.0.3-2 (2026-07-08) is a GitHub prerelease tagged "next" on npm; the release notes name package and version commits and no canary build. Oldest GitHub release: v0.0.2 (2020-05-23). Adapter for InstantSearch.js and Typesense: basedOn names both, from the README sentence that describes the adapter. The README says the Typesense site hosts a guide ("search-ui-components"), which is a Typesense page and is not a source here.
