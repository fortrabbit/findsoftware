notes: >
  The repository is Hopding/pdf-lib, the package the install docs name. The LICENSE copyright line names Andrew Dillon; docs/MAINTAINERSHIP.md calls Hopding the principal maintainer and states the work is unpaid, which is not a field. The latest release is v1.17.1 from 2021-11-06, and the npm latest tag is the same version; the repository was last pushed in 2024 and the README states no end of the project. The import's four-year rule will move this record to stub, which the record needs no change for. The CSV's npm figure of 11.2M per week was stale; the value here is the API sum for 2026-11-01 to 2026-11-07. The README's Prior Art section names pdfkit, pdf.js and pdfmake as references for pdf-lib, which is not an alternativeTo statement. The README names the environments the library is tested in, so runtime lists node and deno, with the browser and React Native left out (browser is a runsAs value, React Native is not a runtime value). README features are creating and modifying documents, adding, inserting and removing pages, copying pages between PDFs, drawing text, images, PDF pages and vector graphics, forms, fonts, images, metadata and viewer preferences; custom fonts need the @pdf-lib/fontkit module, registered with registerFontkit. README limitations: text outside form fields cannot be extracted or edited, HTML and CSS cannot be added as content, and encrypted documents are not supported (loading one throws unless ignoreEncryption is set, which does not decrypt it). The docs/MAINTAINERSHIP.md file says the principal maintainer works on the project without pay and can no longer read or answer all communications.
