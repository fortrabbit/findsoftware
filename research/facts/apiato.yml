notes: >
  The project skeleton apiato/apiato is installed with composer create-project and requires apiato/core, so the registry figures come from apiato/core. The latest apiato/core version is 13.2.1, dated 2025-10-25 on Packagist, while the GitHub release v13.2.0 of apiato/apiato is dated 2025-11-17, so the dates differ by repository. The composer.json of the default branch 13.x lists Mohammad Alavi with the Maintainer role; the homepage footer and the LICENSE name Mahmoud Zalt, so maintainer is Mahmoud Zalt. The MySQL and SQLite statements come from the installation page, which describes the Laravel default configuration. The pages do not describe a process model, so runsAs stays unknown. The composer.json also requires laravel/passport for OAuth 2.0 authentication.
