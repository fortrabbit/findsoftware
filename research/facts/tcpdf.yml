notes: >
  The end signal is the maintainer's own README and homepage: the README says TCPDF is deprecated and in maintenance-only mode, and the homepage says the legacy codebase is now deprecated, with development moved to tc-lib-pdf (https://github.com/tecnickcom/tc-lib-pdf, Packagist tecnickcom/tc-lib-pdf). Releases continue (7.0.24 on 2026-11-15) and the README says the library is now a compatibility facade over tc-lib-pdf since version 7, so the status rests on the deprecation statement, not on release age. tc-lib-pdf has no record yet, so it stays in notes as successorOf. The repository description on GitHub and the Packagist description both say deprecated; GitHub detects no license (NOASSERTION). LICENSE.TXT is the GNU LGPL v3 text with copyright 2002-2026 Nicola Asuni - Tecnick.com LTD, the README says GNU LGPL v3, and composer.json says LGPL-3.0-or-later: one license entry. The author in README and composer.json is Nicola Asuni; the legal notice names Tecnick.com LTD as the operator and says the site is operated from the United Kingdom, which is the basis of hqCountry (a reviewer should confirm the operator is the company headquarters). The installMethod rests on the Packagist registry entry (no install sentence in the README names the package). The comparison page on tcpdf.org compares tc-lib-pdf with FPDF, mPDF and Dompdf and leaves legacy TCPDF out, so it gives no alternativeTo. Packagist 6.0.013 and GitHub tag 6.0.013 are both dated 2013-05-10, the oldest version in the registry. The contributors count is across all pages of the repository.
