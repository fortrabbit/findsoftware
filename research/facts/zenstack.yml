notes: >
  The ORM is one package of a monorepo; the stars and contributors belong to the repository, which also holds the CLI, schema, Zod and client packages. The npm figure counts @zenstackhq/orm, the core package the install docs name next to @zenstackhq/schema; the unscoped zenstack package is the 2.x line (latest 2.22.3) and is not recorded, which replaces the older 42.1k weekly figure in the candidates CSV. The ecosyste.ms API reports zero dependents for @zenstackhq/orm, which is no real figure, so none is recorded. The docs welcome page says ZenStack "originated as an extension to Prisma ORM"; v3 "removed Prisma as a runtime dependency", so basedOn lists only Kysely. The Prerequisite page of the 3.x docs states "Node.js v20 or above", which sets runtimeMin; the @zenstackhq/orm and @zenstackhq/cli manifests at the v3.10.2 tag require node >=22, a difference between docs and manifest. Maintainer: the homepage footer says "ZenStack Dev, Inc."; the docs footer says "Copyright © 2026 ZenStack, Inc." and the LICENSE says "Copyright (c) 2025 ZenStack"; the homepage footer names the full legal form and is used. No address or country appears on the pages read, and the site has no terms or privacy page (those paths answer 404). ZenStack Studio is started with npx and a team can deploy its proxy on its own infrastructure; it is a developer tool and not a hosted offering. The docs name a Zod schema generator, OpenAPI spec generation and TanStack Query hooks as utilities; they are kinds of output, not fields. The homepage's "Trusted in production" logo row and the Discord and blog links are not recorded beyond the links above. The default branch is dev; the README and LICENSE are cited from it.
