notes: >
  The repository is a monorepo; the install page names @react-md/core, so the npm figures and the release date are for that package, and its latest release is @react-md/core 7.0.7 (GitHub release 2026-06-25). The unscoped react-md package is a separate npm registry id: its latest version is 7.0.8, published 2026-06-25, and it had 3806 downloads in the 2026-10-19 to 2026-10-25 window, against 284 for @react-md/core. The unscoped package is not recorded because the install page does not name it; a reviewer should decide which registry id the record follows. The page and README name the React version as a requirement, recorded as basedOn. The copyright line in the LICENSE file names Mikkel Laursen, which is recorded as the maintainer. The homepage nav shows the current docs version; it is not recorded. The @react-md/core ecosystem figures are low (one dependent package, no dependent repository) and are recorded as the source reports them. The homepage says the styles can be configured at compile time by overriding the default Sass variables, and the install page says react-md relies on Sass to generate the styles and the use rule for importing modules. The README says the project matches the accessibility guidelines and follows the W3C ARIA authoring practices for its components.
  The README opens with "Create an accessible React application with the material design specifications and SCSS." and lists left-to-right and right-to-left language support, light, dark and system themes. Registry figures stay on @react-md/core as the install page names it; the unscoped react-md package is noted above.
