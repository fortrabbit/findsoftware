notes: >
  The CSV row marked Apprise boundary because it reads as an end-user app. It is accepted on the project's own pages: the README says "To send a notification from within your python application, just do the following" and the Apprise API page says "Apprise API is meant to be a single notification gateway. Instead of building direct webhooks to Discord, Slack, email, and SMS in every project, send to Apprise API and let it route the message." The Apprise API server is a separate repository (caronc/apprise-api, linked from the README) with its own web interface; it is not recorded here. The GitHub homepage field points at the Docker Hub page, which is not the project site, so the homepage is appriseit.com, which the README links as its official documentation. The categories value "notifications" maps to email in scripts/import-facts.mjs; a reviewer may want a notifications value of its own. The Discord link is the README badge and the site's header link; the README's X badge points to a personal account and is not recorded. The runsAs local entry rests on the getting-started page pointing cron jobs, scripts and CI at the CLI; the Apprise API server is a separate repository and no runsAs is recorded for it. The runtime python follows the install page's "installed as a Python package" and the Python API in the README. The EPEL RPM is recorded as its own route as the install page states it. The name "caronc" is the GitHub account and the maintainer named in the LICENSE. The Python 3.9 minimum comes from requires-python at tag v2.1.0. The Docker image caronc/apprise is the one the installation page names; its pull count is the Docker Hub figure. The i18n entry is the site's language selector listing English and French.
