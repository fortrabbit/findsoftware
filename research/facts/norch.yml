notes: >
  The repository's homepage field points to the repository itself, so no homepage is recorded. The package description names LevelDB as the store, recorded as databases leveldb from package.json. The package depends on search-index 6.0.1 and the README says Norch "uses the search-index query language"; a dependency and a query language are not a basedOn statement, so basedOn stays empty. The npm package's "next" dist-tag (1.0.0-rc5) is a prerelease and is not recorded. The npm weekly figure is the sum of the daily downloads for 2026-09-28 to 2026-10-04 (16), per the range endpoint, a full week; the figure in the candidates row is stale. The first GitHub tag is v0.2.1 (2013-07-05); npm lists versions from 2014, and the oldest release of this repository sets firstRelease. The maintainer is named by the GitHub user and the npm maintainer entry; no legal name or copyright line is published in the repository (no LICENSE file is detected by GitHub, and the README license section is only a badge), so no legal form is recorded. The README's MIT badge agrees with package.json. The repository has no LICENSE file that GitHub can read, so the license is taken from package.json at v1.0.1. The HTTP Archive technologies list does not carry Norch. The README also shows programmatic use inside a Node project.
