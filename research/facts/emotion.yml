notes: |-
  Emotion is a monorepo. The install page names @emotion/react as the easiest start for React users and @emotion/css for other frameworks; the registry figures are for @emotion/react, the core package the install page names, and the release counted is its latest stable tag 11.14.0. Sibling packages (@emotion/styled 11.14.1, @emotion/css) carry no figures here. The homepage's "v10 Docs" link is a separate older documentation set; the current docs are the default. The docs point to a Slack community (join.slack.com) that has no field in the register. The CSV row marked the project boundary (styling tooling) and it is accepted as a CSS-in-JS library. The @emotion/react package states it requires React; that is a peer requirement, not a runtime, so no runtime is recorded. The intro page describes @emotion/css as framework agnostic and as requiring no additional setup, babel plugin or other config changes; @emotion/react adds a css prop and theming.
   The introduction page says "Both string and object styles are supported", that @emotion/css "Requires no additional setup, babel plugin, or other config changes" and that for it "Server side rendering requires additional work to set up". For @emotion/react it lists a css prop, "Server side rendering with zero configuration" and "Theming works out of the box". The install page says "styled is a way to create React components that have styles attached to them" for @emotion/styled. The earliest npm upload of the project's "emotion" package is 1.0.0 (2017-04-14), consistent with firstRelease 2017.
