notes: >
  No homepage is recorded. The GitHub homepage field is empty; the only project-hosted site found, nextapps-de.github.io/flexsearch, is a benchmark page and not an overview of the software, so the reviewer decides whether it counts. The maintainer is the company on the imprint of nextapps.de; the README copyright line names Thomas Wilkerling as copyright holder ("Copyright 2018-2025 Thomas Wilkerling, Hosted by Nextapps GmbH") and the npm author is the same person. The npm latest is 0.8.212 (published 2025-09-06); the newest GitHub release object is 0.8.2 (2025-05-21); both are major 0, and latestReleaseDate follows npm. The npm weekly figure is the sum of the range 2026-09-28 to 2026-10-04, the latest week without zero days; the API returns zero for several days in each of the weeks 2026-10-05 to 2026-10-25 (2026-10-12 to 2026-10-18 sums to 741386 with three zero days, 2026-10-19 to 2026-10-25 to 679267), so those weeks are gapped and not used. The README lists charsets (Latin, CJK, Hindi, Arabic, Cyrillic, Greek and Coptic, Hebrew) and language packs for encoders; no field holds them yet. IndexedDB is a browser store and is left out of databases. Third-party wrappers named in the README (react-use-flexsearch, vue-use-flexsearch, gatsby-plugin-flexsearch, the Nikola plugin) are not plugins of the directory kind and are not recorded. The donation links (Open Collective, GitHub Sponsors, Liberapay, Patreon, PayPal) are not paid editions. The GitHub language field reads JavaScript, the source is JavaScript; the README states no other language.
