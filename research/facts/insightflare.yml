notes: >
  The repository holds a single README in .github/readme with English, Japanese and Chinese versions; the English one is the source of every quote. The GitHub homepage field and the README demo link differ: the README links insight-demo.ravelloh.com, the repository homepage field links demo.insightflare.net, which shows the product under the name "InsightFlare Demo" with the team name "XEOOS Team" in its title. The homepage is recorded from that field, so a reviewer should confirm that the demo domain counts as the project's own site. The LICENSE copyright line names RavelloH as the maintainer; the demo page names XEOOS Team, which is not recorded as the maintainer. The runtime is Cloudflare Workers with Durable Objects, D1, R2 and KV, per the README backend table; no runtime value covers Workers, so runtime is not recorded. D1 is the primary database and stays a note, not a databases value. The demo dashboard shows user and team management menu entries, which are labels and no sentence, so userRoles is not recorded. The README says the tool uses no cookies and does not store raw IP addresses. The README states no runsAs process model. The criterion 1 wiring is the frontend script a site loads from the deployment (the README snippet is a script tag at /script.js with a siteId). The README describes a Skills file for AI agents and an API Token for reading analytics datasets; neither is a headless CMS API, so headlessApi is not recorded. The README calls the Analytics Engine layer optional and describes an R2 bucket for cold archive, both coined deploy options kept here as notes. Installs run on the creator's own Cloudflare account, so no hosted service is recorded. The demo page also shows a "Scheduled Tasks" and a "Request Observability" page, which the README describes as features. The stars and contributors come from the GitHub API on 2026-11-03.
