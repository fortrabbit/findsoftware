notes: >
  The README says Turso database is a separate project at github.com/tursodatabase/turso, a rewrite and not a fork of SQLite, and that libSQL is actively maintained while new features are being developed in Turso; advises new projects to look at Turso. This is no end statement and no successorOf is recorded, so status stays accepted for the reviewer. The URL the repository and README name as the project page, turso.tech/libsql, redirects to turso.tech, which names Turso Cloud and an announcement about joining Supabase and does not name libSQL, so no homepage is recorded. The maintainer is Turso as the README states; the Turso terms of use define "Turso" as ChiselStrike Inc. with a Claymont, Delaware address, which reads as an incorporation address and gives no project HQ, so no hqCountry is recorded. The README's shell example prints "based on SQLite version 3.43.0"; sqlite has no record, so no basedOn. The GitHub organization is named "Turso Database". The library runs inside the app process (README: embeddable, runs inside your process) and has no runsAs; runsAs always-on is the sqld server mode in libsql-server, a daemon per its README. Install routes are the sqld routes in docs/BUILD-RUN.md; the Docker image is on ghcr.io, not Docker Hub, so no dockerPulls. The libsql-server releases (sqld) on GitHub stop at libsql-server-v0.24.32 (2025-02-14), and a libsql-server-v0.24.33 tag exists without a release; the crate version and date come from crates.io, and tag libsql-0.10.0 has commit date 2026-10-13. The GitHub release list holds libsql-0.1.0 (2022-11-22) as the oldest release. The Rust crate sits in the libsql folder; the npm package libsql and the Go and JS drivers are other repositories and are not recorded. Language is C per GitHub; the crate is Rust. The Discord link is the one Turso and libSQL share. Fields coined here: crateName and crateDownloads come from the shared registry list.
