notes: >
  The CSV row gives http://octopress.org; the same site answers over https with 200, so the record links the https address. firstRelease is the first RubyGems upload (3.0.0.alpha1, 2013); the Git tags start at v3.0.0.alpha3 (2014-02-18). The highest stable tag is v3.0.11 (2015-07-15), which matches the newest stable gem version. v3.0.12.pre.1 is a prerelease and is recorded as no fact; the registry has no later stable version. The repository has no GitHub release objects, only tags, so latestReleaseDate and the registry figure come from RubyGems. The repository was last pushed on 2022-06-15 and has no archive flag. The Jekyll relation comes from the README sentence about Jekyll blogs and from the gemspec, which lists jekyll as a runtime dependency. The homepage post "Octopress 3.0 Is Coming" (January 2015) says the Git distribution of the earlier Octopress was nearing its end; that describes the previous distribution, not the gem, and is not recorded as a status. The site's docs at octopress.org/docs/setup describe the earlier Git-based setup and are not used for the install method; the docs index is dated 2011 and is cited only for the Jekyll relation. The README's deploy section names rsync, Amazon S3 and CloudFront, and Git hosts such as GitHub Pages as deployment methods. The README lists commands that create posts, pages and drafts from templates. The build command is jekyll's, which the README names as the build step before octopress deploy. The copyright line in the LICENSE names "octopress", and the site footer names Brandon Mathis, which is the maintainer recorded.
