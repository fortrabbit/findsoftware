notes: >
  The tags are the only release markers: the repository has no GitHub releases, so currentMajor is the highest stable tag v2.4.0 (2020-11-15), and latestReleaseDate is that tag's commit date. The master README describes an upgrade from Nitrogen 2 to Nitrogen 3 and the docs point at a tutorial, but no 3.x tag exists and no Hex package was found under the name nitrogen (hex.pm returns 404), so the major stays 2. The homepage is recorded with https: the CSV row gives http, which redirects to https and answers 200. The LICENSE file names two copyright holders as "Rusty Klophaus/Jesse Gumm"; the record keeps that wording. The homepage links to a 2014 talk and a 2020 book; neither is a fact field. The contributor count is read from the contributors endpoint with per_page=1 and the page number of the last link (29). The docs state that the starter application runs on Inets, Erlang's built-in HTTP server, and that Nitrogen is started, stopped and attached to as a detached console with bin/nitrogen. The downloads page offers five web servers to run it on: Cowboy, Inets, Mochiweb, Webmachine and Yaws. The learn page says it uses an event-driven model, supports websockets with an ajax fallback, and runs on any platform that runs Erlang.
