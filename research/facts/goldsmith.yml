notes: >
  Stub because criterion 3 cannot be judged: the README gives a Go tutorial with import paths (go.foosoft.net/goldsmith) and no install step, such as go get or a module download, and the tree holds go.mod. Criterion 4 is not in doubt in the sense of an end: the GitHub repository FooSoft/goldsmith is archived and its README says it "has permanently moved" to git.sr.ht/~foosoft/goldsmith, which is readable and holds the source (last commit on sourcehut "a month ago" per its summary page; the GitHub last commit is 2025-11-04). The move is recorded as the repository and the archive is not a signal. The homepage field on GitHub, foosoft.net/projects/goldsmith, answers 404, and foosoft.net does not name the project on its root page, so no homepage is recorded. Releases: GitHub has none; sourcehut lists the tags 25.2.14.0 and 23.12.30.0, a calendar-style version with no major, so currentMajor is not recorded, and the exact release date was not read because the sourcehut page gives it only as relative time. The sourcehut site lists the tag 25.2.14.0 as its latest. The stars and contributors are from the archived GitHub repository, and the sourcehut repository shows no adoption figure. The project's own README says the website foosoft.net is generated with Goldsmith.
