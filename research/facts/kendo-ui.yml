notes: >
  The id stands for the jQuery distribution, @progress/kendo-ui: its npm description says it is part of Kendo UI for jQuery. The CSV homepage (telerik.com/kendo-react-ui) is KendoReact, a sibling product, and was replaced by the Kendo UI product page. The Kendo UI home page describes a bundle of four libraries built for jQuery, Angular, React and Vue; the Angular, Vue and React libraries are not part of this record. The CSV npm figure (86.2k per week) belonged to @progress/kendo-react-buttons, so it is not used. The open-source Kendo UI Core npm package (kendo-ui-core) had 8860 downloads in the same week, 56 dependent packages and 53 dependent repositories. The installation page says the commercial package requires license activation from R2 2022 on. The Core README lists jQuery under "Compatibility and Requirements" as the library Kendo UI Core depends on, and the docs title the product "Kendo UI for jQuery", so basedOn is jquery. The social links (X, Discord, Facebook, YouTube) are the Telerik accounts in the footer of the Kendo UI product page. Versions are calendar versions (2026.3.1015), so there is no currentMajor. The license statements are recorded as two entries: Apache-2.0 for the Core repository, which the README says "applies ONLY to the source of this repository", and the commercial EULA of @progress/kendo-ui. The EULA names Massachusetts law; no headquarters country was found, so hqCountry is not recorded. The first GitHub tag (2011.2.804) gives firstRelease. The GitHub license detection reads NOASSERTION, so the statements come from the README and the npm metadata.
  The Core README says the Kendo UI team gives no formal support for Core, only to customers with a commercial license.
