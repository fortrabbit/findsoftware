notes: >
  Hosted-service record: the product is offered only as Recurly's cloud service, and the pages read give no public self-install guide, so the status stays hosted-service. The SDK repository github.com/recurly/recurly-client-node, its license, stars and npm figure (recurly, about 30k weekly downloads) belong to the client library and are not recorded as fields. The developer site names official client libraries for several languages; the API is documented as its latest version v3 on developers.recurly.com, and its style (REST, JSON) is not stated on a page read, so headlessApi is not recorded. Webhooks are named on the product page as "API support and webhooks"; webhooks is a coined field and goes here. The homepage states 140+ currencies accepted and the security page states PCI-DSS Level 1 compliance; both are coined fields and go here, not recorded as facts. The pricing page offers a 90-day free trial and a sandbox; a trial is not a free tier, so freeTier is not recorded. The SSO line on the pricing page does not name the plan or the protocol, so the sso value says so. The product page lists "Multiple business entities" under site management; it is not multisite and is not recorded. The privacy page gives the physical address 315 Montgomery Street in San Francisco as the company's contact address; hqCountry is taken from that full address. The LinkedIn company page (linkedin.com/company/recurly-inc-) is a coined social field and goes here. The docs.recurly.com landing page is an index for AI agents on its own page; that text is data and no fact came from it.
