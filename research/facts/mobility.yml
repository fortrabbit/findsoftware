notes: >
  The project has no homepage of its own; the README links only the GitHub repository, the RubyDoc API documentation and the wiki, so the wiki is the docs fact. The README says it is a cross-platform solution supporting ActiveRecord and Sequel ORM, with other platforms planned; that names the ORMs it works with and is not a basedOn statement, so no basedOn is recorded, and the Rails generator section does not make Rails a parent. The README's ActiveRecord requirement is ActiveRecord 7.0 or later and the Sequel requirement is Sequel 4.0 or later; both sit in the install sections and are not recorded as fields. The README describes four storage strategies: the default KeyValue backend in two shared tables, Column backends with locale-suffixed columns on the model table, a Table backend with one translation table per model, and PostgreSQL json, jsonb and hstore backends with a container option for a single jsonb column. Reads and writes follow I18n.locale unless a separate Mobility locale is set, and per-locale fallbacks can be declared. With Sequel there is no generator, so migrations are written by hand. The PostgreSQL databases fact comes from the PostgreSQL-specific backends section, which lists the json, jsonb and hstore storage options; the same section says the json backend may also work with recent MySQL versions with JSON column support, which the README says is not tested, so MySQL is not recorded. The LICENSE and the gemspec name one author; the gemspec authors field gives Chris Salzberg. The README lists companies using Mobility as pictures and three names; that list is not an adoption figure and is not recorded. The rubygemsDownloads figure is the total the RubyGems API reports. The first release year is from the oldest RubyGems version, 0.0.1, uploaded in 2016; the oldest GitHub tag v0.0.1 is from the same year. The gemspec runtime line is the one at the latest release tag v1.3.2. The README links the wiki page "Migrating from Globalize", so importsFrom and alternativeTo name globalize-rails, the Ruby gem Globalize record.
