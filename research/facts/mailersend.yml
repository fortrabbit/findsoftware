notes: >
  The record covers the hosted MailerSend service. The SDK repository github.com/mailersend/mailersend-nodejs (the candidates row lists 175 stars and an npm figure of 51.7k a week) is a client library, so its license, stars and npm figure are not recorded here. Transactional email goes through the Email API or the SMTP relay, both named on the developers' "What is MailerSend?" page; no field holds them. Coined field kept here: freeTier (the pricing page offers a Free plan with the "Get started for free" call to action). The pricing page lists "User roles & permissions" under "All in Free, plus:" without the plan's name in the text, so userRoles rests on the homepage sentence about RBAC. The homepage lists SSO without naming a protocol, so no protocol is recorded. The compare page lists many alternatives pages; only Amazon SES and Brevo have records here. The security page gives the EU data storage center; the homepage repeats it. The LinkedIn and YouTube links on the homepage have no field. The About page at mailersend.com/about is the MailerLite company's page, not MailerSend's, and was not used. No founding year was found on the pages read, so firstRelease is unknown.
