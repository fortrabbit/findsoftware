notes: >
  The monorepo github.com/sergejcodes/minze holds the framework minze, the scaffolder create-minze, the editor extension minze-vsc and the Vite plugin vite-plugin-minze. The install docs name npm add minze, the scaffolder command npm create minze and a CDN link; the framework is the package behind the record, so currentMajor 1 comes from the minze-v1.10.2 release. create-minze has its own releases, the latest being create-minze-v2.2.2, and is not recorded as a major. The npm figure is for the minze package. The installation page states "Minze requires Node.js version >= 16.0.0" under the command-line install, a requirement of the scaffolder and not of a site, so it is noted and not recorded as runtime; and the minze npm package declares engines node >=16.0.0. The README says the typed JavaScript API covers reactivity, lifecycle hooks, scoped styles and one-shot components registration, and that components can be created without build tools. The site says the framework is "not a framework for building complex user interfaces or single-page apps, like React, Vue or Angular" on its introduction page. The repository's default branch is main and the homepage is https; the GitHub homepage field gives the http address. Copyright is "2021-present", and the site footer repeats the same name.
