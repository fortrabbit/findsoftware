notes: >
  In doubt: criterion 3 and criterion 2, because frontaid.io now redirects to an unrelated web compendium page and no documentation, installation page, package or source repository of FrontAid CMS is reachable, and the 2022 copy of its homepage in the Internet Archive shows a hosted web app with a sign-in link rather than software to install. A live FrontAid CMS site with install documentation, a package or a repository would settle it. The Internet Archive copy at https://web.archive.org/web/2022/https://frontaid.io/ is not a primary source, so nothing from it is recorded as a fact; for orientation only, it describes a decoupled, Git-based CMS that writes JSON to the user's own repository and says "FrontAid CMS is completely free"; no license is stated there. The GitHub user frontaid holds only a Git CLI tools repository and a CSS starter kit, not the CMS; repositories that mention FrontAid CMS belong to third parties and are not a source. No homepage is recorded because the domain now serves another site.
