notes: >
  The repository lingui/js-lingui is a monorepo of the @lingui packages (core, react, cli, macro plugins, Vite and SWC plugins, the ESLint plugin) and the documentation site; the stars and contributors count the whole repository. The registry figures come from @lingui/core, the core package the install page names with the React binding. The maintainer is recorded as Crowdin, the copyright holder for 2022 to 2023 in the LICENSE; the same LICENSE names Tomáš Ehrlich for 2017 to 2022, and the homepage footer reads "Copyright © 2017-2022 Tom Ehrlich, © 2022-2026 Crowdin." The React, Vue, SolidJS and React Native bindings are framework-agnostic core packages with official bindings, so no basedOn; Astro and Svelte support is named as community packages. The Node.js 22.19 minimum on the installation page is a build requirement for a library that also runs in the browser, so no runtimeMin. The homepage community links are Discord, X and GitHub Discussions; Stack Overflow is a general forum and is not recorded. The README lists Crowdin as a partner logo; no other sponsorship is recorded. firstRelease is 2017 from the oldest npm upload of the same repository, lingui-react 0.2.0 (2017-02-06), the @lingui/core package from the same repository followed on 2018-01-02, and the oldest GitHub release is from 2018. The README requirements say macros need Babel with the Lingui macro plugin or SWC with the Lingui SWC plugin, and that Lingui 6 packages are ESM-only. The README's "Who uses Lingui" and the homepage's user logos are not recorded.
