notes: >
  Repository only: the GitHub homepage field is empty and the crate's homepage is the repository, so no homepage is recorded. The README has no installation steps; the install line is only in the crate's rustdoc quick overview on docs.rs, which shows version 2.0.0 while the registry's latest is 3.1.1, and the quote is recorded as the page states it. The highest stable GitHub release is v2.8.2 (2021-02-24), while the crate has stable releases 3.0.0 (2021-12-14), 3.1.0 (2023-01-09) and 3.1.1 (2023-04-18) without GitHub releases; the registry major is used for currentMajor and the latest release date. The oldest registry upload is 0.1.0 (2018-06-01), older than the oldest GitHub tag, so firstRelease is 2018 from the registry. The repository was last pushed 2025-09-29 and is not archived; no end statement was found. The README says the framework gives low-level control over the web stack "as hyper does", which names a comparison, not a parent, so no basedOn is recorded. The crate's total downloads are recorded; its 90-day figure is 1007 and is not recorded as a separate field. The maintainer is the copyright holder in LICENSE, an individual.
