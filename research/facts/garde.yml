notes: >
  The repository is the project's only home: the README names no website, so homepage is absent and the docs link is docs.rs, which the README gives as its documentation. The README title and the crate both name the project garde; the crate page has no homepage either. Install: the README says "To get started, install `garde`:" followed by a cargo add command; the installMethod quote is that sentence as rendered on docs.rs, where the command sits in the same line. The license line in the README reads "Licensed under either of" Apache License, Version 2.0 and MIT license "at your option"; the crate registry states "MIT OR Apache-2.0", the same two licenses in another wording, so the registry wording is not a third entry. The LICENSE-MIT copyright line names Jan Procházka as the 2022 copyright holder and no company; the GitHub profile location (Czechia) is a personal profile field, not a legal address, so no hqCountry is recorded. The README says the crate is "heavily inspired by the validator crate" and "essentially a full rewrite of `validator`"; that is a stated origin, not a fork or successor statement, so no forkOf or successorOf is recorded. The README's "Integration with web frameworks" section names axum and actix-web integration crates, which supports criterion 1 (web application use). Rust version: rust-version 1.87 is set in the workspace Cargo.toml at v0.23.0 and matches the registry's rust_version for 0.23.0. The crates.io registry also reports 2,780,391 downloads in the last 90 days (recent_downloads), not recorded because the crate figure is the total. The README rule set covers required, length, range, pattern, email, url, ip and custom functions, attached per field with a garde attribute; the feature flags (derive, email, url, regex, credit-card, phone-number, unicode) are coined kinds and stay in the README. The oldest tag is v0.3.0, with a commit date of 2023-03-25, the day the repository was created; the crate was created 2023-03-24 on crates.io. The GitHub release list has no release object for v0.3.0, so the first-release year comes from the tag's commit date.
