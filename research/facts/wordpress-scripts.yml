notes: >
  The package is published from the WordPress/gutenberg monorepo, which has no per-package GitHub releases: the highest stable tag of the package is @wordpress/scripts@37.0.0 (tagged 2026-10-20, the npm latest), so currentMajor and latestReleaseDate come from that tag. firstRelease is the package's first npm upload (2018-01-23, version 1.0.1-0): the Gutenberg monorepo's oldest release (2017) belongs to the Gutenberg plugin, another product. The docs list the available scripts: build, build-blocks-manifest, check-engines, check-licenses, format, lint-js, lint-pkg-json, lint-md-docs, lint-style, packages-update, plugin-zip, start, test-unit-js, test-unit-jest and test-e2e. The docs say the package "is inspired by react-scripts and kcd-scripts"; neither is a parent. The docs describe the default webpack config and say the package runs webpack behind the scenes, which names no parent record. basedOn wordpress rests on the docs line that the scripts are tailored for WordPress development. The GitHub license detection for the repository reads NOASSERTION; the package manifest license is recorded. The GitHub contributor count is the repository's figure, not the package's. The npm weekly figure is the range 2026-09-28 to 2026-10-04. The docs say the package is not compatible with older Node.js versions and asks for a Node.js version with long-term support status.
