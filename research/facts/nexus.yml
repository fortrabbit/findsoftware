notes: >
  The npm package nexus carries 100 versions marked deprecated with the notice "Development of Nexus Framework has ended", all of them 0.x versions published by another project under the same npm name (Prisma Labs, 2020); the 1.x line this record covers is not deprecated, the README names no end, and no end signal is recorded. The npm upload history starts in 2011 with a version 0.0.0 that is not this project. The GitHub repository was last pushed in 2023, and its newest stable release is v1.3.0 of March 2022; the newest prerelease is 1.4.0-next.13 of March 2023 on the npm registry, which is newer than the stable release and is recorded as the latest prerelease date; the import judges listing by these dates. The npm latest version is dated 2022-03-05, two days before the GitHub release; the GitHub release date is recorded. The homepage footer reads "Tim Griesser © 2018-2022" and the homepage navigation links to a "Nexus Schema" product that is a separate project, not recorded here. The GraphQL Nexus README names graphql-js as the base for the schema types, which the docs state as "builds upon". The README names graphql as a peer dependency of the installation. The homepage title is the site's only short description; the quote is the page title. Stars and contributors belong to the single-package repository.
