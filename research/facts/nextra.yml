notes: >
  The install page names the packages nextra and nextra-theme-docs, so registry figures come from nextra. The create-nextra-app package on npm belongs to another maintainer and is not named by the install page; it is not used. The introduction page FAQ says "Nextra 4 only works with the app router." The install page lists npm run start for production mode; runsAs records only the static export the guide states. firstRelease is the year the npm package was created. The homepage says Nextra is "Powered by © 2026 The Nextra Project." with no legal entity name, so the maintainer is recorded as the project states it. The npmWeeklyDownloads figure covers the week from 2026-10-12 to 2026-10-18.
