notes: >
  The package is distributed on CRAN as bookdown, and the GitHub release v0.48 (2026-08-28) matches DESCRIPTION Version 0.48.1. The major is 0 because the release line is 0.x. The DESCRIPTION's SystemRequirements name Pandoc (>= 1.17.2), which is not recorded as a field. The README lists Posit Connect and bookdown.org as publishing targets: Posit Connect is named as one-click publishing, and bookdown.org is named as a target, with no prices or plans recorded; a hosted service of the same name is not the open source package. The static values rest on the book's GitHub chapter, which says the HTML output files can be hosted as static HTML files. The contributor count is taken from the last page of the per_page=1 request, page 108. The download count is not in these sources, so no CRAN figure is recorded. No basedOn is recorded because the README presents bookdown as an R Markdown output tool, not as a package built on another project named as its parent.
