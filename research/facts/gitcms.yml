notes: >
  The record is a hosted service: the product runs on gitcms.dev and edits the Git repository of the site through a GitHub App. The homepage links github.com/waishnav/gitcms-web-app; the repository returns 404 on the GitHub API (private or removed), so there is no installable software, and its license, stars and releases are not recorded here. No self-host option, REST or GraphQL API, SSO or import feature was found on the homepage, docs, terms, llms.txt or quick start; MCP is the only documented programmatic interface (terms section 7), so headlessApi is not recorded. Pricing is a one-time per-site license with a per-seat add-on and a stated move to monthly; no amounts are recorded. The homepage says it works with Astro, Next.js, TanStack Start, Hugo, Jekyll, Gatsby, Eleventy, Nuxt.js, SvelteKit, Docusaurus, VuePress, MkDocs and Zola; no field in the starter list covers that and no field was coined. The homepage states "Trusted by 200+ website builders", which counts people rather than sites, so it is not recorded as reportedInstalls. The terms and pages name no legal entity or country, so hqCountry and a legal maintainer name are unknown; the maintainer is recorded as the founder's name the homepage gives. The pages name Data River and Zexa only in testimonials, so no parent is recorded. Comparison pages are listed in llms.txt and recorded as alternativeTo; the llms.txt list has 19 products.
