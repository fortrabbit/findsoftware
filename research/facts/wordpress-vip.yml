notes: >
  Hosting plans on the pricing page are Standard, Enhanced and Signature, each marked "Request pricing"; no prices and no free tier are stated, so none is recorded. The three plans differ in network site limits (10, 100, 1,000), uptime SLA and support tiers; plan tiers are not paidEdition. The homepage JSON-LD gives foundingDate 2006 and legalName WPVIP Inc.; founding year is kept here, not as a field. The legal form and governing law (State of California, San Francisco courts) come from the terms; no page gives a headquarters address, so hqCountry stays unknown. The X handle (x.com/WordPressVIP) appears only in the homepage JSON-LD sameAs list, not as a visible link, so it is not recorded as a field; the LinkedIn link is a coined kind kept here. The homepage says "Trusted by over 700 enterprises": customers, not sites or installs, so reportedInstalls is not used. Parse.ly is a separate analytics product sold with VIP under the same terms; its own pages are not read. The VIP Local Development Environment runs locally in VIP-CLI; it is a developer tool for the hosted platform and not a self-install of it, so selfHostOption stays unknown. The platform is versionless: the VIP Platform changelogs page is the only dated history, so no currentMajor or firstRelease is recorded. The WordPress VIP GitHub repositories are per application (docs say each application gets its own wpcomvip repository), so no repository is recorded. The homepage says VIP experts and partners handle migration from Sitecore, Drupal, Adobe Experience Manager and legacy WordPress hosting: a migration service done by the vendor, so no importsFrom is recorded. The docs also describe importing a SQL file from a site not hosted at VIP with VIP-CLI, which moves a WordPress database and names no other software. The alternativeTo entry rests on the comparison hub sentence; the comparison table on the enterprise CMS page also names Contentful, Sanity, Drupal and Adobe Experience Manager, not recorded as alternativeTo because that table has no alternative or switching sentence. The docs say VIP Dashboard and WordPress logins support SAML identity providers and no other SSO technology for WordPress logins. Live preview, internationalisation and templating are not named on the pages read.
