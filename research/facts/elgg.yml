notes: >
  The scope was widened on 2026-10-19 from boundary to a social network engine; status stays accepted. The GitHub license field reads NOASSERTION, so the two license entries come from composer.json and the license page. The license page says the full package is under GPLv2 and the framework without plugins under MIT. The composer.json license is GPL-2.0-only, which the page's "version 2" wording does not contradict. The project started in 2004 per the about team page ("The Elgg project was started in 2004"); that is a project start, not a first release, so firstRelease stays unknown. The web services guide describes the API as REST/RPC hybrid, recorded as rest. Packagist downloads monthly figure is 339 (packagist.org/packages/elgg/elgg.json); only total is recorded. The contributors figure is the count of GitHub's anonymous contributor list, one page per contributor. Stable release line is 7.x (default branch 7.x). No endoflife.date product for Elgg (404).
