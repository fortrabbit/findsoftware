notes: >
  The repository is on a Gitea instance (git.mills.io), not GitHub, so the GitHub-only fields (githubStargazers, contributors, repoOwnerType) are not recorded from it; the Gitea star count (5) has no field. The Gitea contributors endpoint returns 404, so contributors is unknown. The Gitea repository field "website" points to https://zs.mills.io/, which the README names as the zs starter template demo, not the project's own site; no homepage is recorded. The README also names a make install source build and a container image on oci.mills.io, mirrored to Docker Hub; the quote check cannot read that part of the README, so neither is a fact. The README is the only documentation, and it names no deployment target and no output directory for zs build, so outputDir is unknown. The README does not say where a site runs; the .routes file (redirects, rewrites, 410 responses) is described as working "without a reverse proxy", which is not a statement about the host, so runsAs and renderingModes are not recorded beyond the static site generator wording. The Gitea API returns no license for the repository (license null); the MIT license comes from the LICENSE file and the README. The README also describes plugins (executables in any language in the .zs directory whose stdout fills a placeholder), build hooks that run before and after a build, a .routes file for redirects, rewrites and error responses, a document index for queries, and the commands zs build, zs watch and zs serve (the last rebuilds and serves the site on the network). The first release is 0.0.1 (2021-09-17), the oldest release object. Latest stable release is 0.5.0 (2026-10-18); no prerelease is listed. The owner's account type could not be read from the Gitea API (the orgs endpoint returns 404), so repoOwnerType is unknown.
