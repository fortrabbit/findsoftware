notes: >
  The highest stable GitHub release is v0.7.10 (2026-07-30), so currentMajor is 0; the 0.8 series is alpha (v0.8.0-alpha.3, 2026-10-16), recorded as latestPrereleaseDate. GitHub detects Apache-2.0 alone for the repository, while the README and the crate state MIT OR Apache-2.0; all three statements are recorded. The homepage footer names "Dioxus Labs" and the GitHub organization carries the same name; no legal notice was found, so the name is recorded as the project states it. firstRelease is the first crates.io version (0.1.0, 2021), older than the first GitHub release (v0.1.0, 2022). The learn page states "Dioxus Deploy" as a future option ("you'll eventually have the option to deploy your production apps with Dioxus Deploy"); no hosted offering exists to record, so hostedOffering stays unknown. The crate's rust_version is 1.83.0. Discord and X are the links on the homepage. The crate download figure is the crates.io recent_downloads value, a 90-day count.
