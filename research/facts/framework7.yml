notes: >
  Homepage is https and answers 200; the CSV listed it over http. Maintainer is the copyright holder in the LICENSE, which the npm author field also names. The homepage links a "UI Initiative Premium Framework7 templates and plugins" offering; that is a separate publisher's templates and plugins, not an edition of Framework7, so no paidEdition is recorded. Framework7 Vue, React and Svelte are sibling component packages in the same ecosystem, not a basedOn statement: the core is described as a vanilla JavaScript library. The HTTP Archive technologies index has no Framework7 entry, so httpArchiveSites is not recorded. The npm weekly figure is the sum of the 2026-10-18 to 2026-10-24 daily counts.
