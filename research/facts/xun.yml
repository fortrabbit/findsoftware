notes: >
  No homepage: the GitHub repository has no homepage set, and the README names no project website. The examples use yaitoo.cn and xun@yaitoo.cn; those are an author's domain in sample code, not a project page, so nothing is linked. Module path github.com/yaitoo/xun with no /v2 suffix, so the major is 1. Oldest tag v1.0.0 has a Go module proxy time of 2024-12-25 (the GitHub releases list starts at v1.0.3 on 2025-01-01), so firstRelease is 2024. The LICENSE file is the unfilled Apache template with no copyright line, so the maintainer is the name of the GitHub organization that owns the repository (Yaitoo, from the users API); its profile location gives no legal name or headquarters country, so hqCountry is left unknown. i18n is not recorded as yes: the README's "i18n support" covers validation messages from the form package, not translated pages. The README's Deploy section describes a single self-contained binary; the runsAs always-on value rests on its ListenAndServe call and the framework's Start method. The contentStore value is the app's own content/ folder of Markdown files, read by the Content engine.
