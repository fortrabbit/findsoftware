notes: >
  The categories value rests on the homepage tagline "The open-source API engine that connects your logic to the world"; api-management, the other CSV category, has no entry in the import's categoryMap. The Packagist package the install docs name, fusio/fusio, is a create-project skeleton with 9984 total downloads; the core package fusio/impl (29142 total) is recorded as the registry figure, which is a reviewer decision. The homepage Discord link is discord.gg/eMrMgwsc6e; the composer.json support chat is discord.gg/xjZQbZ3J, a second invite that no field holds. The YouTube channel and the BlueSky, Mastodon and Twitter links are on the homepage; only the first of them has a field. The docs and the homepage describe actions written in PHP, JavaScript, Python or Java; these name the logic languages of an API, not a templating or runtime fact, so they are not recorded. The developer portal, SDK generation and monetization features are described on the homepage and in the docs; no field holds them. The Fusio backend requires a PHP 8.4 runtime per the installation page, and composer.json at tag v7.2.1 names the same minimum. The fusio.zip, Composer and Docker routes are installation methods named by the docs and README. The platform homepage lists a live demo and a platform page with no statement that Fusio is offered as a hosted service, so no hostedOffering fact. The comparison pages for Tyk, WSO2 and Firebase name projects that have no record, so they are not recorded as alternativeTo. Christoph Kappestein is the name on the legal notice and composer.json; the maintainer is the individual, and the GitHub organization apioo is the repository owner. The homepage's hqCountry DE rests on the legal notice's address for the recorded maintainer, which the reviewer should confirm.
