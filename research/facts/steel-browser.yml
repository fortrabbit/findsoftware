notes: >
  Accepted under criterion 1 because the project's own README and docs describe an API that apps call (REST endpoints, an OpenAPI reference and Node and Python SDKs), so it is a browser API for agent and app code, not a finished end-user app. The GitHub repository is the open-source server; the Steel Cloud managed service is the hosted offering on the same product. There is no stable release: every GitHub tag is a beta (v0.1.1-beta.1 to v0.5.5-beta, the oldest beta-release on 2024-11-26), and the GitHub flag marks them as not prerelease, so currentMajor and latestReleaseDate are absent and latestPrereleaseDate is the newest beta. The root package.json is version 0.5.4 and is not a published stable release. The README names Docker images on ghcr.io (ghcr.io/steel-dev/steel-browser), not Docker Hub, so no dockerPulls figure is recorded. The README says the server runs on Node.js with Chrome installed; Chrome is a browser dependency, not a runtime field. The company is Nen Labs, Inc. per the terms page, which states the Oregon registration and address; the GitHub org name is steel-dev and the terms name Nen Labs as the provider. The homepage describes the Steel company as the product site; the README links it as the website. The SDK packages steel-sdk (Node and Python) and their repositories, and the Playwright, Puppeteer and Selenium compatibility, are kept in notes, not as fields. The README says the license is Apache 2.0 and the LICENSE file is the Apache License, Version 2.0 text, so one license statement is recorded. The homepage footer also links a LinkedIn page (not a recorded field). The README says "Steel is in public beta", which matches the beta tags. The README's Discord and X links are badge links, recorded without a quote as the wave 35 rule says.
