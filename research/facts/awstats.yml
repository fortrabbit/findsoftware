notes: >
  AWStats is a Perl log file analyzer: it reads a site's web server access logs and produces statistics, run as a CGI script or from the command line. The README and the homepage both state that the project is deprecated or no longer receiving new versions and recommend Matomo Log Analytics, so the status is discontinued under the end-signal rule. The GitHub API reports AWSTATS_8_0 (2025-08-26) as the latest stable release and the homepage also gives 8.0 as the last stable version. The homepage says the project is distributed under the GNU General Public License without a version, and the README says GNU GPL v3+; both describe one license, so one entry records the README wording. The GitHub API returns no license for the repository. The homepage's Perl 5.00503 minimum is for AWStats 8.x and is recorded as runtimeMin. The homepage also says the next maintenance release "may be provided by the community only"; that is not recorded as a fact. The repository copyright line names Laurent Destailleur for 2000 to 2025; no company is named. Matomo is recorded as alternativeTo because the project's own homepage recommends it; no successor relationship is claimed. The homepage's Bluesky, LinkedIn and Twitter links belong to the author's personal profiles, so only the README's project accounts are recorded as social fields.
