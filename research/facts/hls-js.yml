notes: >
  The repository's default branch is master and the README's install section is the source for the three installMethod routes; the README's CDN examples use jsDelivr (cdn.jsdelivr.net/npm/hls.js@1) inside the script-tag route. The runsAs quote is the Compatibility section's sentence that the library only works in browsers with the MSE API. The README says the library "is not instantiable in Node.js"; a dummy export only lets a Node require succeed, so no node runtime is recorded. The LICENSE copyright line names "Dailymotion" (2017), and the README does not name a current maintainer; the video-dev GitHub organization hosts the repository and no page read names it as a legal entity, so the copyright line is followed. The GitHub API reports no license for the repository (NOASSERTION) although the LICENSE file is Apache License 2.0. The first tag v0.0.1 is committed on 2015-04-10, so firstRelease is 2015; the npm package's first upload (2016) is later. The stable line is 1.7.4 (2026-10-28); the 1.7.0 release candidates of July and August 2026 are older than that stable release. The HTTP Archive technology list does not name hls.js, so no httpArchiveSites figure is recorded. The Slack channel named in the README is a development chat and is not recorded as forum.
