notes: >
  The maintainer is a name, not a legal entity: the LICENSE carries the Apache boilerplate with no copyright holder, and the README and the about page credit Andy Damevin, with the README marking his contribution as Maintenance; a reviewer decides whether that is the maintainer to record. Roq is published under the Quarkiverse organization. The homepage's web creator lets a visitor configure a site and download it as a ZIP or push it to GitHub. The docs name GitHub Pages and the GitHub Action, GitLab Pages and other CI as deploy targets, and the live site is static files. Roq's own docs describe Quarkus extensions (Roq Data, Roq FrontMatter, Roq Generator) that can be used standalone, recorded as the README states them, not as separate records. The Java version is not recorded: the migration guide lists "Java 21+ installed" as a prerequisite while the tutorials say "Roq uses JBang, so no JDK installation is needed", so runtimeMin is left out. The Maven artifact is not a registry in the list, so no download figure is recorded. The homepage links to GitHub and to the site's own RSS feed, and no Discord, X, Bluesky or Mastodon link was found on the homepage or docs pages read. The homepage is served over https. The 404 pages at /docs/installation/, /docs/deployment/ and /docs/requirements/ were checked and do not exist.
