notes: >
  Hosted-service record for the Lokalise platform at lokalise.com. The SDKs and CLI are on GitHub (github.com/lokalise/node-lokalise-api, github.com/lokalise/lokalise-cli-2-go) and npm (@lokalise/node-api); per the hosted-service rule their license, stars and download figures are not recorded. The privacy policy names three offices: Lokalise, Inc. in Dover, Delaware; SIA Lokalise in Riga, Latvia; and Lokalise Uk Ltd in Cheshire, United Kingdom. No page names a headquarters, so hqCountry is unknown. The imprint and terms name Lokalise, Inc., a Delaware corporation. The pricing page names the plans Explorer, Growth, Advanced and Enterprise and a 14-day trial for all plans; no prices recorded and no free plan stated. The SAML SSO and permission features are listed on the pricing page; the plan that includes them is not named in the text read. Compliance: the security page states SOC 2 Type II, ISO 27001 and ISO 27017 certifications; not recorded as a field. The API rate limit page says access to all endpoints is limited to 6 requests per second, per API token and IP address (not a field). The security page says on-premises and private cloud deployments are not supported, so there is no self-host option. The privacy policy gives a Dover, Delaware address for Lokalise, Inc. as the data controller; no page calls it the headquarters. The alternatives page also names Phrase, Transifex and Smartling, which had no fact files when checked. Social links on the homepage that are not fields: LinkedIn (linkedin.com/company/lokalise) and YouTube (youtube.com/@Lokalise).
