notes: >
  Candidate row was boundary; widened 2026-10-19 to an admin panel package for Laravel, accepted here. The open part is backpack/crud (MIT). backpack/pro is a paid add-on under a private EULA, and Backpack DevTools is a paid product named on the installation page; the pricing page is linked, not recorded. Runtime: the installation page says Laravel 12 or 13 and that Backpack has no additional requirements; no PHP minor version is stated on the pages read, so runtimeMin is absent. Maintainer legal name is from the privacy policy, which names the controller; the EULA names COMPLEMENT SOFTWARE SRL without the SC prefix. Contributors count is the page count of the GitHub contributors API at per_page=1. The homepage's "Unique Downloads" and "Code Contributors" counters carry no figure in the page text, so they are not recorded.
