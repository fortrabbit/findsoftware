notes: >
  Products on the homepage: a cookie and consent banner, a privacy and cookie policy generator, a terms and conditions generator, a website accessibility widget, a consent database and advanced solutions for data requests and whistleblowing reports. The footer lists a Forum link whose target the fetched HTML does not expose, so forum is not recorded. Hosted service: the homepage presents the consent banner, the policy generator and the compliance dashboard as one product. The homepage and the pricing page both say a free plan exists ("Free plan available, no credit card needed"; "Start with the free plan"), a feature recorded here as a note, not as a field. The pricing page lists plan tiers (Lite, Essentials, Standard, Advanced, Ultimate, Custom) with per-site monthly prices and pageview allowances; no prices are recorded, and the pageview allowances are notes. The pricing page lists "Multi-user collaboration" as a feature without any role statement, so userRoles is not recorded. The pricing page lists "Multi-language support" as support for multiple languages in privacy documents, which is a document feature, not an i18n statement about the software, so i18n is not recorded. The legal privacy hub says iubenda holds ISO/IEC 27001:2024 certification and relies on the EU-US Data Privacy Framework; these are notes. No data region is stated on the pages read, so regions is not recorded. The founder year 2011 appears on the about page; it is no release date and is not recorded as firstRelease. The contracting entity is named on the legal privacy hub as iubenda S.r.l.; the Terms document there is a document of the hub and no separate terms page was located. The pricing page lists an "API integration" with a REST API and a "Mobile SDK" in the top tier; the mobile SDK is a notes item. The SDK repositories and their licenses are not recorded, as hosted-service rules require. The integration list names WordPress, Shopify, Google Tag Manager and Google Consent Mode v2, and the homepage names plugins for PrestaShop, WordPress, Magento and Joomla; these are how the service attaches to a site and go to notes.
