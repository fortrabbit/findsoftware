notes: >
  Stub: the sources read do not settle whether a user can run Markdown Ninja on their own server. The repository holds a Dockerfile, a Go module, and developer setup notes in dev/development.md (a Docker network that blocks telemetry, a TimescaleDB container), but no operator install guide was found in the README or the dev folder. The README's publish command sends content with a MARKDOWN_NINJA_API_KEY to the hosted service at markdown.ninja, and the README links "Try it for free!" to the hosted site. The hosted site, its docs and its legal pages answer with a JavaScript shell and no text, so pricing, terms and headquarters could not be read. The docs source in docs/pages/ marks the introduction, the API page and the markdown_ninja.yml reference as "Coming soon". The Dockerfile builds mdninja and mdninja-server binaries and sets the mdninja CLI as the entry point, which does not state how a server is run. The CLI documentation at docs.markdown.ninja/cli was read, but it did not state a self-hosted install. Settle it by reading the operator documentation or the Dockerfile's entry point if the docs do not say whether the server runs outside the hosted service. The repository has no release or tag, so lastCommitDate is recorded. The repository's own README names Arcane Services as copyright holder; that is recorded as maintainer.
