notes: >
  Licenses: the GitHub API reports NOASSERTION for the repository, so the one license entry comes from LICENSE-Community.txt at the r9.0.4 tag, the Server Side Public License that the Community Server ships under. Release date: the release notes page gives 9.0.4 as Oct 13, 2026; the annotated git tag r9.0.4 carries a tagger date of 2026-10-14 in UTC, and the page wins as the project's own date. The GitHub repository has tags, not releases; the highest stable tag is r9.0.4, and r9.1.0-alpha0 (tagged 2026-08-11) is older than the latest stable release, so no latestPrereleaseDate is recorded. Maintainer and legal entity: MongoDB, Inc., New York; the founding year 2007 comes from the company's about page, not a first-release statement, so firstRelease is left out. Hosting: the Atlas record is the separate hosted-service record mongodb-atlas. The Docker install page names mongodb/mongodb-community-server, so dockerPulls counts that repository, not the library/mongo image. The product list shows a Community and an Enterprise Advanced edition; the commercial licence and the features are on the Enterprise Advanced page. Fields coined: none.
