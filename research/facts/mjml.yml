notes: >
  Accepted: an npm package that compiles MJML markup into HTML email, which is the email templating category the criteria count; the README's Installation section gives the npm route. The LICENSE copyright line names Mailjet SAS, so the maintainer is Mailjet SAS, and the README and homepage say MJML was developed by Mailjet. The Mailjet terms page says an agreement with Mailjet SAS is governed by French law with the courts in Paris; that names a jurisdiction, not a headquarters, so hqCountry is absent. The Sinch Email privacy notice on the Mailjet site refers to Sinch AB (publ) and its subsidiaries, including the Mailjet brand; that does not say which company owns the MJML project, so parent is absent. The homepage says MJML was created in early 2015, but the first npm upload (0.0.1) and the repository creation are both 2016-01-28, so firstRelease is 2016. The README's Client-side section shows a separate mjml-browser package, so the engine also runs in a browser; the README names both browser and Node.js, so runtime is node and runsAs is absent. The engine has no runtimeMin: the npm latest version declares no engines field. The hosted MJML REST API and the free online editor (mjml.io/try-it-live) are hosted tools next to the MIT engine; the API page's offer is the hostedOffering fact, and the online editor is noted here only. The community page lists tools such as a Visual Studio Code plugin, a Webpack plugin and Java client libraries for the MJML API; it is the pluginDirectory. The community Slack (join.slack.com/t/mjml) is the project's chat; there is no Slack field, so it appears in these notes only. The npm figure is the sum of the seven daily downloads of the mjml package from 2026-11-01 to 2026-11-07. The latest stable release is v5.4.1 (2026-09-10); v6.0.0-alpha.1 (2026-10-09) is a newer prerelease and gives latestPrereleaseDate. The documentation title calls MJML a Responsive Email Framework; the README calls it a markup language, and the record keeps the README's words in its description. The README's examples show MJML components such as mj-section, mj-column and mj-text, compiled from Node.js with a mjml2html call. The installation route also covers the command line tool (mjml input.mjml -o output.html), which ships in the same npm package.
