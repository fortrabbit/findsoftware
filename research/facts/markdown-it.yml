notes: >
  The GitHub releases API returns 404, so latestReleaseDate is the npm publish time of the latest tag (15.0.3). The npm dist-tag v14-legacy (14.3.3) exists and is not recorded. The CSV row says js; GitHub reports TypeScript as the repository language. Adoption periods: npmWeeklyDownloads covers 2026-10-12 to 2026-10-18; githubStargazers was read 2026-10-19. The repository created_at (2014) is the repository creation date, not a first release, so firstRelease stays out. The README says "Community-written plugins and other packages on npm" without a directory URL, so no pluginDirectory. The maintainer value names the GitHub organization that owns the repository; no company or person is named on the pages read.
