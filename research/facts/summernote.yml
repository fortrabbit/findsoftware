notes: >
  The homepage states the parents: "Based on Bootstrap and jQuery" for the record, and the README says "Summernote is built on jQuery" and "Compatible with Bootstrap: Bootstrap 3, 4, and 5"; both parents are recorded in basedOn because the homepage names them as its base. The getting-started page shows the jsDelivr CDN links for summernote@0.9.0 and Bootstrap 3.4.1, and its download link, and the README shows the same kind of script tags for Bootstrap 5; the CDN pins are older than the npm latest 0.9.1, and the record does not pin a version. The npm package summernote is the registry name the CDN links use. The GitHub project's first tag is from 2013 (v0.1), before the first npm upload in 2015, so firstRelease is 2013. The homepage claims 100KiB, supported browsers and operating systems, and a Lite build with jQuery only; these are not recorded. The README's warning that the code view accepts script contents and needs server-side sanitizing is a usage warning, not a fact field. The homepage footer and README name no X, Mastodon, newsletter or forum. The Team link on the homepage points to the team page of the summernote GitHub organization. The plugin directory is the homepage's Plugins page; the README's awesome-summernote list is a community list and is not recorded. The npm install route is the registry package, which the getting-started CDN links also use. No page states where the library runs beyond browser support lists and a save-and-open example, so runsAs is left out. The homepage footer shows "Summernote v0.9.0" while the latest release is 0.9.1 on npm and v0.9.1 on GitHub; the record uses the GitHub release.
