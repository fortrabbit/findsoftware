notes: >
  Statamic's latest release has no direct php constraint on Packagist; the PHP floor comes through laravel/framework, and the docs state 8.3. The statamic/statamic starter package (Statamic's new-site package) has its own Packagist downloads (191,885 total), not recorded as adoption of the core. The deploy guides list includes fortrabbit, the publisher of this dataset; it is recorded as documented, without weight. The newsletter is a footer form without its own URL. Wikidata has an unlabeled item Q136990918 for the name, not verified as this software. Static output comes from the separate static site generator package (statamic/ssg, https://github.com/statamic/ssg), so renderingModes static depends on an add-on.
