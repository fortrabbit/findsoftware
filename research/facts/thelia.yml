notes: >
  Installation uses thelia/thelia-project, the project skeleton the repository README names for starting a shop; the repository is the development repository for Thelia itself. The skeleton's downloads are recorded with the core package. The maintainer is OpenStudio SAS: the legal notice gives the company form "SAS", and the homepage names it as the publisher. The homepage says the platform has existed since 2005 and that it has been maintained for almost 20 years; neither is a first-release year, so firstRelease is unknown. The homepage counts 840+ GitHub stars and 151 contributors; the API figures are recorded instead. The 300+ modules figure is the homepage's own count. The homepage is in French; the homepage's link to the documentation at doc.thelia.net returned a page without installation content on the day of reading, so the install facts come from the repository and the skeleton. The README states that Thelia 3 installs only the Twig back office; the Smarty back office of Thelia 2 is no longer installed or maintained in 3.x.
