notes: >
  The category is query-builder, taken from the CSV row; the project words name a database abstraction layer. The DBAL project page lists 5.0 and 4.6 as upcoming and 4.5.0 as stable, so currentMajor is 4 and the default branch is 4.5.x. The intro states that the DBAL "can be used independently of the Doctrine Object-Relational Mapper (ORM)"; the ORM README says it "sits on top of" the DBAL, which names the software it is built on, so the ORM and Migrations records carry basedOn doctrine-dbal. Db2 is named on the vendor list but is not in the databases vocabulary, so it is noted here and left out of the databases value. firstRelease is 2011 from the oldest Packagist upload (2.1.5, 2011-11-21); the oldest GitHub release is 2.4.0 (2013). The Packagist monthly total on 2026-11-04 was 14751097, not recorded because the field keeps the total. Stars and contributors belong to the repository; the repository is the Doctrine org's DBAL package, not a monorepo. The maintainer is the Doctrine Project as the LICENSE copyright line names it; no legal entity was found on the project site.
