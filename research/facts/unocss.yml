notes: >
  The root README.md and LICENSE of the repository are symlinks (to packages-presets/unocss/README.md and packages-integrations/vscode/LICENSE), so the GitHub API reports the license as NOASSERTION; the package-level README and the LICENSE it links to were read, and the registry and homepage state MIT. The highest stable GitHub release is v66.12.0 (2026-10-26) and the prerelease v66.12.0-beta.1 is older, so no latestPrereleaseDate is recorded; the npm latest 66.12.0 matches. firstRelease is 2021 from the oldest GitHub release, the prerelease v0.1.0-beta.1 (2021-10-23); the first stable release v0.1.0 followed on 2021-10-26. The README says the project was inspired by Windi CSS, Tailwind CSS and Twind; that is an inspiration statement, not a basedOn, so basedOn is not recorded. The npm figure is the unocss package, which the install pages name; the vite page says the plugin ships with it. httpArchiveSites is origins.mobile of the UnoCSS technology in the HTTP Archive list, the figure adoption.mjs uses; the list carries UnoCSS under that name. The runtime and build page wording is the only statement of where the engine runs: the homepage says compilation synthesizes classes "at build time" and the runtime page says it runs in the browser. Sponsors are named through Open Collective links, which have no field. The homepage's Bluesky link is the project's own. The release notes page exists on the docs site; it was not read beyond the release list. The homepage names the docs at its own site and the llms.txt documentation; no discord, x, or newsletter link was found on the homepage. Homepage feature list (basis for the prose): presets provide all utilities; shortcuts alias utilities; attributify groups utilities in attributes; pure CSS icons; CSS directives reuse utilities with @apply; the engine has no parsing or scanning step. The why page calls UnoCSS a "spiritual successor" of Windi CSS, which is kept out of successorOf and recorded here. The chat.antfu.me discord link is the author's community server, so no discord fact is recorded. Feature list now in the prose: presets provide utilities, shortcuts alias utilities, attributify, pure CSS icons, CSS directives with @apply.
