notes: >
  The CSV discovery name is pulldown-cmark, the crate and the GitHub organization name; the homepage is the project's GitHub Pages guide, which the repository's homepage field names. The crate's repository field still points to github.com/raphlinus/pulldown-cmark, an older owner that redirects to the current organization; the current repository is recorded. The LICENSE copyright line reads "Copyright 2015 Google Inc. All rights reserved.", and the maintainer follows that line as the rule states, a reviewer decision: the README names Raph Levien as main author and says development since 2023 is driven by Martin Pozo, Michael Howell, Roope Salmi and Martin Geisler, and the repository belongs to the pulldown-cmark organization. The GitHub API reports no owner name for the organization. firstRelease 2015 comes from the crate's first upload 0.0.1 (2015-06-04), the same year as the repository (created 2015-06-03). The latest stable release is 0.13.6 (2026-10-30); the registry and the GitHub release agree. The crate's major stays at 0 under semantic versioning, the same as comrak's record. The GitHub repository has 35 releases, none prerelease; the newest prerelease tag names are not recorded. The crate's 90-day download figure is 73638085 (recent_downloads on the crates.io API); the total is recorded. The ecosyste.ms crates.io figures are the dependents recorded above; its latest_release_number field is stale and not used. The README names the CommonMark spec and GFM extensions (tables, task lists, strikethrough, footnotes) as supported; those are syntax features and are not recorded as fields. The README mentions the hoedown project only as a design reference, not as an alternative. The Rust toolchain requirement is a build requirement for crate users, recorded as runtimeMin because the crate ships as source for cargo to build. The README's install route is cargo ("Or add this package as dependency of your project using `cargo add`"), recorded as installMethod; the crates.io API's rust_version for the latest release matches the README's 1.71.1 and both are recorded as the minor, 1.71. The README says the library comes with a simple command-line tool for rendering to HTML, built by default, and that its parser is an iterator of events with an HTML renderer in the crate; the README also names optional highlight (==marked==, rendered as <mark>) beside the footnote, table, task list and strikethrough extensions. The repository description calls it an efficient, reliable parser for CommonMark.
