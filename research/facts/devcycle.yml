notes: "The record covers the hosted DevCycle service. The homepage banner says \"DevCycle is Now Part of Dynatrace!\", and the terms page says that references to Taplytics Inc. (dba \"DevCycle\") mean the Dynatrace Inc. subsidiary that provides the Services, so the status stays hosted-service and the maintainer is the Dynatrace entity that the legal notices name. Taplytics Inc. is the name the SDK repository's LICENSE gives (github.com/DevCycleHQ/js-sdks, MIT, \"Copyright (c) 2025 Taplytics Inc.\"); the SDK repository and its figures are not recorded, and @devcycle/js-client-sdk had 54,476 downloads for 2026-10-26 to 2026-11-01 (a week), which goes to notes only. The homepage calls the SDKs open source (\"Open-Source SDKs\"). The security page says data residency is handled on request (\"If you have specific data residency requirements; contact us\"), and the hosting region is not stated, so regions is not recorded. The security page also names SOC 2 Type II; no field holds it. The pricing page lists Free, Pro and Enterprise tiers and SAML SSO on the Enterprise tier; tiers are not a paid edition. The maintainer and parent rows are the reviewer's decision: the terms name a Dynatrace Inc. subsidiary as the provider and a Dynatrace LLC address for legal notices. The homepage describes built-in support for OpenFeature SDKs, and the pricing page counts usage per client-side monthly active user and per event; neither is recorded as a field. The site footer links LinkedIn (linkedin.com/company/devcyclehq), not recorded as a field. The privacy notice page answered 404 at the URL tried, so the privacy statements are not used."
