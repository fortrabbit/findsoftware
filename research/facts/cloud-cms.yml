notes: >
  In doubt: criteria 2 and 3. The Kubernetes page says "please reach out to support@gitana.io for these files" for the 4.0 configuration files, and the self-managed overview calls the Docker Compose route deprecated, so no public install documentation or public images are known. Public install docs or published images would settle it and return the record to listed. Otherwise a self-managed option on a commercial license exists, so it is not a hosted service: the releases page says the product suite is delivered as containers, Kubernetes configuration files and Helm charts to subscription customers, the Docker page documents the images (API, UI, virtual and web shot servers) and the kits, and the Supported Stacks page lists MongoDB and ElasticSearch tiers that customers manage themselves. The Kubernetes page says the 4.0 configuration files are available from support, and the self-managed overview calls the Docker Compose route deprecated;. The pricing page also lists hosted plans and a Developer Edition listed as free; the record does not say what it limits. The site brands the product as Gitana and the product page as Cloud CMS; the record keeps the CSV name Cloud CMS. ElasticSearch is the secondary index for full-text search per the Kits page, so it is not recorded as the content store. The GitHub organization gitana (Gitana Software, Cloud CMS) publishes drivers and libraries (JavaScript, Node.js, Java and others), none of them the server, so no repository fact is recorded. The releases page lists the 3.2 line up to its newest entry while the documentation also has a 4.0 edition, so currentMajor is not recorded. The company page names the founder and a 2010 founding, which is a company date, not firstRelease. The Business plan lists Single Sign On and the Plus plan Multi-Factor Authentication; the docs name Okta, Keycloak and Ping integrations, which are not recorded as fields. The homepage also links to LinkedIn, which has no field.
