notes: >
  successorOf vuex comes from the introduction, which says Pinia implements most of what was planned for Vuex 5 and became the new recommendation; the FAQ also answers "Is Pinia the successor of Vuex?" with "Yes". importsFrom vuex comes from the Migration from Vuex guide. The introduction page says Pinia's API is very different from Vuex 4 and that mutations no longer exist; that is a comparison to a predecessor, not recorded as a field. The introduction says Vue 2 support was dropped in 2025; the current release targets Vue 3, which the README states as "works with Vue 3". The README's v2 branch link is for an older Vue 2 version and is not recorded. The Server Side Rendering support and the Nuxt pages are compatibility and integration pages; per the dev-libs rule, SSR is not a renderingModes value and no runsAs is recorded, because no page states where the store runs. The @pinia/nuxt and @pinia/testing packages are separate packages on the same repository, and the release list shows their tags beside the pinia tags; the pinia figures come from the pinia package only. The installation page says @vue/devtools-api is a required peer dependency used by the devtools integration. The repository's default branch is v4, which the LICENSE and README paths use. The oldest tag v0.0.1 and the npm first upload fall in 2019, the year of firstRelease. The x link is the author's account in the homepage navigation bar, recorded as a homepage social link. The homepage and docs carry sponsor and donation links that are not fact fields. The homepage navigation links the GitHub Discussions of the repository as Discussions, recorded as the forum; the chat.vuejs.org link is the Vue community chat, not recorded as a chat of this project. The Getting Started page says a store is an entity holding state and business logic that is not bound to the component tree, with the three concepts state, getters and actions. The same page says Pinia targets modern browsers and uses Object.hasOwn(), so older browsers need a polyfill such as core-js. The README says the latest version works with Vue 3 and points to the v2 branch for Vue 2.
