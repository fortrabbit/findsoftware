notes: >
  HTTP client for Rust, accepted under the wave 60 ruling for HTTP clients; the CSV boundary state is not a record status. No homepage: the README names no website of its own, and the repository's homepage field points at docs.rs, the crate's generated API documentation, so only docs is recorded. The GitHub license field reads Apache-2.0 alone, while the README and Cargo.toml at v0.13.5 both give "MIT OR Apache-2.0" (README: "Licensed under either of", Apache License Version 2.0, MIT license); the two licenses are separate entries. The maintainer follows the LICENSE-MIT copyright line; LICENSE-APACHE has no copyright line. currentMajor is 0 because the crate is pre-1.0; the minor line is 0.13, and the latest stable release is v0.13.5 (2026-09-08). v0.13.0-rc.1 (2025-12-23) is older than the latest stable release, so no latestPrereleaseDate. The crates.io figure counts all downloads of every version; crates.io reports 269385696 for the last 90 days on the same date. The README's optional features (async and blocking clients, WASM, system TLS through the native-tls feature) and the TLS requirements section are not recorded as fields. The README "Commercial Support" section offers private support and is not a paid edition. The install route is the Cargo.toml dependency line shown in the README example, recorded as cargo. firstRelease: the crates.io upload of 0.0.0 on 2016-10-16 is the oldest registry upload; the v0.1.0 tag is dated 2016-11-10.
