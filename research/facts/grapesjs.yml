notes: >
  Listed as a library: the open-source package is a JavaScript library a web creator adds to an application, and its README says it was designed for use inside a CMS. The domain grapesjs.com is the one the repository and the README name as the project site; its front page now presents the Studio SDK, and the open-source documentation is at grapesjs.com/docs. The footer of the site reads "Grapes Studio Inc."; the LICENSE copyright line names Artur Arseniev, which is recorded as the maintainer. Grapes Studio (a hosted editor) and the Studio SDK are commercial products the README and docs link to; its pricing page at grapesjs.com/sdk/pricing lists plans from a free one upward, but no page read states a license for the SDK or which features the open library lacks, so paidEdition and pricingPage are not recorded. The GitHub license field reads NOASSERTION; the license is recorded from the npm package grapesjs, whose license is BSD-3-Clause, and the README states BSD 3-clause. The package.json at the repository root has no license field, and the core package.json names BSD-3-Clause. The npm weekly figure is for the week 2026-10-12 to 2026-10-18. The npm rc tags are older than the latest release, so no prerelease date is recorded. runsAs is left out: the README and the getting-started page show a script tag and a Node environment import, and no page says where the editor runs. The repository is a monorepo; the grapesjs package is the one the install docs name.
