notes: >
  The homepage vertx.io answers 200 over HTTPS and is the project's own site. The repository has no GitHub releases or tags, so the registry rule applies: Maven Central io.vertx:vertx-core has 5.2.2 as its release and latest version, uploaded 2026-10-21 by its pom Last-Modified header, which sets currentMajor 5 and latestReleaseDate. No prerelease date is recorded. The first upload found is org.vert-x:vertx-core 1.2.1.final, pom Last-Modified 2012-07-26; the GitHub repository was created in 2011, but no release from that year was found, so firstRelease is 2012. The homepage and docs say Vert.x is "a toolkit, not a framework", which bears on the CSV category framework; it is recorded as toolkit, and whether it meets the web-framework criterion is for a reviewer to decide. The GitHub license field is NOASSERTION because LICENSE.md holds two licenses; both statements are recorded. The docs text states JDK 11 or higher in the Get started guide; the core manual says some features need Java 21 (virtual threads) and some need JDK 16 (Unix domain sockets), which are feature requirements and not the minimum. The Eclipse Foundation AISBL legal entity is taken from the copyright agent address; the copyright page is the foundation's own legal notice. Discord is the invite linked from the homepage; the resources page lists the user Google group, Stack Overflow and other channels. The homepage and resources page link a YouTube channel and the vertx-dev Google group, which have no field. Cassandra is documented as a database module but no quote was copied, so it is not recorded. The Redis client is a key-value store, recorded under databases because the docs nav lists it under Databases. The org.vert-x Maven group uses the 1.x line; no pre-1.2 upload was found on Maven Central.
