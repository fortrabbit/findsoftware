notes: >
  The site says Actionhero "has a successor, Keryx, at keryxjs.com"; that relation belongs on a Keryx record, not here, and is recorded as a pointer only. The site offers "Premium Training & Review" at "starting at a flat rate of $200/hr" and an Enterprise support contract with no price; these are paid services, not editions, so paidEditions stays unknown. No database or Redis requirement and no Node minimum appear on the pages read, so those stay unknown. The runtimeMin is the npm package's declared engines field, recorded as declared.
