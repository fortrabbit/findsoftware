notes: >
  The primary source is the Forgejo instance at git.deuxfleurs.fr, which holds no detected license; the GitHub mirror deuxfleurs-org/garage (default branch main-v2, 4786 stars, 100 contributors counted there) reports AGPL-3.0 and is the source for the GitHub figures, not the Forgejo, which has 179 stars and was not counted for contributors. The highest stable release is v2.5.0 (2026-10-24) on the Forgejo; the v1.3.x line (latest v1.3.1, 2026-01-24) is older, and the tags v1.99.3-internal and the v2.0.0-rc1 and beta releases are not stable releases. firstRelease is the oldest Forgejo release, v0.3.0 (2021-05-28); the mirror was created 2021-11-17. The Deuxfleurs legal notice names the association as "Association loi 1901" with its seat in Lille, France; the association is the publisher and host of the Garage site and repository. The docs say Garage serves static websites from buckets only, with no redirects and no PHP or other languages, and the homepage navigation offers "Host a Website"; no renderingModes or runsAs static fact is recorded, because Garage is storage that serves files rather than a site generator. The Docker Hub count is for the dxflrs/garage image named in the quick start. The binary packages page lists Alpine, Arch, FreeBSD, NixOS and conda-forge, recorded as one distribution-package route with one quote. The repository field's URL is the from-source page that names the Forgejo repository as the primary source.
