notes: >
  No project site: the repository's homepage field is empty and the npm homepage names the repository, so no homepage is recorded and the README is the documentation. The npm package validator is the one the install lines name, and its registry figures are its own. The README title is validator.js; the repository and the registry package share the name validator in their URLs. Stars and contributors belong to the repository. The Gitter chat and the Open Collective backers and sponsors links sit in the README badges; Gitter is a chat and no field holds it. The README lists six maintainers; the LICENSE copyright line names Chris O'Hara, and the record follows the license. The README says XSS sanitization was removed from the library and points to other projects for it; those are not fact ids, so nothing is recorded from that sentence. firstRelease is the npm first upload, version 0.1.0 on 2011-01-04, which is older than the oldest GitHub tag, 0.5.0 with a commit date of 2013-04-08. The npm manifest engines field asks for Node.js ">= 0.10"; the library runs in a browser as well, and the README shows server-side and client-side usage without naming Node.js as the runtime, so no runtime is recorded. The README's CDN block is a bare unpkg script tag with no route sentence of its own; it belongs to the script tag route. The GitHub language field says JavaScript. The README says the library validates and sanitizes strings only, that other input must be coerced to a string first, and that passing anything else results in an error; it lists validators such as isEmail, isDate and isCreditCard, and sanitizers such as escape, ltrim and normalizeEmail.
