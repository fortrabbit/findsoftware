notes: >
  The gem's metadata names nadarei.co/mina as its documentation; that page is live with the project's own text and is recorded as homepage, the only own site found. The repository moved from the nadarei account to mina-deploy (the old gem source link redirects); the move is no end signal and the repository is not archived. The README says the project is "maintained and sponsored by Infinum" and the gemspec names the author Stjepan Hadjić; the maintainer is the company as its legal notice names it, Infinum d.o.o. za računalne djelatnosti i usluge in Karlovac, Croatia. The infinum.com footer reads "Infinum Inc.", another entity, and is not used. The gem is MIT in the gemspec and the LICENSE file; GitHub reports NOASSERTION because of the LICENSE layout. The only GitHub release is v1.2.5 (2023-10-03); the repository's older tags are repository-import tags (release/...) and not releases, so firstRelease is the first RubyGems version, 0.1.0 (2012-06-06). The RubyGems history holds 38 versions, and its latest matches v1.2.5. runtimeMin is taken from the README at the v1.2.5 tag; the gemspec at that tag declares no required_ruby_version. The 3rd party modules page says many listed modules are not updated to mina 1.x. The default branch's last commit is dated 2023-10-03; the last push is dated 2024-08-01. The getting-started guide runs mina setup from the developer's computer, which connects over SSH to create the folders, and mina deploy runs the deploy task. The RubyGems download figure is the gem's total count, with no period.
