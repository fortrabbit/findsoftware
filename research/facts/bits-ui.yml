notes: >
  The getting-started page describes the library as a collection of headless component primitives for Svelte 5, which is the basedOn value. The repository has the Discord invite in its README and no social link on the homepage. The npm registry holds versions of an unrelated bits-ui package from 2017 (1.0.7 and earlier); firstRelease uses this project's first version, 0.0.0 on 2023-08-17, and the repository was created 2023-08-06. The highest stable GitHub release is bits-ui@2.20.2 (2026-10-23), and the npm latest is the same version. The LICENSE names Hunter Johnston, Pavel Stianko and CokaKoala as copyright holders; the maintainer is the npm author field, which names Hunter Johnston. The npm weekly figure is the sum of daily downloads for 2026-10-18 to 2026-10-24 from the range endpoint, because the last-week endpoint returned the window 2026-06-25 to 2026-07-01. The README credits a design team, Bitworks, for the documentation and example components.
