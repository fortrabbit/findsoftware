notes: >
  Doubt: this is an installable library (npm and CDN routes, a repository with source), but its use requires a Mapbox account and an access token and its license is the Mapbox TOS, so it is tied to a hosted service. Whether it is a library (criterion 2 holds) or a hosted-service record is for a person to decide; the status stays stub until then. The README says "To get started with GL JS or any of our other building blocks, sign up for a Mapbox account", and the overview page shows an accessToken parameter in its examples. The LICENSE.txt header reads "mapbox-gl-js v2.0" and states the Mapbox TOS; the older v1.13 and earlier releases are BSD-3-Clause, which the same file states, and that history is not recorded as the license. The license fact is the LICENSE.txt wording (the Mapbox Web SDK license that applies the Mapbox TOS); the import derives licenseModel from it, none is typed. The footer social links on the product page are the company's accounts. The npm license field reads "SEE LICENSE IN LICENSE.txt"; GitHub reports NOASSERTION. The file carries a clause that the SDK sends limited de-identified location and usage data, which is recorded here only as the license text, not as a fact. The README says the library takes map styles that conform to the Mapbox Style Specification, applies them to vector tiles and renders them using WebGL, and that the repository owner is Mapbox, Inc.; the TOS names Mapbox, Inc. as owner and operator of the site. The Mapbox sign-up sentence is the README's; the get-started page offers CDN and npm routes. The Mapbox TOS (www.mapbox.com/legal/tos) names Mapbox, Inc. as the owner and operator of the site and no street address or country, so hqCountry is not recorded. The homepage is the Mapbox GL JS product page, the docs root is the overview page. The repository README also names mapbox-gl-native, the native SDKs and React Native bindings, which are other repositories and not recorded. firstRelease is the tagger date of tag v0.1.0 on 2014-07-08, the oldest tag that is read. The stars and contributors belong to the repository, which also holds code and test fixtures shared with the native SDKs. MapLibre GL JS (record maplibre-gl-js) is a fork of the v1.x line of this library, not of the current release.
