notes: >
  Status: accepted, no end signal. The repository is not archived, the npm latest version 3.13.1 is not deprecated, and the default branch was pushed on 2026-11-12. The GitHub license field reads NOASSERTION, which is why the CSV row says no license was detected; the README states the ISC license and LICENSE.md is the ISC text with the copyright line "Copyright (c) 2020-2026 by Jos de Jong", so the license is recorded from the README and the maintainer from LICENSE.md. The npm package reports ISC as well. The successor statement is the README section "Differences between josdejong/svelte-jsoneditor and josdejong/jsoneditor", which says this library "is the successor of" the older editor; the older record (jsoneditor) keeps its own status. The homepage is jsoneditoronline.org, which the README names as "Try it out" and the npm homepage and GitHub homepage fields name too; the web application is the library's own demo and the reviewer should confirm it as the project's site, as the jsoneditor record asked. The README calls the web application a web-based tool; it is not recorded as hostedOffering because the README offers it as a demo of the library, not as a hosted service for the library. The runsAs browser value comes from the README sentence "can be used in any browser environment and framework" and the vanilla section's "use the library straight in the browser". The Svelte usage section names Svelte 5 for version 3 and Svelte 3 or 4 for version 2; that is a peer requirement, not runtime. The vanilla-jsoneditor package is a second npm package named in the README; the npm weekly figure is for svelte-jsoneditor, the package the Svelte install line names. The CDN import in the standalone example is a code comment, not a prose install route, so no cdn installMethod is recorded. The README uses Ajv for JSON Schema validation and names JMESPath, JSONPath and lodash query languages; those are dependencies and features, not basedOn, i18n or fields. The README asks commercial users for voluntary sponsorship, which is no license term and no paidEdition. The ecosyste.ms dependent counts were read on 2026-11-16. firstRelease is 2021, the year of the first npm upload and the repository creation.
  The README names tree, text and table modes, requires Svelte 5 for version 3 and Svelte 3 or 4 for version 2, and says the successor uses Svelte and CodeMirror where the older library used plain JavaScript and Ace.
