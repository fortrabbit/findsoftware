notes: >
  Stub because the homepage named in the README (https://www.ferretdb.com/, which ferretdb.io also redirects to) returns a Squarespace "Website Expired" page on 2026-10-29, so no homepage is recorded; the project itself is live (docs.ferretdb.io answers, v2.7.0 is the latest GitHub release of 2025-11-10, the repository was pushed 2026-06-05), so the stub settles when a homepage answers again or the README names a new site. Maintainer "FerretDB Inc." is the name the README (contact line) and the docs footer use; the legal form and hqCountry are not on any readable page. The install docs name the GHCR image ghcr.io/ferretdb/ferretdb, so the Docker Hub ferretdb/ferretdb count (31262 pulls on 2026-10-29) is not recorded as dockerPulls. The runtime minimum is not recorded: the go.mod Go line is a build requirement and the release ships binaries. Other links not recorded as fields: the Slack chat (slack.ferretdb.io), the blog (blog.ferretdb.io), the public roadmap and the other managed services Civo, Tembo, Elestio and Cozystack, listed in the README. The docs version menu lists v2.8, which has no GitHub release. The v1 line lives on the main-v1 branch and is not the current major. Fields coined: none.
