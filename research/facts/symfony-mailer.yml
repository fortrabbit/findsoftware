notes: >
  Status accepted under Frank's 2026-11-16 ruling: symfony-mailer sends a site's email, like phpmailer; this row was a boundary row. Criterion 1: a library a site or app calls to send its email, with HTML bodies through Twig integration; the email templating is a templating fact. Criterion 2: installed with Composer from Packagist (symfony/mailer). Criterion 3: the package page and the mailer docs. Criterion 4: not archived, no abandoned or deprecated flag; the latest stable release v8.1.10 is dated 2026-10-28, and the repository has no stable v8.1.11 release as of 2026-11-16. The repository is a read-only split of symfony/symfony, whose README sends issues and pull requests to the main Symfony repository; stars, contributors and downloads belong to the split. The maintainer follows the LICENSE copyright line (Fabien Potencier); Symfony SAS, the company behind Symfony, appears in the Symfony legal notice at sensiolabs.com and is not recorded here. The docs name transports for sending through SMTP, the local sendmail binary, and third-party services such as Amazon SES and Mailgun, installed as separate Composer packages; a site that uses such a service depends on it, and that dependency is not recorded as a field. The docs say the component supports multipart messages, Twig integration, CSS inlining and file attachments, and that installing it also installs the Mime component, which creates the email messages. The firstRelease is 2019, the year of the oldest Packagist version (v4.3.0-BETA1, 2019-04-26); the packages page gives March 2019.
