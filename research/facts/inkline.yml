notes: >
  The repository moved from inkline/inkline; the GitHub API and the npm repository field now resolve to uxfront-com/inkline, and the record uses the current address. The default branch README is the monorepo's Vite+ starter text, while the commits of October 2026 are Inkline work, so the README is not read as an end statement. The npm package inkline (2.6.1, 2023) is a different, older package that the CLI command "npx inkline init" resolves to; the current CLI is @inkline/cli (1.2.1). The library is recorded under @inkline/inkline, the package the manual install page names, which carries the latest stable release 4.7.2 (2024-11-18), matching the GitHub release. The default branch of the repository now holds a rewrite (a compiler that emits components for several frameworks, with the earlier codebase archived under .old, all packages unreleased), while the published @inkline/inkline 4.x and the website still describe the Vue library; neither says the Vue library has ended, so the status stays accepted and the doubt is for a reviewer. The manual installation page lists Sass as a development dependency and names Vite.js, Webpack.js, Astro, Rollup.js and Parcel.js as build tools; the Nuxt page documents a Nuxt setup. The homepage shows an "Inkline Pro" released-later notice with a newsletter form: no paid edition exists yet, so no paidEdition, and the form is not a newsletter link. The homepage footer reads "Copyright © 2017-2023"; the page is otherwise current. The CDN page quotes unpkg @inkline/inkline@3.0.5, older than the latest stable 4.7.2. Contributors: the contributors endpoint returns one entry for this repository, which looks like a history artifact, so the count is left out for a reviewer to decide. firstRelease 2019 is the first npm upload (1.7.0, 2019-01-27); the oldest GitHub release (1.12.2) is 2019-04-16.
