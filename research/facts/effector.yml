notes: >
  Monorepo: effector/effector holds the core effector package and the effector-react, effector-vue, effector-solid and @effector/next packages, so stars and contributors belong to the repository, and the npm and dependent figures are for the core effector package the install guide names. The newest GitHub tag is effector-vue 23.3.0 (2026-10-27), a binding; latestReleaseDate is the core npm latest 23.4.4 (2025-09-11), and currentMajor 23 comes from the core's newest GitHub release effector@23.4.1 (2025-07-07). The bindings are not basedOn: the homepage calls the core framework agnostic and says it is tested with React, Solid and Vue. firstRelease is the oldest npm upload, 0.0.1 on 2018-01-17; the community page says the first version came in 2018. The maintainer is the LICENSE copyright holder and the npm and package.json author, Zero Bias; the community page credits Dmitry Boldyrev with the first version and lists a core team, and no legal entity or country is stated, so hqCountry is absent. The engines field of the core manifest at 23.4.4 is node >=11.0.0, recorded as runtimeMin 11. The homepage states "Universal: integrates with popular frameworks but can run in any JavaScript environment" and the README names Node.js among its platforms; no runsAs is recorded because no page says where the app runs. The get-started page gives legacy-browser builds for IE11 under the compat import paths; that is a browser support list, not a runsAs statement. The migration guide from Redux names Redux, which has no record, so importsFrom and alternativeTo are absent. The community page also lists a Telegram group, a Gitter room and a Reddit community; only the Discord, Reddit, X and GitHub Discussions links have fields. The homepage stats (4,854 stars, 6.2M downloads) are not recorded; the API figures are. The homepage presents an Effector Atlas and a changelog; neither is a field.
