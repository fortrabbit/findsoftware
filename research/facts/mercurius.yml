notes: >
  Status is accepted. The homepage https://mercurius.dev/ answers 200 with a docsify shell and no page text, so it is listed as unreadable and the homepage value is taken from the npm package's homepage field. The documentation sits in the repository's docs folder, which the README links section by section; the docsify site renders nothing without JavaScript, so the docs fact points to the repository docs folder the README lists. The runtime and runtimeMin come from the engines field of package.json at the latest tag v16.12.1; the range ^20.9.0 || >=22.0.0 gives the Node.js 20 line from 20.9.0 as the oldest supported major. The README names no Node.js version. The package is a Fastify plugin, so basedOn is recorded from the README sentence that calls it an adapter for Fastify. The README says the project was previously published as fastify-gql below version 6.0.0; that is the same project under an older name, so no successorOf is recorded. The npm package named mercurius has uploads from 0.0.1 in 2015 whose repository field names marco-c/mercurius; the README says that name was donated from a different codebase, so those uploads do not set firstRelease. The GitHub API answers 301 Moved Permanently for the old repository mcollina/fastify-gql, which npm names as the repository of fastify-gql, and the npm package fastify-gql, the project's name before it became Mercurius, has uploads from 0.0.1 on 2018-09-11, which sets firstRelease; the GitHub tags of this repository start at v0.7.0, committed 2019-01-07. The maintainer follows the LICENSE copyright line, Matteo Collina and contributors; the README credits NearForm and Platformatic as project sponsors, which is not recorded as a field. The README lists subscriptions, batched queries and persisted queries as features, and lists federation and gateway as separate packages (@mercuriusjs/federation and @mercuriusjs/gateway) and names GraphQL over WebSocket in its docs; these are notes, not fields. The latest stable release is v16.12.1. The v15.0.0 prerelease dated 2024-09-09 is older than the latest release, so no latestPrereleaseDate is recorded. The npm weekly figure covers 2026-11-01 to 2026-11-07; the ecosyste.ms counts were read on 2026-11-16. The contributor count excludes anonymous contributors. The quick start registers the plugin with a schema and resolvers on a Fastify instance and answers a query with reply.graphql.
