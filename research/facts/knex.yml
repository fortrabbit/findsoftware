notes: >
  The npm and GitHub figures are for the query builder package knex/knex, one package in one repository. Knex's own docs also list CockroachDB and Amazon Redshift as dialects (the homepage and the installation page); neither is in the databases vocabulary, so they are not recorded as values. The installation page says Knex runs in Node.js and can be built for the browser with a bundler, limited to WebSQL, and that browser builds are for learning and discouraged for queries that run on the server; no runsAs statement is recorded because the page does not say the library runs as a process. The README's Python 3 with setuptools is a build requirement for native database drivers in a local checkout, so it is not a runtime. The README names the Gitter channel as the support chat and a personal Twitter handle of a maintainer; neither is recorded as a project account. Objection.js, MikroORM and Bookshelf are named in the README as ORMs built on knex, a relationship the project states as "knex-based"; they are not alternatives and are not recorded. The lowest runtime is the Node.js version the README names (16+), matching the engines field at tag 3.3.0. The GitHub stargazer and contributor counts belong to this repository. The repository's first GitHub release is not the first upload: the npm package 0.0.0 dates from 2013-05-01, which sets firstRelease.
