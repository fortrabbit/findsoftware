notes: >
  The LICENSE copyright line names Alex Bilbie, which sets the maintainer. The README says Alex Bilbie created the library and credits Andy Millington as its principal developer and maintainer; the README also says Alex Bilbie developed and maintained it until 2017, and both names stay in notes. The sso value oauth2 records the protocol the README names for the library, an OAuth 2.0 authorization server; the library issues OAuth grants inside the application that embeds it. A reviewer may decide that OAuth 2.0 authorization is not single sign-on and drop the value. The grants (authorization code, client credentials, device authorization, implicit, refresh and resource owner password credentials) and the RFCs it implements (6749, 6750, 7519, 7636 and 8628) are coined kinds and stay in notes. The README requires the openssl and json PHP extensions. The README's community integrations (Drupal simple_oauth, Laravel Passport, an OAuth 2 server for CakePHP 3, a Mezzio package, a Symfony bundle and a CodeIgniter 4 package) build on this library; the README does not say they are built on it as a parent, so they are not recorded as basedOn. The first tag, 0.1, dates from 2012-07-31, before the first Packagist version (0.2, 2012-08-27). The GitHub figures and the Packagist total belong to the one repository and package named here.
