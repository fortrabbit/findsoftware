notes: >
  The repository is archived on GitHub (archived: true, pushed 2026-10-12, updated 2026-10-15), and the homepage still links to it with the text "view it on GitHub". No end statement was found on the homepage, the news, about or getting-started pages, or the README, so status is discontinued on the archive flag alone; a reviewer should confirm this against a successor repository before publishing. The README is short and states MIT for all files. The homepage shows version 2.0.24, which matches the highest tag v2.0.24; the repository has no GitHub releases, so currentMajor comes from the tag list and latestReleaseDate is the date of the annotated tag v2.0.24, not a release object. No npm package named almace-scaffolding exists (registry 404), so npm fields are absent. firstRelease is the year of the commit behind the oldest tag, v0.0.19.
