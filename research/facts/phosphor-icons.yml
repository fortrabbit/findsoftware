notes: The record stands for the icon family. The repository recorded is phosphor-icons/core, which holds the SVG assets and catalog that the family's framework packages build on; the site's source is phosphor-icons/homepage, a separate repository with its own figures (7,732 stars on 2026-10-27), not recorded as the record's. The npm figures are for @phosphor-icons/core, the package the core README tells users to install. The sibling packages (@phosphor-icons/web, @phosphor-icons/react, @phosphor-icons/vue and others) are separate npm packages with their own figures and are not recorded. The core README says it hosts the raw SVGs and catalog data (tags, categories, release versions) of all icons in the family, that the catalog serves as the basis for the site's search, and that the package is a dev dependency in the build of some of the framework-specific libraries. It also says framework and build tooling may need custom type declarations to import the SVG files. The site at phosphoricons.com is script-rendered; the text read is the noscript fallback, which the page serves to visitors without JavaScript, and the x link comes from it. The same fallback credits Helena Zhang and Tobias Fried as the creators; the LICENSE and the core README name Phosphor Icons, so that is the maintainer recorded. firstRelease is the oldest GitHub release (v0.5.0, 2020) of the homepage repository, which predates the npm history of @phosphor-icons/core (first publish 2023-01-08). The latest stable release is the npm latest of 2024-03-29; the highest GitHub release of core is a 2.x tag, the same major. The site's structured data gives the location Denver, CO, in a script block that the quote check cannot read, so hqCountry is not recorded. The contributors count is for the core repository.
