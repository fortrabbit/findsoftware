notes: >
  MRML is the Rust crate mrml in the jdrouet/mrml repository, which holds the mrml, mrml-cli, mrml-wasm, mrml-python and html-compare packages; stars and contributors belong to the whole repository. The README badges point to jolimail/mrml-core, an older address of the same project, and the crate manifest names jdrouet/mrml as its repository, so the record follows the crate. The repository has no homepage: the GitHub homepage field and the crate homepage are empty, so no homepage is recorded. The README says "This project is a reimplementation of the nice MJML markup language in Rust" and the PyPI summary calls it a "Rust port of MJML": MJML is the record mjml, a port relationship that is not basedOn, forkOf or alternativeTo. The category email-templating is taken from MJML's own description on mjml.io, "The Responsive Email Framework", because the MRML README never uses the word email. The README says the JavaScript implementation "cannot run in the browser; the Rust one (and WebAssembly one) can", and the Rust one is a library crate, so no runsAs value is recorded; the WebAssembly build is in the mrml-wasm package of the same repository, published on npm as mrml, whose README shows import lines but no install sentence. The README's missing-implementations list names mj-style with inline set, and mj-include, tied to loading remote templates in WebAssembly, while the README also documents include loaders. The Python binding is published to PyPI as mrml, with a pypistats last-month figure recorded because the README names PyPI as an install route; the crate remains the core package. The crate's first upload is 0.1.0 on 2020-05-26, the same date as the oldest git tag, which fixes firstRelease at 2020. The maintainer is named in the workspace Cargo.toml authors at the mrml-v6.0.1 tag; the LICENSE file has no copyright line, and the record uses the name without the email. The latest stable crate is 6.0.1, so currentMajor is 6. Crate downloads are recorded as the crates.io figures; the ecosyste.ms counts are dependents of the crate. The crates.io metadata has no rust_version and the manifest sets no rust-version, so runtimeMin is not recorded.
