notes: >
  The docs site renders in the browser: its HTML carries only the title, so the homepage quote is the title and the docs fact cites the site's llms.txt index, which lists the getting-started page. The GitHub owner is the nteract organization, which the README links for its Code of Conduct; the maintainer follows the package.json author field, Elijah Meeks, as the wave 33 rule says, and the organization is not recorded as maintainer. The README says it "Requires React 18.1+ or React 19" and package.json lists react and react-dom as peer dependencies: a framework requirement, not a runtime field. The package.json engines field (node >=22.12.0) is a build or browser library requirement and is not a runtime. The README's "When to use something else" section names Recharts and Apache ECharts as the choice for other needs; it is recorded as alternativeTo for both (ids recharts and echarts). The LICENSE file is Apache-2.0 with a third-party notice for one vendored file (the d3-hierarchy circle-enclosure algorithm, ISC), recorded as a second license entry. Coined kinds left in notes: rendering target (SVG, Canvas, the README's "renders SVG automatically in server environments"), server rendering with the "use client" directive, the bundled MCP server and agent skill files, and the "deterministic chart validation" the package.json description names. The README's acknowledgments name sankey-plus as the base of the Sankey layout engine; it is one component's layout, not a parent of the library, so no basedOn. First npm version is 1.0.0-alpha.0 (2017-04-18), which is older than the oldest GitHub release (v1.0.2, 2017-09-05). The npm figure counts the semiotic package only.
