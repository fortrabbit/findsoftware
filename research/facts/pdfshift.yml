notes: >
  Hosted-service record for the PDFShift conversion API at pdfshift.io. The CSV row says there is no public SDK repository, but GitHub lists SDK repositories under the pdfshift organization (pdfshift-php, pdfshift-node, pdfshift-python); they are SDKs for the service, so their licenses, stars and downloads are not recorded per the hosted-service rule, and a reviewer should correct the row note. The homepage shows request examples for Python, NodeJS, PHP, Ruby, C# and cURL against api.pdfshift.io/v3/convert/pdf, no API style is stated on the pages read, the free plan's timeout is 30 seconds per the pricing page, and the docs list a sandbox mode, rate limits, webhook events, export to an S3 bucket, templates, API keys, logs and invoices. The homepage also states HIPAA compliance and a Business Associate Agreement, an MCP and agents page (pdfshift.io/agents/mcp/), and integrations with n8n, Zapier and Make; these are not recorded as fields. The pricing page lists a free plan of 50 credits a month and paid plans from 500 credits; the free plan is stated as a feature, and no prices are recorded. The pricing page says every paid plan includes all features, so no paidEdition is recorded. The homepage rating widget is not recorded. The terms state the company is a French single-shareholder company (SASU) and the footer says PDFShift is a French company; the company name is recorded with its legal form. The homepage links X (twitter.com/pdfshift) and LinkedIn (linkedin.com/company/pdfshift); LinkedIn is not a recorded field. No discord, forum, or newsletter link was found on the homepage. The 404 pages are the site's generic not-found page.
