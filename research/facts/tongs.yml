notes: >
  No homepage: the repository is the only project site. The example site https://tongs-example.datashaman.com named in the README is a deployed sample, not the project's site. The repository is archived (read only, last push 2021-06-29), and the Packagist package datashaman/tongs is flagged abandoned on version 1.2.1 with no replacement named. Install steps are not in the README; the only install and build steps found are in the sibling repository datashaman/tongs-example (composer install, vendor/bin/tongs), recorded as installMethod, buildCommand and runsAs local. A reviewer should decide whether the example repository counts as the project's documentation for criterion 3. The README calls the project WIP. The repository has no LICENSE file; the license is the MIT value in composer.json and the Packagist record. The maintainer is the author named in composer.json. The highest stable tag is 1.2.1 (major 1), and the GitHub release list is empty. The oldest tag is 0.1.0 (2020-01-23), which gives firstRelease. The static output is stated only as the S3 bucket destination in the README and as the built files in the example. The repository's composer.json and the Packagist record state PHP ^7.2 as the requirement for the 1.2.1 release.
