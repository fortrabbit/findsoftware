notes: >
  The repository is a fork of baygeldin/tantiny, which GitHub reports as archived and last pushed 2025-10-31; the README records the transfer of the gem to Altertable, so the archive is a move and no end signal. The gem's RubyGems authors are Sylvain Utard and Alexander Baygeldin, and the LICENSE copyright line names Alexander Baygeldin (2022); the maintainer is recorded as the README names it. The README says searches return document ids and the documents are not stored in the index, and that the index lives in a path or in memory. Precompiled native binaries come from GitHub releases; Rust is needed only when no binary matches the platform, so Ruby alone is the runtime. The README says the library needs no separate server or process, that a schema declares the indexed fields, that a search returns document ids, and that writes lock the index, so one writer process is recommended. Tantiny has no site of its own: the repository and the gem page are the only sources, so no homepage. The GitHub release tags are named tantiny/vX.Y.Z; the 0.2.2 and 0.3.x uploads on RubyGems predate the fork and carry the 2022 firstRelease.
