notes: >
  The self-hosting docs describe containers (a webapp with the dashboard, and a worker with the supervisor and runners) and the Kubernetes chart's components, but no page says the self-hosted services run as a daemon, service or server process, so runsAs is not recorded; a reviewer may decide that the webapp is always-on from the architecture text. The self-hosting overview's feature table marks warm starts, auto-scaling, checkpoints and dedicated support as Cloud-only, and the pricing page's Enterprise tier lists SSO and role-based access control; these are cloud features and are in notes, so sso and userRoles here rest on the self-hosted GitHub sign-in only. No paid self-hosted edition is stated, so no paidEdition is recorded. The pricing FAQ and the docs say the self-hosted version is "functionally the same as Trigger.dev Cloud with some exceptions". The SDK package @trigger.dev/sdk (version 4.8.3) declares MIT in its package.json and the npm registry; this is a second license statement, recorded as its own entry, and it covers the SDK only. The npm figure is the sum of the seven days 2026-10-26 to 2026-11-01 for @trigger.dev/sdk; the quick start installs the CLI with npx trigger.dev@latest, which is not recorded as the npm figure. The release tags are v4.8.3 and the Helm chart tags helm-v4.8.3, both on 2026-10-30; the chart and the platform share the version. The legal entity is API Hero Ltd, which trades as Trigger.dev; the terms say the Trigger.dev Service is provided by it, and the open source code is in the triggerdotdev organization. The website's compare pages (vs Temporal, vs BullMQ, vs Inngest, vs n8n) are the project's own: Inngest, n8n and Temporal have records; the BullMQ page is not recorded as alternativeTo, because BullMQ has no candidate row. The API reference's Management API overview says only "The Trigger.dev API"; the REST wording used for headlessApi comes from the query page. The runtime is not recorded: the Node.js version in CONTRIBUTING.md is a requirement for developing the repository, and the self-hosted stack ships as containers. The homepage footer links LinkedIn (linkedin.com/company/triggerdotdev, coined field, kept here). The architecture text says the self-hosted version is a set of containers split into a webapp and a worker that can be scaled independently; that does not state a process model, so runsAs stays unknown. Adoption: GitHub stars and contributors from the API (contributors counted over all pages); the homepage's "Star 16.7k" is the same figure.
