notes: >
  The npm package the install docs name is @daypicker/react, which the README calls the preferred package name for DayPicker v10 and newer; its figures are recorded. The older package react-day-picker is still published under the same v10.0.2 version: its weekly downloads for 2026-11-01 to 2026-11-07 were 46914731, its ecosystems.ms monthly downloads 187613236 (last month), with 879 dependent packages and 7782 dependent repositories. Those figures are for the older name and are not recorded as fields. The @daypicker/react package was created in 2026-04 and its ecosystems.ms record has no dependents yet. The npm figure for @daypicker/react and its ecosystems.ms figure are the current name's own counts. The README's "Discussion forums" link is the project's GitHub discussions, recorded as forum. The homepage shows no Discord or X link. The LICENSE copyright line names Giampaolo Bellavite with an email address and "and contributors"; only the name is recorded. The license page at daypicker.dev/license states the MIT License in its metadata. Calendar systems (ISO 8601, broadcast, Persian, Hijri, Buddhist, Ethiopic, Hebrew) and localization are described on the homepage; they are coined kinds and go here, not in fields. The homepage says DayPicker "relies on date-fns for date manipulation and formatting" and is "compatible with React 16.8 and later"; neither is a basedOn or runtime statement. The getting-started page says "The react-day-picker package name remains available in v10 for compatibility, but new projects should install and import from @daypicker/react". The homepage and docs menu link no Discord, X or Bluesky account.
