notes: >
  Status is accepted. The CSV row had boundary, and the scope widened on 2026-10-19 to a library on top of Flask; the record is listed because the project's own README calls it a web API framework and the install page names pip. The PyPI JSON endpoint carries no download figure, so pypiDownloads is the last_month figure from the pypistats API. The authors page names Grey Li as the creator and four maintainers (Grey Li, Jérôme Lafréchoux, uncle-lv and Farmer.Chillax); the maintainer field takes the creator. The LICENSE copyright line names Grey Li with the year 2021. The docs state Python 3.9 and Flask 2.1 as requirements. The tips page shows a reverse-proxy setup to a server on 127.0.0.1:5000, which is the basis for always-on. The PyPI history begins with 0.1.0 uploaded 2021-01-27, and the GitHub tags begin in the same year. The API documentation and OpenAPI generation are features of the framework; no headlessApi value is recorded because no page names REST or GraphQL as the interface style. The Twitter link is the one social account the README names. The credits line on the homepage says the project started as a fork of APIFairy and is inspired by flask-smorest and FastAPI; the migration pages cover Flask and Flask-RESTPlus/Flask-RESTX. The README also links a Chinese forum and an Open Collective page, which have no field.
