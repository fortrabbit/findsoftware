notes: >
  The docs index lists installation, templating, hooks, search and deployment pages, but those pages returned 404 when read, so the README stands in for installation and the homepage for the Cloudflare Pages note. The README says the Discord link is "coming soon" in a commented line, so no discord fact. GitHub's language statistics list Vento first (template files) and TypeScript second, with CSS, JavaScript and Shell after; the package under packages/ is the TypeScript part, and the language fact takes TypeScript from those statistics. The site footer also carries the label TypeScript. The README says "Integrated Pagefind for static search" and the homepage says "Vitto is optimized for Cloudflare Pages"; neither is recorded as a field. The adoption figures are 15 GitHub stars and 2 npm downloads for 2026-10-12 to 2026-10-18; criterion 5 has no threshold yet, so the reviewer decides. The repository was created 2025-10-15 and the first npm version is dated 2025-10-17.
