notes: >
  Searchkit is the npm package searchkit with the companion packages @searchkit/api (Node API, npm latest 4.14.0, MIT, no engines field) and @searchkit/instantsearch-client; the record uses the core package the install docs name. The npm weekly figure is the sum of the daily counts for the full week 2026-09-28 to 2026-10-04. The docs say Searchkit uses instantsearch and works with its libraries but do not present it as built on InstantSearch, so no instantsearch basedOn is recorded. The ecosyste.ms figures are for the npm package searchkit. The GitHub tags include v3.0.0 and canary tags; the releases list shows searchkit@4.16.0 as the newest stable release, and the npm latest is the same version. The repository's COPYRIGHT file names Ten Eleven Ltd. for 2015 to 2016; the site footer names Joseph McElroy for 2025, which is the name recorded as maintainer. The GitHub organization is located in London, UK, a profile field only, so hqCountry is unknown. The docs say Searchkit supports Elasticsearch 7.0 and above and OpenSearch 2.0 and above, and the README says OpenSearch 2.4 or higher; these are compatibility statements and are not recorded as fields. The homepage and docs say the search can run in the browser or through the Searchkit Node API, which the docs start with a Node server file; that server's always-on status is not stated as a value, so runsAs records only browser. The docs page "Migrating from Algolia to Elasticsearch" is a migration guide, not a fact field here. The homepage's "Why would I use Searchkit instead of Algolia?" is a FAQ, so no alternativeTo is recorded. The homepage's 4,563 stars figure differs from the API's 4,860; the API figure is recorded. The homepage and README name no X, Bluesky or Mastodon account.
