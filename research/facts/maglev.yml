notes: >
  The record is the open source gem (repository maglev-core, gem maglevcms); the install docs name gem 'maglevcms', and the rubygems name maglev-core does not exist. There are no GitHub releases: the repository has tags (v3.0.0.beta1 to v3.1.0), so the stable release date and major come from the maglevcms gem versions on rubygems (3.1.0, 2026-08-03). Rubygems downloads are a total. The SaaS Edition is a paid commercial license for one Rails application with private gems; its prices are on the pricing section of the saas-edition page and are not recorded. The docs introduction states that multi-site and multi-theme come with the SaaS plugin, so multisite is not recorded for the open source edition. The maintainer is the company the homepage footer names (NoCoffee); the LICENSE copyright line and the rubygems author name Didier Lafforgue, and no legal notice page was found, so hqCountry stays unknown. The homepage states that the gem is added like any Rails engine, which is the basis for basedOn. The CSV homepage was www.maglev.dev, which answers over https. Discord is the invite on the homepage. The record does not state runsAs, since the docs say only that visitors get HTML rendered by the app.
