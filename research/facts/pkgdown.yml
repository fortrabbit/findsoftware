notes: >
  The GitHub release list starts with a release tagged "old" (2016-09-26), which sets firstRelease; the first numbered release is v1.0.0 (2018-05-04). The latest stable release is v2.2.1 (2026-07-07), matching CRAN. The homepage and vignette show the same install command as the README. The CRAN page gives the maintainer as Hadley Wickham; the LICENSE copyright holder is "pkgdown authors", and the homepage lists Posit Software, PBC as copyright holder and funder. The homepage lists Hadley Wickham as author and maintainer. The GitHub API reports license NOASSERTION; the CRAN license line, which the homepage repeats, is "MIT + file LICENSE", recorded as MIT. The "over 12,000 packages" figure counts R packages that use pkgdown, as the homepage states it. No CRAN download figure is available from the registry pages read, so none is recorded. The README says the README becomes the homepage, documentation in man/ generates a function reference, and vignettes render into articles/. The getting-started page says that without GitHub the site must be rebuilt by hand with pkgdown::build_site() each time it changes.
