notes: >
  The homepage nav and the pom name OpenZipkin as the project; the GitHub organization is OpenZipkin (Organization). The community page names OpenZipkin as the volunteer organization that runs the project, and says Twitter originally created it. firstRelease 2016 follows the oldest tag, 1.0.0 (commit 2016-05-25); the 1.1.0 release record shows published_at 2013-08-27 but was created 2016-06-01 on a tag commit of 2016-06-01, so that date is not used. The pom copyright line reads \"Copyright The OpenZipkin Authors\". The community page links a Google Group (zipkin-user), recorded as forum. The Zipkin UI is a trace viewer with no built-in authentication (architecture page), so adminUi and sso are not recorded. Gitter (gitter.im/openzipkin/zipkin) is the project's chat, no field for it. The homepage x link is twitter.com/zipkinproject; no quote, a link only. The quickstart's Docker, jar, Homebrew and source routes are four installMethod entries. The slim image (openzipkin/zipkin-slim) is a second Docker image, not recorded as dockerPulls. Storage backends in the README: in-memory, Cassandra, Elasticsearch, MySQL, with Kafka and RabbitMQ collectors; databases records the three named on the architecture page.
  Further statements, all from the project pages read: the homepage says applications report data over HTTP or Kafka and that the UI data is stored in memory or in a persistent backend; the architecture page says "there is no built-in authentication in the UI!"; the README says the slim build supports in-memory and Elasticsearch storage and no messaging transports.
  The homepage says the UI lets users query by service, operation name, tags and duration, and that the UI shows a dependency diagram.
