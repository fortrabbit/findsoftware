notes: >
  Stub, criterion 2 in doubt: the community edition needs CE_LICENSE_KEY in the environment, and no page read says how a non-commercial key is obtained; the repository LICENSE is PolyForm Noncommercial, and the paid editions are bought on the self-hosting page. A page showing a free key route would settle it. Community edition: the self-hosting README says the community edition needs CE_LICENSE_KEY in the environment, free for non-commercial use, and the pages read do not say how a non-commercial key is obtained. The self-hosting page sells a Community license at a monthly price for commercial use, and the Enterprise license adds the unbranded widget, custom rules, audit logs, the Platform API and email support. The license statements are recorded as the project words them: the repository's LICENSE is PolyForm Noncommercial 1.0.0, the README says commercial licenses are available for the enterprise edition, and the self-hosting pages say commercial use needs a license under the EULA; the GitHub API reports NOASSERTION. The legal entity Intmaker OÜ (registry code and address) comes from the terms page; the homepage footer says the product was created in Estonia and hosted in the EU, which is not a headquarters statement by itself, and the address on the terms gives the country. The self-hosting stack needs a transactional email provider with SMTP credentials per the quickstart prerequisites. Runtime minimum is not recorded because the stack ships as container images. Coined kinds, recorded here only: proof-of-work captcha (described on the homepage as an invisible cryptographic task), adaptive difficulty, form proxy, EU-only endpoints, no cookies, and the widget embedded with a script tag or a React, Vue or framework component. Competitors named on the homepage without a record id: Google reCAPTCHA, hCaptcha, Cloudflare Turnstile. The status page and the integrations for WordPress, Magento 2 and TYPO3 are not recorded as fields. The first release is the oldest tag v0.0.1 (commit 2025-07-09); GitHub releases start at v1.28.0.
