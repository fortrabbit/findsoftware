notes: >
  The license is stated in two places at tag 1.7.0. The PHP file headers in index.php name the Open Software License (OSL 3.0) and point to a LICENSE.txt that is absent from the tag. The root LICENSES file contains a Creative Commons Attribution-NonCommercial 3.0 notice, an MIT license and an SIL Open Font License 1.1 text, and does not say which files each covers; the MIT entry is recorded as stated and the CC BY-NC notice is not recorded as a license. The GitHub API returns no license for the repository. The docs site at docs.thirtybees.com is for version 1.0.X and states PHP 5.5 to 7.1, which contradicts the 1.7.0 README and download page; the runtime facts come from those current sources. latestReleaseDate is the GitHub release date (2026-07-14 UTC); the download page gives July 13th, 2026. The maintainer is the company name from the contact page's mailing address; the about page names Michael Dekker and Lesley Paone as founders without a legal notice. The homepage Launch on Cloudways and hosting links carry affiliate parameters and are not recorded. Gitter chat, the Patreon page and the Facebook, LinkedIn and YouTube accounts have no field and are not recorded. The README at 1.7.0 says the software is still compatible with almost all PrestaShop 1.6 modules; no field holds that.
