notes: >
  Go module with no registry package, so no download figure is recorded. The homepage and the README both say the API is Beta. The README describes the commerce modules as built on the Flamingo framework, which has its own record. The imprint at aoe.com lists AOE Group GmbH and AOE Solutions GmbH, both in Wiesbaden, but no page states a country as the company seat, so hqCountry is left out; the x link on the homepage is the company account of the maintainer; the LICENSE names AOE GmbH, which is recorded as the maintainer. The homepage link on the repository is https://www.flamingo.me/flamingo-commerce.html and was read directly. The earliest GitHub release is v3.0.1 (2020-02-10); the repository has an older v3.0.0 tag with no release, not used for firstRelease. No prerelease is listed on the releases page. No install page states the server model, so runsAs and renderingModes are unknown.
  The README lists the modules as price, product, category, cart, payment, search, checkout, customer, order and w3cdatalayer, each a bounded context with its own ports and adapters, and shows an application loading them in its Flamingo bootstrap.
  The README and the homepage say the API is still Beta and that models and methods may change, so an update can need code changes.
