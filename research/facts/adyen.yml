notes: >
  Coined fields kept out of the file: the docs' libraries page says libraries are connected to managed package systems (Composer, Gradle, Maven, npm, NuGet, PyPi, RubyGems); the about page says Adyen was founded in 2006 in Amsterdam; the homepage links a LinkedIn company page (linkedin.com/company/adyen).   The record covers the hosted Adyen payment platform. The GitHub repository Adyen/adyen-node-api-library is the Node.js client library for the API, not the service, so no repository, license, stars or contributor figure is recorded; in notes only, it is MIT, 139 stars and last pushed 2026-10-30 (api, 2026-10-31), and its latest release v32.2.0 is dated 2026-09-24. The npm package @adyen/api-library had 340275 downloads for 2026-10-23 to 2026-10-29 (api); the candidates row figure of 135.8k a week is stale and not used. Adyen N.V. is the legal entity named in the terms; the seat address gives the country. The homepage and about page are marketing pages, so no product features beyond those stated are recorded. The homepage states "Backed by US, UK, and EU banking licenses" and "99.999% historical platform uptime"; neither has a field, so neither is recorded. The docs state Customer Area SSO and user roles; they do not state whether these are offered on every plan, so no plan tier is recorded. The homepage's Discord and Bluesky links are absent; the docs footer links twitter.com/adyendevs for developers, not recorded as a field. The docs' "Server-side libraries" page is the only language statement and lists package systems, not languages, so it is recorded here and not as a field. The pricing page states no free tier, and the pricing model field records the transaction fee wording only, without prices. The homepage's "Service Status" link is not a field. The candidates row names the npm package as the adoption figure; this is an SDK, so it stays in notes.
