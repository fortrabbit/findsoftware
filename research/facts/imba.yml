notes: >
  The documentation site imba.io serves an empty client-side shell on its homepage, /docs and /guides/getting-started (only the title and meta tags are in the HTML), so the homepage is recorded only for its title and the facts come from the repository README and the create-imba README. The repository's README recommends "the official guide" on imba.io, which could not be read. The category vocabulary has no language value, and the README calls Imba a language; the record takes framework from the README's "replaces e.g., Vue or React" line, and a reviewer may decide otherwise. The repository's GitHub releases are mostly plugin and extension tags, and its own v0.x releases sit below the registry's stable line; the npm package imba has stable versions only up to 1.5.2 (2019-12-30), and its npm latest tag is the alpha 2.0.0-alpha.253 (2026-08-10), so currentMajor is 1 by the registry rule and the 2.0 line is recorded only as a prerelease date. The README says "the tooling is still in alpha". The runtime Node is stated in the README as the backend ecosystem. firstRelease 2015 is the first npm upload (0.9.0, 2015-07-27), earlier than the oldest GitHub release (v0.14.4, 2016-02-23). The README says Imba comes with a built-in bundler based on esbuild and brings styles into the code, inspired by Tailwind; esbuild is a bundler, not a UI framework, so no basedOn. The engines field of the npm latest tag, which is the 2.0 alpha, asks for Node 20; the stable 1.x line is the current major, so runtimeMin is not recorded. The create-imba README lists four templates: a client-only application, a full-stack application with an Express server, a module and a CLI tool. The install line comes from the create-imba README, the scaffolder the core package's docs name.
