notes: >
  The repository is archived on GitHub (api: archived true, last push 2017-08-27), and the README names it as the project's source, so status is discontinued. The project has no homepage: the GitHub homepage field is empty and ducksoupdev.github.io/gulp-site-generator returns 404. No LICENSE file exists and GitHub reports no license; the license is the ISC statement in package.json. The maintainer is the author named in package.json. The highest stable GitHub release is v0.2.0 (2017-01-11); the repository also has tags up to v0.4.1 without releases, which are not used for the major. The README says the generator "creates a production-ready site that can be served by Nginx, Apache or another web server"; that sentence supports the static runsAs value. The first release year uses the oldest GitHub release (v0.1.8, 2015-02-26); the repository was created 2015-02-17.
