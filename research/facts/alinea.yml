notes: >
  The README describes a hosted option next to the open source part: "Self-host or Cloud: run the backend on your own database, or let Alinea Cloud handle sign-in and publishing." The Cloud service is recorded here only as a note, with no pricing. The docs quickstart page at alineacms.com/docs/quickstart returned 404; the README link "Read the full quickstart" is the quote used for the docs field, and the docs deploy page was read only through its HTML text. The main-branch README documents the 2.x preview and its quick start installs "alinea@preview"; the docs site getting-started page installs "alinea" (registry latest 1.7.0, matching the highest stable GitHub release). The Node.js 24 requirement is from the preview README, so runtimeMin is not recorded for the stable release. The preview tag on npm is 2.0.0-rc1, published 2026-10-14, recorded as latestPrereleaseDate from the npm time field. The README says Alinea "requires Node.js 24 or higher, React 19 and the Next.js App Router"; content types are defined in TypeScript in a cms.ts file, pages query content in server components with results typed from the schema, `alinea init` creates the schema file, the API route the dashboard uses and a first entry, and the website says content is bundled at build time; no page names a rendering mode, so renderingModes is left out. The first GitHub release in the release list is v0.0.1 (2022-04-11), so firstRelease is 2022 although the repository dates from 2021. Contributors from the Link header of the contributors endpoint (last page 12).
