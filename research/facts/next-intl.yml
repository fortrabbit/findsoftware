notes: >
  The repository is a pnpm monorepo (next-intl, use-intl, icu-minify and others) with one set of stars and contributors; the npm figure is for the next-intl package the install page names. The GitHub release v4.15.1 is the newest stable release of next-intl; the icu-minify tag is another package in the same repository and is not counted. The core library use-intl (the React and non-Next.js part) is documented on the core library page; the Next.js-specific parts are routing, Server Components and the plugin. The runtime requirements page says the Intl APIs need Node.js 13 as a minimum and names browsers as the compile target; this is a build requirement for a library that runs in the browser, so no runtime or runtimeMin is recorded. The homepage says next-intl is hosted on Vercel and presented by Crowdin; both are sponsors on the homepage, not a hosted offering of next-intl. The Crowdin localization workflow and the eloqnt CLI (a linter with translation support) are separate products that the docs name as companions. The npm deprecations on versions 2.14.0, 2.22.2 and 2.22.3 are old versions with a published notice, not the latest version. The docs source is in the repository docs folder; the getting-started and routing pages are read from next-intl.dev. The maintainer follows the LICENSE copyright line (Jan Amann); the npm author line gives the same name.
