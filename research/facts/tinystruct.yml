notes: >
  The homepage https://tinystruct.org answers over https and is the project's own site. The developer guide names H2, MySQL, SQLite and SQL Server; the website's database page lists PostgreSQL among the supported databases (and Redis, which is no database value here), so postgres is its own entry. The highest stable GitHub release is v1.7.37 (2026-10-26); v1.7.25 is a GitHub prerelease and is not the current major line. The oldest GitHub release is v0.1.0 (2021-01-01), its tag commit is dated 2020-12-31, and the Maven Central first upload is version 0.1.0 (2021-01-03), so firstRelease is 2021. The maintainer is the footer name on the homepage, James ZHOU; no legal form was found. The homepage's "Donate" link points to an Open Collective page and is not recorded. Requirements: the getting-started page needs a JDK 17 or higher and Maven; the one-command installer checks for both, and on Windows needs Git for Windows or WSL. runsAs local is the page's "Running as a CLI Application" section: the same actions run from the bin/dispatcher command line. The MCP server and the POJO generator are documented features with no field here, so they are not recorded. The homepage says HttpServer is the built-in default server and that Tomcat, the Netty HTTP server and Undertow are supported; the README says integrating Netty or Tomcat needs no separate container.
