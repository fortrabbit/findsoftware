notes: >
  The CSV boundary question, the release date, is settled by the refs feed, so the status is accepted. The sr.ht and git.sr.ht summary, README, LICENSE.md and refs pages answer to the agent's User-Agent and are read as pages; some git.sr.ht item URLs answer HTTP 418, so the README is read at its blob URL. The refs RSS lists every tag with its pubDate; v0.9.0 (2026-08-02, -0400) is the highest stable tag, and v0.0.1 (2020-12-07) is the oldest, so firstRelease is 2020. The homepage download list stops at v0.6.5 and is labelled experimental, so it does not set the release. The README names two install routes, jpm (sudo jpm load-lockfile, build, install) and janet-pm install from the git URL; the getting page adds an Arch Linux AUR package and an experimental pre-compiled build, recorded as install methods. The guides page lists a guide to deploying a Bagatto site to Netlify from Sourcehut builds, not recorded as a field. The build command is the demo's "bag index.janet", the only build command the README states; the output directory is set in the index module with bagatto/set-output-dir! and the manual states no default, so outputDir is unknown. The README calls Bagatto inspired by LambdaPad, which is not a parent, so no basedOn is recorded. The manual's copyright line gives 2020 and Brooklyn, and LICENSE.md gives Z. D. Smith as copyright holder. The project uses a mailing list and a ticket tracker on sourcehut, which no field covers, so they are not recorded. sourcehut shows no star or contributor counts, so no adoption figure is recorded. Janet is a language, so runtime is janet, and runsAs local covers running bag on a developer machine.
