notes: >
  The GitHub repository has no releases; the highest stable tag is 10.2.1, so currentMajor is 10. The project's own pages disagree on the 10.2.1 date: the downloads page labels it "Released August 17, 2026" (the 10.2.0 date in the news), while the homepage news lists "October 20, 2026 Apache Traffic Server v10.2.1 and v10.1.5 security release" and the 10.2.1 tag's commit is dated 2026-10-19; latestReleaseDate follows the news, and a reviewer should settle it. The downloads page also lists a LTS line, "Traffic Server 9.2.16 LTS Released October 20, 2026 Long Term Support v9.x Release"; that line sits beside the 10.x latest stable and is not recorded as currentMajor. The docs "latest" pages describe "What's New in ATS v11.x", and no 11.x tag exists; that is the development branch, not a release. firstRelease is the date of the earliest file in the Apache distribution archive (2.0.0-alpha, uploaded 2010-05-04), the project's first published release file, and the repository was created in 2009. The archive is a download directory, not a changelog. The homepage says "Powering major CDNs and content providers worldwide" and lists customers on its Customers page; these are claims with no figure and are not recorded. The project's pages name the Via Header Decoder, traffic_ctl and traffic_top as administration tools; these are command-line tools, so adminUi is not recorded. The user support channel is a mailing list and the #traffic-server channel on ASF Slack; no field takes them. The Apache Software Foundation is a U.S. 501(c)(3) per its own foundation page, which gives a tax ID; the ID is not recorded. The docs state that the project does not provide binary downloads, so the install routes are the source archive and a git clone. Fields coined here: none.
