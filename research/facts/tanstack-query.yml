notes: >
  The monorepo's GitHub release tags (release-YYYY-MM-DD-HHMM) cover every package, so the version comes from the npm package @tanstack/react-query, which is the React adapter, not the framework-neutral core. The candidate row's npm figure (44.0M per week) does not match this package: 40.6M for 2026-10-10 to 2026-10-16. The row may count another package; the figure recorded here is for @tanstack/react-query and is the one to refresh. The docs page says that supporting older browsers needs a transpiled copy of the library, which is not a minimum-runtime statement, so runtimeMin stays unrecorded.
