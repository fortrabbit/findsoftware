notes: >
  basedOn is not recorded. The docs say Hydrogen adds to frameworks: "For full storefronts, it works with frameworks that run server code, like Next.js, React Router, Nuxt, Astro, and SvelteKit". The React Router and Next.js lines name the two starter templates, not a parent of Hydrogen. A migration link on the docs mentions Remix for Hydrogen 1; it is not a statement about the current package. renderingModes is not recorded: the docs say the framework owns routing, rendering, data loading and UI, and Hydrogen the Shopify-specific logic. The docs also link a "Migrate to the latest version" page. Oxygen is Shopify's hosting platform for storefronts, a hosted platform next to the open source package; the homepage calls hosting on it free, and no prices are recorded. The deploy page also lists Vercel, Cloudflare Workers, Deno and other Node runtimes as targets. currentMajor is the calendar version 2026 (latest 2026.10.2), since the package uses calendar versions. The npm figures cover 2026-10-12 to 2026-10-18. The repository is a monorepo; the npm package @shopify/hydrogen is published from packages/hydrogen. firstRelease is the npm package's first publish (2021-08-16); the GitHub repository dates from 2022-09-19.
  The homepage and docs say the toolkit provides a typed Storefront API client with gql() queries, cart, product and predictive search stores, request handlers, Shop Pay, analytics with consent handling and money formatting; that it covers the Storefront API and Customer Account API only, with checkout on Shopify; that it ships no component library; and that the docs cover Hydrogen 2026-10, with a legacy guide for 2026-04 and earlier. The homepage names the frameworks React Router, Next.js, Nuxt, Astro and SvelteKit.
  The docs name React Router 7 in framework mode and Next.js as the two starter templates (frameworks and runtimes section).
