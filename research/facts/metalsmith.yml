notes: >
  The about page names Segment as the original developer and says the copyright moved to Kevin Van Lierde DBA webketje in September 2021. The page refers to the webketje company's entry in the Belgian business register, recorded as hqCountry BE on that basis alone. The runtimeMin is the npm package's declared engines field, recorded as declared; the getting-started page instead says the project runs on all Node LTS releases that are not end-of-life. The about page states "Metalsmith licenses will remain as they were (MIT/(L)GPL)"; the LICENSE file of the core repository is MIT. firstRelease is the date of the first version in the npm registry. The npm figure is the metalsmith package for the week 2026-10-12 to 2026-10-18.
