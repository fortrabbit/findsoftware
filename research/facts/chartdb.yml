notes: >
  Status is accepted per the CSV row. Criterion 1 is a judgement: ChartDB is a developer tool for designing and documenting database schemas (its README: "a powerful, web-based database diagramming editor"), not a site or app builder, and it runs on a developer's machine (runsAs local). The category is db-admin as the CSV row has it; the import maps it to admin-panel by intent. The README supports ClickHouse and CockroachDB as sources, which the databases vocabulary does not list. The README says "Public Beta" in its Status section; the pricing page lists a Pro plan, a hosting tier recorded only as the pricing link. The terms name a second product, "Buckle: a Desktop Application", by the same company; it is not a separate candidate here. The maintainer's legal name is ChartDB, Inc. (terms of service). The privacy notice and the terms give a Dover, Delaware mailing address in the United States; that is a mailing address, not a headquarters statement, so hqCountry is not recorded. The About page says the founders are Jonathan Fishner and Guy Ben-Aharon and the company was founded in 2014; the founders are not recorded as maintainer because the terms name the company. The homepage and README link the founder's personal X account, not a project account, so no x fact is recorded. The README says the AI export uses OpenAI and the privacy page lists OpenAI as an AI service provider; the repository has an optional OpenAI key setting, no record field covers it. The README says ChartDB includes analytics via Fathom Analytics, which a build flag can disable. The first GitHub release is v1.0.0 of 2024-11-04; the repository was created in 2024-08. No Docker Hub figure applies, the image is on ghcr.io. The release list has no prerelease. The LICENSE file carries no copyright line. The README Discord link is recorded from its visible text; the README badge alt text reads "Discord community channel".
