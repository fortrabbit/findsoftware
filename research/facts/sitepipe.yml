notes: >
  The README opens with a recommendation of the slick project and says "SitePipe isn't deprecated (yet)". A recommendation is not an end signal, so the status stays accepted and slick is not recorded as a successor. The repository has no homepage on GitHub and the README names none, so the project has no homepage. The latest release date comes from the Hackage package page, which shows the newest version 0.4.0.2 with its upload date; GitHub's newest tag is v0.4.0.0 and the Hackage version is not tagged on GitHub. The Hackage page reports builds failing as of 2022-10-25; that is not recorded as a fact. The firstRelease is the oldest GitHub tag v0.1.1; Hackage lists an earlier 0.1.0 with no upload date on the page.
