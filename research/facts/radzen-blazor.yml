notes: >
  The library is distributed as the NuGet package Radzen.Blazor, which the get-started page names as the install route; its figures are read from NuGet. The NuGet catalog holds versions from 0.0.1 (published 2018-11-19), which the copyright range 2018 to 2026 in the LICENSE supports, so firstRelease is 2018 although the repository was created in 2019 and its oldest GitHub release is from 2021. The GitHub release v12.1.8 and the NuGet catalog date for 12.1.8 are the same day; latestReleaseDate is the NuGet date. The ecosyste.ms latest version lags NuGet (12.1.7), so its figures are for the package only. The homepage and README name Blazor as the target framework and the code is C#; basedOn blazor follows the homepage's words "for Blazor". The README says the library supports Blazor Server, Blazor WebAssembly and .NET MAUI Blazor Hybrid, and the get-started page names the interactive render modes InteractiveServer, InteractiveAuto and InteractiveWebAssembly. renderingModes and runsAs are not recorded: the pages list the hosting modes the components support, but none states which output a site produces, and a WebAssembly site runs in the visitor's browser while a Server site keeps a process running; a reviewer may decide to record them. The radzen.com footer states "© 2016-2026 Radzen Ltd. All Rights Reserved." and the terms name the laws of Bulgaria as governing law; neither states an address or the company's seat, so hqCountry is not recorded. The company site www.radzen.com lists https://x.com/radzenhq only in its JSON-LD sameAs data, which the quote check cannot read, so no x fact is recorded; the Blazor components site has no X link. basedOn blazor names the Blazor record. The Radzen Blazor Pro subscription is the paid tier: its pricing page offers Radzen Blazor Studio, a Visual Studio extension, a cloud-hosted MCP server and premium themes, which the README lists; no prices are recorded. The MCP server is described as cloud-hosted, and it is noted here rather than as a hosted offering of the library. The HTTP Archive list has no Radzen entry. The Radzen forum link comes from the README; the YouTube channel link is on the components site. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header (last page 269).
