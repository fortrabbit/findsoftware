notes: >
  No homepage is recorded: the project has no site of its own, only the GitHub repository and the wiki, so the CSV's GitHub address is the repository and the record is repo-only. The generated API documentation at ring-clojure.github.io/ring is a reference, not a homepage. The project has no GitHub releases; the highest stable tag is 1.15.6 (tag date 2026-10-19), so currentMajor is 1 and latestReleaseDate comes from the CHANGELOG entry for that tag. The 2.0.0-alpha1 tag and the 1.15.0-RC1 and beta tags are prereleases and are not recorded as latestPrereleaseDate, which is only set when newer than the latest release. The CHANGELOG's first entry is 0.1.0 on 2009-09-06, which predates the repository's creation in 2012, so firstRelease is 2009. The Java 11 requirement is stated for ring-core in the 1.14.0 entry; no later entry changes it, so it is recorded as the minimum of the latest release. The README lists ring-core, ring-devel, ring-servlet, ring-jakarta-servlet and ring-jetty-adapter as its libraries, and says SPEC.md gives a complete description of the Ring interface. The CHANGELOG 1.14.0 entry also says ring-jetty-adapter requires Java 17 or later, which is why it is not the runtimeMin. The README's copyright line names two people and the contributors; that is recorded as the maintainer statement, with the GitHub organization ring-clojure as the repository owner. Ring says it is inspired by Python's WSGI and Ruby's Rack; that is inspiration, not a stated parent, so basedOn is not recorded. The clojarsDownloads figure is the total for ring/ring-core, the core package named in the README install section; the monorepo's other packages (ring-jetty-adapter and the rest) are not counted. The wiki at github.com/ring-clojure/ring/wiki is listed as docs because the README names it as the in-depth documentation; its pages were not read.
