notes: >
  Status is discontinued from the GitHub archive flag (archived: true, read 2026-11-17) on the repository the project's own homepage names as its source; the last push is 2022-11-22. The project's status page (https://wkhtmltopdf.org/status.html) says the maintainer planned a final 0.12.7 release by August 2020 and that further work depends on volunteers; no 0.12.7 tag exists. The status page states that the engine it uses is QtWebKit, deprecated by Qt in 2015 and removed in 2016, so the project is built on QtWebKit; QtWebKit is not a record, so basedOn is left out. currentMajor is not recorded: the stable line is 0.12 (0.12.6, 2020-06-10), a 0.x line with no major. firstRelease 2008 is the oldest tag of any kind (0.2, commit dated 2008-05-21); the tags 0.2 to 0.8 predate the repository's GitHub creation (2009-08-07), so the year is from history and not from a published release. The GitHub release page lists 0.12.0 (2014-02-06) as the oldest release object. The homepage says the tools run entirely headless and do not require a display. The homepage link "Docs" points to the auto-generated manual (https://wkhtmltopdf.org/usage/wkhtmltopdf.txt) and the C library docs. The support page names a Google Group "wkhtmltopdf-general" for help; the page links it over http and the https address it redirects to is recorded as forum. The status page recommends WeasyPrint, Prince and puppeteer in its Recommendations section ("consider using ..."); the two with a record, weasyprint and puppeteer, are recorded as alternativeTo, and Prince, a commercial tool without a record, stays here. The status page also warns against running untrusted HTML through the tool; that is a security note, not a fact field. The license is LGPL-3.0 on the repository, matching "open source (LGPLv3)" on the homepage.
