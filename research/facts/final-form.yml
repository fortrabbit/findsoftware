notes: >
  No installMethod is recorded: the getting-started page gives "npm install --save final-form" and "yarn add final-form" only as code under the Installation heading, and no sentence names the route. The README, homepage and API page say nothing else about installing. The GitHub license API reports NOASSERTION ("Other"), but the LICENSE file is the MIT License with the copyright line "Copyright (c) 2017 Erik Rasmussen"; the LICENSE file is the source for license and maintainer. The npm package first appears as 0.0.1 in 2017, the year firstRelease records. The newest GitHub release is v5.0.1 (2026-05-05), and the npm latest matches it. The v5.0.0-3 and v5.0.0-1 tags are prereleases from 2025 and are older than the latest release, so no latestPrereleaseDate is recorded. The homepage is sponsored by Sencha, named on the README ("Final Form is sponsored by Sencha"); the sponsor is not a field. Form Nerd, a separate analytics product described on the README as coming "from the creator of Final Form", is a separate service and is not a paid edition. The companion libraries page lists React Final Form, Vue Final Form and Web Components Bindings as libraries that use Final Form under the hood; they are not recorded as basedOn, since the core is framework agnostic. The homepage's Stack Overflow link is a general tag, not the project's forum, so no forum is recorded. The contributors count is across all pages of the single repository.
