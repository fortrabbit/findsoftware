notes: >
  The homepage premailer.github.io/premailer is the generated API documentation, and its text is stamped Premailer 1.11.0 generated in 2017 with a Ruby compatibility line for Ruby 2.1; that page is cited for the description line only, and the runtime minimum comes from the gemspec at tag v1.33.0 instead. The repository has no GitHub release, only tags, so the stable version and its date come from RubyGems, where premailer 1.33.0 was uploaded on 2026-11-01. The earliest RubyGems upload is 1.5.2 on 2009-11-30, which matches the repository creation year. The maintainer is Alex Dunae in the LICENSE.md copyright line and as the gemspec author; the copyright line covers 2007-2017 and the README repeats that range. The LICENSE.md text is the three-clause BSD license with a name-endorsement clause, and the gemspec names BSD-3-Clause; GitHub detects no license, so the gemspec and the file are the sources. The homepage and README describe the behavior the prose relies on: CSS styles converted to inline style attributes, relative paths converted to absolute paths, CSS properties checked against email client capabilities, an optional plain text version, and a Premailer.new call that takes a URL or an HTML string with the with_html_string option. The README says remote stylesheets that resolve to loopback or private addresses are dropped unless allow_local_network is set, and that CSS variables are not replaced with their static values unless a build step does it. The README says the gem is tested on the Ruby versions listed in its CI workflow, and it names the nokogiri, nokogumbo and nokogiri_fast HTML adapters, which are dependencies and not recorded as databases or templating. The README's documentation section says a maintainer regenerates the hosted API reference by hand, so its age is not a date for any fact in this file.
