notes: >
  The homepage is the project's own site; its footer reads "Copyright © 2026 ZIO Maintainers", which is the maintainer name recorded, with no legal form. The installation page names JDK 17 or higher and an sbt dependency; its snippet shows 3.8.1 while the latest release is 3.11.6, so the snippet is not used for a version. The homepage's Ziverge link sits in a user showcase, so no parent is recorded. The README's "Production Ready" badge is a project stage, not a field. The README's Template System is a Scala DSL for HTML, which names no template language, so templating is absent. The oldest GitHub release is v1.0.0.0-RC15 (2021-04-05), a release candidate, and the 2.0.0 RCs follow in 2022; the first release without an RC suffix is v0.0.1 (2022-11-11), so firstRelease is 2022 and the 2021 RC year stays here. Maven Central lists dev.zio:zio-http_3 from 0.0.1; the io.d11 1.x and 2.x artifacts named in the README are not in Central, so they are not used. The stack overflow tag page on the homepage is a Q and A tag, not a forum, and is not recorded. The Maven coordinate is the Scala 3 artifact that the README's %% dependency resolves to.
