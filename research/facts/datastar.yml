notes: >
  The install docs name a script tag that loads the bundle from the GitHub repository through a CDN, not an npm package, so no npm figure is recorded. The npm package @starfederation/datastar is marked deprecated on its latest tag (1.0.0-beta.11, "Package no longer supported"); it is not named by the install docs, so the deprecation is no end signal for the project. The npm package named datastar belongs to another project from GoDaddy (latest 5.0.0), so it is not used. The Pro edition is a paid add-on with a commercial license; its prices are not recorded. The MIT statement is taken from the GitHub API; the LICENSE file at develop/LICENSE.md reads "Copyright © Star Federation" over the MIT permission text. The homepage's Datastar Pro and Star Federation pages describe the nonprofit and the maintainers; the homepage links the YouTube channel and SDK pages, which have no field here. The reference SDK page lists backend SDKs for many languages; no field records them. hqCountry is the jurisdiction the nonprofit was established in, as the page words it. firstRelease is 2023, the first npm upload (0.0.1, 2023-09-07) of @sudodevnull/datastar, the package the project published under its earlier name; its repository field points to delaneyj/datastar, which GitHub resolves to the current starfederation/datastar repository, and its homepage is data-star.dev. The oldest GitHub release object is v0.19.0 from 2024. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header. The getting started guide says Datastar is a lightweight frontend framework that does not require any npm packages or other dependencies, and recommends hosting the script file yourself. The Pro page lists attributes, actions, a bundler, an inspector and a CSS tool as Pro features.
