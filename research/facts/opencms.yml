notes: >
  The homepage answers over https at www.opencms.org (the page redirects to /en), so it is recorded as https. The repository's INSTALL.md (assets/docs/INSTALL.md on main) still says OpenCms supports Tomcat 9.x only, while the README says the Jakarta EE variant of OpenCms 22 runs on Tomcat 10.1, Tomcat 11 or Jetty 12; the README is the current statement and the runsAs fact cites INSTALL.md only for the start step. The release tags are named build_<major>_<minor>_<patch>; build_22_0_0 is the highest stable GitHub release. The earliest GitHub release is build_8_5_2 (2013-07-10); the oldest Maven Central upload, 8.0.1 on 2012-01-05, is older and gives the firstRelease year. The product page on the homepage lists an enterprise edition named Alkacon OCEE, and opencms.org's homepage calls it a commercial extension, which the paidEdition fact quotes; the alkacon.com OCEE page lists cluster, LDAP connector and database replication modules, not recorded as separate facts. The README lists a headless API that returns JSON, not recorded as headlessApi because no page calls it REST or GraphQL. The Alkacon imprint is at /en/impressum; the company address there is in Cologne, Germany.
