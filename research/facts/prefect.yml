notes: >
  Accepted as a boundary row. Prefect is a data pipeline orchestrator, not a website or web app component; it is accepted because its own pages document an API a site or app calls to trigger flows: the get-started page says "Trigger flows on schedules, external events, or via API.", and the REST API reference lists "Create Flow Run From Deployment" (POST /deployments/{id}/create_flow_run). The docs also describe Prefect Cloud webhooks that receive data for automation actions ("With Prefect Cloud you can even create webhooks that can receive data for use in actions"); that webhook feature is cloud-only and is not recorded as a self-hosted fact. The REST API is a general HTTP API over Prefect's own orchestration data, and the wiring is the trigger call; the reviewer decides whether that meets the boundary rule. Prefect Cloud is the hosted service next to the open-source framework and server; its plan tiers are not recorded as paidEdition. The SSO, roles and workspace features described for Prefect Cloud are cloud-only and are not recorded. The release history: the oldest tag is 0.2.0 (commit 2018-07-19) and the first GitHub release is 0.3.0 (2018-08-20); firstRelease is 2018. Latest stable: 3.9.1 (2026-10-30); the 2.20.27 release line is older and is not the highest version. The GitHub prerelease list includes a development build dated 2026-11-03 (3.9.2.dev3); a .dev build is treated as a nightly build, not a preview, so latestPrereleaseDate is not recorded; the reviewer decides. The PyPI figure is pypistats.org's last-month count for the prefect package. The Docker Hub image prefecthq/prefect is the one the server Docker page names. The licensing page on the docs site returned 404; the license is taken from the LICENSE file at tag 3.9.1. The homepage links Slack, LinkedIn and YouTube; those are not recorded fields. The maintainer is Prefect Technologies, Inc., the contracting party named in the terms (the company page footer copyright says the same); the terms give a Delaware governing law and no address, so hqCountry is unknown. The terms and privacy pages answered 200 this time. The Docker Compose guide runs a self-hosted server with PostgreSQL, Redis, background services and a worker. The homepage links a Discord server and Slack.
