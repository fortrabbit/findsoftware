notes: >
  Two sources state the end. The repository description reads "Deprecated - Chosen is a library for making long, unwieldy select boxes more friendly.", and the README opens with a "Deprecated" heading saying this version "is not currently under active development while we decide on its future direction". The homepage still shows version 1.8.7 and has no notice. The last GitHub release is v1.8.7 from 2018-06-08; the repository was last pushed on 2024-12-02 and is not archived. GitHub detects no license (NOASSERTION): the LICENSE.md file names the MIT License and "Copyright (c) 2011-2013 by Harvest"; the homepage names the MIT license and "© 2011–2016 Harvest", recorded as the maintainer. The README names three package routes with different package names: npm chosen-js, Bower chosen and Composer harvesthq/chosen; the compiled files for these packages are stored in a second repository, harvesthq/chosen-package. The npm and Packagist figures count chosen-js and harvesthq/chosen, the packages the README names. The README also lists jQuery 1.7+ and Prototype 1.7+ support, and a Prototype variant of the plugin exists. The source is CoffeeScript (the contributing guide says to make all changes in CoffeeScript files); the language vocabulary has no CoffeeScript value, so language is left out. The default branch on GitHub is add_all_options. The homepage link was plain http in the CSV; it redirects to https, and the https address is recorded.
