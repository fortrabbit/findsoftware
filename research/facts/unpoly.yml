notes: >
  The candidate row lists ui-library; the project's own pages describe no component kit, only an application layer for links, forms and server-rendered HTML, so categories is ui-library, the htmx precedent. The repository has no GitHub release objects; the highest stable tag is v3.15.0, which npm lists as latest (3.15.0 published 2026-10-26), so currentMajor and latestReleaseDate come from npm. firstRelease is 2015 from the annotated tag v0.1.0 (tagger date 2015-01-07), which predates the first npm upload (0.0.1 on 2016-11-17); the repository was created 2016-02-21. The footer on the imprint page names Henning Koch as responsible for the website, with an address in Augsburg, Germany; the LICENSE copyright line also names Henning Koch, and the homepage says "Made by Henning Koch" and "Supported by makandra". makandra is named as the company behind most development and as the support provider, not as the maintainer, so no parent is recorded; hqCountry DE is the imprint address of the responsible person, which a reviewer may take as the company's country. The install page says the package has no dependencies and needs no build step; the README badge says 0 dependencies. The homepage section "Is Unpoly right for you?" names htmx and Hotwire as tools to choose instead in some cases; alternativeTo records htmx only, because no Hotwire or turbo record exists yet. The support page lists paid professional support, consulting and chat support with prices; these are services, not editions, so paidEdition is unknown. The README links a personal Twitter account of the maintainer; it is not a project link and not recorded as x. The branches 2.x-stable and 1.x-stable are named in the README; they are not end statements. The install page says the backend needs no additional software and works with any language; no field holds that. npmWeeklyDownloads sums the daily counts for 2026-10-19 to 2026-10-25. The HTTP Archive technologies list does not carry Unpoly. Prose basis from the homepage and README: up-target, up-layer, up-validate and up-poll are the example attributes; a JavaScript API and compilers extend behavior; every URL keeps working without separate fragment endpoints; scroll positions and unsaved form input stay outside the updated fragment; the documentation is published as an agent skill.
