notes: >
  The homepage says the core is free ("AbanteCart is free to use.") and names a paid "AbanteCart Charged" distributed edition for custom solutions, with no price, so paidEditions stays unknown. The homepage offers hosting through partners and a managed service at managed.abantecart.com, which is not a SaaS-only product, so status stays accepted. The repository created_at is 2011-12-04, but that is the repo creation, not a first release, so firstRelease stays unknown. The docs mention a Storefront API and a Tasks API without describing them, so headlessApi is unknown. The README versioning scheme is MAJOR.MINOR.BUILD.REVISION; the release tag 1.4.4 is the latest stable release.
