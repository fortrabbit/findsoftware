unreadable:
  - https://www.typeform.com/legal (the legal index page holds no company name or address)
  - https://www.typeform.com/legal/terms-of-service (404 at this path; the terms link on the legal index was not followed to a readable page)
notes: >
  Hosted-service record: nothing is recorded from the Typeform SDK repositories or their npm package (@typeform/embed, named by the developers page in its embed example); those belong to the SDK and go to notes only. The developers page lists Create, Responses, Webhooks and Embed SDK APIs; it says the responses API returns submissions in JSON format, and it names no API style, so headlessApi is unknown. The embed is described on the developers page as "Seamlessly integrate your typeform by embedding it in your website or web app." Plans on the pricing page: Free, Basic, Plus, Business, Enterprise and a Talent plan for HR teams; the free plan is a feature the record states in notes only. The sso and regions values come from features the pricing page marks "Enterprise only"; the Two-factor authentication and HIPAA compliance are marked "Enterprise only" there as well, so the sso and regions values describe the Enterprise plan, which the quotes do not name. The community forum is the vendor-run Typeform Community. The legal contracting entity is TYPEFORM SL per the service terms; the terms also name a Typeform US LLC as a possible contracting party. Custom domains and branding also sit on the Enterprise plan on the pricing page. The about page says Typeform was founded in 2012 and serves over 150,000 businesses; the founding year is not a release year and the business count is a customer count, so both go to notes. Coined kinds, notes only: webhooks (Webhooks API), embed (Embed SDK), customDomains, freeTier, customerCount (150,000 businesses). The company's LinkedIn and YouTube links are coined social fields and go to notes. The status page at status.typeform.com and the help center at help.typeform.com are the vendor's own pages and were not read in full. The pricing page is a large page of scripts and styles; the feature quotes are its text, read from the raw HTML.
