notes: >
  The README says "This project is actively maintained but is currently in a beta state", and the badge reads status beta; the Fly.io docs say "LiteFS is outside our scope of support. We are not able to provide support or guidance for it. Use with caution." Neither is an end statement, so the status stays accepted; a reviewer should decide whether the support disclaimer changes the listing. The repository was pushed 2026-10-28 and its latest release is v0.5.14 (2025-04-22). The first GitHub release is v0.1.0-alpha1 (2022-07-12), so firstRelease is 2022. The Fly.io terms name Fly.io, Inc.; no country was found on the pages read, so hqCountry is absent. Runs as: the getting-started page says LiteFS "can either be run on its own or it can act as a simple supervisor process", recorded as always-on. The FAQ compares LiteFS with Litestream and says it was originally split off of Litestream; that is recorded as alternativeTo, not forkOf or successorOf. The config page names the lease types "consul" and "static". The FAQ states write throughput of about 100 transactions per second because of FUSE, and the README says the SQLite TCL test suite is a work in progress. The Docker image is on Docker Hub as flyio/litefs and the install page names the 0.5 tag. The LiteFS Cloud path under docs.fly.io returns 404, so no hostedOffering is recorded. Fields coined here: none.
