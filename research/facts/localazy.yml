notes: >
  Hosted-service record for the Localazy platform at localazy.com. The SDK and CLI live in the localazy GitHub organization and on npm as @localazy/cli; per the hosted-service rule their licenses, stars and download figures are not recorded. No self-install option is stated. The about page gives the founding year as 2020; it is not recorded as firstRelease because it is not a software release. The pricing page lists ISO 27001, SOC 2 and GDPR as compliance claims without a page of its own, and names the plans Free, Autopilot, Business and Enterprise with a 14-day trial; no prices recorded. The SSO doc states the Enterprise plan is required for SSO. The free plan has 100 requests per minute and 10 requests per second in total on the API limits page, which lists higher daily import and fetch limits on paid plans; the pricing FAQ says the free plan includes all core localization features. The docs list a CLI, an API and a language CDN. The pages name no region for stored data beyond a CDN built on Amazon AWS across multiple data centers, so regions is unknown. Social links on the homepage that are not fields: LinkedIn (linkedin.com/company/37836599) and the GitHub organization (github.com/localazy).
