notes: >
  The candidate row's homepage is vardot.com/en/varbase, the maintainer's product page; the homepage fact uses the drupal.org project page, which the GitHub repository and the composer.json name as the project's homepage. The vardot.com page is read for the copyright line only. The install docs name drupal/varbase_project, which is on Packagist and the figures come from it: 4402 total downloads, 762 in the last month, and the stable line 11.0.11 released 2026-10-10. The vardot/varbase package on Packagist shows 197049 total downloads, but it is not the package the install docs name, so its figure is not recorded here. The GitHub repository's latest release is 11.0.0-beta1, a prerelease the repository does not flag, so the stable release comes from the registry. The GitHub repository reports CSS as its language, which does not describe the distribution; language is left unknown and the reviewer should decide. The drupal.org page reports 517 sites using the distribution; the field name reportedInstalls is coined here for that count. The composer.json requires drupal/core ~11.4.0, which is Drupal 11, so the Drupal major is 11 and the Varbase major matches it. The LICENSE file is absent from the repository, and the license comes from composer.json and the Packagist package, which says GPL-2.0-or-later too. The release-cycle page lists 11.0.x as the current line and does not declare the project ended, so no ended signal is recorded.
