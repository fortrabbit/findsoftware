notes: >
  Category is ui-library: the pages call AdminKit an admin template for Bootstrap 5, an HTML front end, not an admin panel application. The record's homepage is the project's own site at adminkit.io; demo.adminkit.io, named in the candidate row, is its live demo. The npm package named "adminkit" (0.0.1, author Gavin Vicke) is a different project and is not used. The repository's LICENSE reads "Copyright (c) 2020-2024 AdminKit Authors", while the terms page names Bootlab B.V. as the company behind AdminKit; the terms page is recorded as maintainer. The homepage JSON-LD gives the company address as NL, and the terms page gives the Dutch Chamber of Commerce registration. The homepage links GitHub and Dribbble only. The candidate row's tooling-in-scope decision (2026-10-19, admin template) is kept. The pages describe the template as a Bootstrap 5 theme with a Node.js and Webpack build, so no runtime is recorded: the build tool needs Node, the output is HTML, CSS and JavaScript files, and the page does not state a runsAs value. HTTP Archive has no technology named for AdminKit, so httpArchiveSites is absent. reportedInstalls is the homepage figure as stated, with its plus sign. npmWeeklyDownloads is the sum of the daily downloads for 2026-10-18 to 2026-10-24 from the range endpoint. The pricing page FAQ says the static HTML, CSS and JS files can be used without the Webpack build step; the quick-start page says the pre-compiled files are in the dist folder. The install routes cdn (unpkg, README), git clone, zip download and npm install are as the README and quick-start state them. The README and quick-start name Node.js as a build prerequisite only.
