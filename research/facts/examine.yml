notes: >
  Status is accepted per the CSV; the repository is not archived and the NuGet package is not deprecated. Highest stable GitHub release is v4.0.1 (2026-10-07), so currentMajor is 4; v4.0.0-beta.7 (2026-06-07) is older than the release and is no latestPrereleaseDate. firstRelease is 2013: the NuGet registration shows the first upload 0.1.51.2941 on 2013-04-04, and the oldest GitHub release is v0.1.52.2941 (2013-09-12). The CSV row says the library is an index library under Umbraco; neither the README nor the documentation site names Umbraco, so no basedOn Umbraco is recorded and the umbraco category is not used. The project's own pages say Examine wraps the Lucene.Net engine, which is a parent with no record in this dataset, so basedOn is not recorded (Lucene.Net, quote "wraps the Lucene.Net indexing/searching engine"). The target frameworks are net8.0, net9.0 and net10.0 in src/Directory.Build.props at v4.0.1; the runtimeMin 8.0 is the lowest one. The maintainer is named as Shannon Deminick by the LICENSE copyright line and the Company and Authors fields of Directory.Build.props; no legal form or country is stated, so hqCountry is absent. The GitHub owner profile lists a location, which is not a company seat and is not recorded. The NuGet figure is the package Examine's totalDownloads on the day of the check.
