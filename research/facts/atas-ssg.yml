notes: >
  The candidate row's homepage, ssg-test.atasasmaz.com, is a test deployment of this repository, named by the README as the CI target, so the repository has no project site and homepage stays unknown. The author's personal site www.atasasmaz.com is a production example and is not the project's site. The repository has no tagged release (the releases API returns 404), so currentMajor and latestReleaseDate stay unknown. The repository was last pushed 2024-10-15 (GitHub API pushed_at); no end signal is stated. The composer.json requires the atas/ssg-system-php package and the README links it as the PHP Lib; it is not recorded as basedOn because the README names it as a component, not a parent. The composer.json "8.2.0" is a platform setting, not a documented minimum, so runtimeMin stays unknown. Criterion 5 threshold: 36 GitHub stars and one contributor are the only adoption figures; the candidate row marks it accepted, and a reviewer decides whether that figure meets the open threshold. The README links the project's Docker image and GitHub Action as separate repositories.
