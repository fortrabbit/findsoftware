notes: >
  The README and the homepage name https://www.smartstore.com, which redirects over https to smartstore.com/de/; the English home at https://smartstore.com/en answers 200 and is recorded as the homepage. Current major is 6 (6.4.0, 2026-05-29, the highest stable release; no prereleases after 5.0.0beta, 2022-03-29). The oldest listed release is the 5.0.0beta of 2022, so firstRelease is 2022, and the repository itself dates from 2020 (the Smartstore.NET 4 line is older and is the successorOf relation). The Community Edition is AGPL-3.0 per the README and the API; the Premium and Enterprise editions are sold under terms the pages do not name, so no license entry is added for them. Social login (Facebook, Twitter, Google, Microsoft and others) is listed on the features page; it is not single sign-on, so sso is left out. The hostedOffering entry records the rental solution the editions page names. The editions page does not say who operates the rental solution, so only the statement is recorded. The install guide for end users is on an Atlassian Confluence site the README links; it was not read, so installMethod rests on the developer deployment page. The developer deployment page states the self-contained build bundles the ASP.NET runtime, which the README also says, but no page states a process model, so runsAs and runtimeMin are left out. The social links on the homepage are X, YouTube, Facebook, Instagram and LinkedIn; only X is a field; the YouTube channel (youtube.com/@SmartstoreTV) has no field and the others are not recorded. The imprint is at https://smartstore.com/de/impressum-2/ and names SmartStore AG at Kaiserstr. 63-65 in Dortmund.
