notes: >
  Plugin of Eleventy per its README (basedOn eleventy); the docs also say the Image JavaScript API works independent of Eleventy, so the package is installed and used on its own too. Whether a general-purpose image utility passes the plugin rule in AGENTS.md (a plugin is listed only when it turns its parent into another kind of software) is a reviewer decision: the row was accepted in candidates-build-dev.csv. The repository has no LICENSE file and the GitHub license field is null, so license is the MIT of the package.json, as the registry manifest states it. The README is titled "Image utility"; the record keeps the CSV name. The docs page names sharp as its image processor, a dependency, not a basedOn parent. firstRelease is the 2020 npm upload of 0.1.0, older than the GitHub tags (from v0.1.0) and the first GitHub release (v0.10.0, 2021). The social links on the docs page are the Eleventy site navigation and belong to Eleventy, so none are recorded here. The ecosyste.ms dependent counts belong to @11ty/eleventy-img only.
  The parent is Font Awesome: the 11ty blog post "11ty is joining Font Awesome" (2024-09-12) announces that the Eleventy project joined it; the post is about Eleventy, which this plugin belongs to.
