notes: >
  Four-year rule: the newest stable release is npm 1.2.0 published 2021-01-16 (the GitHub latest release is v0.2.3, dated 2020-05-24, and tag v1.1.0 has no GitHub release); no release in four years makes the import move this record to stub. Status is kept at accepted from the candidates row; the reviewer decides. Runtime minimum is not recorded: the homepage says Node.js (>= v6) and the README says Node.js (>= v8), and the v1.1.0 package.json has no engines field. The npm figure is for the package schnack; the install route npm init schnack runs create-schnack, which had its own week of downloads (38 for the same period) and is not recorded. The maintainer follows the LICENSE copyright line; the README says Schnack is a collaboration between Webkid and Gregor Aisch, and npm names Gregor Aisch as author; Webkid is not recorded and no address is recorded for any of them. The license is The Lil License v1 in the LICENSE file; GitHub reports NOASSERTION and npm reports LicenseRef-LICENSE, the same license in two wordings. The site owner registers an OAuth app with each provider. Login for commenters uses OAuth with GitHub, Google, Twitter, Facebook and Mastodon; it is not recorded as sso because it is a login for commenters, not single sign-on. Notifications go to the site owner by web push (README) and by Slack or other webhooks through plugins. Coined kinds, recorded here only: the embed script tag and the programmatic client, cookies that must share a parent domain with the site, the web push protocol, and the bundled plugin packages (@schnack/plugin-auth-github and others). The Related projects list also names Coral Talk, Discourse and Mouthful, which have no record id, so they are not recorded as alternativeTo.
