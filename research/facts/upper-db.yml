notes: >
  The module path is github.com/upper/db/v4, and the install page names go get for each adapter (the PostgreSQL adapter page is the one cited). Go modules have no download figure, so no registry figure is recorded. The README lists MSSQL and QL adapters; QL is an embedded Go SQL engine that has no value in the databases field, so only the databases the field holds are recorded. The highest stable release is v4.10.0 (2025-03-09); the repository also carries v4.6.0-rc1 and other release-candidate tags, which are not stable and do not set the major. runtimeMin 1.23 is the go line of go.mod at the v4.10.0 tag, a library's minimum Go version. The LICENSE copyright line names "The upper.io/db authors", a community of authors rather than a legal entity, so no hqCountry is recorded. The earliest release object in the repository is v0.9.0 of 2016-09-23, which the releases API returns first. The upper.io docs site is a Docusaurus site whose visible text carries the getting-started sentence on the databases the library talks to; the README list is the quote used for databases.
