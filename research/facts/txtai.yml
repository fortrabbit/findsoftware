notes: >
  Scope: txtai is an AI framework whose semantic search, RAG and agent features sit beside its search role; criterion 1 holds because the README says "Build semantic/similarity/vector/neural search applications." Sources that disagree on the hosted cloud: neuml.com says "join the txtai.cloud preview", the docs homepage says "We're also building", and the cloud docs list "txtai.cloud (planned for future)". hostedOffering is not recorded because the cloud is planned or in preview only. Registry figures: PyPI requires_python is ">=3.11" (pypi json), and pypistats gives 3675 for the last week and 13889 for the last month; the weekly figure is recorded. Bindings for JavaScript, Java, Rust and Go are separate repositories (txtai.js, txtai.java, txtai.rs, txtai.go) and are not recorded. The API page states it is backed by FastAPI and serves a /docs page; it does not name a REST or GraphQL style, so headlessApi is not recorded. Own-site copyright line: "© NeuML LLC, Apache-2.0 License" on the docs homepage. The GitHub organization profile gives the location "Washington, DC Metro", which is not a legal notice, so hqCountry is not recorded. The first GitHub release v1.0.0 and the first PyPI upload are both 2020-08-11.
