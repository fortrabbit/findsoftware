notes: >
  Releases on GitHub start at v1.0.5 (2025-05-21) and the newest stable is v1.0.44 (2026-04-22); the 59 tags reach back to v0.1.24, whose commit is dated 2023-03-12, so firstRelease is taken from the oldest tag. The homepage is a product page on apiboot.com, the site of Apiboot Cloud; the repository itself names no homepage, so the apiboot.com page is recorded as homepage and needs a reviewer check. The apiboot.com page mentions sign-in features for scaffolding, deployment and service management; it does not say they host go-api-boot itself, so no hostedOffering is recorded. The README names Temporal workers, Azure and GCP cloud helpers, Let's Encrypt zero-config HTTPS and MCP tools on the same HTTP port; these are features, not fields. The go.mod declares Go 1.25.0 but no page states a minimum runtime, so runtimeMin is left out. The README links the Medicine RAG, Agent Boot and authGo projects as examples; they are not sources for this record. The MongoDB ODM is a client library in the project, so databases lists MongoDB as the database the framework's object model targets.
