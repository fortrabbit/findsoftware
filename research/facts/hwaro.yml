notes: >
  The homepage hwaro.hahwul.com answers 200 with the product page; the docs at hwaro.hahwul.com/start/ and the deploy pages are read through their own HTML. The deploy overview navigation also lists Codeberg Pages, which the README deploy list does not. The Crystal toolchain (1.21 or later for source builds) is a build requirement and is not recorded as runtimeMin. The README lists Markdown with TOML, YAML or JSON front matter as the content format, and platform config generation for Netlify, Vercel, Cloudflare Pages, GitHub Pages and GitLab CI; the docs add Codeberg Pages and an official Docker image at ghcr.io/hahwul/hwaro. None of these has a fact field. The docs describe the dev server as building into .hwaro/serve/, which is not an output folder for deployment and is not recorded. The Chocolatey page says the package for the first release after v0.20.2 is held for moderation; this is not recorded. Releases: the first GitHub release is v0.0.1 (2026-01-24), the latest stable is v0.21.0 (2026-10-12), and no prerelease is listed.
