notes: >
  Criterion 1 call for a reviewer: GoAccess analyzes a web server's access logs on the server that serves the site and produces the statistics and report a creator reads; it is an analytics tool, not a finished application a site only links to, so it is accepted. The source has no GitHub release: the repository's tags are the versions, and v1.12 (commit 2026-09-16) is the highest stable tag, with the release-notes page dated "Wednesday, September 16, 2026". The get-started page still says "GoAccess v1.9.4", a stale version on that page; the download page names v1.12, so v1.12 is used. The first tag is v0.6 dated 2013-07-14 by its commit. The runsAs always-on entry is the real-time HTML mode: GoAccess runs its own WebSocket server while it pushes the report, and the download page says "If outputting real-time HTML, ensure port 7890 is opened." The terminal mode and the static HTML report run on demand, and the page says "GoAccess does NOT serve the generated html report", so the creator's web server serves it. Output formats: the homepage names HTML, JSON and CSV. Log formats named on the homepage: Apache, Nginx, Amazon S3, Elastic Load Balancing, CloudFront and Caddy. The optional GeoIP support uses MaxMind databases; the download page names libmaxminddb and GeoIP2 as optional. The homepage says the tool is "Valgrind tested". The features page lists WebSocket authentication with JWT verification for the real-time report; that is no login protocol for users of a site, so no sso fact is recorded. The download page also names a Slackware SlackBuild and Linux distribution package managers beyond the ones recorded; the Docker image it names is allinurl/goaccess. The maintainer is the copyright holder in COPYING at v1.12. The MIT text in COPYING is the license of the latest release. The get-started page says the report belongs under the web server document root and that the operator may want to restrict access to it. The homepage's social links are X (twitter.com/goaccess) and Mastodon (infosec.exchange/@goaccess); the Mastodon fact is an icon link with no quote.
