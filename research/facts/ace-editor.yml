notes: >
  The id ace belongs to botanicus/ace (a static site generator), so this record takes the id ace-editor, as the CSV row does. The repository README file is named Readme.md; the URLs above point at it. The GitHub API reports the license as NOASSERTION; the LICENSE file is BSD with three conditions, and the copyright line names Ajax.org B.V. The homepage says "released under the BSD license" and "The Ace source code is hosted on GitHub"; no country is stated for Ajax.org B.V., so hqCountry stays unknown. The homepage says "Ace is maintained as the primary editor for Cloud9 IDE and is the successor of the Mozilla Skywriter (Bespin) project"; Skywriter has no record, so successorOf stays in notes. The npm package ace-builds is the pre-built package the README names through its badge and the homepage names as the ace-builds repository; no install page names npm, so no npm installMethod is recorded. The npm weekly figure is the sum of the seven days 2026-10-26 to 2026-11-01 from the range endpoint; the CSV figure is a stale point count. The GitHub release v1.44.0 is dated 2026-08-07 and the npm release 1.45.2 is dated 2026-10-21, which is the newer stable release, so latestReleaseDate uses the registry date. The first tag v0.1.0 is dated 2011-01-10. The README says Ace "can be easily embedded in any web page" and the homepage says "It can be easily embedded in any web page and JavaScript application"; the browser run statement comes from the README sentence quoted. The README names ace-linters for language clients; that is a separate project and is not recorded. The homepage says "Ace is maintained as the primary editor for Cloud9 IDE"; the ace-builds README says the repository "has only generated files" and that its issues are disabled, with reports going to the Ace repository. The homepage's Getting Help section links GitHub Discussions only as the link label "Discuss", so no forum is recorded.
