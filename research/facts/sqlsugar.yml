notes: >
  The LICENSE file on master names jacktang (2025), recorded as the maintainer. The README says SqlSugar is "maintained and updated by Fructose Big Data Technology team", and the documentation site's company name is 果糖网 (Fructose); that legal entity is not named on a page with a legal form, so it stays here and no hqCountry is recorded: the site footer shows a Jiangsu ICP filing number and names no country. The GitHub API reports MIT; the documentation footer states "Apache Licence 2.0" beside the site's own copyright line, and a feature paragraph says "全部MIT协议", so both licenses are recorded as separate entries and a reviewer decides which one holds for the latest release. The documentation's comparison with Dapper Plus (a paid component named in a feature paragraph) is no alternativeTo statement for this record, and no Dapper Plus record exists. The install guide (Chinese documentation, typeId 1226) names SqlSugarCore as the universal package and SqlSugarCoreNoDrive as the driver-free one; the Install-Package line on the wiki names SqlSugar and SqlSugarCore, and the NuGet figure is taken from SqlSugarCore, the package the install guide names first. The SqlSugar NuGet package has 1736953 total downloads (azuresearch, 2026-11-16) and is not recorded: it is the older .NET Framework package. The latest SqlSugarCore version 5.1.4.221 is dated 2026-09-13 by its NuGet catalog; the GitHub releases end at 5.1.4.197 (2025-07-06) and the newest tag, 5.1.21, is dated 2022-08-14, so the NuGet date is the newest. The README's supported .NET list (.net core3.1 to .net10) has no single minimum, so no runtimeMin is recorded. The GitHub owner is a user account (DotNetNext) and the repository's README and the documentation name the team above. The licenseModel quote is the documentation's statement that the project never charges and its docs are free, beside the MIT and Apache statements.
