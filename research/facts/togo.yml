notes: >
  The homepage (to-go.dev) and the docs (to-go.dev/en/docs) answer over https; the homepage redirects to /en. Frontend stack conflicts across the project's own pages: the homepage says "React 19 + TanStack", the README says "Go + sqlc + Atlas + GraphQL/OpenAPI + Next.js", and the docs say "a Next.js frontend"; the record carries no frontend field, and prose names the stack without choosing one. The homepage calls the project "Laravel-inspired", which is not recorded as basedOn because no page says it builds on Laravel. The CLI installs plugins with "install <owner>/<repo>"; the plugin marketplace redirects from to-go.dev/marketplace to to-go.dev/en/plugins; the marketplace count sits in markup that the quote check cannot read, so pluginCount is left unknown. Only one GitHub release object exists (v0.21.1, 2026-10-13); firstRelease is the date of the v0.1.0 tag's commit, since no release object exists for the earlier tags. The Go module is github.com/togo-framework/togo at go 1.26 in go.mod; no download figure is recorded for a Go module. The "AI-native" claim (a .claude/ tree and an MCP server in every app) and the mcp.to-go.dev endpoint are documented on the homepage and the AI page, but no record field carries them. The authentication plugin's JWT and RBAC description is a marketplace listing of a plugin, not a core feature, so userRoles is left unknown. The hqCountry entry comes from the terms page, which places the product's operator in Cairo; no company is named, so the value is the operator's location and a reviewer should decide whether it fits hqCountry. The README describes the core as a microkernel in which REST, GraphQL, auth, dashboard and resources are plugins that the CLI installs. The homepage lists the CLI commands new, make:resource, generate, migrate and serve. The deploy page documents built-in Terraform, with infra:init for gcp (Cloud Run), fly and docker targets.
