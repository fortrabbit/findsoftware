notes: >
  The README says the project "originated as a fork of Uber's Cadence"; Cadence is no candidate record, so forkOf stays out. The server is shipped as Go binaries, a Docker image and a Helm chart; the Go minimum sits in go.mod and is a build requirement, so runtimeMin stays out. The UI server is a separate binary (deployment page). Persistence stores named by the docs: MySQL, PostgreSQL and Cassandra for production, SQLite for testing only (embedded-server page, not recorded as a database value); Elasticsearch or OpenSearch is the advanced visibility store (visibility page) and the Docker Compose example runs it beside PostgreSQL. The deployment page says Temporal services "should run on hosts that are not accessible from the public internet" and should be secured similarly to a database; the docs say "temporal server start-dev" is "not intended for production use" (CLI server reference); the CLI is installed with "brew install temporal" (README), not recorded as an install method because it is the development server. The production checklist says "Self-hosted Temporal doesn't support role-based access control (RBAC) or audit logging out of the box"; Temporal Cloud's SSO via SAML, user roles and SCIM are Cloud features, so sso and userRoles stay out. The API is gRPC (the deployment example "exposes the Temporal gRPC Frontend on port 7233"), a gRPC API goes to notes and headlessApi stays out. The homepage links LinkedIn (https://www.linkedin.com/company/temporal-technologies), not a field here. The Slack link is https://t.mp/slack (homepage and README), no social field. The temporal.io terms of service name "TEMPORAL TECHNOLOGIES INC." for Cloud contracts; no page gives the headquarters country, so hqCountry stays out. The SDK packages (@temporalio/client, the Go, Java, Python and TypeScript SDKs) are SDK repositories; their downloads and stars are not the server's figures and are not recorded. Server releases use a 1.x line (v1.32.2 is the highest stable tag, minor line 1.32 kept here only in notes).
