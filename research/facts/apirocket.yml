notes: >
  The homepage shows plans with per-user, per-locale, document, API call, bandwidth and storage limits, and marks the service as a beta ("Try for free (beta)"); the limits are not recorded as they change. The product is a hosted service with no open source of its own: the only repository the docs name is apirocket/documentation, which holds the VuePress source of the documentation site, so no repository is recorded. The homepage also names webhooks, an imgix-based image service, a Cloudflare CDN and an open roadmap on Trello, for which the starter list has no fields. The imprint names E-xisto Diseño Web S.L. as the company and gives an address in Spain; the docs footer reads "Made with ❤️ by existo". The pricing page is the homepage section, so no separate pricingPage is recorded. The API docs describe one GraphQL endpoint for all projects, an API key per project sent as a bearer token, and an API Explorer for running queries and generating mutations.
