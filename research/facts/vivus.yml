notes: >
  The CSV homepage was the GitHub repository, and the README's "Demo available on" address is a GitHub Pages demo page, which is no project site, so homepage is left out. The repository has no docs site: the README is the documentation, and no docs fact is recorded from it. The CDN route is the jsDelivr link the README names; CDNJS is a second CDN listed on the same line of routes and WebJars is a third-party package index, so neither is a separate installMethod. The GitHub release line is 0.4 (v0.4.6, 2021-04-17) and currentMajor is 0 by semver, so a reviewer decides whether a 0.x line gets a major. The last release is more than four years old and the repository was last pushed on 2022-07-06; neither is an end signal, and the README states none. The import's criterion 4 rule will move this record to stub when its release is over four years old; the CSV status accepted is kept here. firstRelease is 2014 from the oldest GitHub release (v0.1.1, 2014-11-12); the npm package's first upload is from 2015-03-02. The README links a Gitter chat, which is no forum field. The README says nothing on where the library runs beyond the SVG and browser support notes, so no runsAs is recorded. The README explains the technique and its limits: the script updates the CSS property strokeDashoffset, so every element of the SVG must have a stroke and cannot be filled, and text elements are not allowed. Stars and contributors belong to the maxwellito/vivus repository.
