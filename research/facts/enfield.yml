notes: >
  The README is titled "Not Maintained" and the repository is archived; the npm package carries the deprecation message "No longer maintained, if you would like to take over send a pull request", so the status is discontinued. The README gives no install command: its usage block is generated from enfield --help, and the GitHub wiki is empty. Criterion 3 (documented installation) is not met by any page read, so installMethod is not recorded and the reviewer should decide the listing. The repository has no GitHub release, only the tag v0.2.1; the registry latest 0.4.0 (2015-04-15) sets currentMajor 0 and latestReleaseDate, and the first npm version 0.1.0 (2012-12-16) sets firstRelease, as the registry history belongs to this project. The README describes compatibility with Jekyll ("aims to be as compatible as possible with Jekyll") but names no parent or fork relationship, so no basedOn or alternativeTo is recorded. The npm runtimeMin figure is the engines.node range ">=0.8" of the latest version.
