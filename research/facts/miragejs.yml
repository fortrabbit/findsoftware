notes: >
  Accepted: an npm library a developer installs into a frontend project (installation page), with a stable release on 2023-10-30 and a prerelease on 2024-06-19, inside the four-year window. The default branch of the repository is next, not main; its last push is 2025-08-11, which does not decide status. currentMajor is 0 because the highest stable GitHub release is v0.1.48; the 0.1 line is the stable line, and the 0.2 line exists only as alpha prereleases (0.2.0-alpha.0 to alpha.3, June 2024). The About page says Mirage began as ember-cli-mirage, an Ember addon, and that its core was extracted into the standalone miragejs library in 2019; the page does not say Mirage is built on Ember, and it says the core avoids Ember APIs, so basedOn is absent. The About page signature is the maintainer, and the LICENSE copyright line names only the year 2016. The comparison page says Mirage uses Pretender.js to intercept requests; Pretender is a package dependency and no record exists for it. The comparison page compares Mirage with JSON Server and MSW, so alternativeTo names json-server; MSW has no record yet, so it is left out until one exists. The comparison page says Mirage runs in the browser and, in node, only in a browser-like environment such as jsdom, which is why runtime is node and runsAs is absent. The installation page gives the same npm route for Yarn (yarn add --dev miragejs), one installMethod entry. The Discord and X links and the homepage sign-up line are link facts; the sign-up form sits on the homepage, so newsletter points there. The npm figure counts downloads of the miragejs package itself. The homepage describes route handlers, a database that route handlers read, and factories for seeding it, and the comparison page says Mirage resets its state on every browser reload, can use localStorage for temporary persistence, and cannot yet mock a React app's server-side API requests. The homepage states Mirage works with all major JavaScript frameworks, libraries and test runners, and the About page names React, Vue and Angular; these are statements of use, not fields. The firstRelease year is the year of the npm upload 0.0.1 (2019-10-02); the repository was created in February 2019, the same year.
