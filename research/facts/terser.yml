notes: >
  Terser has no GitHub releases; its tags run to v5.51.2, the highest stable tag and the npm latest version, so currentMajor and latestReleaseDate follow the npm registry. The GitHub API reports the license as NOASSERTION; the package.json and the LICENSE file carry BSD-2-Clause, and that is the recorded value. firstRelease is 2018, the first terser upload on npm (1.0.0, 2018-05-12); the older tags in the repository are UglifyJS history. forkOf names uglify-js, the record for the UglifyJS line: the README words it as a fork of uglify-es that mostly retains compatibility with uglify-es and uglify-js@3, and records no direct fork statement for uglify-js. The maintainer is the author named in package.json; the npm maintainer list names Fábio Santos, and the GitHub owner is the terser organization. The README notes that browser loading from a CDN is supported; no runsAs browser is recorded because the README presents the software as a build step on the command line or in a program. npmWeeklyDownloads covers 2026-09-28 to 2026-10-04; the last two days are about half of the earlier days in that range. The description names the Node.js API from the homepage sentence "You can use it through the Command line or Node.JS API." The terser.org site is a Docusaurus page and was read directly.
