notes: >
  Coined founders, foundedYear (company or project founding, distinct from firstRelease), latestGithubRelease (GitHub's latest release object lags the Packagist and changelog version here), and youtube. hqCountry AU is read from the Australian Company Number (ACN) the EULA gives for Responsiv Pty Ltd; no page states a country. The GitHub repository is public but the software is not open source: installing requires a license key, and the EULA forbids modification and redistribution. A headless JSON API (Gateway API) is mentioned only by third-party sources and was not confirmed in official docs. The plugin marketplace shows no total count.
