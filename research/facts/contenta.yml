notes: >
  Ended on two signals: the repository the project names as its source (github.com/contentacms/contenta_jsonapi, the README's own GitHub link and the link on contentacms.org) is archived per the GitHub API, and its README opens with "DEPRECATED" and says the project is archived because no one took the maintainer role. Checked 2026-10-23.
  The homepage contentacms.org still says "Contenta CMS is actively supported by an open community." and the documentation site describes the project in the present tense. Both are kept as stated; the archive and the README take precedence for status. This is a contradiction the record must show.
  The homepage is https://www.contentacms.org/. The http:// URL in the candidate row redirects to it, and the apex https host redirects to www.
  Highest stable GitHub release is v3.0.680 (2019-05-10); the tags are build numbers under a 3.0 prefix, and the major is taken as the tag states it. Oldest release is contentacms_release-2017-07-17_build_205, which sets firstRelease.
  The maintainer is recorded as the homepage states it ("community driven"). The README says no one has stepped up to fill the maintainer role, so no maintainer organisation is recorded.
  The install steps are on the homepage (Quick Install for local development with sqlite, and the installation section with a download script and install:with-mysql). The documentation site's installation pages do not exist at the paths tried, so the homepage is the install source.
  The homepage links a Twitter account (recorded as x, an href with no page text) and a Drupal Slack channel.
  The README says Contenta is a Fork & Go solution with no supported upgrade path, and that the installation profile was based on the Thunder distribution.
  The "headlessApi" value jsonapi is a coined value: the starter list has rest, graphql and none, and the README names the platform as JSON:API.
