notes: >
  The install docs name frappe-bench (the bench CLI that scaffolds and runs a Frappe bench), so pypiName and pypiDownloads come from that package. The CSV adoption note (pypi 1.1k/wk) does not match the frappe-bench figure of 389351 last month and is replaced. The homepage link is https://frappe.io/framework; the docs site is docs.frappe.io/framework. The current major is 16: the highest stable GitHub release is v16.53.0 (2026-10-22), and v15.124.0 is a lower major still in support. The first GitHub release is v3.2.0 (2013-12-12), the earliest in the releases list; the project itself dates from 2011 by repository creation, which is not a release. The installation page lists NodeJS 24 and Python 3.14 for v16 and develop, and the pyproject at the v16.53.0 tag requires Python >=3.14,<3.15; runtimeMin is taken from the tag. The README calls the framework the base of ERPNext, a finished application that is not a candidate here, so no basedOn parent is recorded. The README describes an MCP server; no feature page was read for it. endoflife.date has no frappe product, so no endoflifeId. The privacy policy names Frappe Technologies Pvt. Ltd. and India; the Frappe Cloud terms name Mumbai arbitration, which is not used for hqCountry. The deployment page of frappe.io says the host needs MariaDB, Redis and Socket.io, and the web-framework page lists a built-in CMS with file-based routing. The docs statements on rendering were not found, so renderingModes is unknown.
  The README calls ERPNext the first application built on the framework and says the framework is built for it.
  The production guide configures Supervisor and nginx on a server and says "Nginx is a web server and we use it to serve static files and proxy rest of the requests to frappe." The README says "Started in 2005, Frappe Framework was inspired by the Semantic Web." The Frappe Cloud hosted service is run by the same company.
