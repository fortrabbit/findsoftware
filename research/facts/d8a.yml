notes: >
  The repository is public and MIT-licensed, and the newest stable release v1.5.1 (2026-10-26) is on major 1. The oldest tag v0.1.0 is dated 2025-09-28. The v1.0.0 release is a prerelease older than the latest release, so no latestPrereleaseDate. The release tarball route (download, unpack, run the binary) is on the getting-started page as the tab "Local binary + CSV files"; a tab label is no quote, so it is not an installMethod entry. The self-hosted page shows "Go runtime" only as a diagram label and no page sentence states the runtime, so runtime is not recorded; the language Go comes from the repository API. Warehouse destinations (BigQuery, ClickHouse, CSV and Parquet on S3, MinIO, GCS or disk) and the tracking protocols (GA4, Matomo) are README and features-page statements, kept as text, not fields. The storage config (bolt, queue, spool) is the software's own state, but no page names a database for it, so databases is not recorded. Coined kinds (cookieless, consent behaviour, IP masking levels, air-gapped mode, Data Studio dashboard, MCP connector) are kept here as text. The pricing page's Enterprise tier and support package are services; the MIT code is the Open Source plan, so paidEdition is not recorded. The terms name Govanalytics B.V., trading as d8a.tech, which is the maintainer recorded here; the LICENSE copyright line says d8a.tech. The compare pages name matomo and plausible as alternativeTo; snowplow and google-analytics-4 have no record. The HTTP Archive technologies list has no d8a entry, so no httpArchiveSites.
