notes: >
  The GitHub repository description reads "Development is on Gitlab: https://gitlab.com/giacomocaironi/Kart", so the GitLab project is recorded as the repository and the GitHub stars and contributor count are left out as figures of a mirror. The GitHub repository's last tag is v0.14 while PyPI carries version 0.16.1 released 2024-11-12, so the release fields come from PyPI. The GitHub tags are not GitHub releases. The README says Kart is not yet ready for real-world use and that its API can change between minor versions; this is a stated maturity, not an end, and no status is set. The docs describe a cookiecutter template as a separate install step, which is not recorded as a field.
