notes: >
  Stub: the homepage www.reactstorefront.io does not resolve in DNS and docs.react-storefront.io does not answer, so the project's own site and docs cannot be read; a live homepage or docs page would settle it. The README gives the install steps, so criterion 3 holds on the repository alone. The npm install command names create-react-storefront, a scaffolder at 8.1.2, so npm figures are for the core package react-storefront (last-week figure 107; the last-month figure is 2739). The GitHub repository was created 2019-11-08 and the npm package has an earlier upload from 2018-10-01, so firstRelease follows npm. The GitHub license field reads NOASSERTION, while LICENSE.md and the npm metadata say Apache-2.0. The README says "node 10 or newer", which runtimeMin records; the npm metadata for 9.0.0 says node >=8.10.0. The LICENSE copyright line names Moov Corporation, recorded as maintainer; the GitHub organization that holds the repository is called Storefront Foundation. The README links a community Slack workspace, which has no field. The README names Layer0, a third-party serverless PaaS, as the easiest deploy target, with a free tier; no prices are recorded. The master-branch README is the only copy read: the repository has no release newer than 2022-02-17 and the last push is 2023-03-06.
