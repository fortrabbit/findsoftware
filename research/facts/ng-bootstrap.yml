notes: >
  The homepage and the documentation are one Angular single-page app: the HTML carries the title and meta description, and the component pages and the manual installation route are only rendered in the browser, so the homepage fact cites the title and the getting-started route is listed as unreadable. The install docs name the ng add schematic and the npm package @ng-bootstrap/ng-bootstrap, the core package of the repository, whose figures are recorded. The npm weekly download range is 2026-10-18 to 2026-10-24. The README says the only dependencies are Angular, Bootstrap 5 CSS and Popper, with Angular and Popper as peer dependencies; Bootstrap is named without a peer entry, so basedOn names both Angular and Bootstrap. The latest npm release 21.0.0 declares Angular ^22 as a peer dependency; no runtime version is recorded for the Angular peer. The LICENSE copyright line covers 2015-2018 and names the Angular ng-bootstrap team; no legal form is given. The 21.0.0-rc.0 prerelease (2026-06-15) is older than the latest release, so no latestPrereleaseDate is recorded. The first npm version is 1.0.0-alpha.0 (2016-07-07), a prerelease, and firstRelease counts it. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header. Dependent counts are ecosyste.ms figures. The README table lists, for each release line, the Angular version and the Bootstrap CSS version it is tested against. The HTTP Archive technologies list has no ng-bootstrap entry.
