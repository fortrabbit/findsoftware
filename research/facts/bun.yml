notes: >
  The bun.com terms and privacy URLs answer with a placeholder page ("This bun is still in the oven."), so no legal name or hqCountry is recorded; the maintainer is the GitHub organization oven-sh, and the parent fact comes from the homepage banner that says Bun has joined Anthropic. The docs pages are a JSON-rendered site, so the quotes come from the README and the homepage; the runsAs local value rests on the docs index, which points the bundler to bun build, a CLI command run by the developer. The always-on value rests on the server docs page, which describes Bun.serve as starting an HTTP server. The repository license is NOASSERTION on GitHub; the LICENSE file states MIT for Bun itself and LGPL-2 for the statically linked JavaScriptCore, recorded as two entries. The first GitHub release is bun-build-8 (2021-09-14), which predates the repository's first tag and is the oldest release in the repository; the npm package named bun has a 2013 upload from another project, so npm is not used for firstRelease. The one GitHub prerelease, canary, dates from 2022-07-22 and is older than the stable release, so no latestPrereleaseDate. The npm weekly figure is the sum of daily counts for 2026-09-28 to 2026-10-04. The x link is the homepage href to x.com/bunjavascript without visible text. The runtime pages describe the runtime as a drop-in replacement for Node.js. The LICENSE file carries no copyright line, so the maintainer stays the oven-sh organization.
