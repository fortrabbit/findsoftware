notes: >
  The GitHub API reports no license for the repository (NOASSERTION), so the license entry comes from the npm package's license field and the repository's package.json, which states "license": "BSD-3-Clause". The LICENSE file's wording "(The BSD License)" and the README's "BSD-3" are one license, not two. The maintainer follows the LICENSE copyright line, which dates 2010-2017 and names Christian Johansen. The repository's GitHub release objects end at v4.2.2 (2018), but the tags run to v22.1.0 and the npm latest is 22.1.0, so the major and the release date come from the npm registry, the newest stable version. The homepage says the library works "with any unit testing framework", which the README states as "test framework agnostic". The CDN route is one installMethod: the README names jsDelivr and unpkg as CDNs serving the browser build in one sentence. The COMPATIBILITY.md page names browsers as well as Node.js, and runsAs is left out because the README names both (the rule for dual-runtime libraries). The runtime node entry rests on the COMPATIBILITY.md runtimes block ("baseline 2024" and "maintained node versions"); the page names no Node minimum for the current release, so no runtimeMin is recorded. The getting-started page says Sinon works with most popular test runners, such as Mocha, Jasmine and Jest; that is no alternativeTo statement. The first release year is 2010 from the npm upload history, which predates the oldest Git tag, 0.2.3, dated 2011. The README's Stack Overflow link is a tag page, not a project forum. The stars and contributors belong to the single repository.
