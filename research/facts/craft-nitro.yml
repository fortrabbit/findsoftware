notes: >
  Discontinued: the repository craftcms/nitro is archived (GitHub API, archived true, last push 2022-07-11), and Pixel & Tonic's announcement "Retiring Craft Nitro" (2022-06-28) and the docs say the tool is no longer supported; the homepage getnitro.sh only redirects to that announcement. The announcement names DDEV as the probable successor and also lists Lando, Laragon, Laravel Valet and MAMP as alternatives; no successor record is linked, and DDEV is not a record yet. Highest stable release is 2.0.10 (2022-05-19), which matches the docs' version 2.x; the earlier 1.x line is not a current major. The blog says Nitro first launched in May 2020, while the oldest tag v0.0.1 is dated 2020-03-02; firstRelease is the year of the oldest GitHub release, both give 2020. The README names Go and make for building from source; the docs state Nitro runs on macOS, Linux and Windows 10 with WSL2 and the Windows install needs Docker Desktop. The docs list the databases Nitro installs for projects (MySQL, MariaDB, PostgreSQL, Redis and others); these are services for the projects, recorded as databases only for MySQL, MariaDB and PostgreSQL, the three named in that list item. The distributed team (Pixel & Tonic, the company) is in several US states and abroad, and the terms name a US governing law (Oregon) and a Portland arbitration venue; no headquarters is stated, so hqCountry is not recorded. The MIT license is the same on the GitHub API and in LICENSE.md. The contributor count of 15 comes from the last page of the contributors list at per_page 1. The docs say Nitro is "built with Craft CMS in mind but works great with any modern PHP application", which is no basedOn statement, so none is recorded.
