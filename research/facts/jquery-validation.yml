notes: >
  The site https://jqueryvalidation.org/ answers 403 to the research user agent, so its pages were read from the site's source repository jquery-validation/jquery-validation.github.io (Jekyll content on GitHub Pages, index.md, documentation.md, reference.md). The homepage and documentation URLs are recorded from the repository README and the site source; the reading is from the source, not from the rendered site. The install routes: the README sentence names the download of prebuilt files; the site source names jsDelivr CDN; the site source lists npm under "Installation via Package Managers" with a command, which is the npm installMethod quote, and the npm registry package is recorded as npmName. The site source's reference.md says the plugin can never replace server-side validation; that is prose, not a field.The site's support link points to the jQuery plugins forum at forum.jquery.com, a general forum for jQuery plugins, so no forum field is recorded. The site source says Markus Staab took over maintenance from version 1.15.0 in February 2016 and Brahim Arkni assisted, but the LICENSE copyright line names Jörn Zaefferer only, and that line is the maintainer per the rule. The basedOn value follows the site's own sentence calling the project a jQuery plugin; the site also lists jQuery as its one required dependency. The GitHub release list starts in 2013 (a 1.8.0pre prerelease from that year is older than the stable line), and the oldest tag is 1.6.0, commit dated 2009-11-30, which sets firstRelease; the npm first upload is 1.13.1 in 2014. The prerelease 1.8.0pre predates the stable 1.22.1, so no latestPrereleaseDate is recorded. The runsAs browser value rests on the site source sentence "simple clientside form validation", which states that validation runs on the client, not a sentence naming the browser. The npm weekly figure is the sum of the daily figures for 2026-11-08 to 2026-11-14.
