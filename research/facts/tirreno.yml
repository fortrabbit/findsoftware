notes: >
  Accepted: the project's own docs say tirreno is "an open-source framework for building security into your application", and the sensor endpoint (POST /sensor/, docs Sensor API reference) is called by the application's code on each event, so the site-side criterion is met by the API a site calls. The tracker libraries are separate repositories (PHP composer tirreno/tirreno-tracker, pip tirreno_tracker, npm @tirreno/tirreno-tracker, plus the WordPress tracker) and are not data sources for this record. Categories: the homepage calls it a "security framework" and the CSV row names fraud prevention; the import has no security or fraud category, so analytics is recorded from the homepage phrase "Event tracking, risk scoring and threat detection"; a reviewer should decide whether a category for security or fraud prevention is needed. Versions: the highest stable GitHub release is v0.10.1 (2026-08-15), so currentMajor is 0 and the minor line 10 is left out; the oldest release is v0.9.0 (2025-01-05). Requirements: the README gives PHP "Version 8.0 to 8.3" and PostgreSQL "Version 12 or greater" with PDO_PGSQL and cURL; runtimeMin 8.0 comes from the composer require at the latest version, and the README upper bound 8.3 is not in the field. The registry package tirreno/tirreno is the install package in the README; Packagist total downloads are recorded as 46, with the monthly figure 2 on the same endpoint. Docker Hub pull count is for the image tirreno/tirreno named in the README. The pricing page sets an Enterprise Edition and a White-label edition under a commercial license next to the AGPLv3 Community Edition; features the pricing table lists for paid editions only include audit logging, role management, SAML single sign-on as an option, webhooks and API access, and are not recorded as fields. The admin guide says RBAC arrived in v0.10.0 and lists the operator role defaults; basic RBAC appears in the Community column of the pricing table. The homepage does not state a cloud or hosted offering. The project also lists a GitLab mirror and a community chat at chat.tirreno.com; neither is recorded. The sensor endpoint takes event fields over HTTP POST, and a blacklist search endpoint is at POST /api/v1/blacklist/search; the docs do not name an API style such as REST, so headlessApi is not recorded. The imprint gives the company address in Yverdon-les-Bains, Switzerland, and the README copyright line says "tirreno technologies sàrl, Vaud, Switzerland".
