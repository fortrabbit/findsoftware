notes: >
  The Go module is github.com/mxschmitt/playwright-go; the API resolves the playwright-community/playwright-go name to this repository, which keeps the mxschmitt owner. The releases are versioned v0.<n>.<patch>, and each minor needs a matching Playwright driver version (README); the line is v0.x, so currentMajor is 0. The README says the Go package ships a Node.js runtime with the Playwright driver, around 50MB, which talks to the Go code over stdio, and that installing it also downloads the pre-compiled browsers; the README names the official Node.js, Python, .NET and Java libraries as the other languages, and basedOn playwright rests on the sentence that the shipped bridge is a Node.js runtime combined with Playwright. The README links the Playwright documentation at playwright.dev, recorded as docs, and says its guides and concepts are shared across all Playwright languages while the code samples there are JavaScript. The README mentions a Dockerfile.example to build your own image; no image is published, so no Docker route is recorded. The README's Discord badge links the Playwright community chat (aka.ms/playwright/discord), not a chat of this project, so no discord fact is recorded. The pkg.go.dev API reference (https://pkg.go.dev/github.com/mxschmitt/playwright-go) is the Go API reference linked from the README. Go modules have no download figure, so no registry figure is recorded. The release dates come from the GitHub releases API; the oldest tag is v0.171.0, committed 2020-12-29, and the repository was created 2020-08-16. Stars and contributors belong to this repository alone.
