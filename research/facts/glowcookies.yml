notes: >
  Doubt: the homepage the repository names, https://manucaralmo.github.io/glow-cookies-web/, answers 404 on 2026-11-03, and https://manucaralmo.github.io/ answers 404 too, so the project's own site cannot be read and the record stays a stub without homepage; a live project site, or a statement from the author that the project continues, would settle it. The README's own links to the project site are the same dead URL. The GitHub owner login manucaralmo is recorded as maintainer because the README names no author. The LICENSE file is GPL-3.0 without a copyright line. The npm name glowcookies has one version, 3.0.0, which npm reports as unpublished, so no npm figure is recorded. The README states "Complies with the new European regulations" and describes a banner that holds Google Analytics, Facebook Pixel and Hotjar until consent; that is a privacy claim, not a field. The README names three tracking integrations (analytics, facebookPixel, HotjarTrackingCode) and a customScript option; these are attachment details. The README examples load the script from jsDelivr at version 3.1.8. The latest release is 3.1.8 dated 2023-05-10, inside the four-year window.
