notes: >
  The GitHub API reports no license (null) for the repository; the README states two licenses, MS-RL for the code and Creative Commons for the docs, and both are recorded as license entries. The highest stable release is v3.3.8.0 (2019-06-15), which the homepage and the download page also name as the current version; the repository's default branch was last pushed 2023-08-02. The earliest release in the GitHub list is 3.3.5.0 (2016-09-16); the README says the platform is open source since 2007, which is used as firstRelease. The docs and the FAQ are the project's own pages; the Winhost one-click installer is a hosting partner's, not recorded as installMethod. The homepage and the get-started docs say Windows hosting with IIS and ASP.NET 4.5 or later and write access to App_Data and Custom folders; the pages do not say whether the process stays running or what the output is, so runsAs and renderingModes are not recorded. The README's Development section names Visual Studio and ASP.NET 4.5+ for the source build. The README's security note asks users to change the machineKey after installation; not a field.
