notes: >
  The latest GitHub release is v4.5.4 (2026-07-29), and Maven Central's latest for io.jooby:jooby is the same version. The newest stable release overall is v3.12.0 (2026-08-07) on the 3.x line; the record follows the highest major, per the write-record rule. The runtime minimum comes from the 4.x upgrade notes on jooby.io ("Java 21 as minimum"), and the CLI page states Java 17 for the CLI itself. The homepage and the README name Netty, Jetty and Undertow as servers and Vert.x as an option. The homepage shows the application started as a fat jar with "java -jar myapp.jar prod", which is the source for runsAs. The databases are the Vert.x MySQL and PostgreSQL client modules in the Modules catalog; other database modules exist and are not recorded. The templating quote shows two of the seven catalog lines. The LICENSE file has no copyright line, and the maintainer is the developer named in pom.xml, whose group id on Maven Central was org.jooby before io.jooby. The oldest Maven Central upload of org.jooby:jooby is 0.1.0 from 2014, older than the oldest GitHub release (v0.5.0, 2015). The template engines are the engine modules listed in the Modules section of jooby.io. The Discord quote is the README help section link. No paid edition or pricing page was found. The homepage nav lists over 50 modules; the README count is recorded as pluginCount.
