notes: >
  Doubt: the README opens with the heading "CONTRIBUTIONS ONLY" and says "I do not have time to fix issues myself. The only way fixes or new features will be added is by people submitting PRs." and calls the library "largely feature stable"; that is passive maintenance, not an end, so the status is stub until a maintainer statement or a new release settles it. The same notice says "I no longer use Voluptuous personally". The repository description repeats "CONTRIBUTIONS ONLY". The latest release 0.16.0 (2025-12-18) is the newest stable release and the newest tag; no prerelease is listed. The GitHub API and PyPI both name BSD-3-Clause. The homepage in the CSV is the PyPI page, which is the registry and not the project's own site; the only project site is the GitHub Pages documentation, which is recorded as docs, so no homepage is recorded. The README links it over plain http; it also answers 200 over https at https://alecthomas.github.io/voluptuous/, the recorded address, and its built pages state "voluptuous 0.14.2 documentation" and are not current. The README has no installation section; the PyPI registry page is the installation source, so installMethod pip is cited to the registry API. The README contact section lists the maintainer's personal email and Twitter account; those are the author's and are not recorded as project links. The README names a mailing list at librelist.com and a Gitter lobby badge; neither is recorded as a forum or chat field. The README's Internationalization section describes gettext hooks that validation messages go through; i18n records that and the absence of shipped translations. PyPI downloads are from pypistats for the last month; the registry name is voluptuous. The ecosyste.ms counts are for the PyPI package. Maintainer legal form is not stated; the copyright line gives the name only. No hqCountry page exists.
