notes: >
  The maintainer is the copyright line in the docs footer; the license text is the Mozilla Public License 2.0, whose wording matches the API id. Parcel (parceljs.org) includes Lightning CSS as its default CSS transformer; that is a relation from Parcel to Lightning CSS, not a basedOn statement. The docs also describe a Rust library (docs.rs) and a WebAssembly build, lightningcss-wasm, for Deno and browsers; neither is recorded as an install method because the docs give no install command for Rust. Lightning CSS is a CSS build tool, not a CSS framework: the category is build-tool because the minifier and bundler are its listed uses. The runtimeMin comes from the root package.json at tag v1.33.0; the npm engines field matches. The oldest GitHub tag and release is v1.0.1 (2022-01-13), so firstRelease is 2022 although the repository was created in 2021. The npm figure is the lightningcss package named by the install docs, not lightningcss-cli. Prose must not name the wasm build as a runtime.
