notes: >
  Status: no end signal. The repository is not archived and was pushed on 2026-11-16; the npm latest 2.7.0 is not deprecated; the newest release v2.7.0 is dated 2026-11-07. The only prerelease, 2.0.0-Beta.1 (2021-07-15), is older than the latest release, so no latestPrereleaseDate. The LICENSE file is the Apache text without a copyright line; the README copyright line names Contributors, so the maintainer comes from package.json, which names Josh Schmidt (https://github.com/oyejorge) as author, the same rule as other repositories with no named holder. The README says Tom Select was forked from selectize.js; forkOf follows the project's sentence, and selectize is a record. Framework agnostic is stated, so no basedOn; the README says the project decouples from jQuery, which is a history statement and not a binding. The README's Clone or download row and its build-from-source instruction are a source route, not an installMethod. The package.json engines field asks for node '*', a build requirement of a browser control, so no runtime. The homepage shows the plugin list and the caret position plugin; no pluginDirectory fact was recorded. Sponsor logos on the README are not recorded. The npm figure counts downloads of the tom-select package the install docs name; the CDN route (jsDelivr) is the script tag installMethod.
