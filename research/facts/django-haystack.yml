notes: >
  Name is "Haystack" in the README title and homepage; the registry id is django-haystack. The name collides with deepset's Haystack LLM framework, which is not this project. License: pyproject and the LICENSE file state BSD-3-Clause (GitHub reports NOASSERTION because the LICENSE text is a custom wording of the BSD terms); the README and homepage say "BSD licensed". The LICENSE file also says the software was MIT-licensed before April 17, 2009; that older license is not recorded in the license field. Maintainer is the copyright holder named in LICENSE and the pyproject author. Install from PyPI; the tutorial also gives pip install "django-haystack[elasticsearch]" for the Elasticsearch extra. The search engine (Solr, Elasticsearch) runs as its own service that the Haystack app connects to; no page states a runsAs value for the app itself. The readthedocs master pages show "Haystack 2.5.0 documentation" and the homepage news stops at 2.6.0 (2017); the release figures come from GitHub and PyPI, which show 3.4.0. The homepage and docs carry an https link (haystacksearch.org answers over https). Mailing list at groups.google.com/group/django-haystack is named in the README and homepage ("There is a mailing list available for general discussion"), not recorded as forum. Search backends the README names (coined searchBackends, kept in notes): Solr, Elasticsearch, Whoosh, Xapian, from "plug in different search backends (such as Solr, Elasticsearch, Whoosh, Xapian, etc.)". firstRelease is the oldest PyPI upload (1.0.0-rc1, 2009-11-23) because it predates the oldest GitHub release (v2.2.0, 2014). pypiDownloads is pypistats last_month; last_week was 64176 on the same day.
