notes: >
  Accepted as a pytest plugin under criterion 1: the docs say it "provides a set of useful tools for testing Django applications and projects", and the test suite of a Django project runs through it. basedOn is pytest only, from the docs sentence that calls it "a plugin for pytest". Django is what it tests and its repository description reads "A Django plugin for pytest."; the project never says it extends Django, so basedOn django is not recorded. The LICENSE file carries two BSD notices: "pytest-django authors (see AUTHORS file)" for 2015-2018, and a second notice saying "This version of pytest-django is a fork of pytest_django created by Ben Firshman" with Ben Firshman's 2009 copyright. The fork origin has no record, so forkOf is not recorded. Both notices are BSD and form one license entry. GitHub reports the license as NOASSERTION because the LICENSE file is a plain sentence and not an SPDX text. The maintainer is named in pyproject.toml as Andreas Pelme, the project's own statement; the LICENSE holder is the authors list. The first release year comes from PyPI (1.0.0 uploaded 2012-04-30); the GitHub tag 1.0.0 is dated 2012-03-27 by its commit, so both give 2012. The repository was created in 2011, which is not a release date. The README's compatibility list names Django 5.2 and 6.1, CPython 3.10 or later, PyPy 3 and pytest 7.0 or later; these are compatibility statements in the project's words and are not recorded as fields. The pypistats figure is the last-month count, a rolling window. Contributors are counted across all pages of the contributors endpoint with per_page=1, last page 152. The README's section on why to use it over manage.py test lists pytest fixtures for test dependencies, less boilerplate because tests are plain functions, database re-use between runs, multiple processes through the pytest-xdist plugin, other pytest plugins, and unittest-style TestCase classes that keep working. The README's compatibility section says that for older Django and pytest versions one should use previous pytest-django releases.
