notes: >
  No project site: the GitHub homepage field points at casebook.net, the maintainer's case-management product site, which does not mention pg_search; the gem's RubyGems homepage is the repository. The license is MIT in the README, the LICENSE file and the gemspec; one wording, one entry. Tags run to v2.4.0 with no GitHub releases; the registry's 2.4.0 matches the tag, so the major and the release date come from RubyGems. The maintainer's address is not on the pages read, so hqCountry is absent. The README points to PostgreSQL extensions for some features (a wiki page, not read); it also links a Gitter chat, which no field holds. The gem's minimum runtime is the gemspec's required_ruby_version at the 2.4.0 tag; the README's "Ruby 3.3+" agrees. The PostgreSQL extension of the same name is a different project, ParadeDB's pg_search, and has its own record. Active Record 8.0 is a required dependency; the basedOn entry names Rails because the README places the gem in Rails projects via a Railtie.
