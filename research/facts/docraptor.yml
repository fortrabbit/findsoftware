notes: >
  Hosted service: the vendor product, not the SDK. The SDK repository DocRaptor/docraptor-ruby (MIT, 34 stars, last push 2023-09-27, checked 2026-11-03 via api) and the Ruby gem docraptor (RubyGems, 1,258,473 total downloads, version 3.1.0, checked 2026-11-03) are client figures and are recorded here only as notes, so no repository field is set. The homepage names the Prince PDF engine as the one DocRaptor uses, and the about page says DocRaptor was built as an API for Prince; there is no Prince record, so the engine stays in notes and basedOn is absent. Compliance claims from the security page, recorded in notes and not as fields: SOC 2 Type II, HIPAA (paid plans, with a BAA), GDPR and EU-U.S. Data Privacy Framework participation. The homepage states a 99.99% uptime guarantee. The about page's 2010 start is the founding story ("Back in 2010 ... DocRaptor was born"), not a dated release, so firstRelease is absent; the oldest changelog entry is 2012-07-31. The about page states over 1,800 active customers and over 500M PDFs generated, not recorded as reportedInstalls because they count customers and documents, not sites or installs. The about page places DocRaptor in the Artifex family from October 2025; the copyright footer reads Artifex Software Inc. The contact page gives one address, Artifex Software Inc. in San Francisco, CA; it belongs to the parent, so hqCountry is absent and the reviewer must decide. The privacy policy's current version names DocRaptor LLC as maker, and older versions name Artifex Software Inc. with DocRaptor LLC as subsidiary. The compare page for WeasyPrint (docraptor.com/compare/weasyprint) is the source for alternativeTo weasyprint, a candidate row in the dev-libs list. The pricing page has plan tiers Free, Basic, Professional, Premium, Max, Bronze, Silver and Enterprise (custom); no prices are recorded. The docs list Excel (XLS and XLSX) output alongside PDF, and the terms of service are at docraptor.com/tos (version 2.0, effective 2025-05-14). The HTTP Archive technology list does not track DocRaptor, so httpArchiveSites is absent. The homepage has no social links; the X link is on the contact page. The docs describe official client libraries for many languages, recorded in notes only. Not record fields: pricingModel monthly plans based on usage, with overages (https://docraptor.com/signup).
