notes: >
  The homepage aventum.org is a static docs and marketing site served by GitHub Pages; its links point to the TryAventum organization, the server, the dashboard, Docsator, hooks and the npm organization. The roadmap page (docs/getting-started/roadmap) lists GraphQL as planned; nothing is recorded from it. The record uses TryAventum/server as the repository; the admin dashboard is a separate repository, TryAventum/dashboard, and the install docs name @aventum/cli as the npm package. The server repository has no GitHub release objects; its tags are 1.0.0, 1.0.1 and 1.1.0, and the highest, 1.1.0, is dated by its commit (2021-02-11), which is the value recorded as latestReleaseDate. The npm package @aventum/cli has its latest version 1.0.1 published 2020-10-17. The requirements page lists Redis, and the homepage says content is cached with Redis; Redis is not a field here, so it stays in these notes. The Discord link is the one on the homepage. The installation page describes the server as an Express server and the dashboard as created with create-react-app; only Express is recorded as basedOn. The install pages show start commands for the server but no page says how the process is kept running, so runsAs is not recorded. The package.json author is recorded as the maintainer, and MIT comes only from package.json: the repository has no LICENSE file; the repository owner is the TryAventum organization. The Frontend docs page (aventum.org/docs/front-end/) says a login form can offer login with Facebook and login with Google for site visitors, once the options are set in the dashboard under Login Providers. The Frontend docs page shows frontends calling the server with HTTP requests to log in users and to read, create, update and delete content. No headless API style (REST or GraphQL) is stated on the pages read.
