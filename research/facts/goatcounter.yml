notes: >
  Privacy and attachment kinds, in notes only: the README says it "doesn't track users with unique identifiers and doesn't need a GDPR notice" and identifies unique visits "without cookies using a non-identifiable hash"; the script tag loads count.js from gc.zgo.at and the README also names a JavaScript-free tracking pixel, an HTTP/REST API for backend middleware and log file import (nginx, Apache, Caddy, CloudFront). The hosted service's privacy page says data is stored on servers at Hetzner Online GmbH in Finland and Germany. The homepage describes goatcounter.com as "currently offered for free for reasonable public usage" and donations through GitHub Sponsors; no price is recorded. The license split: EUPL-1.2 (slightly modified, the Compatible Licenses appendix is removed) for the project and ISC for public/count.js, both from the LICENSE at v2.7.0; the latest release is v2.7.0. The maintainer is the copyright holder named in LICENSE; the privacy page names him as the operator of goatcounter.com. Install routes: release binaries, Docker Hub image arp242/goatcounter (and compose.yaml), and a source build from the release-2.7 branch; the README sets the default server at port 8080 with SQLite at ./goatcounter-data/db.sqlite3. The README says the self-hosted and hosted versions both accept log file imports. The first tag is v1.0.0 (2020-01-08); the repository was created in 2019 and has no earlier tag. Go 1.21 is the source build requirement and is not recorded as runtimeMin, since the software ships as a binary. The homepage names AlternativeTo and Product Hunt as links; those are directories, not sources. The translating page lists Dutch, Italian, Spanish (Chilean) and Turkish translations. The homepage says: 'Easy web analytics. No tracking of personal data.'
