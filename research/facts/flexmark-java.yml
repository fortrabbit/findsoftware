notes: >
  The repository has no homepage of its own; its README and the homepage field are the repository only, so the homepage is not recorded. The repository holds the core parser and its extension modules, so stars and contributors belong to the repository, and the Maven artifact named by the install guide is flexmark-all, the umbrella package that includes core and every module. The README badge names the core artifact com.vladsch.flexmark:flexmark, and the Maven figures are the same release line. The README says the repository is "a fork of commonmark-java", and the project's feature table and benchmark compare it with pegdown and commonmark-java; pegdown is named as a parser the project was written to replace, a fact with no record id, so no alternativeTo is set. The project's CommonMark support is stated as "CommonMark (spec 0.28)"; that is compliance, recorded here in notes. Output formats named in the README are HTML by default, PDF through Open HTML To PDF, and DOCX through docx4j, which are extension modules. The copyright line also names Atlassian Pty Ltd for 2015-2016 code; the LICENSE file names that legal entity beside the maintainer, and it is not recorded as maintainer. The README gives 2016-2023 for Vladimir Schneider, while LICENSE.txt gives 2016-2018; the license file is recorded. The GitHub repository has no release objects; the registry figures are Maven Central, whose latest version is the release the install guide names. The tags named commonmark-parent-* (the oldest dated 2015-07-22) are the upstream commonmark-java history carried in by the fork and are no flexmark-java release; the first flexmark-java tag, 0.1.0, has a commit dated 2016-06-08, so firstRelease is 2016. Maven publishes no download figure, so none is recorded. The README compatibility statement is that Java 8 works up to 0.62.2 and Java 11 from 0.64.0.
