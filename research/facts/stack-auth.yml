notes: >
  Stack Auth was renamed to Hexclave; the docs migration page says so, and the About page says the project "now presents those capabilities as Hexclave". The record follows the new name, keeps the id and records the old name as formerName. The homepage stack-auth.com redirects to www.hexclave.com, and the repository stack-auth/stack-auth redirects to hexclave/hexclave. The homepage footer says "© 2026 Hexclave, Inc.", while the LICENSE copyright lines say "Copyright 2024 Stackframe"; the maintainer follows the LICENSE copyright line per the wave 46 ruling, and the terms and privacy links in the homepage footer answer 404, so no contracting party is readable and the LICENSE line stands. No page gives a country for the company, so hqCountry is absent. License: the root LICENSE says client code and examples are MIT and server components AGPLv3; apps/backend/LICENSE and apps/dashboard/LICENSE are the AGPL text, and packages/ui, packages/shared, packages/template and packages/sc carry the MIT text. The enterprise line comes from the root LICENSE and the pricing FAQ ("Commercial licenses are available if AGPL doesn't fit"); it is recorded as worded, not as paidEdition. The pricing page lists Free, Team and Growth plans without prices; The custom-oidc page says Custom OIDC providers require a Team plan or above; the sso fact is stated without that plan gate, which the reviewer may want to add to notes. firstRelease is the 2024 npm upload of the legacy @stackframe/stack package (1.0.0, 2024-03-04), the same project under its old name; the GitHub releases in this repository start in April 2026. latestReleaseDate is the newest stable GitHub release (dashboard-v1.0.135, 2026-10-30); the npm @hexclave/js latest version 1.0.134 was published 2026-10-28, and the GitHub releases are dashboard and emulator builds, not SDK tags. The npm figure is the @hexclave/js package, the core SDK; @hexclave/next had 19,620 downloads in the same window and the legacy @stackframe/stack 12,507, both kept here for reference only (the legacy package is replaced by the @hexclave/* packages per the migration page). The SDKs are @hexclave/js, @hexclave/next, @hexclave/react and @hexclave/tanstack-start. The self-host page names the stackauth/server Docker image, whose Docker Hub pull count is recorded. Self-hosting needs PostgreSQL 15 or newer, ClickHouse, a cron scheduler calling internal endpoints (not recorded as runsAs, since the scheduler is outside the image), an SMTP or provider email setup, Svix for webhooks, and S3-compatible storage; Freestyle is required for custom email sending. No runtime is recorded: the self-host page ships a Docker image and only mentions "Node deployments" in passing, which does not state what runs the server. The self-host page says the project is fully open source and recommends the cloud for most users. Protocols named on the pages: OIDC, OAuth, passkeys, CLI auth (kept in notes, not a field). Coined or pricing-only items left to notes: the free tier ("Free, $0 forever", up to 10,000 auth users), plan limits, HIPAA and SOC 2 Type II offered through custom enterprise contracts, and the Node 24 sandbox snapshot used by custom email code, which runs in Freestyle and is not the server runtime. The docs advertise a REST API for any language (headlessApi is recorded for the REST style). The pricing page and the README also name a Discord link (discord.hexclave.com); no newsletter, Bluesky or Mastodon link appears on the homepage.
