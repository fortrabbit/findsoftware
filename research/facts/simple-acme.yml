notes: >
  Status accepted: the repository is not archived; the latest stable GitHub release is v2.4.1 (2026-10-06), major 2. The about page says "simple-acme is a clone of win-acme version 2.2.9.1" and the README says "Forked from win-acme". win-acme has a candidate row in candidates-server-infra.csv but no fact file yet, so the fork is recorded here only and forkOf is absent until that record exists. firstRelease 2024 is the oldest GitHub release (v2.3.0.1797, 2024-10-18), matching the about page's "It's first release (version 2.3.0)". The repository's tags include 1.9.4-beta tags inherited from win-acme's history, so the oldest tag is not used. Maintainer: no page gives a legal name or a copyright line; LICENSE has no copyright line; the about page names the GitHub account WouterTinus. The homepage links a GitHub Sponsors page; it is a donation page, so no x field is recorded. Support is donations via GitHub Sponsors and Patreon; no paid edition. The runtime is .NET; src/main/wacs.csproj at v2.4.1 targets net10.0, which gives runtimeMin 10. The homepage says "Runs on Windows 2012+ and Linux (beta)" and "Runs on x86, x64 and ARM"; the download page lists full builds that load plugins and trimmed builds that do not. The download page also hosts plugins for the program (download#plugins); no plugin repository is recorded. The default validation is an HTTP server run by the program itself on ports 80 and 443 (getting-started), which the record does not turn into runsAs. The GitHub contributors count uses per_page=1 and the rel=last page. hqCountry is absent: no page names a country or address. Fields coined: none.
