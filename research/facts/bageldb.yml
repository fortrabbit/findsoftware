notes: >
  Hosted service: the platform runs at bageldb.com and its app at app.bageldb.com. The only repository under the bageldb organization is the client libraries repository (MIT, TypeScript, 5 stars), which is not the product source, so its license, stars, contributors and npm figures (package @bageldb/bagel-db) are not recorded as the product's. currentMajor and latestReleaseDate are not recorded: the only versions are those of the client package, whose newest stable npm release is 0.4.39 (major 0, published 2024-02-26), ahead of the repository's GitHub releases (v0.3.32, 2023-11-07); they describe the SDK, not the hosted service. The docs integrations page names the Nuxt.js client (@bageldb/bageldb-nuxt); the homepage lists Vue.js, Gridsome and Flutter as technologies and a BagelStudio builder at bagelstudio.co, which is not read. The homepage lists webhooks, realtime data, user authentication and CSV export, and the docs name Bagel Auth (a user management API, beta); the footer links YouTube as well as Discord and GitHub. The terms of service and terms of use name Israeli law (Consumer Protection Law 5741-1981) and an .co.il contact address, but no company address, so hqCountry is not recorded. The Quick Guides say users are added only through the API. The docs name the Content API endpoint at api.bagelstudio.co, which is not the bageldb.com domain.
