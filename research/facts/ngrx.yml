notes: >
  The ngrx.io guide pages answer with an application shell that carries no page text, so the guide is read from the site source in the repository (projects/www). The repository is a monorepo of the NgRx packages (store, effects, signals, router-store, component-store, entity, store-devtools and others); the stars and contributors belong to the monorepo, and the npm figure is for @ngrx/store, the package the install page names with ng add. The repository has no GitHub releases, so the version and date come from the npm registry: the latest stable version is 22.0.1 of September 2026, and the newest prerelease (22.0.0-rc.0, August 2026) is older than it, so no latest prerelease date is recorded. The npm dist-tag beta points to 6.0.0-beta.2 from 2018, which is older than the stable line. The first npm upload, 1.0.0 of December 2015, is older than the oldest git tag (6.0.0, 2018); the npm package is the same product, so the year is taken from it. The index page says Store is "inspired by Redux"; that is a relationship in the notes, not a basedOn statement. The license is MIT in the LICENSE file (the GitHub API reports no license) and the copyright line names four individuals; the maintainer is recorded as NgRx, the name the project gives itself in its README. The homepage also links a GitHub sponsorship page and a dev.to blog; not recorded as facts. The repository also ships an ESLint plugin, schematics and a devtools package as packages of the same monorepo.
