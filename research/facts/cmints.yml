notes: >
  Highest stable GitHub release is v1.2.2 (2020-06-14), so currentMajor is 1. The npm package latest is 1.2.3, published 2021-01-28 with no matching GitHub release; latestReleaseDate follows the releases API. The homepage footer reads "© 2019 CMintS" while the LICENSE names Manvel Saroyan as copyright holder; maintainer follows the LICENSE and package.json author. The docs name Crowdin as an optional translation service with an integration in the README; it is a third-party service and not recorded as a field. The homepage lists CommonMark Markdown for content; the flat-file contentStore value rests on the i18n page's reference to .md pages. The i18n page describes translations as JSON locale files whose directory structure follows the page path, with a default locale set in config.js. The quick start walks through forking a starter repository and publishing it to GitHub Pages or Netlify. The README documents an integration with Crowdin, a hosted translation service, for uploading source files and downloading translations. The README and documentation present cmints --start under "For the production" as an HTTP server serving a folder, and cmints --static as the generator of static content.
