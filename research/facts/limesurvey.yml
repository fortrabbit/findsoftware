notes: >
  Criterion 1 holds on the project's own homepage: "Embed surveys seamlessly on your website" under "Sharing & embedding", so the survey is embedded into a site, not only linked; the embed method (script or iframe) is not stated. The RemoteControl API (XML-RPC and JSON-RPC web service) lets another application control LimeSurvey from outside, including participants and responses, and the README lists a REST API among integrations; both are recorded as headlessApi. Maintainer: LimeSurvey GmbH, Hamburg, Germany, from the legal notice, the company behind the project; the LICENSE copyright line names "LimeSurvey Project Team / Carsten Schmitz", kept here as a note. The LinkedIn company page is linked from the homepage footer. Releases: there are no GitHub releases, only tags (1295); the newest stable tag is 7.9.0+261029 with a commit date of 2026-10-29, which the CSV row lists as 2026-10-07. Language: GitHub's language statistic says JavaScript, the PHP application is the language recorded. runtimeMin comes from composer.json at the tag (8.1.31); the install manual's table says PHP 8.1.29 and up for the 7.x line. LimeSurvey CE is the self-hosted product; LimeSurvey Cloud is the hosted service. ComfortUpdate, named in the pricing FAQ next to the CE, is a paid update service for self-hosted installs, not a paid edition with extra features, so no paidEdition fact. The license wording in LICENSE (version 2, or any later version) matches the README statement, so it is one entry. The API reports the license as NOASSERTION. The manual's install page names a zip download and a CLI route (both recorded as installMethod). Other README integrations (Google Analytics, two-factor authentication, WCAG 2.0 compliance, LinkedIn account, Plugins for question and survey themes) are not recorded as fields. The sitemap named in robots.txt lists one comparison page, a Google Forms alternative blog post; Google Forms has no record. The manual's Available third party plugins page lists more plugins (authentication, export, survey) and says "Some plugins are listed in the Limestore"; LimeSurvey ships 19 core plugins. SAML single sign-on is not a core plugin: the manual lists a "SAML SSO Plugin" among third-party plugins and the Cloud vs CE page offers "SSO (LDAP, SAML)" on the Cloud CORPORATE plan, so sso records LDAP only (core plugins AuthDB, AuthLDAP, Authwebserver); the README lists SAML among integrations.
