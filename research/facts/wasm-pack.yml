notes: >
  Rust build tool: the CLI compiles a Rust crate to WebAssembly, generates JavaScript bindings and a pkg folder with a package.json for npm, and runs browser tests (book command pages). Build targets in the book are bundler, nodejs, web, no-modules and deno. The book's own prerequisites say Rust 1.30.0 or later ("Make sure rustc -V prints out at least 1.30.0"), and the README repeats it; the v0.15.0 Cargo.toml has no rust-version field, so runtimeMin is left out and a reviewer should decide whether the book statement counts. Maintainer: the README names drager; LICENSE-MIT carries the line "Copyright (c) 2018 Ashley Williams"; the README governance section says the project "was started by ashleygwilliams and is maintained by drager", and Cargo.toml lists Jesper Håkansson as a second author. The GitHub licence detection shows Apache-2.0 while Cargo.toml and npm both state MIT OR Apache-2.0; both statements are recorded. Install routes: cargo, npm (the book's installer page names the npm package, which downloads a precompiled binary), the curl installer script, and a Windows installer. The npm figure counts downloads of the npm package named on the installer page for the week 2026-09-28 to 2026-10-04. crates.io shows 1139343 downloads in the last 90 days alongside the 6627301 total. The README header has a Chat link to a Discord channel (discordapp.com/channels/442252698964721669/443151097398296587); recorded as a discord fact without a quote. The prerequisites page says that publishing to npm needs npm installed and configured, and that the project intends to rewrite the npm registry client so a Node runtime is no longer needed for that step. The book says wasm-pack uses wasm-bindgen (it runs without installing wasm-bindgen with --mode no-install), but no page names it as a parent, so no basedOn is set. Repository created 2018-02-12; crate first version uploaded 2018-03-16.
