notes: >
  The install page recommends @radix-ui/themes and a stylesheet import, and the package is the record's npm figure. The repository has one GitHub release, 3.3.0 (2026-01-31), which is also the npm latest, so currentMajor is 3. firstRelease is 2023 from the first real npm version, 0.0.1 (published 2023-06-19); the 0.0.0 entry of 2023-06-15 is a placeholder and is not counted. The getting-started page, the overview, styling and layout pages and the README were read for a sentence naming React or Radix Primitives as the parent and none was found, so basedOn and a React category are not recorded; the package.json peer dependency on react is no statement: the code examples are JSX, which is a syntax, not a statement of a parent. The homepage's sample blocks (team, notifications, pricing) are demo interface and are not used. The homepage says "Read about Radix Themes 3.0", which matches the release line and is not recorded separately. The discussions link is the project's GitHub Discussions, named in the README. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header (last page 27). The ecosyste.ms counts are for @radix-ui/themes. Radix Primitives and Radix Icons are separate records.
