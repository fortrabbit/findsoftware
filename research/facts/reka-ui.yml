notes: >
  The GitHub description reads "Previously Radix Vue" and the repository's main branch README still describes radix-vue; no radix-vue record exists, so the rename is only noted here. firstRelease 2023 is the oldest release of this repository (July 2023), which carried the earlier name; the npm package reka-ui was first uploaded in 2024. The default branch is v2. ecosyste.ms reports 0 dependent packages and repositories for reka-ui while the README names Nuxt UI and shadcn-vue as dependents, so those figures are left out. The homepage states 2.9mil+ monthly downloads and 220+ contributors; the npm and GitHub figures are used instead. The maintainer is recorded as UnoVue from the LICENSE copyright line, which gives no legal form.
