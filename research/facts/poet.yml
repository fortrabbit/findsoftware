notes: >
  Status is accepted. The README carries the line "Looking for maintenance help!" with a link to an issue; it does not say the project has ended or is unmaintained, so no status was set. Flag for a reviewer: the rule in AGENTS.md is "the project states it has ended or is unmaintained", and this line is close to that wording without matching it. The GitHub repository is not archived, its last push is 2023-01-23, and its latest GitHub release is 1.0.0 (2014-05-11). The npm package poet has latest 3.0.0 (published 2019-04-15), a higher major than the GitHub release, so currentMajor is 3 from the registry; the GitHub tags 2.0.1 and 2.0.2 also exist without releases. The npm package has no engines field, so no minimum Node version is recorded. The homepage is the project's documentation site at jsantell.github.io/poet; it lists the same options and Express versions as the README. Poet registers routes on the Express app passed to it; no page states how the site runs or its rendering mode, so runsAs and renderingModes are left out. Poet also bundles jade and markdown template engines; these are recorded as templating.
