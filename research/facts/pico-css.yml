notes: "Discontinued: the homepage banner and the README state that Pico CSS is no longer maintained, that v2.1.1 is the final release, and that the repositories are archived (api archived true on picocss/pico). The project states that npm, the jsDelivr CDN and picocss.com stay online. The code is MIT in the LICENSE file and in the repository API; the homepage footer says \"Code licensed MIT, docs CC BY-SA 4.0\", and the docs license is not recorded as the software's. The LICENSE copyright line names \"Pico\", not a person; the homepage footer says \"Designed and built by Lucas Larroche\", recorded as maintainer. The npm weekly figure is the sum of the daily counts for the period in the value; the homepage's monthly npm figure is not recorded. The httpArchiveSites figure is the mobile count for the technology named Pico CSS. The first GitHub release is v1.0.2 (2019-12-11), the same day as the first npm upload. The community forks link and the note that the Pico name is not covered by the MIT license are not recorded as fields. The x link is the README badge and the footer icon link. This is not the Pico CMS record (pico), which is a different project."
