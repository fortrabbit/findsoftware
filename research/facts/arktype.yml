notes: >
  Monorepo: the repository arktypeio/arktype holds the ark packages (ark/type is the arktype package, ark/schema, ark/util, arkregex, ark/attest and others); the stars and the 84 contributors belong to the monorepo, and the npm figure is for the arktype package only. The homepage shows the GitHub stars (7.9k) and the Bluesky, X and Discord links; a Twitch link is also present and has no field. Maintainer: the LICENSE copyright line reads "Copyright 2025 ArkType"; package.json names the author as "David Blass" with the email david@arktype.io; the README names David as the person to contact. Recorded maintainer follows LICENSE, reviewer may prefer "David Blass". The site does not name a legal entity or country. Runtime: the setup page gives TypeScript 5.1 or higher, ESM (type module or an ESM-capable environment) and a tsconfig with strict or strictNullChecks (required); it names no runtime, so runtime is unknown. The setup page offers pnpm, npm, yarn and bun tabs; its Markdown version shows the npm command. Standard Schema (co-authored with Valibot and Zod), JSON Schema conversion (@ark/json-schema), tRPC and Drizzle integrations are on the integrations page and are not recorded as fields. The homepage benchmark compares runtime speed with Zod 4 and Yup; no alternativeTo statement is made by the project, so alternativeTo is unknown. The docs ship an agent skill (npx skills add arktypeio/arktype) and llms.txt; not recorded. Release line: arktype 2.2.9 is the latest stable tag and the npm latest; 2.0.0-dev prereleases are on npm but older than the stable release. firstRelease is the first npm upload of the arktype name (2022-09-19, version 0.0.1); the repository itself dates from 2019-06-21 and its oldest GitHub release is from 2024 (other packages of the monorepo), so the reviewer may prefer a different year if a pre-2022 tag of the arktype package exists.
