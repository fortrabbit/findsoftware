notes: >
  The SPIP forge is git.spip.net, a self-hosted forge rather than GitHub, so there are no GitHub figures; its API path returns HTML, and the project is not on Packagist (spip/spip is served from get.spip.net). The forge repository page states GNU GPLv3 and that the repository is the official SPIP core. The homepage says the software is distributed under GNU/GPL, recorded as its own statement. The charter states the community is independent of any association, foundation or company, so no legal entity is recorded and the maintainer is the community as the project words it. The version recorded is 4 from the download page's stable 4.4.28; the 5.0 branch appears on the supported-versions page with first publication 15 January 2027, not yet released. The requirements page lists the 4.4 branch with PHP 7.4 to 8.5, and the supported-versions page lists 4.4 as the branch in maintenance. endoflife.date has no SPIP product (404), so endoflifeId is not recorded. The count next to the "Show all" link on the English documentation page (11539 websites) is not recorded as reportedInstalls because the page does not say what it counts; the linked "SPIP Inside" page shows a different count. The first-release year is not stated on any page read: the homepage says the program was born in 2001 on a collective initiative, which is not recorded as a first release. The templating system (squelettes) and the database and file storage were not read in a page and are not recorded.
