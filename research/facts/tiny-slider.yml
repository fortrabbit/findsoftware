notes: >
  The latest stable release is npm 2.9.4, published 2021-10-26; the GitHub release objects stop at v2.9.3 (2020-07-27), and the v2.9.4 tag has no release object. The repository's last commit on the default branch is dated 2021-11-08 and its pushed_at is 2024-08-02. Criterion 4 gives no end signal, and the release is older than four years, so the import moves this record to stub; status is left as the CSV gives it. The README title reads "Tiny Slider 2" and the record uses "Tiny Slider". The README says the project is "inspired by" Owl Carousel; that is not a stated alternative or basis, so neither field is recorded. The MIT copyright line names William Lin (2015); the npm author entry is a GitHub handle and is not recorded. The homepage field of the repository is empty; the README's "Demos" link is a GitHub Pages site of the project, so it is recorded as homepage and is served over https. The README's install section also lists bower, a package registry the project still names; the npm figure is the tiny-slider package the install line names. The CDN script tags in the usage example are code only and are not an installMethod. The repository's own language statistics put HTML first because of the demos; the record's language is JavaScript. The README's "Browser Support" table is compatibility, not a runtime or a field. The "Features" table names Carousel and Gallery modes; the category comes from the repository topics carousel and slider.
  The README's Options table names lazyload, nested, responsive options and useLocalStorage (a browser capability cache), and its Methods section lists goTo, play, pause, updateSliderHeight, destroy and rebuild. The Warning sentence in the README says the library "works with static content and it works in the browser only", and that markup loaded dynamically needs tns() called after loading.
