notes: >
  The homepage is cited without a trailing slash: stoplight.io/open-source/elements/ answers 301 to a Webflow staging address, while the path without the slash answers 200 with the product page. The homepage describes Elements as "Open-source and maintained by Stoplight." (the non-breaking space in the page is read as a space), and the LICENSE.md copyright line names Stoplight, Inc. for 2018, so the maintainer follows the LICENSE. Parent: the about page calls SmartBear "our parent company"; the footer names SmartBear Software. No hqCountry: the subscription terms name Stoplight, Inc. and say they are governed by the laws of the State of Texas, U.S.A., which is governing law, not a headquarters statement, so no country is recorded. Stoplight's support policy and subscription terms are for the Stoplight Platform and are not used for the open-source package. The homepage comparison section names ReDoc and Swagger UI (alternativeTo redocly and swagger-ui, the ids of their records). The npm package @stoplight/elements is the install route the README names; the GitHub release object v6.1.10 is from 2021 and the tags run to v6.4.1, so the registry major (9) is higher and sets currentMajor and latestReleaseDate, per the import rules. The npm dist-tag beta points at 9.0.30-beta.1 (2026-11-09), newer than the latest stable, so latestPrereleaseDate is recorded. firstRelease is 2019 from the oldest GitHub release (v2.1.0, 2019-06-20). The engines field of the npm package (node >=16) belongs to a browser library and is not recorded as runtime. Runtime is not recorded: the README and docs describe browser use only, and the docs say Elements dependencies expect Node.js globals that bundlers must polyfill, which is a bundler note, not a runtime. Basis for basedOn is left open: the README says "Available as React Components, or Web Components", and the repository description says "embeddable React or Web Components"; a reviewer may decide whether that is a React binding (basedOn react) under the rule for taglines naming the framework. The README says Elements sends anonymized installation analytics through Scarf, only during installation, and that the package.json field scarfSettings.enabled set to false (or the SCARF_ANALYTICS=false environment variable) turns them off. The README describes three-column and stacked layouts and an apiDescriptionUrl property for the OpenAPI document, which are not recorded as fields. Server-side rendering is mentioned for Docusaurus with the history router; that is compatibility, not renderingModes. The README's roadmap names OpenAPI v2.0, v3.0 and v3.1 support, which is a spec-compliance statement and is not recorded as a field. The Stoplight Platform and Studio integrations (hosted documentation powered by Elements) are the vendor's products built on Elements; no hostedOffering is recorded for Elements itself. The LinkedIn footer link is not recorded because linkedin is a coined field. The docs.stoplight.io/docs/elements address answers 404 and is not cited.
