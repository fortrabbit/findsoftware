notes: >
  The project has no GitHub releases and no tags; the latest release is the npm version 0.0.73 of mdu.js, published 2024-12-31, which is also the last push to the repository. The README license line says LGPLv3, the LICENSE file is the GNU Lesser General Public License version 2.1 and the npm package states LGPL-3.0; each statement is its own license entry. The npm packages named modulo and modulojs are other projects (an Express toolset and a 2012 package) and are not used for the figures. The npm package mdu.js is the one the README loads from unpkg. The README states "Project Status: `alpha` (Well-documented with lots of examples, but still a work in progress -- help by trying it out!)". The CSV lists the category ssg; the README calls the framework usable on Jamstack static sites but does not name it a static site generator, so only framework and web-components are recorded.
