notes: >
  The README on the default branch opens with a notice that the project is no longer maintained and that no new features or bug fixes will be released; the repository is archived and the npm package carries a deprecation notice, so the status is discontinued. The README names no successor. A reviewer should check one point: the GitHub API lists a release v4.6.2 and npm lists version 4.6.2, both dated 2026-11-13, and the repository's last push is on the same day, while the CSV row recorded the archive on 2026-10-19; the dates are recorded as the API states them. The homepage given in the CSV is plain http; the https address of the same page answers, and it is recorded. The homepage names no country and no legal address, so hqCountry is left out. The maintainer follows the LICENSE copyright line, NHN Cloud Corp. Stars and contributors belong to the archived repository. The getting-started guide names Node.js only as a requirement for npm, so runtime is left empty; the README also lists React and Vue wrapper packages, which are not separate records here. The earliest tag is 1.0.0, dated 2015-08-07, which sets firstRelease.
