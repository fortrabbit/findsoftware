notes: >
  The CSV homepage sockudo.app does not resolve (curl exit 000, no DNS answer); the repository's homepage field and the project's own homepage both give sockudo.io, which answers 200 and names the project, so homepage is sockudo.io. The reviewer should confirm the CSV row. The homepage says "Sockudo is a self-hosted Rust realtime server" and "Keep Pusher clients on Protocol V1", and it also names an opt-in Ably REST and WebSocket compatibility facade ("excluding Live Objects"); the Ably facade is a second compatibility, recorded here only as the sentence, not as an alternativeTo. Protocol V2 (Sockudo-native events, recovery, history, AI Transport) is described by the README and is not recorded as a field. The alternativeTo pusher value rests on the README sentence that the project keeps strict Protocol V1 compatibility with the Pusher protocol, which the brief counts. The first GitHub release is v1.0.0-beta (2025-05-19); the oldest tag by commit date is also 2025-05-19, so firstRelease is 2025. The repository has no prerelease newer than v5.2.0. The README says the server ships as a Linux binary, a Docker Compose stack and a Helm chart (charts/ folder); the Rust build requirement is not recorded as runtimeMin because the software ships as a binary and image. No npm or registry figure: the repository publishes SDKs for other registries, not a package for the server. The homepage links no social accounts; the README support list gives GitHub Discussions, Discord and X. The README feature table lists mysql, postgres, dynamodb, surrealdb and scylladb as app, history, version-store and push storage backends; Redis, NATS, RabbitMQ and others are fanout adapters and are not recorded as databases. The migration guide names Pusher Channels and Soketi as the stacks it moves from. The README lists the Docker Compose stack with Prometheus metrics, a dashboard UI and a dashboard API. The binary installer is Linux only; other platforms build from crates.io or source. Not record fields: protocols WebSocket, HTTP (https://github.com/sockudo/sockudo/blob/v5.2.0/README.md). compatibleWith Pusher protocol (https://github.com/sockudo/sockudo/blob/v5.2.0/README.md).
