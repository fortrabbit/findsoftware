notes: >
  Repository-only project: the CSV row names no homepage, the README links only the main Channels readme, and no separate project site was found, so no homepage is recorded. The docs fact is the Channels installation page, because Daphne ships inside the Channels project and its install instructions are there; the Daphne README itself gives no pip install line. The repository has no GitHub releases; the tags run from 0.8 to 4.2.3, and 4.2.3 is the newest stable tag, dated 2026-07-21 by its tag and by the CHANGELOG entry. firstRelease is 2016 from the earliest PyPI upload (0.8.1, 2016-02-09); the tag 0.8 dates from the same month. runtimeMin is taken from the 4.2.3 pyproject, which says requires-python ">=3.9". The README on the main branch says "Daphne requires Python 3.10 or later", a newer statement not yet in a release; a reviewer should decide whether runtimeMin follows the release manifest (3.9, recorded) or the README (3.10). The license is recorded once as BSD-3-Clause from GitHub; the pyproject and PyPI metadata state "BSD" and the LICENSE file is the BSD three-clause text. The maintainer is the Django Software Foundation as the LICENSE copyright line names it; the foundation's legal address is not on any page read, so hqCountry is not recorded. The README shows the run command: daphne is pointed at an ASGI application such as django_project.asgi:application, binds to localhost port 8000 by default, can listen on a UNIX socket behind a proxy, can run inside a process manager, and terminates HTTP/2 natively when started with TLS through Twisted endpoint strings. The Channels docs say the Daphne package is installed as the channels[daphne] extra and does not show a standalone install command; the PyPI package daphne installs on its own. The README says Daphne is developed to power Django Channels; that is a statement about the server's purpose, not a parent it is built on, so basedOn is not recorded. The pypiDownloads figure is the last-week count from pypistats, which AGENTS.md allows for PyPI. The dependent counts come from ecosyste.ms for the PyPI package. Protocol support stated in the README (HTTP/2 natively with TLS, WebSocket, UNIX sockets, Twisted endpoint strings) is not in the starter list and is not recorded as a field. Adoption: 2688 stars, 70 contributors, 37 dependent packages and 5881 dependent repositories as read on 2026-10-28.
