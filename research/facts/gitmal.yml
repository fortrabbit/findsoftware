notes: >
  No homepage: the repository's homepage field is empty and the README names no site of its own. The examples and the links to medv.io are the author's personal sites and are not recorded. The README examples are built from a Git repository on the maintainer's own web server; the self-host guide describes that setup. The Dockerfile builds from golang:latest; no version is recorded. The go.mod directive is a repository file rather than a page or registry, so runtimeMin is left out. There is no Go module download figure. The repository's contents listing shows a docs folder with the self-host guide, read in full. The oldest GitHub release is v1.0.0 (2025-12-01), one day after the repository was created. The self-host guide sets up a bare repository whose post-receive hook runs gitmal on each push, with the web root serving the output and a read-only clone URL.
