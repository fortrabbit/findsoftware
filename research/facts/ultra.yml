notes: >
  The install page names deno.land/x/ultra as the module the create script comes from; that is a Deno module host, not npm, JSR or PyPI, so no registry id is recorded. The homepage and README both say the framework is at major 2 (README heading "Ultra 2.0"), which matches the highest stable GitHub release v2.3.8 (2023-09-19). The oldest GitHub release is a prerelease from 2021-08-11, so firstRelease is 2021; 15 prereleases exist and the newest (2022-04-07) is older than the latest release, so no latestPrereleaseDate is recorded. The Deno compatibility badge in the README reads ^1.27.1, recorded as deno 1.27. The deployment pages cover Deno Deploy, through a GitHub Action, and a Dockerfile for fly.io or Docker; they also say production builds run with --no-remote. The build writes to the .ultra folder, and deno task start run there starts the production server. The build step (build.ts, with createBuilder) transpiles TypeScript and JSX to vanilla JS, vendors all dependencies, versions source and public files, and generates two production import maps, one for client hydration and one for the server. The Dockerfile builds the app and then runs deno task start in the container. The Deno Deploy page states that Deno Deploy does not currently support dynamic imports and says to avoid lazy for that target. The README links Discord only; no other social account is recorded.
