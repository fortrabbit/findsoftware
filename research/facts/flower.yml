notes: >
  Celery is the job queue the monitored app runs; the docs do not say Flower is built on it, so it is not recorded as basedOn. The install docs start it with `celery -A tasks.app flower`, which loads the app's own Celery application, so the software is wired into the app; it is recorded as accepted on that basis. The Flower API lets you manage the cluster over HTTP (API reference, flower.readthedocs.io/en/latest/api.html); the docs do not call it REST, so headlessApi stays unknown. The message broker (RabbitMQ or Redis, passed as --broker) is the user's and is not recorded as a database. The configuration page describes a persistent mode that keeps task results and events in a database file (the db option); the engine is not named, so no databases value is recorded. GitHub reports the license as NOASSERTION because the LICENSE text names the project in its clause; the README states BSD 3-Clause. The LICENSE copyright line names Mher Movsisyan, and the docs footer repeats the name; no company or legal form is stated. firstRelease is 2012 from the oldest tag v0.2 (commit date 2012-07-24), since GitHub releases start at v2.1.0. The v2.2.0 setup.py gives python_requires >=3.10; PyPI reports the same value. Features listed in the README include Prometheus metrics and HTTP Basic Auth plus OAuth providers. Gitter, Discord or other community links were not found on the docs pages.
