notes: >
  Accepted: the README documents wiring Huginn into other systems ("Send and receive webhooks to connect Huginn with anything else", "Watch RSS feeds, IMAP mailboxes, webhooks, and MQTT topics", "Publish your own feeds and JSON endpoints from the events your Agents collect"), so a webhook a site sends to it meets the wiring rule. There is no homepage; the GitHub repository is the only project site. Releases use calendar versions (v2026.11.01), so currentMajor is not recorded. The README says Huginn is a "hackable version of IFTTT or Zapier on your own server"; neither has a record. The copyright line names Andrew Cantino with Iteration Labs, LLC in parentheses; the record uses the individual and the company goes here only. The README recommends a Docker Compose setup on your own server for production, with a web process and a background worker, and offers a single-process image beside the all-in-one image. The YunoHost and Unraid packages are maintained by their communities and may lag behind releases. Managed hosting by sponsors is listed in the repository's doc/sponsors.md and is not recorded. Heroku and Dokku recipes are named in the README; only Heroku is recorded as an install route. The wiki was not read.
