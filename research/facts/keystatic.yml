notes: >
  The repository has no GitHub releases; the GitHub tags belong to the monorepo's other packages. The version and date come from the npm package @keystatic/core, which the install docs name. The homepage says "No database". Keystatic has a local storage mode and a GitHub storage mode; the docs call local mode the start of a project. Keystatic Cloud is a hosted add-on that, per its docs page, simplifies GitHub authentication and offers opt-in products such as Cloud Images; no prices are recorded. The integrations are Next.js, Astro and Remix; none is recorded as a base. The GitHub mode page says the host must run Node.js for Keystatic's API routes. The LICENSE copyright line and the privacy policy both name Thinkmill Labs Pty Ltd. The README says the monorepo's development needs Node.js 18; that is not a user requirement and is not recorded. The GitHub mode page says the host must run Node.js for Keystatic's API routes but does not say whether the process runs per request or stays up, so only local is recorded in runsAs. The homepage lists "Markdoc & MDX support" next to Markdown and YAML/JSON. livePreview is not stated as a feature; the docs have a recipe, "Next.js: Real-Time Previews With Draft Mode", which sets up preview routes in the front end. The Pro features (multi-player editing, Cloud Images) sit under Keystatic Cloud; the page lists a Pro plan with a price, not recorded.
