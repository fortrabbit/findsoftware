notes: >
  Doubt: Cockpit is a general administration interface for a Linux server, and its homepage and running page describe containers, storage, networks and logs with no web server or website it manages, so criterion 1 cannot be judged; a page of the Cockpit guide that says it manages web servers, websites or web apps (for example through a web server or domain feature) would settle it, and the reviewer decides whether a general server admin UI is in. The id avoids the Cockpit CMS collision (cockpit.yml). The GitHub API reports no license (NOASSERTION), so the license entries come from the homepage ("released under the LGPL v2.1+") and the README's license list (GPL-3.0 or later, BSD-3, MIT, CC-BY-SA-3.0 for parts); the wordings are recorded as separate entries. The homepage's "Version 370" (released 22 Oct 2026) is recorded as currentMajor, since the project numbers releases sequentially. The homepage says Cockpit "doesn't eat resources or even run in the background when you're not using it. It runs on demand, thanks to systemd socket activation", so runsAs always-on is not recorded. The running page's "If you want to also run a web server to log in directly" is a Fedora CoreOS note, not a runsAs statement, and was not used. The homepage in the CSV was http://www.cockpit-project.org/ in the API; the https site answers 200 and is used. Coined fields: none.
