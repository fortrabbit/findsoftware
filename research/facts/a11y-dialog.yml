notes: >
  Stars and contributors are taken from the GitHub API on 2026-11-04. The CSV npm figure (113.8k a week) is a stale point count; the range figure is recorded. The introduction says "Originally, this repository was a fork from accessible-modal-dialog by Greg Kraus", a fork statement with no record id, so no forkOf is set. The implementations page lists third-party wrappers react-a11y-dialog, vue-a11y-dialog and svelte-a11y-dialog and no official binding, so no basedOn is set. The quick start shows that the bundle on a page instantiates any element with data-a11y-dialog on DOM ready, and that the bundle is loaded by a script tag; no page says in those words that the library runs in the browser, so runsAs is not recorded. The Introduction page says it "Follows the Dialog (Modal) pattern from the ARIA Authoring Practices Guide (APG)" and "Supports alert dialogs as per the WAI-ARIA specifications"; those are feature statements, not fields. The first tag is 1.0.0 dated 2016-02-16 and the npm first upload is 2016-03-01. The CDN install route quotes the sentence before the jsDelivr and unpkg tags. The maintainer is the copyright holder named in LICENSE; no legal entity or country is stated, so hqCountry stays unknown. The introduction page says it "Provides both a DOM and a JavaScript API" and "Supports alert dialogs as per the WAI-ARIA specifications"; the instantiation page says an element without the data attribute is instantiated through JavaScript when the dialog markup is not present on script execution.
