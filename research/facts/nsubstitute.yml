notes: >
  Checked 2026-11-16. The maintainer comes from the Authors line of the csproj; the LICENSE.txt copyright line names the first two of them as holders from 2009 (its email addresses are not recorded) and no legal entity, and the repository belongs to the nsubstitute GitHub organization. GitHub reports the license as NOASSERTION because LICENSE.txt is not the standard SPDX text; the csproj PackageLicenseExpression and ecosyste.ms both say BSD-3-Clause. The homepage gives the NuGet install as Install-Package; the README adds optional Roslyn analysers as separate packages (NSubstitute.Analyzers.CSharp and NSubstitute.Analyzers.VisualBasic), not recorded as routes. The csproj targets net8.0 and netstandard2.0, so no runtimeMin is recorded: the netstandard2.0 target covers runtimes older than 8. firstRelease is 2009 from tag v0.0.0, whose commit is dated 2009-07-27; the first NuGet upload is 1.0.0 on 2011-05-17. The README's "Other libraries you may be interested in" names Moq, FakeItEasy and substitute.js with no alternative statement, so alternativeTo is not recorded. The FakeItEasy line ("If you're not sold on NSubstitute's syntax, try FIE!") is a recommendation, not an alternativeTo quote. The NuGet download figure is the package total across all versions. The latest prerelease, v6.0.0-rc.1 (2026-03-15), is older than v6.2.0 and is not recorded.
