notes: >
  The homepage says "AdminNeo is based on the Adminer project by Jakub Vrána.", so forkOf names adminer; the README says the same. The license is stated as "Apache License Version 2.0 or the GNU General Public License (GPL) version 2" on the homepage, in LICENSE.md and as an SPDX pair on Packagist (Apache-2.0, GPL-2.0-only); one license in these wordings is one entry, recorded from Packagist's SPDX form. The homepage copyright line is the only owner statement and names AdminNeo.org; no imprint, company or legal name was found (the /imprint and /about URLs return 404), so maintainer is AdminNeo.org with maintainerType community, a reviewer should confirm. The download page states "PHP 5.4+ with enabled sessions, modern web browser" for running the release, while composer.json at the v5.8.0 tag requires "7.1 - 8.5" and the same page says compiling from source needs PHP 7.1+; runtimeMin follows the manifest at the latest release tag as the rule says, and the 5.4 figure stays in the runtime quote. The GitHub API lists releases from v4.9.0 (2024-08-20); the changelog has entries back to AdminNeo 4.8.2 (2024-03-16), which firstRelease follows. The repository has 84 tags back to v3.0.0; those carry the Adminer history (v3.0.0's commit is dated 2010) and are not used for firstRelease. The changelog opens with an "AdminNeo 5.9" section with no tag or release yet; it is not a release and is not recorded. The Docker Hub figure is the official image named on the homepage (adminneoorg/adminneo). The homepage lists Elasticsearch (beta) and ClickHouse (alpha) as well; those are left out of databases.
