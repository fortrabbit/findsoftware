notes: >
  The installation guide is a page of the project's documentation site, which is a script shell in a browser read; its text is read from the site's own guide bundle (start.en-US.js beside the site's vue.js), and the same guide covers npm and CDN installs. The README lists server-side rendering as experimental; no page states a rendering mode, so renderingModes is not recorded. The repository moved from jdf2e/nutui, which answers with a 301 to jd-opensource/nutui. The npm latest tag points to a beta, so the highest stable GitHub release (v4.3.14, matching npm 4.3.14) sets currentMajor and latestReleaseDate, and the newest beta, published to npm in April 2026, sets latestPrereleaseDate. The repository license is MIT on the repository and in the README; the LICENSE copyright line names 京东前端 with no legal form, which is recorded as the maintainer. The npm figure counts @nutui/nutui, the H5 package; the Taro package is separate, and it is the sum of the daily counts for 2026-10-18 to 2026-10-24. The npm maintainers are the nutui account and individual accounts, so no maintainerType is recorded.
