notes: >
  The homepage is GitHub Pages of the project's own organization and names the project in its README as the live example. The crate and npm package name opensource.axo.dev/oranda as their homepage, which did not answer when checked; the GitHub Pages address is recorded. The book's introduction says: "Caveat emptor! oranda is still beta-quality software! There may be breaking changes at times, especially in the configuration format." The newest release is v0.6.5 (2024-08-08), and the newest prerelease, v0.6.2-prerelease.1 (2024-02-23), is older than it, so no latestPrereleaseDate is recorded. Two licenses: the Cargo manifest and npm package say MIT OR Apache-2.0, and the repository's LICENSE-MIT carries the Axo Developer Co. copyright line. The book's install page lists cargo-binstall, cargo install, npm, Nix and a GitHub Releases download; the homepage lists a shell installer and Homebrew (axodotdev/tap/oranda).
