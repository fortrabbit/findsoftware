notes: >
  Releases are git branches named by version (132.00stable, 140.00beta01, 141.00beta01), not tags or GitHub releases; the repository's tags are pre-resync markers. So no release date exists to record, and the rule for projects without a release tag applies: lastCommitDate is the committer date of the newest commit on master (2026-10-24); the stable branch 132.00stable also shows 2026-10-27, but that is a branch date. The project's changelog page gives dates for versions up to 2019 and none for the current branches. No currentMajor is recorded: the branch numbers (132.00stable is the current stable branch per the changelog) are not semver majors. The 141.00beta01 branch is the beta and its branch date is not recorded. The git-clone install is marked deprecated in the README and is not an install method. The installer targets AlmaLinux and Rocky Linux 8 to 10 (and CentOS 7 on 132.00stable only, which the project lists as EOL); no runtime or runsAs value is recorded because the pages do not state a runtime or service model in a form the fields hold. The changelog's MariaDB line gives the default database version, and the menu's MySQL Management section is not recorded. The boundary reviewer should decide whether a shell installer for a LEMP stack counts as server software for websites (criterion 1) and whether branch-named releases count (criterion 4); the rule for no tagged releases was applied. The homepage quote is the menu banner text.
