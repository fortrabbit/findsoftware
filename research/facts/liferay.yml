notes: >
  Calendar versioning: the release tags are 2026.q3.0 style, so no currentMajor is recorded. The latest tag 2026.q3.0 is on the repository and its commit date is used for latestReleaseDate; the GitHub releases page itself stops at 7.4.3.132-ga132 (2025-02-19), which is not used. The repository license field from the GitHub API is NOASSERTION; the LICENSING.md statement is recorded instead. The README says Liferay Portal and Liferay DXP are one product, so the Portal CE name is not recorded as a separate record. Free Tier needs an activation key from the Liferay Marketplace and is recorded only in the Free Tier page quotes, not as a paidEdition. The homepage quote is the site name; the install page for self-hosted setup was not reachable at the guessed URLs, so runsAs rests on the README statement that the bundle contains Tomcat. The Free Tier page calls itself the same core platform as an Enterprise Subscription; the subscription gate is in the README quote. The releases list on GitHub has no stable entry newer than 7.4.3.132-ga132 (2025-02-19), so 2026.q3.0 stays the newest tag. The about page dates the company to 2004, which is no first release of the software, so firstRelease stays unknown. The CSV adoption field says 2.3k stars, now 2266 from the API.
