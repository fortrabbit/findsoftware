notes: >
  The LICENSE copyright line reads "Copyright (c) 2021-present Modern.js", recorded as the maintainer. The introduction says "At ByteDance, we use Modern.js to build upper-level frameworks", which states use and not maintenance, so no parent is recorded. The quick start states the Node.js minimum as "not lower than v22.18.0", while the npm package engines field of the latest release says node >=20; the two pages name different releases, so only the engines value of the current major is recorded. The docs site labels itself "Modern.js 2.x Docs" while the npm latest tag is major 3, a label a reviewer should check. The repository is a monorepo; the registry figures come from @modern-js/app-tools, which the quick start calls the core package. The install command runs @modern-js/create, a scaffolder. The introduction says Modern.js "uses Rsbuild/Rspack as the build tool". The build command is "pnpm run build", with artifacts in dist/. The quick start says Modern.js Server provides "capabilities for development and production servers", and the SSG page says pre-rendered pages "can be cached by a CDN"; neither states what the live site needs from the host, so runsAs stays unknown.
