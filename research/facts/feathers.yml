notes: >
  The install step is npm create feathers, a scaffolder, so the registry figures come from the core package @feathersjs/feathers, which the quick start installs. The core package declares engines node ">= 12" while the quick start says the framework works with all currently active Node.js releases, so runtimeMin is left out. The home page and README both call Feathers a full-stack framework for creating APIs and real-time applications. The quick start says a service has find, get, create, update, patch and remove methods, and that a transport turns a service into a server: @feathersjs/koa uses Koa to turn services into a REST API, and @feathersjs/socketio uses Socket.io for a WebSocket real-time API. Maintainer is the copyright line of the LICENSE; the website footer says "FeathersJS contributors". The site footer copyright range starts in 2012, which is a copyright year and not a stated first release. No edition or hosted service is stated on the pages read.
