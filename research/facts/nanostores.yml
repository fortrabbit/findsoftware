notes: >
  Framework-agnostic core with official adapter packages for React, Preact, Vue, Svelte (store contract, and @nanostores/svelte-runes), Solid, Lit, Angular and Alpine.js; the adapters are not parents of the record, so basedOn is empty. The ecosystem page lists official companion packages for persistence, data fetching, routing, translations, media queries and nested state, and community devtools; the page's framework table is the source for the adapter list. The README calls Nano Stores a state manager for React, React Native, Preact, Vue, Svelte, Solid, Lit, Angular and vanilla JS, and says it supports server-side rendering: that is compatibility, not renderingModes. The package.json engines field asks for Node.js ^20.0.0 or >=22.0.0 at version 1.5.5; the package is a browser state library, so that is a build requirement and no runtime is recorded. The README states the bundle size in bytes (minified and brotlied) and zero dependencies; bundle size is a coined kind and stays here. The README says Nano Stores is built by Evil Martians, an American design and engineering consultancy; the LICENSE copyright line names Andrey Sitnik, so the maintainer is Andrey Sitnik and the consultancy is named here, not as maintainer. The homepage states a weekly download figure and names Clerk, Better Auth and Astro as users; neither is recorded. The first tag is 0.1.0, whose commit is dated 2021; the oldest GitHub release is 0.10.0 from 2024. The npm figure counts the nanostores package the install page names, which is not a monorepo. The homepage says "Used by Clerk and Better Auth, recommended by Astro"; its code examples show an atom holding a value and a computed store deriving one from another store, read in components with useStore, and mark Svelte and vanilla JavaScript as needing no adapter. The homepage says of SSR "On the client, yes. On the server a store is shared by all requests, so keep per-request data out of it", and the SSR guide says Nano Stores support SSR. The alternativeTo entries come from the homepage use-case page, which names Zustand for readers who like their logic in hooks, and the ecosystem page, which names Redux Toolkit for workflows built around time travel; neither id has a fact file yet, but both have accepted CSV rows.
