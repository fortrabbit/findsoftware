notes: >
  Ackee is a Node.js server with a MongoDB store; the tracking script that sites add is a separate project, ackee-tracker, linked from the README, and its embed is not recorded here. The site attaches through that script (an embed on each site) and the Ackee server runs behind a subdomain proxy per the get-started page. The cookie-free claim is the README's "No cookies: No unique user tracking" and the privacy claim is "Ackee keeps tracked data anonymized"; both are notes only. Coined kinds left in notes: envVars (ACKEE_MONGODB, ACKEE_USERNAME and ACKEE_PASSWORD are the required variables per the get-started page), and the single-user limit from the FAQ ("Ackee only works with one user"), which is a userRoles statement and is not recorded as a field. The FAQ compares Ackee with Fathom; no Fathom record id exists, so only matomo is recorded in alternativeTo. Maintainer: the LICENSE copyright line and the imprint on electerious.com name Tobias Reich; the imprint lists no country and the address is not recorded as hqCountry. The Docker Hub repository electerious/ackee shows 1958609 pulls (read 2026-11-03), and the image is the one the Docker route names. The Helm chart is maintained at suda/charts, not by the project, and the installMethod is recorded because the get-started page documents it. The PaaS routes (Netlify, Vercel, Heroku, Qovery, Render, Railway, Koyeb, Zeabur) are deploy buttons or hosts the get-started page documents; each needs its own MongoDB. firstRelease is the oldest release v1.0.0 (2019-09-13). The package.json at v3.7.1 sets engines node >= 24, matching the docs. The releases list has no prerelease. The docs page at docs.ackee.electerious.com was not fetched; the GitHub docs folder is cited.
