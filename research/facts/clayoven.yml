notes: >
  The README says "There is no published gem", so the 2013 RubyGems upload of a gem named clayoven (version 0.2, same author, homepage the repository) is not the current release channel: no release date, major or download figure is taken from it, and the listing is judged by lastCommitDate. The repository has no GitHub release or tag. The GitHub homepage field gives http://artagnon.github.io/clayoven/; the https address answers 200 with the rdoc documentation, which the README links as its documentation, so the https address is recorded as homepage. No Ruby version is stated in the README, the Gemfile or a .ruby-version file, so runtimeMin is unknown. The README names no output directory, so outputDir is unknown. The README describes the claytext source format, math rendering with MathJaX and XyJaX, a vscode plugin, and that clayoven init creates a starter project, that the engine takes creation and modification times from git history and builds incrementally, and that clayoven aggressive regenerates the whole site. None of these has a field. The project is not a fork, and its README names no parent software; the Slim templating and the gems it uses are dependencies, not a basis, so basedOn is not recorded.
