notes: >
  The repository has no tags and no GitHub releases, so lastCommitDate is recorded; criteria 1 to 5 hold on the sources read (a Next.js storefront template under MIT, installation steps in the docs at docs.blazity.com/enterprise-commerce/setup, a company named as maintainer). The template needs a Shopify store with a Storefront API token and an admin app, and an Algolia middle layer; those are the project's stated backends and are recorded here, not as fields. The README says the repository is hosted on Vercel and the docs carry a banner about the Enterprise CLI for Next.js deployments on AWS, which is a separate product from this repository and is not recorded. The live demo at commerce.blazity.com is named in the README and is not recorded as homepage. The contributor count is taken from the contributors endpoint with per_page=1 and the last page number. The lastCommitDate is the committer date of the newest commit on main from the commits endpoint; the GitHub pushed_at field is later and is not used.
