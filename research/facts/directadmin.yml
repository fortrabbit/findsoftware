notes: >
  No public repository: the product is proprietary and sold by license, so the repository, stars, contributors and npm fields are absent, and sourcePublic is unknown rather than false. Criterion 2 holds through the documented setup script (run as root on a clean Linux server; the install guide and system requirements page list Red Hat Enterprise Linux, CentOS Stream, Rocky Linux, AlmaLinux, Debian and Ubuntu, on amd64 and arm64). Criterion 3 holds through the install guide. Criterion 5 holds through the company, JBMC Software. The CSV row gives lastRelease 2026-10-02 for 1.712; the changelog gives 1.713 released 2026-10-23, which is the latest release and is used. The changelog also lists version 1.714 with the date "Released: 2026-11-??", which is planned and not a release, so it is not used. The policies page footer names "JBMC Software" with no legal form and "Edmonton AB, T5L 5A9, Canada"; the registration number is not recorded. The Pro Pack concept was retired in August 2023 (getting-started/pro-pack): all licenses for sale carry the same features, so the paid licenses differ in account and domain limits, not in features. The first release is not dated on the pages read; the homepage says "New Features Since 2003" and the docs say 2023 marks the 20th anniversary, a founding statement, so firstRelease is absent. No language is stated. The panel manages Apache, Nginx, OpenLiteSpeed and LiteSpeed web servers, MariaDB and MySQL, and Nginx Unit application servers for Python, Java, Ruby, Perl and Node.js, per the technologies and features pages; these are no fields in this record, and DirectAdmin does not state that it is built on another project, so basedOn is absent. Let's Encrypt appears as "Automatic SSL" on the homepage and as "ACME For Domains" in the docs sidebar; no field holds it. JetBackup, Acronis, CloudLinux and Imunify360 are third-party products sold beside the license and are not on this record. The homepage figures "130+ countries" and "1400+ support hours" are not install counts and are not recorded. No social link is on the homepage. The features page at features.php serves the docs changelog, so the feature list is taken from features_list.php. The criterion 1 question, a control panel that manages websites, is settled for this wave as in scope. The license tiers (Personal PLUS, Lite and Standard) differ only in account and domain limits, so no paidEdition is recorded. The docs page on the directadmin binary says that binary is the main application running the web interface, recorded as runtime binary; its language is not stated.
