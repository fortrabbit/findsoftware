notes: >
  Stated under the status and version fields: the v2 line is in beta (reactpy-v2.0.0b13, 2026-07-14), so the stable major is 1, from the highest stable GitHub release of the package. The CSV row carried the beta date as lastRelease; it is recorded as latestPrereleaseDate here. The first GitHub release is the alpha 0.6.1-a.1 (2020-04-24); the oldest stable release is 0.7.0 (2020-05-15), so firstRelease is 2020. The pypiDownloads figure is last_month from pypistats; the PyPI JSON shows -1. The docs site states it is still under construction. ReactPy describes itself as similar to ReactJS, which is not a statement that it is built on React, so basedOn is absent. Built-in backends named on the install page are Flask, FastAPI, Sanic, Tornado and Starlette, with Django, Jupyter and Plotly Dash as separate packages. The homepage links to GitHub Discussions as its community channel, recorded as forum; the discord link is from the README. The CSV row says ui-framework; the README calls it a library, so the category is ui-library and a reviewer may prefer framework. Contributor count is the last page number of the contributors endpoint with per_page=1 (28).
