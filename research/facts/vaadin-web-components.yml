notes: >
  Monorepo: the repository holds about 80 component packages (packages/button, packages/grid and so on) that share one version number and one tag per release. The component pages in the docs import from @vaadin/react-components (for example Button.js) next to the per-component packages, so the npm figure is the @vaadin/react-components package, the one package that wraps the whole set; it lives in this monorepo (packages/react-components). Its npm latest tag points at the 24 line (latest-25 holds the current line), so currentMajor stays from the GitHub releases. The figure counts the React wrappers only, not installs of the per-component packages. ecosyste.ms reads zero dependents for it, which looks like a data gap, so no dependent counts are recorded. The releases are monorepo tags: v25.3.4 (2026-10-22) is the highest stable, so currentMajor is 25; v24.4.21 is the previous major line. The newest prerelease, v25.4.0-alpha4 (2026-10-21), is older than the latest stable and sets no latestPrereleaseDate. The repository API reads the license as null because the root has no LICENSE file; the README says the LICENSE is in each package folder, and the statements are recorded from the README. The Pro components are commercial under the Vaadin Commercial License and Service Terms; the pricing page, linked from the README, is recorded as a link only. The homepage is the components page the README links; the docs are at vaadin.com/docs/latest/components. The first GitHub tag, v20.0.0 (2021-05-31), is older than the first npm version of @vaadin/button (22.0.0-alpha2, 2021-08-24), so firstRelease takes the GitHub tag. The README states that Vaadin collects usage statistics at development time and links an opt-out, which is not a field. The docs state WCAG 2.1 level AA, an accessibility claim, not recorded as a field. The component docs show Lit, React and Flow usage; no page states that the components are built on Lit, so basedOn is not set. The i18n and RTL pages found in the Vaadin docs are the Flow pages for Java applications, not this package, so i18n is not recorded. The social links come from the footer of vaadin.com, a company-wide footer, as the homepage shows them. HTTP Archive has a "Vaadin" entry for the Java framework only, so httpArchiveSites is not recorded for these components. The terms of service name Vaadin Ltd and its Finnish Business ID; the registered office is in Turku.
