notes: >
  The repository is in the php GitHub organization, and the page says it is brought to you by Kévin Dunglas and names Les-Tilleuls.coop as sponsor; the maintainer field follows the page. The docs say the binaries contain PHP 8.5; that is the bundled PHP, not runtimeMin. The worker mode keeps the application in memory between requests, which is the basis of processModel. The Docker "dunglas/frankenphp" image is the project's own image per the docs. Fields coined here: none.
