notes: >
  Envoy is hosted by the Cloud Native Computing Foundation and its homepage calls it a graduated project; the copyright line names "Envoy Project Authors", recorded as maintainer, and CNCF hosting is stated only in notes. The stable docs path is v1.40.2: the unversioned latest docs show 1.41.0-dev, so they are not cited. The GitHub stable release list is the source for currentMajor (1, minor line 1.40 not recorded) and latestReleaseDate; no prerelease appears in the releases API. firstRelease is the oldest stable GitHub release, published 2016-09-12. The homepage and community page link no Discord, X or Slack account; the community page lists the envoy-maintainers Google group, not recorded as a forum. Extension points stated on the homepage (Wasm, Lua, Go and Rust dynamic modules, external processing) and the xDS configuration APIs are not fields and are not recorded. Envoy Gateway, Envoy AI Gateway and other projects built on Envoy are separate software and are not part of this record.
