notes: >
  The repository is not archived and no page declares the project ended. The README says Fathom Lite is no longer getting features and is maintained long-term, a feature freeze that is not an end signal, so the status stays accepted. The latest stable release is v1.3.1 (2023-01-31), so the import moves the record to stub when no release or prerelease appears by 2027-01-31; the reviewer should check that date. The first release is the 2018-05-29 latest-development prerelease tag, older than the 1.0.0 tag commit (2018-06-08). The homepage is the Fathom Analytics site because Fathom Lite has no site of its own. The maintainer name comes from the MIT copyright line and the postal address from the privacy notice of the same company. Attachment: the install guide tells the creator to copy a tracking snippet from the dashboard onto every page, so the site loads a script from the instance (embedMethod: script tag, coined and kept here). The README's Content Security Policy section requires script-src and img-src for the instance host. The README comparison table marks Fathom Lite as "Uses cookies" and the hosted product as cookie-free, so the cookieless claim does not apply to Lite. The hosted Fathom Analytics product (paid, pay per pageviews) is recorded in these notes only, not as a hostedOffering fact, per the wave ruling. The data stores are SQLite by default, with MySQL and Postgres configurable. The Docker Hub repository was last updated 2020-02-14. The README and install guide list no runtimeMin, so none is recorded. The FAQ states Fathom Lite tracks no personally identifiable information and respects Do Not Track; the project's docs also describe a Heroku route and a DigitalOcean one-click route (the DigitalOcean page linked from the docs index answers 404).
