notes: >
  The CSV lists the homepage as planetable.xyz; it redirects to www.planetable.xyz, which serves the same site, so the https address is recorded as given. Planet is a native macOS app: the build page names macOS 12 as the minimum system requirement for building and running it, which no field holds, and no language runtime is recorded. The GitHub releases list spans 5 pages back to release-0.6.9 (2022-06-02), which sets firstRelease. The stable release-0.22.6 (2026-10-08) is the highest stable tag; the insider-* tags are pre-releases and are not used. The FAQ says that with a pinning service the traffic is served by the provider's servers so the Mac need not stay on; no page states that the app itself serves the site, so runsAs is not recorded. The README says the app is at an early stage. The README links its build instructions at planetable.eth.limo, the project's own site on IPFS.
