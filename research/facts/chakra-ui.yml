notes: >
  The install page states a minimum Node.js version without saying whether it applies to building or to running an app; a Node version for the build is no runtime of a UI library, so neither runtime nor runtimeMin is recorded. The page says Chakra UI uses Emotion at runtime today and that a zero-runtime styling model is planned; the Emotion statement is not a field. The Pro product is sold as blocks, templates and premium components under the Chakra Systems Inc. license; its pages show plans with prices, which are not recorded. The LICENSE copyright names Chakra Systems Inc. and the README names Segun Adebayo as the copyright holder; the Pro legal pages name Chakra Systems Inc. and state Delaware governing law, which is not a headquarters statement, so hqCountry is not recorded. The releases list starts with the @chakra-ui/core 0.2.x line in 2019 in the same repository, and the scoped @chakra-ui/react package starts in 2020. The x link is taken from the homepage HTML, which also links the personal x account of the founder named in the README copyright line; that one is not recorded. The docs list Next.js, Remix, Vite and TanStack Router as framework guides. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header. The npm weekly figure is the sum of the daily counts for the period in the value. The httpArchiveSites figure is the mobile count for the technology named Chakra UI. The install page says that, today, Chakra UI uses Emotion at runtime and that the long-term direction is a zero-runtime styling model. The install page says snippets are pre-built components added with the @chakra-ui/cli, and that the provider component is generated at the root of the app.
