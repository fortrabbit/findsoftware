notes: >
  The homepage (VitePress, title "Vexip UI | Make interesting in development") and the English guides in the repository were read; the homepage body carries the text read. The maintainer is the LICENSE copyright holder "vexip-ui and contributors", the GitHub organization; the npm author is an individual (qmhc), not recorded as the maintainer because the project's own LICENSE names the organization. No legal name, imprint or company page was found, so hqCountry is unknown. The first npm version 0.4.0 (2020-04-29) is older than the oldest GitHub release (v1.0.1, 2021-06-17), so firstRelease takes the registry. The CSV weekly figure of 311 is older than the recorded range figure. The npm dist-tag dev (2.1.19-dev.0, 2023) and the 2.0 betas and release candidates (2022) are older than the latest release, so no latestPrereleaseDate. The getting-started guide says the create-vexip template is configured with the relevant plugins, and the guide says the library uses the composition API, that Chinese (Simplified) is the default language with other language packages available, and that the Nuxt module adds automatic import. The README and getting-started guide name the template command "pnpm create vexip" and a Nuxt module (@vexip-ui/nuxt) that is first-party and not a basedOn or plugin record. Server-side rendering is stated as "you don't need to do any additional action", a compatibility statement, so renderingModes is not recorded. The README says all components work in modern browsers without naming a runtime. The homepage links a QQ group and the README a WeChat and Alipay sponsorship; neither has a field, and sponsorship is not a paidEdition. The homepage quote is the project's own description line. The component count on the site and README rots and is not recorded.
