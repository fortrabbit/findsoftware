notes: >
  Homepage and docs are the v4 site (https://vee-validate.logaretm.com/v4); the README points its main docs at the v5 site (https://vee-validate.logaretm.com/v5/), which is the 5.x beta line (5.0.0-beta.0, 2025-08-02), so the stable line recorded is 4.x. The README says the main v4 version supports Vue 3.x only and earlier Vue versions use v2 or v3 of the library; that is a compatibility statement, not recorded as a field. Runtime and runsAs are left out: the pages read name Vue.js apps and the browser-facing form UI, but no sentence states that the library runs in the browser or names Node.js. The companion @vee-validate/rules package (25+ built-in rules, 45+ locales) and the Vue devtools integration are not recorded as a plugin directory or a field; they sit in the README and homepage features. Categories and basedOn: the homepage says "VeeValidate is the most popular Vue.js form library" and that is not recorded because it is a ranking. Alternatives: the Credits section says the validation syntax is inspired by Laravel and the v4 API by Formik; "inspired by" is no alternativeTo statement, so none is recorded. Sponsors: GitHub Sponsors (README) is not a field. npm weekly figure covers 2026-11-01 to 2026-11-07, the period in the URL. Contributors count excludes anonymous contributors (default endpoint). The npm package tag "next" and "edge" alpha releases are not GitHub prereleases and are not recorded.
