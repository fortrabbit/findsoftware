notes: >
  Status discontinued: the repository the project names, HubSpot/odometer, is archived on GitHub (archived true in the repository API, checked 2026-11-16); the README is seven lines and states no end, so the archive flag is the signal. The last GitHub release is v0.4.7 (2014) and the newest npm version is 0.4.8 (2017-02-05), which is the date recorded as latestReleaseDate under the registry rule. The GitHub release list starts at v0.4.0 (2013-10-16), so firstRelease is 2013, while npm's version history starts at 0.4.6 (2014-03-04). The README links to http://github.hubspot.com/odometer, which redirects to https; the https form answers 200 and is recorded as homepage and docs. The site says "Odometer was made by Adam Schwartz and Zack Bloom of HubSpot." The LICENSE copyright line names HubSpot, Inc.; the privacy notice on legal.hubspot.com gives the company postal address in Cambridge, MA, United States. The library is used in the browser by adding its script and theme files, but no page states a runtime or a runsAs value, so both are left out. The npm package has no repository field and the npm and GitHub descriptions agree on the library. No alternativeTo or fork statement was found.
