notes: >
  The repository moved: github.com/deepkit/deepkit-framework (the URL in the npm metadata and the README clone line) answers with a permanent redirect to marcj/deepkit, which the GitHub API reports as the repository, so the repository is marcj/deepkit. The npm package named deepkit is unrelated (ISC license, no repository, empty author) and is not used. The README lists @deepkit/type first under "Core" packages and its badge names it, so its figures are recorded; @deepkit/framework and @deepkit/app carry the same version and a lower weekly figure for the same week. The README says "Define your types once and use them everywhere—validation, serialization, database, HTTP, RPC, and dependency injection." and "Use only what you need from 40+ independent packages". The framework page says "Since the app now imports the FrameworkModule, we see there are more commands available", among them server:start, "which starts the HTTP server"; no page states whether the process keeps running, so runsAs is unknown. The framework's own docs source is read from the repository, the rendered site at deepkit.io serves the introduction page only. The root package.json of the monorepo declares node >= 20.0.0, but that file belongs to the development setup, not to the published packages, so runtimeMin is not recorded. The runtime types getting-started page says "To install Deepkit's runtime type system two packages are needed: The Deepkit Type Compiler and the Deepkit Type package itself" and that "experimentalDecorators": true "is necessary for certain functions of other Deepkit libraries and in Deepkit Framework". The deployment page compiles the app to JavaScript with tsc and runs it with Node. The maintainer name is the copyright holder in the LICENSE.
