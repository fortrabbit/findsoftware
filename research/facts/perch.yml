notes: >
  Stub: the homepage says Perch "is supported and regularly updated", but the latest news entry is Perch Update 3.2 from 13 May 2021, which fixes PHP 8 compatibility; a dated release after 2022 would settle whether it is still active. The legal entity is Perch Runway Limited, a company registered in England and Wales (Licence Terms at account.perchcms.com/license), which is a registration statement and not a headquarters statement, so hqCountry is unknown. Perch is commercially licensed with a one-time fee per website and a free local trial; no price is recorded. The news page treats Perch and Perch Runway as two products released together; Runway is a separate larger edition and is not recorded here. The 2019 blog post announces a Perch 4 without a release. The templates use Perch's own template language, which has no starter-list value, so templating is left out. The source code is distributed to licensees and no public repository was found.
