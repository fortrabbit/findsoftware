notes: >
  The API documentation at api.foxycart.com/docs calls the Foxy API a hypermedia-driven RESTful API; the API root answers only with a JSON error that asks for a FOXY-API-VERSION header. The about page calls the company a bootstrapped Canadian-run small business with developers around the world; the terms name FoxyCart.com, LLC and set the governing law and arbitration as the State of Texas. Neither states a headquarters country, so hqCountry is not recorded. The terms also name Stripe, PayPal, Authorize.net, Square and Zoho as third-party services, which are payment and tool providers and are not recorded. The record's domain is foxy.io; the company's legal name uses FoxyCart.com. Foxy is a product of the same company under both names.
