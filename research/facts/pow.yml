notes: >
  The README and homepage call Pow a solution "for Phoenix and Plug-based apps", so basedOn records phoenix from that sentence; Plug has no record. The mix.exs at tag v1.0.39 requires Elixir "~> 1.14"; that is an Elixir version, not an OTP minimum, so runtimeMin is left out. The homepage quotes "built in Elixir" and the repository language is Elixir, so runtime elixir maps to the BEAM. The homepage links a Slack workspace of the Elixir community and a GitHub Sponsors page; neither is recorded as the project's forum or a fact field. The README says the default cache store suits development and test ("For a production environment, you should use a distributed, persistent cache store") and names Mnesia, with a Redis cache backend guide for read-only file systems; these are cache stores, not where the software keeps content, so no databases value is recorded. The README feature list names multitenancy and API token authorization, and "Other libraries" names PowAssent for multi-provider login (Twitter, Github, Google, Facebook); PowAssent is a separate package, so no sso value is recorded. The repository was last pushed on 2025-01-28 and the last release is 2025-01-11; no end signal is stated. The maintainer follows the LICENSE copyright line, which names Dan Schultzer and the contributors. The x link is the maintainer's account in the homepage markup, recorded as a social link the same way other records record author accounts.
