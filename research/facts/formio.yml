notes: >
  This record is the self-hosted community edition: the repository, its OSL-3.0 license and the Docker Compose and Node.js routes. The Enterprise Server is a separate paid image (formio/formio-enterprise on Docker Hub) run with a LICENSE_KEY environment variable and a MongoDB connection; its page is help.form.io/deploy/enterprise-server, and its Docker image pull count is not recorded because the community install route does not use that image. The pricing page lists the self-hosted Enterprise configurations, the Enterprise Form Builder Module and the developer portal as paid items, without prices here. The Form.io Hosted platform is recorded as a hostedOffering fact because the README names it as a deploy target; the reviewer may decide it is cloud-only and belongs in notes. The npm package formio is this repository's package.json (the engines field gives Node.js 22), but no install page names npm, so no npm figure is recorded. The tag v4.11.0 commit is 2026-10-14 and the npm publish is 2026-10-09; the tag date is recorded. The highest stable tag is v4.11.0 and no newer prerelease tag exists. The about page footer carries a Dallas, TX address and names no country, so hqCountry is not recorded. SSO: the portal has a PORTAL_SSO setting that names no protocol, so no sso fact is recorded. The formio.js JavaScript library is a separate repository: the README says forms are embedded in Angular.js and React applications with the formio element, a coined embedMethod kept here. The Form.io LLC copyright line is dated 2020. The community README states MongoDB as a requirement and shows the server as a running application; the help pages read (deploy/enterprise-server) describe the paid Enterprise image, so they are not cited for the community edition. The FAQ lists the open source core as the form renderer and builder (formio.js), the API server, and the Angular and React libraries. Community support is a Gitter room (a chat, not recorded as a forum) and a StackOverflow tag. README, License Change (March 8th, 2020): 'This library is now licensed under the OSL-v3 license, which is a copy-left OSI approved license'; the change was from BSD. form.io/form-io-open-source-core-vs-enterprise/ lists as Enterprise only: the Developer Portal with teams and roles, premium actions including role assignments and 2FA, and built-in user authentication 'including OAuth, SAML, custom JWT Tokens'; the Enterprise Form Builder Module 'allows non-developers to build drag and drop forms inside your own application'. The README describes 'a simple drag-and-drop form builder interface'. The FAQ translation answer does not say which edition it covers; translations live in the formio.js renderer, a separate MIT library. form.io also has vs FormAssembly and vs Jotform posts; neither has a candidate row.
