notes: >
  The docs name the Go module path for every package (github.com/beatlabs/patron/component/http) and show import blocks, so the library is added to a Go project by import path; no go get command appears on any page read, so criteria 2 and 3 are judged to hold on the import paths and the status follows the release rule. No homepage: the repository's homepage field is empty, and the thebeat.co link in the README is the maintainer company's site, not the project's. The repository is a fork of mantzas/patron (GitHub reports the parent and the README says "This fork is maintained by Beat Engineering"); the README also names Sotiris Mantzaris as the original creator. The firstRelease year comes from the earliest release on the upstream mantzas/patron repository (2018-06-04); the fork's own earliest release is 2019-01-31, and its latest release is v0.74.0. The maintainer is recorded as the README names it; no legal name or company form appears on any page read. The docs also describe client packages for SQL (database/sql wrapper), Redis, Elasticsearch, MQTT and message brokers; only MongoDB maps to the databases vocabulary. No runsAs is recorded because the pages state that the service hosts HTTP endpoints, not the process model of a deployed service. Go modules have no download figure, so no registry figure is recorded.
