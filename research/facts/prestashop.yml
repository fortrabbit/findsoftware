notes: >
  GitHub reports the license as NOASSERTION because core (OSL-3.0) and bundled modules (AFL-3.0) differ; composer.json declares OSL-3.0. From version 9, release zips are no longer on GitHub; the 9.2 announcement links https://prestashop.com/versions/ for downloads. The project site (prestashop-project.org) and the company site (prestashop.com) are separate; the project site names PrestaShop SA only as trademark owner, and the company site offers the free Classic download and a hosted store without prices (the pricing URL answers 404). The themes page implies Smarty templates without stating it, so templating stays out. endoflife.date has no PrestaShop entry and the release pages state no support duration. Coined: hostedOffering (vendor-run hosted version of an installable product), defaultTheme, usageClaim. Contributors counts GitHub accounts, anonymous excluded.
