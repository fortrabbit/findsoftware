notes: >
  The homepage link is https. The site and the README both name the license as the PostgreSQL license. The README and COPYING file give the copyright as Portions Copyright (c) 2015-2019, Sutou Kouhei and the site footer as the PGroonga Project; the maintainer is recorded as the site states it. No legal entity or country is stated for the project. The Windows packages bundle Groonga (LGPL 2.1), MeCab, LZ4, msgpack-c, xxHash and the NAIST dictionary under their own licenses; these are not the license of PGroonga and are listed on the homepage. The x and facebook links are the Groonga accounts; the community page says they share PGroonga information. The Zulip chat room (groonga.zulipchat.com) is named on the community page and is not recorded as a forum field. ClearCode Inc. sells PGroonga technical support (support page); it is not the maintainer. Supabase offers PGroonga on its managed PostgreSQL (users page); it is a third party, not a PGroonga hosted offering. The install page lists PostgreSQL 12 to 18 as supported; the runtime is the PostgreSQL server the extension loads into, and no page states a runsAs value, and PostgreSQL is not a runtime value in the field list, so runtime is not recorded. The Windows install page names an installer and a zip package for each PostgreSQL version. The FreeBSD install page was not read; the install page lists it.
