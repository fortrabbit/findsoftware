notes: >
  The homepage https://fastn.com, which the repository names as its homepage, did not answer on 2026-10-23: DNS resolves, but the requests to https://fastn.com/, https://www.fastn.com/ and http://fastn.com/ timed out or were reset, repeated over several hours and once more at the end of the session. No page shows the software, so homepage, docs and the install page are not recorded and the status is stub under AGENTS.md; the project's repository README and the site source in the repository's fastn.com folder are the sources for the remaining facts. The record is checked again when the site answers. The repository description reads "🚧 (Alpha stage software)", which is not a field and is not recorded as one. The README names FifthTry, a company that also offers its own hosting for static and dynamic fastn sites with no prices recorded; no selfHostOption or hosted record is written from that. The copyright holder is FifthTry, Inc and Contributors per the LICENSE header. The highest stable GitHub release is 0.4.113 (2025-09-17); the releases 0.3.10, 0.4.32, 0.4.34, 0.4.62 and test-static-linux are marked prerelease, and the newest of them (test-static-linux, 2025-05-25) is older than the stable release, so latestPrereleaseDate is not recorded. The oldest release is v0.1.2 (2021-04-30). The rust-toolchain.toml pins the build toolchain at 1.89.0, which is a build pin and not a stated minimum, so runtimeMin is not recorded. The Discord link is in the README badge, and its URL appears only inside the badge markup, so discord is not recorded.
