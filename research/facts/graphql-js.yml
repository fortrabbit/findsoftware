notes: >
  The CSV homepage http://graphql.org/graphql-js/ redirects (308 to https, then to https://www.graphql-js.org/docs/); the project's own site is recorded as the https address it reaches.
  The README names a community forum: "Discord channel #graphql-js" on discord.graphql.org, which is the GraphQL community server, not a server of the project; it is not recorded as forum or discord. A reviewer may decide otherwise.
  The README says the library "can be used both in a Node server and in the browser"; per the runtime rule it records runtime node and no runsAs.
  The README says the library can be used both in a Node server and in the browser; the record keeps runtime node and no runsAs, as the rule for libraries that name both sets.
  The npm install route is one installMethod: the README gives npm, yarn and bun commands for the same registry.
  The repository is managed under the GraphQL Foundation's membership agreements (EasyCLA); the README names the foundation only as a place to join for financial support, so the foundation is not the maintainer; the LICENSE line is.
  The repository default branch is 17.x.x. Releases of older lines (v16.15.0 and v15.11.0) were published on 2026-11-04 with v17.1.0; latestReleaseDate is the newest stable release by date and currentMajor the highest stable version.
  Stars and contributors belong to the repository, which is the reference implementation and not a monorepo.
