notes: >
  Stub, in doubt on criterion 1: the only app the project's own pages show submitting mail through maddy is Mailman 3 (docs/third-party/mailman3.md at v0.9.6, configured to send through the Submission port with authentication and TLS), a mailing-list manager, which is itself out of scope, not a website or web app. The same page set also covers other SMTP servers forwarding to maddy's LMTP socket and Dovecot SASL. A page documenting a website or web app that sends mail through maddy would settle it. Coined fields, kept here: mailSubmitters (Mailman 3, as above) and protocols (SMTP and IMAP, plus DKIM, SPF, DMARC, DANE and MTA-STS, from the homepage). The forum entry is the project's mailing list on lists.sr.ht; the homepage also links an IRC channel. The IMAP storage is labelled "beta" in the README ("IMAP storage is \"beta\""), which is a project statement, not a fact field. The FAQ compares maddy with MailCow, Mail-in-a-Box, WildDuck and ZoneMTA; WildDuck and ZoneMTA have no fact file, so only mailcow and mail-in-a-box are recorded as alternativeTo. The project's own pages say maddy replaces Postfix, Dovecot, OpenDKIM, OpenSPF and OpenDMARC; no alternativeTo is recorded for them because the README names them as replaced components. go.mod names Go for building from source; the tarball and Docker image are the user-facing installs, so no runtimeMin is recorded. The v0.9.6 release is marked "[SECURITY]" in its title; the repository has no end statement. The maintainer is named in the copyright header of maddy.go (the header also credits Maddy Mail Server contributors); the COPYING file is the plain GPL text with no holder. Docker Hub figure is the foxcpp/maddy image named in the Docker page. Maddy's own site lists the Docker image, binary tarball and source build as install routes, recorded as installMethod entries, plus the Arch Linux packages from the setup tutorial. The tarball includes a systemd unit file (setup tutorial). The FAQ says there is no webmail and administration is done via the CLI utility.
