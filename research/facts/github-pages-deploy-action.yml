notes: >
  The only homepage candidate is the GitHub Marketplace listing (https://github.com/marketplace/actions/deploy-to-github-pages), which the CSV row and the repository's homepage field name. A marketplace page is a directory, so no homepage is recorded; a reviewer may choose to link it. The default branch is dev, and README and action.yml were read there and at tag v4.9.0. action.yml declares the node24 runner runtime, which is the GitHub runner's and not something a user installs, so no runtime is recorded. The README calls Ubuntu the primary platform and gives a Windows workaround with artifacts; recorded here, not as a field. The README says the action depends on rsync, which a container job must install, and the lfs input needs Git LFS on the runner; neither is a field. The install channel is the GitHub Marketplace and the uses line, with no registry package. The GitHub contributors endpoint was read with per_page=1 and its last page is 39.
  The README says the branch input defaults to gh-pages, clean is on by default, single-commit wipes the existing history of the deployment branch, the action deploys with the repository token by default and accepts a personal access token or an ssh-key, and without a token or ssh-key the workflow needs Read and Write permissions for GITHUB_TOKEN or contents: write in the workflow file.
