notes: >
  Accepted as a testing library for Python test suites. PyPI lists the repository as its Homepage and no other project site is named, so no homepage is recorded; the documentation is recorded as docs. The README says the library is "a Python version of Ruby's VCR library" (the record vcr); a port is not recorded as basedOn, forkOf or alternativeTo. The project's Ruby origin is in notes only. The maintainer follows the LICENSE copyright line, which names Kevin McCarthy; the PyPI author email names the same person. The latest release is v9.4.2 (2026-11-02) on GitHub and PyPI; the oldest tag is v0.1.0, and the oldest PyPI upload is 0.0.1 (2013-02-22), so firstRelease is 2013. The PyPI figure is the pypistats last-month count for vcrpy, a rolling window read on 2026-11-17, so the period is recorded with the value. The README's Pytest section points to a separate pytest-recording project, which is not recorded. The GitHub repository and the pypi package share the name vcrpy.
