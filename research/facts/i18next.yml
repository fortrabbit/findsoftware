notes: >
  Repository i18next/i18next holds the core package only, so stars and contributors (225) are the repository's own; the npm figure is for i18next, the package the getting-started page installs. The homepage calls the project a framework for JavaScript and names no legal entity; the LICENSE line names i18next, which is the maintainer as stated. The homepage says the project is maintained by the team that builds Locize, a separate translation management service sold by that team (its SDK is the locize row in the app-services candidates); Locize is not this code's hosted cloud, so no hostedOffering fact. Framework bindings (react-i18next, next-i18next, jquery-i18next and others listed on the supported frameworks page) are separate packages maintained by their authors, so no basedOn. The history page says the project started in 2011, while the oldest registry upload (npm 0.0.1, 2012-01-03) and the oldest tag (1.6.0, 2013-02-12) are later; firstRelease takes the npm upload. The npm 0.0.1 upload is described as "A i18n middleware for the Express.js framework" under the repository jamuhl/i18next-node; it is taken as the project's first form. The current stable line is 27.1.3, published 2026-11-16, and it is the latest GitHub release and the npm latest. The getting-started page names CDN script tags as one route; its Deno route (JSR, URL imports) sits in a code sample, so only the JSR package id is recorded (jsrName). The homepage's reportedInstalls sentence is the project's own statement and is recorded as stated, not checked. The supported frameworks page lists i18next's own CLI (i18next-cli) and the message-format plugins for ICU and MF2, which are not recorded as fields. The README lists backend connection, optional caching, user language detection, plurals, context, nesting and variable replacement as features. The getting-started page says ICU and MF2 replace i18next's own message handling, so plural and context suffix keys and the formatters stop working when one of them is used, and that the syntax is chosen before translation files grow.
