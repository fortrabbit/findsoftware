notes: >
  Hosted-service row: the record takes nothing from the SDK repository workos/workos-node (MIT on GitHub, 227 stars on 2026-11-03, latest release v12.1.0 on 2026-10-30) or its npm package; those stay out of the fact file, as the hosted-service rule says.
  No self-install route is named on the pages read (homepage, docs, pricing, SSO, RBAC, legal), so the status stays hosted-service.
  The homepage lists these products with one line each: AuthKit, Enterprise SSO, Radar, MCP Auth, Directory Sync, Role-Based Access Control, Multi-Factor Authentication, Admin Portal, FGA, auth.md, Audit Logs, Vault, Passport, Airlock and Pipes; they are not recorded as fields.
  The pricing page states "First 1 million active users free" and an enterprise plan with "Enterprise single sign-on with SAML and OIDC support"; the free allowance is a coined freeTier value and goes here only, and no price is recorded.
  The homepage lists SCIM and RBAC in its feature table and the Directory Sync page covers user lifecycle from corporate directories; the Directory Sync page's SCIM provisioning sentence is the SCIM sso fact.
  The homepage's events API and webhooks (docs landing: "Learn to keep your app in sync using the events API and webhooks") and the "RESTful APIs" statement are the wiring evidence; the API is documented with an OpenAPI specification per the docs landing.
  The legal entity is WorkOS, Inc. (terms of service and privacy policy); hqCountry comes from the notice address in section g of the terms, a full San Francisco, CA address, not from the governing-law clause.
  The About page names no headquarters. The Security page lists SOC 2 Type 2 certification, a coined compliance value that stays here.
  The homepage footer links GitHub (github.com/workos), LinkedIn (linkedin.com/company/workos-inc) and a podcast and blog; the LinkedIn link is a coined field and is not recorded.
  The enterprise SLA states 99.99% uptime for enterprise customers (legal/sla); a coined value, not recorded.
  The homepage's "Get started" and "Talk to an expert" paths and the Atlas AI coworker announcement are no field.
