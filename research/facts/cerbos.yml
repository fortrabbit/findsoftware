notes: >
  The deployment page says Cerbos PDP is a stateless system that makes decisions from the information the calling application passes to it, and recommends TLS on the link to the application regardless of the deployment model. The storage page says the MySQL store is one of the dynamic stores that supports adding or updating policies at runtime through the Admin API, and that the disk driver serves .yaml, .yml or .json files from a directory tree.   The GitHub description, the README and the pricing page call the project open-core: the PDP is Apache-2.0 and is "Free forever", and the Enterprise plan adds SSO support and a self-hosted Cerbos Hub. Cerbos Hub is the policy control plane (docs navigation) and has a hosted sign-up (the docs link "Try Cerbos Hub for free"); Cerbos Synapse is a context enrichment layer, not recorded. The footer copyright reads "© 2026 Cerbos.dev"; the terms of service say the site belongs to Zenauth Ltd, and the about page says the team is headquartered in London and fully remote, so the hqCountry comes from the terms' contact address. The docs version selector lists 0.58.0-prerelease, but the GitHub releases list shows no prerelease, so no latestPrereleaseDate is recorded. The container image is published on GitHub Container Registry, so no Docker Hub figure is recorded. The PDP exposes HTTP on port 3592 and gRPC on port 3593 by default, from the container page; those are API statements, not a headlessApi value, since the API decides access and serves no content. The docs' PEP SDKs and integrations are client libraries and ORM integrations, not recorded as sdkLanguages. The oldest GitHub release is v0.0.0-alpha0 (2021-03-23), so firstRelease is 2021. The compare pages (https://www.cerbos.dev/comparisons) name PlainID, Axiomatics, PingAuthorize and EmpowerID and the FAQ names OPA; none has a record, so no alternativeTo is recorded. The community Slack is linked in the footer and has no field; community.cerbos.dev answered 429 and stays unread. The homepage markets the product for AI agents and IAM teams; no field records that.
