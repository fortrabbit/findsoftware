notes: >
  Accepted: an ORM library for Java and Kotlin that a site or app adds as a Maven dependency; the Maven Central artifact io.ebean:ebean is the core runtime. Maven Central publishes no download figure, so none is recorded. The newest stable version is 19.6.0 on Maven Central (2026-09-21); the highest GitHub release object is 18.6.0 (2026-09-21) and the GitHub tags stop at v19.0.0, so the registry major 19 is recorded (registry major higher than the GitHub release). The Maven Central 19.5.0-RC1 is a release candidate and is not used. The repository docs/LIBRARY.md states "Repository Version (this checkout): 16.5.0", which is stale; it is not used. The first GitHub tags are avaje-ebeanorm-server-3.1.1 and avaje-ebeanorm-spring-3.1.1 (2012-09-14), which pre-date the io.ebean rename; firstRelease follows them. The Maven Central metadata lists io.ebean:ebean from version 10.1.1 on, so the io.ebean coordinates are the rename of the avaje-ebeanorm line. The LICENSE copyright line is the Apache boilerplate ("Copyright 2012 Authors") and names no holder; the maintainer is the developer entry of pom.xml. The GitHub owner is the organization ebean-orm. The homepage database list also names H2, NuoDB, PostGIS, SAP Hana, CockroachDB and Clickhouse, which have no dictionary value and stay here. The Getting started page names Maven, Gradle and IntelliJ and Eclipse plugins; only the Maven route has a sentence in the project's own guide, so Gradle is not an installMethod. The homepage names Kotlin beside Java; the GitHub language is Java. The homepage lists sponsors (Foconis, Premium Minds, Timerbee), not recorded. The comparison pages at ebean.io/docs/architecture/compare-jpa and compare-hibernate compare the architecture and do not name alternatives; no alternativeTo is recorded. The README names GitHub Discussions beside the Google group; the group is recorded as the forum. The README names three levels of query abstraction (ORM queries mixed with SQL, DTO queries, SqlQuery and JDBC), type-safe query beans, and built-in migration generation and running. The project's docs/LIBRARY.md lists as not in scope: HTTP routing and controllers, dependency injection, JSON serialization and front-end rendering, and says Ebean is paired with a web framework and a DI library as needed.
