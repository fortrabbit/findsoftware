notes: >
  No project website is named: the repository homepage field is empty and the README names no site (its APT link goes to a third-party package repository, packages.azlux.fr, and is not a homepage). The repository is the source. Criterion 1: the README says the directory structure "dictates the webhook URL", and the Upstream Authentication and Signature Verification sections describe calls from services such as Discord and reverse proxies; a site or service sending a webhook to the server is the wiring. The README's Post-Hook Notifications section sends script output to Mattermost, Slack, Discord and email; those are outbound, not fields. The README names Authelia, Pomerium and Traefik as upstream authentication providers for the server; they are not recorded as parents or sso. The protocols the server speaks are HTTP, server-sent events and chunked transfer coding, and the optional TLS with ACME; none is an sso value. The maintainer is the copyright holder on the LICENSE file (Nicolas Carlier) and the GitHub profile type is user. The first release is v0.0.1, a GitHub prerelease dated 2014-09-24, so firstRelease is 2014 under the prerelease rule. The highest stable release is v1.22.1 (2026-10-22); v0.0.1 is the only prerelease kept in the list. The Docker image ncarlier/webhookd is named in the README; dockerPulls is the Docker Hub pull count of that image. The README states a 1-99 exit code maps to 500 and 100-255 adds 300; that is a behavior, not a field. Contributors is the page number of the rel="last" link on the contributors endpoint with per_page=1.
