notes: >
  Status: no end signal. The repository is not archived; the npm latest version 6.11.1 is not deprecated. The repository is a monorepo: stars, contributors and the GitHub release list belong to the whole repository, and the registry figure is for @rjsf/core, the package the install docs name (First install the dependencies from npm, then npm install @rjsf/core and @rjsf/validator-ajv8). The README lists theme packages (Ant Design, Chakra UI, Daisy UI, Fluent UI, Mantine, Material UI, React-Bootstrap, Shad CN) and validator packages as sibling packages in the same repository; they are not recorded as separate records here. The Bootstrap 3 theme is deprecated in the README; that is a sibling package and does not end this record. The legacy unscoped npm package react-jsonschema-form, first published 2015-12-17 and last at 1.8.1, carries a deprecation on its latest version saying it has been moved to @rjsf/core; its 50,967 downloads for the same week are not recorded, since the current package is the one counted. The oldest GitHub release, v0.1.0 (2016-01-28), is later than the npm upload of 0.1.0 on 2015-12-17, so firstRelease takes the npm upload of the same product name. The docs say the project initially started as a mozilla-services project; that is history in the docs and not a forkOf or basedOn statement. The LICENSE.md file carries the Apache License text without a copyright holder line, so the maintainer is the rjsf team named by the core package README contact line. The docs say the component builds forms out of a JSON schema and the install names an Ajv validator package; JSON Schema is the specification the library works from, recorded here in notes and not as basedOn. The docs say the latest version requires React 16 or later; that is a framework peer requirement and not a runtime. The README's Testing line names BrowserStack; not a field. The docs say the validator packages localize error messages (the Ajv 8 validator through ajv-i18n) and the form takes a translateString prop for its own strings; the translateString sentence is the i18n quote. The @rjsf/core package.json author line names Nicolas Perriault, the original Mozilla author; the project's own contact line names the rjsf team, which is kept as the maintainer. The docs footer links the community Discord.
