notes: >
  The README badge says "status-alpha", and the roadmap page is linked from it; no end statement was found. The contact page (trailbase.io/contact) names one person, Sebastian, and a Zurich address, with no company name or legal form, so the maintainer is the GitHub organization trailbaseio and no hqCountry is recorded. The OSL-3.0 wording is the one the README gives; the LICENSE file has no copyright line. The README says the client libraries are dual licensed under Apache-2.0; those client packages (npm trailbase, pub.dev, crates.io, PyPI, NuGet, Maven Central, Go and Swift) are not this record's license, so they are recorded here only in notes. The homepage names Postgres as experimental. The sso value is social sign-in through OAuth (Google, Discord named); no SAML, OIDC or LDAP statement was found on the homepage, the install page, the auth docs or the README. Compare pages at trailbase.io/comparison/pocketbase/ and /comparison/supabase/ are the project's own compare pages; the homepage's "Firebase alternative" line is the source for firebase. The runtime is the native binary; the Cargo manifests at v0.35.8 state no rust-version, so no runtimeMin is recorded. The admin dashboard and optional auth UI are served from the binary (trail components add trailbase/auth_ui); the homepage's live demo is a public demo login, not a hosted offering. Adoption: GitHub stars and contributors from the API; Docker Hub pulls for trailbase/trailbase, the image the install docs name. The npm trailbase package is the client and no npm figure is recorded, since the install docs name the binary and the image.
