notes: >
  The homepage at orama.com now presents Metis, an enterprise AI platform from the same company, and names OramaJS as its open-source search library; homepage is set to the OramaJS product page. The company's cloud is Lake on orama.com while docs.orama.com still titles it Orama Cloud; the orama-js docs page renders its body client-side, so the docs fact cites the README; the hostedOffering quote comes from the cloud docs page's server-rendered title. GitHub's license detector reports NOASSERTION for LICENSE.md, whose text is Apache 2.0. Tag v3.2.0 (committed 2026-06-27) has no GitHub release and npm latest is 3.1.18, so the release date and major are those of 3.1.18. The npm figure sums the full week 2026-09-28 to 2026-10-04, because the npm API returns zero for some later days. The homepage's monthly download figure (5.8M, 30 days to 11 Sep 2026) is vendor-stated and not recorded. The README links an Orama Slack channel (orama.to/slack); no field holds it.
