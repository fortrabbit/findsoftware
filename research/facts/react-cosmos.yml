notes: >
  The repository is a monorepo; the npm package react-cosmos is the core package the getting-started guides install alongside a bundler plugin, so its registry figures are recorded. The latest GitHub release is v7.4.1 (2026-08-31, stable); the oldest GitHub release is a 2014 prerelease, which gives firstRelease. The homepage lists integrations with Vite, Webpack, React Native and Next.js, and the guides name Create React App and custom bundlers; these are integrations, not a basedOn statement, so only React is recorded as the parent. The docs describe the cosmos-export command, which writes the static export. The React Native guide uses react-cosmos-native, and the Vite guide uses react-cosmos-plugin-vite; the Webpack command is the one recorded. No page names a Node.js requirement or an engines range, so runtime and runtimeMin are not recorded; the docs have a Node.js API page, which names the file system, not a runtime version. The README's social links are recorded from the README (Discord, GitHub Discussions, Twitter); the homepage links the same accounts. The migration guide at v6 to v7 is a version guide, not an alternativeTo statement. The LICENSE copyright line names Ovidiu Cherecheș, recorded as maintainer without a legal form, as the page gives none. The npm weekly figure is the sum of the daily counts for 2026-09-28 to 2026-10-04. The homepage's key features are a file-system based module convention for defining component states and a playground for browsing fixtures and manipulating components; the docs' static export page says the exported UI cannot open the selected fixture in the code editor, but anyone with the URL can browse fixtures and play with component inputs.
