notes: >
  No homepage is recorded. The GitHub homepage field points to friendsofsymfony.github.io, the Friends of Symfony organization page, and that page does not name FOSElasticaBundle. The maintainer is the name composer.json gives in its authors list at v7.2.0 ("FriendsOfSymfony Community"); the three individual authors listed there are not recorded as maintainer. The first registry upload is v1.0.0 on Packagist (2013-03-27), older than the oldest GitHub release (v3.0.6, 2015-01-04), so firstRelease follows Packagist. Packagist downloads are 18777212 total and 240841 in the month the endpoint reports. The README calls version 7 compatible with Elasticsearch 8 and 9 and states that earlier versions "are not maintained anymore"; that is a statement about old majors, not an end signal. The bundle has persistence drivers for Doctrine ORM, MongoDB and PHPCR (doc/setup.md), which are the application's own stores and not recorded as databases. Elasticsearch is the engine the bundle integrates with; the README states an integration and no extension relationship, so it is not a basedOn value. Elastica (ruflin/elastica) is the client library the bundle wraps and has no record here. No prices, editions or hosted service found.
