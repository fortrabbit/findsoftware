notes: >
  The project has no GitHub release; the GitHub tags run to v4.17.0.0, and the registry is Hackage, so currentMajor and latestReleaseDate come from Hackage. The Hackage page for 4.17.0.0 shows "Revision 5 made by LaurentRDC at 2026-09-29", a metadata revision, not a release: latestReleaseDate is the upload date 2026-04-30. The CSV row's date 2026-09-29 is that revision and should be corrected in the CSV by its owner. Hackage marks 4.16.8.0 as deprecated; a deprecated single version is no end signal for the package, and the latest 4.17.0.0 is not deprecated. The homepage link to the library is https, and its installation instructions name cabal and stack. The Hackage license field says bsd3 and the LICENSE file is the 3-clause BSD text. The homepage sentence "All content under 3-clause BSD license" describes the site content and is not used for the software license. Pandoc is named as an integration, not a parent, so basedOn is not recorded. The homepage links the Google group over plain http; the https address of the same group answers and is recorded. The tutorials, installation, about, FAQ, releases and libraries pages were read. Haddock documentation is referenced from Hackage. The homepage names an IRC channel #hakyll on irc.libera.chat for questions, which is not a link and no field holds it. Integration with Pandoc provides Markdown and TeX support, per the homepage. Site rules are written in a Haskell EDSL, and the installation tutorial shows the site configuration as a Haskell program (site.hs) compiled to an executable that runs build and watch commands; the executable name is the user's choice, so the build command in the record is the tutorial's example. The about page says Jasper Van der Jeugt originally wrote Hakyll and still maintains the package. Hakyll has no Discord and no social account on its pages.
