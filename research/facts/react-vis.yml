notes: >
  The homepage is the site the repository names; its http address redirects to the https one, which answers, and no quote is taken from it, so it is cited from the GitHub API field. Status is discontinued on the project's own deprecation notice: DEPRECATED.md, linked from the README badge, says the library has no active maintainers and that it won't receive any patches or new features. The README also says the repository is now under new management and points to DEPRECATED.md; the notice names no successor, and the npm deprecated flag is not set. The latest GitHub release object is v1.11.7 (2019-04-19); the npm package has a newer stable 1.12.1 published 2023-06-08, the newest stable release, which sets currentMajor and latestReleaseDate. The npm beta 2.0.0-beta.3 dates from 2017, so no latestPrereleaseDate. The npm repository field and ecosyste.ms name uber-common/react-vis; the record keeps uber/react-vis, which the README badges and the CSV name. The Uber LICENSE line names the maintainer; the npm author is the Visualization Team. The basedOn react fact rests on the README sentence describing the library as a collection of react components. The README lists the chart types as line, area and bar charts, heat maps, scatterplots, contour plots, hexagon heatmaps, pie and donut charts, sunbursts, radar charts, parallel coordinates and tree maps; it composes charts from components such as XYPlot and the axes, and says the CDN bundle exposes a global reactVis object. Stars and contributors belong to the repository.
