notes: >
  The project has no website of its own: the GitHub repository is the only project page, so no homepage is recorded. The docs are the install guide in the repository at v0.6.3. The Kubernetes route in the install guide points to a third-party repository (Evantage-WS/lldap-kubernetes), so it is not recorded as an install method. The rust-version in Cargo.toml at v0.6.3 is 1.89.0, a build toolchain requirement stated in no page as a runtime minimum, so runtimeMin is left out. The LICENSE file in the repository is the GPL-3.0 text without a copyright line; the maintainer comes from the authors entry of the workspace Cargo.toml at v0.6.3. The FAQ names @nitnelave as the maintainer and main developer, states that LLDAP is hobbyist software developed by volunteers and that only one maintainer knows the whole codebase; it does not declare the project ended. The FAQ states it provides no commercial support contracts. The README links a Twitter account of the maintainer and a Buy Me A Coffee page; neither is recorded (a personal account and a donation page). The README says LLDAP integrates with many backends, from KeyCloak to Authelia to Nextcloud, and that the goal is not to provide a full LDAP server; and the FAQ compares it with OpenLDAP, FreeIPA and Kanidm; only Kanidm is a record here, and its FAQ section says to check it out when modern identity protocols are needed, so it is the alternativeTo entry. OpenLDAP and FreeIPA are no records. The GitHub contributors count is 178 across all pages. The latest release v0.6.3 is dated 2026-04-30; the oldest GitHub release is v0.2.0 (2021-11-29), so firstRelease is 2021.
