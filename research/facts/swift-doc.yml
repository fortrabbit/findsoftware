notes: >
  The homepage swiftdoc.org answers with a 301 to sosumi.ai, an unrelated documentation service, so no homepage is recorded. The repository is archived on GitHub (api), and the README names it as the project's source, which is the end signal behind status discontinued; the CSV row has the same status. Under the dead-homepage rule alone the record would be a stub, so a reviewer may decide between the two. The releases list holds 1.0.0-rc.1, which GitHub marks as a stable release, but the tag carries rc and the rule skips release candidates, so no currentMajor is recorded and the rc date is the latestPrereleaseDate; a project with pre-releases takes no lastCommitDate. The oldest GitHub release is 0.0.1 from 2020-01-27. The maintainer is the LICENSE.md copyright holder; the README contact is Mattt, named only by first name and a Twitter handle. The README requires Swift 5.3+ and libxml2, with GraphViz optional, and describes the commands generate, coverage and diagram. It says the CommonMark output is formatted for a GitHub Wiki, and the repository also hosts a GitHub Action that runs the generator.
