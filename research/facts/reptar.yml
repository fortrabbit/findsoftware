notes: >
  The GitHub repository has no release objects, only tags, so currentMajor and latestReleaseDate come from the npm latest version 3.3.1 (2017-10-07). The oldest tag v0.5.0 is dated by its commit (2015-10-13) and sets firstRelease. The README says the project was formerly known as yarn; that name history is not a field. The README and the site link a Gitter chatroom (gitter.im/reptar/Lobby), which has no starter field and is not recorded. The Markdown renderer named on the homepage is markdown-it, and the homepage names html-minifier, Browserify, Babel, LESS and Sass as supported tooling; these are not recorded as fields. The npm weekly download figure and the star count are for the week 2026-10-12 to 2026-10-18 and the date of this read. The reptar serve command serves the built files from a local server, and the usage page describes a lazy local server that rebuilds pages as their sources change. The homepage names markdown-it for Markdown and Nunjucks for templates. The docs say the site is pushed to a web host; no hosting provider is named.
