notes: >
  The homepage http://benpickles.github.io/peity/ (the GitHub homepage field) and the https address both answer 200; the https address is recorded. The project has tags up to v3.3.0 and no GitHub release objects, so currentMajor and latestReleaseDate come from the npm registry package peity, whose latest version is 3.3.0 published 2018-01-18, the same day as the tag. The first tag is v0.2.0, dated 2010-04-29, which sets firstRelease; the homepage calls 2009-11-20 the birthday and the first official version 0.2.0, and the repository was created in 2009. The homepage links the download of the script, and its changelog names the npm package and the Packagist package (benpickles/peity, 2.8 thousand downloads in total, none in the last month); both are recorded as install routes with the registry figures, and the npm figure counts downloads of the peity package, whose author is Ben Pickles. The homepage states the chart types (pie, donut, line, bar), data attributes, a change event and that charts are compatible with browsers that support SVG; these are not recorded as runtime or runsAs because the sentences name browser support, not where the library runs. The README and LICENCE name the maintainer Ben Pickles and the copyright years 2009 to 2020. The repository has no pricing or paid tier. Discovery notes give a 2018 last release, so the import will move the record to stub under the four-year rule for listing; the status here stays accepted as the CSV row has it.
