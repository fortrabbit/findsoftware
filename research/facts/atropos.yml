notes: >
  The homepage says the library is "Available for JavaScript, React and as WebComponent (for use with Angular, Vue, Svelte, Solid and other frameworks)". The React build and the Web Component are bindings of the one framework-agnostic library, so basedOn is absent and the bindings are named here only. The repository's README says the same. The last release is v2.0.2 (GitHub release 2023-07-04, also the npm latest), which is less than four years before 2026-11-04, so the record stays listed; the default branch was pushed on 2026-10-06. Stars and contributors belong to the single package. The first version tag is v0.0.2 (commit 2021-06-18) and the first npm version is 1.0.0 (2021-06-17); both fall in 2021. The homepage footer reads "2026 © Atropos by" followed by a link to nolimits4web.com; the maintainer follows the LICENSE copyright line, Vladimir Kharlampidi, and the footer name nolimits4web is noted only. The documentation lists the browser features the library needs but no page states the process model, so runsAs is absent. The homepage's "Sponsors" section and GitHub Sponsors are not a paid edition. The homepage gives the bundle size as 2KB; that figure is not recorded. The docs page names the browser features the library needs (pointer events, CSS 3D transforms, CSS transitions); those are not separate fields. The CDN route quotes a sentence before a jsDelivr import example and the script route quotes the sentence before the script tag; both are separate install routes. The homepage's social links are only the GitHub repository and sponsor links; no forum, chat or social account is recorded.
