notes: >
  runsAs is left out: the pages call it a server and give a listening port, but no sentence states a process that keeps running. The config page also exposes a Prometheus metrics endpoint when METRICS is set. Criterion 5 rests on the public GitHub stars (256 on 2026-11-03) and the Docker Hub pull count; there is no company behind it, and the repository has 7 contributors. Criterion 1 holds because the usage page documents a single endpoint that a page calls from an img element ("Use in your HTML"). The docs say "The Docker image is also available on DockerHub", and the Docker Hub repository jasonraimondi/url-to-png is recorded as dockerPulls; the install command names the ghcr.io image, which has no pull figure here. The package.json at main names @jmondi/url-to-png (npm latest 2.1.2, Node engines ">= 20"); no install page names an npm route, so no npm figure is recorded and runtimeMin is left out, because the software ships as a Docker image and the engines field is a build requirement. The config page names storage providers for cached images: filesystem, S3 and CouchDB; these are caches, not a content store or a database field. The docs name the rendering engine as Playwright with Chromium, a headless browser the service runs; no runtime field records it. The first tag is 0.9.0, dated by its commit 2018-08-02; the latest stable release is v2.1.4, 2026-04-18, and no later stable release is tagged. The LICENSE copyright line also carries the maintainer's email, which is not recorded. The usage page documents one endpoint with url and width query parameters, and shows an img element calling it.
