notes: >
  The highest stable release is v26.2.0 (2026-03-20), a calendar version, so currentMajor is not recorded; the line is 26.2. The oldest tag is v0.0.1-alpha.3 (commit 2020-01-28) and the oldest GitHub release is v0.1.0-alpha.1 (2020-01-31), so firstRelease is 2020. The name collides with the go-kratos framework record (id kratos, a different project); this record is the Ory identity server. The LICENSE file names no copyright holder; the maintainer and hqCountry come from the Ory privacy policy, which names Ory Corp with its Scottsdale, Arizona office. The OSS install guide at https://www.ory.com/docs/oss/kratos/install gives the install routes. The OSS production guide says Kratos needs a production-grade database and that the --dev flag must be left out of kratos serve. The README lists SCIM, SAML, organization login (SSO) and CAPTCHAs as Enterprise License features; the homepage names sign-in with any OIDC provider, which is the recorded sso value. The Enterprise License build is distributed only from a private registry, so it is recorded as paidEdition and not as an install route. The OSS install guide says the APIs of Ory open-source servers have no integrated access control and recommends Ory Oathkeeper or an API gateway in front of them. The README's migration section recommends Ory Hydra with Kratos for teams moving from Auth0 or Okta; Hydra is a separate record. The import docs say identities can be imported from any other system and name no product, so importsFrom is not recorded; the README migration section is advice, not an import statement. The homepage also names multi-factor flows (FIDO2, WebAuthn, TOTP). Homepage social link: X at https://x.com/orycorp; YouTube is recorded as youtube; LinkedIn has no field. The README's Discussions link is recorded as forum and its newsletter link as newsletter. The contributors count is the last page number of the contributors endpoint with per_page=1. The Go build from source needs Go 1.17 or later; a build requirement for software shipped as a binary, so runtimeMin is not recorded.
