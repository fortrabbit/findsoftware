notes: >
  The project has no site of its own. The only page the README links besides the repository is a demo application at https://laravel-phone.herokuapp.com, which states that it tests the phone validation component of the package; a demo app is no homepage, so homepage is left out. The README says the package is based on the PHP port of libphonenumber by Google and links giggsey's libphonenumber-for-php-lite, the lite build of the port whose record is libphonenumber-php; basedOn names that record. The Packagist downloads figure is the total of propaganistas/laravel-phone. The LICENSE copyright line names Propaganistas, which is also the GitHub account, so maintainerType is individual. The stable major is 6, from release 6.1.0. The firstRelease year comes from the oldest Packagist version 1.0.0 dated 2014-02-28, older than the oldest GitHub release (1.0.0, 2014-03-15). The README's validation section names the phone rule, the attribute casts and the PhoneNumber utility class; these are the package's own features and not recorded as fields. The README's database section offers suggestions for storing phone numbers and says they are thought starters for which support is not provided. The runtimeMin comes from the composer.json of the latest release, not a dev requirement.
