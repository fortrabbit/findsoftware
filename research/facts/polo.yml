notes: >
  Discontinued because the GitHub repository that the README names as the project's source is archived; the last commit on the default branch is dated 2018-01-16 and the README has no end statement. The author's blog at agonzalezro.github.io is not recorded as a homepage: the README calls it his personal blog that uses polo. The README names Jekyll and Pelican as the formats it reads, with a migration described as straightforward; importsFrom records the compatibility statement; no basedOn or alternativeTo is recorded. The Go 1.5 requirement in the README applies to building from source, so no runtimeMin is recorded. The first release year comes from the oldest stable release, v1.0 dated 2015-11-02.
