notes: >
  The homepage is a JavaScript shell, so homepage comes from the repository's homepage field and docs from the README link. The README has a Maintenance status notice: the maintainers are "limiting our engagement with this repository while still mirroring our internal development"; it does not say the project has ended, so the status stays accepted for a reviewer to decide. The npm package baseui is the install target and its latest is 18.2.0 (2026-07-02), a higher major than the highest GitHub release v13.0.0 (2023-06-13), so currentMajor comes from the registry. The blog post "Open Source Engagement and Future" (source: documentation-site/pages/blog/open-source-engagement/index.mdx in the repository, linked from the README notice) says Uber no longer actively reviews and merges pull requests or takes part in the issues section, has closed the issue tracker, mirrors the source from an internal monorepo, and drives development by its internal needs; it also says the library remains maintained and that main commits are published as 0.0.0-next versions, with an occasional new stable major. That is no end statement. The npm weekly figure is the sum of daily downloads for 2026-10-18 to 2026-10-24 from the range endpoint, because the last-week endpoint returned the window 2026-06-25 to 2026-07-01. The npm baseui package has versions from 2016, but its 0.0.1 description does not identify the project, so firstRelease uses the oldest GitHub tag v1.0.2 (tagged 2018-08-29). The repository description calls it a React component library, and the peer dependencies are react and styletron-react.
