notes: >
  Status accepted: the repository is not archived, the Packagist package has no abandoned flag, and no page states that the project has ended.
  The Root site (root.conedevelopment.com) documents Bazar and is the homepage the repository names; Root, the admin package Bazar requires, has no record of its own yet.
  The Bazar docs page lists older Laravel, PHP and Root requirements than composer.json at the latest release; runtime fields follow composer.json, installMethod and headlessApi follow the docs.
  The README calls Bazar a "headless e-commerce system" while the docs say it provides no REST API; headlessApi follows the docs.
  Maintainer: the LICENSE copyright line names "Cone Development" with no legal form. The privacy policy on conedevelopment.com names two individuals as operators; they are not recorded, and no country is stated.
  Packagist downloads: total only.
  The docs say "Bazar is a drop-in solution; this means it behaves as a package and not as an application"; runsAs is not stated, so it stays unknown.
