notes: >
  The version is 0.x on both PyPI and GitHub, so currentMajor is 0 as the registry states it. Endoflife.date has no FastAPI entry. The homepage says the framework is "open source and based on standards" and that apps can be deployed "to any cloud provider you choose", which is not recorded as a deployTargets list because no named target is given. The maintainer is named on the help page as the author, Sebastián Ramírez, under the handle tiangolo. The pypistats figure is a rolling last-week count as of the request date.
