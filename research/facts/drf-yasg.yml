notes: >
  The LICENSE file is LICENSE.rst and GitHub reports NOASSERTION for it; the BSD 3-Clause text is the one the file states. The PyPI metadata lists no license and no author, so the maintainer comes from the copyright line and PyPI's author email reads "Cristi V.", a spelling the LICENSE does not use. The README's compatibility line gives Django REST framework 3.13+ and Django 4.0+; the framework floors are not recorded as runtimeMin, which holds only the Python floor. The basedOn ruling rests on the README sentence naming Django REST framework as the framework the generated specification comes from, and on the package name prefix; a reviewer should confirm it. The README points to drf-spectacular as the project that shares most of its goals and works with OpenAPI 3.0; no alternativeTo is recorded because the README names it as the choice for new projects, a recommendation rather than a comparison; a reviewer may decide otherwise, since drf-spectacular has its own candidate file. The chat link in the README is a Gitter room (drf-yasg:gitter.im), which has no field. The bundled Swagger UI and ReDoc are API documentation views, not an admin interface. The tag 1.21.18 has no GitHub release object; its PyPI upload, 2026-10-09, is the newest stable release and sets latestReleaseDate. The earliest PyPI upload is 1.0.2 on 2017-12-13, and the repository was created 2017-11-29. Stars and contributors belong to the repository, which holds the package alone.
