notes: >
  Criterion 2 holds on the open source side: the GitHub repository bloomreach/brxm is Apache-2.0 and holds the git trees of the community release tags only (README). The product is sold as Bloomreach Cloud (platform-as-a-service) and as on-premise deployments, both on the product page; the cloud offering is recorded as hostedOffering and the on-premise path is the documented self-hosted build and run. The highest stable community tag is brxm-16.1.0 (commit 2024-09-30), so currentMajor is 16 and the release date is the tag's commit date; the repository has tags and no GitHub release objects. The CSV note cites 16.9 from the enterprise release notes; that version is not a community release and is not recorded. The runtime Java 17 is the requirement the prerequisites page gives for brXM 16 projects, and Java 21 is for Bloomreach Content 17. The enterprise plugins are closed source and require a standard or premium license; they are paid add-on plugins, so paidEdition is not recorded under the wave 19 rule. The CSV's Hippo CMS name is not confirmed on a page read here, so it is not recorded. The repository has no language reported by GitHub (null); the Maven build in project/pom.xml at the newest tag is the evidence for Java. Projects from the archetype use an embedded H2 database by default (database dev guide), and only MySQL is recorded because the guide names it as a storage backend; the LDAP add-on requires a standard or premium license and is not recorded as a feature. The open source release policy states a 24-month delay between enterprise releases and their open source versions; that delay is recorded in the source policy page, not as a field.
