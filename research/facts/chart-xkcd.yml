notes: >
  The LICENSE copyright line names egoist, while the npm package.json author and maintainers name timqian, the owner of the GitHub repository and the homepage; the LICENSE line is the one recorded as maintainer. The README's install route is the jsDelivr CDN script of the npm package chart.xkcd; the docs page adds the npm route. The npm figure counts the package chart.xkcd. The README says a single svg node renders the chart, which is a rendering target for notes (SVG), not a field. The README links Patreon and IssueHunt funding pages, which are not recorded. The first npm upload is 1.0.0 on 2019-08-05, the same day as the repository's creation; the oldest GitHub release is 1.0.1 (2019-08-19). The README does not say the library runs in a browser, so runsAs is left empty, even though the install puts the script in an HTML page. The repository's contributors count is 16 across all pages.
