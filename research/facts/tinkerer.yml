notes: >
  The README announces the retirement: Tinkerer is retired in favor of Baku (github.com/vladris/baku), which the README names as its replacement; the repository is archived on GitHub, and the record is discontinued. Baku is a separate candidate for this queue (not in candidates-ssg-other.csv at the time of this check) and is not recorded here. The GitHub repository has no release or tag; the registry release on PyPI is 1.7.2 (2019-12-06), so currentMajor and latestReleaseDate come from PyPI, and the oldest PyPI release is 0.1b (2011-12-14). The PyPI project page names http://tinkerer.me/, which was not read and is not recorded; the homepage is the project site at vladris.com/tinkerer/. The license file says "FreeBSD license" with two numbered conditions, recorded as BSD-2-Clause. Posts and pages are reStructuredText files; no field holds the markup format. The pypiDownloads figure is the last-month count from pypistats.org.
