notes: >
  The LICENSE copyright line names Dan Farrelly (2023), the rule for the maintainer field; the GitHub owner is the organization maildev, which the homepage calls MailDev, and the record keeps the owner in the repository field. The homepage's "Free & open source (MIT)" is the license statement; the repository license is MIT as well. The npm figure is the sum of the seven days from 2026-10-23 to 2026-10-29 for the package maildev, which is the package the install docs name. The Docker Hub count is the image the README names, maildev/maildev. The homepage presents an MCP server (maildev --mcp) and relay to an outgoing SMTP server; neither is a field here. The homepage calls 3.0 the new version; currentMajor follows the 3.0.0 release, and the 3.0.0 release candidates (latest 3.0.0-rc.3, 2026-08-28) are not recorded. The README names Inngest as a sponsor; no field holds it. The homepage and the README both state the tool is for development, and the runsAs local value is taken from the homepage sentence.
