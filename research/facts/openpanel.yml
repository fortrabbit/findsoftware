notes: >
  Version state conflicts across the project's own pages. The public self-hosting docs describe 2.x as the public release ("These pages describe the current public release") and document OpenPanel 3 only for supporters ("available to supporters ahead of the public release"). Every GitHub release object (ten, v3.18.0 to v3.23.1) is flagged as a pre-release, so no stable release object exists. The newest tag of the 2.x line is v2.3.0 (2026-08-18); its date is recorded as latestReleaseDate from the tag. The supporter page calls 3.1.4 the "Last public release" and lists build numbers 3.1.x, which do not match the GitHub tag numbers; the page is not used for a version. The 2.x docs install through a git clone of the self-hosting branch and a setup script that installs Docker and Node if missing; only the clone route is recorded. The oldest image tag on Docker Hub (lindesvard/openpanel-api 0.0.1) was pushed 2024-09-02; the GitHub tags start at v2.3.0 (2026-08-18). The self-hosting changelog lists 0.0.6, 1.0.0, 1.1.1, 1.2.0, 2.0.0 and 3.0.0. currentMajor 2 rests on the Docker Hub tags 2 and latest, pushed with 2.3.0 on 2026-08-18; GitHub 3.x releases are all prereleases. The company legal name and address come from the terms page; the about and contact pages match. The README stack lists Postgres, ClickHouse, Redis, BullMQ and Resend; only the three stores are recorded as databases. The README compares OpenPanel with Mixpanel, GA4 and Plausible in a table; that table is not a separate fact beyond the entries above. The supporter tier is paid access to newer builds with the same open-source code; the page says "with no enterprise edition", so no paidEdition is recorded. About twenty compare pages exist on the site; the seven recorded here are the ones whose subject has a record id or candidate row. The rest name products with no id yet (Amplitude, AppsFlyer, Cabin Analytics, Crazy Egg, Fathom, FullStory, Funnelio, Heap, Microsoft Clarity, Mouseflow, Pirsch, Simple Analytics, Smartlook). The 3.x Clerk migration guide is a supporter-only page and is not recorded as importsFrom. The README calls OpenPanel "An open-source alternative to Mixpanel" (no record or candidate for Mixpanel). dockerPulls counts the API image; the dashboard and worker images are separate. Compare pages and the Mixpanel guide state built-in importers for Mixpanel, Amplitude and Umami; only Umami has a record, so only it is in importsFrom. The pages do not say whether the importers ship in the 2.x self-hosted release; the Umami importer sits under Settings > Imports. Plausible and PostHog history cannot be imported (compare pages). No process model is stated on the 2.x pages (only "All services should show as healthy or running"), so runsAs is unknown. Coolify, Dokploy and community Helm chart routes are documented only for OpenPanel 3 (the supporter line) and are not recorded. The name collides with OpenPanel, the web hosting control panel: the about page says that is a different company and product. The MCP server, AI observability, session replay and the self-hosted analytics assistant are features with no field and go to notes. The npm package @openpanel/web is a browser SDK, not the server software, so no npm figure is recorded. The pricing page describes the cloud and the self-hosted version as the same open-source code. The README stack names Redis for the cache layer, pub/sub and queue. The 2.x setup guide says the setup script installs Docker and Node.js if they are missing, and that the services run under Docker Compose. The README describes Clickhouse as storing events. The API docs list track, export, insights and manage endpoints; headlessApi rests on the export page (GET endpoints for events and charts). The self-hosting docs describe Google and GitHub social login, which is no single sign-on protocol, so no sso is recorded.
