notes: >
  The project has no working homepage: www.dcatadmin.com, which the repository description and README name, now serves an unrelated company, so no homepage is recorded.
  The repository is not archived (pushed 2025-06-25), Packagist does not flag the package abandoned, and no README states an end, so the status stays accepted.
  The default branch is 2.0 and Packagist lists only 2.x pre-releases (2.2.3-beta is the newest tag); the highest stable tag is 1.7.9, so currentMajor is 1 and the reviewer may prefer 2.
  The README is in Chinese; the Chinese documentation is hosted on learnku.com, a community platform, and is cited only as the link the README gives.
  The README calls the project a secondary development of laravel-admin (laravel-admin.org); the LICENSE names Jens Segers as a co-holder, as it does for laravel-admin, so the maintainer is recorded as the LICENSE line states it.
  The install docs create the Laravel app and set a database connection in .env; the README example uses MySQL but names no list of supported databases, so databases is left out.
