notes: >
  Maintainer follows the LICENSE copyright line, which names Dmitry Dygalo and Schemathesis.io; the homepage footer names Schemathesis.io s.r.o., a company incorporated in Czechia, and the pyproject lists Dmitry Dygalo as author and maintainer. The company is a legal entity beside the recorded maintainer, so hqCountry is not recorded. The LICENSE also carries a 2019 line for Kiwi.com, not a second license statement. Specifications the project names: OpenAPI 2.0, 3.0, 3.1 and 3.2, GraphQL and gRPC (homepage FAQ); spec compliance is a coined kind, so it stays in notes. Stars and contributors belong to the repository; the GitHub profile type is organization. The pypistats figure is a rolling last-month count from the PyPI package schemathesis. The CI route (schemathesis/action@v3 GitHub Action) and the official Docker image in the README and homepage are not install routes beyond the docker guide recorded above. The README lists Spotify, WordPress, JetBrains and Red Hat as users and a trophy case of upstream bugs; not recorded. Boundary: a testing tool, accepted under the testing group; the README says it sends requests that create, change and delete data and advises a dev or staging environment, not production.
