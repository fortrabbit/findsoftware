notes: >
  The homepage was read over https; the plain http address redirects to it. The Packagist total is for league/oauth2-client, the package the install page names, and dates 2026-11-16. The LICENSE copyright line is dated 2013-2023 and names Alex Bilbie, which sets the maintainer; the site footer names The League of Extraordinary Packages as the presenter, which is not a legal entity, so no maintainer is recorded from it. The runtime is the PHP range in the composer.json require line at the latest release tag; the README lists supported PHP versions from 7.1 to 8.5. The homepage says the base package is required directly with Composer only to use the GenericProvider, and that provider clients for specific services are required on their own. The GenericProvider class, Bearer token support, and the PSR-1, PSR-2, PSR-4 and PSR-7 compliance are coined kinds and stay in notes. The official and third-party provider clients (the README names Facebook, GitHub, Google, Instagram and LinkedIn as examples) are separate packages, not recorded as basedOn because the README names no parent for this base package. The Gitter chat link is a community channel that no field holds. The first GitHub tag, 0.1.0, dates from 2013-03-25, the same day as the first Packagist version.
