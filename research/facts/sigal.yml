notes: >
  The homepage is https and answers 200. It is the project's own documentation site on Read the Docs, which the README names as the website. The highest stable GitHub release is 2.6 (2026-02-06); PyPI lists 2.6.1 with the same date, same major. The oldest GitHub release is 0.8.0 (2014), while the PyPI release history starts in 2012 (0.1), so firstRelease is 2012. The PyPI JSON reports -1 for every download period; the figure comes from pypistats.org. GitHub reports the repository language as JavaScript (the bundled theme assets); the README states the project is written in Python, so language is Python. The maintainer name is the LICENSE copyright line. The FAQ says the built output is served by a web server of the user's choice, and the getting-started page says sigal serve is for local browsing only, not production. The FAQ says password protection has to be handled in the web server, since there is no server process. Plugins are documented in docs/plugins.rst; no plugin directory or count was found. Other things the pages state, kept here and not as fields: the README says Sigal resizes images and creates thumbnails, and ships three themes based on the colorbox, galleria and photoswipe JavaScript libraries.
