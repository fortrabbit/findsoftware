notes: >
  Accepted on the Webhooks app docs: the connection page says a webhook URL in the editor accepts GET, POST, PUT or PATCH requests sent to Automatisch to trigger the flow, which is an HTTP endpoint another app or site calls; the triggers page says the catch-raw-webhook trigger fires when the webhook receives a request. The license file names AGPL-3.0 for every file except those with ".ee." in the name, which the LICENSE.enterprise file covers; the README calls the Enterprise Edition a commercial offering; GitHub reports NOASSERTION, and the enterprise license text was not read. The GitHub latest release is v0.15.0, from 2025-08-08, and the repository was last pushed on 2026-02-11; neither is an end signal. The README and docs compare the product with Zapier and Integromat; those are comparisons on the project's own pages, not recorded as alternativeTo because neither has a record. The docs' copyright line gives 2022 and names Automatisch, so maintainer is recorded as the name. The homepage offers a cloud solution next to self-hosting, recorded as hostedOffering. The docker compose file in the repository uses postgres 14.5 and redis 7.0.4 images; these are not recorded because they are the sample's images and not the project's named dependencies. The runtime is not stated on any page read, so runtime is unknown.
