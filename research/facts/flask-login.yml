notes: >
  The repository is a user account (maxcountryman) and the LICENSE copyright line names Matthew Frazier, so that name is recorded as maintainer. The docs site at the latest path shows the version line "Flask-Login 0.7.0 documentation", ahead of the newest GitHub release and PyPI upload, 0.6.3; the current major is taken from the release, so the docs version is not recorded. The categories value auth is a category the import maps directly; the README describes logging in, logging out and session handling and does not name authentication in those words. The runtimeMin comes from python_requires in setup.cfg at tag 0.6.3; setup.py at that tag carries only install requirements (Flask and Werkzeug), which are dependencies and are not basedOn statements. The README says Flask-Login "is not bound to any particular database system or permissions model" and names no database. The first tag is 0.1.1, dated 2012-04-17; the repository was created 2012-03-11. The PyPI figure is the pypistats last-week count; PyPI's own API reports no downloads. Stars and contributors are for the repository, which holds only the library.
