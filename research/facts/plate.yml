notes: >
  The GitHub license field reads NOASSERTION because packages carry their own LICENSE files; the root LICENSE says its MIT terms apply "unless otherwise specified in a LICENSE file within an individual package directory". The root LICENSE is recorded; the package-level files were not read. The maintainer is the four names on the root LICENSE copyright line; the GitHub owner is the organization udecode. The docs introduction's "Plate is a React framework for building rich-text editors" is the only statement of the parent, so basedOn react rests on it; no sentence on the pages read says Plate is built on or extends Slate, so no basedOn slate. The Slate to Plate migration guide says Plate keeps Slate's document model and the API reference calls @platejs/slate "Plate's framework-free Slate layer"; the guide is recorded as importsFrom slate. The docs call the core "a headless editor runtime", which the description follows. The platejs package is the install target the docs name; @udecode/plate is marked deprecated on npm ("Package no longer supported, use platejs instead.") and is not the figure. The first npm upload under the earlier name @udecode/slate-plugins (0.58.14, 2020-06-01) lists the udecode/slate-plugins repository, which now redirects to udecode/plate; firstRelease 2020 follows that rename. The repository was created on 2019-12-02 and its tags were not checked back to that date, so the reviewer should decide whether an earlier tag counts. The Node.js guide says Plate can be used in Node for reading, validating, transforming and serializing editor values, and it names the browser as well, so no runsAs is recorded. latestReleaseDate is platejs 53.5.2 (2026-10-30), the npm latest; the GitHub tags v53.x are a monorepo release train (v53.5.6 on 2026-11-11 names @platejs packages). The Pro site sells Plate Plus, premium components and an AI editor template delivered as source code in a GitHub repository, as a one-time license per developer or per team; it is a separate add-on product, so no paidEdition and no pricingPage. The README lists a Notion-like template that links to the Pro site; it is not recorded as a license of the open product. The homepage links the maintainer's personal X account as an author credit, not a project account. The GitHub figures (stars, contributors) belong to the udecode/plate monorepo, not to platejs alone. The CSV row's lastRelease (2026-10-18) is older than the newest npm release.
