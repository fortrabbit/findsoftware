notes: >
  The docs path en/stable returns 404; the requirements and installation pages are read from en/latest, which Read the Docs titles "phpMyAdmin 5.2.4-dev documentation", so they describe the development branch and may differ from the 5.2.3 tarball. The PHP minimum in the composer.json at RELEASE_5_2_3 (^7.2.5 || ^8.0) matches the requirements page, so runtimeMin follows the tag. The Packagist author for 5.2.3 is "The phpMyAdmin Team", which is the recorded maintainer; the GitHub owner is the phpmyadmin organisation. The support page names mailing lists and Stack Overflow, which are no forum field. The homepage says the project is a member of the Software Freedom Conservancy; a membership is not ownership, so no parent is recorded. firstRelease follows the project's own history page: the 1998 entry is the "First internal release" of 0.9.0, and the first public stable release by the project is 2.2.0 (2001-08-31); the 1998 year is the project's own history statement and is recorded. Signon authentication mode is a login mode, not a SAML, OIDC or LDAP feature, so sso is left out. The Docker official image is the phpmyadmin repository in Docker Hub's library namespace, which the setup page names. The themes directory at phpmyadmin.net/themes/ is not recorded as pluginDirectory. Packagist's count 404795 total and 4567 monthly were read 2026-10-30; the candidate row figure of 402.2k is older.
