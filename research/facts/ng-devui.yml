notes: >
  The homepage is an Angular single-page app; its title and Open Graph title are the readable part, and the component documentation at devui.design/home is only rendered in the browser, so it is listed as unreadable and no docs fact is recorded. The name is DevUI in the GitHub repository and on the homepage title, and the README heading reads DevUI for Angular. The Angular version statements conflict: the README says "Now supports Angular ^19.0.0", the npm 18.0.0 manifest declares @angular/core ^18.0.0, and the homepage meta description says it supports Angular ^10.0.0; no Angular version is recorded. The LICENSE copyright line reads "DevUI", the npm maintainer account is devcloud, and the homepage meta author is DevUI Team; the LICENSE line is recorded. The README shows a CodeArts logo under "Who use it", which names a user, not a parent, so no parent is recorded. The README badges a Gitter room (gitter.im/devui-design/devui-design); no field holds it. The npm weekly download range is 2026-10-18 to 2026-10-24. The first npm version is 7.0.0-rc.1 (2019-06-13), earlier than the oldest GitHub release. The latest GitHub release is 18.0.0 and the newest prerelease, 19.0.0-alpha.1 (2025-03-13), is newer, so latestPrereleaseDate is recorded. The repository was last pushed 2025-05-22. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header. Dependent counts are ecosyste.ms figures. The README tells users to add the package stylesheet to angular.json. The HTTP Archive technologies list has no DevUI entry.
