notes: >
  The repository has a CNAME file naming dewar.tfpk.io, which does not resolve (NXDOMAIN on 2026-10-23), so no homepage is recorded and the status is stub: the project's own site no longer shows the software. The CSV row has no homepage and the GitHub repository carries no homepage either. The repository has no stable GitHub release: its releases v0.1.0 to v0.1.4 (2018-12-26) are all marked prerelease, and the tags run to v1.2.1. The stable version is therefore taken from PyPI, where dewar 1.2.1 was uploaded 2019-02-02 and requires Python 3.6 or later; that makes currentMajor 1 and latestReleaseDate 2019-02-02. The prerelease of 2018 is older than the stable release, so no latestPrereleaseDate is recorded. The docs folder holds built Sphinx HTML and the documentation folder holds the source, so the README is the docs source cited here. The maintainer is the AUTHOR value in setup.py. The last commit on the default branch is dated 2019-02-02, while the repository was last pushed 2022-12-08.
