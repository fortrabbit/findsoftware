notes: >
  The record covers the open-source server and the Unleash Enterprise edition, which the README and the docs describe as one platform with a paid tier; the Enterprise cloud and the Enterprise self-hosted plan are both named on the homepage. The GitHub API and the LICENSE file give AGPL-3.0 without "or later"; the README badge says "AGPL-3.0-or-later license": one license, two wordings, the wordings are recorded here. The homepage names Bricks Software Inc. (San Francisco) as the operating entity for United States customers in the terms; only the Oslo entity is recorded as maintainer, the US entity is a reviewer's call. The About page says the company was established in 2019 and the project was started on GitHub in early 2015; firstRelease uses the oldest GitHub release (1.0.0, 2015-11-24). The README's SDK count (12 official SDKs, 10 community SDKs) and the 25-plus SDK figure on the homepage are not a field; the SDK packages are not recorded here. Unleash Edge, a separate scaling component named in the README, is not recorded. The Slack community link (join.slack.com) and the LinkedIn company page are social links with no field. The GitHub stars and the Docker Hub pulls are the open-source server figures; the homepage's 45M+ Docker pulls figure is not used. SAML 2.0, OpenID Connect and SCIM are labeled Enterprise on their docs pages, and the self-hosting guide opens by saying it sets up Unleash Open Source or Unleash Enterprise in the user's own environment with Docker, while the homepage says Enterprise customers can self-host on their own infrastructure, so the sso fact applies to the self-hosted Enterprise edition only. For role-based access control the docs mark the Admin, Editor and Viewer root roles as available in all versions and project roles and custom roles as Enterprise only; the userRoles fact covers both. The Admin, Client and Frontend HTTP APIs are documented at docs.getunleash.io/reference/api/unleash, but no page names their style, so headlessApi is left out. npmName is the unleash-server package, which the README does not name: the README's install routes are Docker and Node.js from the source tree, and the npm figure counts that package only, not Docker use. runtimeMin is the engines field of unleash-server for the pure Node.js route. The docker-compose.yml in the repository names unleashorg/unleash-server:latest for the open-source server.
  importsFrom launchdarkly is left out: the migration blog post says to export flag definitions with the LaunchDarkly REST API and recreate them through the Unleash Admin API or import functionality, with no dedicated importer.
