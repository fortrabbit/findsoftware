notes: >
  The live site ambientcss.com (the README's Live Demo, and the canonical URL of the vercel address) answers 200 with an empty script shell and no page text, so it is unreadable and the homepage is the project's Docusaurus documentation site at kikkupico.github.io/ambientcss. The repository has no GitHub release and no tag; the npm package @ambientcss/css is the registry release, and its first upload is 1.0.0 on 2026-02-15, which is why firstRelease is 2026 although the repository dates from 2022-01-01. The README's Quick Start names @ambientcss/css (pure CSS) and @ambientcss/components (React controls, latest 3.1.2 on 2026-09-12, 34 weekly downloads, not recorded as the adoption figure). The @ambientcss/css package is the one the id stands for; the React package is a separate candidate for the ui-library area if one is wanted. npmWeeklyDownloads is the sum of the daily downloads for 2026-10-18 to 2026-10-24 from the range endpoint. The README opens with "Define a light source, and every shadow, highlight, and surface gradient follows from it" and says the CSS is set up with light-direction classes and CSS custom properties on a parent element. The CSS package changelog's first entry, 1.0.0, reads "first publish". The README calls the CSS package a "Pure CSS lighting framework" with zero dependencies. The npm registry lists its homepage as the docs site; no pricing, sponsorship or social link was found on the docs site. HTTP Archive has no technology named for AmbientCSS.
