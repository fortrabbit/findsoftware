notes: >
  Hosted-only: no installable part is documented, so criterion 2 is waived and no repository is recorded. The GitHub organization kontent-ai holds SDKs and the data-ops migration tool, which are not product source, so no repository, release, star or npm figure is taken from them. The terms name the provider "Kontent CZ s.r.o." in the Provider clause and "Kontent s.r.o." with a different organization ID in the affiliate list; maintainer keeps the first. hqCountry is the registered office named in the terms; the about page names six offices in six countries and no headquarters. The about page says 2,000+ projects and the compare page 5,000+; both are recorded with their pages, not reconciled. The homepage Discord link is a bit.ly short link that redirects through a tracker to discord.com/invite; the invite is recorded, the tracker is not. The homepage also links Facebook, LinkedIn, YouTube, Instagram, Spotify and GitHub, none of which has a field in the starter list. The architecture page names Cosmos DB and Azure SQL as Azure resources without saying which holds content, so databases is unknown. The architecture page says the internal services are written in ASP.NET; that is an internal stack, so basedOn is not recorded. The compare page links one comparison page per competitor, recorded as alternativeTo. The API rate limits (Management API, Delivery REST API) are per-second and per-minute figures on the technical limits page and are not typed in. firstRelease is the 2016 MVP launch under the name Kentico Draft, per the company history on the about page.
