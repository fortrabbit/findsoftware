notes: >
  The homepage names Balrog as the project Carew was forked from (the sentence before the quoted one). The README says "This project is dead" and suggests gohugo instead; the README's suggestion is recorded here, not as alternativeTo, because it is advice rather than a named relationship. The repository is archived (api) and the Packagist package carew/carew is flagged abandoned with no replacement; the homepage still describes the software in the present tense, so the status fact cites the README. The repository has no GitHub releases, only tags; the highest stable tag is v2.2.1 (commit dated 2017-05-24), so currentMajor is 2. firstRelease is the oldest tag, v1.0.0 (commit dated 2013-01-05). The LICENSE copyright holder and the homepage footer name Grégoire Pineau. The homepage gives the Twig layouts and Bootstrap theme as features; the theme is only recorded through the documentation's Twig statement. The homepage's "php 5.4+" note is for the build-in server in the documented example and is not recorded as runtimeMin, since it is not stated for the latest release. The docs field is the project documentation page on the homepage; its text is quoted from the source file in the repository's doc folder. The Packagist total and monthly figures are both recorded with their period.
