notes: >
  No project site: the repository's homepage field is empty and the README links only the repository, Packagist and a Tidelift page, so no homepage is recorded. The Tidelift link is a paid support subscription for the package and is not a paidEdition. The README's installation section gives the Composer route in two lines, a curl installer and php composer.phar require; both are the Composer route and the second is the quoted command. The README says the library works on PHP 5.3 and up, and its examples use PHP 5.4 syntax; runtimeMin 5.3 comes from composer.json at the latest tag, which states php >=5.3.2. The latest release v1.4.11 is dated 2022-10-14, and the last commit on the default branch is dated 2024-04-16; the repository is not archived and the README declares no end of the project, so the status stays accepted. The import's four-year release rule decides listing from the release date and will move this record to stub. firstRelease is 2013: the Packagist upload of 1.0.0 dates from 2013-02-03, and the repository was created on 2013-01-27. The LICENSE copyright line names Vance Lucas; the GitHub owner is a user account. The Packagist total is the figure recorded; the README badges link the same package page. The README describes a rule-based validator: an array of input and rules such as required, email and lengthMin attached to field names, run in one call with validate and read back with errors; dot notation reaches nested values, an asterisk applies a rule to each array member, and custom rules can be added.
