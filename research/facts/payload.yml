notes: "Payload joined Figma, announced on the Payload blog dated 2025-06-17, and the post says Payload remains open source; the parent is recorded from that post. The get-started page lists Vercel and Cloudflare deploy options and an Enterprise plan without prices, and does not mention Payload Cloud. The installation page states Node 20.18.1 while the get-started page states 20.9.0; the npm engines field matches 20.18.1. The templates folder contains blank-tanstack, which suggests a TanStack Start variant beside Next.js; not verified on a docs page. Official plugins live in the monorepo packages folder (cloud storage, ecommerce, form builder, import-export, mcp, multi-tenant, nested docs, redirects, search, sentry, seo, stripe). The footer links Discord, X and YouTube but the fetched text did not expose their URLs, so discord and x went to notFound. Coined here: frameworkVersions (supported versions of the host framework), startCommand, repoCreated."
