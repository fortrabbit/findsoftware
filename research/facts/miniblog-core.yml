notes: >
  Discontinued on the README's own statement that the maintainer "is taking pull requests, but is not actively working on it", which the project states about itself. The live demo and homepage https://miniblogcore.azurewebsites.net/ does not resolve (NXDOMAIN), so no homepage is recorded. The install steps are present in the README (dotnet new --install, then dotnet new miniblog) and on the NuGet page, so criterion 3 holds. The package on NuGet is the one the install docs name; its last upload is 1.0.3 on 2017-10-31, so latestReleaseDate is old, and the repository's last commit on master is 2025-11-24 (not recorded, since a registry release exists). The repository has no GitHub release or tag; the API's license field reads NOASSERTION because the LICENSE file is a short header, and the file itself states Apache License 2.0. The README's "Deploy to Azure" button is not recorded. runsAs is left out: the README's run instructions after its link list cannot be read by check-quotes, and no page states the hosting model in a quotable line. The GitHub profile names Microsoft as company; that is a profile field, not a statement by the project, so no parent is recorded. nugetDownloads is the package total, not a period figure. The README's Open Live Writer support and comments are not fields and are not recorded. The NuGet page for version 1.0.3 carries a notice that the package has at least one critical-severity vulnerability, citing GHSA-958r-g534-ccmr; no field holds advisories, so it is recorded here for the reviewer.
