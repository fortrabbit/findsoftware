notes: >
  The candidate row is boundary for "no versioned release". The repository untitleduico/react has no GitHub release and no tag. Criterion 4 is met by the registry release of the package the install docs name, untitledui (npm), latest 0.1.69 published 2026-10-02; currentMajor and latestReleaseDate come from it, and lastCommitDate records the repository's newest default-branch commit, since the repository has no release. The untitledui package lives in another repository, untitleduico/cli (MIT, npm metadata); its first upload is not the same repository's release, so firstRelease is not recorded. Criterion 2 holds on the project's own pages: the add command copies components into an existing project, and the installation page lets users copy and paste components; the CLI is the project's own registry, so the shadcn model applies. The README says the components are built with Tailwind CSS and React Aria, which is recorded as basedOn; it also says the repository is built on top of Untitled UI Figma, a design kit, which is not recorded as basedOn because it is a design file rather than software the components extend. The license page names Sisyphus Ventures Pty Ltd, trading as Untitled UI, based in Melbourne, Australia; the LICENSE copyright line names Untitled UI only, so the legal name comes from the license page. The homepage's PRO tiers (SOLO, STUDIO, BUSINESS, ENTERPRISE) are paid licenses for the Products with a separate license agreement; prices are not recorded, and the ENTERPRISE tier's SSO wording is a team-license term, not a software feature, so sso is not recorded. The footer also links Dribbble, YouTube and several designers' personal accounts; only the project's own X and Instagram accounts are recorded, and YouTube and Dribbble have no field. Version 0 of the untitledui package is recorded as currentMajor; the package is 0.x, so the value is 0. npmWeeklyDownloads sums the daily counts for 2026-10-19 to 2026-10-25. The HTTP Archive technologies list does not carry Untitled UI. The RTL page says the components use CSS logical properties, so layouts follow the document direction without JavaScript; the prose uses it. The PRO single-user terms (not shared, transferred or reassigned) are on the license page.
