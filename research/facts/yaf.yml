notes: >
  The php-extension category is left out because the import maps it to web-server; the fact that Yaf is built as a PHP extension is in runtime. The CSV homepage (php.net/manual/book.yaf) is the PHP project's manual, not a site Yaf runs, and the repository homepage field points to the same manual; homepage stays unknown. The manual is the documentation, and the README links to it. The manual and the README both describe the extension's performance in terms this record does not repeat. The install page states Yaf has no external dependencies; no field holds that, so it is not recorded. runsAs stays unknown: no page states how a Yaf application is run on a host. The repository created_at (2011-12-13) is repository creation, not a first release. The PECL package page (pecl.php.net/package/yaf), which the install page names, is a registry outside the listed sources and was not read. The Packagist package laruence/yaf, named for install by PIE, shows 5 total downloads and 0 monthly; it is the package the PIE command installs, so it is recorded as stated, and it is not a sign of adoption. The GitHub license field reads NOASSERTION; the LICENSE file is the source for PHP-3.01. The maintainer is the lead named in package.xml; the GitHub account is laruence.
