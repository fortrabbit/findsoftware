notes: >
  The repository is a monorepo: stars and contributors belong to the repository ckeditor/ckeditor5, which holds the framework and its feature packages. The npm figure comes from the package ckeditor5, which the quick start names for the npm route. The root LICENSE.md defers to packages/ckeditor5/LICENSE.md, and the dual license is stated there and in the README; both statements are recorded as license entries. The README names the Migration from CKEditor 4 guide for upgrades from CKEditor 4 (record ckeditor4); that is a migration guide rather than an import tool, so no importsFrom is recorded. The documentation sidebar marks many features as premium and lists a CKEditor 5 LTS Edition; a sidebar label is not a quote, so no paid tier is recorded beyond the licensing page statement. The free account in the README (a 14-day trial of premium features) and the Cloud Services and CKBox products are not recorded. GitHub detects JavaScript as the repository language; the README says TypeScript, so the language field follows the README. firstRelease is the 2016 tag v0.1.0; the repository was created in 2015. The root package.json names Node 26.10 or newer, a repository development requirement, so no runtimeMin is recorded. The README describes the editor as having an MVC architecture, a custom data model and a virtual DOM, built from a framework package plus feature packages in one monorepo, with editor types from document-style editors similar to Google Docs to chat-style inputs, collaboration support and integrations for Angular, React and Vue; the homepage footer links Facebook, LinkedIn and YouTube accounts of the company (LinkedIn has no field), and its Resources list has a CKEditor vs Tiptap page, which is the alternativeTo source. The migration guide says CKEditor 5 is a new editor and not a new version of CKEditor 4, with no automatic migration path, so no successorOf is recorded. The quick start also lists a Builder that downloads a custom build; it is a configuration tool, so it is not recorded as an installMethod.
