notes: >
  The data-import page also names Simple Analytics CSV exports; Simple Analytics has no record, so it is not an importsFrom value.
  The license is stated once on the homepage as AGPL v3.0; LICENSE.md at v2.9.2 is the GNU Affero General Public License version 3. The repository detects as TypeScript; the self-hosting manual names a Node.js API server and a Next.js client, so runtime is node. The company page names Tomato.gg LLC as the operator of Rybbit and the provider of the hosted service; its mailing address gives the country. The manual's stack lists Caddy as an optional reverse proxy that the setup script installs on a blank server; it is not recorded as a field. The hosted plans have Web Vitals and session replays on paid tiers. The README marks Web Vitals as available only on paid tiers, and the docs comparison marks Web Vitals as Cloud only; the self-hosted record does not claim it. The docs say session replays are a Pro feature on Cloud and included when self-hosting. The self-hosted instance does not send email, so invitations are made by creating the account directly (self-host-vs-cloud page). Google and GitHub sign-in is an OAuth login for users, not an sso statement, and is not recorded. The homepage and README list sessions, funnels, goals, user profiles, retention, bot detection and error tracking as features; they are not fields. Coined kinds, recorded here only: cookieless and privacy claims, bot detection, session replay, error tracking, the MCP server for AI assistants, and the tracking script. The Product Hunt badge and the testimonial links on the homepage are not recorded. The GitHub org is rybbit-io; the company page names no other legal entity. The repository's tracker is on GitHub and the first tag v0.1.0 is dated 2025-05-05. Teams and per-site grants restrict which sites editors, members and viewers reach (docs/teams, docs/inviting-users). Service architecture (manual): Next.js client, Node.js API server, PostgreSQL for user data and configuration, ClickHouse for analytics data, Redis for shared state. The Enterprise page sells SSO, dedicated instances and on-premise installation on the Enterprise plan and names no protocol; the self-hosted record holds no sso value. The compare page at /compare/fathom is about the hosted Fathom Analytics, so alternativeTo names no fathom-lite.
