notes: >
  The homepage is the demo storybook the README links as "Demo storybook v1"; it is the project's own demo site and is the only site the project names apart from hexdocs. The storybook sidebar labels itself 1.3.0, which no tag or Hex release carries; the highest Hex release 1.0.0 and the mix.exs version 1.0.0 are recorded. The GitHub releases list holds only v0.9.0 (2024-10-19) as a release and the tags run to v1.0.0 and v0.14.7; the registry major 1 is above the GitHub release major, so the registry major is recorded. The v1.0.0 tag committer date is 2026-08-11, matching the Hex release. The mix.exs requires Elixir ~> 1.14, which is an Elixir version and no OTP minimum, so no runtimeMin is recorded. The README says the mix salad.setup task sets up Tailwind CSS and color schemes; that is a setup step, not a statement that the components are built on Tailwind, so no basedOn tailwindcss is recorded. The basedOn phoenix statement is the repository description "Phoenix LiveView component library inspired by shadcn UI". The Hex "all" total is recorded; Hex's own week figure is not recorded. The README's Ko-fi link is a support link, not a paid edition. The LICENSE copyright line and the mix.exs maintainers field both name Dung Nguyen. The Hex package has no recorded dependents on ecosyste.ms.
