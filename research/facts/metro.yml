notes: >
  Metro is the bundler React Native projects use; its README says "Metro is included with React Native" and its getting-started page covers adding it to an existing project, so the install route is npm with the packages metro and metro-core. The repository is a monorepo (packages metro, metro-config, metro-core); npmName and the weekly figure take metro, the package the install docs name, summed over 2026-09-28 to 2026-10-04. The README describes it as "The JavaScript bundler for React Native"; React Native has no record here, so no basedOn is recorded. The GitHub releases list holds 164 releases; the oldest is v0.34.0 (2018-04-20) and firstRelease takes it. The npm registry history starts in 2011 with versions 0.2.0 onward, which belongs to an earlier package of the name, so it is not used. The current release is v0.87.2 (2026-10-26) on npm as latest and on GitHub; the npm alpha dist-tag (0.81.0-alpha.2) is not a stable release. Hosting: the getting-started page calls runServer a development server, and runBuild is described as useful at build time, so the tool runs on the developer's machine or in CI. The company is "Meta Platforms, Inc." per the homepage copyright; hqCountry US rests on the company's Menlo Park, CA address given on the privacy page for UK data contact, which is the only US address the company's pages give; the page does not use the word headquarters. The Twitter link on the homepage is recorded as x. The homepage also links Stack Overflow under the tag metrojs, which is not a forum field. Node engines in the registry are "^22.13.0 || ^24.3.0 || >= 26.0.0", recorded as 22. The version line is 0.x, so currentMajor is 0.
