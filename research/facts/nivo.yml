notes: >
  Monorepo: nivo is a monorepo of scoped @nivo packages; stars, contributors and the release line belong to plouc/nivo. The npm figures are for @nivo/core, the package the README says every install needs, and the dependent counts are ecosyste.ms figures for that package. Version line: v0.99.0 (2025-05-23) is the highest stable GitHub release, so currentMajor is 0 and the line is 0.99; the repository's master branch was pushed in 2026 without a release since 2025-05-23. Language: the repository is TypeScript; the components are React components. Basing: the homepage says the library is "built on top of D3 and React", recorded as basedOn d3 and react. Server-side rendering appears in the README feature list ("Server Side Rendering and HTTP API"); it is a compatibility statement, so renderingModes is left empty and no runtime is recorded for the browser library. The first tag v0.12.0 has the commit date 2017-08-16, which sets firstRelease. Maintainer: the LICENSE copyright line names Raphaël Benitte, the author named in the npm package; the repository owner is a user account. License: the npm latest manifest for @nivo/core states MIT; the LICENSE file has the MIT text without its title. The Discord link is the one the README badge names. No install route other than yarn is stated on the pages read, so npm and CDN routes are not recorded.
