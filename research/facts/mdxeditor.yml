notes: >
  The Markdown editing component is one npm package, @mdxeditor/editor, which the getting-started page names; the registry figure is that package, and the repository holds only the editor, so stars and contributors are its own. The README says that commercial projects can get dedicated assistance in exchange for sponsorship, by email; that is support, not a paid edition, so no paidEdition. The homepage and the i18n page carry the copyright line Copyright 2023 Petyo Ivanov, the same name as the LICENSE. The homepage links a LinkedIn profile (linkedin.com/in/petyo), a coined field kept here. The homepage also links a Twitter profile for the same person; it is recorded as x with no quote, since link facts may stand without one. The package engines field requires Node.js 16 or later and the peer dependencies name React 18 or 19; both are build requirements for a component that runs in the browser, so no runtime is recorded. The docs say the component does not support server rendering. The docs describe the editor as rendering JSX components with a built-in JSX editor; no templating fact is recorded for that. The first GitHub release is v0.0.7 of 2023-02-13; the first tag, v0.0.1, is dated 2023-02-10, and the npm package starts at 0.0.1 in June 2023; the year is 2023 in every case.
