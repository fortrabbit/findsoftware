notes: >
  No project website is recorded: the CSV homepage is the repository, and the sites listed under "Sites using gor" are other people's sites. The GitHub API reports no license for the repository and the repository has no LICENSE file (the raw file answers 404); the README states the BSD 3 Clause license, and that statement is the recorded license. The first release is the oldest GitHub release (3.7.0, 2014-12-29), although the repository carries older tags (1.0.2, 2.1, 2.4, 2.5, 2.7.2) that have no release entry. The highest stable GitHub release is 3.7.0, so currentMajor is 3. The README says gor is "Ruhoh like" and works as a replacement for the Ruby implementation; that is recorded as alternativeTo, not basedOn, because the README does not say gor is built on ruhoh. The latest release is older than four years, so the import will move the record to stub on its own; the status is left as the CSV row sets it. The README does not state a minimum Go version.
