notes: >
  The Form component is a read-only split of symfony/symfony; the README sends issues and pull requests to the main Symfony repository, so the stars, contributors and dependents above are the split's own counts and the development history sits in symfony/symfony. The docs page components/form.html redirects to the Forms page, which says that in Symfony applications the framework creates and configures the form factory, and that in any other PHP application the application creates it and requires Composer's autoloader. The Symfony project is the context of the component, but the docs and README state no built-on relationship, so basedOn is left empty. The Packagist totals are as of 2026-11-16 (total and monthly) from the Packagist package API. The GitHub prerelease v8.2.0-BETA2 (2026-11-13) is the newest tag and is newer than the latest stable v8.1.11 (2026-11-04). The maintainer follows the LICENSE copyright line: Fabien Potencier. The Symfony packages page lists projects that use the component; those are not recorded.
