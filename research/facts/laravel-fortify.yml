notes: >
  The Packagist package laravel/fortify is the one the docs install (composer require laravel/fortify), and the GitHub repository is laravel/fortify with default branch 1.x. The docs call Fortify a headless authentication library and say it provides no user interface, so adminUi is left out. The docs name Laravel starter kits that use Fortify internally and say Fortify and Laravel Sanctum are not mutually exclusive; the Sanctum section calls the two not mutually exclusive or competing, so laravel-sanctum is no alternativeTo value. The docs say Fortify registers the routes and controllers for login, registration, password reset, email verification and more. The docs list two-factor authentication (TOTP) and passkeys as features; passkeys come from a separate laravel/passkeys package the composer.json requires, which is not a record. The stable major is 1, from v1.42.0 published 2026-11-10 on GitHub; Packagist's version time for v1.42.0 is 2026-10-21, the tag's commit date, so latestReleaseDate follows the GitHub release. firstRelease is 2020 from the Packagist upload v0.0.1 dated 2020-08-31, the same day the repository was created. The maintainer is the LICENSE copyright holder Taylor Otwell, an individual; no page here names a company as maintainer, so hqCountry is not recorded. The basedOn Laravel value rests on the first sentence of the docs, which calls Fortify an implementation for Laravel of Laravel's authentication features.
