notes: >
  The homepage lists Instagram and YouTube only; no Discord, X, Bluesky or Mastodon link appears on the page. The footer links a Slack community (agilitycms.com/join-slack), for which the starter list has no field. The best-canadian-headless-cms page says the team is fully remote across Canada, which does not state a headquarters, so hqCountry stays unknown. The pricing page lists three plan columns with prices and an Enterprise column; no prices are recorded. The pricing page's on-premises FAQ answer (in the page's embedded script data, so no visible-text quote is possible) reads "No, Agility CMS is a Multi-tenant SaaS platform"; selfHostOption stays out of the facts for that reason. Hosting locations come from the pricing page and no single default location is stated. The Datacenter Location row lists USA for the Proof of Concept and Essentials plans and USA, Canada, Europe, Australia for the Enterprise plan; the pricing page lists SSO as Enterprise only. The pricing page also names webhooks, a Management SDK and a Content Sync SDK, and open source SDKs for JavaScript and .NET on GitHub (organization agility, e.g. agility-content-fetch-js-sdk); those SDK repositories are not the product source, so no repository is recorded and their licenses and counts are not used.
