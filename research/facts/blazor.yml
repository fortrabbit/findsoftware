notes: >
  Blazor is built into ASP.NET Core; the record uses the aspnetcore repository and the Microsoft.AspNetCore.Components NuGet package, the core package of the monorepo, whose install docs name the dotnet new blazor templates. The Microsoft.AspNetCore.Components.Web package shows 373.5M total downloads and Microsoft.AspNetCore.Components.WebAssembly 82.5M; the core package is recorded. The homepage is the Blazor product page; https://asp.net redirects to the ASP.NET product page on dotnet.microsoft.com, so no separate homepage is set. The CSV row lists the category ui-library; the product page calls Blazor a web framework, so framework is recorded as the category the page states. The aspnetcore LICENSE copyright line reads "Copyright (c) .NET Foundation and Contributors"; the maintainer is recorded as Microsoft Corporation from the manufacturer statement on the Microsoft terms page, which gives a Redmond, WA address but no country code, so hqCountry is not set. Firstrelease is the Blazor experimental announcement of 2018-02-06, not the aspnetcore repository, whose oldest GitHub release is ASP.NET Core 1.0.0 from 2016. The latest stable GitHub release is v10.0.13; v11 tags are release candidates or previews. Contributors counts the aspnetcore repository across all pages, which is the whole ASP.NET Core project, not Blazor alone. The Blazor Web App, standalone WebAssembly and Blazor Server hosting models each set one or more renderingModes and runsAs values, taken from the hosting models and host-and-deploy pages. The hosting models page says Blazor Server components update the page over a SignalR connection, that an ASP.NET Core server is required to serve a Blazor Server app and that serverless deployment scenarios, such as serving it from a CDN, are not possible, that the WebAssembly model downloads Razor components, their dependencies and the .NET runtime to the browser, and that WebAssembly-rendered components are limited to a subset of .NET APIs. The x and bluesky links are the .NET accounts in the footer of the Blazor product page. The i18n quote is from the globalization and localization article. Blazor Server is a hosting model of Blazor Web Apps in this record, not a separate product. The tooling article lists Visual Studio, Visual Studio Code and the .NET CLI as ways to create an app.
