notes: >
  Archived on GitHub (api: archived true) and the README at the repository states the project is not receiving updates and recommends Keystone 6 for new projects; that makes the record discontinued. The Keystone 6 repository (github.com/keystonejs/keystone) is named as the recommendation, not as a successor of this package, so successorOf is not recorded. The CSV row lists http://v4.keystonejs.com; the https address answers 200 with the same site and is recorded as homepage. The npm package keystone at 4.2.1 is the one the README names for installation. The README table of Node support says the project was most thoroughly tested with Node 6, which is not a minimum, so runtimeMin is not recorded. The repository license statement in the README reads "Copyright (c) 2016-2019 Jed Watson"; the homepage credits Thinkmill, which the README names as the project's sponsor; maintainer follows the legal notice. The first release year is the creation of the npm package keystone in 2013; the oldest GitHub release is v0.3.19 in 2016. The README also names a Slack workspace, which has no field.
