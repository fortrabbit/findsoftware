notes: >
  Stub: the project site mezzanine.jupo.org fails the TLS handshake over https and the plain http address redirects to the GitHub repository, so the project has no site of its own that shows the software; a live https homepage would settle it. The homepage is not linked: mezzanine.jupo.org answers over plain http only, and its https address fails the TLS handshake; the plain http address redirects to the GitHub repository, so the project's own site is not reachable and no homepage is recorded. The docs are read from the docs folder of the repository, since the docs site is http only. The docs overview says Python 3.7 to 3.10 and Django 2.2 to 4.0, while the PyPI package requires Python 3.8 or later; the registry value is recorded as runtimeMin and the page's range is left out. The license is stated twice: the GitHub license field says BSD-2-Clause, the PyPI metadata says BSD, and the LICENSE file names Stephen McDonald and individual contributors. The Cartridge ecommerce module and the free themes are separate projects and are not recorded here. The PyPI download figure comes from pypistats and is a last-month count; the dependent counts come from ecosyste.ms. The highest stable GitHub release is v6.1.1 (2025-06-04), which matches PyPI.
