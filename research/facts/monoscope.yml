notes: >
  The CSV homepage monoscope.tech redirects to monoscopehq.com, which the footer and the repository homepage field use, so monoscopehq.com is recorded. The README names monoscope.tech as its website and its X link is x.com/monoscope-tech, while the homepage links x.com/monoscope_tech; the homepage link is recorded. Acceptance: apps send telemetry to the project through OpenTelemetry (OTLP on port 4317) and a logs REST endpoint (docs/getting-started.md), which is the ingestion wiring criterion 1 needs; the record's status stays accepted on that basis. Coined or unrecorded kinds: OpenTelemetry (OTLP) compatibility, SDK languages (the homepage names Node.js, Python, Go, PHP, Java, .NET and Elixir SDKs), S3-compatible bucket storage for telemetry (README: "Store years of logs, metrics, and traces affordably in your own S3 buckets"; it is no content store), the container image ghcr.io/monoscope-tech/monoscope, the LinkedIn link. The Enterprise SSO protocol is not named on the pages read, so no sso value is recorded; the Auth0 option in docs/configuration.md is an identity service, not a stated protocol. The software is built on TimeFusion, the same company's time-series database, which is not a record, so basedOn is absent. The version line is 0.6 (currentMajor 0 by the rule for 0.x releases). The Cloud plans, prices and the self-hosted Community Edition are not recorded as figures. The docker image is on ghcr.io, not Docker Hub, so no dockerPulls.
