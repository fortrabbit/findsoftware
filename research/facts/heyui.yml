notes: >
  Doubt: the documentation that names the install steps is unreadable, so criterion 3 cannot be judged. The CSV homepage https://v2.heyui.top/ does not answer, and the README links to it over plain http; https://heyui.top/ answers with a client-rendered shell whose title and description are the only text in the HTML. The repository README is the README of a third-party fork, HeyUI.ext (npm heyui.ext), and gives its own install command, so it is not a source for the project's install steps. Settled by a readable install page on the project's own site, or a maintainer statement on whether the 1.x line and a v2 line are still maintained. The npm registry lists heyui 1.28.0 as latest, published 2020-12-13, while the newest GitHub release is v1.26.1 from 2020-08-24, so the registry is the source for latestReleaseDate. npm lists next as 2.2.0-alpha.1, a prerelease, so no stable v2 is recorded. The repository's last push is 2026-04-07, and the repository is not archived. firstRelease 2016 is the first npm upload (0.0.1, 2016-11-02), whose repository field names this project under its earlier address vvpvvp/heyui; the oldest GitHub release is v0.1.1 (2017-06-28).
