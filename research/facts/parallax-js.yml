notes: >
  Doubt on status: the latest GitHub release is v3.1 (2017-09-10) and the last push to the default branch is 2024-04-06; the record stays accepted as the discovery row has it, and the import's four-year rule on release age will move it to stub on its own, which a reviewer should confirm. The homepage was given as http://wagerfield.github.io/parallax/; that address redirects to http://matthew.wagerfield.com/parallax/, which is plain http and so is not linked. The https address of the same demo site, https://matthew.wagerfield.com/parallax/, is the one the README links and is recorded as homepage. The demo page is the author's site and names Claudio Guglieri as a collaborator, while the LICENSE copyright line and the README author list name Matthew Wagerfield and René Roth; the maintainer field follows the LICENSE. The runtime and runsAs are not recorded: the README and demo describe the cursor, the device orientation sensor and the DOM (the scene element, the layers) but no sentence states that the library runs in the browser, and the iOS and Android notes concern browser permissions and secure origins. The maintainer's personal Twitter account (@wagerfield) on the demo page is not recorded as the project's x field. The package.json for parallax-js on npm has the same license; the npm latest tag is 3.1.0 with the last upload on 2017-09-10. The category animation maps to graphics in the import.
