notes: >
  No homepage: the repository's homepage field is empty and the README names no project website; the README links a live demo server on Netlify (gorush.netlify.app) and a Flutter demo app, which are demonstrations, not the project's site. The homepage field is therefore absent. The software is a push notification server for iOS (APNs), Android (FCM) and Huawei (HMS); it is recorded under the realtime category, as for Gotify, because the import maps "notifications" to email, and the notifications kind goes here. The README feature list names YAML configuration, a notification queue with multiple workers, iOS certificates in p8, p12 or pem format, retry on failed sends, and a command line for single notifications; the configuration example shows a Firebase service account key file for Android and an APNs key file for iOS. Protocols and interfaces named in the README, none recorded as fields: HTTP/2 to Apple Push Notification service, a web API at POST /api/push, a gRPC service enabled in the config, command-line sending, Prometheus metrics, and a statistics API. Queue backends named as options are NSQ, NATS and Redis streams, with the default being an in-process channel. The Redis option is for application statistics; BoltDB, BuntDB, LevelDB and BadgerDB are the other statistics stores named in the same sentence. The README build requirement is Go 1.25 or later; the binary is compiled, so no runtimeMin is recorded. The install script and the Docker image are both named on the README's install section; the Docker image figure is for appleboy/gorush, the image the README names. The LICENSE file reads Copyright (c) 2016 Bo-Yi Wu; the README says Copyright 2026 Bo-Yi Wu, and the copyright holder is recorded as the same person. GitHub releases start at v1.13.0 in 2020; the oldest tag is 1.0.0, dated 2016-04-13, so firstRelease is 2016.
