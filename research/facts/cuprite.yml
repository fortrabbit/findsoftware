notes: >
  The record's CSV homepage, cuprite.rubycdp.com, answers 301 to rubycdp.com, which lists Cuprite beside Ferrum and Vessel; the gemspec homepage_uri still names cuprite.rubycdp.com, and the homepage is recorded at the final URL. The LICENSE copyright (2018-2022, Dmitry Vorotilin) and the gemspec author agree, while the rubycdp.com footer reads "Copyright © 2026. RubyCDP", so the individual is the maintainer and RubyCDP is the site owner. The versions are 0.x: 0.20 is the highest stable release, so currentMajor is 0, and the 0.x line goes to notes only. The gemspec pins Ferrum ~> 0.20.1 and Capybara ~> 3.0. The docs say the driver needs no Selenium, WebDriver or ChromeDriver. The rubygems figure is the cumulative download total of the cuprite gem. The docs installation section says a Chrome or Chromium binary must be in the PATH or BROWSER_PATH, or passed with the browser_path option. The docs section "Migrating from Selenium" gives code hints only, no import route, and no Selenium record exists. Stars, contributors and dependents belong to the cuprite repository. Dependents come from ecosyste.ms.
