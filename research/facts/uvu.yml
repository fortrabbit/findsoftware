notes: >
  Boundary ruling for this wave: uvu is a testing library and accepted under the load-testing and testing ruling. The repository is the only web presence: the registry homepage field points to the README, so no homepage is recorded. The README names Node.js and the browser, so runtime is node with no runsAs. The Benchmarks section times ava, jest, mocha and tape against uvu in a code block with no comparing sentence, so no alternativeTo is recorded. The package manifest engines field at the latest release tag is not recorded as runtimeMin because no README or docs sentence states a Node.js minimum. The version line is 0.5.x, so currentMajor is 0 and the minor line stays here. The first tag is from 2020 and the npm package was created in 2020. The README says the assertion module is completely optional and that any assertion library works, because the runner relies on thrown errors. The repository holds one npm package, so stars and contributors are the package's own. The maintainer is taken from the LICENSE copyright line; the same line carries an email address, which is not recorded. npmWeeklyDownloads is the sum of the daily figures for 2026-11-01 to 2026-11-07, the period stated in the value.
