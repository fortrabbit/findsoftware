notes: >
  Scope: the repository is a lerna monorepo (browser-sync-mono); the install docs name the browser-sync package, so the npm figures, the runtimeMin and the core manifest come from packages/browser-sync. The GitHub homepage field points to https://discord.gg/2d2xUThp, a chat invitation rather than the project's own site; the project site is browsersync.io, which answers over HTTPS. The GitHub releases list ends at v3.0.3 (2024-09-24); npm latest is 3.0.4 (2025-04-02) with no GitHub release, so latestReleaseDate is the npm date and the major stays 3 under both. The npm tag next is 3.0.0-alpha.2 and rc is 2.24.3-rc1, both older than the latest stable release, so no latestPrereleaseDate is recorded. The LICENSE appendix line "Copyright [2015] [Shane Osbourne]" is the filled-in template and is the copyright holder named in the file; the npm package author is also Shane Osbourne. The docs say the project works with Gulp and Grunt, and the homepage says "Easily integrated with task runners like Grunt and Gulp"; these are integrations, not parents, so basedOn stays empty. The homepage states the project is "Depended on by thousands", and the npm figure of over 2 million downloads a month is the project's own statement, recorded as reportedInstalls with its page date of reading. The engines field is the stated minimum for the core package at v3.0.3 and at npm latest; it is older than current Node releases and is recorded as stated. The README says the project was "Originally supported by JH", which is a support statement and not an end signal. The homepage lists network throttling, interaction sync, file sync, UI or CLI control, sync customisation and URL history. The README says Browsersync works by injecting an asynchronous script tag right after the body tag, which must be present, and the snippet can be customised with snippetOptions. The options page describes a proxy option for an existing vhost, and the API page shows create with a name for named instances.
