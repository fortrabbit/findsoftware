notes: >
  The npm install command is a shell line on the installation and quickstart pages, and no sentence on those pages names npm, so installMethod npm is not recorded; the npm package is named by npmName. The README says the project is based on Mocha ("Based on Mocha testing framework"); Mocha has no record, so basedOn is left empty. The homepage says "Node 20+" and the installation page says "CodeceptJS 4.2 requires Node.js 22.12 or newer"; runtimeMin follows the engines field of the 4.2.2 tag. The helpers Playwright, Puppeteer, WebDriver and Appium are drivers the framework calls, not parents, so they are not basedOn. The migration guides name Cypress, Java Selenium, TestCafe and Protractor (only Cypress has a record, recorded as importsFrom; TestCafe, Protractor and Selenium Java have none). The runtime sentences about continuous integration state where tests run in a pipeline, not a process model, so runsAs is not recorded. The README copyright line reads "MIT © CodeceptJS Team", while LICENSE names DavertMik; the LICENSE name is the maintainer. Explorbot (a self-testing agent powered by CodeceptJS) and Testomat.io (a test management product by the CodeceptJS authors) are separate products and are not recorded as hosted offerings. The Slack chat link (bit.ly) is not a field. The npm figure covers the codeceptjs package, the period is 2026-10-26 to 2026-11-01. The dependent counts are ecosyste.ms counts for the npm package on 2026-11-04. The footer Privacy and Terms links point to "#", so no legal name or country is recorded.
