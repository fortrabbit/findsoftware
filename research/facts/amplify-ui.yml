notes: >
  Monorepo: the figures are for @aws-amplify/ui-react, the package the install page names, with aws-amplify installed beside it. The npm package carries 0.x history from 2020 (preview uploads from 2020-01-15, first stable 0.2.0 on 2020-04-02) that was published from the amplify-js repository as a React wrapper for the older ui-components package; the repository amplify-ui was created 2021-03-25 and its first stable release is ui-react 2.0.0 on 2021-11-18, which firstRelease follows. The npm weekly figure is the sum of daily downloads for 2026-10-18 to 2026-10-24 from the range endpoint, because the last-week endpoint returned the window 2026-06-25 to 2026-07-01. Contributors counts the contributors endpoint with per_page=1 and reads the last page. The introduction page says the Authenticator is available for React, Angular, Vue, Svelte, Flutter and Swift, that primitive components are React-only for now with Angular, Vue, Svelte and React Native in planning, and that the components are themeable with CSS variables. The install page says the default theme references the Inter font, which the library does not bundle. Those statements are not fields; the prose may use them only with the page cited. The homepage's footer names Amazon Web Services, Inc. as the copyright holder. The introduction says primitive components adhere to WCAG and WAI-ARIA specifications. The install page says the application imports @aws-amplify/ui-react/styles.css for the default theme. The introduction says connected components are built on top of primitive components and Amplify Libraries.
