notes: >
  The homepage adduce.vale.rocks answers over https and is the project's own site. The documentation is the GitHub wiki; only its page list was read, which links the general configuration, individual and feed pages, so the install and configuration details are not recorded beyond the README. The GitHub license field reports LGPL-3.0 and Cargo.toml reports LGPL-3.0-or-later; both are recorded as separate statements. The crates.io entry reports 0.1.6 as its newest version while the GitHub release is 0.1.7 (2026-03-14); the GitHub release is the one recorded, and the crates.io figure is the total downloads of the crate. The maintainer is the name the homepage gives, Vale; the Cargo.toml authors list an individual with an address, which is not recorded. Adduce has no runtimeMin because neither the README nor the Cargo.toml read states a Rust version. The README says the individual functionality generates single pages from a configuration file per page, and the feed functionality uses one configuration file for all documents, written in markdown, and can generate an Atom feed. The renderingModes and runsAs value static follows the homepage's own words, a static site generator; the homepage does not say more about hosting.
