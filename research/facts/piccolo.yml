notes: >
  Status accepted. Criterion 1: an ORM and query builder that a web app's code calls; the README's piccolo asgi new command scaffolds an ASGI web app with Piccolo as its ORM, and names Starlette, FastAPI and other frameworks. Criterion 2: installed from PyPI (piccolo) with pip, the route the docs name. Criterion 3: the README and docs install commands. Criterion 4: the repository is not archived; the latest release 1.39.0 is dated 2026-10-28, and the newest prerelease (1.0a3, 2023) is older, so latestPrereleaseDate is not recorded. The first tag 0.1.0 and the first PyPI upload are both 2018-12-09. The homepage says Postgres, SQLite and CockroachDB; CockroachDB is outside the databases vocabulary and is not recorded. The homepage and README describe an admin GUI as a batteries-included feature, but the GUI is the separate Piccolo Admin package (piccolo_admin) listed under the Piccolo ecosystem, which the core package does not ship; adminUi is therefore not recorded and the reviewer decides. Piccolo API (piccolo_api), which exposes tables as REST endpoints, is also a separate package and is not recorded as headlessApi. The Django comparison page is a how-to for equivalent queries and not an alternativeTo statement. The README features list says Piccolo supports sync and async. The homepage links the blog and a merchandise store; they are not fields, and its YouTube link is recorded as youtube. The installation page of the docs says Python 3.7 or above, which is older than the python_requires of the current release; runtimeMin follows setup.py and PyPI. The license is the MIT License in setup.py; the LICENSE file names Daniel Townsend, who is also the PyPI author. The pypistats figure is the last-week total of the piccolo package the install docs name; it is a rolling figure read on 2026-11-16. Stars and contributors belong to the single repository.
