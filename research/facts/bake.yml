notes: >
  The repository has no release and no tag, so currentMajor and firstRelease are not recorded, and lastCommitDate is the committer date of the newest commit on master (2020-08-11), which the import uses to judge listing. The CSV homepage http://ctrl-c.club/~philips/90s/ is a theme page on a personal blog that the author's blog post calls a theme for bake, not the project's own site, so no homepage is recorded; the page also redirects to https. The README says the original was written in C and that this version is a C++ implementation, so language is C++ from the README; GitHub reports C. The LICENSE file is the WTFPL text with a copyright line for its author Sam Hocevar, not for this project, so no maintainer is recorded; the repository owner login is felipetavares.
