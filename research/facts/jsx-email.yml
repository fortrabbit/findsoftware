notes: >
  Monorepo: the repository shellscape/jsx-email holds packages/jsx-email and other packages; its GitHub releases list is empty, so the current major comes from the highest stable package tag jsx-email-v3.2.1 and the release date from the npm time record for 3.2.1. Stars and 115 contributors belong to the monorepo; the npm figure is for the jsx-email package the install page names (sum of daily downloads 2026-11-01 to 2026-11-07). firstRelease 2023 is the first npm version 0.0.0 (2023-09-05), the repository was created 2023-09-04. The v3 requirements (Node.js 22 and React 19.1) are on the migration and quick start pages; the basedOn react value comes from the docs introduction sentence that calls the library a set of React components. The README and homepage say the components handle email client compatibility and inconsistencies, that the rendered HTML string can go to any provider with an API that sends email as a string, and that the package has a command-line tool with a preview server and email client compatibility checking. Pro Templates (pro.jsx.email) is a separate paid template product with a lifetime price, not an edition of the library, so no paidEdition. Homepage and docs list the email providers it renders for (AWS SES, Loops, Nodemailer, Postmark, Resend, Plunk, SendGrid) without an integration field. The docs say the project is community-driven with no corporate sponsorship; the maintainer is the copyright holder named in LICENSE.md, Andrew Powell, and no legal entity or country is stated. The quick start page lists the Node and React prerequisites, and the migration page notes that the v3 packages are ESM-only.
