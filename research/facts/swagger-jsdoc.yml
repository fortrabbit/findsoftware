notes: >
  Checked 2026-11-16. No project site: the README links no homepage, so the repository is the record's page. Stable line is 6.3.0 (2026-05-22), published to npm the same day; the 7.0.0 release candidates (2021) are older than it and are not recorded as latestPrereleaseDate. The README's docs link for v7 points to release candidate docs and is not cited. The npm package has no deprecation and its engines field (node >=20.0.0) agrees with the README's system requirement. The maintainer is the Surnet GitHub organization, which the README does not name; the LICENSE copyright lines name Fliptoo (2013) and devlouisc (2015), the original authors, and are not used as the maintainer. The npm maintainers list names three individuals; it is not recorded. The README says the library reads JSDoc comments, which is an input format and not a basedOn relation to the jsdoc project. The README's "Swagger 2" and "AsyncAPI 2.0" support lines are spec compatibility and are in notes only. The npm install page also names yarn add swagger-jsdoc, the same npm registry route. The docs describe a command line interface that wraps the library and is available under the package name when installed globally. The validation option failOnErrors is a configuration flag, so no runsAs statement is recorded; no page says where the library runs in production. The contributors count covers all pages of the repository.
