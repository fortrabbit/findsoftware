notes: >
  The project's Web site, opensemanticframework.org, named as homepage in the repository metadata and in the README, does not resolve in DNS, so no homepage is recorded. The Techwiki at wiki.opensemanticframework.org is linked from the README but was not read. The company site structureddynamics.com states that Structured Dynamics has ceased operations, and its meta description gives January 2018. The README names the Virtuoso RDF triple store and the Solr search engine as the datastores OSF interfaces with; no field covers them. The repository default branch is 3.4, but its highest stable release is 3.3.0 (2015-02-12), which sets currentMajor; the last commit is dated 2016-05-02 and the last push 2017-11-23. The repository has no license field on the API; the Apache 2 statement is taken from the README. The maintainer's legal form is not stated on any page read, so the name is recorded as the company's site gives it. The runtime is PHP per the GitHub language field only; no page names it, so runtime is not recorded. The repository's contributors count is 2 across all pages.
