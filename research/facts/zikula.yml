notes: >
  The address ziku.la answers with a 301 redirect to github.com/zikula/core, so it is the repository and not a separate site: no homepage is recorded. The documentation at docs.ziku.la does not answer, so the docs in the repository at tag 3.1.0 are the source for installation and requirements, and the docs field points at them. The README on the default branch says the project is dormant and that the 3.x releases are no longer maintained; the default branch is the 4.0 work in progress, which has no release. Status is discontinued on three signals: the repository is archived, the README states the development is inactive, and the Packagist package zikula/core is flagged abandoned. The GitHub language field reports JavaScript for the repository, which is not the project's language, so language is left out; runtime php comes from the requirements page. Two license statements are recorded: the GitHub license field and the composer.json of release 3.1.0. The Packagist downloads figure is the total, the monthly figure at the same endpoint is 63. The docs state that Zikula 3 requires PHP 7.2.5 and that it uses Symfony 5.x, which is the basis for basedOn; the 4.0 README on the default branch names Symfony 7.x and is not used.
