notes: >
  The repository is a monorepo (packages/chartist, the docs app, examples and playground), so stars and contributors belong to the monorepo; the npm figure is the package the install docs name. The stable line is 2.x: 2.2.0 released 2026-10-20 on GitHub and as npm latest; the 2.0.0 release candidates (latest 2.0.0-rc.3, 2026-10-16) are older than that release and are not recorded as a prerelease. The first tags date from April 2014 (v0.0.3, 2014-04-06). The license is stated as "MIT or WTFPL licensed" on the docs page and "Dual-licensed under MIT or WTFPL" in the README; both are recorded as separate entries. The homepage footer and the docs page name Gion Kunz as copyright holder with contributors; the LICENSE-MIT copyright line names the same person, which is the maintainer recorded. The homepage section "How Chartist compares" sets it beside Chart.js, ApexCharts and Highcharts; Chart.js and ApexCharts are recorded as alternativeTo, Highcharts has no record. The homepage footer links GitHub Discussions (recorded as the forum) and a Stack Overflow tag. The 1.x compatibility entry point and the community wrappers for 1.x and 0.x are not records. The server rendering page says a chart renders to an SVG string anywhere JavaScript runs, in Node.js among others, so runtime node is recorded, with runtimeMin 14 from the engines field of the latest npm release; runsAs stays empty because browser plus Node is no single process model. The server API (chartist/server) is marked experimental on that page and may still change in a 2.x minor release. The README names Cube as the sponsor of the maintenance; a sponsor is no parent.
