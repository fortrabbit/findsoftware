notes: >
  The install docs name composer require cmsig/seal, the core package, so the Packagist name cmsig/seal is recorded. The repository field names the monorepo PHP-CMSIG/search, where development happens; PHP-CMSIG/seal is a read-only split whose README says issues belong in the main repository, so the stars, contributor count, language and license come from the monorepo. The candidates row's packagist 522.1k total is stale: Packagist gives 547,754 total today. The ecosyste.ms API gives 0 dependent packages and 0 dependent repositories for cmsig/seal, while Packagist lists 41 dependents; the Packagist figure is recorded and the disagreement is for the reviewer. The introduction says the library is inspired by Doctrine DBAL and Flysystem; that is inspiration, not a basedOn statement, and the framework integration packages (Laravel, Symfony, Spiral, Mezzio, Yii) are separate packages that are not recorded here. The introduction says the data is stored in the search engine (Loupe, Meilisearch, Algolia, Elasticsearch, Opensearch, Redisearch, Solr, Typesense), not in SEAL, so no contentStore is recorded. The README calls the project heavily under development. The first tag is 0.1.0, and its commit is dated 2023-05-11, the same day as the first Packagist upload; the repository was created 2022-12-20. The repository has no GitHub releases, only tags, and the default branch is 0.12. The category search-integration in the candidates row is not used: the core package is a library and the integrations are separate packages. The maintainer is Alexander Schranz by the composer.json authors field and the LICENSE copyright line; the organization PHP-CMSIG is the repository owner.
