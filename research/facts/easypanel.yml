notes: >
  No source repository is public: the software ships as the easypanel/easypanel Docker image and an install script from get.easypanel.io. The easypanel-io/community repository holds a README only, so it is the sourcePublic citation and no repository is recorded. That README begins with "**DEPRECATED** This repository is no longer active. All the content was moved and consolidate to https://feedback.easypanel.io"; it is the community repository, not the product, and the changelog shows releases through 2.38.0 dated October 22, 2026, so no end signal is recorded. The project's own changelog has 80 entries over eight pages; the oldest, 1.13.0, is dated January 3, 2023, which sets firstRelease. The site says "Join 145,000+ self-hosters"; that second count is not recorded, the server count is. The terms name Easypanel without a legal entity, and the privacy policy names no controller, so no legal form or hqCountry is recorded. The terms name Lemon Squeezy as merchant of record for purchases; no record field takes it. Stars and contributors are not recorded because the source repository is not public. The Free plan is not a paid edition. The docker runtime is not a runtime value in the dictionary, so no runtime is recorded. The Growth tier lists multiple users and access control; no userRoles fact is recorded because the page places them in a paid tier and the free plan does not have them. Fields coined here: none.
