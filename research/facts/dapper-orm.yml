notes: >
  The GitHub homepage field names learndapper.com, a tutorial site run by ZZZ Projects and sponsored by Dapper Plus; it is not the project's site, so the homepage is dapperlib.dev, the project's own page with the NuGet install line and the release notes pointer. learndapper.com is read and not quoted: its "downloaded over 350m times" and its statement that Dapper Plus is a third-party library are not project statements. Dapper Plus is named as a major sponsor in the README and is a separate commercial library; it is not recorded as a paidEdition. The maintainer is the Authors line of Dapper.csproj; Directory.Build.props carries "2019 Stack Exchange, Inc." as copyright, and the README says Dapper was originally developed for and by Stack Overflow; DapperLib is the GitHub organization. SQL CE and Firebird are named beside the recorded databases and have no value. The csproj targets net461, netstandard2.0, net8.0 and net10.0; the .NET Framework floor is no runtimeMin. The License.txt logo clause (Marc Gravell copyright, use only when referencing Dapper) is not recorded as a license entry. The repository's license file says "licenced under Apache 2.0" and GitHub detects no license; the value is taken from the file text. The NuGet registration index shows placeholder 1900 dates for early versions, so firstRelease is the date of the oldest tag, 1.5, whose commit is dated 2011-07-11. The release list holds 19 GitHub releases from 2023 on; currentMajor is 2 from the stable 2.1.89 release. The README lists a Dapper.Rainbow micro-ORM and a Dapper.SqlBuilder package in the same repository; they are NuGet packages of this repository, not records. The dapperlib.dev page links the Stack Overflow tag "dapper" for questions; that is a Q and A site, not a forum of the project, and is not recorded. The NuGet figure is the total count from the search API on 2026-11-04. The stars and contributors are the repository's own counts.
