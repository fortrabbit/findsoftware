notes: >
  The repository was renamed: squdle/Bang now redirects to BreadMakesYouFull/Bang, which is recorded. The LICENSE file reads "Copyright (c) 2024 BreadMakesYouFull" and also "Copyright (c) 2013 squdle"; the MIT text is the license. GitHub's detection reports NOASSERTION because of the two copyright lines, which the record does not repeat. The README names "Preview" at https://breadmakesyoufull.github.io/Bang/, but that page is a generated demo titled "Hello World" with a date of 2024-08-09, not a site about the software, so no homepage is recorded and the page is listed as notFound. The README says "python 3" with no minor version, so runtimeMin is not recorded. The repository has two tags, 1.0.0 and 2.0.0, and no GitHub releases, so firstRelease and latestReleaseDate are the committer dates of the commits those tags point to (2024-08-09 and 2024-08-10). GitHub's language detection reports HTML, while the README states Python. The README lists the external "Learn more" links to a jamstack.org directory and staticgen.com, which are not used as sources.
