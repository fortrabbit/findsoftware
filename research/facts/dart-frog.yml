notes: >
  The homepage https://dart-frog.dev answers over https and is the project's own site; the CSV row lists the http address, which is not used. The repository is a monorepo: the README installs the dart_frog_cli package, and the framework is the dart_frog package on pub.dev. The major comes from the highest stable dart_frog_cli release (1.2.14), and the dart_frog framework package is also on major 1. The latestReleaseDate is the publish date of the dart_frog framework package (2025-11-03, v1.2.6); the dart_frog_cli package, which the install command names, was last published 2026-03-23. The pub figure recorded is the pubName only: pub.dev publishes a 30-day download count on its score endpoint, but the register records no pub download figure. The first pub.dev publish of dart_frog is 2022-05-23. The maintainer line on the LICENSE file and the README sentence both read Very Good Ventures; the company's legal notice pages were not reachable (the terms and privacy links return a 404 or redirect), and its about page states no headquarters, so no legal form or hqCountry is recorded. The runtime is recorded as dart. The docs' Dockerfile AOT-compiles the app to a native executable and starts it, but no page states how the server runs on a host, so runsAs is left out. The getting started page says the production build includes a Dockerfile so that the app can be deployed anywhere, and the deploy chapter has pages for Google Cloud Run, AWS App Runner, Digital Ocean App Platform, Clever Cloud and Railway. The page also says Dart Frog is inspired by remix.run, next.js and express.js. The language is recorded as Dart, which the import maps to other. The docs' Daemon page describes the IDE daemon and is not a hosting fact. The Discord link on the homepage is the only community channel recorded.
