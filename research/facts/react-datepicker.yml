notes: >
  Status accepted from the candidate row. The latest stable release is v9.1.0 (2025-12-19); the 0.1.x line of 2014 is marked prerelease on GitHub and sets firstRelease to 2014 (oldest tag 0.1.0, 2014-07-03). The default branch is main, last pushed 2026-04-02. The LICENSE copyright line names HackerOne Inc and individual contributors, so the maintainer is HackerOne Inc; the npm maintainers listed are rso and mrusschen, and the homepage title names HackerOne. No hqCountry is recorded: no page read names the country. The README install section names npm and yarn; yarn installs the same npm package, so only the npm route is recorded. The peer dependencies (react and react-dom 16.9 to 19, date-fns-tz 3) and the README's React compatibility table are dependencies and compatibility, not runtime or basedOn statements beyond the description sentence. The README says the React and PropTypes packages must be installed separately; that is a peer dependency, not recorded as basedOn. No page states that the component runs in the browser (the README shows it used "in a React view" and lists browser support), so runsAs is not recorded. The README's localization section shows registerLocale and setDefaultLocale; the date-fns locale packages are a dependency of the i18n support. Contributors counts the contributors endpoint with per_page=1, read from the rel="last" link (415). The npm figure is the sum of the daily downloads for 2026-11-01 to 2026-11-07. Stars belong to the repository. The README timezone section says it "uses native JavaScript Date objects" and that the library "does not include built-in timezone conversion utilities", recommending date-fns-tz alongside it. The README states browser support for Chrome, Firefox and IE10+, which is compatibility and not recorded as a field. The README changelog note says versions up to 1.8.0 used Moment.js and the package moved to date-fns from 2.0.0.
