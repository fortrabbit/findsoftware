notes: >
  Discontinued on the organization's own description, which says the castleproject-deprecated projects "have been archived and are generally unsupported"; the repository itself is not archived, and the repository description reads "Deprecated MonoRail 2 and prototype MonoRail 3". The Castle site's GitHub links (castleproject/MonoRail) redirect to this repository, so it is the one the project names. Install steps are present in MR2/docs/installation.md (IIS and web.config) and the homepage's download links. The only registry package is NuGet Castle.MonoRail3, which the site links for MonoRail 3; its single version is 0.0.0.2 (2012-04-26), a prototype build, so currentMajor and latestReleaseDate are left unknown for a reviewer to decide. The MR2 docs say "Current version is 2.0, released in January 2010", which is not recorded as currentMajor because the registry rule resolves to 0. The changelog has no dates, so firstRelease is unknown. Licenses: the MR2 License.txt states Apache 2.0, the site footer states Apache License Version 2.0 for the site, and a second footer line states that MonoRail 3.0 is under the GNU LGPL with no version given; each is recorded as its own statement. The site footer copyright is "2004-2017 Castle Project", the license file says "2004-2011"; the maintainer is recorded as Castle Project. The MR2 docs name NHibernate and ActiveRecord integrations, not a database, so databases is unknown. runsAs is left out: the docs describe IIS and ASP.NET ISAPI hosting, which does not state whether the process stays running. The Castle site's homepage was read through the MonoRail project page only.
