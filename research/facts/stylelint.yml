notes: >
  The maintainer is the copyright line of the MIT LICENSE, naming three individuals; the README says the project "is maintained by volunteers", recorded as maintainerType community. The GitHub owner is the stylelint organization, not used. The homepage and the README both say Stylelint "is trusted by companies worldwide like Google and GitHub"; that is a claim with no source behind it and is not recorded. Support goes to Stack Overflow and GitHub issues (SUPPORT.md); Stack Overflow is a third-party site and no forum fact is recorded. No social link appears on the homepage or the docs site. The first release is 2015, the npm upload of version 0.1.0 (2015-07-08); the 0.0.0 upload of 2014-12-11 is a placeholder and no release. The highest stable release is 17.16.0 (2026-10-01); the 18.0.0-next.0 prerelease (2026-10-22) is a next tag, newer than the latest release, so it is recorded as latestPrereleaseDate and not as the major. The postcss-plugin page says Stylelint's PostCSS plugin can be used with PostCSS runners, which is a usage statement and no basedOn. The engines field of the 17.16.0 manifest gives node >=20.19.0. The npm weekly figure covers 2026-09-28 to 2026-10-04.
