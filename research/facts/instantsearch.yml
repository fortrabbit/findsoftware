notes: >
  The repository holds a monorepo: the README table lists instantsearch.js, react-instantsearch, vue-instantsearch, react-instantsearch-core, instantsearch.css, algoliasearch-helper, create-instantsearch-app and instantsearch-ui-components. This record is instantsearch.js, the package the install page names; the wrappers are sibling candidates. The npm figures and the maintainer are for instantsearch.js. The GitHub releases list is read from the API as one list for all packages; the latest instantsearch.js release is 4.121.0 (2026-10-26). The install page's own sample loads the search client from the algoliasearch package, and the wrapper's search requests go to Algolia's hosted search API: the library has no server part of its own. The LICENSE copyright line names Algolia, Inc.; the terms page names two contracting entities, Algolia, Inc. (Palo Alto mailing address) and Algolia SAS (Paris), so hqCountry is not recorded. The homepage is the product documentation page on algolia.com because the project has no site of its own. The project README says "InstantSearch is a JavaScript library" and links no social accounts, so no social fact is recorded. The Algolia about page names no headquarters. The docs describe predefined widgets, an instantsearch wrapper that passes queries to Algolia, a CSS theme, connectors for changing widget output and custom widgets.
