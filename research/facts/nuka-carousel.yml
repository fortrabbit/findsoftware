notes: >
  Checked 2026-11-16. The README names the docs site at https://commerce.nearform.com/open-source/nuka-carousel, which answers with a redirect to https://nearform.com/open-source/nuka-carousel; the record cites the final URL. The docs Introduction page on that site still holds placeholder text; the docs fact cites the Usage page (docs/api/), which holds the real installation and usage text and names a peer dependency on React 18. The README states "Nearform is actively working on this project" under Maintenance Status, and the site footer reads "Copyright © 2013-2025 Nearform"; the LICENSE copyright line names Formidable Labs, Inc. for 2013-2024, which is the legal name recorded as maintainer. Nearform is a separate legal entity from the recorded maintainer and is not recorded as parent. No hqCountry is stated on any page read. The LICENSE also carries a 2018 copyright line for DefinitelyTyped contributors under the same MIT text; it is one license entry. The basedOn react fact follows the project's own words "React carousel library"; the package's peer dependencies on react (>=18) are not the basis. The npm package nuka-carousel is the one the README install command names. The GitHub repository also holds tags and releases numbered 4.x, 5.x and 6.x and 7.x from earlier lines; the newest stable release, by date and by number, is nuka-carousel@8.2.0. The npm registry shows no deprecation on latest. The docs site lists pnpm add nuka-carousel as well; that is the same npm route and is not a second installMethod. No runtime is recorded: the package is a React component, and its Node.js version is a build requirement.
