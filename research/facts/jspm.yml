notes: >
  The repository is a monorepo (cli, generator, import-map); the install docs name the jspm npm package, so its tags (4.x, the highest 4.7.0 on 2026-10-05) and its weekly figure are recorded, and @jspm/generator tags (2.x) are not. The npm package jspm was first published 2013-04-21 (0.0.1), a month after the repository was created 2013-03-22; firstRelease follows the registry. The FAQ says the Foundation funds the jspm.io CDN; it does not name the Foundation as the owner of the CLI, so the maintainer is the GitHub organization that owns the repository, JSPM (no LICENSE copyright line or package.json author names anyone). The FAQ words the Foundation as "a member-run Canadian not-for-profit corporation" that funds the CDN; it is no maintainer or hqCountry statement for the software. The jspm.io CDN is a hosted service next to the open source tools ("jspm.io is the JSPM CDN provider service"); it is noted here with no prices and not recorded as a field. The deployment section of the getting-started page says the dist files go to a web server, and the CLI page describes jspm build as a RollupJS build into dist. The "Deprecating jspm.dev" blog post concerns a domain, not the software, so it is no end signal. The LICENSE file has no copyright line. The npm figure is the sum of 2026-09-28 to 2026-10-04 (16705). The getting-started page lists the providers jspm.io, nodemodules, esm.sh, unpkg, skypack and jsdelivr, and says jspm.io is still recommended for compatibility. The FAQ calls jspm.io "designed as a highly available production modules CDN" and links a status page. The CLI page says the tool operates on importmap.js, which it creates when it does not exist, and the getting-started page names jspm.io as the default provider; the CLI page also describes install, serve and build.
