notes: >
  No project site exists: the GitHub homepage field is empty and the npm homepage points to the repository, so no homepage is recorded. The maintainer comes from the npm package author field, since the GPL-3.0 license text carries no copyright line. The GitHub releases list runs from v0.3.0 (2016-01-19) to v0.8.0 (2022-10-23), and the first npm version 0.0.6 (2015-03-10) gives firstRelease. The README's global TAFT example still shows version 0.4.11 and is not recorded. The repository was last pushed 2026-09-13, carries no archive flag, and no page states that the project has ended. The README documents the output path as a file or a destination directory given on the command line, with no default, so outputDir is unknown. The package engines field requires Node.js >=10.0.0, recorded as runtimeMin 10. The README describes pages as Handlebars files with YAML front matter, which can name a layout, and output that goes to standard output, one file or a destination directory; the project also has a Node.js API.
