notes: >
  The CSV homepage is plain http; the README names https://gojs.net and the site answers over https, so the https address is recorded. The license wordings are three: the README sentence "GoJS is commercial software, not open-source." and "Non-Commercial Software License Agreement" (free for individuals for non-commercial use such as learning and hobby projects, which the README gives as a separate statement), and the title "Software License Agreement" of license.html, which the npm package names as "SEE LICENSE IN license.html". The commercial agreement and the npm wording describe one license and are one entry in the license field; the non-commercial agreement is a second entry. The licenseModel is commercial because use by an organization requires a purchased license, and the README gives the pricing page for that. No paid edition is recorded: the pricing is for the one product, and the README describes no edition that adds features. The evaluation license is a private trial under evaluationLicense.html and is not recorded as a field. The homepage's Twitter link is the x field; the README badge names the same account in a different case. The company address is 4 Water Street, Nashua, New Hampshire, United States of America, from the contact page; the license names Northwoods Software Corporation, a New Hampshire corporation. The npm weekly figure is the sum of the daily downloads from 2026-11-01 to 2026-11-07; the package named gojs-extensions is a separate package and not counted. The npm registry gives the project's latest version as 4.0.5, the same as the GitHub latest release. The earliest GitHub release object is v1.4.27 from June 2015, and the tag of that version dates from April 2015. The repository holds tags in a scheme with a year-based name, v21.40, which is not a release object and is not used for currentMajor. Rendering target (HTML canvas with SVG and image export, or the SVG DOM), TypeScript typings shipped in the package, the llms.txt primer for AI coding assistants and the samples repository are notes, not fields. The README names the extensions package gojs-extensions and the samples repository GoJS-Samples; neither is recorded as a field. The GitHub repository and the npm package differ: the npm package holds only the library, while the repository holds the samples and documentation.
