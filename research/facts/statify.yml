notes: >
  Status is stub while criterion 3 is in doubt: the README gives only a dependency list and says to run statify.py. Revisit when the project documents an install or deployment step.
  The repository has no homepage and no GitHub release or tag, so lastCommitDate carries the date. The npm package named statify belongs to another project (lnwdr/statify.js, a static file server) and is not recorded. The repository description says "with web interface", but the README lists an online editor only under ToDo, so no web interface fact is recorded. The README names Markdown2 and Jinja2 as dependencies and tells the user to run statify.py after editing config.json; no other installation or deployment page exists, so installMethod is not recorded. The README leaves the output directory unstated. The Jinja2 fact cites the import line of statify.py. Each article or page is a Markdown file whose leading HTML comments set its title, subtitle or author, and config.json holds the site's social links and blog information. The README lists an online editor, multiple themes, and tags and categories under ToDo. No page documents an install step beyond the dependency list and running statify.py, so the candidate may fail criterion 3.
