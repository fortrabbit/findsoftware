notes: >
  The homepage https://hologram.page answers with the project's site and its navigation lists the newsletter; the Discord, forum and Slack channels are named in the README, and the Slack channel on elixir-lang.slack.com has no dictionary field. The README and the homepage describe the client code differently: the README says the Elixir runtime is rebuilt in the browser, the homepage says the client code "is compiled to JavaScript"; both are recorded only as the README's wording for runtime and the architecture page for rendering. The introduction page says Hologram runs on top of Phoenix, which is the basedOn fact; the install guide requires a working Phoenix application. The guide starts the app in development with mix holo, which runs the Phoenix server; no page states a production hosting model, so runsAs is absent. The maintainer is the one mix.exs names. The Hex package reports its all-time downloads as "all" (10551); the 'all' period is the total. The first Hex upload of 0.0.1 is 2021-03-27, earlier than the oldest GitHub release (v0.0.1, 2025-01-22), which gives firstRelease. The Node.js 20 requirement is a build prerequisite of the install guide and is not recorded as runtime. Node and Elixir both appear in the install guide's prerequisites; the rest of the guide is in the docs. The personal X and Bluesky accounts under the README's "Build in Public" heading are the maintainer's, so no x or bluesky field is recorded.
