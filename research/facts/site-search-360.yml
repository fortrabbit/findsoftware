notes: >
  Hosted-service row: criterion 2 is waived, and no repository is recorded because the candidates row names none and no GitHub organization of the service was found. The imprint names Zoovu (Germany) GmbH as responsible for the site, with its headquarters in Dresden and the corporate form GmbH; the terms of service, last modified 2021-04-04, name ZOOVU (Germany) GmbH, formerly Semknox GmbH. The parent of the company is not stated on the pages read, so none is recorded. The pricing page lists plans named Free, Columbo, Holmes Pro, Holmes, Batman Pro and Batman, with indexed-entry and search-volume quotas and per-month prices; no price and no quota is recorded, only the free trial. The pricing page lists no single sign-on, user roles, live preview, import from other software or self-hosted edition; the API is described as a way to index pages by URL, JSON or a CMS, which is not an import from named software. The features page and the FAQ were read and state no SSO, roles or self-hosting. The integrations page lists WordPress, Duda, Magento, Shopware, OXID, Lightspeed, Make and other plugins; the plugins are the vendor's own, and the page is recorded as the plugin directory without a count. The seven comparison pages are the project's own and answer 200; the titles of the Algolia and AddSearch pages name the competitor, and the other five were not title-checked, so their alternativeTo values rest on the page URL. The homepage links a LinkedIn company page; no field exists for it. The status page and the knowledge base were not used for facts. The httpArchiveSites figure is the mobile origin count for the technology named Site Search 360. The homepage does not state a first year; firstRelease is not recorded.
