notes: >
  The homepage the repository names, www.webgui.org, does not answer over https (connection timed out), and its http address redirects to an unrelated page on another domain, so the homepage is not recorded and the site is not linked. The repository is archived on GitHub (archived true, pushed 2019-03-14), and the master branch's newest commit is dated 2014-01-07; the README and docs name no successor, shutdown or new home. A live site, a maintainer statement or a successor repository would settle it. The highest version tag is v8.0.0 (2012-03-11); the repository has no GitHub releases, so latestReleaseDate and currentMajor come from that tag. The CSV row's status discontinued came from the archive flag; the archived repository is an end signal, so the status is discontinued although the homepage is dead. The install instructions in docs/install.txt cover WebGUI 8 and point to a wiki for WebGUI 7; the docs name mysql, Perl 5.12.1 or better and ImageMagick, and ImageMagick is named as a requirement in the install text but not recorded. The legal file names the copyright holder as Plain Black Corporation; no legal form beyond the words "Corporation" and no country was found, so hqCountry is unknown. firstRelease is unknown: the changelog entries carry no dates. renderingModes is not recorded: no page states it. runsAs rests on the install text, which launches the app with plackup and has the reader connect a browser to the URL it advertises.
