notes: >
  The homepage bestaticpy.com and the docs are the project's own site, which states the software is "Bestatic - A simple but really powerful static-site generator". The site footer names "Tatsat Banerjee" as the copyright holder; that is the maintainer recorded, and the GitHub owner is tatsatb. The GitHub API and the PyPI JSON report different licenses: GPL-3.0 from GitHub (README: "licensed under GNU GPL-3.0") and GPL-3.0-or-later on PyPI; both are recorded as license entries. The LICENSE file is the GPL version 3 text. The PyPI package is named Bestatic and its version 0.0.36 matches the highest GitHub release; PyPI reports download figures as -1, so no pypiDownloads is recorded. The oldest of the 14 GitHub releases is 0.0.21 (2024-07-11); PyPI 0.0.1 is from 2024-03-04, which fixes firstRelease at 2024. The README links a separate themes repository (tatsatb/bestatic-themes) and the docs list themes on the project site; no pluginDirectory is recorded because the themes are not a directory of extensions. The deployment guide is at https://www.bestaticpy.com/docs/deployment/. The quickstart says the generated site can be previewed with the bundled server, and the docs state that the _output folder can be deployed to any server or git-based host. The site footer says the docs site is CC-BY-SA 4.0; that licenses the site content and is not recorded as the software license. The README and docs do not name an exact Python version in the docs, so runtimeMin comes from the PyPI requires_python value.
  The README describes the software as installable graphically on Windows, macOS and Linux, on x86_64 and ARM, with native installers, Snap and Flatpak that need no Python, without dependency management, configured with simple YAML files and themed with standard Jinja2 templating. The quickstart creates a bestatic.yaml file and a themes folder, and runs a bundled server for local preview. The docs describe building on GitHub Pages, GitLab Pages, Netlify or Cloudflare Pages in CI, or uploading the _output folder to any server.
