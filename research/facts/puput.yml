notes: >
  The repository has no homepage set; the project's documentation site on Read the Docs is recorded as the homepage, since it is the only website the project names for itself. The docs site shows version 2.1.1 in its page headers while the newest GitHub and PyPI release is 2.2.0; the release date is taken from GitHub. The PyPI JSON endpoint returns no download figures (every period is -1), so pypiDownloads is the last-month count from pypistats.org, a third-party aggregator. The docs name Wagtail >= 5.2 for the Wagtail installation path. No Python minimum is stated on a page or in the PyPI requires_python field, so runtimeMin is absent. The setup page shows only the Django development server command, so runsAs comes from the Dockerfile of the project's own Docker image, docker-puput (linked from the README), whose CMD starts uwsgi. The maintainer is the legal name APSL's privacy policy gives for the data controller; the LICENSE copyright line reads "Marc Tudurí - APSL". The docs and README name Disqus and Django Comments for comments; those are not fields. The earliest PyPI upload is 0.1 on 2015-09-09, the same year as the first GitHub release.
