notes: >
  The GitHub API reports the license as NOASSERTION, so the two statements are taken from the LICENSE file (GPL version 2 with an OpenSSL exception for Wt, the C++ sibling) and the download page (GPL or Commercial License). The LICENSE file names Wt, the C++ framework of the same vendor, and the download page lists Wt 4.14.4 beside JWt 4.14.4; no page states that JWt is built on Wt, so basedOn is not recorded. The homepage in the CSV is plain http; the https address answers 200 and is recorded. The install instructions in the README are a local build with make or ant and a local Maven install of the built jars, so no Maven Central coordinate is recorded: the Central artifact eu.webtoolkit:jwt has a latest version of 3.2.0, which is older than the 4.14.4 the README installs. The README names a Servlet 3.0, 4.0 or 6.1 container but gives no Java version, so runtimeMin is not recorded. The download page sells a commercial license for one developer, recorded as a license statement, not a paid edition. The documentation page links a Redmine for forums, issues and wiki over plain http; the same boards answer over https at redmine.emweb.be, which is the forum value. The oldest Maven Central upload of eu.webtoolkit:jwt is 3.1.11 from 2011, older than the oldest GitHub release. The GitHub language breakdown lists JavaScript, but the README and the site describe a Java library, so only Java is recorded. The features page lists OAuth provider support and OpenID Connect in the authentication framework. The office address on the contact page is in Herent, Belgium; it is recorded as the company's country.
