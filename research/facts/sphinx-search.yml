notes: >
  The GitHub repository holds the 2.x sources only: its releases stop at 2.3.2-beta and its default branch was last pushed on 2023-12-19. Its license is GPL-2.0 from the GitHub API, which describes the 2.x sources, so it is in notes rather than in the license facts. The Sphinx about page says "it's licensed under GPLv2", which conflicts with the 3.x statements, so the reviewer decides licenseModel and whether the record stays under criterion 2. Since 3.0 the project does not publish source under an open license, and the sources are said to be available to commercial clients only; no sourcePublic fact is recorded for 3.x. Installable criterion 2 holds through the prebuilt Linux, macOS, Windows and FreeBSD binaries on the downloads page. currentMajor is 3 from the project's own downloads page, not the GitHub releases (2.x), because the project ships 3.x outside GitHub. Sphinx 3.x docs list the database drivers for MySQL, PostgreSQL and ODBC as data sources of the indexer, so databases are read as sources, not as the store; the index is held in files. The Sphinx 3 docs give the searchd server as a daemon, which is the always-on process. The company is Sphinx Technologies Inc., a company the about page calls "tiny, private US-based" and led by the author Andrew Aksyonoff; the docs copyright names Andrew Aksyonoff as author, not maintainer. The name "Sphinx" also belongs to the Python documentation generator, which is research id sphinx.
