notes: >
  Doubt: RxJS is a general-purpose utility library that is not specific to the web, like lodash and ramda, so whether it counts as a web helper is a scope call that the dev-libs boundary rulings leave to a decision; the status stays stub until that call is made. The README says RxJS 7 remains the production latest line and continues to be maintained, which is no maintenance-mode or end statement, so the record is not discontinued. The sources contradict each other on the prerelease: the README says the planned 9.0.0-beta.0 has not been published to npm and that the next tag still points to an RxJS 8 prerelease, while the npm registry lists 9.0.0-beta.0 published 2026-08-04 and 9.0.0-beta.1 published 2026-10-09, with the next tag on 9.0.0-beta.1. The install routes come from the README of the 7.x branch, the production line the README names; the master README documents only the unreleased RxJS 9 work, whose beta install line and supported environments are not recorded. The homepage https://rxjs.dev answers with a client-rendered docs shell whose raw HTML holds no readable text, so the page is unreadable and the homepage fact comes from the npm homepage field. The npm package carries a 1.0.10621 upload dated 2012-03-04 whose metadata names no repository, so it is not counted in firstRelease; the first GitHub tag 0.0.0-prealpha.1 is dated 2015-09-02 and the repository was created in March 2015. The README's package table names the subpackages @rxjs/observable-polyfill, @rxjs/test and @rxjs/migrate, which are no separate candidates here. The stars and contributors belong to the monorepo that holds the rxjs package and its siblings. The npm figure is the sum of daily downloads for the rxjs package named by the install line, whose registry metadata lists 7.8.2 as the latest version.
