notes: >
  Boundary ruling: an HTTP client is accepted (the Faraday, Got and HTTParty ruling), so the CSV boundary state is not a record status. The README says "HTTPX requires Python 3.9+", but the pyproject at the latest release tag says requires-python ">=3.8" and PyPI repeats that for 0.28.1; runtimeMin follows the manifest, and a reviewer should decide whether the README line should win. The LICENSE.md copyright line names Encode OSS Ltd. The Encode website says "Encode OSS is a UK limited company, trading since 2016", which names the country for the recorded maintainer, so hqCountry is GB. The latest stable release is 0.28.1 on GitHub and PyPI (December 2024). PyPI lists 1.0 development releases; the newest upload, 1.0.dev6 on 2026-08-31, sets latestPrereleaseDate. The GitHub tags also include a 1.0.0.beta0 tag whose date was not checked, so the PyPI date stands. The README says HTTPX is a "broadly requests-compatible API" and that its API layout follows requests, with credit to urllib3 for networking design; the project does not say it is based on requests, so basedOn stays out. The README lists HTTP/2, sync and async APIs, WSGI and ASGI transports, an integrated command-line client (httpx[cli]) and an optional socks extra; these are coined kinds kept in notes. The PyPI figure is the pypistats last-week count for the httpx package; the PyPI JSON gives the date of the first upload, 0.6.7 in 2019, and the first GitHub tag, 0.0.1, is from 2019 as well. Stars and contributors are for the repository.
