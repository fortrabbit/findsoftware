notes: >
  The http address answers with a 301 to https://handlebarsjs.com/, so the https address is the homepage. The GitHub releases run from 4.7.8 (2023-08-01) to 4.7.10 (2026-10-05); the newest stable release is 4.7.10, and the npm dist-tag legacy points to 3.0.8, which is not the current line. The oldest tag, 0.9.0.pre.4, has a commit date of 2011-02-12, and the npm upload of the package was 2011-08-22, so firstRelease is 2011. The LICENSE names Yehuda Katz for 2011 to 2019; the homepage footer gives Yehuda Katz for 2011 to 2026, and the handlebars-lang GitHub organization holds the repository. The runtime node comes from the README list of supported environments (Node.js, Chrome, Firefox, Safari, Edge) and the browser use on the installation page ("compile your templates in the browser"); the record has no runsAs because the library names both, and the precompiler needs Node.js and npm per the precompilation page. The runtimeMin is the engines floor in the package manifest at the 4.7.10 tag. The installation page names npm and yarn in one sentence, so they are one npm installMethod; it also offers downloads for the browser, which the page says are not meant for production use. The README says Handlebars is largely compatible with Mustache; Mustache has no record in research/facts, so the relationship sits here and no alternativeTo or basedOn is set. The installation page sentence on free CDNs is the CDN installMethod. The integrations page lists third-party bundler plugins, which are not recorded as a plugin directory. The templating field is not set because Handlebars is the template language itself, not a templating engine used by another software. The when-to-use page calls Handlebars a pure rendering engine with no built-in support for event handling, accessing backend services or incremental DOM updates, and the installation page recommends a build tool such as Webpack, Browserify or Parcel for browser use. The downloadable browser builds are, per the installation page, not meant for production use. The homepage says Handlebars compiles templates into JavaScript functions, and the README and installation page describe the Handlebars.compile call that returns a function taking the data. The precompilation page says precompiling templates reduces the client's required runtime size, and its example loads the runtime file with the precompiled template.
