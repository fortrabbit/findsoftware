notes: >
  No page states whether the source is published, so sourcePublic is left out. The product's pages name no source repository, so no repository fact is recorded. A GitHub repository fastpanel/core (description "The main core of the \"fastPanel\" system", MIT, last push 2019-12-27) exists, but no page of the project links it, so it is not taken as the project's source; the reviewer decides whether it is the same product. The license agreement names the licensor as "PAGM OU" and the footer as "P.A.G.M. OU"; the footer form is recorded. The footer's "Proudly made in Estonia" names no headquarters address, so hqCountry is left out. The licence agreement has a Standard License that is free and an Extended License with a fee, and the Extended License is recorded as paidEdition; the agreement also states that a paid ticket is included with an Extended License, which is support, not an edition. The pricing URL returns the site's 404 page, so pricingPage is left out. The changelog gives the release 1.11.87 under two dates, 2026-10-24 and 2025-12-25, so the 2026-10-24 entry is recorded as the latest. The earliest changelog entry is 2017-11-23, which is recorded as firstRelease. No page read says the panel runs as a daemon or service, so runsAs is left out. The homepage lists the Debian, Ubuntu, CentOS, AlmaLinux and Rocky Linux releases it supports, and the minimum 1 GB RAM and 5 GB disk; those are recorded in no field. The homepage also lists providers that offer it (DigitalOcean, Vultr, kodu.cloud, TIME4VPS). Trustpilot ratings are not recorded. Other reported figure: "more than 100K happy customers" on the homepage is a second adoption statement and is not recorded.
