notes: >
  Criterion 1 holds on the project's own docs: Embedding.md says a public share link converted to an embeddable link is placed in an iframe on an external website, and the Forms Public API (docs/API_v3.md, openapi.json) is described for custom forms, and info.xml (description, inside a CDATA block the quote check cannot read) calls it a REST-API for integrating Forms into a service, so headlessApi is not recorded. Webhook support is named in the README and points to the Nextcloud server admin guide for the Forms events; it is recorded in notes only. basedOn nextcloud is kept out of the fields (no fact file nextcloud.yml exists; the Nextcloud server is the host the app installs into): the README says to clone the app into the apps folder of a Nextcloud, and the project does not use the word "based on"; research/facts/nextcloud.yml does not exist, so the Nextcloud dependency (info.xml nextcloud min-version 33, max-version 35) is in notes. The homepage is the GitHub repository (info.xml website and the store "Homepage" link point there), so no homepage is recorded; the Nextcloud app store page (apps.nextcloud.com/apps/forms) is a listing, not the project's own site. Release tarballs are published on GitHub releases (forms-vX.tar.gz) and the app store lists them by Nextcloud version; the store's community rating is not recorded. The store lists Tim Sattizahn as owner and several co-maintainers; the copyright line and the impressum name Nextcloud GmbH, so that is the maintainer. The license is stated two ways: the README's header comment (an HTML comment, not checkable as page text) says AGPL-3.0-only, while info.xml and the REUSE.toml say AGPL-3.0-or-later; the or-later wording is recorded and is the latest release's licence element. The GitHub API reports AGPL-3.0 from the LICENSE file, the same license text. The Forms app is not the Nextcloud server; its runtime is PHP on the Nextcloud server, from composer.json at v5.4.1. Coined kinds in notes: embedMethod (iframe from an embeddable share link, window message events for resizing and form-saved), webhooks (Nextcloud server webhook listeners for Forms events), apiStyles (OCS endpoints of the Nextcloud server, JSON or XML formatting, OpenAPI at openapi.json), exports (results as CSV in the Google Forms format). The app runs on the Nextcloud server's own database and storage; no database engine is named by the app's pages. The adminUi field is left out because the app's admin interface is not described on the pages read beyond the app itself.
