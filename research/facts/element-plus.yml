notes: >
  The README calls the project "A Vue.js 3 UI library" and lists "Vue 3 Composition API" among its features; the Vue dependency is recorded as basedOn. The maintainer is the project name as its LICENSE file states it, with no legal entity named on any page read; maintainerType is left to the import, since the project names itself and no page gives a company or foundation. The install guide says "Since Vue 3 no longer supports IE11, Element Plus does not support IE either." successorOf Element UI rests on the README's breaking-change list and migration tool, which describe the upgrade from Element UI; the project does not call itself a successor, so the reviewer should decide whether this belongs in successorOf or alternativeTo. firstRelease is the oldest GitHub release (v1.0.1-beta.14, 2020-12-23), and the repository was created 2020-07-21; the npm package element-plus has an earlier creation date (2019-06-12) and is not used for firstRelease. The GitHub API reports the default branch as dev; the LICENSE link is taken from the README's own link to master. The npm package reports no deprecation on the latest version. The install page offers a CDN tab (unpkg and jsDelivr); the cdn installMethod uses the unpkg example. contributors counts contributor accounts from the API list with per_page=1, read from the Link header. Element Plus is not in the HTTP Archive technologies list, so httpArchiveSites is absent.
