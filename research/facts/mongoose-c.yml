notes: >
  Two license statements: the LICENSE file gives GPL version 2 (no "or later" wording, so GPL-2.0-only), and the licensing page gives GPLv2 plus evaluation and commercial terms. The GitHub API reports NOASSERTION. The licensing page says the commercial license "removes all GPLv2 restrictions" and offers support and maintenance; it names no features the GPL edition lacks, so no paidEdition is recorded. Runtime: the library is compiled into device firmware and the pages name no host runtime, so runtime is left out. firstRelease: the README says the library has been on the market since 2004, which is the project's own start year. Criterion 1: the homepage lists device web dashboards, embedded HTTP server and firmware OTA; accepted as an embedded web server library. Forum: the homepage links the repository's GitHub Discussions. LinkedIn and YouTube links on the homepage are not fields. Fields coined: none. The licensing page says commercial projects can also use GPLv2 by releasing the end product source under it. The homepage names device web dashboards and firmware updates as uses.
