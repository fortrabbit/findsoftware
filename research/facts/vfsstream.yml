notes: >
  Stub: the homepage in composer.json, http://vfs.bovigo.org/, has no DNS record (no answer from the host, http or https), and the repository names no other site, so the project's own site cannot be read; the code and the wiki (Install, Requirements, Home) are public and still describe the library. A live project site or a named new home would settle it. The composer.json homepage is recorded in notes only. Registry: the Packagist package is mikey179/vfsstream (composer.json name), not vfsstream/vfsstream, which returns 404. The Packagist total is the downloads.total figure of that package. Releases: the GitHub release list starts at v1.4.0 (2014-09-14), but the oldest tag is RELEASE-0.3.0, whose commit is dated 2008-01-02, so firstRelease is 2008; the repository itself was created 2011-05-19. Latest stable release v1.6.12 is dated 2024-08-29, and the master branch carries a 2.0.x dev alias (composer.json extra branch-alias), which is not a stable release. The wiki Requirements page still says PHP >= 5.3, while the v1.6.12 composer.json requires php >= 7.1.0, so runtimeMin follows the tag. The wiki Home page lists the namespace change at 1.0.0 (org\bovigo\vfs) and the examples repository vfs-stream-examples; neither is recorded. The Requirements page also says that on Linux based systems Posix is required and that some distributions disable it by default. The maintainer follows the LICENSE copyright line; the composer.json author is the same person, and the repository owner is the bovigo organization.
