notes: >
  The project names no homepage: the repository's GitHub homepage field points to the repository itself, so homepage is absent. The domain blogr.dev serves an AI blog-post writing page that does not name this project; it is not recorded. The maintainer is the copyright holder named in LICENSE; Cargo.toml authors gives the GitHub login bahdotsh. The crate on crates.io is blogr-cli (the name blogr is not on crates.io), described there as "A CLI static site generator for blogs". The crate download figure is the crates.io total (downloads), not a recent period. The major is 0 because the highest stable release is v0.5.1; the workspace version matches. The README lists a newsletter system with IMAP, SMTP and a REST API as an optional part, documented in docs/NEWSLETTER.md; no runtime for that part is stated, so runsAs records only what the command pages state. The contributor count is taken from the per_page=1 Link header, last page 6. The docs folder pages COMMANDS.md and CONFIGURATION.md were read; the deployment step uses GitHub Actions workflow files generated by blogr init.
