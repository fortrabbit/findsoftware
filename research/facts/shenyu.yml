notes: >
  Status accepted: the repository is not archived; the latest stable GitHub release is v2.7.1 (2026-07-08), major 2. The tag v2.7.2 (commit 2026-10-27) and two release-candidate tags (v2.7.2-rc20261028, v2.7.2-rc20261029) exist without GitHub releases; the newest rc tag is recorded as latestPrereleaseDate. The Apache download page (https://shenyu.apache.org/download/, read 2026-10-30) lists 2.7.1 as the latest release, so v2.7.2 is not recorded as stable. firstRelease 2019 is the oldest tag, 1.0.2 (commit 2019-01-17); the first GitHub release is 2.2.1 (2020-09-20), and the repository was created in 2018. The site names no founding year. Maintainer: the homepage footer and the NOTICE file name The Apache Software Foundation; a foundation is no project HQ, so hqCountry is absent. The homepage links the dev mailing list, which is not a forum, so no forum field is recorded. Runtime: the pom at v2.7.1 sets java.version 17, and the deployment guide says "Install JDK17+ locally". runsAs is not recorded: the quick start runs the bootstrap with start.sh and the docker guide runs it with docker run -d, but no page calls it a server, daemon or service, so runsAs stays out. databases: the docker guide names MySQL, PostgreSQL and Oracle for the admin console's own data store, so they describe shenyu-admin, not the gateway. dockerPulls counts apache/shenyu-bootstrap, the gateway image the docker guide names; apache/shenyu-admin has 449931 pulls (not recorded). Community: the homepage names the dev mailing list (lists.apache.org) and GitHub only. The README marks some plugins as deprecated (Hystrix, Apollo); those are plugin notices, not an end of the project, so the status is unchanged. The plugin center in the docs is documentation, not a plugin directory. Fields coined: none.
