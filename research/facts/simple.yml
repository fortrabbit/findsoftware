notes: >
  The repository has no GitHub releases and no tags, so no release date, major version or release history is recorded. The npm package named simple is a different project (thisandagain/simple, "A naive Node.js clone of Python's simpleHttpServer", version 0.2.0 from 2013-10-17); the CSV's lastRelease of 2013 comes from that package and should be reviewed, since it does not describe this software. The LICENSE.md file names isnowfy in its copyright line, which is the maintainer recorded. The README documents two ways to use it: the hosted editor on the project's GitHub Pages site, which asks for a GitHub username and password, and cloning the project and pushing the src folder to a gh-pages branch; whether the hosted editor still signs in was not tested. Criterion 3 rests on the second way. The install steps are the README's usage section, which runs through the project's hosted editor and GitHub Pages; the source is public and the README's custom-theme section describes cloning it. The README's todo list names search, sitemap and RSS as unbuilt. The homepage is the project's own demo and editor, live at the time of the check. The README says the editor saves a post by generating its static page, that templates live in the template folder of the source, and that a custom theme is made by cloning the project and pushing the src folder to a gh-pages branch. The README lists "no backend need" among its features.
