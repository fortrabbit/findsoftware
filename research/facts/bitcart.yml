notes: >
  The homepage calls Bitcart "a self-hosted, open-source cryptocurrency all-in-one solution" and says it is "not a company"; the maintainer is the copyright holder of the MIT LICENSE, and maintainerType is community on the project's own statement. Integration routes named on the pages: the Merchants API, where "To create an invoice, just send a POST request to /invoices" (custom integration page), with a notification_url and redirect_url in the example; the admin panel's checkout modal, a script a website loads from the admin host; and the Python SDK (repository bitcart/bitcart-sdk, a library for coin daemons, not recorded here). The integration pages for Shopify, WooCommerce, WHMCS, FOSSBilling and Odoo are separate pages of the project and are not recorded. Redis serves cache and inter-process communication per the architecture page. The docs' manual deployment page says "Install python3 (3.11+)", while pyproject.toml at 0.11.0.1 says requires-python >=3.12; runtimeMin follows the manifest. The PyPI package named bitcart describes itself as a coins support library and is not the core, so no pypi figure is recorded. The categories value cryptocurrency maps to nothing in the import. The homepage's Telegram, Matrix, Reddit (recorded), LinkedIn and Discord links cover the community; Telegram, Matrix and LinkedIn have no field. The docs site header links the project's X account (twitter.com/BitcartCC); the homepage does not. The docs' Bitcart vs others page names no competing product as an alternative.The first GitHub release is the 0.0.1a prerelease of 2019-09-06; the first stable release is 0.0.0.1 of 2020-10-16. Stars and contributors are from 2026-10-31. The architecture page says Bitcart Core, the daemons for each currency, is the only required component and that each daemon wraps the Electrum wallet; the Merchants API adds PostgreSQL, Redis and a background worker that opens a websocket connection to the daemon of each enabled currency; the admin panel and the ready store (POS) are optional UIs that depend on the Merchants API. The custom integration page describes the Python SDK as a library that simplifies using the core daemons, and says the daemon follows JSON-RPC 2.0.
