notes: >
  The GitLab project framagit.org/zoggy/stog is the source; the GitHub-style star field is not used and the GitLab star count (2, same API call) is not recorded as a field. The project's tags start at 0.1 (2012-06-19); the first release is recorded from that tag. The latest stable tag is 1.1.0; the tag's commit date is 2024-12-18 and the homepage announces the release as December 12, 2024. The project publishes no GitLab releases, so the tag list is the release record. The homepage describes the program as "Static blog and web site generator" in its own site settings and as "like Jekyll but in OCaml" in the README; the Jekyll comparison is not recorded as basedOn because the project names no parent. Two license statements: the homepage says GPL v3 for the program and public domain for the templates and share directories; the LICENSE file is the GPL 3 text, with no "or later" clause on the page, so the SPDX id is recorded as GPL-3.0. The LICENSE file carries no copyright line; the maintainer is the copyright holder named in the header file of the repository ("Copyright (C) 2012-2024 INRIA", "Author: Maxence Guesdon, INRIA Saclay"), while dune-project lists the maintainer contact as zoggy@bat8.org. Install is through the opam package stog (opam install stog); no opam registry field exists in the fact list, so the package name is not recorded as a field. The runtime is a compiled OCaml program; the install page asks for OCaml 5.1.0 and the changelog for 1.0.0 states the upgrade to OCaml 5.0.0, which is not recorded as runtimeMin because no page states it as the minimum for 1.1.0. The preview server (stog-server) runs on a developer machine and is not a live runtime. Plugins are published as stog_plugins on opam; the plugins page was not counted.
