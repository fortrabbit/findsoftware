notes: >
  The homepage is served over https; the CSV row names the http address, which redirects to https://graphene-python.org/. The homepage still shows "Download 2.1" in its header; no version is recorded from it, the release comes from the GitHub API (v3.4.3, 2024-11-09). The LICENSE file reads "The MIT License (MIT)" with copyright 2015-Present Syrus Akbary and the GitHub API reports MIT; one license entry is recorded. The install route is the README's pip command; no sentence names pip, so the quote is the command. The README lists the integrations Graphene-SQLAlchemy, Graphene-Mongo, Graphene-Federation and Graphene-Django, and the homepage lists Graphene-GAE; those are separate projects and get their own records, not parts of this one. The docs quickstart compares the code-first approach with schema-first Apollo Server and Ariadne; that comparison is not an alternativeTo statement and is not recorded. The setup.py classifiers list Python 3.8 to 3.13 and PyPI reports no requires_python; neither is a stated minimum, so runtimeMin is left out. The docs quickstart's "Python (3.6, 3.7 ...)" requirement line is older than the current release and is not recorded. The stars and contributors are counted on the repository, which holds the library alone. The PyPI figure is the package the README installs, last month per pypistats.org.
