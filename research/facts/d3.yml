notes: >
  The latest GitHub release and the npm latest are both 7.9.0 from March 2024; no later release or prerelease is listed, so the release is older than 24 months and criterion 4 is not met on the dates of this check. The candidate row says accepted: the candidate needs a decision. The homepage names Mike Bostock and Observable, Inc. in the copyright line; the company is recorded as maintainer and Bostock is not recorded separately. GitHub's language detection reports Shell for the repository because of its build scripts; language is JavaScript from the npm package entry point (src/index.js) and the repository's source. The GitHub organization D3 lists San Francisco, CA as its location, which is not recorded as hqCountry because it is the organization's location, not a stated company headquarters. runtimeMin is the engines field of the latest npm release.
