notes: >
  The LICENSE copyright line gives AJ Meireles as the maintainer, and the docs call that person the creator of TallStackUI; the GitHub owner is the tallstackui organization. The site says it has no Pro tier and is free and open source; that is not recorded as a paidEdition fact, because the site states no paid edition and a sponsorship link is not an edition. The Packagist monthly figure at the same date is 20705; the total 237028 is the recorded figure. Packagist's package name is the composer install name, so the registry id is tallstackui/tallstackui. The repository's default branch is 4.x; the latest release v4.7.1 is on the 4.x line. firstRelease is the year of the oldest GitHub release, v0.1.0, a prerelease of 2023-10-07. The docs list a starter kit for Laravel 13 with Livewire 4 and TailwindCSS 4 as an option; it is not recorded. The docs say the components can be used outside Livewire (the Without Livewire page). The page lists KeyValue, Loading, Reaction, Signature and Upload as components that cannot be used outside a Livewire component. The Livewire basedOn statement names the framework the components are designed for, not a requirement to run them. Requirements list Laravel 10 or later, Livewire 4 or later, AlpineJS 3 or later and TailwindCSS 4 or later; the Laravel minimum is not recorded as runtimeMin. The basedOn entries for Laravel, Alpine.js and Tailwind CSS come from the homepage sentence naming them, and the record ids are livewire, laravel, alpine and tailwindcss. The Without Livewire page says Livewire's script still has to be on the page, since that is where AlpineJS comes from. A dependent count on Packagist is 0 packages and 1 repository. The docs describe translation as customizing internal texts through translation files published into the application, so i18n is recorded as yes.
