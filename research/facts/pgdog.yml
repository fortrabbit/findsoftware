notes: >
  The homepage reads "v0.4 latest" while the newest GitHub release is v0.1.62 (2026-10-16), and the docs say releases are weekly; currentMajor 0 and latestReleaseDate follow the GitHub release, and the homepage version is not recorded. The license is AGPL-3.0, from the LICENSE file at the latest release; the homepage says "Apache-2 license", which the LICENSE file and the docs "About this project" page contradict, so that line is not recorded as a license entry. The Enterprise page ("PgDog for Enterprise") names a control plane (with SSO), insights and SLA-backed support as the features of that tier; no price or license text for that tier was found. The homepage links GitHub and Discord in its footer; the Discord quote is the link text. The docs name ghcr.io as the image registry, not Docker Hub, so no Docker Hub pull count is recorded. No hqCountry: the Terms and the privacy policy name PgDog, Inc. with no address or country in the pages read. The first release is v0.1.0 (2025-09-02); the repository was created 2024-12-27. The project's docs describe it as a connection pooler, a load balancer and a sharder; the database-category value follows the import map (db-proxy), and load-balancer is not used because the import map files it under web-server.
