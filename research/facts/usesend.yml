notes: >
  The project is in beta per its README ("We are currently in beta!"), recorded here and not as a status. The About text says useSend uses Amazon SES under the hood, and the self-hosting guide requires AWS SES and SNS: the vendor's own pages name a third-party sending service the self-hosted install needs, so it is in the notes, not as a field. The Railway page calls useSend a Railway Partner; the Railway deploy route is recorded as an install method and no hosting statement follows from it. The free tier on the pricing page (Free plan, 3000 emails a month) is a hosted plan, recorded as no field; the freeTier kind is coined here and not recorded. The README and the docs name a REST API, a webhook guide and an SMTP proxy image (usesend/smtp-proxy); apiStyles, webhooks and smtpRelay are coined kinds and go here, not in a field. The docs intro names Resend, Sendgrid, Mailgun and Postmark, all with fact files, so all four are in alternativeTo. Self-hosted login uses a GitHub app (the guide says useSend uses GitHub authentication for login), recorded here and not as sso; the guide asks for contributions to add email and password login. The docs changelog is headed "Product updates and announcements from Unsend". The LinkedIn link on the homepage is a coined kind (linkedin) and is not recorded as a field. The self-hosting guide says stored email content stays in the database unless EMAIL_CLEANUP_DAYS is set, and image uploads go to S3-compatible storage (RustFS in the compose file). The Docker pull figure is the usesend/usesend Docker Hub repository named by the README and the Docker docs. The JavaScript SDK packages (usesend-js) are client libraries and their figures are not recorded. A process model for the container is not stated on the pages read (the run example maps port 3000 only), so runsAs is not recorded. The LICENSE file copyright line names only the Free Software Foundation, so the maintainer is the GitHub organization that names itself useSend.
