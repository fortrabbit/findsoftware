notes: >
  The repository is public source under AGPL-3.0 with the FOSS License Exception (README and license.txt), and a commercial ServiceStack License Agreement covers other use (terms, pricing); both are recorded as their own license statements. The free licenses on servicestack.net/free are conditional on eligibility, so freeTier quotes the pricing page instead. The registry figure is NuGet package ServiceStack, the core package of the create-net scaffolder named in the install docs. currentMajor is 10 from the highest stable GitHub release (v10.4.2); firstRelease is absent: the oldest GitHub release is a v3-snapshot dated 2013-09-12, a snapshot rather than a first release, and the release notes page lists older v3 notes under "2013 and prior" without a year. The databases quote is from the homepage post on vector search in OrmLite, ServiceStack's data access library, which names the five databases. Renders: renderingModes is not stated by a page, so it is left out; runtimeMin is not stated as a minimum (the getting-started page says it scaffolds a .NET 10 project). The docs state Kamal and Docker deployment as well as the rsync and supervisor path, both on Linux hosts. The homepage pricing and features list no SSO, i18n, multisite or live preview, so those fields are absent.
