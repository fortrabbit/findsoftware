unreadable:
  - "https://tenseijs.com (answers only with a browser User-Agent; the page is a redirect into a domain-parking router)"
  - "https://tenseijs.com/docs/getting-started (the guides on the same parked domain; read from the docs source repository instead)"
notes: >
  Stub without homepage: https://tenseijs.com accepts TLS but returns an empty reply to a research User-Agent, and with a browser User-Agent it returns a JavaScript page that redirects to a domain-parking router. Under AGENTS.md the project's own site no longer shows the software, so the record is stub. The guides the README links are on the same domain, so they are read from the documentation source repository tenseijs/tenseijs.com, which CONTRIBUTING.md names as the documentation repo; its getting-started and database-setup pages are the install and database sources, and its pushed date matches the newest tag, so the pages describe that release. The README has no install steps and no social links; the install steps come from the getting-started page and from the create-tensei-app package's own help text (npm init tensei-app). The repository has no GitHub releases: latestReleaseDate is the commit of the newest tag v0.11.5, and currentMajor is 0 from the npm latest version, as the rule for a repository without releases says. The newest tag is more than four years old, so the import moves the record to stub on its own as well. The registry figures are for @tensei/core, the core package; create-tensei-app is the scaffolder the install docs name, so it is not used. The npm week is 2026-10-12 to 2026-10-18. firstRelease is the year of the oldest tag, v0.0.1-alpha.0. The license is MIT on the GitHub API and in LICENCE.md; the copyright line names Kati Frantz-Vallie and the README names Kati Frantz. The getting-started page names MikroORM as the database layer and each database needs its own @mikro-orm driver package (database-setup page); MikroORM is a library the project uses, not a parent project, so basedOn is not recorded. The README's CI badges name MySQL, MongoDB, PostgreSQL and SQLite workflows; the database list comes from the docs, not the badges. The packages named rest and graphql exist in the repository, but the API style comes from the docs. The social login named in the docs is not SSO, so sso is not recorded. The repository is not archived and npm shows no deprecation.
