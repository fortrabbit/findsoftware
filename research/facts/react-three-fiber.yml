notes: >
  Status: no end statement found. The repository was last pushed on 2026-10-21, and the newest stable release is v9.8.2 (2026-10-15), matching npm latest @react-three/fiber 9.8.2 (npm publish 2026-10-14; the newer GitHub release date is recorded). The v10.0.0-alpha.6 prerelease (2026-10-17) is newer than the latest release and is recorded as latestPrereleaseDate. The unscoped react-three-fiber npm package is deprecated with the message "react-three-fiber has been deprecated, please use @react-three/fiber from now on"; that names the same project's new package, so it is a move and the status stays accepted. The registry figures are for @react-three/fiber, the package the install docs name; the unscoped package's last release is 6.0.13 (2021-04-11) and its figures are not recorded. The repository root package is named react-three-fiber--root and the repository holds several packages, so stars, contributors and dependent counts reflect the monorepo's work, not one package. The README says the renderer is for threejs and that everything that works in three.js works through it; three.js has a candidate row (threejs) without a fact file, so it is noted here and not recorded as basedOn until that record exists. The README says @react-three/fiber major versions pair with the same React major (v8 with React 18, v9 with React 19), and the install page says it is compatible with React 18 and 19 and works with ReactDOM and React Native; no runtime field covers that. The homepage address in the candidate row redirects to https://r3f.docs.pmnd.rs/, which is recorded. The LICENSE copyright line names Poimandres, the organization behind the pmndrs repositories; no legal form or person is named, so no maintainerType is recorded. The README badges link the Discord and the Twitter account of the pmndrs organization.
