notes: >
  The project is released on GitHub and npm and installs by npm or by copying the dist files. The README says the library is "forked from Tilt.js (jQuery version)", naming the jQuery project at https://github.com/gijsroge/tilt.js; no record for that project exists in research/facts, so no forkOf is written. The landing page is a plain HTML page that answers 200 over https with the title "Vanilla-tilt.js". The maintainer follows the LICENSE copyright line; the npm author field spells the same person "Sergiu Șandor". The last release is 1.8.1 (2023-08-15); the repository's last push was 2024-03-01 and the repository is not archived. The README says the library works with IE after a CustomEvent polyfill and lists Safari rendering issues as known issues; neither is a runsAs statement, so runsAs is not recorded. The npm figure is the vanilla-tilt package the install section names.
