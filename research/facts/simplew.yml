notes: >
  The homepage simplew.net answers over https and is the project's own site. The repository is the source of record and the GitHub release list is the version source: the highest stable release is v26.1.1 (2026-09-26); the 2026 rc and beta tags are prereleases and are not recorded as latestPrereleaseDate because they are older than the latest release. Firstrelease comes from the changelog heading "v1.0.12 / (2021-11-10)" labelled "Initial stable release". The initial stable release is v1.0.12. Stars and contributors are read from the GitHub API on 2026-10-26; the contributor count is the page count of the paginated endpoint. NuGet figures are the package named in the install docs, taken from the search endpoint (totalDownloads, all versions). The guide and homepage say the project has "no dependency" and that it is not built on ASP.NET Core; no basedOn is recorded because no page names a parent project. The "what-is-simplew" page names NetCoreServer, Fast-Endpoints, GenHTTP, Ioxide and EmbedIO as other .NET web servers and frameworks; these are not alternativeTo statements and are not recorded. The docs also describe a TLS addon, a Let's Encrypt addon and other template addons; the Razor and OpenID addons are the source of templating, renderingModes and sso, and the other addons are not recorded. The repository's changelog.md is the source of the firstRelease quote and is cited as a page.
