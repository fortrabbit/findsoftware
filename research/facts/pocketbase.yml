notes: >
  PocketBase is pre-1.0 (v0.40.5), so currentMajor is recorded as 0. The docs say it can be used as a Go framework and as a standalone application; the Go framework install is recorded as go-framework, with no version detail. The homepage lists a JavaScript SDK and a Dart SDK on the docs page; these are client libraries and are not separate records. The docs say "Realtime" and "Authentication" are built in, and the page names file storage and backups (Settings > Backups in the dashboard). The Gani Georgiev name comes from the LICENSE copyright line and the docs footer; the pages name no company. Fields coined here: none.
