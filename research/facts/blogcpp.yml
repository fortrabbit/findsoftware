notes: >
  The GitHub mirror named in the CSV answers 404, so the Fossil repository at code.rosaelefanten.org is the only source. The Fossil file and tag pages answer with a "Checking to see if you are a robot" challenge; the README and LICENSE are read from their doc/trunk paths, which answer normally. The README is the project's own page and the Fossil repository's front page, so no homepage is recorded: the project has no site apart from its repository, and the repository is the repository field. The README's end statement is titled "!!! DISCONTINUED !!!" and says the author will not continue the project, which is the clear signal under AGENTS.md, so the status is discontinued. The README says "The latest released version is version 9", which is recorded as currentMajor; the tag list that would give its date is behind the bot check, so latestReleaseDate is unknown and no firstRelease is recorded. The README gives the site layout: a templates folder, a folder for posts and one for pages, and an output folder, with default names, and the blogcpp binary must sit in the site root. The README's end statement invites someone to contact the author about continuing the project, and names no successor. The Fossil timeline (readable) shows the last check-in on 2024-12-17; whether the repository holds tags is unverified, so lastCommitDate is not recorded. The LICENSE copyright line names Cthulhux with an e-mail address; only the name is recorded, and the timeline lists the same user. The README lists inja among its third-party libraries without saying what it is used for, so templating is not recorded. The README describes plug-ins as JavaScript scripts and lists external commenting integrations (Disqus, Discourse, Commento, Hyvor Talk); these are not recorded as fields. The Fossil project has no star or contributor counts.
