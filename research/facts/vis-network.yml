notes: >
  Dual license: GitHub reports Apache-2.0 and the README says "Vis.js is dual licensed under both" the Apache 2.0 and MIT licenses, so both are recorded. The LICENSE-MIT copyright line names Almende B.V. for 2014-2017 and the README names Vis.js contributors for 2018 onward; the maintainer follows the README line, and Almende B.V. is not recorded as a parent because no page states it owns the project. firstRelease is 2019 from the oldest GitHub release (v5.0.0); the tag list also holds 4.x tags that the releases API does not return. Rendering target is HTML canvas, stated in the README; that is a coined kind and stays here. runsAs and runtime are not recorded: the docs say the visualization "works smooth on any modern browser", which is browser support, not a statement of where it runs. Install routes are npm (README) and unpkg (docs, "link them from unpkg.com"); the standalone and peer builds are the same package. The CSV adoption figure (459.2k/wk) came from a different window; the recorded figure is 2026-11-01 to 2026-11-07. Sibling packages vis-timeline and vis-data are separate candidates; no page here states a parent for any of them.
