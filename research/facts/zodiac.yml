notes: >
  Status is stub because the README names http://nu-ex.com/projects/zodiac as the project page and that address did not resolve (no DNS answer on http or https) on 2026-10-23, while the code stays public; a later pass should check whether the project has a new home. The latest GitHub release is v0.2.5 from 2014-05-22, the only release object; the last commit on the default branch is dated 2017-01-04, and the import judges listing by the release date. Templates use the project's own {{key}} syntax, which is not recorded as a templating value. Markdown is converted by external commands the config names, such as smu; those are not recorded. The LICENSE copyright line dates to 2011.
