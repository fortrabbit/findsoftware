notes: >
  The repository has no homepage: the README names a Gitbook manual and a demo repository, neither a project site, so homepage stays unknown. The maintainer is recorded from the GitHub organization profile, which gives the legal name "Chengdu PinGuo Technology Co., Ltd."; the README says the framework is developed by the Camera360 server team ("由Camera360服务器团队主导研发"), and a reviewer should choose which name the record shows. The README says the project is started on SwooleDistributed 1.7.x ("最开始基于SwooleDistributed-1.7.x开发"); that is a stated origin, not recorded as basedOn because the project describes its own code as its own. The latest release 3.0.6 is dated 2018-06-13 and the default branch was last pushed 2019-01-23; the README says the project "会持续更新与维护" (will keep being updated and maintained), no end is declared, so status stays accepted. The composer.json in the 3.0.6 tag requires PHP 7.0 or newer and ext-swoole >=1.9.15; the README narrows that to Swoole 1.9.15 and later without Swoole 2.0. Packagist figures come from pinguo/php-msf, the package the README tells users to require. The Gitbook docs answered 200 but were not read; the docs URL rests on the README link.
