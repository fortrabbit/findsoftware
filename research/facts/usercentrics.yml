notes: >
  Hosted-service record: nothing is recorded from Usercentrics SDK or GitHub repositories (license, stars, npm figures go to notes; none were collected for this record). The legal notice names Usercentrics GmbH at Sendlingerstraße 7, 80331 Munich, Germany, registered at AG München under HRB 241272; the terms also name Usercentrics Inc. as a contracting party, which is a second legal entity and goes to notes. The about page says Usercentrics was founded in Munich, and that Cybot, founded in Denmark in 2012, operated the Cookiebot platform; neither sentence names a parent or successor relationship, so no parent is recorded. The about page also says the company acquired MCP Manager, an MCP gateway that is not a consent product, so it is recorded here as a note only. The pricing page names a free trial with full access to premium features, plan tiers Pro, Business and Corporate for the web CMP, a Single sign-on feature for the account (protocols not named, so sso is unknown), a Data export API, a CMP configuration API and a GraphQL API for complex CMP configurations; the API style is not a headless CMS API, so headlessApi is not recorded. The pricing page's consent banner language counts ("5 banner languages", "60 banner languages") differ by plan; the i18n value says only what the quote says. The pricing page describes automatically preventing tracking elements (scripts, iframes, images) from loading before consent, and full support for Google Consent Mode. Coined kinds, notes only: cmpProducts (Web CMP and App CMP), trialDuration (14 days), apiStyles (GraphQL, CMP configuration, data export), whiteLabel (removal of the Powered by Usercentrics mark), googleConsentMode (Google Consent Mode support), linkedin and youtube (social fields kept in notes), and the Meta Signals Gateway hosting, which is a separate product. The docs home lists a Web CMP implementation script and browser events, so the banner attaches to a site with a script tag; the page names no process model. The homepage's meta description states the product in marketing terms and was not quoted. The pages read do not state a runsAs value for the compliance script, so runsAs is unknown.
