notes: >
  The CSV names @mgks/docmd, but the install docs and the README name @docmd/core, so the record uses @docmd/core. The old package's npm description reads "Discontinued from 0.8.x, use @docmd/core instead", a named successor and no end signal; its weekly figure is not recorded. The installation page's version selector still lists v0.9.0 as the latest docs version while npm's latest is 0.9.8; the npm version is used. The README says "One Markdown source → website, search, AI context, agents, and knowledge formats." and lists a static documentation site, an offline search index, llms.txt / llms-full.txt, Open Knowledge Format bundles, an MCP interface and AI Assistant context as outputs; no field covers the outputs. The README gives local, global and Docker installation ("docker run -p 3000:3000 ghcr.io/docmd-io/docmd:latest"). The README says "docmd includes a RAG-powered AI Assistant grounded in your documentation", that it can be connected "to your own backend or local AI provider", and that for a static site "docmd Cloud Relay provides the hosted bridge instead"; "Cloud Relay is free to use with your own AI provider key" and "Model usage may be charged separately by your chosen AI provider". It also says "Generated documentation can be hosted anywhere and does not require docmd-hosted infrastructure." Cloud Relay is named without prices. The README names a docmd migrate command for Docusaurus, VitePress, MkDocs and Starlight projects.
