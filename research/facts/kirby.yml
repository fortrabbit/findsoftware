notes: >
  The buy page already says licenses include "Kirby 6" while the latest stable release is 5.6.1; 6.0.0-beta.1 is on Packagist and drops PHP 8.2. The site footer reads "© Copyright 2009-2026", which is not stated as a first release year, so firstRelease stays out. The plugin directory shows no total count. Kirby needs no database; PDO is an optional extension for connecting to one. endoflife.date lists PHP 8.2 - 8.4 for Kirby 5 while Packagist and the docs allow 8.5 too. freeTier is used here for a self-hosted license that is free outside production, a reuse of the hosted-services field worth reviewing.
