notes: >
  The project's own homepage lists 13.0.2 as "Rolling" and 12.3.3 as "LTS"; the rolling line is the newest stable release. GitHub reports 13.0.2 as the newest non-prerelease release (2026-09-15); mariadb.org lists "13.2.0 Preview" dated 2026-09-23 with no GitHub release, recorded as latestPrereleaseDate, and 13.1.1 as RC. The GitHub description calls MariaDB "a community developed fork of MySQL server"; forkOf is not recorded because no MySQL record id exists yet. The Foundation is "non-profit incorporated in Delaware, USA", which is an incorporation statement, not a headquarters: hqCountry is not recorded. MariaDB plc (formerly MariaDB Corporation, named as the primary code contributor on the Foundation's about page and as the vendor of MariaDB Cloud and Enterprise on mariadb.com) is a separate company; the mariadb.com footer and about-us page name no single headquarters country ("Silicon Valley and Ireland"). No paidEdition is recorded: no mariadb.org page offers a paid edition of MariaDB Server. The Foundation's sponsor text says MariaDB Corporation provides subscription services and downloads with additional enterprise features, and the download page says MariaDB Cloud deploys community and enterprise versions; the enterprise server is MariaDB plc's own product. The Docker install text cited is the docs page describing the official image at docker.io/library/mariadb. The homepage names the Reddit, YouTube and LinkedIn accounts; only the subreddit and newsletter have a field. The GitHub releases list starts at mariadb-10.5.28 (2025-02-04); firstRelease is the tag mariadb-5.1.38-beta (commit date 2009-10-26), which is older than any GitHub release. The mariadb.org statistics page describes the opt-in User Feedback plugin; no installation count is stated, so reportedInstalls is not recorded. The product's runtime is compiled C++; the runtime value is binary. Fields coined here: none.
