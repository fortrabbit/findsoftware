notes: >
  Criterion 3 holds through the crates.io registry page, which gives the install line (cargo add tantivy, a Cargo.toml dependency); the README itself covers only cloning the repository and running cargo test, and that page renders in JavaScript, so the fact carries no quote. The homepage at https://tantivy-search.github.io/ answers 404 at the root while its /examples/basic_search.html and /bench/ pages answer 200, so no homepage is linked and the choice is for a reviewer. The README calls Quickwit a distributed search engine built on Tantivy, which is a separate project and no basedOn statement; it says Tantivy is strongly inspired by Apache Lucene's design, which is no basedOn either. The README's FAQ lists tantiny as a Ruby binding and tantivy-py as a Python one; the bindings are their own records. GitHub's highest stable release is 0.26.1 (2026-05-10); 0.27.0 is on crates.io and as a tag but has no GitHub release, so the latest release date comes from crates.io and the major is 0 on both. The Cargo.toml authors line also carries an email address, which is not recorded. The maintainer is recorded as the Cargo manifest names the person; the README speaks of "our" distributed search engine as Quickwit, so the organisation name could be the maintainer instead.
