notes: >
  The repository archived flag is true (last push 2023-09-05) and the README names github.com/frctl/fractal as the project's repository, so status is discontinued under AGENTS.md. Neither fractal.build nor the guide says the project has ended; the status fact rests on the archived repository alone. The homepage and guide are live and still describe the software. The npm package @frctl/fractal is the one the install docs name; its latest dist-tag is 1.5.15 (2023-01-26), and the 2.0.0 line exists only as alpha and beta dist-tags. The oldest registry upload is 0.1.2 (2016-01-06), which sets firstRelease. The repository tags v3.0.0, v2.0.0-beta.x and v1.3.0 belong to the monorepo root or to packages other than @frctl/fractal, so they do not set currentMajor. The README says the repository is a Lerna monorepo; the packages include @frctl/core, @frctl/handlebars, @frctl/mandelbrot and @frctl/web. The README gives the Discord invitation as a link in the Contributing section. The web UI theme and the default Mandelbrot theme are documentation topics, not separate records. The docs say other template engines load through adapters; only the default, Handlebars, is recorded. The contributors count (41) is the anonymous-excluded count from the contributors endpoint with per_page=1.
