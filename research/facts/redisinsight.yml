notes: >
  The highest stable release is 3.8.0 (2026-07-21). The license statement in the README reads "Redis Insight is licensed under SSPL license." and LICENSE is the Server Side Public License, version 1, so the SPDX id is SSPL-1.0 and licenseModel derives as source-available. The GitHub API reports NOASSERTION, and package.json names the license as "SSPL", which is one wording and not a second entry. The maintainer "Redis Ltd." is the author in package.json at the 3.8.0 tag. runtimeMin is not recorded: the engines field in package.json describes building the repository, not what an installed copy needs, and the README says the app is built with Electron, Monaco Editor and NodeJS. The firstRelease year is the oldest GitHub release, 2.0.2-preview (2021-11-22), a preview; the repository was created 2021-07-30. The docs describe four install routes: desktop client, Docker image serving the UI on port 5540, Kubernetes and AWS EC2; the README adds the Microsoft Store, Apple App Store, Snapcraft and Flathub, and a source build with instructions on the wiki. The Docker Hub count is for redis/redisinsight, the image the docs name. No basedOn is recorded: the README names Electron as a tool used and no Electron record exists. The README also names Redis for VS Code, a separate extension. The free use stated on the homepage is not a paid edition. The README's Discord badge points to discord.gg/QUkjSsk; the discord field records the invite the Redis Insight page links. The facebook, instagram and youtube links are from the redis.io footer shared with the Redis Insight page. Fields coined here: none.
