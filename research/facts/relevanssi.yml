notes: >
  The homepage says "new stewards" and "The new home of Relevanssi": eurodata comesio solutions GmbH took over development from Mikko Saari, who is named as creator and lead developer; the plugin header at tag 4.28.6 names eurodata comesio solutions GmbH as Author, and the GitHub repository is the author's mirror (owner msaari, no GitHub releases, so currentMajor and the release date come from the WordPress.org stable version and the annotated tag). The WordPress.org API lists the plugin as added on 2009-06-30; the GitHub repository was created in 2017. The plugin header names GPLv2 or later and the plugin file's notice says either version 3 of the License or later; both statements are recorded. The homepage states PHP 7.2 where the readme header at the tag says 7.1; runtimeMin follows the readme header. Premium prices appear on the buy page and are not recorded. Relevanssi Light and Relevanssi Live Ajax Search are sibling plugins on the same site and are not separate records. The Premium PDF indexing runs through an external web service, per the homepage.
