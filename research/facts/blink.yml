notes: >
  Candidate row lists docs.rethinkphp.com as homepage; it did not answer, so no homepage is recorded. The docs were read from docs/en in the v1 branch of the repository, not from the published site; the docs fact cites the README's link. Last release v0.4.1 on 2019-07-28; the README says the project is "still in active development" and the default branch v1 was pushed 2026-09-09. No end signal found: not archived, package not abandoned or deprecated, no end statement. Release age is shown, not decided. The README says the design is "heavily inspired by Yii2 and Laravel"; inspiration is not a basedOn relationship and is not recorded. Installation needs the Swoole extension (docs/en/1-2-installing.md); recorded in the prose only. The Packagist package for the install docs is blink/seed, a skeleton, so the core package blink/blink is recorded. The Packagist package blink/blink requires php >=5.6.0 at the latest release v0.4.1; runtimeMin records it. The default branch v1, unreleased, requires php >=8.0. Maintainer is the LICENSE copyright line. Contributors count is the page count at per_page=1.
