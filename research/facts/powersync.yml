notes: >
  Accepted record for the self-hosted PowerSync Service, the Open Edition the self-hosting docs describe; the cloud service, the dashboard and the client SDKs are not the recorded software. The docs say "The PowerSync Dashboard is currently not available when self-hosting PowerSync", so dashboard features are cloud-only and are not recorded. License: the LICENSE file at tag v1.27.2 is FSL-1.1-ALv2 (Functional Source License, Version 1.1, with the Apache 2.0 future license); the default branch main carries an Apache License 2.0 file, and the GitHub API reports Apache-2.0 for the repository. The license of the latest release is recorded; the Apache 2.0 statement on main and the GitHub detection go to the reviewer, who decides whether the main-branch wording changes the record. The pricing page calls the open-source link "Open-Source" and the docs call the self-hosted build the "PowerSync Open Edition"; neither page states a license for it beyond the LICENSE file. The docs page for the Enterprise Self-Hosted Edition gives custom pricing and a sales contact. The source database list on the homepage includes Azure DocumentDB, which is not in the databases value; the pricing navigation lists Sync Postgres, Sync MongoDB, Sync Azure DocumentDB, Sync MySQL and Sync SQL Server. The installation subpages for Docker, Kubernetes and source build returned 404 when read; the Docker route is from the self-hosting overview and the Kubernetes and EKS guides are deployment platform guides listed there. The current major is taken from the highest stable release v1.27.2 (tag family v1). The company page dates the standalone PowerSync product to 2022, which sets firstRelease; the oldest tag in this repository is @powersync/service-core@0.1.1, committed 2024-06-04 (repository created 2024-05-30). The company page says JourneyApps is headquartered in Denver, Colorado, which names no country, and the footer legal name is Journey Mobile, Inc., so hqCountry stays unknown and the page's JourneyApps is recorded as parent. The open-source page says the server-side PowerSync Service and CLI are available under the Functional Source License; the licensing page names the Open Edition as source-available under that license and the Enterprise Self-Hosted Edition as under a commercial agreement. The Docker Hub image journeyapps/powersync-service is the one the self-hosting docs name. The client SDKs (JavaScript, Dart/Flutter, Kotlin, Swift, .NET, Rust) are separate repositories and their figures are not recorded. The migration guide for Electric Cloud moves users to PowerSync Cloud and is not recorded as importsFrom; it is the source of the alternativeTo entry. Atlas Device Sync is a MongoDB Atlas product, so no alternativeTo mongodb-atlas is recorded. The compare page "PowerSync vs Neon Realtime" names a Neon product; Neon is not recorded as alternativeTo because the compared product is Neon Realtime, not the Neon record, so the reviewer decides. The Cloud plans on the pricing page (Free, Pro, Team, Enterprise) are hosting tiers and carry no prices here. The Enterprise Self-Hosted Edition is the paid edition; its page gives no feature list beyond the sentence quoted. The homepage links LinkedIn and YouTube; those links go to notes. The footer legal name is Journey Mobile, Inc., and no headquarters country is stated, so hqCountry is unknown. The Docker demo configuration runs a Node.js example; that is an example, not a runtime statement, so no runtime value is recorded.
