notes: >
  The README calls Graphul "an Express inspired web framework", which names a model it follows and not a parent, so no basedOn is recorded. The GitHub releases list has a v1.0 release on 2023-09-25 and an earlier v0.1.0 prerelease from 2022-10-08; the crates.io record begins with 0.1.0 on the same day, which sets firstRelease. The last commit on the default branch is dated 2023-09-25 and the repository has had no release since, which the import judges on its own. The crates.io figure is the total downloads of the crate, with the 90-day figure left out. The homepage footer names "The Graphul Team" and the LICENSE copyright line names "graphul-rs" (Copyright (c) 2022 graphul-rs); the team name is recorded as the site states it. The docs pages are Docusaurus pages on the project's own site; the what-is page is the only one cited. The docs say Graphul re-uses libraries such as Axum, which is not a statement that it is built on Axum, so basedOn stays out. The installation shown on the docs site is cargo init and cargo add, matching the README.
