notes: >
  The README recommends pairing Waffel with Brunch through a starter skeleton; the project does not say it is built on Brunch, so basedOn is not recorded. The GitHub API reports no license for the repository and it holds no LICENSE file; the MIT statement comes from the README and the npm package. The repository has no GitHub release after v0.1.9 (2016) while npm carries versions to 0.1.19 (2020); latestReleaseDate follows npm. The docs state a built-in web server for development, enabled with the server option.
