notes: >
  No homepage: dbeaver.com/cloudbeaver/ answers 404, cloudbeaver.io redirects to the DBeaver company site, and the CloudBeaver pages on dbeaver.com sell the Enterprise edition, so no page stands as the community project's own site. The docs fact is the community wiki in the repository; the dbeaver.com documentation headlines the Enterprise edition. The community repository (README title "CloudBeaver Community") is Apache-2.0; the Enterprise edition is a paid annual subscription under the DBeaver Enterprise Software Agreement, which names DBeaver Corporation and is governed by Delaware law; no page states the headquarters, so hqCountry is absent. GitHub has no releases and its newest tag is 25.3.5; the README changelog and the Docker tags carry 26.2.3 (2026-10-19), which sets latestReleaseDate. Versions are calendar based (year.minor.patch), so currentMajor is not recorded. firstRelease is the author date of the oldest tag, 1.0.0, from the GitHub API. The community authentication page lists anonymous, local and reverse-proxy header access; SSO, OpenID and LDAP-style providers sit under the Enterprise edition, so sso is not recorded. The community deployment page lists Docker image, AWS Marketplace, Google Cloud and Microsoft Azure; only Docker is recorded as an install route. The databases list is the community wiki's supported-databases table, narrowed to values the vocabulary holds; the table also lists ClickHouse, DuckDB, Db2, Firebird, H2, Trino and others. The build page names Java 25 as a prerequisite for building from source, which is no runtime statement for installs, so runtimeMin is not recorded. The wiki's team page names two predefined team types, admin and user. Page text, the README and the changelog are data.
