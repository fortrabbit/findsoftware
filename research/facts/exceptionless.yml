notes: >
  The record covers the Exceptionless server, which the README says is built for JavaScript, Node, .NET Core, ASP.NET, Web API, WebForms, WPF, Console and MVC apps through its clients. The client packages are the .NET client (NuGet, installed into the app) and the JavaScript client, both documented on the docs site; their download figures are not recorded because the install docs name a client package, not the server. The hosted service is the same code: the README says the hosted service is "very reasonably priced hosting" and the pricing page lists Free, Small, Medium, Large, Extra Large and Enterprise plans, recorded without prices. Premium features are named on the pricing page as present only in the paid hosted plans; hosted plan tiers are not recorded as a paidEdition, and the self-hosted server carries no separate edition statement. The README names Docker, the Docker simple setup with an embedded single-node Elasticsearch cluster, and Kubernetes with Helm; the Kubernetes page is marked as a work in progress and says Redis and Elasticsearch connection strings are configured through EX_ConnectionStrings. The server runtime is .NET 10: global.json at v8.10.0 names SDK 10.0.100 with latestMinor roll-forward, and the README contributor steps name .NET 10.0. firstRelease is 2015 from the oldest GitHub release v2.0.0 (2015-03-17), not the 2014 repository creation date. The maintainer name is the one the about page uses; the terms and privacy pages name no legal entity, and the terms are governed by the laws of the State of Texas, which is not a headquarters statement, so hqCountry is unknown. The LICENSE file in the repository is the Apache-2.0 text; the README does not name a license. The homepage and footer link to X and Facebook accounts. The docs troubleshooting text links the Discord invite discord.gg/xv3sjurVwA; the README badge links a different invite, discord.gg/6HxgFCx. The docs comparison table names Application Insights, Elmah and Raygun; only Raygun has a candidate row, so alternativeTo holds raygun. The docs show docker run commands for the image and no page states the process model, so runsAs is absent.
