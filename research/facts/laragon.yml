notes: >
  Windows only: the FAQ says "Laragon is fully compatible with Windows 10 & 11", and the download is a Windows installer ("Laragon Full (64-bit)"). The EULA (last updated 2026-02-09) names the licensor only as "Laragon"; the about page names Leo Khoa as creator and the footer reads "@Laragon", so no legal entity or country is recorded and hqCountry is unknown. The license is proprietary: the README says "Starting with Laragon 7.x, a license is required to use Laragon", and the EULA's unlicensed tier allows non-commercial use with reminders. The pricing page lists non-commercial and commercial licenses (Standard, Extended, Annual, Lifetime, Team); prices are not recorded. The EULA says licences, billing and tax are handled by Lemon Squeezy as Merchant of Record, which is not a field. The GitHub repository holds laragon.exe, a configuration skeleton (apache2, nginx, php, ssl, cmder, Procfile), a CHANGELOG that only links to the releases page, and the README; no source code, so sourcePublic is false. The language is not recorded as a fact: GitHub reports PHP, but the project states none and the repository holds a compiled binary. firstRelease is 2016 from the oldest release in the repository, 2.0.5 (2016-09-01); the repository was created in 2015. Highest stable release is 8.8.0 (2026-10-22). The handle @leovn in a pricing-page testimonial is no project account, so x is not recorded.
