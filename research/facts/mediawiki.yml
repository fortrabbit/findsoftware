notes: MediaWiki installs from a release tarball, not from Composer, so the Packagist package mediawiki/core (flagged abandoned) is not the project's distribution and no registry figures are taken from it. The repository is not archived and endoflife.date lists supported releases. The maintainer is recorded as the COPYING line states it; the Wikimedia Foundation is not named there as maintainer. The GitHub repository license is NOASSERTION; COPYING states GPL version 2 or later. The contributor count is the number of pages with per_page=1 and anon=true. The databases quote is a table-of-contents line from the install page, which lists SQLite, MariaDB/MySQL and PostgreSQL.
