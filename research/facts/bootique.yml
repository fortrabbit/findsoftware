notes: >
  The homepage bootique.io answers over https and names the project as a Java microservices framework; its "10x faster than SpringBoot" claim is not recorded. The install docs (3.x getting-started) name the BOM io.bootique.bom:bootique-bom at version 3.0, and the README example shows the 4.0-M4 preview; the stable line is 3.0 (GitHub release 2026-01-20), and 4.0-M6 is the newest preview. The 3.x docs are the stable docs; the README links the 2.x getting-started page. The README states that each app is a collection of modules interacting through dependency injection, which the prose relies on. The homepage Twitter link is the project's account (BootiqueProject); the maintainer's personal accounts are not recorded. Maintainer is ObjectStyle LLC, named in the README license header and the homepage copyright; no legal form or country is stated on the pages read, so hqCountry is unknown. Language and runtime are Java on the JVM; no minimum Java version is stated on the pages read. The release date and Maven first upload come from the io.bootique:bootique artifact on Maven Central (0.19, uploaded 2016-08-08), older than the oldest GitHub release (2.0.B1, 2024-04-01).
