notes: >
  The project has no website of its own: the npm package names the GitHub README as its homepage, so no homepage is recorded. The README says HyperExpress is mostly compatible with Express but not 100 percent, and that it supports a limited Express API; this is stated on the page but is not recorded as a field. The npm registry gives 2021-04-11 as the first version date, but no page states a first release year, so firstRelease is not recorded. The npm publish date of 7.0.2 is 2026-07-20; the GitHub release page for v7.0.2 shows 2026-07-27, and the npm date is recorded. The LICENSE copyright line names Kartik Kumar and the GitHub profile name is Kartik.
  The README says "Powered by uWebSockets.js", which is not recorded as basedOn because it names a native addon dependency. The README says the prebuilt binaries of that addon support Tier 1 macOS and Windows platforms and glibc-based Tier 1 Linux distributions, and that Alpine Linux is not supported.
