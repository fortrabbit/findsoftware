notes: >
  Stub: whether the project's own site still shows the software is in doubt, because the homepage listed on GitHub, www.abecms.com, did not answer from the research host; a reachable site would settle it. The record has no homepage and the code is public. The GitHub release list ends at v3.4.6 (2017); the npm package's latest is 5.10.2, a higher major than the highest GitHub release, so currentMajor and latestReleaseDate come from npm under the rule for that case. The README says "The version 5 is here" and links a version 5 roadmap; the roadmap page describes "no complex data structure nor database to handle", which is a plan rather than a fact about the release and is not recorded. The README documents deploy targets (Surge, AWS S3, Github.io, SFTP) and plugins such as abe-algolia; the docs folder linked from the README (docs/abe-users.md, docs/abe-plugins.md) answers 404 on master. The Node.js requirement is listed in the first steps page with no version; the package.json engines field is set on master only, not on the npm release (engines is absent there), so runtimeMin is left out. The README names oAuth2 for workflow and permissions; no SSO protocol is recorded because the README names none. Contributors from the Link header of the contributors endpoint (last page 15). The maintainer is the copyright holder named in LICENSE; the npm author is the same person under the handle gregorybesson.
