notes: >
  Monorepo: stars, contributors and releases belong to dream-num/univer, which holds the Web SDK core, the engines, the presets and reference-app code; the registry figure is @univerjs/presets, the package the quick start installs with pnpm, and it lists no dependents on ecosyste.ms. The README says the Office SDK has three parts, a Web SDK, a Server SDK and an AI SDK. The repository's Apache-2.0 packages are the open-source Web SDK core and Sheets and Docs capabilities; the commercial plugins, Server SDK and AI SDK extensions are licensed separately, with Freemium evaluation that includes watermarks and feature limits, which is the paidEdition fact. The pricing page lists plans from a price the record does not hold. The quick start is a browser application built with a bundler, and the README also states that Headless Univer runs in Node.js; no runsAs is recorded because the README names both browser and Node.js. The Runtime compatibility section says Headless Univer supports Node.js >=18.17.0 and that developing the monorepo needs Node.js >=22.18; runtimeMin is the headless minimum, and the published packages declare no engines field. The same section says the view layer is built on React 18 and supports React 18 and 19, which is the basedOn statement. The CSV row names Luckysheet as the project it succeeds; no fact file exists for Luckysheet, so no successorOf is recorded. The homepage compare page and the README feature comparison name Microsoft Excel and Google Sheets, with no record id. The maintainer is DreamNum Co., Ltd. from the README copyright line, which has no LICENSE copyright line; the terms and privacy pages name Dream Number Co. Ltd, and the footer repeats that name, a second wording recorded here only as a note. The terms page names a California governing law and the privacy page names United States servers; neither states the company headquarters, so no hqCountry is recorded. The README gives a second Discord invite (discord.gg/z3NKNT6D2f); the homepage invite is recorded. The npm weekly figure is for @univerjs/presets over 2026-11-01 to 2026-11-07. The release date is the day of writing, as the newest stable release v1.5.2.
