notes: >
  The maintainer is Preline Labs Ltd., named on the license and terms pages; the pages give no country, so hqCountry is absent. Preline Pro is a paid product sold under Pro, Team and Enterprise licenses, recorded as paidEdition without prices. The MIT and Preline UI Fair Use License are two statements of the license on the same page, and the Fair Use License permits derivative templates and themes with attribution, forbids competing products, and requires attribution with a link to the repository on derivative works. The Pro license page forbids re-distributing Preline Pro on its own or bundled, and use in derivative themes or generators. The npm license field reads "Licensed under MIT and Preline UI Fair Use License", the same dual statement. The install page names the npm package preline. The docs state a Tailwind CSS project is required, which is recorded as basedOn; the about page says the components use standard Tailwind utility classes. The CSV homepage is preline.co; the figma community file and the MCP and AI skills pages exist on the site but have no field in the starter list. The homepage names x.com/prelineUI and no other social link. The repository's GitHub releases begin in June 2022; firstRelease follows the npm first publish of 1.0.0 in May 2022 in the year 2022 as well.
