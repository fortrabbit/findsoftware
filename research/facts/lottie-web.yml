notes: >
  The repository is the HTML player of the Bodymovin project. The README also covers Android, iOS, React Native and Windows, which are separate repositories and out of this record. The LICENSE copyright line names Bodymovin, so the maintainer follows it; the repository sits in the airbnb organization, which the owner type records. The site lottie.airbnb.tech is a docsify shell whose pages carry no readable text, so the docs and homepage facts cite the README link, and the airbnb.io/lottie address the README gives redirects there. The repository has tags and no GitHub release objects, so currentMajor and latestReleaseDate come from the npm package lottie-web, whose latest version 5.13.0 is the newest tag. firstRelease is the year of the oldest tag, v.1, which the repository dates to 2015-05-07. The README says animations are exported from After Effects by the Bodymovin extension, which it installs separately from the npm package. The README names three renderers ("svg", "canvas" and "html" in the renderer option) and an "HTML player" heading; a rendering target is a coined kind kept here, not a field. The README says lottie.inBrowser() returns true when the library runs in a browser, but no sentence says it runs only in a browser, so runsAs is left out. The package names no Node.js requirement, so no runtime is recorded. The README also says image sequences, videos and audio are not supported in exported animations. The CSV figures (32.2k stars, 4.3M a week) are stale: the registry sum for the period is the figure recorded here.
