notes: >
  Nova is a commercial package installed from the vendor's private Composer repository; no public repository, no Packagist package and no SPDX license exist, so license, repository and the registry fields are unknown. The sourcePublic false fact is the only source-availability statement the docs make. The license terms, prices and plan names are not recorded; pricingPage links the homepage section that lists them. Nova is the paid package itself, so no paidEdition is recorded. The homepage testimonials are not used as adoption figures. The release list on nova.laravel.com/releases is embedded in script data that the quote checker cannot read, so latestReleaseDate is left out: the list shows 5.11.1 with created_at 2026-10-12, and the reviewer decides whether that is enough to record. currentMajor comes from the release notes, which describe Nova 5 as the release that follows 4.x. The install page states "Nova requires a license key and a production URL to be used in production environments"; no field holds that, so it stays here. The Nova 5 release notes state the PHP minimum ("requiring PHP 8.1+"); the composer.json example on the install page lists ^8.2 for a sample application and is not used. The homepage describes the Laravel team as the designer, and the copyright line names Laravel Holdings Inc., recorded as maintainer.
