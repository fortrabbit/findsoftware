notes: >
  Criterion 2 is in doubt: the product sells source code after purchase and no public source, repository, registry package or install page could be read, so whether it is installable by the user cannot be judged. The homepage /plus redirects to a login page ("Log in to your Tailwind Plus account"), and /plus/ui-kit and /plus/license redirect to the same page. /plus/pricing answers 404. The tailwindcss.com homepage links to /plus in its navigation and states no price, license or install route. Settling it needs a readable Tailwind Plus product or license page that states how the source is delivered and what the buyer installs, or a public repository or registry package that holds it. The CSV row names the licence as paid with source delivered after purchase; that statement is not recorded as a fact because no readable page states it. The page title is "Login - Tailwind Plus".
