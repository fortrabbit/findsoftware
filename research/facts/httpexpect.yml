notes: >
  Boundary: none; accepted as a testing library, matching the CSV row. No homepage: the CSV homepage is pkg.go.dev, which hosts the module reference rather than the project's own site, so the pkg.go.dev link is the docs field. The README has an import path under Versioning and Quick start but no install command and no sentence naming a route; installMethod is left out for a reviewer to decide. The README says httpexpect is built "on top of net/http and several utility packages"; net/http is the Go standard library and has no record id, so basedOn stays out. The Similar packages section lists gorequest, apitest, baloo, gofight, go-hit, frisby, forest and restit; none has a record id, so alternativeTo stays out. The README names testify and the standard testing package as failure reporters and lists WebSocket support, JSON Schema and JSONPath assertions, and reusable builders; these are coined kinds kept in notes. The README describes httpexpect as a set of chainable builders for HTTP requests and assertions for HTTP responses and payloads, and names the standard testing package and testify for failure reports. It says request payloads can be JSON, urlencoded or multipart forms, that a test can talk to a server through a real HTTP client or invoke the net/http or fasthttp handler directly, and that JSON Schema validation is supported through gojsonschema. The LICENSE copyright line names Victor Gaydov and contributors; the README Donating section speaks of "my open-source work", which matches. The current stable branch is v2, and the highest stable release is v2.17.0. firstRelease is the 2019 commit date of the oldest tag, v1.0.0, which is older than the v2 module's first Go proxy version. Stars and contributors are for the repository.
