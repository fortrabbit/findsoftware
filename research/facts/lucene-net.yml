notes: >
  Status is accepted: the project's own download page marks Lucene 3.0.3 as Stable and the homepage lists 4.8.0 beta builds with the latest prerelease dated 2026-06-22. The homepage calls 4.8.0 Beta the latest version and its install line uses --prerelease, so the NuGet stable 3.0.3 (published 2012-10-26) is the install target only with an explicit version. currentMajor is 3 because GitHub's release list holds only 4.8.0 betas, so no stable GitHub release exists and the registry's stable version is used; a reviewer should decide whether currentMajor should be 4 while the 4.8 line stays a beta. The 3.0.3 package targets .NET 3.5 and 4.0 (lib/NET35, lib/NET40) and the 4.8.0-beta00018 package targets .NET Framework 4.6.2, .NET Standard 2.0 and 2.1, net6.0 and net8.0; the .NET Framework minimum is notes only, so runtimeMin is absent. The NuGet figure is the totalDownloads of the Lucene.Net id across all versions. The homepage, the nuspec of the 4.8.0 package and the NOTICE file all name The Apache Software Foundation; the maintainer quote is from NOTICE.txt on the default branch. firstRelease 2011 is the oldest NuGet upload of Lucene.Net (2.9.2.2, 2011-09-30). The 2006 entry at the foot of CHANGES.txt is inherited Lucene Java history, not a Lucene.NET release; earlier Apache source releases may exist but no primary page dates them. The GitHub tags for the 1.x and 2.x lines carry commit dates from the 2012 repository migration, so they are not used for firstRelease. The repository's latest commit is dated 2026-10-25. The homepage's basedOn statement is a port statement in the project's own words; Lucene.NET is not a fork in the forkOf sense.
