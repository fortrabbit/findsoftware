notes: >
  Yii 1.1 is the 1.1 line of the Yii project; the Yii 2 and Yii 3 records (yii-framework.yml) cover the other lines, and the homepage and docs are shared with them. The README says Yii 1.1 "has reached end of life" and will receive only necessary security fixes and compatibility fixes; the Yii site's 1.1.32 announcement says the line "has reached maintenance mode". The site's news post "Update on Yii 1.1 support and end of life" (2015) set the timeline; it was later extended, and the 1.1.33 announcement "security support extended" is listed on the site but its page returns 404 and no 1.1.33 tag or Packagist version exists, so only 1.1.32 is recorded. The eolPolicy field is coined here. Status is set to discontinued from the project's own end-of-life statement under the rule for ended projects; the line still receives security and compatibility releases, and the reviewer may want accepted instead. The README says the code is "tested and supported up to PHP 8.5"; not recorded as a field. The guide's copyright line reads "2008-2014 (c) Yii Software LLC.", so the maintainer keeps the LLC form. The Packagist monthly figure (137325) is not recorded; only the total. The install guide states Yii requires PHP 5.1 and the latest release's Packagist metadata says php >=5.1.0, so runtimeMin is 5.1.
