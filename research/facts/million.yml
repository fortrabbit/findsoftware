notes: >
  The README links its docs at million.dev/docs/introduction, which answers 404; the docs read here are at old.million.dev, the GitHub homepage field, whose introduction and install pages carry the same text. The LICENSE names Aiden Bai as copyright holder, so the maintainer is Aiden Bai. The highest stable GitHub release is v3.1.0 (2024-05-21); the npm latest, 3.1.11, has no GitHub release and dates 2024-06-04, which is the latestReleaseDate. Tags run past v3.1.0 to v3.1.7 without releases. The npm figure is for the million package that npx million@latest installs. Million Lint, listed as a separate product in public beta on the site, is not recorded as an edition. The npm package dependent counts come from ecosyste.ms for npmjs.org. The install page says "You will also need to make sure you are on Node 18 and above", a requirement of the CLI and build step, so it is noted here and not recorded as runtime. The current million.dev site presents Million Software, Inc. as a research lab and no longer shows Million.js, so the homepage is old.million.dev, the repository's homepage field, which shows the software; its footer names Million Software, Inc., recorded as parent. The README's package list also names a core virtual DOM package, which is not recorded as a second category.
