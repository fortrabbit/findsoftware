notes: >
  The record covers the PMTiles format and its JavaScript library (npm pmtiles, repository protomaps/PMTiles), not the basemap data or the Protomaps hosted services. The format specification is version 3, read in the repository at spec/v3/spec.md. The Python package pmtiles is on PyPI and the docs call it beta; it is not an installMethod here. The pmtiles command line tool is a separate repository, protomaps/go-pmtiles, with its own release binaries and Docker image, and is not recorded here. The PMTiles repository has no GitHub release or tag, so the version and date come from the npm registry; the npm first upload is 2021-02-17. The LICENSE file states that the reference implementations are under BSD-3 and that the specification is public domain or CC0 where applicable; GitHub does not detect a license for the repository, so the BSD-3-Clause entry rests on the quote and on the npm license field. The homepage footer says Protomaps is released under the BSD and ODbL licenses; the ODbL statement concerns the basemap data and is not recorded as a license of this record. The homepage and about page describe a Hosted API for basemap tiles, noncommercial use free and commercial use through a GitHub Sponsor, and state that the project is open source, not open core; the hosted API is a service of the basemap data, not of this format, and is not recorded as hostedOffering. The about page says Protomaps LLC is a Delaware limited liability company, and the terms page says the site is operated from facilities in the United States; neither names a headquarters country, so hqCountry is not recorded. The docs say PMTiles is designed for being viewed directly in web browsers, and the JavaScript README says PMTiles for Browsers and NodeJS; the library names both, so runtime is node and no runsAs is recorded. The docs say PMTiles readers use HTTP range requests to fetch only the tiles they need, that an archive can be hosted on a storage platform such as S3, and that the format is read-only, so an archive is rewritten in full to change it. The GitHub stars and contributors belong to the PMTiles repository. The docs concepts page compares PMTiles with uploading each tile as a separate file and with MBTiles, a SQLite-based container format; MBTiles has no record, so alternativeTo is not set. The docs name MapLibre GL JS, Leaflet and OpenLayers as map libraries the pmtiles library integrates with, a compatibility statement and no basedOn. The Protomaps LLC legal page also names the company, the LICENSE copyright line is the recorded source.
