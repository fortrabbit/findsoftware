notes: >
  Monorepo: the repository holds deck.gl, its core and layers packages, and the React and other bindings; stars and contributors belong to the monorepo. The record's registry figure is @deck.gl/core, the package the standalone guide installs and the README badge counts; for the same period the umbrella package deck.gl had 283,003 weekly downloads (https://api.npmjs.org/downloads/range/2026-10-26:2026-11-01/deck.gl). The README's "NPM Module" section gives "npm install deck.gl" as a command, not a sentence, so no npm installMethod is recorded; this is for the reviewer to decide. The repository is a vis.gl project under the OpenJS Foundation, which the homepage and README name; the LICENSE copyright line names "Vis.gl contributors", so the foundation is not the maintainer. The standalone guide says the core library "can be used by any JavaScript application" and the React guide says deck.gl is "While not directly based on React", so no basedOn is recorded. The README also names a Python package pydeck (pip install pydeck), a separate package, and a React component package; neither is recorded here. The homepage names a Slack workspace; no field holds it. The latest GitHub release v9.3.12 (2026-10-30) is newer than the npm latest 9.4.1 (2026-10-28), so latestReleaseDate is the GitHub date. No runsAs or runtime is recorded: the pages describe a WebGL2 and WebGPU library usable from JavaScript but do not state where it runs in words.
