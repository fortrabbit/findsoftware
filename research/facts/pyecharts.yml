notes: >
  Boundary ruling for this wave: pyecharts is accepted because its own pages say rendering writes a local HTML file ("render will generate a local HTML file", en-us/quickstart) and that it integrates with web frameworks ("Easy integration with major web frameworks such as Flask, Django, etc.", en-us/intro, and the Flask and Django guides en-us/web_flask and en-us/web_django). The README in the repository is Chinese; the English text is README.en.md, which the facts quote. The README and the intro page say the output runs in Jupyter Notebook, JupyterLab and marimo; that is a notebook use, not recorded as a field. The render_images page names selenium-based snapshot tools for PNG output (snapshot-selenium); not recorded. The homepage is a docsify page at https://pyecharts.org/ that redirects from plain http; the https address is recorded. The current release is on the 2.x line, which the README says renders with Echarts 5.4.1 or later. The v0.5.x line is no longer maintained (README, branch 05x) and is not a separate record. The README lists py-vchart and py-antv under "pyecharts like" projects; the README does not call them alternatives, so alternativeTo is not recorded. The LICENSE copyright line names chenjiandongx (2017-2020); the README names four co-maintainers (chenjiandongx, chfw, kinegratii, sunhailin-Leo), kept here only in notes. The docs pages were read through their markdown source, since the homepage is a docsify shell. The GitHub owner is an organization named pyecharts. The first PyPI upload is 0.1.4 on 2017-07-20, older than the first GitHub release (2023), so firstRelease is from PyPI. The pypistats figure is the last-month count, a rolling window. Jinja2 is imported in the Flask guide code only; no docs sentence names a templating language, so templating stays unrecorded. The README says Chinese documentation exists beside the English one; i18n of the docs is not a library feature and is not recorded.
