notes: "The README calls the approach invasive: it styles native HTML elements without presentation classes, which it says makes it difficult to drop into a project that already exists. It lists bug-report support for IE11 and newer. The README says the SCSS source lets a user set variables such as the primary color before import, and credits Francisco Presencia as the creator; the LICENSE copyright names him, recorded as maintainer. The README section \"Alternatives and why I still created Picnic CSS\" names Milligram, PureCSS, Bootstrap and Min, recorded as alternativeTo. The package has no GitHub releases, so currentMajor and latestReleaseDate come from the npm latest version, and the GitHub tags agree. The first npm upload, version 0.0.1 of 2012, belongs to another project (its description is \"platform for picture sharing\"), so firstRelease is the first npm version that describes this library, from 2015. The README says Normalize.css is used as a base; that is a dependency of the style, not a parent the project is built on, so basedOn is not recorded. The npm package is the install page's package and the figures are for it. The homepage is served over HTTPS. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header."
