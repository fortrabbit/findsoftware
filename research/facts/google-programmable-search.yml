notes: >
  The developers.google.com pages return different bodies on different requests, so the sentences quoted for docs, adminUi, headlessApi and apiLimits are not kept as quotes; the URLs and the read date stand. Status: hosted-service (the search element and the Control Panel are still offered), but two API endpoints have end dates stated on Google's own pages. The Custom Search Site Restricted JSON API "will cease to serve traffic on January 8, 2025" (developers.google.com/custom-search/v1/site_restricted_api); the Custom Search JSON API "is closed to new customers" and its "service discontinuation on January 1, 2027" is stated on developers.google.com/custom-search/v1/overview. The record stays hosted-service because the search element and the Control Panel live on; the API closures are notes and a Worth knowing line. Both pages name Google's Agent Search (Vertex AI Search) as the replacement for site search; that replacement is recorded on google-agent-search, not as successorOf here, because the Element and the Control Panel continue. The maintainer is Google LLC from the consumer terms at policies.google.com/terms, which define "Google LLC and its subsidiaries"; no Google Cloud or Programmable Search legal entity page was read. The Custom Search JSON API and the Programmable Search Element are separate offerings with separate prices; the Paid Search Element (an ad-free version of the search element) is a plan tier and no paidEdition; the overview names four offerings (Standard, Non-profit, Paid Search Element and Custom Search JSON API) and they are not split into candidates. The Site Restricted JSON API's successor page on Google Cloud (Agent Search) is noted here only for the migration path.
