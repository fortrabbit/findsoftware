notes: >
  The homepage kvision.io serves a JavaScript shell; the body is not in the raw HTML, so the homepage fact is cited to the README link to the site. Maven Central publishes no download count, so no download figure is recorded. The maintainer is the copyright holder named in LICENSE; the GitHub profile lists Poland as location, which is not a legal address and is not recorded. The guide's setup page states that the build needs JDK 25 or higher; it is a build requirement and is not recorded as runtime or runtimeMin. The production build is a zip of the application files (./gradlew clean zip), and no page names the zip as static files. The Kotlin Slack channel #kvision is a chat link with no field. The README names Ktor, Jooby, Spring Boot, Javalin, Vert.x and Micronaut as server frameworks for fullstack applications through the Kilua RPC library; these are integrations, not basedOn statements. The first GitHub tag is 0.0.1 (2018-02-09); ecosyste.ms lists 2021-02-13 as the first Maven release for io.kvision:kvision, a later date, so the GitHub date stands.
