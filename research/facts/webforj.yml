notes: >
  The GitHub homepage field and the research row name docs.webforj.com; the product site webforj.com is recorded as homepage because the docs site is the documentation of it and the imprint on webforj.com names the company. The first release is the oldest GitHub release, 0.005 (2022-04-07); the tag 0.001 dates to the repository creation day (2022-02-06) and is a tag, not a release. The highest stable release is 26.02 (2026-09-01); the project numbers its releases as year and sequence (26.00, 26.02, 27.00 in the docs), so currentMajor is recorded as 26 for a reviewer to confirm, since AGENTS.md excludes calendar versions. The upgrade page for 27.00 is marked draft and is not used. The legal name BASIS International Ltd. comes from the imprint and the footer of webforj.com; the LICENSE copyright line names webforJ, not a legal entity. The German imprint names BASIS Europe GmbH (Saarbruecken) as the operator of the German site; the HQ recorded is the Albuquerque address listed for BASIS International. The pricing page lists a no-fee plan under the "NFTC* License" whose footnote reads "Free forever as long as you either (1) stay on a supported Java LTS, or (2) freeze webforJ and Java at a version still covered by Oracle's free updates," and the page a Business (LTS+) plan and an Enterprise (LTS++) plan; the license statements are recorded as the page words them. The licensing page (docs.webforj.com/docs/configuration/licensing-and-watermark) says an unlicensed project runs with a watermark on its UI until a valid license is entered, which is a licensing condition and not a paid tier. The legal page links a 2011 BASIS Software License Agreement PDF that is not checked against webforJ. The runsAs values come from the packaging statements on the Spring Boot page and the getting-started page; the docs do not state the word always-on. Maven coordinates come from the Maven Central metadata of the parent artifact. Contributors count from the last page of the contributors endpoint with per_page=1.
