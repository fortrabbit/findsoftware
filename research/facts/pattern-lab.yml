notes: >
  Status discontinued, from four signals: the homepage says "Pattern Lab is archived.", the README says "Pattern Lab is no longer actively maintained." and states that no new releases or security patches will be made, the GitHub repository is archived, and the npm package @pattern-lab/core carries a deprecation notice on its latest version (6.1.0). The README names no successor, and the code, releases and history stay under the MIT license; forks are the project's own suggestion, not a successor. The CSV row gave a registry package patternlab-node with about 1.3k weekly downloads and a deprecation; the registry shows patternlab-node stuck at 2.12.0 and not deprecated, and its week to 2026-10-04 had 736 downloads, so that package is not the one recorded: the install docs name npm create pattern-lab, the scaffolder for @pattern-lab/core, and that package is the npm name recorded. The @pattern-lab/cli package is also deprecated on the same release and is not recorded separately. The GitHub releases list is the monorepo's v-tags; the first is v0.0.3 from 2013-10-25 and the latest v6.1.0 from 2023-12-21, matching npm. The http address of the homepage redirects to https; the https address is recorded. The docs fact is the installation page of the docs, the first page the site lists under Documentation. The runtime and runtimeMin come from the npm engines of @pattern-lab/core ("node": ">=16.20.0") and the homepage's Node-powered wording. The README's Node support policy names no number and is not recorded. The maintainer is the copyright holder of the LICENSE, the two names given there; the npm maintainers list is the same pair.
