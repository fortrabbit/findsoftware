notes: >
  The release 6.8.4 README and the requirements page (https://www.cubecart.com/requirements) both state PHP 7.4 or later with 8.4 recommended, so runtimeMin is 7.4. The README on the default branch, v6.x-master, states PHP 8.0 or later, 8.5 recommended; it describes the branch, not the latest release. Optional Elasticsearch 7.x or 8.x for search appears on the requirements page and is not recorded as a field. The extensions page lists free and paid extensions from third-party developers on a marketplace; that is not a paid edition of the software, so paidEdition is not recorded. Managed hosting (https://www.cubecart.com/hosting) and one-off or subscription upgrade services are services, not recorded as editions. The homepage states the company has been trading for over 23 years and the v6 repository's oldest release is dated 2015, so firstRelease is not recorded. The pricingPage fact is a link only. The README states Apache 2.4 works out of the box with the included .htaccess and Nginx needs rewrite rules. The forum fact is the community link in the homepage navigation and carries no quote.
