notes: >
  The project has no site of its own: the README names only the GitHub repository and the RubyGems gem, so no homepage is recorded. The maintainer follows the LICENSE copyright line, which names seven holders and no organization; the repository owner is the simplecov-ruby organization. The gem metadata lists a Google Group mailing list, which is not recorded as a forum. The README's templating mentions (ERB, Haml, Slim) describe what view coverage measures, not a templating engine the software uses, so no templating fact. runsAs is left out: the README shows SimpleCov loaded at the top of a test helper, and the README and docs/Production.md also describe measuring which lines a live process runs in production with oneshot coverage to find dead code (code that neither tests nor traffic touch), so no single value covers both. The gem bundles a simplecov command-line tool whose subcommands open, show and gate on the coverage report (README sections on the command line and on patch coverage). The README's Coverage link is Ruby's standard library, not a basedOn statement. The RubyGems download figure replaces the CSV's older count; the total is from the gem API and carries its period. The CSV row's 510.3M was an earlier reading. The release list has no prerelease newer than the stable release; the v1.0.0 release candidates are older. The README mentions alternate formatters distributed as gems and a Duel badge for another project; neither is recorded. The Ruby minimum comes from the gemspec at the v1.3.2 tag, a stated requirement of the gem.
