notes: >
  Stub, criterion 3 and the homepage are in doubt: the README names requirements and the make command but no install steps, and the homepage http://svn.uzsolt.hu/wpwmm4/ (also the GitHub repository homepage field) refuses connections on port 80 and does not answer on 443, so no homepage is recorded, and the README and the Makefile on GitHub are the only readable source. A working project site or install steps would settle it. The README requires make (BSD make, bmake on Linux) and m4, and sets no default for the output directory. The repository has no releases and no tags, so the import judges it by lastCommitDate (2020-09-12, the newest commit on master). The language is not recorded: GitHub reports Roff for the repository, which is the man page, and the README names m4 and make as the implementation tools. The contributors endpoint returns an empty list and the commits carry no GitHub login, so no count is recorded. The maintainer is the copyright holder named in COPYING, and the README author line names the same person. The author's personal site uzsolt.hu is not recorded because it is an example output of the software, not the project's site.
