notes: >
  No homepage: the GitHub homepage field is empty and the author's site neevek.net is not the project's. The repository has no GitHub release; its tags release_v0.01 and release_v0.02 are read as the release history, with the dates of the tagged commits. GitHub reports no license for the repository, and the repository has no LICENSE file; the Artistic License 2.0 is recorded from the README, which quotes it. The README gives the copyright holder as neevek, the name the project states. The README lists the Perl modules the program depends on and the install command for them; those are not recorded as facts. The PyPI package named minerl is a different project (MineRL) and is not recorded.
  The README describes tag pages, archives by month and template inheritance through a layout header. Pages are files in a _pages directory, templates in _templates and resource files in _raw, all set in minerl.cfg. The README lists the commands generate, createpost, build and serve. It names Markdown, Textile, Perl script and plain text or HTML as page formats.
