notes: >
  Repository only: the GitHub repository has no homepage, so none is recorded. The README says "This project originates from Google's golang/mock repo" and that Uber forked it, so golang/mock is the parent by fork; it is not a record id and is named here, not in forkOf. The README installs the mockgen tool with go install (the command under "Install the mockgen tool"). The LICENSE file has no copyright line; the maintainer is Uber as the README states it, and its legal name and hqCountry were not checked. Go modules have no download figure. Releases: v0.1.0 (2023-06-29) is the oldest tag of the package; the bazel_rule_v0.1.0 and bazel_rule_v0.2.0 tags and releases (2025) belong to the Bazel rules, and the newest of them is a prerelease, older than v0.6.0. runtimeMin is the go.mod go line at the latest tag (v0.6.0). The README describes three mockgen modes, archive, source and package, and says Google no longer maintains the original project. The README supports the two most recent Go releases, as the official Go Release Policy defines them.
