notes: >
  The CLI is published on npm as mint, and the install docs say so, so the registry figures are for mint. The legacy package mintlify (first version 1.0.0 on 2022-08-03, the year recorded as firstRelease) is still on npm with 100087 downloads for 2026-10-12 to 2026-10-18; the install docs say not to install it in scripts or CI, so it is not recorded as the install package. The npm package mint had another project under the same name before 2025 (version 0.3.0 dates from 2012), so the firstRelease year comes from the mintlify package history. The repository named in the npm metadata, github.com/mintlify/mint, returns 404, so no repository is recorded. The public repository mintlify/docs holds the Mintlify documentation itself under MIT and is not recorded as the software's repository. The platform is hosted and the CLI is source-available under Elastic-2.0 on npm; the Elastic-2.0 license is recorded from the npm metadata, and licenseModel source-available is the classification of that license, not a statement from the project. The docs pages name the hosting as "built and hosted on Mintlify" and the install page names Node.js v20.17.0 as the requirement, which is newer than the engines field of the package (node >=18.0.0).
