notes: >
  Status: no end signal. The repository is not archived and was pushed on 2026-11-08; the npm latest 8.4.0 is not deprecated. The v9 line is in alpha: the install page says "v9 is in alpha." and GitHub holds releases 9.0.0-alpha.0 to alpha.4 marked prerelease; the newest, alpha.4 (2026-09-26), is later than the 8.4.0 release, so it is latestPrereleaseDate. The install page names the @jsverse/transloco package with the next tag while v9 is in alpha, and the schematic route (ng add) is the recommended one; both are the same npm package, so one installMethod. The older package name @ngneat/transloco (npm, created 2019-07-29, last version 6.0.4) is the same product before the move to the @jsverse scope, and firstRelease follows it; the GitHub repository was created 2019-08-09. The LICENSE copyright line names three holders, recorded as stated; the GitHub owner is the jsverse organization. The README tagline names Angular, so basedOn angular. The README lists Server-Side Rendering compatibility and Angular compatibility; these are compatibility statements, not renderingModes or runsAs. No page says the library runs in the browser, so no runsAs. The npm figure counts @jsverse/transloco downloads, the package the install page names. The dependent counts are the ecosyste.ms npm figures for the scoped package.
