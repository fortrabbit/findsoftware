notes: >
  Doubt on criterion 3: neither the README nor the docs.rs page for 3.1.0 states how to add the crate (no cargo add or Cargo.toml dependency line); the README shows only a code example. A documented install line in the README or on docs.rs would settle it. Maintenance: the README badge and text say "This library is passively maintained to support existing users. New users are encouraged to use a different library such as tinysearch or Pagefind". Passive maintenance with a 2026 release is not recorded as an end; a reviewer decides whether the recommendation of other libraries is a successor statement. The GitHub repository has one release, v3.0.0 (2022-06-02); the crates.io registry carries 3.1.0 (2026-07-26), the newest stable version, and the same major 3. The crates.io first upload is 0.1.0 (2017-11-12). The repository has no homepage. The crate downloads figure is the 90-day count; the all-time total at the same check is 9,504,746. The README says the code includes elasticlunr.js code "Copyright (C) 2017 by Wei Song, used under license" and the license is dual Apache-2.0 and MIT under the README, with the crate expression "(MIT OR Apache-2.0) AND MIT" as stated; GitHub detects Apache-2.0 for the repository, which is not recorded as a second license statement. The 3.1.0 crate lists rust-version 1.60.0, which the README calls the MSRV. The README says the library is intended for generating compatible search indices, and its example writes the index out as pretty JSON; it names no runtime location, so no runsAs. The author's email address in Cargo.toml is not recorded.
