notes: >
  The project is on Codeberg, so the GitHub-only adoption field githubStargazers does not apply and fields.yml holds no Codeberg field; the repository had 8 Codeberg stars on 2026-10-22 (API), kept here and not as a fact. The package the install docs name is @pic0/ssg; the homepage says "New package name @pic0/ssg", and the unscoped picossg name returns not found on npm, so no record of the old name is kept. The npm package declares the license agpl-3.0 and LICENSE.md is the GNU AGPL version 3 text; the project states no version choice of its own, so the id is recorded without an or-later clause. The Node.js minimum is stated on the installation page only, with "maybe older ones work too"; npm declares no engines field. The homepage and docs state a size cap of 540 lines of code; not recorded, it is a claim the project makes about its own code size. The repository's CHANGELOG lists versions without dates, so firstRelease is not found. The repository owner is a Codeberg user account (the Codeberg orgs API answers 404 for it). The Codeberg repository has no releases; the latest release date is the npm publish date of 6.0.1.
