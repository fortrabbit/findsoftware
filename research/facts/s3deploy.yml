notes: >
  No homepage: the GitHub homepage field is empty and the README names no site of its own, so the repository is the only project link. The LICENSE copyright line dates 2018 while the repository was created in 2016; the maintainer is taken from that line as written. Deploy target: Amazon S3 and CloudFront, with CloudFront cache invalidation; no fields for deploy target exist, so it stays here. The README says s3deploy is "optimal in combination with" static site generators such as Hugo: a usage statement, not basedOn. The Homebrew install is a cask from the bep/tap tap and needs sudo, per the README. The README lists two alternatives (go3up, s3up) by name; they are not records here. Go modules have no download figure and no registry id is recorded. The install route run on a developer machine or in CI is a CLI; the runsAs local fact cites the CI statement, since the README command examples are not a runsAs statement. The first GitHub release is v1.0 from 2017-04-23 (api).
