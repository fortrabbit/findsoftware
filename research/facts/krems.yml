notes: |-
  The repository names no homepage, so none is recorded; the README points to an example site (mreider/krems-example) that is a demonstration of the software, not its home page. The LICENSE copyright line reads "Copyright (c) 2025" with no name, so the maintainer comes from the GitHub profile name, and the profile's employer is not recorded. The releases list holds ten version tags from v0.1.26 (2025-05-11) to v0.2.48 (2025-10-10), all stable, so firstRelease is 2025 and currentMajor is 0. The go.mod states go 1.23.5, which is the Go version the source is built with; no page states a runtime requirement for running a built site, so runtimeMin is not recorded. The README says the GitHub Action generates the site on push and commits it to the gh-pages branch, which GitHub Pages serves. The Obsidian plugin (mreider/krems-obsidian-plugin) and the GitHub Action (mreider/krems-deploy-action) are separate repositories named by the README and are not recorded here. The README says the default CSS works with standard Bootstrap HTML classes; no basedOn is recorded because Bootstrap is a CSS class convention, not a parent project.
   The maintainer name is the GitHub profile name Matt Reider (the profile lists Dynatrace as employer, not recorded).
