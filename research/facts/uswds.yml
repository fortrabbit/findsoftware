notes: >
  The README and the install guide name npm as the recommended route; the package @uswds/uswds is the one the install guide names, so the npm figures are that package. The GitHub API reads the license as NOASSERTION; the LICENSE.md at v3.14.0 states the public domain dedication for the project and lists the parts under other licenses, recorded here only as notes: Apache-2.0 for the Roboto Mono fonts and the Material Icons, SIL OFL-1.1 for the Source Sans Pro, Merriweather and Public Sans fonts, MIT for files modified from normalize.css and modern-normalize; the LICENSE presents CC0 as the license of the project and the rest as parts, so only CC0-1.0 is a license entry. The npm metadata reads "SEE LICENSE IN LICENSE.md". The npm weekly figure is the sum of daily downloads for 2026-10-19 to 2026-10-25 from the range endpoint; the first three days of that window read zero. The HTTP Archive figure is the mobile origin count of the technology "USWDS". The maintainer is recorded as the GSA named on the policies page; the npm author is "18F", a team the about page says was decommissioned, and the about page says the product is "maintained by the Digital Services Division" under GSA's Technology Transformation Services. Reviewer decision: whether the maintainer is GSA or the Digital Services Division. The package.json at v3.14.0 declares engines node >=20 and the repository holds an .nvmrc; these are the requirements of the npm and Sass build, not a runtime of the live site, so no runtime is recorded for this CSS and JavaScript package. The package.json at v3.14.0 lists lit as its only dependency, used by one component; a dependency is not a basedOn statement. The README states that USWDS 1.x and 2.x are no longer maintained; that names older majors, not an end of the project. The README states that the CSS is built from Sass source. The install steps and the Sass load path are read from the developers page and the README. The README says customizing the JavaScript requires Node.js and a module bundler such as Webpack or Browserify, which the developers page repeats. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header (page 197).
