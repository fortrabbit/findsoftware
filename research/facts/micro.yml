notes: >
  The repository is the project's only web presence named in the sources; the readme names no project site, so no homepage is recorded. The readme says "Micro was created for use within containers and is not intended for use in serverless environments", which is a reservation for the record prose. The highest stable GitHub release is tagged 10 (2022-11-26); npm latest is 10.0.1 from the same day, so the major is 10. The oldest GitHub release is dated 2016-07-28. The npm engines field of the latest release reads ">= 16.0.0". The license copyright line names Vercel, Inc. as the owner; the readme does not name a parent company, so parent is absent. The readme also names micro-dev as the development tool. The weekly npm downloads cover 2026-10-12 to 2026-10-18.
