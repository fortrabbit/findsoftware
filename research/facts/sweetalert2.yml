notes: >
  The homepage https://sweetalert2.github.io/ answers 200, but its body is a script shell with only the page title in text, so its text is read from the documentation site's source repository sweetalert2/sweetalert2.github.io (index.html for the description, src/components/Installation.tsx for the install routes). The package.json description calls the project a "supported fork of sweetalert", which is the forkOf statement. The LICENSE copyright line names two holders, Tristan Edwards and Limon Monte, recorded as one maintainer value as the line states it. The README has a sponsor section with advertising for unrelated products; none of it is a fact. The docs site's Installation page also lists framework integrations (React, Angular, Laravel) that are separate packages, not install routes of this package. The jsDelivr CDN route is the one the install page names; the site's usage examples load the same bundles from a local file, which is not a separate route. The npm figure is for sweetalert2, the package the install page names, and the week is 2026-11-01 to 2026-11-07. The release list shows stable releases in 2026, so the status stays accepted.
