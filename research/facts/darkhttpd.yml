notes: >
  Accepted: the project's own homepage (https) names the software, the ISC license and the static-only limitation, and the repository is not archived and was last pushed 2026-08-24. The latest stable release is v1.17 dated 2025-07-24, so currentMajor is 1; the minor line 1.17 is not recorded as a field. The oldest GitHub release is v1.13 dated 2021-01-17, which is also the repository creation date; the copyright lines date the code to 2003, but no release before 2021 is listed, so firstRelease is 2021. The homepage copyright line names Emil Mikulic (2003-2021) and COPYING names the same person (2003-2024); the individual is recorded as the maintainer. The homepage says it only serves static content, with no CGI; that statement is kept in notes and not recorded as a rendering mode. The README describes a single-threaded event loop and a --daemon option that writes a pidfile. The README gives make as one install route and a Docker build from the repository Dockerfile as another; no registry image is named there, so no dockerPulls is recorded. The docs fact is absent: the homepage and README are the only documentation. The homepage nav has no social links. Features the homepage lists, kept here for the prose: directory listings, HTTP GET and HEAD, range requests, If-Modified-Since, keep-alive, IPv6, 301 redirects by Host header, access logging, chroot and privilege dropping, and no configuration file beyond the web root argument.
