notes: >
  The Packagist package mongodb/laravel-mongodb is the one the get-started guide installs (composer require mongodb/laravel-mongodb:^5.12); the GitHub repository is mongodb/laravel-mongodb with default branch 5.x. The README says the package was renamed to mongodb/laravel-mongodb after a transfer of ownership to MongoDB, Inc., and the docs say it was formerly named jenssegers/mongodb. The former package is named in notes only; firstRelease is 2013 from the Packagist upload v1.0.0 dated 2013-08-18, the same day as the oldest GitHub release. The docs say the package is compatible with Laravel 10.x and later, and composer.json requires illuminate components for Laravel 12 and 13; neither is recorded as a field. The get-started guide connects the application to a cluster on MongoDB Atlas with a connection string and says that a deployment not hosted on Atlas connects through connection strings in the Server manual, so Atlas is not required. The get-started guide lists the MongoDB PHP extension as a requirement (ext-mongodb in composer.json); it is a runtime dependency, not a field. The stable major is 5, from v5.12.1 published 2026-11-13 on GitHub. The newest prerelease tag, 5.0.0-rc1, is older than the stable release and is not recorded. The LICENSE names MongoDB, Inc. with no trailing period, and the terms page names MongoDB, Inc. as the contracting party; the maintainer follows the LICENSE line and the hqCountry value rests on the terms page sentence that places MongoDB's site control in New York, USA.
