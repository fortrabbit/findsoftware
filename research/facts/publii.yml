notes: >
  The project is a desktop application, so the install is an installer per operating system and the authoring runs on the author's computer; the live site is static files. The system requirements page lists Windows 10 or later (64-bit), macOS 12 or later and a 64-bit Linux distribution; no field holds operating system requirements, so they are not recorded. GitHub reports HTML as the main language by file size, which does not state the project's language, so language stays out. The homepage line "No database. No PHP." is about the published site, so databases stays out. The Publii terms name the operator as a sole trader ("TIDYCUSTOMS Boguslaw Mitro") under the Polish business register CEIDG, so maintainerType is left to the import. The site footer reads "TidyCustoms", a trading name; the maintainer field keeps the legal name the terms give. The marketplace sells premium themes and plugins and a premium support tier; none is a paid edition of the software, so paidEdition stays unknown. The site names WordPress, Joomla and Medium in comparison pages; no alternativeTo fact is recorded because the comparison pages are the project's own marketing. The latest release tag is "v.0.48.1-build-17565" on GitHub.
