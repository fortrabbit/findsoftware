notes: >
  Maintainer: the GOVERNANCE file names the Micronaut Core Developer Team as the maintainers under a project lead, and the README says the core team maintains the project through the support of the Micronaut Foundation; no legal notice naming the Foundation's legal form was found, so hqCountry and the legal name stay unknown. The current docs redirect to the 5.2.x line, which matches the highest stable GitHub release v5.2.20 (2026-10-23), also the Maven Central release. The default branch is 5.3.x and is not the release line. The runtime minimum comes from the 5.x what's new page, which states a JDK 25 baseline for Micronaut 5. Commercial support from Oracle (GraalVM Development Kit) and Object Computing is listed on the support page and is not recorded as an edition, so paidEdition stays unknown. The docs source in the repository is the 5.2.x branch. The Maven artifact recorded is the core module; the platform BOM is published as io.micronaut.platform:micronaut-platform and is not recorded. The download figure is not on Maven Central, so none is recorded. The record covers the core repository only; the Micronaut Launch generator and the other modules are separate repositories.
