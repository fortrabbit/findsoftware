notes: >
  Maintainer from the LICENSE copyright line (2015-2023); maintainerType is left to the import. Runtime node is recorded because the usage page names both browser deployments and Node.js deployments (Server-Side Deployment using Node.js); no runsAs is recorded for the same reason. The usage page says Vega "can be deployed for interactive visualizations within a web browser, or to render static PNG and SVG images server-side". The homepage says views are generated "using Canvas or SVG"; rendering target is a coined kind and stays here in notes. vega-cli (node command line tools for PNG, SVG and PDF output, depends on node-canvas) is a separate npm package and is not recorded as a record. The npm dist-tag "v5-maintenance" carries the 5.33.1 line; the current major is 6 from the GitHub release v6.4.0. firstRelease 2013 is the oldest npm upload (1.0.0, 2013-04-02); the oldest GitHub release is v2.0.0 (2015). Stars and contributors belong to the vega repository. npm weekly figure covers 2026-11-01 to 2026-11-07. Vega-Lite compiles to Vega specifications. The locale API formats numbers and dates with d3-format and d3-time-format locale definitions, which is the basis of the i18n entry. The slack link is the Vega Slack invite on the homepage. The homepage names an Altair Python API for Vega-Lite, which is not a record in this dataset.
