notes: >
  The CSV homepage is http://leafo.net/lapis/; the same path answers over https after a redirect, so the https address is recorded. Lapis is a framework without its own HTTP server: the server backends page lists OpenResty, cqueues with lua-http, and golapis (experimental), and OpenResty is the default that the getting started guide describes. OpenResty is the server the project targets, not a parent the project says it is built on, so basedOn is not recorded. The repository language is MoonScript; the framework supports both Lua and MoonScript applications, and both are recorded. The repository's first tag is v0.0.1, dated 2013-07-23 by its commit, which gives firstRelease 2013; the earliest GitHub release is 1.6.0 (2017). The Lapis Console and the lapis-* repositories linked from the homepage are separate projects and are not recorded. The homepage and the reference manual state version 1.20.0 as the latest release.
