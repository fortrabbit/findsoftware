notes: >
  Dash Enterprise is the paid edition. The deployment page lists its LDAP and SAML authentication, so sso is not recorded for the open-source package; the README places "Dash Enterprise supports LDAP, AD, PKI, Okta, SAML, OpenID Connect, OAuth, SSO" under the paid product. The installation page states Python 3.8 and the registry states >=3.9; both are recorded as runtimeMin entries. runsAs is not recorded: the deployment page says apps are published to a server on Plotly Cloud or Dash Enterprise but states no server process; the README says open-source apps run on a local workstation. Plotly Technologies Inc. is the legal name on the terms page; no page names the headquarters country, and the terms are governed by Ontario law, which is not a headquarters statement. The repository is MIT with copyright "2015-2024 Plotly Technologies Inc." in its LICENSE. firstRelease is the oldest PyPI upload (0.17.4, 2017), older than the first GitHub release (v1.1.0, 2019). The GitHub repository was created in 2015 and is not used for firstRelease. Discord, X, Bluesky and the community forum are the links on the homepage. Coined here: hostedOffering (Plotly Cloud, free to start per the deployment page; no prices recorded).
