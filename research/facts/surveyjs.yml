notes: >
  Accepted on criterion 1 (a form library a web application embeds to render and collect responses), 2 (MIT source on GitHub with npm packages), 3 (npm install and Get Started pages) and 5 (4,919 stars, 145 contributors, a company behind it). The repository is a monorepo: the core package is survey-core, which the README calls "the framework-independent survey-core package", so the npm figure and npmName are survey-core, the package the monorepo rule names. The framework packages survey-react-ui, survey-angular-ui, survey-vue3-ui and survey-js-ui are installed by the README's four npm routes; only the React route's quote is recorded as installMethod npm, and the other three are the same route with a different package. The plain JavaScript guide loads survey-core and survey-js-ui from unpkg.com with link and script tags. The README's rendering packages are the framework ports: basedOn is not recorded, because the README calls survey-core framework-independent, and the React, Angular and Vue packages are rendering layers, not a parent. The major is 3 from the highest stable GitHub release, v3.2.4, which matches npm latest for survey-core; the release line v2.5.x is a separate line on the same repository and is not the major. The latest release is v3.2.4 published 2026-11-03. The oldest GitHub release is v0.7 (2015-09-25). License: the repository license and the README are MIT and are one entry; the paid products are separate. The licensing page says "To integrate and use the SurveyJS proprietary components — Survey Creator, PDF Generator, and Dashboard — in your applications, you must purchase a developer license": these are proprietary products of the same project under a developer license and an EULA, recorded as paidEdition; prices and tiers are not recorded. The WordPress plugin and the AI Form Response Extractor appear on the product list and are not part of this record. The API is the JavaScript Form Library API (the model in the browser) and the RESTful choice loader for dropdowns; the library serves no API of its own, so headlessApi is not-found. The company's legal name and address are on the contact page: Devsoft Baltic OÜ, Maakri tn 19/1-7K, Tallinn, Estonia. The social links are the footer icons, and the footer names them only by icon, so x and facebook have no quote; the homepage footer link to X is https://twitter.com/surveyjs and the link to Facebook is https://www.facebook.com/SurveyJS/. The README says the library "does not require a SurveyJS backend" and that responses go to whatever backend the developer uses; that is the runsAs and data-flow statement, not a field.
