notes: >
  The homepage given in the candidates row, http://www.dropzone.dev/js, returns 404 after redirect; the https homepage www.dropzone.dev answers 200 and is recorded. The repository is a monorepo (packages/dropzone for the library, apps/docs and apps/website for the docs and site), so stars and contributors belong to the repository. The npm install route is not recorded as an installMethod: the README and the docs page show npm and pnpm commands only in code blocks, and no sentence names the route. The npm figure counts downloads of the dropzone package, which those commands install. The Packagist package enyo/dropzone has its source in a separate repository, enyo/dropzone-packagist, and no Packagist download figure is recorded. The stand-alone docs page calls the unpkg route an option it does not recommend, and names version 5 in its script tags; the README shows version 6, so the CDN route is recorded from the sentence only. The homepage calls the library free and fully open source; that is not a license statement, and the license is recorded from the LICENSE file. The docs installation page (installation/) is a choice page and names the two routes that are recorded. The homepage names a jQuery plugin build; no field records it. The Dropzone home page says the project started in 2012, which matches the first npm version 0.1.4 on 2012-05-18; the repository was created 2012-02-12. The release for 6.3.5 is tagged dropzone@6.3.5 and is the highest stable release.
