notes: >
  Ionic Framework is the open source part; its commercial products (Appflow, Identity Vault, Portals and others) are not editions of it, so no paidEdition is recorded. The project's announcement of 2025-02-11 says new customer sales of those commercial products were discontinued; the framework and Capacitor are stated to continue, so the status stays accepted. The Ionic CLI installs through npm and is not a runtime of the framework itself. The first @ionic/core npm version dates from 2017, but the repository was created in 2013 and no page states the first release year, so firstRelease is not recorded; the support policy page dates V1 to May 12, 2015, and the announcement says the team started Ionic in 2012. The docs also show the framework loaded from a CDN with a script tag, without a JavaScript framework. The only stated requirement is Node and npm for the tooling. The LICENSE copyright line names Drifty Co.; no page gives a legal form for it. The @ionic/core package is the core package of the monorepo; the npm figure is for that package and not for the framework wrappers.
