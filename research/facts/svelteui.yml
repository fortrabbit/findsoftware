notes: >
  The install guide in the docs source is the project's installation page; the rendered site is the shell above, so the install quotes come from the source file. The guide's npm and yarn commands install the packages named in its code (@svelteuidev/core and @svelteuidev/composables), and the npm figure counts the core package only. The README says the project is SSR compatible and works with SvelteKit; that is compatibility, so no renderingModes is recorded. The README's packages list names @svelteui/core, while the npm package is @svelteuidev/core, and no npm package named @svelteui/core was found; the record follows the npm name. The README's contact line gives a personal Twitter account of one maintainer; it is not recorded as the project's x field. The maintainer is recorded as the LICENSE copyright line words it, "Kamell"; the package.json author field gives the full name Kamell Perry. The major is 0 because the latest stable release is 0.15.7, and the README's roadmap runs to a 1.0.0 release that has not been published. The last GitHub release is from 2024; the repository was pushed to in 2026 and the npm package is not deprecated, so no end signal is recorded. The CSV's npm figure is stale; the figure here is the period 2026-10-19 to 2026-10-25.
