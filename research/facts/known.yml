notes: >
  The repository is named idno/idno; the opensource page links releases under github.com/idno/known and says "Download Known 1.6.2", while the latest release is 1.6.4, so the release note on the site lags the repository. The composer.json at 1.6.4 names homepage https://idno.co/, the same address the README names for learning more about the project, so idno.co is the recorded homepage; withknown.com is the hosted service and the source of the opensource page and docs links. GitHub reports the license as NOASSERTION because the LICENSE file is a copyright header with Apache text, not the standard license file, so the license entry cites composer.json. The docs site states PHP 8.1 or above; the dev branch README and composer.json state 8.3, which is why runtimeMin is read from the 1.6.4 tag. The hosted option is a service of the same project at withknown.com ("Host your site on our service, or install it on your own server"), so the status stays accepted. Packagist has no package idno/idno (404), so packagistName stays unknown. The 1.6.4 README contains affiliate links to a hosting provider; they are not recorded. The contributors count reads the API with anon=true and per_page=100. Known's README uses the name Idno and the site uses Known; the record name follows the CSV. The 1.6.4 README says events such as Webmention pings and ActivityPub deliveries run inside the web request by default; the asynchronous queue moves them to a background worker, which it says is required for ActivityPub, and the worker can be started by systemd or once a minute by cron.
