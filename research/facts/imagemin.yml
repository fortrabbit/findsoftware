notes: >
  No project website: GitHub's homepage field is empty and npm points to the repository README, so no homepage is recorded. The README is the only documentation page. Highest stable GitHub release is v9.0.1 (2025-03-07), which matches npm latest 9.0.1; the repository has tags back to v0.4.7 and GitHub releases back to 5.0.0 (2016), so firstRelease is the oldest npm upload, 0.1.0 on 2013-08-30. The package.json has no author field; npm lists sindresorhus as the only maintainer, and the LICENSE copyright line names the Imagemin organization, which is the maintainer recorded. The README's Related section names imagemin-cli as the CLI for this module, a separate package not recorded here; runsAs is local: the README documents writing optimized files to a destination folder, a file-processing step that is not part of a live site. The last commit on the default branch is 2025-03-07, the same day as the latest release, so the project is not declared ended by any signal checked. npmWeeklyDownloads counts the full week 2026-09-28 to 2026-10-04 per the brief; dependentPackages and dependentRepos are ecosyste.ms counts for the npm package. The README's plugin link names the npm keyword page, a discovery directory, recorded as pluginDirectory only.
