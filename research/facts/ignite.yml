notes: |
  The repository has no homepage in its GitHub settings, and the README names no project site (the samples site ignitesamples.hackingwithswift.com is the author's sample output, not recorded as homepage), so the record is repo-only. The README badge says macOS 14.0+; Package.swift sets platforms macOS 13, which the record does not state as a runtime fact. The runtime and runtimeMin come from the Package.swift comment that declares the minimum Swift version. The GitHub releases list holds two releases (0.6.4, 2026-03-02, and 0.6.3, 2026-02-04); the tags go back to 0.1.0, dated 2024-03-22 by its commit, which gives firstRelease. The version is 0.x, so currentMajor is 0. The README describes a local web server for previews, and building with Xcode on My Mac. The starter template IgniteStarter is a sibling repository and is not recorded.
