notes: >
  The project has no website of its own: the gemspec homepage and the RubyGems homepage_uri both point to the repository, so no homepage is recorded and the documentation link is the RDoc page. The rubygems total is the downloads figure of the simple_form gem the install route names, taken from the RubyGems API; the total is since listing, not a period. The stable line is 5.x: v5.4.1 (2026-01-05) is the highest stable GitHub release, and the v3.1.0.rc2 prerelease (2014) is older, so no latestPrereleaseDate is recorded. The oldest RubyGems upload of the simple_form gem, 0.4.0, is dated 2009-11-09, which sets firstRelease; the oldest tag v1.0.0 is dated 2010-02-06 (committed date of the tagged commit). The gemspec's required_ruby_version at the v5.4.1 tag is the runtime minimum; the README says the project maintains support for all Ruby and Rails versions that have not reached end-of-life and names no version number, so no Rails minimum is recorded. The maintainer is recorded from the current copyright line (2020-CURRENT); the other copyright line, 2009-2019 Plataformatec, names a company that the LICENSE file no longer carries as the current holder, so it stays here as a note. The README's logo is licensed under Creative Commons Attribution-NonCommercial-NoDerivatives; that is the logo's license, not the software's, and is not a license entry. The basedOn rails entry rests on the README tagline "Rails forms made easy.", which names Rails as the target framework. The DSL is inherited from Formtastic according to the README; Formtastic is not a basedOn statement, since the README says the DSL was inherited, not that the gem is built on it. The install generator has options for Bootstrap 5 and Zurb Foundation 5 wrappers; these are generator options, not a parent. The i18n entry means the gem looks up its labels, hints and placeholders through the Rails I18n API, as the README section I18n states. The gemspec dependencies (activemodel and actionpack at 7.0 or later) are package dependencies and are not recorded. The HTTP Archive technologies file lists no Simple Form entry, so httpArchiveSites is absent.
