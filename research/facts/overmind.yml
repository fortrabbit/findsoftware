notes: >
  The GitHub releases are named by date (v2025-12-05_1709), so they carry no major; currentMajor 28 comes from the npm latest version 28.2.1, which has the same publish time as that release, and the homepage shows the same major. The npm history reaches back to 2013 (0.1.0), before the repository was created (2018-06-18), so the npm dates belong to another project and firstRelease comes from the oldest GitHub release, 2018-09-09. The npm dist-tag next (a version with a timestamp suffix) is a canary build, not a prerelease. The default branch is next. The view packages are separate npm packages named by the install page: overmind-react, overmind-vue, overmind-angular and overmind-svelte, so the core is framework-agnostic and no basedOn is recorded. The npm figure is the overmind package, 2026-11-01 to 2026-11-07. The docs are a GitBook site on overmindjs.org; the quickstart shows the install lines. The server-side rendering page shows an Express example, but no page states a Node.js requirement, so no runtime is recorded. The devtools page offers a VS Code extension and a standalone app, not recorded as fields. Discord link taken from the introduction page, which points readers there for support. The homepage describes a single state tree, state changes made only in actions, and effects that wrap third-party APIs; the view packages connect that core to each framework. The server-side rendering page describes rendering the same configuration on the server, with the mutations rehydrated on the client. The homepage says everything that happens in the app is tracked by the devtools, effects and reactions included, and the devtools page describes a standalone app and a VS Code extension.
