notes: >
  The CSV homepage was http://www.babylonjs.com; the site answers 301 to https://www.babylonjs.com/, which is recorded. The npm install command in the README names babylonjs (the UMD core); the docs name it as the core package beside the ES6 packages (@babylonjs/core, ES6 with tree shaking). npmWeeklyDownloads is the babylonjs figure for 2026-10-26 to 2026-11-01, the period in the value, and it is 41,002, far below the CSV's 252.9k per week, which the discovery pass read for @babylonjs/core. The npm figure follows the package the README names (babylonjs); the @babylonjs/core package, the ES6 package the docs name beside it, had 384,844 downloads for the same week. Maintainer: the Apache license file has no copyright line, and the homepage and docs name no company for Babylon.js; the npm maintainers list includes Microsoft accounts (microsoft1es, microsoft-oss-releases), and "by Microsoft" appears on the homepage only beside the Xbox Design Lab demo. The record uses the GitHub organization BabylonJS as maintainer. The README says Node.js 22 and 24 are development-tool requirements that "do not change the runtime requirements of the published Babylon.js libraries", so no runtime or runtimeMin is recorded. The CDN page says "The CDN should not be used in production environments." and that its purpose is to serve packages to users learning the platform or running small experiments. The packages index says to choose one delivery method (CDN, npm or ES6) because mixing two "will ensure failure". The Babylon.js Editor, the Inspector, Babylon Native, Babylon React Native, Babylon Lite and the exporters are separate projects or tools of the same organization and are not recorded. The homepage's social links are the forum, YouTube, Medium and X (twitter.com/babylonjs); no Discord, Bluesky or Mastodon link found. The oldest GitHub release is v1.2.1 (2013-08-17), older than the npm upload of 1.9.0 (2014-03-12). The HTTP Archive "Babylon.js" entry uses the mobile origins figure (140); desktop is 103. The npm dist-tag preview points to 5.0.0-rc.13, older than the latest stable release, so no latestPrereleaseDate. ecosyste.ms counts are for the babylonjs npm package. The repository has no paid tier of the engine itself.
