unreadable: [https://extensions.typo3.org/]
notes: >
  Code review runs on Gerrit (review.typo3.org); github.com/TYPO3/typo3 is a synchronized mirror without GitHub releases, so contributors is left out. typo3/cms-core is one of many split core packages; its Packagist downloads stand for the core, not for sites. forum points to the typo3.community hub, which typo3.org links without naming a forum. hqCountry is the TYPO3 Association's seat (Sissach, Switzerland). No headless API was found in core docs. paidSupport is coined for paid vendor support of an open-source release (ELTS), distinct from paidEditions. The extensions.typo3.org page renders without readable content; the count comes from its public API instead.
