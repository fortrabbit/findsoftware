notes: >
  The project is the API service behind the surmon.me blog; its README lists the blog's Vue site, admin site (React), AI agent and native app as separate repositories, so no admin UI is recorded for this record. The architecture document calls it "a blog CMS backend built on NestJS" on a Fastify runtime, with JWT sign-in for one Admin account, OAuth login (Google, GitHub) for users, outbound webhooks, scheduled database backups and an AI module for summaries and comment replies. The repository description is the project's own wording and is the source of the headless-cms category. github.surmon.me/nodepress is the README rendered on the maintainer's domain, so it is recorded as docs and not as a homepage; the project has no other site. firstRelease is not recorded: the earliest GitHub tags predate the oldest GitHub release (v3.4.4, 2020-12-22), and the changelog lists v1.0.0 and v1.2.0 without dates. The runtime Node 22 comes from the engines field of package.json; the README does not state a Node version. The README lists MongoDB and Redis as required and gives install, build and start commands in its Development section; it has no separate deployment page.
