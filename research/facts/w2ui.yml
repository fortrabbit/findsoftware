notes: >
  The npm package w2ui (latest 2.0.0, MIT) is not named by the install docs, which point to the w2ui-starter-es6 repository and the zip download, so no npm figure, npmName or dependent count is recorded; a reviewer decides whether the package belongs to this record. The README says the current stable version is 1.5 and that 2.0 is the development version on master, while the GitHub release 2.0.0 (2023-04-26) and the homepage ("Version 2.0") present 2.0 as current; currentMajor follows the highest stable GitHub release, so it is 2. The README says version 2 "no longer requires jQuery as a dependency", and the homepage says the widgets can also be used as jQuery plugins for backward compatibility; the jQuery plugin use is not a basedOn statement. The README and homepage say the library works with Angular, React and Vue projects; that is compatibility, not basedOn. The maintainer name is the author field of the npm package, not of the repository; the LICENSE copyright line names only an email address. The firstRelease year is the date of tag 1.0 (commit 2012-07-09), the oldest tag, since the GitHub release list starts at 2.0.0 and the npm package starts at 1.5.0 in 2015. The support page names a Telegram chat (t.me/w2uisupport) as the main support channel; no field fits it and it is not recorded. The 2.0 homepage says "Only ~213kb (JS + CSS)" and the README says 120KB gzipped; sizes are not recorded. runsAs and renderingModes are not recorded, since no page states that the library runs in the browser. The 2.0 homepage also states "Code licensed under the MIT License".
  check-quotes cannot verify the TLS chain of w2ui.com, so the four quotes on w2ui.com/web and w2ui.com/web/get-started (homepage, both installMethod entries, the CC BY 3.0 license entry) were confirmed by hand with curl on 2026-10-28; the CC BY 3.0 sentence is split by a link tag in the HTML.
