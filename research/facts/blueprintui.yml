notes: >
  Monorepo: the install docs name @blueprintui/components, so the registry figures, the major and the release date come from that package (GitHub tag prefix @blueprintui/components-v). The repository's own LICENSE.md says the packages carry different license agreements; every package it lists, and the package LICENSE checked, is MIT, and the SVG icons come from Clarity Design Assets under MIT too. The GitHub API reports the repository license as NOASSERTION. The npm package author is Crylan Software; the legal name comes from the copyright line. The GitHub organization location reads United States of America, which is not a legal notice, so hqCountry stays unknown. The npm first version (0.0.0) dates from May 2022. The getting-started page says that building the components as Web Components enables them to work in a variety of frameworks and libraries, and that they can be loaded from a CDN. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header.
