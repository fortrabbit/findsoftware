notes: >
  The README (main branch) places the gem in maintenance mode as of February 2026: no new features, components or significant enhancements; security updates, dependency bumps and critical bug fixes continue; issues and discussions stay open without a guaranteed response. The README and the Rails guide encourage GitHub's internal consumers to migrate to Primer React (github.com/primer/react), and say non-GitHub consumers should consider forking. Maintenance mode is no end signal, so the status stays accepted. The gem's pre-1.0 status (major 0) is stated in the README: breaking changes are likely in patch releases. The gemspec at v0.53.5 requires Ruby 3.2.0 or later and lists view_component, actionview, activesupport and octicons as runtime dependencies; the dependencies are not recorded as basedOn. The Rails guide calls the gem an implementation for Ruby on Rails built using ViewComponent; ViewComponent is named as the building technology, so it is not recorded as basedOn. The maintainer is GitHub: the gem's authors field says "GitHub Open Source", the LICENSE copyright line says "Copyright (c) 2020 GitHub", and the GitHub terms name the legal entity GitHub, Inc.; no page read gives the company's country. The npm packages @primer/view-components, @primer/css and @primer/primitives are named in the install guide as companions; npm is not the primary install and no npm figure is recorded. The gem's total downloads come from rubygems.org; the ecosyste.ms figure for the same gem is 464590 at the time of reading and is not recorded. The homepage is the Primer design system documentation, which also documents primer-css and primer-react. The repository's first gem upload (0.0.1) is 2020-08-03, the earliest GitHub release is v0.0.3 from 2020-08-13, so firstRelease is 2020 from the registry.  The /components/ URL answers with a 308 redirect to /product/components/, which was read.
