notes: >
  No stable release exists on GitHub or npm. The GitHub releases are 2020 prereleases of the v1 line (v1.0.3-x, v1.0.1-x) and the v2 line is tagged only as alpha (v2.0.0-alpha.15 and alpha.13). The npm dist-tag latest is agnosticui-cli 2.0.0-alpha.25 (2026-04-30); agnosticui-core is at 2.0.0-alpha.30 (2026-06-30), which is the latestPrereleaseDate. The install page offers two paths: the CLI (recommended) and the npm package agnosticui-core; the registry figures are for agnosticui-cli, the recommended path, and agnosticui-core had 24 downloads in the same week. npmWeeklyDownloads is the sum of the daily downloads for 2026-10-18 to 2026-10-24 from the range endpoint. The install page is headed "Experimental Alpha" and says "This library is a work-in-progress. We are releasing it early to gather feedback, but it is not ready for production." Nothing there ends the project, so the record is accepted on criteria 1 to 5, with currentMajor and latestReleaseDate absent because no stable version exists; a reviewer may want the alpha label on the record. The npm package named agnosticui does not exist. The v1 packages (agnostic-react, agnostic-vue and so on) are the legacy line named in the README, not this record. The organization has no legal name on the homepage, installation, about, terms or license pages, so the maintainer is recorded as the README names it and maintainerType is left to the import. The CLI runs under npx, so Node is implied, but no page states a runtime. The install page says the project needs a build tool that compiles TypeScript (Vite, esbuild or rollup); no runsAs or renderingModes is stated. HTTP Archive has no technology named for AgnosticUI.
