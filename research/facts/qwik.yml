notes: >
  The candidate row names the record "Qwik and Qwik City"; the project's homepage says "Qwik", so the fact file covers the framework. Qwik City ships in the same repository as the package @builder.io/qwik-city (weekly npm downloads 21344 for 2026-10-12 to 2026-10-18) and may get its own record with basedOn set to Qwik. The getting-started page and its examples install and import @builder.io/qwik, whose npm latest tag is major 1, so npmName and currentMajor follow it. The package @qwik.dev/core has 2.0.0-rc.3 as its npm latest tag (published 2026-10-13) and the docs carry a "Qwik v2" banner, but the install docs do not name it. The Node.js minimum is the getting-started page's "Node.js v18.17 or higher"; the v2 package declares a higher engines range, which is not recorded. The LICENSE names QwikDev (2024) and BuilderIO (2021); the maintainer field keeps QwikDev, and no legal entity was found on the pages read. The renderingModes and runsAs values follow the self-hosting page: the static adapter output is copied to a web server, and the Express or Fastify adapters produce a Node.js server that runs under a process manager.
