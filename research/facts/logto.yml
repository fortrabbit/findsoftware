notes: >
  Open-source record with a vendor cloud (Logto Cloud) and a paid self-hosted license. The root package.json and the core package.json at tag v1.45.0 declare node "^22.14.0"; the OSS get-started guide lists "Node.js ^26.0.0" as its prerequisite. runtimeMin records the manifest value. The guide's prerequisite line is not used for runtimeMin. The docs' Docker Compose command is for local development: the guide says not to use it for production. The image named first in the docs is ghcr.io/logto-io/logto; the guide also names svhd/logto on Docker Hub, which the docs do not present as official, so dockerPulls is not recorded. npm init @logto runs the @logto/create scaffolder (its weekly downloads are not the server's figure); the server package @logto/core is not published on npm, so no npm figure is recorded. The compare pages for azure-ad-b2c, stytch and workos exist without fact files and are not recorded as alternativeTo. The self-hosted license page lists SAML apps as limited to 3 without a license. The README says SDKs for 30+ frameworks; SDK figures are not recorded. Other community links: the README gives discord.gg/vRvwuwgpVX as its Discord invite, a second link to the same community, and YouTube (youtube.com/@logto-io) is not a field. Compliance claims: SOC 2 Type II on the trust page. Logto Cloud regions named on the trust page are Europe, Australia and the US. The docs say the cloud service includes Free, Pro and Enterprise plans (a free tier, not a field); no prices. The PostgreSQL requirement is ^14.0 per the guide. The repository is the public source of the OSS server.
