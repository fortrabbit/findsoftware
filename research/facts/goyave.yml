notes: >
  The homepage is https and answers 200. The README gives the framework's own scope (REST APIs, with non-goals listed) and the copyright holder is named in the LICENSE, not an organization; repoOwnerType is the GitHub organization go-goyave. The install docs name the Go module goyave.dev/goyave/v5 and a template project installer (install.sh and install.ps1); no PyPI-style registry figure exists for a Go module, so no download figure is recorded. The go.mod declares go 1.26.0; no page states the minimum runtime, so runtimeMin is left out for the reviewer to decide. The database page lists drivers by heading and DSN example; each driver is one databases entry with its own DSN example quoted. The database page says the framework uses the Gorm ORM; Gorm is not recorded as basedOn because it is a dependency, not the parent. The README and homepage name companies using Goyave in production but the logo list is not readable as text, so no user is recorded. The oldest GitHub release is v1.0.0 (2019-11-17). Contributors are counted across all pages with per_page=1. The LICENSE file's copyright year is 2026 and the README gives 2024; the maintainer fact names only the holder, so neither year is recorded.
