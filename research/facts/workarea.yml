notes: >
  The GitHub releases API lists 8 releases, the highest v3.4.19 (2019-10-17); the repository tags run to v3.5.27 without releases. currentMajor is 3 on either source. latestReleaseDate is the rubygems date of the newest gem version, 3.5.27 (2021-07-19), because the GitHub releases stop at 2019; a reviewer should decide whether the releases API or the registry governs this field. The repository's license field is NOASSERTION on GitHub; the LICENSE file is the Business Source License 1.1 text with Licensor WebLinc Corporation, Change Date 2019-08-20 and a Change License of GPL 2.0 or later; the README and gemspec name the Business Software License, a different name. Each statement is recorded as its own license entry, and licenseModel is recorded from the LICENSE file only, so a reviewer should decide whether the product is source-available or commercial. The LICENSE grants production use except for a Commerce Service, so the license limits the use rather than being an open-source license. The runtimeMin figure is taken from the Getting Started article, which states Ruby 2.4.0 up to but not including 2.7.0 for that setup; the gem's own requirement is not stated on a page. The README names MongoDB, Elasticsearch and Redis; only MongoDB is in the register's database vocabulary, so Elasticsearch (search) and Redis (queue and cache) are kept here and in the prose. The Commerce Cloud page and the hosting article name multi-site, B2B and order management as features of the cloud subscription, and no price or edition page was read; no paidEdition is recorded. The README's plugin list names open-source plugins only as examples; plugin count is not stated. The homepage title is the only homepage statement read; the developer documentation at developer.workarea.com answered 200 and was read for install, runtime, hosting and i18n statements.
