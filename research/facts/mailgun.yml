notes: >
  Mailgun is a brand of Sinch Email, which the terms describe as a Sinch group company comprising the brands Mailgun, Mailjet and Email on Acid (https://www.mailgun.com/legal/terms/). The contracting entity named in the terms is Mailgun Technologies, Inc. (governing law Texas, courts in San Antonio); the contact page (https://www.mailgun.com/contact/) gives a San Antonio, TX headquarters address for Mailgun. The about page (https://www.mailgun.com/about/) says Mailgun was founded in 2010, spun out from Rackspace in 2017 and acquired by Sinch in 2021; founding year is not a release date, so firstRelease is unknown. Compliance statements on the security page (https://www.mailgun.com/security/) are SOC 2 Type II, ISO/IEC 27001 and GDPR compliance; compliance is a coined kind and stays in notes. The pricing page lists a Free plan (100 emails per day) as the first column; free tier is a coined kind and stays in notes, and no prices are recorded. The documentation landing page (https://documentation.mailgun.com/) lists the Send, Optimize, Validate and Inspect products. The API is RESTful per the pricing page feature list ("RESTful email APIs and SMTP relays"); apiStyles is a coined kind and stays in notes. SDK: the repository github.com/mailgun/mailgun.js is a client library; its license, stars and npm figure are left out per the hosted-service rule. The LinkedIn link on the homepage (https://www.linkedin.com/company/mailgun-inc/) has no field and is listed here only. No self-host option was found.
