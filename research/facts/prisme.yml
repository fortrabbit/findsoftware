notes: >
  GitHub reports TypeScript as the repository language; the repository description says "Written in Go", and the server is the Go part, so language is recorded from the description. No page read states how the server is delivered as a binary, so runtime and runtimeMin are not recorded; the install guide sets it up with Docker Compose. The homepage says Prisme is "built on top of" Grafana and ClickHouse; Grafana is the one recorded as basedOn, ClickHouse as the database. The Cloud plan price on the homepage is not recorded. The terms of service and privacy pages name no legal entity, and the terms are governed by French law; no country is recorded as headquarters. The footer "vs Plausible" link points to a page that returns 404, so Plausible is not an alternativeTo statement. The LinkedIn profile (linkedin.com/company/prisme-analytics) is a coined field and stays here. Coined kinds from the homepage, recorded here only: GDPR, PPCA, PECR and Schrems II compliance, cookieless analytics, no cookie banner, a JavaScript-less tracking pixel, and the tracking script embedded with a script tag. Licenses: AGPL-3.0-only is the default for the repository, MIT applies to the tracker and deploy directories listed in LICENSING.md at v0.20.0. The GitHub API reports AGPL-3.0, the same license in a shorter wording. The 0.x version line is recorded as currentMajor 0. Contributors count is one account on the GitHub contributors endpoint.
