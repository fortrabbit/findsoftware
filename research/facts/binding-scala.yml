notes: >
  The CSV homepage is the Scaladoc page on javadoc.io, a documentation host that serves the API docs, not a site of the project; no homepage is recorded, and the API documentation is recorded as docs. The repository is the only project site found, so the record has no homepage. The default branch is 12.x (pushed 2026-06-14). The highest stable GitHub release is v12.2.0 (2023-01-26); v13.0.0-M0 is a prerelease from 2021 and is older than the latest release, so no latestPrereleaseDate is recorded. The release list begins with v8.0.0 (2016-08-13), so firstRelease is 2016. The Maven metadata for binding_2.13 lists the versions without dates, so it gives no earlier first upload. The README states that Binding.scala 12.x only works on Scala 2.13 and that Scala 2.10 to 2.12 need 11.x; the Scala version is not recorded as runtimeMin because Scala is not a runtime in the register. The README names html.scala as a UI framework based on Binding.scala and as successor to the built-in dom library; that is a relation between html.scala and dom, not of this record, so no successorOf or basedOn is recorded. The Scala.js output runs in the browser, but the README does not say the library is browser-only, so runsAs is not recorded. The maintainer is the copyright holder in LICENSE, Yang Bo & REA Group Ltd.; the README header carries a ThoughtWorks logo, and the GitHub organization is ThoughtWorksInc.
