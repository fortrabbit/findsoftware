notes: >
  The repository is a monorepo (packages/core, packages/react, packages/angular, packages/vue and renderer sets). Stars, contributors and releases belong to the monorepo; the npm figures are for @jsonforms/core, the package the tutorial installs. The core package is framework-agnostic and the React, Angular and Vue packages are its bindings, so basedOn is absent. The Material UI, Vuetify and Angular Material renderer sets are packages of this project, not a parent. The homepage and the README both name the same site, jsonforms.io, which the old candidate row had as http; the site redirects to https. latestPrereleaseDate is the npm publish date of 3.9.0-alpha.3, which is not a GitHub release. The homepage lists v3.8.0 as the current version and the alpha as @next. The copyright line in the LICENSE names EclipseSource GmbH; the imprint on eclipsesource.com gives its Munich address. EclipseSource's professional support is a service, not a paid edition. The docs say the renderer sets are not yet translatable. The runtime is not stated: the docs say the core is pure JavaScript and independent of any UI framework, and the bindings serve React, Angular and Vue, without naming where it runs. The first GitHub release is the 2.1.0-alpha.1 of 2017-10-22, and the oldest tags (0.0.x) are from 2016; the year of the oldest release is used.
