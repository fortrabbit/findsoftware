notes: >
  Doubt: "This library is now in maintenance mode. New features will not be added, and its use is recommended only for legacy Leaflet-based systems. For all other use cases, you should use MapLibre GL JS." (README and docs). The project has not stated that it has ended or is unmaintained, so the status is stub, not discontinued; a reviewer may restore accepted. The last npm release (2025-06-18) and last push (2026-02-18) are no end signal. The repository has no GitHub release or tag, so the version and date come from the npm registry, where the first upload is 2023-08-07 although the repository was created 2021-03-30. The docs install section uses the unpkg script tag at an older version than the registry latest; the figure is recorded from the registry. The README calls the library a drop-in replacement for raster basemaps in Leaflet, using either the Protomaps API or PMTiles on the user's own storage, and the docs take a PMTiles file or a tile endpoint as the url option. The README and docs say nothing about where the library runs beyond Leaflet, so runsAs and runtime are not recorded. The README names MapLibre GL JS as an alternative; Tangram, KothicJS and Leaflet.VectorGrid sit under See Also without a statement. The npm weekly figure is for the protomaps-leaflet package the install docs name. Bluesky and Mastodon are the Protomaps accounts linked on protomaps.com. The README names no forum, chat or newsletter.
