notes: >
  No project site of its own: the npm homepage field points to the npm package page and the repository is a monorepo, so the record has no homepage. The docs are the in-repository docs folder at the 3.7.0 tag, read from the README index and the configuration page. The README says it supports Tailwind CSS v4.0 to v4.3 and that Tailwind v3 needs tailwind-merge v2.6.0; that compatibility statement is left out of the fact file. The README names the package tailwind-merge as the library; the other packages in the monorepo (@tailwind-merge/vite, next, configurator, plugin-core) are unreleased or unpublished and are not recorded. The copyright line and the maintainer on npm agree on the name. The README and docs describe the function as a utility for Tailwind CSS class strings in JavaScript; the project does not state that it is built on Tailwind CSS, so basedOn is left out for a reviewer to decide. No runtime is stated: the npm package has no engines field. The npm weekly figure is the range 2026-10-19 to 2026-10-25. Contributors counts registered contributors across all pages of the repository. firstRelease is the year of the oldest GitHub release, v0.1.0 of 2021-07-18.
