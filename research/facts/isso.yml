notes: >
  The homepage answers over https and is the project's own site, with the live demo and the documentation link. The README says Python 3.8+ and the install guide says the same (kept here as a note), but the pyproject.toml at tag 0.14.0 says requires-python 3.10, and the manifest wins, so runtimeMin is 3.10. The docs name the Docker image at ghcr.io, which is not Docker Hub, so no dockerPulls figure is recorded. The first GitHub release is 0.5 (2013-11-17); the oldest tag is 0.2 (2013-10-29), so firstRelease uses the tag. The Debian package was dropped in 2021, per the install guide, and is not recorded. Coined kinds from the homepage and docs go to notes: comments written in Markdown with a 15-minute edit window, moderation by signed URLs or SMTP notification, a client embedded as a single script of about 65kB, and the server embedded through a script tag with a data-isso attribute. The admin interface is off by default and sits under /admin on the Isso URL. The server API page documents an HTTP and JSON API with apiDoc, and the client-config page calls that API the REST API, so headlessApi rests on the client-config sentence. The contributors count is the last page of the contributors endpoint at per_page=1. Arch Linux AUR packages isso and isso-git are maintained by third parties (install page), so they are not recorded as installMethod; the Debian package was dropped in 2021.
