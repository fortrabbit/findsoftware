notes: >
  The README is headed "Teutonic CSS (retired)" and says the framework will no longer be continued as of 2023-05, linking a Medium post on retiring it; the repository is archived on GitHub. The repository names teutonic.co as its homepage, which now redirects to a parked /lander page, so no homepage is recorded. The documentation lived in a separate repository, fortrabbit/teutonic-css-docs. The README describes CSS Grid and column grids, customization through CSS variables, no bundled JavaScript, support for modern browsers only (no Internet Explorer) and no screen reader support. The SCSS source compiles to the CSS stylesheet; language CSS follows the other CSS framework records. currentMajor 0 is the 0.7 line; v0.7.15 (2021-05-12) is the last release. The npm package's first upload is 2018-07-03.
