notes: >
  The record is the Laravel package dedoc/scramble; the npm package named scramble on the registry is a different project and is not used. Maintainer follows the LICENSE copyright line, which names dedoc, the GitHub organization whose display name is de:doc; the homepage footer credits a person with a personal X profile, which is not recorded as a project social link. The LICENSE copyright line carries an email address, not recorded. Scramble PRO is a paid edition sold per license with a team tier; prices are not recorded, and the PRO page lists packages it documents (Spatie Laravel Data, Laravel Query Builder, Tim MacDonald's JSON API, Laravel JSON API Paginate, Laravel Actions). The homepage offers paid integration and support; that is a service, not an edition. The documentation is generated in OpenAPI 3.1.0 format (README); spec compliance is a coined kind and stays in notes. The UI that displays the generated document is Stoplight Elements, named on the homepage; it is an API documentation viewer, not an admin interface, so adminUi is not recorded. The README says the routes /docs/api and /docs/api.json are available only in the local environment by default; the same README links a gate to change that, not recorded as runsAs. Currently the GitHub release line is 0.x; currentMajor is recorded as 0. The requirements are on the installation page (PHP 8.1 or higher, Laravel 10.x or higher). The documentation UI renders with Stoplight Elements by default; the renderers page also lists Scalar and Fabric. The scramble:export command writes the OpenAPI document to a file. Downloads and stars carry their dates; the Packagist figure is the total on the package page.
