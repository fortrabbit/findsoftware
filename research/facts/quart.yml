notes: >
  Status is accepted. The homepage quart.palletsprojects.com is the project's own documentation site and answers 200. The README says Quart is an asyncio reimplementation of Flask, which is recorded as basedOn and importsFrom (the migration guide). The runtime minimum comes from the installation page and PyPI (requires_python >=3.13). The deployment page recommends Hypercorn or another ASGI server and names a serverless option through Mangum on AWS Lambda; only the ASGI server is recorded as runsAs. The GitHub release 0.23.1 is dated 2026-09-12 and the PyPI upload of the same version is dated 2026-08-29; the GitHub date is recorded. The major is 0: the project ships 0.x releases, and major version only is recorded. The Discord link comes from the PyPI project URLs (Chat). The homepage and docs state "Fast Python web microframework"; the README calls it an async Python web application framework; the README lists what an application can do: render and serve HTML templates, write RESTful JSON APIs, serve WebSockets, stream request and response data. The deployment page names Daphne and Uvicorn as other ASGI servers that work with Quart and advises against running the application through run() in production. The PyPI summary reads "A Python ASGI web framework with the same API as Flask", which is the source of the description.
