notes: >
  The copyright line of the MIT license names Adam Shaw; the FullCalendar LLC name in the site footer ("© 2026 FullCalendar LLC") is another legal entity and is not recorded as the maintainer. The license page is the source for the three Premium statements: commercial license for for-profit use, a free non-commercial license for not-for-profit organizations (governments and universities excluded), and AGPLv3 for open-source projects, which the page says replaces GPLv3 as of v7. The Premium plugins are not in the monorepo packages list; the packages in the repository carry no license field except the vue3 package, which is MIT. The npm figure is for the package the install README names, fullcalendar; the @fullcalendar/core package has its own registry figure and is not recorded. The repository is a monorepo: stars, contributors and the release line belong to the whole monorepo. The README install section gives the npm command only inside a code block; the installMethod entries come from the docs page for script tags. The framework connectors (React, Angular, Vue, Preact, Web Component, Salesforce LWC) are separate packages of the same monorepo; no basedOn is recorded because the core is described as a vanilla-JS package with connectors. The temporal-polyfill peer dependency is named by the README and the npm metadata and is not recorded as a runtime. The docs site shows an "NPM installs / month" figure without a period beyond the month; it is not recorded. The oldest GitHub release objects are v1.6.3 and v1.6.4 (2013-09-10) and the v1.0.0 tag commit is dated 2013-09-01, while the repository was created in 2009; firstRelease follows the releases. The site footer reads "Built and maintained by Adam Shaw"; the x and bluesky links are the project's own accounts in the homepage footer (the arshaw accounts there are the author's). The CSV row's 1.5M per week figure is the @fullcalendar/core figure; the recorded figure is the fullcalendar package named by the install docs.
