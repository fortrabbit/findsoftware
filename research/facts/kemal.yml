notes: >
  The homepage shows "Latest Version v1.13.0" while the GitHub releases list v1.15.0 (2026-10-17); the GitHub release is recorded. The runtime minimum is the shard.yml constraint crystal >= 1.12.0, which matches the guide's "Kemal 1.14 requires Crystal >= 1.12.0". The README badge says "Crystal-1.19+", a newer statement that conflicts with shard.yml and is not recorded; a reviewer should decide which one counts. The guide's Deployment chapter has a "Systemd Service" section that manages the compiled binary as a service, which is the runsAs statement. The homepage footer links Discord; the project's X link in the header is an icon labeled "Kemal on X" that points to a twitter.com address, and it is recorded as written; the maintainer's personal x.com accounts are not the project's. The homepage and the README state that Crystal compiles to native code. The README reports "5M+ downloads since 2015" and the homepage repeats it; no registry figure applies because Crystal shards are installed from the GitHub repository. The README FAQ names Sinatra, Flask and Express in its comparison question; these are recorded as alternativeTo because the project names them. The license is MIT by the LICENSE file and the GitHub API; the guide and README name no other license.
