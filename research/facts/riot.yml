notes: >
  The README lists the field types text, numeric, date, boolean, IP, geo point and vector, and query types including phrase, prefix, fuzzy, numeric range, KNN and ANN; its gse package wraps riot with a tokenizer for Chinese and Japanese text. Library, not a server: the README installs it with go get and its examples are Go programs run with go run; the CLI in cmd/riot is named only in AGENTS.md, so it is not a fact. The CSV row names search-server and cites ZincSearch; neither appears in this README, which names zed as a separate distributed search engine built on riot, so search-server is not recorded and the reviewer should decide. The README says riot is "forked from" Bluge (github.com/blugelabs/bluge); that is a stated fork, kept here in notes because no record exists for Bluge. No homepage: the repository is the only site, so none is recorded. The maintainer is not named by the project: the repository owner account vcaesar is recorded, the GitHub profile name is not used. The LICENSE file has no copyright line and AUTHORS lists Bluge authors. The index is stored on disk at a path given to DefaultConfig or in memory with InMemoryOnlyConfig, both in the README examples; no storage field is recorded. The Go module has no download figure; the ecosyste.ms counts are for the module github.com/vcaesar/riot, whose latest_release_number (v1.30.0) is behind GitHub's v1.32.0, so the GitHub release is used. The first GitHub release is 0.10.0 (2017-11-21); the repository was created 2017-06-21.
