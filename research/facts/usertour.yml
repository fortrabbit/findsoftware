notes: >
  The license is split: the README and LICENSE say the community code is MIT, and LICENSE.enterprise governs code under directories named "enterprise" or "ee" and code controlling feature, permission, role and plan enablement; the GitHub API reports NOASSERTION, which is not recorded. The Enterprise License requires a valid Business or Enterprise subscription for production use. The self-hosting page shows Docker Compose samples with restart: always and a PostgreSQL and Redis pair, and the production path uses a Docker Hub image, the environment reference names the Node server and a NestJS server port. The homepage and README name a built-in MCP server ("Usertour ships a built-in MCP server", README), coined and kept here: mcp is not a field. SSO needs a Business plan on the cloud or an active license on a self-hosted instance, per the SSO page; the Business and Enterprise page names SSO, audit log, two-factor authentication and removal of branding as license features. The v2 REST API takes personal API tokens; webhooks and an MCP endpoint are separate (coined, notes only). Docker Hub pulls are for usertour/usertour, the image the install docs name. The README and the alternatives page on the homepage name Appcues, Userpilot, Userflow, Userguiding, Chameleon, Pendo, Intercom, WalkMe and Whatfix as alternatives; none has a record in this dataset, so alternativeTo is empty. The homepage links a LinkedIn company page (https://www.linkedin.com/company/usertour/), kept here as a note since linkedin is not a field. The Terms and privacy pages name Usertour Inc. and the laws of California and the United States but give no street address, so hqCountry is absent. The SDK is installed from npm as usertour.js; the installation page says it loads asynchronously and offers an npm package or an HTML snippet; no sentence states a browser-only runtime, so runsAs browser is not recorded. The Business + Enterprise docs page also offers support and a license agreement; no prices are recorded. The tagged versions are 0.x, so currentMajor is 0 by the major-only rule. usertour.js 0.0.1 was published on npm on 2024-09-12, before the repository's first release (v0.1.2, 2025-02-01). The README has a one-click Railway template button; the Coolify guide deploys the project's example compose file. The self-hosting page says: 'For production deployments, we do not recommend using Docker Compose with Redis and PostgreSQL included', and deploys only the Docker Hub image against external Redis and PostgreSQL.
