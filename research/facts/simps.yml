notes: >
  The CSV homepage is doc.simps.io, the project's documentation site. The site is a client-rendered shell with no body text, so its title is the only text read from it, and the install guide is read from its source repository simple-swoole/docs (the site's CNAME is doc.simps.io). The README links the project site as simps.io, which redirects to the maintainer's GitHub profile, so it is not recorded as a homepage. The install guide names composer create-project simple-swoole/skeleton, a skeleton, so the Packagist figures come from the core package simple-swoole/simps. The install guide requires the Swoole PHP extension at version 4.4 or later (composer.json lists ext-swoole >=4.4), so a host must provide that extension to run the framework. The install guide starts the servers with php bin/simps.php; no page states how the process runs, so runsAs is not recorded. The LICENSE file is the Apache text without a copyright line, so the maintainer is the name the README gives for contact. The latest release is 2020-10-15, and the last push to the repository is 2022-05-30; neither is a signal under the ended-project rules, so status stays accepted. The description's list of server types is the README's Support Features list, which names HTTP, WebSocket, TCP, UDP and MQTT servers. The README's benchmark section cites an external ranking and is not recorded.
