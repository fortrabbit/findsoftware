notes: >
  The project has no site of its own: the bundle documentation is hosted on symfony.com (Symfony's bundle directory), so docs carries that page and homepage stays empty. The GitHub repository's default branch is 2.x; the LICENSE line names Kevin Bond for 2026. The maintainer's GitHub organization is zenstruck, which the GitHub profile names "zenstruck (Kevin Bond)"; the organization is recorded as the repository owner only. The first release v1.0.0 is dated 2020-07-10 by the GitHub release API, and the repository was created on 2020-05-20. The latest release v2.16.0 is dated 2026-11-09, the highest stable release; there are no pre-releases in the release list. The README names doctrine/orm and doctrine/mongodb-odm as the supported mappers; the database engines appear only in the library's own test setup, so databases stays unknown. The docs installation section says the make:* commands need Symfony MakerBundle and that, without Symfony Flex, the bundle must be enabled in the test and dev environments; that sentence is the runsAs local source. The "Local Development Fixtures" section says the foundry:load-fixtures command loads stories marked with the AsFixture attribute into the database and is mainly useful in dev mode. The docs say the library requires the database to be reset before each test, which the packaged ResetDatabase attribute handles, and call the Behat integration experimental. The Behat integration is a separate package, zenstruck/foundry-behat, installed with its own composer require. The README credits the API inspiration to Laravel factories and christophrumpel/laravel-factories-reloaded; that is credit, not alternativeTo. Packagist downloads are the package zenstruck/foundry as the install docs name it; the monthly and total figures are as the Packagist API reports them on 2026-11-17. The GitHub organization profile location names a city and province, not a country, so hqCountry stays unknown. Contributors counts the default branch contributor list, anonymous contributors excluded.
  The README shows a factory whose unset fields get random data, and the docs describe Stories with the AsFixture attribute, the ResetDatabase attribute, the PHPUnit extension and factories as services.
