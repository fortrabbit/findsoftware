notes: >
  The GitHub latest release is a development tag, so the stable major and its date come from the Packagist package classicpress/classicpress (package type wordpress-core, built from the ClassicPress-release repository). The license is stated three ways: GitHub reports GPL-2.0, Packagist reports GPL-2.0-or-later for its latest stable version, and the repository README gives no license statement; the "or later" clause is the only difference and was not resolved. The minimum PHP version 7.4 appears in the requirements page list item "PHP version 7.4" and the markup splits the version number, so the quote stops before it. The privacy policy and the about page give the maintainer as The ClassicPress Initiative, a nonprofit organization registered under section 501(c)(3) of the United States IRS code; no legal form beyond that and no country of headquarters is stated, so hqCountry is not found. The requirements page gives MySQL 5.0 or higher as the minimum and MySQL 5.7 or MariaDB 10.3 as recommended. The requirements page links a Zulip chat at classicpress.zulipchat.com; no field holds it. The homepage's Twitter link is kept as the x value because it is the only social link the page gives. The GitHub repository was pushed 2026-10-18 and is not archived; no end signal applies.
