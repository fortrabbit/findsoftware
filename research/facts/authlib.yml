notes: >
  The project is one of three packages the homepage's project family names: Authlib, joserfc (JOSE and JWT) and OTP Auth (HOTP and TOTP). Each has its own repository and PyPI name, so only the Authlib package is recorded here. The homepage says the authlib.jose module "is deprecated in Authlib 1.7 and is being replaced by the standalone package" joserfc; that is a deprecation of one module that points to a sibling package, not an end signal for Authlib. The homepage's Flask, Django, Starlette and FastAPI integration examples are not basedOn statements. The blog link names NLnet Foundation support for release 1.7; a funder is not a parent, so it is not recorded. The pricing page's Plus plan is for teams that want a commercial license and a direct support path, and the Pro plan is for organizations that need consultation and invoice payment; both are paid plans that add a commercial license and direct support, and the page says they "do not replace the open-source edition" and do not unlock protocol features; so no paidEdition is recorded, and the commercial license is its own license entry. The first PyPI upload is version 0.1 (2017-11-18), and the repository was created in 2017, which fixes firstRelease at 2017. The latest release v1.9.4 is also the newest PyPI upload (2026-11-04). The pypistats figure is the last_month count; the candidates row's figure is stale. Maintainer is the copyright holder named in the LICENSE file; the PyPI metadata gives no author and the team page is not used for a legal name. The homepage discord link is the site's own /discord route, which redirects to the Discord invite; the invite is recorded as the value, and the url is the homepage. The GitHub org is authlib; repoOwnerType is organization.
