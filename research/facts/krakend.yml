notes: >
  The repository is the Community Edition (krakend-ce); the Enterprise Edition is not in a public repository, and its page is the paidEdition source. The license is Apache-2.0 for the Community Edition on both the API and the README; the Enterprise license is not stated on a page read. The homepage says the open source gateway is "free to use" and "trusted by thousands of teams"; neither is a recorded count. The project's open-source page says the KrakenD core framework, the Lura Project, has been donated to the Linux Foundation; Lura has no record, so no parent or basedOn is recorded. The compare pages name Kong (a record), Tyk, Apigee and AWS API Gateway; only Kong is recorded as alternativeTo. The open-source page's FAQ gives the Enterprise additions (audit logging, SSO/SAML, security fixes, support SLA); no pricing page exists (404 at /pricing/ and /enterprise/pricing/), so pricingPage stays absent. The support page links Gophers Slack and no forum, so forum is absent. The install page names Homebrew (builds from source), yum, dnf and apt packages and a tar.gz download; each install route on that page is its own installMethod entry. The Docker image is the official library image (hub.docker.com/_/krakend). The GitHub release 0.4.0 of 2018-01-20 is the oldest release; the repository was created 2017-12-03 and no older release is listed. The homepage's AI Gateway claims (LLM routing, MCP server) are a product area of the same gateway and are not recorded as categories. The maintainer's registered address is in Barcelona, which the terms page gives as the company's registered address; the address is street, postal code and city with a Barcelona commercial registry line, which settles hqCountry ES. Fields coined here: none.
