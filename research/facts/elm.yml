notes: "The homepage body is rendered by JavaScript, so the homepage, news and community facts are quoted from the page sources in the elm/elm-lang.org repository; its title string \"Elm - delightful language for reliable web applications\" and its meta description are in the raw page, and the README calls Elm \"A delightful language for reliable webapps\". The introduction page of the guide says \"Elm is a functional language that compiles to JavaScript. It helps you make websites and web apps.\" and teaches The Elm Architecture, so categories records frontend-framework from that sentence, not from the candidate row's ui-library. The 0.x major is recorded as 0 from the highest stable GitHub release 0.19.3. The npm package \"elm\" is a wrapper that installs the same binary and is not named by the install guide, so no npm figures are recorded. firstRelease is 2012 from the project's news page source (pages/news.elm), which lists release 0.1 as \"Initial Release\" in April 2012; the oldest version tag in the compiler repository is 0.8.0.2 (committed 2013-05-24). No runtime is recorded: the compiler is one executable file used on the developer's machine (\"Elm is just a single executable file\"), and the compiled output is HTML or JavaScript. The webapps chapter says to get the HTML to browsers with free services or a server, and the JavaScript Interop chapter names flags, ports and custom elements. The maintainer is the copyright holder named in the LICENSE file; the GitHub organization is \"elm\". The README names an Elm Slack channel at elm-lang.org/community/slack, which is not a recorded field."
