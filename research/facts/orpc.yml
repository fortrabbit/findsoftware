notes: >
  Monorepo: the packages sit under packages/ in middleapi/orpc, so stars and contributors belong to the whole repository, and the npm figure is the core package @orpc/server, the first package the install line names. @orpc/client had 3341965 downloads for 2026-11-01 to 2026-11-07. The docs at orpc.dev are the v2 line and say they are "currently in beta"; the install commands name the beta tag (@orpc/server@beta), while the latest stable GitHub release is v1.16.2 (currentMajor 1). The npm package named orpc belongs to another project (dizys/orpc, 0.1.1) and is not used. The v2 requirements page (orpc.dev/docs/requirements) gives Node 16.11 as the minimum for ES2022 use; it is a v2 beta statement, so no runtimeMin is recorded from it. ecosyste.ms reports zero dependent packages and repositories for the scoped npm packages, which is not recorded as a figure. The comparison page (orpc.dev/docs/comparison) and the tRPC migration page (orpc.dev/docs/migrations/from-trpc, "Migrate an existing tRPC app to oRPC step by step.") name tRPC and Hono; trpc and hono are candidates, and no alternativeTo or importsFrom quote says alternative or switching, so none is recorded. The sponsor links on the homepage carry a ref parameter and are not recorded. Discord link taken from the README badge.
