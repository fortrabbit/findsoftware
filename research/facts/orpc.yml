notes: >
  Monorepo: the packages sit under packages/ in middleapi/orpc, so stars and contributors belong to the whole repository, and the npm figure is the core package @orpc/server, the first package the install line names. @orpc/client had 3341965 downloads for 2026-11-01 to 2026-11-07. The README says an API is written once as plain TypeScript functions and that oRPC gives a fully typed client, a REST API with an OpenAPI document and MCP tools "with no code generation". The docs at orpc.dev are the v2 line and say they are "currently in beta", with install commands naming the beta tag (@orpc/server@beta); the latest stable GitHub release is v1.16.2 (currentMajor 1), so docs, install route and runtimeMin are cited from the V1 documentation at v1.orpc.dev, which the docs menu links. The npm package named orpc belongs to another project (dizys/orpc, 0.1.1) and is not used. The v2 requirements page (orpc.dev/docs/requirements) gives Node 16.11 as the minimum for ES2022 use; it is a v2 beta statement, so runtimeMin follows the V1 prerequisites (Node.js 18+), which also name Bun, Deno and Cloudflare Workers. ecosyste.ms reports zero dependent packages and repositories for the scoped npm packages, which is not recorded as a figure. The V1 comparison table compares oRPC with tRPC, ts-rest and Hono; the v2 comparison page benchmarks oRPC against tRPC and Hono, and a migration guide covers moving a tRPC app to oRPC (code migration, no importsFrom). The sponsor links on the homepage carry a ref parameter and are not recorded. Discord link taken from the README badge.
