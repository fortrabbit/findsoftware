notes: >
  The homepage answers with an empty JavaScript shell (title "Monaco Editor" and three scripts, no page text) on 2026-11-16, so it is listed under unreadable; the homepage fact is the repository's homepage field. The FAQ says the editor is "generated straight from VS Code's sources with some shims around services the code needs to make it run in a web browser outside of its home", so VS Code is the parent in words; there is no VS Code record, so no basedOn. The README says the editor is not supported in mobile browsers or mobile web app frameworks, and that it does not support TextMate grammars natively (a third-party bridge, bolinfest/monaco-tm, is linked). The README says the AMD build is deprecated and will be removed; the FAQ says the editor needs a web server on http or https because web workers do not load from file. Version line: the stable line is 0.57 (v0.57.0, 2026-09-24), and currentMajor records the major 0 only; dev builds (v0.58.0-dev-2026xxxx, published nightly) are not prereleases, and v0.57.0-rc.2 is dated the same day as v0.57.0, so no latestPrereleaseDate. firstRelease is the npm first upload 0.0.1 (2016-05-31); the GitHub repository was created 2016-06-07. The GitHub language field reads JavaScript while the CSV row said ts. The npm figure is the sum of the daily downloads for monaco-editor from 2026-11-01 to 2026-11-07. Coined kinds left in notes: the model, URI, editor and provider concepts described in the README (Concepts section) and the Monarch tokenizer playground for new languages. The i18n value is coined as a free-text statement about locale scripts; the README's Localization section gives the only example (German).
