notes: >
  latestReleaseDate is the newest stable release by date: RubyGems 0.11.0 (2026-09-02, tag v0.11.0, no GitHub release object); the GitHub release list stops at v0.10.0 (2024-05-25), which the homepage still shows as "Latest version: 0.10.0". currentMajor is 0 either way. The LICENSE copyright line reads "Copyright (c) 2010-2011 Samuel Cochran" and the README reads "Copyright 2010-2019 Samuel Cochran"; both name the same maintainer. The README's Rails and Django snippets use development settings, but no page says MailCatcher is for local development, so runsAs is always-on from the daemon statement, not local. The Docker Hub figure is the image the README names. The Docker Hub count is read on 2026-11-03.
