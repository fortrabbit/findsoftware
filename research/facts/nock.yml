notes: >
  Boundary ruling for wave 62: nock is a testing library (a mocking tool for Node tests), accepted under the testing category; the CSV status accepted stands. No homepage: GitHub lists none and the README names no site, so the docs fact is absent too. The README is the only documentation. The npm package nock has the same name and owner as the repository. The LICENSE copyright line (2011-2019, Pedro Teixeira and other contributors) names the maintainer; the README's contributor list and the GitHub organization name other people, so they are not recorded as maintainer. The GitHub release v15.0.0 is flagged prerelease, but v15.0.1 to v15.0.6 are stable and v15.0.6 is the highest stable release; the npm dist-tag latest is 15.0.6 too. The v15.0.0-beta.16 prerelease of 2026-10-05 is older than the latest release, so it is not recorded as latestPrereleaseDate. The runtimeMin comes from the engines field of package.json at v15.0.6; the README's Node version support section (a table of past nock versions by Node version) is compatibility, not a field. The npm figure counts downloads of the package nock, the install route the README names. Stars and contributors belong to the nock repository. The README points to got and axios only in its common issues section (retry and adapter configuration), not as alternatives, so no alternativeTo. The project takes sponsors through Open Collective, a donation link with no record field. The features in the README (interceptors, recording, Nock Back fixtures, NetConnect control) are not fields.
