notes: >
  The record is the storefront; the commerce backends are reached through connector packages (@misiki/*-connector) that the README lists for 26 platforms, and they are not recorded as records here. The README names Shopify, WooCommerce, Vendure, Saleor and Medusa among the platforms and states that the Litekart backend is the reference implementation; the coverage table in the README is the project's own measurement and is not recorded as a field. The README says connectors for the listed platforms have not been run against a live production instance; that is the project's own statement and is not recorded as a field. The GitHub API reports the repository latest release v4.0.0 on 2025-06-08; the CSV's 2025-07-05 date is not a release date in the API. The releases list also holds calendar-named tags such as 2023.02.01, the earliest release dated 2023-04-14, which gives firstRelease. The package.json names version 4.0.0 and MIT, and the storefront itself is not on npm (registry returns not found). The README's "Premium themes" section names themes made with the storefront but no theme is recorded. The README states that the default environment points at a public Litekart demo API; that demo is not a fact of the record.
  The README's Twitter badge links to the author's personal account and is not recorded. The README's Reddit badge links to a user profile, not a subreddit, and a Telegram badge has no field; neither is recorded.
