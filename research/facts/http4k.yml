notes: >
  The homepage answers at https://www.http4k.org/ (the CSV row lists http4k.org, which redirects there). The Community Edition is Apache-2.0 and the Pro modules sit under the http4k Commercial License; the LICENSE file names both, plus the Apache license text, and each statement is recorded on its own. The Enterprise and Pro pages state paid tiers (Pro per module and seat, Enterprise subscription), so the paid editions are recorded; no price amounts are recorded. The GitHub API reports the license as NOASSERTION, so no api license entry is recorded. The GitHub release 6.62.0.0-ee of 2026-10-15 is an Enterprise Edition release and is skipped; latestReleaseDate is the highest open source release, 6.61.0.0, which is also Maven Central's latest for http4k-core. The first-release year comes from the Last-Modified header of the oldest Maven Central version pom (0.21.0, May 2017), since the GitHub releases begin in 2020. The README and the site state a Maven Central release cadence change from 1 October 2026 (quarterly), recorded as prose only. The Community Slack at http4k.slack.com has no field in the dictionary and is not recorded. The site describes the Community Edition as free and the Enterprise edition as an LTS subscription with a 24-month LTS programme; that is in the enterprise page and not recorded as a field. The site lists serverless deployment to AWS Lambda and GraalVM native builds on the ecosystem page; no runsAs value covers serverless, so only always-on is recorded.
