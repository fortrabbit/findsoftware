notes: >
  The homepage is the demo and documentation site the README names; the repository's GitHub homepage field points to micromodal.now.sh, which redirects to micromodal.vercel.app, so that field is not used. The repository moved from the ghosh account to the micromodal organization; the API gives micromodal/Micromodal as the current name. The maintainer follows the LICENSE.md copyright line, which names one holder; the README's "Created and maintained by" section lists Derek Kniffin, Indrashish Ghosh, Kalpesh Singh and Darpan Kakadia, and a reviewer may prefer that wording. The license is stated two ways: LICENSE.md and the README say MIT, while package.json at the 0.7.0 tag says ISC; both are recorded as their own entries as the source words them. currentMajor is 0: the line is 0.x, and the major is 0 by semver. The npm figure is the sum of downloads for 2026-11-01 to 2026-11-07. The npm package history starts with 0.1.0 on 2017-09-19 by the same author, which is earlier than the five GitHub releases, so firstRelease is 2017. yarn is a package-manager route of the npm registry and is not a separate installMethod. The README names no runtime and the library is used in browsers; its manifest states engines node >=10, which is a build requirement for a browser library, so no runtime is recorded. The README lists the behavior it manages: ARIA attributes toggled on open and close, closing on overlay click and the Escape key, focus trapped within the open modal, and nested modals. The README says the project is looking for more core maintainers. The README's related Microtip is a separate library and is not an alternativeTo statement. The README's Twitter links belong to individual maintainers and are not recorded as project links.
