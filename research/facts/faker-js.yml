notes: >
  The repository's default branch is next, whose README documents v11 as unreleased and names v10 as the stable line; the highest stable release tag is v10.6.0 (2026-08-14), so currentMajor is 10. GitHub reports the license as NOASSERTION; the MIT text is in LICENSE at v10.6.0 and npm reports MIT. The LICENSE file also says it is based on faker.js, copyright Marak Squires and contributors (2011-2020), the original package, which the 2022-01-14 team update says was deleted from npm; that parent has no record file, so it is named here only. firstRelease is 2012 from the oldest tag in this repository (v0.5.5, commit date 2012-08-24), which predates the GitHub releases and comes from the same history. The team update (https://fakerjs.dev/about/announcements/2022-01-14.html) names eight maintainers; the record follows the LICENSE copyright line, and the homepage supports the community type. The guide says Faker was first written in Perl and that ports exist for Ruby, Java and Python; those are not records. Locales (over 70, on the homepage) are generated-data locales, not the software's own translation, so no i18n field. The guide's CDN and script routes are not stated; no CDN installMethod. The social links are the discord, twitter and fosstodon links in the homepage nav. The npm figure is for @faker-js/faker, the package the guide installs. The npm package named faker is a different project and is not used.
