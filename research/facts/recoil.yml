notes: >
  The GitHub repository is archived (archived flag read from the API on 2026-11-16) and its last push is dated 2025-01-01. The README and the homepage carry no archive or end notice, so the discontinued status rests on the archived flag alone; the npm package has no deprecation flag and npm still counts downloads for the recoil package. Recoil's npm last version is 0.7.7 from 2023-04-11 and the GitHub releases list ends at the same release. The install page lists the npm, yarn and bower routes and a UMD build for a script tag; yarn uses the npm registry and is recorded under npm, and bower is a separate registry named on the install page. The install page says Recoil builds are not transpiled to ES5 and that ES5 browsers are not supported; that is a compatibility statement and no runtime. The README describes the project as experimental; the word is the project's own and is not a field. The homepage says the library shares state and derives values from it, with asynchronous queries and subscriptions. The copyright holder in the LICENSE is Meta Platforms, Inc., and the GitHub organization is named Meta Experimental; the maintainer follows the LICENSE. The npm figure counts the package named by the install page.
