notes: >
  Licenses: the homepage FAQ says "Core components of ONLYOFFICE Docs are open source and available under AGPLv3" and that enterprise features such as the administration panel are "available under commercial licenses". The GitHub API reports AGPL-3.0 for the repository. The LICENSE file in the repository is the unmodified GNU AGPL v3 text with no copyright line. The commercial statement is recorded as licenseModel open-core and not as a second license entry, because it names no license; reviewer decision.
  Maintainer: the contacts page names Ascensio System SIA with a Riga address. The about page says the ONLYOFFICE project is "built by Ascensio System SIA, a company registered in Riga, Latvia", and that a holding company, ONLYOFFICE Capital Group Pte. Ltd., is registered in Singapore. The holding company is not recorded.
  Language: GitHub reports only Shell for the DocumentServer repository, which holds packaging; no language is recorded.
  Databases: the Ubuntu install page says "ONLYOFFICE Docs uses NGINX as database." That sentence conflicts with the rest of the docs and is not recorded; reviewer decision.
  Server parts: the API page lists a document storage service, a document editing service, a document command service (force-save, disconnect users, document status) and a document conversion service.
  Install routes: the RPM, Kubernetes and source install pages returned no readable text, so no route is recorded for them. The Docker install page says the install "will install ONLYOFFICE Docs and all the dependencies it needs".
  Wiring: the homepage FAQ asks "Is it possible to use ONLYOFFICE Docs within my app under my brand?" and answers "Yes, you can integrate the editor into your app. Please use ONLYOFFICE Docs Developer." The API page describes the integrator's document manager and editor passing a document key and URL to the document editing service. The Developer Edition is registered with a license.lic file, per the Developer Edition Docker guide.
  Editions: the Developer Edition is a paid edition named on the homepage. The pricing page lists Cloud and Self-hosted tabs; no prices are recorded.
  Social: the LinkedIn company page and the Telegram channel t.me/onlyofficeofficial are not recorded; no field fits either.
  Adoption: the Docker Hub pull count is for onlyoffice/documentserver, the image the Docker install page names. GitHub stars and contributors are from the API.
