notes: >
  Status: no end signal. The repository is not archived and the docs homepage says the project is young with breaking changes to be expected, which is no end statement. The GitHub release 1.1.9 (2026-10-14) matches PyPI. The docs footer names the copyright holders as Andrey Bondar, Nickolas Grigoriadis and long2ice; pyproject.toml lists the same three as authors, so the maintainer is the three names as the project words them. The README says Tortoise ORM is inspired by Django and has a familiar Django-like API; that is a comparison of the API, not a basedOn statement, so no basedOn. The docs homepage benchmark names Piccolo; piccolo is a record, so it is alternativeTo from the project's own benchmark sentence. The README and docs describe a built-in migration framework and CLI (tortoise init, makemigrations, migrate); no field covers it, so it is not recorded. The database client extras (psycopg, asyncpg, aiomysql, asyncmy, asyncodbc) are install options and are not recorded as databases. The PyPI classifiers list Development Status 3 - Alpha, which is not recorded; the project's own docs call it young. The pypiDownloads figure is pypistats last month, not the PyPI JSON API, which reports no downloads. The docs installation page is a sub-page of the docs site and holds the pip commands per database.
