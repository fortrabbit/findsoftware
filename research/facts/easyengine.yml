notes: >
  The record covers the open source command-line tool in the EasyEngine repository (EasyEngine v4, MIT). EasyEngine Dashboard is a hosted control panel next to it, recorded as hostedOffering with no prices; the homepage says it does not host the user's websites and that servers can be added from any Ubuntu host. The site says EasyEngine "started in 2009 as a command-line tool"; that is a founding claim, not a release, so firstRelease comes from the oldest GitHub release (2014). The runtimeMin comes from the composer.json at the latest release tag (">=7.0"), while the README says PHP CLI (>=7.4) and the install guide says PHP 8.2 or later for the manual Mac route; a reviewer should pick one. The install guide says EasyEngine "runs on Linux and Mac, and on any platform that has PHP and Docker", and the README lists Docker and Docker-Compose as requirements; no runsAs value is recorded because the CLI is run by an administrator on the server and no page states one of the listed values. The homepage gives the company as "based in India & The USA" on the about page, so no single hqCountry is recorded. The public GitHub org type and the Packagist package easyengine/easyengine (latest v4.13.3, not abandoned) are recorded; the install docs name the phar and Homebrew, not Composer, so no Packagist download figure is recorded. The docs.easyengine.io host did not answer, so the handbook at easyengine.io/cli/handbook is cited. LinkedIn and Instagram are not recorded. The README says the project "used wp-cli framework as a base and built EasyEngine on top of it"; wp-cli has no record, so it is named here and not in basedOn. The README also says EasyEngine "will currently only run with root privileges". Fields coined here: none.
