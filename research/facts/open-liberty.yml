notes: >
  Open Liberty releases are named by year-based versions: the latest GitHub release is gm-26.0.0.10 (2026-10-19), and the release names carry no major, so currentMajor is not recorded. The line is 26.0.0.x. The Java SE table on the Java SE support page lists Java SE 8, 11, 17, 21, 25 and 27 with LTS flags and end dates; the lowest listed row is 8 but no sentence states a minimum, so runtimeMin is left out for a reviewer to decide. The homepage calls the project "An IBM Open Source Project" and the copyright line reads "© Copyright IBM Corp. 2017, 2026"; the maintainer is IBM Corp., and the IBM privacy page gives the Armonk, United States of America address of IBM Corp. The repository's LICENSE is EPL 2.0 (GitHub API). The docs source repository (OpenLiberty/docs, branch vNext) states the same Java SE table. The container images docs name icr.io/appcafe/open-liberty. The README Twitter badge links twitter.com/OpenLibertyIO and is recorded without a quote. The Stack Overflow tag and Gitter room named in the README are not recorded as forum. The GitHub API lists 101 stable releases from 17.0.0.3 (2017-10-04); firstRelease 2017 is the oldest of them, and the Maven Central oldest upload is in the same year. The highest prerelease on GitHub is none. dockerPulls is not recorded: the container docs name icr.io/appcafe/open-liberty, not Docker Hub; the Docker Hub official image open-liberty shows 14091930 pulls (2026-10-30). The groups.io group is linked from the README as a forum badge. The feature pages for OpenID Connect, SAML and LDAP describe sign-in for applications deployed on the server, not for an admin interface, so sso is not recorded.
