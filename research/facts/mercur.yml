notes: >
  Major version 2 is the highest stable GitHub release v2.3.7; the repository also holds canary tags (2.3.9-canary.x) and an rc tag that are not recorded. The repository is a monorepo: the install docs name create-mercur-app, a scaffolder, so the npm figure is taken from @mercurjs/core, the core package, which carries the same version. The earliest GitHub release is v0.9.0 (2025-05-23); the npm history starts with 2.1.0 canaries in 2026 and is not used for firstRelease. The README and the docs say the platform runs on Medusa; Medusa's own docs are not read here. Medusa Cloud is named in the README and the self-host docs as a managed deployment target; no prices are recorded and no hosted-service status is claimed, because the open-source core is installable under MIT. Stripe Connect is a documented payout provider integration and Magento 2 a marketplace integration; neither is a field. The README prerequisites list Node.js 20 or later, PostgreSQL 13 or later and Redis; the self-host guide says Redis holds sessions, the event bus, the workflow engine and caching, and that the API is deployed as a server instance and a worker instance. The architecture guide says PostgreSQL is the only supported database. The README names Rigby as the team that builds and maintains Mercur; the legal entity is taken from the privacy policy, which names Rigby sp. z o. o. as the controller. The docs' Store, Vendor and Admin API surfaces are described as HTTP surfaces with base paths; no page names REST or GraphQL, so headlessApi is left unknown. The security page lists the SSO over OIDC under "Enterprise — everything in Open Source, plus", so it belongs to the paid edition.
