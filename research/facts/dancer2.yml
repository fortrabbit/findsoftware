notes: >
  The homepage https://perldancer.org/ answers over https, but its title and text describe the Dancer framework and its code samples use Dancer2; the README links the same address as the project site, so it is recorded as homepage. The GitHub repository has no releases, so currentMajor and latestReleaseDate come from the CPAN release Dancer2 2.2.2 (2026-09-28), the status latest on MetaCPAN; the GitHub tags match. The license is recorded from MetaCPAN as perl_5; the README states the same terms as the Perl 5 programming language system itself, and the LICENSE file names copyright 2024 by Alexis Sukrieh. The maintainer is the README author line Dancer Core Developers. The README names the mailing list over plain http and IRC on irc.perl.org, neither of which is a recorded field, so they are not recorded. The Moo basedOn comes from the README sentence that Dancer2 is based on Moo; the README's own typo ("on on") is kept in the quote. The runtime is recorded as perl, which the import drops as unmapped; language is recorded. The README calls Dancer2 "the evolution of Dancer" and links a migration guide for readers starting from Dancer 1, recorded as successorOf. The runtimeMin comes from the CPAN dependency list (perl 5.014). The runsAs values come from the deployment page: the PSGI servers such as Starman are always-on, and the CGI section says a new instance is compiled and served on every request. The deployment page describes Starman as a pre-forking PSGI server and covers CGI and FastCGI under Apache; the README also names the Moo base and the fatpackable core, which the prose leaves out. The firstRelease comes from the oldest CPAN upload (0.01, 2013-02-22), which predates the GitHub tags. The CPAN registry has no download figure in the register, so none is recorded.
