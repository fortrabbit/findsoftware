notes: >
  The project has no site beyond its repository, so no homepage. The repository description says "Based on and ported from the famed faker.js", and the README calls Bogus "fundamentally a C# port of faker.js". faker.js has no record, so basedOn is not recorded; the locale data is re-bundled from faker.js. GitHub reports no license for the repository because the LICENSE file also carries faker.js and other third-party copyright notices; the LICENSE file's first line is "MIT License". Minimum requirements are stated as ".NET Standard 1.3", ".NET Standard 2.0" or ".NET Framework 4.0", three targets without one runtime version, so runtimeMin is not recorded. Bogus Premium is a paid license for add-on packages (Bogus.Locations, Bogus.Healthcare and others), not an edition of the library, so paidEdition is not recorded. The README links the premium purchase page on the project wiki; pricingPage is not recorded. The x entry is the maintainer's personal account linked in the README intro. The README badge "chat-discussions" links the GitHub Discussions page; its text is not on the page as a sentence, so forum is not recorded. The NuGet catalog's first version (2.1.4, 2015-06-09) gives firstRelease. The NuGet total is a registry figure at the date shown. The repository has releases through v35.6.5 (2025-10-26), the newest stable NuGet version.
  The premium packages are separate NuGet packages (Bogus.Locations, Bogus.Healthcare, Bogus.Hollywood, Bogus.Text and others) sold under a paid license.
