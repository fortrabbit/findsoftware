notes: >
  The CSV name "Omni CMS" appears on none of the pages read; the product pages call it Modern Campus CMS, so the record takes that name. Product pages read 2026-11-04: web-content-management, the homepage, the support page, the CMS modules page, the accessibility and privacy pages. The product is hosted: the support page says "The Modern Campus SaaS hosting uptime is 99.95%", and no install route or self-hosted edition appears on the pages read. Modern Campus pages name two addresses, Toronto, Ontario and Camarillo, CA; neither names a country in its text, so hqCountry is unknown. The privacy policy names "Modern Campus Inc" while the footer copyright names "Modern Campus USA Inc."; the footer name is recorded because it is the legal line on the product page. The privacy page link redirects to evolllution.com ("The EvoLLLution"), which the footer lists as a quick link; the relation to Modern Campus is not stated, so no parent is recorded. Accessibility statement names WCAG 2.1 AA, Section 508 and AODA; coined kind, kept here. The product page says "use 500+ APIs to extend CMS functionality" and the support page mentions API documentation in a portal that was not reachable as a public reference, so headlessApi is unknown. The product page lists Layout Builder, a low-code template tool for non-technical users, and a Developer Tools section for customising pages and templates. The /pricing and /terms-of-use pages returned 404, so no pricing or license terms could be read. The product page links LinkedIn as well, a coined social kind kept here: https://www.linkedin.com/company/moderncampus/. The contact page lists Toronto and Camarillo addresses and states no country in its text.
