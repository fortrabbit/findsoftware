notes: >
  The npm package @cloudflare/kumo is the one the install docs name; the figures count installs of that package. Blocks (PageHeader, ResourceListPage) are copied into a project by the Kumo CLI, which is a copy-paste path beside the npm package. The docs list React as a peer dependency and the Base UI primitives it re-exports; the React peer is not recorded as basedOn. The first GitHub release is 2026-02-10 (@cloudflare/kumo@1.3.0); the npm registry shows the first upload, 1.0.0, on 2026-02-03, and the repository was created 2025-10-30. The LICENSE copyright line names Cloudflare, Inc.; the privacy policy gives the address. No social link appears on the homepage.
