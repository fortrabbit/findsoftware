notes: >
  Hosted-service record with no open source product of its own: the GitHub organization planetscale holds the database-js client, which is not the service and takes no license, stars, npm version or release date here. Vitess, which the homepage says is "maintained and managed by PlanetScale", is a separate open source project with no record in this dataset, so no basedOn or hosting-of-open-source link is recorded. The about page says PlanetScale "was founded in 2018 by the co-creators and maintainers of the Vitess project"; a founding year is not a first release, so firstRelease is not recorded, and the reviewer decides whether to show it. Neki, the sharded Postgres product, is named on the homepage and docs as part of the same service. The Enterprise plan offers "Bring your own cloud": PlanetScale deploys into the customer's AWS or GCP account and manages it, which is a hosted deployment option rather than an installable part, so selfHostOption is not recorded. The docs list Business Associate Agreements and a Data Processing Addendum; no field holds them. The regions page lists AWS, GCP and Azure regions; the EU regions named in the regions field are AWS eu-central-1 (Frankfurt), eu-west-1 (Dublin), eu-west-2 (London) and GCP europe-west1 (St Ghislain, Belgium). The plan tiers, add-ons and prices are left out on purpose: plan tiers are not a paid edition and prices change more than yearly.
