notes: >
  Hosted-service record for the Stripe platform. The GitHub organization stripe (github.com/stripe, linked from the homepage) publishes SDKs; its repositories, licenses, stars and npm packages are not recorded, per the hosted-service rule. Quotes come from the English pages (stripe.com/en-de and the docs, read with an English Accept-Language header); the default request to stripe.com is served in German. The Stripe Services Agreement lists the contracting entity per country: Stripe, LLC for the United States, Stripe Payments Europe, Limited for most of Europe including Germany, plus other regional entities (Stripe Payments UK Ltd, Stripe Payments Company, Stripe Payments Canada, Ltd. and others); the maintainer is Stripe, LLC, the United States row, which also carries the copyright line in the site footer. The agreement and the privacy notice give no postal address for any entity, so hqCountry is unknown and no firstRelease year is stated. The agreement's Ireland terms apply to countries it does not list outside the Americas. The pricing page lists plan tiers and add-on prices; plan tiers are hosting tiers, so no paidEdition is recorded and no prices are recorded. The SSO page states SAML 2.0 for the Dashboard login. The API reference describes a REST API that applications call, with SDKs; webhooks, Connect and Terminal are product features without a field. The homepage links one YouTube video, not a channel, so no youtube field is recorded.
