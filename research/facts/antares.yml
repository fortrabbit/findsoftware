notes: >
  Boundary settled for this wave: a desktop database client is a developer tool that runs on the developer's machine, so the row is accepted with runsAs local. The project names itself as in development (README) and in a beta phase (homepage); neither is an end signal, and the last stable release is 2025-06-20, inside four years. The README says the project is "forever 100% free (without paid premium feature)", so no paidEdition is recorded. The README says the app is "based on Electron.js and Vue.js"; the framework an end-user app is written in is no parent, so no basedOn is recorded, and Electron.js is the desktop shell, not a record; no runtime value is recorded for it, because the project states the stack but not a runtime minimum. The GitHub language field shows Vue as the largest language, and language follows that GitHub field. The homepage's own statement "Antares by Fabio Di Stasio" names the maintainer; the legal notice in the MIT LICENSE gives the same name. The homepage lists SQL Server as coming and the README leaves DuckDB unchecked; neither is recorded as supported. The releases list has three alpha pre-releases from 2020 and beta pre-releases from 2025 that are older than the last stable release, so no prerelease date is recorded. The Windows .exe and macOS .dmg routes are named in the README sentences that also carry the routes above, so only the AppImage, Flathub, Snap Store and Microsoft Store routes are recorded. Fields coined here: none.
