notes: >
  The GitHub homepage field points to https://elixir-lang.org/, the site of the Elixir language, not to a site of ExDoc, so no homepage is recorded; the documentation is hosted on HexDocs at hexdocs.pm/ex_doc. The runtimeMin value comes from the README on the main branch, because the project has no stable release page that states it. The hexDownloads figure is the all-time total (downloads.all) from the Hex API for the ex_doc package. The GitHub license field reads NOASSERTION, so the license is taken from the LICENSE file and the Hex package metadata. firstRelease is the year of the first Hex release (0.5.1, 2014-08-02). The README says the generated contents are under different licenses, based on the projects used to render HTML (CSS, JS and other assets), and that documentation generated by ExDoc must include a visible link to the ExDoc repository on each rendered page. The README states Erlang support through Rebar3 from Erlang/OTP 24; the Elixir requirement is the one recorded as runtime. The README says the documentation is generated with mix docs. The README describes the Mix, Rebar3 and command-line uses and does not state where the tool runs, so runsAs is not recorded. The README states that the HTML output works offline and that it can also produce Markdown and EPUB, which the description names.
