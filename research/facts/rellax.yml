notes: >
  The repository has no GitHub release and no git tag; the only release is on npm, so the release figures come from the npm registry (latest 1.12.1, published 2020-02-12). The npm registry shows the first upload, 0.0.1, dated 2016-06-02. The repository's last commit on the default branch is dated 2024-08-24, which is after the last release but is not a release, so no lastCommitDate is recorded: the record has a registry release. Under the four-year rule for release age, the import will move the record to stub; the status here follows the CSV row and is left for the reviewer. GitHub's language field reads HTML; the README sentence gives JavaScript, which is the value recorded. The CDN route is the jsDelivr script tag under the README's CDN heading; the yarn line is the same registry route as npm. No page states that Rellax runs in the browser; the README only says to insert the script in an HTML page, so no runsAs is recorded. The README's Changelog stops at 1.7.1 while npm's latest is 1.12.1; the npm release is the one recorded. The maintainer follows the LICENSE copyright line, "Dixon & Moe"; the npm author is an individual and is not used. The README says each element with the rellax class moves at a speed set by a data attribute, that negative speeds move slower than regular scrolling, that a default applies when none is given, and that the library can be installed with npm or downloaded and inserted into an HTML page. The README has no release notes beyond a changelog that stops before the npm latest, and the repository has no tags or GitHub releases. The README covers responsive speeds per breakpoint, element-wise and global centering, a z-index attribute, horizontal parallax, a custom wrapper element, and refresh and destroy methods.
