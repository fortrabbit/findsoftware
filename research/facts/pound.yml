notes: >
  Homepage is the maintainer's Pound site on gnu.org.ua, which serves the manual; gnu.org/software/pound returns 404 and is not linked. The README says the original was written by Robert Segall at Apsis GmbH, that Apsis discontinued it on 2022-09-19, and that Sergey Poznyakoff continued development from a fork; the manual's Overview says the fork was taken "as a base". No record exists for Apsis pound, so no forkOf or successorOf is written. firstRelease is the oldest GitHub release, v4.0 (2022-12-02): the repository was created in 2018, has no tags below v4.0, and NEWS starts at 4.0, so no earlier release year is stated by a source. The README says pound is "distributed under the GNU General Public License, Version 3, or (at your option) any later version"; the GitHub API reports GPL-3.0. One license, recorded as GPL-3.0 from the API; the README wording is the "or later" variant. The CSV lastRelease (2026-05-26) is v4.23; the newest stable release is v4.24 (2026-10-29), recorded here. currentMajor is 4, since the README says the versioning starts at 4.0. Contributors is the page count of the contributors endpoint with per_page=1. The README says pound "is not a web server", though it can serve static files through special backends, so no renderingModes is recorded. The management client poundctl is a command-line tool, so no adminUi is recorded. Lua is an optional extension named in the README, not a templating or runtime fact. The README says pound "does not access the hard-disk at all" apart from reading certificate files on start. The README names OpenSSL (1.1.x or 3.0.x) as the build requirement, with PCRE2 and Lua optional.
