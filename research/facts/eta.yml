notes: >
  Status accepted. The package is a template engine that runs inside a Node, Deno or browser process, so runtime is node and no runsAs is recorded. The quickstart gives npm install eta only as a code block under the heading "Install Eta", with no sentence naming npm, so npm is not recorded as installMethod; the Deno page says "Prefer importing from JSR" and the quickstart says "In browsers, import the core build", which are the two routes recorded. The EJS credit: the README says parts are based on code from EJS, which is licensed under Apache-2.0; that is a credit for bundled code, not the package license, so it is not recorded as a second license entry. The homepage compares Eta with EJS ("A faster, more lightweight, and more configurable EJS alternative"); ejs has a record in this wave, so it is recorded as alternativeTo. The template syntax (<% %> tags with JavaScript) is the library's own, so the templating field is not set. The Eta v4 line is ESM-only, from the quickstart page. The npm figure is the eta package named by the quickstart, for 2026-11-01 to 2026-11-07. The npm created date (2013) belongs to a package named eta before this project, so firstRelease is the 2020 oldest GitHub release (v1.0.0-beta.0, a prerelease). The newest prerelease (eta-v4.0.0-beta.1, 2025-09-13) is older than the latest stable release, so latestPrereleaseDate is not recorded. The framework integrations (Express.js, Fastify, Koa, Vite, Node-RED, Webpack) are listed on the quickstart and README; they are third-party integrations, not records. The package requires Node.js 20 per package.json at v4.6.0, which is the runtimeMin. The maintainer is the LICENSE copyright holder, Ben Gubler, an individual account.
