unreadable:
  - "https://docs.nestjs.com/: every docs path returns the same empty JavaScript shell, so no installation, deployment or requirements page was read"
notes: >
  The docs site is rendered in JavaScript and curl returns only the shell, so installation and deployment facts were not recorded; the README on GitHub has no install command that could be checked. The README names Trilon as a principal sponsor; that is a sponsor, not a maintainer, so no maintainer is recorded. The engines field in @nestjs/core says node >= 20. The homepage's x link points to twitter.com and is recorded as the page gives it.
