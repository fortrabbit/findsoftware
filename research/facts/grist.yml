notes: >
  Accepted: the boundary question is settled by the project's own pages. The README says grist-static is "a fully in-browser build of Grist for displaying spreadsheets on a website without back-end support" (a separate repository, not recorded as a field), and the docs describe a REST API, outgoing webhooks and custom widgets an app can use. hqCountry US comes from the full address in the EULA (New York, NY 10003), which names no country; the EULA is governed by New York State law. The maintainer name is the EULA's legal name. SSO by OIDC or SAML, audit log streaming, automations, the MCP server and the Azure back-end are listed by the README as features of the full edition only, so the grist-core record does not claim them; sso is notFound for that reason. The README says Sign in with getgrist.com and forward authentication are available in all editions, which is no sso statement in the dictionary's terms. The default Docker image gristlabs/grist also holds extensions for the full edition that are not under an open-source license and stay inactive in the Community edition; the gristlabs/grist-oss image holds only free and open-source code. The README names Python formulas; no Node runtime is recorded because no page read says the server is a Node program (the README names yarn build steps and an environment-variable table line "under Node"). No runtimeMin is stated in any page or the package.json; the repository has no engines field. The first GitHub release is v0.1.1 (2021-04-13), commit date 2021-04-12 is used for firstRelease. The homepage quote is from the page's visible text. The desktop app (grist-desktop) is a separate repository and is not part of this record. The LinkedIn and YouTube pages are linked from the homepage and are not fields here. The README names a REST API, outgoing webhooks and custom widgets; the embedding page describes placing a public document on another site with HTML code.
