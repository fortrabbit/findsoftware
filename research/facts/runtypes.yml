notes: >
  The README has no install section: its only install route is the deno add line on the JSR package page, recorded as installMethod deno, and the npm badge names the npm package without stating an install command. The reviewer decides whether a registry page's install line meets criterion 3, since the project's own documents show none. The JSR page is the registry's own listing, and its runtime sentence names Node.js, Deno and browsers; the browser is no runtime value, so runtime keeps node and deno and runsAs stays empty. The README says the library checks that data conforms to a type with composable validators for primitives, literals, arrays, tuples, objects and unions, that a failed check throws a ValidationError with a structured failure, and that the static type is inferred from the runtype (Static). The LICENSE copyright line names Tom Crockett, while the GitHub owner is the runtypes organization, which is recorded as repoOwnerType. The first GitHub tag is v0.0.1 and the npm package first appears as 0.0.1 on 2016-05-27, so firstRelease is 2016. The currentMajor is 7 from the stable v7.0.5 release, and the minor line stays out of the record. The npm figure is the sum of the daily downloads for 2026-11-01 to 2026-11-07. The npm latest version carries no deprecated flag. Stars and contributors belong to the single repository, which is not a monorepo.
