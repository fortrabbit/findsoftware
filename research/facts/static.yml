notes: >
  The repository has no releases and no tags, so no version or release date is recorded and lastCommitDate is the committer date of the newest commit on master. The project page on the author's site, nakkaya.com/static.html, carries the same text as the README and is the only project page, so it is the homepage. The README file is readme.org. The copyright line in the license section names the maintainer. The page's sample site nakkaya.com is the author's own site and is not recorded as a fact. The page names the output deployed with rsync, but the page does not say where the generated files run, so runsAs holds only local. The :out-dir option names the output directory but the page gives no default, so outputDir is not recorded.
