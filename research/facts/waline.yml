notes: >
  The npm package @waline/client is the core package: the README badges and the get-started import name it, and the repository is a monorepo that also publishes @waline/vercel, the server package the Vercel template uses (GitHub tag 1.43.4 on 2026-09-30, not counted). The highest client tag is 3.16.0 (GitHub, 2026-09-30); npm latest is 3.16.2, published 2026-11-03 with no GitHub tag in the listing, so currentMajor and latestReleaseDate come from npm. Two license statements: the repository LICENSE file is the GPL-2.0 text and the GitHub API reads GPL-2.0, which covers the repository as a whole; the npm metadata of @waline/client (the client script) and @waline/vercel (the server package) says MIT. Both are recorded as separate entries. The npm figure counts downloads of @waline/client alone. The server package @waline/vercel declares a Node engines range in its npm metadata (recorded as runtime and runtimeMin); the engines field of the client package is not the server requirement. The self-host page runs the server behind an Nginx proxy pass, recorded as always-on. Vercel, Netlify, Railway, Zeabur, CloudBase and Alibaba Cloud deploys are other server routes. Storage also includes a GitHub repository (GITHUB_REPO in the environment reference) and CloudBase; the get-started guide creates a PostgreSQL database on Neon through the Vercel marketplace; TiDB appears in the environment reference as a MySQL-compatible store and is not in the database vocabulary. The client is embedded by a script import of waline.js and waline.css from unpkg or by npm, and the el and serverURL options attach it to a page (get-started); the notification channels (email, WeChat, QQ, Telegram), reactions, pageviews, social account login, Akismet and sticky comments are features on the intro page, not fields. The alternativeTo field is left empty: the project's pages name Valine as the origin of the project and list Disqus, Twikoo, Typecho, Artalk and Commento only as import sources in the migration tool. The ecosystem page names a Rust server (waline-mini) and a Cloudflare Workers port as community projects; they are not recorded here. The API reference documents a backend API with GET and POST /api/comment endpoints and the @waline/api client package, but no page sentence names REST, so headlessApi is not recorded. The FAQ says 'Waline = With backend Valine' and explains upgrades separately for the frontend (CDN or npm) and for the server on each host.
