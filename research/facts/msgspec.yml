notes: >
  msgspec is the Python package of the msgspec/msgspec repository, installed with pip or conda; the install page names the optional toml and yaml extras (tomli, tomli_w, PyYAML) for the base install, which are no install route of their own. The license wording: GitHub detects BSD-3-Clause, the README and the LICENSE file say "New BSD", so one entry is recorded. The LICENSE copyright line and the homepage footer both name Jim Crist-Harif. msgspec.dev is the project's own site, and its install page msgspec.dev/install.html is the page cited for runtime and install routes. currentMajor is 0 because the project is pre-1.0 and its latest stable release is 0.22.0 (2026-09-29); the minor line 0.22 goes to notes, per the major-only rule. firstRelease is 2021: the first GitHub release 0.1.0 and the first PyPI upload 0.0.1 are both dated 2021-02-23. The PyPI requires_python field is also >=3.10 for 0.22.0. The homepage's "Used By" section names NautilusTrader, Litestar, Sanic, Mosec, Pioreactor, Zero, anyWidget, Ravyn, FastStream, django-modern-rest and Meltano; these are named by the project as users, not recorded as relationships. The docs have a "Porting from orjson" guide under "Porting guides"; orjson is no record id, so importsFrom stays empty. The benchmarks page compares msgspec with mashumaro, pydantic and cattrs; pydantic is the only one of the three with a record row, so alternativeTo holds pydantic, and the README also names pydantic as a validation library whose conveniences msgspec keeps. The Why page names json, ujson and orjson, which are no record ids. The PyPI monthly figure is pypistats last_month (38179244, 2026-11-16); its last-week figure is 9603403. The ecosyste.ms counts are dependents on PyPI. The homepage says messages are validated during deserialization against schemas defined with standard Python type annotations, and that the library has no required dependencies.
