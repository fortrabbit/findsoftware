notes: >
  Status: no end signal. The repository is not archived, the npm latest version 2.6.1 is not deprecated, and the last stable release is 2026-09-16. The prerelease v2.6.0-beta.0 is older than the stable release, so no latestPrereleaseDate. The homepage links Twitter at twitter.com/timolins, the maintainer's personal account; recorded as the x link without a quote. The maintainer follows the LICENSE copyright line, Timo Lins, who has no legal form. The README and docs describe toast(), the Toaster component, a promise helper and a headless hook exported from react-hot-toast/headless; these are feature statements and not fields. The headless hook is a headless API in the sense of an unstyled renderer, not a headless CMS API. The package.json engines field asks for node 10 or later; it is a build requirement stated in a manifest, so no runtime is recorded for a library that renders in the browser. No page names a browser-only run, so no runsAs. The homepage and the README state Lightweight and less than 5kb; that is a size claim, not recorded. The repository has GitHub Discussions enabled, but no page names it as the support forum, so no forum fact. The npm figure is the package the install docs name. GitHub stars and contributors belong to the single-package repository.
