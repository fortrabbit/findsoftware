notes: >
  commercetools is a hosted service: the company's pages describe Sphere as a platform, and no installable part is named. The docs describe an HTTP API, a GraphQL API, a Merchant Center, a Frontend Studio and SDKs; the SDKs and the Merchant Center are client-side and are not recorded beyond the Merchant Center's place as an interface. The JSON-LD on the homepage gives the legal name as commercetools GmbH, consistent with the imprint. The homepage's "Start free trial" is a trial, so freeTier is unknown. The company describes Sphere as cloud-native and API-first on its About page, which has no field in the starter list. The docs' limits page was not read, so apiLimits is unknown. The Merchant Center single sign-on section was not readable as text, so sso is unknown. The imprint names the managing directors; they are not recorded.
