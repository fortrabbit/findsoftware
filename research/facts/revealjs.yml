notes: >
  The homepage says the project "was started and is maintained by @hakimel" and the README copyright names Hakim El Hattab; the individual is recorded as maintainer. Slides.com, a hosted editor, is named in the README and homepage as a separate product made by the same people; it is not an edition and no price is recorded. The course at revealjs.com/course is marked "(paid)" in the README and is not recorded. The installation page gives Node.js 20.19.0 or later for the full development setup; the basic setup needs only a browser, so runtime lists the browser only and the Node.js figure is not recorded as runtimeMin. The npm package reveal.js was first published in 2013 while the GitHub repository was created in 2011; firstRelease uses the npm created time. The latest GitHub release is 6.0.2, matching npm latest.
