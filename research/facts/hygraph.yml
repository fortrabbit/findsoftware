notes: >
  Hygraph is SaaS only; no installable part was found. repository is the GitHub organization, since no single product repository exists; githubStars is the org's most-starred repo (examples), recorded for completeness, not as a product figure. The management SDK on npm is the only first-party package found. The rebrand post at /blog/graphcms-is-now-hygraph carries a 2026 update date, so the rename year comes from the Series B post. Coined `renamedFrom` (the inverse of the existing `renamedTo`). Founding year and legal entity name were not stated on the pages read.
