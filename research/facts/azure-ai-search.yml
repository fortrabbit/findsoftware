notes: >
  Stub: the product page says "Azure AI Search is Foundry IQ." and its pricing page is titled "Foundry IQ (Azure AI Search)", while the Learn pages say "Azure AI Search is available through the Azure portal, REST APIs, and Azure SDKs. It also underpins Foundry IQ", which describes Foundry IQ as a layer on the service. The doubt is whether the record follows the Foundry IQ name (a rename, which would make Foundry IQ the product) or stays on Azure AI Search as the service under the layer; a reviewer settles it from Microsoft's naming, or from a later page that drops one of the two statements. The record needs that decision before it can be accepted. The GitHub repository Azure/azure-sdk-for-js (npm @azure/search-documents, 290k downloads a week in the candidates row) is the SDK for the service, so no repository is recorded and its figures are not used. The service is described as cloud-hosted with no installable server, so criterion 2 is waived for hosted-service; the record is stub, not hosted-service, until the name is settled. The docs state the service connects to Microsoft Entra ID for service-to-service authentication and authorization; that is not a single sign-on feature for users and is not recorded as sso. The docs' region-support page lists region availability by feature through a preview management API and names regions only for specific features, so no regions value is recorded. The product page states no social links for the service. The Learn pages' Microsoft Corporation legal name comes from the privacy statement's controller address, since the terms page gives no company address.
