notes: >
  The README opens with "As I'm now focusing on new domain, hope that someone who interested on this project could help to maintain this repository", a call for a new maintainer, which is no end signal, so the status stays accepted; the import's four-year rule hides the record. The doubt is whether the project is still maintained; a new maintainer or release would settle it. The homepage elasticlunr.com answers over plain http only (https does not connect), so it is not linked; the API documentation and example at elasticlunr.com are on the same host and are not linked either. The npm package homepage points to weixsong.github.io, the author's blog, which is not the project's site. The latest npm release is 0.9.5 (2016-09-08); the package.json on the default branch says 0.9.6 while npm's latest is 0.9.5, so the release date comes from the registry. The GitHub repository has no releases and 30 tags; the last push is 2022-12-10. The README says the library builds an index ahead of time and loads it on the client side for static web pages and offline document sets, that fields are chosen with addField when the index is created, that query-time boosting is a feature, and that it is supported in all modern browsers; browsers without ES5 need a shim. Node.js use is documented with npm install elasticlunr. The README says the library is developed based on Lunr.js and is more flexible, with query-time boosting and field search; Lunr.js has no record in this dataset, so no basedOn. The npm figure counts the elasticlunr package only, not the lunr-languages add-ons. Major 0 is the registry major, since the project has no 1.x release.
