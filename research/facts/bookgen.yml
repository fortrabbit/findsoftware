notes: >
  Releases are tagged by date (2026-07-31), a calendar version with no major, so currentMajor is not recorded. The oldest GitHub release is the prerelease 1.0-preview1 of 2019-08-06, so firstRelease is 2019; the fact is taken from the releases list, which holds prereleases too, and the 2019 date is the project's first tagged release. The homepage is not stated: the repository has no homepage field and the README links only its wiki, so homepage is absent. The wiki at github.com/webmaster442/BookGen/wiki holds generated API reference pages only and is not used as docs. The README says BookGen "hasn't got a template engine", while the manual documents mustache-style template tags; both are kept, and templating is recorded from the manual. The README says it can be extended with a Scripting API, with NodeJs and Python scripts, and with shortcodes. The README lists the output formats: static website, printable XHTML, EPUB 3.0, WordPress XML export, RSS and Atom feeds, and Word OpenXML (docx). The README describes the project as developed and tested under Windows and says it should be cross-platform. The manual says the binaries are BookGen and BookGen.Shellprog.exe, and that it has a terminal user interface; the manual names no host or server, and runsAs static rests on the buildweb description alone. The LICENCE copyright line gives the maintainer as an individual, and the GitHub profile carries no company. The newest releases are named "(Preview)" or "(Prerelease)" (2026-07-31, 2026-03-04, 2025-11-16) while GitHub flags them as full releases, so the project's naming is followed: latestReleaseDate is 2025-01-19, the newest release not named a preview, and latestPrereleaseDate is 2026-07-31. The release assets include "BookGen-linux-selefcontained.tar.gz" and "BookGen-windows-selefcontained.zip" (spelled so), self-contained builds that need no installed .NET, next to framework-dependent builds. A book is a folder of Markdown pages with YAML front matter, plus a configuration file and a table of contents file.
