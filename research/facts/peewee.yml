notes: >
  The homepage given in the candidate row, http://docs.peewee-orm.com/, redirects to http only, so it is not linked; the https docs index at docs.peewee-orm.com/en/latest/ answers 200 and is recorded as homepage and docs. The repository is coleifer/peewee and the install docs name the pip package peewee. The LICENSE copyright line and the docs footer both name Charles Leifer; the repository owner is the user coleifer. The latest stable release is 4.5.3 from 2026-10-07, so currentMajor is 4. The PyPI first upload is 0.1.0 from 2010-10-18, which sets firstRelease. The pypistats figure is the last-month count from the recent endpoint, read on 2026-11-16, because the PyPI JSON reports -1. The README names a mailing list at an http Google Groups address and an IRC channel for questions; neither is recorded as forum because the mailing list address is plain http. The README says asyncio support is built on the aiosqlite, asyncpg and aiomysql drivers, and that migrations come from a diff-based runner; both are coined kinds kept here in prose only. The README's flask, fastapi and pydantic lines name integrations, which are not basedOn statements. The README says the library is a single module with no required dependencies, and that the MySQL, PostgreSQL and async database drivers are optional extras. The README names integrations with Flask, FastAPI and pydantic and says it has been used in production since 2010. Its examples define models as Python classes with field types, create tables from them, and describe the query builder as one that exposes the full power of SQL.
