notes: >
  The repository is a pnpm monorepo: the core package is @vuetify/v0, the package the install docs name, and its tags are the v-prefixed releases; the other tags (@paper/genesis, @paper/bulma, @vuetify/play) are separate packages and do not set currentMajor or firstRelease. The GitHub API reports the license as NOASSERTION; the MIT entries come from LICENSE.md and the npm registry. The README requirements list Node.js 26 or later, pnpm 10.6 or later and Vue 3.5.0 or later under a section on the monorepo; it is not recorded as runtime or runtimeMin because the section is not stated for a user's site. The Vue 3.5.0 requirement is the basis for basedOn. The homepage is readable and names Discord; the GitHub README links the same Discord invitation. Paid services on the services page (monthly direct-support plans and fixed-price project builds from the creator) are support and consulting, not an edition of the software, so no paidEdition is recorded. Vuetify One (the subscription on the sign-in banner) covers Vuetify web tools, not this package. The homepage says the project has "the backing of Vuetify"; no owning-company statement is recorded for parent.
