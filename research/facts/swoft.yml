notes: >
  No homepage fact: the homepage no longer answers, so the project's own docs and installation pages are unreadable and the install steps come from the README at tag v2.0.11. The repository has no docs folder, and swoft-cloud/docs answers 404. The README is the only project page read. Owner is the swoft-cloud GitHub organization; the project names no legal entity, so maintainer is the organization name. basedOn names Swoole, a PHP extension, because the README names it as the base. Registry figures use swoft/framework, the component package the README lists; the install command names the swoft/swoft skeleton, whose registry figures are not recorded. Status stays accepted: the repository is not archived, the package is not abandoned, and no page states an end. The last push was 2023-02-28; the last release is in latestReleaseDate. The README links a Gitter room and a QQ group; no field holds those.
