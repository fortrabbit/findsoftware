notes: >
  Stub, in doubt whether the project's site is gone: the homepage https://orbit.kiwi/ does not resolve (no DNS answer, rechecked 2026-10-27) and www.orbit.kiwi does not resolve either, so no homepage is linked. The README names orbit.kiwi as the full documentation and the Storybook at kiwicom.github.io/orbit as the live preview; the Storybook answers 200 and is used as docs. Would settle: orbit.kiwi answering again, or the project naming a new documentation site. Repository is kiwicom/orbit, MIT, last push 2026-07-06. Adoption: both recent npm weeks show zero-download days (2026-10-18 to 2026-10-24 sums to 2,227 with three zero days), so the larger full week, 2026-10-11 to 2026-10-17 at 22,696, is recorded. The npm dist-tag latest points at the alpha 27.7.1-alpha.0, so the stable line is 27.7.0 from the GitHub releases. Repository tags cover several packages (babel plugin, components); the figures are for @kiwicom/orbit-components, the package the README installs. Copyright line names "Kiwi.com" without a legal form; the legal form was not checked. The readme says Orbit uses Tailwind CSS, that Tailwind must be installed in the project for the components to display correctly, and that @kiwicom/orbit-tailwind-preset provides the configuration.
