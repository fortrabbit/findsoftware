notes: >
  Accepted as a boundary row: the project's own pages show applications sending messages to the server through its REST API, with example code in several languages (the push messages and push message examples pages), so the server is wired into an app. The server also exposes an MCP endpoint at /mcp for AI agents to send messages (guides page "AI Agents (MCP)"), not recorded as a field. The Android client (gotify/android) and the CLI (gotify/cli) are separate repositories named on the homepage; the CLI pushes messages, and the Android client shows push notifications and is listed on F-Droid and Google Play, not recorded. The LICENSE file at the default branch reads MIT License; GitHub's license detection reports NOASSERTION, so the license is recorded from the file text. The copyright line names jmattheis, the GitHub account the project's own LICENSE gives; the full name on that account is not recorded because no project page states it. The project describes itself as a push message server; the categories use realtime and websockets because the category notifications maps to email in the import, which does not describe it. Coined kind: httpApi (the homepage's REST-API). The runtime go binary follows the Go Binary heading of the build page; the install page names release binaries for several platforms. The docs also describe built-in plugins (Linux and macOS only) and a systemd service example; neither is recorded as a field. Gotify 3 moved configuration to environment variables; the install and configuration pages are the current docs.
