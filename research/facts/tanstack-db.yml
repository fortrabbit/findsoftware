notes: >
  Monorepo: the repository holds the core package, the framework packages (React, Preact, Solid, Svelte, Vue, Angular), the collection packages and the persistence packages. Stars and contributors belong to the monorepo. The npm figures, the dependent counts and the release dates are those of the core package @tanstack/db, which the Vanilla JS route of the installation page names. The framework packages re-export the core and are official bindings, so no basedOn is recorded for a framework. The README says "Tanstack DB is currently in BETA." and its badge reads "status-beta"; the docs also carry a migration guide to the 1.0 RC. Neither is a maintainer end statement, so status stays accepted. The npm dist-tag latest points at the release candidate 1.0.0-rc.1.5 (2026-11-11), while the newest stable version is 0.15.2 (2026-10-21), so currentMajor is 0 and the candidate is recorded as latestPrereleaseDate. The LICENSE copyright line names Kyle Mathews, which is the maintainer recorded here. The npm maintainers are the npm accounts tannerlinsley, alemtuzlak and kevinvandy. The homepage footer reads "© 2026 TanStack LLC", and the terms page names Utah as the governing law with no address, so hqCountry is not recorded. The docs describe the sync engines ElectricSQL, PowerSync, TrailBase and RxDB and the SQLite persistence packages for browsers, Node, mobile and Durable Objects as collection packages, not as fields. The docs say the client stores (LocalStorage, IndexedDB) persist "local browser data", but they name no runtime, so runtime and runsAs are not recorded. The X, Bluesky and YouTube links come from the footer component of the tanstack.com site source (the footer renders client-side, so a plain page fetch does not show them); its LinkedIn link is not recorded because no field exists for it. The npm install commands on the installation page are shown as shell tabs for the package manager; the quoted sentence names the core package the route installs. The Discord invitation the homepage links through tlinz.com/discord resolves to https://discord.com/invite/WrRKjPJ, the same invite the README names. The contributors count covers all pages of the repository, requested with per_page=1 and read from the last-page link. The overview says the optimistic state is held until the handler resolves, when the data is persisted to the server and synced back, and rolled back if the handler throws; the homepage says live queries use differential dataflow, so affected results update incrementally as the underlying records change.
