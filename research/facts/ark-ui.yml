notes: >
  Ark UI is a monorepo (chakra-ui/ark); the install docs name @ark-ui/react, so the npm figures and the release date come from that package, and the GitHub release tag 5.39.3 is that package's. Sibling packages @ark-ui/solid, @ark-ui/vue and @ark-ui/svelte share the repository and version line and are not separate candidates. The npm weekly figure is the sum of the daily downloads API for 2026-10-18 to 2026-10-24. The homepage and getting-started page are the project's own; the homepage nav lists a Plus page, which is the paid examples tier recorded as paidEdition. The first npm upload of @ark-ui/react is 0.0.0-rc from 2022-11-06, earlier than the first GitHub release (2023-04-29), so firstRelease is 2022. The maintainer is the MIT LICENSE copyright holder; the about page names the team behind Chakra UI without a legal name. No runtime: the library runs in the browser through the consuming framework.
