notes: >
  The overview says applications send users to Casdoor to sign in, that it returns a verified identity over OAuth 2.0, OpenID Connect, SAML or CAS, and that the operator manages users, applications, sign-in pages and providers in a web-based admin console. The server reads its database settings from conf/app.conf, and the Docker all-in-one image is marked "Not for production" on the Docker page.   The homepage is casdoor.ai in the README and the repository, and casdoor.org serves the same site with the documentation; both are the project's own sites, and the homepage fact cites casdoor.ai. The copyright line on casdoor.org reads "Copyright © 2026 Casdoor contributors", while the pricing page on casdoor.com, which sells Casdoor Cloud, carries "© 2026 Casbin Inc." and says "Casdoor Cloud is operated by Casbin Inc."; the LICENSE file is the unfilled Apache 2.0 template with no copyright line, so the maintainer follows the project's own site footer, "Casdoor contributors" (the source file headers read "The Casdoor Authors"), and Casbin Inc., the operator of Casdoor Cloud, stays in these notes. The SDK integrations listed on the overview are C++, C#, Go, Java, JavaScript, Lua, PHP, Perl, Ruby, Rust, Haskell and Python. The company's country is not stated on the pages read, so hqCountry is not recorded. The pricing page lists a self-hosted option "Free (Apache-2.0)" alongside the cloud plans, and the cloud plans are not paid editions, so no paidEdition is recorded. The documentation's comparison pages (Casdoor vs. Keycloak, Authentik, Auth0, Logto) name records for alternativeTo; Logto has no record, so it is not listed. The docs say Casdoor uses Casbin for its permission model; that is a library the project builds on, not a parent software, so no basedOn is recorded. The overview calls Casdoor part of the CNCF Landscape, which the homepage repeats; a landscape listing is not a project governance statement, so no foundation is recorded. The server runs as one process serving the built frontend; the frontend build needs Node.js LTS 20 and Yarn 1.x, a build requirement not a runtime. The GitHub release list starts at v1.0.0 (2021-08-14), which is the first release year. The homepage Discord link is the community invite on casdoor.org. The Docker Compose route builds the image from source, and the README calls the all-in-one image the evaluation path. The Helm route uses an OCI chart at ghcr.io/casdoor/helm-charts/casdoor, and the Kubernetes operator and Terraform routes are not recorded.
