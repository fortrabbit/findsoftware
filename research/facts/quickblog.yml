notes: >
  The GitHub homepage field and the site blog.michielborkent.nl are the author's own blog, one of the instances the README lists under "Blogs using quickblog", not a project site, so no homepage is recorded; a reviewer decides whether that counts as the project's own site. The README gives two Markdown libraries: the Features section names markdown-clj, and the Quickstart says that since v0.4.7 quickblog relies on the built-in Nextjournal Markdown library; both are recorded as the README states them and neither is a basedOn parent. The README does not say the output is static files, so renderingModes is unknown; it describes a render step that writes to out-dir and a watch task that serves an HTTP server during development. The README's Blogs section lists instances by their authors and is not recorded. The blog code is intended to run as a library from babashka tasks or Clojure aliases, so installMethod names both git dependencies.
