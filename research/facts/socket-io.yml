notes: >
  One record covers the library and its server: the npm package socket.io is the server, and the client is the separate socket.io-client package, whose figures are not recorded. The Socket.IO protocol that the packages speak is documented on its own pages and is not recorded as a field. The docs caution against using it in a background service for mobile applications, because the library keeps an open TCP connection to the server.
  The npm weekly figure is the sum of the daily counts for the period in the value, from the range endpoint; the point endpoint is stale. The engines field in the npm manifest of 4.8.4 states "node": ">=10.2.0", and the docs say "At least Node.js 10 is needed", so runtimeMin is 10. A package dependency is no basedOn statement, so basedOn is not set; the transport packages it depends on are not recorded. The homepage links GitHub Discussions (recorded as forum), a Slack invitation and Stack Overflow. The homepage "Admin UI" link (admin.socket.io) is a separate project and is not recorded as adminUi. The CDN installs (cdn.socket.io, cdnjs, jsDelivr, unpkg) serve the client bundle; the server runs inside the Node.js process of the app that loads it, and the server initialization page says the server implicitly starts a Node.js HTTP server, but its link markup splits the sentence so no verbatim quote is possible. The maintainer follows the LICENSE copyright line, which names Guillermo Rauch and the Socket.IO contributors; the legal form is not stated. The dependent counts come from ecosyste.ms, which counts npm packages and repositories that depend on socket.io. The first release is the oldest version tag, 0.1, committed on 2010-03-19; the repository was created on 2010-03-11. Not record fields: protocols WebSocket (https://socket.io/docs/v4/). protocols HTTP long-polling (https://socket.io/docs/v4/).
