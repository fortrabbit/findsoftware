notes: "Boundary question, settled as accepted: the project's own docs document a per-DAG webhook endpoint (POST /api/v1/webhooks/{fileName}, token-authenticated) that an external caller such as a site or a SaaS can trigger, and a REST API under /api/v1 with an OpenAPI reference at docs.dagu.sh/web-ui/api. The README describes the product as operations and internal automation, so a reviewer should confirm that a webhook trigger meets the wiring rule. LICENSING.md says that a product which distributes the embedded Go API outside the GPL needs a separate written agreement with the copyright holder; commercial embedding rights are not granted by the repository. The README names a built-in MCP server for inspecting and controlling workflows, which no field records. Homepage: the candidates row gave dagu.cloud, which does not resolve; the GitHub homepage field is https://dagu.sh, which answers 200 and is recorded. The repository license reads \"GNU GPLv3\" in the README and \"GPL-3.0-or-later\" in LICENSING.md, and GitHub reports GPL-3.0; the wordings are one license, recorded from LICENSING.md. The paid self-host plans (Team, Pro) are license keys that unlock SSO, RBAC, audit logging and incident routing in the same GPL-licensed software; the docs and the terms name no separate license text for them, so no second license entry is recorded, and the plans are recorded as paidEdition without prices. Public webhook URLs and remote MCP access run through Dagu Cloud for paid plans, and Dagu Console monitoring is a beta service for self-hosted servers; neither is a hosted copy of Dagu, so no hostedOffering is recorded. The Dagu terms name \"Descarty, Inc.\" as the company; governing law is Delaware, not an address, so hqCountry is unknown. The npm package @dagucloud/dagu is a wrapper that downloads the Go binary at install time, so its weekly figure counts wrapper installs. The Docker and Helm install routes name ghcr.io and a Helm repository, not Docker Hub, so no dockerPulls value is recorded. The runtimeMin is the Go version in go.mod at the latest tag, a build requirement for the binary. The README comparison names cron, Airflow and Temporal."
