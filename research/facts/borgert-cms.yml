notes: >
  Status accepted: the repository is not archived, no page states that the project has ended, and no registry was found for it; release age decides nothing.
  The project has no website; the repository is its only page.
  maintainer follows the LICENSE copyright line (an individual, 2016). The GitHub organization borgert-inc is displayed as B2.Labs with a Brazilian location; the organization is not recorded as a parent because no page names it as the owner of the software.
  The CHANGELOG stops before the latest release tag and is not used for any field.
  The README says the software has Blog, Pages, Products, Mailbox, Image Gallery, Log Viewer and Users modules; these are in the description and categories are limited to cms and blog.
  Database settings are required by the installation guide, but the guide does not name a database engine, so databases and contentStore are unknown.
  Coined: none.
