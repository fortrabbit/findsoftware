notes: >
  The homepage and the docs are read through the homepage, the introduction and the usage pages; the install page at /docs/installation is a 404. The README names the docs at bootstrapemail.com and an older docs site at v0.bootstrapemail.com for v0.3.x. The GitHub repository owner is the organization bootstrap-email, but the LICENSE copyright line and the gemspec author name Stuart Yamartino; the maintainer follows the LICENSE line. The gemspec describes the gem as "Bootstrap 5+ stylesheet, compiler, and inliner" and the usage page names the Gemfile route ("gem 'bootstrap-email'") for Ruby and Rails projects; that is the same RubyGems route as gem install, so one installMethod is recorded. The usage page documents a command line (the bootstrap-email command), plain Ruby and Rails routes. The Rails route needs a mailer layout and calls bootstrap_mail, so the gem runs inside the app's process when a mail is built; no page states a process model, so runsAs is absent. The introduction says the project "takes most of it's inspiration" from Bootstrap and Tailwind; inspiration is no basedOn statement. The homepage links a Templates product and a Black Friday offer for "Templates Pro"; those are paid templates, not a paid edition of the software, so paidEdition is absent. The RubyGems version list starts with 0.0.0.alpha.1 on 2017-10-29, earlier than the first GitHub tag (0.2.0, 2018-05-11), so firstRelease is 2017. The RubyGems API names the same homepage. The docs describe the compiler as turning Bootstrap-like markup into table tags with inlined styles; that is the rendering target and is kept in prose, not as a field. Stars and contributors come from the GitHub repository; the registry figure is the total downloads of the bootstrap-email gem.
