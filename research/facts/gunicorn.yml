notes: >
  Runtime minimum conflict: pyproject.toml at tag 26.2.2 says requires-python = ">=3.10" and the README says "Compatible with Python 3.10+", while the install page says "Gunicorn requires Python 3.12 or newer." The manifest is recorded; a reviewer decides whether the install page or the manifest wins. Release conflict: PyPI's latest upload is 26.2.0 (2026-08-24) while GitHub has releases 26.2.1 and 26.2.2 (2026-09-06); latestReleaseDate is the GitHub release. PyPI first upload is 0.1 on 2010-01-03, which gives firstRelease 2010 (the homepage also says "since 2010"). The PyPI figure is the last month count from pypistats (97,095,249 on 2026-10-29); the weekly figure in candidates-server-infra.csv is older. The official Docker image is published on GitHub Container Registry (ghcr.io/benoitc/gunicorn), not Docker Hub, so no dockerPulls figure is recorded. The GitHub API reports the license as NOASSERTION; the MIT statement is taken from the README and the LICENSE file. The LICENSE lists a second copyright holder, Paul J. Davis (2009-2015), recorded here only as notes. The homepage's "Trusted by thousands of companies" is not a count and is not recorded as reportedInstalls. The deploy page says "We strongly recommend running Gunicorn behind a proxy server."; the design page says the sync worker "Requires a buffering proxy (nginx, HAProxy) for production". The homepage links to Libera Chat #gunicorn and GitHub Issues; no forum or chat field applies. The homepage footer also credits Enki Multimedia, which is not recorded. Fields coined here: none.
