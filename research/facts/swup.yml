notes: >
  The npm package swup has a first upload dated 2017-10-07 (0.0.1), the repository was created 2017-10-09, so firstRelease is 2017. The install page documents the npm route for bundlers and a CDN script tag for projects without one, and a native ES module import from the same CDN is a variant of the script tag, not a separate route. The README says swup 4 is released with an upgrade guide, and the docs keep a v3 version switch beside v4 (current). The how-it-works page says swup intercepts link clicks, loads the new page in the background and animates between the old and new content, replacing only the configured content containers. The plugin directory lists official and third-party plugins; plugins extend the library and are not recorded as records. The npm figure is the sum of daily downloads from 2026-11-01 to 2026-11-07. The candidate row's npm figure (24.9k per week) is out of date. The stars and contributors are the swup/swup repository's.
