notes: >
  Coined projectRepository (the create-project skeleton repo, separate from the core library repo), roadmap and slack. The docs site covers up to Bolt 5.2 while the latest release is 6.x, so contentStore, databases, installMethod and serverNeeds come from the 5.2 docs; the 5.2 page states PHP 7.2.9 as minimum, superseded for 6.x by Packagist's >=8.2. The README still mentions Symfony 5 extensions while composer requires Symfony 6.4. The README states the previous main maintainer died in early 2024 and new maintainers took over. The extensions library shows no total count.
