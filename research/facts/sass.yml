notes: >
  Maintainer: the LICENSE copyright line names Google Inc., but the README closes with "Disclaimer: this is not an official Google product." and the Sass homepage names a "Core Team" ("Sass has been actively supported since 2006 by its loving Core Team."). A reviewer decides the maintainer value; Google Inc. is recorded because it is the legal copyright line. Runtime: the standalone archive contains the Dart VM; the npm package is compiled to JavaScript and needs Node.js; the Dart library needs the Dart SDK, whose pubspec floor at v1.106.1 is sdk ">=3.13.0 <4.0.0" (the pubspec sdk is not recorded as runtimeMin, which holds one value; the npm floor is recorded). The npm engines field at 1.106.1 is node ">=20.19.0". The standalone archive and the npm package are both listed as install routes; the first installMethod is the standalone download. The sass-embedded npm package and the Ruby host sass-embedded (candidate sass-embedded-ruby) are separate packages and are not counted here; the npm figure is for the sass package the install docs name. The npm weekly figure sums the seven days 2026-09-28 to 2026-10-04 that the npm API reports. The README's legacy JavaScript API is deprecated and due for removal in Dart Sass 2.0.0; the record does not carry a version, only the current major. The GitHub homepage field is https://sass-lang.com/dart-sass, the page used as homepage. Social links are README badges and are recorded without a quote.
