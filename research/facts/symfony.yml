notes: >
  The GitHub "latest release" flag points at v5.4.54 (2026-10-15), a 5.4 release outside the branches symfony.com lists as maintained; the releases page names Private Packagist and Ibexa as backers of 5.4, so 5.4 appears to get sponsored extended releases. latestVersion records the newest version line (8.1.9) instead. Symfony's legal notice names Symfony SAS as trademark holder at the same address as SensioLabs, which calls itself "Creator of Symfony"; the ownership link between the two is not stated, so `parent` stays empty. Databases come through Doctrine, which Symfony documents but which is optional. The symfony/symfony monorepo download figure undercounts use, since apps install split components; framework-bundle is recorded as a second figure. Coined field `chat` for Slack and similar chat rooms that are not Discord.
