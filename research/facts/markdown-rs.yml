notes: >
  The project has no homepage of its own: the repository links the crate page and docs.rs, and docs.rs is the registry's rendering of the crate docs, so it is recorded as docs only. The crates.io name markdown has versions 0.0.1 to 0.1.1 dated 2015, before this repository existed; the README thanks johannhof for the crate name, so those versions are another project's and firstRelease counts this project's first GitHub pre-release, 1.0.0-alpha.1 (2022-10-14). The crate figure covers all versions of the markdown crate and is a total. The README states that markdown-rs has a sibling JavaScript project, micromark, and that mdxjs-rs wraps it to compile MDX; these are relationships named on the page, not basedOn or alternativeTo statements. The README's install line says rust edition 2018 and version 1.56 or later; the manifest at the 1.0.0 tag gives rust-version 1.56, taken as runtimeMin. The repository's last push is the 1.0.0 release date (2025-04-23); the project is not archived and the README states no end, so no status change. The README's Sponsor section names GitHub Sponsors and OpenCollective for the unified project; not fields here. The license is MIT with the copyright holder Titus Wormer; the README gives the same MIT license with the same holder.
  The README states that the state machine is no_std with alloc, that the code is 100% safe Rust, and that HTML output is safe by default: dangerous HTML and protocols are encoded or dropped unless allow_dangerous_html or allow_dangerous_protocol is turned on. It also says MDX syntax errors come back through a Result from to_html_with_options, and advises capping input size for untrusted content.
  The README says the state machine emits concrete tokens so that every byte is accounted for, with positional info; the API then exposes an AST (mdast) through to_mdast, whose example output carries a position on every node, or compiles to HTML through to_html; to_html_with_options takes an Options value, and Options::gfm() switches on GFM; the README lists MDX, frontmatter and math as extensions that are not on by default.
