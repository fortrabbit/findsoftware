notes: >
  The candidates row carried 64.4M packagist downloads; the current Packagist total is 65542706 and is recorded with its date. The Packagist package laravel/scout is the one the install docs name (composer require laravel/scout). The GitHub repository has releases from v6.0.0 in December 2018, and its tags run from v0.1.0 in 2016; Packagist versions start with v0.1.0 on 2016-08-15, which is older than the GitHub releases, so firstRelease is 2016 from the registry upload. The stable major is 11, the highest release tag v11.9.0, published 2026-10-06. The composer.json at v11.9.0 requires Illuminate components for versions 9 to 13 and symfony/console for 6 to 8, and the docs are the 13.x docs at laravel.com/docs/scout; these are not recorded as fields. The maintainer is Laravel Holdings Inc. as named by the privacy policy of laravel.com, which describes the company as operating the services it owns or maintains; the LICENSE copyright line and the composer.json author name Taylor Otwell, an individual, so a reviewer must decide which of the two is the maintainer. The basedOn Laravel value rests on the package name and its Eloquent models, plus the installation pages on laravel.com; the docs do not write "Laravel package" in those words, and the laravel.com packages list also includes Scout but is a related link, not a statement. The docs describe third-party engines for Algolia, Meilisearch, Typesense and Turbopuffer, a collection engine for prototypes and tests, and a semantic search path through the Laravel AI SDK; those engines are separate candidates and are not recorded here. The runsAs always-on value comes from the queue section: a queue worker is needed for Scout's queued index operations when the queue option is on, and the software itself does not start a process. The ecosyste.ms dependent repository count of 3000 is recorded as the endpoint returns it. The GitHub organization laravel is recorded as repoOwnerType organization. Laravel Holdings Inc. is named by the privacy policy of laravel.com (headquartered in the United States) as the company that maintains the services it owns; it is not recorded as maintainer, since the LICENSE line and composer.json author name Taylor Otwell. Queue workers are optional for Scout and not a runsAs value.
