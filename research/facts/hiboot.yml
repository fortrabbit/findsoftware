notes: >
  The README and the Go quick start link https://hiboot.hidevops.io, which does not resolve (no DNS answer), so the homepage is the netlify docs site named in the repository's README. The homepage and the README describe it as a web and CLI framework; the homepage calls itself "a high performance web and cli application framework with dependency injection" and the README says it borrows Spring features such as dependency injection, aspect oriented programming and auto configuration, with no basedOn because Spring is a source of ideas, not the software it is built on. The Go module is github.com/hidevopsio/hiboot and no download figure exists for a Go module. The first GitHub release is v0.1.0 (2018-05-06), so firstRelease is 2018, while the README's copyright line starts in 2017. The homepage links the author's personal X account (@johndcn) under "The author" and a Gitter chat room; neither is recorded because the first is the author's own account and the chat has no dictionary field. The homepage shows a version number, which is not recorded.
