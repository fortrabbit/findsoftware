notes: >
  The homepage in composer.json (openmix.org/mix-php) now serves an unrelated gaming blog, so no project site is recorded and homepage stays unknown. The README names the skeleton packages (mix/web-skeleton and others) as install targets; mix/mix is the core package, so the registry figures come from it. The Packagist package lists maintainer onanying, which the project does not state on its own pages; the maintainer is the GitHub organization Mix PHP. The README lists the HTTP drivers (PHP-FPM, Swoole, Swow, WorkerMan, PHP built-in CLI server) without saying which run per request and which as a long-running process, so runsAs is left out. The CSV category long-running is not recorded: the README does not use that term. Documentation other than the README is for V2 and sits on kancloud.cn, not for V3.
