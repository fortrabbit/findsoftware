notes: >
  The project's own site statik-site.com does not resolve: curl reports "Could not resolve host" for both http and https on 2026-10-23, so the record is a stub without a homepage, as with bowman. The status fact has no quote because no page was returned. The repository README is the only documentation found; it gives the scaffolding command and the npm install and npm start steps, and nothing on Node, deployment or rendering. The registry figures come from create-statik-site, the package the README tells users to run. The npm package statik-site is not used: its repository field names Paul-Browne/npm-statik-site, not this repository, and its latest version is from 2018. The repository has no GitHub releases; currentMajor and latestReleaseDate come from the npm latest tag of create-statik-site. The repository was last pushed in 2023. The contributor count is the single page returned by the endpoint.
