notes: >
  Boundary question: the repository has no GitHub release and no tag, and no npm package exists (the npm registry answers 404 for "bahunya"), so there is no currentMajor and no latestReleaseDate. The package.json at HEAD says version 2.0.0, but that is a manifest value, not a release, so it is not recorded. Criterion 4 is judged by lastCommitDate, the committer date of the newest commit on master, as the skill describes. The CSV homepage https://hakanalpay.com/bahunya/ answers 404 with the author's site's not-found page; the project's own package.json and demo page name https://kimeiga.github.io/bahunya/ as the site, so that is recorded as homepage. The demo page's own JSON-LD gives the license as MIT and the repository as github.com/Kimeiga/bahunya. The README says the CDN link is served from the repository through jsDelivr, and the stylesheet is committed under dist/, so installMethod is cdn only; no package manager install is documented. Stars and contributors are the only adoption figures. The README says dark is the default theme, a bundled light theme is selected with a data-theme attribute on the root element, and CSS custom properties can be overridden for a custom theme; it also says the project has no build dependencies and credits Tacit and Water.css as inspiration (not a parent).
