notes: >
  The repository description states the fork ("This is the Mage-OS fork of the Magento core at https://github.com/magento/magento2"), so forkOf names Magento Open Source; the about page adds basedOn and alternativeTo in its own words. serverNeeds keeps the software names only; the minimum dot versions on the install page change more than once a year. Packages are on repo.mage-os.org, not Packagist, so packagistName and packagistDownloads are not recorded; the install docs name mage-os/project-community-edition on that repository. The Composer product package and the project package both carry the same description; currentMajor is 3 from the highest stable version 3.6.0. Mage-OS 4.0 is under discussion on the homepage ("the future of AI in Mage-OS 4.0"); no 4.x release was found, so it is not recorded. The contributor count is the number of pages with per_page=1 and anon=true, which includes anonymous contributors. The adminUi fact comes from the about page wording "refreshed admin panel" and names no admin product. The GitHub repository's license is OSL-3.0; the terms page lists OSL 3.0 and AFL 3.0 for the distribution, so both statements are recorded. The composer require php of 3.6.0 (~8.3.0||~8.4.0||~8.5.0) matches the install page's PHP 8.3 to 8.5 range. The endoflife.date Magento product tracks Adobe's Magento 2.4 line, which is not Mage-OS's own release line, so no endoflifeId is recorded.
