notes: >
  The homepage (trillium.rs) and the guide (trillium.rs/guide/welcome) answer over https and name the same project. The homepage calls Trillium a "modular async Rust web toolkit" and the guide calls it a "web framework"; categories records framework, as the crate keywords do. The project is a set of crates, and the umbrella crate trillium is at 1.4.1 (crates.io, 2026-10-22), which is the package the install docs name, so currentMajor, latestReleaseDate and crateDownloads follow it; the GitHub releases list also carries separate crates (for example trillium-client v0.9.20 on 2026-10-24) that are not the umbrella package. The GitHub API reports Apache-2.0 while trillium/Cargo.toml says "MIT OR Apache-2.0" and the README says both licenses apply at the user's option; each statement is its own license entry. The root workspace Cargo.toml states no rust-version, and the crates.io version metadata carries no rust_version, so runtimeMin is not recorded. runsAs holds always-on from the welcome page, which says the runtime adapter binds a port and listens for TCP connections; the AWS Lambda adapter is listed there too, and the page does not say whether it runs per request, so no per-request value is recorded. The homepage and guide show the copyright holder as Jacob Rothstein (LICENSE-MIT, 2021) with no company or legal form; no hqCountry is stated. Commercial support and consulting are offered on the homepage but no paid edition is named, so paidEdition is not recorded. The homepage says routing, sessions, WebSockets, templates and an HTTP client are separate crates and that nothing else compiles unless it is added, that the runtime is chosen by an adapter (tokio, smol, async-std or AWS Lambda), and that TLS comes from rustls, native-tls or OpenSSL. The homepage says Trillium takes semver seriously and reached 1.0 with a commitment to the current API shape.
