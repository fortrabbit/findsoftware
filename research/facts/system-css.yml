notes: >
  The npm package named system.css belongs to another project (francoisromain, 0.5.3, 2019) and is not recorded; the install docs name @sakun/system.css, which is the package recorded. The registry has no GitHub release or tag for this repository, so latestReleaseDate and currentMajor come from npm (0.1.11, 2023-03-18); major 0 is the stable line the registry carries. The README says the library is inspired by 98.css and that the Chicago 12pt and Geneva 9pt fonts are recreations by a named third party; neither is a basedOn statement. The README says it is "still in beta" and that the maintainer may have missed components; this is a project statement, not an end signal. The homepage links the maintainer's personal Twitter account, not a project account, so x is not recorded. The README says the library "does not use any JavaScript" and is "compatible with any front-end framework", so no runtime or basedOn is recorded. The sponsor CSS Scan is an advertiser, not a relationship, and is not recorded. The README says most styles can be overwritten for deeper customization.
