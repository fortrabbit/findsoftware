notes: >
  The docs site docs.hummingbird.codes renders its pages with JavaScript, so the getting-started page was read only as an empty shell; the docs fact cites the README link instead. The README states no minimum Swift version in text; the Swift 6.1 requirement appears only in a badge, so runtimeMin is not recorded. The README badge also marks the project as a Swift Server Workgroup incubated project and links a Linux Foundation health report; neither is a field. The Package.swift on main declares swift-tools-version 6.2 while the README badge says 6.1, so no minimum is recorded. Mustache is an official extension in a separate repository. The README lists HummingbirdLambda for running on AWS Lambda as an extension; no deployment target is recorded from it. The maintainer is the GitHub organization name, since no page names a legal entity; the project's copyright line in LICENSE.txt has no holder. The homepage lists Bluesky, Discord and Mastodon accounts.
