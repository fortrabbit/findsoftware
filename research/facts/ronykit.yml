notes: >
  No homepage: the project has none on GitHub and its README links only to docs in the repository. The root module is v0.27.4 (GitHub release, 2026-10-25); the ronyup CLI is a separate module with its own tags (ronyup/v0.6.8, 2026-10-25), and both give major 0. The first release is v0.1.1 (2022-01-27); the v0.0.1 tag is dated 2022-01-22, so the year is 2022 either way. The getting-started page states Go 1.25+ and is recorded as runtimeMin; rony/go.mod declares a higher Go and the ee package README states Go 1.27, which are not recorded. The repository states no paid edition; the ee directory is code in the same repository. The README names REST and RPC (WebSocket) as the protocols one handler serves; only REST is recorded as headlessApi. databases is the storage stack the ronyup guide says its MCP server prefers by default. Go modules carry no download figure, so none is recorded.
