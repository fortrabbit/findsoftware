notes: >
  Boundary row settled as accepted: the project's own docs say every PDF operation is "callable from your own code with the REST API", which is an API a site or app calls, so criterion 1 holds (the README's desktop and browser use alone would not). The README's "Enterprise-grade" bullet is kept out: SSO sits in the plans table and the OAuth and SAML pages. The license has two parts: MIT for the content outside the restricted directories and the Stirling PDF User License for engine/, app/proprietary/ and the other listed directories, which says production use needs a valid license; both are recorded as worded. The plans page says Team and Enterprise are paid, Enterprise by sale, and that Stirling Cloud is separate. The plans table puts "OAuth2 / OIDC single sign-on" in the same list as the REST API; the table does not split plans per row, so the sso entry is stated without a plan gate. The database page names a built-in H2 database and PostgreSQL; PostgreSQL as an external database needs a Team or Enterprise licence, and SAML needs an Enterprise licence (SAML page: "SAML needs an Enterprise licence"). The JAR install page gives install steps for Java 25 only and no sentence states a minimum Java version, so runtimeMin is not recorded (the Docker image has Java built in). The homepage line "30M+ downloads, free for individual use" is a download count, not a reportedInstalls figure. The desktop app installers (msi, winget, scoop, dmg, deb, rpm) are on docs.stirlingpdf.com/Desktop/Install/ and recorded as one installMethod. The README names a second Discord invite (discord.gg/HYmhKj45pU) next to the homepage one. The Docker Hub count is for stirlingtools/stirling-pdf, the image the install docs name through docker.stirlingpdf.com; the README badge uses an older namespace. The Docker install page calls Docker "the recommended way to run a Stirling PDF server", which is the always-on runsAs statement; the README says it also runs as a personal desktop app, recorded as local. The homepage stirlingpdf.com named in the candidates row redirects; the README names stirling.com, which serves from www.stirling.com. The social links come from the homepage (X, Discord); LinkedIn is in the homepage too and is kept here as a note only. The maintainer is Stirling PDF Inc. per the LICENSE copyright line and the privacy and terms pages.
