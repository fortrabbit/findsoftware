unreadable:
  - https://docs.curvenote.com (Vercel security checkpoint, HTTP 429 to the fetch; the same pages are served at curvenote.com/docs/cli)
  - https://curvenote.com/docs/publish (HTTP 404; the CSV homepage)
notes: >
  The CSV homepage https://curvenote.com/docs/publish returns 404, so the homepage is https://curvenote.com. The repository is a monorepo (curvenote/curvenote, Bun workspaces); the figures come from the curvenote package the install page names, the CLI itself. The GitHub API reports the license as NOASSERTION for the monorepo, while the LICENSE file and the npm metadata say MIT; both are recorded. The GitHub releases endpoint flags curvenote@0.12.19 as latest, but npm's latest is newer, so the npm version and date are used. npmWeeklyDownloads is the week 2026-10-12 to 2026-10-18. The CLI overview says the CLI "previews a project as a website while you write, exports it to PDF, LaTeX, Word and JATS, and publishes it to Curvenote as a site or a submission to a venue" and is built on MyST Markdown and Jupyter Notebooks; MyST is a markup format with no record in this dataset, so basedOn is not recorded. Hosted part: the Curvenote Scientific Content Management System (SCMS) page at https://curvenote.com/docs/scms says "The Curvenote Scientific Content Management System (SCMS) is the platform for creating, versioning, reviewing, and publishing scientific works." The README says sites "can be easily deployed on a hosting service called curve.space or can also be hosted on your own custom domain" and describes syncing to curvenote.com for collaborators who enjoy "WYSIWYG editing, commenting & real time collaboration". The install page says building and previewing work without an account and that signing in is needed to deploy or submit. The docs site docs.curvenote.com is blocked to automated fetches, so the CLI pages were read at curvenote.com/docs/cli.
