notes: >
  The record has releases on GitHub through 1.3.0 (2025-09-24), so it is not a stub candidate. The README and the docs name Wagtail as the other admin option and the PyPI classifiers list the Wagtail versions the project supports; Wagtail is a choice of admin, not the base, so basedOn is Django only. The PyPI metadata sets the Django range to 5.x and the Python range to 3.10 or later; runtimeMin follows the registry's requires_python. The docs say pip install django-salesman and the installation page's steps add the salesman apps to INSTALLED_APPS and include the API URLs. The docs' contents list basket modifiers, payment methods, order customization, notifications, custom validators and formatters, and swappable models; these stay in prose only and no field holds them. The homepage https://django-salesman.rtfd.io redirects to the Read the Docs site, which is used as the homepage. The PyPI download figure is the pypistats last_month value read 2026-10-23; the CSV's 140 per week is not reproduced. The Credits page lists django-shop, django-oscar, django-cart and longclaw as alternative e-commerce options and says bits of Salesman are inspired by them.
