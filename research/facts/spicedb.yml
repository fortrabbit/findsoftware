notes: >
  Status: accepted from the CSV row. The repository is not archived, its last push and latest release are both recent, and the latest stable release is v1.57.0 dated 2026-10-20. Stable releases: all tags after v1.0.0 are stable except release candidates, the newest prerelease is v1.29.1-rc1 dated 2024-01-30, older than the latest release, so latestPrereleaseDate is not recorded. firstRelease: the oldest tag v0.0.1 has a commit dated 2021-08-23; the repository was created 2021-08-16. Maintainer: the NOTICE file names Authzed, Inc.; the Terms page (hosted on iubenda, linked from the footer) names Authzed, Inc. as the provider, but states no address, so hqCountry is not recorded. Products: the docs mark features by edition; the Debian install page shows Open Source and Enterprise availability, and the enterprise product page says the commercial build carries scoped API access, audit logging, rate limiting and embargoed security fixes; those features are not recorded as fields beyond paidEdition. The AuthZed Cloud and Dedicated products, the management dashboard, and the SpiceDB Operator (a separate repository, authzed/spicedb-operator) are not the server. The community Helm chart is described by the docs as not officially supported, so it is no installMethod. Cloud Spanner is also a supported datastore (recommended for self-hosted Google Cloud deployments); it is not in the databases vocabulary, so it is noted here. The homepage and README also link a LinkedIn page (not a recorded field). The memdb datastore is listed for local development and integration testing; it is not a database value. The docs describe an HTTP/JSON and gRPC API (homepage), recorded here only as a note because apiStyles is a coined field. Criterion 1 wiring: the homepage tells applications to make requests to the HTTP API endpoint, and the protecting-a-blog tutorial in the docs is an application calling SpiceDB. The Google Zanzibar paper is the design source named by the docs, not a parent, so no basedOn. The oso migration guide also exists; no oso fact file exists yet, so only openfga is recorded. The coming-from OPA page names Open Policy Agent; no record id was checked for it. The Docker image is published to Docker Hub, ghcr.io and quay.io; the Docker Hub pull count is the dockerPulls figure. Contributors: 83 by the paged contributors count. The Terms page body is hosted on iubenda, so the legal name comes from that page.
