notes: >
  The LICENSE copyright line reads "Copyright (c) 2022 featbit" and is recorded as the maintainer. The company page names three contracting entities, FeatBit Inc. (Colorado, United States), FeatBit SAS (Paris, France) and Ancient Moon Software Technology Co., Ltd. (Hong Kong), and the terms name FeatBit Inc. as the default provider; none is recorded as maintainer because the LICENSE line names none of them, and no single headquarters is stated, so hqCountry is unknown. The docs call FeatBit an Open Core product: the license docs say the majority of the code is MIT and that certain features need a license key. The Cloud terms say they do not govern Community Edition or customer-managed self-hosted deployments. The pricing page lists Foundation (free, self-host), Enterprise and Enterprise Premium plans; the Enterprise tier is a paid self-hosted plan, recorded in paidEdition without prices. SSO and fine-grained access control are license-key features per the license docs, so sso and userRoles are also covered by paidEdition. The docs and the pricing page describe three self-host sizes (Standalone with Postgres, Standard with Postgres or MongoDB plus Redis, Professional with Kafka and ClickHouse), recorded through the databases facts; the message queue is Postgres, Redis or Kafka and the cache is Redis or none, per the infrastructure components page, and these are noted here only; the compose files are docker-compose.yml, docker-compose-standard.yml and docker-compose-pro.yml. The SDK packages are separate repositories and their downloads are not recorded here. The LinkedIn company page is linked from the homepage and is not recorded. The Helm chart repository is featbit/featbit-charts and the Terraform AWS and Azure projects are separate repositories. The current major is 6, the latest stable release 6.1.0 (2026-10-27). The 6.0.0-preview release is older than the stable release and is not recorded as a prerelease date.
