notes: >
  The maintainer is the name e107 Inc. as the site's press release list on its contact page names it; no page states a legal form. The homepage download banner says "Download v2.1.8", but the same homepage's news lists e107 v2.3.12 released 05 Sep 2026, which matches the GitHub release; currentMajor is 2 either way. The README release lifecycle table shows the 2.3 line as maintained, with no end date set for the newest line. The PHP floor is the composer.json require (>=5.6) and matches the README's PHP compatibility table for the 2.3.12 line. composer.json names GPL-3.0-or-later and the GitHub license field names GPL-3.0; both are recorded. Packagist has no e107inc/e107 or e107/e107 package (checked 2026-10-20). The homepage's social links (x, youtube, chat, blog) are recorded from the homepage's outbound links, which the page text does not label beyond the link names.
