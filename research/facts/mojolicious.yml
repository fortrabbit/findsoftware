notes: >
  Framework in Perl with a source repository on GitHub and a distribution on CPAN. GitHub has tags (v9.53 is the newest tag) and no release objects, so currentMajor and latestReleaseDate come from the CPAN release, which reads 9.53 as the latest release on 2026-10-24. The homepage says the framework is "based upon years of experience developing the Catalyst framework", which describes the authors' experience and not a parent the code is built on; basedOn is absent. The homepage calls the software "Free and Open Source" and the repository license file is the Artistic License 2.0; both are recorded. The homepage states "Most popular distribution on CPAN" as a claim without a figure, so no adoption figure is recorded. The cookbook names Hypnotoad, Morbo and Apache/CGI and PSGI as deployment routes; only the two runsAs values with a quoted statement are recorded. The firstRelease comes from the end of the Changes file, which is in reverse order and whose oldest entry is version 1.0 dated 2010-12-26. The maintainer name is the one the homepage copyright line gives.
