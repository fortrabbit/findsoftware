notes: >
  The English intro names the maintainer as "Alibaba-Taobao front-end architecture team"; no legal entity is stated, so no parent is recorded. The LICENSE copyright line reads "Copyright (c) 2013 - Now midwayjs". The npm package "midway" lists a first version dated 2014 and its description differs from the project's, so firstRelease stays unknown. The deployment page says node starts the project after a server deployment, a start command that does not state what the host must run, so runsAs stays unknown. The GitHub default branch is v4-next. The install command runs create-midway, a scaffolder, so the registry figures come from @midwayjs/core. The Serverless project uses the separate @midwayjs/faas stack, and the functional style uses @midwayjs/core/functional; both are named in the docs and are not recorded as separate facts.
