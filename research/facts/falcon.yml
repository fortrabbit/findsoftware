notes: >
  The homepage calls Falcon an Apache-licensed community project and names Kurt Griffiths as original creator and primary maintainer; the maintainer field follows that wording. The license page's copyright line names Rackspace Hosting, Inc. and other contributors. runsAs is left out: the docs say a WSGI or ASGI server is needed to serve an app and describe an NGINX and uWSGI deployment, but no page states that the app runs as a long-lived process. The community chat is on Gitter (falconry/user and falconry/dev), which has no field. Falcon has no dependencies outside the standard library, as its homepage states, so no dependency fact is recorded. The latest release candidate 4.4.0rc1 (2026-09-28) is older than 4.4.0, so no latestPrereleaseDate is recorded. The PyPI license field is empty; the license is taken from the GitHub API and the project's own license page.
