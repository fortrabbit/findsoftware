notes: >
  The CSV homepage is the http address. It answers over https (http redirects to https), so the record links https://waterlinejs.org. The homepage lists Redis and LDAP as stores beside the README's list; neDB and Redis are not database ids in the dictionary, and LDAP is a protocol, so databases holds the three ids the README names and the others stay here. The README and the Sails site name adapters for a wide range of stores, both core and community maintained; the adapter list is not read, so no adapter count is recorded. The README says Waterline uses an adapter to translate a fixed set of methods into a query the data store understands, and that the same code gets and stores users whether they live in MySQL, MongoDB, neDB or Postgres. The README describes Waterline as the default ORM used in the Sails framework and points to Waterline standalone usage on the Sails site. That is a statement of use, not of building on Sails, so no basedOn is recorded. The Sails Company legal notice names no legal form and no country; the Sails site says the company is based in Austin, TX, which names no country, so hqCountry is not recorded. The npm package waterline first appears as version 0.0.0 on 2012-12-13, before the GitHub repository (created 2013-05-11) and its first tag (0.9.5, 2013-09-27); firstRelease follows the npm upload. The latest npm release is 0.15.2 (2022-12-11), the same day as the last push to master; the GitHub release objects stop at v0.11.6 (2016), while tags run to v0.15.2. The engines field of 0.15.2 names Node >=4, recorded as runtimeMin. The README's @sailsjs Twitter account is named as the way to follow Waterline's security patches and release schedule, and is recorded as x. The README's "Starting with v0.13" note describes the await API, not a requirement, and is not recorded as a minimum. The Sails pages and the About page name The Sails Company as sponsor of Waterline; the record keeps that as the maintainer's copyright line.
