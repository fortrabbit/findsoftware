notes: >
  Status stays accepted: the repository is not archived, the Packagist package is not abandoned, and no page says the project has ended. Release age decides nothing. The installation page documents Laravel 10 for v6 (compatibility table: Laravel 10 with infyomlabs/laravel-generator ^6.0). The LICENSE copyright reads "Copyright (c) 2016 InfyOm Labs", and the footer of the company page reads "InfyOm Technologies Private Limited" with an office address in India (not recorded as hqCountry). The getting-started page lists the Artisan commands php artisan infyom:api, infyom:scaffold and infyom:api_scaffold; it does not say where the generator runs, so runsAs stays unknown. basedOn rests on the installation page, which describes the package as used with Laravel; the composer requires are not the source. The docs index at infyom.com links versioned docs for Laravel 6 to 10; only the 10.0 installation page was read for the install step. The Packagist minimum PHP is ^8.1.0, recorded as >=8.1.
