notes: >
  The GitHub homepage field and the CSV both point to hexdocs.pm/lustre, the package documentation generated from the project's Hex release; no other project site answered with readable content (lustre.dev answers 200 but its body redirects to a GoDaddy for-sale page, so it is not the project's site, and lustre.build redirects to hexdocs.pm/lustre), so that is recorded as the homepage. The GitHub repository has tags up to v5.7.1 but a GitHub release only up to v5.7.0 (2026-05-06); the Hex package 5.7.1 is dated 2026-07-13 and is the latest release, so latestReleaseDate comes from Hex. The first release is the Hex upload of 1.0.0 (2022-05-21), older than the oldest GitHub release (v3.0.4, 2023-09-22). The gleam.toml requires Gleam 1.13.0 or later, while the full-stack deployment guide's Dockerfile pins GLEAM_VERSION v1.12.0; the guide's pin is older than the project's own requirement and is not recorded. The guide states the client code targets JavaScript and the server code targets Erlang; both are recorded in the runtime value. The SPA deployment guide names static hosting services, recorded as runsAs static next to always-on for the full-stack guide. The Discord invite comes from the hexdocs page header. The sponsor link is not recorded as a fact because it is a personal sponsorship page. The database and templating facts are not stated by the project, so they are not recorded: Lustre renders HTML from Gleam functions, not from templates.
