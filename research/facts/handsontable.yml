notes: >
  The http address answers with a 301 to https://handsontable.com/, so the https address is the homepage. The CSV homepage was the docs, which the record keeps as docs. The GitHub license API reports NOASSERTION and npm reports "SEE LICENSE IN LICENSE.txt"; the license entries come from the software license page, which states the two proprietary licenses, and LICENSE.txt at the 18.1.2 tag (same blob as the default branch) names the non-commercial file and the commercial agreement. The software license page says the code was MIT-licensed until version 6.2.2 (released 2018-12-19) and that the last permissive version is 6.2.2; that history is not a license entry. The commercial and non-commercial split is the project's own; the non-commercial key is a keyword passed as licenseKey on the installation page, and the page calls it for non-commercial use only. The pricing page lists plan tiers and a Bundle with HyperFormula, which is a separate product in github.com/handsontable/hyperformula licensed GPLv3 or commercial; plan tiers are not a paidEdition here, and HyperFormula has no record in research/facts. The firstRelease is the oldest GitHub release, v0.10.0-beta1 (2013-10-17); the npm package starts in 2016. The installation page names npm, yarn and pnpm under one package manager sentence, so one npm installMethod is recorded; the CDN route has its own sentence. The runsAs quote is the demo page sentence on where the grid renders; the supported-browsers page is a browser list and is not used. The README names NuGet beside Yarn and the CDN, so NuGet is its own installMethod. No sentence in the fetched docs names Node.js as a runtime; the docs navigation lists server-side rendering examples for Next.js, Astro, Remix and Nuxt, which are not recorded as runtime. The language page states the built-in translations and the layout-direction page the right-to-left setting. The maintainer's legal name is Handsoncode sp. z o.o. on the contact and terms pages, and HANDSONCODE sp. z o. o. in the LICENSE.txt copyright line; the footer gives the copyright as Handsoncode. Other project links on the homepage: LinkedIn (linkedin.com/company/handsontable), the public Slack, Figma and a GitHub organization, which fit no field and are not recorded. The docs describe an AI docs MCP server and skills for Claude Code; they are developer tools and are not a hosted offering. The npm weekly figure is the sum of daily downloads for 2026-11-01 to 2026-11-07. The contributors count is the page number of the rel="last" link with per_page=1. The homepage says the grid is available for React, Angular and Vue, and the installation page offers a framework selector for JavaScript, React, Angular and Vue; the project publishes one package, so no basedOn is set. The software license page says the non-commercial use is limited to research, private study and evaluation, and that use in commercial settings is limited to the evaluation, development and testing tier, with no production stage for a project connected with commercial activity.
