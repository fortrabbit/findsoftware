notes: >
  No stable release exists. Every GitHub tag is a release candidate or preview, and the newest is v2.3.1-rc01 (2026-03-31); the GitHub API reports the rc releases with prerelease false, but the tag names mark them as candidates, so latestPrereleaseDate holds the newest one and currentMajor and latestReleaseDate are absent. No crate named imageflow_tool exists on crates.io, so no registry fallback applies. The README badge reads "state: release candidate". This repository no longer ships an HTTP server: the README says imageflow_server was removed because its web framework is abandoned, and points to Imageflow.Server, a separate repository (imazen/imageflow-dotnet-server, also linked from the docs introduction). The record covers the library and tool in this repository, so the category is media-processing only; Imageflow.Server is a separate project that may become its own candidate. Licenses: AGPL-3.0 (LICENSE file and GitHub API) and a commercial license offered as the alternative (homepage and README, "Visit Imageresizing.net if you need an AGPLv3 exception for commercial use"); the commercial price tiers on imazen.io/pricing are product licenses by organization size and are not recorded as paidEdition, and no prices are recorded. Maintainer: Imazen LLC is the legal entity in the subscription terms, and the privacy page gives its mailing address as "Claymont, DE 19703", which names no country (DE reads as Delaware), so hqCountry is not recorded; the about page names Lilith River as owner. Language bindings (Node, Go, .NET, Ruby, Elixir, Scala) are separate repositories and not recorded. libimageflow is used in-process, so no runsAs is recorded for it; imageflow_tool is a command-line tool with no statement of where it runs. Coined, recorded here only: output formats JPEG, PNG and WebP (docs querystring page, srcset format codes); ImageResizer 4 querystring compatibility (README); an ABI of four methods for bindings (README); linear-light processing (homepage). Contributors counted across all pages with per_page=1 (21). Docker Hub image imazen/imageflow_tool is the image the README names for the tool. The homepage says "If you’re using ImageMagick, switch to imageflow_tool"; no ImageMagick record exists, so alternativeTo is not written. The homepage imageflow.io redirects to www.imageflow.io, which is cited as homepage.
