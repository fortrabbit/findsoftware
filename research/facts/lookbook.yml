notes: >
  Lookbook is the Rails engine the gem lookbook provides; the gem's Ruby requirement is ">= 2.7.0" in lookbook.gemspec at tag v2.3.15. Two license wordings: the LICENSE.txt file reads "The MIT License (MIT)" and the README reads "The gem is available as open source under the terms of the MIT License"; both name MIT and are recorded as one license entry. The first GitHub release is v0.1 (2021-07-29); the first RubyGems version listed is 0.2.0 (2021-08-19); firstRelease is 2021 either way. The homepage says Lookbook is "free, open-source and used by teams of all sizes", with company logos and no count, so no reportedInstalls is recorded. The homepage has no discord, bluesky, mastodon, x or newsletter link; its links are the GitHub repository, the demo at demo.lookbook.build and the author's personal site. The installation guide puts the gem in the development group and mounts the engine inside a development check, and the production guide says Lookbook "does not require any configuration changes to run in production", so the server model is not stated and runsAs is not recorded. The concepts page says a scenario is "roughly analogous" to a Storybook story; that is no basedOn statement. ViewComponent and Phlex are named as components Lookbook previews, and ViewComponent is a gem dependency; neither is a parent. The gem's documentation for Markdown pages says ERB is usable inside them. The homepage and the README name Rails as the host; basedOn is taken from the README's "isolated Rails Engine" wording. The npm and dependent-package counts are not used because the project is a gem. The repository's releases are read from the API with pagination; the oldest is v0.1 and the highest stable release is v2.3.15, so currentMajor is 2. The maintainer is Mark Perkins as the LICENSE copyright line and README state; the GitHub organization is lookbook-hq. The guide pages were read on lookbook.build; the docs/ source in the repository was not. The concepts page says each public method of a preview class is a scenario, and the homepage says Lookbook is compatible with ViewComponent, Phlex and ActionView partials; the production page says the gem must move to the production group and the mount must drop its development check.
