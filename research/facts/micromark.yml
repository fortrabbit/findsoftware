notes: >
  A monorepo (micromark/micromark) whose root readme is the micromark package readme; the npm package micromark is the one the Install section names. Stars, contributors and the release list belong to the monorepo, which also holds the micromark-util and micromark-extension packages. The README's own sentence "This package is ESM only" is the module format, not a runtime; the README states "In Node.js (version 16+)" on the default branch, but the latest release's npm manifest sets no engines field, so no runtimeMin is recorded. The npm weekly figure is the sum of downloads for 2026-11-01 to 2026-11-07. The npm history of the name starts with version 1.0.0 in 2014, a micro templating package by another author, so firstRelease is the 2.0.0 release of 2020-08-20 that the README's origin story names. The homepage is unifiedjs.com, the site the README names "for more about us"; micromark is one of the unified collective's projects. The comparison section names remark, marked and markdown-it as alternatives to micromark; markdown-it and marked are recorded as alternativeTo; remark is an accepted candidate row without a fact file yet, so it is left for when its record exists. The README calls the project a sibling of the Rust markdown-rs; no field holds that. The README says micromark emits concrete tokens and compiles them to HTML, that other tools can build a syntax tree from them, and that GFM, MDX, math and frontmatter support come from extensions. The README shows the same esm.sh import for Deno and for browsers, which is one cdn route; the Deno sentence is the deno runtime entry.
