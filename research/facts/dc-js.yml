notes: >
  The homepage is the project's GitHub Pages site (the README names it as the example site); the npm package homepage field gives the http address, and only the https address is recorded. The README says "We are seeking new maintainers to join Deepak Kumar", which states no end of the project and is not recorded as a status signal; the repository was last pushed 2024-07-31. The repository has no homepage field, and the LICENSE file is the Apache License 2.0 text with no copyright line, so the maintainer is the organization dc-js, which owns the repository. The README says the version 4 line "is compatible with d3 versions 4 and 5" and "is not compatible with IE"; these are compatibility statements and no field. The README and homepage describe the library as built to work natively with crossfilter and rendered with d3.js; both are dependencies named in prose, so neither is a basedOn statement: d3 (record d3) and crossfilter (no fact file). The GitHub release 0.1.0 is dated 2013-09-04; the tag 0.1.0 commit is dated 2012-07-09, which sets firstRelease. The latest npm version 4.2.7 (2021-04-08) is newer than the latest GitHub release 4.0.0 (2020-01-29), so latestReleaseDate comes from npm. The install section also names the d3.js and crossfilter downloads and a GitHub releases download; no installMethod is recorded for the download route, which has no sentence of its own. Stars and contributors are from 2026-11-04.
