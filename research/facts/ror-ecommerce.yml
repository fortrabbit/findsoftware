notes: >
  Stub: the homepage named by the project, http://www.ror-e.com, does not serve the project. http://ror-e.com/ and http://www.ror-e.com/ return a 404 page reading "No such app" (the Heroku error page), and https://www.ror-e.com/ fails its certificate check. The README demo at ror-e.herokuapp.com also returns 404. A live homepage, or the maintainer's confirmation of a new one, would settle it. The project's GitHub Pages site at drhenner.github.io/ror_ecommerce answers 200 and is recorded as docs; its text still describes Rails 3 and Ruby 2.0, while the README says Rails 8.1 and Ruby 3.3.8, so the Pages text is not used for version facts. The newest tag is 2.0.1 (commit dated 2014-07-11); the CHANGELOG lists 2.1.0 with no tag, and the default branch was last pushed 2026-03-14. latestReleaseDate follows the tag, and whether a 2014 tag counts as the current release is for the reviewer. The README links a Google Group for questions at an http-only address, so no forum is recorded.
