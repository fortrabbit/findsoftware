notes: >
  No homepage: the repository's homepage field is empty and the PyPI page links only the repository; the README links the documentation on Read the Docs, which is recorded as docs. installMethod is left out: the installation page names pip only in a shell command, and a command is no quote; the page's own sentence says Rosetta is installed by adding one entry to INSTALLED_APPS and one line to urls.py. The README and docs list automatic translation through DeepL, OpenAI and Google Translate; these are features of the editor, not fields of the record. The repository's default branch is develop; the tagged release is v0.10.3. The README's version notes say Rosetta requires Django 4.2 or later from 0.10.0, which is a dependency statement and is not recorded. Classifiers list Python 3.9 to 3.12, but setup.py names no python_requires, so runtimeMin is left out. The maintainer is the LICENSE copyright holder and the setup.py author. The 0.x line is the only line: currentMajor takes the major 0 and the reviewer decides whether a pre-1.0 major belongs in the field. The PyPI JSON carries no download counts, so pypiDownloads comes from pypistats.org. firstRelease is the oldest PyPI upload, 0.6.2 on 2011-06-16, the same day as the GitHub repository's creation.
