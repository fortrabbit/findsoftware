notes: >
  No homepage: the GitHub homepage field is empty and the repository is the only project site, so the record is repo-only. The PyPI package blo, the one the install docs name, has release 0.8 published 2017-10-04, newer than the only GitHub release, so currentMajor and latestReleaseDate follow PyPI; the first PyPI upload (0.1) is dated 2015-12-06. The README calls Blo a static site generator and describes the commands, but no page states the form of the built output, so renderingModes and a static runsAs are not recorded. The README's "blo serve" command is recorded as runsAs local. No Python version is stated, so runtimeMin is unknown. The README lists Markdown as the content format (coined field contentFormats, not recorded as a fact), Pygments code highlighting, RSS feed generation and pagination. The README places global site variables and technical paths in default.json and the draft templates in draft_templates.json, and its customize section adds a content type with an HTML template in the templates folder plus an entry in draft_templates.json.
