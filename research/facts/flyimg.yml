notes: >
  The install guide routes are the Docker image, a source build from git and a Helm chart; the Elastic Beanstalk and DigitalOcean provision scripts are recorded as one installMethod entry; the docs link their repositories without steps on the page. The composer.json at the 1.12.13 tag requires PHP 8.1 or newer, but the product ships as a Docker image, so runtimeMin is not recorded; the reviewer may decide the composer requirement counts. The license fact describes the latest release, and the composer.json at that tag also says AGPL-3.0. The maintainer is the composer.json author marked "Maintainer", since the LICENSE is the unmodified AGPL text with no copyright line. The Packagist package flyimg/flyimg exists (README badge) but no install page names it, so no Packagist figure is recorded. Image library: the repository description says the app resizes "using ImageMagick", and the README says JPEG XL output goes "via ImageMagick when enabled"; no libvips. Output formats named by the README: AVIF (default when the browser supports it), WebP, MozJPEG, PNG, GIF and JPEG XL. URL signing: the docs security page describes signature generation with encrypted URLs and domain restrictions. Storage: the storage option names local and S3 (the Flysystem adapter list also names Azure, FTP, Dropbox only as possible additions). Redis is an optional rate-limit store, not a database the software needs. Demo at demo.flyimg.io and adopters in ADOPTERS.md. Social: LinkedIn at linkedin.com/company/flyimg is linked from the docs page (coined, not recorded). The homepage carries no legal name or address; the Open Collective sponsorship page is linked from the README. Request pattern: options go in the URL path before the source image URL (for example w_250,q_50 followed by the image address), under /upload/; a second mode returns the path of the stored image as a string, and POST uploads with a body or a data URI are supported. The docs home line "One Docker container to build your own Cloudinary-like service" is a description, not a comparison page, so alternativeTo stays out.
