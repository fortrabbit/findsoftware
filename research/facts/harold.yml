notes: >
  The install docs name create-harold-app, a create-* scaffolder, so the registry figures come from harold-scripts, the package the docs say it installs; create-harold-app itself had 29 npm downloads in the same week (2026-10-12 to 2026-10-18). The npm package named harold belongs to another author (lacyrhoades, version 0.2.2) and is not this project. The maintainer name comes from the MIT license copyright line. The homepage says the default template includes a Lunr-powered search setup; that is a template feature and is not recorded as a field.
  The getting-started page says harold-scripts runs the dev server and the build, that the templates include SCSS styling, and that the directory names for content and layouts should be changed right after init; with the search system, postsPath in harold-search.js changes too.
