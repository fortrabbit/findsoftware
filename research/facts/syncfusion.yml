notes: >
  The npm figure counts @syncfusion/ej2, the umbrella package the README badge names and the install guide describes as "a single" package; the grid guide's example installs the per-control @syncfusion/ej2-grids, which has its own count and is not recorded, so the umbrella figure is low relative to the suite. The README says the library holds "over 65" components and the homepage says "over 140"; no count is recorded. The homepage states "51.5M+ downloads" with no period and is not recorded as a figure. The license is a proprietary EULA. The legal name follows the privacy policy and the site footer ("Syncfusion ® , Inc."); hqCountry is the contact page's headquarters address. The pricing page states every product is licensed per developer, per year; that is the paidEdition fact, prices are not recorded. The homepage FAQ adds a ten-employee limit to the Community License that the README omits; the homepage wording is recorded. The GitHub repository carries no detected license (NOASSERTION); the source is public under the EULA. The x, facebook and instagram links are the homepage's icon links; the homepage has no visible text for them, so they have no quote. The forum link is the EJ2 forum on the homepage. firstRelease is the oldest GitHub release in this repository (a preview, 2017-05-23); the npm package was created 2017-05-10. The contributors count reads the rel=last page of the contributors endpoint.
