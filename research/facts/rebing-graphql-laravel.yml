notes: >
  The project has no homepage of its own: composer.json names http://www.rebing.ee, a plain http page for the company Rebing OÜ, which is not recorded as a homepage. The LICENSE line names Mikk Mihkel Nurges and the maintainer follows it; composer.json lists Rebing OÜ as a company author, a legal entity recorded here only. The README's Slack badge is a community invite link and is not recorded. The README says subscriptions are not supported and points to Lighthouse as a dedicated solution for them; that is a pointer to a feature gap, not an alternativeTo statement. The optional mll-lab/laravel-graphiql package adds an in-browser GraphiQL IDE, which is no admin UI. The README names the webonyx/graphql-php package in the Requirements table at ^15.22.1 while composer.json at 10.2.0 requires ^15.31.0; the composer file is the one recorded as the package's requirement. The 10.0.0 release candidates are earlier than the stable 10.0.0 and carry no latestPrereleaseDate. Coined kinds from the README, left out of fields: code-first schema (types, queries and mutations are PHP classes, not .graphql files), multiple schemas, each with its own queries, mutations, types, HTTP middleware and execution middleware, dataloaders for any data source, SelectFields as an optional separate package for Eloquent column and eager-load selection, validation, authorization, automatic persisted queries, OpenTelemetry tracing, query depth and complexity limits, and resolver middleware. Introspection is disabled by default in the configuration.
