notes: >
  The project publishes to JSR as @mastrojs/mastro; the readme and getting-started page name the create-mastro scaffolder, which is published on npm as @mastrojs/create-mastro, and no npm package named @mastrojs/mastro exists, so no npm figures are recorded. The npm package named mastro (latest 0.0.10) is the project's earlier package: its repository field names mastrojs/mastro and its registry entry is flagged deprecated with the text "Package no longer supported", and its license field reads GPLv3. The install docs no longer name it and the project's current release is on JSR, so the deprecation is not counted as an end signal and status stays accepted; the reviewer should decide. The npm mastro package is also not used for downloads or npmName. The GitHub repository has no releases and no tags; the major and the latest release date come from JSR, where 0.8.10 was created 2026-07-27. The first version is the npm 0.0.1 of 2024-11-29. The getting-started page names Deno, Node.js or Bun for generating a static site for any CDN, and the deploy page names Cloudflare Workers for on-demand code at the edge; no page states a per-request run mode for Workers, so per-request is not recorded. The browser runsAs value covers the optional Service Worker mode that the getting-started page describes, not the default. The readme also names a Stoat chat, which has no field. The homepage has no mastodon or x link. The readme lists third-party packages such as Sveltia CMS and Kysely as installable extensions, not recorded as facts.
