notes: >
  Discontinued on two signals: the README note dated 2026-06-05 says the project is no longer maintained and will not get future releases, and the repository the project names as its source is archived on GitHub. The candidates row was a boundary row for that reason. The PyPI release 6.4.0 of 2026-06-05 is the last one, and it has no GitHub release object, so currentMajor and latestReleaseDate come from PyPI. No homepage is recorded: the readthedocs site is the project's documentation, and the repository is the project's source. The docs page carries the same end note. The Mozilla Foundation is the copyright holder in the LICENSE; the country of the foundation is not stated on a page read, so hqCountry is not recorded. The pypistats figure is the last-month count recorded with its date. The README's note names no successor. The first upload on PyPI is version 0.2.1, dated 2010-02-23.
