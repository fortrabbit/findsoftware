notes: >
  No homepage: the GitHub repository has no homepage field and the README names none. The repository is archived (last push 2018-06-22), and the Packagist package elazar/scribing is flagged abandoned on version 0.6.0 with no replacement named. The GitHub API lists no releases; the highest stable tag is 0.6.0 (major 0), and the release date is the Packagist time of that version. The README gives no PHP version and the Packagist requirements list none, so runtimeMin is unknown. The README gives the command forms build:posts, build:pages and build:feed, which are not recorded as buildCommand because they take paths as arguments. The README's Feed section builds an Atom feed; it is not recorded as a field. The GitHub Pages hosting is a recommendation in the README for a separate repository, recorded as runsAs static. Scribing's MIT license is stated in both the README and the LICENSE.md file; the copyright line names Matthew Turland.
