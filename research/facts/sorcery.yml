notes: >
  Status: accepted; no end signal. The repository is not archived; the README names no successor and no end. No homepage: the candidate row names the RubyGems page, and the gemspec homepage is the GitHub repository, so the record is repo-only. Maintainer follows the LICENSE.md copyright line, Noam Ben-Ari (2010). The README's Current Maintainers list names Shinichi Maeshima and Brendon Muir, and the repository owner is the Sorcery organization; a reviewer may prefer either. The category is auth, the vocabulary value for authentication. The README's OAuth support (Twitter, Facebook, GitHub, Google and others) is login from a Rails app to third-party providers, not single sign-on, so sso is not recorded. The README states "Supports ActiveRecord, DataMapper, Mongoid and MongoMapper"; it names ActiveRecord, DataMapper, Mongoid and MongoMapper as the ORMs it supports, and no database by name, so databases is not recorded. The README says it is inspired by Restful Authentication, Authlogic and Devise; that is inspiration, not alternativeTo. The install generator (rails generate sorcery:install) writes a migration, an initializer and a User model; it is a setup step, not a runsAs statement. Configuration sits in one initializer file. The README says to use the library's methods inside the application's own MVC structures. The runtime and runtimeMin come from the gemspec at tag v0.18.0. The RubyGems total downloads figure is all-time. Contributors counted with per_page=1 across all pages.
