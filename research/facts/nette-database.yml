notes: >
  The homepage is the package's own documentation page, doc.nette.org/database, which the URL redirects to doc.nette.org/en/database; nette.org is the Nette family site and is recorded on the nette record. The package is one of the standalone components of the Nette family, not software built on the Nette Framework, so no basedOn or parent is recorded. The README on master says it requires PHP 8.4 and supports PHP up to 8.6; composer.json at the latest tag v3.2.10 says "8.1 - 8.6", and the manifest at the latest release is the recorded runtimeMin. The database list is the repository description, which names MySQL, PostgreSQL, SQLite, MS SQL Server and Oracle; the core documentation table lists the same servers with mssql (PDO_DBLIB) and odbc as additional DSN names, and marks Oracle, PDO_DBLIB and ODBC as not supported by the Explorer layer. The license entries come from the LICENSE file at the v3.2.10 tag, in its own words: the New BSD License, or the GNU General Public License version 2 or 3; the composer.json at that tag lists the same three ids. GitHub detects no license. The license text asks users not to use the word Nette in a project name or top-level domain, calling it a protected trademark. The first tag is v2.2.0, whose commit is dated 2014-05-11, the same date as the oldest Packagist upload; the oldest GitHub release is also v2.2.0. The forum, Discord and X links are in the footer of the package's documentation page and belong to the Nette family; the page footer also names David Grudl in its copyright line. The prerelease v4.0.0-RC1 is older than the latest release, so no latestPrereleaseDate is recorded. The repository is not a monorepo.
