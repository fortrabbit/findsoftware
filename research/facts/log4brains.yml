notes: >
  The project has no homepage: the GitHub repository's homepage field points at the GitHub Pages root, which answers 404 on 2026-10-21, and the /adr/ path is the project's own example knowledge base, which the README links as "See an example", not a homepage. The README also states that Next.js is used under the hood for the web UI and the static site generation; that is a dependency, so basedOn is not recorded. A Docker image is mentioned in the FAQ and not recorded as an install method. The README lists a local preview with hot reload, searchable ADRs, a timeline menu, a customizable template (default MADR) and support for mono and multi package projects. The install steps are in the README (npm install -g log4brains, then log4brains init), so criterion 3 is met. The README names a beta line installed with log4brains@beta; no beta release date is recorded. The npm registry figures are for the log4brains package the install command names. The GitHub default branch is develop and was last pushed on 2024-12-17, the same day as the latest release.
