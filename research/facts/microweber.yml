notes: >
  The project's own site microweber.org answers 403 with a Cloudflare challenge to curl and WebFetch, so the homepage fact comes from the GitHub API homepage field and every page fact comes from the repository README, LICENSE and composer.json on master. The README states PHP >= 8.2 while the v2.0.20 package on Packagist requires php >=8.1; both are recorded as separate runtimeMin entries. The README says the master branch carries stable releases and the install command uses dev-master; the latest stable release is v2.0.20 (2025-08-14), and the repository was pushed on 2026-10-19 with no release since. GitHub's language field reports HTML; the main implementation language is PHP per composer.json. The Packagist maintainers are individuals and are not recorded. Microweber is described as "based on the PHP Laravel Framework", so Laravel is the basedOn entry; the current Laravel major is not recorded here.
