  - "https://ketchuphq.com/docs (linked from the README as the user documentation; HTTP 522)"
notes: >
  Stub: the homepage ketchuphq.com, which the GitHub repository lists, returns HTTP 522 from its Cloudflare edge on every attempt, so the project's own site and user docs cannot be read and whether they still show the software is in doubt; a reachable https answer from ketchuphq.com would settle it. No homepage is recorded. The README and the repository's own files describe the software and its build: make prepare, then make, which builds the ketchup binary with the admin embedded, and a releases page for downloads. The latest GitHub release is v0.3.1 from 2018-06-03, and the last push is 2024-11-29; the repository is not archived and names no successor. The LICENSE file has no copyright line, so the maintainer is recorded as the GitHub organization that owns the repository, which is the only name the sources give. The changelog says the admin was migrated to React and that live preview was added in 0.3.0; the README lists a JSON API and a headless use, which is not recorded as REST or GraphQL. The README says making authentication, the database and the template engine swappable is a goal that is a work in progress. Adoption: the GitHub stargazer count is 394 on the research date, and the contributors endpoint lists one contributor. The README's Go 1.9 minimum is a build requirement, so it is recorded as the Go runtime without a version. The first release is v0.1.0 from 2017-04-24, the year of the first GitHub release, and the repository was created in 2017. The README lists automatic HTTPS with Let's Encrypt certificates and themes that are version-controlled outside Ketchup and pulled in with git. The README says templates declare content fields that the frontend renders, so editors can make edits.
