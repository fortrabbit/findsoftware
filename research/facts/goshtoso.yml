notes: >
  Goshtoso is a library: a Go module imported into a Go server, with a demo site under site/ that the repository's own docs describe as a separate module. The homepage is https and answers 200. The repository README states the project began as a hard fork of PenguinUI, recorded as forkOf and not basedOn, since the README names the fork relation and no page names a framework the library is built on. The homepage calls Arai Hû the organization behind Goshtoso; no legal name or legal form was found on the homepage, the privacy page or the Arai Hû site, so maintainer keeps the name as the homepage states it. The LICENSE copyright line reads "Copyright (c) 2025 Goshtoso contributors" and is not a named maintainer. The current GitHub release is v0.4.4 (2026-10-25); the oldest GitHub release is v0.0.2 (2026-06-03), so firstRelease is 2026. Contributors are counted without anon=true (the logged-in contributors page, last page 4). The README says the components are usable but the API is still being refined, and the README points to ROADMAP.md for its alpha stability policy; that status is not recorded as a field. The homepage states static output ("serve them from any static host"); the README's server example (http.ListenAndServe) shows a long-running Go process, but no page uses an always-on statement, so runsAs is left out for the reviewer to decide. Go 1.27.0 is taken from the README requirement line; the go.mod was not read.
