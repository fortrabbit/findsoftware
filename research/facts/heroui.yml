notes: >
  The project was named NextUI before the rename: the homepage title reads "HeroUI v3 (Previously NextUI)" and the repository description says "Previously NextUI", so the record's name is HeroUI and the prior name is stated, not treated as a separate record. The legal name on the footer of heroui.com and heroui.pro is NextUI Inc., recorded as the maintainer because no other legal name appears; the company name and the project name differ and the record keeps both as the site states them. The homepage says the web library combines React Aria Components with Tailwind CSS v4 and that teams can use the free packages; the quick-start page says to import tailwindcss before @heroui/styles. The quick-start page states two requirements, React 19 or later and Tailwind CSS v4; they are not recorded as runtime or runtimeMin because they are framework and styling requirements, not a runtime. The web library's styling is described as Tailwind CSS v4 on the homepage; it is not recorded as basedOn, which takes the UI framework only. The docs footer carries a "Hero Newsletter" subscribe form with no link, so no newsletter fact. The Pro edition is a separate commercial product with its own pricing page; its prices are not recorded. The GitHub contributor count excludes anonymous accounts. ecosyste.ms reports zero dependent repositories and packages for @heroui/react, which conflicts with the package's download figures, so no dependent counts are recorded. The repository's package tags still carry the @nextui-org scope, which is older naming, not a second project.
