notes: >
  The postgresql metadata store is a dependency of the engine (docker-simple guide: "Hasura relies on this database to store its metadata"). The community page also links a LinkedIn page.   The record covers the v2 engine, the line the README calls the current stable version ("Hasura V2 is the current stable version of the Hasura GraphQL Engine"). The same repository holds the v3 engine behind Hasura DDN (README: "The future of data delivery is GA"), and its pricing page at https://hasura.io/pricing/ prices DDN, not v2; neither is recorded beyond the pricing link, for a reviewer to decide whether a v3 record is wanted. The GitHub language split is TypeScript 11.99 MB, Haskell 10.31 MB and Rust 4.35 MB; language is recorded as Haskell because the v2 server is the Haskell part. The README excludes the v2 console directory from its MIT statement and names no license for it; the MIT entry covers the v2 docs and community directories only. firstRelease is the oldest release in the repository, v1.0.0-alpha01 of 2018-07-03, which predates the v2 line. The Hasura Enterprise edition is a Docker image with proprietary components enabled by a license key (try-hasura-enterprise-edition page). The jwt and webhook authentication modes on the auth overview page are not recorded as protocols. Hasura Cloud is a managed instance of the same engine; the pricing for it is not recorded. The footer of the legal page names Facebook, Instagram and X, and a Discord invite; the Docker Hub figure counts all tags of hasura/graphql-engine since the repository was created, as the Docker Hub API reports it. MySQL, Snowflake, Amazon Athena, Oracle, MariaDB and MongoDB are listed as Enterprise Edition databases on the Enterprise overview. The about page says "offices in San Francisco & Bangalore".
