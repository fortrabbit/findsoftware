notes: >
  The HTTP APIs reference at v2.api.reactbricks.com/docs is a Swagger UI page with no statement of the API style in its text, so headlessApi stays unknown.
  The terms (legal/terms) name F2 .net engineering s.r.l. at Via Locatelli 62, Bergamo, Italy, and the privacy page repeats the address; the footer copyright reads 2019 to 2026.
  The terms say the open source licenses govern the use of the components of the React Bricks package; the SDK and client repositories are not recorded, since hosted-service records take nothing from them.
  The product-facts file says the frontend can be hosted on Vercel, Netlify, AWS, on-premises or another host; it describes the user's own frontend and is not recorded as a deployment option of the CMS.
  The pricing page lists plans and the prices are not recorded; the features used here are plan rows with "Included" or "Optional".
  The product-facts file says the company holds ISO/IEC 27001 certification; not a field, so it is not recorded.
  The changelog's oldest visible entries are from 2021 and 2022, and no first release year is stated, so firstRelease stays unknown. The llms.txt lists comparison pages against Webflow, Builder.io, Plasmic, Prismic, Contentful, Sanity, Tina CMS, Strapi and WordPress, recorded as alternativeTo. The product-facts file says developers define content bricks as React components with sidebar controls for editor customization, that the primary frontend targets are Next.js and Astro, and that standard plans use hosted CMS APIs while enterprise customers can discuss optional self-hosted backend APIs. The docs landing page and API introduction do not state an API style.
