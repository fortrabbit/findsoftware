notes: >
  Doubt, to settle before this record leaves stub: cState is a status-page product, and status pages are a finished application under criterion 1, but it is also a Hugo theme that a creator clones into a site they host themselves, which is the reading criterion 1 allows for a generator. The homepage title reads "Static status pages for teams that want full control", the README calls the generated output "a new site powered by cState", and the status page is the product the creator deploys. The reviewer decides whether a self-hosted status page is a site a creator builds (keep, with basedOn hugo) or a finished application (reject on criterion 1). The HTML embed in the cstate/html-embed repository is a small JavaScript snippet (dot indicator or alert box) that a creator pastes into another site; it reads the status page read-only JSON API and shows an alert or dot on that site when the status page has active issues, so the status page can be embedded into a site only as that indicator, not as the full page. That embed is a separate repository and the stub rests on the status page itself being the product. The CSV homepage cstate.netlify.app returns 404; the project's own site named by the README and the GitHub homepage is cstate.uncascade.com. Release dates: the highest stable release is 6.0.2 (2026-10-15), and v7-r1 (2026-10-17) is a GitHub prerelease, so it is latestPrereleaseDate. The MIT line in the README names the copyright holder as Mantas Vilčinskas, linking vilcinskas.me, and the LICENSE.md copyright line matches; no legal form or country is stated, so hqCountry is not recorded. The repository has no published JavaScript package, so no npm figure applies. The README requires Hugo 0.80 or later; that is a Hugo version, not a runtime version of cState, so runtimeMin is not recorded. The README says cState "cannot directly monitor any services in real time", which is the reason for its static design; the status is written by hand, from the command line or through a CMS. The project also offers an RSS feed and a read-only JSON API for custom integrations and badges. The homepage is a JavaScript shell whose title is the quoted line. The Sponsors section links a donation page and is not recorded.
