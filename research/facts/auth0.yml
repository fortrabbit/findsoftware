notes: >
  The record covers the hosted Auth0 service. The GitHub organization auth0 publishes client libraries (the auth0.js browser SDK among them) and the auth0-cli command line tool; they are SDKs and tools for the service, so no repository, license, stars or npm figure is recorded here (the CSV row gave 132.9 thousand weekly npm downloads for auth0-js and 1.1 thousand stars for the SDK repository; both are client-side figures and stay in the CSV). The pricing page describes four deployment types (public cloud multi-tenant, private cloud basic and others) without naming data regions, so regions is unknown. The service has no open-source server, and no install step, so repository, license, releases and installMethod are not recorded. The pricing page's "Private Deployment Add-on" and the Private Cloud on AWS and Azure options are dedicated, vendor-managed deployments, not a self-install, so selfHostOption is unknown. The pricing page lists Free, Essentials, Professional and Enterprise plans without the prices recorded here, and the B2B plan features it names (Self-Service SSO, SCIM) are recorded as they appear in the Free column of the table. The privacy policy names Okta, Inc. (including its subsidiary Auth0, LLC) with a San Francisco address; hqCountry follows that address. The page of the company (okta.com/company) names a San Francisco headquarters too. No founding year or first release was found on the pages read, so firstRelease is unknown. The enterprise identity providers page lists Active Directory/LDAP, OpenID Connect and SAML, each recorded as its own sso entry. The pricing page says to build in 30+ languages and frameworks; this is a coined kind, so it stays in notes. The security page redirects to security.okta.com, which lists GDPR, HIPAA, SOC 2 and ISO 27001 / 27017 / 27018 reports for Okta; these are claims of the parent with no field. No page read lists data regions.
