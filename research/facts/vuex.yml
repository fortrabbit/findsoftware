notes: >
  "The official state management library for Vue has changed to Pinia." This is on the homepage and in the README, under the heading "Pinia is now the new default". The same notice says Vuex 3 and 4 will still be maintained, that new functionality is unlikely, and that Pinia is recommended for new projects. That is a maintenance-mode statement by the maintainers, so the status is stub, not discontinued; it is settled when the maintainers change the notice or state an end. The alternativeTo pinia entry rests on that switching sentence and the pinia fact file. The README says Vuex and Pinia can be installed in the same project and that migrating an existing app may suit Pinia. The installation page names the CDN route through unpkg.com and the npm route with the next tag; the next tag points to 4.0.2 and latest to 4.1.0, dated 2022-10-14, which is recorded. The GitHub release v4.0.2 is dated 2021-06-17 and is the newest GitHub release, so the registry version is the one recorded for latestReleaseDate. The LICENSE copyright line names Evan You and the year range 2015 to present. The README's Questions section names the Vue Discord chat server and the official forum for questions and support, and its Stay In Touch section names the @vuejs account on Twitter; they are the Vue organization's channels, recorded as the README states them (the forum address now redirects to the vuejs/core GitHub Discussions). The repository is a single package, so stars and contributors belong to the package. The npm figure counts downloads of vuex, the package the install page names. The earliest npm upload is 0.1.0 from 2015-12-06, which sets firstRelease.
