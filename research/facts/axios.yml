notes: >
  The homepage axios-http.com answers 301 to axios.rest, the project's docs site, which is the homepage recorded here (final URL after redirects). The install page names npm, pnpm, yarn, bun and deno; the CDN route is jsDelivr (script tag with a pinned version), and the page also says unpkg is supported without a quoted example, so no unpkg entry. npmWeeklyDownloads is the sum of 2026-10-26 to 2026-11-01, the period in the value; the npm package is the install target named on the page. The npm 'latest' tag is 1.21.0 (GitHub release 2026-10-26; npm time 2026-10-27). The v0 line is on npm under the dist-tag v0x: 0.35.0, GitHub release 2026-11-02, npm time 2026-11-03. latestReleaseDate takes the newest stable release by date, which is the v0 line; currentMajor is 1, the highest stable version. Both lines publish releases; the repository default branch is v1.x. The package.json at v1.21.0 has no engines field, so runtimeMin stays out. The HTTP Archive technology entry "Axios" uses the mobile origins figure (105117); desktop is 74990. The LICENSE copyright line names "Matt Zabriskie & Collaborators" without a legal form; no company is named as the maintainer, so the GitHub organization axios is recorded as the repository owner. The homepage sponsor list is an advertising list of unrelated casino, gambling and follower-selling sites plus sponsors; none is recorded. The homepage links HeroDevs' paid extended security support for axios v0 ("Get Security Updates for Axios v0"); that is a third-party support offer, not an edition of axios, so paidEdition stays out. The homepage Discord and Bluesky links are labeled "Socket on Discord" and "Socket on Bluesky" (a sponsor's accounts), so no social field is recorded. The repository contributors count is the page number of the last page at per_page=1. The CSV's boundary note is settled by the brief: HTTP clients are helper libraries, so the status is accepted.
