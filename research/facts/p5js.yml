notes: >
  The copyright page names p5.js Contributors and the Processing Foundation together as developers; the maintainer follows the project's own name, and the foundation is named here only as a developer, reviewer to confirm. The repository description says p5.js is based on the core principles of Processing; Processing is not a record, so no basedOn value. The copyright page says the Reference and Examples pages are licensed under CC BY-NC-SA 4.0 and the rest of the website under MIT; the copyright page and the repository's LGPL 2.1 license file place the library under LGPL-2.1, which is recorded. The website and documentation licenses are not recorded as license entries because they cover the site and the docs, not the library; the copyright page says CC BY-NC-SA 4.0 allows reuse of its content for non-commercial purposes with credit. Reviewer may want them as entries. The README says p5.js is maintained mostly by volunteers. The p5.sound.js library is a separate package and is not part of this record. The website's p5.js web editor is an online editor for sketches, not a hosted service for building with the library, so no hostedOffering. The YouTube channel linked in the homepage footer belongs to the Processing Foundation. No page states where the library runs in words, so runsAs is not recorded. The npm figure counts downloads of the p5 package; the download page's jsDelivr CDN URLs serve that same npm package. The GitHub releases list shows a v1 line (v1.11.x) as well; the stable v2 line is the current major. The first npm upload (2014-03) predates the oldest GitHub version tag (2014-07), so firstRelease is the npm year. Contributors counted with per_page=1.
