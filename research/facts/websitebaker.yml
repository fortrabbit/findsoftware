notes: >
  Stub: the site offers a ZIP download and an installer, and it states PHP and MySQL requirements, but no page shows a stable release version or date (the only version page is "Preview 214", a demo), and no repository names the project; the download area or a dated release list on the project's own site would settle the release age. The GitHub repository Websitebaker-zz/WebsiteBaker is empty (no pushed date, no releases, no README) and is not named by the project, so it is not a source. The license page says "released under the GNU General Public License" without a version, so no license SPDX id is recorded. The requirements conflict: the features page says "PHP 8.2 and up", and the installation guide says "ab 8.1 bis einschließlich PHP-8.3" and recommends at least 8.2; both are the project's statements and both are recorded as runtimeMin entries. The installation guide also lists Linux as the operating system and Apache as the web server. The copyright line gives 2004 to 2026 for the association, which is not a first release date, so firstRelease is unknown.
  At the time of the last check websitebaker.org answered every request with HTTP 503 (a forbidden notice), so the quotes taken from it were confirmed on an earlier read the same day and could not be re-fetched.
