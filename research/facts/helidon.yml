notes: >
  The homepage shows Helidon 27.0.0 and the docs for Helidon 27 state the Java 27 requirement; the GitHub release 27.0.1 is the highest stable release and sets currentMajor. The 4.x and 3.x release lines are published on the same repository with their own tags; the record follows the highest stable release, as the write rules say. The README names the Maven group id io.helidon; the web server artifact io.helidon.webserver:helidon-webserver is read from Maven Central's metadata. The X link is the project's homepage link without visible text, so it carries no quote. The homepage also links a community Slack (slack.helidon.io) and Stack Overflow tag; slack is not a field. The homepage describes Helidon applications as standalone JVM processes, which is the runsAs quote. The Oracle copyright holder name is recorded as the LICENSE and footer state it.
