notes: |-
  The homepage now presents Jupyter Book 2, a Python-installed CLI around the MyST Document Engine (mystmd, jupyter-book/mystmd), which is recorded as basedOn without its own fact file. The docs at /en/stable and the Jupyter Book 1 pages describe the Sphinx-based 1.x line (pip install "jupyter-book<2"), which the FAQ says is in maintenance mode; that is a statement about 1.x, not an end of the project, so status stays accepted. Version 1.x lives on the v1 branch of the same repository. The release list holds the v1 tags, so currentMajor is the highest stable tag, v2.1.7. PyPI reports no license field; the license comes from the GitHub license API. The npm package jupyter-book (BSD-3-Clause, engines node 18 or later) carries the same version as PyPI, so the npm figure is recorded for that package. No runtime node fact is recorded: the install page offers npm but states no Node requirement (the npm registry lists engines node 18 or later). No language fact is recorded: GitHub reports TypeScript for the repository while the tool installs from PyPI as a Python package. PyPI offers no download figures, so pypiDownloads is not recorded. The maintainer is the Jupyter Book Project as the README names it; the README gives no legal form. The README says a build runs the embedded code cells, caches their outputs, and converts the content into a web book and a publication-quality PDF. The jupyter-book.org homepage links Discord to discord.mystmd.org and Discussions to the organization's GitHub discussions, both listed under the homepage's Get Help section. Bluesky and Mastodon links on the site belong to the MyST account (mystmd.org), not to this project, so they are not recorded.
   firstRelease is the 2018 v0.1 GitHub release; every 0.x release is flagged as a prerelease there, and PyPI dates its first upload to 2019. mystmd has no record yet and is a candidate to add.
