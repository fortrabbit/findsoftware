notes: >
  GitHub reports the license as NOASSERTION, and the LICENSE file offers two licences: GPLv3 for the Vendure Community Edition, and the Vendure Commercial License for commercial distributions. The npm package states GPL-3.0-or-later, which differs from the LICENSE file's GPL version 3 text, so both are recorded. The Node.js requirement is "^20.19.0 || >=22.12.0" in package.json and the docs list Node.js 20, 22 and 24 as tested, so runtimeMin is 20. The pricing page says Vendure Cloud is a closed beta with general availability planned for Q1 2027, so the hosted option is not recorded as generally available. No company legal name or headquarters appears on the pages read, so maintainer is not recorded. The homepage's "Vendure vs" links are comparison pages and are not recorded as alternativeTo.
