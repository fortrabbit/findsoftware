notes: >
  The npm latest tag is 1.6.4 (2025-08-05), inside the 24-month window; the 2.0.0 alpha line (alpha.20 on 2026-09-04) is on the next tag, and the Getting Started guide already installs vitepress@next with Node.js 22, so runtimeMin describes the v2 line the docs target. GitHub marks the v2 alphas as full releases (prerelease false), so GitHub's releases/latest returns the alpha. The What is VitePress page says the Vue team picked VitePress as its long-term recommended SSG; the copyright names Evan You, and no company is named, so maintainerType is community. The homepage links only GitHub, no chat or social accounts, and the project has no plugin or theme directory. The init wizard scaffolds from the repository template rather than a list of named starters. Coined fields: contentFormats, preReleaseVersion, preReleaseDate. contributors is the GitHub API count including anonymous contributors.
