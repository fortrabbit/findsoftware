notes: >
  The project's FAQ says Garnet is not associated with Redis, so no basedOn or alternativeTo is recorded; it is inspired by the RESP protocol and works with unmodified Redis clients, which the homepage and README state as compatibility. The Azure offering is a fully managed Azure Cosmos DB Garnet Cache in expanded Private Preview, per its own page, a private preview cloud is no hostedOffering, so nothing is recorded for it. The latest stable release is v2.2.5 (2026-10-28); the v2.0.1 beta and the other prereleases are older than it and are not recorded as latestPrereleaseDate. firstRelease is the oldest GitHub release, v1.0.0 (2024-03-18); the repository was created 2023-08-21 without a release before 1.0.0. The runtime minimum comes from Directory.Build.props at the v2.2.5 tag, where the target framework is net10.0. The releases page names the garnet-server .NET tool as the server install and Microsoft.Garnet as a library package (436704 total downloads, not recorded); the download figure is for the tool package. The maintainer follows the LICENSE copyright line; the About page lists the Garnet core team and the Microsoft Research origin, and it names no country, so hqCountry is unknown: the Microsoft pages read (trademarks and the about page) name no headquarters country. The Docker install route pulls ghcr.io/microsoft/garnet, which is not Docker Hub, so no dockerPulls. The README names the Redis trademark notice only; the CLA and the MIT license are the other statements in the README.
