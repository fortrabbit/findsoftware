notes: >
  The homepage is https://nanoc.app, the gem's homepage_uri. The homepage still links https://nanoc.denisdefreyne.com with the words "For a change of scenery, go over here", and the README names the older domain as the web site; both answer over https. The candidate row's http:// link is not used. firstRelease is the oldest RubyGems upload (1.0, 2009-07-25); the oldest GitHub release is 2013 and the copyright line starts in 2007. runtimeMin is the RubyGems required Ruby version of the latest release; the installation page says Ruby 3.1 or higher as the language version and also says the official interpreter is supported from 2.5 up. The project's own pages say it does not manage content: "It does not help in managing content; it merely processes it", so no contentStore is recorded. The repository has a GitHub discussions board and an issue tracker, both not recorded as fields.
