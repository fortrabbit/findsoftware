notes: >
  The CSV homepage https://orejime.empreinte.digital did not resolve (curl exit 000); the record uses the homepage the repository names, https://orejime.boscop.fr, which answers 200. The repository and the homepage name the project as a fork of Klaro (https://github.com/KIProtect/klaro), recorded as forkOf; the klaro record exists. The README calls the license "BSD-3 license" and the LICENSE file says "BSD 3-Clause License": one license, two wordings. The project has git tags only, no GitHub releases: currentMajor, latestReleaseDate and firstRelease come from the tag list, and the newest tag v3.2.1 also matches the npm latest version 3.2.1. The npm figure is the orejime package the install docs name. The README says Orejime only distributes built files through npm (standalone builds, no module import since version 3) and is configured through a window.orejimeConfig object. Scripts that need consent are wrapped in a template tag with data-purpose; Orejime loads them after the visitor consents, and the original script is left untouched. Coined kinds, kept in notes: embedMethod (script tag, standalone build; third-party scripts wrapped in a template tag with data-purpose), privacyClaims (GDPR and WCAG or RGAA compliance on the homepage), accessibility focus, contextual consent (data-contextual notice for embedded content), WordPress integration tips in the README (PHP filters that wrap script tags and embeds). The legal page gives "BOSCOP", "11, rue des Noyers", "49000 Angers", "France" and "SCOP SA" with "(cooperative and participatory business)" and "with variable capital". The LICENSE copyright line names "Boscop" for the modified work; the publisher block on the legal page is the entity recorded.
