notes: >
  The README documents three install routes: the Balm CLI, npm or yarn into a Vue CLI or Vite project, and script tags from unpkg; the script-tag route sits in an HTML block the quote check cannot read, so only the first two are recorded as installMethod entries. The repository has no GitHub release objects, only tags, so the registry is the source for currentMajor and latestReleaseDate: npm latest is 10.31.2, published 2025-09-16, and matches the highest stable tag. The npm dist-tag canary (11.0.0-canary.2) was published 2024-03-21, before the latest stable, so no latestPrereleaseDate is recorded. The first release is the earliest npm version, 0.1.0-beta, published 2016-12-19. The homepage answers with a bot-challenge shell and no readable text, so the homepage, docs and category facts cite the README, which names material.balmjs.com as the project's site. The README's requirement line reads "Vue.js@3.0+"; that is Vue's requirement for the library, not a runtime of BalmUI, so no runtime is recorded. The GitHub language field reads SCSS, the language of the stylesheets; the source tree holds Vue single-file components and plain JavaScript modules. npmWeeklyDownloads is the sum of the daily range 2026-10-18 to 2026-10-24, because the last-week endpoint answered with a stale window. The CSV's earlier figure of 285 per week no longer matches. The README describes balm-ui@8 as the Vue 2 line; only the Vue 3 line is recorded.
