notes: >
  Icon set bundled into built sites, so no runsAs value is recorded. The license page states two licenses: ISC for the project, MIT for the icons it lists as derived from Feather; both are recorded as separate entries. GitHub reports the license as NOASSERTION, which is not recorded. The npm package lucide-react (a React wrapper, separate package) had 67096172 weekly downloads for 2026-10-12 to 2026-10-18 (api, https://api.npmjs.org/downloads/point/last-week/lucide-react); it is not recorded on this file. Boundary question resolved 2026-10-19: tooling in scope, icon set kept as a record.
