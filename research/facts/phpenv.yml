notes: >
  The repository has no homepage and the README names no project site, so homepage is absent; the GitHub homepage field is empty. The README says phpenv was "originally inspired by" rbenv and ruby-build; that is no basedOn or forkOf statement, so neither is recorded. The maintainer follows the three copyright lines in LICENSE (2012 Dominic Giglio, 2013 Nick Lombard, 2015 madumlao); the project names no other maintainer. firstRelease is the oldest GitHub release (v1.0.0, 2024-03-02); the repository has only the tags v1.0.0 and v1.1.0, none older, and was created in 2012, which no page states as a release year. The README also calls the project "basically a clone" of rbenv; that is no forkOf or basedOn statement, so neither is recorded and the wording stays here. The Shell language value falls outside the language vocabulary, so the import drops it. Runtime version managers are developer tools; the record has no runtime because it runs in the shell and builds PHP versions the developer then runs.
