notes: >
  The CSV homepage dalgona.dev/Serum answers 301 to http://dalgona.github.io/Serum, the official website the README names; the https form of that site is recorded as homepage. The repository is archived on GitHub, and the official site links it as the source ([GitHub] link). Neither the README nor the site states an end, so the status fact rests on the archive flag alone. The README names the default branch v1/master; the highest GitHub tag is v1.5.0, and Hex has 1.5.1 (2021-05-22) with no GitHub tag, so latestReleaseDate comes from Hex. The install docs name serum_new, an installer archive, so hexName is the core package serum. The Serum theme "serum_theme_essence" and plugins are named on the docs but no directory is recorded.
