notes: >
  Archived on GitHub on the 2026-10-19 check, and the project's own site names that repository as where development occurs, so status is discontinued. The README gives no archive or end statement; the archive flag is the signal. The highest stable release is tag release-1.4 (commit 1b224a3, 2022-07-01); the repository has no GitHub release objects, and no CPAN release date was read, so latestReleaseDate is the tag commit date. The CPAN distribution App::Templer is named by the README as the install route, but no CPAN registry figure is recorded. The license is dual: GPL-2.0-or-later and the Perl Artistic License, as stated in LICENSE; GitHub reports NOASSERTION. The Perl Artistic License is recorded as Artistic-1.0-Perl; LICENSE names the license without a version. Templer reads Textile, Markdown and HTML pages through plugins; no field holds input formats, so they are not recorded.
