notes: >
  The repository has no GitHub releases and no tags, so no version, release date or first release is recorded and lastCommitDate carries the listing date. The repository was created on 2019-11-11 (coined repoCreated, not recorded as a fact). The README lists Node as a dependency next to the Dotnet SDK 3.1; the Node runtime is not recorded as a fact because the quote covers only the Dotnet line. The README describes three project parts: a Client project, a Hosted ASP.NET Core application that can self-host the blog, and a Website project that generates the static build; the runsAs values follow them. The maintainer is the copyright holder named in the LICENSE, which the README does not name. No NuGet package named SiteFi was found, so nugetName is not recorded. Templating is WebSharper's own, not a named engine in the README, so it is left unknown.
