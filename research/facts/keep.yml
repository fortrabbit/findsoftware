notes: >
  Doubt: criterion 1 for an end-user application. The project's pages document monitoring tools (Grafana, Datadog, PagerDuty and others, listed on the homepage and the providers index) sending alerts to Keep by webhook, and a REST API. They do not document a website or web app that sends to Keep, so it is unsettled whether monitoring-tool webhooks meet the wiring rule for an alert platform; a reviewer decides, and the answer settles this record. The homepage says "Keep is joining forces with Elastic" with a "Read more" link, which does not state an acquisition, so no parent is recorded and it is no end signal. Both license files were read at the v0.54.3 tag. Two license statements: the root LICENSE grants MIT for content outside the ee/ directory, and ee/LICENSE sets the Enterprise License for that directory; both are recorded. The root LICENSE copyright line reads "Copyright (c) 2024 Keep", recorded as maintainer; ee/LICENSE reads "Keep Alerting LTD" and the privacy policy names "Keep Alerting Inc.", which stay here. hqCountry is unknown: the privacy policy names no address. The releases run from v0.2.9 (2024-04-03), the earliest tag, to v0.54.3 (2026-09-09), so the minor line is 0.54 and no currentMajor is recorded. Keep Cloud is named as a managed option on the pricing page ("Self-host or start managed for free"); no prices are recorded. The docs name the Docker Compose start script; the images are on Google Artifact Registry (us-central1-docker.pkg.dev/keephq/keep), not Docker Hub, so no dockerPulls is recorded. The docs authentication page lists OIDC for a generic provider; its feature table marks some integrations as EE. The release-tag pyproject.toml gives version 0.54.3; no requires-python line was checked, so runtimeMin is left out. The candidates row's category "observability;alerting" is recorded in notes only, since the categories field is not set on this stub.
