notes: >
  The CSV row says accepted, but the product is hosted only and no public source is found, so criterion 2 fails and the status is hosted-service. The main repository databuddy-analytics/Databuddy in the CSV returns HTTP 404 to this client, and the docs link to databuddy-analytics/databuddy returns 404 as well; the organization's public repositories are SDK, plugin and tool repositories (Framer, Raycast, skills, better-analytics), none of them the product. The FAQ on the homepage answers "Can I self-host Databuddy?" with "No. Databuddy runs as a hosted service, so there are no servers for you to set up or maintain." That answer sits in the page's JSON-LD, which the quote check does not read, so the status quote is the terms sentence. The open-source program offers a year of the Pro plan to maintainers; it is a hosted offer, not recorded. Plans are Free, Hobby, Pro, Business, Scale and Enterprise on the pricing page, all hosted, so no paidEdition; the SSO line sits on the Scale plan. The privacy policy and data policy name the hosting subprocessors (Hetzner, Vercel, PlanetScale and others) and a ClickHouse event store, but no region is stated for the product as a whole, so regions is unknown. The terms name the contracting party only as "Databuddy" and give no notice address; the legal name "Databuddy Analytics, Inc." appears only in the page footer copyright and the JSON-LD, which is no source for the maintainer, so the maintainer is the product name. The terms name no country and say the jurisdiction is where Databuddy is incorporated, so hqCountry is unknown. The newsletter sign-up on the homepage has no URL of its own, so newsletter is not recorded. Cookieless collection ("Cookieless by default", no analytics cookies, localStorage visitor ID) and the Global Privacy Control handling are coined kinds, kept here as text. The SDK packages and the Databunny AI analyst are not recorded as fields.
