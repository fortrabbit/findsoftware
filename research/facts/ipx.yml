notes: >
  Homepage: ipx.dev now serves an unrelated personal blog, so it is no homepage and the domain is lost to the project. The UnJS package page unjs.io/packages/ipx is the project's own organization page and presents the software, so it is recorded as the homepage; it documents an older major (the v2 branch) and is stale in content. The README names sharp and svgo as the libraries that power it; that is a dependency, not a basedOn statement, so basedOn is not recorded. The README describes the modifiers, URL style, allowed modifiers and input formats, and the output formats (jpg, jpeg, png, webp, avif, gif, heif, tiff, auto), kept in notes with the image library as sharp; the README describes no URL signing. The Node range in package.json at v4.1.0 is recorded as runtimeMin 20, the major named in the range floor; the README names bun as an alternative runner. The first tag is v0.1.0 at 2017-12-13, the oldest tag of any name in the repository, so firstRelease is 2017. The npm figure is the package the README installs. The unjs.io page names Nuxt Image and Netlify as users.
