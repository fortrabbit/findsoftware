notes: >
  The homepage broccoli-taco.com, listed as the project's homepage on GitHub, now serves a page titled "冲浪鲨加速器官网 - 全球高速网络加速器", a network accelerator service, so no homepage is recorded and status is stub under AGENTS.md. The README is the only readable documentation; it points to broccoli-taco.com for full docs, which is no longer the project's. The GitHub repository has no releases; its tags run to v0.0.8, which matches npm latest 0.0.8 (2015-04-21), so currentMajor and latestReleaseDate come from npm. The GitHub API reports no license and the repository has no LICENSE file on master; the npm package declares MIT. The package.json description reads "Broccoli based static site generator", which is the basis for categories and basedOn. The last push is 2017-01-06 and the last npm publish is 2015. The npm figure is for the week 2026-10-12 to 2026-10-18. The npm package declares no engines field, so runtime and runtimeMin are unknown. The README describes `broccoli-taco new <folder>` for a new site, `broccoli-taco serve` for a development server on port 4200, and `BROCCOLI_TACO_ENV=production` before a build to compress assets; pages, assets and data are added to the new site.
