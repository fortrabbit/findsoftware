notes: >
  Apache APISIX is the Apache Software Foundation project; the GitHub repository apache/apisix is its source and the homepage states it as a top-level project. The license is recorded from the repository LICENSE and the GitHub API. The architecture page says APISIX is built on NGINX and ngx_lua with LuaJIT, so basedOn is nginx, and etcd is the configuration store named by the same pages (no record). Install routes are docker compose, helm, rpm, deb and source as the installation guide lists them; the quickstart script on the getting-started page runs two containers and is not recorded as an install route. No page states a process model in so many words (the guide mentions a service environment file only in passing), so runsAs is left out. The homepage links the X account as twitter.com/ApacheAPISIX and a YouTube channel and Slack invitation (join page); YouTube and Slack have no field and stay here. The homepage nav links the Plugin Hub at /plugins/. The first release is the oldest GitHub release, v0.4 (2019-06-04). The release page lists 3.19.0 as the newest stable release, and the docs page shows 3.19.0 as the current docs version with a Next (unreleased) line.
