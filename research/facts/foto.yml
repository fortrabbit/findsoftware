notes: >
  The GitHub homepage field and the README's demo link point to foto.lhzhang.com, a gallery whose footer reads "Copyright © Linghua Zhang" and "Generated by foto". It is the author's demo site built with the tool, not a page the project itself publishes, so no homepage is recorded; a reviewer decides whether a demo counts. The highest stable GitHub release is v1.7.1 (2026-01-07), and the release list holds no prerelease. The oldest release is v1.0.4 (2022-07-29). The README does not say the export writes static files, so renderingModes is not recorded, and runsAs records only the local preview server. The README says the tool needs no database; that is a statement about the tool and is not recorded as a databases value. The README credits moul as an inspiration, which is not a parent project, so basedOn is not recorded. The go.mod directive is a build requirement from a manifest, not a page, so runtimeMin is not recorded. The output directory is set by the export command's -o flag, with no default stated, so outputDir is not recorded.
