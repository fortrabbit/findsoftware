notes: >
  The repository is a monorepo: it holds @apollo/client, the GraphQL code generation package @apollo/client-graphql-codegen and other packages, so stars and contributors belong to the monorepo and the npm figure is for @apollo/client, the package the install page names. The homepage apollographql.com/client redirects to the React documentation at www.apollographql.com/docs/react, which is the URL recorded. The documentation says the library is a state management library and names a React-based view layer in the package; it states that the documentation focuses on React while the library also serves Vue, Angular, Svelte, Solid.js, Ember, Web Components and native mobile views, so no basedOn is recorded and the other bindings sit here in notes. The company behind it is Apollo Graph, Inc., doing business as Apollo GraphQL, per the LICENSE copyright line and the footer of its documentation; the privacy policy names the same entity and gives no address, so no hqCountry is recorded. The GraphOS platform and the Apollo Server, Apollo iOS and Apollo Kotlin clients are separate products or repositories and are not recorded. The latest release tag is @apollo/client@4.3.6 (2026-11-03); the 4.3.0 release candidates are older than that release and are not recorded as a prerelease. The oldest tag in the repository is 0.5.0-preview.2, committed 2016-10-23, which sets firstRelease; the @apollo/client npm history starts with 3.0.0-alpha.0 in 2019 and is not used. The npm weekly figure covers 2026-10-26 to 2026-11-01. The README links the Apollo community forum; its GraphQL Discord link belongs to the wider GraphQL community and is not recorded.
