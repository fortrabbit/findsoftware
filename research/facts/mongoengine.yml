notes: >
  The README calls the project "an ORM-like layer on top of PyMongo" (rst Info field) and its example defines Document subclasses with typed fields after connect('mydb'), then saves, queries and counts them; PyMongo is the driver it requires (PyMongo >=4.0) and there is no PyMongo record, so no basedOn. The README warns that mongoengine.org is no longer controlled by the project and appears to be an expired domain takeover, so that domain is not linked anywhere in the record. Minimum Python: the README on master says "MongoEngine requires Python 3.10 or newer", but the setup.py at the latest release tag v0.29.3 says python_requires ">=3.7" and PyPI's requires_python for 0.29.3 is ">=3.7"; the release metadata is used for runtimeMin per the rule, and the disagreement is for a reviewer. The README says MongoEngine is tested against MongoDB 4.4, 5.0, 6.0, 7.0 and 8.0. The README lists the author as Harry Marr and the maintainer as Bastien Gerard; the maintainer follows the README because the project names the role. Repository owner organization MongoEngine. The stable line is 0.29 (v0.29.3, 2026-03-10); currentMajor records the major 0 only. The GitHub tag history starts at v0.1.1, whose annotated tag object is dated 2010-01-04; the PyPI history starts at 0.7.0 (2013-08-23), so the tag date is the oldest. The stars and contributors belong to the repository. The pyproject file is absent at the release tag, so setup.py is the release metadata. The README says the documentation holds a tutorial, a user guide and an API reference, and its Installation section names a second route, installing a source checkout with pip from the repository root. The Django Support page in the docs is an integration page and no sentence there names a dependency relationship that would make it basedOn.
