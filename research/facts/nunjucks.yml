notes: >
  Mozilla hosts the repository (github.com/mozilla/nunjucks) and the site (mozilla.github.io/nunjucks), but the LICENSE copyright line and the author in package.json both name James Long, so the maintainer follows the LICENSE and Mozilla is not recorded as maintainer; a reviewer may decide otherwise. The templating page says "Nunjucks is essentially a port of jinja2"; a port is not a based-on or fork statement, so no basedOn, forkOf or alternativeTo is recorded, and the FAQ on compatibility is read as the relationship. Runtime is node only: the getting-started page names Node and browsers together and a library that names both records no runsAs. The homepage lists block inheritance, autoescaping, macros and asynchronous control as language features. The browser route loads nunjucks.js (full compiler) or nunjucks-slim.js (precompiled templates only). The runtimeMin value is the major of the engines field of package.json at the highest stable tag v3.2.4 ('>= 6.9.0'); the FAQ states support for any Node.js version still supported by the Node.js Foundation, which is recorded as the runtime sentence and not as a minimum. The templating page warns that nunjucks does not sandbox execution, so user-defined templates or user content in template definitions are unsafe on the server and can cause cross-site scripting in the browser, which a strong content security policy mitigates. The FAQ says the templates are only partly compatible with jinja2 and names an experimental installJinjaCompat API. The README names a Matrix room (#nunjucks:mozilla.org) for help; no field holds chat rooms, so it is not recorded. The highest stable release v3.2.4 (2023-04-19) matches npm latest. Stars and contributors belong to the repository, which is a single package. Dependent counts are from ecosyste.ms for the npm package.
