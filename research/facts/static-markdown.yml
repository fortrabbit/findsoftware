notes: >
  No homepage exists beyond the repository and the npm package page, so the record has none. The GitHub API reports the repository language as CSS, which does not describe the code, so language is left unknown. The repository has no GitHub releases; currentMajor and latestReleaseDate come from the npm latest tag, and firstRelease from the first npm version. The npm package page returns 403 to this client, so the npm README was not read. The usage page describes a project folder with a pages folder of Markdown and HTML files, each starting with a JSON block of metadata whose template field names a template, a source folder with constants.json and the templates, and a static folder copied into the output. Running the command on a folder deletes the old public folder and writes the site to public. The usage page lists a TODO.md for planned features; it is not read and is not recorded. The GitHub contributor count is taken from the last page number of the contributors endpoint.
