notes: >
  No homepage is recorded: the CSV and the GitHub homepage field point to the project wiki, which lives in the repository, so the repository is the only project site. The wiki (github.com/tclssg/tclssg/wiki) was read for the Installation page (it says "See Getting started in the README") and the Using-deployCustom page, which describes deployment by shell command (the README lists SCP, FTP and a custom deployment command). The README lists Markdown, Bootstrap 3 themes, RSS, JSON Feed and twtxt feeds, sitemaps and Disqus comments; none is a field in the fact list, so they are not recorded. The README states the install path as cloning the repository and running ./ssg.tcl; binaries are labelled experimental and are recorded in installMethod as stated. Databases: the README requires SQLite 3 bindings for Tcl without stating what they store, so databases records the requirement only. The LICENSE copyright line names D. Bohdan and contributors; the maintainer value is the name alone. Latest stable GitHub release is v3.0.1 (2025-02-10), which is also the newest release date; the repository was pushed on 2026-07-03. No archive, deprecation or end statement was found. runsAs static rests on the README's statement that the HTML output is browsable over file://. The docs link is the wiki, which is part of the repository and so is not a homepage.
