notes: >
  The repository is a monorepo: @nvidia-elements/core is the package in projects/core that the homepage's import examples name, and currentMajor and latestReleaseDate count only the core-v tags, so the newest core tag sets both. The other packages (themes, forms, lint, cli, foundations) have their own tags and are not recorded here. The npm figure counts downloads of @nvidia-elements/core only, for 2026-10-18 to 2026-10-24. The CLI (nve) installs from a script or from npm as @nvidia-elements/cli. The homepage shows `nve project.create` scaffolding a new project and `nve project.setup` configuring dependencies. The README and homepage say the Web Components are framework agnostic, so no basedOn is recorded. hqCountry is from the postal address in NVIDIA's privacy policy. The repository was created in March 2026 and the npm package in April 2026, so firstRelease is 2026. The homepage is the documentation site; its guides are read from the plain-text copies the site publishes (llms.txt and the context pages).
