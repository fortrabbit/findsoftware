notes: >
  HyperDX is the observability platform of the ClickStack stack, and its README says the stack bundles ClickHouse, HyperDX, the OpenTelemetry Collector and MongoDB; apps send telemetry to the collector on port 4318 (the README's instrumentation section), which is the log and trace ingestion endpoint the accepted-app test names. The README says HyperDX is compatible with OpenTelemetry ("OpenTelemetry supported out of the box" in the docs) and that it collects anonymized usage data for open source deployments, which can be turned off with USAGE_STATS_ENABLED=false. The homepage banner "ClickHouse Acquires HyperDX" makes ClickHouse the parent; the repository's MIT license names DeploySentinel, Inc. (2023), and the record keeps that copyright line as the maintainer. The footer gives "San Francisco" without a country, so hqCountry is unknown. The pricing page lists plans with prices (not recorded) and a Team and Enterprise split; SAML SSO is listed for the Enterprise plan. hostedOffering records the ClickHouse Cloud deployment the README names and the HyperDX Service of the DeploySentinel terms of service. The pages read state no process model for the server (the docs show containers and a Helm chart only), so no runsAs is recorded. latestPrereleaseDate is not recorded: the newest prerelease (@hyperdx/app@2.0.0-beta.17) is older than the stable release. The repository publishes several packages (app, api, otel-collector, common-utils, cli); the major and release date follow @hyperdx/app, the package the Docker image bundles, and its engines.node field (22.16.0 minimum) is recorded as Node 22. The DEPLOY.md production example names the image docker.hyperdx.io/hyperdx/hyperdx:2-beta, a beta tag, while the README names hyperdx-all-in-one; the README's name is the one recorded. firstRelease is the oldest release in the repository, hyperdx@1.1.0 from 2023-09-16. The CLI (@hyperdx/cli on npm, the hdx command) is documented in the README and not recorded as an install route for the server.
