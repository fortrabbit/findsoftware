notes: >
  Monorepo of five NuGet packages: Boxed.AspNetCore, Boxed.AspNetCore.Swagger, Boxed.AspNetCore.TagHelpers, Boxed.Mapping and Boxed.DotnetNewTest. The registry pair is the core package Boxed.AspNetCore, which the README and its Documentation page describe first. Its highest stable GitHub release is 9.0.1 (2023-09-14). The NuGet search index still lists 5.1.1 as the newest version, while the NuGet flat container and the 9.0.1 nuspec show 9.0.1, so the GitHub release line and NuGet agree on major 9. The nugetDownloads figure is the all-time total the search service reports for the package. The default branch's newest commit is dated 2023-10-03 while the repository's last push is 2026-10-25. The project templates ("ASP.NET Core API Boxed" and others) live in a separate repository, Dotnet-Boxed/Templates, and are not part of this record. The GitHub homepage field names RehanSaeed.com, the maintainer's personal blog, which is not the project's own site, so no homepage is recorded. The README and documentation give package names and usage code but no dotnet add command; installation is taken as the NuGet packages named there,; NuGet package links with usage code count as documented installation. The target runtime of the packages is not stated on the pages read, so runtimeMin is absent. The first GitHub release is 1.1.0 of 2018-05-25; the repository was created in 2016.
