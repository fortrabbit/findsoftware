notes: >
  The LICENSE copyright line on the v3 branch reads "Copyright (c) 2013 The League of Extraordinary Packages", recorded as the maintainer. The docs home page says "Plates is maintained by RJ Garcia and originally created by Jonathan Reinink"; the README credits RJ Garcia as "Current Maintainer" and Jonathan Reinink as "Original Author". The maintainer fact follows the LICENSE copyright line. The default branch is v3; the newest stable release is v3.6.0 (2024-11-02), and the v4.0.0-alpha tag is a prerelease, so no latestPrereleaseDate is recorded. firstRelease is 2013: tag 1.0.8 is a commit dated 2013-11-14, and Packagist's first upload of league/plates is 1.0.8 on the same date. The oldest GitHub release is 1.1.0 (2014-01-31). The runtime and runtimeMin come from composer.json at the v3.6.0 tag, whose require block states "php": "^8.0"; the Packagist metadata states the same. The Packagist figure is the total downloads on the package metadata API. The home page and README call Plates "inspired by the excellent Twig template engine" and say it is designed for developers who prefer native PHP templates "over compiled template languages, such as Twig or Smarty"; that names peers, but neither twig nor smarty has a record, so alternativeTo has no id to hold and basedOn is not stated. Plates is a PHP library installed through Composer; no process model is stated, so runsAs is not recorded. The README's maintainer badge links the maintainer's personal social account, not recorded.
