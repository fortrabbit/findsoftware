notes: >
  Hosted SaaS only: no installable server part was found, so selfHostOption and repository stay out. The github.com/preprio organization holds SDKs, starter projects and a Prepr Toolkit package; these are client libraries and starters, not the product source, so their licenses and counts are not recorded. The About page says the company was founded in 2016 as a CMS for media organizations and that Prepr is the successor of that CMS, so the first release of the current product is not stated and firstRelease stays out. The legal notice gives the legal form as Private Limited Company (Besloten Vennootschap). The About page history sentence says a Neo4j graph database was added to the core of the CMS; no current page names the store, so databases stays unknown. The pricing page lists plan limits for locales, users, API requests and single sign-on, and places multi-site management in the Enterprise column; the multisite fact cites the product page instead, and no prices are recorded. The pricing page also lists a Community plan that is free. Social links on the homepage cover Facebook, Instagram, LinkedIn, Threads and YouTube, none of them a field in the starter list. The status page is at status.prepr.io.
