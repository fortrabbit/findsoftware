notes: >
  Homepage is https://proxysql.com/ (http://www.proxysql.com redirects there). The latest GitHub release marked as the stable latest is v3.0.11 (2026-08-27), and v2.7.4 (2026-10-20, the 2.7 LTS line) is the newest stable release by date, so latestReleaseDate is 2026-10-20 and currentMajor is 3 (the highest stable version). The homepage names three release lines: 3.0 Stable Tier, 3.1 Innovative Tier and 4.0 Plugin Chassis / AI Tier; 3.1.11 and 4.0.11 are prereleases on GitHub and are not recorded. The CSV lastRelease (2026-10-17) is the v2.7.4 tag date; the release date recorded is 2026-10-20. firstRelease is the project's own statement of its initial release in 2013; the oldest GitHub release (v1.1.0) is 2015. The maintainer name is the copyright holder on the homepage footer; no page gives a legal entity or a headquarters, so hqCountry is absent. The company page names the company's founder René Cannaò as the initial author; the founder is not recorded as maintainer. The paidEdition fact comes from the homepage pricing section, where Community lists "All ProxySQL Core Features" and the Professional and Enterprise plans list "Web UI Administration" and support subscriptions; the page does not say under which license the Web UI is distributed, so the reviewer should decide whether the support plans count as an edition. Hosted: proxysql.com/saas describes ProxySQL.Cloud and says "Get an early look before general availability", so it is a private preview and not a hostedOffering. The LinkedIn link (linkedin.com/company/proxysql) is on the homepage and the company's blog is blogspot-hosted; no linkedin or blog field exists, so neither is recorded. The databases value follows the README statement; the homepage also lists MySQL 5.7 to 9.x and PostgreSQL protocol compatibility. The install docs name Docker Hub (proxysql/proxysql) for the Docker deployment, so dockerPulls is recorded for that image. The GitHub repository's default branch is v3.0, and the LICENSE copy is from that branch.
