notes: >
  Default branch is dev; the highest stable GitHub release is 3.1090.0 (published 2026-10-26), which makes currentMajor 3; 3.0.0-rc.1 and 3.0.0-rc.2 are prereleases and the 2.13.x and 1.x tags are older lines. The GitHub API reports license NOASSERTION, so the license entries are the LICENSE file and the license page, recorded as each words it; the page says the license "consists of the Open Software License 3.0 (OSL-3.0) with the Additional Terms in Exhibit A", and Exhibit A limits use to entities with annual group revenues not exceeding US$1,000,000 and bars use in a Production Environment without a Commercial License Agreement. The repository description calls it "Source-available", which is why licenseModel is recorded as source-available: a reviewer may prefer open-source on the page's own wording. hqCountry CY comes from the legal-entity line of the privacy page (legal entity established in Cyprus, registered in Limassol); the About page lists Los Angeles first among offices, so a reviewer may decide otherwise. The docs tech-stack page names ASP.NET Core 8 and EF Core 8, while the system-requirements page (Virto Commerce 3.1000+) names .NET 10; the newer page is used for runtime. The Windows install page says Lucene .NET is the default search and "cannot be used in production", with Elasticsearch recommended; Elasticsearch, Redis and the Platform Manager (AngularJS) are not recorded as fields. The Virto Commerce Global Tool (vc-build, NuGet VirtoCommerce.GlobalTool) is the CLI that installs the Platform, not the Platform package, so no registry figure is recorded. The Commercial License has a Small Business License edition offered free of charge under a US$1,000,000 group revenue limit; it is a license edition of the self-hosted platform, so freeTier (hosted plans only) is not recorded. The pricing page prices the commercial subscription by GMV or per order; no figures are recorded. The Grab Migrator is a utility for EF migrations, not an import from other software, so importsFrom stays unknown. hostedOffering is a coined kind, named by the wave rules and absent from the skill's starter list. linkedin, youtube and facebook appear on the homepage (JSON-LD sameAs) and have no field here. The X link is an anchor href on the homepage with no visible text, so it has no quote. The docs getting-started index answers 403 to curl; its subpages answer 200 and were read instead.
  The prose also relies on the Linux install guide, which sets the database in the "ConnectionStrings" section and starts the platform with "dotnet VirtoCommerce.Platform.Web.dll"; the tutorial on multiple stores says each store has its own domain, catalog and theme ("one store, domain, catalog, and theme per brand"); the Exhibit A text requires the "powered by Virto Commerce" text on each user interface screen and at start-up, and the license page says a commercial license can remove it.
