notes: >
  Status: accepted; no end signal. The repository is not archived and the npm latest version 1.15.7 is not deprecated. The latest stable release 1.15.7 is dated 2026-02-11; the 1.10.0 release candidates of 2019 are older, so no latestPrereleaseDate. firstRelease 2014 comes from the oldest tag, 0.1.5, whose commit is dated 2014-01-02; the oldest GitHub release (0.7.0) is 2014-12-21 and the oldest npm upload (0.6.0) is 2014-11-25. Maintainer: the LICENSE copyright line reads "All contributors to Sortable"; the GitHub organization SortableJS owns the repository. Framework bindings are separate repositories named on the README and homepage (Vue.Draggable, react-sortablejs, ngx-sortablejs, jquery-sortablejs, knockout-sortablejs, meteor-sortablejs, polymer-sortablejs, ember-sortablejs, react-mixin-sortablejs, angular-sortablejs); the README names them as supported frameworks and says No jQuery required, and states no parent, so no basedOn. The homepage Comparisons section pairs videos headed jQuery-UI and Dragula; a comparison section naming peers is the alternativeTo entry (both have records). The README's feature line compares with voidberg's html5sortable; no record exists and a judgement, so none. The README's CDN section (jsDelivr script tag) has a heading and a code block but no sentence naming the route, so no cdn installMethod is recorded. The features list states support for touch devices and modern browsers; that is a support list, so no runsAs. The README usage calls Sortable.create on an element, and lists that share a group option value can move items between each other; the README says No jQuery required. TypeScript definitions at @types/sortablejs are a coined kind and go here only. Plugins MultiDrag, Swap, AutoScroll and OnSpill live inside the repository; no pluginDirectory. Open Collective financial contributors are not recorded. Contributors counted with per_page=1 across all pages.
