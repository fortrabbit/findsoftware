notes: >
  The GitHub repository go-xorm/xorm is archived, and its description reads "Moved to https://gitea.com/xorm/xorm". The record follows the new repository: a mirror of the same code (its original_url points back to GitHub), with v1 as the default branch, releases through v1.4.3 and a repository that is not archived. Status is accepted on that basis, where the CSV row said discontinued. The first release is v0.2 from 2013-10-02, the oldest entry in the Gitea releases list. The GitHub mirror shows 6,609 stars and 85 contributors; the Gitea repository shows 412 stars, and no Gitea contributor count is recorded here, so no adoption figure is in the fact file. The databases values come from the repository description, with MariaDB added from the README driver list; both name TiDB and CockroachDB, which have no databases value and stay out of the field. The homepage footer shows Gitea and Discord as the community links; the README's Discord badge links https://discord.gg/HuR2CF3 and is recorded without a quote. The maintainer follows the LICENSE copyright line, "The Xorm Authors"; the Gitea organization describes itself as "XORM community". The license is BSD-3-Clause per the homepage, and the LICENSE text is the three-clause BSD form with a template placeholder for the organization name. The go.mod go line at the v1.4.3 tag is 1.20. The README names the companion modules xorm.io/builder and xorm.io/reverse, which are separate packages and not recorded here.
