notes: >
  The highest stable release is v2.1.46 (2026-10-29); the first GitHub release is v0.1.0 (2025-03-05), so firstRelease is 2025. The license is AGPL-3.0 on the LICENSE file (copyright line names SQUIRRELLY TECHNOLOGIES PRIVATE LIMITED). The README says the core is AGPLv3 and a 1% commercial part sits in ee and internal/ee folders; the internal/ee directory exists in the repository, but no page shows which features it holds, so no paid edition is recorded. The self-hosting page calls the open-source part the community edition and names Flexprice Cloud as the hosted product, with regions US, India and EU on the architecture page; regions is not recorded because it describes the cloud stack. The runtime is a Go binary; the self-hosting guide's Go 1.23 or later goes here, while go.mod at v2.1.46 says 1.27.2 and runtimeMin takes the manifest. Runtime services are API, Consumer and Background Worker from one image. Temporal, Kafka and Redis run beside Postgres and ClickHouse in the Docker Compose stack; they are dependencies and not recorded as fields. The SDKs are Go (github.com/flexprice/go-sdk), Python (PyPI flexprice) and TypeScript (npm @flexprice/sdk); they are client libraries, so their licenses, stars and downloads are not recorded as the server's figures. The docs name a Svix webhook option and a native webhook delivery mode for self-hosted installs; no field holds it. The homepage lists Slack, LinkedIn and YouTube; only X and YouTube have fields. The billing platform is wired into an app through its API, SDKs and webhooks, which is why it meets criterion 1.
