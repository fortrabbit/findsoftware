notes: >
  The homepage says the project is "built on OpenFeature" and names OpenFeature SDKs for each language; OpenFeature has no fact file, so no basedOn is recorded. The relay proxy page says periodic polling keeps the proxy up to date with configuration changes. The relay proxy docs say it needs no database ("It operates without the need for any databases or complex systems"). The docs home calls the project "a lightweight, open-source feature flag solution with no backend to run", while the relay proxy page names the proxy as the component to run in the user's infrastructure; the Go module is used without the proxy. runsAs is taken from the relay proxy page only. The pricing page lists an Enterprise plan that sells premium support and training; that is paid support, not a paid edition, so no paidEdition is recorded. The homepage lists 16 SDK languages (JavaScript, TypeScript, React, Angular, Swift, Kotlin, Go, Java, .NET, Python, Node.js, PHP, Ruby, Rust, NestJS); the SDK repositories, their licenses and their npm figures are not recorded on this record. Retrievers and exporters named on the homepage include S3, Google Cloud Storage, GitHub, GitLab, Kubernetes ConfigMap, Redis and PostgreSQL; these are sources the flag files are read from or written to, not databases the software needs. The monorepo also tags modules/core, cmd/wasm and providers; the install docs name the relay proxy, which the root module tag v1.58.0 covers, so the major and the release date come from that tag. The docs navigation links a Flag Editor, whose page was not read. The docs navigation also links a Slack community, not recorded. The homepage names no company; the copyright line names Thomas Poignant alone.
