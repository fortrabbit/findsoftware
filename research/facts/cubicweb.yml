notes: >
  The homepage https://www.cubicweb.org answers over https and is the project's own site; it describes CubicWeb as built with Semantic Web principles, suited to data-centric applications, and driven by an application schema file, and it says the framework relies on a standard SQL database. The forge HTML pages sit behind an Anubis proof-of-work challenge, so the forge was read through its GitLab API (project, releases and contributors) instead; the API cites the Mercurial project id 385. The forge marks the repository as Mercurial, not Git. The forge's release list shows 5.0.1 (2025-08-11) as the highest stable release and PyPI agrees. The readthedocs stable pages still show CubicWeb 4.7.1 in their title, so the docs are older than the 5.0.1 release. The PyPI JSON carries no downloads, so pypiDownloads comes from pypistats, the last-month figure. The first PyPI upload is 2009-01-28, earlier than the forge release list, so firstRelease comes from PyPI. The PyPI author field is empty and the author email reads Logilab; the PyPI description names Logilab as the developer, which is the maintainer recorded. No legal form or headquarters is found: the Logilab site is a script shell and its legal notice page returns 404, so maintainer carries the name as the project states it and hqCountry is not recorded. The homepage footer links a Matrix channel, which has no field, next to the Mastodon and Twitter accounts that are recorded. The homepage says "open-source (LGPL)", recorded as its own license statement next to the PyPI classifier. The PyPI license classifier says LGPLv2+ and the homepage says LGPL, recorded as LGPL-2.0-or-later from the classifier. The forge stars count (1) is not an adoption figure this register records. The description the PyPI summary uses is a generic phrase and is not copied. The Python version floor comes from requires_python.
