notes: >
  The README says the source moved from GitHub to GitLab in 2020 and that the GitHub repository is only a backup, so the repository field names GitLab and the GitHub stars and contributors count the backup. The homepage is the project's GitLab Pages demo, which the README links as its demo. The README calls the package a rewrite of Google's libphonenumber and says it reuses Google's metadata; Google's project is a parent named in prose, not a record here, so basedOn is left out. The README's Node.js import examples sit inside HTML comments, so no Node runtime is recorded; the visible text names only browsers and a script tag. GitHub holds only the 0.2.1 and 0.2.2 releases (2016), and the registry major 1 is higher, so currentMajor comes from npm latest 1.13.16, published 2026-11-10. firstRelease is 2016 from the first npm upload 0.0.1 (2016-11-23), older than the first GitHub release (2016-12-13). The npm weekly figure is the sum of the daily downloads for the package the install page names. The README's min, max, mobile and custom metadata sets are variants of this package, not separate records. Its "Advertisement" section lists other packages by the same author, which are not recorded.
