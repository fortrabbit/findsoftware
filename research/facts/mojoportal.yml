notes: >
  Open source CMS for ASP.NET with a repository on GitHub under the i7MEDIA organization. The homepage and docs are on www.mojoportal.com. Two license statements disagree and both are recorded as the files word them: the license page names the Common Public License, and LICENSE.md in the repository says the code is "primarily licensed under the Eclipse Public License 1.0 (EPL)". The GitHub API reports NOASSERTION. The license page also releases the mojoPortal Data Library for MySQL under the GPL, recorded as its own license entry. The license page also states a license intention for add-on features; that is not a license of the software. The repository README lists "Commercial Features" (Form Builder, Event Calendar with ticketing, Paywall, Fundraiser System), each a separate paid add-on product; the README names them as products with their own pages and they are not editions, so paidEdition is absent. The docs and the install pages name the Web Platform Installer and a manual IIS installation; the Quick Start page links an older manual recipe for "IIS 7.x and .NET 4", and the hosting requirements page states "ASP.NET 4.8 or higher", which is .NET Framework and not a minimum of the dotnet runtime, so runtimeMin is absent. No page of this record states the rendering mode or the runtime of the current release, so renderingModes and runsAs are absent. hqCountry comes from the i7media.com home page (Kansas City, Missouri); the mojoPortal footer names the company as i7MEDIA, LLC. firstRelease comes from the Come and Get It page, whose posts are dated November 2004; the GitHub releases start later and are not the first release. The i7MEDIA hosting business is a stated hosting offer on the hosting page; it is a business next to the software, and the hostedOffering fact states it as the page says. The about page names Joe Davis as founder and President of i7MEDIA, and Elijah Fowler and Isaac Hall as developers. The contact page sends support questions to the forums. LICENSE.md in the repository also says the project was under the CPL until 2018-10-23 and moved to the EPL.
