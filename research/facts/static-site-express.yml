notes: >
  The npm name static-site-express has no latest dist-tag and the registry records an unpublish on 2022-12-06, so no npm figures or npmName are recorded. The README says Algolia Search is optional and an external service the site can use. The README's link to the project's website, static-site-express.netlify.com, returns 404; the homepage recorded is the static-site-express.netlify.app address that the repository names and that answers 200. The homepage footer gives the license as "MIT license." with the copyright line; the README copyright line gives the maintainer's name. The repository created_at is 2018-03-07 and is not a first release, so firstRelease stays unknown. The latest GitHub release is v2.4.3 from 2026-03-25 and matches the package.json version. Decap CMS is the editing interface the README names; it is recorded under adminUi. The GitHub stargazer and contributor counts are as read on 2026-10-22.
