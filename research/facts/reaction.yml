notes: The project's own website, mailchimp.com/developer/open-commerce/, returns 404, so no homepage is recorded and the README's Open Commerce Website and Documentation links are dead. The repository description reads "Project has been discontinued", which is the project's statement that it has ended, so status is discontinued; the repository is not archived and was last pushed 2026-03-01. The README title is "Mailchimp Open Commerce (formerly Reaction Commerce)" and the repository is reactioncommerce/reaction; the name follows the README title. The latest stable release is v5.0.0 (2023-06-13), recorded as currentMajor and latestReleaseDate. The oldest stable GitHub release is v1.0.0 (2017-03-20), so firstRelease is 2017; the v0.x releases are marked prereleases. The npm package reaction is a different project, so it is not recorded. The install docs name reaction-cli, so its registry id and downloads are recorded. The README states the Node range for projects created with the CLI as 14.18.1 up to below 16, while the repository's root package.json engines field says >=18.10.0 for the monorepo; runtimeMin records the package.json value as a major. The README says the platform works with npm, Docker and Kubernetes; the repository description says it is deployed via Docker and Kubernetes. runsAs is not recorded because the pages read do not state the deployment mode in those terms. The GitHub homepage field is the 404 page.
