notes: >
  No page names a homepage for @marko/run: the README links "Marko" to markojs.com, which is the Marko site, so homepage stays absent. The README says the project is "in BETA", quoted as "This project is in BETA - use at your own peril", and the status is not an end signal. The README says that "Once stable @marko/run will replace @marko/serve"; that is a planned replacement of another package, so successorOf stays unknown. The README lists the adapters @marko/run-adapter-node, @marko/run-adapter-netlify and @marko/run-adapter-static; their READMEs were not read, so runsAs stays unknown. The npm figure is the @marko/run package the install command names. currentMajor is 0 because the latest stable tag is 0.11.16.
