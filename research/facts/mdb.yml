notes: >
  The GitHub API reports no license (NOASSERTION) because the license file is named License.txt; the npm package says "SEE LICENSE IN <License.txt>", and License.txt says the free packages are MIT. The README also says "MIT license - free for personal & commercial use"; that is the same MIT statement, recorded once. The README license badge links to a License.pdf in the bootstrap-material-design repository, which was not read. The PRO edition is a paid subscription; its features are the PRO-gated docs sections and PRO components, and its price is not recorded. The MDB CLI and the MDBGO hosting (mdbgo.com) are a hosted offering next to the open source kit. The maintainer legal name and country come from the data controller on the privacy policy; the npm author is MDBootstrap and the GitHub owner is the mdbootstrap organization. The npm package name mdb-ui-kit is the one the install docs name. The HTTP Archive technology "MDBootstrap" (4921 mobile origins at the read date) covers several MDB products, not the free kit alone, so no httpArchiveSites figure is recorded. The install page's Node LTS line is a build requirement, so no runtime or runtimeMin is recorded. The installation page says the free kit can be copied into a project, but no runs-as statement is recorded. Contributors counts contributor accounts from the API with per_page=1, read from the last page link.
