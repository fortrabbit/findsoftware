notes: >
  The homepage calls the product an "Admin Template" and sells a paid template package; it is kept because the kit ships reusable components (the docs list them, and the README says "Every component is built on Bootstrap 5"), which the criterion allows. The LICENSE names "The Tabler Authors"; the README lists three creators (Paweł Kuna, Bartłomiej Gawęda, Bartosz Dobija) and the homepage JSON-LD names Paweł Kuna as founder with foundingDate 2018; the maintainer is recorded as the LICENSE names it. The repository default branch is dev; the README links the Tabler Icons project, recorded as its own candidate. GitHub detects Astro for the repository (the docs site); the language fact is SCSS because the package ships Sass sources and names them in its README. The npm package named tabler is an older alpha line (latest 1.0.0-alpha.8) and is not recorded; the install docs name @tabler/core. The GitHub release list includes 1.x tags from an older line (2020 and 2025) and tags named v1.2.0 and older; firstRelease is the oldest release in the repository. The admin-template page sells a paid package, recorded as paidEdition; prices are not recorded. The Community license wording is recorded as a license entry for the bundled ApexCharts part, not the project; it does not make the project open-core. The README says redistribution of ApexCharts needs a separate OEM license. The README also says every component works in light and dark mode, every stylesheet ships in an RTL version, and the kit can be customized with Sass or CSS custom properties. The README says more than 20 plugins are bundled in dist/libs (charts, date pickers, selects, sliders, editors, drag and drop) and that the homepage sells a premium HTML admin template and a paid package under a personal and commercial license.
