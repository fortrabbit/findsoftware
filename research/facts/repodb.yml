notes: >
  The repository is the project's own source and README; the NuGet package RepoDb is the core the README and the Packages list name, and its provider packages are separate packages. NuGet's newest stable version is 1.17.1 (published 2026-11-07), a version with no GitHub release or tag; the latest GitHub release is v1.17.0 (2026-10-23), so latestReleaseDate is the NuGet date and currentMajor 1 holds for both. firstRelease is 2020 from the oldest tag and release, v1.10.6 (2020-02-06), though the repository was created in 2018. The maintainer is the copyright holder named in the README license line, and the README's Enterprise Notice says "Maintained by one individual". The Apache-2.0 license is named in the README and the LICENSE.txt is the Apache 2.0 text. The Enterprise Notice, the limitations list and the support policy are documentation links, not a paid edition. The README calls the library a hybrid ORM that works through the IDbConnection interface; IDbConnection is a .NET interface, not a record, so no basedOn. Desktop Studio is described as still in development and available on request, with no price or paid tier stated; not a paidEdition. Telemetry (opt-in RepoDb.Telemetry.Default), bulk operations per provider, and the type coercion setting are coined kinds that go here. The comparison table names Dapper and Entity Framework; the Entity Framework named there is covered by the efcore record, Entity Framework Core. The documentation link http://repodb.net/docs answers 404 at its final URL, so no docs field; the provider tutorials at repodb.net/tutorial are the working guides. The databases facts hold only the values the field dictionary knows. The Get Started list also names AuroraDB (MySQL and PostgreSQL), ClickHouse, CockroachDB, DB2, DuckDB, EnterpriseDB, Firebird, SAP HANA and Vertica, and lists the Ahtola, Microsoft and Turso SQLite providers; these have no dictionary value and are kept here. The NuGet runtime targets are net8.0, net9.0, net10.0 and .NETStandard2.0 in the 1.17.0 nuspec; no minimum is stated on a page, so no runtimeMin. The Microsoft Teams channel is community chat and has no field.
