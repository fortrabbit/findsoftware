notes: >
  The homepage credits "OpenDevise Inc. and the individual contributors to Antora", which is the copyright line; the operating role of OpenDevise is not stated, so maintainer records the credit line as written. The GitLab API reports no license field, but LICENSE and @antora/cli both say MPL-2.0, so the license value comes from those two. The npm engines field says Node 20 or higher; the docs say an active LTS release, so runtimeMin is the declared engines value. The docs navigation lists "Publish to GitHub Pages" and "Publish to GitLab Pages" pages, whose contents were not fetched, so deployTargets stays unknown. The CSV row lists 599 stars on GitLab; the figure is recorded as gitlabStars, a coined field, because the GitHub field does not apply. The GitLab releases endpoint returned 403, so the release date comes from the tag list. The forum field is a Zulip chat, recorded under forum as the project's help channel; the get-help page was not fetched, and the homepage links the get-help page. The language is not stated on the pages read, so it stays unknown.
