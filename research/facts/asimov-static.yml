notes: >
  The repository adamrenklint/asimov-static is archived on GitHub with the description "DEPRECATED Awesome static site generator, powered by asimov.js and asimov-server" (last push 2015-11-19). The site asimovjs.org calls itself "revived", but it is the site of asimov.js and names github.com/adamrenklint/asimov.js as its source, which is itself archived and described as DEPRECATED; no page names a new repository for asimov-static, so this is an end, not a move. The site's introduction page still lists asimov-static among the plugins. The npm package is asimov-static; its latest version is from 2015, the GitHub repository has no releases, and currentMajor comes from npm latest, which matches the highest tag. The homepage fact is the site's introduction page. The README states MIT and the LICENSE file holds only a copyright line. The README describes the output as pure static files when prebuilt with ENV=prebuild; without it the site is served by an asimov process, which the README does not describe further, so runsAs holds static only. The starter site is the repository adamrenklint/asimovjs.org, named in the README as an example.
