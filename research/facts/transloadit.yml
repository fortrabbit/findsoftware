notes: >
  Hosted service only. The open source page says "If you are looking for commercial support for self-hosting our open source software, please see our Open Source Support Plans", but the open source it means is Uppy, tus and other projects that Transloadit lists, not the processing service; no self-install guide for the service was found on the homepage, the pricing page, the API docs or the security page, so there is no selfHostOption and the status stays hosted-service. The node-sdk repository github.com/transloadit/node-sdk (MIT, 73 stars, the package transloadit at 6.6.0 on 2026-10-30, and npm transloadit at 57,607 downloads in the week 2026-10-26 to 2026-11-01) is an SDK figure, recorded in notes only. The imprint lists earlier operating names (Transloadit Ltd, 2013 to 2021; Debuggable Ltd, 2008 to 2012); those are history, not recorded. The homepage links the community forum (community.transloadit.com, a Discourse-style topic list) and the footer status page. The pricing page lists a "Community" plan that is "Free", and the homepage says "Try it free"; the free plan is in notes. The docs list webhooks and the pricing page lists "SSO support" on the Enterprise plan; the SAML wording is from the security page. The security page's three regions are AWS us-east-1, eu-west-1 and ap-southeast-1, and the region list is recorded in the regions value. The security page also describes SOC 2 Type II, ISO 27001, GDPR and HIPAA compliance; these are in notes, as the compliance field is not in the dictionary.
