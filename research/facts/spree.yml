notes: >
  Criterion 2 and 3 hold on the README, the v5 docs and the repository: create-spree-app scaffolds the backend and an optional Next.js storefront, and the manual route uses rails new with the spree template. The repository is a monorepo: the Ruby gem spree sits in the spree directory, next to the npm packages @spree/sdk, @spree/cli and the admin dashboard; currentMajor and the release dates follow the spree gem tags (v5.6.1), not the @spree/sdk tags, and the highest stable tag v6 is still a release candidate (v6.0.0.rc6, 2026-10-26), so currentMajor stays 5 and the rc date is latestPrereleaseDate. The docs index shows a v6.x documentation set as the default, which is a pre-release line. The Node requirement differs by page: the v5 quickstart says Node.js 20+, and the README on main says Node.js 24+; the v5 page is recorded because it matches the stable major. The Ruby minimum is the RubyGems required_ruby_version of the latest stable spree gem; the Node minimum is a second runtimeMin entry. The homepage is https and is the project's own site. The maintainer is Vendo Connect Inc, named by the terms as the company that licenses the commercial software and operates the Sandbox; the LICENSE copyright lines also name Vendo Sp. z o.o., Spark Solutions Sp. z o.o. and Spree Commerce Inc. The terms give a Delaware correspondence address for Vendo Connect Inc; that is not a headquarters statement, so hqCountry is left out for a reviewer to decide. The Enterprise Edition is paid and its features (B2B approval workflows, multi-tenant SaaS, audit logging, SLA support) are named in the README, the v5 Enterprise docs use the same label, and the Enterprise license is handled through license keys in the multi-tenant docs; the Enterprise code is not in the repository. The Sandbox is a free evaluation service run by Vendo and is recorded as hostedOffering; its terms say it is not production hosting. The docs page for the sso provider and the permissions page are linked from the README and were not read, so sso and userRoles cite the README sentence. The website reports 5000+ businesses and the docs report over 6000 users in Discord; neither is a registry figure, so no reportedInstalls is recorded.
