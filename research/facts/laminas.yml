notes: >
  Boundary question for the php-framework area. The Laminas MVC framework, the part that fits this area, is security-only and will get no releases after 2028-12-31; its last release (3.8.0, 2024-11-21) turns 24 months old on 2026-11-21, so criterion 4 fails next month unless a security release lands. Mezzio (mezzio/mezzio 3.28.1, 2026-06-10) and the components are active, and the project points MVC users to Mezzio; Mezzio may deserve its own record, and this one may then become `discontinued` or be scoped to MVC. Facts here describe laminas-mvc unless a value names another package. laminas-mvc does not support PHP 8.5 (Packagist constraint ends at 8.4). Two maintainerType entries reflect the pages: Linux Foundation project, community-maintained. Coined fields: `maintenanceStatus` (the project's own statement of active, security-only or retired, per package line), `commercialSupport` (as in cakephp.yml), `chat` (as in symfony.yml).
