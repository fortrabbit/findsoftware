notes: >
  Lerd runs on Linux (systemd required, per the installation page) and macOS, and on Windows through WSL2 (beta); the requirements page gives Podman 4.5 or newer for Linux and macOS 13 Ventura or later, and these are dependencies, not a runtime minimum, so runtimeMin stays out. The home page says "It's free and open source, with no Docker daemon and no sudo", and its comparison table marks "Free, no paid tier"; no paid edition is listed. The LICENSE copyright names George Dumitrescu; the GitHub owner lerd-env is an organization and its profile names "Lerd". The home page compares Lerd with Herd, Laragon, DDEV, Lando and Sail; only the Sail and Laradock alternatives are recorded, from the page's own "alternative" entries. The page also lists PHP 7.4 to 8.6 and Node, Python and Rails dev servers, which are not recorded as runtimes of Lerd itself. The homepage https://lerd.sh answers over HTTPS. The Discord, X, Bluesky and Reddit links come from the home page navigation without a quote. The README says Lerd "runs Nginx, PHP-FPM, and your services as rootless Podman containers"; the macOS install route installs Podman through Homebrew, per the installation page.
