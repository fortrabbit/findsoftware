notes: >
  Status: accepted per the CSV. No homepage: the repository is the only project address. The README says the library is "maintained by, oddly enough, a software agency that's also named Test Double" and links testdouble.com, the agency site; the LICENSE copyright line names Test Double, LLC, which is the maintainer recorded here. The testdouble.com footer reads "© 2020 Test Double. All Rights Reserved." and names no country; hqCountry is left out. The repository has no GitHub release object; its newest stable tag v4.0.0 matches the npm latest version 4.0.0 (published 2026-10-12), so the current major is 4 from npm. The npm first upload 0.0.2 is dated 2015-09-07, the day the repository was created. npmWeeklyDownloads is the sum of the daily counts for 2026-11-01 to 2026-11-07, which is the period the value carries. The npm dist-tag next points at 2.0.0-pre.5 from 2017, older than the latest release, so no latestPrereleaseDate. The runtime is Node: the README names Node.js and the browser, so no runsAs is recorded, and the browser build is a download route named in the install section. The engines field of package.json at v4.0.0 gives runtimeMin 22. API surface named in the README, coined and kept here: td.replace, td.func, td.when and td.verify. The package ships TypeScript declarations (index.d.ts), and the docs have a TypeScript page; both are kept out of the fields. The README says the library is test-framework agnostic and works with Jasmine, Mocha, Tape and Jest, and it names td.replace, td.when and td.verify in its API sections; these are coined kinds kept here. Companion packages such as testdouble-jest and testdouble-vitest live in their own repositories and are not listed. Contributors: 59 across all pages. The README links a comparison between testdouble.js and Sinon.js, which gives alternativeTo sinon. The testdouble.com privacy policy gives no address or country, and the agency's social accounts belong to the agency, so no hqCountry or social links are recorded.
