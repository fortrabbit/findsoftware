notes: >
  Prismic is SaaS; the open-source parts are client libraries and tooling. repository, license, version, stars and runtimeMin describe @prismicio/client, the official Content API client, not the service. The prismicio/slice-machine repo is archived on GitHub (Apache-2.0, last release slice-machine-ui@2.21.5 on 2026-08-06) and the docs mark it deprecated. The new Prismic CLI is on npm as @prismicio/cli at 0.0.3. The about page shows "2013" in a numbers block next to "Prismic was created by a team of 7"; recorded as foundedYear, not firstRelease. The x link list also contained a personal account of staff, not recorded. Coined `frameworkGuides` for frameworks with an official integration guide, distinct from starters.
