notes: >
  The LICENSE file and the npm license field both state Apache-2.0 OR GPL-3.0-only, recorded as one entry; the GitHub API reports NOASSERTION for the same dual text. GitHub carries one tag, v5.15.5 (2025-12-01), and no GitHub release; npm carries 6.0.0 to 7.2.1 with no matching tags in the repository. currentMajor and latestReleaseDate follow the npm latest because its major is higher than the GitHub tag. The firstRelease year is the npm package creation date, 2022-12-19; the repository was created 2022-12-18. The maintainer is the GitHub user KTibow, whose profile name reads Kendell and whose site is kendell.dev. The npm weekly figure counts the package named in the quick-start install command. The quick start also installs vite-plugin-functions-mixins, @ktibow/iconset-material-symbols and @fontsource-variable/google-sans-flex next to it. The features page compares M3 Svelte with other libraries; no comparison is recorded here. No HTTP Archive technology entry matches the name.
