notes: >
  The open-source part is Sanity Studio (sanity-io/sanity, npm `sanity`); the Content Lake database is SaaS only, hence hosted-service. Version, release, stars and npm figures describe the Studio package. `sanity build` and `sanity deploy` exist but the docs pages read do not state an output directory, so buildCommand/outputDir stay out. hqCountry is left out: GitHub lists "San Francisco / Oslo", the terms name Sanity US Inc. with a San Francisco notice address, and job ads list Oslo offices, so no single headquarters is stated. /about redirected to the homepage. Contributors counts non-anonymous GitHub contributors. `regions` here is the processing location from the sub-processor list, not a customer-selectable region; `youtube` reuses an existing coined field.
