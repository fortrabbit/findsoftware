notes: >
  Acceptance: apps wire in through the client libraries (the getting-started page installs them with "npm install nats" and "go get github.com/nats-io/nats.go"), and the concepts page states that "Applications connect to a NATS server and exchange messages by subject", so the server meets the wiring rule; the CSV labels jobs and message-broker are not recorded as categories. The categories field records realtime-server alone: message-broker maps to database in the import (scripts/import-facts.mjs), and no page read calls the server a job runner, so jobs is not recorded; reviewer decides whether to add either. The maintainer is "NATS Authors" as the homepage copyright line states it; the Cloud Native Computing Foundation membership the homepage and README state is hosting and goes here, not into the maintainer field. The Synadia-published nightly images are not an official release and no install route names them. The server's Docker route names the official image "nats", which is the Docker Hub library image, so dockerPulls counts that one. The nats-server release tags list v2.14.x and v2.15.x as stable lines; currentMajor is 2 per the rule for the highest stable release. The release-candidate tags (v2.15.3-RC.1, dated 2026-11-02) are the latestPrereleaseDate. runtimeMin is absent: the go.mod directive is a build requirement for a server shipped as a binary. Coined or unrecorded kinds: the container image nats (Docker Hub library image), sdkLanguages (the homepage and README name over 40 client languages), Slack (slack.nats.io) and Stack Overflow links, the JetStream persistence and clustering features, the MQTT and WebSocket listeners.
