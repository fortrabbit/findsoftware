notes: >
  No homepage: the candidate row names none, the repository holds the only project pages, and the envoy.com link on the owner profile is the company's site, not the project's. Criterion 1 holds as the candidate row states: the framework serves HTTP for mocked endpoints. The earliest tag is v0.0.1-alpha-1 (2016-06-11). The latest stable GitHub release is v4.0.5 (2018-10-10); v5.0.0-rc.1 and v5.0.0-rc are tags without a GitHub release, and the date recorded is the commit date of the v5.0.0-rc.1 tag, so latestPrereleaseDate is a commit date, not a release date. The repository was pushed on 2026-10-02. The README says the project is "based on SWSGI", a server gateway interface whose reference implementation is the Embassy project that the package depends on; SWSGI is an interface, not a record, so basedOn is not recorded. The README names CocoaPods (pod EnvoyAmbassador), Carthage and Swift Package Manager; no download figure is recorded for CocoaPods or Carthage. runsAs is not recorded: the README states the purpose (UI automatic testing, API mocking) but not where the server runs. The Package.swift statement about the Swift tools version is on master, not on the v4.0.5 release, so it is recorded as runtime evidence only and runtimeMin is not recorded.
