notes: >
  Hosted-service row. The homepage web3forms.com and its pricing and docs paths answer 403 to the research user agent, so they stay unread and nothing is taken from them. The facts come from docs.web3forms.com, which answers 200. Integration is an HTML form whose action posts to the vendor's endpoint, with an access key; the docs say server-side use needs a paid plan and server IP whitelisting. The docs list features that are paid: reCaptcha and Turnstile, CC email, autoresponder, file attachments, webhooks and domain restriction, sold as Pro, Agency/Team and Starter plans; the plans and prices are not recorded because the pricing page is unread, and hosted plan tiers are not paidEdition. Coined kinds kept in notes: the free plan ("Its free!" on the docs introduction), spam protection (honeypot field, hCaptcha, reCaptcha and Turnstile), webhooks to Zapier, Make, Google Sheets, Slack, Discord and Telegram, a Pro-plan Submissions API (REST, bearer API keys) beside the public submit endpoint, and a 429 rate-limit response. The FAQ says the vendor does not store form submissions and keeps server logs with personal data for two months; a GDPR statement is made with a disclaimer. The SDK repository web3forms/web3forms-react is a client package; its license, stars and npm figures are not recorded. The maintainer and country come from the FAQ paragraph that calls Web3forms a subsidiary product of Web3Creative, a registered business based in Kerala, India; the legal notice and the terms are unread, so the legal form is unknown.
