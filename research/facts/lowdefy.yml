notes: >
  The README says "Lowdefy is built and maintained by Resonancy" and links resonancy.io, a company that builds business apps on Lowdefy and offers managed hosting. The legal notice (privacy and terms) names Lowdefy, Inc., so Lowdefy, Inc. is the maintainer; Resonancy is another legal entity and is not recorded as maintainer or parent. Reviewer to confirm. The homepage counter (2.6k+ stars, 3K+ weekly npm downloads) is the homepage's own figure and is not recorded; the API figures above are. The npm figure is the sum of daily downloads from 2026-10-26 to 2026-11-01 for the lowdefy package, the one the install docs name. npm 7.2.0 has no GitHub release; latestReleaseDate is its npm publish date (2026-10-27). The about page still says 'Built on Next.js and Auth.js' (the v4 milestone); the README and the deployment docs name the Hono server, so basedOn follows the README. Auth.js has no fact id. The database entries come from the README connector list and the docs connection pages for MariaDB, SQL Server and SQLite. The homepage also links LinkedIn. The terms set South African law ("governed by and construed in accordance with the laws of the Republic of South Africa"), which is no HQ statement, so hqCountry stays unknown. The docs document custom server-side API endpoints and webhook endpoints (concepts/lowdefy-api.md) and organizations with multi-tenancy (user-authentication/organizations.md); none is a field. README: apps are built from blocks, operators, actions and connections; the Node.js guide builds a server folder and starts it with node src/index.js.
