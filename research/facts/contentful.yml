notes: >
  Every www.contentful.com page answered HTTP 429 with a Vercel Security Checkpoint, so pricing, free tier, docs, company, i18n, rate limits and community links are missing and need a re-run from a browser. Facts here come from GitHub and npm only. repository, license, version, stars and runtimeMin describe contentful.js, the official Content Delivery API client, not the service. `regions` records only the documented EU endpoints; the region of the default hosts is not stated in the READMEs. No installable server part was found.
