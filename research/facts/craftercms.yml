notes: >
  The homepage lists CrafterCMS Cloud (fully managed SaaS), CrafterCMS Enterprise (self-hosted or self-managed with enterprise support), CrafterCMS AI and CrafterCMS Community (free open source). The enterprise product page (craftercms.com/products/crafter-cms) lists no features the community edition lacks. The Studio reference page marks SAML2, header-based and LDAP authentication with an "Enterprise only feature" badge, an image whose alt text is that phrase and not page text, so the paidEdition quote is the LDAP heading it sits on; sso records SAML and LDAP, both Enterprise only. The docs also name Crafter Profile and Crafter Social as optional enterprise modules; no page states their license. The x and youtube values are the homepage footer icon links (twitter.com/crafter_cms, youtube.com/@crafter-cms); the footer also links Facebook, LinkedIn, G2 and a Slack workspace, which have no field. The newsletter is called Crafter Connection and is a signup form in the homepage footer with no page of its own, so there is no URL. The repository was moved to craftersoftware/craftercms; the CSV's older owner is not used. The repository has tags up to v4.7.0 and no GitHub release objects, so currentMajor is the major of the highest stable tag, and latestReleaseDate is the committer date of that tag's commit (2026-10-21), not a release date. firstRelease is the Maven Central upload date of crafter-engine 2.2.2 (2013-10-03), the oldest artifact of org.craftercms:crafter-engine; the oldest GitHub tag is v3.0.0 (2017-08-01). The README does not say headless CMS in those words; the community product page calls CrafterCMS an AI-native headless CMS and a headless, API-first development platform, so both cms and headless-cms are recorded. The docs say Java 21 is required and Git 2.20.1 or later. The install page starts the authoring and delivery environments as long-running containers or with startup.sh, which is the basis for runsAs always-on. The install page's Docker Compose example is the authoring setup at localhost:8080.
