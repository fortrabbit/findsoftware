notes: >
  The LICENSE file in the monorepo is the Shopsys Community License (version 2018-05-24), which the README describes as in MIT style. Its condition is that an instance processing more than 3,000,000 EUR of orders in any three-month period terminates the community license for that instance, unless a Commercial License is obtained. The README gives the same limit as 12,000,000 EUR per year (3,000,000 EUR per quarter). The GitHub API reports the license as NOASSERTION, and the composer.json of the monorepo and the Packagist packages report proprietary; all three statements are recorded as their sources word them. The installation docs name shopsys/project-base for composer create-project. Its Packagist figures are 2349 total and 11 monthly, so the adoption figures are taken from the core package shopsys/framework, which the monorepo ships. The docs site is read in its en/latest version. The README names a Kubernetes manifest for orchestration, which the docs do not describe in terms of the process model, so runsAs is not recorded. The Packagist source for shopsys/framework is github.com/shopsys/framework, a separate repository; the repository recorded here is the monorepo named in the CSV. The homepage is the company site and the platform name is taken from its navigation. The licensing page linked from the README returned 404, so no pricing page is recorded. The README calls the Community License "in MIT style"; that is a description, not a license name, so it is not recorded as a license entry. Nginx is listed on the requirements page and is left out of serverNeeds.
