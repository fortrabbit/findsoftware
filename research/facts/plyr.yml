notes: >
  Discontinued by the project's own statements: the README and homepage say Plyr is now deprecated and receives security updates only, the npm latest version carries the same deprecation message, and the repository description says it is deprecated in favour of Video.js 10. The README and homepage name Video.js 10 as the replacement for new projects and link a migration guide (videojs.org/docs/framework/html/guides/migrate-from-plyr) and a React migration guide; no record for Video.js exists in this dataset yet. Latest release v3.8.5 is dated 2026-10-06 and is the latest stable release, so the release date is recorded with the discontinued status. The first tag is v1.0.0 dated 2015-02-17, the repository was created 2015-02-14, and the oldest release in the releases list is v1.1.6 from 2015-05-17; both fall in 2015. The npm package's first upload is 1.5.9 in January 2016, later than the GitHub tags, so the GitHub date sets firstRelease. The LICENSE.md copyright line names Sam Potts as the maintainer and the README names the same person as the developer; the README links the maintainer's personal X account, which is not recorded as a project account. The README describes the monetization option of the vi.ai ad partner and an optional ad configuration; these are not recorded. The rendering-browser statement in the README is a browser support list, so no runsAs is recorded. The npm figure is for the deprecated package and counts its downloads for 2026-11-01 to 2026-11-07, which the README does not describe as current use.
  The README says Plyr extends the standard HTML5 media element markup, that a script creates a player with new Plyr on a selector, and that the controls and CSS custom properties are configured through markup and options. The README feature list says Plyr supports hls.js, Shaka and dash.js streaming playback and internationalization of the controls. A source build (npm i and npm run build) is an install route next to the CDN and download routes. The project site plyr.io carries no social or community links beyond the repository.
