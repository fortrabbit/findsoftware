notes: >
  The project's homepage https://www.takes.org/ answers over https and is a one-line page that says the framework is a "true object-oriented and immutable Java web framework" and links to the GitHub repository. Its meta description says "Java 6", while the README says "Java 8" and is the current page, so runtimeMin records Java 8 from the README. The README's Backward Compatibility section describes a version 2.0 that is not released; pom.xml carries 2.0-SNAPSHOT and the highest stable release is 1.26.0 (2026-04-28), which matches Maven Central's latest. Maven Central's first upload is 0.1 (2015-03-03), the same day as the oldest GitHub tag, so firstRelease is 2015. The README's dependency examples name 1.26.0 and 1.24.6; no version figure is recorded. The README says WebSockets are not supported, which is recorded only here: no field carries it. The maintainer is the copyright holder named in LICENSE.txt. Java 8 is the README's own statement and no build target was read from pom.xml.
