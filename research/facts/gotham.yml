notes: >
  The homepage is https and answers 200. The README gives the license as a choice ("Licensed under your option of" MIT License or Apache License, Version 2.0); each is its own license entry, and the crates.io license string MIT/Apache-2.0 is recorded as a third entry from the registry. The GitHub API reports NOASSERTION for the repository license; that value is not recorded. The maintainer is named in gotham/Cargo.toml authors, as the project states it; the crate's LICENSE copyright line was not read. The crate's rust_version is not set on version 0.8.1, so runtimeMin is left out. The README lists other Rust web frameworks under Alternatives; those are not recorded as alternativeTo because the README names them only as options, not as a comparison the project makes. The README names Tokio and Hyper as the async runtime and HTTP server Gotham uses; basedOn is left out because the README describes them as dependencies rather than a parent the framework extends. The oldest GitHub release is 0.1.0 (2017-08-15). The current major is 0 because the highest stable release is 0.8.1. Contributors are counted across all pages with per_page=1. No page quotes a Cargo dependency line (homepage, README, docs.rs), so installMethod is left out. The README links a Gitter chat and a Matrix room; gotham/Cargo.toml lists six authors and Shaun Mangelsdorf is the first.
