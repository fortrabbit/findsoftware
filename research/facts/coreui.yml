notes: >
  The CSV homepage was the docs address; the site root coreui.io is recorded as homepage. The package recorded is @coreui/coreui, which the download page names for npm; the framework ports (coreui-react, coreui-vue, coreui-angular) are sibling packages and not counted here. The intro page names React, Vue and Angular bindings; no install page for them was read. The PRO edition (paid, commercial license) is listed on the pricing page at coreui.io/pricing/, which is a link only here. The docs state CC BY 3.0 for the documentation; it is recorded as a separate license entry. The creativeLabs legal form is not stated on the pages read; the address is on the privacy page. The homepage's CDN and PRO content is not recorded beyond the paidEdition quote. The npm author is "The CoreUI Team" and the npm maintainer account is mrholek; the LICENSE copyright line names creativeLabs Łukasz Holeczek and is the maintainer recorded. The httpArchiveSites value is the HTTP Archive mobile origin count for the CoreUI technology. Contributors counts accounts from the API list with per_page=1 without anonymous accounts, read from the Link header.
  The introduction page says CoreUI was created as an extension to Bootstrap and can be used as a standalone library or as a replacement for Bootstrap in an existing project. The React, Vue and Angular packages are sibling packages named on the introduction page.
