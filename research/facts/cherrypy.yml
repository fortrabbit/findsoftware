notes: >
  The homepage cherrypy.dev answers 200 and is the site the repository and PyPI both name; the docs at docs.cherrypy.dev redirect to /en/latest/. The repository has GitHub tags but no GitHub releases, so currentMajor and latestReleaseDate come from PyPI, whose highest stable version is 18.10.0, uploaded 2024-06-14. PyPI's JSON reports -1 for every download period, so pypiDownloads comes from the pypistats last_month figure. The install page states Python 3.9 to 3.13 as supported, while PyPI's requires_python is >=3.6; both are recorded as separate runtimeMin entries; the install page is recorded because it is the project's own statement. The homepage still says it runs on Python 2.7 and 3.5, which the install page contradicts; the install page is taken as current. The PyPI author is CherryPy Team, the same as the copyright line. The first PyPI upload is 2.1.0 on 2005-12-15, which sets firstRelease; the copyright years begin in 2004. The homepage links the users mailing list (a Google Group), recorded as forum; it also links Gitter, and the README links Stack Overflow and a Tidelift subscription; none of those is recorded, as the dictionary has no field for them, and the Tidelift item is a paid support offer rather than an edition.
