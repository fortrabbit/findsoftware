notes: >
  The record is the legacy CLI, the candidate row's subject. The repository GitbookIO/gitbook has two lines. Its main branch holds the open-source renderer for published GitBook content, licensed GPL-3.0 (the repository license on GitHub) and built on Next.js; that renderer is not recorded here, and its GPL statement is not a license of this record. The legacy branch holds the CLI, whose README states Apache License 2.0. Status is discontinued on three sources: the legacy README ("the CLI is no longer under active development"), the main README ("Our previous version of GitBook and it's CLI tool are now deprecated") and the npm package gitbook, which is marked deprecated ("Package no longer supported"). The install docs name gitbook-cli (npm weekly downloads 3848 for 2026-10-12 to 2026-10-18), which installs the gitbook package; gitbook-cli carries no deprecation flag and its last version date is 2017-07-14, while the gitbook package's last version is 2.6.9 from 2018-10-11. The gitbook npm package reports 2357 weekly downloads for the same week. The GitHub repository has tags for the CLI (2.6.9 is the highest) and no release objects for it; currentMajor 2 comes from the tags endpoint. The legacy setup doc says "NodeJS (v4.0.0 and above is recommended)", a recommendation from a page that predates the current CLI, so runtimeMin is not recorded. The stars and contributor counts are repository-wide figures and include the renderer. The legacy README says content hosted on legacy.gitbook.com "will continue working until further notice", so the hosted part is not recorded as a field. The docs site toolchain.gitbook.com, named in the legacy README, was not read.
