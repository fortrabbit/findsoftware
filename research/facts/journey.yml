notes: >
  The README states that Journey is still in alpha and has not been tested in production, and the homepage repeats the alpha label; this is recorded as a state in notes, not as a status, because it is not an end statement. The highest stable GitHub release is v0.2.0 (2017-10-15), the oldest is v0.0.1 (2015-03-16). The newest commit on the default branch is dated 2017-10-15, while the repository's pushed_at field reads 2023-10-05. The README names the Lua plugin system; the wiki page for plugins is not read and no plugin directory is recorded. The Twitter account in the README is the author's personal contact, so no x link is recorded. The README names Ghost compatibility, which is recorded in the description and not as basedOn, since it describes theme compatibility, not a parent project. The wiki states that Journey runs as a server on ports 80 and 443 after a configured setup, which is recorded through the always-on quote.
