notes: >
  Monorepo: the repository resend/react-email holds packages/react-email (the core package the install docs name, npm react-email), the components and editor packages, and the create-email scaffolder. Stars and contributors belong to the monorepo, not to react-email alone. The registry figures are the react-email package's, the package the README install line names. The npm package react-email has earlier versions from 2016 (1.0.0, by another author, "React component for making email templates") and from 2022 (a fork under another repository, then this one). The firstRelease is the registry upload of 1.0.1 (2022-08-05) by the project's authors under the name react-email; the 2016 upload of 1.0.0 is another author's package, and the oldest GitHub release of this repository is v0.0.11 (2023-03-12). The npm package @react-email/components is marked deprecated on npm ("Package no longer supported"); it is a sibling package of the monorepo, not the package the install docs name (react-email), so the record stays accepted. The README says "Brought to you by Resend"; the copyright line names Plus Five Five, Inc., the legal entity Resend's privacy policy and enterprise terms name. The resend.com homepage carries an organization address in San Francisco with addressCountry US in its structured data; no page prints the country in prose, so hqCountry is not recorded. The editor (@react-email/editor) is built on TipTap and ProseMirror, per the README; that is a fact about a sibling package and is not recorded. The docs deployment page describes deploying the email dev preview server to Vercel, which is a preview app and gives no runsAs for the emails themselves; the CLI page and the manual setup page show the dev server running locally (localhost). The docs have a guide on internationalization with next-intl. The latest prerelease, react-email@6.0.0-canary.2 (2026-04-16), predates the stable 6.11.13, so no latestPrereleaseDate is recorded. Integrations with Resend, Nodemailer, Mailgun, SendGrid and others are sender integrations listed on the docs, not alternatives.
