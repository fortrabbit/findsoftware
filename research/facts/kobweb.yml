notes: |-
  The README says Kobweb is still pre-1.0; no field records that. The repository holds two release streams: framework tags (v0.x) and CLI tags (cli-v0.x); the CLI binary the install steps name is maintained in the separate varabyte/kobweb-cli repository, which the README links and which is not recorded here. currentMajor is taken from the highest stable framework tag, v0.25.1, and is 0. The runtime jvm rests on the server docs: a site that declares a server gets a JVM target. runtimeMin is not recorded: "Building Kobweb requires JDK11 or newer" appears only in the steps for building the CLI from source. The README says the kobweb command delegates to Gradle. The exporting page says export takes a snapshot of every page, so crawlers that do not run JavaScript see HTML. Full stack sites add a JVM server target on Ktor, which the fullstack page describes; the README lists Ktor 3.5.0 as a dependency badge. The README and docs name Next.js and Chakra UI as inspirations, not parents, so they are not recorded as basedOn. The exporting page says export runs a headless browser and that the first export can download one unless a local browser is configured. The discord link is the project's Varabyte Discord from the README badge. The kotlinlang Slack channel and the maintainer's personal Bluesky account are not recorded. Adoption counts exclude Maven Central download data, which is not in the register's registries.
   firstRelease is the v0.6.0 release of 2021, which GitHub flags as a prerelease like the other 0.x releases. The exporting page says export lifts the framework from one that produces a single-page application to one that produces a navigable site, so spa is not recorded as a rendering mode.
