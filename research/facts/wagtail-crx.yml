notes: >
  The highest stable GitHub release is v6.0.0 (2025-09-12), the same as the PyPI version 6.0.0, so currentMajor is 6; the repository was pushed on 2025-12-16 and is not archived. The PyPI JSON carries no download count, so pypiDownloads comes from pypistats (last_month). GitHub reports the license as NOASSERTION; the license statements are the LICENSE.txt wording, recorded as written, and the homepage's "Open Source and 100% Free to Use" backs licenseModel. The project's name changed from CodeRed CMS: the README says "CRX, formerly known as CodeRed CMS". The hosting page says CodeRed Cloud "includes both free and professional grade plans"; those are hosting plans, so no freeTier or paidEdition is recorded for the software. The hqCountry US comes from the Cleveland, OH address on the contact page. The docs state no database engine; contentStore comes from the advanced tutorial's remark about data stored in the database. The advanced tutorial names Django templates; Wagtail is recorded as basedOn because the README says the project provides components "for Wagtail". runsAs local rests on the install guide's development server and always-on on the Docker how-to, which installs a WSGI server into the image. The docs hosting page says the site deploys like any other Wagtail or Django website and points to the Wagtail hosting guide, which was not read. The homepage's LinkedIn link has no field.
  The prose also relies on the README for the feature list (page types and blocks, navigation and footer settings, SEO tagging attributes), on the installation guide, where the admin is reached at /admin/ and "coderedcms start" creates a project, and on the README quick start, which runs "coderedcms start mysite".
