notes: >
  The GitHub API reports the license as NOASSERTION (other); the LICENSE file and the npm latest version both state BSD-2-Clause, and that is the recorded license. The package is the npm package commonmark, whose latest version is 0.31.2 (2024-09-19); the 0.31.x line is the newest stable release. The npm package has uploads from 0.9.0 on 2014-11-05, before the GitHub repository was created on 2015-01-24, so firstRelease follows the oldest npm upload (0.9.0, 2014-11-05) and not the GitHub release history (0.17, 2015-01-25). The README says the library is "the JavaScript reference implementation" of CommonMark, which has a spec and a reference implementation in C; the C implementation is not recorded. The homepage is not recorded: the npm package and the README point to commonmark.org, which is the CommonMark specification site shared by all implementations, the same call as for commonmark-java. The README says the library "does not attempt to sanitize link attributes or raw HTML", and recommends the safe option or an HTML sanitizer for untrusted input. The live dingus at try.commonmark.org is a demo and is not recorded. The README lists the single-file distributions for client-side use, and the browser and Node.js are both named, so no runsAs is recorded. The unpkg route names version 0.29.3 in its example, which is not a version fact and is not recorded. The Bower route is recorded as the README states it; Bower has no registry figure here.
