notes: >
  The pricing page lists a Developer plan ("generous free plan" on the homepage), a REST API reference exists at hookdeck.com/docs/api, the pricing page names GDPR, CCPA, PIPEDA and HIPAA compliance, and the homepage links a LinkedIn page.   The record covers the hosted Hookdeck service: the Event Gateway for inbound webhooks and the managed Outpost for outbound delivery. The open-source sending component is its own record (hookdeck-outpost), so the self-host option names it and this record stays hosted-service. The candidates row names the repository hookdeck/hookdeck-cli, which is the CLI and an SDK-style client (Apache-2.0, 366 stars, the npm package hookdeck-cli at about 9.9 thousand downloads a week per the row); its license, stars and npm figure stay in these notes per the hosted-service rule and no repository field is recorded. The homepage states its event volume ("150B+ Webhooks processed") and the pricing page lists Developer, Team, Growth and Enterprise plans with prices; no figures recorded. The terms name the operator as Hookdeck Technologies Inc., with a legal postal address in Montreal, Quebec. The pricing page's feature table does not say on which plan each SSO, role and compliance row sits, so those values say only that the pricing page lists them. No data region is stated on the pages read, so regions is unknown. The Outpost README says the managed Outpost adds SOC 2 compliance and SSO; that claim sits in another project's README and is not recorded here.
