notes: >
  Spring Boot is a library set for building applications, not a content system, so contentStore, adminUi and multisite do not apply; `databases` lists only the embedded databases it auto-configures, while production databases connect through any JDBC DataSource with HikariCP preferred. The product page lists Undertow among embeddable servers, but the system-requirements page for 4.1.1 names only Tomcat 11.0 and Jetty 12.1, so `webServers` follows the requirements page. Maintainer is taken from the spring.io copyright line (Broadcom); commercial support is the Tanzu Spring subscription, no price shown. Maven Central's search API returns a stale latest version (3.5.3), so the repo1 metadata file is the registry source; Maven Central publishes no download counts. Coined fields: `mavenCoordinates` (Maven Central counterpart of packagistName), `buildTools` (minimum Maven and Gradle versions); reused `webServers`, `frameworkMin`, `commercialSupport`, `latestPrerelease`, `youtube`.
