notes: >
  The homepage and the footer call the hub "MIT-licensed" and the Self-Hosted pricing table lists "MIT license" for the open source tier, while the hub's license page, the pricing page ("open source · AGPL v3") and the repository LICENSE file state AGPL-3.0 for the hub; the license page says the protocol is open and can be implemented without the AGPL, so the MIT wording is not recorded as the hub license. The Dunglas Services SAS named in the footer and the trademark notice is the legal entity behind the site and is not the maintainer; the creator is Kévin Dunglas, named in the README credits. The Les-Tilleuls.coop contact page gives the cooperative's Lomme address, which is the maintainer's full address. The protocol uses server-sent events over HTTP and the hub's transports are bbolt in memory and on disk; the Redis and PostgreSQL transports belong to the paid tiers, so no databases fact is recorded for the open source hub. The Docker Hub count is recorded from the Docker Hub API on 2026-11-03. The compare page's Socket.IO entry names no record. The installation page names the Docker image dunglas/mercure, the Compose file and the Helm chart; the dev playground directive is for local development only and is not a runsAs statement. The community Slack is named in homepage text without a link and is not recorded. Adoption figures (stars, contributors, pulls) are recorded with their dates. Go's module requirement is not recorded as runtimeMin because the software ships as a binary and an image.
