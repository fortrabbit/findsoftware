notes: >
  Doubt: the homepage broccoli.build no longer answers over HTTPS (connection timeout), and its HTTP address forwards to www.broccoli.build, a Namecheap parking page that offers the domain at auction; the status is stub with no homepage, as AGENTS.md requires for a site that no longer shows the software. What would settle it: a live project site at a new address, or a link from the README, the npm package or the GitHub homepage field to one. The GitHub homepage field also names broccoli.build, so it is not a source. The repository is active (last push 2025-11-17, release v4.0.0-broccoli on 2025-11-11, npm latest 4.0.0), so the stub is the homepage and not an end signal. The CLI is a separate package, broccoli-cli, installed globally; the build command is `broccoli build` and the development server is `broccoli serve`, which the README says not to run on a production server. The README describes the Brocfile.js, which exports a function that returns a tree (a directory path or a graph of plugin nodes); the Builder class runs such a graph from other Node code; a Brocfile.ts runs through ts-node. The README names an IRC channel and an X mention for questions, but no project account, so no x fact is recorded. The GitHub release tag v4.0.0-broccoli is not marked as a prerelease and carries major 4; the npm package broccoli reports version 4.0.0 as its latest. The npm weekly figure is the sum of the seven days 2026-09-28 to 2026-10-04. The maintainer is recorded as the copyright holder of the LICENSE file, Jo Liss; the npm maintainer list names six people, and the README says the project was "originally written by" Jo Liss. The firstRelease is 2013 from the first npm upload (0.0.2, 2013-05-14), which matches the repository creation date.
