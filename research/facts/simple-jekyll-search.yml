notes: >
  Discontinued on the archive signal: the GitHub repository christian-fei/Simple-Jekyll-Search is archived (read 2026-10-28, the same signal the candidates row recorded on 2026-10-19), and the npm package names it as its repository. The README and the homepage carry no end statement, and the npm latest version (1.10.0) has no deprecation flag. The GitHub releases list stops at 1.0.8 (2015-08-10), older than the npm latest, so latestReleaseDate follows npm; the last commit on master is dated 2022-03-16. The npm package named simple-jekyll-search is the one the install docs name; its downloads are for the full week 2026-09-28 to 2026-10-04. npm dependent counts are from ecosyste.ms. The npm package description names the search as a simple Jekyll site search; the README names a plugin, which is why basedOn is jekyll, a record this set holds. The README's unpkg script tag, a second install route, sits inside an HTML comment and a tag, so no quote can carry it and it is not recorded as an installMethod. The homepage is the project's GitHub Pages example site, a Jekyll blog demo, read at 200; it is not a separate product site.
