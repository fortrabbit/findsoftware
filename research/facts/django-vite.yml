notes: >
  The GitHub repository has no homepage, so none is recorded; the README is the only documentation. The record is basedOn django, which the README states ("in a Django project" and the INSTALLED_APPS setup). Vite (ViteJS) is the tool whose assets the package loads; it goes here in notes and not into basedOn. The GitHub license is Apache-2.0; setup.py says "Apache License, Version 2.0" and the LICENSE file is the Apache 2.0 text. These are one license in two wordings and are one entry. The Python minimum is not stated: setup.py lists classifiers from 3.8 and requires Django (>=3.2), so runtimeMin is unknown. The highest stable GitHub release is 3.2.0 (2026-09-14); the tags carry no v prefix. The oldest GitHub release is 1.0.0 (2021-04-03), and the PyPI first upload is 1.0.0 on 2021-04-03. The dev mode serves assets from the ViteJS development server, which the developer runs; no runsAs statement is recorded because the README does not name one. The pypistats figure is the last-month count from the recent endpoint. The ecosyste.ms counts are for the pypi.org package django-vite.
