notes: >
  Status is accepted. The repository is the Sling Starter, which produces feature artifacts for the Feature Launcher; the framework's modules live in other Apache Sling repositories and are not recorded here. The starter's README says it "is not meant to be a production-ready setup", which the reader should know before using it on a live site. The getting-started page was last modified in 2022 and states Java 8 or later. The Maven Central metadata lists versions 10 to 14, with 10 uploaded 2018-01-31 and 14 uploaded 2026-03-04, so firstRelease and latestReleaseDate come from the Maven uploads and match the tags. The starter README starts Sling on either an Oak SegmentStore or an Oak MongoDB DocumentStore; only the MongoDB store is recorded as a database, and the segment store is not classed as a database or flat file. The sling.apache.org Downloads page and the Karaf option are not recorded as separate fields. The project's own pages describe Sling as a basis for applications from blogs to content management systems; no basedOn is recorded because no page names a parent framework.
