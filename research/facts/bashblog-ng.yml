notes: >
  The candidate row points at dvwallin/bashblog-ng, which redirects to DavidSatimeWallin/bashblog-ng; the canonical repository is recorded. The GitHub API reports the repository as a fork of cfenollosa/bashblog, and the README states the same relation in its first line, so forkOf is recorded; basedOn is not, since the README states the relation as a fork only. The repository has no LICENSE file (GitHub reports no license), so the GPL-3.0-or-later statement comes from the README's License section alone and is recorded as such. The bb.sh script sets a default blog license variable ("CC by-nc-nd") for the generated pages; that is a setting for blog content, not the license of the software, and is not recorded. The README says "still maintained as of 2016"; that sentence is old and is not recorded. The repository has no release or tag, and its newest commit on master is dated 2022-01-03, which is recorded as lastCommitDate. The repository's pushed_at date (2023-06-22) is later than that commit, so the record uses the commit date, as the rule says. The maintainer is named in the script's header comment; the email address in that line is not recorded. The candidate queue placed this record in ssg; the README describes it as a blog tool, so categories records blog only.
