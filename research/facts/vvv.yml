notes: >
  Repository Varying-Vagrant-Vagrants/VVV (MIT, Shell) and the website varyingvagrantvagrants.org, both read on 2026-10-28. The governance page says VVV is a 10up creation and transitioned to a community organization in 2014, so no parent is recorded; the governance page names Jeremy Felt as current project lead and Lorelei Aurora and Tom Nowell as lead developers. The LICENSE copyright names "the contributors of the VVV project". Highest stable release is v3.15.1 (2025-05-21); there are no prereleases. Requirements: Vagrant, git and VirtualBox, or Parallels Pro, Hyper-V or Docker as the virtual machine provider; the requirements page says Hyper-V replaces VirtualBox on Windows when Docker is installed, and the VM needs at least 4GB of RAM with 6GB for WordPress Core. The homepage describes the project as an open source local development environment powered by Vagrant. The installed stack is nginx and PHP-FPM with WordPress and phpMyAdmin, recorded on the installed-packages page; these are packages VVV installs, not records of the project. The VVV Slack workspace link on the docs site has no field. Host operating systems are not recorded as a field: the requirements page covers Windows and Mac hosts.
