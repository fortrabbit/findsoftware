notes: >
  The homepage answers over https. The docs and library pages are read at their own URLs; the library lists snippets, templates and UI components for sites and is not recorded as a plugin directory. The RubyGems record requires Rails 7.2.0 or newer and Ruby 3.4.0 or newer; the quickstart page states Rails 7.0+ and Ruby 3.4+, and runtimeMin follows the registry. The site describes two modes: standalone builds a static output directory, and integrated mode adds static pages to a live Rails application deployed to a Rails host, so runsAs carries static and local only: no page quote states that a process stays running. The deploy page says the integrated mode works within a typical Rails application and can be deployed to any Rails host like Heroku. The deploy page names Netlify, Seal Static and statichost.eu as build-based targets; no provider is recorded as a fact. The CMS entry in the library navigation is not an admin interface, so adminUi is unknown. The release list starts at v0.5.0 (2025-07-19), and RubyGems lists 21 versions from 0.0.1 (2025-06-29): both fall in 2025, so firstRelease is 2025. The "templating" value comes from the gem's own description in the RubyGems registry record, not from a page.
