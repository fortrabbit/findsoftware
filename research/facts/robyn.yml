notes: >
  The PyPI JSON reports downloads as -1, so pypiDownloads comes from pypistats. databases lists the choices the project scaffolder offers. The maintainer is the LICENSE copyright holder; the GitHub owner is the sparckles organization and the docs footer reads "Sparckles OSS". The highest stable GitHub release is v0.88.0 (2026-06-25) and the first is v0.2.3 (2021-06-18). The README and homepage describe a Rust runtime under a Python API; runtime records python only. LinkedIn is linked from the homepage and README; no dictionary field holds it. The Railway hosting page on the documentation site is not recorded as a fact.
