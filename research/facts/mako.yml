notes: >
  Doubt: whether Mako is still its own product or has been folded into the Utoo toolchain, and which package its install docs name today. The project's site makojs.dev refused connections on the check date, so no homepage or docs page could be read; the registry README of @umijs/mako (latest 0.11.15, published 2025-11-06, not deprecated) names makojs.dev and "npm create mako" and is the install source used here. The repository umijs/mako now redirects to utooland/utoo, whose README describes the Utoo toolchain and its @utoo/pack bundler and does not name Mako; the utoo repository's features list cites Mako configuration docs, and its pack-schema crate describes itself as a schema generator for Mako configuration files. A later pass should settle the question by reading makojs.dev once it answers: if Mako continues, record its own homepage and docs; if utoo replaces it under a named successor, mark the record discontinued with the successor in notes. The npm package named mako is a different project (makojs/core) and is not used. The utooland/utoo repository holds releases for two products (utoopack and utoo), so no GitHub release date is recorded and currentMajor is taken from the npm latest version. The LICENSE copyright line reads 2025-present, so the maintainer is recorded as the name it gives, Ant UED. The stars and contributors count the moved repository as a whole, and the npm figure is the week 2026-09-28 to 2026-10-04 for @umijs/mako (the CSV figure is older). The README states the bundler is used by Ant Group and Umi and Dumi integrate it; those are usage claims without figures, so no reportedInstalls is recorded. Dependent counts from ecosyste.ms returned no record for @umijs/mako.
