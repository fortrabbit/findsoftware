notes: >
  The project has no site of its own: the repository's homepage field is empty and composer.json points to the GitHub repository, so no homepage is recorded and the CSV homepage (the repository) is dropped. The maintainer follows the LICENSE copyright line (Colin O'Dell, 2015; "Originally created by Nick Cernis"); the README names Colin O'Dell as Lead Developer and Nick Cernis as Original Author. The README requires PHP 7.2+, and composer.json at tag 5.2.3 requires "^7.2.5 || ^8.0"; runtimeMin is taken from the manifest. The repository needs the xml, libxml and dom extensions (ext-dom, ext-xml in composer.json); these are build requirements of the library and are in notes only. The package ships a bin/html-to-markdown command and a demo directory; a command line tool gives no runsAs statement. The README names league/commonmark (recommended), cebe/markdown, PHP Markdown and Parsedown as libraries for the reverse direction, Markdown to HTML; that is not an alternative statement, so alternativeTo is not recorded. The README documents the options strip_tags, remove_nodes, preserve_comments, hard_break, use_autolinks, header_style and the bold and italic style settings; it says tags without a Markdown equivalent are kept by default, and that Markdown Extra and MultiMarkdown are not supported. The README says table support is off by default and is added with a TableConverter. Its caution recommends HTML Purifier for untrusted input; that is advice, not a dependency. The version history has no GitHub release newer than 5.2.3 and no prerelease. The Packagist total is 40,606,944 on the day of research; the CSV figure of 38.2M is stale. The first upload on Packagist and ecosyste.ms is 2013-08-14, the same date as the 2.0.0 tag commit, so firstRelease is 2013.
