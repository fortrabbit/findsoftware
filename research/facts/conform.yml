notes: >
  The homepage conform.guide answers 200 over https; its overview names the project as a type-safe form validation library and the README gives the same description. The repository's README is short and points to the website for documentation. The install page shows npm commands for @conform-to/react with the schema helper packages (@conform-to/zod, @conform-to/valibot, @conform-to/yup) but no sentence names npm as the route, so no installMethod is recorded; the reviewer may decide a command-only route counts. The @conform-to/react package is the React view adapter; its npm description is "Conform view adapter for react", and the peer dependencies are react and react-dom 18 or higher. The overview says Conform gives "full support for server frameworks like Remix and Next.js" and the integration pages list React Router and Next.js; these are support statements, not basedOn. basedOn react rests on the npm description of the package the installation page names ("Conform view adapter for react"). The repository's own README title is Conform; the npm package is @conform-to/react and the registry figure comes from that package, the one the installation page names with the core library. The weekly npm figure is the sum of the seven daily values from the range endpoint for 2026-10-26 to 2026-11-01. The ecosyste.ms counts are for the same npm package. The maintainer is the LICENSE copyright holder Edmund Hung; the repository owner is a user account. The license is MIT in the LICENSE file, the npm package and the GitHub detection. The firstRelease year is from the first GitHub release v0.1.0 (2022-07-04); the repository was created 2022-04-03. The release count shows tags and releases up to v1.21.3 (2026-10-31); the current major is 1. The Standard Schema support, the Zod, Valibot and Yup helpers, and the React Router and Next.js integrations are validation and integration statements, kept in notes as coined kinds. The homepage's "Future APIs" menu lists planned APIs; they are not recorded.
