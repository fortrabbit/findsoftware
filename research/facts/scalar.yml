notes: >
  scalar.com, its API references, pricing, legal and company pages answered 200 with the research User-Agent and are read as the project's own pages; docs.scalar.com answered with a small JavaScript shell, so the docs link stays the guide in the scalar/scalar documentation folder. The release tags are dated (release-2026-10-20-efb009a) and carry no semantic version, so currentMajor comes from npm latest of @scalar/api-reference. The terms name API Documentation Inc. (dba, Scalar) and give the United States of America as the company's country, the privacy policy gives British Columbia, Canada, so hqCountry is not recorded. The API references page says hosted documentation on Scalar has a Free plan and paid plans; it is a separate hosted service next to the open-source reference and no price is recorded. The npm package declares node >=22 in engines, which is a build and tooling requirement of the package and is not recorded as runtimeMin. The npm weekly figure belongs to @scalar/api-reference, the package the API references page loads from the CDN. The FAQ on that page says to load @scalar/api-reference from a CDN and pass it the URL of the OpenAPI document, or to install the integration for a framework. The page names Swagger UI and Redoc in a question about replacing them, which is the basis of alternativeTo.
