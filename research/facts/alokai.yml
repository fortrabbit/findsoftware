notes: "Stub: the criterion 2 question is open. The repository the record names, vuestorefront/vue-storefront, holds only a README on its default branch (main), and its LICENSE file is absent there, so the GitHub license is null. The README describes the Alokai project as open source, and the older vuestorefront README on its next branch says the code is MIT-licensed, but no current license statement is on the pages read. The npm package @vue-storefront/cli is MIT with a 6.0.2 latest and no deprecation, but the packages the Alokai docs name (@alokai/*) are not on the public npm registry under those names, and the docs point to a separate registry host, so the installable open-source part is not confirmed. The docs list Storefront UI, integrations, Cloud, Console and Enterprise; the pricing page describes enterprise pricing set per deployment, with no list prices. To settle it: the open-source packages and their license, the public installation command, and whether the storefront source is published outside the README-only repository. The homepage is https at alokai.com; the CSV's www host redirects to it. Storefront UI is listed as its own record, storefront-ui."
