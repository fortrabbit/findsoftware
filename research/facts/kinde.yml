notes: >
  Hosted-service record. The GitHub organization kinde-oss publishes SDKs; the repository in the candidates row, kinde-oss/kinde-auth-pkce-js, is a client SDK (MIT, 19 stars at 2026-11-03, npm @kinde-oss/kinde-auth-pkce-js about 6.0k downloads a week in the candidates row), so its license, stars and npm figure stay here and no repository field is recorded for the service. The docs SDK index lists about 25 server, front-end and native SDKs, among them Go, Java, PHP, Python, Ruby, .NET, Next.js, React and Flutter; sdkLanguages is not recorded as a field. The pricing page lists a free tier of 10,500 monthly active users (MAU), paid plans (Pro, Plus, Scale) billed per MAU, with monthly active organizations counted on some plans, and an "Enterprise SSO" row with Entra ID and Okta named; no prices are recorded. The pricing page also lists "Support for 20+ languages with SDKs" and "Choice of data residency" on every plan; the first names SDK programming languages, so i18n is not recorded. The docs list migration guides from Auth0, FusionAuth, Clerk, Supabase, Firebase Authentication, AWS Cognito, Azure B2C and ASP.NET Identity. Compliance: the security page says Kinde holds an ISO 27001 certificate of registration and a SOC 2 Type 2 report; GDPR compliance is stated as a data processor; these are not recorded as fields. Maintainer: the privacy policy and terms name "Kinde Australia Pty Ltd" and the page footer says "2026 Kinde Australia Pty Ltd"; the privacy policy's ABN (11 655 096 263) differs from the ACN (655 096 263) in the terms of service, which is noted for the reviewer. hqCountry is unknown: the about page says "Australian born company" and the terms are governed by New South Wales law, but neither names a headquarters address, so a reviewer decides. X is linked from the homepage as twitter.com/HeyKinde; the homepage also links LinkedIn, YouTube, GitHub and a Slack community (join.slack.com/t/thekindecommunity), which have no field in this dictionary. The candidates row lists lastRelease as the SDK on npm; that is not a service release date and is not recorded. The docs index also lists a Management API reference and an Account API reference. The supported data regions page says the region is chosen at sign-up and cannot be changed once selected.
