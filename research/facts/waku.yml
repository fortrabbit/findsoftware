notes: >
  The npm latest dist-tag is 1.0.0-rc.4, so currentMajor 1 comes from a release candidate. The npm package "waku" carries versions 1.0.0 and 1.0.1-0 dated 2017, which predate the project: the project's own versions start at 0.0.0 on 2023-05-17 and 0.10.0 (author Daishi Kato, repository github.com/dai-shi/waku, now wakujs/waku) on 2023-05-22, and the GitHub release list only starts at v1.0.0-alpha.0 in 2025, so firstRelease is the 2023 npm date. maintainerType is left to the import, since the LICENSE names a person and the repository sits under an organization. The homepage states the Node.js requirement as ^26.0.0 or ^24.0.0 or ^22.15.0; runtimeMin is the lowest major.
