notes: >
  Repository is the project's own GitLab (git.ispconfig.org), not GitHub; GitLab reports 196 stars and 277 forks, recorded here only because no field holds them. The LICENSE copyright line names "ISPConfig UG" as the maintainer; the imprint on www.ispconfig.org names projektfarm GmbH (Reinstorf, Germany) with Till Brehm as CEO, a different legal entity, so it is not recorded as the maintainer and no hqCountry is recorded for ISPConfig UG. The download page and the README's "Supported operating systems" both state the license and support statements: the homepage lists Ubuntu 22.04 to 26.04 and the README at the release tag lists Ubuntu 22.04 to 24.04, a conflict left to the reviewer. The download page calls the software BSD licensed in words, the LICENSE file is the three-clause text; one license entry. The homepage says "More than 40,000 downloads per month"; a download count is not an install count, so it is not recorded as reportedInstalls. The homepage says the software manages "Websites" and "Web server management (Apache2 and nginx)"; these are the basis for criterion 1. The forum field is the English forum on HowTo Forge that the project's community page lists as its ISPConfig 3 forums. firstRelease is the oldest folder on the SourceForge release listing that the download page links as old ISPConfig releases (ISPConfig-3.0.2, 2010); the GitLab tags start in 2013, and earlier 3.0 releases may exist outside that listing. No runsAs statement was found on any page read, so runsAs is left out. The development branch is develop; the license and the README were read at the 3.3.2p1 tag. The homepage lists HTTP support for Apache2 and nginx and managed services for websites, MySQL databases and cron jobs; these support the control-panel category.
