notes: >
  Not the same project as the Zig static site generator in research/facts/zine.yml (kristoff-it/zine, MIT): this is zineland/zine, Apache-2.0, written in Rust, published as the crate zine. The README lists RSS feeds, Open Graph tags and article topics as features; no field records them. The repository has releases v0.3.0 to v0.16.0 (2022-04-02 to 2023-07-04); v0.1.0 and v0.2.0 are tags only, so firstRelease uses v0.3.0. The crates.io download count is a total since publication. The Zine Team byline is taken from the documentation pages, since no legal name is given. The homepage is the documentation site, which the README names as the project site and which the README says is built by Zine itself.
