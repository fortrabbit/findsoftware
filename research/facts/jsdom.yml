notes: >
  No own website: the repository has no homepage, the npm homepage points to the README on GitHub, and jsdom.github.io answers 404, so no homepage is recorded; the README and the project wiki (github.com/jsdom/jsdom/wiki) serve as documentation. The README says jsdom is "maintained by a team of volunteers" under the jsdom GitHub organization; the maintainer follows the LICENSE.txt copyright line, which names Elijah Insua for the jsdom code, and the organization is the repoOwnerType. LICENSE.txt holds the MIT text for jsdom and notices for bundled material: a CSS implementation derived from cdoublev/css (Guillaume Lebas), CSS grammar data derived from CSSTree (Roman Dvornov), CSS Color 4 conversion code under the W3C Software and Document License (2023), and Unicode 17.0.0 data under the Unicode License v3. The Unicode license is recorded as the SPDX id Unicode-3.0; the W3C license has no SPDX id recorded here and is named only in these notes. GitHub reports the license as NOASSERTION because of these notices. The README's "Getting help" section also names a Matrix room (#jsdom:matrix.org) for chat; no chat field is recorded, and the mailing list is the forum field because the README calls it the venue for how-do-I questions. The README's "jsdom vs. PhantomJS" wiki page compares with PhantomJS, but no record exists for it, so alternativeTo is not set. The happy-dom record's notes say no jsdom record existed; its alternativeTo could now name this record, which this pass does not edit. The optional canvas backend is @napi-rs/canvas, an npm package the README says to install alongside jsdom; no dependency is basedOn. The Tidelift link is paid support, not an edition. The README names no install command in prose, so no installMethod is recorded; npm holds the package. The engines field of the latest npm version requires Node.js ^22.22.2, ^24.15.0 or >=26.0.0; runtimeMin is the lowest major, 22. firstRelease is 2010 from the commit of tag v0.0.1, which predates both the first npm upload (0.0.1, 2011-11-21) and the GitHub releases (from 2026). The GitHub releases list has only prereleases older than the stable line (v27.0.0-beta.3, 2026-03-15), so no latestPrereleaseDate is recorded. The npm weekly figure is the sum of the daily figures for 2026-11-08 to 2026-11-14.
