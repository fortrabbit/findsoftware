notes: >
  The homepage is client-rendered: the HTML carries the site title and no body text, so the quoted title is the only text read there. The docs route at www.antdv.com/docs/vue/introduce answers with the same shell and no body text, so no docs fact is written from it. The README says the library supports "Vue 2 & Vue 3", while the npm 4.2.6 peer dependency is vue >=3.2.0; the README statement is recorded as the project states it, and the peer range is the conflicting figure for a reviewer. The GitHub API reports the license as NOASSERTION, although the LICENSE file and the README both say MIT; the license entries cite both. The maintainer is the copyright holder the LICENSE names, "ant-design-vue"; no page names a person or legal entity as maintainer (the npm maintainer tangjinzhou and the README donation links are not project statements), so no legal form or hqCountry is recorded. The ConfigProvider docs page, read from the docs source in the repository, names locale packages, recorded as i18n. The GitHub releases list starts with the 0.3.1 prerelease (2018-04-20), older than the npm first upload (2018-08-04); firstRelease is 2018 on either. currentMajor is 4 from the highest stable GitHub release 4.2.6; the npm dist-tags next and alpha are 4.0.0 prereleases and the beta tag is a 3.1 prerelease. The npm latest and the GitHub release 4.2.6 share the 2024-11-11 date, so no later stable release exists and no prerelease is newer than it. npmWeeklyDownloads is the sum of the daily range 2026-10-18 to 2026-10-24: the point/last-week endpoint answered with the week of 2026-06-25 at read time. The language is Vue as GitHub reports it. The React library Ant Design is a separate candidate; this repository is the Vue port.
