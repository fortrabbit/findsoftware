notes: >
  The CSV homepage waf.chaitin.com redirects to cyberserval.tech/landing/safeline, the product page the project's own pages use; the GitHub homepage field and the README's "Website" link go through tracking redirects (ly.* short links), which are not recorded. The product pages are branded CyberServal, and the terms page says the intellectual property is owned by CyberServal Co., Limited, whose contact page gives an address in Kwun Tong; the GitHub owner is chaitin and the company site names Chaitin Tech. The project's pages do not state how CyberServal relates to Chaitin Tech, so the maintainer is the legal name the terms give. Chaitin Tech, the GitHub owner, is named on the company site (chaitin.cn) and is left out of the maintainer field. The terms, contact and privacy pages give the address without naming a country, so hqCountry is absent. Pro license: the README names a PRO edition with plans on the landing page (Lite, Pro, Ultimate, prices not recorded); the deploy guide says "SafeLine installed on ARM requires a Pro license to work properly. The Personal Edition is not supported on ARM." The delivery and refund page refers to "SafeLine Pro license(s)". The landing page lists Personal, Lite, Pro and Ultimate tiers with feature lists; the Lite and Pro lists add features such as geo-blocking and upstream load balancing, which the open edition is not shown to have. The license is GPL-3.0 as the repository states it; the ARM Pro license statement is not a license field. The automatic installer is fetched with curl -k (certificate check off) in the deploy guide; the manual install uses docker compose with the compose file on waf.chaitin.com. The compose file names the images chaitin/safeline-mgt, -detector, -tengine, -luigi, -fvm and -chaos plus PostgreSQL; no single Docker Hub image is named as the install image, so dockerPulls is absent. The runtime is a set of containers, so runtime is absent. The landing page says the reverse proxy is Nginx-based; the basedOn value follows that wording. The README's comparison table (ModSecurity, Level 1; CloudFlare, Free) is the project's own evaluation; only ModSecurity has a record. The landing page's "Start a 7-Day Trial" links to a sign-up app; no hosted service is recorded because the pages read do not state the product runs as a hosted service. Two Discord invites appear: the README's (recorded) and the landing page's (not recorded). The 700,000 installations and "Protecting over 2,000,000 Websites" are both README claims; only the installations figure is recorded. Fields coined: none.
