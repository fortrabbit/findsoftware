notes: >
  Latest stable release v3.2.0 (2026-10-10), the CSV date. The Helm chart linked in the site menu is maintained in the inbucket-community repository (community-maintained contributions). The go.mod Go minimum is a build requirement for a product shipped as a binary and image, so no runtimeMin is recorded. The about page compares the project with mailinator.com, which has no record. Criterion 3: install routes are the README's Docker image and source build, and the website's binary and Linux package downloads. Criterion 1 is the doubtful part: the project describes itself as an email testing application, for web developers who "quickly see the emailed output of their applications" (about page), and an app wires in by sending mail to its built-in SMTP server. The project does not state that it is for local development, so runsAs carries no local value. Reviewer decision: whether a test-only mail server belongs in app-services or build-dev, since the notes-app-services file already flags the email-testing tools as dev tools. Firstrelease: the news post "Version 1.0 Released" (14 Apr 2014); release candidates from 2013-10-17 are not counted; GitHub has releases only from 1.1.0-rc1 (2016). The homepage says the Docker image "has been downloaded more than a million times", and the Docker Hub pull count (5,995,000 on 2026-11-03) is recorded as dockerPulls instead. The Docker Hub repository is inbucket/inbucket, the image the README names. The copyright line names James Hillyerd, so no organization is recorded as maintainer; the GitHub owner is the inbucket organization. No headquarters page was found, so hqCountry is absent.
