notes: >
  The npm package the README installs is marx-css; the npm name marx is a different package, a 0.0.2 release by another author, and is not used for any figure. The GitHub latest release v5.3.2 matches the npm marx-css latest 5.3.2. The first release year is the oldest GitHub release, v1.1.0 dated 2015-05-06; the npm package marx-css starts in 2016 and the repository in 2015. The maintainer is the copyright holder of the LICENSE file, Matthew Blode, who is also named as the author of the README. The homepage and README describe the stylesheet in the same terms. No legal entity, imprint or country is stated on the pages read, so hqCountry stays out. The homepage links only to the npm package and the GitHub repository.
