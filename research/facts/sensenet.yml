notes: |
  Status is stub while criterion 3 is in doubt: the only documented installation is the Docker setup for local demos, not a production install or deployment. Revisit when the docs describe one.
  The project's homepage https://sensenet.com answers over https with 200; the GitHub description and the docs describe the software, and the privacy page names the operator Sense/Net Zrt. with a registered office in Budapest, which gives maintainer and hqCountry. The product is offered as open source under GPL-2.0 for the core services, as an enterprise license with a fee and support, as OEM, and as SNaaS in the cloud; the licensing page and README state each, and each is a licenseModel statement, with paidEdition from the enterprise terms. The licensing page says the open-source version comes without support services. The README says on-prem terms are handled by the sales team; that is recorded as the enterprise license, not as a separate fact. The docs describe an admin UI at admin.sensenet.com and in the deployment readme; ADMIN_UI_URL is set to its origin. The README link to a pricing page at sensenet.com/pricing answers 404, so pricingPage is unknown. The sensenet.com home page is the company site; the Content Services Platform page is the product page and is recorded as homepage. The x account is linked in the footer of sensenet.com. The Docker Compose demos are described as local, and no page read states how a production install runs, so runsAs holds only local; the deployment readme does not describe a production install, so the record states only the Docker demo method and does not record a production install. The gitter chat and the Stack Overflow tag in the README have no field here. Authentication uses IdentityServer, SNAuth or LocalAuth in the deployment readme; no page read names the protocol, so sso is unknown. The GitHub releases are v7.0.0-beta (2017-03-28) to v7.8.2 (2025-04-08); the repository holds other release names (dotnet8, health-checker and others) that are not version numbers and are not used for currentMajor. The highest stable version release is v7.8.2.
