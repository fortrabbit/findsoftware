notes: >
  Accepted: a Ruby gem installed from RubyGems under the Gemfile, with a documented setup for Rails and Rack applications, so criteria 1 to 3 hold. Repository only: the gem's homepage_uri is the repository, the repository names no site of its own, and the README links only the wiki, so no homepage is recorded. The README is the in-development branch's documentation and names v2.4.1 as the latest stable release; the gemspec at that tag gives the required Ruby version (2.5) and the MIT license, and runtimeMin and runtime are taken from it. The LICENSE.md copyright line names "Michael Bleigh and Intridea, Inc."; the maintainer is recorded as Michael Bleigh, and Intridea, Inc. is a second legal entity that goes to notes. The gemspec lists four authors (Erik Berlin, Michael Bleigh, Bobby McDonald, Tom Milewski) and the README names none beyond the copyright line, so no other maintainer is recorded. The README says "Each OmniAuth strategy is a Rack Middleware", and the gemspec depends on rack 2.2.8 or later; Rack has no record in this dataset and the README names it as the mechanism rather than a parent project, so no basedOn is recorded. The README names Devise as a route to user management and OAuth 2.0, OpenID Connect and SAML only as protocols that strategies and callbacks use; the protocols belong to the strategies, so no sso value is recorded. The Developer strategy is built in; the README calls it "a completely insecure, non-production-usable strategy". The v2.0.0-rc1 prerelease (2020-12-11) is older than the latest release. The RubyGems first upload 0.0.1 is dated 2010-04-29, the same year as the repository's creation. Stars and contributors are for the repository.
