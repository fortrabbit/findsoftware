notes: >
  The CSV row names the http docs address; the same page answers over https, and the https address is recorded. The README's feature list (seamless integration, automatic schema generation, extensive documentation and community support) carries no source for each bullet and is not recorded. The published docs installation page states Django 1.11 and later while the repository docs state Django 2.2 and later; the Django floor is not a Python runtime and is not recorded as runtimeMin. The package metadata sets no requires_python and the setup.py classifiers list Python 3.8 to 3.12 without a stated minimum, so no runtimeMin is recorded. The README describes it as an integration between Django and Graphene, and the docs index says it is built on top of Graphene, where the link text splits the sentence; the basedOn values rest on the README sentence and the docs index sentence about adding GraphQL to a Django project. The view can serve GraphiQL, an in-browser query IDE, when graphiql is set; that is a development aid and is not recorded as adminUi. The README's community link to Spectrum is not recorded. The repository's LICENSE and the README both say MIT. The PyPI figure is the package the install page names, last month per pypistats.org.
