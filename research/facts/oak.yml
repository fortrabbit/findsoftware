notes: >
  No GitHub releases exist (the releases API returns 404), so currentMajor and latestReleaseDate come from JSR, the registry the README names for Deno, Node.js and Bun installs. The npm package @oakserver/oak has 14.1.0 as its latest version and a Node engines range of >=16.5.0 <22; it is named as an install route in the README but is not the current release line. The npm weekly figure is for that older package and is recorded as stated. The README says send, websocket upgrades and serving over TLS/HTTPS are not currently supported on Node.js, and send and websocket upgrades are not supported on Bun and Cloudflare Workers; these limits are in the README and go in the prose. The project describes itself as inspired by Koa (and its router by @koa/router) and says the code was originally written for Deno; neither is recorded as basedOn. The homepage's "See the docs" link points to the JSR documentation. jsrName is a coined field: the registry id of the JSR package, as npmName is for npm.
