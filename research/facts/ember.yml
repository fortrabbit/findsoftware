notes: >
  The npm figures come from ember-source, the core package, as the brief asks; the quick start installs ember-cli, which has its own npm line (ember-cli: 139,520 downloads in the same week) and is not used for figures. The ember.js GitHub releases/latest object is a sub-package tag (v0.97.0-@glimmer/syntax), so the release date comes from the npm registry. The npm ember-source time table starts at 2.10.0-alpha.1 in 2016, which is not the project's first release, and no page read states a first release year, so firstRelease stays unset. The endoflife.date entry for emberjs gives the cycle support dates, which the import reads; the record holds only the id. The ember.js repository is archived false and pushed 2026-10-21. Pages read: the home page, the quick start, the Ember CLI command and deploy pages, the release guides index, the repository README and the LICENSE file. Ember does not state a rendering mode on the pages read, so renderingModes stays unset. The homepage describes a built-in router, Ember Data as the data layer that new apps include, and tests generated for each entity. The Ember CLI guides site marks itself deprecated and points to the build tooling documentation; its installing and CLI command pages are still cited for the Node.js prerequisite and the browser-ready output. The quick start guide shows the production build writing to dist and uploading to a web host.
