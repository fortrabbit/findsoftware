notes: >
  Status is kept at accepted. The repository's last push is 2023-08-24 (GitHub pushed_at), the latest release is 4.2.1 from 2018-06-14, and the download page calls 4.1.5 the LTS release. No page read says the project has ended or is unmaintained, and the repository is not archived, so no discontinued signal is recorded; a reviewer should decide whether the maintenance gap needs a status. The GitHub wiki installation page was last edited in February 2017 and lists PHP 5 and MySQL 4.1; the requirements recorded come from the download page instead. The development portal's installation wiki did not answer. The download page lists the requirements for 4.2.1, and the composer.json at tag v4.2.1 gives the PHP minimum. The Packagist package has zero monthly downloads and 130 total, and it is the only package under that name. The copyright holder is taken from the footer of subrion.org ("Intelliants LLC"); master has no LICENSE file at the repository root (404), so no LICENSE statement is recorded from it. The download page's paid plugin and template listings are not recorded as paid editions.
