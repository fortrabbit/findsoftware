notes: >
  No homepage: the repository names none (the GitHub homepage field is empty), so the record links the repository only. The README says the bundled output is delivered "via the asset pipeline in Rails", which is the basedOn statement. The gemspec declares no required_ruby_version, so runtimeMin is not recorded. Node is needed for the esbuild, rollup and webpack installers; the Bun installer needs the Bun runtime ("you must have the Bun runtime already installed"), which is not recorded as a runtime value. The README describes a deploy-time step ("When you deploy your application to production, the javascript:build task attaches to the assets:precompile task"); it is not recorded as runsAs. The GitHub releases start at v0.2.0 (2021-11-15); the first gem upload, v0.1.0, is dated 2021-09-06 on RubyGems, which gives firstRelease. The last push is 2026-05-30, after the last release of 2024-07-29. The repository was created 2021-09-06 under the rails organization; the MIT-LICENSE copyright names David Heinemeier Hansson. The README says the bundled output goes to app/assets/builds, a directory the installer adds to .gitignore by default; in watch mode the bundler writes app/javascript/application.js to app/assets/builds/application.js, and ./bin/dev starts the Rails server and the watcher together. For webpack features such as code splitting and hot module reloading, the README names shakapacker, the official fork of webpacker.
