notes: >
  Status accepted from the CSV. Criterion 4: the newest stable release is v1.30.0 (2025-03-10) and the repository is not archived; the default branch is v2, and its README says the team is working on Prism v2 and "will only accept security-relevant PRs for the time being". That is a statement of paused feature work, not an end, so no status signal is recorded. npm dist-tag alpha is 2.0.0-alpha.1 (2026-09-08), recorded as latestPrereleaseDate; the v2 package.json on the default branch declares engines node 20 or later, which is a prerelease requirement and not recorded as runtimeMin. The engines field of the stable 1.30.0 npm package is not a page statement, so runtimeMin is left out. The homepage says Prism "can be used with Node.js as well" and its wide browser support, so runtime is node and no runsAs is recorded, following the rule for libraries that name both. The homepage's CDN example uses prismjs@v1.x. Prism is a spin-off of Dabblet (README); that is history, not basedOn. The maintainer comes from the LICENSE copyright line; package.json names the same author. The GitHub organization PrismJS is the repository owner; stars and contributors belong to the single repository. The npm weekly figure is the sum of the seven daily counts from 2026-11-01 to 2026-11-07. The homepage says to include prism.css and prism.js and use proper HTML5 code tags (code.language-xxxx), and that it "only works with <code> elements". The homepage lists limitations: any pre-existing HTML in the code is stripped off, and the highlighter is "Regex-based so it *will* fail on certain edge cases". The download route is the "Basic usage" section on the homepage, which tells the reader to include the downloaded prism.css and prism.js files; the homepage and its docs are one page. The homepage's "used in millions of websites" is not a count and is not recorded as reportedInstalls.
