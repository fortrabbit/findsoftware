notes: >
  The npm dist-tag latest points at the 8.0.0-rc.23 prerelease; the last stable release is 7.10.1 (dist-tag prev, published 2026-10-15), so currentMajor and runtimeMin are taken from 7.10.1. The quickstart page documents Prisma 8 and states Node.js 22.18 or newer, which is the prerelease requirement, not the 7.x one; it is not recorded as runtimeMin. The homepage now promotes Prisma Postgres and Prisma Compute alongside the ORM; this record covers the ORM only, and the hosted products are not recorded. The npm weekly figure is for the package prisma (2026-10-10 to 2026-10-16), the CLI, not the client.
