notes: >
  The framework lives in laravel/framework, the application skeleton that `laravel new` installs in laravel/laravel; both repositories are recorded with their own star counts, and packagistName points at the framework. MongoDB support comes from mongodb/laravel-mongodb, maintained by MongoDB, not counted in `databases`. The framework itself is free; the company sells hosted and commercial products around it (Cloud, Forge, Nightwatch, Vapor, Nova), which are not paid editions of the framework. The careers page describes a fully distributed company and names no headquarters country. GitHub's contributors endpoint gives inconsistent totals (capped, anonymous counts differ), so `contributors` stays unknown for every framework in this batch. Renderers beyond Blade (React, Vue, Svelte via Inertia, Livewire) appear as starter kits.
