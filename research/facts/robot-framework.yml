notes: >
  The CSV lists the homepage as http://robotframework.org; the https address answers 200 and is recorded. The README calls the framework "a generic open source automation framework for acceptance testing, acceptance test driven development (ATDD), and robotic process automation (RPA)", so the category is testing, and the criterion 1 reading is a test and RPA tool that a creator runs against a site, not a site component; the testing-library ruling covers it. The README says tests are run "from the command line using the robot command", which is a usage statement and not a runsAs statement, so runsAs is left out. Development is "sponsored by non-profit Robot Framework Foundation"; the copyright line of src/robot/__init__.py reads "Copyright 2008-2015 Nokia Networks" and "Copyright 2016- Robot Framework Foundation", so the foundation is recorded as maintainer by the current line and the Nokia line goes here only. The LICENSE file carries no copyright line. The README gives a second license for documentation and other similar content (Creative Commons Attribution 3.0 Unported), recorded as its own entry. The Python minimum comes from the README at v7.5.1, which states Python 3.8 or newer. The PyPI figure is the pypistats last_week count for the robotframework package. The stars and contributors belong to the robotframework repository, which holds the framework itself and no other package. The firstRelease year comes from the 2.0 tag commit dated 2008-06-24, which is an ordinary commit and not a repository import. Libraries in Python, Java and other languages extend it; the homepage and README name the ecosystem but no parent. The homepage lists a Slack workspace and a Forum; the forum link is taken from the README and the Slack link is not a field.
