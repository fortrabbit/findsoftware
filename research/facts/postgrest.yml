notes: >
  The homepage postgrest.org answers with a 301 to docs.postgrest.org, the project's own docs site, which carries the project description and the sponsor list; the homepage is the docs root for that reason. The sponsors on the homepage (Cybertec, Supabase, euronodes) are sponsors, not a parent or basedOn statement. The install page's package routes (Homebrew, FreeBSD ports, Arch Linux community repo, nixpkgs, Nix flake, Chocolatey and Scoop) are each an installMethod entry. The install page states supported PostgreSQL versions as PostgreSQL 14 or later, which is a database version, not a runtime minimum; it is in notes only. The external-auth page describes Auth0 as an external service that issues JWTs; that is the project naming another product, not an sso statement, so sso is not recorded. The maintainer is the LICENSE copyright line's "The PostgREST contributors", which names no legal entity, so no hqCountry is recorded. The first annotated tag v0.1.0.0 is dated 2014-10-10 on the tag object, which sets firstRelease. The latest stable release is v16.5 (2026-10-20); the v14.x line is a separate line still tagged and is not the current major. The auth reference describes JWT authentication, with the authenticator, anonymous and user roles, and the external-auth page names Auth0 as a service that can issue the JWTs; the homepage says the database schema, its structural constraints and permissions determine the endpoints. Contributor count is the non-anonymous page count (228) of the contributors endpoint. The systemd guide sets the anonymous role and the JWT secret in the configuration file it writes for the daemon.
