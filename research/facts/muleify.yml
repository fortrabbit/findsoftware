notes: >
  The repository has no GitHub release or tag; currentMajor and latestReleaseDate come from the npm package muleify, latest 5.5.2, published 2021-07-13. The npm package names vokeio/muleify as its repository; that URL redirects to xeaone/muleify, the repository the candidate row names.
  The GitHub repository was pushed on 2023-01-07 with no release after 2021. The import moves a record with no release in four years to stub.
  The repository row listed github.com/AlexanderElias/muleify as homepage; that is a GitHub repository URL, so no homepage is recorded.
  The LICENSE file has no copyright line; the maintainer is taken from the README Authors section, which names Alexander Elias.
  The npm engines field for 5.5.2 is node >=7.6.0, which sets runtimeMin to the major 7.
