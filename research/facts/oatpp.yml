notes: >
  The about page has a Maintainers heading with no names on the page, so the maintainer is recorded as the project name Oat++; no legal name appears on the homepage, about page, README or Apache-2.0 license text. The license is Apache-2.0 as the homepage states it; the LICENSE file is the standard Apache text without a copyright line. The installation pages cover Unix/Linux, Windows, vcpkg and Conan; the vcpkg and Conan ports are community maintained. The Oat++ docs state a C++ 11 minimum for building, but no page states a runtime or runtimeMin for the built program, so both stay unknown. The homepage says version 1.3.0 while the highest stable GitHub release is 1.3.1 (2024-12-01); the version is recorded by major only, and the tag 1.3.0-latest is not a separate release. The GitHub releases from 0.18.9-alpha (2018-10-30) to 0.19.12 are prereleases; firstRelease is taken from the oldest of them. The about page lists an ORM framework with SQLite and PostgreSQL adaptors as separate modules, a WebSocket framework, object mapping with DTOs, dependency injection and Swagger-UI, and calls Oat++ zero-dependency. The homepage's Gitter chat link is a chat room, not a forum, and is not recorded as one.
