notes: >
  The PyPI JSON downloads block reads -1, so pypiDownloads comes from pypistats.org (last_month). The docs page at the homepage is the Read the Docs site; the quickstart and the README name Starlette and Flask only as hosts for other app classes: the FlaskApp leverages Flask, and the lifespan page links the Starlette documentation, but no page states that Connexion is built on either, so basedOn is not recorded. The README's quickstart runs the app with uvicorn for development and recommends gunicorn with uvicorn workers in production; runsAs is always-on from that statement. The release major and date come from the GitHub release 3.3.0 (2025-10-13), the highest stable release. The minimum Python is the PyPI requires_python value of the latest release; pyproject.toml says >=3.10 for the development branch, which is not recorded. The NOTICE file names the copyright holders Robbe Sneyders and Ruwan Lambrichts. Last push 2026-10-20; not archived.
