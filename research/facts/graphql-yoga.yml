notes: >
  The repository is a monorepo of graphql-yoga and @graphql-yoga/* packages; stars and contributors belong to the monorepo, and the npm and version figures come from graphql-yoga, the package the install docs name. The repository's GitHub releases run from 0.1.8 (2017-11-25) to @graphql-yoga/plugin-jwt@4.0.1 and graphql-yoga@6.0.1 (2026-10-23); the earliest release, 0.1.8, sets firstRelease. The per-package tags for graphql-yoga have their last stable release at 6.0.1 and their newest prerelease graphql-yoga@2.0.0-beta.7 (2022-03-22), so latestPrereleaseDate is absent; the npm alpha and rc tags for 6.0.2 are per-commit builds, read as canary builds. The LICENSE file lists three copyright lines: "2018-2020 Graphcool", "2020-2021 Prisma" and "2021- The Guild"; the maintainer is the current holder, The Guild (no legal form in the LICENSE), and the homepage says the project is part of the Hive ecosystem by The Guild. The package.json author is Saihajpreet Singh. The comparison page names Apollo Server and says Yoga is built on top of Envelop; the migration page names Apollo Server as the source of an import. The migration from Express GraphQL page names express-graphql, which has no record. The page says GraphQL Yoga is built on top of Envelop; no Envelop record exists, so basedOn is absent, and the README's envelop plugins sentence is no parent statement either. The README says the core package depends on the WHATWG Fetch API so it can run and deploy on any environment, and lists Deno, Bun, Cloudflare Workers and AWS Lambda; the runtime values are node, the runtime the quick start names, and deno, named in the same sentence; Bun, Cloudflare Workers and AWS Lambda appear only as link labels and are not recorded. The README quick start installs the package with a pnpm add command from the npm registry, so the record names npm as the route. The Guild footer's shared Discord invite is not recorded as the project's discord. The GraphiQL that ships with the library is a developer tool, so adminUi is absent. Engines in the 6.0.1 manifest state Node 22.15.0 or later.
