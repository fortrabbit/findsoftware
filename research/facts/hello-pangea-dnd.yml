notes: >
  Status accepted: GitHub reports the license as NOASSERTION, but the LICENSE file and the npm metadata both say Apache-2.0; the LICENSE opens with two copyright lines, Gabriel Santerre (2021) and Atlassian Pty Ltd (2019), and only the first is the maintainer; the Atlassian line names another legal entity and goes here only. The README calls its origin "the original react-beautiful-dnd" and says Atlassian "contributed to the original react-beautiful-dnd" and "is no longer involved"; no sentence says this project is a fork, so forkOf is not recorded, and the candidate CSV note "fork of react-beautiful-dnd" is not confirmed by a source read here. The README names Alex Reardon as creator and says he is no longer personally maintaining the project, with Gabriel Santerre and Reece Carolan listed as maintainers; his X link is personal and not recorded. The homepage dnd.hellopangea.com is a Storybook examples site ("@storybook/core - Storybook" in the title) and is the project's own demo site. The npm peer dependencies are react and react-dom at 18 or 19; React is a peer, so basedOn is not recorded. The documentation lives in the docs folder of the repository (docs/about, docs/api, docs/guides), which the README documentation section links; the relationship to react-beautiful-dnd (the older project) is only the README wording above. The earliest tag found is v1.0.0 (commit date 2017-08-10), before the GitHub releases from v14.0.0-alpha.1 (2020-12-15); firstRelease follows the tag. Contributors counts the repository's contributor accounts from the contributors endpoint with per_page=1, read from the rel="last" link (106). The npm weekly figure is the sum of the daily downloads for 2026-11-01 to 2026-11-07. The Discord link is the badge in the README; no quote is recorded for a badge link. The repository's community page says community repositories are based on react-beautiful-dnd and might not work with future versions of this package.
