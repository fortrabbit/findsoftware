notes: >
  Status: no end signal. The repository is not archived. The npm latest version 3.2.0 is not deprecated; npm marks the early versions 0.4.0 to 0.5.2 deprecated, which does not apply to the latest version. The last stable release is 2026-07-09. The README and docs say the package is SSR-safe with Next.js, Remix and other server-rendering frameworks and supports React 16.8 through 19; these are compatibility statements, not runtime or runsAs statements, so neither is recorded. The README's Agent Skill section (npx skills add) installs an AI assistant skill, not the library, so it is not an installMethod. The migration guide for v2 to v3 is a docs page, recorded in the notes only. The docs name a playground and a StackBlitz example, not recorded. The README and docs name a component API (Joyride) and a hook API (useJoyride) over the same steps; the docs also describe controlled mode and events. These are feature statements, not fields. The homepage body names React as the target (add guided tours to your React app), which is the basedOn quote; the meta description says the same; the homepage body reads Create guided tours for your apps, which is the homepage quote.
