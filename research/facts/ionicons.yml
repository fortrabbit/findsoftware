notes: >
  The homepage http://ionicons.com answers over plain http and redirects to https://ionic.io/ionicons; the https URL is recorded and the page read there. The README says the icons were built for Ionic Framework, which is not basedOn. The README's Related list names the Ionic Discord and Forum; they serve Ionic Framework as a whole and are recorded because the project links them as its community. The README describes a Web Component that loads one SVG per icon and only for visible icons, packaged by default with Ionic Framework and loaded from a script tag elsewhere; icons come in filled, outline and sharp variants. The hqCountry address belongs to Drifty Co. (d/b/a Ionic) in its privacy policy. The npm weekly figure is the sum of the range 2026-10-18 to 2026-10-24. The httpArchiveSites figure is the mobile origin count, as for the other records. Criterion 1 holds as an icon set that is used to build interfaces, as the CSV decided on 2026-10-19.
