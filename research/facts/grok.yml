notes: >
  In doubt: no live project site exists, so criterion 4 and the homepage cannot be judged; a live homepage or a statement that the project has ended would settle it. The README links only an Internet Archive copy of grok.zope.org, grok.zope.dev does not resolve, and the grok.readthedocs.io pages name no homepage. The record has no homepage field, as with bowman. The PyPI page gives no license and no home page, so the license comes from LICENSE.txt. The README install section points to the grokproject package on PyPI, which generates a project area and installs grok; the grok package is the core named here. pypiDownloads is the pypistats last_month figure. The readthedocs changes page lists 6.3 as unreleased, so currentMajor follows the PyPI stable release 6.2. The docs site's title says "grok 5.0 documentation" while its changelog runs to 6.2, which is noted and not used for any fact.
