notes: >
  The README says Choices is "Similar to Select2 and Selectize but without the jQuery dependency"; that is a similarity statement, not an alternative statement, so no alternativeTo is recorded. The README build section lists a flag that allows loading Choices into a non-browser environment, and it is compiled for browsers, but no page states that it runs only in the browser, so runsAs is left out. The README asks for more active maintainers; the repository has no end statement. The HTTP Archive technology list has an entry named "Choices" (mobile 16947 sites) with no description; the name does not confirm it is this library, so no httpArchiveSites figure is recorded. The demo page on GitHub Pages is the project's own site. The Web component built by a third party (adidas) is not a record. The npm figure is for choices.js, the package the README installs; the repository has about 1,800 dependent repositories on ecosyste.ms.
