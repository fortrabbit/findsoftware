notes: >
  The homepage describes Pruvious as a Nuxt module, so basedOn is Nuxt. The first GitHub release is v3.9.7 (2024-01-18) and the npm package was first published 2024-01-14, so firstRelease is 2024. The alpha tags 4.0.0-alpha.0 to alpha.8 are tags, not GitHub releases, and are not recorded as latestPrereleaseDate; the current major is 3 per the highest stable release v3.16.1. The homepage and LICENSE copyright differ (the homepage footer reads Copyright 2023-2025 Pruvious, the LICENSE reads 2023-present Muris Ceman); the maintainer follows LICENSE. The database docs name Redis for caching, not as a primary store, so databases lists it but contentStore names only SQLite and PostgreSQL. The npm package engines field states node 20 or newer, matching the installation page. The deployment page states that the Node.js process starts remotely and that pm2 can manage it.
