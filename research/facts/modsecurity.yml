notes: >
  Accepted row. Criterion 1: the docs say the engine protects web applications from attacks, so it is a web application firewall in scope, recorded as web-server. currentMajor 3 is the highest stable release on GitHub (v3.0.17, 2026-09-29); the v2 line is also maintained (v2.9.15, released the same day), and the docs name both generations. The homepage release box (3.0.16) and the docs' v3 line (3.0.17) disagree; GitHub is used, and the docs page is the only project source quoting the v3 number. Connectors are separate repositories: the NGINX connector is ModSecurity-nginx and the Apache connector is ModSecurity-apache, named in the README and the docs. runtime c++ binary follows the library's own language; no page states the process it runs in, so runsAs is not recorded. The FAQ calls it a module that runs inside the web server, which is the connectors' runtime, not a separate process. firstRelease 2002 is the start year the history page gives for the project (a personal project that became the Apache module); the GitHub repository dates from 2011, so a reviewer may prefer a release year. The docs say "Securing tens of millions of domains", undated and with no figure, so reportedInstalls is not recorded. Sponsorship by Trustwave ended in 2024 per the README's sponsor note, and Trustwave's commercial ModSecurity offerings were retired in 2021 per the history page; neither is an end statement, the FAQ says the project is not end of life. maintainer OWASP Foundation follows the homepage's custodianship statement; the OWASP contact page has no postal address, so hqCountry is not recorded. The Slack link (owasp.slack.com) and the LinkedIn link have no field. The GeoIP library note in the README is a dependency statement, not a status. Prose sources: the SecRules language and the library's connector model from the README, the IIS packaging of v2 from the docs page, and the OWASP maintenance and sponsorship statements from the FAQ and history pages. Fields coined: none.
