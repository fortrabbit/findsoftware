notes: >
  Status is set to discontinued on the README statement 'HUGE has reached "soft End Of Life"', which is the signal in the write-record list and criterion 4 as written. The same README also says the project "will be maintained, so it will get bugfixes" and that it is "actively maintained and bug-fixed"; The README calls the stable release v3.1 while the latest tag is v3.3.1 (published 2019-03-01); the release fields follow the API. The repository's last push is 2024-09-04, recorded here only as the GitHub repository state and not as a field. The project has no documentation site: the README says "A real documentation (currently there's none, but the code is well commented)", so docs stays unknown; the CSV homepage was the GitHub repository and is not a separate project site, so homepage is absent. The composer.json names homepage as the GitHub repository. The maintainer is the GitHub account panique, whose profile name is Chris, and the README signs as Chris; no legal name is given on the pages read. The package panique/huge has 526 total and 0 monthly downloads on Packagist. The README's "Licensed under MIT" statement is the license source because the repository has no LICENSE file on master, and the GitHub API license field is null. Packagist records no abandoned flag.
