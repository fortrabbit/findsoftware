notes: >
  Status accepted from the CSV. Criterion 4: the repository is not archived, the crate is not yanked in its newest versions, and the newest stable version is 1.12.0 (2026-10-10). The README says "At this point, it mainly sees passive maintenance." That describes a finished feature set, not an end, so no status signal is recorded. Criterion 3: the README's "In Cargo.toml, add" section gives the cargo route under [dev-dependencies]. The GitHub releases stop at 0.9.6 (2020-04-11), which is older than the crate on crates.io; the registry version has the higher major, so currentMajor is 1, following the rule for a registry major above the GitHub release. The repository is a Cargo workspace with proptest-derive, proptest-macro and proptest-state-machine; those are separate crates in the same repository and are not separate records here. The homepage is the GitHub Pages site the crate manifest names, whose introduction the README links as its book; the docs.rs address is the API reference. The README says generation and shrinking "is defined on a per-value basis instead of per-type" unlike QuickCheck. It says proptest is "inspired by the Hypothesis framework for Python" and belongs to the QuickCheck family; that is history and not basedOn. The maintainer follows the LICENSE-MIT copyright line (FullContact, Inc, 2026); the crate's Cargo.toml authors name Jason Lingle, and the GitHub organization is proptest-rs. A reviewer may decide which name belongs on the record. Tags run from 0.1.1 (2017-08-05); the crate was created on crates.io on 2017-06-18, which sets firstRelease. The 90-day crates.io figure is 78226726; only the total is recorded. The MSRV statement in the README matches rust-version 1.88 in the manifest on the default branch. No prerelease version was checked, so latestPrereleaseDate is left unrecorded.
