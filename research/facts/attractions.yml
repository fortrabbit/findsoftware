notes: >
  Discontinued on three of the project's own signals: the README opens with a deprecation notice that names Svelte 5, shadcn-svelte and Melt UI as the projects to use instead; the GitHub repository is archived; and npm marks the latest version 3.7.2 as no longer supported. The npm weekly figure is the sum of the daily downloads API for 2026-10-18 to 2026-10-24. The README says the kit "was originally built for Svelte 3", and the npm peer range is svelte ^3.31.0; no record of a Svelte 5 build exists. The GitHub release list ends at v3.7.2 (2024-03-01) for stable releases, and the first upload is v1.0.0-alpha on 2020-05-28, which matches the npm first version. The homepage reads "49 components"; the count is not recorded because it moves. The homepage names its two authors through the handles of their GitHub accounts; the LICENSE line gives the full names.
