notes: >
  The record covers SearchStax's hosted services: Managed Search, which runs Apache Solr for customers, and Site Search, a website search product with a crawler and connectors. The Solr Private Cloud page says Solr is open source, so the underlying software is Apache Solr, but no Solr record exists in research/facts, so no basedOn is recorded. The Solr Private Cloud is a deployment that SearchStax provides in a separate Virtual Private Cloud, not software the customer installs, so it is not recorded as selfHostOption. The Site Search pricing page's feature table lists "2 Languages" and "50 Languages" and "Single Sign-On" and "Users and Roles" without tying each row to a plan in the text, so i18n uses the 50-language row as the stated upper figure and the plan mapping is unknown; SSO and roles are recorded from the Managed Search security page instead. No repository is recorded: the pages read name no GitHub or other source repository. The homepage links Twitter (x) and LinkedIn, and the footers of other pages link Facebook and YouTube; only the homepage x link is recorded as a social field. The About page names no founding year or first release, so firstRelease is unknown. The terms name "SearchStax, Inc. dba SearchStax" as the contracting party, and the privacy policy uses "SearchStax Inc." without the comma. The homepage's G2 ranking is a directory rating and is not recorded.
