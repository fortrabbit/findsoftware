notes: >
  The record covers framework mode; declarative and data modes are a client-side router library, which makes this a boundary between library and framework for the schema. npmWeeklyDownloads for react-router counts all modes, while @react-router/dev (the framework-mode Vite plugin and CLI) approximates framework-mode use; both are recorded. Remix v2 continued as React Router v7 (May 2024); the remix.run site now hosts a separate Remix project that was not researched here. maintainerType company rests on the Remix team having joined Shopify (2022-10-31); GOVERNANCE.md describes a steering committee of Remix team developers. The deploying page names a node-postgres template that the templates repository does not contain. The installation page states no Node.js minimum, so runtimeMin comes from npm engines. Coined field here: governance (governance model in a few words). contributors is the GitHub API count including anonymous contributors; downloads cover 2026-10-10 to 2026-10-16.
