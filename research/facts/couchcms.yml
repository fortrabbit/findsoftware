notes: >
  Status check: archived false, no ended or unmaintained statement found on the homepage, docs or README, so status stays accepted. The requirements page footer reads 2010-2017 and the page is dated, so its PHP 5.0.0 minimum is not recorded as runtimeMin. The products page states the CPAL attribution terms: attribution in the source code cannot be waived, and the link on the site front-end can be waived with the author's permission. The products page says the open-source version is the only version, so no paidEdition is recorded; the commercial license removes the attribution link and admin branding and includes one month of support. The homepage claim "used by thousands of sites world-wide" is a vendor claim without a figure and is not recorded. The repository contains couch/ and CHANGELOG.md; the last commit date is 2026-04-26 and the last GitHub release is v2.4 from 2023-10-15. The CHANGELOG top entry is a placeholder ("2.0 - (2016/m/d)"), so the release date comes from the releases API. The runsAs value per-request comes from the Apache and LiteSpeed server requirement, with PHP run by the web server for each request.
