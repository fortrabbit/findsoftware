notes: >
  The repository has no releases and no tags, so no release fields are recorded and lastCommitDate is the committer date of the newest commit on main. The homepage is the project's own site and is the same site the README calls its official web site. The homepage says Record Collector is built using Blazor Static SSR on .NET 10.0, which sets basedOn Blazor; the about page adds that the content folder is read into C# objects and used in a regular ASP.NET Core project with Blazor components, and the README says the generation process runs through WebApplicationFactory from Microsoft.AspNetCore.Mvc.Testing. The README names Hugo as an inspiration and says the content structure is kept compatible with it and TOML, YAML and JSON front matter are parsed; that is an inspiration, not a parent, so no basedOn for Hugo is recorded. The default frontend is based on Tailwind CSS, htmx and hyperscript and requires npm steps; a Simple.css frontend needs no such steps. The output path is set per site in appsettings as StaticSiteRootPath, so outputDir is not recorded; the Netlify posts show artifacts/static-site/ as the publish directory, which is a sample value. The README says the project works "live" on content preview and templating during development; that is a development-time run, not an editor preview of unsaved content, so livePreview is not recorded. The getting-started page says the template override feature was removed with the move to .NET 8.0 and Blazor SSR. The NuGet search returned no package under the project's name, so no registry field is recorded. The minimum .NET runtime is not stated as a minimum, so runtimeMin is absent; the homepage and README name the .NET version the project is built with.
