notes: >
  The server installation guide says a Cadence worker service hosts the workflows. The sdkLanguages are Go and Java (official) and Python and Ruby (community), per the get-started page. The license has two statements: the source code is Apache 2.0 (the repository LICENSE file and the open-source concept page), and the documentation in the repository is CC BY 4.0 on the license page. The Go and Java SDKs are official; the Python and Ruby SDKs are community projects, and the README names the unofficial Python SDK at firdaus/cadence-python and the Ruby SDK at coinbase/cadence-ruby. The Cadence server uses Elasticsearch or OpenSearch for advanced visibility, and the Helm codelab names Kafka and OpenSearch; those are dependencies, not recorded as databases. The FAQ comparison page "Cadence vs Temporal" and the migration page name Temporal, which has no record yet; the migration page says Temporal is a 2019 fork of Cadence, a statement about Temporal, so no forkOf or successorOf is recorded here. The comparison page also calls Cadence a CNCF Sandbox project, while the homepage says CNCF project; the governance wording is left to the homepage. The open-source concept page's deployment table lists a Managed (Uber) deployment that is an Uber-operated internal cluster, not an offer to outside users, so no hostedOffering is recorded. The Stack Overflow, Slack, YouTube and LinkedIn links on the contact page are community links with no matching field. The CC-BY-4.0 entry is the documentation license. The open-source concept page's deployment table lists SQLite for local development, Docker Compose with Cassandra or MySQL for team development, and Kubernetes with Helm with Cassandra, MySQL or Postgres for staging and production. The Docker Hub pull count is for ubercadence/server, the server image the installation page names. The oldest GitHub release is v0.1.1-beta from 2017-06-07; the first release year is 2017. The homepage does not give a company address, so hqCountry is not recorded.
