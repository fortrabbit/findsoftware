notes: >
  The repository is archived, and its README says it "is now part of" the fancyapps/ui repository, where the current Fancybox ships as part of Fancyapps UI, a modern JavaScript toolkit. The README is the end signal: the v3 line is replaced by that rewrite, not moved, so the status is discontinued. The successor is no record here. The company site lists "Fancybox v3" under past releases, and that link goes to an Internet Archive copy, which is named here only. The page at fancyapps.com/fancybox/3/ now redirects to the current Fancybox page, so no v3 install page can be cited. The README names no install route: it shows script tags for downloaded jQuery and Fancybox files, so installMethod is left out. The project's own npm package is @fancyapps/fancybox (author "fancyApps", license GPL-3.0, 40862 downloads from 2026-11-01 to 2026-11-07, latest 3.5.7); the README and the homepage name no npm install route, so the package and its figure are not recorded as facts. The README gives two licenses: GPLv3 for open source applications and a commercial license for commercial ones; both are recorded as their own entries, and the derived licenseModel will read open-core. GitHub detects no license and the default branch has no LICENSE file; the npm package metadata also says GPL-3.0. Maintainer: the terms page names Jānis Skarnelis as the author of Fancyapps software; the npm package author is "fancyApps" and the site footer reads "Fancyapps", recorded here only. Latest GitHub release v3.5.7 (2019-03-11); the oldest tag in the repository is v2.0.4, committed 2011-12-13, which sets firstRelease (the oldest GitHub release is v2.1.6, 2017-01-10). The Discord link is the /discord/ link on the fancyapps.com homepage, which redirects to a Discord invite for the Fancyapps community. Contributors counted across all pages.
