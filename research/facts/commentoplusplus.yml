notes: >
  The homepage in the candidates row, commento.souradip.me, does not resolve in DNS (checked 2026-11-03), and the GitHub repository names no homepage, so no homepage is recorded and the status is stub with the doubt stated here: a live project page or a restored homepage would settle it. The live demo at demo.souradip.com is a page titled "@souramoo's patched commento" that names the same patches; it is a demo, not a homepage, and is not cited as one. The LICENSE copyright line reads "Copyright 2018 Commento, Inc.", the inherited upstream copyright; the maintainer is the fork's author, named on his GitHub profile as Souradip Mookerjee (@souramoo, credited by the README). The README gives no process-model sentence: it says to run the commento binary, so runsAs is not recorded. The widget attaches with a script tag (a defer script from the instance plus a div with id commento). The README says the install docs are at docs.commento.io, the same site that returns 404 (see commento), so no docs fact is recorded. The Docker images named in the README are from a third party (caroga, on GitLab and Docker Hub), so they are not an installMethod of the project. The README names PostgreSQL and the Heroku and Railway buttons; both are routes. The last commit on master is dated 2023-06-27 (pushed_at); the last release is v1.8.7 dated 2022-04-07. The README asks for donations through PayPal and offers no paid edition. Sign-in is described as OAuth login and single sign-on without a protocol named, so sso is not recorded. Spam detection through Akismet and Perspective, wildcard domains, and guest names are feature lines only and are not recorded.
