notes: >
  The repository is the only site the project names; GitHub's homepage field is empty, so no homepage is recorded (repo-only project). The README describes the tool as a static blog generator with no front matter, no themes and no plugins; the template files are index.html and post.html. The Netlify deploy button points at a separate template repository (lucas-deangelis/underblog-template), which is not recorded. The highest stable GitHub release is v0.2.3 (2019-11-29), so currentMajor is 0. The Go module name and the Dockerfile's golang:1.13.4 base image are the only Go version statements; go.mod states go 1.13 for the module, which is not a release minimum, so runtimeMin is unknown. The project has no registry package; a Go module has no download figure. The README roadmap lists RSS generation as not done. The latest release is from 2019, so the import judges it by latestReleaseDate.
