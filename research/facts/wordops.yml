notes: >
  The docs prerequisites page answers 404 and is not cited; the README at v3.23.1 and the installation guide carry the install steps. The homepage names "Ubuntu Server 20.04/22.04 or Debian 10/11/12" as requirements, the README at v3.23.1 names Ubuntu 24.04 and 22.04 (recommended) and Debian 11, 12 and 13, so the README list is current and the homepage list is stale; no field holds OS support. The installation guide calls the manual pip route deprecated, so the PyPI package is recorded as the registry id and not as an install method. The setup.py python_requires is the manifest minimum at the latest tag; the README requirements list is newer. Maintainer: the LICENSE copyright line names WordOps and no legal notice, terms or privacy page gives a legal name or country; the team list names individuals and VirtuBox hosts the site, neither is the maintainer. The LICENSE also carries an EE Development Group copyright line for the EasyEngine code WordOps forked; one license, MIT. The earliest GitHub release is v3.9.3, flagged as a prerelease. The WordOps dashboard listens on the server (port 22222 per the FAQ) and is part of the install, which is why adminUi is yes. runsAs is left out: no WordOps page states that the WordOps process runs as a daemon or per request; it is a command run on the server that installs services. The homepage sponsor and donation links (Liquid Web sponsor on the README, Ko-fi) are not fields. The homepage stacks list names Nginx, PHP-FPM 8.1 to 8.3, MariaDB, Redis, WP-CLI, Netdata and phpMyAdmin; the stack names are the homepage's words, the versions go stale and are not recorded. The FAQ calls the tool a command line tool for server administration that sets up a LEMP stack. The README usage section shows the site command as wo site create with a domain and a site type flag, for example --wp for WordPress and --php or --html for other sites. Fields coined here: none.
