notes: >
  The npm name tacit is a different package (0.2.1, last published in 2022) and is not the one the install docs name, so it is not used. The install docs name tacit-css through the jsDelivr CDN and the download link. The homepage says "Work in progress" and "The framework is still in development", not an end signal. The repository is not archived and the latest release is dated 2026-06-21. The LICENSE copyright line covers 2015 to 2026. Built-on projects named in the README (kacit, bahunya) build on Tacit, so they are not a parent of Tacit. The README says the stylesheet is responsive only when the page also adds the viewport meta tag. The README lists browser versions tested, which is compatibility and not recorded. Contributors are counted from the contributors API across all pages, with per_page=1 read from the Link header.
