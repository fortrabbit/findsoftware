notes: >
  The homepage is server-rendered and readable; its visible text has no single sentence to quote, so the homepage fact carries no quote. The project has no GitHub releases; the npm package svelte-material-ui is the registry figure, because the install guide names it for the default theme (bare.css) and the component packages are published separately as @smui/*. The @smui/button package has its own download figure (10981 for the same week), not recorded. The GitHub API language is SCSS; the record uses Svelte, the language of the packages the install guide tells users to import. The README says the MIT license covers files taken from Google's MDC-Web project, and Apache 2.0 covers all other code; both are recorded as statements. The homepage footer links the maintainer's personal Mastodon account (port87.social/@hperrin), which is not recorded as a project social field. The README also states a Matrix space as a help channel, which is no field. The README says v7 is the last version for Svelte 4, which is a compatibility statement and is not recorded. The install guide's CDN example names an older version, not a fact about the current release.
