notes: >
  No homepage: the GitHub homepage field is empty and the composer.json homepage is the repository itself, so the record has the repository only. The README says Comet requires PHP 7.2 or newer; the composer.json of the v2.7.3 tag has no php requirement, so runtimeMin follows the README on master. The README names Slim, Guzzle and Workerman as the components it is based on; Guzzle is an HTTP client library and is not in basedOn. The README's Nginx section describes Nginx as a reverse proxy or load balancer in front of a Comet app. The repository was last pushed 2026-06-30, while the latest Packagist version is v2.7.3 dated 2025-08-18; latestReleaseDate follows the Packagist version time because the repository has no GitHub release. The CSV note says Workerman based; the README states the basis in the quoted sentence. The Packagist figures are for gotzmann/comet, the package the README installs.
