notes: >
  The package builds the Eloquent query from request parameters; its docs state that query parameter names follow the JSON API specification as closely as possible, a naming convention and not an API the package serves, so headlessApi is not recorded. The docs version named here is v7, the stable major from release 7.3.9, and the docs also cover v2 to v6 at the same site. The candidates row carried 36.8M Packagist downloads; the current total is recorded with its date. The maintainer is SPATIE BVBA as the privacy page names it; the LICENSE copyright line reads "Spatie bvba". The introduction says the package works together with existing queries, and the docs list filtering, include and sorting features. The bluesky, mastodon and youtube links are Spatie's company accounts from the docs footer. The README's postcard request and its paid products link are Spatie's own asks and are not license terms or editions of this package, so paidEdition is not recorded. The candidates row names it laravel-query-builder; the name recorded is the docs title, Laravel Query Builder. The firstRelease year comes from the oldest Packagist version 0.0.1 dated 2018-01-16, the same date as the oldest GitHub release. The dependentPackages and dependentRepos figures are the ecosyste.ms counts as the endpoint returns them.
