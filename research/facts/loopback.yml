notes: >
  The record is LoopBack 4, the loopback-next monorepo; the registry figures are for @loopback/core, the core package the repository names, since the install command runs create-loopback. The homepage marks "LoopBack 3 ( EOL )" and "LoopBack 4 (Active)"; the LTS page at loopback.io/doc/en/contrib/Long-term-support.html states "LoopBack version 3 reached end of life at the end of 2020." LoopBack 3 is not a record of its own here. The README states LoopBack 4 is Current with EOL "Apr 2028 (minimum)". The homepage banner states that LoopBack graduated to an at-large project at the OpenJS Foundation; no owner change is recorded beyond the copyright line. The GitHub API reports the license as NOASSERTION while the LICENSE file and README state MIT, so the page statement is recorded. The repository has no GitHub releases; the npm latest date is recorded. The README states "LTS" is not offered for LoopBack 4 yet and lists Node.js Maintenance LTS 22, Active LTS 24 and Current 26 for the install.
