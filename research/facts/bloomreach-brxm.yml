notes: |
  The GitHub homepage field points at xmdocumentation.bloomreach.com, which redirects to docs.content.bloomreach.com; that documentation site is recorded as homepage. The product is named Bloomreach Content in the docs, Bloomreach Experience Manager in the GitHub description and brXM in the repository, and the record keeps the candidate name. The default branch holds only a README that points to the release tags, so the source is the tag trees: the release policy says Bloomreach publishes git trees for release tags only and applies a 24-month delay between enterprise releases and their open source versions, so the highest public tag brxm-16.1.0 (2024-09-30) is the current major here while the docs name 17 as current. The GitHub repository has no GitHub releases, so the tag commit dates give the release dates, and the oldest tag brxm-12.6.13 gives firstRelease. The docs describe Bloomreach Cloud (PaaS) and a SaaS option for the same product; no prices are recorded. The system requirements page applies to on-premise deployments; the docs list Java 21, 17, 11 and 8 and Tomcat 10 and 8.5/9.0 and runtimeMin follows the brXM 16 line on the first-project prerequisites page (Java 17). The extended stack options on the same page add PostgreSQL, Oracle and MS SQL Server as CMS databases; the page says support for third-party products depends on the licensed stack options. The same page lists LDAP directories under supported components, which is the basis for sso. The x account is Bloomreach's company account, linked from the docs home page. The headless delivery API is named in the docs home page; no content store is stated, so contentStore is not recorded.
