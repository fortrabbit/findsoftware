notes: >
  Coalesce's own site and README both describe it as a framework for ASP.NET Core and Vue, so the record names those two as stated but records no basedOn, since neither page says Coalesce is built on them. The install page names the template package IntelliTect.Coalesce.Vue.Template and the dotnet coalesce code generator; the registry figure is the core package IntelliTect.Coalesce, as the rule for scaffolders says. The NuGet download figure is the package total at the time of the query. The GitHub releases run from 2.0.0 (2018-05-25) to 6.5.1 (2026-05-12), with three 2020 release-candidate tags marked prerelease; the highest stable release is 6.5.1, which sets currentMajor. The NuGet registration lists version 2.0.0 published 2018-04-30 as the oldest listed version, which sets firstRelease. The install page asks for a recent Node.js and pnpm for the front-end toolchain; these are development tools, not the runtime of the live application, so only dotnet is recorded as runtime. The sso value is taken from the install page's template options, which name OAuth and OIDC sign-in; the page does not state a protocol list beyond that. The README describes generated CRUD endpoints, but no page names a REST or GraphQL style, so headlessApi is not recorded. The Azure, GitHub Actions and Terraform template options are not recorded as deployment facts.
