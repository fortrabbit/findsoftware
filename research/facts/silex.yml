notes: >
  The homepage names Silex Labs as the copyright holder and as the non-profit that maintains Silex; the README adds that the project "is maintained by Alex Hoyau and owned by the non-profit Silex Labs", which is recorded here only as the note, since the maintainer field follows the homepage. hqCountry comes from the homepage's Paris statement. The homepage gives 2009 as the start; the GitHub repository was created in 2013 and the npm package @silexlabs/silex in 2023, so firstRelease follows the project's own statement. The npm package named silex (version 0.0.35, a different project under silexjs) carries the old name and is not used for any figure. The install docs name no npm package: they say the app is a single Node.js package that is cloned and built, and the root package.json of the repository is named @silexlabs/silex, so npmName and the registry figures use that package. Node requirements conflict: the self-hosting guide says Node.js 20+ for all Node-based options and 20 or later on the Node.js page, while the npm package @silexlabs/silex declares engines node >=24; both are recorded as runtimeMin. The license is stated two ways: GitHub reports AGPL-3.0, while package.json declares AGPL-3.0-or-later; both are recorded as license entries. The hosted editor at v3.silex.me is free and needs a GitLab account for storage, per the README; it sits next to the self-hostable software and no price is recorded. The desktop app is in alpha and is not an edition. The published sites are static HTML; the always-on entry describes a self-hosted editor instance.
