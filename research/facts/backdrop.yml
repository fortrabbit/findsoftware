notes: >
  The license is stated two ways. LICENSE.txt in the 1.x branch is the GNU GPL version 2 text, and the README says Backdrop is GPL v2 (or higher). Both are recorded: GPL-2.0 from the license file and GPL-2.0-or-later from the README statement. GitHub reports GPL-2.0. The runtimeMin is the BACKDROP_MINIMUM_PHP constant in core/includes/bootstrap.inc, which matches the README's "PHP 7.1.0 or higher". The system requirements page on docs.backdropcms.org was not reached, and the requirements URL on backdropcms.org returned 406. The forkOf value comes from the about page, and importsFrom from the homepage's Drupal 7 upgrade path. The database, admin UI and content store fields were not confirmed on any page read and are not recorded.
