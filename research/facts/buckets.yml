notes: The homepage http://buckets.io answers only over plain http (HTTPS does not connect), so no homepage is recorded and the status fact cites the http page. The repository bucketsio/buckets is archived and its description reads "[DEPRECATED]"; the README links asm-products/buckets, which redirects to it. The project's own site says development is on hold, and the archived repository is the end signal. The API lists the latest GitHub release as v0.0.7 (2014-11-02); npm latest is 0.0.8 (2015-04-24), same major 0. The npm package buckets first appeared as 0.0.1 on 2013-06-13 under the same author and a davidkaneda/buckets repository, older than the GitHub tags, so firstRelease is 2013. The npm engines field states node 0.10.x, recorded as runtimeMin. The package.json author is David Kaneda; the README says the product was built by the Assembly community, and the maintainer is recorded from the author field. The README says Node.js and MongoDB are required and lists REST API docs under developer documentation. The site footer copyright says "Buckets 2015". The vision docs mention planned role-based permissions; no shipped feature is stated, so userRoles is not recorded.
