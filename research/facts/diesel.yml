notes: >
  The GitHub license detection reads Apache-2.0 while the crate manifest and README state MIT OR Apache-2.0 (LICENSE-APACHE and LICENSE-MIT both in the repository); the README lists the two licenses and each is recorded as its own entry. Pre-built binaries for diesel_cli are offered on the getting-started guide, a dev tool that the crate itself does not depend on. The homepage footer names The Diesel Core Team; LICENSE-MIT names Sean Griffin for 2015-2021 and Diesel Core Team for 2018-2021. The sponsors list (NLNet Foundation, Rust Foundation and others) is not recorded. The first crates.io version 0.1.0 dates from 2015-11-29, which sets firstRelease; the oldest GitHub release is v0.7.0 from 2016-08-02. The release list has two prereleases from 2022 (2.0.0-rc0 and rc1), both older than the latest stable release. The crates.io figure is the all-time total download count. The compare page covers SQLx and SeaORM (record ids sqlx-rust and sea-orm) beside crates without records; its quote is the page's opening sentence and the names come from its list of covered crates. Stars and contributors belong to the single crate repository. The diesel.rs compare page covers SeaORM and SQLx; neither has a record yet, so no alternativeTo is recorded.
