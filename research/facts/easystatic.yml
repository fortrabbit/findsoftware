notes: 'The root https://easystatic.com fails the TLS handshake (curl: SSL_ERROR_SYSCALL) on 2026-10-22; http://easystatic.com/ and https://www.easystatic.com/ serve a HugeDomains page titled "EasyStatic.com is for sale", and https://easystatic.com/docs also fails TLS. The quote is that page title, read over http. No homepage is recorded and status is stub under AGENTS.md. The README is quoted in the form it is read: its heading says "a static site generator for GitHub projects", its copyright line reads "Eeasystatic contributors" (sic), and its docs folder holds the getting-started page used here, which describes Markdown pages and an EJS layout. The README templating line names Markdown It, EJS and Postcss. The repository has no GitHub releases; npm latest is 0.1.12 (published 2016-04-03), so the major is 0. GitHub tags stop at v0.1.7. Last push 2019-05-13; not archived, not deprecated, no end statement found. npm lists author Konstantin Tarkus; the project states no company.'
