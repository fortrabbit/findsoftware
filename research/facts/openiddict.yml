notes: >
  The OpenIddict stacks are server, client and validation, usable separately or together, and the install guides name the NuGet packages OpenIddict (client), OpenIddict.AspNetCore and OpenIddict.EntityFrameworkCore (server). The NuGet figure and dependent counts follow the OpenIddict package the client guide names; the package name is the project name. The repository is a monorepo of many packages: stars and contributors cover all of them. The homepage says the project is "released under the Apache 2.0 license" and the repository's LICENSE.md is Apache License 2.0. The README says the server and validation stacks run in ASP.NET 4.6.2 or later and ASP.NET Core 2.3 or later, the client also in Android, iOS, Linux, Mac Catalyst, macOS and Windows applications; the integrations pages give the .NET targets: ASP.NET Core 10.0 and 11.0 with .NET 10.0 and .NET 11.0 are listed as supported and .NET Framework versions are listed with limitations, so no runtimeMin is recorded. The README names Entity Framework Core, Entity Framework 6 and MongoDB as built-in stores. The README says the project is "not a turnkey solution but a framework that requires writing custom code" (typically at least an authorization controller), and that custom stores can be implemented to support other providers. The server stack creates an OAuth 2.0 and OpenID Connect server, the validation stack adds token authentication to ASP.NET APIs, and the client stack integrates with remote servers, as the getting-started guide describes. The README calls the project a poor candidate for the OpenID Connect certification program and tells developers to run the conformance tests against their own deployments. The README links Volo.OpenIddict.Pro (ABP) and other third-party projects built on OpenIddict; these are separate products and are not recorded. A Rock Solid Knowledge SAML2P component is a sponsor's separate product for SAML and is not an OpenIddict feature. The homepage's Gitter chat room and the Stack Overflow channel are general community channels and are not recorded as forum. The Management UI in the getting-started guide is a sample, not an adminUi of the software. The newest preview (8.0.0-preview.6) was published minutes after the newest stable release on the same day, so no latestPrereleaseDate is recorded. The first NuGet upload of the OpenIddict package (1.0.0-rc1-final, 2017-10-20) matches the oldest GitHub tag. The GitHub API lists the license of the repository as Apache-2.0.
