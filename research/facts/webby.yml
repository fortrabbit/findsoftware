notes: >
  The homepage http://webby.rubyforge.org/ answers 404 with a "RubyForge - Page not found" page on 2026-10-23, and the README links to the same address, so no homepage is recorded (the README also names the RubyForge project). The README states the project is no longer under active development and points to nanoc; that is the discontinued signal, and the CSV row's accepted status is superseded here. Under AGENTS.md a dead project site also makes a record a stub, so the reviewer should decide between discontinued and stub; this file keeps discontinued because the project's own README states the end. Install steps are in the README (gem install webby), so criterion 3 holds. Registry figures come from the gem named by the install docs. The RubyGems version history shows 24 versions all uploaded on 2009-07-25, so the registry date is recorded as the latest release date only. firstRelease is the 0.7.1 tag commit date (2008-01-04). The repository has no GitHub releases, only tags; latestReleaseDate follows the RubyGems 0.9.4 release. The gemspec date and the 0.9.4 tag commit date (2009-04-06) differ from the registry upload date and are not recorded. No plugin directory is recorded.
