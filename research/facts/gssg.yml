notes: >
  The GitHub homepage field and the CSV point to staticgen.com/gssg, a directory listing; a directory is not the project's own site, so homepage is absent. The license is stated two ways: LICENSE and README say MIT, and the package.json published on npm says "ISC" (npm latest 1.0.5 reports license ISC). Both are recorded as license entries with their sources, and the registry's ISC statement is the one the npm package carries. The highest GitHub tag is v1.0.2 and there are no GitHub releases; the npm latest 1.0.5 (published 2020-12-29) is used for currentMajor (1) and latestReleaseDate, which is the same major as the tag. The install docs name the npm package generic-static-site-generator; the name "gssg" is not on npm, so no registry fact is taken from it. The author's name is "Abhishek Chaudhary" in the LICENSE and "abhishek chaudhary" in package.json; the LICENSE form is recorded. The README says the configuration lives in a config.json file; that is recorded in the description and not as a field. The repository was last pushed 2020-12-29 and is not archived; no end statement or deprecation was found, so the status stays accepted and the import moves the record to stub on its own.
  The README says the project treats webpages as objects which can be evaluated, lists Node.js and a website architecture as requirements, and shows the gssg command under Usage.
