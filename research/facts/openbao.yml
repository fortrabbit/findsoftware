notes: >
  Fork: the homepage says OpenBao is a "fork of Vault". HashiCorp Vault has an accepted row in candidates-app-services.csv but no fact file yet, so forkOf is not recorded; set forkOf to vault once vault.yml exists. Reviewer decision.
  Maintainer: the LICENSE file carries "Copyright (c) 2015 HashiCorp, Inc." inherited from Vault, which the repository license rule would make the maintainer. The project names itself OpenBao on its homepage and the record uses that name. The legal entity behind the community is the Linux Foundation project "OpenBao a Series of LF Projects, LLC" (footer of openbao.org, copyright line "© 2026 OpenBao a Series of LF Projects, LLC"); it is not recorded as maintainer. The maintainer is recorded as OpenBao, as ruled: a copyright line inherited from the forked code is not the fork's maintainer.
  Foundation: the homepage names the Linux Foundation's OpenSSF as the body that manages the project; this is hosting, not maintenance, and is recorded only here.
  Wiring: the README says "when an application needs to access an S3 bucket, it asks OpenBao for credentials", and the HTTP API is the route apps use. This is the basis of the accepted status.
  Storage: the README names disk and PostgreSQL. The configuration page names the Raft storage backend; not recorded as databases.
  Start-up: the server command page says OpenBao starts "sealed" by default and must be initialized and unsealed before it responds to requests. The configuration page names the Raft storage backend, which is not recorded as databases.
  Install routes: the install page lists package managers, container registries (ghcr.io/openbao/openbao, quay.io/openbao/openbao, docker.io/openbao/openbao), precompiled binaries, source and Helm. Each route with its own quote is recorded above. The docs label the version line as 2.7.x; not recorded as a field.
  Adoption: the Docker Hub pull count is for docker.io/openbao/openbao, the image the install page names first. GitHub stars and contributors are from the API. Community: GitHub Discussions is recorded as forum; the README also links a mailing list and a Zulip chat, which have no field. The homepage also links LinkedIn, which has no field.
