notes: >
  Two license statements: the GitHub API reports GPL-2.0, and the README says "GNU General Public License Version 2.0 (or later)"; COPYRIGHT.txt states "either version 2 of the License, or (at your option) any later version", so the API value is recorded as stated and the README value as its own entry. The repository has no LICENSE file at the default branch, so the license facts cite the README and COPYRIGHT.txt. The docs index says "Status: The docs need updating"; that is a note about the docs, not a sign the project has ended. The installation pages under docs.htmly.com returned 404; the install method is recorded from the README steps only. The repository was last pushed on 2026-01-25 and is not archived. The README links to themes and a demo; no plugin directory is recorded. The userRoles value names only the admin role, as the README quote does. The composer.json platform setting is PHP 7.2.
