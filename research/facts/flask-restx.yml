notes: >
  Scope widened from boundary on 2026-10-19: a library on top of Flask, recorded with basedOn flask. The GitHub API reports the license as NOASSERTION because the LICENSE file carries three copyright lines; the PyPI metadata and the LICENSE both say BSD-3-Clause, and both statements are recorded. The homepage is the Read the Docs site the project names as its documentation, so the homepage and docs values are the same URL. The release 1.3.2 declares python_requires >=3.9 in setup.py at its tag, while the README and the installation page on master say Python 3.10+ and the CHANGELOG drops 3.9 in an unreleased 1.3.3 section; runtimeMin records both statements: the README and the installation page (3.10) and the released 1.3.2 metadata (3.9). The Read the Docs page for latest reads "Flask-RESTX 1.1.1.dev" in its title, a build label, not a release. The README links a Gitter chat, which is not a recorded field. The project states the fork reason on its documentation index ("The community has decided to fork the project due to lack of response from the original author"), which is the reason recorded in forkOf.
  The documentation index says the fork was made because the original author did not respond and that only the original author had PyPI rights, so no release could be made.
  The installation docs say Python 3.10 or later, while the 1.3.2 release metadata requires 3.9 or later.
