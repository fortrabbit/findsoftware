notes: >
  Stable releases on GitHub run from v4.0.0-alpha1 tags to v12.2 (published 2026-07-16); v12.2 is the highest stable release and the Piranha NuGet package reports version 12.0.0 for the templates package, so currentMajor 12 follows the release object. The docs site at piranhacms.org/docs/master shows a version selector whose newest entry is Piranha 11.x; the master pages read describe the same API and are cited as the project's docs. firstRelease is the year of the oldest tag shown (v4.0.0-alpha1, 2017-04-19); the GitHub release objects begin with v8.1 in 2020, and no earlier release object was checked beyond the tags. The homepage's Twitter link is a bit.ly redirect to twitter.com/piranhacms and is recorded as x; the LinkedIn and Gitter links go to a company page and a chat room and have no field. Database support is stated as packages for SQL Server, SQLite and MySQL on the architecture pages, and the packages page also lists Piranha.Data.EF.PostgreSql, so postgres is recorded from that page. The MIT license is also the LICENSE copyright line ".NET Foundation and Contributors", recorded as the maintainer as the project states it. The NuGet figure is the core package's total downloads at the time of the query. The README documents "dotnet run" for the example app, which is local development and not a deployment statement, so runsAs is not recorded.
