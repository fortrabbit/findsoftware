notes: >
  Maintainer: the LICENSE.md copyright line names Kevin Brown, Igor Vaynberg and Select2 contributors; the homepage and the docs name no other maintainer and no legal entity or country, so hqCountry stays unknown. Repository default branch is develop; the latest stable release 4.1.0 is dated 2026-05-26; the 4.1.0 beta and release candidates (2020 to 2021) are older prereleases. firstRelease 2012 is the tag 1.0.0 committed on 2012-03-04, the day the repository was created. Registry: the npm package select2 is the one the install page names (yarn install select2) and has no deprecation flag; npm weekly figure is the sum of the 2026-11-01 to 2026-11-07 range. The install page also names Bower, a separate registry without a download figure recorded here, and the Webpack Encore route (yarn) that resolves to the same npm package. The homepage footer and the docs pages name no company. Browser support lines (IE 8+ and others) are compatibility statements and are not recorded. The repository lists integrations (Django, Drupal, Rails, Yii 2 and others) that are third-party plugins; no plugin directory is named by the project, so pluginDirectory stays unknown. The docs say Select2 is "designed to be a replacement for the standard select box that is displayed by the browser" and initialize "before the browser initializes the Select2 control", but no page states the runtime as a browser runtime in a clear sentence, so runsAs stays unknown. Latest GitHub release 4.1.0 is the highest stable tag; the jsDelivr and cdnjs CDN routes are the project's own statement on the installation page. The forum link on the homepage and the getting-help page are recorded as forum.
