notes: >
  The project's site kulfon.org, linked from the README and set as the GitHub homepage, answers HTTP 500 on every request (rechecked 2026-10-22, also www.kulfon.org and /docs/install/), so the record is a stub without homepage or docs. kulfon.net, linked from the README demo, now serves an unrelated site. The repository is not archived and no end statement exists. The README and the source tree (cli/deploy.js, cli/server.js) carry the install and command facts instead. The repository moved from github.com/zaiste/kulfon to github.com/kulfonjs/kulfon; the npm package names zaiste/kulfon as its repository, and GitHub redirects that name, so the current repository is recorded. The README says the software is "still under active development and not feature complete or ready for consumption by anyone other than software developers". The GitHub API reports the license as NOASSERTION; the LICENSE file is Apache 2.0 and npm lists Apache-2.0. The project has no GitHub releases; the npm dist-tags give latest 0.42.0 (npm time 2020-07-16). The source file headers read "Copyright 2016 Zaiste & contributors", and the maintainer is recorded as the package author Zaiste. The cli/deploy.js command copies the public directory to a server and path set in config.yml with rsync over SSH; this is recorded here because no deployment page could be read, and no field fits it yet. The README says the project is "similar to Hugo", a comparison, so no alternativeTo fact is recorded. The README lists three websites that use Kulfon; the list is not a count and is not recorded.
