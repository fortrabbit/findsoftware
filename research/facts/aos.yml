notes: >
  Criterion 4 doubt: the newest stable release is npm 2.3.4 of 2018-10-03, the repository has no GitHub release objects, and its default branch next has its last commit on 2018-10-03. The import moves a record with no release or pre-release in four years to stub; status stays accepted here per the candidates CSV, and the reviewer should confirm the import result. The notes file for dev-libs listed AOS among the criterion-4 rejections of 2026-10-19, while the CSV row now reads accepted. The README says it documents aos@next, the 3.0 beta line, and that the last stable release is v2; the install commands name aos@next, so the npm weekly figure counts package aos across all dist-tags. The npm dist-tag next is 3.0.0-beta.6, published 2018-10-03 after 2.3.4 the same day, recorded as latestPrereleaseDate by timestamp. The first release year comes from the 0.1.0 tag, whose commit is dated 2015-07-10. The repository's pushed_at (2024-03-26) is later than its default branch, so it is not used as a release signal. The Gitter badge is a chat link and is not recorded. The x value comes from the README Twitter Follow badge, quoted as its markup. The homepage is a GitHub Pages site the repository names; it is a demo page and does not state the install routes. No page states that the library runs in the browser in those words, so runsAs is left out. The repository owner is a user account.
