notes: >
  The README's Status section says "This project is no longer maintained." and names the maintainer's new tool, Webstudio, as the work that follows; the end statement comes first, so the record is discontinued. The repository is not archived (last push 2024-08-13) and the npm latest tag is not deprecated, so the status rests on the README statement alone. The homepage cssinjs.org answers 200 but curl returns only navigation and a version placeholder, with no introduction text, so the homepage row comes from the repository's homepage field and the docs link from the README; the setup and environment pages were read in the docs folder of the repository. The GitHub release v10.10.1 (2024-05-14) is newer than the npm latest tag 10.10.0 (2023-02-09), and 10.10.1 is not on npm; latestReleaseDate is the GitHub date. The npm package "jss" has versions from 2011 (0.1.0), before this repository was created (2014-10-12), so that history belongs to another project; firstRelease is the year of the oldest tag in this repository, 0.2.1, whose commit is dated 2014-10-29. The LICENSE copyright names Oleg Isonen (Slobodskoi); npm lists two maintainers, trysound and kof. The installation docs give yarn and the unpkg CDN; no npm command is named. The introduction says JSS can compile in the browser, server-side or at build time in Node; browser and local are recorded as runsAs, since the page names compiling in the browser and at build time in Node. The discord link is the one in the README.
