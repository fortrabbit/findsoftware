notes: >
  The CSV homepage is the plain http address; the site also answers over https with the same content, so the https address is recorded. There are no GitHub releases: the repository has 44 tags (v2.4.0 is the newest) and the release source is crates.io, so currentMajor, latestReleaseDate and firstRelease come from the crate. The crate's first upload is 0.1.0 on 2016-04-04, older than the oldest tag (v0.2.0, 2016-09-27). The README says Tera is inspired by Jinja2 and the Django template language and that it intentionally deviates from both: inspired by is not a based-on statement, so basedOn stays empty. The getting-started page and the GitHub description say the syntax is based on Jinja2 and Django templates, which names the syntax, not software Tera extends, and the README says only the overall look and feel is similar. The README names a v1 migration guide for existing users (MIGRATION.md), which is a version upgrade inside the project and not an importsFrom statement. The optional tera-contrib crate holds filters and functions that need third-party dependencies; it is part of the same repository and is not a separate record. The crate manifest sets edition 2024 and no rust-version, so no runtimeMin is recorded. The LICENSE copyright line names Vincent Prouillet, and the repository owner is the user Keats. The GitHub contributors count covers the repository.
