notes: >
  The record is the konvajs/konva repository, whose package is konva; the React, Vue, Svelte and Angular integrations (react-konva, vue-konva, svelte-konva, ng2-konva) are separate packages the README lists, and they are not recorded as records. The README says the repository began as a GitHub fork of ericdrowell/KineticJS, and the LICENSE credits KineticJS for the original work; KineticJS is not a record, so no forkOf is recorded. The GitHub API reports no license for the repository (NOASSERTION), so the MIT license comes from the LICENSE file and the README sentence. The README says Konva works in modern mobile and desktop browsers that support ES2018, and that running it in Node.js needs the canvas or skia-canvas package; the record names Node.js as runtime and no runsAs, following the rule for a library that names both. The homepage and README say the library is maintained by the team behind Polotno, a commercial design editor SDK built on Konva that sponsors development; Polotno is not recorded as a parent or an alternative. The README links Stack Overflow and Open Collective as support and sponsorship channels; neither is a forum or a newsletter field. The homepage's Twitter link points to a personal account of the maintainer, recorded as the x value because the project's own homepage lists it under Community. The homepage says the library is maintained since 2015, which matches firstRelease from the npm upload of 5.2.0 on 2015-01-27 and the 0.7.0 tag of the same date. The GitHub stargazer and contributor counts belong to the konvajs/konva repository.
