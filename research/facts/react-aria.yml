notes: >
  React Aria is one of several libraries in the adobe/react-spectrum monorepo, with React Spectrum and React Stately beside it; this record takes only the react-aria-components package, which the install page names, and its own docs. The npm package named react-aria-components has versions from 2018 that belong to another project (juanca/react-aria-components, 0.0.x); the Adobe history starts with 1.0.0-alpha.1 on 2023-04-05, which sets firstRelease. The npm latest is 1.22.1 (2026-10-09); the GitHub release for 1.22.0 is dated the same day, so latestReleaseDate is the same date either way. The ecosyste.ms counts are as the service reports them today; the dependent package count of 1 is recorded as stated. The homepage at react-spectrum.adobe.com also serves React Aria content at its react-aria path. The footer copyright names Adobe without a legal form, so the maintainer is recorded as the page states it. Contributors counts contributor accounts for the whole monorepo, since the repository is the one the project names.
