notes: >
  Status accepted; no end signal. The repository is not archived, and the readme names the 1.x line as the latest with a 0.x line in long-term support. The 0.x line lives in the repository sinclair-typebox and the npm package @sinclair/typebox (latest 0.34.52, 162534392 downloads for 2026-11-01 to 2026-11-07, not recorded as the figure because the install docs name typebox); the 0.x line is compatible with ESM and CJS, and the 1.x line is ESM only, as the readme's versions table states. The GitHub license API reports no license (NOASSERTION); the LICENSE file and the npm package both say MIT, so the license entry cites the file. Maintainer follows the LICENSE copyright line. No GitHub release object exists; the newest tag 1.4.7 is on npm, and currentMajor and latestReleaseDate come from the registry. firstRelease 2021 is the oldest tag in this repository (0.17.7); the repository itself dates from 2017. The engines field of package.json names a Node.js minimum, but no sentence on the readme or docs names Node.js as the runtime, so runtime and runtimeMin stay out. The readme's Compile and Validate tables and the JSON Schema compliance matrix are benchmarks and support lists and are not recorded. The docs site is a JavaScript shell that returns no text; its pages are read from the docs directory of the repository, and the readme links the site as the documentation. The i18n fact comes from the System.Locale docs page in that directory. The readme's Versions table is the only source for the ESM statement; it is a coined kind and stays here.
