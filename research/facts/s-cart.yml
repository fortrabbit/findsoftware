notes: >
  The CSV homepage s-cart.org redirects to gp247.net, which is the site that now hosts the S-Cart documentation, so the homepage is gp247.net. The Packagist package s-cart/s-cart is abandoned with replacement gp247/s-cart, and GitHub s-cart/s-cart was not found; the repository gp247net/s-cart is not archived and its overview page names the composer package gp247/s-cart, so the project continues under a new home and the status stays accepted (AGENTS.md, "a move, not an end"). The old Packagist package s-cart/s-cart shows 5856 total downloads and is not used for the figures above. The Packagist figure is for gp247/s-cart as the install docs name it: 189 total, 7 monthly at the time of reading. The GitHub contributors count is 2 with the rel="last" page of per_page=1. The overview page's tech stack line states PHP 8.3 or newer, Laravel 13, GP247, Tailwind CSS 4 and MySQL or MariaDB; only the parts quoted above are recorded. The GP247 site links a Facebook page and GitHub organizations gp247-plugin and gp247net; no field takes Facebook, so it is not recorded. The maintainer is GP247 as the LICENSE copyright line states it; no legal entity name was found on gp247.net. The docs mention a secured API for mobile apps without naming REST or GraphQL, so headlessApi is unknown. The project is "GP247/core + GP247/front + GP247/shop" (github.com/gp247net/core README); gp247/core is the shared core of the GP247 ecosystem and "can operate independently as a Laravel admin", and gp247/front provides the basic features for a business CMS. The Pro plugins and templates are one-time purchases: gp247.net/en/pricing states "No subscription is needed to run S-Cart", so no paidEdition is recorded. The Pro plugins cover multi-vendor marketplaces, multiple stores, and purchases, returns and cash flow. The runsAs fact reads the shared-host setup without cron, where the docs say mail sends directly with "no cron or worker needed"; a queue worker or one schedule:run cron is optional.
