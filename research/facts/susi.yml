notes: >
  No project site exists: the GitHub homepage field is empty and the npm homepage points to the README, so no homepage is recorded. The canonical repository is AVGP/susi (GitHub reports it is not a fork); maks/susi is a fork with one star and a 2017 push, and the package.json on AVGP/susi names it as homepage. The npm dist-tag latest is 0.1.4 (published 2018-05-24) while the highest GitHub release is 0.2.3 (2015-06-30); latestReleaseDate takes the newer publication date, and both fall before the four-year line. The repository was last pushed 2018-05-24, carries no archive flag, and no page states that the project has ended. The README names no Node.js requirement, so runtime is unknown. The README's usage form takes an input directory, an output directory and a layouts directory as arguments, with no default output path, so outputDir and buildCommand are unknown. The README describes Markdown files that open with a JSON frontmatter block, which the layout reads through Mustache placeholders; the layout is named by the frontmatter or defaults to page. The README also describes Apache SSI-style include comments in layout files for shared partials.
