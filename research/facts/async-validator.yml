notes: >
  The project has no homepage: the GitHub homepage field is empty and the README links only its own repository, so no homepage fact is written. The README's only docs are the README itself and the usage section, so docs is absent. The newest stable version, 4.2.5, is the highest GitHub tag and the npm latest; its npm publish date, 2022-06-17, is the latest release, more than four years before 2026-11-04, so the import's four-year rule moves the record to stub unless a newer release appears. Status is copied from the candidates row. The last commit on the default branch is 2022-08-16 and the repository's pushed_at is 2024-02-20, both after the latest release, and neither changes the four-year rule. The README's Node badge reads node.js >=4.0.0; a badge is not a runtime statement, so runtime and runtimeMin are absent, and the reviewer decides whether the badge is enough. No page says whether the library runs in the browser, so runsAs is absent. The npm package has no engines field. Maintainers on npm are yiminghe and zombiej; the LICENSE copyright line names yiminghe, which is the recorded maintainer. The README says the library is a variation of freeformsystems/async-validate; that is a fork-like origin named in the README, not a forkOf statement. Ant Design-style consumers are not named by this project, so no basedOn or usage claim is recorded. The npm weekly figure is the sum of the seven daily values in the range endpoint, 2026-10-26 to 2026-11-01, which is above the candidates row's 1.1M figure.
