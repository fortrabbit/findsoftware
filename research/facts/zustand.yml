notes: >
  The repository pmndrs/zustand belongs to the Poimandres organization (GitHub display name Poimandres); the LICENSE copyright line names Paul Henschel, so that is the maintainer. The project's own docs site is zustand.docs.pmnd.rs and is recorded as homepage; the live demo at zustand-demo.pmnd.rs is a separate page that holds no project text, so it is not recorded. The docs homepage tagline "Bear necessities for React state" states the React binding, and the README's "Using zustand without React" section says the core imports and runs without React. The docs homepage also lists React Native and non-React environments, and the README names redux middleware, immer and persist middleware; these are recorded only as notes, since they are features of the same package. The README links a comparison page, whose opening sentence names Redux, Valtio, Jotai and Recoil as the libraries Zustand is compared with; each has a fact file, so all four are alternativeTo values. The third-party libraries page lists community packages such as zustand-utils and zustand-ards; it is the plugin directory, and no count is recorded. The npm downloads range covers 2026-11-01 to 2026-11-07 and is the sum the registry reports for the zustand package; the package's npm engines field names node >=12.20.0, but a library used in browser apps gets no runtime from an engines field, so no runtime is recorded. The first version 0.0.1 is in the npm registry on 2019-04-09, the year of firstRelease. The v5.0.0 release candidates date from 2024 and are older than the latest stable release, so no latestPrereleaseDate is recorded. Stars and contributors belong to the repository. The README's Discord badge links the Poimandres community server, which the project shares with other pmndrs libraries.
  The README shows a store created with create and read or written outside components through getState, setState and subscribe, and warns against that technique in React Server Components. It covers the persist, immer, devtools and Redux-style middleware, and says middleware that modifies set or get does not apply to getState and setState; the set function merges state unless its replace flag is true, and a component that reads the whole store with no selector re-renders on every change.
