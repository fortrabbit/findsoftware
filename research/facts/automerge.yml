notes: >
  Monorepo: the repository holds the Rust core (rust/automerge), the JavaScript package (javascript/), language bindings for Swift, Python, Java, C and others, and automerge-repo. Stars and contributors belong to the whole monorepo; the npm figure and the release line are those of @automerge/automerge, whose tags start js/automerge-. The Rust crate on crates.io is not recorded. The npm package named automerge (0.2.24 in 2017) is deprecated with the message "Please see @automerge/automerge instead." and is not the record's package. The first GitHub tag is v0.0.1 from 2019-12-28; the repository was created 2019-12-26. The JavaScript README says the package wraps a core written in Rust and compiled to WebAssembly. The JavaScript README says browsers need a bundler to import the package, because WebAssembly modules do not take part in ESM imports there. The docs describe the JavaScript implementation as compatible with Node.js, Electron and modern browsers, and the Rust core as compiled to WebAssembly for browsers; no single runtime or runsAs value is recorded for that reason. The homepage names Ink & Switch as the research lab that funds full-time engineers, and the LICENSE copyright names the Automerge contributors, which is the maintainer recorded. The sync-engine category maps to backend in the import, which a reviewer may want to change.
