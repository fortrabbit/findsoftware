notes: >
  The project is in maintenance mode: the README and the documentation index both say "The project is in maintenance mode (only bugfixes and updates for new languages apis)". The sentence keeps bugfixes and language API updates going, so it is not an end or unmaintained statement; status stays accepted and a reviewer decides. The GitHub homepage field http://projects.unbit.it/uwsgi answers only over plain http, with a 302 to the documentation site, so it is not linked; the documentation site is recorded as homepage. The GitHub license field is NOASSERTION; the LICENSE file is GNU GPL version 2 ("Version 2, June 1991") preceded by a linking exception, and that is the one license entry. setup.py words it as license='GPLv2+', which goes to notes only. No GitHub releases exist. The newest stable tag is 2.0.31, read from its commit date (the docs changelog says "Released 20251011"). The oldest tag is 0.9.5beta1 (commit 2010-03-12); the README says "since 2009" about users and contributors, which is not a first-release statement, so firstRelease comes from the tag. The legal entity behind "Unbit" is not named on any page read: unbit.it answers 301 to github.com/unbit, so no maintainerType or hqCountry is recorded. The RubyGems gem uwsgi has latest version 2.0.19 (2020-06-14), older than the 2.0.31 tag; the install page names "gem install uwsgi" as the latest stable release, which the gem registry does not show. The RubyGems figure is the gem total; the PyPI figure is last month. The CSV note "date from git tag" is superseded by the commit date. Fields coined here: none.
  The documentation says the project does not expect quick answers on GitHub issues and pull requests, and that a master process respawns worker processes when they die.
