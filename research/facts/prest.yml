notes: >
  Boundary row: the GitHub repository is archived (archived: true, pushed 2025-06-29), and the owner's other repositories show no successor to prest, so the archive is read as the end signal and the status is discontinued. The reviewer should decide this one: the homepage could not be read, so any statement the blog makes about the archive is unchecked, and a move announced there would reverse the status. The README calls the framework alpha and expects breaking changes, and has no end statement of its own. The README links the blog prest.blog (also the GitHub repository homepage field), which returns a bot challenge to the fetch, so no homepage is recorded. The latest GitHub release is 0.5.1 (2024-12-29), the same as the newest crate version, so currentMajor is 0. The crate's oldest upload is 0.0.1 (2023-09-18). The crateDownloads figure is the last-90-days count from crates.io. No minimum Rust version is stated in the README or the crate metadata, so runtimeMin is absent. The README's deployment section describes a one-click deploy to Linux servers over ssh and sftp, with Docker for cross-compilation; the runsAs fact cites the README's run().await server. The built-in database is an embedded store based on GlueSQL and sled; the README lists tutorial examples that use PostgreSQL, SQLite, MongoDB and Redis through other crates, which do not state that prest supports them, so databases is not recorded.
