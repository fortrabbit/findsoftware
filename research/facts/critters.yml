notes: >
  Discontinued on three signals: the GitHub repository is archived (api), the README opens with a notice that ownership moved to the Nuxt team and that the repo "is now archived and won't receive any future updates", and npm deprecates 0.0.25 with a message pointing to the fork at github.com/danielroe/beasties. Beasties is the named successor and is its own record; it is not recorded here as a successorOf. The homepage in the repository field, npm.im/critters-webpack-plugin, is an npm shortlink to the webpack plugin, not the project's site, so no homepage is recorded. The repository holds a second npm package, critters-webpack-plugin, in packages/critters-webpack-plugin; it is not recorded as its own record. The npm 0.0.25 publish date (2024-10-10) is the latest stable registry release; the highest stable GitHub release is critters-0.0.16 (2022-01-05), major 0 on both. The npm package has no engines field and the README names no Node version, so runtime and runtimeMin are unknown. The maintainer is the npm package author, "The Chromium Authors"; the LICENSE file is the Apache text without a copyright line; npm maintainers are alan.agius4, developit and janicklas-ralph. The weekly npm figure is the sum of the 2026-09-28 to 2026-10-04 window. Contributors count is the last page of the contributors endpoint with per_page=1, without anon. The CSV note of 746.6k weekly downloads predates this window.
