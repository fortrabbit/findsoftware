notes: >
  The www.diceui.com homepage answers with Cloudflare error 526 (invalid SSL certificate), and www.sadmn.com, the maintainer's site, does the same; the apex diceui.com answers 200 with the project's own page, so it is the homepage. The install command is a shadcn registry item, shown as npx shadcn@latest add "@diceui/action-bar" in the component page source, rather than an npm install of one package. The repository is a monorepo of per-component packages (@diceui/combobox, @diceui/mention and others) with one GitHub release per package tag, and the install docs name no single package, so currentMajor and latestReleaseDate are not recorded; a reviewer should decide whether the newest package release (@diceui/mention 1.0.0, 2026-08-28) stands for the project. No npm figure is recorded for the same reason. The homepage links the maintainer's X account from the "Built by" line, recorded as x. The introduction page credits Base UI as the default component primitives and Radix UI as the alternative primitives; they are not recorded as basedOn. firstRelease is 2024, the year of the oldest package release (December 2024). Contributors counts contributor accounts from the API list with per_page=1, read from the Link header.
