notes: >
  The README says "This repository is planned to move to spawnia/lighthouse", linking a discussion titled "Planned repository transfer: nuwave/lighthouse → spawnia/lighthouse"; at research time spawnia/lighthouse returned 404 and the repository is still nuwave/lighthouse, with the latest release 6.74.0 on 2026-10-25, so a planned transfer is no end signal and the status stays accepted. Recheck the repository field when the transfer happens. The name collides with the record id lighthouse, the Google Lighthouse audit tool in build-dev, so the id keeps the suffix. The homepage says the software builds "on top of an existing Laravel application", which is the basis for basedOn; the composer.json requires laravel/framework and illuminate packages, and the docs install page names a Lumen setup too, which is noted here only. The docs are a client-rendered site; the Markdown source lives in the repository at docs/master, and the installation page there gives the composer route. The composer.json at 6.74.0 states "php": "^8" with no minimum minor, so runtimeMin is written as 8.0; the docs state no PHP version. The migration page names Folkloreatelier/laravel-graphql and rebing/laravel-graphql as libraries users come from, and no record here covers them, so alternativeTo is left out. Subscriptions over WebSocket, federation, file uploads and the Eloquent integration are feature pages of the same framework and go to notes only. The GraphiQL interface the install page recommends comes from a third-party package, so adminUi is left out. Only the current major version receives features, per the README's versioning section. The Packagist figure is the all-time total for nuwave/lighthouse, the package the install docs name. firstRelease is 2016 from v0.1.0 on Packagist, dated 2016-05-29, the same day the repository was created.
