notes: >
  The getting-started page lists Hugo (extended version), Git and Go as the software to install before starting, and no minimum Hugo version is stated, so runtimeMin is not recorded. The getting-started page offers two ways to add the theme, a Hugo module (recommended) and a Git submodule, and links a starter template. The starter template deploys the built site to GitHub Pages with a GitHub Actions workflow; that is the hosting the project names, and it is not recorded as a field. The deploy page lists GitHub Pages, Cloudflare Pages, Netlify and Vercel and says Hugo generates static websites. The docs describe the theme as built with Tailwind CSS, which no field records. The docs site was read through its pages at imfing.github.io/hextra. The first GitHub release object is dated 2023-08-23, and the highest stable release is v0.13.0, so the major is 0.
