notes: >
  Status accepted. Criterion 1: an animation library a page's script imports to animate its elements, not an application. Criterion 2: published on npm as @mojs/core, which the README install section names; the older unscoped npm package mo-js is no longer the install route (its last version is 0.288.2, and it shows separate download figures), so it is not the registry figure. Criterion 3: the README install section and the getting-started page give the npm and CDN routes. Criterion 4: the repository is not archived, its main branch has commits into 2026, the latest GitHub release v1.7.1 and npm @mojs/core 1.7.1 are both dated 2023-10-06; a release from three years ago is not an end signal. The README calls it a "javascript motion graphics library" and says the library is maintained by Xavier Foucrier and Jonas Sandstedt; the LICENSE copyright line names Oleg Solomka, Xavier Foucrier and Jonas Sandstedt, and the maintainer field follows it. The homepage footer says "Copyright 2016-present @legomushroom". The getting-started page states the library is "a client-side library, and is not meant to be run on a server", which is the runsAs browser statement; it names no Node.js runtime, so no runtime is recorded. The README says the library provides built-in components (html, shape, swirl, burst and stagger) and a declarative API, and links a Slack workspace, which has no field. The README's browser support list is a compatibility list and is not recorded. The Server Side Rendering section of the getting-started page says the code must run on the client, which repeats the same statement. The npm weekly figure is the sum of the daily downloads for 2026-11-01 to 2026-11-07. The firstRelease year is the oldest tag, 0.110.0, committed 2015-04-01, which matches the first upload of the older mo-js npm package. The GitHub contributors count is the page number of the last contributors page. The README says the mo.js ecosystem also includes @mojs/player, @mojs/curve-editor and @mojs/timeline-editor; these are separate repositories and are not recorded.
