notes: >
  The package is @nuxtjs/i18n and the repository is nuxt-modules/i18n; the npm weekly figure is that package for the period, and the ecosyste.ms counts are for the same package. The LICENSE copyright line names Nuxt Community and four individuals, so the maintainer is the community name the first line gives, and the npm maintainers (three individuals) are not recorded as the maintainer. The docs say the module "configures Vue I18n" for the project; vue-i18n has no record, so it is not basedOn and the Vue I18n documentation is named in notes only. The homepage says the module is for Nuxt projects and powered by Vue I18n, and the basedOn quote is the homepage's own self-description as a module for Nuxt. The docs describe an edge channel that installs builds from the main branch of the repository, and a reader would want that before pinning a version. The getting-started page adds the module to the modules list in nuxt.config and sets its options under the i18n key.The README's community link goes to the Nuxt community Discord, which is not this project's own forum, so no discord is recorded. The README's documentation list points to the 9.x, 8.x and 7.x docs sites, with 7.x marked as Nuxt 2 and EOL; that is a statement about an old major, not an end of the project. The homepage lists these features, recorded here and not as fields: route localization for static and dynamic routes, lazy-loaded messages per language, SEO tags per locale, locale-aware redirects and per-locale domains. The highest stable release v10.6.0 (2026-07-30) matches npm latest, and the oldest tag v0.0.1 (2017-11-26) sets firstRelease. The runtime and runtimeMin come from the engines field of package.json at v10.6.0; the docs state no Node version. Stars and contributors belong to the repository.
