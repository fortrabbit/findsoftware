notes: >
  Criterion 1 is the doubt: SlickStack is a provisioning script with no UI, not a control panel. Its pages say it sets up a server for one WordPress site (homepage: "a modern LEMP-based server script designed for running a single WordPress site"; README: "it will not include a built-in UI"), so it is in, as web-server. The CSV categories "wordpress" and "cli" have no categoryMap value. The CSV row gives the last commit as 2026-08-25; the GitHub API reports 2026-10-22 on master, and the API value is recorded. No tags or GitHub releases exist. The README module table's "JUL2026D" is a date-style version with no major, so currentMajor is absent. The repository was created 2017-09-21; no project page gives a first-release year. The disclosure, privacy and about pages name no legal form or address, and the GitHub profile's "Las Vegas, NV" is not a country on a project page, so hqCountry is absent. The lead developer named on the site is Jesse Nickles; the maintainer recorded is the company the disclosure page names. The paid setup service and the LittleBizzy managed hosting are not paid editions or hosted forms of the software. Shell has no language mapping in the import, and no runtime is stated. The README says the design is one primary domain per server with no multi-tenancy, and that Ubuntu is the supported system. The slickstack.io/alternative pages for the compared tools were not read; the homepage compare list is the source for alternativeTo. The homepage's compare list also names WordOps, Webinoly, Roots Trellis, WP In A Box, OneInStack, Cloudways, Cloudron, Moss.sh and Demyx; no fact file exists for them, so they are not recorded as alternativeTo. HTTP Archive lists "SlickStack" (category "Development, Hosting panels") with 21 mobile origins; the desktop figure is not recorded.
