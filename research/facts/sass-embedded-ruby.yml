notes: >
  No homepage: the gemspec homepage and the RubyGems homepage_uri are the GitHub repository, and the RubyGems page is a registry page, not the project's own site. The repository holds tags (v1.106.1 and earlier) but no GitHub releases, so currentMajor and latestReleaseDate come from the RubyGems registry, the stable version when there are no releases. The gem's first upload is 0.1.0 from 2021-05-24 (versions API); the repository was created the same day. The maintainer is the name the gemspec author and LICENSE copyright line give, "なつき", with no legal form. The README closes with "Disclaimer: this is not an official Google product." The Sass install page (sass-lang.com/install) lists a Ruby wrapper among "community-maintained wrappers"; it names no package, so the link to this gem is not stated by that page. The README says the gem uses a native Dart Sass executable on supported platforms and a Node.js Dart Sass executable elsewhere; both are runtime facts. The usage examples (Sass.compile, Sass.compile_string) are no runsAs statement, so runsAs stays unknown. The rubygemsDownloads figure is the total the RubyGems API reports for the gem.
