notes: >
  Desktop app for macOS (Intel and Apple Silicon, macOS 13 or newer), Windows (x64 or ARM64 per the README; 64-bit per the developer docs) and Linux (64-bit Debian based per the developer docs; x64 or ARM64 per the README), installed from the download page; the Windows install from the Microsoft Store is named in the docs. The project's own site is developer.wordpress.com/studio/; wordpress.studio answers 302 to it and is not recorded. The README's Studio Sync feature pushes to or pulls from WordPress.com or Pressable sites, and it can import any WordPress site to work on locally; the Studio CLI exposes features outside the app; Preview Sites are cloud-hosted and expire after seven days without updates. The company is named as Automattic Inc. in the wordpress.com footer; the country (US) appears only in the wordpress.com JSON-LD and no quote was checked, so hqCountry is not recorded. The GitHub license detection reads GPL-2.0; the README and LICENSE say GPLv2, and package.json says GPL-2.0-or-later, so the more specific package.json statement is the one license entry and the README wording is noted here. The repository's default branch is trunk. No paid tier was found and the README calls the app free. The app is not published to npm as a library, so no npm figure is recorded. The GitHub contributor count is the repository's figure.
