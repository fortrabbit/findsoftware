notes: >
  Status stays accepted: the repository is not archived, the latest stable release is v2.3.1 on the 2.x line, and the README calls main the v2.x branch. The 1.x line is maintained on its own branch (a v1.7.0 release in October 2026 sits on that line, so the record's major is 2). The repository is a monorepo (packages/cropperjs is the package the install docs name); stars and contributors belong to the monorepo. A 2.0.0 release candidate from 2024 is older than the latest release, so no latestPrereleaseDate. The guide calls 2.x web components, which is an architecture term, not a runtime; the guide's browser table is a support list, so no runsAs. The guide's comparison table names jQuery Cropper and the original cropper, which no record covers, so alternativeTo stays empty. The homepage links its own 1.x docs; no end statement appears. The guide's CDN section is a heading over a script tag loading the package from unpkg; no sentence names a CDN, so no CDN installMethod is recorded. The package has no runtime fact beyond the browser.
