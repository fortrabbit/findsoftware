notes: >
  The GitHub releases API lists 30 releases; the highest stable is v0.17.2 (2026-08-10), so currentMajor is 0 under the major-only rule. v0.13.0rc1 (2021-05-10) is the only prerelease and is older than the latest release, so no latestPrereleaseDate. The oldest release is v0.1.0 (2018-11-10); the repository was created in 2017, which is not a release date, so firstRelease is 2018. The homepage and the about page say the project was refactored out of the Write.as codebase in late 2018; that is a history statement, not a fork of another project, so forkOf is left out. The homepage also links github.com/writeas/writefreely; the API reads use github.com/writefreely/writefreely, the repository the site links last. The maintainer is Musing Studio LLC: the README copyright line names it and the hosting page calls Musing Studio the company behind WriteFreely; the AUTHORS file says WriteFreely is built by Matt Baer. The homepage says WriteFreely has powered more than 550,000 blogs on Write.as, the hosted service run on the software; that counts hosted blogs, not installs of the software, so it is not recorded; reportedInstalls is the homepage's separate statement about communities. The mastodon and forum facts come from links on the homepage. The docs page at writefreely.org/docs lists its guides, and only the start guide and the about page were read in full for the install and database statements; the developer and admin guides were read for their titles and links only. The about page calls its API robust and mature, and the developer documentation was not read far enough to name its style, so headlessApi is left out. The Write.as terms link returned 404 and no legal form for the operator was found. The homepage's Twitter link, https://twitter.com/writeas__, is the Write.as account and not a WriteFreely one, so no x value is recorded. The start page says "you can either run WriteFreely as a standalone server or put it behind a reverse proxy", and the reverse proxy option is recorded here, not in the record text.
