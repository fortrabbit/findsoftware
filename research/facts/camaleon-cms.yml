notes: >
  The README lists a Gitter chat and a theme store at camaleon.website/store/themes next to the plugin store; neither is a dictionary field. The README's install steps end with rails server for a local check and name no process model, so runsAs is not recorded. The license page gives the MIT License with the copyright line "Copyright (c) 2015 Camaleon CMS", and the README names Owen Peredo Diaz as the author; the README author line is recorded as maintainer. The current major is 2 from the v2.9.4 release (2026-08-25), and the README links the v1.x line for older installs. The README requires Rails 6.1 or later and ImageMagick, and the Rails requirement is not recorded as a field. The README's paid plugins and themes (Visual Editor, Spree integration, Admin AJAX, several themes) are add-ons to the free core, so no paidEdition is recorded. The rubygems download figure is the gem's total, and the candidate row's older figure of 442.7k is replaced by the current one. The first gem version is 0.0.1 (2015-08-19), matching the README's 2015 date. The plugin store and theme store are the project's own directories; third-party plugin repositories are not recorded.
