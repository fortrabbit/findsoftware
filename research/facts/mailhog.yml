notes: >
  Repository only: the README and the repository name no project site, and https://mailhog.github.io/ answers 404, so homepage is not recorded. The README names the project's docs as the docs folder and the configuration page (https://github.com/mailhog/MailHog/blob/master/README.md). Last release v1.0.1 on 2020-08-11; the repository was last pushed 2024-02-13 and carries no end statement. Per the import rule (no release in four years), the import will list this record as stub; the reviewer decides whether to curate it out. The README says "Inspired by MailCatcher" and "MailHog is a rewritten version of ian-kent/MailHog"; these are not alternativeTo or successorOf statements in the rules' sense and are left in notes; the ian-kent/MailHog repository is not a record. The copyright line reads "2014 - 2017, Ian Kent"; the repository owner is the mailhog organization, which is not named as a maintainer. Wiring: the README says "Configure your application to use MailHog for SMTP delivery" (https://github.com/mailhog/MailHog/blob/master/README.md), and the sendmail replacement mhsendmail is a separate repository. The HTTP API (APIv1 and APIv2) is named in the README but its style is a coined kind; it stays in notes. The Lightweight and portable line is a README claim and is not recorded as a field. Docker Hub pull count is the mailhog/mailhog repository's total.
