notes: >
  The repository is a monorepo, so the npm figures come from @firecms/core, the core package; the unscoped npm package "firecms" is an unrelated older package. The highest stable GitHub release is v3.2.0, the npm package is at a higher 3.x, the major is the same. The oldest stable GitHub release is v1.0.0; earlier tags are betas and release candidates. The root LICENSE says the repository is variously licensed under BSL 1.1, Apache 2.0 and MIT, with a license file in each package; the README says the core is MIT and the PRO packages are BSL. The README lists three editions: Community (self-hosted), PRO (self-hosted) and Cloud (fully managed, hosted). The hosted FireCMS Cloud is noted with no prices. PRO adds a schema editor UI, import and export, entity history, a user management UI and AI features; MongoDB support is listed for PRO only. The README says the project is "Built and maintained by Camberi, a product engineering studio in Madrid and Munich"; the privacy notice and the BSL license name FireCMS, S.L. The content lives in the connected Firestore project and not in the software, so contentStore is left out. The docs say FireCMS reads a schema defined as TypeScript objects and generates the CRUD interface, and that custom form fields and views can be built as React components. The docs describe a frontend-only app with no server component.
