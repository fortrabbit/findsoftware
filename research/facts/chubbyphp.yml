notes: |
  The repository has no homepage and the README names none, so no homepage fact is written. The GitHub API returns no release objects, so the current major and release date come from the stable Packagist version 6.1.2. Packagist's first version is dated 2019-04-25. The README's Server section lists long-running runtimes (ReactPHP, Roadrunner, Swoole, Workerman) next to Nginx; runsAs is left unknown because the README shows a usage example and lists both Nginx and long-running servers without stating which the framework needs. The README's Description says the framework is built on PSR-7, PSR-15 and PSR-17, with optional PSR-11 container and PSR-3 logger integration; the PSR standards are interfaces, not software, so no basedOn fact is written. The Suggest section names chubbyphp-framework-router-fastroute and chubbyphp-framework-router-symfony as routers, and several PSR-7 implementations (guzzlehttp/psr7, laminas-diactoros, nyholm/psr7, slim/psr7, sunrise/http-message) that can be installed alongside. The plain usage example passes ExceptionMiddleware and RouteMatcherMiddleware to Application with a CallbackRequestHandler route; the Usage section also shows an ApplicationBuilder facade that wires the same middleware pipe. The Server section marks the builtin server as development only. The Migration section links guides from 1.x to 2.x through 5.x to 6.x, and one from Slim to Chubbyphp. The Skeleton section names chubbyphp-framework-skeleton as a separate package; it is not the install target and is not recorded. The Packagist and downloads figures are for chubbyphp/chubbyphp-framework, the package the install command names.
