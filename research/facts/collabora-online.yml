notes: >
  Accepted. The repository CollaboraOnline/online holds the issue tracker, the Helm chart, the docker build and the release artifacts, but no application source: development is on Gerrit (gerrit.collaboraoffice.com), and the source is mirrored read-only at CollaboraOnline/online.mirror (C++ monorepo, the project's own README says so). The online repository listing (.git-hooks, .github, docker, kubernetes and markdown files) holds no application source, so sourcePublic is false for it. Stars and contributors count the online repository; the mirror has 32 stars and 179 contributors. Versions are calendar versions on the 26.04 line (CODE tag 26.04.5.2.1, Helm appVersion 26.04.5.2.1), so no currentMajor. latestReleaseDate is the Docker Hub tag date of 26.04.5.2.1 because the GitHub releases are Helm chart releases (chart 1.3.7 on 2026-10-23). The homepage says the product is "Based on LibreOffice" in the pricing page navigation and "Built around the Collabora Office core" on the CODE page; LibreOffice has no record, so basedOn is not set. The collabora/code image is the Development Edition (CODE), which the code page calls "a continuously updated, rolling release"; the paid Collabora Online line is the supported stable version. Pricing tiers are not recorded as prices. The Collabora Online Controller for large deployments and the desktop and mobile products are separate products and are not recorded. Forum from the README badge. The license statements come from the mirror README, which the project maintains; the homepage does not state a license.
