notes: >
  Hosted only; criterion 2 is waived for hosted-service. The GitHub organization buttercms holds the JavaScript SDK (buttercms-js, npm buttercms, 3k a week, 164 stars); SDK figures, license and stars go here, not in the record. The only address in the terms is the DMCA designated agent mailbox in San Francisco, which is no headquarters, so hqCountry is absent. Free plan with a usage cap, Basic, Advanced, Professional and Enterprise tiers are plan features with no prices recorded; the Enterprise tier offers custom contracts and SLAs. Single sign-on is an Enterprise add-on on the pricing page; the write API and webhooks are add-ons on the paid tiers. Hosting runs on Heroku and AWS with a Fastly CDN, per the security page; data centers are not named as a region. Other social links on the homepage: LinkedIn, which is coined and not recorded as a field, and GitHub, the SDK organization. The WordPress import page is the migration overview card; the WordPress migration guide is a separate page. The /about/ page answers 404. The developer hub lists quickstart guides and starter projects. The docs site is Mintlify; the REST endpoints page gives the base URL under /v2.
