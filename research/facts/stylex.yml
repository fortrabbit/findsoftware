notes: >
  The repository is a monorepo: the readme badge and the installation guide both name @stylexjs/stylex, the runtime package, so its registry figures are recorded and the sibling packages (babel-plugin, eslint-plugin, cli, rollup-plugin) are not. The installation guide says "All uses of StyleX require the runtime package to be installed" and names the build-time compiler (Babel plugin, PostCSS plugin, CLI); none of these is a server process. The maintainer is recorded as the LICENSE copyright line names it, "Meta Platforms, Inc."; the Meta privacy and terms pages name no headquarters, so hqCountry is not recorded. The docs state StyleX is framework-agnostic ("a CSS-in-JS solution, not a CSS-in-React solution"), so basedOn is not recorded. firstRelease is 2022: the npm version 0.1.0-beta.1 and the tag v0.1.0-beta.1 both date from 2022-11-01, earlier than the repository creation date (2022-12-08); the GitHub releases list starts at 0.16.0 (2025-09-26), so the oldest release is a tag. currentMajor is 0 from release 0.19.1 (2026-09-15), the highest stable release. The npm figure counts downloads of @stylexjs/stylex; the install guide's npm create route scaffolds a project from a template and is recorded as its own installMethod entry. The stylexjs.com homepage was read; the x and Bluesky links are its footer links.
