notes: >
  The download page and homepage (openresty.org/en/) state OpenResty 1.31.8.1 as the current bundle, dated 26 October 2026, and latestReleaseDate follows that page. The GitHub repository has no release entry for any 1.31 tag: its highest stable GitHub release is v1.27.1.2 (2025-10-08). The oldest changelog on the site is for the 1.0.4 series (August 2011), which gives firstRelease. The tags v1.31.8.1 and v1.31.1.1 exist without release entries and are not recorded as releases. The major is 1 under either numbering. The repository's README names Yichun Zhang (agentzh) as the bundle maintainer and the copyright line names OpenResty Inc.; the maintainer fact records the company named on the homepage footer. The XRay product named on the homepage is a separate commercial product and is not recorded as an edition of OpenResty. The repository's GitHub license field reads NOASSERTION, so the BSD statement in the README is recorded as the license.
