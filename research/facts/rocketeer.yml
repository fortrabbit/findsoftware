notes: >
  The homepage in the CSV, rocketeer.autopergamene.eu, does not resolve (DNS failure on 2026-10-28) and is plain http, so it is not linked; the README's phar download and docs links point to it, so no homepage and no docs are recorded. The status rests on three signals: the README's end statement, the archived repository named in the README's badges and the Packagist package flagged abandoned on version 2.2.5; the CSV read them on 2026-10-19 and they were read again today. The Packagist package is anahkiasen/rocketeer, the name the README badges use; rocketeer/rocketeer returns no package. The maintainer is Maxime Fabre per the LICENSE copyright line of the 2.2.5 tag, and the GitHub user Anahkiasen is the author the README credits. The GitHub release list ends at 2.2.4 (2016-12-31); the 2.2.5 tag (commit 2017-01-06) is in the registry and is the latest release date recorded. The Packagist download figure is the registry's total, not a monthly one. The README names Deployer as the pivot it recommends and Capistrano in its "Why not Capistrano?" section; both are recorded as alternativeTo, and neither is a successor statement. The README's list of five plugins in separate repositories is not a directory and is not recorded. The composer install route is not stated on the README, so installMethod records only the binary download. runsAs is not recorded: the README's usage section shows commands and no page states where the tool runs. The Gitter chat link is not a field.
