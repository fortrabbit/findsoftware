notes: >
  The Hex package mdex is the install route the README and homepage name; the Hex download figure is the total over all versions (downloads.all), and the period is the whole life of the package. The GitHub release list has no prerelease, so latestPrereleaseDate stays out. The repository's first release is v0.1.0 of 2023-09-11, the same day the repository was created; firstRelease is that year. currentMajor is 0 because the stable line is 0.x; the minor line is not recorded. The README's Foundation section names comrak, ammonia and lumis as the libraries the project is built on; they are Rust crates the Elixir package depends on, so no basedOn. The README comparison table names Earmark, md, cmark and erlang-markdown, but no sentence there says alternative or switching, so no alternativeTo. The README lists seven plugins that link to separate hex.pm packages and no directory page, so no pluginDirectory. The mix.exs file requires Elixir 1.15 or later; no OTP minimum is stated on any page read, so no runtimeMin. The homepage and README name the Phoenix LiveView output (HEEx); the Lumis and Syntect highlighters are features, not fields. The docs address mdex.hexdocs.pm is where hexdocs.pm/mdex redirects. The README sponsor section names DockYard as a sponsor; not recorded. The LICENSE.md file is at the repository root under that name; the GitHub API reports the same MIT license.
