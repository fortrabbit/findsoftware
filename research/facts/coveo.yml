notes: >
  The homepage https://www.coveo.com redirects to https://www.coveo.com/en. The CSV repository coveo/ui-kit is an SDK and UI-kit repository, which hosted-service records do not take; its npm figure (@coveo/headless) and last release are not used, and the GitHub organization is not recorded as a repository owner. The developer page states that the index takes content from 100+ sources through pre-built connectors, names a GitHub repository for connectors, code samples and tools, and the docs name the Atomic and Headless libraries, so the libraries are part of the platform's open source surface without a repository field. The legal name is "Coveo Solutions Inc" in the website terms and "Coveo Solutions, Inc." in the privacy notice, which also gives the Montreal address. The footer copyright reads "Coveo Solutions Inc." and is the maintainer wording recorded. The pricing page lists plans with entitlement-based pricing for Service and Websites and seat-based plans for Workplace, which are hosted plan tiers and no paidEdition. The pricing page says "Start a free trial" and lists plans with a 100k queries unit; no free tier is recorded. The developer page says the platform is "a composable, headless API suite" and names REST nowhere on the pages read, so headlessApi stays out. The admin and the Atomic install pages were read only at the docs index and at the navigation, so adminUi and installMethod stay out. The security page says the customer chooses the region in which content is replicated and hosted. Founding year and the Gartner Magic Quadrant statement are not recorded. The homepage links also name ca.linkedin.com/company/coveo and YouTube; LinkedIn and YouTube have no field. The developer page names a Slack developer community, which has no field.
