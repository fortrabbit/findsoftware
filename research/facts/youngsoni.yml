notes: >
  The project has no npm package (registry 404), so no registry figures are recorded; the install path is a git clone. The repository has no project website; homepage is not recorded. The LICENSE file is the AGPL-3.0 text and the README says "AGPL License", while package.json declares AGPL-3.0-or-later: both statements are recorded and a reviewer should decide which one the record shows. The package.json author field is the only maintainer statement; LICENSE has no copyright line, so no legal form is available. The release 1.0.0 (2023-01-07) is the only GitHub release and the repository's last push is 2023-04-28. The README describes the donation addresses for cryptocurrencies, which are not recorded. The README lists RSS feed generation among its features, which has no field. The README says configuration files use the Hjson format.
