notes: >
  Self-hosted and free under Apache-2.0; Coolify Cloud is the hosted offering of the same product, and its pricing is on the pricing page (no prices recorded). The docs describe a control plane that connects to each server over SSH and runs resources as standard Docker containers. The pricing page says "Full access to all features" for the self-hosted version, so no paidEdition is recorded. The runsAs always-on value rests on the installation page sentence that self-hosting means running the Coolify instance on infrastructure the user controls. The legal name coolLabs Solutions Kft. appears in the terms and in the footer of each page. No address is on the pages read; the HU value rests on the governing-law clause and the Kft. legal form, so reviewer decision. The homepage footer links the maintainer's personal accounts (fosstodon.org/@andrasbacsai and x.com/heyandras), which are not recorded. The homepage claims 20k+ community members, a community count and not an install count. The README calls Coolify an alternative to Heroku, Netlify and Vercel. The coolify.io compare page names Dokploy, CapRover, Dokku and Kamal; alternativeTo lists the three that have records, and Dokploy has none. The firstRelease year comes from the oldest GitHub release, v1.0.0 (2021-03-24). Tags with beta in the name are marked non-prerelease by GitHub, so they are skipped for currentMajor and latestReleaseDate, which use v4.5.2 (2026-10-28); the newest beta tag is older than that release, so no latestPrereleaseDate is recorded. The repository has no npm or Packagist package, so no registry figures are recorded. The philosophy page criticizes "enterprise" features and artificial limitations; the project states its position there and no field records it. The PHP application inside the Coolify container is not a runtime the user's resources need, so no runtime is recorded.
