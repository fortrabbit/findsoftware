notes: >
  Status: the project calls itself "not production ready" on its libraries page (https://www.ripple-ts.com/docs/libraries, quote "Ripple is not production ready, and may have breaking changes at any moment"); no end signal, so accepted. The docs say the framework is built on TSRX ("built on TSRX (a superset of TypeScript)"); TSRX is a language and compiler, not a candidate row, so basedOn is not recorded. The homepage says Ripple "combines the best parts of React, Solid, and Svelte": a comparison, not a basedOn statement. The npm name "ripple" was used by an unrelated project from 2011 (versions 0.0.7 onward in the npm time list), so firstRelease is the first upload by this project, 0.2.0 on 2025-08-28 (repository then at trueadm/ripple). The npm figure is the core package ripple, the one the quick start names beside @ripple-ts/vite-plugin; the scaffolder create-ripple is not used. The weekly figure is the sum of the daily downloads for 2026-10-19 to 2026-10-25 from the npm range endpoint. The HTTP Archive entry named "Ripple" describes a different product (Single Digital Presence, Nuxt and Vue), so httpArchiveSites is not recorded. The GitHub API reports the repository language as JavaScript while the README says TypeScript-first; language follows the README, reviewer to confirm. runtime and runsAs are not recorded: the docs show render() on a server and a prerender step that writes HTML, but no page states a Node or Bun runtime or whether the live site needs a running process. The libraries page lists third-party component libraries (zag-ripple, ark-ripple, ripple-ui), which are not records here. The homepage shows "Backed by Vercel"; no field takes it.
