notes: >
  The repository is archived (GitHub API, last push 2021-09-08); the README and the npm package carry no end statement, no deprecation and no successor, so the discontinued status rests on the archive flag alone. The README says the project is "Based on" JSX (vdo), Remark, Richtypo, Highlight.js and Intl MessageFormat; these are libraries it is built with, not a parent project, so no basedOn is recorded. The npm package names no homepage; the README names none. The Node requirement is the npm engines.node range ">=8.9" of the latest version, recorded as runtimeMin 8.9. The first GitHub release is v1.0.1 (2015-11-08), which is the oldest entry in the release list. The highest stable release is v7.1.0 (2017-12-25), matching npm latest.
