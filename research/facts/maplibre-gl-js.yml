notes: >
  Doubt: none on criteria. The GitHub API reports the license as NOASSERTION because LICENSE.txt is not matched, and the npm maplibre-gl latest tag reports BSD-3-Clause; the LICENSE.txt is the three-clause text. The README states the library originated as a fork of mapbox-gl-js before the Mapbox license change of December 2020, and that the v1.x line was meant as a drop-in replacement for Mapbox's OSS version; the forkOf value is the fork sentence only, the drop-in wording goes here. The community page names a Slack channel hosted by OpenStreetMap US. The README names React and Angular bindings (react-map-gl and ngx-maplibre-gl) as separate packages; they are not recorded and no basedOn is set, since the core is framework-agnostic. The npm dist-tags keep older lines: v1 at 1.15.3 and latest-5 at 5.24.1; currentMajor follows the highest stable release, 6.18.0. The homepage says "The MapLibre Organization is an umbrella for open-source mapping libraries", and the sibling projects (maplibre-native, maplibre-style-spec, martin) are not recorded here. The docs Installation section also names the Vite, webpack, esbuild and Rollup bundlers; those are bundler routes of the npm install and are not separate installMethod entries. The sponsor list in the README (AWS, Microsoft, MIERUNE, komoot and others) is recorded as nothing. The firstRelease year is the npm upload 0.0.0 of 2020-12-09, the earliest upload. httpArchiveSites is the mobile figure of the HTTP Archive technology MapLibre GL JS. The stars and contributors belong to the repository, which holds only this package. The docs navigation lists Plugins, Style Specifications, API, Examples and Guides. The README says the drop-in replacement wording applies to the initial 1.x versions, and the fork sentence and the December 2020 license change are the README's own words.
