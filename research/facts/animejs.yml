notes: >
  The homepage names the package as "npm i animejs" and the install page lists three routes: the npm package, a CDN (esm.sh and jsDelivr, ES modules and UMD) and a direct download from the GitHub repository. No page states that the library runs in the browser in those words, so runsAs is left out for the reviewer to decide; the install routes and the DOM and SVG targets point to the browser. The homepage Discord link sits inside an HTML comment, so discord is not recorded. The GitHub API has no release newer than 4.5.0 while npm carries the dist-tag beta at 5.0.0-beta.3 (2026-11-02), recorded as latestPrereleaseDate. The npm weekly figure is the sum of daily downloads for 2026-10-26 to 2026-11-01. The first release year is the v1.0 GitHub release of 2016-06-29, the npm 1.0.0 upload is 2016-06-27 and the repository was created 2016-03-13. Contributors is the GitHub count without anonymous contributors, 54 pages at one per page. Maintainer is the LICENSE copyright line, and the repository owner is a user account. The site footer (X and Bluesky) is recorded as links only.
