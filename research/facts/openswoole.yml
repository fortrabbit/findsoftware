notes: >
  Open Swoole is a PHP extension (C++), not a standalone server binary: the server runs inside a PHP CLI process, per the docs ("runs as a PHP CLI application"), so the runtime is php. The docs also say the server can sit behind Apache or Nginx as a proxy. The homepage says the project was "previously named Swoole"; the site states no fork or successor relation, so forkOf and successorOf are left out, and the Swoole record stays separate. The README, the homepage and the docs name the project "OpenSwoole" and "Open Swoole"; the record uses the homepage spelling. The maintainer is Transfon Ltd per the homepage copyright line; the Transfon privacy page gives the United Kingdom as headquarters, and the registered address in the openswoole.com footer is London. The license is Apache-2.0 per GitHub and the LICENSE file. The GitHub API lists 16 stable releases; the oldest is v4.7.1 (2021-10-17) and the latest is v26.2.0 (2026-02-28). The release line is calendar-based (26.2), so currentMajor is not recorded. The Packagist figures are for openswoole/ext-openswoole, the package PIE installs from the README; the composer package openswoole/core, named in the docs for composer require, has 1,504,903 total downloads and 53,109 monthly (api, 2026-10-30), recorded in notes for a reviewer to decide which package the figure should follow. runsAs always-on rests on the docs sentence that the server can run directly on the network. The Packagist metadata for ext-openswoole has no version list (p2 is empty), so the PHP requirement comes from the README at the v26.2.0 tag.
