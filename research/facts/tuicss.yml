notes: >
  No project site is recorded: the npm homepage field and the CSV homepage point to the GitHub README, and the repository's wiki is the only documentation site. The README names the Turbo Vision Framework as the base of the project and names curses, ncurses and Newt as checked for features; none has a record, so basedOn is not recorded. The repository is not archived and has no end statement in the README, the wiki or the changelog; the newest GitHub release is v2.1.2 dated 2023-07-19 and the CHANGELOG stops at 2.1.1. The oldest release, v0.0.1-alpha dated 2019-09-05, is listed without the prerelease flag, so it sets firstRelease to 2019; the major is 2 from v2.1.2. The distribution includes tuicss.js for a chart component, so the language is recorded as CSS from the main file of the package; no runtime is recorded because no page states the JavaScript runs in the browser. The maintainer is the individual in the LICENSE copyright line and the npm author field, and the wiki copyright line names the same person. The npm weekly figure is the sum for 2026-10-19 to 2026-10-25. The default branch's last commit is dated 2023-07-19, and the repository's pushed_at is 2026-06-19.
