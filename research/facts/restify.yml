notes: >
  The restify.com docs are the Quick Start only and name no installation command; npm install restify comes from the README. The LICENSE file reads "Copyright (c) 2011 Mark Cavage"; the README license block reads "Copyright (c) 2018 restify". Both state MIT, so the holder is not recorded as a legal entity. The maintainer is recorded as the homepage names it, "the restify team". Node support: the README lists v22, v24 and v26; runtimeMin 22 is the npm engines field of the latest package. The highest stable GitHub release is v12.0.0, matching npm latest. The release list shows no prerelease in the last ten releases, so no latestPrereleaseDate. The GitHub repository was created in 2011 and the npm package in 2011, so firstRelease is 2011 from npm created time. The mailing list is a Google group named in the README and is not recorded as a forum.
