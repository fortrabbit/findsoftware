notes: >
  The newest release is v0.164.0 (2026-10-26), titled v1.70.0/v0.164.0 because the stable modules and the collector distribution version separately, so no single major applies and currentMajor is not recorded. The oldest tag v0.0.1 is a prerelease dated 2019-08-08, so firstRelease is 2019. The repository holds the core library and the otelcorecol build target; the Docker image otel/opentelemetry-collector is described on Docker Hub as the core distribution, and the docs name the opentelemetry-collector-releases repository for the ghcr.io images. The install guide gives five routes: build from source (git clone, make otelcorecol), Docker, Kubernetes, prebuilt binary, and the Linux, macOS and Windows binary pages. The Kubernetes page gives a sample manifest that starts the Collector as a DaemonSet with a gateway instance, and names the OpenTelemetry Helm charts and the Operator for production use. The project describes itself as a CNCF project on https://opentelemetry.io/about/; the CNCF is the foundation and is not recorded as parent. The Collector receives telemetry from applications instrumented with OpenTelemetry SDKs over OTLP, which is the wiring the criterion asks for. The gateway deployment page describes Collector instances "running as a standalone service" and the agent deployment page a Collector that "runs alongside the application or on the same host". The repository LICENSE file names no copyright holder; the maintainer is the name the docs footer gives. The Go requirement in the README applies to library use, not to the binary, so runtimeMin is not recorded. The contributors count is the last page number of the contributors endpoint with per_page=1. The open-telemetry GitHub profile names itself OpenTelemetry - CNCF; the owner type is organization. The community page lists Slack channels, mailing lists and a Stack Overflow tag; none has a field here.
