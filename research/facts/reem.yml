notes: >
  No homepage is recorded: the repository is the only project page, and the GitHub homepage field is empty. No GitHub release or tag exists, so currentMajor comes from the npm latest version 0.0.5 (2015-05-23). The README says Reem keeps changes backwards-compatible until v1.0.0. The wiki pages (Introducing Reem, Superusing the CLI, Creating a Static Markdown Website, The Programming Interface, Developing a Great Reem Plugin) were read through the GitHub wiki. The wiki names Jekyll, Metalsmith and Middleman as the generators Reem borrows ideas from; a comparison is not recorded as alternativeTo. The npm weekly download figure and the star count are for the week 2026-10-12 to 2026-10-18 and the date of this read. The README describes the pipeline: the source directory is read into a tree, processed by plugins and middleware, and written to the output directory. The reemfile.js file configures the build, the reem-markdown plugin is a separate npm package that converts Markdown, and the wiki says consolidate.js covers the template languages. The template line in the wiki says consolidate.js covers the template languages; the wiki's tutorial uses Mustache, which is not recorded as a fact.
