notes: >
  Status accepted: a library a site or app calls to translate messages and locale-specific formats, listed under i18n. Criterion 2: installed with Composer from Packagist (symfony/translation). Criterion 3: the package page and the translation docs. Criterion 4: not archived, no abandoned or deprecated flag, the latest stable release v8.1.11 is dated 2026-11-04. The repository is a read-only split of symfony/symfony, whose README sends issues and pull requests to the main Symfony repository; stars, contributors and downloads belong to the split. The maintainer follows the LICENSE copyright line (Fabien Potencier); Symfony SAS is named in the Symfony legal notice at sensiolabs.com and is not recorded here. The docs say the translation dictionaries can be written in YAML, PHP and XLIFF, and that the PHP intl extension is needed for translations into other languages (the polyfills support English only). The docs describe fallback locales, the translation:extract command that lists the messages the code and templates use, and a default locale and translation directory set in the application's configuration. The docs describe a Twig trans filter and tag and PHP templates; they are an integration with templating, not a template engine, and are not recorded as templating. The docs name third-party translation platforms that the component pushes and pulls translations from, installed as separate packages (Translation Providers); these are not recorded. The firstRelease is 2011, the year of the oldest Packagist version (2.0.4, 2011-09-29); the packages page gives October 2011.
