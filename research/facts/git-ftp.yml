notes: >
  The record follows the project as its site presents it: the Python implementation is listed first and recommended, so repository, language, license, stars and contributors come from github.com/git-ftp/git-ftp-py. The Bash original (github.com/git-ftp/git-ftp, 5630 stars, 84 contributors on 2026-10-28, GPL-3.0, written in Shell) stays a documented alternative; firstRelease is the oldest release of the Python repository, v2.0.0.dev0 (2026-09-13); the Bash original has releases from 2015, which are not this implementation. The project site documents two implementations; the Python one (PyPI git-ftp, created 2026-09-13, 2.1.0 released 2026-10-26) is marked recommended and is the record. It gives currentMajor, latestReleaseDate and pypiDownloads; the install page names pip first with a Python 3.10 requirement. The GitHub releases of github.com/git-ftp/git-ftp end at 1.6.0 (2020-02-03), so the Bash repository's own release date alone would be stub-age under the four-year rule; the registry date keeps the record listed. The PyPI classifier of 2.1.0 is "Development Status :: 4 - Beta". The install page also names a PPA and the AUR, and a Debian package; none is a separate installMethod entry here. The npm name git-ftp is a different package (latest 0.0.0) and is not recorded. Runtime for the Bash original is a POSIX shell with git and curl, stated on the install page; that is in notes, not in the runtime field. The copyright line of the Bash script names René Moser; the pyproject of git-ftp-py lists the same person as author. The bash repository's AUTHORS file lists more people, and the maintainer is named from the copyright line. The x link is taken from the README text (Follow this project on twitter). The Homebrew analytics figure for git-ftp in the candidates CSV is not checked here and is not recorded.
