notes: >
  No project website: the repository and the pkg.go.dev reference are the only project pages, so homepage is not recorded. The README names v2 as the currently maintained version; the highest stable release is v2.1.0 (2020-11-07), and the newest stable release by date is v1.6.0 (2020-11-26), which the latestReleaseDate value uses. The newest release is more than four years old, so the import's age rule for listing applies. The Go module path is github.com/russross/blackfriday/v2, and the install route is the Go module proxy in module mode, not a registry package; there is no Go download figure. The README states compatibility with modern Go releases but no minimum version, so runtimeMin is not recorded. The first tag is v1.0, dated 2011-07-19 by its commit. The repository has a 2024-01-29 last push and no archive flag. The repository holds the library only. The license was recorded from the README sentence; GitHub detects no license for the repository (NOASSERTION).
