notes: >
  The README states the project is functional but unmaintained and that the author will likely not resolve issues, so status is discontinued under AGENTS.md; the CSV row said accepted. The repository has no LICENSE file, no license in pyproject.toml and a null GitHub license field, so license is unknown. The repository has no GitHub release or tag and no homepage. The tool reads public Notion.so pages at build time, and that service is the input, not the content store, so contentStore is left out. The README requires Google Chrome with chromedriver for the rendering step; Chrome is a requirement, not a runtime, so runtime is python only. The maintainer name comes from the pyproject.toml authors field; the field's email address is not recorded. The Python minimum is taken from the Poetry dependency constraint, the only version statement in the repository outside the Docker image tag.
