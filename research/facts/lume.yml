notes: >
  The record describes the current stable line, Lume 3 on Deno: the homepage names Deno as the runtime and gives the deno run init command, and the newest GitHub release is v3.3.3 dated 2026-10-20. The README on the main branch, read 2026-10-21, states the pre-release line targets Node: "Lume is the Galician word for _fire_ but also a (yet another) static site generator for Node. Previous Lume versions were available for Deno." It also shows the build as npx @lumeland/lume build. The npm package @lumeland/lume carries its latest dist-tag on a 4.0.0 beta, the pre-release line, dated 2026-10-11 and older than the stable release, so no latestPrereleaseDate is recorded. No npm figures are recorded for the stable line, because the npm package carries only the beta under its latest tag. The LICENSE copyright line names Oscar Otero for 2026, and the repository owner is the lumeland organization.
