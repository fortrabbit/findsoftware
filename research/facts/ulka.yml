notes: >
  The install docs run npm init ulka, which runs the create-ulka scaffolder, so the core package ulka is recorded as npmName. The repository has no GitHub releases and no tags, so currentMajor and latestReleaseDate come from the npm latest tag (1.0.0, 2023-06-30); the npm next tag, 1.0.0-experimental.3 (2022-05-05), is older than latest and is not recorded. The npm history starts in 2020 (0.1.0, 2020-07-17) with a repository field pointing to acharyaroshanji/ulka, which GitHub redirects to coderosh-zz/ulka, a repository that ulkajs/ulka does not name as its origin; ulkajs/ulka was created on GitHub on 2021-01-26. firstRelease is therefore left out. The quickstart names Node LTS as the requirement with no minimum version, so runtimeMin is unknown. The docs show dist only as an example value in ulka-config, not as a default, so outputDir is unknown. The plugin packages, such as @ulkajs/plugin-tags, are named on the plugins page, and the docs state that Ulka exports no client-side JavaScript beyond what the author wrote; no plugin directory is recorded. The LICENSE says copyright 2020 to present and the homepage says 2021 to present; the LICENSE line is recorded for the maintainer name.
