notes: >
  The homepage at rethinkdb.com answers over https with the project's own pages, but its content dates from 2016 (news items and a 2.4.4 release line); the docs are the same generation. No page or the README states an end, and the repository had commits on 2026-10-24 and 2026-10-26. The homepage and the project's release post name 2.4.4 as the latest release (blog post of 2023-12-10; GitHub release 2023-12-11), and no blog or download page announces 2.4.5, so currentMajor stays 2. The tag v2.4.5 (commit 2025-11-17, "Regenerate the web_assets.cc for v2.4.5") has no release object and no announcement, so it is only noted here. The README and COPYRIGHT both state Apache 2.0; the README words it as "licensed by the Linux Foundation under the open-source Apache 2.0 license", recorded in notes only, as one wording. firstRelease 2011 is the commit date of the oldest tag that is not marked internal (v0.1, 2011-01-19); the GitHub releases begin with v1.5.0 (2013-07-02) and the repository was created 2012-10-30, so the year is the least certain value in the file and no page states a first-release year. The GitHub API reports the license as NOASSERTION because the license text is in COPYRIGHT and not in a LICENSE file. The Docker route is the official library image rethinkdb, the image the install docs name. The databases vocabulary has no RethinkDB value, so none is recorded. The x link is the homepage's Twitter link. The community page also links a Slack workspace and an IRC channel on Freenode, which have no field. Fields coined here: none.
