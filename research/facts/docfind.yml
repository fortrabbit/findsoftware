notes: >
  The project has no documentation site: the README on GitHub is the only documentation, and the homepage at microsoft.github.io/docfind is a demo that searches 50,000 news articles, so no docs fact is recorded. The LICENSE file is the MIT License under the line "Copyright (c) Microsoft Corporation"; GitHub reports NOASSERTION because of that leading line. The Microsoft terms page (https://www.microsoft.com/en-us/legal/terms-of-use) names "Microsoft Corporation, One Microsoft Way, Redmond, WA 98052-6399" as manufacturer; hqCountry US is recorded from that address, as for other company-address records. No registry package: crates.io and npm return 404 for docfind; the PyPI package named docfind is an unrelated project (homepage cmdeniz.dev) and is not used. The install script and binaries come from GitHub releases; releases v0.1.0 (2025-11-11) to v0.5.1 (2025-11-19) are the only releases, so firstRelease is the year of v0.1.0. The README names Rust dependencies (fst, fsst-rs, rake, wasm-bindgen) and prior art (Algolia, Typesense, Lunr.js, Stork, tinysearch); none is stated as the project's parent, so basedOn is absent. The README calls the CLI and WASM output a demo index of 50,000 AG News articles; the demo is not a hosted service. runsAs local is the CLI that builds the index on the developer's machine; the WASM output is served with the site's static files and runs in the visitor's browser. Categories: CSV lists static-site, but the README describes a search index builder, not a site generator, so static-site is not recorded. runtime is not recorded: the CLI is a self-contained binary that runs only when building the index, and the output needs no runtime on the host. Building from source needs Rust, wasm-pack and Node.js (the latter for esbuild), per the README; the prebuilt binaries need none of them.
