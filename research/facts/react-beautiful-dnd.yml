notes: >
  Discontinued on three signals from the project's own repository and package: the archived flag (GitHub API, default branch master, last pushed 2025-08-18), the README notice "This project is now archived and is deprecated on npm", and the npm deprecation of the latest version 13.1.1. The README sends readers to atlassian/pragmatic-drag-and-drop (research/facts/pragmatic-drag-and-drop.yml) for Atlassian's ongoing drag and drop work; it is a separate, rewritten project, so it is a replacement rather than a move of this package. The README does not call it a successor, and successorOf goes on the newer project, so none is recorded here. The README's motivation section compares the library with react-dnd; react-dnd has no record, so no alternativeTo is recorded. The README's resources link (issue 2672) lists ways to move on; it is not read further here. The LICENSE opens with "Copyright 2019 Atlassian Pty Ltd" and the README names Alex Reardon as creator and Daniel Del Core and others as maintainers; the copyright line sets the maintainer. The community fork @hello-pangea/dnd (research/facts/hello-pangea-dnd.yml) is not named in this README, so no forkOf or successorOf is recorded here. The homepage netlify site is the Storybook demo the repository names; its title is the only text readable here. The npm figure is the sum of the daily downloads for 2026-11-01 to 2026-11-07, read from the range endpoint; the npm package is the one the installation guide names. The first GitHub release is v1.0.1 (2017-08-11); the npm created date is 2017-08-10. Contributors counts the contributors endpoint with per_page=1, read from the rel="last" link (121). The basedOn react value comes from the README description sentence "for lists with React" only; the installation guide says a React environment is needed, which is a peer dependency (react is provided externally in the UMD bundle) and is not recorded as a separate statement.
