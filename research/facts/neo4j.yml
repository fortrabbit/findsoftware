notes: >
  Calendar versions: the release tags are 2026.10.1 and the like, so currentMajor is not recorded; the line is 2026.10; the requirements page version selector also lists 5.26 (LTS), which is not recorded. The newest stable tag 2026.10.1 is dated 2026-10-20 by its commit; the CSV row's 5.26.32 date is superseded. GitHub lists no releases after 2017 (3.3.0-beta01 is the newest release object); the 2026 releases are tags only. firstRelease is 2013 from the oldest GitHub release object (1.8, 2013-09-01); the repository history was imported in 2022 (tag 1.0.0 commit 2022-11-28), and no project page states the first release year. License: the GitHub license field is GPL-3.0 and the README says "Neo4j Community Edition is an open source product licensed under GPLv3"; one license, two wordings, one entry. The Enterprise Edition is closed source (README) and sold under a commercial licence; the pricing page lists it as a separate edition with "Contact Sales". The AuraDB hosted service is named on the homepage; no prices recorded. The homepage footer names "Neo4j, Inc." as the copyright holder. No country or full address for Neo4j, Inc. is on the pages read, so hqCountry is not recorded. The Docker Hub official image neo4j is the image the install page names; pull_count from the Hub API. Forum and X links come from the homepage links without quotes (href only). The discord quote is visible homepage text. The runtime is a JVM: the requirements page lists OpenJDK, Oracle JDK, Zulu and Temurin 21/25, and pom.xml at tag 2026.10.1 sets vm.target.version to 21. The Windows install page also describes running Neo4j as a Windows service. The authentication pages mark role-based access control and OpenID Connect sign-in as Enterprise Edition; the same pages describe LDAP as an auth provider, which is not recorded as sso because it authenticates database users, not an admin interface sign-in, and the built-in role names are not recorded. Neo4j Browser is the developer interface that ships with both editions. The homepage footer links the Facebook, LinkedIn and YouTube accounts; only Facebook has a field. Fields coined here: none.
