notes: >
  The homepage of this project, http://www.jpress.cn, is in doubt: it redirects to https://www.jpress.cn/, whose certificate has expired (curl reports "certificate has expired"), so no https homepage is recorded and homepage is listed in notFound; a valid https certificate would settle it and move the record to accepted. The documentation at doc.jpress.cn answers only over plain http and is not linked, so docs is listed in notFound. The README links the manual, development and API documents on doc.jpress.cn only. The GitHub language breakdown counts JavaScript above Java, but the README runs the Java main class io.jpress.Starter, so only Java is recorded. The README describes JPress as similar to WordPress; that comparison is not recorded as basedOn. The tag v5.1.2 has no GitHub release, so latestReleaseDate is the date of its commit; the newest GitHub release is v5.1.1 (2024-07-05). firstRelease is the oldest GitHub release (v1.0-beta1, 2018-10-08); the README says the project started in 2015, which is a statement of the project's start, not a release. The contact channels are QQ groups and a WeChat group, and no Discord, X, Bluesky, Mastodon or newsletter link appears in the README. The runtime minimum is the compiler target 1.8 in the v5.1.2 pom. No page states how the process runs on the host, so runsAs is left out. The VIP membership on the website is not recorded as paidEdition, since no edition page was readable. The repository owner has no legal name on the GitHub profile, so the owner name is recorded as the maintainer.
