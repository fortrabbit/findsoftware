notes: >
  Two license statements disagree. The LICENSE file at tag v4.0.18 and the GitHub API both say Apache-2.0, while the documentation says "imgproxy is licensed under the MIT license." Both are recorded as separate license entries, and the difference is not resolved in this file. The Pro price is printed with a strikethrough figure, so only the remaining figures are recorded. The systemDependencies, docker and runtimeMin fields are coined kinds for libvips, the image and the build toolchain.
