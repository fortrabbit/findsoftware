notes: >
  End signal: the repository the project names (facebookarchive/draft-js) is archived on GitHub, and the README says the project is in maintenance mode, receives only critical security patches, and that the repo would be archived on 31 December 2022. The README names Lexical as the framework Meta is migrating to ("For users looking for an open source alternative, Meta have been working on migrating to a new framework, called Lexical"); no Lexical record exists yet, so no alternativeTo or successorOf is recorded. Latest stable release is v0.11.7 (2020-08-17), matching npm latest 0.11.7 (not deprecated). The repository was last pushed to on 2023-02-06 (pushed_at). Maintainer: the LICENSE copyright line names Facebook, Inc. and its affiliates; the README places the project under Meta's migration, and no page on this record names Meta as parent. The README calls it a framework for React and says it depends on React and React DOM. The npm figure is the draft-js package the install docs name. Stars and contributors belong to the repository. The README says Draft.js is used in production on Facebook; that is not recorded as a field.
