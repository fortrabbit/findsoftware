notes: >
  The CSV boundary (no versioned release found) is settled by the Maven Central release 0.12.1, which the homepage and project setup page name as the current version; no GitHub release exists, so the tags are the only git releases, and the highest stable Maven version is 0.12.1 (the Maven release element names the 0.13.0-M6 milestone, which is not stable). The first release year comes from the oldest upload on Maven Central under the net.databinder group id: version 0.1.0 of unfiltered_2.7.5, listed on 2010-05-19. The GitHub tag 0.1.0 sits on the same day. The LICENSE copyright line names Nathan Hamblen and Doug Tangren for 2010 to 2014 and carries no legal form; the project says nothing later, so the reviewer may want to confirm the maintainer. The runtime follows the bindings page, which describes the Java Servlet API and Java NIO based modules; the homepage names no runtime version, so runtimeMin is left out. The Scala version on the Maven artifacts is 2.13 and 3; the mavenCoordinates value uses the Scala 3 artifact named on the project setup page. The README describes the core library as request extractors and response combinators, and the homepage describes an intent as the partial function a plan declares for requests. The homepage describes plans and intents, and the bindings page lists the servlet filter, Jetty and Netty modules. The Netty and servlet backends are server modules named on the bindings page; runsAs rests on the Jetty example's run() call and on the bindings page's statement that applications run on servlet containers. The community page links a Google Groups mailing list and a Gitter room, both recorded as forum. The database module in the project setup page is a Slick example template, so no database is recorded.
