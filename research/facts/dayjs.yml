notes: >
  The homepage and documentation say the library works in the browser and in Node.js; the browser page gives a CDN route. The README compares the library with Moment.js ("alternative to Moment.js"); Moment.js has a boundary row in candidates-dev-libs.csv and no fact file, so the comparison stays here and alternativeTo is not recorded. The homepage carries sponsor advertisements for unrelated services; no fact is taken from them. The repository's default branch is dev, and the LICENSE copyright line names iamkun with no legal entity. The repository had its last push on 2026-09-15 and its last release (v1.11.23) on 2026-08-17. Stars and contributors are from 2026-11-04. No runsAs is recorded: the docs say "designed to work both in the browser and in Node.js", a browser support statement that names two environments, so the record carries runtime node only. No npm installMethod is recorded: the Node.js page says to add the dependency to a package manager and the README gives npm install as a command, and no sentence names npm. The npm package figures come from the package the README installs; npmWeeklyDownloads is the sum of the daily figures from 2026-10-26 to 2026-11-01. The README says locales are not included in a build unless used ("load on demand") and calls a plugin "an independent module that can be added to Day.js"; the plugin page says Day.js comes with core code only. The homepage footer links a Gitter chat (gitter.im/iamkun/dayjs), a chat with no field, and a Crowdin project for translating the docs site. The npm alpha tag (2.0.0-alpha.4, 2022-09-26) is older than the latest release, so no latestPrereleaseDate is recorded.
