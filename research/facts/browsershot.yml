notes: >
  The docs site at spatie.be/docs/browsershot serves the v4 documentation; the v5 path redirects to the v4 introduction, so the v4 installation page is cited while the GitHub release line is 5.x. A reviewer should decide whether the docs field waits for the v5 docs. The v4 installation page links a Puppeteer requirement to a v1 requirements page, which is not cited. The requirements page states Node 22.0 or higher and Puppeteer 23.0 or higher; the Node minimum is recorded as a second runtime entry, and runtimeMin is the PHP minimum from composer.json at tag 5.4.2, so the Node minimum sits in these notes only. The package also needs a Chrome binary that Puppeteer installs and the pdftotext CLI for its own tests only; neither is a field. The README says Browsershot runs "a headless version of Google Chrome" through Puppeteer. The footer of the docs pages on spatie.be links the maintainer's company accounts (newsletter, X, Bluesky, Instagram, YouTube), recorded as the maintainer's; its Mastodon link is hidden and is left out. The docs' Questions and issues page sends users to GitHub issues, so no forum is recorded. The company legal form "bvba" comes from the LICENSE line; the about page gives the Antwerp address, which carries the country. The Packagist first version is 0.1.0 dated 2014-05-02, which matches the oldest GitHub tag year. The README alternatives section names Browsershot v2 and v1 of the same package, which are its own older versions, so no alternativeTo is recorded. The Packagist total is 46,264,928 downloads on 2026-11-04.
