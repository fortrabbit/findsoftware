notes: >
  The first PyPI upload is version 0.1 (2013-10-25). PyPI lists a 4.0.0a1 upload dated 2019-10-09, older than the latest stable release, so no latestPrereleaseDate is recorded. The pypistats figure is the last month's downloads for the aiohttp package, from the install docs' package name. The repository's GitHub owner is an organization, and the maintainer is recorded as the GitHub organization name because the LICENSE file names no copyright holder. The docs name the authors as Nikolay Kim and Andrew Svetlov; the maintainer stays the aio-libs organization. Matrix chat (aio-libs) is the other channel the docs list.
