notes: >
  The license is stated two ways. GitHub reports GPL-2.0, and the plugin header in elasticpress.php reads GPL v2 or later. Both are recorded as separate license entries. Coined fields: wordpressPluginPage, wordpressActiveInstalls (the page's own figure, a range), wordpressDownloads, because WordPress.org is the plugin directory for this software; the wordpress.org directory is a distribution source here, not a discovery list. The Elasticsearch server it talks to is a separate product and not recorded on this record. The ElasticPress.io hosted product is recorded as hostedService and its pricing page was not reached. The GitHub develop branch is cited for the plugin header.
