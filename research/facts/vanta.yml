unreadable:
  - "https://www.vantajs.com (the README's demo gallery and docs link) fails TLS: the certificate has expired; http://vantajs.com redirects to the https address, so the site is unreadable"
notes: >
  Doubt: the project's own site, which the README names for its demo gallery and effect options, has an expired TLS certificate, so no homepage is recorded and the site cannot be checked for the software. The npm package vanta, whose README is the install source, has had no release since 2022-09-16, which is past the four-year line of AGENTS.md criterion 4, so the record stays a stub. Settling it needs a readable https homepage that still shows the software, or a newer release; either moves the record back to accepted. The repository has no GitHub release or tag; the npm latest (0.5.24) is the registry release the latestReleaseDate and currentMajor come from, so no lastCommitDate is recorded. The npm package is named vanta and matches the repository. The repository's LICENSE.md is the MIT text with the copyright line "Copyright 2020 Teng Bao"; the npm metadata gives MIT. The README's React and Vue examples need three.js or p5.js loaded by a script tag, and the script-tag route for the vanta effect files is recorded as an installMethod. The README says effects are rendered by three.js or p5.js; that is a dependency, not a basedOn statement, so no basedOn is written. The GitHub figures (stars, contributors) are for the repository. The npm weekly figure is for the package the README install line names.
