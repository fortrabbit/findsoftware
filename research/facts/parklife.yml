notes: >
  Parklife is a gem that builds a static site from a Rack app; it is a build tool, not a site generator with its own content format, so no contentStore or templating is recorded. The README names parklife-rails for Rails use and the Sinatra example app for Sinatra use; neither is recorded as a parent. runtimeMin is the RubyGems required Ruby version of the latest release. The RubyGems download count is the total across all versions; the first RubyGems release (0.2.0, 2023-02-21) agrees with the GitHub oldest release date for firstRelease. The README says Parklife does not handle assets such as images and CSS, which need generating separately. The homepage carries no social links. The categories values come from the homepage's own description (a Rack app rendered to a static build).
