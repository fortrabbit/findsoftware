notes: >
  Hosted SaaS, so criterion 2 is waived under AGENTS.md. The docs introduction lists the features: GitHub, GitLab and Bitbucket integration, GitLab self-hosted integration, seamless deployment rollbacks, application health checks, integrated chat notifications, deploy to multiple servers, cron job monitoring and unlimited team members. The service deploys PHP projects (the docs say "Deploy any PHP Project" and "Tuned for Laravel Apps") and states that it supports Ubuntu and FreeBSD servers that have scp installed; these are not recorded as fields because the docs give them only as requirements of the target server. The docs say Envoyer is not necessary for applications running Laravel Octane. The homepage lists three plans with prices; the prices are not recorded, and the hosted plan tiers are not a paidEdition. The GitLab Self-Hosted Integration is an integration with a customer's GitLab, not a self-hosted Envoyer, so selfHostOption stays unknown. The privacy page covers forge.laravel.com and states the company's headquarters; hqCountry comes from that statement, not from the service page. The docs page footer links to x, Discord, GitHub and LinkedIn accounts of Laravel (laravelphp, laravel), which belong to the parent and are not recorded here. The docs' API section (docs.envoyer.io/api/introduction) states no rate limit in the text read. No launch year appears on the project's own pages, and a web search found none, so firstRelease is unknown.
