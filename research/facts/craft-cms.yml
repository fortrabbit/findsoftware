notes: >
  The official craftcms/docker image repository is archived (last push 2024-12-19), so docker is left out. Craft 6.0.0-alpha.20 is on Packagist and requires PHP ^8.5; the latest stable 5.11.5.1 requires ^8.2. GitHub reports the license as NOASSERTION; the repo's LICENSE.md is a custom per-production-install license, recorded as source-available. Prices carry a "$" symbol without a currency code on the pricing page; the currency field keeps the symbol as stated. Craft 4 reached EOL on 2026-04-30 per endoflife.date. Contributors counts GitHub accounts on the repo, anonymous excluded.
