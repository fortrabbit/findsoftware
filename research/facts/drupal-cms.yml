notes: >
  Drupal CMS is a distribution: its Composer package requires Drupal core 11 (drupal/core-recommended ^11.4), so the core facts sit on the drupal record and are linked through basedOn. The database list and the web server statement come from the Drupal system requirements page, which covers core, and the runtime floor comes from the drupal/core package that the cms package resolves to. The package has no PHP requirement of its own. firstRelease is the earliest version in the Packagist feed (2024-12-05), which holds 50 versions; a full version history was not checked. The Packagist total downloads figure (110756) is newer than the CSV note. The git repository is on drupal.org GitLab and was not read directly; the Packagist source URL names it. The homepage is on new.drupal.org, Drupal's own site. The install page lists the launcher and DDEV, and says launcher trial sites are temporary and that a finished site moves to a hosting provider; the Composer create-project command was not found on the pages read. Two entries record the Packagist monthly and total downloads, each with its period.
