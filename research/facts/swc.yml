notes: >
  The homepage is the project's own site over https. The README and the team page describe SWC as a volunteer-maintained project; the team page names kdy1 as Lead Maintainer and lists core team members, which is recorded in notes only. Repository, releases and the npm package @swc/core are read through the API; the install docs name @swc/cli and @swc/core, and @swc/core is the core package recorded for the monorepo. The npm figure covers 2026-09-28 to 2026-10-04; the oldest npm upload of @swc/core is 1.0.11 on 2019-02-15, older than the oldest stable GitHub release (v1.2.23, 2020-09-07), so firstRelease is 2019. The highest stable GitHub release is v1.16.20 (2026-10-22); the nightly tags are not prereleases on GitHub and are not used. The README says "Node v10+ for usage", matching the registry engines of @swc/core. The maintainer is recorded from the LICENSE copyright line (SWC contributors); the homepage says "SWC is created by kdy1" and the team page lists "kdy1 / Donny" as Lead Maintainer and the README says the project is maintained by volunteers, so maintainerType stays unknown. runsAs local rests on the swc-loader page, which describes use inside a webpack build. The bundling configuration page says the bundling feature "will be dropped in v2, in favor of SWC-based bundlers"; that is a planned change, not an end signal. The website's Donate link is an OpenCollective page and no price or paid edition is stated. The homepage footer links x.com/twitter for @kdy1dev, the creator's personal account, so x is not recorded. The homepage nav link to the Discord is the project's own invite.
