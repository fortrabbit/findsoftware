notes: >
  Boundary decision: step-ca is in because its own README says it issues "HTTPS server and client certificates that work in browsers" and is "an ACME server that supports all popular ACME challenge types", and its ACME basics page says the http-01 challenge is answered by "any web server". The README names a commercial CA and the Smallstep Certificate Manager as a separate product for needs such as multiple certificate authorities, active revocation (CRL, OCSP) and a web admin UI; no price is recorded. The homepage is the documentation site, since the GitHub homepage field points to smallstep.com/certificates, which redirects to the Smallstep product pages. The production docs page describes running step-ca under systemd, which is the runsAs source. The maintainer legal name Smallstep Labs, Inc. is from the copyright footer of smallstep.com; the terms of use page gives the contact address 548 Market St, San Francisco, CA, the source for hqCountry. The README lists OAuth OIDC single sign-on tokens as one way to issue certificates, recorded as sso. The README points questions to GitHub Discussions, recorded as the forum, and to the Discord server. The GitHub API reports Apache-2.0; the LICENSE file is Apache License 2.0. The oldest GitHub release is v0.0.1-rc.1 (2018-11-03) and the repository was created 2018-11-01, so firstRelease is 2018. The current release line is 0.30, so currentMajor is 0. The database backends (Badger, BoltDB, Postgres, MySQL) are configuration of the CA's own store and are not recorded as databases. The Docker image is smallstep/step-ca (installation page). Contributors counted without anon across all pages (last page 97). The ACME server statement is in the notes, not a field, because no starter field fits it. Fields coined here: none.
