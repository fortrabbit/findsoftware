notes: >
  Status accepted: the test runner is a helper that a site's own test suite uses; the newest stable release is @web/test-runner 1.0.1 (2026-11-10), the repository is not archived, and no end statement was found. The repository is a monorepo of many packages, so stars, contributors and the license belong to modernweb-dev/web; the registry figure, dependent counts and currentMajor are for @web/test-runner, the package the install docs name. The GitHub releases list holds tags of every package in the monorepo; firstRelease is the oldest release in the repository (@web/test-runner-cli 0.4.27 and @web/test-runner-browser-lib 0.2.11, both 2020-08-03), and the npm package's first upload, 0.1.0 of 2020-06-06, falls in the same year. The LICENSE copyright line names "modern-webdev"; the site and the README name the project "Modern Web", which is recorded in the description only as the project's own homepage. The homepage says "Guides, tools and libraries for modern web development" and is no field. The docs name Puppeteer, Playwright, Selenium and WebdriverIO as browser launchers, and the test frameworks page names Mocha; those are integrations, so no alternativeTo or basedOn is recorded. The mocking page recommends sinon; not recorded as a field. The npm figure is the sum of the daily counts from 2026-11-01 to 2026-11-07. The homepage's Discord link goes to the project's discover page. The npm engines field of the latest release is ">=22.0.0". The GitHub latest prerelease is a 2024 canary, older than the stable release, so no latestPrereleaseDate is recorded. The discovery CSV's lastRelease of 2026-07-27 is superseded by 2026-11-10.
  The CI guide says the runner runs tests on a real browser, so a CI environment must be able to support one, and that it uses a locally installed Chrome by default. The overview page lists headless browsers through Puppeteer, Playwright, Selenium or WebdriverIO, an interactive watch mode, code coverage, and tests run in parallel and in isolation.
