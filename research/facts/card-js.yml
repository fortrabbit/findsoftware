notes: >
  The README links the demo as https://jessepollak.github.io/card, which answers 404 on 2026-11-04, so no homepage is recorded and the demo is not cited; the repository's homepage field is empty. The README lists 24 sites that use Card, with no count, so reportedInstalls is not recorded. Card is a client-side script: the README says the script adds its own CSS and is included in the page, but no page states that it runs in the browser, so runsAs is left out. The README's Vue section and the jQuery wrapper are usage routes, not basedOn statements; the Angular, Ember and React wrappers it lists are third-party projects. The library has no release since 2.5.4 (2021-08-14) and no pre-release, and its last push is 2023-06-12; under AGENTS.md criterion 4 the import moves a record with no release in four years to stub, so the status stays accepted here and the reviewer decides. Major 2 is the highest stable GitHub release line (v2.0.0 to 2.5.4). The earliest tag is v0.0.1, committed 2014-06-05; the tag "list" carries no version and is dated 2015-01-28, later. Contributors counted with the per_page=1 last-page method across all pages. Twitter contact in the README is the maintainer's personal account and is not recorded as x.
