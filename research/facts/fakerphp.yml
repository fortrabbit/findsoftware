notes: >
  The repository is a GitHub fork (the API reports fzaninotto/Faker as parent), but no page of the project states the fork, so forkOf is not recorded. The LICENSE copyright line names François Zaninotto (2011) and the record follows it; the GitHub organization FakerPHP maintains the repository, and the Packagist maintainer list (localheinz, graham-campbell, pimjansen, ceulemans) is registry data, not a maintainer statement. The default branch is 2.0, which has no release; the highest stable release is v1.24.1 (2024-11-21), the same version Packagist lists as latest, so currentMajor is 1. Packagist reports no abandoned flag. No installMethod is recorded: the only install instruction is a composer command in a code block, and the docs name composer only inside a code comment ("when installed via composer"), which does not name the route in a sentence. firstRelease is 2012 from the oldest tag in this repository (v1.0.0, commit date 2012-07-10). The README says Faker is heavily inspired by Perl's Data::Faker and Ruby's Faker; that is not basedOn. The composer.json at v1.24.1 requires PHP ^7.4 or ^8.0, so runtimeMin is 7.4. The Packagist total is the all-time figure, and dependency counts come from ecosyste.ms for packagist.org.
