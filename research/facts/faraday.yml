notes: >
  Boundary ruling: in as an HTTP client library (the HTTP utilities ruling), so status is accepted. The README names no install route; the installMethod comes from the docs quick start, which names the Gemfile line and the gem command. The forum is the GitHub Discussions badge in the README; the plugin directory is the Awesome Faraday list the README links for adapters and middleware. The gemspec at the latest release tag requires Ruby 3.0 or later; the README repeats that minimum. The RubyGems download figure counts all downloads since the gem was first published, and the value says so. The README copyright line names "the Faraday Team" (2009 to 2026); the LICENSE line names Rick Olson and Zack Hobson, which is the maintainer recorded here. The docs site is a docsify page that loads its text by script, so the docs content is read from the docs folder of the repository. The migration page for the rest-client gem shows code changes and names no importer, so importsFrom is left out; the rest-client gem has no record, so alternativeTo is left out. Stars and contributors are for the repository. The README mentions adapters such as Net::HTTP and Typhoeus; adapters are coined kinds and stay in notes. The docs quick start describes a connection created with a base URL, default headers and query parameters, an adapter and middleware, with HTTP verb methods called on it. The docs list the included middleware as authentication, URL encoding, JSON encoding and decoding, instrumentation, logging and raising errors, and document custom adapters and custom middleware. Release dates: GitHub latest release v2.15.1 (2026-10-26); the gem's first upload 0.0.1 (2009-12-19) sets firstRelease.
