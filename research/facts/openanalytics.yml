notes: >
  Legal entity: the terms, privacy and DPA pages name AGHAZADA LLC, New Mexico, United States, as the operator of the hosted service; the footer and the LICENSE-linked README name OpenLabs. The maintainer is recorded as the project names itself (the footer copyright line), and the operator's legal name and country are not recorded as hqCountry because the maintainer named in the record is OpenLabs. The LICENSE file is the plain AGPL-3.0 text with no copyright line. The tracker oa.js is MIT, a separate license statement from the server. The release line is 0.x: currentMajor is recorded as 0 because the highest stable release is v0.8.0; the reviewer decides whether a 0 major belongs in the record. The Docker install path uses published images on ghcr.io and the README names the newest release tag. The hosted service's plans (Starter, Enterprise with Single Sign-On and user roles) are hosting plans, not a paid edition of the open source code; the pricing page lists SSO and team roles only on the hosted plans, so sso and userRoles are not recorded for the self-hosted software. The read API documented at getopen.so/docs/api is served from the hosted API host and is not recorded as headlessApi. The self-hosting guide says the self-hosted install has no role above a site membership, which is why userRoles is absent. Vercel, Neon and Grafana Cloud are named as providers in the privacy notice and the Neon sponsorship is in the README; they go to notes. The status page at status.getopen.so and the Product Hunt and Startup Fame badges are not recorded. The alternativeTo and importsFrom values use the names the comparison pages print; only plausible and umami have records so far. The alternatives blog posts on getopen.so (Fathom, Matomo, Plausible, Google Analytics) were read and name the same products; they are not separate facts. The runtime is Node 24 by package.json engines, but the software ships as Docker images, so no runtimeMin is recorded. The self-hosting guide (SELF-HOSTING.md in the repository) gives runsAs always-on through its statement that the services run as uid 1000. It lists the running services as the collector, the worker, the api, the query gateway, the realtime stream and the web dashboard, with the oa.js tracker served as a static file by the proxy. The same guide states that the migrations do not go down (the README says so too), so the way back from an upgrade is a restore. The README's self-hosting section states the requirements as a Linux host with Docker and four DNS records, and the self-hosting guide says certificates are issued on first boot and fail without the records.
