notes: >
  The README opens with a warning dated August 29th, 2026 that Aurora is being archived and no longer maintained; that is the project's own statement of an end, so status is discontinued. The GitHub archived flag is still false, and the repository was last pushed 2026-08-29. The install docs name the PyPI package aurora-ssg (the README's PyPI badge uses the same name); the GitHub repository is capjamesg/aurora and the PyPI homepage points to it. The PyPI JSON carries no download counts, so no pypiDownloads figure is recorded. The newest PyPI release is later than the newest GitHub release; latestReleaseDate and currentMajor use the PyPI release, and both are major 0. The repository description reads "BEING ARCHIVED". The LICENSE copyright line names "James" with no surname, which is how the maintainer is recorded. No homepage exists: the GitHub homepage field is empty.
