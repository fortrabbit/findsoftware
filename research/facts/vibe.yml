notes: >
  The homepage vibe.monday.com is a Storybook shell with the title "Vibe Design System" and no readable body; the README names it as Documentation, which is the source of the homepage and docs values. The repository is a monorepo: the install docs name @vibe/core, so its registry figures and its release tags are recorded, not the other packages the README lists as separately published (@vibe/icons, @vibe/testkit, @vibe/codemod, @vibe/style, @vibe/mcp and the Storybook blocks). The README tagline reads "Official monday.com UI resources for application development in React.js", and it names the components as the library's root-entry imports and the tokens as a separate CSS import. The GitHub API reports the repository license as null because the root has no LICENSE file; the license is MIT per the @vibe/core package and the packages/core LICENSE copyright line "Copyright (c) 2020 monday.com LTD". The npm weekly figure is the sum of daily counts for 2026-10-19 to 2026-10-25; the CSV figure of 69.1k a week is older. The highest stable core release is 4.5.38 (2026-10-19), which matches npm latest; the npm alpha prereleases of the same day are older than that release, so no latestPrereleaseDate is recorded. The repository's oldest release is 0.0.3 (2020-10-07), after a dry-run prerelease 0.0.1 the same week; firstRelease takes the repository, per the monorepo rule, while the @vibe/core registry history starts in 2024. The README says Vibe 3 receives only critical fixes and Vibe 2 is no longer maintained; these are older majors and not an end of the record. The Storybook docs site, the playground and the catalog are the docs; they are shells in the fetch and are not quoted. The maintainer is monday.com Ltd. as the privacy policy names it; the npm author is monday.com. The HTTP Archive technology list has no entry named for Vibe.
