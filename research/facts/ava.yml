notes: >
  No homepage: avajs.dev answers with a 302 to https://github.com/avajs/ava (checked 2026-11-04), so the project's own domain now points at its repository and the record has no site of its own. A reviewer decides whether the repository stands in as the site. The npm package page (npmjs.com) answered 403 and was not read; the registry API was used instead. The README says "Make sure to install AVA locally. AVA cannot be run globally." The README also says AVA detects the CI environment for parallel builds, which is the runsAs local statement. Support follows Node.js: "AVA supports the latest release of any major version that is supported by Node.js itself" (README). The runtimeMin is the engines range of the v8.3.0 package.json. The maintainer follows the LICENSE copyright line; the repository owner is the avajs organization. The first npm upload is 0.0.1 from 2014-07-05, earlier than the first GitHub tag.
