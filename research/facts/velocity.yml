notes: >
  Homepage: VelocityJS.org answers only over plain http (http://velocityjs.org returns 200; https://velocityjs.org does not connect), so it is not linked and homepage is listed in notFound. Status: accepted, as the CSV row says. Release age decides listing, not status: the newest stable release is 1.5.2 (2018-07-31) and the newest prerelease on npm is 2.0.6 under the beta tag (2020-04-10); with no release or prerelease after 2020-04-10 the import moves the record to stub on its own. Reviewer to confirm. The README heading reads "Velocity beta" and says the velocityjs.org documentation refers to V1; the install command names the beta tag (velocity-animate@beta), so npmWeeklyDownloads counts the velocity-animate package across tags. The GitHub releases 2.0.0 to 2.0.5 are prereleases from 2018. The CDN entry rests on the README sentence naming jsDelivr and CloudFlare as sources of the release. The README names velocity-react (a React wrapper by a third party, npm velocity-react) and the Libscore user list ("thousands of other companies rely on Velocity"); neither is recorded. Last push to the default branch was 2020-10-24 (repository pushed_at). The npm weekly figure covers 2026-11-01 to 2026-11-07.
