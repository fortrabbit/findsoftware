notes: >
  Status is accepted per the CSV. The last Hex release is 0.6.6 (2022-02-26), no GitHub release exists (the tags run to v0.6.6), the last commit on master is 2022-03-05 and no retirement flag is set on Hex. Under the import rule, a record with no release in four years becomes stub on its own; this file does not set it. Repository and hexdocs are the only project links: hexdocs.pm is the project's docs, not a homepage, so homepage is not recorded. The README calls the package a port of Elasticlunr.js ("It's a port of Elasticlunr.js with more improvements" in mix.exs); a port is not recorded as basedOn because it is a reimplementation, not a built-on framework, and the JavaScript library has no record. The mix.exs on master says version 0.6.4 while the v0.6.6 tag and Hex say 0.6.6; the tagged file is used for elixir and maintainers. currentMajor is 0, the major of 0.6.6, as the source states it. runtimeMin is absent: mix.exs states the Elixir requirement (elixir ~> 1.11) but no OTP minimum. The owner's name on GitHub is Rasheed Atanda; the LICENSE and mix.exs name Atanda Rasheed, which is recorded. Index storage is a coined kind, kept here: the README ("Elasticlunr allows you to write your indexes to whatever storage provider you want.") lists Blackhole, Disk and S3 providers (S3 as the separate ex_elasticlunr_s3 package). The Hex package has no retirement, and its description and README make no end statement.
