notes: >
  The README and the install page state the same two supported environments: browsers and Node.js. The runtime value node is recorded from the install page's "can be used in browsers and in Nodejs environments" sentence, though the library also runs in browsers, so the reviewer may decide to drop it. The package manifest of @casl/ability at its latest release tag has no engines field; the README table's "Node.js 18+" is on the default branch and is not recorded as runtimeMin. The official integrations (@casl/react, @casl/vue, @casl/angular) are framework bindings of the framework-agnostic core and are not basedOn records; the Prisma, Mongoose and Angular packages are integrations listed in the README. The README says CASL is "Heavily inspired by" cancancan; that is not a basedOn or alternativeTo statement. The repository is a monorepo: stars, contributors and the license belong to stalniy/casl; the registry figures come from @casl/ability, the core package the install page names. Releases are tagged per package (for example @casl/ability@7.1.1), so the first tag v0.2.0 (commit 2017-07-18) is the oldest tag in the repository, and the oldest GitHub release is from 2018-05-28. The @casl/ability releases of 2026-10-31 include 5.4.8, 6.8.3 and 7.1.1; the newest stable major is 7. The install page documents a CDN route at esm.sh that serves the latest version, with a versioned example for major 6. The README's "Support" badge links GitHub Discussions, which the README calls its support chat; recorded as forum.
