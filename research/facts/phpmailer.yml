notes: >
  Status accepted under the wave 65 ruling that phpmailer sends a site's email. Criterion 1: a library a site or web app calls to send its mail; the README names WordPress, Drupal, Joomla and other projects that use it, which is a statement about those projects, not a field. Criterion 2: installed with Composer from Packagist (phpmailer/phpmailer), the route the README recommends; the zip download is a second route. Criterion 3: the README installation section. Criterion 4: the repository is not archived; the latest stable release v7.2.0 is dated 2026-11-07. The repository has no homepage; the API documentation at phpmailer.github.io/PHPMailer is linked from the README badge and the wiki is recorded as docs, so homepage is not recorded. The first public release is 0.90 on 2001-04-17 in the changelog, older than the oldest GitHub tag (phpmailer-2.0.3, 2008-11-11) and the oldest Packagist version (2012-12-04), so firstRelease is 2001. The README history says the project began on SourceForge in 2001 and moved to GitHub in 2013, and the composer.json authors are Marcus Bointon, Jim Jagielski, Andy Prevost and Brent R. Matzelle; no page names a current maintainer, so the maintainer is the PHPMailer GitHub organization. The README features list says the library has integrated SMTP support and sends without a local mail server, and that its error messages come in over 50 languages, which is the i18n entry. The README section "Why you might need it" points to Symfony Mailer, Laminas/Mail and ZetaComponents as other libraries; only Symfony Mailer has a candidate row, so only it is recorded as alternativeTo. The README mentions a sponsor, Smartmessages.net, that provides development time, and Tidelift enterprise support; both are sponsorship or paid support, not parent or paidEdition. The README says the LGPL 2.1 license comes with the GPL Cooperation Commitment, a commitment and not a license, so it is not recorded as a license entry. The Packagist total download figure is cumulative since listing. Stars and contributors belong to the single repository.
