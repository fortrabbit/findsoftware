notes: >
  The homepage footer and the LICENSE file both name Bufftail Ltd as the copyright holder; no page gives its country, so hqCountry is unknown. The homepage says Cofoundry can run integrated, decoupled or headless, but no page names a headless API style, so headlessApi stays unknown. The highest stable GitHub release is v0.13.2 (2026-02-13), so currentMajor is 0; the README's SemVer section says the 0.x line is early development. The installation page names the NuGet package Cofoundry.Web.Admin, and the 225,807 total downloads are that package's; the 279.0k figure in the candidate row belongs to a different package and is not used. The earliest GitHub release is v0.1.5 (2017-03-29). The NuGet release index for Cofoundry.Web.Admin lists a 1900 placeholder date, so no NuGet first upload is used. The docs' plugin list is the directory; the plugin count is not recorded. The install guide names SQL Server and .NET 10 as requirements.
  The homepage says custom entities are defined in code with APIs and CRUD management, and that plugins install through NuGet. The publishing guide asks for view pre-compilation to be switched off so that view files deploy, and it lists caching and data protection settings for multi-instance hosting. The install guide names plugins for images, background tasks and mail as essential.
