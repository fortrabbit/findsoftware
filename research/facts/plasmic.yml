notes: >
  Stub: the sources read do not settle whether the Plasmic Studio app can be self-hosted. The repository holds its code under platform/ (the wab directory, with a Dockerfile, licensed AGPL per the README), and its README says that platform/ is AGPL, but no setup guide for running the Studio was found in the README, the wab README, or the docs quickstart, which describes the hosted studio. The loader packages (npm install @plasmicapp/loader-nextjs) are installable and documented, so the record would list if the Studio path were documented or the loader counted as the installable part. Settle it by reading a self-hosting guide if the docs publish one. The npm figure is for @plasmicapp/loader-react, the core loader in this monorepo; the install docs name loader-nextjs. The repository has tags for individual @plasmicpkgs packages but no GitHub release, so the major, first and latest release dates are those of @plasmicapp/loader-react on npm. A second look for a self-hosting page (docs quickstart, docs index, README, wab README, pricing page) found none. The README calls Plasmic a visual builder for React and mentions a Headless API and codegen; neither is recorded as a field because the read pages do not name the API style.
