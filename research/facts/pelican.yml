notes: >
  The homepage links a developer named "Justin" (ramble.space/@justin) without a full name or role, so maintainer stays absent. Plugins are namespace packages installed with pip from the pelican-plugins GitHub organization; the legacy getpelican/pelican-plugins repository is being phased out, and community plugins carry the PyPI classifier "Framework :: Pelican :: Plugins". No plugin total is stated. pelicanthemes.com builds a theme preview but does not say who runs it, so no theme directory is recorded. The publish page documents rsync over SSH (also through make and invoke) and refers to the Tips page for GitHub Pages; FTP and S3 are not on that page. firstRelease uses the changelog because PyPI file uploads start at 3.5.0 in 2014. pypiDownloads is last-month downloads from pypistats.org. Coined fields: pypiName, importers (content import sources).
