notes: >
  The root page https://ceph.io answered 500 at check time, twice; the English home page at https://ceph.io/en/ answered 200 and is the homepage fact. The stable line is Umbrella 21.2.0, which the release index lists as initial release 2026-10-28; the release index is at https://docs.ceph.com/en/umbrella/releases/. The GitHub repository has no releases, only tags. The tag v21.2.0 does not exist on GitHub at check time, while v21.3.0 (tagged 2026-06-10) and v22.0.0 (tagged 2026-10-28) do. The release scheme says x.0.z is development, x.1.z release candidate and x.2.z stable, so v22.0.0 is development (tagged 2026-10-28, recorded as latestPrereleaseDate) and v21.3.0 is outside that scheme; the currentMajor follows the project's own release index, and a reviewer may decide differently. The oldest tag is v0.1 at a 2008 commit, but the release index starts with Argonaut (v0.48, tagged 2012-07-02), so firstRelease is 2012; a reviewer may prefer 2008. The Ceph Foundation is the non-profit that funds and hosts the documentation, under the Linux Foundation; the homepage footer copyright names The Linux Foundation, and no country or legal address for the foundation was on the pages read, so hqCountry is not recorded. The LGPL statement is the README's; the COPYING file lists GPL headers and BSD-3-clause and CC-BY-SA parts. The GitHub language is C++, and the daemons are compiled, so runtime is binary, from the Object Gateway daemon statement; cephadm needs Python 3, systemd and Podman or Docker, a deployment requirement noted here, not a runtime. The install page lists other methods (ceph-salt, Juju, Puppet, OpenNebula) and the cephadm docs; only the routes stated on the stable install page are recorded. The Ceph Dashboard is the built-in web management tool, implemented as a Ceph Manager Daemon module, and the Ceph documentation's install page names cephadm as recommended; the docs' navigation lists OAuth2 and SAML2 single sign-on. The Ceph Object Gateway is described as an HTTP server; the object storage interface is S3 and Swift compatible, and the block and file interfaces come from the homepage. The docs say cephadm supports Octopus and newer releases and Rook supports Nautilus and newer; those are compatibility statements, not runtime minimums. Container images for cephadm are not named on the pages read, so no docker or dockerPulls value is recorded. IBM tags (pre.ibm) on GitHub are not recorded; the IBM Storage Ceph product is not read.
