notes: >
  Boundary ruling: an HTTP client is accepted (the Faraday and Got ruling), so the CSV boundary state is not a record status. No homepage: the repository is the only project site, and the RubyGems homepage is the repository. The README Install section gives the gem install command under its Install heading, which is the installMethod quote. The MIT-LICENSE copyright line names John Nunemaker; the gemspec authors also list Sandro Turriate, kept here only in notes. The gemspec summary is "Makes http fun! Also, makes consuming restful web services dead easy." The README describes an httparty executable that prints a response and can format it as XML or JSON; a command-line tool is no runsAs statement, so runsAs stays out. The docs README says that when a request sets Accept-Encoding, the br (Brotli), compress (LZW) and zstd content encodings are decompressed only with separate gems (brotli, ruby-lzws, zstd-ruby). The docs README says a response with an application/json content type is parsed into Ruby objects such as a hash or array, and that the format option suppresses this. The README shows a class that includes HTTParty, sets base_uri and calls get on its own paths, and a response that exposes body, code, message and headers. The README says "Ruby 2.7.0 or higher" and the gemspec at the latest release tag requires 2.7.0 or higher. Stars and contributors are for the repository. The RubyGems total counts downloads since the gem was first uploaded; its first upload, 0.1.0, is from 2009. The GitHub release list is the source for currentMajor; the 0.x line has no major 1 yet.
