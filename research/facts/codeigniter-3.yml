notes: |
  The download page calls CodeIgniter 3 the legacy version, in maintenance with mostly security updates, and names CodeIgniter 4 as the latest version. The CSV row says superseded by CodeIgniter 4; no page of this project states CodeIgniter 4 as its successor, so successorOf is not recorded. The homepage at codeigniter.com presents CodeIgniter 4; the CodeIgniter 3 documentation sits under /userguide3/. The 3.1.13 composer.json requires PHP >=5.3.7 and the requirements page says 5.6 or newer is recommended and 5.3.7 should work but is not advised; runtimeMin follows the download page. The license figure is the MIT license from the repository API, and the homepage footer says the project is released under the MIT open source licence. The repository's develop branch is in-development code; the latest stable is the 3.1.13 tag. Packagist codeigniter/framework is the CodeIgniter 3 package; the CodeIgniter 4 package is codeigniter4/framework and has its own record. The repository was last pushed 2024-07-15. No end-of-life entry on endoflife.date. Coined field none.
