notes: >
  Hosted-service (criterion 2 waived): Heartcore is hosted in the Cloud and the FAQ offers no self-hosted install, so selfHostOption records only the on-premise content option. The homepage says Heartcore is "built on top of an open-source CMS that powers over 730,000 websites"; that count describes the open-source base and is not recorded for Heartcore. The GitHub organization umbraco holds the Umbraco CMS code, and nothing from it is recorded for Heartcore; the Umbraco CMS record is the one that holds its license and figures. The pricing page shows euro plan prices and plan limits, which are not recorded. The docs state that the Heartcore code base is closed source and that other packages cannot be installed in it; no license field is recorded for it. The docs are the Heartcore section of docs.umbraco.com. Azure AD and other identity providers are not possible on the Cloud platforms per the FAQ, which is recorded as sso. The terms name Danish governing law, which is not recorded as the company's country; the country comes from the about page.
