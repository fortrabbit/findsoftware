notes: >
  The project states no legal entity or single maintainer: the README credits several people with the Maintenance contribution, and the site says it is an open source project that encourages the community to contribute, so the maintainer is recorded as the community; a reviewer decides. Two Python minimums conflict: the docs home page and the render-engine.org page say 3.10 or greater, while the README and the repository pyproject.toml on main say 3.11, and PyPI's requires_python for the latest release is >=3.10; runtimeMin is recorded at 3.10 from PyPI, the registry statement, and the README and main-branch pyproject value of 3.11 stays out. currentMajor is not recorded: the project uses calendar versions (2026.9.1), which have no major. The GitHub homepage field and the readthedocs docs site both belong to the project; the own site render-engine.org is recorded as the homepage. The CLI is a separate package, render-engine-cli, which the README says installs both modules; the CLI pages on readthedocs were not found at /cli/. The PyPI JSON does not carry a download figure, so pypiDownloads is unknown. The license file is not at the repository root (LICENSE returns 404 on main); the license is recorded from the API. The GitHub repository was created in 2019, and firstRelease is the oldest stable tag, 2023.10.1, per the rule for releases. The Discord link is in the README.
