notes: >
  Status is accepted per the CSV; the repository is not archived and the project states no end. Highest stable GitHub release is fess-15.9.0 (2026-10-15), so currentMajor is 15. firstRelease is 2009 from the project's news page ("2009-09-10 Fess 1.0.0 Released"), which is older than the earliest GitHub release (fess-10.0.0-beta1, 2015-11-26) and the repository (2013). The two pages disagree on bundling: the installation guide says "Fess does not bundle a search engine. Every installation method below needs a separate OpenSearch server.", while the README says "The Docker images bundle it". Both are recorded as their own statements in notes; the Docker compose files in the guide run OpenSearch as a separate service. The homepage lists "N2 Search" under "Commercial version" with dedicated and professional support; the N2SM product page names it N2 Search and describes it as a Java web application on OpenSearch, and the news page calls it "N2 Search (Fess)". The paidEdition fact rests on the homepage table and the news wording, and the reviewer decides whether a support-tier table counts as an edition. The N2SM product page is https://www.n2sm.net/en/products/n2search.html and is not recorded as pricingPage. The company is CodeLibs, Inc. (codelibs.co footer, Yokohama, Japan); the codelibs.org footer names the same company and the homepage footer says "CodeLibs, Inc.". The README lists SSO as LDAP, OpenID Connect, SAML, SPNEGO and Microsoft Entra ID; the sso field records all five methods named in the README list. The runtime quote is the README line about running on any platform with a Java runtime. The Java minimum is 21 for the ZIP, RPM and DEB packages, and the installation guide lists Java 21 among its prerequisites. The Docker image is ghcr.io/codelibs/fess (a coined docker kind, kept here from the Docker install page). contentStore records the OpenSearch index named by the homepage, since Fess keeps the crawled index in OpenSearch.
