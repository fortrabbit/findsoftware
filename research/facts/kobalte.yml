notes: >
  Monorepo: the repository holds @kobalte/core, @kobalte/tailwindcss and @kobalte/vanilla-extract, and the figures are for @kobalte/core, the package the install docs name. The highest stable @kobalte/core release is 0.13.14 (2026-09-07), so currentMajor is 0. The newest prerelease is @kobalte/core 2.0.0-alpha.4 (2026-10-20), which is newer than the stable release and is recorded as latestPrereleaseDate. The @kobalte/core package declares solid-js ^1.9.8 as a peer dependency. The README's Discord link (discord.com/invite/solidjs) is the SolidJS community, so no discord is recorded. The README names Fabien Marie-Louise as creator; the LICENSE.md copyright line names a GitHub handle with an email address, which is not recorded. The npm first upload is 0.1.0 (2023-01-04), and the repository was created 2022-10-28. The homepage and docs live on kobalte.dev, which serves the documentation. httpArchiveSites: Kobalte is not in the HTTP Archive technologies list.
  The sibling packages style the component states: @kobalte/tailwindcss is a Tailwind CSS plugin and @kobalte/vanilla-extract is a Vanilla Extract plugin, both keyed on the data attributes the components set.
