notes: >
  Hosted service: the pages say the product runs in the browser with no local install, and no source or distributable was found; a GitHub search finds sample blogs and user repositories that use JekyllPad, not the software, so criterion 2 fails for an installable record and the status is hosted-service, not accepted as the CSV row had it. The homepage lists GitHub Pages, Jekyll, Astro, Hugo, Eleventy and Gatsby as supported; no field in the starter list covers that, so it is not recorded. The homepage says "No backend servers"; its client-side claim is not recorded as a field. The counters on the homepage ("2,058+ active creators", "0+ Content Created", "0+ Users Joined") are the page's own figures without a date and are not recorded as reportedInstalls. The footer copyright begins 2023, which is not a release date, so firstRelease is unknown. The page has no pricing page link; the free tier is named in the comparison table only. The x link in the footer is on the name Arman. The homepage comparison table names Forestry/Tina, Netlify CMS and Prose.io. The homepage calls the project independent and not affiliated with GitHub or the static site generators named.
