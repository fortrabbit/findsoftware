notes: >
  The record is foliojs/pdfkit, the package the README names for npm. The homepage pdfkit.org answers over https as well as http, so the https address is recorded. The LICENSE copyright line names Devon Govett; the repository owner is the foliojs organization. The latest stable release is v0.20.2 from 2026-08-30, so currentMajor is the 0 of the 0.x line; the minor line 0.20 stays here. The npm first upload is 0.1.0 from 2011-07-11, which is older than the GitHub releases and sets firstRelease. The README's browser section names three routes: Browserify and webpack examples, and a prebuilt pdfkit.standalone.js from the releases; the two bundler examples are not installMethod entries. The README describes the API as chainable, with text, images, vector paths, tables, annotations, outlines, AcroForms, encryption and accessibility tagging as features. Bundling: the README's Bundling for Node section says the Node build loads the metrics of the standard fonts on first use from a standard-fonts directory next to the built file, and PDF/A output reads the sRGB profile from a data directory next to it; a bundle that inlines pdfkit must keep the standard-font metrics and the sRGB profile beside it, or register the fonts in code. The README describes the browser build as having no file system access, so files are registered as data. The README pipes output to a file or an HTTP response, and in the browser collects the output chunks into a Blob for display or download.
