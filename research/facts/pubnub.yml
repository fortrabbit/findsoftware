notes: >
  Hosted-service record for the PubNub platform; no page offers a self-install (a search of the homepage, pricing, security, company, terms and docs pages finds none), so the status stays hosted-service. The GitHub organization pubnub hosts the SDKs: the javascript repository, its license, its stars and the npm pubnub package (about 156.8 thousand weekly downloads, per the candidates row) are SDK data and are not recorded here. The terms say "PubNub Integrations" means open source code libraries; the terms do not make the platform open source. Headquarters: the company page lists a San Francisco office at 95 Third Street, San Francisco, CA 94103, and a London office; the page does not say which is the headquarters or the registered seat of PubNub Inc., and the terms choose California law and San Francisco courts; hqCountry is left unknown for the reviewer to decide. The homepage says "14 years of real-time ops since 2012" and the footer reads "© 2012 - 2026 PubNub Inc."; founding year is not a release date, so firstRelease is not recorded. The homepage claims SOC 2, SOC 3, HIPAA, GDPR and CCPA, and the pricing page lists SOC 2 Type 2, ISO 27001 and BAA signing; these compliance statements go to notes. The homepage states a 99.999% uptime SLA, 50+ SDKs and 1B+ active devices; the SDK count and the uptime claim go to notes. The pricing page lists paid tiers (Starter, Pro, Platform Pro, and custom Enterprise pricing) without recording prices. The pricing comparison table lists SAML SSO in the Security and Compliance section without a tier mapping; that table row is a label, not a sentence, so the sso fact quotes the account setup page instead. The pricing page's "Granular permissions and role-based access" card is the userRoles source. The compare pages for Pusher, Ably and Socket.IO give the alternativeTo entries; the Supabase page compares a Supabase feature (Realtime) and is not recorded. The homepage links LinkedIn and YouTube; those links are not recorded fields. The HTTP Archive technology list does not include PubNub, so no httpArchiveSites figure is recorded.
