notes: >
  The README states the project is discontinued and the GitHub repository is archived, so the status is discontinued. The repository has no homepage and the README names no project site, so no homepage is recorded. The maintainer is recorded as Spotify, the name the README gives; no page or license gives a legal form, and the LICENSE file carries no copyright line. The author in package.json is Jonathan Pettersson; the CONTRIBUTING file points forks at jpettersson/lingon. The install docs name lingon-cli, a separate npm package from another repository (jpettersson/lingon-cli, 3 downloads in the last week); npmName is the core package lingon, the package.json name of this repository. The npm package lingon matches the repository's latest release 2.4.2 (2017-05-23). The package.json engines field says node ">= 0.9"; the minimum is recorded as 0.9. The build command is lingon build (README, section Lingon tasks). The first GitHub release is 1.2.0 (2014-08-08). The README's Angular.js use is the project's own statement and is not a field. The usage documentation describes a built static output with a static server option; the output is recorded as static only from that statement.
