notes: >
  The CSV row lists the language as blank and the repository language as CSS. The repository holds the documentation site, its templates and the license; the engine is not in it, and the install commands name npm, yarn and the dotnet tool, so the implementation language is not recorded. sourcePublic is false because the repository holds no engine source; the npm package ships a bin named "retype.js", which the reviewer may weigh against that. The license is a proprietary agreement: the Free License "may contain restricted functionality", and a Retype Key removes the restrictions; the license is recorded as the agreement's own name, not an SPDX id, and GitHub reports it as NOASSERTION. The homepage is retype.com; the pricing page is retype.com/pro/ and no prices are recorded. The GitHub description says "Made in Canada"; that is a statement of origin, not of the company's headquarters, so hqCountry is not recorded. The npm package named by the install docs is retypeapp; it is not a create-* scaffolder. The latest prerelease v4.7.0-preview (2026-06-08) is newer than v4.6.0 (2026-05-25). Criterion 2 holds: the installation guide lists npm, yarn and dotnet tool installs of retypeapp, and the npm package (a bin named retype.js, license "SEE LICENSE IN LICENSE") installs the CLI. The agreement says the Free License permits use "for Your internal evaluation, review, and production purposes" and that without a Retype Key the Software "may contain restricted functionality". Field kinds coined here: none.
