notes: |-
  The homepage is read over https (https://prose.io answers 200); the repository lists http://prose.io, which is not linked. The deployment page says Prose.io is hosted on GitHub Pages and that Prose relies on a Gatekeeper to authenticate with the GitHub API; Gatekeeper is a separate project (github.com/prose/gatekeeper) and is not recorded as a runsAs value of this record. The hosted version at prose.io is the project's own site next to the open source code, and the deployment page describes it as hosted on GitHub Pages; no prices are on any page read. The repository's GitHub releases are v1.1.3, v1.1.4 and v1.1.5 (2014); package.json on master says version 1.2.0-alpha.0 with no GitHub release for it, so that alpha is not recorded. The last push and last commit on the default branch is 2024-02-21. The README asks for new maintainers, which is stated, and no page names a maintainer apart from the LICENSE copyright line. The README names an IRC channel (#prose on freenode), which has no field here. The categories follow the project's own words "A Content Editor for GitHub" and "managing content on GitHub"; the project's README also calls its sites CMS-free, so the git-cms category is the project's framing of the same tool and not a separate claim.
   The README is read over its rendered page; the Prerequisites list in CONTRIBUTING.md names node.js for building and running the project locally, which is the basis for runtime. The contributing guide manages interface translations on Transifex, which is not a statement about multilingual content, so i18n is unknown. The deployment page says work on supporting the GitLab API is in progress.
