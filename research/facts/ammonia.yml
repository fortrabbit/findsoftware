notes: >
  The project has no site of its own: the crates.io homepage field is empty and the GitHub homepage is empty, so homepage is not recorded and docs points to docs.rs. The README and the crate docs describe Ammonia as a sanitizer; html5ever is the parser it uses, and "uses" is a dependency statement, so no basedOn is recorded. The LICENSE-MIT copyright line names "The ammonia Developers" for 2015-2022; the Cargo.toml authors field names Michael Howell, and the docs.rs owner list names notriddle, but neither is a legal entity on a page of the project, so the copyright line is the maintainer. The GitHub organization rust-ammonia is an organization account. The crates.io 90-day download figure is 7036305 (recent_downloads, read 2026-11-04); the total is recorded. The GitHub release list holds backport tags on older majors (v3.3.4) and one tag spelled v.4.1.5; the current major is 4 from v4.2.4. The contributors count excludes anonymous contributors. The release v4.2.4 is the newest stable release and the Cargo.toml at that tag sets rust-version 1.85; the README badge says the same. The crates.io first version is 0.1.0 dated 2015-09-04.
