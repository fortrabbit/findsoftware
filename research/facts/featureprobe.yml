notes: >
  The CSV homepage featureprobe.com answers 200 over plain http and refuses the https connection, so it is not linked. featureprobe.io resolves to an unrelated site (a redirect to beautifulhotels.co) and is not the project's site. The GitHub repository names featureprobe.github.io/FeatureProbe as its homepage, and that documentation site is used as homepage and docs. The GitHub Pages site the repository names counts as the project's own site. Activity: the last release is 2.7.0 (2023-09-20); the default branch's last commit is 2024-08-15 (a dependency bump); the docs page states "Last updated on Dec 28, 2022"; the GitHub API reports a repository push on 2026-06-01 that is not on the default branch's commit list read here. Neither the README nor the docs says the project has ended or is unmaintained, so no discontinued signal is recorded. Release age decides nothing under criterion 4, so the record stays accepted. The README describes the components: a Java API (pom.xml, Spring Boot images), a Rust server (Cargo.toml), a React admin UI and an analysis service, all shipped as Docker images; no single runtime is recorded because the install needs Docker only. The compose file runs a MariaDB 10.5.8 image while the JDBC URL names MySQL, so databases records mysql from the connection string. The README names a Gitee mirror (gitee.com/featureprobe) for Chinese users; it is not recorded. The docs state a Slack invite and a Twitter account; the Slack invite is taken from the docs homepage. The README states the project was used for over five years inside a company of 5000+ developers; the company is not named, so no company fact is recorded.
