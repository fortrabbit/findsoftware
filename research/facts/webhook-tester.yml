notes: >
  The repository names https://wh.tarampamp.am as its homepage and calls it the demo; the demo answers over https with the WebHook Tester application, and the README sentence naming the demo is the homepage fact. The demo is a limited instance that the README says may be unavailable, not a hosted offering of the software, so no hostedOffering is recorded. The CSV row and GitHub agree on MIT; the README and LICENSE file (copyright Paramtamtam) carry the same license. The GitHub owner profile is a user account whose display name carries other characters; the LICENSE line is the maintainer name. The README names the memory, Redis and FS storage drivers and the Redis pub/sub driver; the Redis dependency is required only for multiple instances behind a load balancer, and Redis is not in the databases vocabulary, so no databases fact is recorded. The README's ngrok tunnel driver exposes a local instance to the internet; it is a feature, not an alternativeTo. The README's "AI Agent Instructions" section points to an AGENTS.md file in the repository; that file is not a source for this record and was not followed. The Docker Hub repository tarampampam/webhook-tester is the mirror the README names beside ghcr.io, and its pull count is the dockerPulls figure. The Helm chart is named on ArtifactHUB; its maintainer was not checked, so the helm installMethod is recorded on the README sentence alone and a reviewer may decide it. Versions: the release list holds 23 releases, the oldest is v0.4.2 (commit dated 2022-05-12) and the highest stable is v2.3.0 (2026-04-13); the v2.x line is current, and prereleases (v2.0.0-alpha, v2.1.0-rc) are not recorded as dates. The alternativeTo target webhook-site is the record for webhook.site, which is also researched in this wave. The README's "Consider it a free and self-hosted alternative to webhook.site" is the project's own statement. Contributors is the page number of the rel="last" link on the contributors endpoint with per_page=1.
