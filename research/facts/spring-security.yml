notes: >
  Status accepted: the repository is public and not archived, 7.1.2 (2026-10-22) is the highest stable release, and the reference documentation gives the Maven and Gradle route (criterion 2 and 3). The CSV homepage is http://spring.io/projects/spring-security; the same page answers over https, so the https address is recorded. currentMajor is 7 from 7.1.2, the highest stable GitHub release. The newest prerelease, 7.2.0-RC1 (2026-10-22T22:22:18Z), is newer than 7.1.2 (22:21:55Z) and is recorded as latestPrereleaseDate. firstRelease is 2006 from the 1.0.0 tag (commit 2006-05-30), the oldest tag in the repository. The repository's README says "Spring Security 6.0 requires Spring 6.0 as a minimum and also requires Java 17"; that statement is about version 6.0, so runtimeMin takes the current reference documentation sentence instead. The reference documentation says Spring Security builds against Spring Framework 7.0.10; a build dependency is not basedOn, so no basedOn is recorded, and the README's tagline names Spring IO and Spring-based applications, which is not one record id. The maintainer is the legal name in the spring.io legal line (Broadcom Inc.); the Spring Data JPA reference footer names VMware, Inc. in its copyright line; the LICENSE file has no copyright line. The sso values come from the SAML 2 section, the servlet authentication mechanisms list (OAuth 2.0 Login with OpenID Connect) and the LDAP authentication page; the same list also names CAS, JAAS, X509 and pre-authentication, which are not recorded. The getting-started page names Maven artifacts, Gradle and Spring Initializr (start.spring.io) as ways to add it; Maven and Gradle use the same artifacts and are one route. Questions go to Stack Overflow with the spring-security tag, per the community page. The mavenCoordinates value is the spring-security-web artifact that the getting-started page names for a minimal set of dependencies; the BOM is spring-security-bom. Spring Security's stars and contributors belong to the spring-security repository, a single-module repository.
