notes: >
  Name is Vrite, which the README text, homepage and docs use; the README names Andesine only as the codename of the v2 rewrite on the default branch. The stable product on the main branch, the homepage and the docs. The repository's default branch andesine is a WIP v2 rewrite (its README says so) and the name Andesine is that branch's codename; the CSV name "Andesine (Vrite)" is a reviewer decision. The repository was renamed: github.com/vriteio/vrite redirects to vriteio/andesine, and the self-hosting docs still link the old path. The repository field, stars, contributors and dates are read from the andesine API record, which is the default-branch view of the same repository. The repository's GitHub license field reads NOASSERTION; the LICENSE file says the default is AGPL-3.0, with MIT and Elastic License 2.0 for files that a licensing file or file header designates, so three license entries are recorded and licenseModel is open-source as the homepage states it; the import derives the model from the three license statements and may read them as open-core. Releases: the stable releases run from v0.2.0 (2023-09-13) to v0.4.4 (2024-07-05); the v2023.x releases are beta prereleases, the newest v2023.8.18-beta (2023-08-19) is older than the latest release, so latestPrereleaseDate is left out. firstRelease is 2023 from the oldest release, a beta. currentMajor 0 comes from the highest stable release; a reviewer may decide that a 0.x line with no release since 2024 needs another reading. Runtime and minimum are from the engines field of package.json on the main branch; the docker-compose.yml on main runs the api, assets, collaboration and app services as images, with MongoDB, Redis and MinIO (S3-compatible) and an optional Weaviate. runsAs always-on rests on the configuration page calling them services reachable at subdomains and on the docs starting the stack with docker compose up; no page uses the words always-on. Redis is required by .env.example (REDIS_URL) and is not recorded as a database field. Semantic search and AI question answering need Weaviate, and AI answers need OpenAI credentials, both optional and both in the self-hosting configuration page; they are not recorded as fields. Git sync needs a GitHub App and GitHub sign-in needs a GitHub OAuth app; both are optional. The pricing page lists Cloud plans (Personal, Team, Enterprise) with prices and API request limits; these are Cloud plans, which the rules do not count as a paid edition, and no prices or plan limits are recorded. The docs say the Vrite Extension System is in Beta and limited to first-party extensions available only through Vrite Cloud. BILLING_ENABLED in the README (on the andesine default branch) gates the Stripe billing; with billing disabled, the README says all Pro features remain available, so no paidEdition is recorded. The maintainer is Vrite, Inc. from the LICENSE copyright line; the homepage footer uses the same name. The terms of service name no country or registered address, so hqCountry is unknown. The homepage's "internalization" wording (sic) for content variants is recorded as i18n.
