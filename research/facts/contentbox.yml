notes: >
  The GitHub licence field reads NOASSERTION because license.txt is not in the form GitHub recognises; the README and the product page both state Apache License 2.0, so the license is recorded from those. The product page says "Open source and commercial versions available" beside a feature list, but names no feature the open version lacks, and the downloads section lists versions and a nightly build rather than paid editions, so no paidEdition is recorded. The homepage lists HypersonicSQL, which is not in the database vocabulary, so it is left out of databases. The product page says the software can be deployed to any ColdFusion/CFML engine, so language is other: CFML is not in the language vocabulary. The license.txt copyright line names Luis Majano and Ortus Solutions, Corp; the maintainer is recorded as the company, and the contact page places it in Houston, Texas. The forum entry is the Ortus community page named in the README. The release major and date come from the GitHub release v6.3.3 (2026-09-18), the highest stable release. The first release year comes from the oldest tag, v1.0.1 (2012-02-09). The repository was last pushed 2026-10-16; not archived; no end statement found.
