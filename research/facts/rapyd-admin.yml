notes: >
  The scope row was widened from boundary on 2026-10-19: this is a Composer package that adds an admin panel to a Laravel application, so it meets criterion 1 as a library a web creator adds to a web app. The repository publishes no GitHub releases (releases/latest answers 404), so the current major and the last release date come from the Packagist package, zofe/rapyd-admin, whose latest stable version is v9.22.0. The README says the package runs in a Laravel application; no page states how a live site runs it, so runsAs stays unknown. The README and LICENSE name zofe, and the LICENSE copyright line also carries an email address, which is not recorded. The composer.json names Felice Ostuni as the author, recorded as maintainer. The README names the paid or planned modules zofe/shop-module, zofe/payments-module and zofe/ai-module as separate Composer packages, and says that premium modules and themes "will be distributed through a private Composer repository for subscribers"; that is a plan, so paidEdition stays unknown. The Packagist figures come from zofe/rapyd-admin, the package the install line names. The rapyd.dev site is the project's own demo and documentation site.
