notes: >
  Latest stable release v0.167.5 (2026-11-02); the 0.x line is pre-1.0, so currentMajor is 0 and the minor line stays out. GitHub reports the repository license as NOASSERTION because of the mixed MIT and ee-directory licenses; the README and LICENSE file are recorded as two statements. Reviewer decision: the paid tier lives in the ee directories under an enterprise license; the pricing page lists tiers from Free to Enterprise, and the SAML SSO and LDAP features it names sit in paid tiers. Recorded: paidEdition from the self-hosting licensing page, and sso and userRoles from the pricing page. The self-hosting FAQ and the hardware requirements page name PostgreSQL and Redis; the older MongoDB backend has a migration guide (Migrate Mongo to PostgreSQL), so MongoDB is not recorded as a current database. The compare page "Infisical vs. HashiCorp Vault" names HashiCorp Vault, a candidate with id vault, so alternativeTo records it. The SDKs cover JavaScript, Python, Java, C#, C++, Rust, Go, PHP and Ruby (docs SDK overview). Infisical's Enterprise license check contacts the Infisical license server; the self-hosting page lists two IP addresses for that outbound connection (not recorded). No runtime is stated on the pages read, so runtime and runsAs stay absent. The x link comes from the README header row. Contributors counted across all pages.
