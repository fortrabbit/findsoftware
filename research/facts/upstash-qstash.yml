notes: >
  Hosted service: QStash runs only on Upstash's infrastructure, and the QStash pages read name no self-install route, so the record is hosted-service under criterion 2. Criterion 1 holds because the docs describe publishing messages over HTTP so that QStash calls an endpoint of a site or app, the wiring the brief names. The SDK repository upstash/qstash-js (MIT, 272 stars, npm @upstash/qstash) is the client library and is not recorded as this service's repository; its license, stars and npm figure stay here in notes, per the hosted-service rule. The candidates row's 381.6k weekly npm figure is not recorded. Upstash Workflow is a separate product with its own docs (/docs/workflow/getstarted), not part of this record. The docs also describe a QStash CLI development server that runs locally, keeps data in memory and is for testing during development (howto/local-development); it is no production self-install route, so the record stays hosted-service and selfHostOption is unknown. The compare page "How QStash compares to BullMQ, Kafka, Amazon SQS, Amazon SNS, and Google Pub/Sub" names five products with no record ids here, so alternativeTo is unknown. The API is HTTP: the docs describe publishing over HTTP and the sidebar lists a REST section, but no API-style sentence names REST, so no apiStyles value is recorded. The plans offer a free tier with 1,000 messages a day, recorded here without prices; it is a plan feature, not a field. Prod Pack and Enterprise are plan tiers, so no paidEdition is recorded. The pricing page lists SAML Single Sign-On under Enterprise; the Enterprise page says it "is available upon request for Enterprise customers". The message-queue category maps to database in the import's categoryMap, so a reviewer should decide whether the category stays. Maintainer is Upstash, Inc., a Delaware corporation, per the terms PDF (no quote kept for a PDF source); the homepage footer says "Based in California", which names a state, not a country, so hqCountry is unknown. No release, changelog or repository release date is recorded: the changelog's oldest visible entry is October 2023, which does not establish a first release, so firstRelease is unknown. The compare page says QStash delivers messages with retries, delays, ordering, rate limits and a dead letter queue.
