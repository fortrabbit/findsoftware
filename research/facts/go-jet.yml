notes: >
  Jet is a SQL builder and not an ORM, as its README states; the README says so in a note under the introduction. The project has no website of its own: the README and the documentation link to the GitHub wiki, so homepage is left out and the wiki is the docs fact. The README names PostgreSQL, MySQL and SQLite as supported engines and says CockroachDB and MariaDB are tested and known to work through their wire protocols; those two are left out of databases. The library is added to a go.mod project with go get, and the jet generator is installed with go install or built from source; the generator reads a running database and writes Go packages; the README gives no process model for the generator and the library has none, so runsAs is left out. The generator's default database drivers are named in the README's Dependencies section and are not recorded. The first GitHub release is v1.0.0 (2019-07-23), and the repository was created in 2019. The LICENSE file is the Apache License 2.0 text without a copyright line; the copyright holder comes from the README. The repository owner is the go-jet user account, so maintainerType follows the user owner. The go.mod at v2.16.1 states go 1.24.0, and the README says version 1.24+ is required. The Go module has no download figure, so none is recorded.
