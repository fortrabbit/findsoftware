notes: >
  Framework, so contentStore, databases, adminUi and headlessApi do not apply. renderingModes streaming covers streaming and Partial Prerendering, which the self-hosting guide says need end-to-end streaming support; ISR and server features are not available in a static export. Next.js has two routers (App Router, Pages Router) documented separately; facts here come from the App Router docs. Vercel's about page does not state a headquarters, so hqCountry is absent. The site exposes llms.txt and markdown versions of docs pages. contributors is the GitHub API count including anonymous contributors; npmWeeklyDownloads covers 2026-10-10 to 2026-10-16. A templates gallery exists on vercel.com but was not read.
