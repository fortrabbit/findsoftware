notes: >
  The homepage states the framework is MIT licensed; the license is recorded from the GitHub API. The homepage states the project is maintained by Vercel. Vercel also offers a hosting platform: https://vercel.com/docs/frameworks/full-stack/nextjs says "Vercel is the native Next.js platform". No plan or price is recorded. The npm package next has an earlier 2011 history under another project, so no firstRelease is taken from the registry. The install page states a minimum Node.js version of 20.9, recorded as major 20. The npmWeeklyDownloads figure covers the week from 2026-10-12 to 2026-10-18. The GitHub release and the npm latest dist-tag both point at 16.4.2; the latestReleaseDate is the GitHub release date.
