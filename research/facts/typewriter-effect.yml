notes: >
  Accepted: a browser library that a page adds with a script tag or an npm import; the repository is the one the npm package names, and the npm homepage points at the GitHub README, so no project site is recorded. The package name is typewriter-effect; the repository and README title are TypewriterJS, so the name follows the README title. The npm package includes the core build (dist/core.js) and a React component; the README says the React component is a client component since 3.1.0 with a 'use client' directive, and that it can be imported from a server component. The React binding is not recorded as basedOn: the README says "This includes a React component which can be used within your project", a package part rather than a sentence that the project is a binding of React, and the npm keywords list react terms, which are discovery words only. The README's command line tool renders a typewriter effect in a terminal or as a GIF; building the project, running its tests and the command line tool need Node.js 24 or newer, and the README says sites and apps that install the package can use any Node.js version, so no runtime or runtimeMin is recorded. The README's browser support section lists browser versions (Baseline widely available), a support list rather than a runsAs statement, so runsAs is not recorded. The GitHub repository has no release objects; the latest version is the npm latest 3.3.0, which the registry dates to 2026-10-22. The tags in the repository run to v2.12.1, below the registry's major 3, so the registry major is used. The first tag v1.0.0 has a commit dated 2017-02-21, before the first npm upload (2018-08-27), so firstRelease is 2017. The MIT copyright holder is Tameem Safi (2016-2017); no other holder or legal entity is named. The README links a JSFiddle example and a CodeSandbox example; those are demos, not records. The README's method list names typeString, pasteString, deleteChars, deleteAll, pauseFor and callFunction, which queue as events that start runs; the React component passes an onInit callback the typewriter instance. Strings that contain HTML tags are added as HTML elements unless parseHTML is false, and the Security section says such strings and the cursor option are added with innerHTML.
