notes: >
  No repository is recorded. The GitHub organization Constructor-io publishes client libraries and UI libraries for the service, which the docs call open source, including the JavaScript client on npm as @constructor-io/constructorio-client-javascript; hosted-service records take nothing from SDK or client repositories, so the CSV's npm and last-release figures are not used. The homepage in the CSV is kept as constructor.com. The about page says Constructor was founded in 2015 by Eli Finkelshteyn and Dan McCormick; no software release is dated from it, so firstRelease stays out. The privacy policy names the company "Constructor Corporation" and the copyright notice on the terms names "Constructor.io, Inc."; the terms preamble "Constructor.io Corporation" is recorded as the maintainer. hqCountry is not recorded: the only San Francisco address on the terms is the designated copyright agent address, and neither the terms nor the privacy policy gives the company's own address (the terms are governed by California law). Variants of the legal name: "Constructor.io Corporation" in the terms preamble (recorded), "Constructor Corporation" in the privacy policy, "Constructor.io, Inc." at the copyright agent. The links on the homepage are X, Facebook, Instagram and LinkedIn; LinkedIn (linkedin.com/company/constructor-io) has no field. The older docs-beta.constructor.io address is not recorded; the docs redirect page says the documentation is now a single platform at docs.constructor.com. The Gartner Magic Quadrant leader statement on the homepage is not recorded as a field. The FAQ on API throttling and on admin and non-admin privileges shows only its questions in the page text, so no answer is visible: apiLimits and userRoles stay out. The regions statement on the security page names cloud availability zones and multiple geographic regions, with no named data region, so regions stays out. Terms and conditions refer to a Proof Schedule and beta releases as free access subscriptions; these are not a free tier and are not recorded as freeTier. The homepage's Book a Demo link is the only sales path found; no pricing page exists at constructor.com/pricing, which returned 404.
