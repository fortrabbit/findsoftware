notes: >
  Accepted on criterion 1: the project's own homepage states that the tracking script is added to a site, and the README shows the one-line script tag and an npm package for the browser library. The README says "Self host with Docker" and "Fully self-hostable"; the cloud terms (litlyx.com/terms-of-service) say they apply "solely to Litlyx Analytics Cloud" and not to the self-hosted product. Maintainer: the LICENSE file has no copyright line, so the company named on the terms and privacy pages is recorded: Litlyx Srl, P.iva 17814721001, REA RM-1743194. The footer address reads "Viale Tirreno, 187, 00141 Rome" and does not name the country; No country is written, so hqCountry is not recorded. Self-hosting: the README says "Litlyx self hosting gives you the freedom to use the full platform for free. If you want to scale to more client seats, you can choose one of our lifetime plans available in the pricing section." The pricing page read at fetch time shows no lifetime or self-hosted plan, so no paidEdition is recorded; the reviewer decides whether the README statement is one. Releases: all tags are v0.0.x (19 releases, the latest 2025-12-01); currentMajor is recorded as 0. The repository has no release after 2025-12-01 while the default branch was pushed 2025-12-03, and the record stays inside the four-year window. Discord: the README and homepage name two different invite links; the homepage and docs link discord.com/invite/Uq378Zvem3, which is recorded, and the README's discord.gg/9cQykjsmWX is not. The docs link a LinkedIn company page. The README names a WordPress integration (a third-party plugin injects the script) and Shopify, GTM and Framer on the homepage; these are integrations, not recorded as fields. The compose file names MongoDB and Redis as the services the self-hosted dashboard runs with; no Docker Hub image name is stated in the README, so dockerPulls is unknown. The npm figure is for litlyx-js, the browser library installed with "npm i litlyx-js" (the README's install route for the library), not the self-hosted dashboard. The homepage footer and the blog's comparison pages name Google Analytics, Mixpanel, Matomo and PostHog; no record file exists for Google Analytics or Mixpanel; posthog, matomo, plausible and umami are recorded from the project's own vs pages. The docs hold an OpenAPI spec for an analytics API that returns raw visit data, recorded as headlessApi. Coined kinds left in notes: cookieless tracking claims, data residency in the EU, GDPR claims, and the tracking script's data-host and data-port options for self-hosted instances.
