notes: >
  The homepage https://oscarcommerce.com answers over HTTPS and lists extensions such as Oscar-api and Oscar-elasticsearch as separate projects; they are not recorded here. The record name is Oscar, as the docs title and text call it; the PyPI package is django-oscar, the one the install docs name. The LICENSE copyright line gives the legal name Tangent Communications PLC, recorded as maintainer; the company's location is not stated on the pages read. The platform page says PostgreSQL is officially supported, MariaDB, Oracle and SQLite (development only) are likely to work without official support, MySQL is not supported, and Microsoft Windows is not supported. The deployment guide says Oscar is a set of Django apps with no special deployment requirements, so runsAs is not recorded. The oldest PyPI upload is 0.1-beta-0 (2011); firstRelease is the oldest stable upload, 0.1 in January 2012, older than the 14 GitHub releases that start in 2019. runtimeMin is the requires_python of the latest PyPI release. pypiDownloads is last_month from pypistats.org, as PyPI's JSON no longer carries counts.
