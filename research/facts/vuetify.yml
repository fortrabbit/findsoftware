notes: >
  The live site at vuetifyjs.com is a JavaScript shell with no body text, so the README and the documentation source in the same repository (packages/docs) carry the facts; the installation guide and the legal page are read there. The GitHub API reports the license as NOASSERTION, so the MIT entries come from the README and the npm registry. The LICENSE copyright line names Vuetify, LLC with the year range 2016-now. The homepage meta description, which is outside the body text, is not quoted. Vuetify One is a paid subscription (solo and team plans, the docs' one.md and components) for premium tools across Vuetify's web properties (Play, Bin, Studio, Link, Issues); the framework FAQ says the core framework stays free, so no paidEdition is recorded. The Vuetify Store sells free digital products and themes; no paid edition of the framework is named. Vuetify 2 is end of life per the README; the record covers the current major 4 and leaves v2 out, since v2 end of life is a fact about the old major only. No runtimeMin is recorded: the Vue version the release needs sits in its package manifest, which was not read. The repository's docs describe Nuxt and Laravel as integrations, not as parents, so basedOn is vue only. The firstRelease year is the oldest GitHub release, v0.7.4 of 2016-12-16, which is a prerelease tag. The contributor count is the last page number of the contributors endpoint with per_page=1. Social links on the live homepage could not be read (JavaScript shell), so x, bluesky and mastodon are not recorded. httpArchiveSites is the mobile origin count for the technology Vuetify; usageShare was not checked.
