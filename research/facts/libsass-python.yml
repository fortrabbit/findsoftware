notes: >
  The end-of-life statement is in the README on the default branch: "LibSass has reached its end of life. It will no longer receive updates of any kind, nor will its wrapper libraries. Users should migrate to Dart Sass at their earliest convenience. See also https://github.com/attakei/sass-embedded-python." The repository is archived on GitHub (api archived true, pushed_at 2025-10-24), which matches the candidates row. The successor the README names is Dart Sass, and the README links sass-embedded-python; neither is recorded as a successor field. The project's own site still shows version 0.23.0 documentation. The binding wraps LibSass, a C/C++ library in the same organization; that library has no record here, so basedOn stays out. The site says "CPython 3.7+" while the PyPI requires_python field reads ">=3.8" for the latest release; runtimeMin takes the registry value. currentMajor is 0 because the latest stable release is 0.23.0. The releases list starts at 0.1.0 on 2013-09-25 and PyPI's oldest upload is 0.1.0 on 2012-08-17. The PyPI figure comes from pypistats.org, which the AGENTS.md exception allows for PyPI downloads. The GitHub stargazer count and the PyPI figures were read 2026-10-28.
