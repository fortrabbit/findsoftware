notes: >
  Repository only, no homepage: the README links the demo site and demo outputs on GitHub, and no project website is named. The GitHub repository has no release and no tag; the registry is the release source (npm 2.4.3, published 2021-06-05, the latest version of 19), so currentMajor and latestReleaseDate are from npm. Criterion 4: the registry's last release is more than four years old, and the default branch's last commit is 2023-05-11; the import moves a record with no release in four years to stub. The LICENSE copyright line names "Mao shuhao", the package.json author is "wzpan", and the GitHub owner is the user wzpan; the maintainer is recorded from the LICENSE line and the reviewer decides whether that differs from the person who maintains the repository. The README states support for Hexo 3.x and 4.x only; that is a compatibility statement about the parent and is not recorded as a runtime or runtimeMin. The npm engines field of the latest version reads ">= 0.10.0"; for a build plugin it says nothing about the Node version a Hexo site needs, so no runtimeMin is recorded. npmWeeklyDownloads is the sum of the daily figures from 2026-10-19 to 2026-10-25 (the range endpoint); the point endpoint for the last week gave a different window. The plugin sits in the Hexo build: the generated index is a file in the public folder, and the search script runs in the visitor's browser, which is why both runsAs values are recorded.
