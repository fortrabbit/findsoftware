notes: >
  The deployment page lists the message queues Outpost supports (RabbitMQ, AWS SQS, Azure Service Bus, GCP Pub/Sub, NATS JetStream), the README names Go, Python and TypeScript SDKs, and the homepage links LinkedIn. No runtimeMin is recorded: the go.mod go directive is a build requirement for a product shipped as a binary and a Docker image.   Outpost is the open-source sending half of Hookdeck: the README names it "Outpost" in the Hookdeck organization, and its own docs say it is open source (Apache-2.0), self-hostable and written in Go. The wiring test is met on the project's own pages: the README and quickstart show an application publishing events with a POST to the Outpost REST API ("Publish events via the API or a queue"), and the managed service is a separate product on the same code. The candidates row gives the homepage as outpost.hookdeck.com, which the homepage does not link; the record uses hookdeck.com/outpost, the page the README names. The deployment page names three services (delivery, api, log) as entry points of one executable and says omitting the entry point starts all three within the same process; the page uses no word such as daemon or server. Redis is required, PostgreSQL or ClickHouse is the data store, and a message queue is needed for the queues listed. The newest stable GitHub release is v1.7.0 (2026-10-23); the newest prerelease is v0.1.0-alpha.12 from 2025-05-06 and is older than the stable release, so no latestPrereleaseDate is recorded. firstRelease is the first prerelease, v0.1.0-alpha.1, because GitHub lists it as a release. The SDK packages (@hookdeck/outpost-sdk on npm, outpost-sdk on PyPI, the Go module) are named by the README badges and are not recorded as install routes; the npm and PyPI figures are not recorded. The managed Outpost's SSO, RBAC and SOC 2 claims come from the README's managed section and are not recorded as fields. The Hookdeck company facts (legal name and Montreal address) come from the Hookdeck terms page, which the record uses as the maintainer's legal notice. The contributors count is the last page of the contributors endpoint with one per page.
