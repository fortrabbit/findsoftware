notes: >
  The project's own docs site (Sphinx, staticjinja.github.io) is the homepage; the PyPI page names the same site and the repository. The quickstart documents the commands build and watch (watch recompiles on changes); the templates folder defaults to ./templates, and --srcpath and --outpath set the folders. The quickstart gives --outpath a default of the working directory ("."), which no field value states, so outputDir is not recorded. The oldest PyPI upload is dated 2012-10-07, so firstRelease is 2012; the oldest GitHub release is dated 2021-01-23 and the highest stable release is 5.0.0. pypiDownloads comes from pypistats because the PyPI JSON carries no totals. The docs page footer reads "Copyright 2014, Ceasar Bautista", the LICENSE copyright line adds "and the staticjinja Contributors"; the maintainer is recorded as the LICENSE states it.
