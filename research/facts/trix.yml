notes: >
  Maintainer from the LICENSE copyright line: 37signals, LLC. The terms page spells the company "37signals LLC" without the comma; the LICENSE wording is recorded. The README says Trix is "an open-source project from 37signals, the creators of Ruby on Rails", which names no parent, so basedOn is absent. The README's sanitization uses DOMPurify, a dependency and not a parent. The first release is the oldest tag, 0.4.0, dated by its commit on 2014-11-17; the oldest GitHub release is 0.9.0 (2015-10-24). The README has a building-from-source section for contributors (yarn install, yarn build) and no separate route for users, so no source route is recorded. The README's browser support line (all evergreen desktop and mobile browsers) is a support list, not a runsAs statement, so no runsAs is recorded. The npm package trix is the one the README's install sentence names; latest is 2.1.19, matching the GitHub release. The prerelease tags (2.0.0-beta.1 and older, 2022) are older than the stable release and are not recorded as latestPrereleaseDate.
