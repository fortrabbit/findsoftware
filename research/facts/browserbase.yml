notes: >
  The record covers the hosted Browserbase platform. The SDK repository browserbase/sdk-node (npm @browserbasehq/sdk, 1.3 million downloads a week in the candidates row) is a client library and takes no repository, license, stars or npm figure here. The homepage names Stagehand, a browser automation framework, and the Browse CLI as open-source products; they are separate projects and are not recorded. The homepage says the infrastructure is SOC-2 Type II, and the pricing page lists HIPAA (BAA) and DPA for Enterprise; neither has a field here. The pricing page's FAQ says the platform is cloud-first and offers VPC connectivity for secure integration. The terms name Browserbase, Inc. as a Delaware corporation, which is no headquarters; the same terms name its address as 1 Post Street, San Francisco, CA, so hqCountry is US. The category browser-automation maps to testing in the import, which the pages do not state for a hosted cloud-browser platform, so no category is recorded. The homepage's LinkedIn, YouTube and GitHub links have no field. The homepage claims about session volume and customers are not recorded.
