notes: >
  Highest stable GitHub release is v0.2.6 (2022-10-25), which matches the npm latest tag 0.2.6, so currentMajor is 0 and latestReleaseDate is 2022-10-25. The repository has a v0.3.0 tag with no GitHub release; its commit is dated 2021-10-18, so it is not used. The last push is 2025-03-08. Criterion 4 counts the release date: 2022-10-25 is more than four years before 2026-10-28, so the import moves the record to stub on its own. The repository language is SCSS, but the package ships CSS (dist/XP.css), so language is CSS from the npm package. The README and the docs page both say it has no JavaScript and is compatible with any frontend framework; the React example is a CodeSandbox link, not a parent. The docs page and README both spell the project "XP.css is an extension of 98.css"; the 98.css README and the docs page name the same project. The LICENSE copyright line names Adam Hammad and Jordan Scales; the npm package author and maintainer is Adam Hammad, so the first name is recorded. The npm figure counts the xp.css package named in the README install section. HTTP Archive has no XP.css technology entry. The docs page and the homepage are the same URL, the GitHub Pages site of the repository.
