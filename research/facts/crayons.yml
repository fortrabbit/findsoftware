notes: >
  The npm dist-tag latest is 2.13.4 (2022-03-30), older than the v4 line the docs install (npm install @freshworks/crayons@v4); the highest stable GitHub release of the package is @freshworks/crayons@4.2.0 (2023-07-05), so currentMajor is 4. The newest release is the prerelease @freshworks/crayons@4.3.0-dew.19 (GitHub, 2026-09-12); it is not on npm under a dist-tag. This record was a boundary row only because the window held prereleases and no stable release: a pre-release in four years keeps a record listed under the import's rule, so the status is accepted. The homepage refuses the fetcher (403), so social and community links on it were not readable; the CSV row should move from boundary to accepted. The README says a React wrapper is available, which is recorded here and not as a framework fact. The root package.json of the next branch names the package crayons (MIT, author Freshworks Inc), which is the monorepo root and not the install target; the repository has no LICENSE file on the next branch, so the license is the npm statement. The docs site refuses the fetcher (403); the docs were read from the www folder of the repository, which the site builds from. Contributors is the page number of the rel="last" link with per_page=1.
