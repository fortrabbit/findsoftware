notes: The record covers the hosted Courier service. The SDK repository github.com/trycourier/courier-node (npm @trycourier/courier, the CLI and the other SDK repositories) is a client library, not the service's own source, so its license, stars, contributors and npm figures are not recorded. The docs list server SDKs for Node, Python, Go, Ruby, Java, PHP and C#, client SDKs for React, JavaScript, iOS, Android, React Native and Flutter, and a REST API for sending. Courier names itself "trycourier.com, Inc." in its terms with a San Francisco street address, which is the basis for hqCountry. The Courier Trust Center at security.courier.com lists CCPA, GDPR, HIPAA, PCI DSS and SOC 2, and the pricing page lists SOC 2, GDPR and HIPAA; no compliance field is recorded. The pricing page lists Developer, Business and Enterprise plans, recorded without prices; the plans are hosting tiers, so no paidEdition is recorded. The pricing page lists EU Data Residency in the Business column; the docs state the EU datacenter keeps notification data in Europe. The docs footer links github.com/trycourier and the site links LinkedIn (linkedin.com/company/trycourier); neither is recorded as a field.
