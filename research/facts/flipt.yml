notes: >
  The highest stable release is v2.14.1 (2026-10-23), so currentMajor is 2. The v1.x line continues: v1.62.0 was published the same day (2026-10-23) and is the newest release by date, so latestReleaseDate is 2026-10-23 for either line; the v1 license was not read and is not recorded. The license fact describes the server under v2 (LICENSE at v2, Fair Core License, Version 1.0, MIT Future License); the README says the server code is under that license and the client code (rpc/ and the Go SDK) is MIT, so both are recorded as license entries. The LICENSE copyright line names Flipt Software, Inc. and is the maintainer; the privacy page at https://www.flipt.io/privacy and the homepage footer name Latent Signal Labs, LLC as the operator of the website; the record follows the LICENSE line. No page reviewed gives a country for either entity, so hqCountry is not recorded. The Pro features are named on the README and docs (GitHub, GitLab, Bitbucket, Azure DevOps and Gitea workflows, GPG commit signing, vault secrets); the pricing page lists Pro and Enterprise plans with prices that are not recorded. The docs describe a Flipt Cloud product that is migrated away from to self-hosting; the cloud product itself is named only through that guide. The LaunchDarkly migration guide sits in the v1 docs. The Flipt client SDKs (Go, Python, JavaScript, C#, Swift, Kotlin, Dart and others) are listed on the homepage and in the client SDK docs; they are not recorded as a field. The docs say Flipt v2 stores flag state in local directories, memory or a git repository; no database engine is named for v2, so databases is not recorded. The homepage Discord link is discord.com/invite/kRhEqG2TEZ and the README link is flipt.io/discord; the README link is recorded. The Docker image docker.flipt.io is not Docker Hub, so no dockerPulls figure is recorded. The go.mod minimum is a build requirement recorded as runtimeMin, as on the Mailpit record. The sso fact is the OIDC login method the docs name for the web UI; no SAML or LDAP method was found in the docs read.
