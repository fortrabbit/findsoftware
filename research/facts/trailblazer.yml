notes: >
  The GitHub homepage field and the gem's homepage_uri name trailblazer.to; the homepage answers over https (it redirects to /2.1/), so the https address is recorded. The GitHub API reports the license as NOASSERTION; the LICENSE file says LGPLv3, the gemspec and the gem metadata say LGPL-3.0, and COMM-LICENSE is a commercial agreement for the PRO components and related gems. Each statement is its own license entry. The PRO page (trailblazer.to/2.1/pro/) carries placeholder text in its "Future insights" section and dates its footer 2023; the paid edition is recorded from the web debugger and BPMN statements on that page, and the price tiers (Free, Freelancer, Team) are not recorded. The repository has no GitHub release objects; the newest gem version is 2.1.3 (2023-06-15), which is also the highest stable tag, so currentMajor and latestReleaseDate come from RubyGems. The last gem release is more than three years old, but the homepage says Trailblazer 2.1 is long-term supported and the README names 2.1 as current, so no status change is made. The gem's authors field names Nick Sutterer, who is also the legal representative in the Impressum; the record uses the company as maintainer. The homepage describes Trailblazer as framework-agnostic and names Rails, Hanami, Roda, Grape and Sinatra as frameworks it is used with, so no basedOn is recorded. The chat link on the site leads to a Zulip server (trailblazer.zulipchat.com), recorded as forum. The about page links the company's LinkedIn page, for which no field exists. No install page was found that names a gem install command; installMethod stays unknown. The README says Trailblazer introduces abstraction layers into Ruby applications, that its operation is the entry point through which business logic runs as a sequence of steps, and that the gems include form objects, view components, test helpers and Rails support. The homepage calls it a framework-agnostic set of gems used with Rails, Hanami, Roda, Grape and Sinatra, and says the operation applies the railway pattern to error handling. The PRO page lists a web debugger and a BPMN workflow editor and says the debugger allows viewing traces and inspecting ctx variables. The PRO page's plans table holds placeholder text, not plans, so no pricingPage is recorded.
