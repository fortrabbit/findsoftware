notes: >
  No homepage: the repository and npm package name no site, so homepage is not recorded. The README is the only documentation; the linked example project is not read. The GitHub API reports no license, but the npm package 0.3.5 declares MIT; the repository has no LICENSE file on master. Highest stable GitHub release is v0.3.0 (2022-06-05); npm latest is 0.3.5 (2022-06-09) with no GitHub release, so latestReleaseDate uses npm and currentMajor is 0 from both. The first GitHub release is v0.1.2 (2020-03-10), which sets firstRelease. The repository lists tag v0.3.2 without a release; it is not used. The maintainer is the npm package author, as the registry states it; the npm user is punund. Adoption: the npm figure is for the week 2026-10-12 to 2026-10-18. The README describes the commands build, watch, serve (the default, with browser-sync reloading) and proxy <port>, which connects to a server already running; front matter for template, layout, toc, bust-cache, options and ignore; a 20ful-config.yaml file that sets the source and output folders and Markdown plugins; and that two files whose paths differ only by the html/ folder collide in the output, with only one written.
