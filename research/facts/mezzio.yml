notes: >
  Status stays accepted. The Laminas maintenance status page lists mezzio/mezzio as active (getlaminas.org/packages-maintenance-status/, read 2026-10-21). The docs sidebar marks Laminas MVC as "(security-only maintenance mode)"; that line concerns MVC, not Mezzio. Mezzio is documented as a Laminas project: the docs site is titled "Laminas Docs" and the copyright holder is the Laminas Project. The mezzio.dev site is the homepage named in composer.json; the docs site at docs.mezzio.dev/mezzio/ is the docs the CSV names. Registry figures come from mezzio/mezzio, the core package, because the install command names mezzio/mezzio-skeleton. The quick start says the built-in web server is for testing ("You can test it out using built-in web server"); no page in the fetched set states the production runtime model, so runsAs is unknown. The skeleton's installer offers a choice of routing and templating packages, so templating lists the template engines the docs name.
