notes: >
  In doubt on criterion 1 (used to build or extend a website or web app): the core README describes a dependency injection framework and names no HTTP server or web use, while the goner component library in the same organization ships a gin component; a reviewer settles it by reading the gonectl project template or the goner gin component documentation, then moves the status. The project's own site is not known: the CSV row has no homepage, the README links only its repository docs, and gone.io redirects to a domain sale page (atom.com), so no homepage is recorded. The license is stated twice: the GitHub license API reports MIT, and the README reads "released under the MIT License". The LICENSE copyright line names roc, recorded as the maintainer because it is the only name the project states. The docs folder holds the guides for injection, providers, lazy fill, circular dependencies and the v1-to-v2 update. The ecosystem component repository is github.com/gone-io/goner, not recorded as a fact. The README describes the project as a dependency injection framework and does not use "web" anywhere, so the categories value is taken from the README's own words.
