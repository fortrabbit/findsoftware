notes: >
  The homepage kesearch.de is the vendor's site, operated by TPWD AG; the candidates row named the TYPO3 Extension Repository listing, which is recorded as pluginDirectory only. The TYPO3 Extension Repository (extensions.typo3.org) is the free download channel of the basic version, per the pricing page. The license statements differ: composer.json at v7.3.1 says GPL-2.0+, the LICENSE file at the same tag is the GPL version 3 text, and GitHub detects GPL-3.0; each is recorded as its own entry. The Packagist package page carries the same GPL-2.0+ statement. The GitHub repository has no releases; its version tags run from v1.99.0 (2015) through v7.3.1, and the stable major is taken from the highest tag. The latest release date comes from the Packagist version time, which matches the tag date. The first release year is the earliest tag in the repository, v1.99.0, dated by its commit; the copyright line on the docs page says "since 2011", which is a copyright year, not a release date. The composer.json requires typo3/cms-core ^13 or ^14, so TYPO3 13 and 14 are the supported core versions stated by the release; no version is recorded beyond the major of the extension. The Packagist monthly total is 59726 at the time of the check and is not recorded. The premium package ke_search_premium is a paid add-on whose features include a Sphinx-based search for large data sets and a remote indexer; the Sphinx server is a separate process, and the premium pages do not state its runtime, so no runsAs is recorded for it. The pricing page lists a separate AI version (KI-Version) that is included with the premium version; it is not recorded as a field. The headless feature outputs search results as JSON for AJAX or headless applications; it is not a REST or GraphQL API, so headlessApi is not recorded. The footer of kesearch.de links a LinkedIn company page under the name of the group, not of ke_search; it is not recorded, and LinkedIn has no field. The docs state the index is stored in the tx_kesearch_index table of the TYPO3 database, so contentStore is not recorded as a separate store. The TYPO3 indexing command is run by the scheduler or the CLI, and the frontend search runs inside the TYPO3 request; the search pages do not state a runsAs value for the frontend, so only scheduled is recorded. The homepage states a vendor claim of use in hundreds of thousands of projects; it gives no figure and is not recorded as reportedInstalls.
