notes: >
  Latest release is v1.10.19 (2026-10-06): the GitHub API marks it as the latest release and flags every v1.11.x tag as a pre-release, and the download page lists 1.10 under "Current Release" and says "Quarto v1.11 was just released, nothing to see here – yet!" under "Pre-release". v1.11.6 (2026-10-14) is the newest pre-release. The major is 1 either way. COPYING.md states the MIT License; COPYRIGHT adds "With the exceptions noted below" and then lists none, and the GitHub licence API reports NOASSERTION, so the MIT statement in COPYING.md is recorded. GitHub reports JavaScript as the main language by file size, with TypeScript and Lua also in the repository, which does not state the project's language, so language stays out. The publishing docs list GitHub Pages, Netlify and Posit Connect as destinations; only the static hosting wording is recorded. codeLanguages is coined here: the FAQ names the languages that code cells run in, and no starter field covers it. The README names Pandoc as what Quarto is built on.
