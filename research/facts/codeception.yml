notes: >
  The homepage's "Enterprise Support" link is paid support, not an edition, so no paidEdition is recorded. The install page's header names PHP 5.6+ and its v5 PHAR line names PHP 8.0+; the latest release manifest requires "^8.2", so runtime and runtimeMin follow the manifest at tag 5.3.7. The LICENSE copyright line names Michael Bodnarchuk "and contributors"; the maintainer is recorded as the named person, and the contributors form is left to the count. The runsAs local value rests on the quickstart's sentence about the local development server and on the tests being run as a command; the pages state no dev-only sentence in those words, and a reviewer decides whether that is enough. The homepage lists MySQL, PostgreSQL, MongoDB, Redis and Memcache as sources that tests connect to; these are connectors of the test suite, so no databases value is recorded. The install page's git clone route is for bugfixing and contributions and is not recorded as an install route. The homepage community links give GitHub Discussions (recorded as forum), a Slack invite, StackOverflow, and OpenCollective; the Slack and OpenCollective links have no field. The Addons page lists third-party tools for the framework and links the built-in extensions, recorded as the plugin directory. The packagist totals come from the package's own API at the time of reading; the monthly figure is the package API's monthly value. The GitHub tags reach back to 1.0.1, committed 2011-12-18, which sets firstRelease; the GitHub releases start with 4.0.0 on 2019-12-19. Prose sources: the homepage's benefits sections give the WebDriver browsers, PhpBrowser, the framework integrations, and the BDD-style description; the README's installation and getting-started sections give the bootstrap command that creates the default directory structure and test suites.
