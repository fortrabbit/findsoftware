notes: >
  The repository ecyrbe/zodios holds the @zodios/core package, the install line's package and the source of the registry figures; stars, contributors and the release list belong to this repository. The docs introduction says Zodios is composed of multiple packages (core, plugins, react, solid, express, openapi), and the README's Ecosystem section links @zodios/express, @zodios/plugins, @zodios/react and @zodios/solid to repositories of their own (ecyrbe/zodios-express, zodios-react and others), so those are not part of this repository. The docs call @zodios/react and @zodios/solid hooks based on tanstack-query and @zodios/express an adapter for Express; those statements are about separate packages and are not recorded as basedOn of the core record. The README describes @zodios/express as "full end to end type safety like tRPC, but for REST APIs"; that sentence is about the express package, so alternativeTo trpc is not recorded here. The README's opening line says Zodios is backed by axios, zod and express, and its Dependencies section says zod and axios are used internally on all platforms; the homepage sentences for the client and the shared definitions are the basedOn quotes. The README's Express server install is "npm install @zodios/core @zodios/express", the same npm route with the express package added. The last stable release is v10.9.6, dated 2023-08-22; the beta tag @zodios/core@11.0.0-beta.19 was published on npm on 2023-04-09, before that stable release, so no latestPrereleaseDate is recorded. The README's roadmap for version 11 is planned work and is not recorded as a fact. The homepage footer shows the copyright year 2023 and the name ecyrbe. The README links the repository's GitHub Discussions for ideas, recorded as forum. The homepage lists Documentation, Community, Twitter and Discord links; the Discord link is recorded, and the Twitter link as x. The README and homepage state no runtime, so runtime stays empty. The firstRelease year comes from the oldest GitHub release v2.0.0 dated 2022-02-14; the oldest upload of the unscoped zodios package on npm and the oldest tag fall on 2022-02-13, the same year. The npm figure counts downloads of @zodios/core only.
  The README says Zodios embeds none of its dependencies and that users install the peer dependencies they need, and that autocompletion works best with a TypeScript language server even in plain JavaScript. The homepage lists typed parameters and responses, response validation, a plugin system and an OpenAPI generator with Swagger UI.
