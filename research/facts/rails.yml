notes: >
  No page read names who maintains the code; the community page links the core team and contributors site, the foundation page describes a US non-profit that supports the ecosystem, so `maintainer` stays unknown and the foundation goes in `governance`. firstRelease is left out: RubyGems dates its oldest rails gem 2009, which predates the gem's import and is not a release date. Hotwire is named on the homepage as the default front-end framework. The homepage tagline mentions agents; it is a slogan and not recorded. Coined fields: `gemName` and `rubygemsDownloads` (RubyGems counterparts of packagistName and packagistDownloads); reused `governance`, `founders`.
