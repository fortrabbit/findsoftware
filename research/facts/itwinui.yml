notes: >
  The project is in maintenance mode: the README states it and a locked GitHub discussion dated 2026-10-07 gives the date as September 4, 2026, with critical bug fixes and security patches continuing, so it is no end signal and the status stays accepted. StrataKit (github.com/iTwin/stratakit, docs at stratakit.bentley.com) is named as the primary design system replacing it, with a migration guide and a theme bridge for running both. The repository holds three npm packages, @itwin/itwinui-css, @itwin/itwinui-variables and @itwin/itwinui-react; the install docs name @itwin/itwinui-react, so the registry figures, currentMajor and latestReleaseDate come from it. currentMajor is the highest stable GitHub release tag of that package (3.22.0); a 5.0.0-alpha line on npm is older than that release, so no latestPrereleaseDate is recorded. firstRelease is the npm upload of 1.0.0 on 2021-04-15; the oldest GitHub release of the package is 2.0.0 (2023-01-09) and the oldest react tag is 1.48.1. The npm weekly figure is the sum of the range 2026-10-18 to 2026-10-24. The repository's homepage field points to itwin.github.io/iTwinUI, the older documentation site of v3; the README names itwinui.bentley.com as the documentation website, which is recorded. The react package peer-depends on react >=17 per its docs and on the StrataKit MUI package per npm; neither is a runtime. The README mentions discussions only for the maintenance notice, so no forum is recorded. The legal text names Bentley Systems, Incorporated with no address; the sources read give no headquarters country. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header (53).
