unreadable: [https://getstatik.com/]
notes: >
  The homepage getstatik.com no longer serves the project: it answers 200 with unrelated gambling content, so no homepage is recorded and the status rests on the repository. Two end signals hold: the repository is archived on GitHub (api) and the README says the author has not had time to maintain the project in years. The status is discontinued as the batch CSV row has it; the dead homepage alone would give stub, a reviewer may decide otherwise. The GitHub repository has tags up to v0.23.0 but no GitHub release, so the version and date come from the PyPI release of the same number, which matches the tag. The README names SFTP and Netlify as deploy targets through its statik --deploy option; no deployment field exists for that yet. The PyPI first upload is 2016-04-24. The README says the data instances are loaded into an in-memory SQLAlchemy SQLite database while a site renders, so databases is not recorded: it is no database the user runs or hosts. The README asks anyone who wants to take the project over to fork it. The README says "Finally, define your views (either complex or simple) in YAML format, telling Statik how to render your data and templates to specific URLs". The README names a single themes repository, https://github.com/thanethomson/statik-themes, which it says will slowly fill with themes, so no pluginDirectory is recorded. The pypiDownloads figure is the last-month count from pypistats.
