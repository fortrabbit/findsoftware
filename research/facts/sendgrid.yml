notes: >
  Hosted-service, as the CSV row and the hosted rule say: no public self-install is named. The homepage sendgrid.com redirects to https://www.twilio.com/en-us/sendgrid, where Twilio's page says "SendGrid moved in together on Twilio.com" and that the products "are available and fully supported on Twilio.com"; the record follows that new home, so the homepage is the Twilio page. No page calls the product acquired, so the acquired-project ruling is not applied; the reviewer confirms that reading. The SDK repository sendgrid/sendgrid-nodejs (MIT, 3,053 stars on 2026-11-03, last push 2026-10-28) and the npm package @sendgrid/mail (6,449,897 downloads for 2026-10-26 to 2026-11-01, latest 8.1.6) are SDK figures and go to notes only. The docs page https://docs.sendgrid.com redirects to Twilio's docs. The maintainer is Twilio Inc. under the Twilio terms, a Delaware corporation with a place of business at 101 Spear Street, San Francisco; the Twilio Ireland and Twilio Germany entities named in the terms and imprint are other legal entities and go to notes. The homepage links the Twilio X account (https://x.com/twilio), which is the parent's account and is not recorded. SSO, Teammate permissions and EU data residency come from Twilio's SendGrid docs. No page states Twilio owns SendGrid in those words, so parent is left out; no pricing is recorded.
