notes: >
  The GitHub homepage field and the homepage's GitHub link point to github.com/steveiliop56/tinyauth; that address now resolves to tinyauthapp/tinyauth, so the record uses the current repository. The README says "Right now, Tinyauth is maintained by a single person" (dated 30/10/2026) and names no one; the GitHub organization is the only name the project gives, so it is the maintainer and a reviewer may decide otherwise. No page gives a legal entity or a country. The about page says "It is not designed for production environments, which require features like RBAC and more granular permissions", so no userRoles fact is recorded. The homepage counter reads "0+ Active Instances", which is no usable figure. The /data path keeps sessions and OIDC storage (Kubernetes guide); the configuration reference also lists a memory driver beside sqlite and postgres. The container image is on ghcr.io, not Docker Hub, so no pull figure. The CSV category auth-proxy maps to web-server in the import, so the record uses auth and authorization instead; a reviewer may want the proxy role kept. Access control is by per-app labels (tinyauth.apps.<app>), described on the access-controls guide: user ACLs, an OAuth whitelist, path and IP rules, and OIDC or LDAP group rules. The releases list holds a nightly pre-release tag dated 2026-11-03, which is no version and no prerelease date is recorded; the v5.2.0 release candidates are older than v5.2.0. The license is AGPL-3.0 on the GitHub API and in the README. The getting-started page makes Traefik the default proxy and links guides for Nginx Proxy Manager, SWAG and Caddy; the Docker example sets users through TINYAUTH_AUTH_USERS as bcrypt hashes with an optional TOTP secret (authentication reference). The about page says the project "is not designed for production environments, which require features like RBAC and more granular permissions" and that "For scenarios requiring advanced user management, Authentik is recommended."
