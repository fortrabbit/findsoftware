notes: >
  Stub, because criterion 1 is open: the homepage describes a drag-and-drop website builder and a hosted CMS, and the rule for a website builder is that it is out unless it gives the creator's own front end an API. HubSpot publishes a Pages API (developers.hubspot.com/docs/api-reference/legacy/cms/pages/guide, the legacy Pages API guide) that says it is used to "create, manage, and publish website and landing pages", which manages the site rather than delivering content to a separate front end, so it is not recorded as headlessApi. The CMS developer documentation at developers.hubspot.com/docs/cms answers with a login page to the research user agent, so themes, HubL and any delivery API stay unread. The reviewer should decide: reject under criterion 1 as a website builder with no front-end API, or accept if the readable CMS documentation shows a delivery API a creator's own front end calls. Free and premium plans are named on the homepage; the pricing page renders no text without JavaScript, so plan details are unread and no prices are recorded. The community forum at community.hubspot.com answers 403 to the research user agent and is unread. The Terms name HubSpot, Inc. as the contracting entity for customers in North and South America and give its Cambridge, Massachusetts address. HubSpot's own CRM and marketing hub are not this record.
