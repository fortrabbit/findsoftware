notes: >
  The library is one npm package in the repository tradingview/lightweight-charts; the repository also holds plugin examples and tooling, and the stars and contributors count the whole repository. The registry figures come from lightweight-charts, the package the install page names. The maintainer is TradingView, Inc.: the docs footer states the copyright, and the NOTICE file carries the same holder with a 2025 date. The license is Apache-2.0 with an attribution condition: the README says the license requires specifying TradingView as the product creator and linking tradingview.com on a public page; the docs "License and attribution" section repeats it. Releases tagged plugins-YYYY-MM-DD and create-lwc-plugin@ are plugin and wizard packages, not the library, so latestReleaseDate is the v5.3.0 release. The first tag is v1.0.0-rc.1, committed 2019-05-29. The homepage footer links the TradingView company accounts on X, Facebook, Instagram and YouTube; they are recorded as the homepage's links. The README links Reddit r/TradingView, the company subreddit, which is recorded as subreddit; the docs link Stack Overflow, which is no project forum.
