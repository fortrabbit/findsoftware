notes: >
  The homepage jus.js.org, listed on GitHub and in the README, answers 301 and then a js.org page reading "the subdomain does not exist", so the record is a stub without homepage. The repository has no LICENSE file (GitHub reports no license); the MIT license is taken from package.json at v0.26.0 and the npm registry. The first GitHub release is v0.25.0 (2018-02-02) and only two releases are listed, so firstRelease comes from npm time.created (2015-12-20), which carries the same description and maintainers. The owner is the GitHub organization jus, whose profile names no legal entity; the organization name is recorded as the maintainer. The npm maintainers are jdormit and zeke. The last commit is dated 2018-05-23 and the repository is not archived.
