notes: >
  No GitHub releases exist on plone/Products.CMFPlone (tags only), so currentMajor and latestReleaseDate come from the PyPI package Plone, the package the install docs name; highest stable is 6.2.2 (2026-09-10). The install page also lists a security-only update 6.2.2.1 dated October 22nd 2026, which is not on PyPI and is not recorded as the latest release. The homepage says "Plone was born in 2001" under its statistics, and the oldest tag in the repository is an alpha dated 2002 that the repository import generated; neither is a first release date, so firstRelease is unknown. Volto runs its frontend in a separate Node process (the run page: "you need to run the frontend in a separate process"), so node is recorded under runtime next to python. The interface guide states "There is no migration path available from Volto to Classic UI." The forum, X and Mastodon links are in the homepage footer; the Discord link comes from the Chat entry in the PyPI project metadata. The homepage footer link for X points to twitter.com. The pypiDownloads figure is the last-month count from pypistats.org, a third-party aggregator, for the package named plone. The Extend Plone page points to PyPI and to third-party awesome lists on GitHub, which are not recorded as a plugin directory. hqCountry is the Foundation mailing address in the page footer.
