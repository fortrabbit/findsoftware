notes: >
  docs.sylius.com outside /public redirects to a GitBook visitor login; the /public section with .md URLs is readable. The requirements page says PHP 8.2 or higher while the 2.3.1 composer.json requires ^8.3. The release-cycle page has not yet added 2.3 to its supported table; endoflife.date lists 2.3 (released 2026-09-28) and marks 2.1 past its end of support. The Plus page says Plus "consists of 9 modules" but lists 11; pricing depends on GMV and the modules chosen. Advanced Multi-store is a Plus module, so multisite in the open-source edition was not confirmed. The site gives no legal entity name, only "Sylius HQ - Poland" with a Poznań address. Contributors counts GitHub accounts, anonymous excluded.
