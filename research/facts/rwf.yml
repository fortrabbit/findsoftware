notes: >
  The project's own documentation site, rustwebframework.org, answers over https with a 200 and is the target of the github.io address the README and crate link to, so it is the homepage and docs. The README says the framework is in beta, and the migration pages for Python and Rails call the WSGI server experimental and the Rack server highly experimental; these are cited in Worth knowing. The admin panel is a separate crate, rwf-admin, which the admin guide says is included in an application's dependencies. The models page says Rwf currently supports PostgreSQL and names SQLite and MySQL only as roadmap items, so databases is [postgresql] only. The templates are Rwf's own syntax (variables, if statements, for loops, functions and partials), and no engine name is stated, so templating is not recorded. The deployment page says Rwf can package an application with its CLI for bare metal and mentions buildpacks and Docker, which is not a field here. Hotwired Turbo is integrated, which is a front-end library and not recorded as a field. The GitHub releases start in 2024-11-04 and the crate's first upload 0.1.0 is 2024-10-10, older than any GitHub release, so firstRelease uses the registry. The crate has no rust-version in its manifest, so runtimeMin is absent. The crates.io download figure is the 90-day count (recent_downloads); the all-time total is 15651. The last push to the default branch is 2026-04-14, and the last release is 0.2.1 on 2024-12-05. The Cargo.toml author line includes an email address, which is not recorded. The LICENSE copyright line names "Rwf Developers" and the Cargo author is recorded as maintainer.
