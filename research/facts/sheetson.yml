notes: >
  The homepage footer reads "made in Singapore", which is a statement of origin and not of headquarters, so hqCountry stays unknown.
  No legal notice, terms or imprint page was found at sheetson.com (the /terms, /privacy, /imprint and /pricing paths return 404), so the maintainer is recorded as the footer names the product.
  The docs say every Google Sheet is a database and each tab is a table; the data stays in the user's Google Sheet and is only read through the API, so no contentStore is recorded (starter-list rule for services that read from another service).
  The comparison page at sheetson.com/vs/ lists Sheetson API against SheetDB, Sheety, Sheet.best, Sheet2API and Sheetsu; they are recorded as alternativeTo because the project names them on its own pages. The same page also lists CSV viewer and editor tools, which are not recorded.
  The homepage shows a Free plan and a Professional plan with prices; no prices are recorded.
  The docs describe the endpoints as list, create, read, update and delete over the REST verbs, and the homepage calls the API RESTful. The homepage says requests are unmetered on every plan.
