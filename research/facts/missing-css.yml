notes: >
  The LICENSE reads "BSD 2-Clause License" with "Copyright (c) 2022, Big Sky Software", npm says "BSD 2-Clause", and the GitHub SPDX id is BSD-2-Clause; one license entry. The repository has no GitHub release; the tags run from v0.0.1 to v1.3.0 and carry no release objects, so currentMajor and latestReleaseDate come from the npm latest 1.3.0, which the docs install (unpkg missing.css@1.3.0 and npm i -s missing.css). The npm package named missing is not the one the docs name and is not recorded. The homepage nav and the README link a "Discord" that is the htmx server (htmx.org/discord); no page names it as a missing.css chat of its own, so discord is not recorded. The README says the project is from Big Sky Software and the default branch is dev. The homepage nav lists GitHub and Discord only, so no X, Bluesky or Mastodon link is recorded. The README says missing.css "is not designed to be a complete styling solution for large websites" and is meant to be complete enough for small sites, internal tools or personal projects. The project's own compatibility target, "> 0.9%, last 2 versions, not dead", is browser support and is left out.
