notes: >
  The LICENSE copyright line gives 2012-2025; the homepage footer gives 2012-2025 Roberto Alsina and the Nikola contributors. The maintainer is recorded from the LICENSE line as "Roberto Alsina and others". The homepage says Python 3 (3.8+), the PyPI release declares requires_python >=3.8, and the README says "Python 3.10+ compatible"; runtimeMin follows the registry, the README statement is not recorded. firstRelease is the date of the oldest tag (1.1, 2012-03-31); the oldest GitHub release is 2013 and PyPI starts at 2013. The getting-started page says the output directory is filled by nikola build but does not name it, so outputDir is not recorded. Deployment uses DEPLOY_COMMANDS run with nikola deploy, configured by the site owner; the handbook describes it, and it is not recorded as a field.
