notes: >
  Accepted from the CSV row. The repository is the project's own source (the README names the docs and the codebase owner). Release line: the GitHub releases run from 2015 (killbill-0.14.0) to killbill-0.24.22 (2026-09-29); the version scheme is 0.x with a minor line of 24, so no currentMajor is recorded and the line goes here for a reviewer. Tags killbill-0.25.x exist without GitHub releases and are not treated as stable releases. firstRelease is the date of the oldest tag commit, killbill-0.0.5 (2011-11-02), because the oldest GitHub release is from 2015; the README says the project has been in production since 2010, which is not a release date. Maintainer: The README says "The Billing Project, LLC owns the Kill Bill codebase and trademarks"; the LICENSE file has no copyright line, and the footer says "2026 Kill Bill", so the legal name stays as the README states it and a reviewer decides on it. hqCountry is unknown: the contact page and the footer name no address. The Aviate edition has its own commercial license and a price on the pricing page; prices are not recorded. The getting-started page lists Docker with Docker Compose, a manual install on Apache Tomcat with MySQL, and a one-click AWS installer. The Kill Bill docs name the Docker images killbill/killbill, killbill/kaui and killbill/mariadb; dockerPulls is for killbill/killbill. The JDK 11 minimum comes from the install page and from targetJdk 11 in the parent POM (killbill-oss-parent 0.146.87, the version the release tag's POM inherits). The README names the Google Groups users mailing list as the community channel, recorded as forum. GitHub Sponsors (github.com/sponsors/killbill) and the YouTube and LinkedIn links on the homepage have no field in this dictionary. The README names the REST API and its reference site, recorded as headlessApi. The docs index lists plugin pages (payment, tax, notification) but no plugin directory page, so pluginDirectory is left out. The homepage's Discord link is absent.
