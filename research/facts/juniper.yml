notes: >
  Monorepo: the repository graphql-rust/juniper holds the juniper crate and the juniper_actix, juniper_axum, juniper_hyper, juniper_rocket, juniper_warp, juniper_graphql_ws and juniper_subscriptions crates; stars and 152 contributors belong to the monorepo, and the crate figure is for juniper. The current line is 0.18 (0.x, so currentMajor is 0 and the minor line stays in notes). The homepage names five web server integrations as separate crates, which are not basedOn statements. The homepage says Juniper does not include a web server and that it supports the GraphQL specification (October 2021); code-first approach is from the quickstart. Built-in types from uuid, url, chrono, jiff, time and bson are listed in the README as automatic integrations. The README also links a Gitter chat (gitter.im/juniper-graphql/Lobby) that is not a forum or discord field. The GitHub API reports the license as NOASSERTION because the LICENSE copyright line names five holders; the license in the crate manifest and LICENSE text is BSD-2-Clause. The maintainer is recorded as the first copyright holder and others: the LICENSE line names Magnus Hallin, Christoph Herzog, Christian Legnitto, Ilya Solovyiov and Kai Ren, not a company; the Cargo.toml license line says BSD-2-Clause, the LICENSE heading says BSD 2-Clause License, one license in two wordings; the repository owner is the graphql-rust organization. The install route is shown only as a Cargo.toml dependency block on the quickstart page. The schema-first juniper-from-schema crate is a separate project named in the README, not a fork. The API is not 1.0 according to the README. Not a runtime: juniper is compiled into the user's own Rust program, so no runtime is recorded; the MSRV from crates.io and the manifest is 1.85.
