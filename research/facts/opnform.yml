notes: >
  Three license statements: the README (AGPL-3.0-or-later for the core), the Enterprise Edition license in api/app/Enterprise (proprietary, per the EE license file) and api/composer.json, which declares "MIT" for the API package. GitHub reports the repository license as NOASSERTION because of the dual licensing; the reviewer decides how the record shows the MIT statement. The paid edition is the Enterprise Edition: its docs list Single Sign-On, Multiple Workspaces and Team Roles, Custom SMTP, White Label, Audit Logs, External Storage and Custom Code as self-hosted Enterprise features; the self-hosted-license page holds the list, and those features are recorded here only where they are cited (sso). The docs tech-stack page says PHP 8.0 or higher, while api/composer.json at v2.8.2 requires ^8.3; runtimeMin follows the manifest and the reviewer should confirm the conflict. The API reference states a JWT-based REST API for workspaces, forms, submissions and webhooks, with a Zapier integration; the create-submission endpoint is the API a site can call, which meets criterion 1 with the embedding docs. The embedding docs cover a JavaScript SDK for embedded forms and an editor embed; the embed method is recorded in notes because it has no field. Webhooks, Slack, Discord and Telegram integrations, the MCP server for AI agents, captcha protection, form analytics and PDF templates are features with no field; they go to notes. The docs say the Docker stack runs an API Worker and an API Scheduler; both are recorded under runsAs. The forms list on the public site includes templates and integration pages, which are not facts here. The Docker Hub image jhumanj/opnform-api is shown in the README badge and is not recorded as dockerPulls. The maintainer is the project name from the LICENSE copyright line; the terms page names no legal entity, so hqCountry is absent. Which part each license covers: AGPL-3.0-or-later is the core product (README); the EE license covers the code in api/app/Enterprise; MIT is the license declared in the API package manifest (api/composer.json). The self-hosted license page says OIDC single sign-on is available in the Community edition within a two-user limit across the instance, while SAML and LDAP single sign-on need the Enterprise license; the sso entries record both, the second one Enterprise-only.
