notes: >
  The repository is not a project site: GitHub reports no homepage, so no homepage is recorded. The GitHub repository has no release objects; its tags stop at v1.0.44 while the NuGet package IronBeard has 2.0.0 and 2.0.1, both published 2026-02-15, so the major and the release date come from NuGet under the registry rule, and the 2.x line has no tag in the repository. The NuGet package id is IronBeard, the install command is the one the README gives. The NuGet download figure is the total the search endpoint reports. The LICENSE copyright line names Wade Kallhoff, while the GitHub profile name is Wade Evanhoff; the legal notice is used. The runtime is .NET, and the README requires the .NET 10 SDK or newer, recorded as runtimeMin. The README's "dotnet serve" local preview is a separate tool, not part of the software.
