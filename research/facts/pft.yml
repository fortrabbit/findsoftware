notes: >
  The CSV homepage is the maintainer's personal site page "About PFT", which describes the project and links both repositories; it answers over https and is used as the homepage, though it sits on a personal site rather than a project domain. The repository App-PFT holds the command line tools and uses the separate PFT library (github.com/dacav/pft) for file system access; the library is not recorded as basedOn because the README names it as a component, and it needs its own record if it is added. The GitHub API reports GPL-3.0, while the README states "either version 3 of the License, or (at your option) any later version"; both statements are recorded. The GitHub repository has no release objects, only tags: v1.0.0 (2016-04-21) gives firstRelease and v1.4.1 (2019-07-25) gives currentMajor and latestReleaseDate, using the commit dates of the tags. The last push to the repository is 2021-03-07 and the repository is not archived; the personal site's last post, "Work in progress" (2021-3-7), states no end. The newest stable release is 2019, so the import judges listing by its own rule; no status change is recorded here. The command pages are the man page sources in bin/ (pft make, pft pub). `pft pub` also has an install method that copies the build directory to another place on the file system. The Makefile.PL sets MIN_PERL_VERSION 5.006 on master; it is not recorded as runtimeMin because it is not read from the latest release. CPAN hosts the distribution and is not a registry in the list, so no download figure is recorded.
