notes: >
  The repository is archived and the README opens with "ATTENTION: this project is no longer actively maintained (I still push some code once in a while)", so the status is discontinued. The npm package docute is the install target in the docs; the registry latest is 4.23.3, matching the highest GitHub release v4.23.3 (2019-10-03). The npm dist-tags beta (3.4.0-beta.2) and next (2.11.0) are not used. The README links the v3 docs at docute3.egoist.dev, not read. The docs call the output a single-page application that fetches Markdown at runtime; no runtime (node) is stated, and browser is recorded only as runsAs. The README's author line also links a personal X account of the author; it is not the project's account and is not recorded as x. The plugin repository is the README's "Official Plugins" link; no count was read.
  The docs say Docute is a JavaScript file that fetches Markdown files by URL and renders them as a single-page application, with no server-side components. A site is an HTML file plus Markdown files, and the deployment guide says it is a static HTML file that can be served anywhere; the guide also covers a service worker for offline support.
