notes: >
  End signal: the repository is archived on GitHub (archived true, pushed 2026-04-22, last release v3.22.0 on 2024-11-14), and the README opens with "Lost Pixel is joining Figma" and "We are sunsetting the product and building what’s next". That is an end statement for the product, not a rewrite of the same library, so the record is discontinued. The homepage lost-pixel.com answered 503 on the check date, so the Figma announcement the README links could not be read and no homepage is recorded. The README calls the Lost Pixel Platform "the SaaS offering" and lists a free use of the platform for open-source repositories; no prices are recorded. The npm package lost-pixel is not deprecated; its first version 1.11.0 is from 2022-06-04, and the GitHub release v1beta from 2021-12-29 gives firstRelease. The ecosyste.ms endpoint returned no dependent counts, so none are recorded. The x handle comes from a README badge and carries no quote. The docs site is a GitBook shell whose text could not be read; the README's documentation link is the only docs fact. The contributors count is the page number of the last contributors link. Storybook and Ladle are named as stories it runs on; no basedOn is recorded because the project does not state that it is built on either. The quickstart says to add a lostpixel.config.ts file at the project root and a GitHub Action workflow that runs the lost-pixel action.
