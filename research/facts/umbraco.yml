notes: >
  The CMS is MIT-licensed and free; the company sells Umbraco Cloud hosting, the Heartcore SaaS, enterprise support and add-ons, so licenseModel is open-core and the Cloud plans go in paidEditions as the pricing page states them, with add-ons unpriced. foundedYear is the company's founding year from the about page, not a release date; no page read gives the first public release. The Content Delivery API returns JSON over HTTP GET and must be enabled in configuration; GraphQL is not mentioned for the CMS. Umbraco 18 is STS, 17 LTS. The old community site our.umbraco.com redirects to community.umbraco.com. Coined fields: `nugetName`, `nugetDownloads` (NuGet counterparts of packagistName and packagistDownloads); reused `foundedYear`, `databaseMin`, `paidAddons`, `hostedOffering`, `latestPrerelease`, `youtube`.
