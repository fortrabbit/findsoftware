notes: >
  The npm package is simple-parallax-js, the name the README install route and badges use; the npm package simple-parallax is a different project (a 2017 plugin by another author, last modified 2022), so no figure is taken from it. The homepage calls the library "a React component and JavaScript library" and says "It started as a jQuery plugin, became a vanilla JavaScript library, and is now built for React, with the vanilla build still available"; basedOn react rests on that sentence. The React and vanilla builds are entry points of the same package, and the React version declares react and react-dom as peer dependencies at 17 or later; the peer dependency is not a basedOn statement, and the basedOn react entry rests on the homepage sentence alone. The README says the package "targets recent evergreen browsers" since v7 and that older browsers that cannot parse ES2020 do not run the script, and that you need to transpile it yourself, for example through your bundler's target; no Node runtime is stated. The README also says the library relies on the IntersectionObserver and closest() browser APIs. The npm weekly figure is the sum of the daily counts for 2026-11-01 to 2026-11-07. The stable line is 7.x: v7.0.1 (2026-11-16) is the highest stable GitHub release and the npm latest; the 5.0.0 alpha and beta prereleases (2019) are older than the stable release, so no latestPrereleaseDate is recorded. The oldest tag 1.0.0 is dated 2017-11-15 (committed date), older than the npm upload 4.0.0 (2019-01-07), so firstRelease is from the tag. The homepage says the package is "Free for personal and commercial use" under the MIT license; no paid edition is stated. The HTTP Archive technologies file lists no simpleParallax entry, so httpArchiveSites is absent.
