notes: >
  The project homepage named in the README and on GitHub, https://apprr.rf.gd/HtmlBuilder/, answers with a JavaScript cookie challenge and no page content, so it is unreadable and no homepage is recorded; the README's own sentence about that page is not a fact about its content. The repository has one GitHub release, 0.0.2-2, which is a prerelease (2026-01-27), and 23 tags up to 0.3.6.9 that are not releases; no stable release exists, so currentMajor and latestReleaseDate are not recorded. The license is MIT per LICENSE.md, while the GitHub API reports NOASSERTION because the file is not named LICENSE. The LICENSE.md also carries a Russian text of the same license with the author's name in Cyrillic; the English form is recorded. The README says the app is useful for sites hosted on P2P networks and jamstack hosts such as Vercel; that is a usage statement, not a deploy target, and is not recorded. The bridge endpoints (PHP, Node.js, Python) are upload helpers for a server, not a deployment target, and are not recorded. The README names a built-in web server, an FTP updater, a menu constructor, one-step commit to GitHub Pages, and an Ollama client, and lists translations to English, Spanish, Chinese and Korean (the application interface, so i18n is left out); these have no fact field and are not recorded as facts. The help file english_help.txt names a site at htmlbuilder.onhalt.site, which does not resolve. Desktop use is not stated in words, so no desktop category or runsAs local is recorded. The firstRelease year comes from the only GitHub release; the tags reach back further and the copyright notice starts in 2012, so the year is the first release's and not the project's first commit.
