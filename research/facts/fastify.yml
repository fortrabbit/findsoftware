notes: >
  The serverless guide lists AWS Lambda, Google Cloud Functions, Google Cloud Run, Vercel, Netlify and Firebase Functions as targets, with the guide saying Cloud Run, AWS Fargate, Azure Container Instances and Vercel are where the server handles multiple requests at once; both run modes are recorded because the guide documents both. The homepage shows "Node.js 20+" next to the v5.x line. The npm package declares no engines field, so runtimeMin comes from the homepage. The homepage names the OpenJS Foundation as the project's home; the copyright line in LICENSE names "The Fastify team". Its homepage shows a 6.0.0-alpha.5 pre-release dated before the 5.12.7 release, so no latestPrereleaseDate is recorded. The Fastify Node.js ecosystem plugins (such as @fastify/static) are part of the ecosystem page, not separate records.
  The getting-started guide shows routes and plugins registered on an instance and a call to listen with a port. The homepage describes the framework as built on a plugin architecture and lists plugins such as @fastify/static and @fastify/rate-limit.
