notes: >
  The README names http://baker.misakai.com as the website, and the GitHub repository has no homepage set. On 2026-10-23 the host did not resolve in DNS (dig returns nothing, and the query through 1.1.1.1 answers NXDOMAIN, while misakai.com resolves), so no homepage is recorded and status is stub, following the dead-homepage rule. The README's "Build binaries" link to an Amazon S3 zip answers 403 on the same day, so the installMethod fact rests on the README text, not on a downloadable file; a reviewer should decide whether criterion 3 holds. The repository has no release or tag, and its newest commit on master is dated 2015-04-08, which is recorded as lastCommitDate. The project's own files carry no maintainer name: the copyright line in Baker.Runtime/Properties/AssemblyInfo.cs has a year (2014) and no name, so maintainer is the repository owner's GitHub account. The Windows path in the usage lines is quoted as written in the README. The runsAs value local rests on the README describing the built-in server as a testing aid.
