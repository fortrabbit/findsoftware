notes: >
  The project has no homepage: the repository names none and the README links only a Slack invitation. It has no stable release: every GitHub release (0.1.7 to 0.4.0) is marked prerelease, and the newest is 0.4.0 (2017-11-20), so latestPrereleaseDate is recorded and currentMajor is not. The last push to the default branch is 2018-01-02, which is far older than four years, so the import will move this record to stub under the release-age rule; status stays accepted here because no end signal was found. The README says the project was formerly named Edge. The README badge names Swift 4.0.2 and the install section lists Swift 3 and 4 packages; no version is recorded. The oldest GitHub release is 0.1.7 from 2016-10-17, also a prerelease. No page states how the server is run, so runsAs is left out. The runtime is native Swift, recorded as swift because the list has no native-binary value for it.
