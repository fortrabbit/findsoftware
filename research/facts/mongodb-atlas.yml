notes: >
  Homepage: the link https://www.mongodb.com/atlas redirects to https://www.mongodb.com/products/platform, which is used here. Hosting: the cloud-providers reference says "Atlas supports deploying clusters onto the following cloud providers" and names AWS, Google Cloud and Azure; no data-region or EU-hosting statement was read, so regions is left out. Legal entity and country come from the terms of use, which apply to the whole site and are the same entity as the mongodb record. The sso statement comes from the federated-authentication page. Pricing: the pricing page lists tiers (Free, Flex, Dedicated) and its prices are not recorded. The Atlas record takes nothing from the MongoDB Server repository, per the hosted-service rule. The server software that Atlas runs is the separate mongodb record. Fields coined: none.
