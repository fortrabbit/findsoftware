notes: >
  The homepage in the CSV is the repository; the project's own site is limonade-php.github.io, which the README links as limonade-php.github.com (that host does not resolve). Packagist holds sofadesign/limonade with 5,890 total downloads and only a dev-master version; the install docs name a manual copy, not Composer, so no Packagist figures are recorded. The latest tag is v0.5.1, dated by its commit; there are no GitHub releases. The last push is 2023-10-13. No end signal was found. The README says the project is inspired by Sinatra and Camping; that is not a basedOn relation and is not recorded. The version 0 is a pre-1.0 tag, recorded as the major. The maintainer is the site footer's copyright holder; the LICENSE names the same person.
