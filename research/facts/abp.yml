notes: >
  Highest stable GitHub release is 10.7.0 (2026-10-06), the release flagged latest; 10.6.2 (2026-10-12) is a patch on the 10.6 line. The newest prerelease, 10.7.0-rc.5 (2026-09-21), is older than the stable release, so no latestPrereleaseDate is recorded.The first GitHub release in the list is v0.3.1 (2018-06-27), the oldest of 303 releases, and the repository was created in 2016; firstRelease follows the release list. The ASP.NET Boilerplate end-of-support page states the successor relation; no ASP.NET Zero record exists, so it is not added to successorOf. The homepage newsletter is a sign-up form (Subscribe to the Newsletter) with no separate page. Commercial modules (Identity and SSO, SaaS, Payment, Audit Logging, CMS Kit, GDPR) and support and tooling tiers are sold next to the open source framework; they are sold as the Team, Business and Enterprise licenses on the pricing page, recorded as paidEdition. The deployment page does not state a process model, so runsAs and renderingModes are left out. The maintainer is the legal entity named on abp.io/terms-conditions; the same page states it is registered in Turkey.
