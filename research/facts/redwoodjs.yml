notes: >
  The homepage is left out: redwoodjs.com answers with a redirect to rwsdk.com, the site of RedwoodSDK, a separate project in the redwoodjs/sdk repository (its own candidate). The docs at docs.redwoodjs.com are the framework's own site. The docs banner "RedwoodSDK is now available!" and the README's "Big News" section name the successor; neither states that RedwoodJS has ended, so the status stays accepted. The Node requirement is stated on the 8.8 docs (the newest docs version, besides Canary) and in the repository root package.json engines; the current release is 8.9.0. No page in the README, docs or npm metadata states that RedwoodJS has ended or is in maintenance; the repository is not archived and the package is not deprecated. The npm package named by the install docs is create-redwood-app, a scaffolder; the core package @redwoodjs/core is recorded instead, and create-redwood-app had 11198 downloads in the same week. The repository was renamed from redwoodjs/redwood to redwoodjs/graphql. The README names three maintainers (David Thyresson, Daniel Choudhury, Josh GM Walker) under "Core Team: Maintainer and Community Leads"; the legal name is not stated, so the maintainer is the copyright line. The Serverless Framework deploy target to AWS Lambdas is marked deprecated on its page; that is one deploy target, not the project. The README's "Bighorn Epoch" section describes an unreleased development epoch. The canary tag was published before the latest release, so no latestPrereleaseDate. Field kinds coined here: none.
