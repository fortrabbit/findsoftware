notes: >
  The README shows a configuration with devServer: true and runDev(), which states no hosting need, so runsAs is left out. No homepage is recorded. The repository metadata names http://fuse-box.org, which is plain http; the https address fuse-box.org answers 200 but serves an unrelated blog about Angular and programming, so it is not the project's site. Under the dead-homepage rule this would make the record a stub; the archived repository is a stronger signal and sets discontinued instead, and a reviewer may prefer stub. The repository is archived (last push 2022-12-01). The README opens with "LIMITED SUPPORT. USE AT YOUR OWN RISK" above "FUSEBOX v4 is out!"; limited support is not an end statement. The README names a Slack workspace at slack.fuse-box.org; no field holds it. The npm package fuse-box is the one the README install step names. Its latest dist-tag 4.0.0 is dated 2020-12-21, and npm shows no deprecation. The runtime quote is the engines field at the v4.0.0 tag; master is at 4.0.1-next.8, a prerelease. The LICENSE copyright line names fuse-box, not a person; the author in package.json names Ivan Orlov. The x link is taken from the README badge and is recorded without a quote, as the rule for a badge link allows. The first npm upload is 1.1.0 (2016-10-28), which sets firstRelease.
