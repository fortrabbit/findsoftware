notes: >
  No homepage: the crates.io record and the repository's homepage field both name https://deepwiki.com/zino-rs/zino, a third-party generated wiki rather than the project's own site, and it answered 429 when read. The README gives no own site. The GitHub releases end at 0.43.0 (2026-03-28); tags run to 0.46.2 and crates.io has 0.46.3 (2026-10-26) without GitHub release objects, so currentMajor and latestReleaseDate follow the newer crates.io upload, and runtimeMin is the rust_version crates.io lists for that release (1.95), which the README's Cargo.toml example repeats. crateDownloads is the all-time total from crates.io. The crate's first upload is 0.1.0 (2022-12-29), the same day as the repository. Maintainer is the copyright holder in LICENSE with no legal form; the README's "Community" section names no other contact. The README's integrations (actix-web, axum, dioxus) are named as integrations, not a parent, so basedOn is absent.
