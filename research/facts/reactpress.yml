notes: >
  The homepage is the docs site, which the GitHub repository also lists as its homepage; the live demo is blog.gaoredu.com. The FAQ says Docker is not needed by default and is only required for the embedded-docker or external MySQL configurations. The desktop client is an Electron shell with SQLite local mode and remote sync, described on the docs; it is a second install and not a separate record. The npm package @fecommunity/reactpress reports engines node >=18 in its metadata while the README and the install docs say Node 20 or higher; runtimeMin records the README statement. The GitHub repository is the monorepo, and the install command names the CLI package, so the npm figures are that package's. The first GitHub release is v1.0.0 (2024-10-27), and the docs changelog dates 1.0.0 to 2024-09-28. The docs describe a hook-based plugin system with a plugin.json manifest, and swappable Next.js themes installed from an npm catalog. The npm package @fecommunity/reactpress-server is deprecated in favor of the CLI package. The docs describe the Docker production setup with a MySQL database, an API, a Next.js frontend and an nginx proxy. The docs table lists the stack as Vite and React for the admin, NestJS for the API and Next.js for the theme.
