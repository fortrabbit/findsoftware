notes: >
  The repository is a monorepo; the actix-web package is tagged actix-web-vX.Y.Z, and the highest stable actix-web tag is actix-web-v4.18.1 (2026-10-23). The GitHub latest-release flag points at another package, so latestReleaseDate comes from the actix-web tag. Two MSRV statements, each recorded as its own runtimeMin entry: the README says Rust 1.89+, the getting-started page and the what-is page say 1.72. The first crates.io version is 0.1.0 (2017-10-23). The deployment page (actix.rs/docs/deployment) returns 404, so deployment targets come from the what-is page. The getting-started page is the install page. The crates.io figure is all-time downloads; the 90-day figure is 12472586 and is not recorded.
