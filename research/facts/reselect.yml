notes: >
  Accepted: the CSV row is accepted, and the repository is not archived; the last push was 2026-10-28. The README calls Reselect "Commonly used with Redux, but usable with any plain JS", so it gets no basedOn, and the Redux Toolkit package that bundles it is installed from npm too, so it adds no separate route. The Redux docs Discord and Stack Overflow links on the docs site belong to Redux in general and are not recorded as Reselect's own. The homepage is the Redux docs site: reselect.js.org, named in the README, redirects to redux.js.org/reselect. The maintainer follows the LICENSE copyright line; the repository belongs to the reduxjs organization, which is not named in the LICENSE. No runtime is stated on the docs pages, so none is recorded; the package.json has no engines field. The npm figure is the reselect package the install line names, summed day by day from 2026-11-01 to 2026-11-07 (the range endpoint). latestPrereleaseDate: the newest prerelease, 5.0.0-rc.1 (2023-12-02), is older than the latest stable release, so none is recorded. The npm package has no deprecation flag. firstRelease: the npm 0.0.1 upload and the repository creation both date from 2015-07-01. currentMajor is 5 from v5.3.0. The docs describe the 5.0.0 changes (TypeScript support from 4.7 onward) without an end statement.
