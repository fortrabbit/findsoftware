notes: >
  The repository's default branch is V5, and the README and LICENSE were read there. The README's licensing section says V4.0, V5 and V6 are free for individuals and paid for enterprises, see LICENSE; V1.0, V2016, V2017, V2019 and V2021 are MIT. The LICENSE file is written in Chinese; the quoted clause limits non-commercial use to individual users, and clause 1.4 requires a commercial authorization from the copyright holder for commercial use. The copyright line in LICENSE reads "Copyright (c) 2022 PublicMS", a different spelling from the maintainer named in the README; maintainer follows the README and the LICENSE holder is noted here. The English homepage title calls the product a free commercial version; the content recorded above follows the license file and the README. The English homepage lists a multi-language back end as a development-branch feature, so i18n is not recorded. The release list includes V4.0, V5 and V6 lines; currentMajor is the highest stable one, V6. The AI features in V5 are described on the homepage and are not a field here. The homepage states the product "currently has 0.0005% of users globally" without naming a measure, so no usageShare is recorded. The about, introduction and technology pages name no street address or country for the company, so hqCountry is unknown. The README says V4.0 needs Java 1.8, V5 Java 17 and V6 Java 21; runtimeMin is the V6 line, which is the current major.
