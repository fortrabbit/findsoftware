notes: >
  The repository's homepage field names the documentation site, recorded as homepage, with the introduction page as docs. The built-in PHP server is documented as local only; that is not recorded as runsAs, which describes the live site. The documentation is in English, Russian and Chinese; the CSV note says Russian-language docs, and the English pages were read here. The Telegram support group (@phphleb) is named on the installation page without a link, so it is not recorded; the Packagist monthly figure (39) is not recorded, only the total. The repository has no LICENSE file on master; the MIT statement comes from composer.json and the site footer, and the GitHub API license field is null. The repository's composer.json lists Foma Tuturov as the only author, and the site footer names him as the copyright holder; no legal form is stated, so the name is recorded as the project states it. The framework's standard templates are named on the Twig page without a page of their own read here, so templating records only Twig. The PDO note on the installation page names pdo_mysql only as an example, so databases stays unknown. The introduction page names LibArea as a project built on HLEB2; that is a software built on this one and gets its own record, not a basedOn fact here.
