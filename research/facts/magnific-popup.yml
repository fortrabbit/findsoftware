notes: >
  The README opens with "This jQuery plugin is deprecated, only critical or security bug fixes will be released in future" and points readers to the native dialog element for a basic dialog and to the maintainer's PhotoSwipe library for an advanced image gallery; the status is discontinued because the maintainer states the project is deprecated, although fixes continue. The CSV homepage was http://dimsemenov.com/plugins/magnific-popup/; that address redirects to the https page, which is recorded. The README names Zepto.js as a second library it works with, so it is in the basedOn quote as a statement of what it is a plugin for; no Zepto record exists. The LICENSE copyright names Dmytro Semenov and the README says "Created by @dimsemenov and contributors"; the README also says "Script is MIT licensed and free and will always be kept this way" and asks that no public WordPress plugin be based on it without contacting the maintainer; that request is a condition stated next to the license and is recorded here, not as a second license entry. The README lists a Ruby gem (magnific-popup-rails), a WordPress plugin under development, and CMS extensions by third parties; none is recorded as an installMethod or pluginDirectory. The bower route is named in the README as optional. The documentation page links the maintainer's personal Twitter account and newsletter; they belong to the developer, not the project, so no x or newsletter is recorded. The repository's latest commit is 2024-06-08, the same day as release 1.2.0. The CSV npm figure (30.8k a week) is replaced by the registry sum for the period.
