notes: >
  No homepage: the GitHub homepage field is empty and the README names no project site, so homepage is not recorded and the repository is the only link. The README says 2.x is in maintenance mode and that the documentation covers 3.0; the 3.x line is the current major, so the 2.x note is not a status change. The README lists third-party integrations for Symfony, Nette, Zend Framework 2, WordPress and framework-agnostic packages; these are other projects' packages, so they are no basedOn and no alternativeTo. The composer.json at 3.17.0 requires FakerPHP/Faker and other packages; a dependency is no basedOn statement, so Faker is named in the description from the README sentence instead. The README links the Symfony integration as the framework integration in its getting-started guide; no framework is recorded as a parent. The Packagist and GitHub license both say MIT, and LICENSE carries the copyright line for Nelmio. The first tag is 1.0.0, whose commit is dated 2012; the oldest GitHub release is 1.5.0 from 2013. Stars and contributors belong to the single repository, which is not a monorepo. The runsAs local value follows the README sentence that the library is for developing or testing; it is not a live-site statement. The README example declares entities with properties and references such as @user1, where placeholders like <username()> produce generated values, and loads the file with the NativeLoader class; the README's BCP section calls NativeLoader the no DIC solution. The README also carries a Slack badge for a channel in the Symfony Slack, which is a general community chat and no project forum.
