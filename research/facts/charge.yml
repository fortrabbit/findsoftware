notes: >
  Highest stable GitHub release is v1.7.0 (2020-03-12), so currentMajor is 1. The npm name "charge" belongs to another project (carrot/charge, version 0.1.0, 18 downloads in the week of 2026-10-12); the install page says "The charge package on npm is not this package", so npmName is @static/charge. The site says it "generates a truly static site" and the README names no other output. The homepage says React renders the pages server-side and the package.json depends on it, but the project does not name React as a parent, so basedOn is left unknown. The docs name Amazon S3, Netlify, Vercel and Heroku as deploy targets; the companion Discharge tool for S3 is a separate project and not recorded. The repository was last pushed 2024-07-17 and the last release is from 2020; the import handles the stub move on release age. The repository has no LICENSE file on master at the path tried; the MIT statement comes from the README and package.json.
