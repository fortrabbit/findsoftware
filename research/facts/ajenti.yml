notes: >
  Doubt: whether a general Linux admin panel with stock plugins for system settings, services, cron, packages, network and files is a website tool. Criterion 1 needs the panel's own pages to say it serves, protects or exposes websites or web apps (managing websites or web servers); the docs list stock plugins (check_certificates, cron, dashboard, datetime, docker, filemanager, fstab, network, notepad, packages, plugins, power, services, session_list, settings, terminal, users) and none is a website or web server manager, and the Fail2ban rule protects the panel itself. A reviewer settles it by reading the plugin pages for websites or web servers; if none exists, reject on criterion 1. The homepage ajenti.org answers with a redirect to github.com/ajenti/ajenti, so the project's own site is the repository and homepage is left out. The docs at docs.ajenti.org show version 2.2.18 in their title; the docs pages were read over https. The latest stable release is 2.2.18 on PyPI (uploaded 2026-10-25) and tag v2.2.18 (commit 2026-10-25); the GitHub release list stops at v2.2.15 (2026-03-31), so latestReleaseDate follows PyPI and the GitHub release date is 2026-03-31. The docs say "Supports Python 3.5+." while ajenti-core/setup.py at the tag says python_requires '>=3'; runtimeMin follows the manifest as the rule says, the 3.5 statement stays in the docs. The MIT license is the only license text in the repository; GitHub detects it as MIT. The docs' install script at scripts/install.sh installs at OS level and the docs call it not recommended, so it is not recorded as a route. The README calls the panel "Ajenti 2"; the Python package for the panel is ajenti-panel. PyPI reports the license as null. The GitHub homepage field points to http://ajenti.org/core/, which redirects to GitHub.
