notes: >
  The CSV homepage is the project page on lyften.com, which answers 200 over https (the CSV has http). The install guide names composer create-project torann/skosh, which is a skeleton that requires torann/skosh-generator, so the Packagist figures and the release date come from the core package torann/skosh-generator, whose source is the Torann/skosh-generator repository. Its skeleton pins an older generator line than the newest stable release, which is recorded as the current major. The guide requires PHP 5.4.0 or later and Node; the generator's composer.json at the newest tagged release requires PHP ^7.2, which is recorded as runtimeMin, and the guide's older figure is not recorded. The guide installs the Gulp command line through npm and the README says JavaScript and Sass files are managed by Gulp; both belong to the Node toolchain. The README states that the generator supports RSS and sitemaps. The project page says Skosh is built on Symfony's HTTP Kernel, which lets Symfony bundles extend it; no record has that id, so basedOn is not recorded. No bundle is recorded. The copyright line in the LICENSE is 2015-2020 and the lyften.com footer reads 2008-2023 Lyften; the maintainer is the LICENSE name because it is the legal notice for the code, and no page says Lyften owns the project, so parent stays unknown. The repository has no release after 0.3.0 on the skosh repository; the release date is the core package's. Its last push is 2020-01-15.
