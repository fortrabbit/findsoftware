notes: >
  The project has no homepage of its own: the GitHub repository has no homepage field, and the PyPI homepage points to the repository, so no homepage is recorded. The README is the documentation; the PyPI documentation link points to the same README.rst. The install section of the README gives pip only inside a code block ("pip install freezegun") and names the Debian package python-freezegun as a distribution route; neither is recorded as an installMethod because the sentence around them names no route and the Debian package is third-party. The PyPI author field and setup.py name Steve Pulec as the maintainer; the LICENSE is the standard Apache 2.0 text without a copyright line. The first PyPI upload is 0.0.1 dated 2012-12-11; the GitHub tags begin at 0.1.2. The highest stable GitHub release is 1.5.5 (2025-08-09), which matches the PyPI latest version. The last push to the repository is 2025-08-19 and the repository is not archived; no end signal was found. The pypi download figure is the pypistats recent endpoint, last_month value, and the period is recorded in the value. The requires-python setting is taken from setup.cfg at the 1.5.5 tag because the pyproject.toml has no python requirement.
