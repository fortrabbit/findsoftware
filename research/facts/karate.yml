notes: >
  Karate Core is the MIT-licensed open-source framework. Karate Enterprise (commercial edition, with the async protocol pack, Enterprise IDE licenses and Karate Agent), Karate Xplorer (desktop API IDE, free tier with a paid Premium plan), IDE Plus and Pro plugins and Karate Sensei (license portal) are separate paid products or tools named on the pricing and enterprise pages; the open-source record keeps MIT as its license and the Enterprise edition as paidEdition. The maintainer is the legal name on the terms page, "Karate Labs Inc., a Delaware corporation"; the LICENSE copyright line says "Karate Labs". The enterprise page compares licensing as MIT, perpetual for open source and Commercial, annual for Karate Enterprise; the commercial license covers the paid edition, recorded as paidEdition, not the MIT framework. The JSON-LD on the same site gives a Sugar Land, Texas address, and the visible contact block gives Wilmington, Delaware; both are in the United States. hqCountry US comes from the visible contact block of karatelabs.io/terms, which names Karate Labs Inc. at Wilmington, Delaware, United States. The homepage says the open-source framework is "trusted by 76 of the Fortune 500 and 650+ companies"; that is a company count, not an install count, and is left out of reportedInstalls. Adoption: GitHub stars and contributors on 2026-11-16, no npm or registry package for the core (Maven only, no download figure). The homepage also links a LinkedIn page for the company, which has no field. The VS Code extension is the install route the docs recommend for beginners, since it installs the CLI and Java; the IntelliJ plugin needs a Maven or Gradle project and is not recorded as installMethod. The compare pages also cover Karate Agent against selenium-ai, playwright-ai, cypress-ai and computer-use agents; those compare the enterprise agent and are not recorded. The documentation on docs.karatelabs.io describes the v2 line; the v1.5 README is preserved at a tag. The Maven group id io.karatelabs replaces the older com.intuit.karate; firstRelease is the 2017 GitHub release, which is older than any upload under io.karatelabs on Maven Central. Karate Agent and Karate Enterprise are described as self-hosted, so no hostedOffering fact is recorded.
