notes: >
  The repository has no release or tag, so the status rests on lastCommitDate: the newest commit on the main branch is dated 2025-07-11, and no end statement exists on the pages or in the README. The CSV boundary question is answered by the rule that a project without a release is judged by its last commit. The components are copied from the site and the repository holds their HTML source in components/; no package or CLI exists. The homepage shows the templates "Stellar" and "Gray Showcase" with prices and says "premium collection of Tailwind CSS components", while the README says "Free Tailwind CSS Components"; no paid edition of the open source components is stated, so paidEdition is not recorded. The templates are sold beside the components and no prices are recorded. The homepage names the Tailwind CSS version it targets; no version is recorded. The LICENSE names Khatab Wedaa; no legal name, country or company is stated on the pages read. The GitHub repository creation date (2020-05-01) is not a release, so firstRelease is not recorded. The donation links (Patreon, Buy Me a Coffee, PayPal) are not fields. The basedOn statement uses the homepage phrase "Tailwind CSS Components"; the reviewer may decide whether that counts. Each component page offers LTR and RTL variants, a dark mode view and a copy button for the code, as shown on the cards page.
