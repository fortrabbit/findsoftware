notes: >
  The README says Parsedown is "GitHub flavored" and "passes most of the CommonMark tests" (CommonMark compliance goes to notes, not a field). The safe-mode and escaping methods (setSafeMode, setMarkupEscaped) are documented in the README. The README links the Markdown Extra extension (erusev/parsedown-extra) as a separate project; it is not recorded as an extension of Parsedown. The README names the lists of projects that use Parsedown (Laravel, Bolt CMS, Grav, Kirby and others); those are users, not parents, and no basedOn or alternativeTo is recorded from them. The homepage (parsedown.org) answers over https and shows the demo and the composer example; the repository's readme.md is the lowercase file name on master. The v2.0.0-beta-1 prerelease (2022-05-21) is older than the stable 1.8.0 release, so no latestPrereleaseDate. The maintainer is the copyright holder in LICENSE.txt, and composer.json at 1.8.0 names the same person. The Packagist figure counts the package erusev/parsedown that the README installs. The runtime is taken from the composer.json at the 1.8.0 tag, the latest stable release, which requires PHP >= 7.1 and the mbstring extension. The firstRelease is the year of tag 0.1.0 (commit dated 2013-07-10); the oldest GitHub release is 0.3.0 (2013-11-02). The README Features list says One file, No dependencies, Extensible and GitHub flavored, and its Questions section calls the approach line based: it reads the lines to recognise blocks, then the special characters to recognise inline elements. The README says to call setSafeMode(true) when processing untrusted user input, and warns that setMarkupEscaped(true) is not safe from XSS.
