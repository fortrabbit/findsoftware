notes: >
  Status accepted per the CSV row; the CSV note placed Nx in scope on 2026-10-19 as a generic monorepo task runner, and the record keeps that scope: it builds and caches the tasks of web and other projects, which is criterion 1. The README calls Nx a monorepo solution built with Rust and extensible via TypeScript; the implementation language is not recorded as a runtime because no page states the runtime Node.js or another runtime, and the npm package is a JavaScript CLI (bin dist/bin/nx.js) that the registry shows but no docs page names as the runtime; a reviewer should decide whether runtime node is recorded from that package. The npm package nx first appears in the registry with a 2011 creation time, which belongs to an earlier package; firstRelease follows the oldest GitHub release (2018-04-18), since the repository was created in 2017 and its earliest release is in 2018. The maintainer name is the copyright line of the LICENSE; the site footer says "Nrwl"; no imprint or contact page gives a country, so hqCountry is left out. Nx Cloud is the hosted service next to the open-source CLI; its plans (free, team, enterprise) are hosted plan tiers and are not recorded as paidEdition, and no prices are recorded. The Enterprise page names dedicated support and custom deployment, which is not recorded as selfHostOption because no installable part is named. The npm weekly figure is the sum of 2026-09-28 to 2026-10-04, the window the build-dev rules name. The footer and the Enterprise menu were the only places the LinkedIn and YouTube links appear; LinkedIn and YouTube have no field, so they are not recorded. The x link is recorded without a quote because the URL sits in an icon's href, and the rule for quotes reads page text.
