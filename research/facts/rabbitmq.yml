notes: >
  The copyright line of the repository README reads "(c) 2007-2026 Broadcom" and the term is defined as Broadcom Inc. and/or its subsidiaries, recorded as maintainer. The contact page says "As the owner of RabbitMQ, VMware Tanzu employs the core engineering team"; Tanzu is a business unit inside the maintainer Broadcom, so no parent is recorded. Protocols the homepage names: AMQP 1.0 and MQTT 5.0. The Docker image the download page shows is rabbitmq:4-management. The LICENSE file names MPL 2.0 for the server and its tier 1 plugins and Apache 2.0 for some OCF files, recorded as two license entries. GitHub's detected license is NOASSERTION because of the two statements. The GitHub language statistic reads JavaScript because of the management UI; the server is written in Erlang, recorded as the language. The firstRelease of 2008 is the commit date of tag rabbitmq_v1_4_0, the oldest tag in the repository by commit date among those checked; the project's 2007 origin is not on a page read here. The runtimeMin is the Erlang/OTP minimum of the 4.4.0 row of the compatibility matrix on the which-erlang page. The management plugin's HTTP API manages and monitors nodes and clusters; it does not serve site content, so headlessApi is not recorded. The compare page names Kafka, which has no fact file in this repository, so no alternativeTo is recorded. The Docker image is the community-maintained image, and the Docker Hub library/rabbitmq pull count is the one recorded. Tanzu RabbitMQ on Kubernetes and Amazon MQ for RabbitMQ appear on the download page; neither is a hosted offering of the open source server by the project, so no hostedOffering is recorded. The LDAP docs page is the source of the ldap sso value; the OAuth 2 backend page is the source of the oauth2 value. The footer Terms of Use link (broadcom.com) is a JavaScript shell, so hqCountry stays unknown. The Windows installer installs RabbitMQ as a Windows service.
