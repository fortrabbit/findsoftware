notes: >
  The LICENSE file holds two copyright lines: "Copyright (c) 2008 Aslak Hellesøy and contributors" and the 2013 Cucumber Ltd line recorded as maintainer. The Maven Central artifact is io.cucumber:cucumber-java; the cucumber-junit and cucumber-junit-platform-engine artifacts are companions and carry no record of their own. The runtimeMin is the Java baseline the 8.0.0 changelog section names; no pom compiler requirement was recorded. Maven Central publishes no download figure. The stars, contributors and dependents belong to the cucumber-jvm repository. The community links come from the cucumber.io community page, which serves the Cucumber project across its implementations. Legal pages on cucumber.io (privacy, terms, legal, about) returned 404, so the company's country is unknown. The newsletter is the Buttondown subscribe form on the community page. Dependents come from ecosyste.ms and are counted per Maven artifact.
