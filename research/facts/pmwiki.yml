notes: >
  There is no source repository: the project publishes its releases and source archives at https://www.pmwiki.org/pub/pmwiki/, so repository and the GitHub figures are not recorded and sourcePublic cites that directory listing. Criterion 5 is not met on the facts found: no company stands behind the project, and its pages give no adoption figure; the PmWikiUsers and SuccessStories pages list named sites without a count. The license is stated two ways: the features page says the author "has released it under the GPL2 license", and the homepage says "distributed under the General Public License" without a version. Both are recorded. The maintainer is the person the homepage names as maintaining the project; the homepage also names Patrick R. Michaud as the registered trademark holder and as the oversight person, and that name is not recorded as maintainer. runtimeMin is the minimum on the Requirements page. The pay-for-PmWiki page mentions "my company in France" without naming it, so hqCountry stays unknown. The homepage calls extensions "recipes" and lists them in the Cookbook; the pluginDirectory fact carries that link.
