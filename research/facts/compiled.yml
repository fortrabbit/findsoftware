notes: >
  The homepage and the docs site are a client-rendered shell (an empty div with a script), so the homepage fact comes from the repository's homepage field and the docs fact from the docs source in the repository. The install page names @compiled/react, the package recorded here; the Babel, Vite, Webpack and Parcel plugins are sibling packages and not counted. npm lists Michael Dougall as package author and the npm maintainer account is atlassianartifactteam; the maintainer is recorded as Atlassian from CONTRIBUTING.md, which names no legal entity, so no legal form is given and hqCountry is not recorded. The GitHub release tags for @compiled/react start at 0.6.8 (2021); the npm 0.5.0 upload of 2020-12-17 is the earliest stable version, so firstRelease is 2020. npm canary versions (0.4.8-<commit>) are not counted as releases. Contributors counts accounts from the API list with per_page=1 without anonymous accounts, read from the Link header. Atlassian says it does not officially support use outside Atlassian products, which the maintainer field carries as a quote and nothing more.
  The about page says it parses styles written in JavaScript, transforms them and outputs them as atomic CSS, with style sheets produced at compile time. The limitations page says dynamic selectors cannot be created and that dynamic styles cannot be mixed with indirect selectors. The about page says the older Styled API will eventually be retired.
