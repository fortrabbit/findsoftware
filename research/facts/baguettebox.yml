notes: >
  The repository is a single JavaScript package; the CSV lists the same repository. The license file and the README disagree on the copyright line: LICENSE says "Copyright (c) 2017 Marek Grzybek", the README license section says "Copyright (c) 2018 feimosi". The maintainer follows the LICENSE line; both wordings are MIT, so one license entry. The GitHub account feimosi is the repository owner (user). The README links a PayPal donation and a Twitter account badge labeled "Follow the author" (twitter.com/feimosi); that is the author's account, not the project's, so no x field is recorded. The homepage is the GitHub Pages demo the README links as "Demo page"; it names no install route. No page states that the lightbox runs in the browser in a sentence; the Compatibility section lists desktop and mobile browsers, which is support, so runsAs stays out. The README's Usage section calls baguetteBox.run with a CSS selector for the gallery; captions come from a title or data-caption attribute on the a tag, and responsive images from data-at-{width} attributes. The README says the script has no dependencies and is around 3.2KB gzipped (coined kinds, kept here: bundle size, pure JavaScript, responsive image attributes, SVG buttons). The Compatibility section lists IE 8+, Firefox 3.6+, Opera 12+, Safari 5+ and mobile Safari and Chrome on Android. The README says the project "was inspired by" the jQuery plugin touchTouch; that is inspiration, not a basedOn statement, so basedOn stays out. The npm weekly figure is the sum of 2026-10-26 to 2026-11-01, the period in the value. The first GitHub release is v0.1.0 (2014-07-23), older than the npm upload of 1.3.1 (2015-02-01). No HTTP Archive technology entry matches baguetteBox. The latest release v1.13.0 is from 2025-11-09; the default branch dev was last pushed 2026-03-09.
