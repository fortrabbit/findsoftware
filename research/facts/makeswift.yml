notes: >
  Hosted visual builder for a Next.js app that uses the open-source runtime package @makeswift/runtime (npm, MIT per the GitHub API for makeswift/makeswift, the SDK monorepo, 248 stars at read time; SDK sources and the npm figures go here only, no repository fact). The site's front end runs on Makeswift's default host or on a custom host (hosting settings page; the deploying overview lists Vercel, Netlify and Docker). Quickstart: the CLI creates a Next.js app and connects it to a site. Requirements per the quickstart: Node.js 20.19 or a later version, and the CLI command links the app to a site with an API key. The Commerce terms list Makeswift, Inc. as a Delaware corporation in the United States, an incorporation and no headquarters address, so hqCountry stays out; they name Commerce.com US, Inc. as the contracting party for Commerce services; the privacy policy places Makeswift among the Commerce entities. The CSV notes the tie to BigCommerce; pricing has a "Makeswift Only" track and a "With BigCommerce" track where sites equal storefronts in BigCommerce, plans Basic (free), Growth, Scale and Performance with per-month and per-year prices (none recorded). The pricing page lists "Roles & Permissions", "API Access", "Custom Domain", "Publish Rollbacks", "Selective Publishing", "Scheduled Publishing" and "Public Share Links" as features; the user management page names the roles. The REST API reference describes management of sites, locales, pages, regions, swatches and typographies; the fact records REST because the reference names it. Coined kinds (publish rollbacks, public share links, selective publishing) are feature labels and stay here. LinkedIn and YouTube links on the homepage have no matching fields.
