notes: >
  The project has no working homepage: juzaweb.com, cms.juzaweb.com and www.juzaweb.com do not resolve (curl exit 000), so homepage is absent. The Packagist package names https://juzaweb.com as its homepage and the README names https://cms.juzaweb.com; both are unreadable. The repository is github.com/digbly/cms: github.com/juzaweb/cms, the source URL of the Packagist package and the README's repository, redirects to it, and the project's own repository now lives under the digbly organization. The repository's own homepage field, https://digbly.com, is not recorded as the project's site. Maintainer is the name the README states, "Juzaweb Team"; the repository owner is the digbly organization, and no page gives a legal name or legal form. License is stated two ways: the repository detects GPL-2.0 from LICENSE.md, and composer.json and the Packagist package state MIT; each is its own license entry. Marketplace themes and modules need a license key from juzaweb.com, which does not resolve, so a marketplace exists but its pages are unreadable; paidEdition is not recorded. The README lists multisite (network) support and API support as unchecked features, so they are left out of the fact file. The databases fact follows the installation docs (MySQL 5.7 or MariaDB 10.2); the README says MySql 8.0 or higher for the modules package. The registry figure is for juzaweb/cms, the package the install docs name; sibling package juzaweb/modules has similar totals and also few monthly downloads. The repository's firstRelease is the first GitHub release date; the repository was created in 2020.
