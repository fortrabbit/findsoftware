notes: >
  The React hook and the Vue 3 composable are bindings the library ships alongside its framework-agnostic core, so no basedOn is recorded; the docs name them as "Usage in React" and "Usage in Vue 3" and the README names JavaScript, TypeScript, React, Vue, Angular and React Native as usable. The README also names a React Native support path, which the docs route to a separate page and is not recorded. The README's "Lightweight: No dependencies, only ~5.5KB gzipped" and its browser support list are not fields here. The LICENSE copyright line names Eric Beyer, and the GitHub owner rcbyr is a user account. The homepage has no social or contact links that the research found beyond its footer GitHub, Contact and NPM links. The npm figure is the keen-slider package the install page names, and is a weekly sum for 2026-11-01 to 2026-11-07. Adoption: GitHub stars and contributors on 2026-11-16, last release 2023-07-05 (v6.8.6), the npm latest tag matches it. runsAs is absent: no sentence states where the library runs; the docs' only mention is the browser's render performance with complex slides. The repository has RC tags only in an older major line, so no latestPrereleaseDate is recorded.
