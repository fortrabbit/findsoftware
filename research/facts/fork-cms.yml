notes: >
  The install page of the documentation names Composer, so the Packagist package forkcms/forkcms supplies the registry figures. The minimum-requirements page lists PHP 7.1 and MySQL 5.0, which contradicts the ^7.4||^8.0 constraint of the latest Packagist release; runtimeMin follows the latest release's composer requirement. The documentation says "Fork can not be installed in subdirectories" on the same page; that stays in the source for the prose. The GitHub repository has no release objects (releases/latest returns 404); the release date is the Packagist time of 5.12.3. The disclaimer page names an individual as a contact, with no legal form; the maintainer is recorded as the disclaimer states it, "Fork CMS", without a legal form. The disclaimer page gives a postal address in Ghent without a country, so hqCountry stays unknown. The extension directory link from the homepage redirects to an unrelated GitHub page and is not recorded. Fields coined: none.
