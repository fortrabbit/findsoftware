notes: >
  Status accepted: the repository is not archived, the last push is 2024-02-27, and no page or registry states that the project has ended. Packagist's latest version is v1.3.3 (2023-04-28), the same release as the GitHub latest.
  Wink is a Laravel package, so basedOn names Laravel; the README says it is installed into a Laravel app.
  runsAs is left out: the README names the Laravel app it is installed into and states no runtime requirement for Wink itself.
  packagistDownloads is the total, not a period figure; Packagist also reports 522 monthly at this date, not recorded here.
  The README says Wink is "used to manage the official Laravel blog", a use claim without a figure; not recorded as a fact.
  The README says Wink is faceless: frontend display is left to the app, so no templating fact is recorded.
  The repository's default branch is 1.x; the GitHub release and the Packagist version are both v1.3.3.
