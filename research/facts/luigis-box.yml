notes: >
  Hosted service record: no repository of the service is linked from the homepage, so no repository, license, stars or registry figure is recorded. The pricing page quotes plans named Growth and Enterprise and states that every plan includes the full feature set; these are hosting tiers and no paidEdition is recorded. Pricing is quote-based and measured in units, recorded without prices. The features page names a REST API, and the integrations page names Shopify, WooCommerce, PrestaShop, Magento and commercetools as platform integrations; neither has a field here, and headlessApi is left out because the field describes headless CMS APIs. The terms name a No-Code Self-Service Integration module, which is a way to integrate the hosted service and not an installable part, so selfHostOption is absent. The privacy policy says personal data is not passed to third countries outside the EU and EEA except to service providers under a Commission decision; no hosting region is stated, so regions is absent. The homepage links LinkedIn at linkedin.com/company/luigisbox, which has no field and is recorded here only. The /security/ address serves the homepage, so no security page is cited. The docs footer shows a copyright range of 2016 to 2025; firstRelease uses the launch statement on the about page instead. The about page names a comparison with Apache Solr; that page was not read and no Solr alternativeTo is recorded. The HTTP Archive figure is the mobile origins count for the technology named Luigi’s Box.
