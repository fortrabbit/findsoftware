notes: >
  No project website: the PyPI and GitHub homepage fields name only the repository, granian.emmett.sh does not resolve, and emmett.sh (the Emmett framework's site, the organization of the repository) does not mention Granian, so homepage is absent. The LICENSE copyright line names Giovanni Barillari, which is the maintainer; the GitHub organization is emmett-framework, and no page names a legal form or country, so hqCountry is absent. firstRelease is 2022 from the oldest GitHub release (v0.1.0-alpha.1, 2022-04-18); the PyPI first upload (0.1.5) is 2022-12-05, and the LICENSE says 2021, which is not a release date. The README describes the project as built on top of Hyper and Tokio, Rust libraries that are not records, so basedOn is absent. The Rust-built package is installed with pip and runs Python applications, hence runtime python, with requires-python >=3.10 from the v2.8.7 pyproject; the language is Rust by GitHub. The README calls Granian an HTTP server that Python applications are served with ("serve it using Granian CLI"), which is the always-on statement; its option list also has a worker-process count. The repository docs folder holds only the RSGI spec, and the README names no docs site or deployment page, so no docs fact is recorded. Dependents are from ecosyste.ms for the PyPI package. pypistats figures are the last week's downloads as of the date recorded. Fields coined here: none.
