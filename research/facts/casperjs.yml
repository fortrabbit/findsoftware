notes: >
  The repository is archived (GitHub API archived true, last push 2020-04-03). Its description on GitHub reads "CasperJS is no longer actively maintained. Navigation scripting and testing utility for PhantomJS and SlimerJS", which the project states about itself; that and the archive flag are the end signals, so status is discontinued. The README on master does not repeat the statement. The project homepage casperjs.org and the documentation site docs.casperjs.org both redirect to a parked page on wallpapers.com on 2026-11-04, so no homepage is recorded and the documentation is read from the docs folder of the master branch on GitHub. Under the homepage rule of the brief a dead homepage would give stub; the end signals above give discontinued, and the reviewer decides. The npm package casperjs is not deprecated; its latest version is 1.1.4 (npm time 2017-05-10), and the GitHub release 1.1.4-2 (2017-11-18) is the newest stable release by date, so latestReleaseDate is 2017-11-18. Major 1 is the highest stable GitHub release line. The oldest release is 0.4.0 (2013-07-13). The CasperJS runtime is PhantomJS 1.9.1 or greater, with SlimerJS as an experimental engine; the installation page also requires Python 2.6 or greater for the bin script. These are engines and prerequisites, not runtime values, so runtime is left out. PhantomJS and SlimerJS are not record ids and are named as the tool's engines, so basedOn is left out. The README says PhantomJS 1.9 is unmaintained, which concerns PhantomJS, not CasperJS. The installation page warns that the npm package is not a Node.js module, so no node runtime is recorded. Contributors counted with the per_page=1 last-page method across all pages. No page states a dev-only or CI-only use, so runsAs is absent. The mailing list and the Twitter account are not recorded.
