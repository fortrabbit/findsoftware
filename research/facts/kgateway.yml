notes: >
  Kubernetes-only controller: in scope under the boundary ruling (server software, installed with Helm on a cluster). Status accepted; the Gloo Gateway OSS README says "It is the natural successor to Gloo OSS" about kgateway, but no kgateway page states a successor relation to Gloo OSS: the kgateway site says "Kgateway was launched in 2018 as Gloo" and "Kgateway was originally created by Solo.io and was known as Gloo", and the kgateway README says "the transition from Gloo to kgateway" and links a migration plan. successorOf gloo-gateway rests on the kgateway site sentence "Kgateway was originally created by Solo.io and was known as Gloo."; the README history section says the project was launched as Gloo and links a migration plan for the transition. The README states the project was launched in 2018 as Gloo by Solo.io and became production-ready in 2019; firstRelease 2018 follows the project's own statement. The GitHub repository kgateway-dev/kgateway is the project's own repository and is archived false; the GitHub fork relation of solo-io/gloo to it is not a statement of this record. The maintainer is LF Projects, LLC as the footer line "Copyright © kgateway, a Series of LF Projects, LLC" states; the README says kgateway is a Cloud Native Computing Foundation sandbox project, which is recorded as the foundation the project sits in, not as the legal owner. The README says the control plane for agentgateway moved to the agentgateway repository from 2.3.0; that is a separate project and is not recorded. The docs also state the Kubernetes Gateway API version the install uses, which is a version number and not recorded. The runtime is not stated on the pages read, so no runtime value is recorded beyond the Go language. A runsAs value is not recorded because no page says the control plane runs as a daemon or server process. The homepage links Slack at kgateway.dev/slack, a redirect to an invite; no field is recorded. Fields coined here: none.
