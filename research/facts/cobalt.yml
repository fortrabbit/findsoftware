notes: >
  The homepage cobalt-org.github.io answers over https (GitHub Pages) and is the project's own site. The install page names cargo install cobalt-bin; the gh-install line on the same page says --crate cobalt, which is a different crate (a networking library), so crateName is cobalt-bin. The crateDownloads figure is the crates.io total (recent_downloads is 477, a 90-day figure, not recorded). The repository is dual-licensed: LICENSE-MIT and LICENSE-APACHE both name the terms, and the GitHub API reports Apache-2.0; both are recorded as separate license entries. The README links LICENSE-MIT only. The highest stable release is v0.20.4 (2026-02-19), major 0. The oldest release in the releases list is dated 2017-01-13. The docs installation page says Windows, Linux and macOS are supported. The docs state Liquid templates for layouts, and the deployment page describes deploying the output to GitHub Pages through Travis CI, and GitLab CI, which are not recorded as fields. The usage page describes cobalt serve for local preview; it is not recorded as runsAs. The deployment guide also covers rsync and a git post-update hook for self-hosted servers. The help page names Gitter as the chat channel, which has no field. The contributors count is the last page of the per_page=1 contributors endpoint.
