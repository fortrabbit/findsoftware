notes: >
  Homepage given as https://www.dbgate.io/; the CSV has the bare domain and both answer with the same page. The repository is the Community edition under GPL-3.0; the README says it is free to use for any purpose, and the premium terms were not read. Maintainer: the contact page names Sprinx Systems, a.s. (Praha 4, Czech Republic) and Sprinx Systems, LLC (Huntington Beach, CA, USA) and names Jan Procházka as primary contact; the npm package dbgate-serve names Jan Prochazka as author. The record takes the a.s. entity, the contact page's legal name with an address, and its country as hqCountry; the homepage footer carries "© 2025, Sprinx Systems, LLC", the US entity. The parent is the Sprinx group, recorded as the contact page words it. Editions: Premium, Team Premium, the AWS and Azure editions (marketplace images with the same product) and the Academic license are paid or free licenses of the same product; the pricing page gives prices, which are not recorded. DbGate Lite (free, in the browser, local SQLite and DuckDB only) and DbGate Central (hosted, paid, in-browser, API connections) are separate products on the docs product table and are not on this record. The docs say DbGate runs as a desktop app or as self-hosted web; the always-on value rests on the README's "Docker container on server" wording. Only the Community and Premium editions are offered in the Windows, Linux and macOS downloads. The README database list adds CockroachDB, DuckDB, Firebird, ClickHouse and Cassandra, several marked Premium, and the Premium APIs (GraphQL, OData, OpenAPI); the databases field keeps the names the homepage sentence gives. Latest stable release v7.3.3 (2026-10-27) is the highest stable release; the newest prerelease (v7.3.3-premium-beta.15, 2026-10-27 09:14) is older than the stable one, so latestPrereleaseDate is left out. The root package.json at v7.3.3 requires Node.js >=24; the Electron entry point is in the app folder. The Docker Hub pull count is for the namespace dbgate, repository dbgate, which the README links; the npm figure is for dbgate-serve, the package the web install names, and counts only its own installs. The x link is the twitter.com address the homepage uses. LinkedIn and YouTube links are on the site with no field in the starter list and are not recorded. The first GitHub release is v0.0.1 (2020-05-11).
