notes: >
  The docs footer links X, Facebook, LinkedIn, YouTube, GitHub and a Stack Overflow tag (amplience-dynamic-content); the main site footer lists no Discord, Bluesky or Mastodon link. The legal page names two entities, Amplience UK Limited and Amplience Inc, and gives no headquarters, so maintainer is recorded as the UK entity named first and hqCountry is unknown. The docs describe an HTTP Content Delivery API as well as the GraphQL one; the HTTP API is not recorded as rest because the docs do not use that term. The pricing page is marketing only and gives no prices here. The pricing page lists multi-brand and multi-region scale, which is not recorded as multisite because the docs do not describe it in those terms. The GitHub organization amplience holds SDKs such as dc-delivery-sdk-js, not the product source, so no repository is recorded and the SDK's release, star and npm figures are not used. The docs site redirects docs.amplience.net to amplience.com/developers/docs/.
