notes: >
  The homepage at oxal.org/projects/sakura is the project's own page and states the classless framework and theme wording; the npm package sakura.css is the install target named in the README. The npm package named sakura is a different project (bnaoki/sakura, 0.0.1) and is not used. The CSV row's npm figure belongs to that package and is replaced here by sakura.css. The highest stable release is 1.5.1 (GitHub release 2025-06-24, npm latest 1.5.1). The CHANGELOG dates 1.5.1 to 2025-06-25; the release date from the API is recorded. The oldest GitHub release and tag is 0.1.0 (2016-06-29). The LICENSE copyright line names Mitesh Shah; no imprint or legal entity was found, so hqCountry is unknown. The README says a CDN, a manual download and npm or Yarn install are the routes; it does not state a runtime or a server model, so runsAs and renderingModes are absent. The homepage links to a Reddit thread about the project and no social account. The ecosyste.ms counts are for the sakura.css package; the HTTP Archive technology list has no entry for it, so httpArchiveSites is unknown.
