notes: >
  The repository has no project site; the README names only a Made-with example, so homepage is not recorded. The highest stable GitHub release is v1.0.0 (2020-02-03), the oldest v0.1.0 (2017-05-13). The binaries named in the README are for Ubuntu 16.04 and Windows 10 only, which is not recorded as a field. The LICENSE copyright line names Martin Muehlbauer and contributors (2021); the repository owner is the user kambrium. The runtime is recorded as a single binary because the install is a downloaded executable; the README gives no output directory.
