notes: >
  The stable release is v2.0.3, marked as a normal (not pre-) release on GitHub on 2026-04-13; its release notes still title it "2.0.3 Beta". The v2.0.4 beta (prerelease, 2026-10-17) is not used for currentMajor or latestReleaseDate. The repository has no LICENSE file at its root: GitHub reports the license as null, the homepage's link to blob/master/LICENSE returns 404, and the GPL 2.0 text sits in docs/license.txt. The homepage names no legal entity, and the privacy and terms pages refer only to "the Operators" and "the Association" without a name, so the maintainer is recorded as the homepage states it, a community. The firstRelease value is the first beta, per the project's history page. The release notes of the 2.0 line require PHP 7.4 and above, and the README calls the database support "MySQL and MariaDB". Install docs name the htdocs folder as the upload target. The README describes content as managed by separate modules, the homepage lists forums, news and online stores as module examples, and the homepage announces a newer beta for testing; those statements back the prose.
