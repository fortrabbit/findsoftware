notes: >
  Two end signals: the repository is archived (api) and the README says "Cusdis is deprecated now" and asks users to email hi@cusdis.com for an export; no successor is named, so status is discontinued. The homepage cusdis.com answers HTTP 521 to this client, so no homepage is recorded and the docs URL is taken from the README only. The GitHub tags v1.3.1 and v1.3.2 have no release object; v1.3.2 is dated 2021-12-04 by its commit, so latestReleaseDate follows the newest GitHub release v1.3.0 (2021-11-30). The README gives the license as "GNU GPLv3" and GitHub as GPL-3.0; one entry, same license. The project names no legal person: the README says "Disqus is a company, we aren't." and the LICENSE copyright line names only the Free Software Foundation, so the maintainer is the GitHub owner djyde, with no name beyond the account. The package.json scripts and Prisma folders name sqlite, pgsql and mysql as DB_TYPE values; no sentence states it, so databases is not recorded. The README also states "Cusdis doesn't use cookies at all", "Email notification" and "Webhook" as features, and "Lightweight comment widget": cookieless, email notifications, webhooks and the widget embed are coined kinds recorded here only. The Dockerfile starts from a node base image, which states no install route or runtime for a user, so installMethod and runtime are not recorded. A Railway deploy button links a template with postgresql; a button label is not a quote, so it is not recorded as an installMethod. Sponsors are on OpenCollective and not recorded.
