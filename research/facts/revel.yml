notes: >
  The CSV homepage is the http address; the same site answers over https (https://revel.github.io/), so the https address is recorded. The homepage and the manual both say the release is v1.1.0; GitHub dates it 2022-04-12 and the homepage says 2022-04-11, so the GitHub date is recorded. The highest stable GitHub release is v1.1.0, and the proxy list at proxy.golang.org/github.com/revel/revel lists v1.1.0 as well. The Go module path is github.com/revel/revel; no field holds a Go module name, so it is not recorded. The first version in CHANGELOG.md is v0.6 released 2013-09-16; GitHub marks that tag a prerelease, and the changelog gives 2013 as the first release year. The homepage Go requirement is for the v1.1.0 release. The manual says the template engine is Go's html/template by default, and that pongo2 and ace are added as modules; those modules are not recorded. The database page says Revel does not come configured with a database or ORM interface; its sample code defaults the db.driver setting to mysql and shows a postgres connection with the lib/pq driver, which is an example, not a supported-database list, so databases is not recorded. Chat on Gitter is recorded as chat and the StackOverflow tag from the README's Community list as forum. The documentation points at the owner's Revel Team copyright line, not a legal entity, and no page states a headquarters country. The homepage lists controllers with data binding and form validation, routing, parameter parsing, validation, session and flash, templating, caching, job running, a testing framework, internationalization, hot code reload, filters and modules. Session data can be stored in the user cookie, and the cache can be backed by a memcached cluster, redis or memory. The revel command builds and packages an app with a script that runs it, and the deployment page says production deployments should put an HTTP proxy in front of Revel, because Revel does not manage connections or resources itself. The server engine defaults to Go's HTTP package, and the server engine page says a custom engine can be registered.
