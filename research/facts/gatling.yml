notes: >
  Edition split: the README says "This repository is Gatling Community Edition, licensed under Apache 2.0 and free to use, including commercially" and describes Gatling Enterprise Edition as a commercial product built on the same engine, with a feature table (teams, user roles, SSO, live dashboards, managed or private load generators). The record is the Community Edition repository, so those Enterprise-only features are not facts here. Enterprise Edition is a cloud console (Gatling Enterprise Cloud, SaaS per the terms page); private locations run load generators in the customer's cloud account but are managed from that console, and no Gatling page offers Enterprise Edition self-hosted, so it is recorded as hostedOffering and no paidEdition. Licenses: the README says gRPC, MQTT, GraphQL and JDBC are separate dependencies under the Gatling Enterprise Component License, capped in Community Edition at 5 concurrent users and 5 minute tests; the repository ships no module for them, so that license is no entry here. The repository does ship a report generation module under its own Gatling-Highcharts License (license/LICENSE.gatling-highcharts.specific.txt), a free-of-charge license that forbids modifying or reusing the module code; the README says the reports are built with Highcharts under a license granted by Highsoft AS. Protocols in this repository: HTTP/1.1, HTTP/2, WebSocket, Server-Sent Events and JMS; Kafka, AMQP, SFTP and FTP come from third-party plugins the README says are not Gatling's. Categories are testing, supported by the README's "Load testing as code"; the CSV's load-testing has no categoryMap key. The JavaScript SDK (gatling-js) is a separate repository with its own npm package and is not this record's install route; the npm plugin named in the README is left out for that reason. The installation page also offers a standalone bundle for users without internet access; it supports Java only, not Scala or Kotlin. Maintainer: Gatling Corp is the legal name on the terms page, a simplified joint-stock company (SAS) registered in Nanterre; the registered office gives hqCountry FR. The LICENSE.txt is the standard Apache text with no copyright line; NOTICE.md names GatlingCorp. Adoption: the README's "300,000+ companies" and "30M+ downloads" are the project's own figures; downloads are not installs and companies are not installs, so neither is recorded as reportedInstalls. Stars and contributors belong to this repository alone. Release dates: v3.16.0 is the only GitHub release object (2026-09-29), and the Maven metadata agrees; the tags v3.16.1-M1 (2026-11-03) and v3.16.1-M2 (2026-11-04) are milestone tags with no release object, so they set latestPrereleaseDate. The first tag is 1.0.0 (commit date 2011-12-20), earlier than the first Maven upload of gatling-core, which ecosyste.ms dates to 2014; firstRelease stays 2011. Coined fields (linkedin, protocols, API features) stay in the notes: LinkedIn at linkedin.com/company/gatling.
