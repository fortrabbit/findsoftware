notes: >
  Stub because criterion 5 is not met: the project's pages name no company and no adoption figure. The README gives runnable steps (Lua and the three scripts from the repository), so installation is documented. The license comes from LICENSE.txt, which holds the GNU General Public License version 2 text headed "GPL VERSION 2" with no notice that offers later versions, so it is recorded as GPL-2.0-only; the source files carry no license or copyright lines. The maintainer is taken from the commit author on the sourcehut log, Kartik K. Agaram, under the repository owner ~akkartik, a sourcehut user account; the newest commit is by another account. The repository is on sourcehut only and has no tags, so currentMajor and latestReleaseDate stay unknown; lastCommitDate 2025-12-14 is the top commit's date on the sourcehut log, because no GitHub mirror exists. The README requires Lua and a terminal on a Unix derivative (Linux, BSD, Mac OS or Bash on Windows). The README names no project site, so homepage is not recorded, and it links two forks that add reading time and tags. The repository description is the sourcehut description line.
