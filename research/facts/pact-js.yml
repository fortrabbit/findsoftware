notes: >
  Pact JS is the JavaScript version of the Pact contract testing framework; the pact-foundation organization owns the repository and the Pact docs site is docs.pact.io. The LICENSE file names DiUS as the copyright holder of the original work, and that line is the maintainer recorded here; the Pact Foundation organization and the legal entity behind it are not named on a page the record cites. GitHub reports the license as NOASSERTION, so the license fact is taken from the LICENSE file. The README's Requirements section says "Node 16+ as of pact-js v12", an older statement; the runtime and runtimeMin facts come from the engines field of the v17.1.4 package.json, the latest release. The npm package named by the install docs is @pact-foundation/pact; the repository's package.json name is the same. Weekly npm downloads are the sum of 2026-11-01 to 2026-11-07. The category contract-testing from the discovery row has no import mapping, so the record keeps testing. PactFlow, named on the homepage as a "premium Pact Broker experience" and as a hosted product, is a separate paid product built around the Pact Broker and is not a hosted offering or paid edition of this library. Pact's install-time analytics and Slack community link are not recorded as fields. The "Pact" family covers Java, Go, Python, Ruby, PHP and other languages (other repositories, not this record). The contract testing usage described on the homepage ("Test locally", REST and message-driven systems) is recorded in prose only; no runsAs value is recorded because the README does not state a process model.
