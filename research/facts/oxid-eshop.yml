notes: >
  The GitHub API reports NOASSERTION for the license; the LICENSE file at v7.6.0 is the OXID eShop Community Edition license of 2022, and its English text is a translation, the German version is binding. Its preamble limits use to non-commercial purposes; the pricing page also lists a Community Edition as a paid monthly license, so the same name carries two terms; the price is not recorded. The default branch b-8.0.x has an 8.0.0-alpha.2 tag on Packagist with license "proprietary" and PHP ^8.3; it is not the stable line. The stable Packagist version v7.6.0 is dated 2026-10-07 and v7.5.2 is dated 2026-10-16, a later patch on the 7.5 line; latestReleaseDate uses the later date. The system requirements page read is the 7.5 documentation, the newest docs version listed. The homepage claims "over 3,500 online shops rely on OXID eShop", recorded as reportedInstalls. The install docs name the meta package oxid-esales/oxideshop-metapackage-ce for the edition; its downloads (about 536k total) are not recorded, the core package oxid-esales/oxideshop-ce is. Under section 6 of the license, a use period of six months applies from the first download unless extended.
  The developer installation page says there are two ways to install the shop, a graphical wizard in the browser and command-line tools.
