notes: >
  General-purpose utility library: in only if general utilities count as web helpers (open for Frank). Criteria 1 to 3 hold for a helper library, and the status is stub until that call is made. It is a general utility library: arrays, objects, promises and type guards, with no web-specific function on the page read. Coined kinds (bundle size, performance claims, tree shaking, strong type annotations) are not recorded. The Lodash compatibility layer (es-toolkit/compat) is the project's own statement that it replaces Lodash; lodash has no fact file, so it is not recorded as alternativeTo or importsFrom. The homepage names Storybook, Recharts, ink, MUI and CKEditor as users; these are third-party claims without a figure and stay here. The npm figure is the es-toolkit package named by the install page, for 2026-11-01 to 2026-11-07. The ecosyste.ms endpoint for npm es-toolkit reports 1 dependent package and 1 dependent repository on 2026-11-08, which does not fit the npm download volume; it is left out pending a check. The maintainer is Viva Republica, Inc., the LICENSE copyright line and the homepage footer; the company's country is not on a page read, so hqCountry is left out. The runtimeMin comes from the usage page; package.json at v1.53.2 has no engines field. The JSR link on the site is an install route recorded as installMethod, and the Agent Skills install (npx skills add) is a tool for AI coding assistants, not an install of the library. The GitHub repository is current: pushed 2026-11-08, not archived, and the GitHub releases carry no prerelease. The repository has a dev dist tag and a canary dist tag on npm; neither is recorded as a prerelease.
