notes: The repository has no GitHub releases and no tags. The npm package @rena.to/github-blog (published 2025-03-21 as the latest) is the release record, so currentMajor and latestReleaseDate come from npm; lastCommitDate is not recorded because a registry release exists. The oldest npm upload is 0.0.1 (2021-04-18). The README title is "Github Blog" and the npm package is @rena.to/github-blog, so the name follows the README title. The README describes an API that turns GitHub issues into posts, labelled with type, state, tag, flag and slug, and its first line reads "Turn your github issues into a CMS for your blog." No page says the CMS serves other sites, so the category stays blog and headless-cms is not recorded; a reviewer may decide otherwise. The README points to a separate starter template for a full blog application, which is not part of this repository. The content lives in GitHub issues, so contentStore is left out because the software reads it from GitHub. The README names no runtime, and the GitHub homepage field is empty.
