notes: >
  Primary release source: GitHub has no release objects for haproxy/haproxy and the repository is a mirror of git.haproxy.org (its description says so); versions and dates come from haproxy.org (homepage "Latest versions" table, download/3.4/src listing and CHANGELOG). Latest stable is 3.4.7 (2026-10-14) on the 3.4 LTS branch; the 3.5-dev10 snapshot (2026-10-28) is development, not a prerelease, so latestPrereleaseDate is left out. Branch end-of-life dates (3.4 LTS to 2031-Q2, 3.3 to 2027-Q1, 3.0 LTS to 2029-Q2, 3.2 LTS to 2030-Q2, 3.1 unmaintained) come from endoflife.date and are not typed here; the homepage also says "2.9" through "1.x" are unmaintained. License: the LICENSE file states the exemption for OpenSSL and says the include files are LGPL, and doc/gpl.txt is GPL version 2; both are recorded as separate license entries. The GitHub API reports NOASSERTION, so no SPDX value comes from it. Maintainer: the LICENSE file ends with the name Willy Tarreau, who is recorded; the company copyright line on haproxy.com names HAProxy Technologies, LLC, and the homepage speaks of "the HAProxy core team". The trademark "HAProxy" is registered to HAProxy Technologies SAS (haproxy.com legal page), a separate legal entity from HAProxy Technologies, LLC. The Docker Hub link on haproxy.org is hub.docker.com/_/haproxy, the official library image, so dockerPulls counts library/haproxy. The HAProxy Enterprise product page offers pricing on request ("Request pricing information"), so no price is recorded. The community forum is linked from haproxy.org with an http URL; the https address answers 200 and is recorded. A Slack workspace and an IRC channel are listed on the homepage and have no field. hostedOffering: the privacy notice mentions "cloud delivery services" without naming a hosted product, so none is recorded. Fields coined here: none.
