notes: >
  No homepage: the repository's homepage field is the repository itself, and the README names no site of its own. The demo at benninger.ca is the maintainer's personal site and is not recorded. The README has no docs beyond itself; the repository holds no docs folder. The install docs name git clone with make install and the Docker image ghcr.io/cbenning/fussel, not a package registry, so no registry id is recorded; pypi.org/pypi/fussel/json returned no package information. The README prerequisites say Python 3.10+, while its v3 migration table says 3.9+; runtimeMin takes the prerequisites. The gallery frontend is React built with Vite, a build dependency that is not recorded as templating. The README features (EXIF panel, XMP face tags, watermarks, zoom, download control) are not fact kinds in the starter list and are not recorded. The contentStore is the photo directory on disk, so it is left out.
