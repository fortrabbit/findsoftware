notes: >
  The npm package named "markbind" is the core module, last published in 2020 at version 2.9.0; the install page names "markbind-cli", so the figures are for markbind-cli. The npm weekly figure is for 2026-10-12 to 2026-10-18. The install page gives no Node.js minimum, so runtimeMin stays unknown. The about page states the project is based at the National University of Singapore, School of Computing, and funded by an education grant from the NUS Center for Development of Teaching and Learning; the LICENSE copyright line names MarkBind contributors and is recorded as the maintainer. markbind deploy publishes to GitHub Pages (deployment guide, "MarkBind can easily deploy a site to GitHub pages"). The GitHub API reports HTML as the repository language, which is not recorded. The Node.js requirement on the install page names no version. The homepage says the site is powered by Netlify, which is the site's own hosting and not a project deploy target, so it is not recorded.
