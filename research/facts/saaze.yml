notes: >
  No project website exists: the CSV homepage is the GitHub repository, so homepage is absent, and saaze.dev is the site of the original Saaze by Gilbert Pellegrom (README credits). The repository is not a GitHub fork, and the README only calls Simplified Saaze a simplified version of Saaze, so forkOf is not recorded. The installation and usage guide is the maintainer's blog post dated 2021-10-31, which the README names as the guide. The Packagist package is eklausme/saaze because the documented install command creates eklausme/saaze-example, an example skeleton, which requires the core package. The blog says no database is required, which does not name a database, so databases stays unknown. runsAs local is not recorded because no page says where the static build runs. The contributor count is one anonymous contributor on the GitHub list.
