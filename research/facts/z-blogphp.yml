notes: >
  The project's own pages disagree on the release line: the homepage and the download page name Z-BlogPHP 1.7.5 (the about page dates it 2026-02-24), while the latest GitHub release is v1.8.0.4020, published 2026-09-20. currentMajor is 1 either way. The download page states PHP 7.2 - 8.5, the readme states PHP 7, 8.0-8.4, and composer.json at the release tag requires PHP >=7.3; runtimeMin records the composer constraint, which is the only machine-readable one. SECURITY.md states "Limited Maintenance Mode" and that response times are not guaranteed; the status stays accepted because the criterion 4 signals (archived, abandoned, deprecated, or a statement that the project has ended or is unmaintained) do not match "limited", so no status fact is recorded. The GitHub repository zblogcn/zblogphp18, described as the new version of Z-BlogPHP, is archived; it is not the repository the project names as its source, so it is not a signal. The repository owner is the zblogcn GitHub organization. The composer.json description says the program was developed by a RainbowSoft Studio team, and the about page gives a rainbowsoft.org contact address, but no page gives a legal form, so maintainer keeps the name the readme gives.
