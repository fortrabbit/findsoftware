notes: >
  Doubt: the formilyjs.org site, which holds the install guide and the homepage wording, answered 503 "usage_exceeded" on every request during this check, so no install sentence could be quoted; the repository's docs source (docs/guide/quick-start.md on formily_next) shows the npm install commands only as code blocks, and the formilyjs.org retry on 2026-11-08 still answered 503. A later pass that reads formilyjs.org/en/guide/install (or the 2.0 install page) with a 200 answer would settle the installMethod route and the homepage wording, after which this record can move to accepted. Registry figures: @formily/core is the core package the repository's quick start says a user must install; its latest version on npm is 2.3.7 (2025-05-15), and the newest GitHub release is v2.3.6 (2025-05-15). Formily's README names a second site for version 1.0 at v1.formilyjs.org, which is not recorded. The framework bridges are separate packages: @formily/react and @formily/vue (the quick start says React and Vue users install a bridge), and @formily/antd and @formily/next wrap Ant Design and Alibaba Fusion; the core is framework-agnostic, so basedOn is not recorded. The Form Builder (designable) is a separate repository linked from the README and is not recorded. The repository's default branch is formily_next; the README names the MIT license. The maintainer is the copyright holder in LICENSE.md; other Alibaba legal entities are not named. The Chinese README and documentation are not read. Stars and contributors belong to the repository.
