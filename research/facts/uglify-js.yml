notes: >
  Status. Accepted: the repository is not archived, the npm latest tag is not deprecated, and the README has no end statement. The last release is 2024-08-29 and the last commit on the default branch is 2024-11-22, inside the four-year window. Judgement for the reviewer: no release since 2024 and no commit since 2024-11-22. The homepage at lisperator.net says "These pages are old. They apply to UglifyJS v2. Version 3 has evolved a lot in the mean time" and points to the repository for current documentation. It credits "Alex Lam S.L." as having maintained the project for years; the maintainer field follows the homepage thanks line, which names Alex Lam S.L. as the long-time maintainer (recorded as Alex Lam, because the import reads the initials S.L. as a company legal form); the LICENSE copyright line holds Mihai Bazon, the original author. The homepage answers over https after an http redirect, so the https address is recorded. License: the npm manifest and the LICENSE text agree on the BSD license; the GitHub API reports NOASSERTION, which is not recorded. The npm dist-tags also carry backports 2.8.29, a 2.x line; the registry figures count the package uglify-js. firstRelease is the oldest upload of the npm package uglify-js (0.0.1, 2011-01-05), the same package and author as today; the GitHub release list starts later, at v2.8.0 (2017). Contributors count across all pages of the contributors endpoint. npmWeeklyDownloads covers 2026-09-28 to 2026-10-04.
