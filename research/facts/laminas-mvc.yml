notes: >
  Split from the umbrella record laminas.yml, which covers the Laminas Project, its components and Mezzio. Maintenance status is the project's own statement in its README and the Laminas blog: feature-complete, security-only until 31 December 2028, with no releases after that; the README says it will not be updated for PHP 8.5. The status stays accepted: the project declares a support end date and still ships security patches, which is not an end under criterion 4. Last release 3.8.0 (2024-11-21); the default branch 3.9.x was pushed 2026-10-08. The record has no basedOn: laminas-mvc is built on Laminas components, which are not candidate records. `maintenanceStatus` and `eolPolicy` follow the field names already used in laminas.yml. Packagist name and downloads are for laminas/laminas-mvc, the package the docs install with composer require; the skeleton laminas/laminas-mvc-skeleton is named only as the starter. endoflife.date has no laminas-mvc product, so endoflifeId stays out.
