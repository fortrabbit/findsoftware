notes: >
  The CSV row asked whether the end-user app is wired into an app. The project's own embedding docs (https://www.activepieces.com/docs/embedding/overview) say the Activepieces builder can be embedded in a SaaS through an SDK, with a JWT that provisions each customer user, and the docs say embedding is on the enterprise plan. The record is accepted on that basis, and the embed is recorded in the categories fact. The license is mixed: the root LICENSE grants MIT Expat for content outside packages/ee and the server's ee folder, and packages/ee/LICENSE is the Enterprise license that applies to production use under the Enterprise Terms. The GitHub API reports the license as NOASSERTION, which is recorded as no value. The GitHub repository has 0.92.3-hotfix.2 as its newest non-prerelease release, which is a hotfix line, so currentMajor is 0. The oldest GitHub release is 0.1.3 dated 2023-01-14, and firstRelease uses it. The homepage also links LinkedIn and YouTube accounts, which have no field in the file. The pricing FAQ says Community Edition is the automation core on its own; the Enterprise activation page says the license key unlocks paid features on a self-hosted instance, and the pricing page lists SSO, SCIM and custom roles among the paid features. The hosted plans on the pricing page are listed without prices. The docs state the Docker Compose stack runs four containers, including postgres and redis, and the architecture page says webhooks and recurring jobs land on Redis and workers poll them off it, which is the runsAs always-on statement. The npm packages under @activepieces (the pieces framework) are not recorded, since no install page names one for the server.
