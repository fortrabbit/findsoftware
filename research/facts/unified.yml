notes: >
  Core package of the unified collective, which the homepage describes as 308 open source projects and the README as 500+ packages; the remark (markdown), rehype (HTML) and retext (natural language) ecosystems are built around unified and the first two have their own records, and no record names unified as a parent. The README says the package is ESM only, and its install section gives the npm route for Node.js (version 16+) and the esm.sh routes for Deno and browsers. The README's Compatibility section says the 11.x line is kept compatible with Node.js 16; runtimeMin is that install-line minimum, and the latest release's package.json sets no engines field. The first npm version 1.0.0 was published on 2015-07-31 under this package name; the GitHub release list starts with 1.0.0 dated 2017-06-16, so firstRelease takes the registry date. The LICENSE copyright line names Titus Wormer with an email address, which is not recorded. The chat badge links GitHub Discussions, recorded as forum; no Discord invite is named. The README says it is used in MDX, Gatsby and Docusaurus and can build things like Prettier or a site generator, with no alternative library and no migration named. The npm weekly figure is for the unified package the install line names, over 2026-11-01 to 2026-11-07.
