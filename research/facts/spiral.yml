notes: >
  The core package for figures is spiral/framework; the install docs name spiral/app, a skeleton, so its download count is not recorded. The maintainer is the legal name in the footer of spiralscout.com, which names the company that the project's home page calls Spiral Scout; the GitHub organization is "Spiral Scout", and the project's LICENSE says "Copyright (c) 2020 Spiral Scout". The home page's speed comparison with Laravel and Symfony is a claim the record does not hold, so it is not recorded. RoadRunner and Cycle ORM are components the framework uses, not software it is built on, so basedOn is not set. The lifecycle page says Spiral runs behind Nginx and PHP-FPM, and that RoadRunner runs its workers once and then dispatches requests to them; the installation page starts the application server with rr serve. The GitHub organization lists a location, which is not a statement of headquarters and is not recorded. The docs versions shown on the site are 3.x and 2.14 and 1.0, while the latest release is 3.17.2. The database page says that using SQLite with multiple workers can present significant challenges. The Discord and X links are taken from the home page footer.
