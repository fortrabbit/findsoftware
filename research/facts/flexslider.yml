notes: >
  The candidates row names http://www.woocommerce.com/flexslider/ as the homepage. It answers 301 to https://www.woocommerce.com/flexslider/, which answers 301 to https://woocommerce.com/, a company page that does not mention FlexSlider; the homepage is therefore not recorded, and the reviewer may want to confirm it. The end statement is the repository README, which says the repository "is no longer actively developed" and names the WooCommerce repository as the place the latest version is incubated; that successor is a file path, not a record, so successorOf is not set. The repository is archived on GitHub, and it is the repository the README names. The README's license line says "GPLv2 and later"; the LICENSE.md file is the GPL version 2 text, and GitHub reports GPL-2.0. These are one license in two wordings, recorded once as GPL-2.0-or-later from the project's own sentence. The README says FlexSlider "is no longer licensed under the MIT license", an older license that the release does not carry. The maintainer is the copyright line in the README, "Copyright (c) 2015 WooThemes"; the LICENSE.md file has no copyright line, and the npm package names Automattic as its author, which is not recorded. The README says the plugin "now requires jQuery 1.7.0+", a stated requirement, which is a dependency and no basedOn statement. The README links a Gitter chat room for the project, which has no field. The examples and the RTL examples point to flexslider.woothemes.com, which is not checked as a docs site; the README documents the properties itself, so no docs field is set. The first tag is version/2.1, dated 2012-11-15; the repository was created 2011-08-13. The npm figure counts downloads of the archived package for the week. The GitHub stars and contributors belong to the repository. The README says the project's Releases page lists the "official FlexSlider builds"; that is the only install route the README names.
