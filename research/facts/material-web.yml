notes: >
  Maintenance: the homepage and the roadmap say "MWC is in maintenance mode pending new maintainers" and "There is no current work planned for new features or components. Bug fixes or other contributions may be added on a case-by-case basis." Status is left as accepted because the project still ships releases (v2.5.0, 2026-07-15) and does not state that it has ended; a reviewer decides whether this is an unmaintained declaration under criterion 4. The discussion linked from the README gives the maintenance announcement. The Discord link is the #material channel on the Lit Discord, as the README badge states, not a server of this project. The docs name Lit, React, Vue and Svelte only as frameworks the components work with; no basedOn is recorded. The GitHub language field reports SCSS; the package itself ships JavaScript modules. The quick start names the npm package @material/web, which the npm figure counts. The docs intro says the library follows Google's Material Design guidelines; the maintainer is named as Google, without a legal form, because no page gives one.
