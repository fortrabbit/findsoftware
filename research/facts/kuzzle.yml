notes: >
  Homepage and legal notice are read; the legal notice gives the company as Kuzzle, legal form SAS, and the maintainer is recorded as Kuzzle SAS. The registered office line names a city and postcode but no country; hqCountry FR rests on the registered office in Montpellier and the docs sentence that the team is based in Montpellier, France. The legal notice gives the publication director as Jacques Le Conte; that person is not recorded as a field. The run page states Node.js 22.12 or later as the supported range, up to 24, and says Node.js 25 and later are not supported; runtimeMin 22 is the Node major. The npm package kuzzle is the server itself, installed with npm install kuzzle; the kuzzle-sdk package (about 2.9 thousand weekly downloads in the candidates row) is a client SDK and is not recorded. The Elasticsearch and Redis requirements sit on the run page and the deployment page. The deployment page calls cluster mode the production recommendation, and a support offer is named there, with no paid edition stated. The homepage calls Kuzzle Data an open source data solution; Kuzzle Hypervision and Kuzzle IoT are commercial solutions built on the platform and are not recorded as editions. The docs' PaaS console page is docs only, so no hostedOffering is recorded. The first GitHub release is v0.3.1 from 2015-11-17, a prerelease flag at the time. The what-is-kuzzle page lists a "Multi protocol API (Http, WebSocket, MQTT)". The SDK reference page lists officially supported SDKs for JavaScript, Go, Java, C#, Dart and the JVM. The what-is-kuzzle page also names the Admin Console (a Vue.js single page application also hosted online by the project) and plugins that connect services such as Amazon S3 and Prometheus. The deployment guide lists Node.js (Kuzzle), Elasticsearch and Redis as the deployed services. The Kuzzle PaaS and IoT platform pages are not recorded. The what-is-kuzzle feature list names an advanced permission system, multi authentication, a realtime engine and an integrated cluster mode.
