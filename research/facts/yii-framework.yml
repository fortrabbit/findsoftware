notes: >
  Boundary question: one record or two. Yii 2 (yiisoft/yii2, monolithic) and Yii3 (released 2025-12-31, a set of independently versioned packages started from yiisoft/app) share a site, a name and a team but differ in code base, PHP minimum and install path; the release-cycle page also announces a "22.x" successor line for Yii 2 (2.1 skipped, estimate end of 2026, PHP >= 8.3). This file records both, with separate entries where they differ; the Yii3 template's download figure is small next to yii2's. The Yii 2 install guide still says "PHP 5.4 or above", while the intro page and Packagist say 7.4.0; the intro and Packagist values are recorded. Copyright holder is "Yii Software", with no country or legal form stated. The extensions page for Yii3 points to Packagist's yii3 tag, not a catalog, so no pluginCount. Coined field `chat` (here a Telegram group) as in symfony.yml.
