notes: >
  The README says "We have temporarily moved development to a private repo so we can iterate faster" and that the work will be pushed back to this public repo "soon"; this is not an end statement, so the record stays accepted, and a reviewer should decide whether the public repo still counts as the project's source. The public default branch's last commit is 2024-04-11, and npm's latest @theatre/core (0.7.2) is dated 2024-05-19. The docs' release page is headed v0.7.0 and dated August 10, 2023, while npm's 0.7.2 is later. The repository has no GitHub release objects; the registry's stable version is the release figure, and the tags run from 0.1.0-beta.1 (2014-01-16) on. firstRelease takes the oldest tag. The repository was moved from github.com/AriaMinaei/theatre, named in the README links; the stars, contributors and tags belong to the same repository. The footer gives Theatre.js Oy and Helsinki with no country name, so hqCountry is not recorded. The license entries are the core (Apache-2.0, GitHub API) and the studio (AGPL 3.0, README); the studio is used during design only and the final bundle includes only @theatre/core, per the README. The React Three Fiber extension (@theatre/r3f) and the Theatre.js docs repository are separate packages and repositories, not recorded. The npm figure is for @theatre/core, the package the release page names first in its upgrade command. The homepage's Twitter link is the x fact; the GitHub owner is an organization account.
  The README says Theatre.js "can be used both programmatically _and_ visually" and lists animation targets: 3D objects made with THREE.js, HTML and SVG via React, micro-interactions, generative art and any other JS variable. The docs' getting-started guides cover React Three Fiber, THREE.js and HTML/SVG, with the studio used during design. The README's "Development and contributing" section names a separate docs repository, not recorded.
