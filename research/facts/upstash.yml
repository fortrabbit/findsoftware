notes: >
  Scope: this record covers Upstash Redis, the product the server-infra row names. The same company sells Vector, QStash, Workflow, Box and Blob; QStash has its own row in candidates-app-services.csv, and the others are not recorded here. The CSV repository https://github.com/upstash/redis-js is the TypeScript client SDK (MIT, released as @upstash/redis), and the CSV lastRelease 2026-09-21 comes from that SDK. Under the hosted-service rule, SDK license, stars, npm figures and release dates are not recorded on this record; the SDK repository is no source for the service. The homepage https://upstash.com lists the Redis product first and the company's other products beside it. The pricing page lists a free tier with 250MB data size and 500K commands per month, Pay as you go and Fixed plans, and Enterprise with custom limits, plus SOC-2 compliance on the Prod Pack; these are plan terms and not recorded as fields, since the rules hold plan tiers are no paidEdition. The pricing table's column for the SAML SSO row is not clear in the text; the sso fact is recorded from the feature list on the same page. The regions list comes from the Global Database page (AWS and GCP regions, EU locations named there). The Upstash Terms of Service (a PDF, which check-quotes cannot read; the sentence was confirmed with pdftotext on 2026-10-30) name Upstash, Inc. as a Delaware corporation; Delaware is a state of incorporation, so it gives no headquarters. hqCountry US comes from the Organization structured data (JSON-LD) on the homepage, which gives the address region CA and the country US; check-quotes cannot read script content, so that fact has no quote. The Terms of Service and Privacy Policy facts cite PDFs, so they carry no quote either. The docs page "Compare Upstash Redis to Alternatives" names AWS ElastiCache, AWS MemoryDB, Redis Labs, AWS DynamoDB and FaunaDB; none has a record under that name, so no alternativeTo is recorded. No firstRelease year appears on the pages read, so none is recorded. No self-hosting option is stated on the pages read. The record is named Upstash Redis for the product scope, while the CSV row name is Upstash; a reviewer decides the display name. Fields coined here: none.
  The Global Database page describes writes going to a primary region and replicating to read regions, and the homepage describes Upstash Redis as serverless.
