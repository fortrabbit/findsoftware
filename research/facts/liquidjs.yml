notes: >
  The maintainer follows the LICENSE copyright line (Copyright (c) 2016 Jun Yang); the homepage footer reads "© 2026 Harttle", the maintainer's GitHub handle, and the documentation is licensed under CC BY 4.0 per the homepage footer. The repository owner is a user account. The README and homepage say the library runs in Node.js and in browsers; the runtime node value comes from that sentence and no runsAs is recorded, since a library that runs in both names node as its runtime. The npm engines field (node >=16) at the latest release is a build requirement for a library that also runs in the browser, so no runtimeMin. The homepage and README say Shopify templates, Jekyll sites and GitHub Pages work with it; that is compatibility, not basedOn, and the Ruby shopify/liquid project is not a parent. The first tag is v1.2.0 (commit 2016-09-26); the npm package was first published in 2017 and the repository was created 2016-06-13. The release v11.0.0-alpha.1 (2026-07-06) is a prerelease older than the latest stable release and is not recorded. The README's Installation section lists Node.js, browser and CLI routes, and the setup page names npx for the CLI. The Differences with Shopify/liquid page says compatibility with the Ruby version is a priority, that Shopify's business-logic tags and filters are meant to be plugins, and that async is first-class; the Ruby project is the record liquid. The setup page says legacy browsers like IE and Android UC may need a Promise polyfill. The "Used by" and sponsor lists are the project's own claims and are not recorded.
