notes: >
  The repository has no homepage of its own; the npm package links to the repository. The README has no installation section: it shows import statements from 'yup' only, so the installMethod is the npm registry route, cited from the registry API as the install route for a package with no install sentence. The README says Yup is compatible with Standard Schema and that server-side and client-side validation are both supported; neither names a runtime, so runtime is left out. The i18n value covers the setLocale hook for error messages that a translation library consumes; it is not a bundled translation set. The README title block says it documents v1.0.0 and links pre-v1 docs. GitHub lists v1.0.0 as the latest release object; the registry's 1.7.1 is the newest stable version, so latestReleaseDate and currentMajor follow the registry. The unscoped package is the one the README imports from; no other npm package is recorded. The firstRelease year is the npm upload of 0.1.0 in 2014, which predates the oldest GitHub release object.
