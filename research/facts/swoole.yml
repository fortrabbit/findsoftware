notes: >
  The homepage is in Chinese; the description follows its own sentence that Swoole lets PHP developers write high-performance, high-concurrency TCP, UDP, Unix Socket, HTTP and WebSocket services. The PECL page (a PHP registry, read as a page) lists the lead maintainer as Han Tianfeng, with two developers. Stable 6.2.3 requires PHP 8.2.0 or newer on PECL. The homepage also lists swoole-cli binaries, Swoole-Compiler (a code encryptor listed under commercial products) and other projects; these are separate products and have no fact file. The GitHub API reports Apache-2.0 and the PECL page Apache2.0; both recorded. The docs were not readable, so installation steps beyond PECL and source build are not recorded. The Swoole Ltd company is not named on the pages read, so no company maintainer is recorded. Fields coined here: none.
