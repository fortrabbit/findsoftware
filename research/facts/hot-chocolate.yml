notes: >
  Monorepo: ChilliCream/graphql-platform holds Hot Chocolate, Strawberry Shake, Fusion, Nitro and Mocha, so the stars and the 325 contributors belong to the monorepo; the NuGet figures come from HotChocolate.AspNetCore, the package the install docs name. The docs say "Hot Chocolate is a GraphQL server framework that runs on ASP.NET Core"; no basedOn is recorded because the statement names the host platform the server runs in, and the aspnet-core record is linked from the notes only. The getting-started page names the template route, with the sentence "Install the Hot Chocolate templates." as the route quote, and gives "Prerequisites: .NET 8 SDK or later."; the runtime and runtimeMin come from the NuGet nuspec of 16.7.3, which lists net8.0, net9.0, net10.0 and net11.0. The GitHub release tags 16.8.0-p.* are prereleases of the whole monorepo (their notes name Fusion), and HotChocolate.AspNetCore has no prerelease on NuGet, so no latestPrereleaseDate is recorded. The latest stable release date comes from the NuGet publish date of 16.7.3 (also the GitHub release date). The firstRelease year is the NuGet upload of 0.1.0 on 2018-06-25. ecosyste.ms reports 0 dependent repositories and 59 dependent packages for the NuGet package. The homepage is the vendor site; the Hot Chocolate pages are under /docs/hotchocolate. The LICENSE file of the graphql-platform repository is the MIT License with the copyright line of ChilliCream Inc.; the ChilliCream License 1.0 page is a separate license, and no page here ties it to Hot Chocolate. Nitro, the GraphQL IDE served at /graphql, is a separate product named on the pricing and product pages; it is not recorded as an edition. The vendor's Slack community and LinkedIn page are linked from the site footer; no field exists for them, so they stay here. The Comparison pages on the site compare GraphQL Federation with Apollo Federation, BFF, schema stitching and other patterns, and name no alternative to Hot Chocolate itself. The legal name and address come from the terms of service, which list 1207 Delaware Ave, Wilmington, DE, United States. The index page says Hot Chocolate "returns results over HTTP, WebSocket, or Server-Sent Events" and offers an implementation-first schema, built by a source generator from attributes such as [QueryType], and a code-first schema built with a fluent type descriptor API. The nugetName comes from the server template project that the install route creates, which references HotChocolate.AspNetCore.
