notes: >
  The CSV homepage is the GitHub repository, which is not used. The package and README link brm.io/matter-js/, which answers over https; the plain http address redirects to it, so the https address is the homepage. The site's footer links to Twitter and Instagram are search pages, not the project's accounts, so no social field is recorded. The GitHub repository has no release objects; the tags run to 0.20.0, which the npm registry carries as latest, uploaded 2024-06-23, and that date sets latestReleaseDate. The earliest tag, 0.5.0-alpha, is dated 2014-02-20 and the repository was created on 2014-02-19, so firstRelease is 2014. The category physics has no entry in the import's categoryMap, so the record keeps canvas (graphics) until the map gains physics. The README sentence "should work in both browsers and Node.js" in the Usage section and "Cross-browser and Node.js support" in the features list both name Node.js; no runsAs is recorded because the library names both the browser and Node.js. The README's build section needs Node.js and pnpm for contributors, a build requirement, so no runtimeMin is recorded. The LICENSE copyright line carries Liam Brummitt and contributors; the README's notice reads Copyright (c) 2014 Liam Brummitt. The README links a gallery of sites built with matter.js and a wiki of tutorials; they are not recorded as fields. The npm download figure is the sum of the daily counts for the week, read on 2026-11-16. The contributors count is the page number of the last contributors page at per_page=1.
  The README Features list names rigid, compound and composite bodies, physical properties such as mass and density, restitution, collisions, friction, constraints, gravity, sleeping, events, a canvas renderer and touch support, and calls the engine an original JavaScript physics implementation, not a port. The README Install section gives npm and Yarn, a downloadable stable release, and an alpha build from the master branch with a script tag. The wiki pages Running and Rendering show how to use your own game and rendering loops. The README links demos, tutorials, examples and an API documentation site.
