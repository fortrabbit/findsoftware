notes: >
  The install page at lwc.dev/guide/installation answers 500 on every request tried; the same Dev Guide page is readable at lwc.dev/guide/install, which gives the lwr tool (npm init lwr), the rollup route and the webpack route. The lwr scaffolder is a create-* tool, so the registry figures come from the core package lwc, which the npm page lists with the MIT license. The GitHub API reports the license as NOASSERTION because the repository carries LICENSE.md and LICENSE-CORE.md; both are MIT, and the homepage and npm agree. The highest stable GitHub release is v9.5.3 (2026-10-27), which matches the npm latest tag. The homepage's X link is a Twitter URL, recorded as x. The community page names the Salesforce Stack Exchange as a forum, with questions tagged lightning-web-components. Salesforce's privacy statement gives the San Francisco address and the company's legal name. No runtime value is recorded: the server-side rendering guide describes rendering through the @lwc/ssr-runtime package without naming a server runtime. renderingModes: the SSR guide describes rendering a component on the server then hydrating on the client, and the install walkthrough offers a Single Page App project type. firstRelease is the year of the first npm upload (1.0.0, 2017-07-19). The dev guide says Lightning web components are custom elements built with HTML and modern JavaScript, that the framework uses core Web Components standards, and that it is built on code that runs natively in browsers.
