notes: >
  Doubt: the repository's only tags (11.07.0 to 12.06.0, the last dated 2012-06-19) belong to the older Caveman line, and no release or tag covers Caveman2 version 2.4.0 from caveman2.asd, so no latest release date is recorded and the status is stub until a Caveman2 release or a statement from the project settles the listing. The homepage is the project's own site and answers over https; the http address in the CSV also answers 200. The repository has no LICENSE file; the license is the :license field of caveman2.asd, recorded as the source words it (LLGPL, a Lisp lesser GPL variant, not an SPDX id). The README shows start and stop functions and a server chosen at start, which does not state how a live site is hosted, so runsAs is not recorded. The README states that the application server is chosen through Clack, with Hunchentoot, Woo and FastCGI named as options. The database layer is described as CL-DBI with datafly as the default library; no database engine is named, so databases is not recorded. Caveman2 is distributed through Quicklisp, which has no registry figure in the import list. The stargazer and contributor counts are the repository's. The name Caveman2 is the README title and the Quicklisp system name.
