notes: >
  No GitHub release object exists; the repository carries tags only, the highest stable one 3.0.3 (commit date 2023-10-29, also named on the homepage as the latest stable CLI version), so latestReleaseDate comes from that tag commit. The major 3 comes from the homepage and the CHANGELOG heading "version 3.0". The CHANGELOG gives no year for its first entry ("version 0.70 - first public release"); firstRelease 2013 is the author date of the oldest tag, 1.0, on a history that was imported later, so the reviewer should check it. The homepage says the latest version is written in Rust and the previous one in C99, both under the GPL or a commercial license; the GitHub language statistics list C first, and the record keeps Rust as the homepage states it. The GitHub license API reports NOASSERTION, so no license comes from it; the two README statements are recorded as separate entries and licenseModel is left to the import. The commercial license is bought through supso.org, which is not recorded as pricingPage; it names no price on the page read. The homepage lists Homebrew: the formulae API reports 25441 installs over 365 days (read 2026-10-28), recorded here only because no field holds it. The Homebrew formula license reads "GPL-3.0-or-later AND HPND AND BSD-2-Clause", which is a registry statement and is not recorded. The compression engine is a separate library, libimagequant, and the GUIs and web service listed on the homepage (ImageOptim, Pngyu, PNGoo, ImageOptim API) are third-party and not recorded. Criterion 1 rests on the homepage: the images "are compatible with all web browsers", and the tool is used from shell scripts and server-side software; no page names a website build step, so the reviewer should confirm the criterion.
