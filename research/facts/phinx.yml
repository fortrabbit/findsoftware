notes: >
  The homepage and the repository both name Phinx as the project; the homepage links the docs at phinx.org/docs and the docs URL is the https address, which answers 200 (the plain http address redirects to http). The repository's default branch is 0.x, and the README and LICENSE are read from that branch; the 0.x line is the current major, so currentMajor is 0 with the minor line 0.16 in the release tag. The LICENSE on 0.x has two copyright lines: Rob Morgan for 2012 to 2017 and Cake Software Foundation, Inc. from 2017; the foundation line is the current holder and is recorded as the maintainer, Rob Morgan, named as lead developer on the homepage and in composer.json, is not the maintainer field. The homepage says Phinx is free and open source and that donations are asked for; that is not a paid edition. The screencast the homepage sells is a paid product and is not an edition of the software. The first registry upload is 0.1.2 on Packagist (2012-10-20), older than any GitHub tag: the Git tag list starts at 0.11.1 (2019-08-28) and the release list at 0.5.4 (2016-06-14). The composer.json require for php-64bit is the runtime requirement of a library installed with Composer, so runtimeMin comes from it. Packagist monthly is recorded beside total because both are the Packagist downloads figures for the install package. The phar route is the README's second install route: build Phinx as a Phar archive from a clone with the Box tool. runsAs local rests on the homepage sentence that Phinx executes from the command line and integrates with deploy, build and CI tools. The databases entry joins the README's list of four adapters in one quote, the bullet markers dropped. The README features say migrations are written as database-agnostic PHP code, run up and down, and can seed data after database creation, and the homepage says migrations can also be written in SQL. The README's Limitations section says the PostgreSQL adapter cannot set a unique constraint on a table.
