notes: >
  The marketing pages on disqus.com return a browser-unsupported notice instead of the page text, so the homepage https://disqus.com is recorded without a quote (the site answers this client with an unsupported-browser page, which is not a bot check; it was not retried with another user agent), and the pricing link is the help article "Comments Pricing and Plans", which states the tiers. The page was not retried with another user agent. Disqus, Inc. is the legal name on the terms of service; its DMCA address is 3 Park Ave, New York, NY 10016, which names no country, so hqCountry is not recorded. The terms govern by California law. The pricing article names Basic, Plus and Pro tiers: hosted plan tiers, so no paidEdition. Disqus Polls and Disqus Boards are separate products with their own plans; Pro Analytics, ads, shadow banning, timeouts, badges and star ratings are hosted features, all kept as text. The HTTP Archive technologies list counts Disqus on 17,644 mobile origins, recorded as httpArchiveSites with its source. The API authentication page names OAuth 2 and "Single sign-on" without a protocol, so sso is not recorded; the SSO cookie page says Disqus stores no authentication cookie with SSO. The API article says the API "works over the HTTP protocol" with GET and POST methods and does not name REST, so headlessApi is not recorded. Import sources named on the help center are WordPress, Blogger, JS-Kit, Typepad and Facebook Comments; only wordpress has a record. The help center states the comment system supports "70 languages" on one article and "over 65 languages" on the pricing article; the number is not recorded. Cookies: the cookies article lists first-party and third-party cookies set on visitors' browsers, so a cookieless claim is not recorded. Coined kinds (embed script, ads, Disqus Pro Analytics, SSO comments via API) stay in notes.
