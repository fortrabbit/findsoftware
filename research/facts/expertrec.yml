notes: >
  Hosted service, no installable server: the homepage, the API page and the terms describe a service run by Cloud Infra LLC, and the only installable parts are platform connectors (a WordPress plugin, Shopify, Magento, WooCommerce and others, named on the homepage). The WordPress plugin "WP Fastest Site Search" is listed on wordpress.org with the author ExpertRec, its page is https://wordpress.org/plugins/wp-fastest-site-search/ (kept as a coined wordpressPluginPage in notes only); the other connectors have no registry figure and are not recorded. No repository is linked from the homepage or the API page; the API page describes an "API and SDK Documentation" with JavaScript samples, which is client code and is not a repository of the service. Plan names and prices sit on the homepage ("Combo plan pricing", the Standard, Expert, Premium and Enterprise plans); no price or plan limit is recorded. The homepage shows a SourceForge rating; ratings are not recorded. The footer says "All rights reserved © 2025", older than the other dates on the site; no date is taken from it. The features page names "Search in 30+ languages"; the FAQ says the service "supports multiple languages". The terms say the software and services are offered by Cloud Infra LLC under Delaware law, which gives the legal name and hqCountry. No founding year and no SSO, role or self-hosting statement was found on the homepage, features page, API page, terms or privacy page. The CSV row carries no repository and no adoption figure; the homepage names 700+ customers, which is a marketing count and is not recorded.
