notes: >
  The framework pages were read from the repository's docs source on GitHub, because the project's site answered 429 during this pass; the docs source is the project's own. The getting-started page states the Node.js minimum as 18, recorded as major 18. The engines field of the npm package also says node 18 or later. The npmWeeklyDownloads figure covers the week from 2026-10-12 to 2026-10-18. The LICENSE file carries the ISC permission text and the copyright of Observable, Inc.; the GitHub and npm license fields agree. Observable's own site answered 429 with a Vercel bot challenge on every retry, so no hosted offering of Observable is recorded.
