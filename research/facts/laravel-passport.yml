notes: >
  The Packagist package laravel/passport is the one the docs install (php artisan install:api --passport); the docs page gives no composer require line, so the installMethod value is the Artisan command the Installation section names. The GitHub repository is laravel/passport with default branch 13.x. The docs say Passport is built on top of the League OAuth2 server, maintained by Andy Millington and Simon Hamp; that library is named in notes only and no record exists for it. The docs' "Passport or Sanctum?" section presents Laravel Sanctum as the other option, so alternativeTo names laravel-sanctum. The docs cover the authorization code grant with PKCE, the device authorization grant, the password grant, the implicit grant, the client credentials grant and personal access tokens, and say Passport creates the encryption keys access tokens need. The deploy section says the passport:keys command is needed on first deployment; it does not state a process model, so runsAs is left out. The stable major is 13, from v13.11.0 published 2026-11-10 on GitHub; Packagist records v13.11.0 at 2026-10-14, the tag's commit date. firstRelease is 2016 from the Packagist upload v0.1.0 dated 2016-08-16; the oldest GitHub release is from 2018, so the registry date governs. The maintainer is the LICENSE copyright holder Taylor Otwell, an individual; hqCountry is not recorded.
