notes: >
  Criterion 4 cannot be judged from the sources, so the record is a stub: the changelog lists versions 4.6.1.1 and earlier with no release dates, and its only dates are page-level metadata (published 2020-06-04, modified 2023-04-18), so the latest release date is unknown; the release dates of the changelog entries, or the plugin's own update server, would settle it. The plugin is not on wordpress.org (the plugin information API answers "Plugin not found"), so no registry figures exist. The terms name SearchWP, LLC as the operator and say the agreement is governed by Florida law; the about page calls Awesome Motive "the management company behind SearchWP", which is recorded here as a statement and not as the owner. The pricing page offers three bundles, Standard, Pro and All Access Bundle, with the All Access Bundle combining SearchWP and WPFilters; the WPFilters extension is a separate product and is not a record. The paid licence tiers (Standard, Pro, All Access Bundle) are tiers of a paid-only plugin and no paidEdition. The pricing and terms pages state no prices, which are not recorded. The terms say support and updates run for one year after purchase, which is a paid support statement, not an end signal. Usage: the pricing page states "Join 50,000+ sites"; the homepage states "Join 50,000+ website owners", recorded here from the pricing page only.
