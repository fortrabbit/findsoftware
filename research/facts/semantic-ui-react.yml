notes: >
  Not declared ended: the repository is not archived and the README and docs state no end. The docs site header shows 3.0.0-beta.2, a beta tag with no stable release; the stable major is 2 (v2.1.5, 2023-12-10), and the beta is recorded as latestPrereleaseDate. The LICENSE copyright line names TechnologyAdvice (2016), while package.json names Levi Thomason as author and the GitHub owner is Semantic-Org; the maintainer field follows the license line, and the reviewer decides. The README and docs call Semantic UI React the React integration for Semantic UI and state that it renders Semantic UI markup without CSS; basedOn semantic-ui is not recorded because the docs describe the React components and the CSS themes as separate parts. The docs say the React bindings need React through React's own setup guide, and the npm peer range is react 16.8 to 18; no minimum is stated on a page, so runtimeMin is not recorded. The npm figure is the semantic-ui-react package the docs install. The release tag v3.0.0-beta.2 is marked as a non-prerelease on GitHub, so it is skipped for currentMajor by its beta name. The README states that the components render valid Semantic UI HTML and include no CSS, and that any Semantic UI CSS theme can be loaded on top of the React app.
