unreadable: [https://atomic.place (JavaScript shell without text)]
notes: >
  The docs home page calls AtomicServer "the reference implementation for the Atomic Data specification, written in Rust". The first GitHub release is the pre-release v0.11.0 (2020-09-11); the first stable release is from 2021. The repository description calls the project an "open source headless CMS / real-time database", the docs site "graph database + headless CMS". The databases field stays empty because the embedded store is redb, which is not in the vocabulary. The project rebranded: atomicserver.eu now redirects to atomic.place/rebrand, and the README describes atomic.place as a local-first workspace that can sync through a self-hosted AtomicServer or the hosted service, with AtomicServer as the self-hostable server. atomic.place and atomic.place/rebrand answer with a JavaScript shell without text, so homepage is the docs site. The record is the server; the hosted service is noted, not recorded: atomic.place "can sync through a self-hosted AtomicServer or the hosted service". No prices are recorded. The README says "Status: alpha" with breaking changes expected until 1.0. The repository's default branch is develop. The README names the repository as the source of the Atomic Data Browser and the libraries; these are not separate records. The GitHub license detection reads NOASSERTION, but the README and LICENSE state MIT; the names and logos are reserved by a trademark policy (TRADEMARKS.md), not a license restriction on the code. The crate page lists atomic-server 0.40.1 as the max stable version while GitHub's highest stable release is v0.40.4; currentMajor and latestReleaseDate use GitHub. The crate downloads figure is the total since publication. Contributors from the per_page=1 rel=last count of the contributors endpoint (15). The maintainer is the copyright holder in LICENSE; no other person is named as maintainer.
