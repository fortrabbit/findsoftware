notes: >
  The repository moved from the LeaVerou organization to nudeui; GitHub serves both names. The README still names https://leaverou.github.io/awesomplete/ as the official site, and that address now redirects to projects.verou.me/awesomplete/, which answers 404 (checked 2026-11-04); the homepage is the nudeui.github.io site. The README and homepage attach it with class awesomplete on an input, or with new Awesomplete(input) in JavaScript. The default branch is gh-pages, which holds the README and the site. The latest GitHub release object is v1.1.5 from 2019-08-21; tags v1.1.6 and v1.1.7 have no release object, and the npm registry lists 1.1.6 and 1.1.7 on 2024-07-25, so latestReleaseDate is the npm date. The first tag is 0.1.0, its commit dated 2015-02-20. The runsAs value rests on the homepage instruction to include awesomplete.css and awesomplete.js in the page; "built with modern standards for modern browsers" in the README is a support statement and is not the source.
