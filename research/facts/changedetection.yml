notes: >
  Stub: the doubt is whether an end-user page monitoring app counts as wired into a website. Its README names a REST API for managing watches and tags, which an outside site could call, but no page names an SDK, an embed or a webhook a site sends to the app; a ruling on that API settles it. The hosted subscription is run by Web Technologies s.r.o. (the terms and privacy policy name it as the hoster and give no country or address, so hqCountry stays unknown). The maintainer is the GitHub owner dgtlmoon, since the LICENSE carries no copyright line. The homepage's JSON-LD calls the project an open-source alternative to Visualping and Distill.io; neither is a record id, so no alternativeTo. Apprise and LiteLLM are libraries the README says it uses, not parents, so no basedOn. Windows install is covered by the wiki only. runsAs is not recorded: the README shows a detached container with restart always, but no page states the process model in words. The Docker count is the docker.io image the README names.
