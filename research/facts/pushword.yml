notes: >
  The project's own site is pushword.piedweb.com; the GitHub organization profile names it as its blog. The maintainer is recorded as Paprika Forge SAS from the legal notice of piedweb.com; the Pushword pages credit "Pied Web" and the README credits "PiedWeb". The install docs name pushword/new, a skeleton, so the Packagist figures come from pushword/core, the core package; pushword/pushword is the combined bundle package and was not used. The Symfony basedOn fact rests on the README's own description. The homepage names Symfony 8 and Doctrine 3 without recording them, since no version field applies to basedOn. The static generator is an extension installed by the default installer (composer create-project installs static-generator), and FrankenPHP worker mode is optional, so runsAs does not add always-on. The installation page also documents FrankenPHP and Docker setups; installMethod records composer only, because only that method is quoted. The category ssg is not recorded: the static export is an extension, and the record shows it under renderingModes. The native-acceleration page (pushword.piedweb.com/native-acceleration) says "Three opt-in integrations exist, all defaulting to PHP and all experimental"; they are Rust executables and have no field. The README credits PiedWeb (piedweb.com), whose legal notice says Pied Web is a brand of Paprika Forge; the notice covers piedweb.com, and no Pushword page names a legal entity. The contentStore and databases entries keep SQLite as the default and PostgreSQL as a stated option; MySQL is not named. The license is MIT as the GitHub API and the homepage state. The latest release is the 1.0.68 tag dated 2026-10-20.
