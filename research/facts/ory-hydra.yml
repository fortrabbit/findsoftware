notes: >
  Current line is calendar-versioned: the highest stable release is v26.2.0 (2026-03-20), so no currentMajor is recorded; the line goes here as 26.2. The release list also holds v25.4.0 (2025-11-07) and earlier v2.x tags. The OSS install guide is the Ory docs install page for self-hosting, and the page read at www.ory.com/docs/hydra/self-hosted/install describes only the Enterprise (OEL) Docker image and Helm chart; the open source install route is taken from the README sentence "Install Hydra on Linux, macOS, Windows, and Docker", so the reviewer should check the open source install page, which was not reached. The Ory Enterprise License is distributed as a Docker image from a private registry that requires authentication; the open source build is public. The Ory homepage lists Slack ("Join the Ory community on Slack", ory.com/chat), a coined community field recorded here only. The homepage says Hydra has official SDKs for .NET, Java, Node.js, PHP, Python, Ruby, Rust, Dart and TypeScript; coined sdkLanguages, notes only. The README says the enterprise license adds features "not available in the open source version". The Ory Corp address is in Scottsdale, Arizona; the country line is taken from the contact address block. Its maintainer name follows the footer copyright; the LICENSE file carries no copyright line. The newest prerelease, v2.2.0-rc.3 (2023-08-16), is older than the latest stable release and is not recorded. The homepage also links LinkedIn, which has no field. The oldest release is 0.1-beta1 (2016-05-29), so firstRelease is 2016. The Ory Network is the hosted service; its plans are not recorded.
