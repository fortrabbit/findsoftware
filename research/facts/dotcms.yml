notes: >
  The candidate row lists http://dotcms.com; it redirects to https://www.dotcms.com/, so the https address is recorded as homepage. License: GitHub reports the license as Other (NOASSERTION); the LICENSE file is the Business Source License 1.1 with a Licensor of dotCMS LLC and a Change Date four years from August 01, 2025, after which the Change License GPL v3 applies; no GPL-3.0 entry is recorded because it is a future license, not a current statement. The README and the BSL FAQ describe free use below $5,000,000 of total finances and a commercial license above it; the pricing page repeats the under $5M rule without prices. Versions use calendar versioning (for example 26.10.22-01 and the v25.07.10_lts line), so no currentMajor is recorded; latestReleaseDate is the newest release of the main line (v26.10.22-01), not the LTS line (v25.07.10_lts_*) that is released alongside it. The dotcms-cli-* releases belong to a command-line tool and are not used for the dates. The requirements page lists Tomcat 9 bundled and Java 25 bundled, and the quick start page describes the starter site with the Docker image; the installation index page itself is a shell with no install steps. The docs path under latest returns 404 for the requirements page; the same pages are served under /docs/manage/..., and that path is used. The privacy policy names dotCMS Holdings, LLC, dotCMS Services LLC and dotCMS LLC; only the LLC used for the software copyright is recorded as maintainer, and the homepage copyright line reads dotCMS, LLC. The contributor count reads the rel="last" page of the contributors endpoint with per_page=1. The README says dotCMS powers digital experiences for over 150 customers; that figure is the project's own and is not recorded as a field. The homepage footer links x.com/dotcms. The homepage says the Business Source License is free for non-production use, while the README and pricing page say free use below a $5M threshold; both statements are the project's.
