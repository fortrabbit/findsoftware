notes: >
  Maintainer from the LICENSE copyright line: Alexandre Demode, an individual; the homepage credits "Alex-D / Alexandre Demode". The homepage also links a Facebook page (facebook.com/Alex.D.fr), which is the maintainer's own, not recorded as a social field. The docs' installation section lists "Via a package manager" (npm, bower), "Download the package" and "Use CDNJS" (a script-tag route with a CDN); the download and CDN routes have only headings and code blocks as their statements, so no installMethod is recorded for them. The docs' Basics section gives the jQuery call $('#trumbowyg-demo').trumbowyg(), and the installation section says to load jQuery first, then Trumbowyg. The README's Supporting Trumbowyg section lists Patreon and PayPal donations and sponsors; these are donations, not a paid edition, and are not recorded. The README says "MIT-licensed open source project"; the LICENSE file is MIT. The homepage says the editor is compatible with all recent browsers (IE9+, Chrome, Opera, Firefox), a support list and not a runsAs statement, so no runsAs is recorded. The README's "lightweight" and the homepage's size claims are not recorded. The repository's default branch is develop, and the LICENSE link uses it.
