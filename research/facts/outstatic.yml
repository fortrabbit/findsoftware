notes: >
  The GitHub API reports the license as NOASSERTION; the license is read from license.md on the canary branch, the default branch. That file also grants an Apache-2.0 future license effective on the second anniversary of each version's release, which is not recorded as a license fact. The maintainer is the copyright holder in license.md; the README names Andre Vitorio under "Author", not recorded as maintainer. The hosted dashboard at outstatic.com is a separate paid service: the pricing page says "Hosted projects (Outstatic.com) require Pro to save and publish content", the free self-hosted tier is "Free forever". The docs state no runtime or Node version, and npm declares no engines field, so runtime is not recorded. The npm peer dependency on next names ^15 or ^16. The GitHub repository's default branch is canary.
