notes: >
  Ended: the README's Maintenance status section says "ts-rest is no longer maintained." and "Independent forks are welcome"; the homepage says "ts-rest is no longer maintained. Forks are welcome."; the repository is archived (api, archived true, last push 2026-10-26). The FAQ answers "Is this project actively maintained?" with "No." The README's quickstart link points to ts-rest.com/docs/quickstart, which answers 404; the live path is ts-rest.com/quickstart. The maintainer is named in the LICENCE file as Oliver Butler, and the README's notice is written in the first person by that maintainer. The README and FAQ name no fork; forkOf is absent. The FAQ compares the project with tRPC ("How does this compare to tRPC?", answered with "One of the biggest differences between tRPC and ts-rest is that tRPC defines your API implementation as the contract"); the comparison names a peer, so alternativeTo records trpc. The homepage lists Standard Schema validators (Zod, Valibot, ArkType) and OpenAPI generation; both are kinds recorded here in notes, not fields. The homepage's "It's just HTTP/REST" is a claim about the contracts the library describes and is not recorded as headlessApi. The latest prerelease is 3.53.0-rc.1 (2025-06-02), newer than the last stable 3.52.1; it is recorded as latestPrereleaseDate. The npm figure is @ts-rest/core, the package the README badge names. The quickstart's install lines also name the adapters @ts-rest/nest, @ts-rest/express, @ts-rest/fastify, @ts-rest/next and @ts-rest/react-query, which share the repository; their figures are not recorded.
