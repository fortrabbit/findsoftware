notes: >
  Not declared ended: the repository is not archived and the homepage presents the project as current. The homepage says "Built by shadcn" and "Ported to Svelte by Huntabyte & CokaKoala"; the port statement is a description of the project's origin, not a self-described fork, so forkOf is not recorded and the shadcn/ui relation stays in notes. The LICENSE.md copyright lines name Hunter Johnston, CokaKoala and shadcn; the first is recorded as maintainer because the repository owner is his user account, and the reviewer decides. The HTTP Archive count for shadcn/ui is a different project (React) and is not used. The CLI is an npm package with no engines field, and the docs show the commands for npx, pnpm dlx, bun x and npm, so no runtime is recorded. The npm package shadcn-svelte is the CLI, the only versioned artifact, so the npm figure counts CLI runs and installs, not components copied into projects; the homepage x link is the maintainer's account; components carry no version of their own. The GitHub releases are per package, and the newest stable CLI tag is shadcn-svelte@1.7.1 (2026-10-23), so currentMajor is 1. The 1.0.0-next tags are older than the latest stable and are not latestPrereleaseDate. Components are copied into the project through the CLI add command, which meets criterion 2 under the copy-in model.
