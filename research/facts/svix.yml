notes: >
  The server is the record: the repository svix/svix-webhooks holds the Rust server and client libraries under one repository; the npm svix package (4.5 million weekly downloads per the candidates row) is a client library, so its figure is not recorded, and the server's Docker image is the install route the project names. Current major is 1 from the server-v1 release line; the repository's v2 tags belong to the client libraries. The homepage's "Send a webhook with just one API call" sample shows an application calling the API to send a webhook, the wiring that makes the software in scope. The OSS page says the self-host path is Docker or a pre-compiled binary and points to the README for configuration. The README names PostgreSQL as the database for events and an optional Redis server for the task queue and cache (Redis is not in the databases vocabulary). The pricing page marks a Free plan "For developers testing Svix or setting up their first webhooks" (freeTier, coined, kept here). Isolated regions, SSO, a BAA and on-prem deployment are plan features of the hosted company (the on-prem option is an Enterprise plan item), not facts of the self-hosted server. The README gives docker run with port 8071 and a development.env file; no statement that the server runs as a daemon or service was found, so runsAs is unknown. No paidEdition is recorded for the Enterprise on-prem option. The Svix terms say the site is owned and operated by Svix Inc.; the terms name Svix Inc. as the owner and operator, which is the maintainer; the LICENSE copyright line reads Svix. The Community Forum entry on the open source page links GitHub Discussions. The homepage links Slack community support and Diom (a separate components platform); neither is recorded. The firstRelease year comes from the oldest GitHub release (2021-06-24), the repository was created in February 2021.
