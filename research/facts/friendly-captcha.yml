notes: >
  Hosted-service record: nothing is taken from the SDK or client repositories, which the homepage links as an open source library set for React, Vue and Angular under github.com/FriendlyCaptcha; their licenses, stars and npm figures are not recorded. The homepage and the developer hub name the widget as an invisible proof-of-work CAPTCHA that verifies in the background, and the widget is loaded into the protected page: captchaMethod proof-of-work is a coined kind, so it stays here. The pricing table lists "User management" for the Advanced plan as a bare label, with no roles named, so userRoles is not recorded. The Enterprise plan lists "Single sign-on, enhanced access control and audit logs" without naming a protocol, so no sso fact is recorded. The homepage lists plans Starter, Growth, Advanced and Enterprise with monthly prices in euros; prices are not recorded, and the plan limits (domains, requests per month) are recorded only as apiLimits for the Starter plan. The free tier is stated as "Free CAPTCHA for non-commercial use" for websites with low traffic, with up to 1,000 requests a month, and freeTier is a coined kind, so it stays here. The homepage states compliance with ISO 27001, GDPR, WCAG 2.2 AA, PCI DSS, DORA and no cookies: compliance and cookieless are coined kinds and stay here. The privacy page says the service stores no personal data from users. The homepage's "2.6 Billion web interactions verified per year" counts requests, not installs, so reportedInstalls is not recorded. The company describes itself as headquartered in the Munich area on its about page; the legal address on the terms page (Wörthsee, Germany) is the one recorded for maintainer and hqCountry.
