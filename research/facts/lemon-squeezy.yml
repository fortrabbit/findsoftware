notes: >
  The record covers the hosted Lemon Squeezy service. The GitHub repository lmsqueezy/lemonsqueezy.js is the official JavaScript SDK, so its license (MIT), stars (540), contributors (12), last push (2024-11-05) and npm figure stay in notes. The npm package the SDK publishes is @lemonsqueezy/lemonsqueezy.js (latest 4.0.0, MIT, 161655 downloads in the week 2026-10-26 to 2026-11-01); the API docs name it as @lmsqueezy/lemonsqueezy.js, which does not exist on npm, and the candidates row figure of 75.1k per week is out of date. The docs list a Laravel SDK, @lmsqueezy/laravel, which is also not checked on npm. The legal entity is Link, LLC, named in the footer of the terms as "Sold through Link, LLC f/k/a Lemon Squeezy LLC". The terms give two states of formation: the SaaS agreement says Utah, the terms of service say Delaware. The terms say the service is controlled "from its offices in the United States of America", which is not a headquarters statement, so hqCountry is not recorded; the reviewer decides. The blog post dated 2026-01-28 says Stripe acquired Lemon Squeezy in 2024 and that Stripe Managed Payments is Stripe's merchant-of-record product that Lemon Squeezy users are to migrate to; the service is still offered, so no end signal is recorded, and the migration is a reviewer decision for a successorOf or notes-only treatment. The terms name Stripe, Inc. as owner of the Lemon Squeezy trademarks. The pricing page lists plans with prices and a per-transaction fee; no prices are recorded. The pricing page says "It’s free to start" (a free tier, not a field). The docs state a limit of 300 API calls per minute, and the homepage says webhooks cover asynchronous events (both noted, not fields). The docs list official SDKs for JavaScript and Laravel (sdkLanguages, noted only). The homepage's X link points to twitter.com/lemonsqueezy and is recorded as x as the page states it. The blog post titled "Migrate from Gumroad to Lemon Squeezy" is a heading only, so importsFrom is not recorded.
