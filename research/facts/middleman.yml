notes: >
  The project has no GitHub release or tag; the release history is the RubyGems version list, so firstRelease (0.3.2, 2009-08-05), currentMajor (4, from 4.6.3) and latestReleaseDate (4.6.3, 2026-02-16) come from RubyGems. The newest prerelease, 5.0.0.rc.1, dates from 2019 and is older than the latest release, so no latestPrereleaseDate is recorded. The homepage states "Current version: 4.4.2", which is older than the gem's 4.6.3, so no version is taken from the page. The homepage footer reads "© 2011–2022" and the README reads "Copyright (c) 2010-2023", while LICENSE.md reads "Copyright (c) 2010-2014"; the maintainer is recorded from LICENSE.md as the copyright holder, and the homepage says "Maintained by the core team with help from contributors." The forum at forum.middlemanapp.com is linked over plain http, so it is not recorded. The repository owner is the middleman organization on GitHub. contentStore is left out, since the README describes a source directory in the project without naming a storage format. runtimeMin is the gem's ruby_version requirement from the RubyGems API. The x value is the Twitter link on the homepage.
