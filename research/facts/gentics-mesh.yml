notes: >
  The candidate row lists https://getmesh.io, which redirects to the GitHub repository; the project's own site named in the README is https://gentics.com/mesh, recorded as https://www.gentics.com/mesh/ (the page is the documentation landing). The README says Gentics Mesh is available as OSS and Enterprise Edition, and links an EE features page at gentics.com/infoportal/cmp/ossandee/ that answers 404 when read, so no paidEdition is recorded. The docs also list Commercial Plugins (Keycloak, Favourites, Comments, Likes, Must Read, GraphQL Library); the Keycloak plugin page says commercial plugins are downloaded from a commercial repository and must match the server's major and minor version, but the page does not state the plugins replace open-source features, so they are not recorded as an edition. The LTS releases are for Product Maintenance subscription customers, which is paid support, so they are not an edition. The Keycloak plugin page states that it does not add automatic SSO support for the Gentics Mesh UI, so sso is not recorded. The administration guide's system requirements say Java Runtime 11 and no other external dependencies, while the repository's pom.xml compiles for release 17 and the Docker base image is Java 17; the pages and the code disagree, so runtimeMin is left out and runtime jvm rests on the page. The software stack table lists Hibernate, Elasticsearch, Vert.x, Hazelcast and Dagger 2; no version is recorded from it. The Vert.x entry in basedOn comes from the stack table's core framework row. The admin guide also says the Mesh database connector is loaded from a JDBC classpath and lists MariaDB 10.3+ as the production example; no other database is named in the pages read. The copyright year in the README reads 2014-2025 and the release is 2026; the maintainer name is recorded from the README copyright line. Gentics Software AG is named beside GmbH in the docs footer; no parent is recorded because no page states the relationship. The contributor count reads the rel="last" page of the contributors endpoint with per_page=1.
