notes: |
  Stub: not yet known whether an SMTP mail server that serves mailboxes is software a website or web app is wired into under criterion 1 and the boundary rule for end-user apps. The docs describe mailboxes read through IMAP and mail clients, and relays between mail servers ("Relay inbound and outbound mail for an internal DMS", "Configure Gmail as a relay host", the AWS SES relay page); no page read names a website or web app that sends mail to its submission port. A docs page showing an application submitting mail to docker-mailserver over SMTP would settle it. The LICENSE file has two copyright lines, "Copyright © 2016 & 2017 Thomas Vial & Contributors" and "Copyright © 2016 - 2020 The GitHub Community & Contributors"; the maintainer follows the first and the second is recorded here as the other wording of the same MIT license. The docs state the project has no SQL database ("It employs only configuration files, no SQL database"), so no databases value is recorded. The GitHub releases start at v8.0.0 (2021-01-27); the changelog lists v7.1.0 and v7.2.0 without dates, so firstRelease is the first dated release. The GitHub language is Shell, which the language map does not hold, so the record would show no language value unless the map is extended.
