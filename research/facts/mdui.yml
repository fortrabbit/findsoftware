notes: >
  The GitHub repository reports no license because its LICENSE sits in packages/mdui; the MIT text is taken from that file on the v2 branch. The homepage and README say the project is developed toward mdui v3 on the M3 Expressive specification, and that v2 keeps receiving fixes; no v3 release exists in the GitHub releases, so currentMajor is 2. The LICENSE copyright line and the package.json author field name zdhxiong (with an email address, which is not recorded); no legal name or country is stated on the pages read. The npm figure counts downloads of the mdui package, which the install page names. The httpArchiveSites figure is the mobile origin count in the HTTP Archive technologies table, matching the other records. Web Components is a platform, not a parent project, so basedOn is not recorded.
