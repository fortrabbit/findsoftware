notes: >
  The repository has no GitHub release objects; the stable versions are its tags (3.1.6 to 3.9.13 on the first page of tags, 3.0.0 is the oldest, dated 2015-01-28), and npm's latest @knight-lab/timelinejs is 3.9.13, dated 2026-07-26. The npm package @knight-lab/timelinejs starts at 3.7.0 in 2020; the separate npm package named timelinejs (2.35.6, 2015) comes from the older NUKnightLab/TimelineJS repository and is not the install route, so it is not recorded. The README's install route is the import in "Use via ES6 modules/webpack", which names the package but gives no install command or sentence, so no npm installMethod is recorded; a reviewer may decide that route should be added. The README's authoring tool and the Google Sheets data source are the default way the docs describe creating a timeline; the authoring tool is the hosted service and is recorded as hostedOffering, and the spreadsheet is a data source outside the library, not contentStore. The category is ui-library, a widget embedded in pages. The footer gives "Evanston, IL 60208" with no country, so hqCountry is not recorded; the footer's copyright names Northwestern University, the legal entity, and the lab is recorded as maintainer as the homepage names it. The x link is the lab's account on the homepage footer. The documentation's Knight Lab support center and the sibling StoryMap and Storyline products are not alternatives stated by the project and are not recorded. The docs state the library is embedded with a stylesheet and script tag on the page; the same docs name the CDN and a local ZIP download as the two ways to get the files.
  The docs describe a JSON configuration format "for those who prefer not to use Google Sheets" (README), and the homepage warns that the Google Sheets document that configures a published timeline must not be deleted, since Knight Lab cannot recover it. The homepage quote is the warning, not a field.
