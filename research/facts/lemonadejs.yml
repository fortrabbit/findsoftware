notes: >
  The homepage (lemonadejs.com), the getting-started page and the README were read in full. The site documents the next major line ("Getting Started with LemonadeJS v6", the script tag at lemonadejs@6, "Upgrading from v5"), but on npm that line is only 6.0.0-beta.1 under the beta tag, and the latest tag is 5.3.6. The newest GitHub release is v5.1.3 (2025-07-22); npm carries 5.2.0 to 5.3.6 with no GitHub release. currentMajor is therefore 5, the highest stable major, and latestReleaseDate is the npm date of 5.3.6, the newest stable version. Reviewer decision: whether to move currentMajor and the install docs to 6 once a stable 6 is published; the site's lemonadejs@6 CDN address has no stable 6.x to resolve to. The GitHub main-branch README still describes the 5.x micro-library and is the source of the MIT wording and the ui-library quote. The website's footer names the copyright holder as "Jspreadsheet Team"; the site and the contact page name no legal entity or country, so hqCountry is not recorded. The npm package names a contact address as its author, not recorded. The site lists other products by the same team (Jspreadsheet Pro, Jspreadsheet CE, Jsuites, CalendarJS, Intrasheets); the site says LemonadeJS powers extensions shipped with those commercial products, which is a use, not a parent, so no parent is set. The docs describe templates as a tagged-template language without naming a templating system, so templating is not recorded. The CSV's "npm 10.3k/wk" is out of date: the range sum for 2026-10-18 to 2026-10-24 is 12379. The npm package's latest metadata has no license field; the MIT statements come from the GitHub API and the website.
