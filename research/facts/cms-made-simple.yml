notes: >
  The GitHub releases lag behind the releases the project's own site announces; latestReleaseDate is the date of the site's release announcement. The site's About page links the words "GPL" to the GPL-2.0 text, while GitHub reports GPL-3.0 for the repository; both are recorded as separate license entries and the difference is not resolved. The maintainer is the CMS Made Simple Foundation, incorporated under the Canada Not-for-profit Corporations Act in 2018 (registration number on the foundation page); the page gives the incorporation, not a headquarters country, so hqCountry is not found. The foundation page also lists four directors with their countries of residence, which is not a headquarters. The installation requirements page states PHP 7.4 as the minimum; the install page names the MySQL database. The Smarty templating engine is named on the site as the engine the software is built with and is recorded as basedOn; no separate Smarty record exists. The pluginDirectory value is the Forge module listing the homepage links as Modules. The site links a Slack chat under Get involved; no field holds it. The repository was pushed 2026-10-09 and is not archived; no end signal applies. No Packagist package under the repository name was found.
