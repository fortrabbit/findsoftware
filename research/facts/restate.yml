notes: >
  Accepted under criterion 1 because the SDK services call the server over HTTP: the invocation page says "You can invoke services over HTTP 1.1 or higher." (https://docs.restate.dev/services/invocation/http), so a site or app triggers durable work through the ingress. The CSV also listed jobs; no page states it as a category, so only durable-execution is recorded. License: the GitHub API reports NOASSERTION because the LICENSE file is BUSL-1.1 and GitHub does not detect it; the Licensor line names "Restate Software, Inc., Restate GmbH", and the Change License is "Apache License, Version 2.0" with a Change Date four years after release (https://github.com/restatedev/restate/blob/main/LICENSE). The license describes the latest release, so the change terms are only recorded here. The homepage calls the product "Open source / Self-hosted" beside Restate Cloud and BYOC; that label is marketing wording and does not change the license fact. Maintainer: the imprint (https://restate.dev/imprint) names Restate GmbH, Knaackstr. 92, 10435 Berlin, and the GitHub organization is restatedev. Latest release: v1.8.1-hotfix.2 is the highest stable GitHub release (published 2026-11-02); its major is 1. The newest prerelease, v1.8.0-rc.3 (2026-10-13), is older than the latest stable release, so no latestPrereleaseDate is recorded. Object storage: snapshots go to AWS S3 or MinIO in cluster deployments (https://docs.restate.dev/server/overview). SDK languages: TypeScript, Python, Java and Kotlin, Go, Rust and Ruby (README and https://docs.restate.dev/installation); the SDK repositories are separate projects and their figures are not recorded here. Free tier: "Restate Cloud offers a free tier" (https://docs.restate.dev/cloud/getting-started), kept in notes as a coined value. Links on the homepage that are not fields: Slack (https://slack.restate.dev) and LinkedIn (https://www.linkedin.com/company/restatedev/). The server keeps a materialized state cache in an embedded RocksDB, which is no databases value, and needs no external database. The Docker image is docker.restate.dev/restatedev/restate. The server runs as a single binary that persists data to disk, per the self-hosted overview. The oldest GitHub release is v0.1.0 (2023-04-27), which sets firstRelease.
