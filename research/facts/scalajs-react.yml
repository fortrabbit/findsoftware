notes: >
  The project's own site, japgolly.github.io/scalajs-react, answers 200 over https but is a JavaScript-rendered shell; it is the repository's homepage field, so it is recorded as homepage, and facts are cited from the README and doc/ pages. The README's Gitter badge has no field here. The README's Requirements section states React 19 or later, Scala 2.13 or later and Scala.js 1.20 or later; these are build requirements for the library rather than a runtime, so no runtime or runtimeMin is recorded. The Maven artifact is the core module for Scala.js 1.x on Scala 2.13 (core_sjs1_2.13), which the install docs name. The maintainer is named by the David Barri developer entry in the core POM; the LICENCE file carries the Apache template with the copyright holder left blank. The usage guide says setup is shown in a separate prototype repository, which is not read here. The GitHub releases run from 0.4.1 (2014) to 4.1.0 (2026); the 3.0.0 and 4.0.0 release candidates are prereleases and are not used. Maven publishes no download figure, so none is recorded.
