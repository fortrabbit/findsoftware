notes: >
  The project's own site and docs.modx.com answer 403 to curl and WebFetch. The documentation source is the project's repository modxorg/Docs (branch 3.x), and the installation, requirements and database facts come from its Markdown files. The docs name a third-party PostgreSQL implementation, so only MySQL is recorded as supported, and the same page says extras need their own drivers for custom tables, which is often only done for mysql; the requirements page lists MySQL 8.0+ or MariaDB 10.6+ as recommended. The homepage fact comes from the GitHub API homepage field. The licence is stated two ways: GitHub reports GPL-2.0 and the README badge says GPL v2, while the Packagist package for v3.2.4-pl states GPL-2.0+; both are recorded. The repository has no GitHub releases; the latest stable version is the Packagist tag v3.2.4-pl, which the GitHub tags list also shows. The 3.x branch is the one the README and composer.json were read from. The Packagist monthly and total download figures are both recorded with their periods.
