notes: >
  The install docs name the scaffolder pnpm create arrow-js and the core package @arrow-js/core; the npm figures and version come from @arrow-js/core, the core runtime that the monorepo publishes beside the framework, SSR and sandbox packages. The unscoped npm package arrow-js is a different project (pbojinov, version 0.1.9) and is not used. The npm weekly figure is the sum of the daily downloads API for 2026-10-18 to 2026-10-24. The first npm upload of @arrow-js/core is 0.1.0-alpha.0 from 2021-02-22, earlier than the oldest GitHub release (1.0.0-alpha.2, 2022-11-22); the LICENSE copyright is 2022 and the repository was created 2022-11-08 under the standardagents organization, and the CSV row records a move from justin-schroeder/arrow-js, so the 2021 upload is taken as this project's first release. The docs describe a sandbox package (@arrow-js/sandbox) that runs Arrow code in QuickJS/WASM; it is not recorded as a field. The framework and SSR packages are described on the README and docs but not recorded separately. The homepage is the project's own site and was read as server-rendered text; the X link on the homepage is a follow link to the author, not a project account, so x is not recorded. runsAs browser comes from the README statement that the core runtime can be imported directly in the browser; the SSR scaffold is not a runsAs value because no page states where it runs.
