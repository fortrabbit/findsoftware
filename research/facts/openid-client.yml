notes: >
  The repository has no project site: the GitHub homepage field is empty and the README links only the repository and the API reference in docs/README.md, so homepage is not recorded. The README says the package is "distributed via npmjs.com, jsr.io, and github.com"; the JSR route (jsr.io/@panva/openid-client) is named in that sentence and recorded as its own route, though no JSR install command appears. The README's "Supported Runtimes" list also names Bun, Cloudflare Workers and Electron, and the runtime field records the two names in the quoted sentence. The README says the library works wherever the Web Crypto and Fetch APIs exist, and its docs say that by default the module only allows HTTPS endpoints (allowInsecureRequests removes the restriction); both are in the README and docs/README.md and belong to notes. The README records a certification by the OpenID Foundation: Filip Skokan has certified that the software conforms to the Basic, FAPI 1.0 and FAPI 2.0 Relying Party Conformance Profiles. The README describes the package as a client API that simplifies integration with authorization servers, and lists as features the authorization code flow, the device, CIBA, refresh token and client credentials grants, token introspection and revocation, pushed authorization requests, DPoP, dynamic client registration and a Passport strategy; these are features, not fields. The Auth0 sponsor block is a sponsorship and is not recorded. The firstRelease year is the oldest npm upload (0.0.1, 2016-07-08) of the package, which predates the oldest GitHub release (2018-01-15). The npm figure for 2026-11-01 to 2026-11-07 is the sum of the daily range.
