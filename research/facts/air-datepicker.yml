notes: >
  Framework-agnostic: the docs say the calendar can be integrated in any modern framework, Angular or React named, so no basedOn. The npm figure covers 2026-10-26 to 2026-11-01. Release history: the registry has version 3.6.0 dated 2025-05-18 and the repository has the tag v3.6.0 but no GitHub release object for it; the newest GitHub release object is v3.5.3 dated 2024-05-26. The registry stable version is the newest release, so latestReleaseDate is the npm date. The repository's default branch is v3 and its last push is the same day as the 3.6.0 publish. The first tag is v1.0.0, committed in 2015. The CSV's 150.7k a week figure predates the current window. The homepage advertises a size of about 13 kB minified and gzipped; a bundle size is a coined kind and is not recorded as a field.
