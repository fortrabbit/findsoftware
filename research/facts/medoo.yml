notes: >
  Status is accepted. The repository is catfan/Medoo, but the LICENSE copyright line and the composer.json authors name Angel Lai, so Angel Lai is the maintainer and the GitHub owner catfan is not recorded as maintainer. The Packagist package catfan/medoo is the install route the README names and the source of the registry figures; the total is Packagist's all-time count and the monthly figure is its last-30-days count. The README and homepage say the package fits Laravel, CodeIgniter, Yii and Slim, which are named as places it fits, not as software it is built on, so no basedOn is recorded. The README's requirements list the PDO extension; the composer.json lists ext-pdo as required. The composer.json suggest list adds Sybase for PDO dblib on Linux and UNIX, which has no value in the databases field, so Sybase stays in notes. The README "Compatible" sentence is the databases quote. The composer.json keywords list also names database types, which add nothing beyond the quote. The homepage has sponsor banners and the README advertises an unrelated product (Gear Browser); neither is recorded. Open Collective sponsorship is not a field. The last GitHub release v2.6.1 is the latest stable release; the release v2.2.0-beta dated 2024-12-22 is older, so no latestPrereleaseDate is recorded. The firstRelease year comes from the commit "Medoo first release" of 2013-03-30, followed by release commits for 0.8.x and 0.9 in 2013; the oldest git tag and Packagist version, v0.9.5.3, date to 2014-04-28. The GitHub API counts 16 pages of contributors without anonymous contributors. The ecosyste.ms counts were read on 2026-11-16. The documentation is translated into 16 languages, which is a documentation translation and not a software i18n statement, so no i18n fact is recorded. The getting-started page offers a second route: download medoo.php, place it in the project and require it. It says the PDO driver for the chosen database must be installed and enabled. The about page says Medoo acts as the middle layer between PHP and the database. The README example creates a connection object from a configuration array and calls insert and select on it, and the composer.json description calls the package a PHP database framework.
