notes: The homepage www.endurojs.com answered 200 on 2026-10-22 with a Vietnamese online gambling site (title "8Xbet"), unrelated to the software, so no homepage is recorded and status is stub under AGENTS.md. The quote is the raw page title. The README links its documentation to endurojs.com/docs, which is that site; the README itself is the documentation read. The npm description calls it a "static page generator / cms" and the GitHub description a "node.js cms"; categories record both, and renderingModes and runsAs stay unknown because no page read states the output or the hosting. The GitHub repository has no releases, so currentMajor and the release date come from npm (1.4.47, 2019-01-15); tags go to 1.4.45. The last push is 2020-05-23, npm last modified 2022-06-17; the repository is not archived and the package is not deprecated, and no end statement was found. The admin interface is a separate repository (Enduro_admin) installed with enduro.
