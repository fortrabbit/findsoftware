notes: >
  Monorepo: the repository assertj/assertj holds the AssertJ modules (core, guava, joda-time, neo4j, db, swing and others); the stars and 376 contributors belong to the whole repository, and the Maven figures are for assertj-core, the artifact the install guide names. Versions: the GitHub release list uses tags named assertj-build-<version>; the highest stable is 3.27.7 (2026-01-24); 4.0.0-M1 (2025-03-09) is a milestone and is older than the stable release, so no latestPrereleaseDate is recorded. Maven Central lists 4.0.0-M1 as its release tag, but the stable 3.27.7 is in the same metadata; the Maven major is taken from the stable line. Maintainer: the pom organization is named AssertJ (url assertj.github.io/doc/); the pom lists about ten developers; the Apache LICENSE file carries no copyright line. Runtime: the guide says Java 8 or higher, and the parent pom at the 3.27.7 tag sets java.version to 8, the compiler release of that stable line. Kotlin 1.9 or higher and Android API level 26 and up (except soft assertions and assumptions) are stated on the guide; not recorded as fields. The guide points to the Spring Boot dependency-version management for the version property assertj.version. The DB module asserts on relational database types (Table, Row, Column) and does not make AssertJ a database-backed tool, so databases is unknown. Questions go to Stack Overflow (tag assertj), which is a Q&A site and is not recorded as a forum. The maven-metadata and ecosyste.ms figures are from the Maven Central registry; Maven publishes no download figure, so none is recorded. Install routes: Maven and Gradle snippets are two installMethod entries on the guide's Get AssertJ Core section. The Gradle quote contains the version in the snippet; the version is not recorded as a field.
