notes: >
  Criterion 2 is open, so this is a stub: the site installs its components by copy and paste, by the shadcn CLI against its own registry (an @aceternity entry in components.json) and through an MCP server, and it names no package or repository for the library itself. What would settle it: a ruling on whether a shadcn-style registry served from the project's own site counts as an installable release. The npm package aceternity-ui is published under the name aceternity with a company contact address, but the site does not name it, so it is not recorded as the install package. The GitHub organization aceternity holds only boilerplates (nextjs-boilerplate, saasternity), which are not the component library. The terms call the material proprietary and reserve all rights, and the licence page grants the Aceternity License for items bought or downloaded on the site, so the license is recorded as proprietary and the model as commercial; no open-source license is recorded. The Pro tier is a paidEdition fact without prices. The footer on every page reads "Aceternity Labs LLC", while the terms page names "Aceternity Solutions Private Limited"; both are recorded and the footer, which carries the current year, comes first. The first public release is the August 2024 entry on the changelog page. The pages named docs/installation and about in the navigation of earlier reads returned 404; the live pages are /installation, /licence and /changelog, which were read. The HTTP Archive technologies list (cdn.httparchive.org/v1/technologies) does not carry the project, and the project is not on npm under its own name, so no registry figures are recorded.
