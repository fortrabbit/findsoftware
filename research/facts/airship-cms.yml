notes: >
  The homepage airshipcms.io, listed in the candidate row, has an expired TLS certificate and no working page, so it is not linked. The project's own docs site airship.paragonie.com answers with the notice "Do not use the Airship website for the time being. Come back when version 2 is out.", and is recorded as homepage. The repository is archived (gh api) and its Packagist package paragonie/airship is flagged abandoned: true on v1.4.3, so the status is discontinued under AGENTS.md. The repository's own homepage field, cspr.ng, returns 404. The last push is 2019-03-22 and the latest stable release is v1.4.3 from 2017-05-05. Licenses: the Packagist package says GPL-3.0+, the README says GPL 3, and the README also offers commercial licenses; each is recorded as its own statement. The Packagist download figure is the all-time total (the monthly figure is 0); it is recorded as the total. The docs' Docker section is a compose file in the repository, recorded under docker. The README lists libsodium 1.0.15 or newer as a requirement and an AWS Marketplace listing, neither recorded as a field; the docs name two built-in cabins, Bridge (administration) and Hull (the blog). The oldest release is a v0.1.0 pre-release from 2016-04.
