notes: >
  Status: no end statement found. The repository was last pushed on 2025-11-10, the same day as the newest stable release (formik@2.4.9), and the npm package's latest version is not deprecated; release age does not end a record. A reviewer should confirm the status when the next pass runs, since the last commit is about a year old at check time. The homepage footer names Formium, Inc. as the copyright holder and links to formium.io, which sells a commercial hosted form builder that is not open source; that product is not recorded as a hosted offering of Formik. The package.json author is Jared Palmer (jared@palmer.net) and the repository owner is the jaredpalmer user; the maintainer follows the LICENSE copyright line (Formik, Inc.); the homepage footer names Formium, Inc. as copyright holder, which is a different legal name. The Formium terms page names no address or country, so hqCountry is not recorded. The Discord invitation is the Formium Community Discord that the tutorial names, linked from the homepage. The repository is a monorepo (packages/formik and formik-native); stars and contributors belong to the monorepo. The npm versions 2.0.0 and 1.4.4 are deprecated as mistaken or ignored releases; the latest version is not. The docs also describe a script tag loaded through unpkg, which is recorded as the cdn route. The homepage's "Enterprise" and "Users" navigation pages were not read.
