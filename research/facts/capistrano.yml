notes: >
  The installation page says "Capistrano is bundled as a Ruby Gem. It requires Ruby 2.0 or newer.", but the gemspec at the v3.20.1 tag requires ">= 2.5", the manifest of the latest release, so runtimeMin follows the gemspec and the 2.0 statement is not recorded. The README title names Rake and SSH as what the tool is built on; Rake is a dependency and no record id exists for it, so no basedOn. The runsAs local value rests on the README sentence that gives a cap command line tool, and the deployment runs over SSH from that command line. The maintainer is the copyright line of LICENSE (Tom Clements, Lee Hambley); the gemspec authors list the same two names. The mailing list on the homepage is recorded as forum. The RubyGems first upload is version 2.5.5 (2009-07-25) of the same project, which predates the oldest GitHub release (2016); the README points to the 2.x documentation archive for that line. RubyGems downloads are the total since the gem's first upload, as the API reports them. The repository was last pushed 2026-07-19 and is not archived, and no end or deprecation statement was found.
