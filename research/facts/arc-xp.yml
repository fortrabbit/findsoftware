notes: >
  Arc XP has no release, package or repository of its own that a user installs, so it is hosted-service with no version field; no dated release was found. No pricing page is linked: the FAQ says "Arc XP pricing is modular and typically based on usage, scale, and selected capabilities," and the site offers contact-sales only, so no price is recorded. The privacy page script data names WP Company LLC as the company that owns and operates Arc XP; no visible sentence states it, so the maintainer is the name in the footer copyright line, "Arc XP", with no legal form found. The FAQ calls Arc XP "a cloud-native platform built on scalable infrastructure" and no page says "SaaS", so licenseModel is left unknown. The developer portal lists PageBuilder Engine (the front-end framework), Composer (the editor), the Content API and the Arc XP Identity product; Arc XP Identity documents OIDC support (https://dev.arcxp.com/subscriptions/identity/configure/setup-identity-as-oidc-provider/), but that is the Subscriptions and Identity product and no page says the CMS signs users in through it, so sso is unknown. The developer GitHub organization arcxp and its SDK repositories go to notes only, as does the LinkedIn page (https://www.linkedin.com/company/arc-xp/mycompany/). The site describes the company as built from The Washington Post newsroom ("Born from The Washington Post's longstanding commitment to reinvention"), which is a history statement and not an ownership statement beyond the privacy notice. The Arc XP FAQ also says the platform supports headless delivery through APIs, but no page states the API protocols beyond RESTful endpoints. The Composer and PageBuilder live preview is listed in the developer navigation but no sentence states it, so livePreview is unknown.
