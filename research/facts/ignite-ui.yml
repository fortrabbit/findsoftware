notes: >
  Two license statements are recorded as the LICENSE file words them: MIT for the listed components and the Infragistics Commercial License for everything else; the npm package declares "SEE LICENSE IN LICENSE". The GitHub API reports no SPDX id (NOASSERTION). The LICENSE lists MIT components by name, so the MIT and commercial parts are separable per component. The maintainer is Infragistics, Inc. per the legal terms page copyright line, with its address in Cranbury, NJ; the product page says "Infragistics" only. The product page lists x.com/infragistics and a Discord invite as its own links. Docs links on the product page point at component pages; the getting-started page was read for the install route. The product page's pricing link is recorded as pricingPage without prices. Repository owner IgniteUI is an organization and the maintainer is the company, so no parent is recorded. The getting-started page lists Node.js and Angular CLI prerequisites for the tooling, not a runtime for a built site, so no runtimeMin. The compare page names Telerik, Syncfusion and DevExpress as the other vendors it compares against. Contributors come from the contributors endpoint, one count across all pages.
