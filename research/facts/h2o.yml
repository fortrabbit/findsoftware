notes: >
  Doubt: criterion 4 cannot be judged mechanically because the project stopped publishing versions and ships from master. The install page says "As of April 2023, we have ceased to release versions." and the repository's tag-no-more-releases release (2026-01-19) says "In 2019, we decided to stop tagging versions", which contradicts the install page's date; the newest stable tag is v2.2.6 (2019-08-13), so the import's four-year rule would move the record to stub, and the page says "Users are advised to use the up-to-date commit of the master branch". Settling it means deciding whether a project that ships only from master counts as released: if it does, set status accepted (lastCommitDate is recorded from the newest master commit, 2026-10-29). The record stays stub until then. The homepage is served over https (HTTP/2 200 at h2o.examp1e.net, redirecting plain http to https). The homepage footer reads "Copyright © 2015-2025 DeNA Co., Ltd. et al." and the site reports server version 2.3.0-DEV, so the homepage is dated; the license copyright is "Copyright (c) 2014 DeNA Co., Ltd." (the LICENSE file has no "et al." contributors line). The DeNA homepage (dena.com/intl/) names no country, so hqCountry is left out. currentMajor is 2 as the highest stable tag; the master branch reports 2.3.0-DEV and the minor line stays in notes. Scripting: mruby (Rack-based) is a build option; it is not recorded as a runtime. Fields coined here: none.
