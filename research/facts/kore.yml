notes: >
  The homepage shows "Latest release: 4.3.0" and kore.io/releases/4.3.0 lists the kore-4.3.0 tarball dated 2026-09-02, which is the source of latestReleaseDate; GitHub carries only the 4.3.0 release candidate tags, and the highest stable tag is 4.2.3, from which currentMajor comes (4 either way). The help page still shows 4.2.3 as latest release. The docs site documents Kore 4.2.x only, as its own index says (docs.kore.io/4.3.0/ answers 404), and the install page names the 4.2.0 tarball, so the install method is taken from the page and not the version. Kore can run page handlers written in Python when built with PYTHON=1, and the Python API page says the code runs inside the Kore worker process; the runtime is recorded as binary, the native build, and Python is not recorded as a second runtime. The install page lists Linux, OpenBSD, FreeBSD and macOS as tested platforms and GNU Make for BSD-like systems. The README lists Lua and ACME as optional build flavors; neither is a field. The release tarball is signed with minisign, which the install page states. The firstRelease is the tag 1.1-release dated 2014-03-01; no earlier tag exists in the repository. The LICENSE copyright names Joris Vink for 2013-2022; the README and homepage both state the ISC license. The node-based quote checker cannot open kore.io or docs.kore.io (a TLS alert on the Node handshake), so the quotes from those sites were confirmed against curl output by hand.
