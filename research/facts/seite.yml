notes: >
  The homepage is https and answers 200. The README and getting-started page describe seite as built in Rust and shipped as a single binary with no runtime dependencies. Its own about page names Tera for templates. The maintainer name is the LICENSE copyright line; the about page is written by the author as CTO of a startup and names no company, so no legal entity is recorded. The GitHub owner is the seite-sh organization. Claude Code is the interface the project is built around and is not recorded as basedOn; Tera is a library the binary uses, not a parent project. The 49 GitHub releases start on 2026-02-21, the day after the repository was created (2026-02-20), so firstRelease is 2026. The crate figure is the crates.io total download count. Fields coined here: deployTargets. Other things the pages state, kept here and not as fields: `seite agent` starts Claude Code with the site's config and content, and `seite mcp` runs an MCP server over stdio; Claude Code is a separate install that the agent and AI theme generation need; every build also writes a Markdown copy of each page plus llms.txt and llms-full.txt; the CLI collects anonymous usage telemetry that is on until turned off (README, "anonymous, opt-out"); the contact-form shortcode supports Formspree, Web3Forms, Netlify Forms, HubSpot and Typeform (https://seite.sh/docs/contact-forms). The pages hold no prices.
