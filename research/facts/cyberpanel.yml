notes: >
  Boundary question resolved as accepted. The GitHub repository has no release since v1.9.1 (2019-10-15) and its tags stop at v1.9.1, but the project's own changelog at cyberpanel.net/KnowledgeBase/home/change-logs/ dates releases through v3.0.8 (build 8), 2026-10-18, so criterion 4 holds on the project's own release record; the repository is not archived and was pushed 2026-10-27. A reviewer should decide whether the project's own changelog counts as the release source here. The changelog is the source for currentMajor, latestReleaseDate and firstRelease: firstRelease is the oldest dated entry visible on that page (v1.7.2, 1 October 2018), which may not be the first ever release. The default branch is v3.0.5-dev and the repository also carries branches such as stable and master; no branch is treated as a release. GitHub labels the repository language JavaScript, while the changelog describes a Django codebase and a Python 3.12 panel runtime; language is recorded as Python from the changelog, and a reviewer should confirm it against the package layout. runtimeMin is not recorded: the Python 3.12 panel runtime is stated for the 3.0.0 and 3.0.4 entries only, not for the latest release. The README lists supported operating systems (Ubuntu 22.04 to 24.04.3, AlmaLinux 8 to 10, Rocky and RHEL 8 and 9, CloudLinux 8, CentOS 9) and says the panel runs on x86_64; the install article gives 1024 MB RAM and 10 GB disk, and it dates from 2024. The README feature list covers user access levels through ACLs, automatic SSL, an FTP server, PowerDNS, phpMyAdmin for MariaDB, email with webmail, a file manager, a firewall, backups and Docker management. The panel's web server is OpenLiteSpeed, stated on the homepage and in the README; no field for it is in the starter list. The README links a YouTube channel at youtube.com/@Cyber-Panel and a community forum; no youtube field is in the starter list, so it is not recorded. The homepage links no social accounts, so the Discord, Facebook group and forum facts come from the README. The Facebook link is a group, not a page. The maintainer is CyberPersons LLC as the privacy policy names the company behind the CyberPanel website; the policy also names Cyberpersons FZE LLC as the seller for the CyberMail service, which is a separate service and is not recorded. GitHub user usmannasir (Usman Nasir) is the repository owner and is not recorded as the maintainer. The CyberPanel Enterprise edition runs LiteSpeed Enterprise under a license, and its pricing page sells LiteSpeed Enterprise licenses and a paid plan for multiple domains; prices are not recorded. The docs article "Installing CyberPanel" was last updated June 2024 and lists older operating systems than the README, so the README list is the one that is current.
