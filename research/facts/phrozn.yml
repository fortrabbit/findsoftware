notes: >
  The repository Pawka/phrozn is archived (api, checked 2026-10-23), which is the end signal. The homepage phrozn.info, listed in the repository description, answers 200 but shows an unrelated art-print blog and no page about the software, so no homepage is recorded. The repository has no GitHub releases, only tags; the highest stable tag is 0.5.6 (commit dated 2014-01-04), so currentMajor is 0 and latestReleaseDate comes from that tag. firstRelease is the oldest tag, 0.2 (commit dated 2011-06-30). The maintainer is the copyright holder named in NOTICE (Victor Farazdagi); the repository owner is the GitHub user Pawka, which is not a legal notice and is not recorded as maintainer. The README names no docs site beyond the textile list entries "API Documentation" and "User manual", which have no links; docs are unknown. composer.json states no PHP version, so runtimeMin is unknown. The Packagist package pawka/phrozn is flagged abandoned with no replacement.
