notes: >
  The README is the documentation; the homepage is a demonstration page that loads its own stylesheets from cdnjs and unpkg. The last GitHub release is v0.7.0 dated 2023-02-22, the same date as the npm latest, and the default branch was last pushed 2024-02-03; the repository is not archived and the npm package is not deprecated, so no end signal is recorded. The LICENSE copyright holder is "Fabien Sa"; the GitHub profile of the account BafS shows "Fabien Salathe" and a Switzerland location, neither used because the project's own LICENSE states the first name form, and no legal or imprint page was read. The README describes print features (hiding elements, page breaks, print colors) and two themes, which carry no category value beyond css-framework. The first GitHub release is v0.1.0 dated 2016-10-04, and the npm package starts in 2016.
