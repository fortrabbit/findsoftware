notes: >
  Stub: the project site named in the CSV and in the gem metadata, https://rouge.jneen.ca/ (reached from rouge.jneen.net too), answered 502 on every request on 2026-11-16, so no homepage is recorded; a 200 answer from that site with its own description would settle it, and the record can then return to accepted, since the repository, README and gem are public and document an install. The README and the gemspec both state the license: "Rouge is released under the MIT license" and the LICENSE file carries a second license, BSD-2-Clause, for the lexers adapted from Pygments ("Many of the lexers in this project are adaptations of those in Pygments"); the two are recorded as separate entries, and GitHub reports the repository license as NOASSERTION. The gemspec summary "A pure-ruby colorizer based on pygments" states the parent, so basedOn is pygments, while the README says only that its HTML output is "compatible with stylesheets designed for Pygments". The README names Jekyll's default highlighter and the Middleman, RDoc and Rails integrations, all third-party or downstream, and none is recorded. The maintainers in the README are Jeanine Adkisson, Drew Blessing, Goro Fuji and Tan Le; the LICENSE copyright line names Jeanine Adkisson alone, so she is the maintainer and the others stay here. Stars and contributors belong to the rouge repository. The first version is the v0.0.2 tag of 2012-09-01, and the first gem upload is 0.0.1 of 2012-08-30, both in 2012. The rubygems total is the download count of the rouge gem.
