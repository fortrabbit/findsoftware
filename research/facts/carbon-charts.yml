notes: >
  A monorepo: the repository holds the core package @carbon/charts, which the core README installs, and separate Svelte, React, Vue.js and Angular packages; the core README describes the core as vanilla JavaScript and the root README names the four bindings. Stars and contributors belong to the monorepo, and the npm figure is the core package's, which the install block names. The bindings are packages of this same repository, so they stay in notes and are not separate records. The core README uses IBM Telemetry, which collects anonymized usage data when the package is installed as a dependency; the page says so and gives an opt-out link, so it is recorded here as a note. The README and repository description call the library built with D3 and TypeScript; D3 is a dependency and not a parent, so basedOn is not recorded. The README names the 1.x line as supported and 0.x as end of life; the current major is 1. The repository's primary language on GitHub is HTML; the TypeScript value rests on the repository description. The project site and the README name no browser sentence, so runsAs is not recorded. The site's docs pages are a client-side application that returned no text when fetched, so the docs fact cites the README. No page names the maintainer's country, so hqCountry stays out. The npm author field and the ibm.com legal page both say IBM; the legal name comes from the legal page.
