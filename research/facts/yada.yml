notes: >
  No homepage. The GitHub repository lists https://juxt.pro/yada/index.html as its description link, but that address returns 301 to www.juxt.pro and then 301 to github.com/juxt/yada, so it is the repository, not a project site. The user manual the README points to lives on that same address and is not served; the repository's doc folder is the docs recorded. The repository has no GitHub releases; its tags are annotated and the highest stable tag, 1.2.16 (2018-12-19), has no Clojars release, so the registry release 1.2.15.1 (Clojars latest, tagged 2019-07-16) is the basis for latestReleaseDate. Major 1 holds for both. GitHub tags 1.4.0-alpha1 (2019-07-11) and the other alphas are older than the 1.2.15.1 tag, so no latestPrereleaseDate. The newest commit on master is dated 2020-04-27 and the newest on the fixes-1.2 branch 2021-09-01; 2023-04-06 is the repository's pushed_at, not a commit date. No archive flag or end statement was found; the status stays accepted. The install guide names Aleph as the built-in web server, so basedOn holds aleph as well as manifold; the company's head office address on juxt.pro gives hqCountry. The README's "Lean yada" section names an alternate Clojars artifact (yada/lean); the figures are for the default yada artifact. Clojars downloads figure is the total from the artifact API. The GitHub language field reads HTML; the README names Clojure. The README lists Clojure 1.8.0 as a dependency; recorded in notes only, not as runtimeMin. The runsAs value rests on the install guide's statement that a web server is started on a chosen port. The README's Slack and Gitter chat links are not recorded as facts.
