notes: >
  Motion for Vue is the Vue package of the motiondivision/motion-vue repository; the installable package is motion-v on npm, and the npm name motion-vue is an unrelated 0.0.1 package with no homepage, so npmName is motion-v. The repository's GitHub releases run from v0.2.1 (2024-11-23) to the newest stable release, the source of currentMajor and latestReleaseDate; the npm package was first uploaded on 2024-11-17, in the same year. The v2.0.0-beta.1 prerelease is older than the latest release, so no latestPrereleaseDate is recorded. The LICENSE copyright line names Rick Huang while the repository is owned by the motiondivision organization; the Motion B.V. copyright line is in the sibling motion record. The docs say "every feature from vanilla Motion is also compatible", which relates this package to the motion record, and they say Motion for Vue contains "APIs specifically tailored for Vue"; no sentence states that the package is based on or a plugin of Vue or Motion, so basedOn stays empty. The npm peer dependencies are vue and @vueuse/core, which is no basedOn statement. The README lists server-side rendering as a feature, which is no runsAs statement. Motion+ is a one-time-fee membership of examples and premium APIs such as Cursor and Ticker; the motion record notes that its page licenses those APIs and examples under MIT, so no paidEdition is recorded. ecosyste.ms reports no dependent packages or repositories for motion-v, which is not recorded. The discord link is the one in the README's contribute section; the homepage footer, shared with the motion record, links X and YouTube and has a newsletter sign-up form.
