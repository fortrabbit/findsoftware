notes: >
  The homepage is the project's GitHub Pages demo at css.github.io/csso/csso.html, the site the repository names; its page is a minifier playground titled "CSSO – CSS optimizer". The README is the only documentation, so no docs field is recorded. The LICENSE names two copyright holders: Roman Dvornov for 2015-2021 and Sergey Kryzhanovsky for 2011-2015; the package.json author is Sergey Kryzhanovsky, and npm lists afelix, tadatuta and lahmatiy as maintainers. The maintainer is recorded as the latest LICENSE holder, so the reviewer may choose the other name. The README says CSSO "is based on CSSTree" to parse CSS; CSSTree has no record, so basedOn stays empty. The runsAs local value rests on the README's Node API usage (importing minify from the npm package) as a build step; the README also offers browser bundles but does not say the minifier runs on a live site. The engines range at the v5.0.5 tag lists Node 10 as the lowest major. The last release is v5.0.5 (2022-08-10), the npm latest is the same version, and there is no prerelease; the repository was pushed 2024-06-21 and is not archived or deprecated. The latest release is more than four years old, so the import will move the record to stub by its own rule; the status here is the CSV's accepted. The weekly npm figure is the sum of the 2026-09-28 to 2026-10-04 window. The twitter.com link comes from the README badge and carries no quote, as the rule for badges says. The README describes three transformations (cleaning, compression and restructuring) and an optional usage-data input with scopes, which lets the optimizer merge rules that never appear together on one page.
