notes: >
  Renamed: the project was called Franken UI and is now 0build. Franken UI's README reads "Franken is now 0build. Go to https://0build.dev to learn more." (https://github.com/franken-ui/ui/blob/master/README.md), and the 0build release notes (https://0build.dev/docs/latest/kit/release-notes/) state under v0.4.5: "Franken UI and Frankenstyle no longer reflect what this project does", so there was an intermediate name, Frankenstyle (npm frankenstyle, last version 0.3.8). The franken-ui npm package was last released as 2.1.2 on 2026-01-18 and is not deprecated; the old repository https://github.com/franken-ui/ui is left in place, not archived, and the release notes say "We will leave the old repositories and websites as they are". The same maintainer carries it over: the GitHub profile sveltecult, named Reden, is the Sponsors and Ko-fi link on both sites. 0build has no npm package ("Cutting off NPM", "100% CDN-based") and no GitHub release; the repository carries version tags, the newest v0.7.8 (2026-10-27), while the docs page shows files from 0.6.13. The version is 0.x, so no currentMajor, and the tags are not labeled prereleases, so lastCommitDate is recorded instead. firstRelease 2024 is the first publish of the franken-ui npm package, the lineage 0build continues; the 0build repository itself was created 2026-06-06. basedOn is UIkit: the CDN bundle is UIkit 3 renamed zUIkit, while the introduction also says the look follows shadcn/ui and coss/ui. The docs and the repository's README state the MIT license; the GitHub API gives the same SPDX value. The maintainer is named as the copyright holder "0build", with no legal form; the release notes call the project's author "a solo maintainer". The contributors endpoint returns no list for the repository, so no count is recorded. The homepage https://0build.dev answers with a redirect to the docs introduction.
