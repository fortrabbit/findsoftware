notes: >
  Doubt: renamed to 0build; the record may follow the new name. The project's README on master reads only "Franken is now 0build. Go to https://0build.dev to learn more." and the homepage shows the same notice, while still linking the v2.1 docs. 0build.dev is the same maintainer's next design system: its documentation lists the same UIkit-derived component set, it links the same Ko-fi page (sveltecult) as the Franken UI site, and the GitHub profile behind it is named Reden, the maintainer named here. A rename by the same maintainer is no end, so status is not discontinued; a decision is needed whether to keep this record, or to move it to the 0build name. The repository has no release or tag; currentMajor, latestReleaseDate and the npm figures come from the npm latest tag (registry date 2026-01-18), so no GitHub release date applies. The repository is not archived and was last pushed 2026-06-14. No LICENSE file is present on master; the MIT license is the GitHub API's SPDX value. The maintainer is named as "Reden" on the homepage; the npm author field gives the same name. The homepage points to a Ko-Fi page for the maintainer, which is a donation link, not recorded.
