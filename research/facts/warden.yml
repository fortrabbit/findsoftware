notes: >
  Shell CLI that drives Docker Compose files. Supported environment types on the environments page: Drupal, Laravel, Magento 1, Magento 2, Shopware, Symfony, WordPress, plus Local for custom environments; the homepage lists the same stacks ("Full support for Drupal, Laravel, Magento 1, Magento 2, Shopware, Symfony, Wordpress and custom project environment configurations on macOS and Linux"). Operating systems: macOS and Linux, Windows through WSL2 (installing page). Prerequisites on the installing page: Docker Desktop for Mac, Docker for Linux or Docker for Windows, docker-compose version 2 or later, and Mutagen 0.11.4 or later on macOS for sync sessions. Homepage copyright reads "Copyright © 2019-2022 by The Warden Project & David Alger"; the LICENSE copyright line names David Alger, which is the maintainer recorded here. Sponsorship on OpenCollective and GitHub Sponsors is not a paid edition. Repository was created 2019-05-29 under the davidalger account and moved to the wardenenv organization; the first release is 0.1.0-beta1 on 2019-06-03. Adoption: 476 stars and 48 contributors on 2026-10-28; no npm, Packagist or PyPI package applies. The Docker images are published on Docker Hub under wardenenv (images page); they are not a separate software record. Docs copyright reads 2019-2022. README features: Traefik for SSL termination and request routing, Portainer, Dnsmasq for .test domains, an SSH tunnel to database containers, wildcard certificates issued by Warden, and per-project custom environment definitions.
