notes: >
  The bundle has no site of its own: the Packagist homepage field is empty and the repository is the only project page, so no homepage is recorded. The README's version table (1.0 DEV, 0.14 STABLE) is older than the release history; currentMajor 1 and latestReleaseDate follow the GitHub release v1.10.0 of 2026-04-13. The composer.json at v1.10.0 requires Symfony components 5.4 to 8.0 (symfony/framework-bundle and symfony/config), recorded here only as notes. The README names webonyx/graphql-php as the GraphQL execution library and ReactRelayNetworkLayer and apollo-upload-client as batching clients: a dependency and client libraries, so no basedOn beyond Symfony. The Telegram group "Overblog GraphQL" and the Symfony Slack channel are community chats and not recorded as forum or discord. The maintainer is taken from the LICENSE copyright line (Overblog). The legal notice at over-blog.com names Webedia as the publisher and host of the site, with a Levallois-Perret address; Webedia is another legal entity, so no hqCountry is recorded for the bundle maintainer. Packagist downloads are the total since release, as the Packagist API reports them on 2026-11-16. Dependent counts come from ecosyste.ms for packagist.org. The bundle's Symfony Flex contrib recipe and the optional GraphiQL bundle are not recorded. The README states the bundle integrates GraphQL "using webonyx/graphql-php and GraphQL Relay"; the docs' manual installation enables a single GraphQL endpoint in routing configuration, with a multiple-endpoint route for several schemas. The docs list optional features that need extra packages: the Validator features need symfony/validator and doctrine/annotations, annotations need doctrine/annotations, and the Doctrine type guesser needs doctrine/orm.
