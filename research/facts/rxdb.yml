notes: >
  Criterion 1 holds: the README describes a database library that apps use for storage and sync, not a finished application. The README names rxjs as a peer dependency that must be installed next to rxdb; a package dependency is no basedOn statement, so basedOn stays empty. The README's Framework list (Angular, React, Vue and others) and the sentence that RxDB is based on a storage interface name no parent software. The README's runtime list names browsers, Node.js and React Native among others, and the browser is no runtime value, so runtime keeps node alone and runsAs stays empty. The Apache license file carries no copyright line, so the maintainer comes from the legal notice on the project's own site, which names Daniel Meyer - RxDB; the privacy page gives the same controller with a full address in Stuttgart, Germany. The first npm upload 1.0.0 dates from November 2016 and the GitHub repository from December 2016, so firstRelease is 2016. The currentMajor is 17 from the stable v17.6.0 release; the earlier 17.0.0 betas are older than the stable line, so latestPrereleaseDate is not recorded. The premium page says the open core is free and the Pro and Pro Plus tiers add commercial plugins (the rxdb-premium package), so paidEdition is recorded and no prices are. The SQLite storage is one of the premium plugins; the core ships a trial SQLite storage limited to 500 documents, and the Node.js page names FoundationDB as a further storage, which has no database field value. The npm engines field of the latest release gives runtimeMin 20. The alternatives page lists many more projects as alternatives; only those with a record in this dataset are recorded, and the rest have no fact file in this wave. The homepage links LinkedIn, which has no field in the dictionary and is kept here: https://www.linkedin.com/company/rxdb. The homepage's Twitter link is an intent URL for the screen name rxdbjs, recorded as the x.com profile. The homepage says RxDB stores data locally on the client and syncs seamlessly with any backend, and the README names production-ready replication plugins for GraphQL, CouchDB and WebSocket. The npm figure is the sum of daily downloads for the rxdb package named by the install line. The GitHub stars and contributors belong to the single repository, which is not a monorepo.
