notes: >
  The CSV name Sharp is the Laravel package code16/sharp, not the libvips image library. The homepage says "Sharp 9 relies on Laravel, Tailwind CSS, Inertia, Vue and Alpine.JS." while the page title and the installation guide say 10.x and the release is v10.0.2, so the adminUi quote may describe an older release and the adminUi value is unconfirmed for 10.x. The homepage says the project is "developed by Code 16", a web agency based in France, and the same sentence gives "since 2017"; firstRelease uses the repository creation year from the API, because the page gives a development start, not a release. The installation guide is at /docs/10.x/guide/installation; /docs/installation redirects. The 10.x guide says the package needs Laravel 11 or newer. Adoption: 800 GitHub stars and 68728 Packagist downloads total, from the API on 2026-10-19.
