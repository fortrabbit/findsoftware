notes: >
  The repository is the successor's repository and carries Shoelace history: its oldest tag is 1.0.0-beta1 (commit dated 2017-07-25), which sets firstRelease, and its GitHub release list starts at 3.0.0-alpha.13 (2025-05-20). The shoelace record is discontinued because its README says Shoelace is sunset; the migration page of this project names Web Awesome as the next major version of Shoelace, which is the successorOf quote. The GitHub API and the README state the core license as MIT; the Pro license covers premium components, themes and tools, so the license model is open-core. The Pro license page says the license type depends on the plan bought, with plans and prices on the pricing page; no prices are recorded. The homepage links to a Kickstarter campaign and Bluesky, Mastodon, X and Threads; the Kickstarter link is not a field. The live docs' server-side rendering page is a compatibility statement, so it is not recorded as renderingModes. The Pro software is distributed to paying customers and the npm package named by the docs is the free core (@awesome.me/webawesome); Font Awesome, the company's other product, is not recorded as parent because no page states ownership. The footer names Fonticons, Inc. as the copyright holder and the Terms name Arkansas law and courts in Bentonville, Arkansas; these are not a statement of headquarters, so hqCountry is not recorded. The docs say the library is framework-agnostic; that is not a basedOn statement. The npm package webawesome (version 0.0.1) is a placeholder and is not used. httpArchiveSites: the HTTP Archive technology list (checked 2026-10-28) has no entry for Web Awesome, so none is recorded.
