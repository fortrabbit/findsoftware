unreadable: ["https://www.s9y.org/team.html returns 404"]
notes: >
  The GitHub homepage field and the candidate row name s9y.org and docs.s9y.org; the project's own site is www.s9y.org (s9y.org redirects there), and docs.s9y.org is recorded as docs. The release tag 2.6.1 matches the GitHub release, which was published 2026-07-22. The blog's development-state box names 2.7-alpha1 as the trunk state; pre-release versions are not recorded. The maintainer is the team name the blog gives for the server operator; the LICENSE copyright line names Jannis Hermanns on behalf of the Serendipity Developer Team (2003-2019), and the docs name Garvin Hicking as core developer. The team page linked from the home page returns 404, so the developer list is unread. The docs describe a commercial support offer from Faktor E (Bonn), which is not the maintainer and is not recorded. The XML-RPC endpoint (serendipity_xmlrpc.php) is named in the FAQ; it is not a documented REST or GraphQL API, so headlessApi stays out. No package is named by the install docs (download an archive), so no registry figures are recorded; the Packagist entry s9y/serendipity exists and is not used. The PHP minimum comes from the fresh-installation page. The Spartacus link on the home page is http; the record keeps the URL as the page gives it.
