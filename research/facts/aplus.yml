notes: >
  The install docs name composer create-project aplus/app, a project skeleton that requires aplus/framework. The repository and all registry figures come from the core package aplus/framework and its repository aplus-framework/framework; the skeleton repository aplus-framework/app (621 stars, release 2026-01-21, no LICENSE file) is not recorded. The candidate row names the skeleton; a reviewer should align it. The package page aplus-framework.com/packages/app named in the row is not the homepage. The framework LICENSE file names Natan Felles as copyright holder. The User Guide says the App is designed for HTTP and CLI, and its deployment section covers shared hosting and private servers; no page states a process model, so runsAs stays unknown.
