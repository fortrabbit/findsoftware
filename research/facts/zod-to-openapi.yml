notes: >
  The repository is the only web presence; the README links the maintainer's company site, and no project site exists, so homepage stays empty. The README's first lines give the Zod 3 path: for Zod v3 support, install version 7.3.4, which the maintainers do not intend to support going forward; the README says the Zod 4 support starts with version 8, and the README's Technologies section names Zod 4.x and openapi3-ts. The generators OpenApiGeneratorV3, OpenApiGeneratorV31 and OpenApiGeneratorV32 produce OpenAPI 3.0, 3.1 and 3.2 documents; that is spec compliance, recorded here and not as a field. The README states no runtime. The npm first upload is version 0.3.0 on 2022-04-16, and the repository was created on 2022-04-14; the GitHub release list starts at 1.0.0-rc.1 on 2022-04-21. The LICENSE copyright line names Astea Solutions; the company's privacy page states the operating entity as Astea Solutions AD at a Sofia address, which gives the legal form and the headquarters country, and its contact page lists an Astea Solutions, Inc. for North America. The npm figure is the scoped package @asteasolutions/zod-to-openapi named by the install line; the period is 2026-11-01 to 2026-11-07. Stars and contributors belong to this repository, which holds only this package. The latest stable release is v9.1.0 dated 2026-07-19; the registry's latest tag matches.
  The README describes an OpenAPIRegistry that collects named schemas, parameters and paths, generateComponents and generateDocument for the output, a build step that writes openapi-docs.json, and Zod schemas of unsupported types that raise UnknownZodTypeError unless the type is given by hand through the openapi method.
