notes: >
  The highest stable GitHub release object is broadleaf-5.0.21-GA (2021-12-17) and GitHub holds no release objects after it, but the stable tags continue to broadleaf-7.1.0-GA (commit 2026-10-14) and the docs name "Current Version (7.0)"; currentMajor 7 and latestReleaseDate follow the highest stable tag through the tags and commits API. Maven Central holds org.broadleafcommerce artifacts only up to 3.1.15-GA, first uploaded 2012-04-30, which is the firstRelease year. The license is stated two ways: the Fair Use License 1.0 for the Community Edition and the Broadleaf EULA 1.1 for uses that require payment; the license field is GitHub's null value, so no SPDX id is recorded. The running-locally guide says qualifying customers can use the Community Edition without charge, even in production. The README names Solr for search and Quartz for scheduling; these are not recorded as fields. The Heat Clinic starter starts on an embedded HSQL database, which the guide calls demonstration-only. The Java 11 and Maven requirement is from the running-locally guide for the Heat Clinic starter. The Microservices Edition's headless commerce APIs are named in the README but belong to a paid edition, and the recorded REST API is the one the Community Edition api project holds. The Broadleaf comparison pages on the homepage name each platform as a counterpart and are recorded as alternativeTo; the custom-build page is not a software. The homepage at www.broadleafcommerce.com redirects to the https address, which is recorded. The Java 11 requirement stated on the running-locally page belongs to the 6.2 documentation, so runtimeMin is not recorded. The homepage footer has a monthly newsletter sign-up form with no link, and no X account link, so neither newsletter nor x is recorded. The Enterprise Edition covers Multi-Tenant use cases per the README, and the Community Edition lists none. LDAP for admin users is a documented Spring Security setup for the admin application.
