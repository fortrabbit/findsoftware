notes: >
  Accepted: the project's own site (nearform.com, reached from the http commerce.nearform.com link in the CSV and in the npm and README links, which redirect to the https address) describes the library as React components for charting and data visualization, and the README and install docs give npm and an ESM CDN route. The repository is a monorepo: the umbrella package victory is the one the README install section names; the many victory-* packages and the legacy victory-native are not recorded. The README says the legacy victory-native package is no longer developed in this repository and points to Victory Native XL, a separate project; the registry figures for victory-native are not recorded. Requirements: as of victory@38.0.0 Victory requires React 18.0.0 or above, and for React 16 or 17 the README names Victory 37; React is the binding and no runtimeMin is recorded because the requirement is a peer dependency, not a Node or runtime version. The README maintenance statement says Active, and the repository is not archived. The LICENSE.txt copyright lines name Nearform (2015-2026) and Alexey Svetliakov (2016-2020); the maintainer follows the first. The npm package names Formidable as its organization and the banner calls it Formidable; the footer of the site says Copyright 2013-2026 Nearform. No hqCountry is stated on the pages read. The repository's default branch is main; the release list runs from v0.1.0 (2015-12-18) to v38.1.0 (2026-11-12). The npm first upload is 0.0.1 on 2015-07-02, which sets firstRelease. The ecosyste.ms counts are for the npm package victory. The site footer and the Using Victory in the Browser page do not give a runsAs statement, so runsAs is left out; the SSR page says the components must be rendered client side in frameworks with Server Components, which is not a claim that the library runs only in the browser.
