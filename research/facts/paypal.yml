notes: >
  Hosted-service record for PayPal's developer platform at developer.paypal.com, which the CSV row names as the homepage. The GitHub repository paypal/paypal-js is the JavaScript SDK for the service, not the service's own source, so its license, stars and the npm figure for @paypal/paypal-js (471.9k a week in the CSV row) are not recorded per the hosted-service rule. The developer site lists the JavaScript SDK, a React SDK, the REST API, server SDKs, codes, webhook events, and iOS and Android SDKs; the REST API authenticates with OAuth 2.0 access tokens, and the Orders v2 API page was read. The developer footer's Discord link is the relative path /discord, which redirects to discord.gg/sJ2G6DyvSK; the redirect target is recorded as the value. The footer also lists YouTube (youtube.com/@paypaldev), LinkedIn (linkedin.com/company/paypaldev), GitHub (github.com/paypal) and Postman (postman.com/paypal), and a Developer Community sign-up link; these are not recorded as fields. The user agreement at paypal.com applies to U.S. PayPal accounts only, and the Developer Agreement names PayPal, Inc. in the United States; the parent is taken from the user agreement's definition of PayPal. The Developer Agreement lists a contracting entity per domicile in its section 17.1, and the United States entry is the one recorded. The footer of the developer site names the Developer Agreement, the Privacy Policy and the Terms of Service. The sandbox guide states that the sandbox has the same API feature set as the live environment; no prices are recorded. The business pricing page and the developer pages read state no SSO, user role or self-host option, so those fields are absent. No compliance statement was quoted, so none is recorded.
