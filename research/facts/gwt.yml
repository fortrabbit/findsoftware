notes: >
  The license is stated twice. The versions page says "GWT is licensed under the Apache 2.0 open source license (since version 1.3)" and the homepage footer names the Creative Commons Attribution 3.0 License, which covers the site's documentation rather than the software; both are recorded as their sources word them. The GitHub repository reports no license (license null). The getting-started page asks for "Java SDK version 1.8 or later" for applications, while the README asks for Java 17 to build GWT itself; no runtimeMin is recorded because the two statements are about different things. The Gitter chat link (https://gitter.im/gwtproject/gwt) on the homepage and in the README, and the Google Group, are not recorded because the field list has no field for them. The getting-started page still documents webAppCreator, which the same page marks as deprecated since 2.11.0; the install method is recorded as the SDK download only. The maintainer is the GWT Open Source Project as its terms page names it; the terms page says Google is a member and operates the website, and no legal form is given. The LICENSE file on the default branch returns 404, so the license quote comes from the versions page.
