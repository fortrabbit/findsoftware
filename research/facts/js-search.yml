notes: >
  The GitHub repository has no releases; its tags run to 2.0.1, the same version the npm package js-search publishes as latest, uploaded 2023-05-12. The repository's last push was also 2023-05-12. The README says the project began as a lightweight implementation of Lunr JS and has since expanded; no basedOn is recorded because the README names Lunr as an origin, not as software the project builds on, and reviewers decide whether that is a basedOn statement. The README calls the library client-side; runsAs browser rests on that wording alone, so a reviewer should confirm it. The README points to js-worker-search as a web-worker alternative, which is not a successor statement. The project's pages state no end of development. The last release is more than three years old; the import moves the record to stub when four years pass without a release, on or after 2027-05-12. The README lists tokenizers, stemming through a third-party stemmer, stop-word filtering, TF-IDF ranking and index strategies for prefix, substring and exact-word matching, and says it is ES5 compatible and needs no jQuery.
