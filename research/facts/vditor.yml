notes: >
  Accepted as a browser-side Markdown editor library. The English README (README_en_US.md) is cited for the quotes; the default README.md is in Chinese and carries the same facts, and it is cited for the forum sentence only. The homepage b3log.org/vditor answers 200 over https and serves the same product. The repository is TypeScript; the README says the editor is implemented in TypeScript and supports native JavaScript and frameworks such as Vue, React, Angular and Svelte, which is a list of supported frameworks, not a basedOn statement, so no basedOn is written. The maintainer follows the LICENSE copyright line, "B3log 开源", an open source community at b3log.org; the npm author field names the account Vanessa, which owns the GitHub repository. The latest stable release is v4.0.1 (2026-10-18); the newest prerelease is v4.0.2-alpha.9 (2026-11-13), newer than the stable release, so it is recorded as latestPrereleaseDate. The npm package's alpha dist-tag points to that prerelease while latest is 4.0.1. The npm package the install section names is vditor; the GitHub stars and contributors are for the repository. The HTML script section loads its files from unpkg.com, and the README's sentence about that section is the script tag route's quote, so no separate cdn route is recorded. The README names a Node.js LTS install only for developers building from source, which is no runtime for the library, so no runtime is recorded. The docs link is the homepage nav link labeled API, which opens the options article on ld246.com. Stars and dependency counts were read on 2026-11-17.
