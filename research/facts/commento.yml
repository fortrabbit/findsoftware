notes: >
  The project's own site no longer answers: commento.io returns 404 for every path tried on 2026-11-03 (/, /pricing, /terms, /privacy, /legal, /about, /self-hosting), and docs.commento.io returns 404 for /, /installation/ and /installation/self-hosting/on-your-server/. The README names both as homepage and documentation, so no homepage is recorded and the status is stub with the doubt stated here: a live commento.io or docs page would settle whether the hosted offering and the install guide still exist. The repository ships a Dockerfile, docker-compose.yml and Makefile, and its GitLab wiki is empty. The README says "the hosted cloud version is not offered free of cost" and links commento.io; the site is gone, so no hostedOffering is recorded. The README also names single sign-on and OAuth login as features and links a #commento channel on Freenode; none is recorded as a field. The database comes from the docker-compose connection string, which is the only place the repository names it. Stars are on GitLab (779 on 2026-11-03) and no field here takes them. The GitLab API carries no archived flag in its response. The newest commit on master is dated 2021-02-28. The npm package named commento is an unrelated ISC package and is not recorded. Commento++ names this repository as its upstream, see commentoplusplus. The software is not recorded as basedOn or with a runtime because the read pages state no runtime; the Dockerfile builds the API with Go. Coined and not recorded as fields: a privacy-focused positioning and the free-software statement in the README (notes only).
