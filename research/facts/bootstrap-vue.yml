notes: >
  The default branch README and the repository description read "MOVED to https://github.com/bootstrap-vue-next/bootstrap-vue-next", and the docs page bootstrap-vue.org/vue3 recommends migrating to BootstrapVueNext, "a complete rewrite" for the newer Bootstrap and Vue generation. The repository is not archived and the npm package is not deprecated (checked 2026-10-26), but the default branch README now holds only that pointer and the docs site recommends migrating, so the status is discontinued and the README line is the citation. The BootstrapVueNext record carries the successor link. The master branch README, which holds the project description, is the older text; the highest stable GitHub release is v2.22.0 (2022-04-17) and npm latest 2.23.1 (2022-10-26) is newer, so the release date comes from npm; both are major 2. The npm package was created 2016-10-05, which sets firstRelease. The maintainer is recorded as the LICENSE copyright line words it; no legal form is stated. The OpenCollective sponsor and backer links are not recorded as a paid edition. The docs describe a Nuxt module bundled in the package (bootstrap-vue/nuxt) and a compatibility path for running under the migration build of Vue 3. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header.
