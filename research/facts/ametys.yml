notes: >
  The candidate row says "no versioned release found" and the boundary question is whether the software can be installed. The Bitbucket forge at code.ametys.org holds the project's source in the public project AMETYS, repository cms, which anonymous Git access clones; the repository holds 411 tags, the stable highest is 4.10.2 (2026-10-01), and 4.11.0M1 (2026-10-08) is a milestone, recorded as latestPrereleaseDate. The earliest tag is 3.0.0M2 (2009-10-06), so firstRelease is 2009. The repository's raw files need a login, so the tag source files are not fetched as quotes; the Apache-2.0 license is taken from the documentation's statement. The build file at the 4.10.2 tag carries the header "Copyright 2010 Anyware Services" and the Apache license; this name is not on the project's pages read, so maintainer is recorded as the name the documentation uses for the platform ("Ametys"). The GitHub organization Ametys holds one repository, Ametys/runtime, which is a CSS repository from 2016 and not this CMS; the jelastic-jps/ametys repository is a third-party deployment package and is not used. The homepage describes the software as available in SaaS mode or on-premise deployment, recorded as hostedOffering with no price. No legal form is stated on the pages read, so maintainerType is left to the import. The Linux installation guide documents Tomcat 9 and the database connectors, and the prerequisites page names Java 17 for version 4.6 and later. The repository has no README at the root that states a project description; the description is taken from the homepage. The documentation's Tomcat and database statements describe v4; no statement covers v3 which is not the latest release. The GitHub API has no record of this project, so no GitHub figures are recorded. The docs mention a JCR repository, but no page read states where content is stored, so contentStore is not recorded. The homepage footer also links Facebook and YouTube pages, which have no field. The homepage carries a newsletter sign-up form ("Abonnez vous à notre newsletter") with no link to a separate page, so newsletter is recorded here only. Templates are written as XSL files (template.xsl) that turn the CMS XML into HTML.
