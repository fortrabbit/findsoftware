notes: >
  The npm figure is the sigma package the install route names (npm install sigma graphology); the period is 2026-11-01 to 2026-11-07, the sum of the daily counts from the npm range API. The repository is a monorepo (packages/ holds the companion packages such as @sigma/layer-webgl, and the release tags read sigma@<version>), so the stars and the contributor count belong to the monorepo, and the release line is the sigma package's. The stable line is 4.x: sigma@4.0.6 is the highest stable GitHub release (2026-11-10) and the npm latest; the 4.0.0 beta and alpha tags (2026-04 to 2026-10) are older than that release, so no latestPrereleaseDate is recorded. The oldest tag v1.0.0 is dated 2014-01-30 (committed date of the tagged commit); the npm upload 1.0.2 is 2014-04-03, and both fall in 2014. The README says the library is "built on top of graphology" and the quickstart says "Sigma.js requires graphology as its graph data structure": graphology is a separate data-structure package with no record, so no basedOn is recorded. The homepage names WebGL as the rendering technology; the rendering target is a coined kind kept here, not a field. The homepage's Stack Overflow tag link is not the project's forum. The LICENSE copyright line names three people and no legal entity, so the maintainer is recorded as the line names them. The homepage says the project "is published by Sciences Po médialab and OuestWare" and the README names OuestWare and Sciences Po médialab as its developers; neither page gives a country, so hqCountry is absent. The HTTP Archive technologies file lists no sigma entry, so httpArchiveSites is absent. The quickstart page's docs link is the /docs/ address, which redirects to /get-started/quickstart/; the redirect target is recorded. The framework-integration page says sigma has no dependency on any UI framework and names react-sigma as the official React route, so no basedOn is recorded. The README says that since v4 the development includes help from LLMs for drafting mechanical code, with architecture, API design and core logic human-authored.
