notes: >
  The repository is Apache-2.0 on GitHub; the homepage says "Apache 2.0 Licensed" and is the same license, so no second entry. The homepage footer copyright names Authelia, and the GitHub organization is the maintainer where no legal entity is named. The GitHub organization profile gives Australia as a location; no page names a headquarters, so hqCountry is unknown. The homepage describes the product as a companion to common reverse proxies, and the Proxies section of the docs lists Caddy, Envoy, HAProxy, NGINX and SWAG; these are integrations and not recorded as fields. The docs list Active Directory, FreeIPA, GLAuth, LLDAP and RFC2307bis as LDAP backends; the homepage's LDAP password reset line is the only LDAP statement quoted, so no ldap protocol is recorded. Authorization policies control access by users and groups; no userRoles value is recorded. The repository's contributor count is the value of the last page at per_page 1, counted without anon. The Docker Hub figure is for docker.io/authelia/authelia, the image the Docker Compose sample uses. The firstRelease year is the committer date of tag v1.0.1, the oldest tag, which predates the GitHub releases that start in 2019. The bare-metal page marks the Nix and FreeBSD packages as third-party, and the Nix channel as unstable. The newest prerelease (v4.0.0-alpha1, 2020) is older than the latest release, so no latestPrereleaseDate. The web interface is written in TypeScript and React, per the homepage's "Written in Go and React" and the repository's language split.
