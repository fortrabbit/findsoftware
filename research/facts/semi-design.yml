notes: >
  Not declared ended: the repository is not archived and the docs describe the project as maintained. GitHub reports the license as NOASSERTION; the LICENSE file and the npm license field both say MIT, so both are recorded. The docs name a React 19 variant, @douyinfe/semi-ui-19, which is a sibling package and not used for the npm figure. GitHub's newest release object is v2.88.2 (2025-11-18), while the npm latest is 2.104.0 (2026-10-09) and tags continue past v2.88.2; latestReleaseDate follows the registry, the currentMajor is 2 on both. The docs say the project is maintained by the Douyin front-end team and the LICENSE says DouyinFE; the maintainer field follows the LICENSE copyright line. No page names ByteDance as the owner, so parent and hqCountry are not recorded. The i18n fact is the homepage's statement on multiple languages and time zones, quoted in Chinese. The Quick Start page says React 16, 17, 18 and 19 are supported, with @douyinfe/semi-ui for React below 19. The getting-started page names a Figma Variant UI Kit and the homepage describes themes built on design tokens, both stated by the project and not recorded as fields.
