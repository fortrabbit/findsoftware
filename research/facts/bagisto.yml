notes: >
  The download page says the platform "is free and always will be" and promotes a hosted store "from $25/Month" with a Deploy on Cloud option, plus a multi-tenant SaaS offering. The price is a hosting starting point with no stated scope, so it is not recorded as a paid edition or a field, and status stays accepted. The download page lists PHP 8.3 or higher and Node 18.12.0; the 2.5.0 package requires php ^8.4 on Packagist, so runtimeMin uses the registry value. The download page names no license; the MIT license comes from the GitHub API and the README. The README also lists headless storefronts with Next.js as a use case, but no headless API documentation was read, so headlessApi stays unknown. The Packagist total downloads figure is recorded with its total and monthly periods as the registry states them. The fields facebook, linkedin and youtube are coined here because the starter list has no social field for them; the same applies to the Angular record's youtube.
