notes: >
  Hosted-service record: the product is a hosted control panel for servers the user provisions at Vultr, DigitalOcean, AWS, UpCloud, Linode, Hetzner or a custom provider, and it deploys apps (Nuxt, Next, AdonisJS, Laravel, Strapi, Directus, WordPress, Node.js, PHP, static HTML) to them. The homepage lists these providers and frameworks; the docs at docs.cleavr.io describe the flow. Criterion 2 is waived for a hosted service, and no repository is recorded: the platform source is not published. The GitHub organization cleavr holds setup scripts and helpers (cleavr-setup-* for Nuxt, Laravel, PHP, Adonis and Node, cleavr-landing-pages, quick-scripts, docs-template) and an inertiajs-adonisjs fork; those are not the product and their license, stars and dates are not recorded, per the hosted-service rule. The maintainer is Vistafari LLC, named in the terms and the privacy notice as the owner of Cleavr. The terms say the services are governed by the laws of the State of Massachusetts; that is a governing-law clause, not a headquarters statement, so hqCountry is not recorded. The privacy notice says personal data is "primarily retained within the European Union (Finland and Germany)" and gives no other data region. The pricing page offers a free trial and paid plans (Pro, Business), recorded as the pricing link only, with no prices. Team members are added on paid accounts and access is granted per team and per resource (docs: Manage Users, Manage Resources); no role names are stated, so userRoles is not recorded. The API is available on an active trial or a Business subscription, and the pages state no rate limit, so apiLimits is not recorded. The privacy notice says the owners use a self-hosted Plausible Analytics instance for their own site statistics; that is not a selfHostOption for the product. The homepage links an X account (twitter.com/thecleavr) and a YouTube channel; the YouTube channel has no field. The docs link to a Headway release-notes page, which is not a primary release source, so no release date is recorded. No founding year appears on the pages read.
