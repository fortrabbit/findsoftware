notes: >
  Hosted only; criterion 2 is waived. The platform runs on Google Cloud Platform (App Engine and Cloud Run) and uses Fastly for its cloud CDN, per the security and hosting docs; no region is stated. The GitHub organization zesty-io holds the design system, GraphQL starter and SDK repositories, and the npm SDK @zesty-io/sdk (191 a week) is an SDK figure, kept here and not in the record. Every content item has a paired JSON endpoint, and the Instance Content API is open JSON; GraphQL endpoints are turned on in Manager UI > Settings > Developer; the Instances REST API is authenticated; custom JSON endpoints are built in the code editor. Webhooks (with valid URLs and verification secrets) are documented; webhooks are a coined kind and stay in notes. Microsoft Entra sign-in uses OIDC on the common tenant; the Okta guide describes IdP-initiated OIDC. Pricing lists Single-sign on (SSO) for the Enterprise plan. Pricing shows a free Community plan with user and API call limits and paid Start Up, Business and Enterprise plans; no prices are recorded. The docs say "Zesty.io supports over 160 languages" for editing content; the Business plan lists 15 languages and Start Up 2, which are plan limits. The Twitter and Facebook footer links appear only on a page that answers 404, so no social fields are recorded. The about page says the company has 10 years in business (2025) and does not state a founding year.
