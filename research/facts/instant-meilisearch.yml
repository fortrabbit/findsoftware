notes: >
  A client package in the meilisearch-js-plugins monorepo, not a Meilisearch server: it needs a Meilisearch instance (the README sends readers to the Meilisearch getting-started page) and renders its UI through InstantSearch.js, which the README says the reader installs separately. The repository figures (stars, contributors) cover the whole monorepo, which holds other packages. The npm figure counts the install from the registry, so it includes installs by build tools that fetch the package; the README names it as the install. No homepage: the monorepo has no site of its own, and the Meilisearch website is the Meilisearch project's, not this package's. The README's Meilisearch Cloud link carries affiliate-style campaign parameters and is not recorded. The README states compatibility with one major release each of InstantSearch.js and Meilisearch; those are compatibility statements, not recorded as facts. The README also marks several InstantSearch widgets as incompatible because Meilisearch lacks the parameters or features they use. The engines field of the latest version requires Node 20.19 or 22.12 or later, recorded as Node 20. The package's first npm upload was 2020-07-29 (npm created date); the GitHub repository was created 2020-07-22. The README calls the library "the search client that you should use to make Meilisearch work with InstantSearch" and says the project reuses the InstantSearch library, so basedOn names both records.
