notes: "The project moved its source to Codeberg: the homepage names Codeberg as the source location and the GitHub repository description reads NOW MANAGED ON CODEBERG. Both repository entries are kept; the GitHub star and contributor figures are the GitHub mirror's, and Codeberg shows its own counts (292 stars when read). The contributor count includes anonymous contributors. The installation page says BookStack does not support shared PHP hosting. The Ubuntu install scripts are for a fresh OS only. The homepage's Support Plans page was not read, so pricingPage stays out."
