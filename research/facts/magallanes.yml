notes: >
  Stub candidate under the four-year rule: the latest stable release is 5.0.0 (2022-04-15), more than four years before the check, so the import moves the record to stub on its own; status stays accepted here as the skill says. The repository is not archived and was pushed 2022-09-05; Packagist reports no abandoned flag. The homepage is served at www.magephp.com after a redirect from magephp.com. The docs are on the homepage itself: Overview, Installation, Configuration, SSH, Tar, Rsync, Workflow, Built In Tasks and Cookbook sections. The README calls it a deployment tool for PHP applications and points to the homepage for documentation. The deploy strategies are Tar and Rsync over SSH: the homepage says the strategies are inferred from configuration (Releases enabled or not), and the hosts are reached by passwordless SSH keys. The homepage says "Just like typing bin/mage deploy production" and the run is from a terminal, which is the local statement. The Packagist first version is 1.0.0; the GitHub oldest release v1.0.0 is dated 2013-12-18, which gives firstRelease. The maintainer is named in the LICENSE and composer.json authors; The GitHub location of the owner is Montevideo, Uruguay, and the company field names a company; neither is a legal imprint, so hqCountry is not recorded. The homepage x link is a nav href with no visible text, so no quote is recorded. The homepage still names version 3 and 4 as maintained or previous; no successor is stated, so successorOf is not recorded. The Packagist monthly figure is 8240; only the total is recorded. The homepage says "All configuration is handled by one single YAML file in the root of the project: .mage.yml", lists the built-in tasks as Deploy, Git, Composer, Symfony, File System, Execute and Sleep, and has Custom Tasks and Cookbook sections. The homepage says that enabling releases gives rollback, with the number of releases kept set per environment. Its warning says that a global Composer install cannot use custom tasks, because the app autoloader is not used.
