notes: >
  No homepage: the GitHub repository has an empty homepage field, and the crates.io homepage points at the repository. The README links a demo at konrad.website/liveboat-github-runner, which is the maintainer's demo output and not the project's own site, so it is not recorded as homepage. The README gives no minimum Rust version in prose; the badge reads "rustc 1.84.0" and the crate's Cargo.toml sets edition 2021 with no rust-version, so runtimeMin is not recorded. The crates.io download figure is the crate's total downloads, not a monthly count; the crate's last 90 days figure is not in the same field and is not recorded. The README lists the JSON API and template system as features; the JSON endpoints are file-based GET paths on the generated site, so no headlessApi is recorded. The README describes templates that the build fills to write the pages, and the JSON API files sit beside the pages in the build directory. The README mentions "Running on every Newsboat update" as a trigger, which is covered by runsAs local and scheduled. The docker directory README states the image runs nginx hosting the site on port 8080 with a feed rebuild every 15 minutes; that is a self-hosting option and not recorded as runsAs. The oldest GitHub release is v0.9.0 (2024-12-16), also 2024. The categories value rss from the CSV has no dictionary entry and is left out. The templating value comes from the template reference (templates/README.md), where the line "index.hbs <---- Handlebars HTML file" cannot be quoted by the checker because of its angle brackets.
