notes: "Stub: the doubt is whether Pigment CSS is paused or has ended. The maintainers' status discussion (github.com/mui/pigment-css/discussions/424, dated 2026-06-08) says \"So we pause work on Pigment CSS\" and that the team does not \"have a lot of bandwidth for a reset of this project\"; the MUI blog post mui.com/blog/2026-and-beyond lists Pigment CSS under \"Projects currently on hold or in limited maintenace\" and says \"development is paused\"; the GitHub repository description reads \"Alpha phase, currently, on hold\". The repository is not archived, the npm package is not deprecated, and no page says the project has ended, so the record is not discontinued. A statement from the maintainers that the project is ended or resumed would settle it. The project has no website of its own: the repository's homepage field points to the status discussion, so no homepage is recorded and the README is the documentation. The README gives the install as \"Start with Next.js\" and \"Start with Vite\" through the plugins @pigment-css/nextjs-plugin and @pigment-css/vite-plugin, next to @pigment-css/react. The README says Pigment CSS is built on top of WyW-in-JS, which has no record in the dataset, and that it addresses \"the needs of the modern React developer\"; no basedOn is recorded. It also says components made with its styled can be used with React Server Components by default, and that the theme object is used at build time. The engines field of @pigment-css/react names node >=14.0.0, which is a build requirement, so no runtime is recorded. The npm weekly figure is the sum of the daily counts for the period in the value. The license is MIT in the LICENSE file (copyright \"Material-UI SAS\", 2023) and in the repository API; the maintainer is taken from the mui.com legal page. The npm author is \"MUI Team\". The README describes the tool as successor to Emotion and styled-components; no styled-components record exists in the dataset, so only emotion is recorded."
