notes: >
  The project's own site is a company marketing site for Open Social B.V., which sells a Cloud Platform and other products; those hosted products are not recorded as editions, and paidEdition is not recorded. The privacy policy at https://www.getopensocial.com/privacy-policy names Open Social B.V. as the company processing personal data, and the about page gives Amsterdam, The Netherlands as the base; no page gives a legal notice or imprint, so the maintainer comes from the privacy policy. The install docs name goalgorilla/social_template, a composer template that only pulls the profile in and has a far lower download count than the profile itself; the registry figures come from goalgorilla/open_social, the install profile the template installs, which the repository README describes as the install profile for the Open Social distribution. The license is stated two ways: the repository detects GPL-2.0 from LICENSE.txt, and composer.json states GPL-2.0-or-later. The drupal.org installing page returned 404, so no database requirement is recorded. The current major is taken from the highest stable Packagist version; the repository has no GitHub releases, only tags. The repository was created in 2016 and the earliest Packagist version dates to August 2016.
