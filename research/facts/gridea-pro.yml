notes: >
  The homepage www.gridea.pro answers 200 and its JSON-LD names the author as "Gridea Pro Contributors" with a GPL license URL; no company or legal name is stated, so the maintainer is recorded as the project states it. The README-en names Wails (Go + Vue 3) as the build stack and Gridea as the project it rewrites; basedOn records Wails and not Vue, and Vue is named in the same sentence. The chinese README at README.md is the same text in Chinese and is not quoted. The original Gridea is a separate record (gridea) and is named here as the predecessor, not a fork. The README-en documents a standalone gridea-pro-mcp binary, shipped beside the GUI client, that provides an MCP server for managing the blog; no field holds it. The README-en names these deploy targets: GitHub Pages, Vercel, Netlify, Coding, and SFTP or FTP; the docs site also lists Gitee Pages and a custom server. Posts are written in Markdown. The app interface is offered in 11 languages, which is the app and not the generated site, so i18n is left out. Migrating from Gridea works by pointing the Site Directory setting at the existing Gridea data folder. The "static" rendering mode rests on the README's "static blog" wording and the one-click deploy to hosts, the page does not say the output is static files in those words. No paid edition, pricing or hosted service is stated. The WeChat group is the only community channel the README names, and no field records it. Build from source needs Go 1.22+ and Node.js 18+; runtimeMin is left out because it is a build requirement, not what the installed app needs. Stars were 467 on the CSV row and 468 on the day of reading.
