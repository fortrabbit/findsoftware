notes: >
  Highest stable GitHub release is v3.3.15 (2026-07-10), major 3; npm latest is 3.3.18 (2026-08-30), same major, and latestReleaseDate uses the npm date for that version. The homepage lists the server frameworks it works with (express, fastify, hono, next.js and others) and the databases it works with; the databases are recorded from the README, the server frameworks are not recorded as a field. The README lists adapters for Express, Fastify, Next.js, Nuxt, SvelteKit, SolidStart, Nest, Koa, Hapi and Hono. The quickstart says Remult is initialized on the server side as request-handling middleware. The README says validation is defined once and runs on the backend and the frontend, and authorization is code-based. The npm package declares no engines field, so runtime and runtimeMin stay unknown. The install command for a new project is npm init remult@latest, from the docs page. The README says GraphQL is an optional endpoint next to the REST API. firstRelease is the npm created time of the remult package. The homepage also offers a "Try in Browser" option, which is not recorded as a runtime.
