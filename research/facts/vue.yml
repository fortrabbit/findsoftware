notes: >
  Highest stable GitHub release is v3.5.44 (2026-10-13), which the npm latest tag also names; the newest prerelease is v3.6.0-rc.12 (2026-10-16), which is newer than the latest release, so it is recorded as latestPrereleaseDate. The repository is vuejs/core and the npm package vue is the core package named by the install docs. The FAQ states that Vue is an independent, community-driven project created by Evan You in 2014, and that development is funded by sponsorships; the creation year is not the firstRelease year, which is the first npm publish (2013-12-07). The quick-start page asks for Node.js ^22.18.0 or >=24.12.0 for the scaffolding and build tooling; that describes the development setup and is not a runtimeMin for the library, which has no engines field on npm. The endoflife.date entry marks Vue 2 and earlier cycles separately; the end of Vue 2 is not an end signal for the Vue 3 record. The quick-start page presents the Vite-based create-vue scaffolder as the recommended setup and the CDN script tag as the route with no build step.
