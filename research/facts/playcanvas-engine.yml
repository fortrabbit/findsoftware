notes: >
  The docs say "Engine apps run in the browser" and the Node.js guide says "The PlayCanvas Engine fully supports running in Node.js"; both places are named, so runtime node is recorded and runsAs is left out, per the library rule. The homepage says the platform is "open sourced on GitHub under the MIT license", and the engine README says "released under the MIT license"; the LICENSE file carries "Copyright (c) 2011-2026 PlayCanvas Ltd." The legal name and the country come from the terms page, which names "PlayCanvas Ltd registered in England and Wales" with a registered office in London, United Kingdom. The npm package the install docs name is playcanvas (2.24.1, matching the GitHub release v2.24.1); the packages @playcanvas/react, @playcanvas/web-components and create-playcanvas are separate packages named in the README and not recorded as the engine. The PlayCanvas Editor (the playcanvas/editor repository, a browser-based visual editor) and SuperSplat are products next to the engine and are not part of this record. The README's create-playcanvas scaffold (npm create playcanvas@latest) is an npm route to the same package and is not a second installMethod. The oldest GitHub release is v0.173.0 (2015-08-25); the tag 0.165.8 is a commit dated 2015-04-17, so firstRelease is 2015 either way. The first npm upload of playcanvas is 1.0.0 (2017-08-08). The README links Discord, Reddit, X and the forum; the Reddit link is a README badge and the subreddit value is recorded from it. The CSV lastRelease (2026-10-15) predates v2.24.1 (2026-11-12). The developer docs footer links X, LinkedIn (https://www.linkedin.com/company/playcanvas, not a field), Facebook, YouTube, Discord, the forum and Reddit. The Editor Plans page says "PlayCanvas is free and open source" and that its plans unlock additional Editor features; the hosted Editor is a separate product, so it is a hostedOffering and not a paidEdition. The Getting Started page has a "Migrating from Unity" guide that maps Unity concepts to PlayCanvas ones; it is a concept map, not an import route, and unity has no record.
