notes: >
  The repository's default branch is develop; the stable release v18.1.0 is the newest GitHub release, and the release candidates of 18.1.0 (October 2026) are older than it, so no latest prerelease date is recorded. The first git tag is 0.0.1 of October 2015, from the commit date; the package was published as ng2-translate before the rename, first uploaded to npm on 2015-10-11 from ocombe/ng2-translate, the same year; the first @ngx-translate/core upload (February 2017) is later. The LICENSE file on develop carries two copyright lines, Olivier Combe (2018) and Andreas Löw / CodeAndWeb GmbH (2024); the maintainer is recorded as the company named in the imprint, which is the legal name the terms page gives. The FAQ names the company as the owner of the library. hqCountry DE comes from the FAQ, which names Germany and the city Neu-Ulm; the imprint gives the street address without a country. The homepage says ngx-translate suits cases where Angular's built-in i18n system does not and calls it an alternative to it; Angular's built-in i18n is part of Angular, not a record of its own, so no alternativeTo. The FAQ also answers that the library is free, including for commercial use. The site and the README say the project supports only the current major version and that older versions are end-of-life; the project's own statement is that version 17 and earlier are unsupported, which is a support policy and not an end signal for the library. The README and the site point to a commercial support offer from HeroDevs for end-of-life versions, which is a third-party service, and to BabelEdit, a separate paid translation editor the site presents next to the library; neither is a paid edition of the library. The library runs in Angular applications in the browser and in server-side rendering; the SSR page is a recipe and no runsAs or runtime is recorded. The required Angular version is a peer requirement of the library, not a runtime. The install page names @ngx-translate/http-loader as an optional package that loads translation files from a server; it is a separate package of the same organization and not a record. The stars and contributors belong to the single-package repository.
