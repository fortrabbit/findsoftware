notes: >
  The homepage is the demo site the repository names; it is a JavaScript shell, so the homepage is cited from the GitHub API field and no quote is taken from it. The README says the component is "implemented with React.js and TypeScript" and uses a textarea, not a code editor; no sentence states where it runs, so runtime and runsAs are not recorded. The README has a Next.js section, which describes use in a framework and is no runtime statement. The LICENSE copyright line names "uiw", the GitHub organization, and the package.json of the core package names another author ("kenny wang"); the LICENSE line is followed. The npm package starts at 1.0.0 in 2019, the same year as the oldest GitHub release (v1.2.0). The stars and contributors belong to this single repository. The default branch README is a symlink to core/README.md, so the core file is the one cited. The register figure is the npm package the install line names, @uiw/react-md-editor, and its ecosyste.ms figure is last month's count.
