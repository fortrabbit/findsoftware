notes: >
  The ironframework.io site named by the CSV does not resolve (DNS lookup fails), and no page of the project names a homepage (the README, Cargo.toml and the GitHub repository homepage field are empty of it), so no homepage is recorded. The last commit on master is 2021-03-12 (merge of a site link update); the last release is 0.6.1 on crates.io, 2019-08-14, and the repository has tags but no GitHub releases. The import moves a record with no release in four years to stub on its own, so the status stays accepted here. The README says no plugins or middleware are bundled with Iron and names separate repositories for routing, mounting, static file serving and logging. The README names IRC channels (#rust-webdev, #iron, #rust on the Mozilla network) for help; no chat URL is recorded. The LICENSE copyright line reads "Copyright (c) 2014 Iron Core Team", which differs from the maintainer named in the README; both are stated by the project, and the reviewer should decide which maintainer statement the record shows. The major is 0 because the highest stable release is 0.6.1. crateDownloads is the crates.io total of 2841975; the 90-day figure (184090 recent_downloads) is not recorded. The docs.rs page for the iron crate is the documentation the README names; its meta description reads "The main crate for Iron.".
