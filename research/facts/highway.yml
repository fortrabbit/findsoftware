notes: >
  The README states "This repository is no longer maintained" and that v2.2.1 "will be the last one"; the repository is archived on GitHub. The README links the repository as github.com/Dogstudio/highway, which GitHub redirects to github.com/dept/highway, the repository the API reads. The project's Slack, which the README says "will remain available", is a community chat and is not recorded as forum. The npm package name is @dogstudio/highway; the unscoped npm package "highway" belongs to a different project and is not recorded. The npm figure is the 2026-11-01 to 2026-11-07 total (605); the candidates row's 351 per week is an older figure. The first GitHub release is v1.0.0 (2018-03-17) and the npm package was created 2018-03-15. The README's "0.0.x First release" line has no matching GitHub release object. The homepage footer says "Powered by Dogstudio" and the copyright line names Dogstudio; no legal entity or country is stated on the pages read. Highway is a browser library, and the README's browser list is compatibility, so no runsAs is recorded.
