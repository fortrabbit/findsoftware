notes: >
  The package has no GitHub release or tag; npm is the only release source. The npm versions run 0.0.1 (2020-05-25) to 0.5.1 (2020-10-30), so currentMajor is the 0 line of the npm latest version and latestReleaseDate is 2020-10-30. Under AGENTS.md criterion 4 a release older than four years moves the listing to stub on import; the status is kept accepted here because no end signal exists (the repository is not archived, the npm package is not deprecated, and no page states an end). The repository was pshihn/rough-notation before it moved to rough-stuff; the API figures are for rough-stuff/rough-notation. The README says "Rough Notation uses RoughJS", a runtime dependency on the roughjs record; a dependency is not basedOn, so no basedOn is recorded. The homepage and README name third-party wrappers for React, Svelte, Vue, Web Components and Angular; they are not recorded. The README gives a 3.83kb gzipped size and the homepage says 3.8kb: a coined bundle-size fact, kept here as notes only. The README's unpkg script loading (ES module and IIFE) appears only in code blocks and in sentences that name no route, so no CDN installMethod is recorded; a reviewer may decide that "Or load the ES module directly" names the CDN route. No sentence says where the library runs, so runsAs stays out. The README says annotating adds an SVG element as a sibling of the annotated element, which can cause trouble in a table. The homepage link to Twitter is the X fact; the homepage also links Open Collective (sponsorship, not a field) and the GitHub repository. Contributors count is the last page of the contributors endpoint at per_page=1.
