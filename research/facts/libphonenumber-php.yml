notes: >
  The README says the library is based on Google's libphonenumber, that it uses phone number metadata from Google's project, and that it tries to follow Google's version numbers, so the GitHub release 9.0.43 gives currentMajor 9 and the major is Google's line; the README also says jumps in major versions may hold no breaking change. Google's project is not a record in this dataset, so basedOn is left out. The README requires the PECL mbstring extension, which is a runtime requirement and is recorded in notes only. The lite package giggsey/libphonenumber-for-php-lite and the framework integrations the README lists (Symfony PhoneNumberBundle, Laravel Phone, TYPO3 Phone) are separate third-party or sibling packages and are not recorded. The README's "PHP versions 8.1 to 8.5 are currently supported" is the stated support window; the runtimeMin 8.1 comes from composer.json at the 9.0.43 tag, which requires "^8.1". The license file is the Apache 2.0 text with no copyright holder line, so the maintainer comes from the composer.json author name. firstRelease is 2013 from the oldest Packagist version 5.7 (2013-07-24), older than the first GitHub release (2013-08-13). The Packagist figure is the all-time total for the package the install docs name.
