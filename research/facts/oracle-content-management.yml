notes: >
  The product URL https://www.oracle.com/content-management/ answers 200 but redirects to https://www.oracle.com/cx/marketing/, an Oracle Fusion Marketing page ("Agentic Marketing for Enterprise Growth") that does not mention content management. The product's own docs at docs.oracle.com/en/cloud/paas/content-cloud are current, with pages for Headless CMS, APIs and SDKs, System Administration and Starter vs. Premium Edition, so the record is hosted-service rather than discontinued (wave 54 ruling); the docs landing is used as homepage because the product URL no longer shows the product, and a reviewer should confirm that choice. The Headless CMS page lists GraphQL only as a concept link title, so no graphql value is recorded. The Starter vs. Premium Edition page ("To take advantage of the full feature set and to increase the number of users and other items, upgrade to the Premium Edition") is a hosted plan tier and is not recorded as paidEdition; its Starter tier is described as "a free content service tier with a limited feature set". Roles, security and sign-in pages are named on the administration page but their URLs did not resolve from the link list, so sso and userRoles are unknown. The legal notice for the privacy page names Oracle America Inc. as a data privacy framework party; that is not recorded as the maintainer. No page gives a headquarters address with a country, so hqCountry is unknown. The docs menu also lists asset management, document collaboration and content capture sections, but no sentence names enterprise content management, so ecm is not recorded as a category. Pages on localization policies, multilingual sites and custom roles appear only as menu or topic titles with no sentence stating the feature, so i18n and userRoles stay unknown. The Oracle docs use the product name "Oracle Content Management (OCM)" in the groups table without a separate version or release history, so no release fields are recorded.
