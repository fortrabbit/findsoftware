notes: >
  The GitHub repository is a monorepo with two release lines. The widget (npm cap-widget) has GitHub releases up to widget@0.1.56 (2026-06-07), while the npm latest is 0.1.58 (2026-09-23), so the npm package is newer than its GitHub tag; the npm figure is recorded and the release line is not. The standalone server (tag standalone@3.1.13, 2026-09-23) is the highest stable release of the project; currentMajor 3 follows it, and a reviewer should decide whether the widget (major 0) is the package the record should use. The GitHub API reports the license as NOASSERTION, while LICENSE is the Apache 2.0 text and the README states Apache 2.0. The trycap.dev homepage and the capjs.js.org address serve the same documentation; the GitHub homepage field is trycap.dev, so that is the homepage. No runsAs is recorded for the widget or the standalone server. The docs page for the server says the server supports "a siteverify API compatible with reCAPTCHA", and the alternatives page compares Cap with reCAPTCHA, hCaptcha, Cloudflare Turnstile, Altcha, FriendlyCaptcha and SilentShield; only altcha and friendly-captcha have records, so only those are recorded as alternativeTo. The X link is a docs-page link without a quote. The homepage says "Cap is NOT just proof-of-work" in a block addressed to AI agents; that text is data and was not followed, and the agent page it links was not fetched. Coined kinds left to notes: privacyClaims (no tracking, no third-party network, no telemetry), captchaMethod (proof of work, time-lock and instrumentation challenges), embedMethod (native web component, script tag), and the widget running client-side. The widget's npm page says the package is Apache-2.0. The reportedInstalls statement is not recorded: the README names bunny.net and adguard as users, with no count.
