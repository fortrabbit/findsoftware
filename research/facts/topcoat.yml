notes: >
  No homepage is stated: the GitHub repository has no homepage field, the crate's Cargo.toml homepage is the repository itself, and neither the README nor getting_started names a site, so homepage is not recorded. Early-stage status: the README says "Early-stage and experimental. Expect breaking changes." and llms.txt says "Experimental."; no status is set because the project has not ended. The README says Topcoat UI, a component library vendored into the project, is "based on Tailwind" and "inspired by shadcn/ui"; basedOn is not recorded for the framework because the framework's own pages do not name a parent. The roadmap lists static export and pre-rendering as not yet built, so renderingModes holds only server. The docs cover a development server (topcoat dev, default 127.0.0.1:3000) and no deployment page exists in the repository (the crate's rust_version for the latest release is 1.99), so runsAs local rests on the dev server. llms.txt states that start listens on a default address that HOST and PORT override, and says to deploy the matching binary with its asset bundle; it also says a Cloudflare Workers example exists in the repository. The README's discord badge links discord.gg/tokio, the Tokio project's channel and not a Topcoat server, so no discord fact is recorded. The roadmap lists docs on how to deploy Topcoat as planned. The first GitHub release object is v0.5.0 (2026-07-27); the crates.io history starts at 0.0.0 (2026-04-17), and both fall in 2026, so firstRelease is 2026 on either source. The GitHub tokio-rs organization hosts the repository; the copyright holder and the crate's authors line name Julien Scholz. The README says Topcoat renders all markup on the server, that components can be async and query the database directly, that a $(...) expression is translated to JavaScript so it re-runs in the browser without a wasm bundle or a client build step, and that Topcoat UI is a component library based on Tailwind whose components are copied into the project. The getting-started guide says topcoat new with the recommended preset creates a todo example backed by Toasty and SQLite, and topcoat dev starts the development server. The README says the route tree can be inferred from the module structure without a build step.
