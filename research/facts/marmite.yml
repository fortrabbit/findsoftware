notes: >
  The crates.io crate marmite (crateDownloads) is the install docs' cargo package; crateDownloads is the all-time total from the crates.io API, not a period figure. The PyPI package marmite is named by the install docs too, but PyPI's JSON carries no download figure, so pypiDownloads is absent. The install docs name pip install marmite, and PyPI lists AGPL-3.0-or-later for it; the GitHub license is AGPL-3.0, recorded as license. The highest stable GitHub release is 0.4.2 and no prerelease exists, so currentMajor is 0. firstRelease comes from the oldest release, 0.1.4 (2024-10-20). The repository's homepage is https://marmite.blog/, served over https. The editor and the content management API exist only under the --serve development server, so they are recorded as adminUi and not as a headless API. livePreview is left unrecorded: the editor has a preview panel, but the pages do not state that it shows unsaved content on the site. The Marmite Playground at play.marmite.blog is a browser demo the project links from its README; the pages state no hosted service for publishing sites, so no hosted-service fields are recorded. The maintainer is recorded from the byline Bruno Rocha on the project's docs pages, since neither the LICENSE nor the site names a legal entity. adminUi is not recorded: the editor exists only under the --serve development server and is not an admin interface of the deployed site.
