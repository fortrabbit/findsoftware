notes: >
  The Packagist package maatwebsite/excel is the one the 4.x install page names, and its source repository is SpartnerNL/Laravel-Excel; the CSV's 177.2M figure is replaced by the Packagist total of 184658840 read on 2026-11-16. The default branch is 4.x; the highest stable release is 4.0.6, published 2026-10-23, so currentMajor is 4. The 3.1 line still has releases (3.1.70, 2026-08-13); the README's support table calls 3.1 "No active support, CVE only" and 4.0 "New features", so the supported lines are in notes, not fields. The 4.x requirements page names PHP ^8.3, Laravel ^12.0 or ^13.0 and PhpSpreadsheet ^5.3; the composer.json at 4.0.6 requires PHP ^8.3 and PhpSpreadsheet ^5.9, and only the PHP minimum is recorded as runtimeMin. The license is stated two ways and both are recorded: the docs license page and the LICENSE file say MIT, and the README and homepage say the package is "licensed as Postcardware", which asks users who run it in production to send a postcard from their hometown. The Postcardware entry is the project's own word for the courtesy; the import reads the MIT entry for licenseModel. The maintainer is Spartner, which the LICENSE copyright line names; the legal form "Spartner B.V." is from the spartner.software About page. The address for the postcard, Markt 2, 6231 LS Meerssen, The Netherlands, appears on the 4.x license page and the README, and the docs state it for Spartner. The README says the package was created in 2013 and that Spartner formerly traded as Maatwebsite; the Packagist package keeps the Maatwebsite vendor name. The candidates row's category spreadsheet-io is not in the import's categoryMap, so the record takes library, the closest mapped category, as the exceljs record does. The README lists exports of collections and queries to Excel or CSV files, chunked query exports, queued exports and imports, Blade views exported as HTML tables, and imports of workbooks into Eloquent models; these are notes, not fields. The README calls it a Laravel wrapper around PhpSpreadsheet, which reads and writes the files. The Nova integration is a separate product (SpartnerNL/Laravel-Nova-Excel) and is not recorded. Commercial support is offered on laravel-excel.com and is not a paid edition. The ecosyste.ms dependent counts are for the Packagist package maatwebsite/excel. firstRelease 2013 comes from the Packagist version v0.1.0 dated 2013-11-14; the GitHub repository was created in November 2013.
