notes: >
  The record is discontinued on the README's archive notice (raw README on the default branch 1.7, read 2026-10-23) and on the repository's archived flag. The archive notice is the stated end, so status is discontinued. The homepage voyager.devdojo.com answers 200 and still shows the software. The site and the README name the repository github.com/the-control-group/voyager; it redirects to github.com/thedevdojo/voyager, which is recorded. The docs installation page mentions MySQL only in a key-length error note, so databases is unknown. The Packagist package tcg/voyager is flagged abandoned on v1.8.0. Highest stable GitHub release is v1.8.0 (2024-09-24); the default branch 1.7 has no release of its own. The oldest GitHub release is v1.0.10 (2017-12-22), so firstRelease is 2017. Packagist total downloads are recorded; the monthly figure is 25563 on the same API, not recorded. The installation page on voyager-docs.devdojo.com still shows Laravel 5-era steps; the install method is taken from the README, which says Laravel 8 and newer. The README says Voyager is built with Vue and Bootstrap; no field in the starter list covers the front-end stack, so it is left out. The homepage links the maintainers' personal social accounts and a Slack invitation; neither is recorded, since the accounts belong to people and Slack has no field. The linked company site thecontrolgroup.com now shows a PeopleConnect page with no legal form for The Control Group, so the maintainer is recorded as the project states it. The composer.json at v1.8.0 requires php ^8.2|^8.3 and illuminate/support 11.*.
