notes: >
  The repository's default branch is master; GitHub lists releases up to v40.44.0 (2026-10-28), the highest stable release, so currentMajor is 40. The README's Compatibility section still says Python 3.8 and above; the PyPI metadata of the latest release states requires_python >=3.10, which is the recorded runtimeMin. firstRelease is 2010 from the oldest PyPI upload (0.0.2, 2010-12-23), older than the oldest git tag (v0.3.2, 2013). The LICENSE copyright line names Daniele Faraglia (2012), and the record follows it; GitHub owner joke2k is a user account. The README says Faker is heavily inspired by PHP Faker, Perl Faker and Ruby Faker; inspiration is not basedOn. The package was previously published as fake-factory, which its README says is deprecated, so the old name is named here only. factory_boy uses Faker through factory.Faker, which is a dependency of factory_boy, not a parent of Faker. The README also describes a pytest plugin with a faker fixture; not a field. The PyPI figure is for the Faker package, the one the install instruction names (pip install Faker). The pypistats figure is the last_month window read on 2026-11-08. The README asks that projects and their dependencies do not depend on the old fake-factory package.
