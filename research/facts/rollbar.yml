notes: >
  Hosted-service: the product is the SaaS, and Rollbar Lines, the Factory product, is installed on the customer's own systems by a Rollbar team, so it is not a public self-install (https://rollbar.com). The SDK repository rollbar/rollbar.js (MIT, 588 stars on 2026-11-03, npm rollbar 709,337 downloads for 2026-10-26 to 2026-11-01) is notes only, per the hosted rule; its npm latest is 4.2.0. The homepage lists free plans and a 14-day trial (https://rollbar.com/pricing); free tier and prices are not recorded. Compliance statements on the homepage ("SOC 2 and ISO 27001 certified") and the MCP server and Resolve agent are coined or product features and go to notes. The homepage's "Trusted by over 64,000 users" is a user count, not an install count, so reportedInstalls is unknown. Social links: GitHub organization https://github.com/rollbar and LinkedIn https://www.linkedin.com/company/rollbar/ are notes. The contracting party in the terms is Rollbar, Inc.; the legal address and country are not on the terms page, so hqCountry is unknown. The SSO pricing row is "Basic SSO via Google and GitHub" on lower tiers and SAML on designated plans; no protocol name is recorded for the basic row. Sessions and replays are product features; no field. The security page lists "SCIM - Users and Teams Provisioning" (recorded under sso); no page read states member roles, so userRoles is not recorded.
