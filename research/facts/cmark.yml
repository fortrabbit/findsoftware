notes: >
  The repository has no homepage of its own: the CommonMark spec site (spec.commonmark.org, commonmark.org) is the specification's site, and the README points to it only as the source of the spec, so no homepage is recorded. The GitHub license detection reads NOASSERTION; the README states BSD2 and the COPYING file carries the BSD-2-Clause text for the library. COPYING also holds, in separate sections, a permission text for the houdini files (from Vicent Marti's houdini), the buffer files (from GitHub, Inc. code) and the utf8 files (from utf8proc), none of which names its license, so that entry is worded as the file words it; the MIT License for normalize.py (from markdowntest) and CC-BY-SA 4.0 for the spec text in test/spec.txt are named in the file. The test software is under the same BSD text as the library. The COPYING copyright line names John MacFarlane; the README credits him with the original library and program, and no legal form is given, so the maintainer is recorded as named. The firstRelease year comes from the tag 0.6, committed 2014-10-27, the oldest tag; the first GitHub release is 0.17 on 2015-01-25. The version line 0.31 is in the 0 major; the latest release is 0.31.2 (2026-02-14). The README lists wrapper libraries for Go, Haskell, Ruby, Lua, Perl, Python, R, Scala and PHP; these are other projects and are not recorded. The README names the CommonMark forum (talk.commonmark.org, an http link in the README that answers over https) for questions, recorded as forum. The README also points to the JavaScript reference implementation commonmark.js, which has no record. No runtime is recorded: the README describes a C build with cmake or make, and the library is linked into the software that calls it. Prose sources: the README's first paragraphs give the C reference implementation, the libcmark library and program, the AST and the renderers, the no-dependency and cmake statements, and the wrapper list; the Security section gives the default scrubbing of raw HTML and of the javascript, vbscript, data and file schemes, with CMARK_OPT_UNSAFE to allow them and the sanitizer recommendation.
