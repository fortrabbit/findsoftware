notes: >
  The CSV homepage was plain http; https://babel.pocoo.org/ answers 200 after a redirect to /en/latest/, the docs build, which still reads "Babel 2.17.0 documentation" while the 2.18.0 release is the newest on GitHub and PyPI, so the homepage is recorded as https and the docs page is cited for the description quote. The docs introduction names two aspects of the library: tools to build and work with gettext message catalogs, and a Python interface to the CLDR (Common Locale Data Repository) for locale display names and localized number and date formatting. The docs installation page says Babel ships as a standard Python package with its dependencies, and that where the standard library zoneinfo module is missing, pytz must be installed for timezone support. The default branch is master, where pyproject.toml states requires-python >=3.9 for the unreleased line; the v2.18.0 tag's setup.py states python_requires='>=3.8', which is the runtimeMin, and PyPI's requires_python for 2.18.0 agrees. The docs license page defines two licenses: the Babel License (BSD-3-Clause) for the source code and documentation, and the Unicode License (v3) for the transformed CLDR data files in babel/locale-data; both are license entries. The LICENSE copyright line names the Babel Team, which is the recorded maintainer; setup.py names Armin Ronacher as author and Aarni Koskela as maintainer, and those names are not recorded as maintainer. The docs license page also says Babel includes a fork of tzlocal, originally CC0, and that releases before 2013 carry Edgewall Software's copyright. firstRelease 2007 is the "Version 0.8" entry in CHANGES.rst (first public release, June 20th 2007); the GitHub tags start at 1.0 (2013), and PyPI's first upload with files is 0.9.6 (2011). The README names a Gitter chat, which is not a forum or discord field, so no community link is recorded. docs/messages.rst names Jinja2 and Genshi templates only as files Babel extracts messages from, so templating is not recorded. The contributors count is the page number of the rel="last" link on the authenticated contributors endpoint with per_page=1 (179). The pypistats figure is last_month as read on 2026-11-16; the CSV's weekly figure is replaced by it. The repository has 36 tags; the GitHub release list has one prerelease (v2.5.2, 2018), older than the latest stable release, so no latestPrereleaseDate is recorded.
