notes: >
  Accepted under criterion 1 because S3 clients call S3Proxy as an API: the README says "S3Proxy implements the S3 API and proxies requests", and its backends are the S3 API's storage targets. The repository has no homepage on GitHub and no separate project site, so no homepage is recorded. The README's Support section names Stack Overflow (https://stackoverflow.com/questions/tagged/s3proxy) and GitHub issues, and offers commercial support by email; none is recorded as a field. The runsAs value is unknown: the README shows a start command and a Kubernetes example with health probes, but no page states that it runs as a server process. The README does not name a parent or library for the proxy layer; the configuration keys use the jclouds prefix, which is no basedOn statement. The README lists middlewares (bucket aliasing, eventual consistency modeling, latency, read-only and others) as built into the proxy; these are features, not separate records. The license is also stated in the LICENSE file as Apache License, Version 2.0, and the repository's license API field is Apache-2.0. The maintainer is named in the README copyright line and in pom.xml as Andrew Gaul; the GitHub account is gaul. The Maven Central artifact is org.gaul:s3proxy; its releases and first upload dates come from maven-metadata.xml (https://repo1.maven.org/maven2/org/gaul/s3proxy/maven-metadata.xml), not recorded here. The Docker image is andrewgaul/s3proxy, which the README links, and the Docker Hub pull count is for it. The README says Linux and Mac OS X users can run the executable jar and Windows users invoke java -jar, and lists embedding into Java applications as a use case. The Helm chart the README mentions is third-party and not recorded. The current major is from the highest stable GitHub release, s3proxy-4.1.1 (2026-09-10); the release list has no prerelease. Storage backends named in the README: aws-s3, azureblob, filesystem, google-cloud-storage, openstack-swift, sftp and transient.
