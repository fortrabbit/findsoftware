notes: >
  The README says Stenope runs in a Symfony environment, so basedOn is Symfony. The composer.json names two authors, Thomas Jarrand and Maxime Steinhausser; the LICENSE copyright line names only Thomas Jarrand, which is the maintainer recorded here. The latest tagged release is v0.9.0 (2024-04-04) while the repository was pushed on 2026-10-20 and has no archived flag; no end statement was found, so the status stays accepted. The CLI page states the build writes into a directory and the README says it dumps every page into a static HTML file, the basis for runsAs static. The Stenope Skeleton app is referenced in the README and not recorded. Templating comes from the Twig integration page in the docs folder.
