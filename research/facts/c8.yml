notes: >
  No homepage: the repository has no website and the npm homepage points to the README. The README's install block is a shell command (npm i c8 -g), which is not an installMethod sentence, so installMethod is left out. The README says "make sure you're running Node.js >= 12", which the manifest at v12.0.0 replaces with engines node "^20.19.0 || ^22.12.0 || >=23"; runtimeMin is taken from the manifest. The npm latest is 12.0.0, the same as the GitHub release of 2026-07-14, and a dist-tag experimental 7.0.0-alpha.0 is no release. The LICENSE.txt copyright line names only "Contributors", so no maintainer is recorded; the package.json author is Ben Coe. runsAs is left out: a CLI on a developer's machine is no runsAs statement without a page saying it is for development. The first npm upload 0.1.0 (2013-09-24) is older than the GitHub releases (from v5.0.0, 2019) and its tags (from v1.0.0). The package c8 is listed under the testing category; its install is a Node.js command-line tool.
