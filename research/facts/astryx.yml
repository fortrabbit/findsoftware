notes: >
  Monorepo (facebook/astryx); the install docs name @astryxdesign/core, the core package, so the npm figures come from it. The npm weekly figure is the sum of the daily downloads API for 2026-10-18 to 2026-10-24. A canary build on npm is no prerelease, so latestPrereleaseDate is not recorded. The homepage is served over http on the CSV row and redirects to https://astryx.atmeta.com, so the https address is recorded. The homepage and README both say the project is in beta ("Currently in Beta"); the status stays accepted because the criteria hold. The npm package named "astryx" is an unrelated placeholder at version 0.0.0 under another author and is not used. The first GitHub release is v0.1.1 (2026-06-26), the first npm upload @astryxdesign/core 0.0.0-bootstrap.0 on 2026-06-24, and the repository was created 2026-01-09, so firstRelease is 2026 in each case. The CLI documentation shows a Node.js minimum for the CLI tool (the doctor page names a Node 22 minimum), which is a dev-tool requirement and not a runtime of the library, so no runtime is recorded. The react-based theme packages are not separate candidates.
