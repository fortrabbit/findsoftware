notes: >
  The homepage states "The Polymer library is in maintenance mode. For new development, we recommend Lit." The README still calls 3.5.2 the current stable version and names LitElement a successor to the PolymerElement base class, so status stays accepted and successorOf is not recorded; a reviewer decides whether maintenance mode ends the record. The npm package named polymer belongs to another project (version 0.5.0), so the registry record is @polymer/polymer, which the README install line names. The GitHub language field is HTML. The README minimal example has an element class extend PolymerElement, declare its properties in a static getter and return an HTMLTemplateElement from a template getter. The homepage is the only page read beyond the README and the 3.0 install, build-for-production and Node support pages, which name no output directory, runtime minimum or deploy target for the library itself. The Polymer CLI, a separate tool, requires Node per its Node support policy page; it is not part of this record. The LICENSE copyright line gives "The Polymer Authors" with no legal form, recorded as stated.
