notes: >
  The homepage is the project's own GitHub Pages site; it links to the repository's README for the guides, and it links github.com/lpil/wisp, the path the repository had under its previous owner, which was not followed. The GitHub releases API lists 34 releases, the highest stable one v2.2.2 (2026-03-27); v2.0.0-rc1 is the only prerelease and is older than the latest release, so no latestPrereleaseDate is recorded. The oldest GitHub release is v0.2.0 (2023-08-12), but the Hex registry has 0.1.0 uploaded 2023-07-18, so firstRelease follows the registry. The Hex downloads figure is the all-time total from the Hex API. The gleam.toml in the repository states gleam >= 1.11.0 as the Gleam toolchain minimum, recorded as runtimeMin like a go.mod directive. The runtime is recorded as erlang because the homepage names the BEAM runtime and the packages depend on gleam_erlang; the record page should read it as the BEAM. The runsAs entries rest on the wisp_mist README example, which starts the Mist server and then calls process.sleep_forever(), and on the Mist README, which calls Mist a web server; no deployment page is named. The repository also holds a wisp_ewe adapter package, recorded as a second install route. A hosted blog product also called Wisp (wisp.blog) is a different project. The README names a deployed example application (packages.gleam.run on Fly.io) as an example, not as the framework's deployment guide, so no deploy target is recorded. The docs field is the HexDocs address; hexdocs.pm/wisp answers with a redirect to wisp.hexdocs.pm, which returned 200, and the API pages were not read.
