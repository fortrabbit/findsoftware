notes: >
  The CSV homepage is plain http; the same path answers over https, so the https address is recorded. The README names the GoConvey wiki as its documentation. The installation section and the homepage show only a go install or go get command in a code block, with no sentence naming the route, so installMethod is not recorded. The maintainer is Smarty, the copyright holder on the LICENSE.md line. The privacy policy at smarty.com names the legal entity as Smarty, LLC; the homepage calls the project "GoConvey by SmartyStreets", and the README says it is "brought to you by SmartyStreets". The contact and legal pages show no company address with a country, so hqCountry is not recorded. The license file ends with a note that optional and subordinate components carry their own licenses; no such component is named in the README, so only MIT is recorded. GitHub reports the license as NOASSERTION because of that note. The README lists Go 1.16 and 1.17 as supported, which predates the go line of the latest tag, and says the maintainers may consider enhancement requests without committing to them. The latest GitHub release object is v1.8.0 from April 2023; the tag v1.8.1 has no release object and the Go module proxy dates it June 2023, so it is the newest release. The default branch last received a push in July 2024. Go modules have no download figure. The release is three years old at the time of research, under the four-year line of AGENTS.md criterion 4.
