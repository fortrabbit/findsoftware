notes: >
  Library or hosted-service? The React component is open source under the MIT license, but at runtime it adds the script https://editor.unlayer.com/embed.js to the page (the bundle's default script URL) and needs a projectId option; the docs say the Unlayer JavaScript library "will load everything needed to run the builder". Settle it by reading whether the builder can run from a self-hosted copy: the pricing page lists "Free", "Paid plans", "Enterprise" and "on-premise plans", and the terms describe Client Projects and hosted assets kept on Unlayer's systems. Until then the record stays a stub. The README says the component is "Official React component for embedding" Unlayer's editor. The LICENSE copyright line reads "Copyright (c) 2020 Unlayer"; the README reads "Copyright (c) 2026 Unlayer" under the same MIT license, so the wordings are one license entry. The legal name in Unlayer's terms is "Unlayer Inc.", a Delaware corporation with offices in San Francisco; no country is printed in those terms, so hqCountry is not recorded. The npm package react-email-editor is the install route; the GitHub repository has three releases (v2.0.0 in 2026-07, v2.1.2, v2.1.3), and its tags include an older prerelease, so no latestPrereleaseDate is recorded. Plans on the pricing page are hosted plan tiers; no price or plan is recorded. The README says React >= 16.8 and Node >= 18 are required since 2.0 and that the component is client-only. The related package @unlayer/react-elements writes templates as React components and renders email HTML; it is a separate package and is not recorded.
