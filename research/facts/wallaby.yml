notes: >
  The repository's homepage field is twitter.com/elixir_wallaby. A social account is not the project's site, so it is recorded as x, and the README and the repository name no other website, so the record has no homepage; the README's Official Documentation link on hexdocs.pm is the docs fact. The license file names two copyright holders, Chris Keathley (2016) and Mitchell Hanberg (2022), with no "and others", so the maintainer is both names, quoted as the file states them. The GitHub repository is owned by the elixir-wallaby organization, which the README calls "a community project". The Hex package reports all-time downloads of 3,495,418; only the week figure is recorded. The current line is 0.31 (v0.31.0, 2026-06-27); the major is 0 under semantic versioning. Requirements: mix.exs at v0.31.0 declares elixir "~> 1.17"; the README adds OTP 26+, which is the runtimeMin recorded. The README's Phoenix and Ecto sections describe test setup for Phoenix and Ecto apps and name no basedOn; Wallaby is a testing library for web apps, not a plugin of Phoenix. It drives Chrome through chromedriver by default and Selenium through selenium and geckodriver, both named in the README. The README does not state a process model or where the tests run, so no runsAs is recorded. The README says each test case runs concurrently by default and that the library manages the browsers, and its Assets section says mix test does not recompile assets and describes esbuild and webpack aliases for that. The README also requires bash, which does not come pre-installed on Alpine Linux, and the chromedriver or selenium and geckodriver tools the driver needs. For Phoenix apps its setup section has the endpoint serve requests in tests (server: true) and a base URL; for Ecto with a database that supports sandbox mode, a plug lets the browser and the test share one database connection.
