notes: >
  Accepted: a generator the creator runs on a machine or in CI to produce client code, server stubs and documentation for a site's API, which criterion 1 covers as a build tool, and it has documented installs and a published release. The README says the project is "a fork of [Swagger Codegen]" and the migration guide at docs/migration-from-swagger-codegen.md says it "is a fork of swagger-codegen between version 2.3.1 and 2.4.0" and can be used as a drop-in replacement; no Swagger Codegen record exists in this dataset, so no forkOf or importsFrom value is recorded. The README's License section names the copyright holders as "OpenAPI-Generator Contributors" and "SmartBear Software" (2018); the repository LICENSE file has no copyright line. The maintainer is recorded as the contributors; SmartBear Software is a second legal entity and goes to notes. The parent organization OpenAPI Tools is recorded as parent from the README. The README states that generated code is not subject to the project license. The README's download figures ("600k weekly downloads via NPM CLI wrapper", "30M downloads via openapi-generator-cli docker image") are undated and are not recorded; the npm and Docker figures above are the dated ones. The README lists public online services at api.openapi-generator.tech as beta with no service level guarantee; they are not recorded as hostedOffering because the project runs them as a free beta of the open source generator. The npm figures are for @openapitools/openapi-generator-cli, the wrapper the install docs name, which needs a Java runtime. The firstRelease year is from v3.0.0 (2018-06-01), the oldest GitHub release and the oldest Maven Central upload; the repository also carries swagger-codegen_* tags imported from the fork, which are no release of this project. The stars and contributors are for the repository. The homepage and README link a Slack workspace for the community; the dictionary has no Slack field. The README also documents a separate openapi-generator-online Docker image that serves the generator as a web application and API; it is a different artifact from the CLI and no runsAs value is recorded for it. The README names the Maven Central artifacts; Maven publishes no download figure, so none is recorded.
