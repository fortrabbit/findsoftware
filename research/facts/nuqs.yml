notes: >
  The highest stable GitHub release is v2.10.3 (2026-11-10), which matches the npm latest version; the major is 2 and the nuqs v1 line is for older Next.js versions per the docs. The default branch is next, and the LICENSE on it carries the copyright line for François Best. The package sits in the packages/nuqs folder of the repository, so stars and contributors belong to the repository, which also holds the package's docs site. The README lists pnpm, yarn, bun, deno and vlt commands; all install the same npm package and are recorded as one installMethod. The adapters page lists the frameworks: Next.js app and pages routers (Next.js 14.2 or newer), a React single-page app, Remix, React Router v6, v7 and v8, and TanStack Router, which the README marks as experimental and not covering TanStack Start. The docs say the React SPA adapter has no server, so shallow false has no effect there; no runsAs is recorded because no page says where the library runs. The README says "for React frameworks" and does not call nuqs a binding or plugin of React, so no basedOn is recorded. The README says parsers do not validate their input and suggests a schema library such as Zod. The README says the state works like useState, but is stored in the URL query string. The README describes the useQueryState hook for one key and useQueryStates for several keys, a loader for parsing search params on the server, and a search-params cache for reading parsed keys in nested server components.The limits page says browsers rate-limit the History API, so URL updates are queued and throttled, and the README says the returned state updates instantly while only the URL changes are throttled.The sponsor pages are not paid editions. The ecosyste.ms dependent counts are both zero as the source reports them. Social links come from the homepage's footer and sidebar (x.com/nuqs47ng and bsky.app/profile/nuqs.dev); the YouTube channel is not a field.
