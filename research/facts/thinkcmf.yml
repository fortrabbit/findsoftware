notes: >
  The repository the README names as the main one is Gitee (gitee.com/thinkcmf/ThinkCMF) and is recorded; stars, contributors and release date are read from the GitHub repository, which the README calls the overseas mirror. repoOwnerType is left out because it would describe the GitHub account, not the Gitee repository. No end signal: the GitHub repository is not archived, the Packagist package is not abandoned, endoflife.date has no entry, and the last commit date is 2025-11-20 while the last release is 2024-09-30; release age decides nothing. The README calls 8.1.0 a development version not for production, so the current stable is 8.0.1 (Packagist v8.0.1). The README gives PHP 8.1 as the minimum environment, while the 8.0.1 composer requirement is >=8.0.0; both are stated and the composer value is recorded as runtimeMin, reviewer may prefer 8.1. The maintainer is recorded from the about page, which says the company develops and operates ThinkCMF behind the individual names under which it is released, as a non-profit project; the company name is in Chinese, and the English form is not on the page. The kancloud manual states it is synced to version 5.0 and is not used for installation facts; the 8.0 manual page on thinkcmf.com returns a stub without installation content, so it is listed as unreadable. The Swoole mode is stated in the GitHub repository description; the README does not describe it.
