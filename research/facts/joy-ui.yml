notes: >
  Stub: the doubt is whether Joy UI is discontinued or only paused. The Joy UI overview says "Joy UI is in beta and development is currently on hold", then "we recommend Material UI over Joy UI because we can guarantee ongoing support", and that the maintainers "may not be able to respond in a timely manner". No page says the project has ended, and the repository is not archived and the npm package is not deprecated, so the record is not discontinued; a statement from MUI on Joy UI's future would settle it. No stable release exists: every version on npm @mui/joy is a 5.0.0-beta or alpha, and the mui/material-ui GitHub releases carry no Joy tag, so currentMajor and latestReleaseDate are not recorded and latestPrereleaseDate is the npm date of the latest tag, 5.0.0-beta.52. The docs show beta.49 while npm latest is beta.52; the npm version is the one recorded. The repository is the material-ui monorepo, shared with Material UI, so its star and contributor counts cover Material UI as well and are not recorded; the npm figures count @mui/joy only. The homepage row in the candidates CSV pointed to the Material UI page and was replaced by the Joy UI page. MUI's legal page names the company "Material UI SAS, trading as MUI"; the privacy and terms pages name "Material-UI SAS"; the legal page form is recorded. The "MUI" technology in the HTTP Archive list is not matched to Joy UI, so httpArchiveSites is not recorded. The discord link is the MUI shortlink on the Joy UI page; the x and youtube links are the MUI accounts on the same page.
