notes: >
  Traefik Proxy is the open-source product; Traefik Hub and Traefik Enterprise are commercial products from Traefik Labs. The pricing page names the products and offers "Download Free Traefik Proxy" but states no prices in the text read, so paidEditions is not recorded. The install guide lists Docker and Kubernetes (Helm) quick starts; no binary download page was found. The current major is 3 (v3.7 line, not end of life). The Docker Hub pull count in candidates-server-infra.csv (3.6B) was not re-read. Fields coined here: none.
