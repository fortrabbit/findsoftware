notes: >
  The repository has no homepage of its own: the GitHub Pages guide at tokio-rs.github.io/toasty is the project's docs site, and its root is a client-side redirect to the guide, so it is recorded as homepage without a quote. The CSV homepage was the repository; no separate project site exists. Version 0.11.0 is the 0.x line: currentMajor is 0, the minor line is not recorded. The crate first appears on crates.io as 0.1.0 (2024-09-13), before the repository's created_at (2024-10-22); firstRelease follows the crate upload, both are 2024. runtimeMin is the rust_version of 0.11.0 on crates.io (1.95), taken from the registry, not from the Cargo.toml on main. The guide lists Turso (SQLite-compatible, async-native) as a driver beside SQLite; it is not recorded as a separate database. The DynamoDB driver is named in the same guide sentence as NoSQL. The README discord link (discord.gg/tokio) is the Tokio community server, not a project channel, so no discord fact. The crateDownloads figure is the crates.io total; the 90-day figure (recent_downloads) is 87721 on the same endpoint. The repository holds a workspace of driver crates; stars and contributors belong to that repository. The maintainer is the LICENSE copyright holder; the repoOwnerType is the tokio-rs organization.
