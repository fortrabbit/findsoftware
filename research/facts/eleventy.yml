notes: >
  Eleventy was renamed Build Awesome on 2026-03-03; the stable v3 line still ships as @11ty/eleventy with docs at 11ty.dev, while build.awesome.me documents the upcoming v4 (canary 4.0.0-alpha.10). The repository github.com/11ty/eleventy now redirects to github.com/11ty/buildawesome. The record id and name stay Eleventy until the dataset decides how to handle renames; renamedTo is a coined field for that. Build Awesome Pro, a no-install site builder, is announced as Coming Soon with no published price, so paidEditions carries no price. The homepage shows the word Twitter without a link, so x is absent. Eleventy Serverless and Edge are listed as retired plugins, so renderingModes is static only. The community starter list gives no total. Not on endoflife.date. Coined fields: renamedTo, preReleaseVersion (latest pre-release on a next/canary tag), officialPlugins (plugins published by the project itself), youtube. contributors is the GitHub API count including anonymous contributors.
