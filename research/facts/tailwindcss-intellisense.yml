notes: >
  The extension has no website of its own; the Tailwind docs page at tailwindcss.com/docs/editor-setup is the parent project's site, so no homepage is recorded and the docs field points there. The repository is a pnpm monorepo: the extension lives in packages/vscode-tailwindcss, and the root has no LICENSE, which is why the GitHub API reports the license as null; the MIT license is the package's own LICENSE at tag v0.16.0. The marketplace listing bradlc.vscode-tailwindcss (publisher bradlc, display name Tailwind Labs) reports 14837708 installs on 2026-10-28 and a first published date of 2018-08-21, older than the oldest GitHub tag (v0.3.0, 2020-06-11), so firstRelease is 2018. The highest stable GitHub release is v0.16.0 (2026-07-17); the GitHub version line is 0.x, so currentMajor is 0 and the minor line is 0.16. The extension's package.json at v0.16.0 sets engines vscode ^1.67.0, which states the VS Code host version, not a runtime minimum for the tool, so runtimeMin stays unknown. The README states the extension activates in a project with a CSS file that imports tailwindcss, or, for earlier versions, a Tailwind CSS config file. It also lists a Tailwind CSS language mode and a class sorting command marked pre-release. The README states the extension activates when the workspace uses tailwindcss, which is the basis for basedOn tailwindcss. The docs page states the extension is for Visual Studio Code; the marketplace lists pricing as free, recorded in no field. No page states that the extension runs on the developer's machine in those words, so runsAs stays unknown for a reviewer to decide. The GitHub organization profile is the maintainer name source only where the license names none; here the LICENSE copyright line names Tailwind Labs, Inc. The Tailwind CSS language server packages in the same monorepo are separately published packages and are not recorded as records of their own.
