notes: >
  The highest stable release is v26.2.0 (2026-03-20), a calendar version, so currentMajor is not recorded; the line is 26.2. The oldest tag v0.0.1 has a commit dated 2017-10-10 and that is also the date of the oldest GitHub release (a prerelease), so firstRelease is 2017. The LICENSE file names no copyright holder; the maintainer and hqCountry come from the Ory privacy policy, which names Ory Corp with its Scottsdale, Arizona office. The OSS docs describe the process model: "Starting Oathkeeper via oathkeeper serve exposes two ports: One port serves the reverse proxy, the other Ory Oathkeeper's API." The OSS docs call it a reverse proxy in front of an upstream API or web server, and the README lists integrations with Ambassador, Envoy, AWS API Gateway and Nginx; those are integration statements, not alternativeTo or basedOn. The README says it works "as an API Gateway plugin or standalone proxy" and offers proxy and sidecar deployment modes. The OSS install guide gives the install routes. The Enterprise License build is distributed only from a private registry and is recorded as paidEdition. The README's "As a managed service on the Ory Network" line is the hosted offering; the Ory Network pricing page is linked as pricingPage. The OSS docs say it needs no database or other persistent storage, so databases is not recorded. The reference section lists a REST API page that renders only with JavaScript, so headlessApi is not recorded. The README's Discussions link is recorded as forum and its newsletter link as newsletter. The contributors count is the last page number of the contributors endpoint with per_page=1. The build-from-source section is a build requirement for software shipped as a binary, so no runtimeMin is recorded. The homepage footer links X (recorded), YouTube (recorded as youtube) and LinkedIn (no field).
