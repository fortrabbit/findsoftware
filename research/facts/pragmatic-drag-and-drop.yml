notes: >
  The repository README says it is a one-way mirror of Atlassian's internal monorepo, that the npm packages are published up to a day before the mirror shows them, and that code contributions are not accepted, so the GitHub stars and the two contributors describe the mirror. The README also says the packages are published under the @atlaskit namespace on npm. The GitHub API reports the license as NOASSERTION, but the LICENSE file names Apache License 2.0 and the npm latest version says Apache-2.0, so the file is the source. The repository has no GitHub release or tag; the npm latest 4.0.0 (2026-09-24) is the stable version, and npm dist-tags also list a next tag at 0.18.2, which is not a stable major. The homepage link redirects to the about page, which is cited as the homepage; the about page says the library "can be used to power any drag and drop experience on any tech stack" and that it is framework agnostic, so no basedOn is recorded, and the core package page says it "can be used with any view library". The package is a headless toolchain: the docs say it has optional visual outputs and optional assistive technology controls based on the Atlassian Design System, and the README says those packages depend on styling solutions and Atlassian tokens. The about page gives a core size of about 4.7kB, a bundle figure stated on a homepage and therefore kept in notes only. The comparison page benchmarks Pragmatic drag and drop against react-beautiful-dnd, react-dnd, @dnd-kit and Draggable; the two with records here are recorded as alternativeTo. No page of this project says it succeeds react-beautiful-dnd (that project's own README sends users here), so successorOf is not recorded. The Sydney headquarters quote comes from the Atlassian contact page, which lists it as the global HQ; the maintainer is Atlassian Pty Ltd as the LICENSE copyright line names it.
