notes: >
  The README's "Final Update (August 2025)" says the team decided to archive the repository, and the same section says the project "has not been actively maintained for years"; the GitHub API reports archived true. The archive is the repository the npm package names and the README links, so both signals are recorded and the status is discontinued. The homepage pikaday.com, named by the README and the npm package, now shows an unrelated guide to front-end date pickers; that counts as a dead homepage, so no homepage is recorded and the README's "Try Pikaday Demo" link is the only tie between the site and the software. The README's optional jQuery plugin (plugins/pikaday.jquery.js) and the Moment.js support are bindings and optional integrations; neither is a basedOn statement. Dates are formatted and parsed with the JavaScript Date object, or with Moment.js when it is loaded. The README says Pikaday is a pure datepicker that does not support picking a time of day, and points to forks for time support. The README links a Pikaday gem for Ruby on Rails that is published under other authors, so no gem route is recorded. The license has two statements: the LICENSE file contains "The MIT License (MIT)" and "The BSD License", and the README says "BSD & MIT license". The BSD text has two numbered conditions, which is the BSD-2-Clause form. The npm package states "(0BSD OR MIT)" and GitHub reports NOASSERTION; neither wording is recorded. The i18n value rests on the README's configuration list and its Internationalization section, which also names an RTL option. The README says Pikaday "was started before <input type="date"> was supported in browsers" and that browsers now offer native date inputs; the README's remark that it is "probably not the right choice today" is the maintainers' opinion and is not recorded. The CHANGELOG lists 0.0.1 on 2012-10-08 and 0.0.2 on 2012-10-10, the oldest dated versions, so firstRelease is 2012; the oldest git tag is 1.0.0, committed 2013-03-15, and the npm package was first uploaded in 2014. The latest GitHub release and the npm version are both 1.8.2, dated 2020-10-22. The ecosyste.ms and npm figures are for the npm package pikaday.
