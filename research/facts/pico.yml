notes: >
  The download page carries an end-of-life notice that says development has stopped, advises against new websites, says existing sites have no known security issues but will run into issues because Pico was not designed for modern PHP versions, and invites someone to take over the project; the status fact quotes it and the file is discontinued under criterion 4. The homepage still says Pico "is maintained by The Pico Community", which the notice contradicts; the notice is the more specific and later statement, so the status stands. The maintainer is the name the homepage gives; the LICENSE copyright line names Dev7studios Ltd (2012) and the homepage names Gilbert Pellegrom as the maker. The repository was pushed on 2026-07-07 and is not archived, and the registry package is not abandoned, so no archive or abandonment signal applies. The install docs name picocms/pico-composer, a skeleton, so the Packagist figures come from the core package picocms/pico. The download page points to a v3.0.0-alpha.2 release and the pico-3.0 branch, which are not stable and are not recorded. The notice also names alternative flat file CMSs; those are not recorded as alternativeTo.
