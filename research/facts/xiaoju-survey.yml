notes: >
  Accepted under criterion 1 because the project's own intro page says the system is embedded in each terminal through a "多端嵌入式小问卷 SDK" (multi-end embedded survey SDK), and the multi-end SDK API page lists channel types for embedding a survey in an app, a web page and a mini program. Embedding is recorded here and not as a field: the SDK API page and the intro page describe it. The server API page (POST /api/survey/createSurvey, /api/survey/getList, /api/channel/create and similar) manages the system's own surveys and channels; it is not counted as wiring by itself. The README lists custom hook configuration for data push and message push integrations, which is webhook-like, recorded in notes only. The documentation site shows 1.3.0 as its current version, but the GitHub tags stop at v1.2.0 (2024-03-07) and there is no GitHub release; currentMajor and latestReleaseDate come from the tags. The LICENSE copyright line gives Beijing Didi Infinity Technology and Development Co.,Ltd.; the homepage footer names 北京小桔科技有限公司 with a 2022 copyright and an ICP filing, another legal entity recorded here only. No page states a country for either entity, so hqCountry is left out. The README, the quick start and the service deployment page name Node 18 or newer; no runtimeMin is recorded because the Docker image is the shipped form and the quick start is a local development guide. The service deployment page runs the server with pm2 and the web app behind nginx, recorded as always-on. The server is NestJS with MongoDB and the web app is Vue 3 with Element Plus, both the project's own stack, so basedOn is not recorded. Features that stay in notes: AI-generated surveys from a single sentence, forty or more question types, logic and jump rules, Excel and text import, response analysis and export, a recycle bin, a ReactNative SDK, and a Gitee mirror (gitee.com/didiopensource/xiaoju-survey) linked from the homepage. The chat group linked from the README is not recorded. The homepage banner names a ReactNative SDK; its package is not recorded.
