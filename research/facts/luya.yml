notes: >
  The LICENSE copyright line names Zephir Software Design AG for 2014-2021 only; the current company behind LUYA is not stated on the pages read, so the maintainer is a fallback and the reviewer should confirm it. The guide's "The LUYA Organisation" page and the imprint were not found at the URLs tried. The composer.json of 2.3.1 declares no php requirement and the install guide states none, so runtimeMin is not recorded. The introduction says "Configuration data is stored in versioned files rather than in a database," and the install guide says "Build and import all filesystem configurations into the database with the import console"; the second line is why contentStore is not recorded. The introduction also says "Unlike platforms such as WordPress, LUYA isn't a one-click installation product." Not recorded as contentStore because the guide does not say where page content is kept. The homepage says "Since 2015" and the GitHub repository was created in 2014; neither is a first release, so firstRelease is not recorded. Registry figures come from luyadev/luya-core, the core package the repository README links for its version and download badges; luyadev/luya is a project-type package with no monthly downloads, and the installer template luyadev/luya-kickstarter pulls the core in. The last GitHub release is 2.3.1 (2024-02-07) while the repository was pushed on 2025-11-18; no end signal was found, so the status stays accepted. The adminUi quote is a sidebar item of the guide, not a description of the admin module. The contributor count is the number of pages with per_page=1 and anon=true, which includes anonymous contributors. The guide pages for Deployment, Queue and Scheduler, and Cloud and Docker were not reachable at the URLs tried, so runsAs and the scheduler are not recorded.
