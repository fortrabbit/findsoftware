notes: >
  currentMajor 0 comes from the highest stable GitHub release v0.6.3 (2022-11-02); npm latest is 0.6.20 (2023-04-05), also major 0. latestPrereleaseDate is npm's next tag 0.7.0-next.49 (2024-08-27), newer than the latest release. The npm registry latest is the package the install docs name (rakkasjs), and create-rakkas-app is a scaffolder, not recorded. The runtime entry comes from the Node.js deployment page of the repository source, since the live /guide pages other than getting-started return the homepage. No minimum Node version is stated anywhere, so runtimeMin is unknown. The homepage's own text lists "Deploy on Node, Vercel, Netlify, Cloudflare Workers". The static hosts and prerendering pages are read from the repository source, not from the live site. The docs at rakkasjs.org/guide/deployment return the homepage, so no deployment page exists at that path. The README states: "Minor releases will introduce breaking changes until we hit 1.0" and "not yet ready for production use". The README's Twitter link is the maintainer's personal account. Rendering on the server is the default per the node page; no spa mode is stated. The prerendering page says a page can be prerendered only when its content is solely determined by its URL path.
