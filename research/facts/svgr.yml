notes: >
  SVGR is a monorepo: @svgr/core, @svgr/cli and @svgr/webpack are separate npm packages. The record's npm figures are @svgr/core, the package the Node.js install guide names and the one the monorepo's integrations build on; @svgr/cli had 928,595 downloads in the same week and is not recorded. The highest stable GitHub release is v8.1.0 (2023-08-15), and the npm latest of @svgr/core is 8.1.0; the next dist-tag is a 6.0.0 alpha and is not a stable release. The default branch's last commit is 2025-10-05 and the pushed_at date is 2026-03-01; the record has releases, so lastCommitDate is not recorded. The integrations named on the docs pages are the command line tool, webpack, Rollup.js, Parcel, Next.js, Remix, Jest and Mocha; the what-is-svgr page lists the uses, and the Playground runs online; these are notes only and not a basedOn, since SVGR does not state that it builds on React. The categories have no converter value in the import map, so build-plugin is used for the webpack, Rollup and Parcel integrations. The LICENSE copyright line reads "Copyright 2017 Smooth Code", an older copyright statement; the README states "Copyright © 2017-present Greg Bergé", and the README is recorded as the maintainer. The package.json author is Greg Bergé. The GitHub user gregberge is a user, not an organization. The first tag v0.1.0 has commit date 2017-09-02, so firstRelease is 2017. The site has no discord, x or other social links in its markup; the README links the maintainer's sponsor pages and OpenCollective, which are not fields. The docs name "SVGR is an universal tool" with a typo in the source; the quote is kept as written.
