notes: >
  Maintainers: the README's Maintainers table names Stephen Shaw and Christopher Wallis; the LICENSE and the homepage footer name Stephen Shaw as copyright holder (2018, and 2018-present on the homepage), so the record follows the LICENSE line and Christopher Wallis is not recorded as maintainer. Version: the newest GitHub release is 1.0.5 (2018-08-27), while npm's latest is 1.1.0 (2024-05-31), which has no GitHub release or tag; npm's "next" tag 1.0.0-beta2 is a prerelease and is not used. firstRelease: the oldest GitHub release is 0.9.3 (2018-01-11) and the npm 0.9.0 upload is from 2018-01-05; both are 2018. The guide says the basic functions "work in any halfway decent browser (IE11+)" under Browser Support; that is a support list, so no runsAs or runtime is recorded. The guide's own wording for the library is "a JavaScript microlibrary". The npm figure is the sum of daily downloads for 2026-11-01 to 2026-11-07. The README's Twitter links for the maintainers are not recorded as the project's social fields.
