notes: |
  The maintainer is taken from the LICENSE copyright line, which names Justin Walsh. The project's homepage meta author and the composer.json name Stéphane Goetz as author; the homepage name is only in a meta attribute, so it is not quoted, and no fact records him as maintainer. The repository was created 2017-09-13; that is not a first release year. The composer.json lists "dauxio.github.io" as homepage, but the project's site and the GitHub repository description name https://daux.io/, so that URL is the homepage. The Docker image daux/daux.io is named on the homepage as an install option; no pull count was read. The Packagist p2 metadata and the package page agree on the package name daux/daux.io and the latest version 0.26.0. The Live mode page says the mode "can be used for production, but it is not recommended", and scans the whole directory on each request; this is recorded as the page states it and belongs in the prose under Worth knowing.
