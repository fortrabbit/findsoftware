notes: >
  Pedestal is a monorepo; the package the install docs name is io.pedestal/pedestal.service on Clojars, and the GitHub tags are the monorepo's versions. The highest stable GitHub release is 0.8.2 (2026-10-06); the 0.8.2-beta and rc tags are prereleases. The first release is 0.2.0 (2013-08-31), the earliest release object. The GitHub API reports the license as null, so the license is taken from the README, which names the Eclipse Public License 1.0 and the epl-v10.html file in the repository; the Clojars record names the same license. The Clojars download figure is the total on the artifact page. The README copyright notice names Relevance, Cognitect and Nubank; the maintainer is recorded from the terms page, which names NuBank NA. The homepage is the 0.8 documentation site; the root pedestal.io path answers too but the versioned path is the one the repository names. Jetty 12 and Http-Kit are the connectors the README names; they are not recorded as fields because no field holds them. The homepage also states that Pedestal requires Clojure 1.11 or later; the runtimeMin field holds the Java version.
