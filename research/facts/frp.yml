notes: >
  Boundary question settled: the README and the examples say frp forwards HTTP and HTTPS requests to internal web services by domain name ("Accessing Internal Web Services with Custom Domains in LAN"), so criterion 1 holds, and frp is no website host. The current line is 0.x: the README says the project will move from version 0 to version 1 at an appropriate time, so currentMajor is 0 and the minor line 0.71 stays in notes. The README Development Status describes a version 2 in development that will not be compatible with version 1, while version 1 continues to get releases; that is no end signal. The homepage footer states "© 2026 The frp Authors", recorded as the maintainer; the Apache LICENSE carries the unfilled template line, the homepage names fatedier as the author to follow on X, and the repository is owned by that user account. The stable release v0.71.1 was published 2026-10-14; the default branch of the repository is dev. The Go minimum is stated only as "consistent with the latest Go language requirements", with no version on the pages read, so runtimeMin is unknown; the go.mod at the release tag was not read. The README lists a Docker example for exposing the Docker socket but no Docker image as an install route. The category tunnel has no entry in the import's categoryMap, so only reverse-proxy maps. The README and homepage list GitHub Sponsors and PayPal donation links, which no field here holds.
