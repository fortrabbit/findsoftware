notes: >
  The project is FreeSql under the dotnetcore organization, a member project of the .NET Core Community according to the README badge; the community is not recorded as a parent. The NuGet package metadata names https://github.com/2881099/FreeSql as the project URL, which redirects to the dotnetcore repository; the repository field is the dotnetcore one because the README and the freesql.net docs name it. The LICENSE copyright line names YeXiangQin, while the freesql.net footer reads "Copyright © 2018-present nicye"; the LICENSE line is the recorded maintainer and the footer name is left here for review. The current release line is 3.5 (v3.5.311); the minor line is not recorded as currentMajor. The first GitHub release is v0.5.4 dated 2019-04-25, the oldest tag. The README lists more databases than the field ids: TDengine, QuestDB and MsAccess have no field id here, and the Chinese database providers (Dameng, KingbaseES, GBase, Xugu, ShenTong) sit only in the README and the get-started provider table. The get-started page lists provider packages for each database, so FreeSql ships on NuGet, but no sentence names the route, so installMethod is not recorded; the provider table names FreeSql.Provider.MySqlConnector as the recommended MySQL provider. The README names the QQ groups for chat; no forum field is recorded because a QQ group is a general chat, not the project's forum. The runtimeMin is not recorded: the README and the get-started page state supported framework versions for the library, and the packaging targetFramework values were not read. The sample project lists in the README (Zhontai.net, lin-cms, AIBPM, NetAdmin) are not recorded as importsFrom or alternativeTo, because they are projects built with FreeSql, not competitors or migrations. The contributors count is from the GitHub contributors endpoint with per_page=1; the last page is 64.
