notes: >
  Archived on GitHub, and the npm package sapper is deprecated with the message "SvelteKit is the successor to Sapper - https://kit.svelte.dev/". The docs and the README both state the deprecation; the successor SvelteKit is named, and the project's own pages say so. The repository has no GitHub releases; the tags run to v0.29.3, which npm latest matches, so currentMajor and latestReleaseDate come from npm. The npm history starts with 0.0.1 on 2017-12-11, the same day the repository was created. The newest npm prerelease (0.26.0-alpha.12, 2019-03-08) is older than the latest release, so no latestPrereleaseDate is recorded. The maintainer is the repository's owner organization as its GitHub profile names it, because the LICENSE copyright line names "these people" and no legal entity; the reviewer should confirm this choice. The CSV holds a second row with id sapper for an unrelated Rust crate (miketang84/sapper); this file covers only the sveltejs repository. The docs say SvelteKit is recommended for all projects moving forward and that Sapper receives no security fixes, bug fixes or improvements. The docs name Netlify and GitHub Pages as hosts for an exported static site. The docs describe a sapper export command that writes a static site to __sapper__/export. The docs say the server renders each page first and that a client-side app then takes over.
