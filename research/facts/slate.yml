notes: >
  The default branch is migration-notice and holds only a README (sourcePublic false). The README says the project was taken off GitHub and that the author keeps "a read-only archive" of its code at code.lord.io/slate, which is not a new home for development, so the archived repository is a signal: status discontinued. The repository's homepage field, https://slatedocs.github.io/slate, answers 404 on 2026-10-23, so no homepage is recorded. The current branch has no license file and GitHub reports no language, because no code is left on it; license, runtime and install facts come from the v2.13.1 tag and the wiki, which stay readable. The notice names no successor or fork. The latest stable release is v2.13.1 (2023-01-31); the oldest release is v1.0 (2014-07-08). The maintainer is the handle the README gives, "@lord", recorded as stated.
