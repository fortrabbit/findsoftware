notes: >
  The install docs name the ng-primitives npm package, through the Angular CLI and by manual npm install; the npm weekly download range is 2026-10-18 to 2026-10-24. The homepage calls the library Angular Primitives, the name recorded; the GitHub repository and npm package are ng-primitives. The docs state that major versions will follow Angular majors starting from v1.0.0; the highest stable GitHub release is v0.131.3, so currentMajor is 0, and the docs' version-to-Angular table is not recorded. The docs say the library supports SSR and zoneless applications; no renderingModes fact is recorded because the library is not a site that renders pages. The maintainer is the npm package author, Ashley Hunter, since the LICENSE file names no copyright holder and the docs footer reads only Copyright 2026 Angular Primitives. The homepage names Coralogix as a partner and links coralogix.com; no field holds a partner, so it is not recorded. The Discord invitation is taken from the README, which the homepage navigation also links. The ecosyste.ms index reports the latest version as 0.131.2 and zero dependents, so its counts may lag the registry. The README has a compatibility table that lists the Angular majors each release line supports. The HTTP Archive technologies list has no Angular Primitives entry.
