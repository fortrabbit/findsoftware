notes: >
  The homepage https://templ.guide/ answers over https and is the project's documentation site. The highest stable GitHub release is v0.3.1100 (2026-10-26); the major is 0 because the version line is pre-1.0. The oldest GitHub release is v0.0.80 (2021-05-16), so firstRelease is 2021. The Go module is github.com/a-h/templ; a Go module has no download figure, so none is recorded. The Lambda hosting page describes an adaptor that wraps the standard Go handler for AWS Lambda; the page does not state that the function runs per request, so no per-request runsAs value is recorded. runsAs static rests on the deploying-static-files page. The help page also names the #templ channel in the Gopher Slack, which has no field here. The docs say a static site can be built with templ, and the homepage's rendering statement names both server-side and static rendering. The go.mod of v0.3.1100 requires Go 1.26.0, recorded first as the module's own minimum; the installation page's Go 1.24 is the second entry. The i18n fact says only that third-party internationalization libraries work with templ, not that templ ships one. The categories value templating is the vocabulary word in categoryMap, which maps it to library.
