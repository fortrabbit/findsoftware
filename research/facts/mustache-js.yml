notes: >
  Homepage: the repository's own README links mustache.github.io as the home of the mustache template system (the Mustache specification, manual and the list of implementations in many languages). That site describes the template language for all its implementations, not mustache.js alone, and the repository names no site of its own, so no homepage is recorded (rule for repository-only projects). The same site answers over https.
  Age: the latest stable release is v4.2.0 of 2021-03-28 (GitHub release and npm latest, both 2021-03-28). The repository was last pushed on 2024-06-14. Under criterion 4 the import moves a record with no release in four years to stub; this file keeps status accepted and records latestReleaseDate, as the rule says.
  Maintainer: LICENSE carries three copyright lines (Chris Wanstrath (Ruby) 2009; Jan Lehnardt (JavaScript) 2010-2014; The mustache.js community 2010-2015). The record names the community line, since several holders are named; package.json names the author as "mustache.js Authors". The JavaScript line names Jan Lehnardt.
  No v4 prerelease is recorded: npm dist-tags beta 4.2.0-beta.0 is older than v4.2.0.
  The npm figure counts downloads for the package mustache, the one the README install section names. The command line tool ships in the same npm package. The dependency and star figures belong to the janl/mustache.js repository.
  The README's install section gives the npm route; the CDN script tag in the usage example is a code sample, so it is not recorded as an installMethod.
  The firstRelease year comes from the tag 0.1 (commit 2009-10-11); the repository was created 2009-10-04.
  The Node.js line in the README's "Where to use" section names browsers and Node.js as places the library runs, so runtime is node and no runsAs is recorded. No runtimeMin is stated.
  The README's usage section renders with Mustache.render, which takes a template and a view object holding the data, and Mustache.parse caches a parsed template for later renders. The command line tool is described as a wrapper around Mustache.render.
  The README covers variables, sections, inverted sections, comments and partials, and renders them against the view object.
