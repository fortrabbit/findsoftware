notes: >
  The install docs name @tailgrids/cli, so its npm figures are recorded; the figure counts installs of the CLI package only, and the components it copies into a project do not come from npm downloads of the component library, so it is low relative to use of the components. The deprecated npm package tailgrids (latest 2.4.0, deprecated with the text pointing to @tailgrids/cli) had 13461 downloads in the week 2026-10-19 to 2026-10-25 and 4 dependent packages; it is not the install package and its figure is not recorded. The deprecation names the same project's new package, so it is a move and the status stays accepted. The site headline and the pricing page say v3.0, while the changelog ends at 2.3 and no GitHub release or npm version of @tailgrids/cli has a major above 1; currentMajor is 1 from the package the install docs name, and the site label is not recorded. Latest GitHub release is @tailgrids/cli 1.4.3 (2026-08-04); the same repository also releases @tailgrids/icons 2.0.1, which is not the install package. The first GitHub release is dated 2026-01-11, later than the changelog's initial release line, which is quoted for firstRelease. The free Essentials edition is MIT licensed; Pro blocks, templates and the Figma kit are paid tiers on the pricing page. The pricing page has a Developer, a Designer and a Developer and Designer tier; prices are not recorded. The README calls the components copy-paste friendly and gives the CLI example npx @tailgrids/cli@latest add button. Contributors are counted from the contributors API across all pages, with per_page=1 read from the Link header.
