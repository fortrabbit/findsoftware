notes: |
  Discontinued: the README says the Polaris React library "is deprecated" and that the repository "will not receive updates or maintenance"; the repository is archived (api) and @shopify/polaris on npm carries a deprecated flag (registry, latest version 13.9.5). The README names Polaris Web Components, released on 2025-10-01, as the replacement for new development. That is a separate product, not a rename of this package, so it is not recorded here and has no candidate row. The archived docs URL redirects to the Polaris Storybook. The archived docs site is not readable, so the install commands come from the README of the polaris-react package in the archived repository. The license is stated two ways: the README calls the source code license "custom ... based on MIT" and links LICENSE.md, and the npm latest version says "SEE LICENSE IN LICENSE.md"; both are one entry. The LICENSE.md text limits the rights to applications that integrate with Shopify software or services, quoted in the README as the restriction. The icons and images carry the Polaris Design Guidelines License Agreement, recorded as its own entry. The hqCountry is taken from the Shopify terms, which name Shopify Inc. as a Canadian corporation with an Ottawa address. The npm weekly figure is the sum of the daily counts for the period in the value; it counts installs of the deprecated package. The basedOn react statement comes from the repository description, "React implementation". The first version on npm, 1.0.0, is dated 2017-04-20.
