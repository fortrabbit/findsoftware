notes: >
  Hosted service with no installable server: no repository field and no install method are recorded. The npm package @pinecone-database/pinecone is the client SDK, and the pinecone-io/pinecone-ts-client repository is an SDK repository; per the hosted-service rule, neither feeds a field. The CSV row named the SDK repository pinecone-io/pinecone-ts-client; it is kept out of the record. Pricing lists four plans (Starter, Builder, Standard, Enterprise); the Starter plan is free to start and the paid plans are hosted plan tiers, so no paidEdition fact is recorded. sso is left out for doubt: the pricing page lists "RBAC SSO (SAML 2.0)" on the Standard plan, while the security page at www.pinecone.io/security/ marks SSO (SAML 2.0) as "Coming Soon" and the docs page on single sign-on describes it as configured through Okta. Bring Your Own Cloud (BYOC) runs a privately managed Pinecone region inside the customer's own AWS, Azure or Google Cloud account (enterprise page); it is a hosted deployment option, not an installable part, so no selfHostOption is recorded. The Pinecone Nexus product and the pg_pinecone Postgres extension (announced on the homepage banner, with a blog post at /blog/introducing-pg-pinecone/) are separate products and are not on this record; pg_pinecone was not read and would need its own candidate. Compliance statements (SOC 2 Type II, HIPAA BAA on request, GDPR) sit on the enterprise and security pages and are not recorded as fields. The company is Pinecone Systems, Inc. (legal page and terms); the terms give Pinecone Systems Inc. with a San Francisco address. The homepage links x.com/pinecone, discord.gg and github.com/pinecone-io; the GitHub organization is not recorded as a repository. No first release date is stated on the pages read, so firstRelease is not recorded.
