notes: >
  The GitHub repository has no homepage, and the README names none, so no homepage is recorded; the README is the only documentation. The README title is "Commonmarker" and the gem is published as commonmarker on RubyGems. The GitHub language detection reports Rust because the gem ships a Rust extension compiled through rb-sys; the language is recorded as Ruby from the README's "Ruby wrapper" statement. The README calls the project a "Ruby wrapper for Rust's comrak crate" and the comrak homepage lists this gem among its Ruby bindings; the basedOn value is comrak, a record of this wave, and the reviewer decides whether a wrapper is a basedOn statement. The oldest RubyGems upload (0.0.1, 2015-05-10) matches the 2015 firstRelease. The README's documented install routes are the Gemfile line (bundler) and "gem install commonmarker"; the gem install route is shown only as a command, so no installMethod is recorded for it. The maintainer follows the LICENSE.txt copyright line (Garen J. Torikian, 2015); the repository owner is a user account. The license MIT is the GitHub detection; the LICENSE.txt at tag v2.10.1 states "MIT License". The rubygemsDownloads figure is the RubyGems total, not a monthly count. The README states the output is HTML only ("Commonmarker can currently only generate output in one format: HTML"), and that it "passes all of the CommonMark test suite"; both are kept out of the fields as coined kinds. The syntax highlighter plugin and the default GFM extensions are documented in the README and not recorded as fields. The runtimeMin 3.2 is the required_ruby_version of the gemspec at tag v2.10.1, which is a runtime requirement of the gem. The releases on GitHub run from v0.1.0 (2015-05-13) to v2.10.1 (2026-10-16); the major 0 line is not the current major.
