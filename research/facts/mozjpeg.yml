notes: >
  The project has no website of its own; the GitHub repository is the only home, so no homepage is recorded. The README calls MozJPEG a patch for libjpeg-turbo, which is recorded here in prose only because no record exists for it. The cjpeg command-line tool is described by the README as a demo "not intended for serious use"; the project is a library. The latest GitHub release is v4.1.1 (2022-08-15). A tag v4.1.5 exists without a GitHub release; it is not counted. The release date is more than four years old, so the import moves the record to stub on its own. The LICENSE.md at v4.1.1 covers three licenses: the IJG license for the libjpeg API library, the modified 3-clause BSD license for the TurboJPEG API library and the build system, and the zlib license for the SIMD extensions. The file describes libjpeg-turbo, which MozJPEG patches. The GitHub API reports the license as NOASSERTION, so the entries come from the file. The maintainer is named by the project as "Mozilla"; the Mozilla legal page is a navigation list naming the Mozilla Foundation and gives no address, so no legal name or hqCountry is recorded. The README criterion-1 statement names graphics programs and image processing tools, not websites; whether the record meets criterion 1 is for the reviewer.
