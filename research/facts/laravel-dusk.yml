notes: >
  The repository and the Packagist package are both named laravel/dusk, and the install docs name composer require laravel/dusk --dev. The default branch is 8.x; the highest stable release is v8.8.0, published 2026-11-10, so currentMajor is 8. The Packagist version time for v8.8.0 reads 2026-11-09 (the tag commit), and the GitHub release date is recorded. The docs describe the dusk:install command, which creates a tests/Browser directory and installs the ChromeDriver binary, and the docs say Dusk uses Google Chrome with a standalone ChromeDriver; the docs warn that a manually registered Dusk service provider must never be registered in production. runsAs local rests on the docs' local computer and CI sentences. The Laravel documentation recommends Pest for browser testing in new projects, saying Pest 4 includes automated browser testing that offers significant performance and usability improvements compared to Dusk; the page does not say Dusk has ended, so the status stays accepted and no successorOf is recorded; the comparison sentence is the alternativeTo pest entry. The maintainer is the copyright holder named in LICENSE.md, Taylor Otwell. Laravel Holdings Inc. appears in the laravel.com privacy policy as the company that operates the services it owns, and no page says it holds the Dusk copyright; no legal entity or country is recorded for Dusk, so hqCountry is absent. basedOn Laravel is not recorded: the docs name the package Laravel Dusk and describe its Artisan command, but no sentence calls it a Laravel package or binding. The Continuous Integration section of the testing docs names Heroku CI, Travis CI and Chipper CI, which are CI services, not fields. The ecosyste.ms dependent counts are for the Packagist package laravel/dusk. The Packagist total of 45239461 is read on 2026-11-16 and replaces the CSV's 43.9M figure. firstRelease 2017 comes from the Packagist version v1.0.0 dated 2017-01-22, the oldest GitHub tag as well; the repository was created in December 2016.
