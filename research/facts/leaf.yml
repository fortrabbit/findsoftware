notes: >
  The homepage lists more databases (adds MariaDB and SQL Server) than the database docs page shows examples for; both are recorded. "Leaf Billing" is a module for apps built with Leaf, not a paid edition of Leaf. The Packagist figure covers only the core package leafs/leaf; the MVC starter is leafs/mvc (9369 total downloads). The project credits one creator and is funded through Open Collective with no company named, so maintainerType is community. Coined fields: sponsorship (funding URL), blog (official blog URL).
