notes: >
  The homepage pagekit.com has no DNS record (curl and host both fail to resolve it), so the project's own site is dead and no homepage is recorded. The README links the homepage over plain http, and the docs at pagekit.com/docs are unreachable too; the install steps the README gives are the only documentation read. Status is discontinued on two signals: the GitHub repository pagekit/pagekit is archived, and the Packagist package pagekit/pagekit is flagged abandoned. A dead homepage alone would make the record a stub, so the archived repository is the decisive signal here; a reviewer may choose stub instead. The README calls the project built with Symfony components and Vue.js; these are libraries it uses, so no basedOn is recorded. The README names an unofficial forum at pagekit-forum.org, which is not the project's own, so it is not recorded. The Packagist downloads figure is the total since release; the monthly figure at the same endpoint is 27. The latest stable release is 1.0.18 (2020-01-20), and the composer.json of that release requires PHP >=5.5.9.
