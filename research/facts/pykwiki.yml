notes: >
  The homepage http://pykwiki.nullism.com, linked by the README, the PyPI package and the GitHub repository, does not resolve in DNS (checked 2026-10-23), and the 1.x docs at http://pykwiki-classic.nullism.com do not answer either, so no homepage is recorded and the status is stub under AGENTS.md. The install steps are in the README (pip install pykwiki) and the 2.x docs are in the repository under docs/source, which the status fact cites. The repository has no GitHub release or tag; currentMajor and latestReleaseDate come from the PyPI package pykwiki, whose latest version is 2.2.0, as the README's "latest version (2x)" wording also states. GitHub reports the repository language as HTML; the language field records Python from the PyPI package summary ("A simple pure-python wiki engine") and setup.py. The docs describe a cache command that builds HTML from the Markdown source and a static keyword search done in JavaScript. The docs source describes an upgrade command from 1.x to 2.x; the 1.x version is not recorded as a separate record. The README lists SASS as a feature of version 2 and later, and the docs webserver page shows serving the docroot directory with Apache or Python's built-in HTTP server.
