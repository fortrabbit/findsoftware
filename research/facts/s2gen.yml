notes: >
  The homepage is a page of the author's own site, appliedscala.com, which answers over https and names s2gen; it is recorded as the homepage because the README links the project from there and no separate project site exists. The first release is v0.2.1 (2016-03-24) from the GitHub release list, which has 17 releases; the highest stable release is v0.3.9 (2022-08-11), and no prerelease is listed. The README names JRE8 as the requirement; no later Java version is stated. The embedded Jetty server runs in monitor mode, and the README states that the -once and -noserver flags change that, so the server is recorded as local only. The maintainer is the copyright holder named in LICENSE. The README lists the site's Freemarker templates and the custom and XML templates, which are not recorded as fields. The I18N support is recorded as i18n yes from the README section.
