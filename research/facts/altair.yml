notes: >
  Boundary ruling (wave 55): accepted, because the project's own pages say the output is HTML. The save page says "save a chart directly to an HTML file", that the file "loads Vega, Vega-Lite, and vegaEmbed", and that "when opened in a browser the chart will be rendered"; the display page names an html renderer and a browser renderer. The HTML output is a coined output format and is kept here, not as a field. The CSV row still reads boundary and needs a reviewer update. basedOn: the README says Vega-Altair is built on the Vega-Lite grammar and asks users to cite "the Vega-Lite project, which Vega-Altair is based on". vega-lite has a candidate row but no fact file yet, so basedOn is not recorded; add it once vega-lite is researched. The homepage says the project "is not affiliated with Altair Engineering, Inc.", a separate company with a similar name. The PyPI package name is altair and the GitHub repository is vega/altair. The LICENSE copyright line reads 2015-2025 while the site footer reads 2015-2026; both name Vega-Altair Developers. Contributors excludes anonymous contributors. The PyPI figure is pypistats last_month, the rolling 30 days to the read date. The earliest PyPI upload is version 1.0.0rc1 dated 2016-07-09, a prerelease, which sets firstRelease. The installation page also names pip install "altair[save]" for offline HTML and image export; it is the same pip route and is not recorded as a separate install method.
