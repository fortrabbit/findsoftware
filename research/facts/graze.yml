notes: >
  The CSV row links a personal blog post by the maintainer (mikaelkoskinen.net, reached over http and redirected to https), not a project site, so no homepage is recorded; the reviewer decides whether that post counts. The repository's GitHub license field is null, but the readme.md carries an MIT license section with the copyright line. The only GitHub release is 7.0.0 (2018-03-25), the highest stable NuGet version too, so currentMajor and latestReleaseDate come from it; the NuGet package by the same author and repository carries 1.0.0 from 2012, so firstRelease comes from NuGet, and the newest pre-release is 9.0.0-rc2 (2021-03-28). The tags 2.0.0 and 3.0.0 have no release page. The README says the Windows graze.exe is run and that the latest version targets .NET Core 3.1 and .NET Standard 2.0, which is recorded as the runtime quote; no runtimeMin is recorded because the README does not state a minimum for the release. The NuGet count is the total downloads of the graze package. The repository was last pushed on 2020-03-08; the latest release is from 2018, so the stub rule in AGENTS.md applies to the import without a status change here.
