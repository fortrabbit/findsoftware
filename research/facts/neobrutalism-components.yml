notes: >
  Boundary answer (commit-date rule applies): the repository has no GitHub release and no tag, and no npm package (the npm lookup returns Not found). Criterion 4 is judged by the default branch's newest commit, 2026-09-14, which is the rule for projects without a release; the repository's pushed_at is 2026-09-19, a later push that the commits listing does not return as the head commit. Criterion 2 holds through the project's own registry: registry.json in the repository lists the components, and the docs install them with the shadcn CLI or by copying the component source. The sources are the repository and the project's own site. The changelog's "July 2023: First version of the project" is the firstRelease. The homepage's "Built on shadcn/ui and Base UI" and "for React and Tailwind v4" are the basedOn statements; the description names Tailwind components too. The homepage links the author's X account, which is recorded as x. The GitHub commit count is 10 contributors across all pages. Component pages link the shadcn docs where one exists, the variants differ from the default shadcn components, and a component page without a CLI command is installed by hand.
