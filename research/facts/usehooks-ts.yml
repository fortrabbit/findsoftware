notes: >
  Boundary ruling for this wave: a hook and composable utility library is accepted like lodash, and basedOn react rests on the README sentence "is a React hooks library". The README and docs state no runtime, so runtime and runsAs stay out; the npm engines field (node 16.15.0) is not recorded because the package is a React library for browser code. Stars and contributors belong to the repository, which holds one npm package tagged as usehooks-ts@<version>. The first GitHub tag is from 2021 and the npm package was created in 2021, so firstRelease is 2021. The README usage example imports named hooks from the package, and the docs site lists the hooks on their own pages with a "Migrate to v3" page; no end signal. The homepage answers over https and lists the same hooks as the README. The README credits the project to Julien Caron and a team of contributors; the maintainer is taken from the LICENSE copyright line only. The GitHub contributors count is taken with anonymous contributors excluded. npmWeeklyDownloads is the sum of the daily figures for 2026-11-01 to 2026-11-07 from the npm downloads range endpoint, the period stated in the value.
