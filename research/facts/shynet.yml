notes: >
  No project website is recorded: the repository has an empty homepage field and the README links only its own GitHub pages and the maintainer's personal site (miles.land), so homepage is not-found. The status is accepted: a web analytics tool that its own README describes as self-hosted, with an install guide and releases in 2026. The README names Django as the framework it is built with, so basedOn is django, which is a record id. The README also names a17t, an atomic design library the project is built with; it is not a record and is not basedOn. No page names Python as a runtime, so runtime is not recorded; the language field is Python. The README and GUIDE state the product's privacy properties: "Modern, privacy-friendly, and cookie-free web analytics" and "It works without cookies", that DNT is respected per service (FAQ), and that GDPR compliance "depends on how you use it". The attachment method is a tracking script with a 1x1 pixel fallback (README: "JavaScript not required" and "a 1x1 transparent tracking pixel"), a coined kind, so it stays here: embedMethod script tag and pixel. The GUIDE documents a primary-key integration, a server-side script URL per user, and a Shynet.newPageLoad() call for single-page applications. The GUIDE names PostgreSQL or SQLite as the database; the README says Redis caching and Celery workers are used for multi-instance deployments, which is a cache and queue, not a database, so they are not in databases. The GUIDE's API section documents a read-only dashboard endpoint with token authentication: that is a REST API for reading the dashboard data, not a headless content API, and it is recorded as headlessApi rest on the strength of the GUIDE's own "API" section. The account system is Django Allauth; the README names no login protocol, so sso is not-found. Multiple users and multiple sites per instance are in the README (Features, Workflow), but a multisite field describes a network of installs, so it is not recorded. The GUIDE says the Heroku free Postgres addon cannot hold a busy instance; that is a hosting statement, not a field. The roadmap (rollups, anomaly detection, two-factor authentication) is planned and is not recorded. The Docker Hub figure is the pull_count of milesmcc/shynet at the checked date. Stars and contributors are counted across all contributor pages. The Apache-2.0 license is the same statement in the LICENSE file (Apache License, Version 2.0). The runsAs quote is the GUIDE's "Launch your webserver by running", the process model that the docker run line starts.
