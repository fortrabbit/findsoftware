notes: >
  Hosted service: the API renders in Urlbox's own cloud. The only self-hosting route the site names is "On Premises" (pricing table) and "US, EU, or on-premise deployment options" (homepage), which needs a sales contact, so the record stays hosted-service and selfHostOption is unknown. The API is at api.urlbox.com (POST /v1/render/sync per the API reference) and the quick start calls it a JSON-based REST API; the webhooks page describes receiving a notification when a render is generated, which is the wiring a site uses. The webhooks page is not recorded as a field. The SDK repository urlbox/urlbox-node (MIT, 26 stars, not archived) and its npm package urlbox are client libraries and are not recorded, per the hosted-service rule. The pricing table lists team members per plan (10 and 20), a seat count, so userRoles is unknown. No SSO, role or i18n statement was found on the homepage, pricing page, quick start, API reference or terms; those pages were read, not every docs page. The About page says Urlbox has turned HTML into screenshots since 2012; that year is recorded as firstRelease, the service start. The security page names SOC 2 Type II attestation and GDPR compliance (compliance is a coined kind, noted here only). The terms name Urlbox Ltd, registered in England and Wales (company number 08267269), with its registered address in Leeds, England; no other legal entity is named. The API reference documents the render endpoint as a POST request that accepts JSON or form data.
