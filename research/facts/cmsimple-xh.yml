notes: >
  The CSV row gives http://www.cmsimple-xh.org; the homepage answers at https://www.cmsimple-xh.org/ and that address is recorded. No legal entity maintains the project: the legal notice names two individuals as responsible for the content and the XH-Team page describes a team of program developers, so maintainer is not found and maintainerType is recorded as community from the team statement. The legal notice gives addresses for those two individuals, which are not recorded. The site states the license as GPL3 and links it to the GPL-3.0 text; GitHub reports no license for the repository (license null), so GPL-3.0 rests on the site. The repository language is JavaScript on GitHub while the project is a PHP application; the CSV row says php. The site states "A database is not required" and "All data is simply stored in the file system", so contentStore is flat-file and databases is not recorded. The XH-Story page says Peter Harteg allowed CMSimple to be developed further under modified names, which created a number of forks, and that a group of CMSimple enthusiasts began CMSimple_XH in 2009; it never calls CMSimple_XH a fork, so forkOf is not recorded. The classic CMSimple by Peter Harteg has no candidate row here. The Requirements page and the homepage both state PHP 7.4 as the minimum. The repository was last pushed 2025-08-13 and is not archived; no end signal applies.
