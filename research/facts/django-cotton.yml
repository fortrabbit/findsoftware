notes: >
  The homepage's Discord link is recorded as discord; the homepage has no X, Bluesky, Mastodon or newsletter link. The maintainer is the author named in pyproject.toml at the 2.8.0 tag and on the PyPI page; the LICENSE copyright line reads "Copyright (c) 2023" with no name, and no legal notice or imprint was found, so the name is recorded as the project states it with no legal form. The GitHub owner wrabit is a user account. firstRelease is the oldest PyPI upload (0.0.2, 2024-01-30), which predates the GitHub repository's creation date (2024-06-08). runtimeMin is the python constraint in pyproject.toml at the latest release tag; PyPI requires_python states the same range. pyproject.toml also requires django >=4.2,<7.0 for the package; that is a dependency range, not recorded as a field. The ecosystem page lists django-cotton-ui, an optional component kit that is a separate package; it is not recorded as a fact of this record. The ecosystem page is a listing of third-party projects, recorded as pluginDirectory. PyPI JSON carries no download counts, so pypiDownloads comes from pypistats.org, as in other Python records. contributors counts contributor accounts from the API list with per_page=1, read from the Link header. dependentPackages and dependentRepos are zero on ecosyste.ms for the PyPI package.
