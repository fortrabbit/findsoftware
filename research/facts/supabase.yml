notes: >
  The GitHub repository is a monorepo; its releases/latest is v1.26.08 (2026-08-07), while the self-hosted stack is versioned by the tag self-hosted/v0.8.3 (2026-10-16, from the tag object). latestReleaseDate follows the self-hosted tag because the docs point to it; the monorepo release line is not recorded. currentMajor is not recorded for the same reason. The pricing page prints dollar signs with no currency code, so currency is recorded as printed. Fields coined here: none.
