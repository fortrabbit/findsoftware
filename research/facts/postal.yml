notes: >
  No homepage is recorded: postalserver.io answers with a 301 to github.com/postalserver/install, the repository of the installation helper, so the docs site at docs.postalserver.io stands as the docs link. The docs source is github.com/postalserver/docs, which the docs edit links name. The HTTP API takes JSON over HTTP (the docs do not call it REST): POST requests to /api/v1 endpoints send messages, authenticated by an X-Server-API-Key header (developer/api page; apiStyles is not a dictionary field, so the style goes to notes). The project's webhooks page lists events sent to HTTP endpoints, and the receiving-by-HTTP page describes incoming mail posted to an application's own URL; these are the wiring of a website or app to the software, and the coined webhooks field is not in the dictionary. Postal runs as containers from ghcr.io/postalserver/postal, so no runtime is recorded for the host; the runtime inside the image is Ruby, from the repository language. The prerequisites page says MySQL is not supported in place of MariaDB, so only mariadb is recorded. The releases list holds 2.0.0-beta.1 (2021-08-01) as the oldest entry, which sets firstRelease, and no prerelease newer than 3.3.7. Per the copyright lines in MIT-LICENCE, the 2024 copyright holders Adam Cooke and Charlie Smurthwaite are individuals, not the maintainer. Krystal Hosting Ltd is named as a sponsor on the docs home page (supported by krystal.io), which is not a fact field. The FAQ describes Postal as a mail transport agent and not a mailing list manager. Contributor count is the non-anonymous page count of the contributors endpoint. The API reference says each mail server has its own API credential, and the prerequisites page says Postal provisions a database for each mail server. The installation page says the helper generates the configuration files and that the containers start with postal start.
