notes: >
  The homepage says the software is developed in Switzerland, which describes development rather than the company headquarters, so hqCountry stays unknown. The homepage says "Already trusted by over 1,800 servers, totaling more than two million users" (README too); this is a self-reported figure with no date or method, so it is not recorded. The extension marketplace is market.azuriom.com, linked from the Extensions menu; the docs page does not explain how extensions are installed, and the market shows no paid tier on the pages read. The homepage names NiHost as a hosting partner, with no description. Games are a native list in the README (twelve games), not a field. The license is GPL-3.0 on GitHub and GPL-3.0-or-later in composer.json; both are the same grant with the "or later" option, so the value reflects the file that says it. The field webServer is coined here because the starter list has no web server field.
