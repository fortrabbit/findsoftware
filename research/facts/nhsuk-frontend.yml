notes: >
  The github.io page is a design system preview environment for the main branch, and it is the project's own site; the NHS digital service manual at service-manual.nhs.uk hosts the component guidance and examples the README points to, and no fact is taken from it. The npm install route needs Node.js 20.9.0 or later and Dart Sass 1.77.6 or higher, which are build-time requirements for a user's project, so no runtime or runtimeMin is recorded; the precompiled-files route needs neither. The installation docs state they are adapted from the GOV.UK Frontend documentation of the Government Digital Service; that is documentation origin, so no basedOn is recorded. The README says the documentation is © NHS England under Open Government 3.0, which covers the documentation only and is not recorded as a license; the codebase is MIT. The npm range is 2026-10-18 to 2026-10-24. The maintainer is NHS England as the LICENSE copyright line and the README name it; no legal form or country is stated on a page read. The npm figure counts downloads of nhsuk-frontend, the package the install docs name. The latest GitHub release v10.7.0 is dated 2026-10-27 and matches npm latest; the GitHub prerelease list's newest entry is v10.0.0-internal.4 (2025-08-22), older than the latest stable release. The npm dist-tags beta 6.2.0-beta.0 and alpha 7.0.0-alpha.2 are npm tags, not GitHub releases, and are not recorded.
