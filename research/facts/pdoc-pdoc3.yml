notes: >
  The GitHub release list holds one release, 0.3.11 (2019-01-24); the tags run to 0.11.6, which is the latest PyPI release (2025-03-20). Both have major 0, so currentMajor is 0 from the GitHub release. latestReleaseDate comes from PyPI because the GitHub release is older. The docs page says "pdoc requires Python 3.7+.", while the PyPI metadata for 0.11.6 says >=3.9; runtimeMin follows the latest release. No page names a maintainer person: the maintainer is the GitHub organization pdoc3, and the README links the sponsor page of kernc. pypiDownloads is the last_month figure from pypistats.org. devServer is a coined field, recorded here from the README. The GitHub language field reads Python, which no page states, so language is not recorded. The maintainer is the GitHub organization pdoc3 because neither the README, the docs page nor the LICENSE file names a person or a copyright holder. The scope note in the candidate row is an API reference generator, and the project's own site and README describe it as such. The record uses the pdoc3 PyPI name. The docs page names the license as "GNU AGPL-3.0 or later"; the GitHub API reports AGPL-3.0 and both statements are recorded.
