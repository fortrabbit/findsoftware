notes: >
  Stub: the source is not public (criterion 2), and the installer copies the editor's admin files into the user's site from stastic.net, so it cannot be judged from the pages whether those files are a distributable the user can obtain; a public source release, a downloadable editor package, or a clear hosted-only statement would settle it. The newest blog post on the homepage is dated 2019-12-18, and no release, changelog or end statement was found; the blog is not a signal of end under the criteria, so it is recorded here only. Only the maintainer and the governing-law address are in the terms; no legal form is stated, so the maintainer is recorded as the terms name it. The "free" hosting claim is on the about page and no prices were recorded. The CSV lists no repository, and the docs state that GitHub Pages hosts the sites.
