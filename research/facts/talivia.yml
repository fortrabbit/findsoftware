notes: >
  Attaches to a site with a tracking script: "Copy its tracking snippet into your site" (README, https://github.com/talivia-group/talivia/blob/main/README.md). Session Replay, revenue attribution and payment-provider inputs (Stripe, LemonSqueezy, Polar, Dodo, Yolfi, a Manual Payment API) are features of the self-hosted edition, recorded here only as notes: no field is coined for them. The README says the open-source edition is "a self-hosted subset of the complete Talivia product"; Talivia Cloud adds Google Search Console, Bing Webmaster Tools, GitHub activity and social mentions, so those are not facts of the self-hosted record. The MCP endpoint and the Agent Kit (npx -y @talivia/agent mcp) are a separate open-source package and a hosted endpoint, not recorded. The repository has a single release, v1.0.0 (2026-09-24), and its repository was created 2026-07-29. The alternativeTo values come from the vendor's own alternatives page; the page also names Usermaven, DataFast, Google Analytics and Simple Analytics, which have no record id in research/facts and are not recorded; Rybbit and OpenPanel are recorded. The repository description calls it a "datafast alternative", which is not a project page and is not recorded. The footer links to terms and privacy pages (talivia.com/terms-of-service, /privacy-policy) name Dubai, UAE only as the governing law, not as a headquarters, so hqCountry is left unknown and no legal entity is named. The installMethod "pnpm install" is the local-development route from the README. runsAs is unknown: the README shows no process-model statement, only a port and a Compose start.
