notes: >
  The product is named Xperience by Kentico on its own pages; the candidate row says Kentico Xperience. Closed source: no product repository exists. Kentico's public GitHub repositories (migration tool, Lucene, KenticoPilot, samples) are add-ons and samples, not the product, so no repository or repository figures are recorded. No page names a programming language for the product, so language is not recorded beyond the runtime. The NuGet package the install docs name is the project templates package Kentico.Xperience.templates, a scaffolder; the registry figures come from Kentico.Xperience.WebApp, which the NuGet packages page describes as required to run Xperience in ASP.NET Core applications. The earlier CSV figure (559.6k total) was for version 31.9.3; the current total is recorded with its date. firstRelease is the first version of Kentico.Xperience.WebApp on NuGet (22.0.0, 2022-07-01); the 13.x line (Kentico.Xperience.Libraries 13.0.218) is a separate legacy line and is not recorded here. The installation page states the .NET runtime range as .NET 8 through .NET 10. The project's own docs address the reader directly in several places, and the installation page carries instructions aimed at an AI assistant about asking a user for a license key; those are not facts and are not recorded. The product's homepage is the company site, and the product section is at kentico.com/platform. Subscriptions for private cloud and SaaS are commercial. The EULA names no prices, and the pricing link is to the how-to-buy page only. The Kentico Xperience docs say numbered collections are legacy versions, so version 13 documentation is not used for any fact.
