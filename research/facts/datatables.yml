notes: >
  The CSV row names DataTables/DataTables, a repository the README calls a legacy repo; its main source repo is DataTables/DataTablesSrc, so the repository field is DataTablesSrc, with 813 stars and 95 contributors. The legacy repository has 7,389 stars, 23 contributors, one release (2.3.7, 2026-01-30) and 53 tags back to 2010; these figures are not recorded. The http:// homepage in the CSV redirects to https://datatables.net/, so the https address is recorded. The legacy README says "DataTables is a table enhancing plug-in for the jQuery Javascript library", but the current installation page says "DataTables is dependency free (as of v3, previously jQuery was required)" and the homepage says "dependency free"; because the project's current statements disagree, no basedOn is set and the jQuery link is left to a reviewer. The licensing page lists GPL v2 and BSD (3-point) for DataTables 1.9 and older; those are older licenses and go here rather than to the license field. The DataTables Plus suite (CardView, Editor and other premium extensions) is under a commercial license and is recorded as a paidEdition, following the AG Grid precedent; a reviewer should confirm that rule. The npm package datatables.net 3.1.5 was published 2026-10-30 and is the registry major 3, matching the GitHub release. The npm styling package datatables.net-dt is named on the installation page; the core package is datatables.net. The HTTP Archive figure is the mobile origin count for DataTables, the desktop count is 86,359. The npm figure is the range 2026-10-26 to 2026-11-01; the CSV figure of 389.5k a week is a stale point count. The firstRelease year comes from the oldest tag in the legacy repository, dated 2010-08-17. The homepage's footer names SpryMedia Ltd as the designer and creator; the sprymedia.co.uk contact page does not state a country, so hqCountry stays unknown. The homepage states "Commercial support" for the Plus suite and links support options; no price is recorded.
