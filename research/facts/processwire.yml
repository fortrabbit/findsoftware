notes: >
  The release on GitHub is a tag only, with no GitHub release object, so latestReleaseDate is the Packagist version time of 3.0.259. GitHub detects no license (NOASSERTION); the license entries come from the license page and Packagist. The core has MPL-2.0 as its default license and some MIT components where a file header says so. firstRelease is left out: the about page says ProcessWire "was released as an open source project in October, 2010" and also dates ProcessWire 1.0 to 2006, so the reviewer decides which year the record shows. The docs and install pages name MySQL and MariaDB only; the SQLite and PostgreSQL support in the 25 September 2026 blog post is on the dev branch (3.0.274), not in the master release, so it is not recorded as a database. The Pro Shop sells first-party paid modules; they are add-ons, not an edition of the software, so paidEdition stays out. The install page's "PHP 8.x is recommended" is a recommendation; runtimeMin is the minimum the page and Packagist state. The per-request value follows from the template page's description of PHP execution, not from a page that names the hosting model. The composer.json author is Ryan Cramer; the project names itself as the maintainer, so the record uses ProcessWire. The Wikidata P856 link is processwire.com. The Packagist downloads figure and package name come from processwire/processwire, the package the install docs name.
