notes: >
  The repository is a monorepo; the install docs name the core package @ui5/webcomponents, which is the registry id used for figures. The site footer names SAP SE as the copyright holder, and the npm author field names SAP SE. The docs say the packages are ES6 modules published on npm, that each application imports and bundles only the components it uses, and that there is no CDN, so no cdn route is recorded. The README says the project is created and maintained by SAP as part of the UI5 product family. The README says the framework is usable with any web development framework, and the homepage lists Angular, React, OpenUI5 and Vue; none of these is a parent, so basedOn is not recorded. The repository's built-in framework is described only as lightweight, so no runtime is recorded. Version 1 is the legacy line on the docs site ("Version 1 (Legacy)"); the highest stable release is in the 2.x line, and the newest stable 1.x tag (v1.24.32) is older than v2.28.1 on the semantic version, but a 2.24.3 tag was published on 2026-10-27. latestReleaseDate is the npm latest tag date for 2.28.1. The newest prerelease (v2.28.0-rc.0, 2026-10-15) is older than the latest stable release, so no latestPrereleaseDate. The hqCountry for SAP SE is unknown until the legal notice page can be read.
