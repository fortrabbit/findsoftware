notes: >
  The main-branch README says official builds (binaries, packages and container images) are available under "a modified Apache 2.0 license", which is the POMERIUM-COMMUNITY-LICENSE-1.0 file. That file says it governs official pre-built binaries and container images released after November 1, 2026, and it limits free use to organizations under US$10,000,000 gross revenue and fewer than 100 personnel. The v0.33.6 tag README has no license section, and v0.33.6 was released 2026-10-27, before that date, so the latest release carries the Apache-2.0 LICENSE only; the community license is therefore not recorded as a license fact, and licenseModel follows the latest release. The source code is Apache-2.0 on the LICENSE file. No commercial price is recorded. Pomerium Core is described on the deploy page as "the primary server component in a self-hosted environment". The docs version switcher on the deploy page shows "Latest stable (v0.32)" while GitHub lists v0.33.6 as the newest stable release; currentMajor is 0 from the GitHub release, and the 0.33 minor line is not recorded as a field. Pomerium Zero's pricing shows plans billed per user; no prices are recorded. Pomerium's comparisons index lists thirteen tools, such as Microsoft Entra ID Application Proxy, and only the NGINX + OAuth2Proxy page names a project with a record, as a pairing with NGINX rather than a single alternative, so alternativeTo stays empty. The Go SDK and JavaScript SDK are linked from the homepage, along with a Kubernetes ingress controller and a Terraform provider; sdkLanguages and the other ecosystem parts are coined and kept here. The databroker setting also lists memory and file backends; the PostgreSQL option is the one recorded under databases. The LinkedIn and YouTube homepage links are not recorded as fields.
  The README says Pomerium "builds secure, clientless connections to internal web apps and other services without a corporate VPN." The deploy page says "Pomerium Core (often referred to as Pomerium Open Source) is the primary server component in a self-hosted environment." The pricing page says "Every plan uses a self-hosted data plane to handle application traffic in your environment."
