notes: >
  firstRelease is the year of the oldest GitHub release (v0.3.0, 2013-07-02); the npm versions from 2011 belong to an unrelated earlier package named react. runtime lists node only, since browser is not a runtime value; runsAs holds browser.
  Highest stable GitHub release is v19.3.1 (2026-10-14), so currentMajor is 19. The npm package react is 19.3.1 with MIT and no deprecation flag; its engines field is ">=0.10.0", which is not a runtime minimum, so runtimeMin stays unknown. The homepage describes the library as for "web and native user interfaces"; native rendering is React Native, a separate project that the docs link to, and is not recorded here. The installation page names Create React App as deprecated; that is a separate project and not an end signal for React. The learn page recommends full-stack frameworks (Next.js App Router, React Router, Expo, TanStack Start, RedwoodSDK); each is its own record, and no basedOn is recorded for React.
