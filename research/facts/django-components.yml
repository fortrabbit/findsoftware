notes: >
  The install page names pip install django_components; PyPI normalizes the underscore, so the registry name is django-components. The PyPI JSON endpoint returns -1 for every download period, so pypiDownloads is the last_month figure from the pypistats API. runtimeMin 3.10 is the lower bound of the requires-python field on PyPI (>=3.10, <4.0), which matches the classifiers in pyproject.toml. The project's homepage at the root redirects to docs/, and the /latest/ path returns 404 at the time of reading, so the docs/ page is recorded. The docs source repository holds only devguides, so the installation page is read from the published site. The LICENSE file's copyright line names Emil Stenström (2019); pyproject.toml lists Juro Oravec as a second author, not recorded as maintainer. firstRelease is 2021, the earliest PyPI upload (0.9, 2021-02-16); the oldest GitHub release is 0.67 (2024-04-17). The README names Django as the framework it is built for and the classifiers name Django, so basedOn Django is recorded from the README wording. The Discord invitation is the README badge. No renderingModes or runsAs is recorded: neither the install page nor the README states how the site runs. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header. The installation page says to add django_components to INSTALLED_APPS in the Django project's settings. The plugins page is a catalog of community plugins and extensions.
