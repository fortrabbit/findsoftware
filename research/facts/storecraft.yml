notes: >
  No GitHub releases exist; the npm latest version 1.4.2 is used for currentMajor and latestReleaseDate (the npm publish time of that version), and the repository tags end at v1.4.2. The LICENSE.md file calls itself "a custom open source semi-permissive license" and reserves all rights, bars offering the software as a service or product, and bars a public cloud product or hosting based on it without permission; the homepage and the README call the software "Open Source", which is the project's own wording and is not a license statement, so licenseModel follows the license file (source-available). The npm metadata for @storecraft/core says "MIT (With special clause...)" and repeats the cloud restriction; it is recorded here only, as the LICENSE file wins. The install docs name npx storecraft create, a scaffolder, and the repository is a monorepo, so the npm figure is taken from the core package @storecraft/core (60 downloads in the week to 2026-10-18); the unscoped storecraft package has 34 downloads that week and is not recorded. The docs call the platform "Serverless" or "Serverfull", and the Node.js example starts an http server on port 8000; runsAs records the serverful case only. The README lists PayPal, Stripe and RazorPay payment gateways, an AI chat endpoint with OpenAI and other LLM providers, and vector stores; these stay in prose only and no field holds them. The README names REST, a VQL query language and an event system; VQL is not a field. The docs list social login for Google, Facebook, X and GitHub; no page names SAML, OIDC or LDAP, so sso is left out. The JWT docs show an "admin" role in tokens and the API key docs say roles for keys are planned, so userRoles is left out. The maintainer is named in the LICENSE.md copyright line, with no legal form; the record uses the name as the file states it. The README names an author's personal X account and a LinkedIn page for the project; neither is recorded as a project field, and no forum, chat or newsletter link was found in the README or on the homepage.
