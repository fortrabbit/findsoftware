notes: >
  The record covers the hosted Ably service. The SDK repository github.com/ably/ably-js and its npm package ably are client libraries, not the service's repository, so no repository, license, stars or npm figure is recorded, following the hosted-service rule. No open-source server or self-install was found on the homepage, the pricing page, the docs or the security page, so selfHostOption is unknown. The pricing page lists a Free plan, paid Standard and Pro plans with usage pricing, and an Enterprise plan; the plans are hosting tiers, so no paidEdition is recorded and no prices are recorded. The security and compliance page (https://ably.com/security-and-compliance) states SOC 2 Type 2, a HIPAA BAA and EU GDPR compliance; these are compliance claims with no field and are kept out of the file. The about page says Ably launched in 2016; the firstRelease fact uses that launch year. The homepage also links a YouTube channel, a LinkedIn company page and the github.com/ably organization, which have no field in the file. The homepage's Discord link is discord.gg/g8yqePUVDn, and the homepage's X link is x.com/ablyrealtime.
