notes: >
  The homepage ohmyform.com, which the repository lists as its homepage, did not answer on 2026-11-03: HTTP/2 PROTOCOL_ERROR and an empty HTTP/1.1 reply, so no homepage is recorded and the docs at ohmyform.com/docs are unread. The repository is archived (API archived true, last push 2024-10-31) and the README opens with the project's end statement and a recommendation to move to Formbricks; both signals are recorded as status facts. The README recommends moving to Formbricks; that is a recommendation, so no successorOf is recorded. The README does not say OhMyForm is a fork of TellForm, so no forkOf is recorded; only the repository description names TellForm as an alternative. The README feature list names a "Forms as a Service API", webhooks on submission, customizable notifications and embeddable forms; these are recorded in notes only (no field for them). The README also names PostgreSQL and sqlite, and Multi-Language Support as a feature. The repository description names TellForm as well as TypeForm and Google Forms; only TypeForm is quoted from the README. Contributors are counted without anonymous contributors (per_page=1, last page). The maintainer is the GitHub organization, since the LICENSE file carries no copyright line and no page names another.
