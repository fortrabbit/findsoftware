notes: >
  No project website exists: the repository's homepage field names a freek.dev blog post, the author's site and not the project's own, and spatie.be has no page for this package under its open-source list. The README names the Laravel integration (laravel-image-optimizer), a WordPress WP-CLI command and a SilverStripe module; each is a separate package by another author and is not recorded. The README says the optimizer binaries (JpegOptim, Optipng, Pngquant, SVGO, Gifsicle, cwebp, avifenc) are installed separately and the package uses whichever are present on the system; runsAs is not recorded because no page states where the package runs. The README warns that "SVGO can break your svg", which is in the Worth knowing section of the prose. The MIT license statement is recorded from the composer.json at tag 1.10.0 and from the LICENSE copyright line; both say MIT. The maintainer is Spatie bvba from the LICENSE copyright line; the company's address and country come from the open-source page, which names Antwerp, Belgium. The author in composer.json is Freek Van der Herten, a person named as Developer; the maintainer is recorded as the company, per the copyright line. The oldest GitHub release is 0.0.1 from 2017-07-02, which matches the oldest Packagist version. The Packagist total download figure has no period other than total; the monthly figure on the same page is not recorded. The PHP minimum is the lowest bound of the composer.json requirement at tag 1.10.0; the requirement lists php ^7.4 or ^8.0, so 7.4 is the lowest supported minor.
