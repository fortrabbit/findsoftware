notes: |
  The README glossary names one primary server that keeps time and runs the scheduler, worker servers that wait for jobs, and backup servers that take over when the primary dies. The install guide places the install under /opt/cronicle, is limited to POSIX systems (Unix, Linux and macOS), and starts the service with bin/control.sh. The README says Cronicle "will continue to receive maintenance, primarily bug fixes and security patches", while xyOps is named as the place for new features. Boundary question, settled as accepted: the README lists a "Simple REST API for scheduling and running events" and "API Keys for authenticating remote apps", and the API reference says API keys "allow you to register external applications or services to use the REST API", with calls that schedule and run events. The README also lists outbound web hooks for external notification systems. The API serves a scheduler, not a website, so a reviewer should confirm the call. The xyOps product (xyops.io, docs.xyops.io) is named on the README as "the next generation of Cronicle" by the same creator; the README also says Cronicle "will continue to receive maintenance", so no end signal is recorded. The package.json license reads "MIT" and the LICENSE.md reads "The MIT License (MIT)": one entry. GitHub reports the license as NOASSERTION, which is recorded as unknown on the API side. The repository's release v0.9.142 is the latest stable release; the oldest release is v0.0.1 published 2016-01-08. Plain-http homepage: the repository's own metadata names http://cronicle.net, which answers over http too, but https://cronicle.net answers 200 and is the one recorded. The README's company list names Agnes & Dora and Sling TV ("known to be in use by"), not recorded as a field. The package is private in package.json and is not on npm, so no npm figure is recorded. The install page states the server runs as a service started by bin/control.sh, which is recorded as always-on. Plugins may be written in any language; no field holds that.
