notes: >
  Research row scope widened on 2026-10-19 from boundary: this record covers WebForms Core as one technology, with the browser library WebFormsJS (repository webforms-core/WebFormsJS, MIT, JavaScript) and the server-side WebForms classes (repository elanatframework/Web_forms_classes, MIT, one release v2.1.0) recorded as two repository facts. The homepage elanat.net answers over https and is the company site that publishes WebForms Core; the WebForms Core page on it is the product description. The highest stable release is v2.2.0 (2026-10-02), so currentMajor is 2. The WebForms Core page names these server-side implementation languages (a coined implementationLanguages list, kept here and not as a field): C#, Python, Java, PHP, Ruby, Swift, Elixir, Node.js, Go, Rust and AssemblyScript, followed by "and other web-oriented environments"; the repository holds the classes folders per language and the homepage names 18 programming languages in a news item title, which is not recorded as a count. The repository language is JavaScript. The first release is the oldest GitHub release of WebFormsJS (WebFormsJS_1.1, 2024-08-09), matching the 2024 introduction on the product page. The maintainer is named as Elanat in the LICENSE copyright line and the license page; no legal form or country was found in the about, terms or license pages, so hqCountry is unknown. The npm downloads endpoint for webformsjs returned a window (2026-06-25 to 2026-07-01) that predates the package's first publish (2026-09-08), so no download figure is recorded. The WebForms Core page describes the technology as inspired by a former Microsoft model only in the README and the about page; no basedOn or alternativeTo is recorded because the project names no parent. The category library follows the product page's own word for WebFormsJS; a reviewer may prefer ui-library. Contributors count is 1 for both repositories. Elanat's social links on the homepage are YouTube, Instagram and dev.to; none is in the fields list and none is recorded.
