notes: >
  The crates.io figure is recent_downloads, the 90-day count, so the period is part of the value; the all-time total is not recorded. The GitHub release v0.9.0-rc0 (2026-10-15) carries an rc tag but is not flagged as a prerelease by the API, so it is recorded as latestPrereleaseDate and not as the latest release; the stable release is v0.8.22. The homepage and the book describe CSR with Trunk and SSR with Actix-web or Axum; the SSR deployment guide (book.leptos.dev/deployment/ssr.html) deploys a server binary in a container and on Fly.io, and its first sentence describes deploying SSR apps to server or container hosting services, which is the source for runsAs always-on next to static for CSR. The runtimeMin is the rust_version of the latest release on crates.io. The homepage links a "Store" (leptos.square.site), which is not recorded as a fact. The homepage's video link goes to one YouTube video, not a channel, so it is not recorded. The Greg Johnston copyright is the only person named in the repository; the organization owns the repository. The book's Islands rendering guide exists but is not recorded as a renderingModes value.
