notes: >
  The license is stated two ways: the LICENSE file splits the code by directory (BSD-3-Clause outside wl/, the Weaviate License inside it) and the README table gives the same split per delivery; GitHub reports NOASSERTION, which is not recorded. The binaries and the Docker image combine both editions (README); the enterprise features need a license key. The Weaviate Cloud pricing page lists plan features such as "Baseline security with RBAC" and SOC 2 and HIPAA; plan features are not recorded as userRoles here (reviewer decision). The homepage links LinkedIn and YouTube; no field takes them. The homepage and privacy page name the monthly developer newsletter, but no newsletter URL was found on the homepage. The repository has 627 tags; the GitHub releases start in 2019, and firstRelease follows the oldest release. The tag v1.40.3 has no GitHub release, so the latest release (v1.40.2) is used. runtimeMin comes from the go directive at the v1.40.2 tag; the README says the server is built in Go. No page states the server run model in words, so runsAs is left out. Fields coined: none.
