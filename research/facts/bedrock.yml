notes: >
  Bedrock is a project template, not a WordPress plugin: basedOn names WordPress, which the template installs through the roots/wordpress Composer package. The Packagist constraint for php is >=8.3, recorded as the runtime minimum. The Roots organisation page describes itself as an independent open source org; the maintainerType value community is taken from that wording. The WordPress version pinned by the template is a dependency and not recorded here. The installed WordPress and Bedrock examples on the homepage show dot releases and are not used.
