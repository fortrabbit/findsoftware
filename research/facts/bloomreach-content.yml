notes: >
  Bloomreach Content is the hosted Content SaaS product (documentation at documentation.bloomreach.com/content), which the docs call a headless experience management platform. The Enterprise Installation guide on docs.content.bloomreach.com installs Bloomreach Experience Manager (XM), the on-premise product, which has its own records, bloomreach-xm and bloomreach-brxm; this record has no self-install guide of its own, so it is hosted-service and records no installMethod or selfHostOption. The product page lists Bloomreach Cloud (a managed platform) and on-premise deployments side by side; hostedOffering is a coined field and stays here. The hosting, REST, GraphQL, SAML and roles facts come from the Content SaaS documentation. The MSA names Bloomreach, Inc. as the contracting party for customers in the United States or Canada and Bloomreach B.V for customers elsewhere, with notice addresses in Mountain View, CA and Amsterdam; the privacy page footer copyright names Bloomreach, Inc. with no address. No license statement was found on the pages read, so license and licenseModel are unknown. The npm package @bloomreach/spa-sdk and the repository bloomreach/spa-sdk are SDK sources and give this record nothing. The external preview page describes sharing unpublished pages by URL, which is not recorded as livePreview. The pricing page lists no Content tiers, so no pricing facts are recorded. The company LinkedIn page is a coined field and is kept in notes. The compare pages on the site (vs Braze, Salesforce Marketing Cloud, SAP Engagement Cloud, Voyado) cover the marketing product and name no record id.
