notes: >
  Storyblok is SaaS only; no installable server part was found. The GitHub monorepo storyblok/monoblok holds the open-source SDKs and the `storyblok` CLI, so license, language, version and stars describe that repo, not the service. storyblok-js-client's own repo is archived (moved into monoblok) but the npm package is still published, at 7.7.7. The pricing table lists the GraphQL Content Delivery API only for Premium and Elite. Founders' surnames come from the about page profiles (Dominik, CEO; Alex, CTO); the page quote gives first names only. Coined `officialSdks` for the list of first-party client libraries, which every hosted service in this batch has.
