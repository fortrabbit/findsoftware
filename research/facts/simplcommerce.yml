notes: >
  The homepage is https (http redirects to https) and the README links its docs at docs.simplcommerce.com. Criterion 1 holds (a store system a creator installs and extends). Criterion 2 and 3 hold: the README gives the install steps for Visual Studio and for Mac and Linux with PostgreSQL, and a Docker image for testing only. The project has no stable GitHub release: its only tags are prereleases and older .netcore tags, the newest being v1.0.0-rc from 2018-06-16, so currentMajor and latestReleaseDate are not recorded and no registry release exists. The import will move the record to stub under the four-year rule on its own, so the status is left as the candidate row says; a reviewer decides whether that is wanted. The docs repository (github.com/simplcommerce/docs) was last pushed 2023-01-11 and its developer guide still names ASP.NET Core 3.1, so only the README and homepage are used for current versions. The maintainer is recorded as the project name: the homepage footer carries a copyright line with no legal form, and the LICENSE file has no copyright line. The homepage names OAuth 2.0 and OpenID Connect as integration features, which is not recorded as sso because it describes what the software offers other applications, not how its users sign in. No runsAs is recorded: no page the project controls states how the live site is hosted.
