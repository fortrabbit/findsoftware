notes: >
  The site https://absinthe-graphql.org, named by the README and the Hex package metadata, had no DNS on 2026-11-04, so the project's own hexdocs at https://hexdocs.pm/absinthe/ (served from absinthe.hexdocs.pm) stand in as homepage. The README says "Please see the website at https://absinthe-graphql.org" and its hexdocs pages answer. The GitHub API reports the license as NOASSERTION; LICENSE.md and mix.exs both state MIT. The LICENSE copyright line names Bruce Williams and Ben Wilson and the owner is the absinthe-graphql organization; the copyright line is recorded as maintainer. The README says "Absinthe requires Elixir 1.10 or higher", but mix.exs at the latest tag requires "~> 1.17", and runtimeMin follows the manifest at the latest tag. The first tag is validation-prototype dated 2015-10-23 and v0.1.0 dated 2015-12-29, so firstRelease is 2015. The CSV hex figure of 80.2k a week is stale; the hex total is recorded. No npm package is involved. The README says the schemas are defined with macros that build and verify their structure at compile time, that the entire query processing pipeline is configurable, and that the project implements the GraphQL Working Draft specification; the hexdocs installation page says that GraphiQL can be run from the application through the Plug and Phoenix integration. The README names Slack (#absinthe-graphql under the Elixir Slack account) next to the forum; Slack has no field.
