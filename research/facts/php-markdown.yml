notes: >
  The default branch is lib, not main, and the README and License.md are read from it. The project's own site michelf.ca answers over https (the http address redirects to it), so the https address is the homepage. The homepage says "This library package requires PHP 5.3 or later" and also "Requires PHP 7.4 or later" on the same page; the README on the lib branch and composer.json at tag 2.0.0 say 7.4, so runtimeMin follows the manifest and the page conflict is left for review. The README says the older plugin/library hybrid package "is no longer maintained", while the homepage says it "is still maintained"; that package is the classic version, not this library, so it is no end signal for the record. The README's "based on Markdown by John Gruber" and "a port to PHP of the original Markdown program" name John Gruber's Markdown, which has no record here, so no basedOn is recorded. Markdown Extra is a second parser inside the same package and not a separate record. The repository has no GitHub releases; the registry's 2.0.0 is the highest stable tag, so it sets currentMajor and latestReleaseDate. The firstRelease 2004 is the earliest dated release in the version history on the classic version page (1.0.1, 16 Dec 2004); the repository's oldest tags (2007) are an import of that history, the first release of the Lib package is dated 11 Apr 2013 in the README, and the first Packagist upload of the library, 1.3-beta1, is dated 2013-01-12. The GitHub license field reads NOASSERTION because the file is named License.md, so the license fact is the composer.json statement at tag 2.0.0, which matches the README's BSD text. The License.md copyright line is "PHP Markdown Lib, Copyright (c) 2004-2022 Michel Fortin"; the README also credits John Gruber for the original Markdown copyright, which is not a second maintainer. The homepage donation link and the PHP SmartyPants and Markdown Extra syntax pages are not fields. The README says that an empty result can mean the PCRE backtrack limit is too low (it may need to be raised above one million), and that the Composer package excludes development files. Markdown Extra in the same package adds footnotes, attribute blocks and fenced code blocks, and its configuration options (header IDs, URL filtering, code block content functions) are listed on the configuration page. The README says the plugin interface for WordPress is not in the Lib package, and that the classic package with that interface is a separate older package. The contributors count is the page number of the rel="last" link on the contributors endpoint with per_page=1. Each parser has a static defaultTransform call that uses the default settings, and an instance whose configuration variables (for example fn_id_prefix in the README, and url_filter_func in the version history) can be set before transform.
