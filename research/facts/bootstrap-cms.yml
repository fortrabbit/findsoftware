notes: >
  The repository has no homepage, so none is recorded; the CSV row has none either. The GitHub repository is archived ("This repository was archived by the owner on Jan 18, 2018"), and the Packagist package graham-campbell/bootstrap-cms, the one the install docs name, is flagged abandoned at package level, so status is discontinued. The README still says the project "is maintained by Graham Campbell" in the present tense, which is not an end statement on its own. The GitHub releases are all alpha prereleases from v0.1.0-alpha (2014-01-23) to v0.9.0-alpha (2015-03-15); no stable release exists, so currentMajor and latestReleaseDate are unknown and the newest prerelease is recorded. A reviewer may decide whether the import's four-year rule, applied to prereleases, would have moved this record to stub had the status signal been absent. The repository is public and holds source, so sourcePublic is not recorded as false. The Sentry library is named as a dependency in the README ("powered by Laravel 5 and Sentry") and is not recorded as basedOn, since Sentry is a library rather than the software the CMS extends. The README says a database server is required without naming an engine, so databases is unknown. The maintainer is an individual; the README names Graham Campbell and his GitHub profile, and no legal notice was found, so maintainerType is left to the import. The Laravel version stated in the README is 5.1 and the GitHub description says "Laravel 5"; basedOn names only laravel.
