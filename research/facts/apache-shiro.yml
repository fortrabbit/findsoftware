notes: >
  Shiro is a library a Java web app or service adds through Maven; it is not a web server. The homepage names the Apache Software Foundation in its copyright line, so the maintainer is the foundation, and the Apache License 2.0 is read from the LICENSE file on the main branch. Latest stable release is shiro-root-3.0.1 (GitHub release, 2026-08-23); the Maven Central metadata lists 3.0.1 as the release and no 3.0.2 is published there although a shiro-root-3.0.2 tag exists. Maven Central publishes no download figure, so no adoption download count is recorded. The oldest Maven Central upload is 1.0.0-incubating (2010-05-21); the oldest git tag, 1.0.0-incubating, is dated 2010-10-08. The download page lists shiro-core as required in all environments and the web module as the one for web applications; the web configuration pages describe a servlet filter and listener in web.xml. The forums page names the mailing lists as the primary forums and links GitHub Discussions, which is the forum value. The Shiro v1 and v2 end-of-life notice on the web page concerns the older majors only and is no end signal for the project. Spring, Guice and Jakarta EE integrations are listed on the site and are not recorded as basedOn. The 10-minute tutorial page says it needs JDK 1.8+ while the download page states Java 17+ for the current release; runtimeMin takes the download page, which states the current release.
