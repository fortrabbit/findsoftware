notes: >
  The LICENSE.md file names GPL-2.0-or-later with the copyright line "Ephox Corporation DBA Tiny Technologies, Inc."; the pricing page names GPL2+ for the self-hosted open source download and "Commercial license" on the plans, so the two are separate license entries, and the commercial one is named by the pricing page only. GitHub detects no license (NOASSERTION) because the file is LICENSE.md. The README says "Licensed under the terms of GNU General Public License Version 2 or later", which matches the file. The GitHub repository has no release objects; the registry's latest stable is the npm tag 8.10.2 (published 2026-11-11), which sets currentMajor and latestReleaseDate. The repository is a monorepo (the npm package lives in modules/tinymce), so stars and contributors belong to the monorepo and the npm figure is for tinymce. The oldest tag is 2.0.7, whose commit date is 2006-10-17; the npm registry's first upload is 4.0.25 from 2014. The framework wrappers tinymce-react, tinymce-vue and tinymce-angular are separate repositories named on the README and are not basedOn. The alternatives page compares CKEditor, Tiptap, Froala, Lexical and Quill; its column label says "CKEditor" without a version, so no CKEditor record id is recorded. The Terms page names the contracting party, the maintainer as recorded. The homepage footer says "Tiny Technologies Inc.", the trade name the copyright notice uses. The pricing page's Enterprise plan (cloud or self-hosted, custom packaging) and plan tiers with editor-load limits are plan tiers, not paidEdition; paidEdition records the premium plugins package the docs install page names. The README's "350M+ downloads every year" is a download count, not an install count, so it is not recorded as reportedInstalls. Hosting: the browser editor needs no server runtime.
