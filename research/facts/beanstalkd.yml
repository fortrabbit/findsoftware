notes: >
  Criterion 4 is met by the 1.13 tag of 2023-03-12, which falls inside the four-year window; the project has tags only, no GitHub releases. The first tag, v0.1, is dated 2007-10-16 by its commit, which predates the GitHub repository (created 2008-03-31), so firstRelease is 2007. The default branch's newest commit is dated 2025-03-18, and the repository has no archive or end statement. The LICENSE file's copyright line reads "Copyright (c) 2007 The authors of beanstalkd."; the homepage names Keith Rarick as its contact, which is the maintainer recorded here. The download page's package routes are each an installMethod entry; the Arch route is given as yaourt, which the page names. The README requires Linux (2.6.17 or later), Mac OS X, FreeBSD or Illumos and a C99 compiler, which is an OS and compiler statement, so runtimeMin is unknown. The homepage's history says Philotic, Inc. developed the first version for a Facebook application, which is no field. The Google group beanstalk-talk is the project's mailing list, and the protocol is documented at doc/protocol.txt in the repository. The homepage says it was originally designed for reducing the latency of page views in high-volume web applications, says there is no configuration file and only a handful of command-line options, points to the adm directory for running it as a background service, and its example puts a job, reserves it, runs it and deletes it. Client libraries are listed on a GitHub wiki and are not recorded.
