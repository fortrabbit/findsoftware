notes: >
  No homepage and no docs site: the README is the only documentation, and the PyPI and repository pages name no site of their own. The project moved from the jazzband organization to django-commons; the jazzband URLs redirect, the README still carries jazzband badges, and the PyPI homepage names jazzband. The record follows the current repository and organization. The LICENSE copyright line names Mikhail Korobov; the setup.py author is the same person. The README calls the package a Django app only through the phrases "This app provides" and "INSTALLED_APPS", and never says it extends Django, so basedOn is left out and the reviewer decides. The package takes its runtime minimum from setup.py python_requires, which the PyPI requires_python field repeats. latestReleaseDate is the registry date: the 1.5.1 files on PyPI were uploaded on 2026-01-02, while the GitHub release object for 1.5.1 is dated 2025-04-25; the reviewer decides which one the register shows. The PyPI JSON carries no download counts, so pypiDownloads comes from pypistats.org. firstRelease is the oldest PyPI upload, 0.1 on 2011-01-12. The template tags the README shows (render_field, attr, add_class) are code, not a sentence, so no templating fact is recorded. The record's stars and contributors belong to the repository.
