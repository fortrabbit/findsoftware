notes: >
  The docs are in Korean only (the pages declare ko-KR), so i18n is not recorded. The repository default branch is dev; the README and NOTICE were read there. The NOTICE names the legal entity as 주식회사 당근마켓 and the Apache-2.0 LICENSE file has no copyright line. The npm figure is @seed-design/react, the core package the Vite install page names beside @seed-design/css; a monorepo sibling (@seed-design/lynx-react, @seed-design/css) is not used. The GitHub releases for @seed-design/react start with 0.0.1 (2025-02-24), after release candidates in February 2025. No HTTP Archive technology is named SEED. The React and Lynx platforms share one token source, per the README; the Lynx packages are not recorded as separate facts. The homepage is https. The docs site is a Next.js app and the install page was read from its server output. The NOTICE reserves the brand resources (logo, name, characters) as assets of 주식회사 당근마켓, usable for non-commercial purposes unless agreed with the company in advance. The CLI's add and add-all commands copy snippets into the project (seed-design.io/react/getting-started/cli/commands), so the npm figure counts the installs of @seed-design/react only, not components fetched through the CLI. The CLI itself needs Node.js 20.19.0 or later; that is a tool requirement and no runtime for a site. The README lists the packages: React, Lynx, CSS, tooling, and an MCP server; only the React and CSS packages are described here.
