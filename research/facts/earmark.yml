notes: >
  Discontinued on the archive signal: the GitHub repository pragdave/earmark, named by the Hex package as its source, is archived; the README and RELEASE.md on master give no reason and no new home. The last push is 2026-06-02, the same day as Hex release 1.4.49, and Hex still lists 1.4.49 as the newest stable version. The GitHub repository has tags only (no GitHub releases); the newest tag is v1.4.48 (2025-06-21). The GitHub license field reads NOASSERTION; LICENSE and the Hex metadata both state Apache-2.0. The README says "Same as Elixir, which is Apache License v2.0", the same license in another wording. The LICENSE and README copyright lines also name The Pragmatic Programmers and Robert Dober; the recorded maintainer follows the LICENSE copyright line. The README has no installation section and the hexdocs pages none either; the Hex package description says "run mix escript.build first" for the command-line tool, and the library is added as a Hex dependency. No homepage: the project names only its GitHub repository and its hexdocs. The mix.exs at v1.4.48 requires Elixir "~> 1.14"; no OTP minimum is stated, so runtimeMin is not recorded. A README also names "Earmark.Cli" as an escript. The CSV discovery notes say 895 stars and a 55.8k weekly Hex figure; the Hex API gives 53,069 for the last week, and the total is recorded. The Hex description says Earmark is "intended to be used as a library (just call Earmark.as_html)" and "can also be used as a command-line tool (run mix escript.build first)". The README warns: "DO NOT USE ON UNTRUSTED INPUT!", and says Earmark "does not and cannot sanitize unsafe markdown input".
