notes: >
  Bandit has no project website: the README links only the API docs on bandit.hexdocs.pm, a Hex-generated page, so homepage is absent and the docs field holds that link. The maintainer is the copyright holder named in the MIT LICENSE, Mat Trudel; the GitHub owner is the user mtrudel. maintainerType is listed as notFound because the import derives it from the name and repoOwnerType. The README says Bandit is the default HTTP server for Phoenix since release 1.7.11 of the framework and that Thousand Island is the library it is built on; neither is basedOn, since Phoenix uses Bandit and Thousand Island is a library with no record. The highest stable tag is 1.14.1 (2026-10-28), and Hex lists the same version as latest; a GitHub release object does not exist, so the tag commit date is the release date. The first release is the 0.1.0 upload on Hex (2020-11-05), the same day as its GitHub tag. Hex retires 1.10.0 for an improper DEFLATE implementation (reason other); a retirement is a warning on one version, not an end signal, so status stays accepted. The runtime is elixir, which the import maps to BEAM; no runtimeMin is recorded because the README states only Elixir ~> 1.13 in mix.exs and no OTP minimum. The ecosyste.ms figures count hex.pm packages and repositories that depend on bandit.
