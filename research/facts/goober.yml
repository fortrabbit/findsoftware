notes: >
  The homepage goober.rocks names the documentation at goober.js.org, which is a Docusaurus site; its text read here is the introduction and the API page. The README links a Slack workspace for the project, which has no field and is not recorded. The README says the API is inspired by emotion, and it compares goober with styled-components and emotion in its own section; alternativeTo records that comparison. The package works with Preact and React through a setup call, and the README does not name a parent framework, so basedOn is not recorded. The weekly download figure is the goober package's count for 2026-10-18 to 2026-10-24. The npm registry's first upload is 0.0.1 on 2019-02-05, the same project, so firstRelease is 2019 rather than the first GitHub release in 2021. The homepage gives the less-than-1KB size as a claim the README repeats; the description leaves it out. Neither the homepage nor the README names a discord, x or bluesky account. The README also links an Open Collective sponsors page and a Slack invite, neither of which has a field. The README and homepage state no server or browser run model beyond the extractCss server-rendering helper, so runsAs is not recorded.
