notes: >
  Accepted: the install route is readable on a primary page. The docs site is a JavaScript shell, but its source in github.com/rbatis/rbatis.io holds the homepage view, which shows "cargo add rbatis". The README Quick Start shows only a Cargo.toml dependency block. The homepage is the GitHub Pages site the repository names. The default branch is master, last pushed 2026-11-14. The maintainer is the Cargo.toml authors entry "ce"; the GitHub organization rbatis owns the repository, LICENSE is the Apache License 2.0 text with no copyright line, and no legal entity is named. The crates.io figure is the total for the crate rbatis (18502 in the last 90 days, read at the same time). The crate's first upload is 2020-02-15 and the oldest tag v0.0.1 has commit date 2019-12-09, so firstRelease follows the tag; the first crate versions were MIT, the license of the latest release is Apache-2.0. Databases come from the README sentence "Multiple Database Support", which also lists TiDB, CockroachDB and TDengine, and the driver table adds Turso and DuckDB; none of these are values of the databases field. The README lists drivers as separate crates (rbdc-mysql, rbdc-pg and others) under github.com/rbatis/rbdc; the Oracle driver rbdc-oracle is in another GitHub account (chenpengfan). The README says the library is "Based on Tokio Async Model" and its Quick Start uses tokio. The docs README says it is "Compatible with most mybatis3 syntax" and "Inspired Mybatis"; it names no migration route, so no importsFrom. The README links GitHub Discussions (badge) as the contact route. The runtime is rust because the README names it as an ORM framework for Rust. Contributors counts the contributors endpoint with per_page=1, read from the rel="last" link (26).
