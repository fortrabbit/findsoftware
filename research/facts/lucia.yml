notes: >
  The status is discontinued on three statements: the README ("Lucia was deprecated on March 2025"), the homepage saying the same, and the npm latest version marked deprecated. The README points to code/auth_session.ts in the repository as "a complete, single-file replacement for the NPM package"; that is a file in the same repository, not a named successor project, so successorOf is not set. The homepage links an Auth Book for background on authentication; it is not a docs page for the library and is not recorded. The LICENSE copyright line names pilcrowonpaper and the homepage says "maintained by Pilcrow"; the maintainer follows the LICENSE and Pilcrow goes to notes. The repository has no tags and no releases, so currentMajor (3) and latestReleaseDate (3.2.2, 2024-10-20) come from the npm package. The npm versions from 0.0.1 to 0.1.0 (2020) name github.com/luciadotjs/lucia, a different repository, so they are not this project's first release; the first upload that names lucia-auth or pilcrowOnPaper is 1.0.0 on 2023-06-12, which sets firstRelease. The CSV npm figure (262.3k a week) predates the deprecation; the recorded figure is the registry sum for the period. The install guide is the npm package; no installation page exists because the library is deprecated, so installMethod is not recorded.
