notes: >
  Accepted as a boundary row: the project's own sharing page says a panel can be embedded on another website with an iframe, and that embedding and anonymous access are not available in Grafana Cloud. The same sharing page says viewers must be signed in to Grafana unless anonymous access is enabled. Enterprise: the Docker and Debian install pages call Grafana Enterprise the recommended and default edition and state that it is free and includes all the features of the OSS edition, with features unlocked by a license; the paidEdition fact follows the introduction page and stands. The dockerPulls figure is for grafana/grafana-enterprise, the image the Docker install page runs; the same page names grafana/grafana as the open source image. The README gives the X account and the discussion forum. The README says the project is distributed under AGPL-3.0-only, the LICENSE file is AGPL-3.0; the Apache-2.0 exceptions are named in LICENSING.md and recorded as a second license entry. The README statement names the same AGPL license in another wording, so it is not a separate license. The legal entity Raintank Inc. comes from the privacy policy, which also gives a New York mailing address; hqCountry follows that address, and the OSS page names Grafana Labs as the brand. The language is TypeScript as GitHub reports it; the server's Go code is not stated on any page read, so no Go runtime is recorded and the runtime binary comes from the install page. Categories: dashboards has no mapping in scripts/import-facts.mjs, so the record is observability and monitoring. The reportedInstalls figure is stated on the OSS page as "1.5M+ Active installs", and the OSS page also states 67.5k GitHub stars, which the API figure replaces. Coined kinds: httpApi, embed. Grafana Cloud free tier and plans are not recorded. The OSS page links comparison pages against Grafana Cloud for Datadog, Dynatrace, Elasticsearch, New Relic, PagerDuty and Splunk; only Elasticsearch has a record, so it is the one alternativeTo entry, although the comparison names Grafana Cloud rather than the open source edition. Grafana Enterprise Traces and Grafana Cloud Traces are named on the Tempo page as products built on Tempo; they are not recorded here.
