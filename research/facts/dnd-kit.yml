notes: >
  Monorepo: the repository holds the packages @dnd-kit/abstract, collision, dom, geometry, helpers, react, solid, state, svelte and vue; stars and contributors belong to the repository, and the registry figures come from @dnd-kit/react, the package the React quickstart installs. The homepage calls the project framework agnostic, with a core (@dnd-kit/abstract, @dnd-kit/dom) and official React, Vue, Svelte and Solid adapters, so no framework is basedOn. The React adapter's peer dependencies name React 18 and 19; a peer dependency is no basedOn statement. The legacy packages @dnd-kit/core (npm latest 6.3.1, last published 2024-12-05, not deprecated) and @dnd-kit/sortable (10.0.0, which depends on @dnd-kit/core ^6.3.0) are the packages the quickstart's migration link names; the legacy docs are selectable on the site. The legacy package's weekly figure over 2026-10-26 to 2026-11-01 is 40453245, which is not the figure of the package the install docs name, so it is not recorded as a field. The quickstart's migration link names the legacy packages as the source of a migration; they are no record of their own, so successorOf is left out. Current major is 0 because the React package is at 0.5.3 and the line has not reached 1.0; the reviewer decides whether a pre-1.0 major belongs in the field. The GitHub repository tags each package separately, and the newest stable tag is @dnd-kit/react@0.5.3 on 2026-10-31; a beta of 0.5.3 was published that same day before the stable version, so no latestPrereleaseDate is recorded. The homepage is recorded over https; the repository's homepage field names the http address, which the site also answers. The homepage's X link is the only social link recorded; the homepage and docs also link a Slack workspace (dnd-kit.slack.com) under Community, which has no field. The maintainer is the LICENSE copyright holder.
