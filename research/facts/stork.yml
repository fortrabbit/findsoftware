notes: >
  The maintainer's notice on the homepage says "I've wound down my work with Stork" and the discussion 360 on the repository says the maintainer will stop Stork development and support for the foreseeable future, so the status is discontinued; the repository is not archived and the latest GitHub release is v1.6.0 (2023-01-12). The discussion says the files on files.stork-search.net will stay up for at least four years from the discussion date and that six months' notice will be given before the CDN is shut down; no CDN end date is recorded as a fact. The discussion also says the Discord server will close and the auxiliary repositories are archived; these are not recorded as facts. The docs footer names James Little as maintainer and the homepage says "By James Little". The GitHub releases start with v0.2.0 (2019-12-26), a prerelease, so firstRelease uses the oldest release of the same repository. The crate figure is the total from crates.io, and the crate's 90-day figure is not recorded. The latest GitHub release is v1.6.0 and the newer tags are pre-releases (v2.0.0-beta.2 is the newest). The license is Apache-2.0 from the GitHub API; the LICENSE file (license.txt) is the Apache License 2.0 text. Runtime is recorded as the native binary; the JavaScript part runs as WebAssembly in the browser.
