notes: >
  Acceptance: the routes exposed by the HTTP In nodes are HTTP endpoints that a site or app calls, the same wiring as a webhook (securing page: "The routes exposed by the HTTP In nodes can be secured using basic authentication."), so the record stays accepted. The homepage states "Node-RED is built on Node.js" and the FAQ asks which Node.js versions are supported. The maintainer is recorded as the project as it names itself: the README names Nick O'Leary and Dave Conway-Jones as the project's leads and says "Node-RED is a project of the OpenJS Foundation", with copyright "OpenJS Foundation and other contributors"; the foundation is hosting, so it stays in notes. The stable GitHub release 4.1.17 (2026-10-21, 12:16 UTC) is later on the same day than 5.0.9 (10:29 UTC), so latestReleaseDate is the same day either way; currentMajor follows the highest stable major, 5. The repository was created 2013-09-05 and its oldest release is v0.2.0 of 2013-10-16, so firstRelease is 2013. The npm figure is node-red for 2026-10-26 to 2026-11-01 (range endpoint). The Node-RED Con event and the Node-RED Library are not recorded beyond the library link. The editor is served by the runtime on port 1880 per the getting-started page; the Admin API is documented on the securing page and is not recorded as headlessApi because the field describes headless content APIs. The docs state that the Raspberry Pi install sets up a service, which is the process model recorded in runsAs. The Node-RED Slack (nodered.org/slack) is chat, not a recorded field. The getting-started page lists FlowFuse as a way to run a multi-tenant Node-RED solution; it is a separate product and is not recorded as a hosted offering.
