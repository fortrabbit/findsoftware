notes: >
  Stub: the project's own homepage and documentation did not answer on 2026-10-28 (two attempts, 60 seconds each, over http and https; the name resolves), so no homepage is linked and the status is a stub; a later pass should retry the site, and if it still does not answer, decide whether the software is rejected or discontinued. Criterion 4 is the second doubt: the newest tag, v1.5.14, is dated 2016-08-09 and the default branch's last commit is 2021-08-09, with no GitHub release and no Maven Central version after 1.5.14 (its maven-metadata lastUpdated is 2016-08-09). The GitHub API lists no releases; latestReleaseDate is the date of the tagged commit, not a release record. The README of the default branch names Apache 2.0 and says "Docker image ... Not yet there.. coming soon", while the v1.5.14 README names GPL v3 for the released code; both license statements are recorded as their own entries, and GitHub also reports Apache-2.0 for the repository. The README says the software is "based on Lucene"; Lucene is not a record id, so basedOn stays empty. The default branch README says the product "Supports 18 languages" and that it has a JDBC crawler; these are not recorded. The v1.5.14 README gives Java 7 as the minimum runtime; the release tag is from 2016 so the Java statement is historical and the reviewer should confirm it before listing. The HTTP Archive technologies list does not carry OpenSearchServer. The README badges link a Gitter chat, which is not a field.
