notes: >
  Accepted: the CSV row stays accepted. The GitHub repository is not archived and was pushed 2026-06-09; the latest stable release is v2.2.9.1701 (2024-05-25), major 2. The v2.2.9.1680 prerelease (2024-05-16) is older than the stable release, so latestPrereleaseDate is absent. The CSV says "succeeded by simple-acme fork". The README says "This repository is officially maintained by ZeroSSL", and neither the README nor win-acme.com says the project has ended or names simple-acme as its successor; simple-acme's own pages call it a clone, which is no end signal for win-acme, so status stays accepted. firstRelease is 2015 from the oldest GitHub release (v0.6, 2015-11-13); the NuGet registration index starts at 2020-10-17, which is later. Not recorded as parent: the zerossl.com legal page footer reads "© 2026 HID Global Corporation, part of ASSA ABLOY. All Rights Reserved." and names no owner of win-acme. The maintainer stays ZeroSSL as the README words it; hqCountry is absent because no page of ZeroSSL or HID named a country for the maintainer. The csproj at the latest tag (src/main/wacs.csproj) sets TargetFramework net7.0, and its <Authors> is "Wouter Tinus and many others" (also the NuGet authors): authors are no maintainer statement, so they stay here. The system requirements page says Microsoft supports .NET 7 on Windows Server 2016 and higher, and lists older builds for .NET 6 (version 2.1.23, Windows 2012) and .NET 5 (2.1.20); those older builds are not runtimeMin. The homepage names IIS: "A very simple interface to create and install certificates on a local IIS server"; no field holds IIS, so it is not recorded. The ZeroSSL homepage and README mention paid certificates; those are certificate services, not editions of win-acme, so paidEdition is absent. The NuGet total count is the search API's totalDownloads for the dotnet tool package. Fields coined: none.
