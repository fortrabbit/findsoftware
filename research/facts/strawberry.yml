notes: >
  The README and homepage link the repository, docs, Discord, X and Mastodon; the homepage link "/discord" redirects to discord.com/invite/3uQ2PaY, which is recorded. The homepage states "More than 6 million downloads per month" and a sponsor list; the download claim is not recorded because it is a project statement without a registry period, and the PyPI figure from pypistats is recorded instead. The Django integration in the README ("A Django view is provided") and the docs integrations list name Django as a host the library works with, not a project it is built on, so no basedOn is recorded. The docs say Strawberry "is built on top of Python's dataclasses and type hints functionality"; dataclasses is the standard library, not a record, and stays in notes. The docs integrations page states that it is not up to date and should not be linked, so it is not used as a source. Strawberry Django has its own documentation and is a separate package, not part of this record. The README Quick Start install is the pip route; the docs getting-started page gives the same command. The license MIT is stated by the LICENSE file and the GitHub API.
