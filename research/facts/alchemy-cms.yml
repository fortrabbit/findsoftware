notes: >
  The homepage is read at https://alchemy-cms.com; the GitHub homepage field names https://www.alchemy-cms.com, which answers too, and the bare domain is recorded. The rubygems first version is 2.0.pre2 (2011-09-14), older than the first GitHub tag (v2.7.0, 2013-10-16), so firstRelease follows rubygems. The README names guides.alchemy-cms.com as the guidelines, recorded as docs; the /docs path on the homepage returns no page. The homepage lists the Cloud offering as "coming 2026" with a waiting list, so it is announced and not yet available; the hostedOffering value keeps the homepage wording. The README states a SQL database but names none, so databases is left out; the README feature list also names page versioning and attachments, which have no field. The README states the Ruby version, but the repository's gemspec was not read for a Rails version floor; the README says Rails 7.2 or later for this version, which is not recorded as a field. Runtime-server behaviour (runsAs) is not stated on the pages read, so it is left out. Category values are the CMS and the Rails dependency only.
