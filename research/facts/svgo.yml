notes: >
  The homepage says the project's integrations are Docusaurus, PostCSS and webpack, and the usage page names a webpack loader that optimizes SVG imports; these integrations are not parents and are not recorded as basedOn. The docs state the four interfaces: command-line application, Node.js library, browser bundle, and webpack loader. License: the source is MIT (LICENSE, package.json, README) and the site footer states "Content and Assets under CC-BY-4.0", recorded as its own license entry. The LICENSE copyright line names Kir Belevich, which matches the package.json author; the GitHub organization svg is the repository owner, recorded as repoOwnerType organization. The highest stable GitHub release is v4.1.0 (2026-08-24), which is the npm latest; the v3 and v2 lines have their own releases (v3.3.5, v2.8.4) and do not change the major. The npm first upload is dated 2012-09-27, older than the oldest GitHub tag (v0.3.5, 2013-07-02), so firstRelease is 2012. The homepage shows Open Collective, Stack Overflow and GitHub contributors links; Open Collective is a sponsorship link and no field. The homepage Playground link goes to a third-party site (jakearchibald.github.io/svgomg), not the project's own. The usage page names the Node.js library on docs/usage/node; the npm package is svgo.
