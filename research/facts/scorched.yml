notes: >
  The CSV lists the homepage as http://scorchedrb.com; the https address answers 200 and the http address redirects to it, so the https address is recorded. The homepage footer still reads "Using Scorched v1.0.0.pre2" while the gem is at 1.1.1; that footer is not recorded. The About page names the author as Tom Wardrop, based in Australia; that describes the person, not a company, so hqCountry is not recorded. The About page says the site runs on Nginx and Phusion Passenger, and that Phusion sponsors the project with courtesy copies of Passenger Enterprise; a sponsorship is not a paid edition and is not recorded. The homepage calls Scorched "a true evolutionary enhancement of Sinatra", a design lineage the project states, so no basedOn is recorded; the README says Scorched does not hide Rack. The GitHub repository has tags but no releases: the latest stable tag is v1.1.1, and the oldest tag, 0.1, is dated 2013-02-09, consistent with the first RubyGems version 0.5 (2013-03-03). The rackup command is only a start command, so runsAs is not recorded. The gem's required_ruby_version is ">= 2.0.0", matching the README. The templating list is the Tilt engines the views page gives as examples; any engine Tilt recognises can be used.
