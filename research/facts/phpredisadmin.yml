notes: >
  The CSV row gives the repository as homepage; repo-only projects get no homepage. The README's only other link is an example instance on the maintainer's domain (dubbelboer.com/phpRedisAdmin/, answers over https after a 301 from http, shows a running phpRedisAdmin page with a local Redis). It is a demo, not a project site, so it is not linked; reviewer decides. The software manages Redis, which is not in the databases vocabulary, so no databases value; the category is db-admin only, as the README words it. Runtime: the README never names PHP; PHP comes from the repository language (api) and the Dockerfile entrypoint, which starts PHP's built-in server (php -S) in the container. composer.json at v1.28.0 requires only ext-mbstring and ext-json and states no PHP version, so runtimeMin is unknown and runsAs is not recorded; reviewer decides whether the built-in server entrypoint is a runsAs statement. The Docker route needs ADMIN_USER and ADMIN_PASS, and the README says unauthenticated access is for isolated development only. firstRelease is the oldest GitHub release (v1.1.0, 2013-11-11); the repository was created 2011-07-06 and the Packagist package was registered 2013-09-25, and neither is a project statement. The license entries: the README and composer.json (CC-BY-3.0) state one wording; the bundled Redis string matching file is BSD-3-Clause and is its own entry. GitHub detects no license (NOASSERTION). The Docker Hub count is for the image the README names. The maintainer is named by the README only; no legal name is stated. Figures read 2026-10-30.
