notes: >
  The repository has no homepage set; the GitHub Pages manual at ndilieto.github.io/uacme is the project's own site and is recorded as homepage. No GitHub releases exist. The newest stable tag is v1.8.1 (upstream/1.8.1 on the pristine branch tags), read from the tag and its commit date; the ChangeLog gives the same date. The repository also ships ualpn, a tls-alpn-01 responder, as a second program; it is not a separate record. The README says uacme does not set up the web server: "don't expect it to automatically set up your webserver to use the certificates it obtains." The GitHub license field reads GPL-3.0 and COPYING is GPL version 3; no second license statement was found. The ChangeLog's first entry 2019-04-21 is the first public release, which gives firstRelease 2019; the repository was created 2019-04-21. The contributors count is the last page of the contributors endpoint with per_page=1. The ChangeLog first public release is the project's own source for firstRelease. Fields coined here: none.
