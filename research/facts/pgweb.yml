notes: >
  The homepage is the project's GitHub Pages site and answers over https; its footer names Dan Sosedoff for "© 2014 — 2025". The homepage says "PostgreSQL 9.1+" while the README says "Works with PostgreSQL 9.6+."; databases records postgres only, and the version statements are left to the reader of the README. The wiki Installation page names the Docker image sosedoff/pgweb (the count above) and the Homebrew formula; the ghcr.io/sosedoff/pgweb image it also names is not counted. runsAs is not recorded: the README's "Start server:" is a command, and no page says pgweb runs as a daemon or service or on the command line. The docs root links the wiki; the sosedoff.github.io/pgweb/docs/ and /install/ paths return 404 and are not used. Go module has no download figure, so no registry figure is recorded. firstRelease is the oldest GitHub release (v0.1.0, 2014-10-14); the 0.x line sets currentMajor to 0.
