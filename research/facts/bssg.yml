notes: >
  The homepage bssg.dragas.net answers over https and lists the repository at brew.bsd.cafe, a Forgejo instance, so the repository is recorded as the project's source and no GitHub API figures exist. The Forgejo API reports the repository's main language as CSS (by file size); the language recorded is Bash from the homepage. The Forgejo API shows the repository license as none, while the LICENSE file and the README both state BSD 3-Clause; the file and the README are recorded. The homepage says the project was started in 2015 and maintained privately for years; the first public release is 0.9 on 2025-04-06, so firstRelease is 2025. The highest stable release is 0.41.0 (2026-06-14), major 0, recorded as currentMajor 0 as for other pre-1.0 projects. The repository holds no prereleases. The homepage footer links the maintainer's personal Mastodon and social accounts; these are not recorded as the project's mastodon field. The homepage also links a project blog at blog.bssg.dragas.net, which is not a field here. The README says the author's Bash builds run on Linux, macOS, FreeBSD, OpenBSD and NetBSD, and the requirements name a Markdown processor (cmark by default, pandoc or markdown.pl) that is set in config; that choice is not recorded as a field. The homepage lists tag, archive and author pages, RSS and sitemap output, a theme gallery of over 60 themes, incremental builds and backup and restore. The README describes a deployment hook that runs a user script after a build, and a post editor with live preview in the browser; neither is recorded as a field. The README separates the site content from the core scripts in a recommended setup, with a git pull for updates; that is recorded in prose only. The Forgejo instance shows no contributor count that the skill's GitHub endpoint can read, so contributors is not recorded. Stars are not recorded because githubStargazers is GitHub's count and this repository is on Forgejo.
