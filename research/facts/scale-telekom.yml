notes: >
  The homepage and documentation site telekom.github.io/scale answers 200 but serves an empty JavaScript shell ("Webpack App"), so it is listed as unreadable and the homepage fact cites the README's link to it. No stable release exists: every GitHub release and every npm version of the core package is a 3.0.0-beta tag, the newest 3.0.0-beta.162 (2026-10-06), and the README says "Currently, Scale is an open beta." The GitHub release named "latest" points at main and carries no version. The registry major is 3 only as a beta line, so currentMajor and latestReleaseDate are not recorded. The core npm package @telekom/scale-components has a weekly figure of 3318; the neutral sibling @telekom/scale-components-neutral has 178 for the same week and its npm latest tag is 3.0.0-beta.56 (2022), so the README's @next install is the current line for both. The npmName is the core package, which the monorepo's components package publishes. The README describes two versions: the Telekom version, whose brand and design assets are "not available for free use", and the open source version with a neutral theme, which the README says "is fully covered by the MPL-2.0 License". The LICENSE file opens with the brand reservation and then the MPL 2.0 text; the reservation is a restriction on the brand, not a license for the code, so licenseModel open-source rests on the MPL statement and a reviewer decides whether the brand restriction makes it source-available. The GitHub API reports the license as NOASSERTION. The README's 2026-10-06 notice says the long-deprecated Angular, Vue and design-token packages were removed; that is a removal of separate packages, not an end statement for Scale. The README's basedOn statement is "Stencil components" for the component package; the repository topics also name stenciljs. The Sketch library for designers is documented in the README and is not recorded as a field. The hqCountry DE rests on the Bonn commercial register entry (HRB, Local Court Bonn) on the legal notice page; the page's VAT ID carries the DE prefix. The README states that "For any customization other than explicitly for the Telekom, you must replace the Deutsche Telekom default theme."
