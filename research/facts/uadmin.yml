notes: >
  Doubt: the homepage uadmin.io no longer serves the project; https fails the TLS handshake and the plain-http address answers with a parking page, so no homepage is recorded and the status is stub until a live project site or an announcement settles it. The README and the docs' about page link Facebook, Medium, Twitter and a Slack channel in the Gophers workspace; the Twitter link is recorded as x and the Slack channel as forum, and Facebook and Medium have no field. The go.mod database drivers and db.go name SQLite, MySQL and PostgreSQL, while the README feature list names MySQL only; the README line stays a separate databases entry. The repository is current: last push 2026-07-13 with v0.10.2 the highest stable release, major 0, and no archive flag or end statement. The README says "Originally open source by IntegrityNet Solutions and Services" and the LICENSE copyright line names the same, with no legal form found. The README lists "uAdmin publish" as free hosting, but the changelog of 0.6.1 says the publish command was removed, so no hosting is recorded. The go.mod at master states go 1.17 while the README states Go 1.16 or later; both are recorded as runtimeMin entries. The docs at uadmin-docs.readthedocs.io describe the 0.7 release and state Golang 1.10.3 as the prerequisite, which is older than the README and is not used. The dAPI reference shows JSON responses but names no API style, so headlessApi is left out. The README describes a model registered with uadmin.Register and a server started by uadmin.StartServer, and the dAPI reference documents the data endpoints. The OpenID login handler in the source tree is not stated by any page and is not recorded as sso.
