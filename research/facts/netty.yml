notes: >
  firstRelease is the oldest upload of org.jboss.netty:netty on Maven Central (3.0.0.CR1, 2009-07-08), the group id Netty used before io.netty; the GitHub tags start in 2011 and the project news archive starts in 2011. The current major 4 comes from netty-4.2.19.Final, published 2026-10-06 on GitHub. The downloads page marks 4.0.56.Final as EOL and 5.0.0.Alpha5 as development, a preview not counted as a release. The Netty 5 Maven artifact is netty5-all. Netty is a library embedded in applications, so runsAs is not recorded from its own pages. The Netty 5 user guide is marked abandoned on the user guide page. The project's stated maintainer is "The Netty Project"; no legal form is given on the site. Criterion 1: Netty describes itself as a framework for protocol servers and clients, including HTTP; it does not claim to be a website framework.
