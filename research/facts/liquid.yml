notes: >
  The maintainer follows the LICENSE copyright line, which names Tobias Luetke for 2005 and 2006; the gemspec authors field spells the name Tobias Lütke. The repository and the homepage sit under Shopify, and the homepage says the language is "created by Shopify"; that company line is not recorded as the maintainer, and the README links the Shopify-hosted documentation at shopify.dev as "Liquid documentation from Shopify", which is recorded as docs and covers Shopify's own objects as well as the language. The newest stable release is the gem 5.14.0 (uploaded 2026-09-17), tagged v5.14.0 on GitHub without a release object; the highest GitHub release object is v5.13.0 (2026-06-29). The runtimeMin 3.0 is the gemspec required_ruby_version at v5.14.0; the gem's RubyGems metadata has no ruby_version. The first tag is v2.0.0 (commit 2009-03-10); the oldest RubyGems version is 1.7.0 (2009-07-25), so firstRelease is 2009. The README's website link is plain http (liquidmarkup.org) and is not recorded as the homepage. The README says Liquid "needs to be non evaling and secure" and "has to be stateless", which is the basis of the description. The README lists Liquid features for environments, error modes and usage tracking; they are not recorded as fields. The homepage lists Shopify themes and other hosted applications as users and says Liquid has been in production use at Shopify since 2006; the repository belongs to the Shopify GitHub organization, and no page names Shopify as owner or maintainer in those words, so parent is left out. The README says Liquid had to be stateless, with separate compile and render steps, and that its templates are made so users can edit them.
