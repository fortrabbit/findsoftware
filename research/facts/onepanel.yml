notes: >
  Project is GPL-3.0 on GitHub (api) and the README says the same. The Pro and Enterprise editions are paid under LXware terms; the Pro card says Subscription or Perpetual License, and the Enterprise page says Contact Sales. The paidEdition quote is from the Pro card. Maintainer is recorded as the homepage names it, FIT2CLOUD. The docs and terms copyright line names Lingxia (Hong Kong) Software Co., Limited (LXware), a FIT2CLOUD subsidiary that sells Pro; its legal form is in the docs footer, not recorded as maintainer. hqCountry is not recorded: the About page gives LXware's Hong Kong headquarters, and no page gives FIT2CLOUD's country. The x link is LXware's account on the homepage footer. The runtime value binary comes from the Go language of the repository (core/go.mod at the release tag), since no page states how the panel is compiled. The reportedInstalls entry is the pricing page figure; the README says 2.5M+ self-hosters and the homepage 2.8M total downloads, both kept out of the record. The i18n statement is from the changelog, which records interface language additions for the panel. The databases statements come from the database docs pages (MySQL and MariaDB via App Store instances, PostgreSQL via App Store instances); Redis is not a databases value. firstRelease 2023 is the oldest GitHub release v1.0.0; the repository was created in 2022 and the project states no earlier release year. The default branch is dev-v2, and the highest stable release is v2.4.1, so currentMajor is 2. The install requirement is a Linux server. The docs also list a Redis page under databases and the 1Panel docs footer shows a second X account (1panel_linux), neither recorded. A 1Panel vs Webmin compare page exists, Webmin has no record. Compare pages name cpanel and plesk.
