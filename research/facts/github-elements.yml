notes: >
  Doubt: whether the collection is a candidate at all, or each element is one, and what install step the record would cite; the repository ships no code of its own. Its README lists 17 custom elements, each in its own repository with its own example site, and the repository has no tag or release. The CSV homepage is a webcomponents.org collection page, a third-party directory, so no project homepage is recorded. The npm name github-elements is a security placeholder (version 0.0.1-security, repository npm/security-holder), not a package of this project. Settle it by deciding the candidate unit: the collection with an install page of its own, or each element as a sibling candidate with its own package. No homepage, docs site or community link appears in the README or the repository metadata beyond the third-party webcomponents.org page. The lastCommitDate is the committer date of the newest commit on main, read from the commits endpoint, since no release exists.
