notes: >
  Major is 0 because the line is 0.7.x (latest v0.7.20, 2020-08-08); the install-by-download route is the Getting Started page's "Download the latest version here", and that page also names Bower and Component, which are third-party package managers under the name c3. The npm package c3 is the one the install page's name refers to, so its figure is recorded. No runsAs is recorded: the Getting Started page loads c3.js with a script tag but no sentence says it runs in the browser. The repository was pushed on 2026-10-20 with no release since 2020, which is no end signal. Dependency on D3 is stated on the README ("D3.js ^5.0.0") and on the Getting Started page ("C3 depends on D3"); the basedOn statement is the README's "D3-based" wording. The LICENSE copyright line names Masayuki Tanaka; the repository owner is the c3js organization. The homepage http://c3js.org redirects to https://c3js.org/.
