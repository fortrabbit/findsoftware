notes: >
  Status is accepted: the repository is not archived and no end statement was found. The repository has no releases; its only tag is 0.2.0, and the last push is 2016-10-13, so latestReleaseDate is empty and firstRelease and currentMajor are unknown. The repository has no LICENSE file and the GitHub API reports no license, so no license is recorded. The GitHub homepage field is empty and the README names no site, so no homepage is recorded. The npm package named poltergeist is a different project (accosine/poltergeist, an HTML5 game module, 0.0.1), so no npm name or download figure is recorded. The README says the project deploys to Amazon S3 and CloudFront via gulp build:deploy; no deploy-target field exists in the starter list, so that is left in notes. The gulp build command is not stated as a build command; the README names gulp for the development server and gulp build:deploy for deployment. Criterion 5 is the open question for a reviewer: the only adoption figure is 1 GitHub star, one contributor, and no company is named. The maintainer is recorded as the GitHub organisation login pillars, which has no display name.
