notes: >
  The GitHub homepage field and the README's own link point to http://airbnb.github.io/polyglot.js, which answers with a 301 to https://polyglot-js.airbnb.tech/; the https site is the one recorded as homepage. The install command names the npm package node-polyglot, so its weekly figure is recorded. The repository has no GitHub release objects; the stable line is the npm latest 2.6.0 (published 2024-07-11), which matches the newest tag v2.6.0, so currentMajor is 2. The first npm upload 0.0.1 is dated 2012-10-16 and the oldest tag v0.1.0 commit 2012-12-05, so firstRelease is 2012. The README calls the library tiny and says the browser and Node are both supported; no runsAs is recorded because the README states the two environments without saying where the live site runs it. The README links annotated source and a changelog, and the Gitter badge is a chat link that is not recorded. The repository's own Related projects list names i18n-extract, a separate tool, and is no alternativeTo statement. The count of 35 contributors comes from the per_page=1 last-page link. The npm metadata of node-polyglot 2.6.0 states engines node ">= 0.4", a legacy floor that is not recorded as runtimeMin; a reviewer may decide otherwise. The README says Polyglot does not perform any translation and is agnostic to the translation backend: the application supplies the translated phrases. The homepage links the GitHub repository and an annotated source page, and names no social or forum channel.
