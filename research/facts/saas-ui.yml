notes: >
  Status: the README says Saas UI "is moving from a bundled React component package to a preset and source-template model", and it "remains available during the transition; this repository does not claim that npm deprecation or removal has already occurred" about @saas-ui/react. That is no end signal; the repository is not archived and was pushed on 2026-10-15. The install docs name @saas-ui/cli (npx @saas-ui/cli@rc init), so the registry figures and major come from @saas-ui/cli: stable 0.0.2 (2025-10-23) is the npm latest, and the newest prerelease is 0.1.0-rc.0 (2026-08-14). The repository has no GitHub release for @saas-ui/cli, so the registry stable version is used; currentMajor 0 follows the CLI, while the last stable line of the React package is @saas-ui/react 2.11.4 (npm latest-stable tag, GitHub release 2025-01-13), with 2954 weekly downloads for 2026-10-19 to 2026-10-25. The React package is the replaced one; it is not recorded as npmName. The @saas-ui/chakra-preset npm latest is a prerelease (3.0.0-next.2); the preset is not recorded. The owner's name differs by source: the repository LICENSE reads "Copyright (c) 2021 Eelco Wiersma"; the license page reads "Copyright 2024 Saas UI B.V." and footer "Crafted by Saas UI B.V. in the Netherlands", so the maintainer is recorded as the company, and the legal form is taken from the license page. The Netherlands appears there as the governing law and as the place the company is crafted in; neither is recorded as hqCountry. The Pro license: the README sells "Saas UI Pro Beta" through a store, and the Pro catalog is recorded as paidEdition without prices. The /pricing page answers 500, so no pricing link is recorded. The homepage link list has no X or Discord link for the public project; the private Discord server belongs to Pro Beta buyers and is not recorded; the x link is the README's Twitter follow link (screen_name saas_js). The ecosyste.ms counts are 0 for @saas-ui/cli. The HTTP Archive list has no Saas UI entry. The README's Chakra statement is the basedOn source; a runtime is not recorded because the docs name no runtime for the installed components.
