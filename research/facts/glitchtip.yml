notes: >
  The CSV row dates the tag v6.2.6 (2026-08-07), which is the newest tag. The GitLab releases list shows v6.1.8 (2026-06-05) as its latest release object, so the release date follows the tag. The LICENSE file at v6.2.6 is MIT; GitLab's API returns no license field. The maintainer is not named on the pages read beyond the GitLab group "glitchtip" and the site, so maintainer fields are not recorded. The pyproject.toml at v6.2.6 shows version 0.1.0, which is not the release tag and is not recorded. The Docker Hub pull count is the total reported by the Hub API. The docs list the hosting platforms (PikaPods, Elestio, Nodion, Railway, RepoCloud) as options; they are not recorded as deployTargets. The docker, sdkCompatibility, dockerHubPulls and gitlabStars fields are coined kinds.
