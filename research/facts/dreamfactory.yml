notes: >
  Self-hosted product with an open core: the Apache-2.0 core and a commercial edition with extra connectors and features, sold per vCPU on the pricing page (no prices recorded). GitHub reports the repository language as Shell; the code is PHP, per the composer.json at tag 7.7.1 (PHP ^8.3) and the docs' PHP 8.3+ requirement. The enterprise terms of use name the seller as "DreamFactory Software (Trading Name of Integrate.io, Inc)", while the privacy policy footer names DreamFactory Software Inc. with a Las Vegas address; the privacy policy name is recorded as maintainer and the reviewer should decide between them. The Laravel basedOn comes from the README sentence; the composer.json requires laravel/framework ^13.7. The README lists SAML 2.0, OAuth 2.0, OpenID Connect, Azure AD and LDAP under security features; the FAQ says the commercial edition includes LDAP, SAML and audit logging, so the reviewer should decide whether sso is a paid feature; the field records the README wording. The about page states that the MySQL connector and commercial features are commercial, while the README lists df-mysqldb in its supported sources table. Data sources the README lists (MySQL, PostgreSQL, SQL Server, Oracle, MongoDB and others) are connectors to other services, so they are not in databases or contentStore; the Linux installer sets up MariaDB as the system database, which the docs name and which is not recorded as a field. Installation routes: the Linux installer, the Windows guide for IIS or Apache, df-docker with docker compose (the docs build images locally, so no Docker Hub pull count is recorded), the df-helm chart and the create-df-mcp npx installer. The npm package @dreamfactory/create-df-mcp is a scaffolder, so its npm figure is not recorded and the core Packagist package dreamfactory/dreamfactory is the registry figure: 190 total downloads and 23 monthly, read 2026-11-03. The docs name NGINX or Apache with PHP-FPM as the web server stack, which is no process-model statement, so runsAs is absent. The README also lists a built-in MCP server (Model Context Protocol) for AI clients, noted here only. The GitHub releases list has 74 entries; 7.7.1 is the newest stable release; the 2.13.0 release of 2018 is the oldest GitHub release, and the 2.0.0-beta tag commit dated 2015-10-24 is the oldest tag, so firstRelease is 2015. The HTTP Archive technology list has no DreamFactory entry, so httpArchiveSites is absent. The homepage links LinkedIn, which has no field. The community forum link is https, as the README gives it.
