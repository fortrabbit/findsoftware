notes: >
  Crystallize is a hosted multi-tenant SaaS (its docs call it "a multi-tenant SaaS platform"); criterion 2 is waived. The JavaScript API client the docs name (@crystallize/js-api-client, github.com/CrystallizeAPI/js-api-client, MIT) is a client, not the service, so its license, star, contributor, npm and release figures are not recorded as the product's. The legal terms call the service a SaaS; the company is Crystallize AS. hqCountry NO comes from the PostalAddress in the homepage JSON-LD (Skien, Norway), a script block the quote check cannot read, so that fact has no quote. The pricing page gives unlimited languages on every plan, SAML/SSO on the Crystal plan, and a webhooks docs page exists (coined field names would be webhooks, not recorded). The community is reached through a Slack invitation linked from the site, which has no field. The docs describe customer and order imports and product catalogue imports as mass operations without naming a source system, so importsFrom is not recorded. The pricing page lists a Particle plan and a Crystal plan with SAML/SSO; the plan names are recorded without prices.
