notes: >
  Status: accepted; no end signal. The repository is not archived and the npm latest version 2.0.8 is not deprecated. The latest stable release v2.0.8 is dated 2026-08-09; the 2.0.0 betas of February 2025 are older, so no latestPrereleaseDate. firstRelease 2023 comes from the npm upload history (0.0.1, 2023-02-05), the oldest registry upload, and agrees with the first GitHub release. The category is ui-library, not notifications: the import maps notifications to email, and the component is a toast UI component. The README's skills install line (npx skills add from emilkowalski/skills) belongs to a separate skills repository and is not an install route for the library. The homepage also lists Rich Colors, a headless toast API and a Promise action; these are feature statements and not fields. The README usage renders Toaster once in the app and calls toast() from anywhere to show a toast. The homepage has a course promotion, not recorded. The getting-started page says Toaster can be placed anywhere, even in server components such as layout.tsx; that is compatibility, not a rendering mode. The Toaster API table on the docs lists a dir prop with default ltr, a table row and no sentence, so no i18n fact is recorded. The npm figure counts the sonner package the README names.
