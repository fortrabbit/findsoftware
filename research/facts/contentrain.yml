notes: >
  The name is Contentrain Studio, the README title; the company and the wider ecosystem use Contentrain. The reviewer and viewer project roles are plan-differentiated per the README. Open-core: the AGPL-3.0 core is the repository at github.com/Contentrain/studio, and ee/ is a proprietary directory under its own license; the GitHub licence field reads NOASSERTION, so the three license entries come from the LICENSE, LICENSE-EXCEPTIONS and README files. The README says the core is the AGPL and the managed Pro and Enterprise offerings run on the same product; the hosted cloud is at studio.contentrain.io and the pricing page at contentrain.io/pricing lists plans, which no price is recorded from. SSO is recorded as Enterprise-only from the README; the pricing page lists SSO paths for Enterprise and also mentions an SSO and white-label roadmap. No page names the company's country: the legal terms are governed by the laws of the Republic of Turkey with courts in Istanbul, which is governing law and not a head office, so hqCountry is unknown. The GitHub owner location is Turkey and is not a page statement either. LinkedIn and YouTube accounts are linked from the homepage and are not recorded because no field in the list covers them. The Contentrain/ai repository (MIT packages, the MCP server and CLI) is a separate software family in the same ecosystem with its own repository and is not part of this record. Version 0 is the current major: the highest stable release is v0.4.11, and the earliest tag is a v0.1.0-beta.1 prerelease from 2026-04-03, which is recorded as the firstRelease year.
