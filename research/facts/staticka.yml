notes: >
  The README describes the package as converting Markdown and PHP files into static HTML and names a companion console and web package for the terminal and browser workflows; those are not recorded. The README says it is inspired by Hugo and Jekyll; inspiration is not a parent, so basedOn is not set. Last push 2026-06-07; no archived flag, no deprecation on Packagist (abandoned is null) and no end statement was found, so the status stays accepted. Latest release v0.4.0 is 2024-11-09. The README's v0.4.0 note announces a backward compatibility break for upgrades, recorded only here. The template format and any content store are not named in the sources read, so templating and contentStore are not recorded.
