notes: >
  The homepage is https and answers 200 over both http and https. No page states a process model, so runsAs is left out; the simple-example routes show a request passed to the server, which is no statement of one. The maintainer is the copyright line of LICENSE; the docs footer says "The League of Extraordinary Packages" and the homepage says "Glide was created by Jonathan Reinink", so "The League of Extraordinary Packages" is noted here and not recorded. The composer.json names two authors (Jonathan Reinink and Titouan Galopin); only the LICENSE copyright is recorded as maintainer. Installed image drivers are GD (default), Imagick and libvips, named on the image driver page, and the framework adapters (Laravel, Slim, Symfony, Zend, CakePHP) are listed on the installation page; neither is a field. Intervention Image and Flysystem are dependencies named in the README, not basedOn statements. Packagist's monthly downloads at the read date were 1008629; the recorded figure is the total. ecosyste.ms counts were read from the packagist.org registry entry for league/glide. Contributors counted across all pages (per_page=1, last page 53).
  The simple example page says an image link carries its manipulation parameters in the query string (w, h, fit), that the server reads the source and writes a cache, and that for simplicity it omits HTTP signatures, which matter in production. The source-and-cache page says the source and cache can be local paths or Flysystem filesystems, and the README says manipulated images are cached automatically. The installation page lists framework adapters for CakePHP, Laravel, Slim, Symfony and Zend.
