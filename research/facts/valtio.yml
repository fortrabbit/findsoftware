notes: >
  The homepage valtio.dev answers with an application shell that carries no page text, so the homepage value comes from the repository's homepage field and the docs are cited from valtio.dev/docs. The README says "Valtio is not tied to React" and "Valtio also works without React", and it names React only as one renderer among others; the project is a framework-agnostic core, so no basedOn is recorded. The GitHub description and the docs describe React and vanilla use. The README says Valtio works on Node.js, Next.js and other frameworks; the runtime node follows that sentence, and the README names no browser runtime. The README describes a state object turned into a proxy whose changes are tracked, components that read a snapshot of it, and subscribe and subscribeKey for changes made outside components. The README's Discord badge links discord.gg/poimandres, the community of the Poimandres collective that maintains the project and its sibling libraries; it is recorded as the discord link. The LICENSE copyright line names Poimandres, the GitHub organization; the package author in package.json is Daishi Kato, and the record follows the license. The newest pre-release is 2.0.0-rc.2 from 2024-08-18, older than the latest release, so no latestPrereleaseDate is recorded. The npm dist-tag next points at 2.0.0-rc.2. firstRelease is 2020: the npm package and the repository both date from 2020-11-16. The README links an eslint-plugin-valtio package and a third-party use-valtio package; neither is recorded as a pluginDirectory or a basedOn statement. The npm figure is the valtio package the install line names.
