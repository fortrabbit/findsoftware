notes: >
  Stub: the project is an end-user PDF application, and its own pages (the homepage, docs, licensing page and README) describe the tools, the self-hosted Docker build and the commercial license, but name no API, SDK, webhook or embed a website calls, so criterion 1 is in doubt; a documented integration point in its docs would settle it and make the record accepted. The licensing page sells a commercial license for "closed-source or proprietary application" use and the README's Commercial Build section mentions "embedding BentoPDF into a commercial product or workflow"; both are license scenarios, not an integration mechanism. The GitHub API reports the repository license as AGPL-3.0, and the licensing page says "BentoPDF is licensed under the GNU Affero General Public License v3.0 (AGPL-3.0)". The commercial license is a license for the same software, so no paidEdition is recorded. The README says the commercial build "is what powers bentopdf.com itself", so the project's own site runs the same code.The self-hosted Docker image named in the install docs is published on GitHub Container Registry (ghcr.io/alam00000/bentopdf-simple) and on Docker Hub (bentopdfteam/bentopdf-simple); the record takes no pull figure because the quick start names the GHCR image. The About page gives the maintainer as "Alam"; the GitHub account is alam00000. Kura and Hyper Compress are separate products on their own sites and repositories, not part of this record. The README names the PDF processing libraries PyMuPDF, Ghostscript and CoherentPDF under AGPL-3.0, loaded from a CDN; these are parts, not editions. The GitHub social, contributor and star figures are from 2026-10-31.
