notes: >
  The GitHub homepage field and the README link the host www.tapestry.cloud, which does not resolve from this client; the same site answers at tapestry.cloud (no www), which is recorded as homepage and docs and was read. The README links release downloads to github.com/carbontwelve/tapestry, a different owner from the repository recorded here; the repository and packages were read as the source of record. The Packagist package carries maintainer carbontwelve, while the site footer and the LICENSE name Simon Dann; maintainer follows them. The newest release is 1.0.12 from 2018-01-03 and the repository's last push is 2018-10-11; no page states the project has ended or is unmaintained, so status stays accepted and the dates show on the record. The install page says Tapestry "has been tested and passes on PHP versions 5.6 to 7.1".
