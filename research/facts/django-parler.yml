notes: >
  No homepage: the repository's homepage field is empty, the PyPI page links only the repository, and the README links the documentation on Read the Docs. The repository moved from the edoburu account to the django-parler organization; the PyPI homepage still names the old account, and the API figures are read from the new one. The README and PyPI summary call the package "Simple Django model translations", which names Django as what it extends, so basedOn is django. installMethod is left out: the README and quickstart show pip only in a shell command. Read the docs stable pages: the stable docs are built for 2.3 and the changelog there ends at 2.3, while 2.4 is the newest release. The package has no runtimeMin: setup.py names Django 5.1 as the install dependency and the classifiers list Python 3.10 to 3.13, a classifier is not a stated requirement. The README names django-hvad as the design it is compatible with and the background page says it is inspired by django-hvad; neither is alternativeTo or basedOn. The PyPI JSON carries no download counts, so pypiDownloads comes from pypistats.org, as in other Python records. firstRelease is the oldest PyPI upload, 0.9 on 2013-09-10, which matches the first tag v0.9. Stars and contributors are the repository's. latestReleaseDate is the v2.4 release on GitHub and the same day on PyPI.
