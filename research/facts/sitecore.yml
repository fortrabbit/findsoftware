notes: >
  The record covers Sitecore Experience Platform, the self-hosted XP product. The 10.5 downloads page lists on-premises downloads (install assistant, Installation Framework, installation guides) and a container deployment package, and the Quick Installation Guide names Windows with IIS and SQL Server, so criterion 3 holds; no end statement was found, and the lifecycle page was not readable. The developer portal and sitecore.com now lead with SitecoreAI, a separate cloud product, not recorded as a hostedOffering, which names Sitecore Managed Cloud, the service that hosts XP. The Master Subscription Terms call the on-premise products subscription-based. The maintainer is the legal entity named in the homepage footer; the footer says "or a Sitecore affiliated company". The x link is the homepage footer link and has no quote because markup is not readable text. The server requirements page names .NET Framework 4.8.0 as the runtime Sitecore Experience Platform requires; it is a Windows-only runtime and not a minimum of the dotnet runtime, so runtimeMin is not recorded. runsAs rests on IIS and the Solr Windows service on the same page. hqCountry comes from the privacy policy, which names Sitecore Holding II A/S as a Danish limited liability company. The documentation requires Windows Server or Windows 11 and IIS; Sitecore Identity needs a separate .NET Windows Hosting Bundle.
