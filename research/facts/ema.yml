notes: >
  The homepage ema.srid.ca is the project's own site and is recorded as homepage; the monorepo README at ema/README.md is the one the repository root links to. The Hackage page names Sridhar Ratnakumar as author and copyright holder; the project's own site and LICENSE name no maintainer. The getting-started page says Nix is optional and the template repository may work with plain cabal; the recorded install method follows the page's recommended path. The highest stable GitHub release is 0.12.0.0 (2025-07-22), which the Hackage listing matches; the repository's first release is 0.1.0.0 (2021-04-26). The Hackage download count is not in the Hackage pages read, so no download figure is recorded. The live server is recorded as a local runsAs value because the getting-started page presents it as the development server; the static output is recorded from the homepage's "static site generation". The homepage says the live server reloads the browser on code or data change, and that an Ema site is built in Haskell with the library.
