notes: >
  No GitHub release or tag exists and the repository has no registry package, so criterion 4 is judged by the last commit on the default branch, dated 2025-01-30, as AGENTS.md states; the record is not ended and the CSV's boundary question is answered by that rule. The homepage answers over HTTPS at jollyui.dev and redirects to www.jollyui.dev; the docs are read on www. The LICENSE file names James Shopland as copyright holder, and the README links to shadcn's license instead, which is the second statement. The introduction page calls the project an add-on to shadcn/ui and says its components translate the shadcn/ui designs onto React Aria Components. The docs name the shadcn CLI with a jollyui.dev registry URL; no npm package of the kit exists. The Twitter link in the docs header is the maintainer's account and is recorded as the project's only social link. The README states MIT by linking shadcn's license text, recorded as its own license statement beside the LICENSE file.
