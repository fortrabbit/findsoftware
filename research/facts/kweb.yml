notes: >
  The homepage https://docs.kweb.io/book does not resolve (no DNS on 2026-10-26), so it is not recorded and the record has no homepage; the README's link to docs.kweb.io is the only pointer to the user manual. The README's "Notice of Project Status (June 2024)" says the author is "no longer able to actively support Kweb" and invites a fork; that is the discontinued signal. The repository kwebio/kweb-core is archived per the API (read 2026-10-26; the row was checked 2026-10-19). The Matrix chat badge (matrix.to/#/#kweb:matrix.org) is in the README but has no field in the starter list. The README names the author by a handle, not a legal name, so maintainer is not recorded. The README Maven Central badge and the Maven metadata name io.kweb:kweb-core, which Maven Central lists up to 1.4.12 while the latest GitHub release is 1.4.13. The first tags are 0.0.x prereleases from January 2017; the oldest stable release is 1.0.0 (2022-10-21), which firstRelease uses. kweb.io redirects to an unrelated site and docs.kweb.io has no DNS. The README describes Kweb as "a remote interface for a web browser's DOM", and its Ktor dependency is recorded as basedOn. Reviewer decision: under the dead-homepage rule this would be a stub without homepage; it is kept discontinued because the README states the project has ended, and the row already says discontinued.
