notes: |-
  The repository is archived on GitHub, last pushed 2026-02-02, the same day as the final release; the README notice "Clarity Core is no longer supported" is the end signal, and it recommends "our updated tools and resources" without naming a successor, so successorOf is not recorded. The clarity.design pages return the same JavaScript shell for every path, so the homepage and get-started pages are unreadable from the raw page and the docs link is taken from the README. The homepage's copyright comment (2016-2026) names Broadcom Inc. as the legal entity; HTML comments are not visible to the quote check, so the maintainer is recorded from the LICENSE as VMware, Inc. and the reviewer should decide whether the current owner is Broadcom Inc. The npm first stable version is 5.0.0 (2021-01-21), with prerelease 5.0.0-next.0 on 2020-12-02. The npm latest tag is 6.17.0, the same as the last GitHub release. The HTTP Archive entry "Clarity" (UI frameworks, description matches this design system) is used for httpArchiveSites, mobile origins, which is the convention the other records follow; the desktop figure is 121. The installation doc imports one web component at a time and shows Angular, Vue and React usage; the README lists @cds/angular and @cds/react as shims for core in those environments, and @cds/city as the open source sans-serif typeface. The README describes the project as built with Web Components; no UI framework is recorded as basedOn. The homepage's meta description names HTML/CSS framework and Angular components, which the README does not state, so neither is recorded. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header.
   The clarity.design homepage now serves the Angular edition of the design system (its meta description names UX guidelines, an HTML/CSS framework and Angular components), which is published from the separate repository vmware-clarity/ng-clarity; that repository is not archived (checked 2026-10-26 with the GitHub API, description "Clarity Angular is a scalable, accessible, customizable, open-source design system built for Angular."). This record covers the vmware-clarity/core repository, the web components, whose README ends support; the reviewer should decide whether the Angular edition needs its own record and whether discontinued describes the design system or only this repository. The README also points to GitHub Discussions on the core repository.
