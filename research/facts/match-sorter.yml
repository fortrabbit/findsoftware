notes: >
  No homepage is recorded: the npm and GitHub homepage fields point to the npm page and the repository README, and the author's personal site is not the project's. The README names no runtime, and it states the browser global only in a code comment ("window.matchSorter.matchSorter"), so runsAs and runtime are left out. The README's Node usage ("require('match-sorter')") is also a code comment. The ranking order in the README (case-sensitive equality, equality, starts with, and so on) is a description of the matcher, and the category fuzzy-match is taken from the candidate row. The npm weekly figure is the sum of the range 2026-09-28 to 2026-10-04, a full week; the API returns zero days for the later weeks. The ecosyste.ms counts are for the npm package. The maintainer is the copyright holder in the LICENSE file. The README's "Inspiration" section says the code was extracted from the author's earlier library genie; genie is not recorded as basedOn because the README names it as the source of code, not as the platform the library is built on. The README names no docs site, so docs is not recorded. The HTTP Archive technologies list does not carry match-sorter.
