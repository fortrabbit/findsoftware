notes: >
  Garchi CMS is a hosted service with a dashboard, a REST API, Node and PHP SDKs, Nuxt, Next.js and Laravel usage guides, and an MCP server for AI agents; MCP is a separate access path to the same content and has no field in the starter list. The team page of the v1 docs describes inviting members to a space, but names no roles, so userRoles is unknown. The docs list multiple languages per space, limited by plan, and the Social publishing feature, which has no field in the starter list. The Claude Code plugin is published from the lumenharbor/garchi-cms-skills repository, which holds skills and the MCP connection rather than the CMS, so no repository is recorded. The About page names LumenHarbor Digital Solutions Limited as the developer and gives Company No. 13470710 with registration in England and Wales; the footer reads "Registered in England & Wales", which is a stated registration country, so hqCountry GB follows that wording; no separate registered office is stated. The homepage footer links Instagram, LinkedIn and YouTube, which have no field here; no x, mastodon, bluesky or discord link was found. The pricing page lists Sandbox, Basic, Pro and higher plans with limits on spaces, items, storage and bandwidth; no prices are recorded.
