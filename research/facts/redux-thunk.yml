notes: >
  The npm homepage field points to the GitHub repository and the project has no site of its own, so no homepage is recorded. The npm package redux-thunk is the one the install section names; the yarn line is the same registry route. The README says the thunk middleware is not directly included with the Redux core library and that @reduxjs/toolkit uses it by default, so the Redux Toolkit relation belongs to that record. The peer dependency on redux ^5.0.0 is a dependency statement, not the basedOn statement, which rests on the README sentence "for Redux". The latest GitHub release is v3.1.0 (2023-12-04); the v3.0.0 prereleases (alpha, beta, rc) are all older than it, so no latestPrereleaseDate is recorded. The oldest release, v0.1.0, and the npm 0.1.0 upload share the date 2015-07-13. The npm weekly figure is the sum of the daily downloads for 2026-11-01 to 2026-11-07. None of the pages names a runtime, so no runtime is recorded. The maintainer follows the LICENSE copyright line. The README says the middleware lets an action creator return a function that receives the store's dispatch and getState methods, that applyMiddleware installs it on a store made with createStore, that it is not directly included with the Redux core library, and that Redux Toolkit's configureStore adds it by default.
