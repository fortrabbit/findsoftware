notes: >
  The README says "Fine Uploader is no longer maintained and the project has been effectively shut down", and the repository the project names is archived (GitHub API archived true, last push 2018-11-19), so the status is discontinued. The homepage fineuploader.com now serves unrelated casino content, so no homepage is recorded; the documentation site docs.fineuploader.com does not resolve, so the docs field points to the getting-started tutorial in the repository docs folder. The tutorial names three routes: npm, a download from the releases page, and a build from the repository. The LICENSE file names three copyright holders: Andrew Valums (2010-2012), Andrew Valums and Raymond S. Nicholus, III (2012-2013) and Widen Enterprises, Inc. (2013-present); the last one is recorded as maintainer. The firstRelease is the 2012 commit date of tag 2.0.0, the oldest version tag; the npm registry's first upload is 5.1.0 in 2015. The newest prerelease, 5.16.0-RC1 (2018-01-04), predates the latest stable release, so no latestPrereleaseDate is recorded. The contributors count is across all pages of the repository.
