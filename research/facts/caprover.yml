notes: >
  The homepage is https://caprover.com/; the CSV row's https://CapRover.com resolves to the same site. The docs page states a server install with docker run and a CLI install with npm install -g caprover, both recorded as installMethod entries. The CLI package on npm is the install route the docs name for the client, so its figures describe the CLI, not the server image; the Docker Hub pull count of the server image caprover/caprover was 228890930 on 2026-10-28 (hub.docker.com/v2/repositories/caprover/caprover/). The get-started page calls the server a dashboard reached on port 3000, but no page read names a runtime, so runtime is not recorded; runsAs always-on rests on the docs sentence that the dashboard is reached on port 3000 of the server once CapRover is initialized. The x link is the docs footer link labeled X. The docs say the built-in templates are for the apps CapRover deploys, not for the platform itself. The homepage says "Free forever", while the troubleshooting page for CapRover Pro describes paid plans with additional features, recorded as paidEdition. The homepage links a YouTube video, a single tutorial and not a channel, so it is not recorded. The OpenCollective donation link is a funding page, not a social link, and it is not recorded. The Apache-2.0 license is stated by the LICENSE file; GitHub reports NOASSERTION for the repository. The highest stable release is v1.15.5 (2026-10-23); the v.14.1 tag from 2025 is a tag name typo that is older than v1.15.x. The first GitHub release is v0.1.2 (2017-11-17); the npm CLI first upload is 2019, which is later.
