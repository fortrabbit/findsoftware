notes: >
  The root README of the repository is a notice that maptalks is upgrading to maptalks-gl, a WebGL and WebGPU map engine in development, and that the old maptalks source has moved to packages/maptalks as a submodule. The maptalks package the homepage documents is the one in packages/maptalks (npm latest 1.13.0, published 2026-10-20, not deprecated), so the record stays accepted: a named successor while the package is still published and documented is no end signal. maptalks-gl is a separate package (the GitHub release tags maptalks-gl@0.125.0 and maptalks-gpu@0.126.0 are its releases) and is not recorded here; a later pass should decide whether maptalks-gl replaces this record. GitHub reports the license as null because the root has no LICENSE file; the BSD-3-Clause text is in packages/maptalks/LICENSE and npm reports BSD-3-Clause. The root repository holds the whole monorepo, so the stars and contributors count the monorepo, not the maptalks package alone. The maptalks package README lists the plugins markercluster, heatmap, mapbox-gl-js, three.js and echarts as separate repositories; they are not records. The README says maptalks is well tested against IE9 to IE11, Firefox and Chrome and names Modern browsers and Electron as supported environments; that is a compatibility list, so no runsAs is recorded, and the Node statement is the SSR line the rule takes as runtime. The download and CDN routes come from the getting-started page; the README gives the same two routes. The first release year is the npm upload 0.0.1 of 2016-03-18; the GitHub repository was created on 2016-02-03, which is the same year. The CSV row dated the release from GitHub; the current stable release is the npm upload 1.13.0, and the newest maptalks tag on the first page of GitHub releases is maptalks@1.4.6 (2025-09-19). The packages/maptalks README lists "Node >= 4.x" for server-side rendering only, a figure from the 0.x era, so no runtimeMin is recorded. The support page (in Chinese) sells paid club membership with support, training and custom development, which is paid support and no edition. The homepage says the library integrates 2D and 3D maps by pitching and rotating 2D maps, that it is open to extension with plugins for mapbox-gl-js, THREE, D3 and ECharts, and that it is developed and maintained on GitHub. The packages/maptalks README lists modern browsers, mobile browsers and Electron among the supported environments, with IE11 limited to 3D features.
