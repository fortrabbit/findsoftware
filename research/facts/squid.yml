notes: >
  The homepage is the project site, which names the Squid Software Foundation as the governing body and states the GPL. The README gives the copyright holder as the Foundation and states the license as GPLv2+; the COPYING file is GPL version 2 and the GitHub API reports GPL-2.0, which is the same license in two wordings. The Foundation page says it was incorporated as a Colorado, USA non-profit, which gives no project headquarters, so hqCountry is absent. The versions page says the developers can only support the latest stable version and that support for older versions may be available through distributions or third parties, and the current series is 7.7, so currentMajor is 7 and the minor line is not recorded. The latest GitHub release is SQUID_7_7 (2026-08-24). The release list begins with HISTORIC_RELEASES and SQUID_3_0_PRE1 imports from 2024-12-30, so firstRelease is absent: the ChangeLog gives no release date for its earliest entries, and no page on the site or wiki states a first-release year (the about page says Squid is based on the Harvest Cache Daemon of the early 1990s, and the README copyright line starts in 1996, which is not a release date). The homepage describes Squid as a server accelerator and names website content acceleration; the FAQ page on installing Squid describes running it in the background as a daemon process, which is the runsAs source. The Docker Hub image ubuntu/squid (59,266,029 pulls) is Canonical's image, not one the project names, so no dockerPulls is recorded. The project's own download page names no Docker image. Contributors counted without anon across all pages (last page 192). The mailing lists page lists squid-users for community support, which has no field. Fields coined here: none.
