notes: >
  Monorepo: the stars and contributors belong to TypeCellOS/BlockNote, which holds the core, React, Mantine, Ariakit, shadcn and XL packages; the npm figure is the core package @blocknote/core, the package the install guide names first. @blocknote/react had 958,288 downloads in the same week and is not recorded as a second npmName. Prosemirror is the other project the repository description names as built upon; it has no record, so it stays in notes. The core is MPL-2.0; the XL packages under GPL-3.0 are dual-licensed with a commercial license in the Business tier, which the pricing page states. The Business tier's paid features include AI integration, multi-column layouts and PDF, Docx, ODT and email export, and the pricing page states that the XL packages are free for open source projects under GPL-3.0. The maintainer is the legal entity on the terms page, OpenBlocks B.V., which the README and the homepage call BlockNote; the terms page names a Chamber of Commerce registration and a Rotterdam court, which are not a headquarters statement, so hqCountry is not recorded. The getting-started page says "Because BlockNote is a client-only component, make sure to disable server-side rendering of BlockNote" for Next.js and other server-side React frameworks; runsAs is not recorded from it. The getting-started page names React; the Vanilla JS and Mantine guides are the framework routes. The discord link comes from the homepage footer. The GitHub repository reports no license it can detect; the MPL-2.0 entry is the npm package of the core. The first npm version is dated 2022-08-23, and the repository was created in 2022.
