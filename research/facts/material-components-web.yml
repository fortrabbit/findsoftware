notes: >
  Status: the README notice says the project "is no longer actively maintained" and the repository is archived on GitHub (api archived true, checked 2026-10-27). No successor is named in the README. The README says the project is the successor to Material Design Lite (getmdl.io), which is not a record, so no successorOf is set. The homepage is left out: the CSV URL material.io/develop/web now serves Material Design 3 for Web, which is the successor project Material Web, not this one, and the demo catalog is a JavaScript shell. The discord link is the channel named in the README "Need help?" section. The README and getting-started say the JS is ES2015 modules and Sass, and the npm all-in-one package is material-components-web. The npm figure counts that package. The latest GitHub release is v14.0.0 (2022-04-28), same as the npm latest. The README states that Angular Material moved away from this library; that is not recorded as a fact.
