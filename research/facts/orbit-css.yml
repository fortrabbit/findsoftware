notes: >
  The npm package for this project is @zumer/orbit; the unscoped npm name orbit belongs to an unrelated package by another author, so it is not used. The 1.x documentation at zumerlab.com/orbit-docs stays online, and the homepage now describes 2.0, released 2026-10-27; the 2.0.0 and 2.0.1 releases and 1.6.0 share that day. The LICENSE copyright line names Juan Martín Muda and ZumerLab together; the maintainer field takes the person, and ZumerLab is the GitHub organization. The homepage names Zumerlab as the maker. The README says a small runtime keeps numbering, spacing and SVG arcs right, next to the CSS; no page states where that runtime runs, so runsAs is not recorded. The npm figure counts @zumer/orbit, the only npm package the README names. The README says the markup works the same in plain HTML, React, Vue, Svelte or anything else that renders the DOM.
