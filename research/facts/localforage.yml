notes: >
  The package.json author and the README copyright line both name Mozilla, so Mozilla is recorded as the maintainer; the Apache LICENSE file carries no copyright line of its own, and the repository owner is the localForage organization. The README lists framework storage drivers (AngularJS, Angular, Backbone, Ember, Vue, NuxtJS) and custom drivers on the wiki; these are third-party projects and are not recorded. The README says localForage uses localStorage in browsers without IndexedDB or WebSQL support, and that the storage backends are IndexedDB or WebSQL, so the backends are client storage and not the databases field. The README says the API is asynchronous, so reads and writes return promises or take callbacks, and that localStorage limits make many large Blobs impossible on that backend. The Chinese documentation at localforage.docschina.org is a translation by a third party and is not recorded. The newest stable release is 1.10.0 from 2021-08-18, the same as the npm latest; the last commit on the default branch was 2024-07-30, so the import judges listing by the release date. The GitHub API reports Apache-2.0 for the repository and the README states the Apache License, so the two agree and are recorded as two statements of one license. The homepage is the project's GitHub Pages API documentation; its visible text is a shell that loads api.md, and its description sits in a meta tag, so the homepage fact carries no quote.
