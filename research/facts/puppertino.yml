notes: >
  The CSV homepage http://puppertino.com/ answers 200 over plain http and redirects to https://puppertino.com/, which is the homepage recorded; the https address is the one the project's own README and llms.txt use. The README names the framework's docs at https://puppertino.com/ and says it is plain CSS with no build step and no dependencies. The npm package @codedgar/puppertino is the install name the README and llms.txt give; llms.txt says the unscoped puppertino package is not this project. The npm weekly figure is 48 for 2026-10-19 to 2026-10-25, which is recorded as the install-docs package's figure. The latest GitHub release v2.0.0 is the highest stable tag; the npm latest is the same version. firstRelease is 2021 from the oldest GitHub release v1.0 (2021-04-26); the npm history for 1.0.0 begins in 2025 and does not belong to the first release. The maintainer is Edgar Pérez as the LICENSE copyright line (2019) names him; the README says "Puppertino is made by Codedgar" and links codedgar.com, which is the same person under his handle. The README says components that open, float or drag have a JavaScript helper in src/js/ (menus, popovers, modals, sheets, sliders, date pickers, the Dock), each component page in the docs names the helper it needs, and the CSS in dist/css/ is written by hand with only the .min.css bundles generated. The creator's own site codedgar.com names Edgar Pérez as a frontend design engineer and shows no legal imprint, so no hqCountry is recorded. The HTTP Archive technologies list has no Puppertino entry. The x link is the project's badge in the README, not the creator's own account.
