notes: >
  The record is the design system; the core package @siemens/ix is the one the JavaScript install page names, and the framework packages @siemens/ix-react, @siemens/ix-vue, @siemens/ix-angular and @siemens/ix-icons are separate npm packages of the same monorepo, so they are not recorded as npm names. The Blazor route is the SiemensIXBlazor NuGet package, which the Blazor page marks experimental; it is recorded as an installMethod for the reviewer to keep or drop. The README calls the project "Build based on native Web Components" and its badges name Stencil; the install and overview pages state neither a build tool nor a basedOn, so basedOn is not recorded. The GitHub repository holds a monorepo; the highest stable release is @siemens/ix 5.3.0. The oldest GitHub release is v1.0.0-beta.2 from 2022-09-30, a prerelease, which sets firstRelease. The newest prerelease, @siemens/ix 3.0.0-alpha.4 from 2025-04-10, is older than the latest release, so no latestPrereleaseDate is recorded. The license is stated as "This project is MIT licensed" in the README (copyright 2022 Siemens AG) and as "MIT License" with "Copyright (c) 2024 Siemens AG" in LICENSE.md; both name Siemens AG and MIT, so they are one entry. The corporate information page names the legal entity Siemens Aktiengesellschaft and the Munich headquarters. The homepage at the root path is a documentation shell; the docs overview page carries the description. The Figma library is maintained in a Siemens AG account for employees, with a classic open-source library on request; it is not an install route and is not recorded.
