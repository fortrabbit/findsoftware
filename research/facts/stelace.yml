notes: >
  No stable release exists: the GitHub releases are all v1.0.0-beta.x prereleases, the newest v1.0.0-beta.8 published 2020-07-10. The default branch's last commit is 2024-02-10. The import moves a record with no release or pre-release in four years to stub, and this record has a pre-release from 2020, so the import will set stub on its own; the status is left at accepted here. The first release is 1.0.0-beta.0 (2019), also a prerelease. The README describes a hosted Stelace as-a-service offer with managed infrastructure, an admin dashboard and an enterprise support option; the open-source API server is what this record covers, and no prices are recorded. The homepage says a commercial license with Enterprise support can be bought alongside running one's own instance, which is recorded as paidEdition. The README lists search and matchmaking over assets, user authentication with social login, a customizable transaction process, events and webhooks, workflows, a content management API and a plugin system as included APIs. The README names Elasticsearch 7.x and Redis 5.x as requirements next to PostgreSQL; the search and cache services are not recorded as databases. The README names the Objection.js ORM and the AVA test runner; not fields. The npm package named stelace (latest 0.14.0) was not confirmed as this server, so no npm figure is recorded. The footer of stelace.com reads 2024. The README links the Stelace Twitter account; the x field is set from it. The README says its license is GPL v3 with other licensing options on request, and the Sharinplace SAS copyright line gives the legal form; the terms page names the company Sharinplace and its Paris address. docs/sso.md names an openid protocol for SSO connections. The README says Elasticsearch and Redis are required next to PostgreSQL. The README lists a "Content management API (headless CMS)" as one feature of the API server, not as what the project is, so the category is backend.
