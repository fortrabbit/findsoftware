notes: >
  The homepage's Sites Using Smarty list and advertisements are third-party casino and gambling links; no fact is taken from them. The Quick Install page describes the Smarty 3.0 tarball and is not used for install routes; the current route is Composer, from the getting-started page and the README. The site's copyright footer reads "Smarty Copyright © 2002 – 2026 New Digital Group, Inc."; the copyright page says the Smarty name and logo are trademarks of New Digital Group, Inc. The LICENSE file has no copyright line. The site and the copyright notice say LGPL without a version; composer.json says LGPL-3.0, and the LICENSE header offers version 3.0 of the License or any later version, so the two statements are two entries. The credits page names individual maintainers (Simon Wisselink for Smarty 4 and 5, Monte Ohrt and Uwe Tews as original co-authors); they are not recorded as the maintainer because the legal notice names the company. The repository's GitHub owner is the smarty-php organization. The homepage Discussion link goes to the r/smarty subreddit; the mailing list page offers Smarty-Announce, a read-only list for announcements, recorded as newsletter; the discussion list is an archive and is not recorded. The sponsors section of the README names Temma, an MVC framework based on Smarty; that is a statement about another project and no basedOn for this record. The getting-started page and the README give PHP 7.2 to PHP 8.6 as the run range, and the composer.json at the v5.9.0 tag gives the minimum. Smarty 4 is still released (v4.6.0 on the same day as v5.9.0); the highest stable release of the package is the v5 line, so currentMajor is 5. The tags before v3.1.24 (v2.6.24 to v2.6.26, all committed within minutes on 2014-10-30) are a repository import, and the changelog starts at 3.1.35, so no first release date is recorded; the site footer shows a copyright from 2002. Smarty compiles each template into a PHP script once and reuses the compiled version (the site's about page); the Download page offers the latest master as a zip file and links the GitHub releases and tags. The forum entry is the discussions link in composer.json. The Packagist figure is the total of all downloads. The repository's stars and contributors are for the repository. The Smarty template language is the template engine itself, so no templating field is recorded.
