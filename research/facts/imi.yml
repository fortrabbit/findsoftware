notes: >
  The install command names imiphp/project-http, a skeleton; the registry figures come from imiphp/imi, the core package the skeleton requires. The project site and its manual did not answer (HTTP 522) at the time of research, so the homepage is taken from the repository's homepage field and the manual's link from the README; neither page is cited as read. No page names a maintainer (neither README nor composer.json lists authors), so the GitHub organization name is recorded. The license is written as Mulan PSL v2 in the LICENSE file and the README badge; GitHub reports it as NOASSERTION because it is not an SPDX-listed id in its detector. The Packagist v2.1.66 time is 2026-07-27 while the GitHub release is dated 2026-07-31. firstRelease is the first tag on Packagist (v0.0.1-alpha, 2018). The README gives a database list that includes Redis; only MySQL and PostgreSQL are recorded as databases. Chinese is the language of the project's own pages, which the record describes in English.
