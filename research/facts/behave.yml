notes: >
  GitHub detects no license (NOASSERTION); the LICENSE file is a BSD-style text and pyproject.toml at v1.3.3 names BSD-2-Clause, which is the license recorded. The LICENSE copyright lines name Benno Rice and Richard Jones (2012-2014) and Jens Engel and others (2014-2023); the latest line is recorded as maintainer. The pyproject lists Jens Engel and Peter Bittner as maintainers, and Benno Rice and Richard Jones as authors. The active requires-python line of v1.3.3 is ">=2.7"; a commented-out line in the same file names ">=3.6" as disabled. The active statement is recorded as runtimeMin, a reviewer decision. The homepage and docs facts point at /en/stable/, which describes 1.3.3; /en/latest/ describes a 1.4.0.dev0 development version. The docs page "Behave Ecosystem" lists software that enhances behave; it is a related-software list, not a plugin directory, and is not recorded as pluginDirectory. The install page lists pip, a source distribution ("pip install ."), the GitHub repository and optional extras; each route is an installMethod entry, the extras are not. Feature files are written in Gherkin, and the gherkin page lists other languages through "behave --lang-list". The README badges name GitHub Discussions (recorded as forum), Gitter and Gurubase (not recorded). The PyPI upload history starts with 1.0.0 on 2011-12-05, older than every GitHub tag.
