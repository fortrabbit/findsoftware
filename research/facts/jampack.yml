notes: >
  The unscoped npm name jampack is a different package (version 0.0.7, BSD-2-Clause, msgpack keywords, other author); the install docs name @divriots/jampack, which is the registry package recorded. The repository has no GitHub release or tag, so the npm release 0.34.2 (2026-10-04) stands for latestReleaseDate and currentMajor 0 comes from that registry version. The npm package was first published 2020-05-06 (0.0.1), while the GitHub repository was created 2022-09-19; firstRelease follows the registry upload. The maintainer legal name and address come from the terms and privacy pages of the code.to.design product of the same company, which the LICENSE copyright ("Copyright 2022 ‹div›RIOTS") and the homepage ("Brought to you by") name. The project's homepage lists sites that use jampack and says "Powering all ‹div›RIOTS' websites"; these are not recorded as adoption figures. The site's CLI page and the installation page describe the tool as run during builds; the README and the CLI page name no runtime, so runtime node comes from the npm engines field (node >=14.0.0). The README links a Discord invite on its badge as well as on the homepage. The npm weekly figure is the sum of the 2026-09-28 to 2026-10-04 range. The README calls Jampack "Not a bundler. Not a framework." and lists responsive images through srcset, a second pass that compresses untouched assets under the same name, inline critical CSS, link prefetching, and lazy loading of images and iframes below the fold.
