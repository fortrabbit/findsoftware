notes: >
  No page read names a maintainer or company; the homepage lists companies using Phoenix, which are users, not sponsors. The two runtimeMin entries differ: the installation guide asks for Elixir 1.17 and Erlang 25, while the 1.8.15 package metadata declares elixir ~> 1.15; both are recorded. firstRelease is the year of the first Hex publish (April 2014). The generator adds Tailwind and esbuild by default; LiveView ships as a separate package (phoenix_live_view) and is not given its own record here. hexDownloads `recent` is the API's own "recent" figure, period not stated in the response. Docs moved from hexdocs.pm/phoenix to phoenix.hexdocs.pm. Coined fields: `hexName`, `hexDownloads` (Hex counterparts of packagistName and packagistDownloads); reused `chat` for the IRC channel.
