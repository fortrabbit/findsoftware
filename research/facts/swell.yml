notes: >
  Swell is a hosted service: the terms license its cloud-based platform, and no installable part is named. The platform's pricing page and homepage describe a Backend API and a Frontend API; the Backend API is REST and the Frontend API page names GraphQL for client-side use. The terms give Swell Commerce Corp. as the licensor and California as the governing law, which is not a headquarters statement, so hqCountry is unknown. The GitHub organization (github.com/swellstores) holds client code and is not recorded. The pricing page lists "Start free trial" on every plan with no free tier, so freeTier is unknown. The pricing page lists plan prices in USD, which are not recorded, and its plan admin-user counts have no field in the starter list. The pricing and homepage feature lists name products, orders, customers, fulfillment, reporting, storefronts, checkouts, subscriptions, wholesale pricing, payments and no-code integrations; they are not recorded as fields. No multisite fact is recorded: "Multi-store admin accounts" describes user accounts, not sites.
