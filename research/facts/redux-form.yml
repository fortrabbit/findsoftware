notes: >
  Doubt about listing: the homepage says "Do not begin a project with Redux Form." and names React Final Form as the library to use instead; the README says the same for new projects and gives "the only good reason" to use Redux Form as tight coupling of form data with Redux. The project is not declared ended: the repository is not archived, the latest stable release is 8.3.10 and the npm latest is not deprecated, so the record is a stub rather than discontinued. The homepage redux-form.com answers with a JavaScript redirect to the 8.3.0 documentation, which is the page read. The README names a migration guide for projects already on Redux Form; it lives on the final-form.org site, so the importsFrom link belongs on the react-final-form record. The package declares react, react-redux and redux as peer dependencies; react-redux is a peer dependency, not a basedOn statement. The basedOn values come from the README sentence that it works with React Redux to let a React form use Redux to store all its state. No runtime is recorded: the engines field of package.json (node >=8.10) is the floor of a browser library. The maintainer follows the LICENSE copyright line; the homepage says "Created by Erik Rasmussen". The category forms is the value other form libraries use. The npm figure is the redux-form package the README installs. The README also carries a Form Nerd sponsorship banner, which is not recorded.
