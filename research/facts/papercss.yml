notes: >
  The homepage answers at www.getpapercss.com after a redirect from getpapercss.com; the www address is recorded. The homepage links the repository as rhyneav/papercss, which resolves to papercss/papercss, the candidate's repository. The GitHub API lists the owner as an organization, but the copyright line names a person, and the maintainer is recorded as the person named in the LICENSE. The repository language on GitHub is SCSS; the package ships dist/paper.css, so the language is recorded as CSS. The last commit on the default branch is 2025-07-31, after the latest release of 2023-05-29; the latest release is what the record shows. No HTTP Archive technology matched PaperCSS. The npm package is papercss, named in the homepage install line. The about page says the original creator and two other maintainers keep the project; the README says it is maintained by the PaperCSS team. The about page states the goal of adding as few classes as possible ("a button should just look like a paper button", with no paper-button class) and says the documentation is built with Hugo.
