notes: >
  The package is published on npm as slonik, which is the documented install route. The README has no installation section and shows import lines from "slonik" and "@slonik/pg-driver"; the packages/slonik/README.md only points to the repository. The repository has no project site (its homepage field is empty), so no homepage is recorded. The package is a pnpm monorepo: the GitHub release list carries per-package tags, and the record takes the slonik@49.13.0 release, the newest stable release of the package the README names, whose package.json states the node engine. Stars and contributors belong to the monorepo. GitHub detects no license (NOASSERTION) because the LICENSE file has the BSD wording without a name; the package.json license field names BSD-3-Clause and the LICENSE file carries the BSD-3-Clause text, so one license entry is recorded. The x link is the maintainer's Twitter badge in the README. The README says the library began as utilities for node-postgres and continues to use the pg driver, and that it is built on top of pg; there is no pg record, so that relationship stays here and is not basedOn. The README compares Slonik with pg, pg-promise and postgres in a "How are they different?" section; none has a record, so alternativeTo is not recorded, and its link "Stop using Knex.js" is an article title, not a comparison sentence. The README's Migrations section says the library does not handle migrations, and its Runtime validation section integrates zod; neither is a field. The first release on GitHub is v1.0.0 in March 2017 and the first npm upload is version 1.0.0 in November 2017.
