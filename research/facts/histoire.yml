notes: >
  The npm package histoire is the core of a monorepo (packages/histoire); the install docs name it, so its figures are recorded. Its npm dist-tag latest is 1.0.0-beta.1 (2026-01-07) and next is 1.0.0-alpha.1; the newest stable GitHub release is v0.17.17 (2024-04-09), so currentMajor is 0 and the beta is recorded as latestPrereleaseDate. A reviewer must decide whether the record waits for 1.0: the docs describe 1.0-beta features (MCP tools, Node deployment, Node 22.12 requirement) that the stable 0.17.17 package does not have. The stable package.json (v0.17.17) has no engines field and peers vite ^2.9.0 through ^5.0.0, so runtimeMin is not recorded. The runsAs local fact cites the CLI list of the Vue install page, which the stable 0.17.17 docs hold too. No runtime is recorded: the Node 22.12 line in the main docs belongs to the beta, and the stable release declares no engines for the histoire package (the monorepo root says node >14.5.0). The vue3 install page gives npm, pnpm and yarn commands, each its own installMethod entry. The repository moved from Akryum/histoire, the name in the npm repository field; the old name redirects. The homepage social icons (twitter and Mastodon) are recorded without a quote because the page shows them as icon links. The ecosyste.ms entry for histoire returned HTTP 500 on two reads, so no dependent counts are recorded. The README names Vue 3, React 18 and 19, Svelte 4 and 5, Nuxt 3 and 4 and SvelteKit 2 and 3 as supported frameworks; these are compatibility statements, not basedOn values. The docs name Percy and Lost Pixel for visual regression, and the MCP server, the Node deployment target and the embedded test runtime are beta features in the docs; none is a field. Contributors counted across all pages (per_page=1, last page 79).
  The index page says a story shows one or more components in the browser, that a story holds variants, and that the book has an interactive preview, copyable code, controls, Markdown documentation and a search index. The getting-started page lists Vue 3, React 18 and 19, Svelte 4 and 5, Nuxt 3 and 4 and SvelteKit 2 and 3, and says Nuxt and SvelteKit each add their own plugin next to the Vue or Svelte one.
