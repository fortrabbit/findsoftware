notes: >
  The project's documentation says the license is "GPLv3+" and records it as one license entry; the README says "GLPv3", a typo, and the GitHub license file is the GNU General Public License. The LICENSE file carries no copyright line, so the maintainer is the PyPI author field. The repository's primary language on GitHub is HTML, so language is recorded from the README. The first release year is the oldest PyPI upload, 0.1 dated 2016-02-09; the oldest GitHub release is 0.5 dated 2017-06-04. The latest release date is the PyPI 1.1.5 upload of 2021-01-31, which has no GitHub release; the newest GitHub release is 1.1.4 dated 2020-11-23. The install page names Python without a version, so runtimeMin is absent. The install page lists graphicsmagick and a video converter (ffmpeg or libav-tools) for building galleries and rsync for deployment. "prosopopee deploy" uploads the build folder with rsync. The last push to the repository is 2025-11-02.
