notes: >
  No homepage: the PyPI home page and the README's bitbucket link are plain http (http://bitbucket.org/mchaput/whoosh), so no homepage is recorded. The README states no end of the project; the repository's default branch was last committed on 2022-01-15, and the last PyPI release (2.7.4) is dated 2016-04-04. The import moves a record whose latest release is older than four years to stub; reviewer decides whether the candidate row's "original abandoned" makes it discontinued. A community fork, whoosh-reloaded (PyPI 2.7.5, 2024-02-02, GitHub Sygil-Dev), is not recorded as a successor of this project. The repository has tags up to v2.7.4 and no GitHub releases; currentMajor follows the registry's stable version 2.7.4. The PyPI figure is last month's downloads from pypistats; the candidates row's 223.4k per week is an earlier figure. runtimeMin is left out because PyPI states no requires_python. Fields coined: none.
