notes: >
  The homepage is a client-rendered shell: its raw HTML carries the title and a script, and its docs routes (/en-US and the os-theme docs paths) answer 404, so the rendered docs were not readable; the docs source under demo/pages/docs/*/enUS/index.md in the repository is readable, and the CDN install step is taken from its UMD page, the npm step from the README. The repository has no GitHub release, so currentMajor and latestReleaseDate come from the npm latest tag (2.45.3, published 2026-08-27); the repository's tags include 2.x betas older than that. firstRelease is the npm first publish date (2020-02-25, same maintainer and package history); the GitHub repository was created 2021-06-04. The LICENSE copyright line names TuSimple; the terms and imprint pages were not found, so hqCountry is absent. Two license statements: the code is MIT, and the graphics of the result component are CC-BY 4.0 per the README. httpArchiveSites is the mobile figure; the desktop figure is 1787. npmWeeklyDownloads is the sum of daily downloads for 2026-10-18 to 2026-10-24. Fonts come from the vfonts package, which the README names, and the README recommends xicons for icons. The theme is set through a theme overrides object in JavaScript, and the README says no Less, Sass, CSS variable tooling or webpack loader is required. No CSS import is needed for the components.
