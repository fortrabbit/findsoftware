notes: >
  The README and the docs index state that Encore is in low-maintenance mode: "Webpack Encore is now in low-maintenance mode (bug fixes, security patches, and `peerDependencies` updates only)." It names Symfony Reprise as the migration target and the Symfony AssetMapper component as an alternative; neither is a successor record, and no end statement exists, so the status stays accepted. The README also says Encore is "inspired by Webpacker and Mix" (a relation of inspiration, not basedOn). The npm package is @symfony/webpack-encore; the install docs name it, and its weekly figure is the range 2026-09-28 to 2026-10-04 (252361). The Symfony bundle symfony/webpack-encore-bundle is a Composer package for Symfony applications and carries no download figure here. The installation page's "on deploy, create a production build" comment is an example, not a runsAs statement; runsAs local rests on the simple-example sentence about building assets. The LICENSE copyright line names Fabien Potencier for 2017 to 2021; the README names Symfony as the maker, which is the maintainer recorded. The npm package's license and engines match the v7.2.0 manifest. The homepage is the Symfony Frontend overview page, the GitHub homepage field; the Encore documentation is at the docs URL. The installation page says the Symfony Flex install creates the assets directory and a webpack.config.js file, and its example configuration sets the output path to public/build/ and the public path to /build.
