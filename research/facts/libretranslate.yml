notes: >
  The engine is provided by the Argos Translate library (github.com/argosopentech/argos-translate), which the docs and homepage say the translation engine is "powered by"; the project does not say it is based on Argos, so no basedOn is recorded and Argos is not a record. The pyproject at v1.9.6 names two maintainers: Piero Toffanin (an individual, with a contact address not recorded) and LibreTranslate Authors; the collective name is recorded, and the reviewer decides whether the individual should be the maintainer. The LICENSE file at v1.9.6 is the AGPL-3.0 text with no copyright line. The homepage says "License: AGPLv3" and the docs say "GNU Affero General Public License v3"; these are one license, recorded once. The Managed Hosting service at libretranslate.com is a hosted offering of the same software; no prices are recorded. The API reference pages were not read in full: the translate endpoint appears in the quickstart as a POST to /translate, so no headlessApi value is recorded. The docs list the Helm chart in a separate helm-chart repository; only the install command on the installation page is recorded. The homepage footer and docs navigation show no Discord, X, or YouTube link, and the Mastodon and Bluesky links are not on the homepage. The current minor line (1.9) is not recorded as currentMajor, which holds the major only.
