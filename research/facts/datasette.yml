notes: >
  Accepted on criteria 1 and 5: the homepage describes it as a tool for exploring and publishing data that publishes a website and JSON API over data, maintained by its author Simon Willison, with 11525 stars and Docker Hub pulls. A reviewer should decide whether a data exploration tool counts under criterion 1 as a site-building tool, since the same reasoning puts Adminer in scope. The stable release line is 0.65.5 (2026-09-16), so currentMajor is 0 under the rule for the highest stable release; the 1.0 line is in alpha, the newest being 1.0a41 (2026-09-24), recorded as latestPrereleaseDate. The 0.65.5 release is the one the setup.py at tag 0.65.5 describes, and the PyPI metadata says the same Python minimum; the installation page's "Python 3.7 or higher" is older text and is not used. The stable docs pages at docs.datasette.io/en/stable carry older text (Python 3.7 on the installation page, copyright 2017-2022), so they are not used for the version. The license is Apache-2.0 in both GitHub and PyPI metadata, and the LICENSE file carries no copyright line, so the maintainer comes from setup.py. The first GitHub release is 0.12 (2017-11-16) and the repository was created 2017-10-23; firstRelease is 2017. The homepage ecosystem count of 154 plugins is the project's own figure and is dated 2026-10-28. The homepage links Discord; no newsletter or social account URL was found among its links, so none is recorded. The deployment page says Datasette is not designed to run as root, so it listens on a high port and a proxy such as nginx, Apache or HAProxy serves ports 80 and 443. The deployment page names Heroku, Google Cloud Run and Vercel as targets for publish, and buildpack hosting on Heroku, DigitalOcean App Platform and Scalingo; these are third-party hosts and are not a hostedOffering. Datasette Apps, announced 2026-06-18 on the homepage, is a feature of the software and is not recorded as a field. The homepage's "Datasette Desktop" is a Mac app, recorded as an install route with runsAs local. Roles and single sign-on are not built in: the authentication docs call roles a convention plugins may implement and name single sign-on as a plugin-provided style, so userRoles and sso are not recorded. The headless API is a JSON API; the docs do not name the style as REST or GraphQL, so headlessApi is not recorded.
