notes: >
  The README says the ORM "sits on top of a powerful database abstraction layer (DBAL)", and the stable docs say "Doctrine DBAL and Doctrine Common both have their own documentation"; the README sentence names the DBAL as the layer the ORM sits on, so basedOn is doctrine-dbal. Databases come through the DBAL: the ORM docs name MySQL and SQL Server only in topic titles (MySQL tables, SQL Server datetime), which is no support statement, so databases is not recorded and the DBAL record holds the vendor list. The project page and the README list 4.0 as a branch in development and 3.8 as upcoming; the 4.0 line is no release, so currentMajor is 3. The 2.20 line still gets releases (2.20.14, 2026-10-30) beside 3.7.6; the release-line history goes to notes. The stable configuration chapter shows the DBAL driver call (DriverManager) that the ORM bootstrap uses. The default branch is 3.7.x. firstRelease is 2011 from the oldest Packagist upload (2.1.3, 2011-11-21). The Packagist monthly figure on 2026-11-04 was 8409485, not recorded because the field keeps the total. Stars and contributors belong to the repository.
