notes: >
  The GitHub repository mbutterick/pollen is a mirror, and its description names the GitLab repository as the main one, so the GitLab repository is recorded and the GitHub archive flag is no signal under AGENTS.md. The GitHub stargazer and contributor counts belong to the mirror and go in no fact. The project's README says "Actively developed, though the pace has slowed"; that is not an end signal and status stays accepted. The project has tags on GitHub (v3.2 is the highest version tag) but no GitHub releases and no Racket package catalogue entry was read, so no latestReleaseDate is recorded; the tag date is not a release date. The homepage is not recorded: the project's repository is the only site the README names, and the "Full docs" link points to the Racket documentation server, which is not read here as a project site. The README names Pollen as the author's publishing tool for three books, which is not recorded as a fact.
  The docs at docs.racket-lang.org/pollen are the project's documentation (the README links the same docs on pkg-build.racket-lang.org over http). The installation page says Pollen runs on Mac OS, Linux or Windows on top of Racket, and that its project web server is a development and previewing tool, not needed to deploy.  The GitLab project reports 5 stars; no figure is recorded.
