notes: >
  Doubt: the homepage in the GitHub Pages config, rackla.org, does not resolve (no DNS), so no homepage is recorded and status is stub under AGENTS.md; settling it needs a live project site or a statement from the maintainer on the project's status. The repository's master branch last committed 2016-09-25, the same day as Hex release 1.2.1, and the repository and Hex package carry no archive, deprecation or end statement; that is an observation, not a discontinued signal. The repository has git tags v1.2.1 down to v1.0.0 and no GitHub releases; currentMajor and latestReleaseDate come from the Hex package, whose latest version is 1.2.1. The GitHub API reports license NOASSERTION, so the license is recorded from LICENSE and the README statement. The hexDownloads figure is the all-time total from the Hex API. The README says it was initially created for a master's thesis; that is not recorded as a fact. The mix.exs elixir requirement (~> 1.0) is a language requirement, not a runtime minimum, and no OTP minimum is stated, so runtimeMin is not recorded. The README describes a companion skeleton project (rackla_skeleton) that deploys a gateway to a cloud service such as Heroku or builds a Docker image; runsAs always-on is read from that deployment statement. The Hex metadata also names Anton Fagerberg as maintainer.
