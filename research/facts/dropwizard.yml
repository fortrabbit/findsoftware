notes: >
  The row's homepage is the project's own site, www.dropwizard.io, which redirects to the stable documentation; the docs are Sphinx pages under www.dropwizard.io/en/stable/. The project's own pages state the copyright holder as Dropwizard Team, with Coda Hale and Yammer Inc. named for the 2010-2013 years, so maintainer is recorded as Dropwizard Team. firstRelease is 2011 from the oldest tag, v0.0.1, dated 2011-03-15 by its tagger; the oldest Maven Central upload (com.yammer.dropwizard:dropwizard-core 0.1.0, December 2011) is no earlier, and io.dropwizard artifacts start in 2014; the GitHub releases list starts at v0.8.0 in 2015. The Maven Central entry for io.dropwizard:dropwizard-core is the artifact the README badge names; Maven publishes no download figure, so none is recorded. Dropwizard's own statement that it pulls together Jetty, Jersey, Jackson, Logback and other libraries is a list of components, not a parent project, so no basedOn is recorded. The user mailing list is a Google Groups forum and is recorded as forum; the developer mailing list is not recorded. Liquibase and JDBI are named for migrations and database access; the manual does not list which databases the stack supports, so databases is not recorded. The highest stable GitHub release is 5.0.2; 4.0.17 and 3.0.17 are maintenance releases of older lines and are not the current major.
