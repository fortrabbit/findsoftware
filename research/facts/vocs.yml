notes: >
  The LICENSE copyright line reads "Copyright (c) 2025-present" with no name, so the maintainer is the name the site header uses ("Vocs by Wevm"); no page read gives a legal form. The deployment docs name Vercel, Netlify and Node.js pages, and show a multi-stage Dockerfile for the Node server; none recorded as fields. The site and the Node deployment page both describe a Vite and Waku stack; the deployment page is the only source for rendering modes. The Docker example pins node:24-alpine; it is an example, not a stated minimum, so runtimeMin stays unknown. The npm package peer dependencies list react ^19.3.0 and vite ^8; the docs say Vocs requires React 19.3. The dist-tags include rc 2.0.0-rc.3, older than latest, so no latestPrereleaseDate. The customization page for SSG or SSR, listed in the site navigation, returned 404 when read, so no claim about SSG beyond the Node page. The README uses the name Vocs in its title and the repository is wevm/vocs.
