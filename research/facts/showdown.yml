notes: >
  No homepage is recorded. The package.json homepage field names showdownjs.eu, but that page is a generic landing page (a title, a contact form and an email sign-up) that never describes Showdown, so it is not the project's site; the GitHub repository homepage field is empty, the npm registry page names showdownjs.com, which does not answer, and the README's live demo at demo.showdownjs.eu does not answer either. The latest stable release is 2.1.0 (GitHub release, 2022-04-21), which matches npm latest; the default branch's package.json carries 3.0.0-rc2 with a node >=20 engines field, a git tag with no GitHub release object, recorded as latestPrereleaseDate, and the README marks its CommonMark options "since v3.0.0"; the engines field of a prerelease is no runtimeMin for the stable line, so none is recorded. The README says ShowdownJS from v2.0 onwards is released under the MIT license and previous versions under BSD; the license describes the latest release, so the BSD statement stays here. The npm registry's oldest upload, 0.0.1, is dated 2011-04-12, earlier than the oldest git tag (v0.3.1, 2012-11-02), so firstRelease is 2011. The npm weekly figure counts downloads of the npm package named by the install docs; stars and contributors belong to the repository. The README describes Showdown as based on the original works of John Gruber, offers flavors (original, vanilla, gfm, commonmark), a bundled command-line tool, an ngShowdown plugin for AngularJS, a vue-showdown component and DefinitelyTyped types, and says Showdown does not sanitize input by design, has a safeMode option and recommends a dedicated HTML sanitizer for untrusted Markdown; these are feature statements and stay in notes. The README is free-library text with a PayPal donation link, a Gitter chat badge and a call for members to help maintain the project, none recorded as facts. The README's list of projects that use Showdown names no relation the record needs.
