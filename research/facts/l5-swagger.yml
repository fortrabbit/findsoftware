notes: >
  Accepted under criterion 1 as a Laravel package that generates API documentation for a Laravel application: it is installed into a site's code, not a finished application. No homepage: the repository is the only project site, and its README points to the GitHub wiki for the documentation, so the wiki Getting Started page is the docs fact. The README says the package is a wrapper of swagger-php and swagger-ui adapted to work with Laravel; swagger-php and swagger-ui have no record ids, so they stay in these notes, and the README links swagger-php for writing the attributes. The category api-layer maps to backend in the import; no category in the import's map names OpenAPI documentation without also mapping to a static site generator, so api-layer is the nearest value. The wiki Getting Started page says the service provider is registered through Laravel's package discovery, which supports the basedOn Laravel statement. The wiki's version table gives the Laravel and PHP range for each major: L5-Swagger 11.x runs on Laravel 11.44 and later, 12.1 and later, and 13, with PHP 8.2 and later. The runtimeMin comes from composer.json at the latest release tag. The wiki states the documentation routes have no middleware by default, so the generated documentation is public until authentication middleware is added. The configuration page describes an OAuth2 section in the Swagger UI and a PKCE option for the authorization code flow; the package does not issue grants, so sso is not recorded. The Migration Guides page describes version-to-version changes only, not import from other software. The README's disclaimer says the actual Swagger specification is beyond the scope of the package and that it packages swagger-php and swagger-ui for Laravel. The Related Projects page lists openapi-introspector, openapi-router and openapi-verifier as third-party packages that work with L5-Swagger; they are not alternatives. The runsAs process model is not stated on the Getting Started page, so it is not recorded. The generator runs as an artisan command and the Tips page describes regenerating on each load in development, which is not a process statement. The maintainer is the copyright holder named in the MIT LICENSE, Darius Matulionis, and the GitHub profile names the same person as a user; the country on the profile is not a page naming the maintainer's company, so hqCountry is not recorded. The Packagist figure is the total of all downloads for darkaonline/l5-swagger; its monthly figure is not recorded. Stars and contributors are for the repository.
