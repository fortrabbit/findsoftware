notes: >
  The highest stable GitHub release of @sanity/ui is 4.4.10 (2026-10-20), which matches npm latest. Newer GitHub releases are alpha prereleases (5.0.0-alpha.18, 2026-10-26), recorded as latestPrereleaseDate. The repository is a monorepo; the apps folder holds docs, storybook and studio and the packages folder holds figma and ui (github.com/sanity-io/ui contents listing); the package recorded is @sanity/ui from packages/ui, and the figures are for that package, not for the figma plugin or the apps. The LICENSE copyright line reads "Copyright (c) 2026 Sanity.io", while the Terms of Service name Sanity US Inc. as the contracting party; the legal name from the terms is recorded. The terms page gives the San Francisco address that the record's hqCountry rests on; a reviewer should confirm that it is the company's headquarters and not only its notice address. The npm peer dependencies are react, react-dom and styled-components, as the docs install page states; styled-components is not recorded as a basedOn because the page names it only as a peer install. The package's Node.js requirement is for working on the monorepo, not for users, so no runtime is recorded. The docs page describes the library and its theme tokens; it does not state a runtime or a server model. The HTTP Archive technology list has a Sanity entry under CMS, which is the Sanity content platform and not this package, so httpArchiveSites is unknown. The GitHub homepage field names https://sanity.io/ui; the record uses the www address that the docs link to. The homepage and docs describe components, layout primitives, theming with design tokens, and the docs say the package "only comes with one theme right now", studioTheme, "which is built for use in Sanity products".
