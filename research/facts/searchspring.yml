notes: >
  Searchspring is now Athos Commerce: the homepage says "Searchspring is now Athos Commerce", and the 19 August 2025 news post says the company "refreshed the console's branding from Searchspring to Athos Commerce". The record follows the new name, per the rename rule, and the id stays searchspring. Klevu is part of the same company: see the klevu record. The site search product is the one described; the pricing and product pages sell the Athos platform (Onsite Discovery, Offsite Discovery, Intelligent Discovery Platform), and the record does not describe those products separately. The Athos news post names Klevu and Intelligent Reach as other parts of the company; they are not in this record. The privacy policy names three legal entities: B7 Interactive, LLC, d/b/a Athos Commerce (North America), Intelligent Reach Pty Ltd (APAC) and Intelligent Reach Limited (EMEA and UK). The record uses the North America entity, which the Service Terms (North America) name as the contracting party. The hqCountry comes from the privacy policy's mailing address, not from a headquarters statement; the Service Terms are governed by the laws of Texas. The pricing page describes its plans with the phrase "Cloud Infrastructure", which makes the service hosted; no prices are recorded. The SDK repository searchspring/snap and its npm packages (@searchspring/snap-preact in the candidates row) are client code and are not this service's repository, so they carry no figures here. The docs help center answers 403 to the request, so no docs content was read. The homepage, pricing and product pages state no SSO, user roles, self-hosted option, importer, live preview or customer count; those fields are not recorded. The site search product page says the search handles 31 languages, recorded as i18n. The site search page names no social accounts.
