notes: >
  Hosted-service: the Power-Up code is not in the repository (its only file is README.md), and the terms describe the Power-Up as a hosted service offered without cost "on a trial basis for a limited time", so criterion 2 fails for a downloadable distributable; the decision from accepted to hosted-service is for the reviewer, and a published source or a self-host option would reverse it. The guide's quick start installs the Power-Up by adding a custom Power-Up in the Trello admin interface and pointing it at a backend (GitHub, GitLab, Bitbucket or a custom endpoint); the optional Express endpoint repository Troglio/express-nedb-endpoint has no license, is not the CMS, and is not recorded. The README links two starters, a basic blog built with Preact and React Static and an Express and Nedb endpoint that stores pushed data and serves it as a JSON API, and says previews open the site in an iframe with the new data. The repository has no release or tag, so lastCommitDate (2018-05-12, the newest commit on master) is what the import judges listing by. The plans page reads "Coming Soon...", so no pricing is recorded. The footer reads "© 2018 Trogl.io" and the terms name both troglio.com and trogl.io, and the maintainer is recorded as the terms name it. Content lives in Trello cards, which is an external service, so contentStore is not recorded.
