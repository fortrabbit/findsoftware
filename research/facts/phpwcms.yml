notes: >
  The project's own pages disagree on the current release. The homepage names v1.12.3 (released 2026-07-19) as latest, while the GitHub latest release is v1.12.4, published 2026-10-03. The GitHub release is recorded. The homepage also names v1.9.49 as the legacy line and branch 1.10-dev as development. The repository's default branch README and composer.json state PHP 8.2+ and show a v2.0.0-beta.1 prerelease from 2026-10-11, which is flagged prerelease and not recorded as a major. The v1.12.4 composer.json is the source of runtimeMin. The maintainer is recorded from the homepage copyright line, which names no legal form. The license version is taken from the LICENSE file at v1.12.4, since the homepage names the GNU GPL without a version. Adoption figures are GitHub stars and contributors only. The docs URL is the documentation site the homepage links; its title is German-language and no English documentation page was checked.
