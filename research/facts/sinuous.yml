notes: >
  The repository has no LICENSE file, and the GitHub API reports no license; the MIT license is recorded from the npm package manifest and from the docs page footer. The GitHub repository has tags up to v0.32.1 but no GitHub releases (releases/latest returns 404), so latestReleaseDate is the npm publish date of 0.32.1. The last push to the repository is 2024-03-16, after the last npm release; this is recorded in the note only and does not change the status. The firstRelease year comes from the CHANGELOG entry for 0.9.0 (2019-06-22), which is marked "First release". The npm figure is the sum of the daily counts from the npm downloads range endpoint for 2026-10-19 to 2026-10-25. Runs-as is not recorded: the docs describe the library as DOM rendering in the page and do not state that it runs in the browser. The docs footer names Wesley Luyten as the author, and the npm package names the same person; no legal entity or country is stated.
