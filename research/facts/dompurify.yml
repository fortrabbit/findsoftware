notes: >
  The license is one dual statement: package.json and the README badge say "(MPL-2.0 OR Apache-2.0)", the repository LICENSE file is Apache-2.0 (GitHub detects Apache-2.0) and LICENSE-MPL carries the Mozilla text; the statement is recorded as two license entries, MPL-2.0 and Apache-2.0. The README says the library runs "as JavaScript" in all modern browsers and "works server-side with Node.js" through jsdom; both are stated, so runtime is node and no runsAs is recorded. No installMethod is recorded: the README sentence "Just include DOMPurify on your website." names no route, the script tags for dist/purify.js and dist/purify.min.js appear only in code blocks under headings, and the npm install route appears only as shell commands; the README's "We support npm officially" sits under Development and contributing and covers building the repository. npmWeeklyDownloads is the sum of the daily figures from 2026-10-26 to 2026-11-01 (api.npmjs.org range endpoint), not the last-week point endpoint. The 2.x branch is kept for MSIE; the 2.5.9 release (2026-03-05) is no current major, so currentMajor is 3. The maintainer follows package.json: the imprint at cure53.de names Dr.-Ing. Mario Heiderich as operator, trading as Cure53, at Wilmersdorfer Str. 106, Berlin, with no legal form given; the hqCountry is taken from that address. The dependent counts are ecosyste.ms figures for the npm package. The README security mailing list announces security-critical releases only; it is no newsletter, so no newsletter fact is recorded. The GitHub repository language is JavaScript; the CSV row says TypeScript, which the README does not state. The README says server-side use needs a DOM, that jsdom is the usual choice, and that happy-dom is not considered safe for it; the README also says legacy browsers such as MSIE get no sanitizing ("It simply does nothing"), names 2.5.9 as the latest version supporting MSIE and points to the 2.x branch for security updates compatible with MSIE.
