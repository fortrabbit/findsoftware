notes: >
  No project website: the repository names no site, the homepage field is empty, and the CSV's homepage is the GitHub URL, so homepage is absent. The only organisation site found, serverco.com, returns "Page not currently active" and names no legal entity or country; it is not linked. The maintainer is the GitHub organisation name serverco, since neither the script header, the README nor the LICENSE (FSF text) names a maintainer; the script's revision history names contributors (dstosberg, jsnider2) and is not a maintainer statement. The README's packages section links https://github.com/jeffmerkey/getssl/releases as "the release page for this project", a different account; the repository is srvrco/getssl and no fork or move is stated, so forkOf and successorOf are absent. The README's manual install path fetches from the latest branch of the same repository. The runtime is bash ("GetSSL was written in standard bash"), a value the runtime vocabulary does not hold, so runtime is absent. firstRelease is 2016: the script's revision history starts 2016-01-08 at v0.1 and the oldest GitHub release is v1.0 from 2016-06-04. Releases are stable only; no prerelease is listed. The README describes the script as able to copy certificates to remote servers over ssh, sftp or ftp, and reload services after renewal (the README names apache, nginx and postfix as examples), from the features list; its overview says it can "be run on a server, a desktop computer, or even a virtualbox". The license is the script header's "either version 3 of the License, or (at your option) any later version"; GitHub's API reports GPL-3.0 from the LICENSE file, the same license in another wording. The README says the script runs on "virtually all unix machines, including BSD, most Linux distributions, macOS" and has a section on Windows Server and IIS through WSL; the Unix-like requirement is recorded here, not as runtime. Fields coined here: none.
