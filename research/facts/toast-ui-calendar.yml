notes: >
  The repository nhn/tui.calendar, which the homepage and the package metadata name as the source, is archived on GitHub as of 2026-11-16 (archived: true in the repository API); this is the end signal. The README and the homepage carry no end, successor or move statement. The npm latest 2.1.3 (published 2022-08-16) is not deprecated. The repository is a monorepo: the package is apps/calendar, the npm figure is for @toast-ui/calendar, and stars and contributors belong to the monorepo. The oldest GitHub release and tag is v0.6.0 (commit date 2018-02-12). The React and Vue wrappers @toast-ui/react-calendar and @toast-ui/vue-calendar are separate packages in the same repository and are not basedOn. The runtime dependencies named by the README are Preact, Immer and DOMPurify; they are not basedOn. The README states that the library applies Google Analytics to collect the hostname of the site that loads it, unless the creator turns it off in the getting-started guide; the statement is recorded here and not as a field. The homepage is served over https after a redirect from the http address in the discovery row. The LICENSE copyright line names NHN Corp.; the README names NHN Cloud, which the notes record as the brand. The country of NHN Corp. is not named on a page read, so hqCountry is absent.
