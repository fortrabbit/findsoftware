notes: >
  The homepage on the GitHub homepage field, https://ago.ofnir.xyz/, does not resolve (dig ago.ofnir.xyz returns nothing, and the query through 1.1.1.1 answers NXDOMAIN, 2026-10-23), so no homepage is recorded and status is stub (AGENTS.md: the project's own site no longer shows the software). The README's install steps still work, so criterion 3 holds. The README links the old owner path dvwallin; the recorded repository is the current DavidSatimeWallin/ago. The only GitHub release is v1.2.1 (2021-05-31); the older tag v1.2.0 (committed 2020-09-21) has no release object, so firstRelease is the year of that tag. The last release is more than four years old, so the import also moves the record to stub on its own. Go module: no download figure recorded.
