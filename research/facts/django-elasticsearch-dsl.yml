notes: >
  No homepage is recorded: the GitHub homepage field is empty, and the only project-owned site is the Read the Docs documentation, recorded as docs; a reviewer decides whether the docs site is the homepage. The README lists Django signal receivers on save and delete, management commands for creating, deleting, rebuilding and populating indices, and a rule to match the library's major version to the Elasticsearch major version. The quickstart describes a Document subclass registered with the registry.register_document decorator, and ELASTICSEARCH_DSL settings passed to elasticsearch-dsl-py. The Read the Docs build shows version 7.1.1 in its title while PyPI has 9.0 (uploaded 2025-07-23) and GitHub has no tag for 9.0 or 8.1 to 8.2; the highest stable GitHub release is 8.0 (2023-10-01). Because the registry major 9 is higher than the GitHub major 8, currentMajor comes from PyPI, as the write-record rule states. The PyPI project URL names github.com/sabricot/django-elasticsearch-dsl, which now serves the django-es repository; the author on PyPI and setup.py is Sabricot, and the GitHub organization django-es hosts the repository. The LICENSE file names "Apache Software License 2.0" in its first line and "Licensed under the Apache License, Version 2.0" in its body, and PyPI names the same license: one license, two wordings. The LICENSE copyright line names "Sabre", which is not recorded as maintainer. The README says the package is "built as a thin wrapper around elasticsearch-py"; elasticsearch-py is the Python client of the Elasticsearch engine and no record exists for it, so basedOn stays at django (the PyPI summary "Wrapper around elasticsearch-dsl-py for django models" states the Django parent; the README line "Django >= 4.2" is a requirement and no basedOn quote) and a reviewer decides whether the elasticsearch record applies. The PyPI 9.0 release requires elasticsearch>=9.0.0,<10.0.0, a dependency and not a basedOn statement. Runtime minimum Python 3.9 comes from requires_python of the 9.0 release and matches the README's list of supported versions. The pypistats figure is last week's downloads, read 2026-10-28; the ecosyste.ms counts are for pypi.org. The GitHub repository license field reads NOASSERTION, so the license comes from the LICENSE file and the PyPI metadata. The Read the Docs page for pip install is recorded through the quickstart's install line.
