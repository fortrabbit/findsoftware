notes: >
  The repository is a monorepo: the npm package @reduxjs/toolkit is the core package the install section names, and the same repository also publishes @rtk-query/codegen-openapi. Stars and contributors belong to the whole repository. The homepage redux-toolkit.js.org redirects to redux.js.org/toolkit, which is recorded as the final URL. The npm package named redux-toolkit is an unrelated project by another author and is not used. The README says configureStore includes redux-thunk by default; that is the redux-thunk record's own relation, not a field here. RTK Query is an optional entry point inside @reduxjs/toolkit, not a separate package. The README's template commands (tiged, create-next-app) clone starter projects and are not an install route. The getting-started page lists the requirement for TypeScript versions only, so no runtimeMin is recorded. The oldest tag, v1.0.0, is dated 2019-10-23 and the first npm upload is 2019-11-13, both in 2019. The npm weekly figure is the sum of the daily downloads for 2026-11-01 to 2026-11-07. The maintainer follows the LICENSE copyright line. The README lists configureStore, createReducer, createAction, createSlice, combineSlices, createListenerMiddleware, createAsyncThunk, createEntityAdapter and the Reselect createSelector, and says RTK Query is an optional addon within the same package, built on the Redux Toolkit core and using Redux internally. The README says configureStore includes redux-thunk by default. The README says the package is deliberately limited in scope and does not address reusable Redux modules, folder structures or entity relationships. The getting-started page says the browser build also needs an import map, because it imports its dependencies by package name, and advises pinning the dependency versions.
