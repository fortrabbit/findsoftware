notes: >
  Criterion 1 is met by the ingestion endpoints the docs name: "VictoriaLogs supports the following data ingestion HTTP APIs:" followed by the Elasticsearch bulk API, a JSON stream API (ndjson), the Loki JSON API and the OpenTelemetry API, plus the Datadog and journald protocols on the data ingestion pages; applications and log shippers send logs to them, so the software is wired into an application. The docs' query and management HTTP endpoints serve the operator and are not the reason for acceptance. The license is Apache-2.0 for the community edition; the enterprise page says "components are provided in two kinds" and names an enterprise edition, which is recorded as paidEdition with the same ESA wording as the VictoriaMetrics record. The docs path for the Enterprise section of VictoriaLogs returns 404 and is not cited; the VictoriaMetrics enterprise page covers VictoriaLogs in the same sentence. The product homepage version is the product page on victoriametrics.com; the docs at docs.victoriametrics.com/victorialogs/ are the project's own docs. The quick start says logs can be queried in the built-in Web UI. The Docker pull figure is the victoriametrics/victoria-logs repository the quick-start links on Docker Hub. The pages read do not state a hosted offering for VictoriaLogs; the VictoriaMetrics Cloud on the homepage is recorded on the VictoriaMetrics record only. The product page also links Slack, Telegram and LinkedIn; those are not fields here. firstRelease takes the v0.1.0-victorialogs release in the VictoriaMetrics repository, where VictoriaLogs lived before its own repository (created 2025). The repository README links the shared r/VictoriaMetrics subreddit and the X account of VictoriaMetrics.
