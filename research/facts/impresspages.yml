notes: >
  The project's own site and docs describe the 4.x line: the homepage offers "ImpressPages 4" and the requirements page lists PHP 5.3.3 and MySQL 5 for it, and the releases page ends at 4.6.0 (2015-03-28). Packagist's latest stable is v5.0.3 (2017-07-09), so currentMajor is 5 and runtimeMin comes from that release's require.php. The GitHub repository was last pushed on 2020-10-02 and has no GitHub releases (the latest-release API returns 404). No page names the project as ended or unmaintained, so the status stays accepted and the release date is shown. The README in the repository describes itself as the library for "the main" repository and links to its own URL, so the repository's role is unclear. The packagist package impresspages/impresspages is the one the README's composer block installs, and the README says the composer.json requires that package and that the setup wizard runs in the browser. The homepage says developers can write their own plugins and themes; that statement backs the prose's reference to the repository's own install steps only. The newest Packagist release is dated 2017-07-09 and the repository's last push is dated 2020-10-02, which the prose describes without dates. Packagist's license list for v5.0.3 is MIT and GPL-3.0+, and the license page states GPL v3.0 or MIT; both statements are recorded as their sources word them. The site's requirements page covers 4.x only, so no databases fact is recorded.
