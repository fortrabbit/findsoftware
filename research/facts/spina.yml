notes: >
  The homepage in the GitHub repository field and the README link, http://www.spinacms.com and https://spinacms.com, do not resolve in DNS, and the docs link on the rubygems page (www.spinacms.com/docs) is on the same dead domain, so no homepage is recorded and status is stub; a live site or a successor address would settle it, and the docs folder in the repository is the source read instead. The installer and first-run steps are on the README and the docs/v2 pages, which answer criterion 2. The GitHub repository reports license NOASSERTION because LICENSE.md also carries the OFL text for the bundled font; the MIT statement is the project's and both are recorded as separate license entries. The docs say PostgreSQL is required in docs/v2/getting_started/1_installing_ruby.md, while docs/v2/getting_started/3_existing_project.md names all three; the install page marks the SQLite example as development only. The maintainer is the LICENSE copyright holder denkGroot; the gemspec names Bram Jetten as the gem author, which is noted here and not recorded as the maintainer. Spina Pro is an open-source MIT gem named spina-pro with its own README (formerly a commercial add-on); it is a plugin of this project, not an edition, so no paidEdition is recorded. No runsAs and no renderingModes are recorded: the deployment page says deploying is no different from any other Rails project and names no server model. The Pages API is marked beta and returns JSON, but no page names REST or GraphQL, so headlessApi is left unknown. The rubygems versions list starts with 0.6.11 uploaded 2015-03-04, the same day as the repository's creation, so firstRelease is 2015.
