notes: >
  The repository has no description, no homepage, no GitHub release or tag, and no LICENSE file; the GitHub license field is null, so license and licenseModel are unknown. The README gives the Python requirement as "Python>3.6!", which is recorded as runtimeMin 3.6 although the ">" could also read as 3.7 and above. The repository's GitHub Pages site is the author's example output, not the project's own site, so no homepage is recorded. The optional logs.json is the only stored content and is a file the user writes. The CSV row lists the category as ssg; the README calls the tool a travel blog builder that writes a single index.html, so the category is recorded as blog. No maintainer is recorded: no page names one and the repository owner is only the GitHub login martin-martin.
