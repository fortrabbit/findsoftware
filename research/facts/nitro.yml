notes: >
  The homepage and docs present Nitro v3 as current; the GitHub releases list only v3 prereleases (beta) after the stable v2.13.5, so currentMajor is 2 under the stable-release rule, and the newest v3 beta (2026-09-03) is older than the stable v2 release, so latestPrereleaseDate is not recorded. The npm package named by the install docs, nitro, has the beta as its latest tag; nitropack (stable v2, 2.13.5, MIT, Node ^20.19.0 || >=22.12.0) had 1461961 downloads in the week 2026-10-12 to 2026-10-18 and is the package a v2 user installs. The docs mark Database, Tasks and OpenAPI as "Experimental" on the homepage. The introduction page names Nuxt, SolidStart and TanStack Start as frameworks that "fully or partially leverage Nitro"; that is a dependency in the other direction, so no basedOn is recorded here. The GitHub license API field reads NOASSERTION, so the license is taken from the LICENSE file. Runtime targets come from the homepage, which also lists deploy targets (Node.js, Deno, Bun, Cloudflare, Vercel, Netlify, AWS Lambda, Azure, Firebase, DigitalOcean, Render); the deploy page is a JavaScript shell without readable text, so runsAs stays unknown.
