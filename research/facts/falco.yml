notes: >
  The GitHub releases end at v3.1.0 (2021-07-27). The NuGet package Falco has stable 5.2.0 (2025-12-21) and a 6.0.0-beta1 prerelease (2026-07-27), and its project URL moved from pimbrouwers/Falco to FalcoFramework/Falco. The record takes its major and release date from NuGet because the registry major is higher than the GitHub release major, and the homepage's "Latest release" line agrees with NuGet. The copyright line on the homepage names Pim Brouwers and contributors; the NuGet owner is pimbrouwers. The deployment page describes self-contained and Native AOT executables and a scale-to-zero note, but does not state that the app runs as an always-on process, so runsAs is left out. The NuGet package lists net8.0, net9.0 and net10.0 for 5.2.0; the lowest is not recorded as runtimeMin because no docs page states a minimum .NET version (the repository project file lists net8.0, net9.0 and net10.0). The README links a Twitter account for questions, and the homepage links the same account. The Falco.Markup and Falco.Htmx packages are related libraries listed by the project and are not recorded as records.
