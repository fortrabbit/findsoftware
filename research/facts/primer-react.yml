notes: >
  The package is the React library; the repository's release list also carries @primer/mcp tags, which are not counted. Install page: "Install @primer/react and its peer dependencies:" with "npm install @primer/react @primer/primitives react react-dom"; the peer requirement on the page reads "@primer/primitives at version 9.0.0 or higher" and "react at versions 17.x or higher", while the npm peer range reads react 18.x || 19.x, so the page wording is recorded in notes only. The getting-started page recommends importing @primer/css/dist/primer.css for base element styling; that is a stylesheet from primer-css, not a basedOn statement. The page states browser support for the current versions of Chrome, Firefox, Safari and Microsoft Edge. The primer.style homepage is shared by the CSS, React and view-component docs; the React getting-started page is recorded as docs. The oldest GitHub release of the repository is v0.0.2-beta (2018-06-01), published under the project's earlier package name, so firstRelease is 2018; the npm package @primer/react starts in 2021-12. The npm next tag 38.44.0-rc.0a55e3e04 (2026-10-26) is the newest prerelease, newer than the latest release. The GitHub copyright line reads "Copyright (c) 2018 GitHub, Inc."; the primer/css copyright reads "GitHub Inc." without a comma, a second wording of the same maintainer. The country of GitHub, Inc. is not stated on the pages read.
