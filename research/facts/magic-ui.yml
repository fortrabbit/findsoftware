notes: >
  No GitHub release or tag exists, so the criterion 4 judgement uses lastCommitDate: the newest commit on the default branch is dated 2026-10-17, and the project is not declared ended. Criterion 2 holds through the shadcn CLI model: the docs install components from the project's own registry with pnpm dlx shadcn@latest add @magicui/<name>, and the docs say the process is the same as shadcn/ui. The GitHub primary language reads MDX. The paid tier is Magic UI Pro, linked from the homepage banner; the banner names it and gives no price. The homepage x link and the footer credit point to the maintainer's personal account and are not recorded; the README badge for the project's x account is an image with alt text only, which the quote check cannot confirm, so no x fact is recorded. The LICENSE.md copyright line names Magic UI, and the homepage footer reads "Built by dillion"; the maintainer is recorded as the license states it.
