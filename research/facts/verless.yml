notes: >
  The repository is archived on GitHub (checked 2026-10-19 and 2026-10-23), it is the repository the README names as the project source, and no other home is named, so the status is discontinued. The project's own site, verless.dominikbraun.io, named in the README logo links, returned 403 to the research request and was not read; it is not recorded as homepage. The GitHub homepage field is empty. The README describes the tool as a Static Site Generator with a built-in server for local development; the tutorial says the built site goes into the target directory and is uploaded. The highest stable GitHub release is v0.5.4 (2021-01-08), so currentMajor is 0. The first release is v0.1.0 (2020-08-22). No page names a maintainer: the GitHub handle dominikbraun appears only in CODEOWNERS, and LICENSE has no copyright line, so no maintainer is recorded. The site was retried on 2026-10-23 and still answered 403. The README's example and footer link to dominikbraun.io and a logo on the project site; the output directory default is target.
