notes: >
  The registry is JSR, recorded as jsrName, a field coined here because the scripts know only npmName and packagistName. The home page, the README showcase link and the site footer link to github.com/denoland/fresh, which the GitHub API resolves to freshframework/fresh; the repository field records the URL the project's pages link, and the API figures are read through it. The maintainer is the holder named in the LICENSE copyright line (2021-2023); the home page footer reads "the Fresh authors", which names no one. runsAs always-on comes from the Docker deployment page, whose Dockerfile starts the app with "deno serve" and exposes port 8000; the home page also lists Deno Deploy, Cloudflare Workers and deno compile as deploy targets, whose process model is not recorded. The Discord link in the site footer is the Deno community server. The deployment page names Deno Deploy as the recommended host, a hosted platform next to the open source part, with no prices recorded. Deno Deploy runs the build task during deployment when the Fresh preset is selected, then starts the app with the start task. The home page describes forms handled on the server with standard Request and FormData objects, partial responses that stream HTML into one part of a page without a full reload, and route handlers defined as named GET, POST, DELETE or other HTTP method functions.
