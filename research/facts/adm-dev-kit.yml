notes: >
  The repository is archived on GitHub (last push 2017-02-18), which is the discontinued signal. The README links its documentation and the logo to other hosts. The homepage field in the candidate row points at the GitHub repository under another owner (iamfrntdv), which redirects to eduarddotgg/adm-dev-kit, so the project has no homepage recorded. The logo host adm-designhouse.com does not resolve (NXDOMAIN, checked 2026-10-22); if the reviewer treats that domain as the project's own site, the record would be stub under the dead-homepage rule instead. The npm package names the repository admdh/adm-dev-kit, which also redirects to eduarddotgg/adm-dev-kit. The npm package author is "Eduárd Pocstár", while the GitHub profile of the owner names "Eduard Pochtar"; the maintainer is recorded as the npm package names it. GitHub reports no license for the repository and no LICENSE file is in its root listing; the MIT statement comes from the npm package. The README names Node.js, JSPM, Express.js, Browser-Sync and Gulp.js as tools it is built with; none is stated as a parent, so basedOn is not recorded. The first npm version is 2.0.1 on 2016-07-07, and the repository has no GitHub releases, so firstRelease comes from npm. The latest npm version is 2.5.57, published 2016-09-10.
