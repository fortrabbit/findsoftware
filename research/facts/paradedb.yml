notes: >
  ParadeDB is the Postgres distribution around the pg_search extension (Rust, in the paradedb repository); the separate Ruby gem pg_search is its own record, not this one. The pages read name no PostgreSQL version minimum: the install page names PostgreSQL 18 only for the Postgres.app flow, so runtimeMin is absent. The Enterprise page states the Community edition is AGPL-3.0 and supports single-node deployments; the features Enterprise adds are high availability and read replicas. The homepage also links LinkedIn (linkedin.com/company/paradedb) and a Slack community (paradedb.com/slack); no field holds them. The homepage's Elasticsearch benchmark is a performance claim and is not recorded. The docs pages are server-rendered, so their text is readable without a browser.
