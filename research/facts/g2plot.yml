notes: >
  The English README says "There are no plans to encapsulate G2Plot v3 based on G2 v5 in the future, you can use Ant Design Charts instead." The 2.x line still ships (npm latest published 2025-09-19) and the README still describes the library as usable, so the line is no end statement. Homepage: the CSV homepage (g2plot.antv.antgroup.com) and the CNAME homepage (g2plot.antv.vision) both answer 200 with the same client-rendered shell; the record uses g2plot.antv.vision, which the project's CNAME and npm homepage name. The Quick Start link in the README returns 404 on curl; the docs are cited from site/docs/manual/getting-started.en.md in the repository. Stars, contributors, language and license come from antvis/G2Plot. The package is @antv/g2plot, the one the install docs name; the unscoped g2plot package is a 0.0.1-beta.1 placeholder and is not used. The npm time map lists 2.5.35 and 2.6.35 (both 2026-05-19), but neither is in the versions list, so they are unpublished and do not count. The first npm publish and the first git tag (0.1.0-beta.0) are both 2019-09-26. The LICENSE copyright line names "AntV team", not a legal entity, so no legal name or hqCountry is recorded. The highest stable GitHub release is 2.4.34 (2025-09-15); npm latest is 2.4.35, same major. The FAQ's DingTalk group is a chat channel, not a forum. The CDN route is unpkg at @latest, with no version pin. Coined kinds: none.
