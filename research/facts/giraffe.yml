notes: >
  The GitHub releases list holds 8.x and 7.x stable releases; the newest stable is v8.3.0 (2026-07-22), and the newest prerelease is older, so no latestPrereleaseDate is recorded. The oldest GitHub release, v0.1.0-alpha001 (2017-01-16), is a prerelease; firstRelease follows the oldest stable release, v1.0.0 (2018-02-08). The nuget total is the downloads count of the Giraffe package across all versions, as the NuGet search API returns it; the 8.3.0 line alone is listed there at 56821. The fsproj lists net6.0 to net9.0 target frameworks on master; no page states a minimum runtime for the latest release, so runtimeMin is left out. The docs page describes Giraffe as a library added to an ASP.NET Core application with a middleware call and the page does not state a process model, so runsAs is left out. The README's contents list names a "Contact and Slack Channel" section, but the section in the text is "Contact" and points to the maintainer's personal about page, so no chat fact is recorded. The README names three current maintainers by GitHub login; the maintainer value follows the copyright line in the project file. The homepage links the project's Releases page and the giraffe-template repository, which the README also names; the template is an install route, not a separate project. The homepage and README name Suave as the project it is similar to; no fact is recorded from that because it is a comparison, not a factual relationship the project's own pages list as basedOn.
