notes: >
  The rubygems.org record names https://mongoid.org/ as the gem homepage; on 2026-11-16 that host did not answer (no connection, HTTP code 000), so it is not linked and the MongoDB-hosted documentation is the homepage. The README says Mongoid "is built on top of" the Ruby driver, documented at mongodb.com/docs/ruby-driver; the driver is a separate project with no record, so no basedOn. The README lists Stack Overflow and the MongoDB Community Forum; the forum link is the Mongoid ODM section of that forum (tag mongoid-odm), so it is recorded as forum, and the README's issue tracker is the MONGOID project in MongoDB JIRA (not recorded as a field). Compatibility per the README: MRI 2.7 to 4.0, JRuby 9.4 and 10.0, MongoDB server 3.6 to 8.2. The gemspec at the release tag requires ">= 2.7"; the README's MRI range is a tested range, not a minimum. The maintainer is named in the LICENSE copyright line as "MongoDB Inc." (README, "Copyright (c) 2015-Present MongoDB Inc."), and the terms page names the legal entity "MongoDB, Inc.", which is recorded; the older copyright line "Copyright (c) 2009-2016 Durran Jordan" is the original author's and goes here only. The gem authors field reads "The MongoDB Ruby Team". The release line: v9.1.2 (2026-11-12) is the newest stable; v8 and v7 maintenance releases were published 2026-09-17, and v9.1.x is the minor line. firstRelease is the oldest RubyGems version 0.2.5 (2009-10-02); the oldest GitHub release is dated 2015-12-22. The RubyGems figure is the gem's total downloads, not a period.
