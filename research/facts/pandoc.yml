notes: >
  No page cited here names a site generator that uses pandoc, so no such link is recorded.
  The pandoc-server page describes a web server and a CGI mode; the installation page describes this as a build option that makes the executable serve HTTP when it is renamed pandoc-server, so runsAs lists those values for a build that includes it, plus local for the command-line tool.
  The installation page states that the statically linked binaries it provides cannot load Lua filters that use C modules; no runtime is recorded because the binaries need none.
  The GitHub license detection reads GPL-2.0, while the COPYRIGHT file states version 2 or later; the COPYRIGHT statement is the one recorded. firstRelease is the year of the first Hackage upload (0.4, 2007-08-16); the oldest GitHub release is from 2013. The installation page also lists Linux distribution repositories, a statically linked binary and cabal or stack builds.
  The highest stable GitHub release is 3.12.1; the Hackage package name is the same as the repository's package name.
  The maintainer is the copyright holder named in the COPYRIGHT file ("Copyright (C) 2006-2024 John MacFarlane").
  The homepage is served over https.
