notes: >
  Stale release: the repository has no GitHub release, and its latest registry version 4.0.9 dates from 2021-03-05, more than four years before this check, so the import moves the record to stub under criterion 4; the status stays accepted here until the import runs. No LICENSE file sits in the repository root, so GitHub detects no license; the README statement and the npm license field both give GPL-3.0, and the commercial license is the second statement from the README. The commercial license has seat-count tiers on the pricing page; prices are not recorded, and tiers that change only the developer count are not a paid edition. The npm package and the unpkg CDN are the two install routes the README and the installation guide name. The README names no runtime and no place where it runs; the installation guide names CSS Transition and CSS Transform as browser requirements, which is a browser support statement, so no runsAs fact. The homepage carries an older star count; the API figure is recorded. The README's legacy wiki link is for old versions and is not a source. The copyright line is 2026 in the README, the only license text in the repository.
