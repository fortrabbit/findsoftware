notes: >
  Stub: the README says "See docs at https://mtod.org/wb/", but that page (and its sub-section mtod.org/wb/mtod-wb/) is the author's personal page with the text "There's not much in here yet" and no software content, so the project's own site no longer shows the software and no homepage is recorded. The install and usage docs are in the repository under doc-food/docs, and they are the source for the install and runsAs facts. What would settle it: a project page on mtod.org or another own site that documents wb again, or a statement in the repository that the docs moved. The CSV row says accepted; the stub status is set here per the rule for a site that no longer shows the software, for the reviewer to confirm. The mix.exs package description is "Personal wiki engine", the repository description is "Writer's Block - personal wiki engine". The Hex package has four releases, the first 0.1.0 inserted 2020-12-31; hexDownloads is the all-time total from the Hex API. The GitHub release 0.3.1 (2022-11-27) is the highest stable release. The usage page says wb has no built-in development server and suggests a local web server for preview; its deployment example copies the build root with rsync.
