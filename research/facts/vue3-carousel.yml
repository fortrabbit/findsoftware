notes: >
  The README and the homepage say the documentation is also published as Markdown, with an llms.txt index; that is a docs format, not a field. The README names a Nuxt module, vue3-carousel-nuxt, published under a different GitHub account (gaetansenn), so it is not recorded as this project's package. The README feature list names responsive breakpoints, infinite wrap-around, touch and mouse dragging, mouse wheel, keyboard navigation with ARIA labels, autoplay, vertical sliding and right-to-left layout; they are features, not fields. The homepage's only repository link is the GitHub project; no discord, forum, social or newsletter link appears on the homepage or in the README. The LICENSE copyright line and the homepage footer both name Abdelrahman Ismail; the repository owner is a user account, so stars and contributors belong to that repository. Version 0.19.0 is the latest stable release; currentMajor records its major, 0, and the minor line stays here. The npm figure counts downloads of vue3-carousel, the package the install page names. The earliest npm upload is version 0.0.0 from 2020-04-17, which sets firstRelease.
