notes: >
  The homepage bowman.netlify.app, listed as the project's homepage on GitHub, now serves a page for a different organization ("Bowman Consulting Partners"), so no homepage is recorded and status is stub under AGENTS.md (the project's own site no longer shows the software). The docs at the README link are read through the README and the docs folder (about, index, essential-files). The npm package named bowman is a different project (derekrjones/bowman, 0.0.1); the install docs name @waldronmatt/bowman, which is the registry package recorded. Highest stable GitHub release is v1.9.25 (2021-09-24), which matches npm latest. The last push is 2021-09-24; no archive flag and no deprecation or end statement were found. The README and docs call it a static site generator and name Node.js, Webpack and Browsersync; these are recorded as runtime and templating, and no basedOn is recorded because the docs name tools it is powered by, not a parent project. The README limitations say the content and data folders must have matching file names, or the build fails, and that webpack prefetch and preload need html-webpack-plugin. The docs do not state the output directory of the production build beyond dist/, so outputDir is unknown.
