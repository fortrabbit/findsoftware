notes: >
  The repository publishes GitHub releases; the highest stable one is 8.5.32 (2026-10-26), which matches npm latest. The earliest registry upload is 0.1.0 (npm, 2013-11-04), older than the GitHub tag 0.1 (2013-12-17), so firstRelease is the npm date's year. The README says PostCSS "is built by Evil Martians, an American design and engineering consultancy"; the maintainer is recorded from the LICENSE and the package author, and Evil Martians is not recorded as parent because the README gives it as the builder, not the owner. The homepage footer names the project "distributed under the MIT License". The pluginCount "more than 200" is the README's own rounded figure; the plugins list itself is on the main-branch docs page. The docs site postcss.org/docs/ is a script-rendered page: its link is recorded, and no install statement was read there; the README's JS API example is the install statement. The runsAs local statement rests on the README's CLI sentence, with the postcss-cli package named for it, and the browser statement rests on the README's browser paragraph. The npm weekly figure is the sum of the 2026-09-28 to 2026-10-04 range. The homepage's Twitter link is recorded as x; the homepage's other social links are not.
