notes: >
  cPanel has no public repository for the product: the GitHub organization cpanel publishes Perl task distributions and modules, not the control panel, so no repository field is recorded. The product is installed from a downloaded installer, per the installation guide ("To install cPanel & WHM on your server, run the following command:"), so criterion 2 holds through the distributable, not through source. The CSV row gave 138.0.15 dated 2026-10-08; the 138 change log lists 138.0.19 dated 2026-10-26 as the newest version, and that is recorded. The license is the cPanel & WebHost Manager (WHM) End User License Agreement, whose PDF (cpanel.net/wp-content/uploads/2026/09/EULA-document.pdf, read as text) grants "a limited, non-exclusive, license to (a) install" the software; the license grant is not quoted in a fact because the quote checker reads HTML pages and the license is in a PDF. The licence is per server, and the installation guide says cPanel only licenses publicly visible static IP addresses with working DNS, and that cPanel does not provide an uninstaller (removal means reformatting the server). The installation guide asks for a freshly installed operating system, and its system requirement pages cover AlmaLinux, CloudLinux, Rocky Linux and Ubuntu. The pricing page lists Solo (1 account), Admin (up to 5), Pro (up to 30) and Premier (up to 100) plans, with monthly and annual billing and some plans available on cloud or VPS only; the pricing FAQ says cPanel does not provide web-hosting services; no prices are recorded. The product name on the record is cPanel; WHM is its server-level interface and cPanel the account-level one, per the docs home page. A cPanel & WHM trial is offered from the pricing page, and no edition or free tier is recorded from it. The legal name appears as WebPros International, LLC on the legal page and as WebPros International L.L.C. on the license and imprint pages; one legal entity, two wordings. The GitHub org cpanel is a separate matter: its public repositories are Perl tasks. The docs describe a "cPanel DNSOnly" installation and a separate Nova product on cpanel.net; these are not recorded here. The firewall documentation says the cPanel Server Daemon (cpsrvd) listens on a port, which is the always-on statement. The plan tiers (Solo, Admin, Pro, Premier) differ by account count and are no edition with added features, so no paidEdition is recorded. The docs list OpenID Connect identity providers for logging in to cPanel, WHM and Webmail, recorded as sso OIDC. The MySQL, MariaDB and PostgreSQL database interfaces are cPanel account features that manage databases on the server.
