notes: >
  The package was published as starlite before the rename; the README keeps a starlite download badge, so the earlier name is not recorded as a separate record. The homepage says the project began as a Starlette-based solution; that is history, so no basedOn is recorded. firstRelease is the oldest GitHub release (v0.0.1a, 2021-12-06), made under the earlier Starlite name. The PyPI requires_python is ">=3.8" for the latest release, recorded as runtimeMin. The discord link is the homepage's own link.
