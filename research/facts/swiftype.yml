notes: >
  A hosted service with no installable part and no public repository in the candidates row, so no repository, license or registry figure is recorded. The footer of the homepage and the Site Search pages reads "©2026 Elasticsearch, B.V. Swiftype is a registered trademark of Elasticsearch, B.V.", while the terms page (the Site Search agreement, reached from swiftype.com/terms) names Elasticsearch, Inc., a Delaware corporation, as the contracting party; the reviewer decides which legal name the record uses, and the record uses the terms page. The privacy FAQ says the service uses "USA as our primary hosting platform, holding all customer data" and "We do not host any customer data within the European Union"; this is the data region, recorded here as a note (regions: US only, no EU hosting). The homepage offers a free 14-day trial with no credit card required; recorded as a note, no prices. The product pages list a crawler (the documentation has a Crawler section), an analytics API ("Analytics API Access search engine behavioral data programmatically") and cross-domain search; these are notes, not fields. The documentation does not state REST or GraphQL, so headlessApi is not recorded. The security page lists SAML-based SSO, recorded as sso; the Site Search pricing and documentation pages do not state advanced permissions, so userRoles is not recorded. The privacy FAQ says "As an Elastic company", which is the parent statement; Elastic N.V. is named as the company behind Elastic in its privacy statement at elastic.co. The about page states the Site Search product came to market in 2013 and that Swiftype was founded in 2012, so firstRelease is 2013 for the hosted service. No end-of-life notice or sunset statement was found on the homepage, the about page, the pricing page or the documentation. The hostedService and freeTier fields are coined here and kept in notes only.
