notes: 'The repository has no GitHub release or tag, and the chaicore changelog says the first tagged release is still to come, so lastCommitDate is the committer date of the newest commit on main. The README says install with "pnpm add chaicore", but the registry has no npm package of that name, so the git subtree is the install path that works for the core; the quickstart scaffolder (npx chaibuilder-app create) installs a starter with the licensed chaipro package, which the docs say needs a license key after a 30-day trial and ships without source. The core README lists LibSQL, D1 and better-sqlite3 adapters; the pricing page lists SQLite page storage for the core and PostgreSQL and SQLite for the licensed edition, and databases records what the quickstart states for the starter. userRoles, i18n and multisite are listed on the pricing page as chaipro features. The pricing page names no price. The LICENSE copyright line names "ChaiBuilder contributors" with no legal form, so the maintainer is recorded as stated. No hosted ChaiBuilder service exists: the docs say the software is always self-hosted. The headless API is not stated in the pages read. Registry figures are not recorded: the package the README names is not on npm and chaipro carries a "Limited" license.'
