notes: >
  The README says "Built on top of Pinia" and "Zero Dependencies: No dependencies other than Pinia"; pinia.yml is a record, so basedOn pinia rests on that sentence. The project calls itself "The missing data fetching layer for Vue", which names Vue as the application framework and not a binding it is built as, so no basedOn vue. The migration guide at cookbook/migration-tvq.html says it helps migrate from @tanstack/vue-query (importsFrom). The "Comparison to other solutions" section of /why.html compares Pinia Colada with TanStack (Vue) Query (alternativeTo) and with swrv, which has no record. The README's features (automatic caching, request deduplication, optimistic updates, a plugin system, server-side rendering) are notes, not fields. The homepage's SSR bullet is compatibility, not renderingModes. Nuxt (@pinia/colada-nuxt) and Vue Router Data Loaders are integrations, not fields. The homepage's Links menu gives the GitHub Discussions page, recorded as forum. The homepage's Vue chat link is a general Vue community channel and is not recorded. The x fact is the account the homepage nav links; it is the maintainer's own handle. The maintainer is the copyright holder named in LICENSE, a person; the GitHub owner is a user account. The GitHub latest release is @pinia/colada-nuxt 1.2.1 (2026-10-30); the core package @pinia/colada was last released as tag v1.4.9 on the same day, so currentMajor and latestReleaseDate follow the core package. The npm figure is for @pinia/colada, the package the install line names. Stars and contributors are for the monorepo.
