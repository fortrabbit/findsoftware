notes: >
  Discontinued on the archive signal: the repository the npm package names as its source (https://registry.npmjs.org/notie, field repository) is archived, and GitHub shows the banner quoted under status. The homepage the npm metadata and the README name, https://jaredreich.com/notie, answers 404 today, and the owner's root page at https://jaredreich.com/ does not mention notie, so no homepage is recorded. Reviewer decision: the archive signal makes it discontinued here, while a project site that no longer shows the software would make it stub under AGENTS.md criterion 4. The README lists a script-tag route (unpkg) under HTML with code only and no sentence, and the quote check strips markup tags, so it is not recorded as installMethod; a cdnjs badge links the cdnjs listing. Browser support lists are in the README and are not a runsAs statement. Highest stable version is 4.3.1: npm latest is 4.3.1 (2017-04-26), which has a tag but no GitHub release object; the newest release object is v4.3.0 (2017-03-05). Prerelease tags v4.0.0-rc.1 to rc.3 are older than the stable line and are not recorded. Tag v2.1.0 (2015-11-19) matches the npm 2.1.0 upload and gives firstRelease. Stars and the npm weekly figure are adoption data only; the npm range sums the seven daily counts from 2026-11-01 to 2026-11-07. Dependent counts come from ecosyste.ms. The README says users can alert, confirm, input, select choices and select dates. The README feature list says the library is pure JavaScript written in ES6 with no dependencies, and that styling can be modified through the Sass file (notie.scss) or by overriding the CSS. The README also names a live demo at jaredreich.com/notie, which answers 404.
