notes: >
  The HTTP homepage in the candidate row, http://mediaelementjs.com/, answers only over plain http and redirects to http://www.mediaelementjs.com/; the bare https host does not answer at all, so the https www address is the homepage recorded here, and the site is the project's own. The README names John Dyer as the author and the homepage says the library was created by John Dyer at Dallas Theological Seminary; the LICENSE copyright line names MediaElement, which is the maintainer recorded. The homepage and the README say the library is HTML5 audio and video with a common API; no page on the sources read states that it runs in the browser in one sentence, so no runsAs is recorded. The README says the MediaElementPlayer is a complete HTML and CSS player built on top of MediaElement.js; that is one package's own structure, not a parent, so no basedOn. The jQuery plugin form ($.fn.mediaelementplayer) is optional, and the docs say jQuery must be imported for it; no basedOn. The installation page also covers WordPress (which bundles MediaElementJS in its Embeds package), Drupal and a Meteor route (meteor add johndyer:mediaelement); those are third-party packages or bundles and are not recorded as install methods. The bower route is named by the docs and kept as the docs state it. The GitHub releases list 78 releases, the oldest 2.16.4 of 2015, and the tag 1.0.0 is dated 2010-07-28 by its commit, which sets the first year. The last prerelease is 4.2.15-rc1 of 2020, older than the latest release. The npm package starts at 2.17.0 in 2015.
