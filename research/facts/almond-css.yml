notes: >
  The homepage is the project's GitHub Pages demo at alvaromontoro.github.io/almond.css; the README links the demo, and the candidate row's repository is not used as the homepage. Two license statements disagree: the repository LICENSE and the GitHub API say MIT (2019, Alvaro Montoro), and the npm registry's latest version says GPL-3.0-or-later. Both are recorded as their own entries, and the reviewer should decide which one the register shows. The README's own sentence is "Just combine your HTML and Almond CSS (no JavaScript needed.)", so no runtime is recorded. The npm download count is the sum of the daily downloads for 2026-10-18 to 2026-10-24 from the range endpoint. The README states the theming (CSS variables and HSL colors), the goal of using only tags with no classes or IDs, and that no JavaScript is needed. The npm package's latest version and the GitHub release v1.2.2 agree on 2023-02-09. The repository has no prerelease newer than the latest release. The README has no separate documentation site, so docs is absent; the README is the install page. HTTP Archive has no technology named for almond.css.
