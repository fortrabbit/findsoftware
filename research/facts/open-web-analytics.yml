notes: >
  One license entry, GPL-2.0, as the LICENCE file (the GPL version 2 text), the repository license field and the about page word it. The README words the same license as "GNU GPL, version 2 or later"; that wording is not a separate entry. The homepage is served over https at www.openwebanalytics.com; the CSV's www host is kept. The homepage calls the project a web analytics framework, so the category is analytics. The PHP runtime and the 8.2 minimum come from the wiki and from composer.json at tag 1.14.6 (require php ">=8.2"). The first tagged version in the repository is 1.0rc1 with a commit date of 2006-07-01; the repository itself was created in 2012, so firstRelease 2006 rests on the tag history alone and the reviewer should confirm it. The WordPress integration is a separate plugin on wordpress.org and the PHP SDK is a separate repository; neither is recorded as a plugin directory or basedOn. The wiki's Installation page names one cron entry as the scheduler; it does not state a web process model, so runsAs holds scheduled, plus per-request from the installation page's statement that the wizard, the reporting interface and the tracker are served from a directory under the web server's document root. The homepage links a demo site and an app.openwebanalytics.com address that redirects; no hosted offering is documented there, so none is recorded. The README also lists heatmaps, "Domstream" session recordings, geolocation of visitors, an e-commerce tracking feature and a multi-user reporting interface; these have no field and go to notes. The tracker's cookie lifetimes (364 days for the visitor id, configurable with stateStoreExpirations) are in the README and are a privacy-relevant setting, recorded here as a note only. The PayPal donation link is not recorded. The wiki says the install wizard, the reporting interface and the JavaScript tracker are all served from the one directory that holds the files, and that without the cron entry no scheduled job runs. The packaged release is unpacked into a directory the web server can reach (wiki Installation), and the install wizard creates the owa_ database tables and writes owa-config.php.
