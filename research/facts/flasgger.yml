notes: >
  Stub: the project's own demo site in the repository, flasgger.pythonanywhere.com, answers 404 over both http and https with a PythonAnywhere "Coming Soon" placeholder, so no homepage is recorded and the status is stub under AGENTS.md; the GitHub repository and the PyPI package are live and the package is installable, so a reviewer decides whether the record returns to accepted once a project site or the demo exists again. The README gives the install commands only in code blocks ("pip install flasgger==0.9.7b2", "pip install flasgger==0.9.5"), so no installMethod is recorded. The README says the project supports Swagger UI versions 2 and 3 and embeds Swagger UI; the embedded UI is a bundled component, not a parent, so no basedOn beyond Flask is recorded. The README's Python 2 section says version 0.9.5 was the last to support Python 2; setup.py states no python_requires, so no runtimeMin is recorded. The highest stable GitHub release is 0.9.5 (2020-08-01); the PyPI latest is 0.9.7.1 (2023-05-18), which the latestReleaseDate comes from, and both are major 0. The 0.9.7b1 and 0.9.7b2 prereleases are older than 0.9.7.1, so no latestPrereleaseDate is recorded. The LICENSE copyright line names Bruno Rocha; the PyPI author field also lists "Flasgger team", which is not recorded as the maintainer. The pypiDownloads figure is pypistats' last-week count at the request date.
