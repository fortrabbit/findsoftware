notes: >
  The default branch is next. The README lists "Vue.js (v3)" as a requirement and also says keen-ui@1.x is for Vue 2.x, so no runtimeMin is recorded. The README says Keen UI "is **not** a CSS framework" and ships interactive components without grid or typography styles. The docs site is a script-rendered page; its title carries the description, and the body was not readable without running the script. The license comes from the README. The npm package's first upload (0.8.2, 2016-04-16) predates the oldest GitHub release (v0.8.4, 2016-04-18). The last push is 2023-08-16 and the repository is not archived; no end statement was found. The last release is more than four years old, so the import moves the record to stub on its own. The README's "Tweet to me at @JosephusPaye" links a personal account and is not recorded as an x link.
