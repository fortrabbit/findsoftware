notes: >
  The repository's license detection shows NOASSERTION; the LICENSE file is the Apache License 2.0 text and the COPYRIGHT file names Zinc Labs Inc. The README's opening note points log-search users to the OpenObserve project, and its comparison table names OpenObserve; neither says ZincSearch has ended, so no end signal is recorded (a named successor alone is no end signal). The zinc.dev root domain now answers with the OpenObserve homepage ("OpenObserve: Open Source Observability Platform"), while the ZincSearch docs site at zincsearch-docs.zinc.dev still describes ZincSearch; a reviewer should confirm the project's own site before it is treated as current. The releases list holds v1.0.0-beta1 to beta3 (September 2026), which the API marks as not prerelease, and the stable v0.4.11 (2026-09-12); the major is therefore 0 and the beta is the latest prerelease. The first GitHub release is v0.1.0 (2021-12-03). The README says the project has "hundreds of production installations", which is not a count and is not recorded. The adminUi value is the React UI embedded in the binary; the README also lists a user management screen, and the authentication is described as out of the box, not as roles. The README says Kibana is not supported. It names bluge as the indexing library, reached through the vcaesar/riot fork, which go.mod requires directly, so basedOn is riot. The Helm chart and Kubernetes manifests are in the repository, recorded as an installation method only through the docs page. The ZincSearch docs site links a Slack community; no field takes it.
