notes: >
  Zuplo is a hosted gateway: the managed Edge and Dedicated options are cloud services. A Self-Hosted option exists with public install docs (overview, requirements, install), but the install needs a chart version and registry credential "provided by Zuplo during onboarding", so no distributable is available to a user without an agreement; the record stays hosted-service. The pricing page lists Self-hosted / Dedicated in the plan comparison. The GitHub account zuplo/zuplo holds the examples and tooling monorepo (its README says it contains examples, npm packages and internal tools), with no gateway runtime and no license file, so it is not recorded as the product repository. The homepage links that repository, which is not recorded as a field. The homepage states SOC 2 Type II and the pricing page lists a BAA as an add-on; these compliance claims have no field and are not recorded. The company address (Zuplo, Inc., Seattle, WA) is on the about page and in the privacy policy.
