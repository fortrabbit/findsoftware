notes: >
  The repository has no GitHub release or tag, so no major version, release date or first release is recorded. The npm package named "minimal" (0.2.1, by Rui Lopes) is a different project and is not used. The repository's GitHub homepage field points to the maintainer's projects page at lutzroeder.com, not a site of the project, so no homepage is recorded. The deploy command is ./task deploy, stated in the README; the dictionary has no field for a build command. The LICENSE copyright line names "Lutz Roeder and Contributors"; the record uses "Lutz Roeder" as the legal name the page gives for the maintainer. The README names Netlify as a deploy target; that is a host, not a hosted service of the software, so no hosted-service fact is recorded.
