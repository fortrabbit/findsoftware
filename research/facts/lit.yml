notes: >
  Highest stable GitHub release of the lit package is lit@3.3.3 (2026-05-14), matching npm latest. The repository is a monorepo; the figures are the lit package's. The SSR page (lit.dev/docs/ssr/overview/) says the SSR package is part of the Lit Labs family of experimental packages; no status field is set from that. The homepage states the OpenJS Foundation affiliation; the maintainer is taken from the docs footer copyright line. The category "ui-library" in the candidate row is not stated by the homepage, so it is not recorded. The npm registry lists no engines field for lit, so runtimeMin stays unknown. No first release year is stated on a page; the GitHub repository was created in 2017 and the npm package in 2012, but neither is a release date, so firstRelease stays unknown.
