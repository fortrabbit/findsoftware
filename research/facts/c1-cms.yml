notes: >
  The repository's README points to a download path under Orckestra/CMS-Foundation, a name the repository does not use; the release list on Orckestra/C1-CMS-Foundation is the one read. The highest stable GitHub release is v6.13-hotfix.862 (2026-09-14), so currentMajor is 6. The system requirements and the getting-started guide name .NET Framework 4.7.1, Visual Studio 2017 and WebMatrix, which are older tooling than the current major; the runtime and install values are recorded as those pages state them. The NuGet package CompositeC1.Core exists under the same vendor, but no install page names it, so no nugetName is recorded. The license file is the Mozilla Public License 1.1 with a Section 11 amendment; both statements are recorded as their own entries. The repository's first GitHub release is v2.0 (2015-11-27); the software predates it under the Composite C1 name, which no page read here dates. hqCountry is not recorded: the license names a Danish business registration, the homepage footer names Orckestra Technologies Inc. in Canada, and neither states a headquarters. The two-licenses page offers a commercial license beside the MPL under one edition; the Download page names service plans with premium CMS features, recorded as paidEdition. The homepage's "fully managed" offering is recorded as hostedOffering; no price is recorded. A runsAs value is not recorded because no page states how the IIS process runs. The download page says the ZIP install requires Windows ("You must be running Windows."); the system requirements list IIS and IIS Express as web servers. The data store is XML flat files by default, with SQL Server optional, so databases lists sqlserver as the optional choice. reportedInstalls is the homepage counter as read on the checked date.
