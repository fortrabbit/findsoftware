notes: >
  Commerce Layer is a hosted service: the terms describe a headless ecommerce platform the customer uses, and no installable part is named. The terms give California law and Santa Clara County courts, which are not headquarters statements, so hqCountry is unknown. The docs home lists a Core API, a Metrics API, a Provisioning API and an event stream (Stream Hub); only the Core API REST statement is recorded. The pricing page lists "Metrics dashboard", "Distributed OMS" and "Promotion engine" as add-ons, which are product modules with no field in the starter list. The Enterprise plan includes the Metrics API and Provisioning API access, which have no field in the starter list. The GitHub organization (github.com/commercelayer) holds SDKs, a CLI and open-source micro frontends that work against the hosted API, and is not recorded. The pricing page lists prices and per-plan order limits, none of which is recorded. The homepage and privacy page name Intercom and Google and GitHub logins; those are service providers and a login method, and the login methods are not recorded as sso.
