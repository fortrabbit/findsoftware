notes: >
  Selenide is a test library: the quick start says tests run from an IDE or a build script such as Ant or mvn test, recorded as runsAs local. The README says Selenide "is based on and is compatible with Selenium WebDriver 4.0+", which is the basedOn selenium source. The README's "Look for detailed comparison of Selenide and Selenium WebDriver API" link is a comparison with the same parent, not an alternativeTo statement. Maintainer: the LICENSE copyright line reads "Copyright (c) [2011-2025] [Andrei Solntsev & Selenide committers]", and the README says the library was "originally designed and developed by Andrei Solntsev" and "is maintained by a group of enthusiast[s]"; the homepage footer says "The project is maintained by" without a name in the captured text. hqCountry is not stated. firstRelease 2012 is the oldest Maven Central upload (version 1.0, 2012-02-10); the GitHub repository was created 2012-02-07. Runtime: the README names Java, and the 7.0.0 release post says Selenide 7.+ needs Java 17+, recorded as runtimeMin. Versions: latest stable 7.19.1 is the highest GitHub release, 2026-10-25. The Maven Central artifact com.codeborne:selenide publishes no download figure, so none is recorded. The README also lists Selenide CLI and Selenide MCP (AI agent tooling, npm package @selenide/cli and selenide-mcp), plugins for Appium, Moon, Selenoid, Selenium Grid and video recording (modules inside the repository), and a Selenide Video Recorder; none is a separate record. The homepage Contacts section links a Google group by mailto address, which is no forum URL, plus Gitter and Telegram chats; none is recorded. The "Selenide Supports Ukraine" banner and sponsors are not recorded. Stars and contributors belong to the single repository.
