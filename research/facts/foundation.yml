notes: >
  Doubt: Yeti has no published package and nothing to install, so the record is a stub. The install guide (https://www.foundationcss.com/yeti/guides/install/) says "Yeti is not released yet. There is no package on npm and nothing to download", and the package named yeti-css returns Not found on the npm registry, although the announcement (https://github.com/foundation/yeti/issues/15554) says "Yeti ships as yeti-css on npm when it reaches beta". The README states "Yeti is at 7.0.0-beta" and the foundationcss.com home page labels Yeti "Beta", but package.json on develop reads 7.0.0-alpha.0 and the repository has no 7.x tag or GitHub release, so no latestPrereleaseDate is recorded and, with no stable release, no currentMajor; lastCommitDate is the newest commit on develop. Yeti has no page on get.foundation; its docs are at https://foundationcss.com/yeti/. The repository foundation/yeti was foundation/foundation-sites; the announcement says "This repository will be renamed from foundation-sites to yeti". The license is FSL-1.1-MIT as the README and the LICENSE file state it, with copyright "Copyright 2026 Aspect Services, LLC"; the README adds that each release becomes plain MIT two years after it ships. The foundationcss.com home page describes Foundation as an umbrella of Yeti, Inky and Proton, and its about page says the project started at ZURB in 2011 and has been looked after by Joe Workman since 2019; firstRelease 2011 is the Foundation lineage, not a Yeti release. Predecessor in the same repository, Foundation for Sites 6 (not recorded as facts of this record): MIT, published on npm as foundation-sites 6.9.0, last released 2024-09-27, continued with bug fixes on the v6 branch; the registry shows no deprecation and 6.9.0 as latest; the docs live at https://get.foundation/sites/docs/. The GitHub star and contributor counts belong to the repository and so include Foundation for Sites 6 history. The language GitHub reports (JavaScript) is not recorded because it describes the v6 code as much as Yeti.
