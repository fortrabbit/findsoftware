notes: >
  Doubt: the repository now holds Yeti, a rewrite at 7.0.0-beta under FSL-1.1-MIT with no package and nothing to install yet, beside Foundation for Sites 6, which is MIT, published on npm as foundation-sites, last released 2024-09-27 and continued on a v6 branch with bug fixes; the homepage now lists Yeti, Inky and Proton as its tools. The license entry for Yeti reads that each release becomes plain MIT two years after it ships. A reviewer decides whether this record is Foundation for Sites 6 (accepted on the README's statement that version 6 continues, with criterion 4 read against the 2024 release) or the Yeti successor, and whether the umbrella homepage is one project; the v6 docs and install page are live, so what remains open is whether one record should cover version 6 only or the three-tool umbrella. The README calls Yeti "the successor to Foundation for Sites", a named successor while the README still describes version 6 as usable, so it is recorded here and is no end signal. The maintainer is the copyright holder named in the Yeti LICENSE, Aspect Services, LLC; the foundationcss.com about page says one person looks after Foundation and took it over from ZURB in 2019, and the version 6 LICENSE names ZURB, Inc. for 2011-2020, so the legal holder of version 6 itself is not stated. The npm package foundation-sites names its repository as foundation/foundation-sites, which now resolves to foundation/yeti. The first release year is the about page's statement that ZURB open-sourced Foundation in 2011. The get.foundation/sites docs answer and describe version 6: the install page lists npm, yarn, a command-line tool, a starter download and jsDelivr links, and the support page names the GitHub discussions board as the forum and @FoundationCSS on Twitter. The homepage footer links a Mastodon account. The HTTP Archive figure is the mobile count of its "ZURB Foundation" technology entry, which is the Foundation for Sites framework. The about page says Foundation began at ZURB, which open-sourced it in 2011 and handed the project over in 2019.
