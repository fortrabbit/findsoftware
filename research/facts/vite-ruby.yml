notes: >
  Package. The install docs name the gem vite_rails for Rails, so the RubyGems figures are vite_rails: total downloads from RubyGems (no period given) and dependents from ecosyste.ms. The core gem vite_ruby has its own total of 41025588 downloads and its own latest version 3.11.1, released 2026-09-29; it is not recorded as the registry figure. The same docs name other gems: jekyll-vite for Jekyll, vite_hanami for Hanami and vite_padrino for Padrino; these are not recorded here. Version: the repository has no GitHub release, only tags such as vite_rails@3.11.1, so the stable RubyGems version sets currentMajor and latestReleaseDate. firstRelease is the first vite_rails upload on RubyGems, 2021-01-19. Maintainer: the homepage copyright reads "Maximo Mussini"; the RubyGems author field reads "Máximo Mussini" with the accent. The homepage x link is the maintainer's personal account and is not recorded. Repository tags include vite_rails_legacy for Rails 4; not recorded. The homepage is a Netlify-hosted docs site on https. Contributors count across all pages of the repository contributors endpoint.
