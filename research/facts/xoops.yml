notes: >
  Repository choice: the homepage's download buttons and footer point to XOOPS/XoopsCore27 (XOOPS 2.7.x, latest v2.7.4), so that repository is recorded, with one githubStargazers figure for it. The CSV row names XOOPS/XoopsCore25 (the 2.5.x line), which is not recorded. The 2.5 README points to XOOPS/XoopsCore as the next generation under development; that repository is not a candidate here.
  currentMajor is 2 for the 2.7 line; the project names 2.5 and 2.7 as separate lines.
  The 2.7 repository was created 2026-04-09 and had 0 stars at this date.
  License: the software is GPL version 2 per the project's guide and the GitHub license field; the guide's documentation is licensed CC BY-NC-SA 4.0 (Creative Commons), which is a licence on the docs, not the software, and is not recorded as a license fact.
  maintainer is the copyright holder named by the guide; the homepage says the project is maintained by volunteers, and no legal form is given.
  The homepage links the modules and the old repository at xoops.org/modules/repository/; that is an earlier repository and is not recorded.
  firstRelease is not stated on any page read.
  adminUi: no page read states the admin interface; the installer and System Settings sections name it only by title, so the field is left out.
  The install guide describes copying the archive's files to a server, making the listed directories writable and launching the web installer.
  The introduction page calls XOOPS a web application platform built on PHP and MySQL, with modules that provide the application functionality.
