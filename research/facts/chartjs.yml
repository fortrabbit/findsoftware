notes: >
  The homepage says "Open source Chart.js is a community maintained project"; the LICENSE copyright line names "Chart.js Contributors", not a legal entity, so the maintainer is recorded as the copyright line states it. The homepage says the library renders in "HTML5 Canvas" with "IE11+" support, which is browser support and not a process model; the docs page "Using from Node.js" says Chart.js can be used in Node.js for server-side generation of plots with an npm package such as node-canvas or skia-canvas. Browser and Node.js together are no single process model, so runsAs is left empty. The stable line is 4.x: 4.6.1 released 2026-10-22 on GitHub and as npm latest. The GitHub releases carry alpha and release-candidate tags for 4.0 from 2022, all older than the stable release, so no latestPrereleaseDate is recorded. The installation page is dated 2022 in its footer and states that the GitHub download has no prebuilt files. The Discord link is taken from the README badge, the Twitter link from the docs introduction page, and the README "Popular Extensions" link (chartjs/awesome) is the extension list the project names. The docs introduction also links a Stack Overflow tag, which is no forum.
