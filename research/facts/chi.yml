notes: >
  The homepage go-chi.io serves a docsify shell: the HTML from curl holds only the title, the meta tags and scripts, and the documentation loads in the browser from a source that is not in the repository, so the homepage and docs facts quote the site's raw markdown sources (go-chi.io/README.md and pages/getting_started.md), which the site serves and which match the go-chi/docs repository. The Go module has no download figure and no registry figure is recorded. The README's only Go version statements are that chi is built on the context package introduced in Go 1.7 and a 2020 benchmark run on Go 1.15.5; neither is a minimum supported version, so runtimeMin is not recorded. The go.mod directive says go 1.24 and carries a comment that chi supports the four most recent major Go versions; that comment is not recorded as a fact. The module is versioned as github.com/go-chi/chi/v5. The copyright line also names Google Inc., and the README links the separate render, docgen and httprate projects, which are not recorded here. The GitHub releases list starts at v0.9.0 on 2016-08-02, which sets firstRelease. The dictionary's router category maps to library in the import, so the category is recorded as library.
