notes: >
  Stub, because the product pages are unread and the open question is whether an installable edition is still sold: business.adobe.com accepted no connection (an HTTP/2 stream error, then no response over HTTP/1.1 within the time limit, checked 2026-11-04), www.adobe.com/products/experience-manager/sites/aem-sites.html answers 403 to the research user agent, and experienceleague.adobe.com answers 403. The settling sources are a readable product page and docs page that state the deployment model (Adobe-hosted only, or a self-managed edition), the headless API and the admin interface; the reviewer or a later pass should re-run from a reachable network. The CSV repository adobe/aem-headless-client-js is a client SDK and gives this record nothing (wave 18 rule). No fact is recorded from any unread page. The Experience League documentation pages for AEM as a Cloud Service answered 200 on 2026-11-04 and are the source of the recorded facts; the docs describe a cloud-native service with Adobe-managed delivery (a built-in CDN, autoscaling, Cloud Manager CI/CD), so no self-install is shown there, and whether another edition is still sold stays open. The unreadable list holds the pages that did not answer; the earlier Experience League headless overview URL moved to a path that answers 404.
