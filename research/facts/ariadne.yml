notes: >
  Maintainer: the LICENSE copyright line names "Mirumee Labs"; the homepage footer reads "Copyright © 2026 Mirumee Software" and the contact page gives the address "MIRUMEE SOFTWARE SP. Z O.O. SP. K., 53-601 Wrocław, Poland". That address belongs to a different legal entity than the one the LICENSE names, so hqCountry is left unknown (reviewer decision: PL if the recorded maintainer is accepted as the Mirumee group). The repository holds one library; the website and docs live in mirumee/ariadne-website (README); the sibling packages ariadne-codegen (client generator), ariadne-auth, ariadne-graphql-modules, ariadne-lambda and ariadne-graphql-proxy are listed on the homepage as the Ariadne ecosystem and are not records here. API style: GraphQL, schema-first, SDL; kept in notes since headlessApi describes content APIs of CMSs. Integrations: Django, FastAPI, Flask, Starlette and SQLAlchemy (automatic resolvers), OpenTelemetry extension; no database is named as supported by the library itself, so databases is unknown. The PyPI project_urls list a Twitter link (twitter.com/AriadneGraphQL) that the homepage does not show, so x is unknown. The homepage was re-read for social links on 2026-11-04 and shows none. Release line: stable 1.1.x, prereleases 1.1.0a1 to a3 and 1.1.0.dev1 are older than 1.1.1. The GitHub repository was created 2018-07-09; the first tag and the PyPI upload are both in 2018. runsAs is left out: the ASGI page describes pointing an ASGI server at the user's own application, not a process model of the library. The README feature list names "ASGI and WSGI support, with integrations for Django, FastAPI, Flask, and Starlette".
