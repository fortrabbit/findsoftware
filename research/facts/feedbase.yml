notes: >
  Criterion 1 rests on the API reference: the Public API reads public project data and the Project API, with a public-scope key, is meant for the TypeScript SDK, so a creator's site or app can show the changelog or feedback. The portal itself is a hosted app the creator's users visit, so a reviewer should confirm the SDK is used on a creator's own site, or move the record to stub or rejected criterion 1. The public hub at hub.feedbase.app and custom-domain portals are the cloud product. The only release is v0.1.0 (2024-03-08), so currentMajor is 0 and the line is pre-1.0; the repository was last pushed 2025-01-03 and its README calls the project in very early stages. Self-hosting needs a Supabase project for the database and auth, per the Vercel and Docker guides; the installation page names a local Postgres database through the Supabase CLI. The Docker guide says Docker support is not fully stable. The maintainer is the GitHub owner by the name on the GitHub profile, since the README and LICENSE name no legal entity and the LICENSE has no copyright line. The terms and privacy paths at feedbase.app return 404, so no legal entity or country is recorded. The docs footer links twitter.com/0xChroxify. Single sign-on for the portal users is a JWT hand-off from the creator's own application (the SSO page), recorded here rather than as an sso protocol. The homepage lists a changelog subscription by email and RSS, custom domains for the hub and Linear and GitHub connections. The Docker Hub image was last updated 2024-03-08.
