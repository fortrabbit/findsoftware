notes: >
  The license is BSD-3-Clause on GitHub, and the license page says "Zenario is free under the open source BSD License" without a clause count, so the GitHub SPDX id is the only machine-readable source. The license page also says Zenario bundles third-party libraries under Apache, BSD, LGPL, MIT and OFL licenses; those are not the license of the Zenario code and are not recorded as license entries. The public self-host release line is 10.4 (GitHub release 10.4.67250 and the download page), while the homepage news announces Zenario 11 and 11.1 for OnZenario cloud clients; the self-host download page lists no 11.x release, so currentMajor is 10. The cloud service OnZenario is a hosted offering next to the self-hosted software, so the status stays accepted under criterion 2. The composer.json on the latest-public-release branch requires PHP >=8.1, while the system requirements page says PHP 8.3 or later; runtimeMin records the documented requirement, and a reviewer should decide which one counts. The repository created_at is 2015-01-22, which is not a first release date, so firstRelease stays unknown. Owner is the TribalSystems GitHub user account, and the company is Tribal Limited, which the privacy policy names as the operator of zenar.io.
