notes: >
  Name: the repository README is titled Graffle, the npm package is graffle, and the homepage says Graffle. The older name is graphql-request: its repository note says "It's been renamed to Graffle and the old version is available on the graphql-request branch"; the npm package graphql-request (latest 7.4.0, MIT) still publishes the old line, and its 2026-11-01 to 2026-11-07 weekly figure is 12917704 downloads with 2423 dependent packages and 108667 dependent repositories (ecosyste.ms, npm). These belong to the older package and are not recorded as this record's figures.
  Status: the getting-started page says Graffle "is still in development so there is no stable release to install yet", and installs the next dist-tag. A pre-release is no end signal; the record is accepted, with latestPrereleaseDate from the npm next tag (8.0.0-next.223).
  currentMajor and latestReleaseDate come from the newest stable GitHub release of the repository, v7.4.0 (2025-12-12), the last release under the older name. A reviewer may decide whether the Graffle record should carry no stable major until the 8.x line ships.
  The npm latest tag of graffle is 0.0.0 under ISC (a placeholder); the install docs use the next tag, so the registry figures come from it. ecosyste.ms counts for graffle are zero and are not recorded.
  runtimeMin is not recorded: the docs state ESM-only packaging and two CJS options (Node.js 22.12 or 20.17 with a flag), which do not give one minimum version.
  The docs introduction says the library works in browsers, Node, Deno, Bun and Cloudflare Workers; the record keeps runtimes node, deno and bun and no runsAs, because the sentence names the browser beside the server runtimes.
  The comparison page also compares Graffle with Urql (candidate id urql, in the dev-libs CSV, no fact file yet) and with the older graphql-request line; only apollo-client has a fact file, so only it is recorded as alternativeTo.
  The GitHub stars and contributors belong to the repository, which holds both the Graffle line and the older graphql-request branch.
  Homepage: graffle.js.org is reached over https; the repository names http://graffle.js.org/, which is the same site.
