notes: >
  The repository holds goctl tags (tools/goctl/vX) next to the framework tags; the framework's newest stable tag is v1.10.3 (2026-08-01), and currentMajor and latestReleaseDate follow it. The goctl tools are part of the same repository and install docs, so goctl is described on the record, not split out. The LICENSE copyright line reads "Copyright (c) 2022 zeromicro"; the maintainer is the author named on the About page, and the account that owns the repository is the organization zeromicro. The docs at go-zero.dev describe the API definition language, goctl generation for many languages and a Kubernetes and Docker deployment path; only the bare-metal page states the daemon model, so runsAs is the bare-metal value. The MCP and AI tooling links in the README point to other repositories (ai-context, zero-skills, mcp-zero) that are not sources for this record. The README states that go-zero is listed in the CNCF Cloud Native Landscape; that listing is not a field here. The go-zero.dev docs are in English, Simplified Chinese and Korean; the i18n field describes the software's own multilingual support and is not set from documentation translations.
