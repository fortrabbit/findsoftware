notes: >
  The homepage shows the icon count and a version label; neither is recorded because both change with releases. The README names two first-party framework packages, @heroicons/react and @heroicons/vue, with install commands; the npm figures are for @heroicons/react, the main framework package; the bare heroicons package (the README badge's package) and @heroicons/vue carry no figures here. The homepage's only X link is a share intent, not an account, so no x fact. The README states the project does not accept contributions for new icons or for other frameworks such as Svelte or SolidJS, and that it accepts bug fixes such as incorrect TypeScript types or an icon exported with a fill instead of a stroke; the contribution policy is not a field. The package icons are also available as inline SVG copied from heroicons.com, which is why installMethod lists copy-paste beside npm. Maintainer taken from the LICENSE copyright line.
