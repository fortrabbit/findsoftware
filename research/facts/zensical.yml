notes: >
  The Studio license page names Zensical Studio as a commercial product under its own EULA; the Zensical code is MIT-licensed, so the two license entries sit side by side.
  Studio is an authoring extension for VS Code, not a hosted service, and Spark is a membership, not an edition; neither is recorded as a hosted-service or paidEdition.
  The Bluesky, Fediverse and X links sit in the site footer as icon links with no readable label, so those three facts carry no quote. firstRelease is the year of PyPI release 0.0.1; a 0.0.0 release from 2024 is a placeholder not counted.
  hqCountry is not stated: the terms give the governing law as the State of Wyoming, which is not a headquarters statement, so it stays out.
  The maintainer is the copyright holder the site footer names (Zensical LLC); the MIT notice says "Zensical and contributors".
