notes: >
  The tsdown guide says "tsdown is built on top of Rolldown", so basedOn is rolldown, which has a record. The package.json author is Kevin Deng and the LICENSE copyright also names Kevin Deng for 2024; the maintainer is the legal name on the 2025-present copyright line, VoidZero Inc., and the VoidZero footer on the homepage is the parent. The npm maintainer list names yyx990803 and sxzz. The tsup migration guide names the migrate command, recorded as importsFrom. The successorOf tsup value rests on the tsup README pointing to tsdown as the replacement; the tsdown pages do not use the word successor, so a reviewer should confirm the relationship. runtimeMin comes from the engines field at tag v0.23.3, which matches the npm latest version. The GitHub release v0.23.3 is dated 2026-10-27; the npm upload is dated 2026-10-28. The npm weekly figure covers 2026-09-28 to 2026-10-04. The ecosyste.ms dependent counts are zero for both packages and the repositories.
