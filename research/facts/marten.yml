notes: >
  The Crystal installation steps on the install page (Homebrew, APT, pacman) install the language, not Marten. The homepage link Chat resolves to a Discord invite (discord.gg/499Vwt6kTc), recorded as discord. The README names the framework's inspiration (Django and Ruby on Rails) as inspiration only, so no basedOn is recorded. The project's docs deployment page is only an introduction in the published site; the deployment steps are read from the docs source in the repository, where the introduction says that a compiled server is started and the Ubuntu guide runs it under SystemD. The published documentation and the repository docs source both state version 0.7 as the current docs version; currentMajor is 0 because the highest stable GitHub release is v0.7.1. No adminUi page was found in the docs. Crystal shards are not one of the registries this research reads, so no download figure is recorded. The repository has no GitHub releases earlier than v0.1.0 (2022-10-24), which gives firstRelease.
