notes: >
  Coined databaseDrivenThemes (optional database storage for theme files) and paidSupport (commercial support offered by a third party the project names). Packagist counts the project skeleton (wintercms/winter) separately from its core modules; the system module is recorded as a second packagistDownloads entry with its package name. The marketplace page lists nothing yet and points to an awesome list. wintercms.com/about answers 404. No support or EOL policy was found on the support page.
