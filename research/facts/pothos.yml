notes: >
  Monorepo: the repository holds the core package and its plugins, so the stars and the contributor count belong to the monorepo, not to @pothos/core alone; the registry figures are for @pothos/core, the package the install docs name. The docs install route names graphql as a peer dependency and graphql-yoga as the server; graphql is the only dependency of the core, which is a dependency statement and not a basedOn statement. The migration guide at https://pothos-graphql.dev/docs/migrations/giraphql-pothos says "As of 3.0 GiraphQL has been renamed to Pothos." and calls v3.0.0 the initial version of Pothos, so the record follows Pothos from its first @pothos/core upload of 2022-01-25 (3.0.0, npm time); the GiraphQL packages of the same repository, which start in 2021, are not counted. No GiraphQL record exists, so the rename stays in notes and successorOf is not set. The highest stable @pothos/core release is 4.17.0, published 2026-11-10 (npm time), so currentMajor is 4. The docs page lists npm, pnpm, yarn and bun as tabs of one install route, recorded as npm only. The plugin catalog on the plugins page states 19 plugins, and the homepage calls Pothos a schema builder for TypeScript. The docs quickstart states Node.js and npm as the setup, which is the only runtime sentence, so runtime is node. The docs quickstart states that toSchema() builds a graphql-js GraphQLSchema usable with Yoga or another server, and its example serves it with Yoga on a Node http server. The resources page lists a community Nexus to Pothos codemod by a third party, which is no migration guide of the project and not recorded as importsFrom. The README links no social or forum channels, and its sponsor list is not recorded.
