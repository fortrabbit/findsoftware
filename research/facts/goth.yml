notes: >
  Repository only: the CSV homepage and the repository's homepage field name a blog post titled "goth needs a new maintainer", which is no project site, so homepage is left out. The repository is not archived, has commits to 2026-02-11 and a release in 2025; a call for a new maintainer is no end signal. The README's Installation section shows go get github.com/markbates/goth, recorded as installMethod. The README says the package is inspired by omniauth; that is not a basedOn statement and is not recorded. The README lists supported providers by name; no field takes that list. Default sessions use the gorilla/sessions cookie store per the README's Security Notes, whose default options list Secure as false and whose example overrides gothic.Store at startup, with the comment that Secure is set to true when serving over https. The LICENSE copyright line names Mark Bates; the README names no maintainer. firstRelease is the oldest tag v1.38.0 (commit dated 2017-03-01); the oldest GitHub release is v1.44.0 (2018-01-03). Go modules have no download figure; the dependent counts are ecosyste.ms for the proxy.golang.org module github.com/markbates/goth. Stars and contributors belong to the repository.
