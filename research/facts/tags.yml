notes: >
  Stub: the homepage http://tags.brace.io/ answers only over plain http and loops through a JavaScript redirect to /lander, which answers with a further redirect to /lander, so no page of the project's own site shows the software now; no homepage is recorded and the link is not used. The last release on PyPI (brace-tags 1.0.10, 2014-06-18) and the last commit on GitHub (2014-06-18) are more than four years old, so the import will move the record to stub under criterion 4 regardless; this is recorded here as stub. The repository has no GitHub release or tag, so the PyPI release line is used for currentMajor, firstRelease and latestReleaseDate. The README states the install with easy_install and says the tags build command writes to _site; the template language has two tags, include and is. The README says it works with Python 2.6, 2.7 and 3.3, which is a compatibility statement and not a minimum, so runtimeMin is absent. The README invites hosting on Brace (brace.io), a hosted service whose page was not read. The stars and contributors come from the GitHub repository.
