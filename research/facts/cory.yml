notes: >
  The npm package cory names the GitHub repository as its only project link, so no homepage is recorded; the npm homepage field points to the repository readme. The README opens with "IMPORTANT: This project is deprecated. Please go with next.js" and the repository is archived (the wiki banner gives the archive date, 2017-11-09); both are recorded as the discontinued status. The README names Next.js as the replacement; this is not recorded as successorOf because the project states it only as a recommendation. Highest stable release is 2.0.1 (2017-06-21), matching npm latest. The wiki (github.com/leo/cory/wiki) describes "cory init" and "cory serve -w" and was read; it adds no fact beyond the README. The README says the config outputDir defaults to "dist" but does not name the output as static files, so runsAs is not recorded.
