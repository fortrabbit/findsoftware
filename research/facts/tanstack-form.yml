notes: >
  Monorepo: the repository holds the core package @tanstack/form-core, the framework adapters (react-form, vue-form, angular-form, solid-form, svelte-form, lit-form, preact-form), the meta-framework adapters (react-form-start, react-form-nextjs, react-form-remix), and the devtools packages. Stars and contributors belong to the monorepo. The npm figures, dependent counts and the stable release date are those of the core package; the React adapter @tanstack/react-form had 6631348 downloads for 2026-11-01 to 2026-11-07. The adapters are official bindings of a framework-agnostic core, so no basedOn is recorded. The docs say "TanStack Form is compatible with various front-end frameworks, including React, Vue, Angular, Solid, Lit, and Svelte", and the repository description omits Svelte, which the installation page includes. The latest stable core is 1.33.5 (2026-08-11), which the docs site labels "v1 Latest"; the 2.0.0 alpha.3 release of 2026-10-23 is the latest prerelease. The repository was created on 2016-11-29 as tannerlinsley/react-form, which GitHub redirects to TanStack/form; the oldest upload of the same repository is the npm package react-form 0.0.17 (2016-12-05, repository url tannerlinsley/react-form), older than the earliest TanStack Form tag v0.0.1 (2023-04-26), so firstRelease records 2016. The 2014 uploads of react-form belong to a different author and repository (korbin/react-form). The comparison page says its table "is under construction and is still not completely accurate", and it names Formik, Redux Form, React Hook Form and Final Form as the libraries it compares against; the quote is the table header row. The docs' installation page also lists meta-framework adapters and the devtools packages, which are separate npm packages and are not recorded as installMethod routes. The polyfill note says older browsers need a transpiled copy of the library, which is not a runtime statement. The maintainer follows the LICENSE copyright line (Tanner Linsley); the terms page of tanstack.com names Utah as governing law and no address, so hqCountry is not recorded. The X, Bluesky and YouTube links come from the footer component of the tanstack.com site source (the footer renders client-side, so a plain page fetch does not show them); its LinkedIn link is not recorded because no field exists for it. The installation page shows the adapter packages as package-manager tabs, so the install quote names the package manager route.
