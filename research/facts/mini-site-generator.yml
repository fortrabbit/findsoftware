notes: >
  The build command is msg -io ./src/ ./dist/ (source and output folders passed with -io), stated in the README; the dictionary has no field for it.
  The package has no GitHub releases or tags; its currentMajor and latestReleaseDate come from the npm registry, where version 1.0.10 is the latest and dates from 2018-02-11. The GitHub repository was pushed on 2023-04-20 with no release after 2018. The import moves a record with no release in four years to stub.
  The README and homepage name Node.js nowhere: the package is installed through npm and its page files are JavaScript, so runtime is left unknown rather than set to node.
  The package.json author and the LICENSE copyright line both name Iain J McCallum; the record uses the LICENSE form.
  Downloads from the registry are 4 for the week 2026-10-12 to 2026-10-18.
