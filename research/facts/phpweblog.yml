notes: >
  The candidate row says no project site or release was found; both exist. The project site is phpweblog.org, and SourceForge project phpweblog holds the release files. There is no GitHub repository, so repository is not recorded; the SourceForge code area was not read. The tarball (phpweblog-0.5.3) is the distributable read for the installation, license, runtime, database and maintainer facts. Its files carry no URL the quote checker can fetch, so those facts have no quote. The INSTALL file names PHP4 and MySQL as prerequisites, and its copyright line names Jason Hines; the CREDITS file lists his address, which is not recorded. The license is stated two ways: the SourceForge page says GPLv2, and the INSTALL notice says version 2 "or (at your option) any later version", so both entries are recorded. The phpweblog.org homepage lists 0.5.3 as the unstable release and 0.5.2 as the stable one. Its pages carry ads and links to a site-builder, and its HISTORY, contrib and TODO paths answer with 404 pages. The SourceForge page shows Last Update 2013-04-16 and 11 downloads this week, the only adoption figure found; criterion 5 is for the reviewer to decide, since the threshold is open. The latest file release on SourceForge is dated 2001-10-31 and the first release in the HISTORY file is 0.1 of April 2000. The sourceforgeDownloads field is coined here for the SourceForge weekly count.
