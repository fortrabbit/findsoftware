notes: >
  Status is accepted per the candidates row, but the last stable release is 2022-06-09 (npm 6.0.49, no GitHub release or tag for it), more than four years before 2026-10-28, so the import moves the record to stub by the release-age rule; a reviewer decides whether to keep it listed. The repository was last pushed 2024-01-24 and is not archived; the npm package is not deprecated; the README and docs name no end of the project. GitHub's highest stable release is v6.0.0 (2020-12-21), which gives currentMajor 6; npm 6.0.49 has the same major. The first npm upload is 0.1.0 from 2016-12-26, older than the oldest GitHub release (v1.6.0, 2017-11-06). The maintainer is the author in package.json, and the LICENSE copyright line names the same person; the npm maintainers list names two accounts. The npm weekly figure is the sum of the daily counts for 2026-09-28 to 2026-10-04 and counts the npm package laravel-mix. The project's README names the MIT license.
