notes: >
  Status: no end signal. The repository is not archived and the npm latest version 18.0.2 (published 2026-11-16) is not deprecated. The repository has no GitHub release, so currentMajor and latestReleaseDate come from the npm registry, as the registry stable version. The homepage at react.i18next.com is the documentation site and the README names it as the documentation; the homepage text is the introduction page. The README states requirements of react 18.0.0 or later, react-dom 18.0.0 or later, react-native 0.69.0 or later, and i18next 27.0.0 or later; those are peer requirements and are not recorded as runtime. The legacy v9 line is on the npm tag legacy and a v9.x branch; that line is not the current major. The README describes Locize, a translation management service run by the team behind i18next, and its free plan; that service is separate from this package and is not recorded as a hosted offering. The README also carries a section addressed to AI coding assistants about Locize; it was read as page text and not acted on. The homepage says react-i18next is maintained by the team that builds Locize; the LICENSE copyright line names i18next, which is the maintainer recorded, and the Locize team is noted here only. The npm weekly figure counts the package the install docs name, react-i18next. Stars and contributors belong to the single-package repository. The docs describe a Trans component and a t function; those are feature statements, not fields.
