notes: >
  Monorepo: the install docs name @ant-design/pro-components, so that npm package is the registry id and its figures are used. The npm latest tag is 2.8.10 (2025-07-17), and the stable GitHub releases list tops at 2.8.6 (2025-02-17); the registry date is the one recorded because npm is the install source. The homepage says "v3 released" and the README points at a migration guide, but npm carries 3.x only under the beta tag (3.1.15-8, 2026-10-23) and GitHub has no stable 3.x release, so the stable major stays 2 under the rule; a reviewer decides whether the record moves to 3 once a stable 3.x ships. The npm peer dependencies of 2.8.10 are antd ^4.24.15 or ^5.11.2 and react >=17.0.0; no page states a runtime or runtimeMin for the library. The README license line reads "Copyright © 2023 - present AFX & Ant Digital", recorded as the maintainer; no legal form or hqCountry is stated on the pages read. The GitHub contributors count is read from the Link header of per_page=1. npmWeeklyDownloads is the sum of the daily range 2026-10-18 to 2026-10-24: the point/last-week endpoint answered with the week of 2026-06-25 at read time. The homepage has no social or community links. The components page is the readable docs page; the other /docs/ routes return the same client-rendered shell.
