notes: >
  Monorepo: the repository holds the imask core and the framework packages (vue-imask, angular-imask, react-imask, react-native-imask, svelte-imask, solid-imask), so the stars (5177) and contributors (31) belong to the monorepo; the npm figure is for imask, the package the install guide names. The framework packages are listed in the README as plugins of the core, each a binding of one UI framework, so none is basedOn and none is a separate record here. The README says it supports all major browsers and works with outdated browsers; that is a support list, so no runsAs fact is recorded. The site says it has no external dependencies; that is a claim about the package and is not recorded. The LICENSE copyright line names uNmAnNeR, the GitHub handle, and that is the maintainer as the license states it; package.json names Alexey Kryazhev as author, which is not recorded because the LICENSE line governs. The oldest tag 0.1.0 is dated 2017-02-28 and the npm package's first upload (1.2.0) is 2017-10-28; firstRelease takes the tag. The latest GitHub release is v7.6.1 (2024-05-21), which npm also reports as latest; the last push was 2024-10-11. The category forms is the nearest mapped value for an input mask: the import has no input-mask value. The README links a Telegram channel as a second place for questions; it is a chat, not recorded as a forum. The guide says a mask applied to an input element needs type="text", because other input types are not supported. The README lists the Vue, Angular, React, React Native, Svelte and Solid packages as plugins of the core; the repository holds them, and the npm figure is for the core package only.
