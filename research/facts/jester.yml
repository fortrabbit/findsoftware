notes: >
  Criterion 3 is in doubt: the README (readme.markdown) documents only a compile-and-run example and no installation of the library into a project, and jester.nimble lists dependencies without an install step. A README or Nimble directory line "nimble install jester" would settle it and move the record to accepted. The project has no website of its own: the GitHub repository is the only source, so no homepage is recorded. The README says applications should run behind a reverse proxy before production use and that the library is not yet hardened against HTTP security exploits, and it says the public internet should not reach it; recorded for the prose only. The jester.nimble requires nim 1.0.0 or later and httpbeast 0.4.0 or later on non-Windows systems; the Nim compiler is a build tool, so no runtimeMin is recorded. The latest stable release is v0.6.0 (2023-06-18); the default branch has commits in July 2026 and the repository is not archived. The Nimble registry, which carries the package, is not one of the registries in the rule set, so no registry figure or name is recorded. The LICENSE copyright line names the author; the repository owner is a user account, so the maintainer is the author named in the license.
