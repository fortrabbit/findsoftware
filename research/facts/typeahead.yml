notes: >
  Status accepted; no end signal. The repository is not archived, npm latest 0.11.1 is not deprecated, and no page states an end or maintenance mode. The CSV homepage is http://twitter.github.io/typeahead.js/; the https address answers 200 and is recorded. The repository has no GitHub release object; its 15 tags end at v0.11.1 (2015-04-27), the same as the npm latest, so currentMajor 0 (pre-1.0 line) and latestReleaseDate come from npm. firstRelease 2013 is the oldest tag v0.8.0. The README's preferred route is Bower, and it names no npm route; npmName is the same-named npm package and its figure counts npm downloads of typeahead.js, which a reviewer may confirm as the figure to keep. Maintainer follows the LICENSE copyright line (Twitter, Inc, no period in the license); the README lists Jake Harding as a maintainer and two other authors, none recorded. runtime and runsAs are left out: the README gives a browser support list and says the UI view handles DOM interactions, but no sentence states where the library runs. The README says both dist files bundling the suggestion engine (Bloodhound) and the UI view depend on jQuery 1.9 or later; the basedOn fact rests on the docs sentence calling the UI component a jQuery plugin. The GitHub stars and contributors belong to the repository. The examples page lists demos only and states no other fact.
