notes: >
  Doubt first: the deployment model is unchecked. The product page, pricing and terms pages answered 200 with a bot-check page ("Security Check") instead of their content, and bloxcms.com answers 451 "Unavailable for legal reasons" to EEA visitors, so the product, its docs and any install or hosting statement were not read. The homepage and the about and privacy pages were read. Its footer links Documentation (help.townnews.com, which redirects to help.bloxdigital.com and answers 451 to EEA visitors) and Release Notes; neither was read. The docs value is the footer link, unread. The customer community at community.bloxdigital.com answered 200 and says BLOX Digital was formerly TownNews, a rename that is no parent statement. The homepage says its print, web, mobile, newsletter and e-Edition products run in a unified SaaS workflow, which leans to hosted-service but does not name the CMS install model. A reviewer settles it by reading the product or documentation pages from a browser: a SaaS-only statement makes the record hosted-service, a public install guide makes it accepted, and a page that says it is a bot challenge cannot settle it. Product naming also needs a decision: the CSV name is BLOX CMS, the footer reads "Powered by BLOX Content Management System", and the homepage calls its flagship "BLOX NXT", "one unified, full-stack CMS", beside "BLOX Total CMS". The record takes the name the footer gives. The about page says the company has "over 2,000 clients" and the home page says "thousands of media sites"; these are customers and sites, not a recorded installs count, so reportedInstalls is not used. The company's legal form is not stated on the pages read; the privacy statement names "BLOX Digital and our controlled affiliates and subsidiaries". The site links admin.townnews.com and a TownNews privacy statement path, but no page states a parent, so none is recorded. The about page address (1033 7th St. Ste 200, East Moline, IL) names no country, so hqCountry is unknown.
