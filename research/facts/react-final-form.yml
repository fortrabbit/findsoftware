notes: >
  The React binding of Final Form, a separate record. Its README says it has only peer dependencies on React and Final Form; the basedOn values come from the sentence "React Final Form is a thin React wrapper for Final Form", not from the peer dependency list. The npm package react-final-form is the registry figure; the core library final-form has its own record. The package.json description and the homepage both say the library is for React. The install route is npm: the getting-started page gives "npm install --save final-form react-final-form" and "yarn add final-form react-final-form" under Installation; both are one npm registry route, so one installMethod entry is recorded. The migration pages "Migration from Formik" and "Migration from Redux Form" are documented migrations: formik is recorded in importsFrom, and Redux Form, named in the same migration guide and the FAQ comparison, is left here in the notes until its own record exists at commit time. No prerelease is recorded: v7.0.0-0 (2025) predates the stable v7.0.0 release. The homepage's sponsor is named on the README (Sencha); a sponsor is not a field. Contributors and stars are the repository's own figures. The homepage's Stack Overflow link is a general tag, not the project's forum, so no forum is recorded.
