notes: >
  No homepage: the GitHub homepage field is empty and the API documentation at http://weavejester.github.io/compojure is served over plain http only, so it is not linked (homepage is in notFound). The repository has no GitHub releases; the highest stable version is the tag 1.7.2, which Clojars also lists as latest_version, so currentMajor and latestReleaseDate come from the tag. The Clojars figure is the artifact's total downloads across all versions, read on 2026-10-26. The project's Clojars listing gives no upload dates, so firstRelease is the date of the oldest tag, 0.1.0. The README and the wiki Getting Started page name Ring and the web application; basedOn Ring is the parent the README states. The category is recorded as library, the scope note's routing library. Clojure 1.9.0 appears as a build dependency only, not as a stated runtime requirement, so runtimeMin is not recorded. The repository has a second license statement in project.clj ("Eclipse Public License", same as the README); both are recorded. Last push 2025-09-15; not archived; no end statement found.
