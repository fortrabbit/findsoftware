notes: >
  Accepted as a testing library for Ruby test suites. The Hippocratic License 2.1 (the first license entry) is an ethical-source license with human-rights conditions in its Purpose and Permission sections; it is recorded as the LICENSE names it, and the LICENSE states that some portions are covered by an MIT notice (Copyright (c) 2010-2015 Myron Marston), recorded as the second entry. The gemspec lists both licenses as "Hippocratic-2.1" and "MIT", the same two entries. The maintainer follows the LICENSE copyright line, which names three people; the MAINTAINERS file lists five GitHub handles without names. The README names VCR.py as a port in another language (the Python record vcrpy); a port is not recorded as basedOn, forkOf or alternativeTo. The gemspec's required_ruby_version of 2.7 is the runtime minimum of the latest release; the README says VCR 6.1.0 is the last version supporting Ruby 2.6 and that later releases support Ruby 2.7 and newer. The install route is RubyGems: the README names no install command, so the gem route is cited from the RubyGems API. The RubyGems total is the download figure, recorded with its period. No runsAs is recorded: the README describes use in a test suite and names no process model. GitHub reports the repository license as NOASSERTION (other), which matches the two entries above.
