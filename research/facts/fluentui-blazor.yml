notes: >
  The README describes the library as wrapping Microsoft's Fluent UI Web Components in some components, which the basedOn field does not carry because the web components package is a candidate of its own. The branch is v5, with a v4 archive branch; the highest stable GitHub release is v5.0.1 and the highest NuGet stable version is 4.14.5, which the registry major does not exceed, so currentMajor is 5 from GitHub. The NuGet first upload is not older than the GitHub tags, so firstRelease is 2021 from the 0.2.0 GitHub release. The README names two Discord invitations, FcSNfg4 under the community section and M5cBTfp6J2 under documentation and contact (DotNetEvolution server); the record keeps FcSNfg4. The Fluent UI System Icons and Emoji packages are separate NuGet packages named in the README, and the README lists the Icons package as Fluent UI System Icons. The library targets net8.0 and later in Release builds, and the Blazor render mode requirement is stated in the README; no page states the hosting server, so runsAs is absent. The project is not an official part of ASP.NET Core, and the README says support is on a best effort basis through GitHub. hqCountry is read from the Redmond, WA address in the terms page. The dependent repositories count is zero on ecosyste.ms and is not recorded. The install steps register the services in Program.cs, add the library stylesheet to the page head and place the providers component in the top-level layout.
