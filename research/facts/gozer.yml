notes: >
  No homepage: the repository's homepage field is empty and the README names no site; its contributing section links only the repository and its issue tracker. The GitHub release list holds one release (0.4.1, 2026-08-11), so firstRelease is the commit date of tag 0.1.1 (2024-02-13), the oldest tag; the reviewer decides between 2024 and 2026. The README's djot front matter note is not a fact kind in the starter list. The serve command starts a local HTTP server on port 8080 and is a development step, so runsAs records only static. The go.mod directive (go 1.23) is a repository file, not a page or registry, so runtimeMin is left out. The README's "fast & simple" wording is quoted as the project's own description and is not used in prose. The example directory is a repository folder and is not read as a page. The build command deletes the output directory before it builds the site.
