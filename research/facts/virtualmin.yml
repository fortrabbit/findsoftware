notes: >
  Accepted. Virtualmin is a Webmin module ("Virtualmin plugins are merely Webmin modules"; the homepage and OS support page say it runs on top of Webmin), so the parent is Webmin and is kept here only: no webmin record exists yet, and basedOn takes record ids. A later webmin record takes basedOn webmin. The GPL repository is virtualmin-gpl; the homepage lists a free GPL edition and Virtualmin Pro, and the Pro license is the paid edition. The license quote is the GPL text, and the repository's LICENSE has no copyright line; the maintainer comes from the privacy statement ("Virtualmin, Inc."), and no page read gives a legal address, so hqCountry is absent. firstRelease is 2005 from the about page ("founded by Jamie Cameron and Joe Cooper in 2005"); the README says development has run "since ~2003", an approximate year the about page does not confirm. runsAs is absent: no page read says that Virtualmin or Webmin runs as a daemon or service. The Webmin dependency, the Usermin webmail and the plugin set are not fields; the Telegram link in the footer has no field. The LDAP guide describes storing users and mail aliases in LDAP and is not a single sign-on statement. The homepage also shows "200K+ Active Users" and "1M+ Domains Managed"; the README's installation count is the one recorded. Language is Perl per the README; the GitHub primary language is HTML. The i18n entry counts the language codes in the README table, whose human-translated coverage varies from 0% to 100% per language; it is not a claim of complete translation.
