notes: >
  Hosted-service record. The candidates row names the repository knocklabs/javascript, "Official JavaScript packages for interacting with Knock" (MIT, 32 stars at 2026-11-03, npm @knocklabs/client about 345.5k downloads a week in the candidates row). The SDK repository, its license, stars and npm figure stay in these notes and no repository field is recorded for the service. The docs landing page says the product offers "a complete notification engine" with a REST-ful API and SDKs. Plans on the pricing page: Free (no credit card), Starter and Enterprise; the Enterprise column carries custom roles, translation support, SAML 2.0 SSO, directory sync (SCIM), audit logs, template migration services and enterprise SLAs; Google SSO appears on every plan. Built-in multi-tenancy is a Free-plan feature on the pricing page. No prices are recorded. The privacy policy and the terms name "Knock Labs, Inc." and the privacy policy states the company is based in the United States. The "Template migration services" row names no source, so importsFrom stays out. The homepage links X (x.com/knocklabs), LinkedIn, YouTube and GitHub (github.com/knocklabs); only X has a field here. No Discord or community forum link is on the homepage. The API reference calls the API REST-ful, recorded as headlessApi. The pricing page has a Free plan with no credit card required and bills per message, where a message is a single message delivered to a single user on a single channel, with monthly included amounts on each plan; the privacy policy says personal information provided to Knock is processed and stored in the US, which describes the company site, so no regions are recorded. The candidate row's lastRelease is the SDK on npm and is not recorded as a service release.
