notes: >
  The homepage seleniumbase.io is the documentation site and carries the README's own feature list; no separate landing page was read. The README states that the framework "uses Selenium/WebDriver APIs", which is recorded as basedOn selenium; the sentence says "uses", not "built on", so a reviewer may decide to drop it. The LICENSE copyright line names Michael Mintz and the GitHub owner is the seleniumbase organization, which is recorded as repoOwnerType. The first PyPI upload (1.1.13, 2015-12-04) is older than GitHub's oldest tag (v1.2.0, 2016), so firstRelease is 2015 from the registry. Highest stable GitHub release is v4.58.1 (2026-11-16), matching PyPI. The runtimeMin comes from setup.py at the v4.58.1 tag; pyproject.toml carries no python version. The README and homepage describe stealth browsing, CAPTCHA handling, CDP Mode, Playwright compatibility, a test dashboard and a MasterQA mode; these are feature statements and stay in notes, not fields. No paid tier or hosted service is stated, so paidEdition and hostedOffering are unknown. The README's migration section (examples/migration/raw_selenium) supports migrating from raw Selenium, recorded as importsFrom; the README "How is SeleniumBase different from raw Selenium?" section compares it with the library it uses, so no alternativeTo is recorded. runsAs local rests on the README line that it works on CI/CD platforms; the README lists Linux/Ubuntu, macOS and Windows as supported systems, and Python and Git on the PATH as setup steps. The README's second install route is a clone of the repository with pip install -e, recorded as source-build. The youtube link is the project playlist the README links; the other YouTube channel it links belongs to the maintainer personally. npm and RubyGems packages are not recorded: the install page names only pip. The PyPI page also lists a Discord link, recorded as discord.
