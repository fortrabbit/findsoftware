notes: >
  Reviewer decision: the README opens with "Maintainer wanted!" and says the author has not used Hexo in several years and wants volunteers; that is no end signal, and the status stays accepted. Whether that statement is "unmaintained" under criterion 4 is for the reviewer to decide; if it is, the status becomes discontinued. The candidate row's homepage is http://jaredforsyth.com/hexo-admin/; the https address serves the same page, so the https address is recorded, and the GitHub Pages address jaredly.github.io/hexo-admin redirects to it. The repository has no GitHub releases and no LICENSE file; the license is the ISC license that the npm package states, so the repository's license is not detected by GitHub. The npm history starts with version 0.0.0 from 2013-08-25 on the same repository URL, so firstRelease is 2013 from the registry. The registry's stable version 2.3.0 (2017-11-10) sets currentMajor 2 because there is no GitHub release. The plugin's README says versions 1.x and later support Hexo v3 and version 0.3.0 is for Hexo 2.x; this is not recorded as a fact. The Ghost and svbtle references are design inspiration named in the README, so they are not recorded as basedOn. The README describes password protection with a hash and secret in the Hexo configuration; no field exists for it and it is not recorded. The plugin's own pages name no runtime; the runtime fact comes from the Hexo homepage, since the plugin loads inside Hexo and installs with npm. The contributor count reads the rel="last" page of the contributors endpoint with per_page=1.
