notes: >
  The npm name "compodoc" is deprecated with the notice "Compodoc has moved to @compodoc/compodoc" (version 0.0.41, the last version of the old name). That is a move, so the status stays accepted and npmName is the new package. The old package's download figure (974 in the week to 2026-10-18) is not recorded. The homepage names Angular, Nest and Stencil in its headline; only the Angular guides describe the tool's scope, so no framework field is set. The hosting guide names GitHub Pages as an example host and says the generated documentation can be hosted anywhere (deployTargets is not a dictionary field, so it is not recorded). The guides page link for changelog returns 301 and was not read. No social account is named on the pages read, so x is unknown. The maintainer's name comes from the guide's "open source effort from" sentence; no legal form is given on the pages read.
