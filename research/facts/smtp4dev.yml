notes: >
  No project website: the GitHub homepage field is empty and the README links only the docs folder, so no homepage is recorded. runtimeMin is 10 from the README (".NET 10") and the project file at tag 3.15.0 (net10.0, Rnwood.Smtp4dev/Rnwood.Smtp4dev.csproj); the installation page still says ".NET 8+" for the noruntime build and the global tool, which is stale and kept here only. The installation page also documents running it as a Windows service and under IIS with the application pool always running; the database folder is /smtp4dev in Docker, and the database engine is not named. The canary builds on the releases page (tags such as 3.16.0-ci20261103101_pr2136) are marked as prereleases by GitHub but are CI builds, so they are not a latestPrereleaseDate. The maintainer follows the LICENSE copyright line, which names "smtp4dev project contributors" and not a person; the GitHub owner is the user rnwood, and the winget package id names a company (RnwoodLtd), which goes here and is not recorded as the maintainer. The alternativeTo values come from the project's own comparison table ("How smtp4dev Compares") and its sources list naming the MailHog and MailDev repositories; the table also names MailCatcher and FakeSMTP without records. The docker install line names rnwood/smtp4dev, the image the docs name, and dockerPulls counts that repository. The docs warn that a Docker instance can be exposed to the public (docs/Docker-Security.md); not recorded as a field. The first GitHub release is v2.0.10 (2017-11-29), the oldest tag by commit date among the version-named tags. Coined kinds left out of fields: the Windows GUI and TUI modes, the HTML compatibility report, and the scripting features. Not record fields: protocols SMTP (https://github.com/rnwood/smtp4dev/blob/3.15.0/docs/Configuring-Clients.md). protocols IMAP, POP3 (https://github.com/rnwood/smtp4dev/blob/3.15.0/README.md).
