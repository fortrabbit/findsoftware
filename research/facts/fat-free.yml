notes: >
  The install docs name bcosca/fatfree-core, so Packagist figures come from that package; its repository is f3-factory/fatfree-core. The repository the homepage links as GitHub is bcosca/fatfree, the distribution package, so the repository and star count are that one. The readme license statement carries an alternative offered for a fee; it is recorded as its own license entry so the import derives the model. firstRelease is not recorded: Packagist lists 2014 as the first tag while the readme copyright starts in 2009. The readme and homepage give no hosting model, so runsAs is unknown. The maintainer is the F3::Factory copyright line in the readme and the homepage footer. The templating value is free text from the homepage plug-in list. Coined fields: chat (as in symfony.yml and cakephp.yml) and forum (a Google Group). Stop check: homepage and repository answer; no end signal found.
