notes: >
  Homepage https://terser.org/html-minifier-terser/ is the project's own page: a browser minifier demo with the text "HTMLMinifier is made by kangax" and a link to the GitHub source. Facts are read at tag v7.2.0 (the highest stable GitHub release, 2023-04-11, which npm latest matches); the default branch is ahead and its package.json raises engines.node to >=22.12.0, which is unreleased and not recorded. Pre-releases v7.0.0-alpha.0 to v7.0.0-beta.0 are older than the latest release and not recorded as latestPrereleaseDate. The LICENSE at v7.2.0 carries only the original copyright line "Copyright (c) 2010-2019 Juriy "kangax" Zaytsev"; the license statement is MIT as stated in package.json. Maintainer: package.json author is Daniel Ruf; npm lists evilebottnawi and sibiraj-s as maintainers; the GitHub organization terser owns the repository. The README and homepage do not name a company or legal form. The latest release is 3.5 years old on 2026-10-28; the import moves the record to stub when no release appears for four years, that is after 2027-04-11, unless a release comes first. The npm figure is the sum of the full week 2026-09-28 to 2026-10-04 (see the brief: npm returns zero for later days). dependentPackages and dependentRepos are ecosyste.ms counts for the npm package; ecosyste.ms also reports 14401 Docker dependents, not recorded because they count images rather than installs of this package. The README names Ruby, Grunt, Gulp, Koa and Express wrappers as third-party projects, recorded nowhere since they are not parents of this software.
