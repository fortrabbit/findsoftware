notes: >
  Status accepted: the repository is public and not archived, the release v3.2.0 (2026-10-24) is current, and the homepage gives the Maven and Gradle starters (criterion 2 and 3). The CSV homepage is https://springdoc.org and is recorded as such. currentMajor is 3 from v3.2.0, the highest stable GitHub release; the v2.10.0 line is the Spring Boot 3 branch and is not the current major. The newest prerelease is v3.0.0-RC1 (2025-11-02), older than the latest release, so no latestPrereleaseDate is recorded. firstRelease is 2019 from the v0.0.1 tag (commit 2019-07-13); the first GitHub release object is v1.3.1 from 2020. The maintainer is the GitHub organization springdoc, which the homepage names as a community-based project with no legal entity; the README note says it is a community project not maintained by the Spring team. The runtime and runtimeMin come from the homepage's compatibility list for Spring Boot 4, the line the current major targets; the README badge also says Java 17+. The basedOn value is taken from the README tagline that names Spring Boot as the target, not from the dependency list. The Swagger UI and Scalar pages are user interfaces for the generated description, not an admin interface, so adminUi is left out. The docs field is not recorded separately because the homepage is the documentation site. The docs site lists demos, a Maven plugin and a Gradle plugin; the plugins are part of the same project and are not recorded as installMethod values. The README links Open Collective, GitHub Sponsors and sponsor logos, which are not fields. The README names Stack Overflow questions tagged springdoc as the place to ask. The homepage has a migration guide and a differentiation section for SpringFox, which has no record, so no importsFrom or alternativeTo is recorded. The README compatibility table pairs the current line with Spring Boot 4.x and keeps Spring Boot 3.x and older on separate branches. The Gradle route is not recorded as its own installMethod: the homepage Gradle section holds a dependency line with a version and no sentence naming the route. Stars and contributors belong to the springdoc-openapi repository, a single-module repository.
