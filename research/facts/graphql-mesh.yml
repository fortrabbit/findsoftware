notes: >
  The CSV homepage is the-guild.dev/graphql/mesh and graphql-mesh.com redirects there; the product page is recorded.
  Monorepo: stars and contributors belong to ardatan/graphql-mesh, which holds many packages. The registry figures come from @graphql-mesh/compose-cli, the package the v1 getting-started page installs. The README badge names the older @graphql-mesh/cli (npm latest 0.103.4, MIT), the v0 runtime; not recorded as a fact here.
  The README names REST, OpenAPI, gRPC, SOAP, OData, Thrift, Mongoose, PostgreSQL and Neo4j among the sources Mesh wraps. The README and homepage describe Mesh as a framework and gateway. Hive Gateway is named in the docs as the server for the supergraph. The v1 docs describe Mesh Compose, which writes a supergraph file served by Hive Gateway or other gateways; Hive Gateway and Hive are separate products of the same company and are not this project's hosted offering.
  Dependent package counts for @graphql-mesh/compose-cli are not recorded: the ecosyste.ms endpoint answered zero for the package, which reads as unindexed rather than as a count.
  The parent is The Guild: the homepage says the product is "Part of the Hive ecosystem by The Guild", and the privacy notice names the legal entity Guilda Ltd. Its postal address is in Israel; hqCountry is not recorded because the recorded maintainer is an individual named in the LICENSE line.
  The LICENSE copyright line names Uri Goldshtein (2020); the GitHub owner ardatan is a user account, and no page names a different maintainer.
  The Discord, X and YouTube links are The Guild's accounts, linked from the project's homepage footer and README badge; they are recorded as the project's links. LinkedIn is not recorded.
  The README names MongoDB, MySQL and PostgreSQL among the sources Mesh wraps; they are sources it reads, not stores it keeps content in, so no databases fact is recorded.
  The runtimeMin is the npm engines field of the latest version; the v1 docs state Node.js as a prerequisite without a version.
