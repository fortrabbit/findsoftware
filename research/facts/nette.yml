notes: >
  The candidate row names nette/application as the repository. The install page names the nette/web-project skeleton, so the registry figures come from nette/application, the core package the skeleton requires; both repositories are recorded with their stars. The GitHub organization is named Nette Foundation; the site and the license name David Grudl as the copyright holder, and that name is recorded as maintainer. Minimum PHP: the requirements table gives 8.2 for the Nette 3.3 series and is recorded, because it is the project's statement for the whole series; composer.json of nette/application 3.3.0 alone requires 8.3 and is not recorded. The license is stated as a choice of three SPDX ids; GitHub reports NOASSERTION. The license page states that "Nette Framework" is a registered trademark and asks users not to use "Nette" in a project name or top-level domain name. The site's "rated 3rd most popular" claim is not recorded. eolPolicy is coined and shared with other records.
