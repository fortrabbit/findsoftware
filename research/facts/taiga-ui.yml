notes: >
  The homepage is a script-rendered shell; the raw HTML carries the title line and the links read, and it was read for the quoted line. The getting-started URL answers 301 to the URL with a trailing slash, which is the URL cited. The install docs show "npm i taiga-ui" under the Nx tab (paired with "nx g taiga-ui:ng-add"), with "ng add taiga-ui" under the Angular tab, and name the npm package taiga-ui, an ng-add wrapper with 765 downloads in the week 2026-10-19 to 2026-10-25; npmName is the monorepo's base package @taiga-ui/cdk, named by the README badge, with 20878 downloads that week. The core package @taiga-ui/core had 20857 that week. Maintainer: the LICENSE copyright line reads "Copyright 2026 Pineopticone" with no legal form or country, the pineoptic.one footer reads the same name, and the licensing page calls it "our company"; the legal form and country come from the pineoptic.one about page. The README table marks the 4.x line as long-term support with an end date, which is not an end signal; the current major is 5. The licensing page says the code is free for commercial use and lists enterprise support and consulting as paid services. The discord link is the #taiga-ui channel in the official Angular Discord. The README says the packages are fully tree-shakable through secondary entry points. Paid items are Taiga Premium, a Figma license and enterprise support, sold beside the Apache 2.0 code; Taiga Premium covers design-kit licenses and support, not a paid edition of the software, so paidEdition is not recorded; the pricingPage is kept and prices are not recorded. The GitHub release list starts at 2022 while the first npm upload is 2020-09-26, so firstRelease uses the npm upload. Contributors are counted from the contributors API across all pages, with per_page=1 read from the Link header.
