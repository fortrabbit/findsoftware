notes: >
  Discontinued because the GitHub repository that the project's support page names as its source is archived. The support page at https://bolt80.com/piecrust/en/latest/support/ names BitBucket and GitHub; the BitBucket repository answers 404 and the GitHub repository's last commit is dated 2022-12-31. The homepage is recorded as https, which answers 200; the http address redirects there. The homepage calls PieCrust a static website generator and flat-file CMS, so both categories are recorded. The homepage and getting-started page give pip install piecrust --pre; the registry's newest release is 3.3.0, dated 2019-10-04. firstRelease is the year of the oldest PyPI upload with a date (2.0.0-alpha1, 2014-08-30). The pypistats figure is the last month for the lowercase name piecrust. The homepage says there are no administrative panels, while the docs describe an optional administration panel (FoodTruck) started with chef serve --admin; both are recorded as the pages state them, and adminUi follows the docs. The deploying page says PieCrust can run as a dynamic CMS behind a WSGI server (Werkzeug with Apache, Gunicorn with Nginx). The Twitter link on the support page is the maintainer's account. The support page names BitBucket as a second repository. The runtimeMin is the minimum the getting-started page gives for the user's installation.
