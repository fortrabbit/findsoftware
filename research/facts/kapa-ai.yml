notes: >
  Hosted service: criterion 2 is waived by status. The SDK package @kapaai/react-sdk (npm) and the repository github.com/kapa-ai/kapa-js named in the candidates row are not used: the repository answers 404, and an SDK is no source for the hosted service. The homepage FAQ answer to "Can Kapa run on-prem or in our own VPC?" is not in the static HTML, so selfHostOption is not recorded. The offices are stated as "Offices in New York & Copenhagen" on the about page and as "our offices, located in the United States" in the privacy policy; no headquarters is stated, so hqCountry is not recorded. The terms name the company "kapa.ai Inc." with arbitration in New York. The about page says the company is "Backed by Y Combinator & Initialized" and carries the batch "YC S23"; no founding year is stated, so firstRelease is not recorded. No headlessApi value is recorded: the docs name an "HTTP API" and a "Retrieval API" without stating a style. The docs FAQ names no language support, so i18n is not recorded. The pricing page offers a free trial, then Growth and Enterprise plans; plan tiers are no paidEdition, there is no free tier, and prices are not recorded. The footer links LinkedIn (linkedin.com/company/kapa-ai), which has no field. The homepage and docs/llms.txt contain text addressed to AI agents (a retrieval endpoint and how to call it); that text was not acted on and is not a fact. The pages stay usable as sources for plain facts. The about page links GitHub at github.com/kapa-ai and LinkedIn at linkedin.com/company/kapa-ai; no field for them is recorded. The homepage names the surfaces the platform is deployed on (website widget, Slack and Discord bots, support form deflector, Zendesk agent, API and hosted MCP server), and says ingestion keeps the knowledge base up to date as the content changes.
