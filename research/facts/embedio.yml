notes: >
  Status discontinued: the GitHub repository unosquare/embedio, which the homepage and README name as the project, is archived (api archived true, last push 2026-03-09). The README still documents EmbedIO v3.x and names the v2.X branch for older users. The homepage answers over http only through a redirect to the https address recorded above. The GitHub API reports the license as NOASSERTION; the README says MIT-licensed and the LICENSE file is the MIT license, so the record uses MIT. The first GitHub release is v1.0.3 (2015-04-29), which sets firstRelease; the repository was created in 2014. The newest GitHub release is v3.5.2 (2022-11-05), the same version as the NuGet package. The NuGet figure is the total download count the search API reports. The maintainer is the copyright holder named in the LICENSE; no individual is recorded.
