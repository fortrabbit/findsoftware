notes: >
  Renamed company: Timescale, Inc. does business as Tiger Data (terms and privacy pages). The product name did not change: the rename post says "Our open source time-series PostgreSQL extension remains TimescaleDB", so the record keeps the name and the homepage is the Tiger Data site, which lists TimescaleDB under Open source; timescale.com redirects there. Two editions: the Apache 2 Edition (Apache-2.0 outside the tsl directory) and the Community Edition under the Timescale License (tsl directory). The Community Edition is the default and carries features the Apache edition lacks (editions page); it is recorded as a license, and the paid Enterprise product is the paidEdition. A reviewer may decide the TSL edition is also a paidEdition; the terms (section 2.2) forbid offering it as a database-as-a-service. GitHub reports the license as NOASSERTION; the NOTICE names Apache-2.0 and the Timescale License. runsAs is absent: no page states a process model for the extension itself, which loads into the PostgreSQL server. The privacy page names an EU representative in Cork, Ireland; that is not a headquarters statement, so it is not used for hqCountry; the terms of service give the New York address of Timescale, Inc., dba Tiger Data, which is the source of hqCountry. Community chat is a Slack workspace (README: timescaledb.slack.com; community page: slack.timescale.com); the fact schema has no Slack field, so it is not recorded. The Enterprise page names HA, failover and enterprise support as Enterprise features; no prices are recorded. The oldest GitHub release is 0.0.10-beta (2017-05-23); the repository was created in 2017-03. The install page calls the Docker HA image the most complete route. The one-line script in the README is for local development and testing only, per the README. The build script (CMakeLists.txt) says "TimescaleDB only supports PostgreSQL 15, 16, 17 and 18", the supported PostgreSQL range. Fields coined here: none.
