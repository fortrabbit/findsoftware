notes: >
  The default branch is stable, and the highest stable GitHub release is v1.1.0 (2023-05-01), matching the PyPI package jamstack 1.1.0; the repository also carries the tag v0.1.0 without a release object, and firstRelease is the oldest PyPI upload, 0.0.1 in 2021, which predates the first GitHub release (v1.0.0, 2022). The README says the project works hand in hand with the Flask library and renders templates with the Jinja engine; no page states that it is built on Flask, so basedOn is not recorded and Jinja is recorded as templating. pypiDownloads is the last_month figure from pypistats. The README's TODO list says Flask is to stop being a main requirement; it is not recorded as a fact. The homepage shows a version label of 1.1.0, which is a dot release and is not recorded. The README names the html5up templates Massively and Phantom, which are not recorded as a field. The maintainer is the GitHub organization Jamstackpy, since no page names a legal entity.
