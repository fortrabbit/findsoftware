notes: >
  Monorepo: the record names @stackoverflow/stacks, the package the README badge and the usage guide name; the Svelte implementation @stackoverflow/stacks-svelte is a sibling package with its own GitHub releases (latest 1.0.4, 2026-09-28) and is not recorded as a separate figure here. The highest stable GitHub release of the package is @stackoverflow/stacks@3.0.0 (2026-08-24); the npm latest is 3.0.2, published 2026-10-16, and is newer, so latestReleaseDate uses it. The 3.0.0-beta releases are older than the latest stable and are not recorded as latestPrereleaseDate. The earliest npm version is 0.1.0 (2017-12-19), the source of firstRelease; the oldest GitHub release is v0.17.0 (2018-06-26). The license is stated two ways: the LICENSE file reads "The MIT License (MIT)" with copyright 2017-2024 Stack Exchange Inc., and the README reads "released under the MIT License" with copyright 2017-2026 Stack Exchange, Inc.; both are MIT, so the license is recorded once, from the LICENSE file. The hqCountry comes from the legal-notice address in the public terms of service; the terms name Stack Exchange, Inc. as a Delaware corporation. The usage guide says the unpkg CDN build "should not be considered production-ready", recorded only in prose. The docs site also names a v2 classic documentation site, which is not recorded. No social, forum or discord link appears on the project's pages.
