unreadable: [https://github.com/primefaces/primeng-nextchapter]
notes: >
  Doubt: the default branch README of primefaces/primeng says the repository "is no longer under active development and receives security fixes only" and that PrimeNG continues as part of PrimeUI, and the current npm major names primefaces/primeng-nextchapter as its repository, which answers 404 to the GitHub API and to the web. It would be settled by a public source repository for the current line, or by Frank's call on following the PrimeUI product (record keeps status stub until then). The current line is a compiled package under the PrimeUI License; the installation page says "Provide your PrimeUI license key." and primeui.dev/licenses/community names the MIT-licensed versions as PrimeNG 21, PrimeVue 4, PrimeReact 10 and earlier. The MIT license of the 21.x line is an older license: "The MIT License (MIT)" under PRIMENG COMMUNITY VERSIONS LICENSE in the repository's LICENSE.md, copyright 2016-2026 PrimeTek; it is recorded as its own entry. The installation page names the npm package primeng, so the registry figures are that package's and no legacy package figure exists. The CSV homepage primeng.org answers 301 to https://primeng.dev/, which is recorded. The npm dist-tag rc is 22.1.0-rc.2, older than the latest release, so no latestPrereleaseDate. The GitHub release list tops out at 21.1.10 (2026-09-09), so the registry major 22 is used as currentMajor, per the registry rule for a higher registry major. The maintainer's legal form and country are not stated on the pages read, so hqCountry is absent.
