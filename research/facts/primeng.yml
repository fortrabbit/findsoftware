notes: >
  Moved into PrimeUI in 2026 (Frank's decision 2026-10-28, the record follows the product). The public repository primefaces/primeng receives security fixes only; its README says it "is no longer under active development and receives security fixes only" and that PrimeNG continues as part of PrimeUI. The current line ships compiled under the PrimeUI License: the installation page says "Provide your PrimeUI license key." and the npm package's LICENSE.md describes a free Community License for eligible individuals and organizations and a paid Commercial License per developer. No repository is recorded: the npm package primeng 22.1.4 names primefaces/primeng-nextchapter, which answers 404, and the public primefaces/primeng repository holds the older line. Both repositories are listed here; neither supplies stars or contributors for the current line, so none are recorded (the old repository showed 12485 stars and 365 contributors on 2026-10-28). The older line, PrimeNG 21 and earlier, is MIT-licensed ("The MIT License (MIT)" under PRIMENG COMMUNITY VERSIONS LICENSE in that repository's LICENSE.md, copyright 2016-2026 PrimeTek); license facts describe the latest release, so it is not recorded as a license. primeui.dev/licenses/community names the MIT-licensed versions as PrimeNG 21, PrimeVue 4, PrimeReact 10 and earlier. The installation page names the npm package primeng, so the registry figures are that package's. The CSV homepage primeng.org answers 301 to https://primeng.dev/, which is recorded. The npm dist-tag rc is 22.1.0-rc.2, older than the latest release, so no latestPrereleaseDate. The GitHub release list of the old repository tops out at 21.1.10 (2026-09-09), so the registry major 22 is used as currentMajor. The maintainer's legal form and country are not stated on the pages read, so hqCountry is absent.
