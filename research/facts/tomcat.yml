notes: >
  The homepage, the docs README and the NOTICE name the Apache Software Foundation as the maintainer; the foundation's own address was not read, so hqCountry is absent. The homepage says "released under the Apache License version 2", the same license as the LICENSE and the API value, so it is one entry. firstRelease is absent: the heritage page says the code was donated to the Apache Software Foundation in 1999 and "the first Apache Tomcat release was version 3.0" without a date, and the oldest tag in the repository is 7.0.0-RC1 (2010 commit); the reviewer decides whether 1999 may stand. The current major is 11 (11.0.27 is the highest stable tag); the 10.1 and 9.0 lines are supported too, per the homepage and endoflife.date. The homepage gives 11.0.27 a release date of 2026-10-12; endoflife.date gives 2026-10-06 for the 11.0 line, and the homepage announcement is the value recorded. The docs name the Maven Central repository without an artifact id, so no mavenCoordinates is recorded. The Docker image of the same name is not named by any install page, so no dockerPulls is recorded. The Java minimum is 17 for the 11.0 line per the setup page; endoflife.date lists minJavaVersion 17 for 11.0. The homepage links a YouTube channel under Media; no X, Mastodon or forum field is recorded, and the user support route is the tomcat-users mailing list. Fields coined here: none.
