notes: >
  Homepage http://browserify.org/ redirects to https://browserify.org/, which is recorded. The homepage offers "Get Professional Support for Browserify", a support offer without an edition, so no paidEdition. The homepage links twitter.com/browserify over http; the x value is the https form of that account link. The IRC channel on freenode named on the homepage is not recorded as a forum because the page gives no current channel status. The README badge gives the discord link; no quote. Browserify has no releases after v17.0.1 (2024-10-03) and the repository was pushed 2026-10-24, so no end signal. The npm package browserify is the project itself (first upload 0.0.1 on 2011-02-03, before the repository's first GitHub release), so firstRelease comes from npm. The npm weekly figure is the sum of daily counts for 2026-09-28 to 2026-10-04, because the last-week endpoint can read a stale window. The maintainer is the copyright holder in LICENSE and the author in package.json (James Halliday); the repository is owned by the browserify organization.
