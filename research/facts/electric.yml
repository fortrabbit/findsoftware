notes: >
  Accepted with no stable release: every GitHub tag and Clojars version is an alpha, snapshot or 2022 date tag, so currentMajor and latestReleaseDate are absent and the newest alpha is latestPrereleaseDate. The CSV says only alpha tags and was read as a question about stability, not as a failed criterion: the README gives the dependency line and the starter app gives run and deployment steps, and the repository has been pushed in 2026. The homepage electric.hyperfiddle.net answers 200 over https with a JavaScript-rendered page (a tutorial app) and is recorded as homepage, cited from the starter app README that links it as the tutorial; facts are cited from readable pages. The GitHub API reports no license; the license statements are the Clojars entry (Hyperfiddle Business Source License) and the README (free for bootstrappers and non-commercial use), recorded as separate entries. The founder's license announcement, linked from the README, is dated 2024 Oct 20 and states that commercial use is paid; no price is recorded. The Clojars downloads figure is the all-time total of the artifact, and the Clojars API lists the artifact as latest_release v3-alpha-ca05cbc93, which is not a GitHub tag. The 2022 tag v20220722 is the earliest GitHub tag and is the firstRelease year; the repository was created in 2020. The Google doc Mission, Position, Business, Community (export text) states that the project is not for server-side rendering and assumes a persistent server connection; the homepage's tutorial and the starter app's README are cited only where quoted. The prose facts about the compiler inferring the frontend and backend boundary are from the README and the Clojars description. Prose sources: the README describes Electric as full-stack differential dataflow for UI, and says the compiler infers the frontend and backend boundary from the code. The Google doc states that Electric is not built for server-side rendering and that the project assumes a persistent server connection. The starter app README shows a Docker image and a Fly deployment, and a single JVM shared by the REPL and shadow-cljs in development. Prose sources for the compiler: the README says the Electric compiler macros infer at compile time the implied frontend and backend boundary from the code and generate the corresponding full-stack app, and that client and server expressions compose directly in the same function; the Clojars description says the same. The starter app README gives the development command clj -A:dev -X dev/-main and the production steps: an uberjar run with java -cp, a Docker image run on port 8080, and a Fly deploy. The license announcement says commercial use is licensed separately under a source available business license, and the README points to it. The README also says the compiler turns the program into separate reactive client and server target programs that cooperate.
