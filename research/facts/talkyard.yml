notes: >
  In doubt, so stub. The homepage leads with a forum: its heading is "Coworker Discussion Forum" and its nav has Blog comments as one of four entries; the README opens with "Forum software, with chat, and anonymous comments." By the stub rule for a forum lead, the record is held back: a reviewer decides whether a forum-led tool is in the register, and whether the embedded blog comments (https://blog-comments.talkyard.io, the README's "Blog comments") are the reason it belongs here. The README's "Self-Hosting" section points to talkyard-prod-one, which was read: Docker-based installation on Debian or Ubuntu, with the "Multi-site support." line recorded as multisite. The release tags use "tyse-v<n>.<year>.<seq>-regular" names with a dev suffix for development builds, so no currentMajor is recorded; the newest regular tag is tyse-v1.2026.003 (2026-05-26). The GitHub repository has 354 tags, the earliest calendar-named tag v0.2020.22 dates from 2020; the repository itself dates from 2013. The LICENSE file is the FSF AGPL text with no project copyright line, so the maintainer comes from the copyright line on the project's about page. The about page says Debiki provides hosting and maintains the website, and that the founder is Magnus Lindberg; no legal form and no headquarters are stated, so hqCountry is left out. Hosted plans on the pricing page list OpenID (OIDC), Read API, Webhooks, Write API (contact us to enable), and the Standard, Business and Enterprise tiers; these are hosted-plan features, so no sso, API or paidEdition field is recorded for the self-hosted record. The compare page /compare/discourse calls Talkyard "a Discourse alternative" in its title only, and no research/facts record has the id discourse, so alternativeTo is not recorded. The homepage also says "A bit similar to Stack Overflow, Slack, Discourse, Reddit" and the README has a compare link to business.talkyard.io, which is not read. The database is not recorded: the repository lists modules for an RDB store, and the install page names no database.
