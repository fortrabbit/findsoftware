notes: >
  Status accepted: GPL-3.0 on GitHub, an install script on Debian and Ubuntu, and a current release (2026-09-14). The README says "is licensed under GPL v3 ... and is based on the [VestaCP](https://vestacp.com/) project". VestaCP has no record in research/facts, so the parent is named here and not recorded as basedOn; the CSV note "fork of VestaCP" is the same statement. The README also restricts use of the names "Hestia Control Panel", "HestiaCP" and the logo: no selling or redistribution under those names, no alteration of the name or logo. These are trademark terms beside the GPL-3.0 license, not a second license, so licenseModel stays open-source; a reviewer should confirm. runsAs is absent: the configuration page's FAQ restarts the "hestia" unit with "systemctl restart hestia", which is a command and no statement that the panel runs as a service or daemon, and no page uses those words. The docs and the install page name a backend port (default 8083) but do not say what runs on it. The panel's web interface is PHP (the repository's web folder, PHP 1.25 MB of about 4.2 MB of code by GitHub's byte count, and the hestia-php package the docs mention), but no page states the panel's runtime, so runtime is absent. The GitHub primary language is Shell. The team page names a project founder (Raphael Schneeberger) and no legal entity; the copyright line names Hestia Control Panel, so the maintainer is recorded as that name. No imprint or legal notice was found (hestiacp.com/imprint and /privacy return 404), so hqCountry is absent. The changelog is in the release branch; its oldest entry is 0.9.8-28 dated 2019-05-16, earlier than the oldest GitHub release 1.0.3 (2019-07-09), so firstRelease follows the changelog. The docs site docs.hestiacp.com redirects to hestiacp.com/docs. The X and Facebook links are icon links in the site navigation (aria-label twitter and facebook) and carry no quote. The homepage's Donate page and the README's PayPal and crypto addresses are not a paid tier.
