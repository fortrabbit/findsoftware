notes: >
  The homepage answers over https (200) and its http address follows to https, so the https address is recorded. The repository has no GitHub release objects after v0.11.0 (2020-01-17); the tag v0.12.0 and the npm 0.12.0 upload (2020-10-16) are the newest stable version, so latestReleaseDate is 2020-10-16 from npm. The oldest tag is v0.3.9, with a commit dated 2013-09-15, so firstRelease is 2013. The major is 0 for every stable version. The last commit on the default branch is dated 2023-10-25 and the repository is not archived; the README and the site state no end, deprecation or unmaintained status. Under criterion 4 the import moves a record with no release in four years to stub, and this record's last release is 2020, so the import will mark it stub until a release appears; the status stays accepted here. The README gives npm and unpkg.com as the routes, and the site sentence "Or install via npm/yarn" names yarn. No sentence on the site or README states where the widget runs, so runsAs is not recorded. The x link in the site header is the author's personal account (WickyNilliams). The site says Headroom.js has a pure JS API plus an optional jQuery plugin and AngularJS directive. The README calls it a widget with no dependencies, and no runtime is stated, so no runtime or runtimeMin is recorded. The site and README say the header is shown as a live example on the author's site; that is not a field. The LICENSE copyright line names Nick Williams for 2013, and npm lists the maintainers as wickynilliams and iduuck; the GitHub owner is the user WickyNilliams. The category scroll from the candidates row has no entry in the import map, so the record takes ui-library from the README sentence. The npm weekly figure is the sum of daily downloads for 2026-11-01 to 2026-11-07. The README quick start creates a Headroom instance for a header element, calls init, and adds CSS classes for the pinned and unpinned states; the site documents the same classes and methods such as freeze and unfreeze.
