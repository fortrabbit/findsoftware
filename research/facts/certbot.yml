notes: >
  runsAs is scheduled: the renewal runs from the system crontab or a systemd timer, outside the request path. The maintainer is the Electronic Frontier Foundation, a US nonprofit; maintainerType foundation is the closest of the four values. hqCountry is not stated by the pages read: the EFF page gives only the 501(c)(3) status. PyPI reports license as null, so the license comes from LICENSE.txt in the repository; the GitHub API reports NOASSERTION. The Certbot page lists snap as recommended, pip as an alternative, and Docker with the caveat that most users should use the instructions on certbot.eff.org. endoflife.date has no Certbot product (404 on api/certbot.json), so endoflifeId is absent. PyPI reports requires_python >=3.10. No project-ended signal was found. firstRelease was not checked; the repository was created in 2014-11.
