notes: >
  The record covers the project and the DocuSeal Cloud service that the same code runs; the cloud offering is recorded as hostedOffering. The GitHub repository is the source of the license, stars, releases and runtime. The license file LICENSE is AGPL-3.0 (GitHub API); LICENSE_ADDITIONAL_TERMS adds a Section 7(b) attribution requirement, recorded as its own entry. The on-premises pricing lists an open source edition at no cost and a Pro edition sold per user; the prices are not recorded. The pricing page's Pro features (white-label, user roles and teams, SSO, bulk send, API and embedding) are on the paid plan, and the open source edition lists user management, multiple signers and its own SMTP. The homepage's "#1 Open Source Alternative" line is a claim the page makes about itself and is not recorded. The on-premises page says the open source self-host is free forever without limitations. The licenseModel open-core rests on the pricing page's "Everything from OSS" wording; whether Pro code sits in this repository is not stated, so the reviewer should confirm it. The contact and footer address, 332 S Michigan Ave, Chicago IL, is for DocuSeal LLC and gives the US hqCountry. The terms of service say DocuSeal, LLC is governed by Delaware law. The privacy policy names DocuSeal, LLC, and the EU representative is Euverify Ltd. The runtime is Ruby; the Dockerfile uses a Ruby 4.0.9 Alpine base image at the 3.3.5 tag, and the runtimeMin uses the Gemfile line. The Docker Hub pull count is for docuseal/docuseal, the image the README names. The docs state that the Docker image stores data in an SQLite database by default. The docs and README do not state whether the process runs as a daemon or server, so runsAs is absent. The API and webhooks are documented at docuseal.com/docs/api; the embedded signing form and form builder are documented at docuseal.com/docs/embedded, with React, Vue, Angular and JavaScript packages in GitHub repositories the record does not cite. The homepage and pricing page claim SOC 2 certification and an EU cloud; SOC 2 is recorded in notes only, as no field holds compliance claims.
