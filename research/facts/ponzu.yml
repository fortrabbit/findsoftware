notes: >
  The README opens with a warning badge that reads "Project Status: Abandoned" and says the project is abandoned and points to Caddy Server for an HTTP server with TLS; that is the project's own statement, so status is discontinued. The same README asks for maintainers ("Maintainers-Wanted"). No successor is recorded: the README names Caddy only as an alternative for HTTP serving, which is not a successor relation. Last push on the default branch 2025-11-17; the last release v0.11.0 dates from 2019-09-30 and the repository has no release after it. The README calls the project an HTTP server framework and CMS, and describes the generated content editors and the built-in BoltDB store; these are recorded as stated. The docs site is readable; its Docker, SysV and quickstart pages show the server started with ponzu run, and its home page links a Slack channel, which has no field. Contributors counted from the Link header of the contributors endpoint with per_page=1 (last page 30).
