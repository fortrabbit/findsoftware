notes: >
  Status accepted: the repository is not archived and its latest stable release, 1.0.4 (2026-10-25), is recent. The boundary question in candidates-server-infra.csv is settled per notes-server-infra.md: object storage servers are server software. The Apache 2.0 license is stated in the README, the LICENSE link and the homepage. The maintainer is recorded as the homepage copyright names it; no page gives a legal entity name or legal form, and the contact address is the only location statement. The address is the one the about and contact pages give, with no country named; hqCountry US follows from the full street address and state. The homepage's "Docker Pulls 7,166,727" and the about page's "as of August 1, 2026" figure are older than the Docker Hub API count recorded here; the homepage figure is not recorded. The homepage deployment figure is recorded as reportedInstalls with its label as the project states it. firstRelease 2025 follows the project's own timeline ("2025.07.02 Open-sourced RustFS was released"); the oldest GitHub release is 1.0.0-alpha.1 (2025-07-02), a prerelease. The project's first public commit is dated 2024.06.23 on the about page, but a commit is not a release. The MinIO link is a migration path named on the homepage ("MinIO to RustFS migration"); the RustFS README says its topology rules "follow MinIO", and the homepage states RustFS is "not affiliated with, endorsed by, or sponsored by MinIO, Inc.", so no basedOn or forkOf is recorded. The README also states S3, Swift and Keystone APIs, FTPS, WebDAV and SFTP support; no field holds them. The about page says RustFS "is not identical to every AWS S3 or MinIO API" and advises configuring the endpoint and validating the operations an application depends on. The pricing page says optional paid support is available and that prices and SLAs are not published; that is support, not an edition, so paidEdition is absent. The CSV's note "gh 35.1k stars" is superseded by the API count. Fields coined: none.
