notes: >
  The CSV homepage http://j4mie.github.com/idiormandparis/ does not connect; the same site answers over https at j4mie.github.io/idiormandparis/, which the README links and is recorded as the homepage. The README opens with a maintenance-only section: the project is feature complete as of 1.5.0, still gets bug fixes and security patches, and the README recommends Eloquent from Laravel for new projects and says it may be forked. It states that it will not accept new features or breaking API changes. The project does not state that it has ended, so there is no end signal and the status stays accepted. The latest GitHub release is v1.5.8 (2022-07-18), more than four years before this check, so the import's listing rule for criterion 4 applies on its own; the default branch was last pushed 2024-03-14. The repository has no LICENSE file and GitHub reports no license; the license entries come from composer.json at the v1.5.8 tag (three BSD clauses) and the README's BSD sentence. Maintainers differ by source: the homepage says it is currently maintained by Simon Holywell and that Jamie Matthews created it; composer.json lists Jamie Matthews as developer and Simon Holywell and Durham Hale as maintainers, so the homepage statement is recorded. The README names Firebird as a supported database, but Firebird is not a databases value in the dictionary, so it appears here in the quote only. The README calls Paris an Active Record implementation built on top of Idiorm; Paris is a separate project with no candidate row and is not recorded. The homepage footer links only its creator's personal accounts (twitter, GitHub, a personal site), none a project account. The changelog for 1.4.0 mentions MS SQL TOP limit support for the sqlsrv, dblib and mssql PDO drivers, but the README's database sentence names four databases, so only those are recorded. Eloquent is named as an alternative to recommend, not as an alternative statement, so it is in notes only.
