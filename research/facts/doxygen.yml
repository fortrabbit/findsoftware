notes: >
  The CSV homepage https://www.doxygen.org answers 301 to plain http://www.doxygen.nl/, so the https address of the same site is recorded. The project's own pages name the output formats HTML, LaTeX (PDF), RTF, XML, man pages and DocBook, and the input languages C, C++, Python, PHP and others; these stay in the description and are not a field. The installation page names Graphviz, TeX and Qt as optional tools, not a runtime. The oldest tag is Release_1_0_0 (commit dated 2000-02-08); the oldest published GitHub release object is Release_1_9_0 (2022-12-24), so firstRelease follows the tag. The copyright line on the license page starts in 1997. The project's mailing lists are hosted on SourceForge and are not recorded as a forum. The homepage's Follow link is the project's X account, recorded as x.
