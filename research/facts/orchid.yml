notes: >
  The package is a Laravel package and has no PHP requirement of its own: composer.json at tag 14.53.0 requires laravel/framework from ^10.0 through ^13.0 and states no php constraint, so runtimeMin is not recorded. The installation page's example creates a Laravel project with version 13. The installation page says the package overwrites the app/Models/User model during orchid:install. The LICENSE copyright line names one person and the homepage names no company, so maintainerType is individual from that line; the repository owner is an organization account. The CSV row said the scope was widened from a boundary on 2026-10-19; the fact file applies the criteria as the widened scope states. The readme credits the Hotwire project for page transitions; that is not recorded as a field. The packagist p2 feed lists no stable release after 14.53.0, and the 2026-03-21 date is the latest GitHub release. The homepage links an Open Collective donation page; no adoption figure is taken from it.
  The readme says the package lets developers focus on PHP without writing HTML, CSS or JavaScript; the installation guide says a database is needed, that the app runs under a web server or the built-in development server, that the default admin path is /admin, and that a separate artisan command creates the first admin user.
