notes: >
  The project names no website; the README and composer.json link only the repository, so homepage stays unknown. The install line names lizhichao/one-app, a skeleton; lizhichao/one is the core package it depends on, so the registry figures come from lizhichao/one. The GitHub account name is vic and the Composer authors list tanszhe; the composer.json name is recorded as maintainer. No GitHub release exists (the releases endpoint is empty), so latestReleaseDate is the date of version 3.0.9 on Packagist. The README is in English with a Chinese companion (README-CN.md) that is not read. The README states "session can be used under http, websocket or even tcp, udp and cli"; no field holds that, so it stays here. The always-on fact rests on the composer.json suggest line for ext-swoole ("extension required for resident-memory operation"). The README calls the framework minimalist and fast; those claims are not recorded. clickHouse is named as a supported database but the dictionary has no such value.
