notes: >
  The package named by the install docs is create-rwsdk, a scaffolder; the core package rwsdk is recorded, and create-rwsdk had 76 downloads in the same week. The rwsdk.com footer reads "Copyright © 2026 RedwoodJS Inc. All rights reserved." and the README badge reads "MADE BY Redwood Inc."; the license file gives "RedwoodJS Inc", which is recorded. The README says the framework is "For Cloudflare (workerd) only", and the docs say RedwoodSDK "is built for the Cloudflare Development Platform"; the deploy command runs on Cloudflare. The quick start lists "Node.js" under system requirements without a version, so runtimeMin is not recorded (the create-rwsdk scaffolder declares node >=22 in its engines, which is not the framework's own requirement). The hosting page (docs.rwsdk.com/core/hosting) says "Compute (Workers) for serverless functions" and "You do not need to use Cloudflare's Developer Platform, you can use any bare-metal hosting provider you want", while the README says "For Cloudflare (workerd) only"; the two statements differ in scope, so runsAs is not recorded and runtime keeps the README's workerd. The databases fact is the experimental built-in database; the docs also integrate Cloudflare D1 through Drizzle, which is not recorded as a database engine. The README's "Big News" section announces RedwoodSDK as a launch of its own; no successor relation is recorded here, and the RedwoodJS candidate's notes cover the relation between the two. Field kinds coined here: none.
