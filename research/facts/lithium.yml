notes: >
  The CSV release (1.3.1, 2025-08) is stale: Packagist's latest stable is v2.0.2 dated 2025-08-15, and the GitHub latest release is v2.0.0 (2022-12-08). The default branch 1.3 declares php ~7.4 in composer.json; the v2.0.2 release requires ~8.1, which is recorded. The li3.me manual is for 1.x; its installation chapter path returns 404, so the install method comes from the framework distribution README. The distribution unionofrad/framework is the installed package; the registry figures are from unionofrad/lithium, the core package it contains. The maintainer is the copyright holder the li3.me footer names, with no legal form; the LICENSE.txt agrees. The runsAs quote comes from a 1.x manual page.
