notes: >
  The last GitHub release is v0.5.9 (2020-07-02); npm latest is the same version, and the default branch was last pushed on 2024-04-11 with no end statement on the homepage or the README. Release age is past four years, so the import will move this record to stub on its own; status is accepted as the CSV row has it, and the reviewer decides whether to keep it listed. The README calls the project a side project and gives Patreon and PayPal donation links; donations are not recorded as a sponsor or paid tier. The homepage says browser support is IE 10+ and Chrome, Edge, Firefox, Safari and Opera (last 4); the install pages do not state a runtime, so none is recorded. Spectre uses Autoprefixer and Normalize.css at build time; these are dependencies, not basedOn. Sass and SCSS compilation is an optional path documented on the custom version page. The first GitHub release is v0.1.19 (2016-05-05) and the first npm version is 0.1.1 (2016-04-08); firstRelease uses the npm date. The Twitter link is the project's own account named on the homepage.
