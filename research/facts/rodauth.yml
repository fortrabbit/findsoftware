notes: >
  The CSV homepage is http://rodauth.jeremyevans.net; the https address answers 200 and is recorded. The README's first sentence is "Rodauth is Ruby's most advanced authentication framework, designed to work in any rack application. It's built using Roda and Sequel", so the Sequel half of the built-on statement has no record and stays here; the database library is not a fact field. The gemspec lists sequel and roda as runtime dependencies, which is a dependency statement and not the basedOn source; the basedOn quote is the README's "Rodauth is a Roda plugin". The Ruby minimum is 1.9.2 in both the README and the gemspec; the runtimeMin value keeps the major.minor form used for Ruby, so it reads 1.9. The only gem command in the README, "gem install --development rodauth", installs development dependencies for running tests and no page states an install route; installMethod gem rests on the gem being published on RubyGems, which counts as a documented route under the ruling for this record. The README's "Similar Projects" section names Devise, Authlogic and Sorcery as Rails-specific; the Why page calls them "other authentication frameworks" and says Rodauth "offers many advantages over competing frameworks". Only Devise has a record, so alternativeTo keeps that one. The README describes an HTML and JSON API for the auth features; it is not a REST content API, so headlessApi stays out. The LDAP and Facebook examples in the README are custom authentication code the application writes and are not an sso feature. The documentation index lists a "Translate with I18n gem" feature and a separate rodauth-i18n gem; no sentence states i18n support, so i18n stays out. The rodauth-rails gem, written by another maintainer, is a Rails integration and has no record here. The version 2.50.0 is the highest stable tag, and the RubyGems first version 0.9.0 dates from 2015-08-12, the same day as the 0.9.0 tag commit. Stars and contributors belong to the rodauth repository. The sentence on the Why page names the rival frameworks as Rails-specific; the record keeps that comparison out of the description.
