notes: >
  A monorepo (mikro-orm/mikro-orm): the ORM core is @mikro-orm/core, and each database has its own driver package (@mikro-orm/postgresql, @mikro-orm/mysql and others) that the Quick Start installs; the registry figures are for @mikro-orm/core, the package the README names as the one to install explicitly with the extra packages. Stars and contributors belong to the monorepo. The release list holds v7.2.9 and v6.6.18 as stable lines; currentMajor is 7, the highest stable major, and the v6 line is maintained in parallel. The license is MIT in the README, the LICENSE file and the GitHub API. The README says the project is "Heavily inspired by Doctrine and Hibernate"; inspiration is not a basedOn statement, so none is recorded. The npm package named mikro-orm (unscoped) first appeared as 0.0.1 on 2018-06-04 under the same author from the B4nan/mikro-orm repository, which is the source of firstRelease; the oldest GitHub release is v3.0.0 of 2020-01-15. The README's Twitter link (@B4nan) is the maintainer's personal account; the project's own Twitter account @MikroORM comes from the docs site config (nav and footer) and is recorded as x. The site footer also links Slack and Stack Overflow; not fields. The README lists CockroachDB, PGlite, libSQL and sql.js as database variants of the listed engines; only the engine names are recorded as databases. The engine minimum in runtimeMin (major only) comes from the core package manifest at the v7.2.9 tag, not from the README. The project also publishes @mikro-orm/core to JSR from the same repository; the JSR package metadata (runtimeCompat) declares Node.js, Deno, Bun, Cloudflare Workers (workerd) and the browser, the source of the deno and bun runtime entries; the install docs name npm, yarn, pnpm and bun only, so no JSR installMethod is recorded. The docs SQLite page says the built-in node:sqlite dialect works on Node.js 22.5+ and Deno 2.2+ and has a section on Bun's built-in SQLite, and the deployment page covers Cloudflare Workers and edge runtimes.
