notes: >
  The GitHub repository has no releases, so currentMajor and latestReleaseDate come from the RubyGems stable version 4.0.1, uploaded 2026-09-15; the v4.0.1 tag matches it. The README of the default branch says the stable release "should be 4.1.0" while naming 4.0.1 as the current stable release, so the default branch describes unreleased work and the v4.0.1 README is the one cited. The RubyGems oldest upload is 0.0.0.alpha.1 dated 2010-08-27, which sets firstRelease. The homepage and the README name Rack and mounting on Rails and Sinatra as deployment contexts, but no page says the software is built on Rack (the README says it is designed to run on Rack and that Grape APIs are Rack applications), so no basedOn is recorded. The RubyGems page states the runtime dependencies and no hosting model, so runsAs is not recorded. The RubyGems download figure is the total since the gem was published. The homepage Twitter link is recorded as the x field, as an https URL; the page links http://twitter.com/grapeframework.
