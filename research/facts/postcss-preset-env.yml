notes: >
  basedOn is postcss: the README says "[PostCSS Preset Env] is a [PostCSS] plugin." The README says the pack "packs Autoprefixer within", a bundled dependency, not a parent, so no basedOn for autoprefixer. The CSV category css-processor maps to css-framework in the import; build-tool is recorded as for autoprefixer, a sibling PostCSS plugin. Language is not recorded: the GitHub repository language is CSS (the monorepo's fixtures), and the package source language is not stated on a page. The repository is a monorepo: the npm package postcss-preset-env is the one the install docs name; the repository has no GitHub releases and no tags for this package, so currentMajor, latestReleaseDate and firstRelease come from the npm registry (first upload 1.0.0 in 2017, the registry time field). The homepage preset-env.cssdb.org is the project's own site (CSS Tools). The README note says some features need a companion library that makes the feature work, because not every behavior can be polyfilled with CSS alone. The README says CSSDB exposes browser support from Can I Use or MDN, that the browserslist of a project decides which transformations are needed and skips the others, that the pack packs Autoprefixer and shares the browser list with it, and that the plugin goes in the PostCSS plugins list of a build. The npm weekly figure is the sum of the daily counts for 2026-09-28 to 2026-10-04. The CSV note says criterion 2 holds; the plugin rule in AGENTS.md (a plugin is listed only when it turns its parent into another kind of software) is the reviewer's call for a PostCSS plugin pack, as for autoprefixer.
