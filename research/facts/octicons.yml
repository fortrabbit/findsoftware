notes: >
  The repository is a monorepo: the npm figures count @primer/octicons, the core package the install docs name for JavaScript; @primer/octicons-react, the Ruby gem and the Jekyll and Rails helpers are separate packages and are not counted. The README's install routes are npm for the core package, npm for the React package (@primer/octicons-react) and a Ruby gem named octicons; installMethod records npm and gem. The README's license section gives the code license as MIT and points to the GitHub logo guidelines for the GitHub logos among the icons. The homepage and README name no social account. The GitHub release history starts in June 2014, the month the repository was created.
