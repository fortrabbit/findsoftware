notes: |
  The homepage names github.com/pages-cms/pages-cms as the source and the README names github.com/pagescms/pagescms; both names resolve to hunvreus/pagescms in the GitHub API, so that repository is recorded. The hosted app at app.pagescms.org is the project's own hosted version next to the open source code; the README says it can be used directly, and no prices are recorded. No separate pricing page was found on the homepage or docs, so pricingPage is unknown. The docs describe Postgres for app state (auth, collaborators, parsed config, cache) and GitHub for content; the README and installing guide name PostgreSQL 16 as a Docker example. The self-host guide runs the app with npm run build and npm run start, but no page names Node.js or a framework the app is built on, so runtime and basedOn are unknown. The "Permissions" feature on the homepage is marked Soon, so userRoles is unknown. The x link on the homepage points to the maintainer's personal account, not the project's, so it is not recorded. The field discord is taken from the README, which links the chat at pagescms.org/chat, a redirect to discord.gg. The first release is the earliest GitHub release 0.1.0 (2024-02-12), and the repository was created 2023-12-16.
