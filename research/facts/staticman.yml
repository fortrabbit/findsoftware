notes: >
  Accepted on criterion 1 (a comment engine for static sites, which its homepage and docs name), 2 (source and install steps), 3 (README install steps for npm, Docker and Heroku) and 5 (2,449 stars, 31 contributors). Status is accepted from the CSV row and is not changed here: the newest stable release is the v1.7.1 tag of 2020-12-23, and the newest pre-release (v3.0.0-beta.2, 2020-12-07) is older, so no latestPrereleaseDate is recorded. Under AGENTS.md the import moves a record with no release or pre-release in four years to stub, so this record will be listed as stub on import; a reviewer decides whether to keep it listed. The repository's last push is 2024-04-24. The homepage staticman.net answers with a 301 to best.staticman.net, which serves the project's own page ("Staticman: Static sites with superpowers", the homepage footer naming Eduardo Bouças); the final URL is recorded. The homepage text says "I'm free and open source" and "Kindly supported by the work of volunteers". The maintainer is the individual named in the LICENSE.md copyright line (2017) and the homepage footer; no legal form or company is named, so no hqCountry. The GitHub release v1.0.0 (2016-08-07) is the oldest release; the tag v1.0.0 commit is dated 2016-05-23 and it is the same year. The GitHub repository has a stable tag v1.7.1 and no GitHub release after v1.0.0, so latestReleaseDate is the commit date of the v1.7.1 tag. The npm package named staticman has a latest version 2.0.0 that was published 2016-08-07 under the ISC license, which conflicts with the repository's MIT license; the npm package is older than the latest release and its license is not recorded as a license field: it stays here as an older statement. The npm package is not the install route the README names (clone and npm install), so no npmName is recorded. The data itself goes to a GitHub or GitLab repository the site owner chose (the README: "uploads it as data files to a GitHub and/or GitLab repository"), which is a dependency on another service, so contentStore is not-found. The docs site says that moderation creates a pull request, and that Akismet spam checking, Mailgun email notifications and webhooks are configurable; these are features of the API configuration, not fields. The README's Node.js requirement "Node.js 14.15.1+" comes from the README at the v1.7.1 tag, while the master README says Node.js 8.11.3+; the tag is the latest release, so runtimeMin is 14.15.1. The docs state that a single instance can be used by multiple users and configured per site; that is not a userRoles statement and is not recorded.
