notes: >
  The repository has no GitHub releases, only the tags v1.0.0 (2019-12-13), v1.0.1 (2020-01-29) and v1.1.0 (2020-09-23). The latest tag is v1.1.0, so currentMajor is 1; latestReleaseDate and firstRelease are the commit dates of those tags. The repository's homepage field is empty and the README names no separate site. The README's sponsor section names CTO.ai; no field records sponsors. The README installs a binary through gobinaries.com and names no runtime, so only the language is recorded. The README says it does not pre-render with a headless browser, so client-side JavaScript is not run before the pages are copied. The output is a static version of the site, so runsAs holds static for the live site; the generator itself runs from the command line, so local is recorded as well. The README says "Staticgen executes the command you provided, waits for the server to become available", and it names no host for that run.
