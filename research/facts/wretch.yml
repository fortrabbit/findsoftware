notes: >
  Boundary ruling: wretch is an HTTP client, accepted (wave 72 ruling). The README's Compatibility section names modern browsers (wretch@^3), Node.js 22 and later, Deno and Bun (each with a "works out of the box" line); runtime is recorded as node, deno and bun from the Features line "compatible with modern browsers, Node.js 22+, Deno and Bun" and no runsAs is recorded. The Deno and Bun lines (deno add npm:wretch, bun add wretch) are each their own installMethod; the script tag section under the Installation heading shows its CDN route only in a code block, so no sentence states it and it is not recorded; the package manager line covers npm, yarn and pnpm as one route. The package.json at tag 3.0.9 sets engines node ">=22"; the Node.js line also comes from the README. Older lines: wretch@^2 for Node.js versions before 22 and wretch@^1 for older browsers; they are not recorded as fields. The README's sponsor link (github.com/sponsors/elbywan) is not a field. The README documents a Cloudflare Workers limitation. The fetch API is the web standard the library wraps, not a record, so basedOn is left out. The npm package wretch has dist-tag next 2.0.0-next.1, which is a prerelease and is not counted in latestReleaseDate. firstRelease 2017 is the npm creation date (0.0.1, 2017-09-13). The category "http-client" from the CSV has no entry in the import's categoryMap, so data-fetching is used, as for axios. npm weekly downloads cover 2026-11-01 to 2026-11-07.
