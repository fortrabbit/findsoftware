notes: >
  Highest stable GitHub release is the svelte@5.57.2 tag (2026-10-06), so currentMajor is 5. The queue row tags the project ui-library; the README calls it a compiler and the docs present SvelteKit as the recommended application framework, so categories records framework (the overview page) and compiler (the README). SvelteKit is a separate project with its own record. The docs describe the Vite route as building static output in dist; runsAs is not recorded because Svelte is a compiler and the docs do not say what a live site needs from the host. The copyright line names "Svelte Contributors" rather than a legal entity; recorded as the project states it. runtimeMin is the npm engines minimum (node >=18). firstRelease is the year of the first npm publish. The endoflife.date entry exists under the id svelte and is recorded by id only.
