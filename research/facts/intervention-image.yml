notes: >
  The GitHub latest release 4.4.0 (2026-10-17) and the Packagist stable 4.4.0 agree; the release date is the Packagist version time. The Packagist download figure is the all-time total (period total). The candidate row calls the library a runtime image library; the record's description and categories use the homepage's own wording. The homepage names the author in its page metadata; the GitHub organization is Intervention. The package's PHP minimum comes from the Packagist metadata for 4.4.0, since the installation page does not state a version.
