notes: >
  Status is discontinued because the project states the end of the open source version and of CKEditor 4 as a product: the README says it reached end of life on June 30, 2023, and the homepage says it is considered end-of-life software. The CSV row reads accepted; this is a status change for the reviewer. The latest release is the commercial LTS line: tags 4.23.0-lts and above need a license key under the Extended Support Model, which the LICENSE.md describes as available under exclusive terms, so the record has no paidEdition. The open source terms for 4.22.1 and below are an older statement and stay out of the license field: LICENSE.md names the GNU GPL 2 or later, the LGPL 2.1 or later and the MPL 1.1 or later, at the choice of the user. The README says 4.22.1 was the last version under open source terms. The README and the homepage name CKEditor 5 as the upgrade route; no successorOf fact is recorded, because the sentence names an upgrade path and not a successor relation. GitHub reports no releases, so currentMajor and latestReleaseDate come from the npm package ckeditor4, whose latest version is the LTS line. GitHub detects no main language for the repository (Rich Text Format, from sample files), so no language is recorded. endoflife.date has no entry for ckeditor4 (its API returns 404). Stars and contributors belong to the repository, which holds the LTS source. The README usage: a script tag loads ckeditor.js, from npm or the CDN, and CKEDITOR.replace is called with the id of an element, which becomes the editor. The homepage footer links Facebook, LinkedIn and YouTube accounts of the company; LinkedIn has no field. The README newsletter badge links an http address that redirects to another http address, so no newsletter is recorded. The docs index names the Angular, React and Vue integrations as separate npm packages; they are not recorded.
