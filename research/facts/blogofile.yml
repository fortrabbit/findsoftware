notes: >
  The homepage given on GitHub and PyPI, http://www.blogofile.com, does not resolve (DNS SERVFAIL on 2026-10-23), and the docs domain docs.blogofile.com does not resolve either, so no homepage is recorded. The repository is archived with no move to another home, which is the signal behind status discontinued and outranks the dead homepage. The install steps are in the README and docs/ folder on the plugins branch, which is the default branch. The first and latest GitHub release do not exist: the repository carries tags up to 0.8.3 but no releases, so firstRelease and currentMajor come from the PyPI package blogofile, whose oldest release is 0.6 (2010-03-31) and latest is 0.8.3 (2015-05-16). The license is MIT in intent by the LICENSE.txt, which states the author does not enforce violations; GitHub shows NOASSERTION. The docs cover the 0.8 core and say it needs no database; the README says the core is Blogofile, and the blogofile_blog plugin is a separate PyPI package not recorded here. The docs say Blogofile is developed under Python 3.2 and tested with Python 2.6 to 3.2; that is an old statement, so runtimeMin is not recorded. The GitHub repository is archived, last pushed 2015-10-06.
