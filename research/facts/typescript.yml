notes: >
  Language and runtime. The language value is Go for the current major (the native compiler); the earlier lines of this repository, up to 6.x, are the compiler written in TypeScript, and the language is still TypeScript. The repository's language is Go: since version 7 the npm package launches native binaries from optional @typescript/typescript-* dependencies, and the repository README says code changes here are limited to a small category of fixes and most bug fixes go to the typescript-go repository. The launcher needs Node.js; the engines value is from the 7.0.2 registry manifest. Judgement for the reviewer: the record lists the compiler under transpiler (build-tool), as the CSV boundary note does, and the Go language value follows the repository API. The 6.x line of the same repository still reads its package.json version 6.0.0 at the v7.0.2 tag. The npm dist-tags also carry a 7.1.0 beta; no prerelease date is recorded. Stars and contributors come from the repository microsoft/TypeScript. npmWeeklyDownloads covers 2026-09-28 to 2026-10-04. The HTTP Archive figure is the mobile origin count of the technology TypeScript, listed in its Programming languages category. The oldest GitHub release is v1.1.0.1 (2014-10-07); the npm history starts in 2012 at 0.8.0. The repository holds 220 releases; the list includes one release of a separate VS Code extension, vscode-typescript, which is not the compiler. The Microsoft address is the one the privacy statement gives for the company.
