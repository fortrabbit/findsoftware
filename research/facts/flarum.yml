notes: "The flarum/flarum repository is the install skeleton; its GitHub latest release is v2.0.0 (2026-10-09), while the flarum/core package on Packagist has v2.0.2 (2026-10-17). latestVersion takes the Packagist stable release and the install page's archive list confirms 2.0.2. The homepage footer names the Flarum Foundation as copyright holder, which is the maintainer value. The install page says the installer asks for pdo_mysql before Flarum 2.0.2 whichever database is used. The scheduler needs a one-line cron job and the queue can run on Redis; both are optional features on top of the per-request PHP process. The packagistDownloads figure is the total for flarum/core as Packagist reports it on 2026-10-19."
