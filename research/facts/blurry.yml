notes: >
  The PyPI JSON reports downloads as -1 for every window, so no PyPI download figure is recorded. The package on PyPI is blurry-cli; the import name and the GitHub project are both blurry. The maintainer is John Franey, the author on PyPI and the copyright holder in the README; the repository owner is the organization blurry-dev. The README calls Blurry a static site generator that blends Mistune, Jinja, JinjaX, LiveReload, Typer and Pillow; these are dependencies, not a parent project, so basedOn is not recorded, and the homepage comparison with Hugo and Pelican is a comparison, not a relationship. The docs site is the documentation home the README links, so it serves as homepage and docs. The major is 0 because the README states that until v1.0.0 minor versions may break compatibility and the highest stable release is v0.25.0. The contributor count is the last page of the per_page=1 request, page 5.
