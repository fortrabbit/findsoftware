notes: >
  Lion is a monorepo. @lion/ui is the package the get-started page installs, so its registry and GitHub release figures are used; the other packages in the repository (providence-analytics, @lion/nodejs-helpers and the singleton-manager tags) are not counted. The highest stable @lion/ui release is below 1.0.0, so currentMajor is 0: the versioning page says that below 1.0.0 minor upgrades may contain breaking changes. The homepage, docs and blog are on lion.js.org; the homepage links to Slack and GitHub only, and the Slack link has no field. basedOn lit follows the homepage sentence naming LitElement as the base class; the get-started page also lists lit, modern-web and open-wc under "Technologies Used". The maintainer is ING Bank NV from the LICENSE copyright line, which gives the address Amsterdam, so hqCountry is NL. firstRelease is the year of the open-sourcing post, which matches the oldest GitHub release (@lion/accordion 0.1.4, 2020-08-10).
