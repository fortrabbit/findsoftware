notes: >
  The project has no website of its own: the GitHub repository is its only home, so no homepage is recorded. The install page names the Swift Package Manager and a make-built command line tool; the README adds Homebrew and says that Homebrew installs are not officially maintained and may be older. The README states macOS Big Sur (11.0) or later for Mac use with Xcode, and says that beta software of Swift, Xcode and macOS is not officially supported; these requirements are not recorded as fields. Plot is the HTML library Publish uses for theming, a dependency rather than a parent project, so basedOn is not recorded. Publish is the project that built swiftbysundell.com per the README, recorded only as the README's own statement and not as a reportedInstalls figure. The README links the maintainer's personal Twitter account in a badge image; it is not recorded as the project's. The README says Publish is used to build swiftbysundell.com. The GitHub topic publish-plugin is a discovery page and not a directory, so pluginDirectory is not recorded. The highest stable GitHub release is 0.9.0 (2022-04-24), and no prerelease is listed.
