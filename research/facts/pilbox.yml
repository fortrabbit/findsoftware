notes: >
  Discontinued by the README's first lines, "DEPRECATED. This project will no longer be maintained." The CSV row said accepted; the status is changed because the end statement is the project's own. The newest GitHub release is 1.3.4 (2018-08-11) and the newest commit on master is 2019-12-01; the age alone does not decide the status. The PyPI package names GitHub as its homepage, so no project site is recorded. The README says the application is "built on Python's Tornado web framework using the Python Imaging Library (Pillow)": Tornado and Pillow have no record ids, so they stay in notes. The GitHub topics include "deprecated". The README recommends that pilbox not be exposed to the internet, and the application includes no caching (a CDN or varnish is advised). Coined kinds, kept in notes: outputFormats (gif, jpeg, png, webp, tiff), urlSigning (HMAC-SHA1 "sig" parameter with a client key), allowedHosts (requests limited to listed hosts), imageLibrary (Pillow, with optional OpenCV and PycURL). The pypistats figure counts the last 30 days to the query date, as its period label says.
