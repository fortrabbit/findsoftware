notes: >
  The homepage title and terms name the company as Commerce.com; the product is still named BigCommerce on the developer and pricing pages, so the record keeps the product name. The terms state a Texas corporation with an Austin, TX address; the country is recorded as US from that. The developer docs name a GraphQL Storefront API and a REST Management API. Stencil is a theme framework; its CLI is recorded as a local tool, not as a self-hosted commerce platform. No open-source core is named on the pages read, so license is not recorded; licenseModel follows from the hosted-service status. The terms cover several Commerce group entities (Ireland, UK, Australia); only the US entity is recorded as maintainer. Catalyst, a Next.js storefront, is named on the headless page and is not recorded as a separate record.
