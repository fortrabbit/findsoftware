notes: >
  Dual licensed: the package manifests carry the SPDX expression "GPL-3.0-only OR LicenseRef-Commercial", and LICENSE-COMMERCIAL.md says lightGallery is dual-licensed, with the GPLv3 for projects distributed under GPLv3-compatible terms and a commercial license for proprietary source. The commercial license is priced per team member and per product count, with tiers on the license page; the page and LICENSE-COMMERCIAL.md say it covers the same code, every feature and every official plugin, with nothing gated, so the tiers change limits and no paidEdition is recorded. The getting-started page says "Commercial projects also need the licenseKey setting", and the commercial key is sent by email after purchase. The license page sells the commercial license and an Extended license for SDKs and website builders; the license text is not restated here. The GitHub repository reports GPL-3.0 only, and the LICENSE file is the GPLv3 text with no copyright holder line, so the maintainer comes from the npm package author field. The npm engines field requires Node 18 or newer; that is a build requirement of the package, so no runtime is recorded. No sentence says where the library runs; the README and homepage list supported browsers, which is a support list, so runsAs is left out. The framework packages @lightgallery/react, @lightgallery/vue and @lightgallery/angular and the @lightgallery/headless core are bindings of this one library, not separate records, so no basedOn is recorded. The npm weekly figure counts the lightgallery package the install page names; stars and contributors belong to the sachinchoolur/lightGallery repository. The homepage X link is a personal account of the maintainer, recorded as the project's social link as the homepage gives it. firstRelease is 2014 from the oldest npm upload 1.1.3 (2014-10-25), with the oldest GitHub release dated 2014-09-16 in the same year. Coined kinds (TypeScript types, the video facades, the 20-plus transitions, the justified layout) stay in notes.
