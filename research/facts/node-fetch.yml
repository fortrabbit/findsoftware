notes: >
  Boundary ruling for wave 62: node-fetch is an HTTP client, a helper library, accepted under the data-fetching category; the CSV status accepted stands. No homepage: GitHub lists none and the README names no site; the repository README is the documentation, and its docs folder is part of the repository. The current major is 3: the highest stable release is v3.3.2 (2023-07-25). The v2.7.0 release (2023-08-23) is the newest stable release by date; it is on the 2.x line, which the README keeps for CommonJS users, and it is the latestReleaseDate under the newest-by-date rule. The npm latest tag is 3.3.2, and the npm package node-fetch also serves the cjs tag at 2.6.7 and a release-2.x tag at 2.7.0; the weekly figure counts downloads of all versions of the package node-fetch. The README's install section names npm install node-fetch; npm install node-fetch@2 for CommonJS is the 2.x route and is not recorded as a second installMethod. The ESM-only note for 3.x (require() not supported) is a compatibility statement, not a field. The runtimeMin comes from the engines field at the v3.3.2 tag; the package.json version field there still reads 3.1.1, a stale value that is not recorded. The LICENSE copyright line names the Node Fetch Team, and the README Team section lists individuals (David Frank, Jimmy Wärting, Antoni Kepinski, Richie Bendall, Gregor Martynus), so the maintainer stays the team as the license names it. The dependency counts come from ecosyste.ms for the package node-fetch; its repository link for the package still points to the former bitinn/node-fetch address, so the repository fact is taken from the GitHub API for node-fetch/node-fetch instead. The Discord link is a README badge with the alt text Discord; it is the project's own chat. Open Collective support is a donation link, not a field. The README names isomorphic-unfetch and cross-fetch for isomorphic usage, which is a pointer to related libraries with a different purpose and is not an alternativeTo statement.
