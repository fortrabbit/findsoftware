notes: >
  Monorepo: stars and contributors belong to vazco/uniforms, which holds the core package and the bridge and theme packages (uniforms-bridge-zod, uniforms-antd, uniforms-mui and others); the registry figure is the core package uniforms that the installation page names first, and the bridge and theme packages are not counted. Accepted as a form library: a React component library that builds forms, which is a kit with reusable fields, not a page template. The README names JSON Schema, SimpleSchema, Zod and themes for AntD, Bootstrap 4 and 5, MUI, Semantic UI and plain HTML; those are bridges and themes the docs install as separate npm packages, recorded in no field. The homepage nav links Forminer under Enterprise, a separate form builder product that the uniforms docs do not describe as an edition of this library, so no paidEdition is recorded. The homepage section "Comparison with similar libraries" and the docs Comparison table set uniforms against Formik, redux-form, React Final Form and react-hook-form, which is the alternativeTo statement. The v4.0.0 tag has no GitHub release object; the tag is the newest stable version and the npm registry also names 4.0.0, dated 2025-02-28, which is the latestReleaseDate. The LICENSE copyright line reads Vazco for 2016-2022; the vazco.eu footer names the company Vazco P.S.A., a legal form not recorded in the maintainer field, and its full address gives hqCountry PL. The npm weekly figure is for the uniforms package over 2026-11-01 to 2026-11-07. The homepage's testimonials and company logos are not recorded.
