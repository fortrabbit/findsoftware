notes: >
  The repository is archived on GitHub (archived true, read 2026-10-23; the CSV row says it was checked 2026-10-19). The Hex package links that repository as its Github link, so it is the project's named source, and the archive is the discontinued signal. No own homepage exists; the repository is the only project page, so no homepage is recorded. The last push to the repository is 2022-08-21. The Hex package obelisk 0.10.0 (2015-04-01) is the newest release and is the package the README's mix dependency names; the Hex download figure is the all-time total. There is no GitHub release object, only the tag v0.0.1, which is the source for firstRelease. Contributors were counted over all pages of the contributors endpoint. The README was read in full and states no end, deprecation or successor.
