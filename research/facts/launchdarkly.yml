notes: >
  Hosted-service record: the product is the LaunchDarkly service; the SDK repository launchdarkly/js-client-sdk (121 stars, GitHub license NOASSERTION, latest SDK release 2026-10-02) and its npm package launchdarkly-js-client-sdk (about 1.2 million weekly downloads in the candidates row) are client SDKs and are recorded in notes only, under the hosted-service rule. The Relay Proxy repository launchdarkly/ld-relay (134 stars, GitHub license NOASSERTION, not archived, pushed 2026-11-02) is open source, and its README says it connects to the LaunchDarkly streaming API and proxies that stream to multiple clients. It proxies the hosted service, so it is no selfHostOption and the status stays hosted-service. The legal entity is Catamorphic, Co., a Delaware corporation doing business as LaunchDarkly, recorded as maintainer; the Delaware incorporation is not a headquarters, so hqCountry is not recorded. The pricing page says "Free to start." and "No per-seat pricing. Invite your whole team; pricing is based on usage."; no prices are recorded. The EU instance page compares the EU version with the version available in the United States. The docs' Relay Proxy pages returned 404 and the about page returned 404, so no firstRelease is recorded. The EU instance page says it only supports net new Enterprise accounts and trials.
