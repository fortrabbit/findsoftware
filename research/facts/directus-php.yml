notes: >
  The repository field in the candidate row, docs.directus.io/api/reference.html, now redirects to the current Directus documentation at directus.com/docs/api, so it is not recorded as docs or homepage; the v8 line has no site of its own. The repository is a monorepo of the Directus 8 application (api, app, docs, sdk and others); the README names no registry package, so no registry figure is recorded. The PHP requirement is read from api/composer.json at the default branch. The repository was archived by its owner on 2023-01-06 (GitHub page), and the README calls v8 end-of-life and superseded by directus/directus, which is a separate record (directus.yml), not a successorOf fact here. The repository license field is null on the API; the GPLv3 statement is taken from the README. The candidate row lists lastRelease 2020-11-19, which matches v8.8.1, the highest stable release. Pre-release tags (2.0.0-alpha and rc) are excluded from currentMajor and firstRelease is taken from the oldest GitHub release, 2.0.0-alpha.1 (2018-04-21). The categories value headless-cms comes from the CSV row, supported by the README line about wrapping SQL databases with REST and GraphQL; the README does not name a CMS.
