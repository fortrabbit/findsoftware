notes: >
  The repository LotusTM/Kotsu is archived on GitHub, and the npm package names it as its repository, so the status is discontinued. The project's site kotsu.2bad.me, named as homepage on npm and in the README, does not resolve (no DNS), so no homepage is recorded. The README calls the project an advanced web starter kit and its tagline is "To boldly go where no man has gone before". The maintainer is recorded as LotusTM from the README copyright line; the npm maintainers are armordarks, ltm and mrhyde. The first GitHub release is 0.3.5 (2014-09-03). The npm package has no deprecated flag on its latest version. The repository has 49 releases and tags, with the highest stable 1.15.0. The docs are in the repository under docs/, marked "Work in progress" in the README; the Continuous Delivery page builds a Docker image with nginx serving the build folder, which is the static runsAs. The build command is npm run build (README, step "Build with"). Kotsu uses Grunt, Webpack and the Ekzo Sass framework; these are tools it includes, not a parent it states, so basedOn is absent.
