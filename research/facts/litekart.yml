notes: >
  The Litekart site describes a product made of two repositories: the SvelteKit storefront at github.com/itswadesh/svelte-commerce, which has its own fact file, and the Go backend and admin at github.com/itswadesh/gocommerce, which is the repository recorded here as the CSV names it. The site calls the current product "Litekart v2.0", while the highest stable GitHub release of gocommerce is v1.2.54, so currentMajor is 1 by the rule; a reviewer should decide whether this record should follow the v2.0 product. The homepage claims "1,800+ GitHub Stars"; that count matches the svelte-commerce repository (the storefront the site links as "Download Litekart", which has its own record), not gocommerce, whose own count is the one recorded. No other repository under the itswadesh account carries the Litekart name, and the site's two source links are svelte-commerce and gocommerce. The site's architecture page still describes a Node.js and TypeScript API, while the gocommerce README describes a Go engine, which is why the repository is recorded as the Go backend. The engine README names kitcommerce.store/gocommerce as the project's page, which is a different site from litekart.in; the homepage is litekart.in, as the CSV names. The engine requires Go 1.23 or later, but the binary runtime is excluded from runtimeMin by the import, so the requirement is only in the runtime quote. The Litekart pricing page describes a White Label plan at 1% of sales and a managed deployment service; those are service terms and not an edition, so paidEdition is unknown and no price is recorded. The about page names Misiki Technologies LLP as the company that builds Litekart, recorded as maintainer; the gocommerce LICENSE copyright line names Swadesh Behera. The pricing page and the WooCommerce comparison page describe paid migration and implementation as services by the Litekart engineering team, which is not a documented import tool. The GitHub owner location is India and is not a page statement, so hqCountry is unknown. The Litekart "Since 2014" founding line is the company's, not a first release, so firstRelease is the first gocommerce release year.
