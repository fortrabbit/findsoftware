notes: >
  The homepage and the docs site are client-rendered; the homepage is recorded from the homepage field of the GitHub repository (via api) and the install steps come from the README. The docs source, packages/arco-vue-docs/docs/start.en-US.md on the default branch, states the requirement "vue >= 3.2.0" and the install command "npm install --save-dev @arco-design/web-vue"; no runtime field fits a Vue component library, so the requirement is not recorded. The package peer dependency is vue >=3.1.0 and the package description says "A Vue.js 3 UI Library". The docs' supported-platforms table lists browser versions, but no page says the library runs in the browser, so runsAs is not recorded. The repository is a monorepo: every registry and release figure is for @arco-design/web-vue, the package the README names, and its tags are plain version numbers, so the highest stable tag 2.59.0 (2026-10-20) sets currentMajor. The LICENSE copyright line names Bytedance, Inc. and its affiliates; the npm author is ArcoDesign Team, which is not a legal name, so the LICENSE line is the maintainer. npmWeeklyDownloads is the sum of the daily range 2026-10-18 to 2026-10-24. The docs value points at the docs site, which is client-rendered; the start and i18n pages were read from the docs source. firstRelease is the first npm upload of 2.0.0 on 2021-10-25, one day after the repository was created. Contributors is the last page number of the contributors endpoint with per_page=1.
