notes: >
  currentMajor is 5: the live docs open with "Welcome to Quartz 5" and the README of the v5 branch is titled "Quartz v5". Tag v5.0.0 exists but is no GitHub release (the releases list ends at v4.0.8, 2023-08-21, which is the source of latestReleaseDate) and no release marks it a prerelease. The npm name quartz belongs to another project (robinduckett/quartz, version 0.0.1), and the scoped @jackyzha0/quartz is not on the npm registry (404), so no registry record applies. firstRelease is the oldest GitHub release (v3, 2022-01-03); the repository was created in 2021. The install page names git clone of the repository, not a package. The installation page and hosting page were read in full; the homepage and the docker support page were read. The installation page names the setup wizard (npx quartz create), the hosting page names GitHub Pages, Cloudflare, Netlify and Vercel as hosts, and the homepage names Markdown as the content format.
