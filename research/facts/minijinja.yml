notes: >
  Stub: criterion 3 is not judged for the library. The README's only install command is for the minijinja-cli binary (a curl installer for a separate command line package), docs.rs has no cargo add or dependency line for the crate, and the only library route shown is a cargo tree listing of minijinja as a dependency. A page that states how to add the crate to a Cargo project would settle it. Criterion 1 holds: a template engine a Rust web app renders its pages with. The crates.io homepage field points to the repository, so there is no project site and no homepage. The README describes inheritance, filters and a Rust example that renders a template from an environment with a context, and lists a Go port (minijinja-go, its own module with its own tags), WASM and JavaScript, Python, C and CLI packages, all in the same repository; the repository's stars and contributors belong to that monorepo, and the crates.io figure covers the minijinja crate only. The README says MiniJinja is based on the syntax and behavior of the Jinja2 template engine for Python: a reimplementation in Rust, so basedOn is not recorded; the templating language is Jinja syntax and no templating fact is recorded, as in the jinja record. The README's Similar Projects section names Askama, Tera, Liquid and TinyTemplate as related Rust template engines; the list sits under the heading Similar Projects as related template engines for Rust, so alternativeTo names askama (the only one of them with a record), and the Rust Liquid crate is not the liquid record, which is Shopify's Liquid. The GitHub release list holds the minijinja crate's releases under plain version tags; the minijinja-go tags are a separate line. The LICENSE file has no copyright line, so the maintainer comes from the crate manifest authors. The import map (runtimeMap in scripts/import-facts.mjs) turns the rust runtime into binary, so a reviewer should check the runtime value on the record page. The README lists projects that use MiniJinja, which are not fields. latestPrereleaseDate is absent because the newest prerelease, 3.0.0-alpha.3, is older than the 3.1.0 release.
