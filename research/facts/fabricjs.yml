notes: >
  The CSV row gave http://fabricjs.com; the plain http address redirects to https://www.fabricjs.com/, which answers 200, so the https address is recorded. The id is fabricjs because fabric is taken by the Python Fabric record. Monorepo: stars and contributors belong to the fabric.js repository, which holds the @fabricjs packages. The npm figure is the legacy package fabric, the one the README badges and the CDN route name; the README calls it a compatibility facade that re-exports @fabricjs/browser and recommends @fabricjs/browser and @fabricjs/node for new applications. Those two packages have a 7.5.0-beta.1 latest tag and 96 and 85 downloads in the same window (sums of the daily figures), so the reviewer should confirm that fabric is the figure to keep. The npm route is not recorded as installMethod: the docs heading "Installing from npm" and the command "npm i --save fabric" have no sentence naming the route, and the README's install sentence "install the environment-specific package:" also has its route only in a code block. The docs page for the CDN route says the script tag works from cdnjs, jsdelivr or unpkg. The README's Quick Start CDN example still uses fabric@6.4.3 and the docs say "Upgrading to Fabric.js 7.0" exists; the release list's newest stable is v7.4.0 (2026-05-18), so currentMajor is 7. The README's Node.js support sentence says the minimum is 20; the docs browser-support table says Node.js 18 or newer, which is older than the README and the npm engines field, and the README is recorded. firstRelease is the year of npm version 0.5.2 (2011-08-16), the oldest registry upload, which is older than the oldest GitHub tag in the repository (1.6.2, 2016). The GitHub release list has a v7.0.0-rc1 prerelease (2025-12-15) and beta (2025-08-24), both older than the stable 7.4.0, so no latestPrereleaseDate is recorded. The x link is the Twitter address the README gives under "Fabric.js on Twitter"; the homepage has no social link. The Patreon and sponsor links and the sponsor advertisement in the README are not recorded.  The homepage lists the features Fabric.js offers: text editing, complex SVG path support, WebGL and Canvas2d image filters, animation, clip paths, on-canvas controls, TypeScript and object grouping. The README says Node.js support depends on node-canvas for the canvas and jsdom for the window, that node-canvas has its own limits and bugs, and that canvas features cannot be transpiled or polyfilled in older browsers.  The homepage also says "Fabric provides interactive object model on top of canvas element" and "Fabric also provide serialization and has SVG-to-canvas (and canvas-to-SVG) parser."
