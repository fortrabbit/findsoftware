notes: >
  The homepage letterpad.app is the project's hosted publishing platform (sign-up, member blogs, pricing and Pro features pages), not only a project page; the open source software is the GitHub repository, and the hosted part is noted here with no prices. The Pro features page lists AI writing tools, analytics and a custom domain for the hosted platform; these are a hosted plan and not recorded as an edition of the software. The repository's latest commit is 2026-01-29 and its latest release v5.0.0 is 2024-02-15; neither the repository nor the homepage states the project has ended. firstRelease 2019 is the oldest stable GitHub release v1.3.0 (2019-05-20); earlier tags are betas. The README gives bun as the install and run tool; the root package.json states Node 18 as its engine, which is why runtime is node. The README lists a server-rendered blog, inline editing, domain mapping, three themes, a multi-user install and Cloudinary, Unsplash and Grammarly integrations; these are not recorded as fields. The README says the admin panel runs on port 3000 and the client on port 3001, and the client needs a CLIENT_ID from the admin settings.
