notes: >
  Accepted: no end signal. The README sponsorship section asks for sponsorship and names no paid edition, so no paidEdition is recorded. Highest stable version is 15.8.1 (GitHub release and npm latest, 2024-06-21). firstRelease 2012 comes from tag 0.9.8 (commit 2012-02-22), older than the first GitHub release object of 2013 (4.0.0) and the npm upload of 2015. The homepage and download page name the npm package and the GitHub download; the yarn route is the same npm registry and is not a separate installMethod. The homepage shows a script-tag route under "Alternatively, you can include both files", which is the download route and is recorded as download. No sentence states that the slider runs in the browser, so runsAs is left out; the README lists browser versions only. The README credits BrowserStack for testing, which is a tooling credit, not a fact. Stars, contributors and npm figures are adoption data only; the npm range sums the seven daily counts from 2026-11-01 to 2026-11-07. Dependent counts come from ecosyste.ms. The homepage says the slider supports non-linear ranges, requires no external dependencies, has keyboard support and multi-touch support on iOS, Android and Windows, and was tested in IE9 to IE11, Edge, Chrome, Firefox and Safari. The README says the project accepts sponsorship and that the license allows free use in personal and commercial projects. The README says the slider is accessible with aria and keyboard support.
