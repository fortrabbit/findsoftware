notes: >
  The weui.io root is the project's own demo page, which the README and the wiki name as the preview of all components; it carries no install text. The GitHub API reports the license as NOASSERTION, because LICENSE.txt adds that third-party components listed in it carry other terms; the list is not in the file read, so the components are unknown. The MIT statement appears in the README as "The MIT License" and in LICENSE.txt, one entry. The npm package repository field names github.com/weui/weui, which redirects to Tencent/weui. The npm figure is the package the wiki's npm command installs; the CDN links on the wiki are the weui.css builds by version. The copyright is THL A29 Limited, the Tencent company named in LICENSE.txt; no page names the country, so hqCountry is unknown. The GitHub release list starts at v0.3.0 (2016-01-23), and the npm package has an earlier upload, 0.1.0 (2015-09-14), so firstRelease comes from npm. Sibling projects named in the README (weui-wxss for mini programs, weui.js, react-weui, WeUI for Work) are separate software and not part of this record. The legacy versions 1.x and 0.4.x have their own preview pages on weui.io. The repository language on GitHub is HTML; the package ships CSS, so language is CSS. The CSV's "mobile-ui" category maps to ui-library.
