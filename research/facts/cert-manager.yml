notes: >
  Boundary row: a Kubernetes-only controller. The settled server-infra rule puts Kubernetes-only controllers in scope, and the homepage states the job for Ingress: "Automated issuance and renewal of certificates to secure Ingress with TLS". Status is set to accepted for that reason; the CSV row still says boundary and a reviewer confirms it. The homepage says the project was created by Jetstack (linked to jetstack.io) and donated to the CNCF in 2020; no parent is recorded because the page names no company that owns it today. The maintainer is the project's own name from the footer, "The cert-manager Authors", with the Linux Foundation as the site's copyright holder; the Linux Foundation is not recorded as maintainer because the project does not name it that way. The homepage links a Slack workspace (kubernetes.slack.com) and no field covers Slack. The first GitHub release is v0.1.0 of 2017-10-13; the repository was created in 2017-05. Images are published under quay.io, not Docker Hub, so no dockerPulls figure is recorded. Go modules have no download figure. No release is marked prerelease in the release list. The homepage's "5 million+ daily downloads" is a claim without a source and is not recorded.
