notes: >
  The site rebassjs.org answered 403 to the research request again on 2026-10-28 with the same user agent, so it is not recorded as the homepage; the README names it as the docs address, which is recorded as docs. The docs are the Gatsby site in packages/docs of the monorepo, read there: the index and getting-started pages describe the npm install, the Emotion default and a ThemeProvider from emotion-theming, and the migration page names rebass/styled-components as the Styled Components build. Those are read from the repository, not the live site. The last GitHub release is v4.0.0 (2019-08-27) and the npm latest is 4.0.7 (2019-10-28), the date recorded as latestReleaseDate; the default branch's last commit is 2021-08-03 and the CHANGELOG's last entry is 4.0.7. No archive flag, deprecation or end statement exists, so the record is accepted; the import's four-year rule without a release (2019-10-28) moves it to stub by age, and a reviewer decides whether to keep that listing. The README's "Previous Versions" section names v3 and v2 docs on a separate host, not a successor. The LICENSE copyright covers 2015 to 2019 under Brent Jackson; the maintainer field records that name as the license states it, with the GitHub owner rebassjs as an organization. basedOn is react only: styled-system is named as the build tool but has no record, so it is not an id. The npm figure counts the rebass package from packages/rebass, the package the install docs name. No HTTP Archive technology is named Rebass. The repository has archived sibling repositories (components, grid, space, create-rebass) that are not counted.
