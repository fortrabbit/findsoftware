notes: >
  Packagist name is encore/laravel-admin, the package the install docs name; z-song/laravel-admin is not on Packagist. The project's site footer reads "Built by @song" and no page gives a legal name, so the maintainer is recorded as the site states it. The LICENSE copyright line names Jens Segers, which does not match the site or the GitHub owner z-song and is not used. The docs say the project supports only the LTS version of Laravel, currently Laravel 5.5, and the README and docs both date from that period; the last release is v1.8.19 from 2022-05-24 and the repository was pushed 2026-05-02. The project does not declare itself ended or unmaintained, so the status stays accepted; the statement about limited time is not a clear end signal. Stars and downloads are recorded as the sources state them.
