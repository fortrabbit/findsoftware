notes: >
  Hosted-service record: the SDK repository (loops-so/loops-js, MIT, Organization owner, 12 releases, latest v7.3.0 on 2026-09-03), its npm package and star count are not recorded here, per the hosted-service rule. The homepage links X (twitter.com/loops), LinkedIn and YouTube; only X is a social field. The Trust center for SOC 2 (trust.oneleet.com/loops) and the DPA (loops.so/dpa) are linked from the security page; the security page also lists SSO and MFA among the questions it answers, which is not a feature statement, so sso is left unknown. The pricing page states that the free plan includes 4,000 sends per rolling 30 days to the first 1,000 contacts. The privacy page names Astrodon as the operating company and the terms name Astrodon Corporation; the about page names the 2022 start, public launch in 2023 used as firstRelease. Coined fields, kept here: freeTier (the pricing page states a free plan that includes unlimited contacts and 4,000 total emails to the first 1,000 contacts) and pricingModel (per subscribed contact, no seat fees). The homepage's own demo content is not a fact source.
