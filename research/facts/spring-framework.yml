notes: >
  Criteria 2 and 3 hold on the GitHub wiki Spring-Framework-Artifacts, which names the org.springframework:spring-context artifact for Maven and Gradle; no Maven Central download figure exists, so none is recorded. The Maven Central artifact is the package the install docs name, and the Maven Central folders for 1.0 and 1.1 all carry the same 2005-11-26 date, a bulk upload and not release dates, so firstRelease is 2004 from the project's own announcement of 1.0 final. The current major is 7 from the highest stable GitHub release v7.0.10 (2026-10-22). The highest pre-release is v7.1.0-RC1, published the same day, which is why latestPrereleaseDate carries that date. Maven Central's latest version is 7.1.0-RC1, a candidate, so no registry major contradicts 7. The GitHub API reports Apache-2.0 and the README gives the same license. The reference documentation is on docs.spring.io; the reference index page lists the modules, and the Spring Framework Versions wiki gives the JDK range. The GitHub wiki Spring-Framework-Versions states support ranges, so runtimeMin comes from the project's own wiki; the wiki's JDK range is 17 to 25 or higher for the 7.x line. The spring.io footer names Broadcom Inc. with the term Broadcom referring to it and its subsidiaries, so the maintainer is recorded as Broadcom Inc.; the spring.io page also names VMware in an offer, which is not a maintainer statement. The docs source the reference lives in framework-docs; the reference page for getting started is not on the index, so the Maven and Gradle steps come from the artifacts wiki. Stars, contributors and dates are read from the repository's GitHub API on 2026-10-26.
