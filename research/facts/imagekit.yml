notes: >
  The service is delivered through URL endpoints and an upload API with SDKs; the homepage names the SDK repositories imagekit-nodejs, imagekit-go and imagekit-dotnet, and their licenses, stars and downloads are not recorded here (hosted-service rule). Maintainer and contracting entity: the terms say the service is operated by ImageKit Private Limited and that standard paid or free plan users contract with ImageKit Inc., a Delaware company with a Newark, DE address on the contact page; the operator is recorded as maintainer and the reviewer may decide. The Private Limited address is in New Delhi, India (contact page, with a UIN). Plans page: "Forever free", paid Pro and Enterprise tiers with no prices recorded; SSO is listed in the Enterprise tier as "Single Sign-On (SSO) & multi-account setup" without naming a protocol, so no sso value is recorded. Coined, recorded here only: signed URLs with expiry and private images, using API keys (security-and-trust page); IP, geo and referrer allow or block lists (plans page); image, AI and video transformations listed in the transformation documentation (image-transformation page, rendered in the browser); "Video processing in Europe region" (plans page); subprocessors and processing locations (GDPR page). The docs API reference pages are client-rendered shells in the fetch, so no API rate limit is recorded. The YouTube channel (https://www.youtube.com/@imagekit) and LinkedIn page are linked on the homepage. The homepage also links alternative pages for Dropbox, Google Drive, Mux, Vimeo, Brandfolder, Bynder and MediaValet; none has a record. Contributors and stars are not recorded because the project's code lives in SDK repositories. The Imgix comparison page on this site is cited for alternativeTo imgix and importsFrom imgix; the Cloudinary comparison page for cloudinary.
