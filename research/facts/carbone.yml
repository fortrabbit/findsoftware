notes: >
  The Docker image's full variant bundles LibreOffice for PDF output, and the slim image does not; the embedding page says that without LibreOffice the npm package still generates formats that match the template type. For on-premise deployments authentication is disabled by default, and the Enterprise Edition requires a license.   The README says Carbone analyzes the template and injects the data into the document, and that the On-Premise Docker Edition has the same REST API as the Cloud Edition. The licenses page lists as not allowed offering Carbone, or a wrapper around it, as a hosted document generation service outside a value-added product.   The license has several statements, recorded as the project words them. The LICENSE.md in the default branch is the Carbone Community License 1.0 (dated February 14, 2023); the licenses page says it was renamed Carbone Code License in version 2.0, which applies to versions published after October 26, 2026, and that the 1.0 text covers the npm versions 3.5.5 to 3.8.2. The Apache License 2.0 covered npm versions up to 3.2.3. The licenses page lists the On-Premise Community binary and Docker image under the Carbone On-Premise License (free), the Enterprise Edition under the On-Premise License plus a signed Enterprise Agreement, the Private Cloud on AWS, Azure and GCP marketplaces under the On-Premise License plus marketplace terms, and Carbone Cloud under its Cloud Terms of Service; only the statements above are recorded as license facts. The README says the npm open-source edition is always one major version behind the on-premise edition. currentMajor and latestReleaseDate follow the on-premise changelog (v5.16.4, released October 30, 2026), the software users install; the npm library edition is at major 3 (3.8.2, 2026-04-07), one major behind, and the npm figures count that library. The repository has no GitHub releases; the changelog lists v5.10.0-beta, which is older than v5.16.4, so no latestPrereleaseDate is recorded. The npm library's engines field sets node >= 12.14.0 at the 3.8.2 tag; no runtimeMin is recorded because the installed binary is the on-premise line. The requirements page gives 1 vCPU and 1 GB RAM for the slim Docker image and 2 GB RAM with the converters. The Docker Hub figure is for carbone/carbone-ee, the image the README names. The pricing page lists SSO with Okta and Keycloak that the vendor sets up per cloud account; no sso is recorded for the on-premise server. The homepage navigation links SDK pages for Go, Java, JavaScript, Node.js, PHP, Python and Rust, and the README names the Node.js embedding; the SDK languages are not recorded as a field because the homepage links name pages, not statements. The On-Premise requirements page names LibreOffice as needed for PDF conversion, and the embedding page says LibreOffice is required to generate PDFs, the same requirement stated for the npm package. The HTTP API is a REST API for generating and converting documents; it is a document service, not a content API, so no headlessApi value is recorded. The alternatives page for Gotenberg is a comparison Carbone publishes; Gotenberg has no record yet, so alternativeTo stays out. The Cloud is hosted by OVHCloud, Scaleway and BunnyCDN according to the pricing page. The Trustpilot, G2 and Capterra links are ratings sites and are not recorded. The LinkedIn and YouTube links have no matching field. The homepage link for X is the handle carbone_io.
