notes: >
  The license is BSD-3-Clause per the GitHub API; the home page says "open source (BSD)". The download page lists 9.1.2 as the current release and 8.x as the latest supported past release, both dated 2026-09-01. The download page says Valkey includes 3-Clause BSD-licensed Redis code from Redis Ltd. The home page names managed-service providers (AWS ElastiCache, Google Memorystore, Oracle Cloud Infrastructure, UpCloud); they are not recorded as deployTargets. The home page has a community forum link text, but no forum URL appears in its HTML, so forum is not recorded. Fields coined here: none.
