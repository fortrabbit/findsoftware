notes: >
  The npm latest tag is 0.45.4 (2026-10-08), which sets currentMajor to 0. The Drizzle site and the npm dist-tags advertise the 1.0 line as beta and release candidate (1.0.0-rc.4 on the rc tag); the site's install page shows the rc install command, so the stable install line is not quoted. Re-check currentMajor when 1.0 reaches latest. The license quote "Drizzle is free" is a fragment of "Drizzle is free and open-source" on the homepage, where a non-breaking space sits between the words; the license itself comes from the GitHub API. The database list is not recorded: the GitHub description does not name databases and the docs were not read per database.
