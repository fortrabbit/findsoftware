notes: >
  The record covers the hosted New Relic platform; the same vendor's open-source agents are not a self-hosted server, so no selfHostOption is recorded and the status stays hosted-service. The SDK repository newrelic/node-newrelic (Apache-2.0, 1,000 stars, not archived, pushed 2026-11-02) and the npm package newrelic (1,843,988 downloads for 2026-10-26 to 2026-11-01 by the range endpoint) are the client SDK and go to notes only, per the hosted-service rule; the CSV figure of 662.1k per week is older and not used. The homepage lists the company's X account at x.com/newrelic, Instagram and YouTube; the Facebook link is http://www.facebook.com/NewRelic and is plain http, so it is not recorded; the LinkedIn company link is not recorded (coined field). The pricing page names a free tier, paid editions Standard, Pro and Enterprise and a usage-based model; none of these is a paidEdition for a hosted service, and the free tier and pricing model are coined fields, so they go here. OpenTelemetry compatibility (the OpenTelemetry page: "Choose from OpenTelemetry software development kits (SDKs) or the OpenTelemetry Collector") is a coined compatibleWith field and goes here too. The pricing page lists FedRAMP Moderate and HIPAA eligibility with Data Plus, and the Enterprise tier, as compliance claims; compliance is a coined field, so it goes here. The homepage links the docs at docs.newrelic.com and a changelog, blog, and YouTube channel; the community forum link on the pages read was not located. The /security page is a Trust Center placeholder with no statement; the trust center path returns 404; security is therefore unknown. The maintainer is the contracting party of the paid-account Terms of Service (https://newrelic.com/termsandconditions/paid); the privacy notice names New Relic, Inc. as the data controller; New Relic K.K. (Japan) and New Relic International Limited (Ireland) are named as subsidiaries or representatives, not as maintainer. No product first release is stated on the pages read; the copyright range 2008 to 2026 on the footer is the company, not the software, so firstRelease is unknown.
