notes: >
  Shiny is the rstudio/shiny R package on CRAN, and its install docs name install.packages("shiny"), so the registry id is cranName shiny. The DESCRIPTION title is Web Application Framework for R; the candidate row's data-app-framework is recorded as framework. The copyright holder in DESCRIPTION is Posit Software, PBC (cph, fnd); the maintainer role (cre) is Carson Sievert, a person, and the company is recorded because it is the legal copyright holder. The package is MIT with a LICENSE file. runtimeMin is the DESCRIPTION Depends minimum R 3.1.2; the README separately says it supports the latest R release and the four previous minor releases, which is a support statement and is not recorded as a minimum. The Posit deployment page describes open-source Shiny Server for on-premises deployment, Posit Connect as a commercial platform, and Posit Connect Cloud and shinyapps.io as hosted services; the hosted row cites the shinyapps.io sentence and runsAs always-on comes from the Shiny Server admin guide, which says the server manages R processes running Shiny applications. The shiny.posit.co homepage links an X account, @posit_pbc, that belongs to the company rather than the project, so x is not recorded. firstRelease is the oldest CRAN archive upload, 0.2.3 on 2012-12-01. The docs field is left out: the README links an older tutorial site, and the current Shiny for R reference is not quoted here.
