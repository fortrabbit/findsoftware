notes: >
  The project is hosted on Codeberg, so the GitHub-only fields are absent and the Codeberg stargazer count (0) has no field. The homepage states "NOTICE: This software is currently under active development. There will be breaking changes between releases.", which is recorded in prose only, not as a status. Releases are named r8 to r16 (r16 on 2026-08-27 is the newest stable release, r15 is a prerelease); the names carry no major, so currentMajor is absent. firstRelease is taken from the oldest tag v0.0.1 (2025-01-11), since the Codeberg release list starts at r12 in 2026. The LICENSE file reads "Copyright (c) 2023 esdinb", so esdinb is the maintainer as the project states it; the Codeberg owner account is a user account, not an organization. Contributors are left out because the Codeberg commit authors cannot be counted by the skill's method. The README lists Markdown rendering, asset bundling, localization and an HTTP/1, 2 and 3 server among its features, and says building needs libxml2, libxslt, ICU and lexbor with a C or C++ compiler for the cgo bindings. The homepage documents wbsx run and wbsx serve. The homepage's Docker example runs the image's serve command, which supports always-on; the homepage does not state whether its build output is static files, so renderingModes is absent.
