notes: >
  The project is Japanese and its pages are in Japanese; the description and values here are translated by the fact file writer, and the quotes are from the English README where one exists. The version 5 page at basercms.net/ver5 names CakePHP 4 as the framework, while the 5.4.1 composer.json requires cakephp/cakephp ~5.2.0 and the README says CakePHP 5; the registry and README are used. The organisation behind the project is not named on the pages read: the homepage lists supporting companies and an NPO foundation (baserfoundation.org) without saying which one operates it, so maintainer stays unknown. The GitHub license field reads NOASSERTION because GitHub did not detect the license file, while composer.json and the README both say MIT. The database engines and the PHP extensions were not stated on any page read. The fields facebook and instagram are coined here; x and forum are existing names. Adoption figures are the GitHub and Packagist values as they read on 2026-10-19.
