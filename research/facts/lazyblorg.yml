notes: >
  No homepage is recorded: the GitHub homepage field is empty and the README names no project site; the author's blog karl-voit.at is not the project's site. The repository has no GitHub releases and no tags; the project's PyPI package (whose project URLs name this repository) has four uploads from March 2026, the newest 2026-03-21, which sets latestReleaseDate. The versions are calendar versions with no major, and the README, which points to a git clone and not to PyPI, says "I don't maintain a specific changelog", naming the commit history as the update source. One license is recorded, GPL-3.0-or-later from pyproject.toml; the GitHub API reads the license file as GPL-3.0. The LICENSE copyright line names only the Free Software Foundation, so the maintainer comes from the pyproject.toml authors entry. The README states that the project is in "productive status" as of 2026-03-21, recorded only as a note. The README names Python 3, uv, Pandoc through pypandoc, opencv-python and Werkzeug as dependencies, Debian GNU/Linux as the development platform, and says it does not work on native Microsoft Windows; macOS is untested. It regenerates the complete set of output pages on every run and parses a sub-set of Org-mode syntax itself, with Pandoc as fall-back for other elements. The templates are Org-mode files without a named engine (templates/blog-format.org). Setup after the clone is to adapt config.py to the user's settings. The README mentions scheduled runs (a cronjob) only as an optional step, so runsAs holds no scheduled value. firstRelease stays unknown: the first PyPI upload (2026) postdates the project by years, and the repository has no release or tag. The README calls the project a works-for-me project and states that the author accepts no pull requests for features he does not use.
