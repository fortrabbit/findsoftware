notes: >
  Hosted-service record for Phrase, the localization platform at phrase.com. The company was formerly Memsource: the legal entities are named Phrase a.s. (formerly Memsource a.s.) in the terms and Phrase GmbH (formerly Memsource GmbH, Hamburg) in the imprint, and the terms name Phrase a.s. as the contracting entity, so it is the maintainer; the GmbH is not recorded as a second maintainer. The imprint lists both entities; a reviewer decides which name the record shows. The parent is the company that controls the Phrase group per the terms definition; the terms name it as Phrase Group Holding s.r.o. with registration in Prague. The phrase/phrase-js SDK repository named in the CSV is not the service's source, so no repository, license, stars or npm figure is recorded (npm phrase-js is 17.7k a week in the CSV row); the Phrase CLI and MCP server are client tools and are not recorded. The developer hub says the source strings stay in the codebase and the translations are shipped back, driven from the API, CLI or AI tools via MCP. The developer hub lists API reference, guides, an MCP server, Over-the-Air delivery and developer tools; no API style is stated on the pages read, and apiStyles is a coined kind kept in notes. The pricing page feature table lists Single sign-on, User role access control and Project-based user roles as feature labels; the plan columns the labels sit in are not readable from the page text, so no plan is recorded. The pricing page offers a 14-day free trial and a "Try for free" button; freeTier is a coined kind and is not recorded. The site's footer links LinkedIn (linkedin.com/company/phraseplatform) and YouTube (youtube.com/@phraseplatform); not recorded as fields. The homepage lists integrations with GitHub and many CMS and file services, and the pricing table lists them per plan; the integrations page was not read in full. Two-factor authentication and guest users appear in the same table; not recorded. The terms and the imprint are the legal pages read; the privacy policy was fetched and not used. The former name is in notes only; a rename makes the record follow the new product.
