notes: >
  Major version 4 is the highest stable line on npm (4.8.32, 2026-10-16); the newest GitHub release object is v4.8.24 (2026-08-27) and tags continue to v4.8.32 without release objects, so latestReleaseDate follows the npm publish of 4.8.32. The 5.0.0 alpha line is on npm (alpha.11, 2026-10-08) and is older than the stable release, so no latestPrereleaseDate is recorded. The monorepo's install docs name npm init @unchainedshop, a scaffolder, so the npm figure is taken from the main entry package @unchainedshop/platform (467 downloads in the week to 2026-10-18); @unchainedshop/core has 567 that week and is not recorded. firstRelease is 2022 from the npm upload of 1.1.3 on 2022-06-29, which is older than the oldest GitHub tag (v1.2.57, 2023-02-15). The changelog also lists undated 0.x releases before the first npm upload, so the 2022 date is the oldest dated release; the repository was created in 2018. The README states a Node.js >=26 prerequisite for the development version; the published latest version declares node >=22.0.0 in npm engines, so runtimeMin follows npm and the README line is not recorded. The README's package table lists the core domain modules: products, orders, users, payment, delivery, assortments, filters, warehousing, enrollments, quotations, bookmarks and files, and a core package that combines them. The engine's GraphQL API is served with Express or Fastify adapters, and a Copilot chat with an MCP server is documented; these stay in notes. The homepage names Stripe, PayPal and Datatrans payments, subscriptions, quotations and a Next.js storefront starter; these are not fields. The README's Railway deploy button carries a referral parameter, so it is not recorded. The unscoped npm package unchained is a different project (MIT, 2014) and is not used. The homepage's Discord invite differs from the README's; the README's invite is recorded.
