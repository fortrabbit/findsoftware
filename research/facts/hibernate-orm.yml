notes: >
  Status accepted: the repository is public and not archived, the release 7.4.15 is dated 2026-11-06, and the README names the documentation (criterion 3); Maven Central publishes org.hibernate.orm:hibernate-core, which the Gradle introduction uses. The CSV homepage is http://hibernate.org; the same host answers over https (https://hibernate.org/ and https://hibernate.org/orm/ return 200), so the https product page is the homepage. The homepage says "Hibernate is part of the Commonhaus Foundation" (hibernate.org/community/commonhaus); foundation hosting is not maintenance, so the maintainer is "Hibernate" as the site footer names it, and Commonhaus is not recorded as parent. The LICENSE file is the unfilled Apache template with no copyright holder. currentMajor is 7 (7.4.15 is the newest stable tag; the 8.0.0.Beta1 to Beta4 tags are development releases and are not used); the 8.0.0.Beta4 release date (2026-10-28) is older than the latest release, so no latestPrereleaseDate is recorded. The release list marks the 8.0 betas as not prerelease; the tag names carry Beta, so they are not used. runtimeMin 17 comes from the README sentence "The build requires at least JDK 25, and produces Java 17 bytecode." The bytecode target is the Java version a consuming application needs; the JDK 25 part is a build requirement and is not recorded. The Configuration page adds the org.hibernate.orm:hibernate-core dependency with the JDBC driver for each database. The databases quote is the homepage sentence naming the databases the project tests every day, and the value lists those the field dictionary has (Db2, Sybase ASE, EDB, TiDB, HANA, CockroachDB, H2 and HSQLDB have no dictionary entry); the homepage's community dialects module names Informix, Ingres, Teradata and incubating SQLite support, and the MongoDB and Google Spanner dialects are third-party, so none of those are recorded as databases. The dialect documentation (documentation/src/main/asciidoc/dialect) says third-party dialects are not tested by the Hibernate CI. The ORM documents built-in multi-tenancy and row-level security in the README; these are features of the ORM, not a multisite install, and are not recorded as multisite. The page describes paid support and a community forum; paid support is not an edition and is not recorded as paidEdition. The homepage describes the project as an implementation of the Jakarta Persistence specification, and the README names Jakarta Query and Jakarta Data; these are specifications the project implements, so basedOn is not recorded. Stars and contributors belong to the hibernate-orm repository, which holds the hibernate-core module and the other modules the README builds. The earliest tag found is 3.6.0.Beta1 (commit date 2010-07-21), which gives firstRelease 2010; the oldest release object found is from 2013-07-03. The Maven Central coordinates are not used for firstRelease. Hibernate Search, Hibernate Validator and Hibernate Reactive are separate projects with their own records. The homepage says Hibernate can be used in Java SE standalone applications, in EE servers such as WildFly and in containers such as Quarkus, which the project names as a supported environment.
