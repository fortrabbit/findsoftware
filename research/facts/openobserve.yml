notes: >
  Stub: criterion 1 is in doubt. The project describes itself as an observability platform for logs, metrics, traces, RUM and LLM monitoring, used to run infrastructure, not to build or extend a site; a reading of it as analytics and monitoring added to a site would settle it, and the project's own pages do not say it is used that way. The README says the open source edition "is feature-complete and production-ready" and the pricing page lists the Self-Hosted Enterprise edition as free up to 50 GB of ingestion per day, with paid volumes above that. The free cloud tier includes 50 GB per day according to the README; no prices are recorded. Storage is Parquet columnar storage on an S3-native design per the README; no schema field fits, so it stays in notes. The homepage says the platform is "Columnar Parquet storage, written in Rust on the DataFusion engine" and has "no index to build". The GitHub release list holds release candidates (tags such as v1.1.0-rc3 and v1.0.0-rc5 are not flagged as prereleases); they are not recorded. The oldest non-prerelease GitHub release is dated 2023-02-17; the year is taken from it. The README names a Slack community (a link, not a field). The footer address is the company's office, and the terms and privacy pages name no other headquarters; hqCountry rests on that address. The schema field runsAs always-on rests on the README's instruction to log in to the server running on localhost, not on a deployment page. The HTTP Archive technologies list does not carry OpenObserve. The README links a Slack community and a WeChat community; neither is a field.
