notes: >
  asgardcms.com no longer serves the project: it answers 200 with unrelated pages, so no homepage is recorded. The README's docs link points there; the project's own AsgardCms/Documentation repository holds a v3 installation page that documents installation with composer create-project or the asgardcms installer, so criterion 3 is met. That page states PHP 7.1 as the minimum while composer.json at 3.6.1 requires php >=7.0.0; runtimeMin follows composer.json. The LICENSE copyright line names Nicolas Widart bvba for 2017; it is the only legal name in the sources, and no hqCountry was found. The latest GitHub release and newest stable Packagist version are dated 2018-09-05; the repository is not archived and the Packagist package is not abandoned, so no end signal applies. Packagist downloads are the total since first publication. Contributors is the count of contributor pages read with anonymous contributors included.
