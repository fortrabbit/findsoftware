notes: >
  Accepted under criterion 1: the README says the code is "for use in code hosting, forums, wikis or other applications that need to prettify source code", and its security section describes "a web service which uses Pygments for highlighting". The homepage lists output formats HTML, RTF, LaTeX and ANSI sequences, and says it is usable as a command-line tool and as a library; those are notes, not fields. The CSV homepage was http://pygments.org/; plain http answers 301 to https, so the https address is recorded. The maintainer line in the README names Georg Brandl, Matthäus Chajdas and Jean Abou-Samra as maintainers, and the pyproject lists the same three; the record names the first, and the other two are kept here only, with no e-mail address. The LICENSE copyright line reads "by the respective authors (see AUTHORS file)" and names no maintainer, so the maintainer comes from the README. The LICENSE file's copyright year range ends in 2022 while the homepage footer reads "2006-present"; both are the project's own words and the license entry is not affected. The README states the license as BSD 2-clause, and the LICENSE text is BSD 2-clause; GitHub detects it as BSD-2-Clause. The README gives a figure of over 500 languages and the homepage a figure of 602; neither is recorded, since the count changes. The first PyPI upload is version 0.5 on 2006-10-30, older than every GitHub release (the oldest is 2.3.0, 2019), so firstRelease is from PyPI. The pypistats figure is the last-month count, a rolling window. The contributors count is across all pages of the contributors endpoint with per_page=1, last page 387. The README's security section says Pygments provides no guarantee on execution time for arbitrary input, and recommends terminating each run after a short timeout and limiting concurrent processes.
