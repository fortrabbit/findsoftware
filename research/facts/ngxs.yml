notes: >
  Basing: the homepage says NGXS is "a state management pattern + library for Angular", a for-Angular statement that sets basedOn angular. The homepage in the candidates row is http://ngxs.io, which redirects to https://www.ngxs.io/; the https site is recorded. No runtime is recorded: the library runs in the Angular application in the browser and the pages state no process model; the Node.js requirement of the Angular toolchain is a build requirement. Versions: v22.0.0 is the highest stable GitHub release (2026-07-01); the GitHub releases list starts with v2.0.0 on 2018-03-27, which sets firstRelease. The npm dev dist-tag is no release and is not recorded. The LICENSE copyright line reads "Copyright (c) 2018" with no holder, so the maintainer is the GitHub organisation NGXS, which the project describes as community built. Stars, contributors and dependents belong to the store repository; the plugins are first-party packages in the same organisation and are not counted. Stack Overflow and the Slack server named on the homepage are not recorded: Slack is being migrated to Discord per the README.
