notes: >
  Doubt: the homepage opensource.reactivesearch.io answers 404 with a Framer "Site not found" page, so no homepage is recorded; the README points to reactivesearch.io, the vendor's hosted product site, and to docs.reactivesearch.io, which answers 200. This would be settled by the maintainer naming a live project homepage, or by confirming docs.reactivesearch.io as the project site. Otherwise the record would be accepted: the repository is pushed 2026-10-27 and not archived, the npm package is not deprecated, and the install route is npm. The sibling package @appbaseio/reactivesearch-vue ships from the same monorepo and is not a separate record. The README names Elasticsearch, OpenSearch, Solr, MongoDB and OpenAI as backends, and the comparison table calls the project actively developed and maintained. The npm figure counts downloads of the React package; the Vue package is excluded. The README's comparison section sets the library against SearchKit and InstantSearch. The README links a marketplace at reactiveapps.io, and the v3 line is described as the last major release before v4. The hosted terms mention pricing plans; no prices recorded and no pricing page fact.
