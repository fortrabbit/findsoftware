unreadable: [https://www.zkoss.org/ (403 to the research request), https://www.zkoss.org/privacy (403), https://www.zkoss.org/product/zk (403), https://www.zkoss.org/download/zk/ce (403)]
notes: >
  The site www.zkoss.org answers 403 to the research request, so no page of it was read; the homepage is the GitHub homepage field. The docs at docs.zkoss.org were read: the quick start, the Maven archetype page, the Maven setup page (editions and licenses), the new-to-Java page (the supported-version table), the Jetty page, the background page and the Tomcat page. The GitHub repository has one release, v9.6.0 (2021-08-10), so its releases are older than the current line; the Maven Central artifact org.zkoss.zk:zk holds 10.3.0.1 (uploaded 2026-07-22) as the highest stable version, so currentMajor and latestReleaseDate come from Maven. The tag v10.3.1 (commit 2026-07-21) has no GitHub release and no Maven artifact, so it is not used. The GitHub license field is null and the repository has no LICENSE file (404); the license statements are the POM (LGPL, version 3), the README (LGPL with a link to version 2.1, no version in its text, so not a license entry) and the docs (CE under LGPL, unversioned), the POM and docs entries recorded. The docs name three editions: CE for personal use, and PE and EE as premium editions with a 60-day evaluation; the POM and README name no paid edition. The maintainer name is the legal name in the docs footer and the POM organization is Potix. The runsAs value is taken from the Jetty and Tomcat deployment pages, which name an application server that keeps running; the docs state no rendering mode. Maven Central publishes no download figure, so no download count is recorded. The ZK 10 row of the Java table is the minimum runtime. The description notes Ajax without client-side JavaScript code, which is what the README says; the README also says it is "Simply Java", which is not recorded in the description.
