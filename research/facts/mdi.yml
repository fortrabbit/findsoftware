notes: >
  The repository has no GitHub release or tag; the npm package @mdi/font is the registry release the install docs name, and its latest version is recorded (no GitHub releases exist, so the registry major and date apply). The npm package was last published in 2023 and the repository's last commit on the default branch is from 2025; the registry figure stays the release date. The repository README says it holds the planning for the icons, that icons are managed on the Pictogrammers site and that pull requests are not accepted, while the repository does hold the svg directory and meta.json. The npm weekly figure is for @mdi/font, the webfont package; @mdi/js, @mdi/react and @mdi/svg are separate packages with their own counts. The site materialdesignicons.com redirects to pictogrammers.com, so the homepage is the Pictogrammers library page. The About page dates the first commits to June 2014, and no release before the 2018 npm upload is recorded. The repository says it also contains icons converted from Google's official icon set, and the LICENSE file says some icons are redistributed under their own licenses; the project does not describe itself as built on that set, so basedOn is absent. The Pictogrammers license page says the Apache 2.0 license covers icons and fonts and the MIT license covers code. The docs say the webfont is discouraged for performance and request size, and point to SVG use. The Pictogrammers library page links Mastodon and Facebook, which are recorded; its LinkedIn and GitHub organization links are not. Contributors counts contributor accounts from the API with per_page=1, read from the last page link.
