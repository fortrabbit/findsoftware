notes: >
  The project has no homepage: the repository's homepage field is empty and the npm package's homepage is null, so no homepage is recorded. The README's maintainers section names Addy Osmani as creator and Ben Zörb as primary maintainer; the maintainer is recorded as Ben Zörb, the primary maintainer the README names; package.json and the README license line name Addy Osmani, the creator, and the LICENSE file names no copyright holder. Highest stable release is v9.0.0 (2026-09-13) and npm latest is 9.0.0; the npm dist-tag next (2.0.0-27) is an old prerelease and is not a latest prerelease, and GitHub lists no prerelease. The first upload is the npm version 0.0.1 (2014-06-28), older than the first GitHub release v0.1.6 (2014-07-30), so firstRelease is 2014. The npm weekly figure is the sum of the 2026-09-28 to 2026-10-04 window and counts the critical package. The README's Alternatives section links COMPARISON.md, which compares Critical with Beasties, Penthouse and native platform approaches; the alternativeTo fact records Beasties only, because Penthouse has no record. The README also shows a Docker image run (ghcr.io/addyosmani/critical) in its Docker section, which is not recorded as an installMethod because the quote check cannot read that section. The README describes an MCP server (node src/mcp.js) and an API that returns the critical CSS as a result, which are features and not fields. The ecosyste.ms lookup returned an internal server error on the first tries and answered on a later one; its counts are dated with the check.
