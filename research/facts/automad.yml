notes: >
  The stable line is 1.10.9 (GitHub release 2022-04-19, Packagist 2024-02-19, the newer date is recorded). The getting-started page says version 1 is no longer supported and that version 2, in beta, is considered stable and safe for production use; the 2.0.0 tags are betas, so currentMajor stays 1 and the newest beta date is latestPrereleaseDate. The repository is not archived and has commits through 2026-10-18, so criterion 4 holds. The Composer command on the install page installs v2.x-dev, the 2.0 line. The Docker images are official images with a web server and PHP included. The repository LICENSE.md is the O'Saasy License Agreement, which forbids offering the software as a hosted SaaS product where its main value is the software itself; the terms-of-use page says Automad is released under the MIT license; the homepage says Automad is free to use and open-source. All are recorded as stated. The requirements are PHP with the gd, curl and zip modules. The terms of use state that a minimum of telemetry data is transmitted: the public domain name, the Automad version and the server type. The homepage and the headless-mode page describe a headless mode with a read-only JSON API, enabled by the AM_HEADLESS_ENABLED setting, and the changelog lists removal of the headless mode feature at 2.0.0-alpha.1; the API style is not REST or GraphQL as named, so headlessApi is not recorded. The repository has tags from 0.1 (2013) with release objects only from 1.7.4 (2021), so firstRelease is the 0.1 tag's commit date. The Packagist dist repository is automadcms/automad-dist.
