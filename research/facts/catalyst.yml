notes: >
  Doubt: the homepage catalystframework.org, named by the candidate row, now answers 200 with unrelated gambling content, and catalyst.perl.org does not resolve, so no homepage is recorded; a page of the project that names the software again would settle it. The project's own site no longer shows the software, so status is stub under AGENTS.md; the README names http://catalyst.perl.org and an IRC channel, which are not recorded. The repository has GitHub tags but no GitHub releases; currentMajor and latestReleaseDate come from the MetaCPAN release Catalyst-Runtime, whose version 5.90132 is the highest stable upload. The MetaCPAN runtime requirement is perl 5.008003, recorded as runtimeMin in the registry's notation. The README copyright reads "Copyright (c) 2005-2015, the above named PROJECT FOUNDER and CONTRIBUTORS" and names Sebastian Riedel as project founder; MetaCPAN lists the author JJNAPIORK. Neither is recorded as maintainer, because the README does not name a maintainer. The first GitHub tag is 5.8000_03, committed 2008-12-01, which sets firstRelease. The README describes the Catalyst::Devel helper scripts, which are a separate CPAN distribution (Catalyst-Devel, 1.42, 2020-09-11) and are not the registry figure recorded here.
