notes: >
  The repository is sea-team/gofound; newpanjing/gofound redirects to it (GitHub 301) and the README's release links still point at newpanjing. The README names newpanjing as lead (负责人) and sea-team is the GitHub organisation; no legal name or country appears in the sources, so maintainer is the organisation name. No homepage: the project's README gives only a demo page (simpleui.72wo.com) and an admin demo IP, and the sea-team org blog (simpleui.88cto.com) is not the project's site. Last commit on the default branch is 2024-05-27 (api); latest stable release v1.4.1 is 2023-04-10. The README says the project is built on golang-jieba for Chinese word segmentation and uses leveldb for persistence (docs/index.md and docs/storage.md); the go.mod dependencies (gin, gojieba, goleveldb) are not recorded as basedOn. Official language SDKs for Java, Python and Node.js are separate repositories (gofound-java, gofound-python, gofound-nodejs) and no SDK figures are recorded here. The docs and the README are in Chinese; the HTTP API is documented in docs/api.md and its style (REST or other) is not named in the pages read, so headlessApi is not recorded. The listed user sites in the README are not adoption figures recorded here.
