notes: >
  No homepage: the GitHub repository names pkg.go.dev, a third-party index, as its homepage, and the project names no site of its own, so homepage is absent. The Go module path is github.com/gookit/rux/v2 for the v2 line; the proxy.golang.org list shows v1.x versions under the path without /v2, and the v2 line is the highest stable major, from the GitHub release v2.1.3 published 2026-10-08. The Go module proxy has no download figure, so none is recorded. The oldest GitHub release is from 2018-08-30, and the repository was created 2018-08-05, which sets firstRelease. The README calls the v2 release a clean-room rewrite and links docs/MIGRATION-v1-to-v2.md for breaking changes from v1; the migration document is not read in full here. The README says a render package has a pluggable TemplateRenderer interface and no template engine bundled, so templating is not recorded. The Server package's Run() provides graceful shutdown and /healthz and /readyz endpoints per the README, so runsAs rests on the README's ListenAndServe example and its Server section. The last push to the default branch is 2026-10-20. runtimeMin comes from the go directive of go.mod at v2.1.3, a module manifest the Go toolchain enforces.
