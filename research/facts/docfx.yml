notes: >
  Microsoft built docfx and the README says it moved to the .NET Foundation, with Microsoft Learn no longer using it since November 2022; the maintainer is recorded as the .NET Foundation, which the homepage and LICENSE name. The homepage shows the .NET SDK requirement and the command dotnet tool update -g docfx; the README gives dotnet tool install -g docfx, which is the recorded install method. The highest stable GitHub release is v2.81.0 (2026-09-25); the project also publishes nightly builds to GitHub Packages, which are not stable releases and are not recorded. The NuGet total download figure is the all-time count from the search API and carries no period. The README states the project is not released on a regular cadence. The repository's first release tag is v0.3.10 (2015-11-13). The homepage describes a second use as a NuGet library (Docfx.App), which is not recorded as a separate install method. The README's contributor prerequisites (Visual Studio, .NET SDK 8.x to 10.x, Node.js 24.x) are build requirements for working on the project, not for using it, and are not recorded as runtime requirements. The README says the project continues as a community-driven project and that its releases are not on a regular cadence. The homepage describes docfx init to create a project and docfx followed by the project file to build it, with --serve for a local preview.
