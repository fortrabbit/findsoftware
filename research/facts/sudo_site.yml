notes: >
  The repository has no GitHub release or tag, so lastCommitDate carries the date. The CSV names the jamstack.org generator directory page as homepage; a directory is discovery only and the README names no project site, so no homepage is recorded. The README gives the developer as Sharad Raj; the LICENSE copyright line gives Sharad Raj Singh Maurya, and the LICENSE form is recorded. The README links a demo site and a demo repository, which are examples, not recorded. The README says all libraries are supplied with the repository so no other dependency is installed. It says a GitHub Actions workflow can build and publish the site, that it can push to any repository, and that the documentation is in progress. The README gives no runtime, so only the language is recorded.
