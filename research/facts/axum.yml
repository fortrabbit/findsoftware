notes: >
  No project website is named; the repository is the only page the project names, so no homepage is recorded. The crate documentation (src/lib.rs, rendered on docs.rs) shows the Cargo dependency line for axum. The Discord link in the README leads to the Tokio Discord server. The highest stable release of the axum crate is axum-v0.8.9 (2026-04-14); the README says the main branch is working toward axum 0.9 with breaking changes, and points to the 0.8.x branch for what is released to crates.io; 0.9 is not recorded as a successor. The crates.io figure is the crate's total downloads. The LICENSE copyright line names "axum Contributors"; neither the READMEs, CONTRIBUTING.md nor Cargo.toml name the Tokio project or a legal entity as maintainer, though the repository sits in the tokio-rs organization. The first release is the oldest GitHub tag, axum-v0.4.1 (2021-12-06), and the crate itself was created on crates.io in 2021. The rust_version 1.80 in the crates.io record for 0.8.9 agrees with the README's MSRV.
