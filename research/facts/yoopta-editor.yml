notes: >
  Status stub: the CSV homepage yoopta.dev answers 402 with "DEPLOYMENT_DISABLED" on every path tried, so no homepage is recorded and the record stays a stub. The docs at docs.yoopta.dev answer 200 and are recorded as docs; a homepage that answers 200 would settle the status. The repository is the only other source: MIT licensed, active on the default branch, npm package @yoopta/editor installable (criterion 2 and 3 met). The README links an AI app builder, Yoo AI at ai.yoopta.dev, described as built on Yoopta Editor; it is a separate product and not recorded. Collaboration runs through the @yoopta/collaboration package and Yjs; that is a package, not a field. The docs say the editor is headless with optional themes (shadcn, Material in progress); the headless or styled kind stays in notes. The quickstart lists React 18+ and the Slate peer dependencies (slate, slate-react, slate-dom); these are requirements, not a runtime, so runtime and runtimeMin stay out. The npm figure counts @yoopta/editor only; the repository holds the plugin, theme and UI packages, so its stars and contributors belong to the monorepo. GitHub shows 48 releases; the highest stable release is v6.0.2, and npm's 6.0.5 is newer, so latestReleaseDate follows the registry. The maintainer is the LICENSE copyright holder; the README's contact links are the author's personal accounts and are not recorded. Dependent figures are ecosyste.ms counts as of 2026-11-17.
