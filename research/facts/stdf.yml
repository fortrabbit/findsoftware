notes: >
  The README reads "One shared design system. Three framework-native mobile component libraries." and names STDF for Svelte, RTDF for React and VTDF for Vue; the repository is the monorepo for all three and for the shared core. The CSV homepage any-tdf.dev is the Any TDF family site (Chinese text, one site for the Svelte, React and Vue libraries); stdf.dev is the STDF product site and is used as homepage; the reviewer decides. The repository moved from dufu1991/stdf (the GitHub redirect resolves to any-tdf/any-tdf). The sources name Any TDF as the family and STDF as the Svelte package; no "X is now Y" statement for STDF was found, so the name stays STDF. The npm figure is the stdf package the install command names; the npm weekly figure is 17. firstRelease is the oldest release in the same repository, not of the stdf package. The install routes are bun add stdf, which installs from the npm registry, and the scaffolder bun create any-tdf. The repository has no LICENSE statement beyond MIT and the copyright line; the funding links (PayPal, Buy Me a Coffee) are not recorded. The stdf.dev page text is a title only in the static HTML.
