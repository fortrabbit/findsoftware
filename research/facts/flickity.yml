notes: >
  The GitHub API reports no license for the repository and the repository holds no LICENSE file; the license is stated in package.json ("GPL-3.0"), the npm metadata, the README and the license page, which together give the GPLv3 open source option and a commercial license, recorded as two license entries. The license page sells Developer, Team and Organization commercial licenses and an OEM license by contact; no prices are recorded, and the agreement names Metafizzy LLC as the party, while the GitHub profile and the homepage say Metafizzy. The company's about page gives "Alexandria, VA" with no country, so hqCountry is left out. currentMajor is 3 from npm: the registry's latest version is 3.0.0, published 2022-03-05, which has no GitHub tag or release; the highest GitHub release is v2.3.0 (2021-12-19), and the homepage, the README and the CDN paths all document the 2.x line. latestReleaseDate is 2022-03-05 from the registry, the newest stable release by date. The import's four-year rule will move this record to stub, since no stable release is newer than 2022; the status stays accepted here as the CSV row has it. The npm figure counts the flickity package, which the install docs name. The CSV row gives an older npm weekly figure; the value here is the one the range endpoint returned for 2026-11-01 to 2026-11-07. No page read says the carousel runs in the browser, so runsAs is left out; the README's "Initialize with jQuery" option is a usage mode, not a parent, so basedOn is left out. The metafizzy.co site links the Flickity homepage and the company runs a newsletter there, which is the company's newsletter and not Flickity's. firstRelease is 2015 from the annotated tag v0.1.0 (commit date 2015-01-20), older than the first GitHub release v1.0.0 (2015-09-01). Contributors are the count of the contributors endpoint's last page, 17.
