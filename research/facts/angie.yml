notes: >
  The OIDC configuration guide shows how to protect a site's endpoints with Lua scripting and Google as identity provider; it is an example setup, not a login feature of Angie, so no sso fact is recorded. The About page calls the license a "BSD-like license"; the repository LICENSE file is the two-clause text, so one BSD-2-Clause entry is recorded. The repository's LICENSE also carries "Copyright (C) 2011-2026 Nginx, Inc." and "Copyright (C) 2002-2021 Igor Sysoev" for the inherited nginx code. The Russian legal name is ООО "Веб-Сервер", recorded in English as Web Server LLC; the legal name in the homepage meta and footer is Angie Software (ООО "Веб-Сервер"). The homepage says "Наша компания входит в группу Rubytech", recorded as parent; the group is not a separate record. The homepage also states that development, the full build and test cycle and code storage run on servers in Russia; this is not a field and is not recorded. The Russian homepage lists the company's ИНН and ОГРН; no page gives an English country statement, so hqCountry rests on "российская ИТ-компания". The homepage links a Telegram channel and support chat (t.me/angie_software, t.me/angie_support); no field takes Telegram. The docs say the open-source edition "Includes most capabilities of nginx 1.31.2" and list nginx-compatible modules; compatibility is not a field. Angie ADC, the Angie Ingress Controller (ANIC) and the console at console.angie.software are separate products and get no record here; Console Light is described as a "visual monitoring tool" and is not recorded as adminUi. The Angie PRO binary packages sit in a private repository behind a contract and a license; that is the paid install route, not recorded as an installMethod of the open-source edition. The Angie PRO product page states the commercial license and that cost is available only on request, so no pricing page is recorded. Version history from the GitHub release list runs from Angie-1.0.0 (2022-10-26) to Angie-1.12.4 (2026-10-16); the minor line 1.12 is kept here, currentMajor holds the major only. The docs' Docker images are at docker.angie.software, not Docker Hub, so no Docker Hub pull count is recorded. The project's own news reports patch releases in October 2026 for vulnerabilities found in nginx; releases continue, so no end signal. Fields coined here: none.
