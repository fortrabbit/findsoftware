notes: >
  The README says "We build it with ASP.NET Core and CQRS", which names the build stack rather than a framework the software extends, so basedOn is not recorded. The homepage says "powered by blazing-fast .NET 10", while the README lists ".NET 8 SDK" as a prerequisite for development; runtimeMin records 10 from the TargetFramework of the Squidex project file in the repository, which matches the homepage and the Q2 2026 release post ("an upgrade to .NET 10"); the README prerequisite list still says .NET 8 SDK and is stale. The release list of 119 GitHub releases starts with v1.15.0 in 2019, which sets firstRelease. The homepage footer lists Twitter, LinkedIn, GitHub and Medium after "Follow Us"; the Twitter link is recorded as x. The features page documents localization, workflows and a CLI that exports and imports content as CSV. The legal page names the company Squidex UG with the German limited form "haftungbeschränkt" (written with an HTML entity, so the quote stops before it); the terms spell it "haftungsbeschränkt". The maintainer value is the name as the page gives it. The homepage and the cloud terms describe Squidex Cloud, a SaaS version at cloud.squidex.io, the hosted part next to the open source software; no prices are recorded. The LICENSE copyright line names Qaisar Ahmad and Sebastian Stehle; the README names Sebastian Stehle as core team and founder. The legal entity is recorded as maintainer. The docs site is GitBook and its install pages name Azure, AWS, GCP, Heroku, IIS, Kubernetes, Render and Vultr as deployment targets; those are not recorded as fields.
