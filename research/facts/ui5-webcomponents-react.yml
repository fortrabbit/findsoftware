notes: >
  The documentation site is a Storybook application that renders in the browser, so no homepage quote could be read; the homepage is the repository homepage field from the GitHub API, and the docs source docs/Welcome.mdx in the repository was read for the facts. The README and the docs name @ui5/webcomponents-react as the main package of a monorepo, and its figures come from that package. The README states React 18.0.0 or higher and Node.js LTS as requirements; no runtime is recorded because they describe the project's build and consumer tooling. The README says support for version 1.x ended on July 1, 2025, which is a version line, not an end of the project; releases continue on 2.x. The charts package of the same repository is deprecated by its README and is not a record of its own. The npm dist-tag next (2.11.0-rc.0) is older than the latest stable release, so no latestPrereleaseDate. The homepage of the SAP-maintained site and the legal notice were not read, so hqCountry is unknown.
