notes: >
  The README says the SDK connects to Centrifugo or any Centrifuge-based server using pure WebSocket or one of the alternative transports (HTTP-streaming, SSE/EventSource, experimental WebTransport) from web browser, React Native or Node.js environments. That spans several environments, so no runtime and no runsAs is recorded. WebSocket is the main transport; the HTTP-based fallbacks use the server's bidirectional emulation layer, which "must be first enabled on a server-side". By default the library works with JSON only, and a separate Protobuf build sends binary payloads. SockJS usage is marked DEPRECATED in the README. Compatibility with Centrifugo v4 to v6 and Centrifuge 0.25.0 or later is stated in the README and is not a field. The README names Centrifugo and Centrifuge as the servers the SDK talks to, which is no basedOn statement. The SDK is distributed as the centrifuge package on npm, and the npm figure counts that package. firstRelease is 2015 from the npm upload of version 0.5.2 on 2015-01-22, earlier than the oldest GitHub release (2.0.0, 2018). The homepage is the Centrifugo project site, and its x, discord and youtube links are the Centrifugal project's accounts, shared with Centrifugo. The footer also lists Telegram and LinkedIn links; they are not recorded (no field). Paid Pro features belong to the Centrifugo server, not to this SDK, so no paidEdition is recorded.
