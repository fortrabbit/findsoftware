notes: >
  Accepted: the project's own site (videojs.org) calls Video.js a free and open source HTML5 video player and says "Now rebuilt in v10 for modern development and performance"; the README says "Video.js v10 is stable." The repository is a monorepo: the npm figures are for @videojs/core, the package the README badge names; the install docs have users add @videojs/react (React) or @videojs/html (HTML, Vue, Svelte), and the unscoped video.js package only points installs to those two and carries the older 8.x line in its dist-tags, with a weekly figure of 1587214 (2026-11-01 to 2026-11-07) that mixes both lines, so it is not recorded. ecosyste.ms gives no dependent counts for @videojs/core. The current major is 10 (video.js@10.5.0, published 2026-11-16 as the latest stable release); the 8.x line remains on npm under the dist-tag latest-8 and in v8.x tags, and its migration is covered by a guide on the docs site, so the 8.x line goes here, not in currentMajor. The npm first upload is 4.1.0 (2013-08-21); the oldest tag found on GitHub is v2.0.3 (commit 2011-06-16), which sets firstRelease. The Corporate Shepherd role on the site is held by Mux, which sponsors video hosting and streaming; the help page says Video.js is built at Mux, which is recorded as parent; no hosted offering of the player is recorded. The support page offers enterprise-grade support by Mux and community support with no promises, which is not a forum. The site footer states that the term VIDEO.JS is a registered trademark of Brightcove Inc. The docs name the Plyr, Vidstack, Media Chrome, Mux Player, Video-React and Video.js 8 migration guides; only Plyr and Vidstack have fact files, so the others stay in notes. The Video.js 10 docs describe a React and an HTML route; the HTML guide names Vue and Svelte as framework routes through @videojs/html, which are not recorded as separate installMethods. The LICENSE copyright line names Video.js contributors, so the maintainer is recorded as that. The GitHub owner is the videojs organization. The README's Discord link is the project's own chat and its GitHub Discussions link is the forum. The migration guides state that v10 is a ground-up rebuild and not a drop-in upgrade; the guides for Plyr and Vidstack are recorded as importsFrom, and the Vidstack guide says the teams behind Vidstack, Plyr, Media Chrome and Video.js now focus on Video.js, which is no succession sentence, so successorOf is not recorded. Video.js 10 is the maintained line; the 8.x line is covered by its own migration guide.
