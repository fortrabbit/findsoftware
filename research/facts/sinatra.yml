notes: >
  The homepage sinatrarb.com answers over https and is the project's own site. The repository publishes no GitHub releases; its highest stable tag is v4.2.1, which matches the RubyGems latest version 4.2.1 (created 2025-10-10), so currentMajor is 4 from the registry-matched stable tag. Firstrelease is 2007: the oldest tag 0.0.1 has a commit date of 2007-09-08, which is earlier than the oldest RubyGems upload (0.9.1, 2009-07-25) and the changelog's first dated entry (1.0, 2010-03-23); the tag commit date is the only source for the 2007 year, so the reviewer may prefer the registry year. The maintainer is recorded from the gem's authors list as the registry states it; the LICENSE file names copyright holders (Blake Mizerany, Konstantin Haase, Zachary Scott), and the homepage names no legal entity. The runtimeMin quote is the README's statement about Sinatra 4.0.0 and is the only minimum the README states; the 4.2.1 gemspec also requires 2.7.8 but that is a repository file, not a page. The README names Rack and Tilt as direct dependencies; no basedOn is recorded because the README does not state a parent project. Discord and the Google Group mailing list come from the README's community list; the homepage nav links the same Discord invite. The template list is the README's list of supported template languages, recorded as one templating entry. Downloads are the RubyGems total for the gem named in the install docs.
