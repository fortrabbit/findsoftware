notes: >
  Boundary ruling for wave 62: ky is an HTTP client, a helper library, so the row is accepted; the CSV boundary state is not a record status. No homepage: the project has no site beyond its repository, and the README is the only documentation, so the docs fact is absent too. The npm package named ky has an upload dated 2016 by another author (version 0.0.0), so firstRelease comes from the oldest GitHub tag, v0.2.0 on 2018-09-04; the npm version 0.1.0 is dated 2018-05-06, in the same year. The README's install section names npm and lists CDN links (jsDelivr, unpkg, esm.sh) under a CDN heading; the Deno usage sentence names the CDN route, so cdn is its own installMethod entry. The package.json engines field at v2.2.0 says node 22 or later and the README's Node.js support section says the same; the browser library ruling applies, so no runtimeMin is recorded. The README says Ky treats non-2xx responses as errors by default, retries failed requests for a default list of methods and status codes, notes that Chromium retries 408 responses at the network layer too, makes instances with extend and create, and runs hooks at init, beforeRequest, beforeRetry, beforeError and afterResponse. The benefits list also names method shortcuts, a JSON option, timeout support, upload and download progress and a base URL option. It states it has no dependencies, validates responses with Standard Schema validators, ships TypeScript types and reads retry timing headers; these are features, not fields. The FAQ questions "How is it different from got" and "from axios" are the project's compare statements, recorded as alternativeTo for both. The README's maintainer list names Sindre Sorhus, Seth Holladay and Szymon Marczak; the LICENSE line names Sindre Sorhus only, so the maintainer is Sindre Sorhus. The npm figure counts downloads from the npm registry for the package named ky. Stars and contributors are for the repository; contributors counts the last page of the per-page-1 listing. The latest stable release is v2.2.0; the v2.0.0-0 prerelease of 2026-03-29 is older than it and is not recorded.
