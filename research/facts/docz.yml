notes: >
  The repository the npm package names is archived (archived flag from the GitHub API, last push 2025-11-21), which is a discontinued signal that outranks the dead homepage. The homepage docz.site now serves an unrelated page, so no homepage is recorded. The npm package names the repository doczjs/docz, which redirects to pedronauck/docz (same repository id). The highest stable GitHub release is v2.4.0, matching npm latest. The README names GatsbyJS as the base and says react and react-dom must be installed by the user; no Node requirement is stated on the pages read, so runtime is not recorded. The docs site and its installation page were not reachable; the README is the only project page read.
