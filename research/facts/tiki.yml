notes: >
  The project's documentation at doc.tiki.org answers 403 to curl, so the installation and requirements pages were not read; the install steps come from the INSTALL file in the repository, which names doc.tiki.org for more detail, and no docs field is recorded. The composer.json.dist file pins "php": "8.1" under config.platform, which is a dependency-resolution setting and not a minimum, so it is not used. runtimeMin comes from tiki-check.php, whose requirements table lists 8.1.0 as the PHP minimum for the row named Tiki 30.x. The docs source is not public: doc.tiki.org is Tiki's own wiki, not a repository. The GitLab API reports no license for the project, so the license facts come from the files named. The copyright.txt file says "as of version 31.0vcs", the master branch is ahead of the current LTS line (30.x, whose version file reads 30.2vcs), and the current major is recorded as 30 from the download page. The candidate row has no repository; the GitLab repository tikiwiki/tiki is the source named on the project's homepage. gitlabStars is a coined field for the GitLab star count (the import does not read it yet), and the project reports 251 forks, not recorded. The README says the project started in 2002; that is a start year, not a first-release year, so firstRelease is not recorded. The legal notice names the association without a legal form, so the maintainer is recorded as the project states it. The tag 30.1 is listed by GitLab as tags/30.1. The README lists wiki pages, trackers, file galleries, forums, blogs, articles and calendars as built-in features, and the repository description says Tiki is community-managed, with open development pursued by the Tiki Software Community Association; neither has a field. The INSTALL file runs setup.sh to set permissions before the browser-based setup, and the not-for-profit statement comes from the homepage.
