notes: >
  No homepage: the repository has none and the README links no site of its own, so the record is repository only. The README's "Update 2016-11-13: Future versions" section says progress toward v2 slowed and that v2 was tagged from master; the Versioning section says "Development is not very active right now". Neither is an end statement, so the status stays accepted; the newest release is v3.0.1 (2019-11-27) and the last commit on main is 2024-11-19, so the four-year release rule moves the record to stub on import. The README says "I hesitate to call gorp an ORM"; the categories follow the repository description, "an ORM-ish library for Go". The README says Oracle and SQL Server "are not covered by CI" and that the maintainers "have no good way to test them locally"; both sit in the databases entry with that caveat. The LICENSE copyright line names James Cooper; the GitHub organization is go-gorp, and the README names individual maintainers only by GitHub handle. The README says the package is guaranteed compatible with the latest 2 major versions of Go; runtimeMin is the go.mod go line at the latest tag. The docs entry is the pkg.go.dev reference the README badge links; no further docs site exists. The README lists binding of struct fields to columns by tag or API, struct embedding, transactions, pre and post insert, update and delete hooks, optimistic locking through a version column, and CreateTables for unit tests. Raw SQL can bind to structs and slices with positional or named parameters. SQL for insert, update, delete and get is generated through the Dialect of each database, and the Dialect interface is implemented per database vendor, and the README says Postgres needs $1 placeholders in raw SQL. The README says "I hesitate to call gorp an ORM" and that gorp does not know the relationships between structs.
