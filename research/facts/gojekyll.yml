notes: >
  No homepage: the repository's homepage field is empty and the README names no site. The README says the project implements Jekyll "as documented, not port its source code", so no basedOn is recorded, and alternativeTo Jekyll is recorded from the README's own comparison and its "clone" statement; the reviewer decides whether that relationship belongs in alternativeTo. The docs folder holds plugins and benchmarks pages; the README is the install and usage page and was read in full. The Sass handling needs dart-sass on the PATH, and using a theme needs Ruby and bundler, per the README install steps. The serve command generates pages on the fly and does not write to the file system. The README's Jekyll compatibility table marks the project partial, with pagination and a plugin system missing. The go.mod directive (go 1.25.0) is a repository file, not a page or registry, so runtimeMin is left out. The README's contributor badge counts 15; the contributors endpoint counts 8 and is recorded. The oldest GitHub release is v0.1.0 (2017-07-17), a prerelease, and the highest stable release is v0.3.1 (2026-02-27).
