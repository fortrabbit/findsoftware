notes: >
  Hosted-service: the product is a hosted headless CMS (criterion 2 waived), and the pricing page and the terms both describe it as a service run by FAST WEB. The homepage links the GitHub organization suncel-io, which holds the starter and SDK code; per the wave rule nothing from it is recorded. The Enterprise plan on the pricing page offers "on premise installation" only through a contact address, which documents no install, so selfHostOption is not recorded. The developer docs describe the API as JavaScript fetch functions (GetPage, GetPages, GetGlobal and similar) returning a result object, and state no REST or GraphQL endpoint, so headlessApi is not recorded. The docs say the front end is built with Next.js and the SDK is @suncel/nextjs, which the docs describe as a package the project works with, not as software it is built on, so basedOn is not recorded. The terms name a French company with the legal form "a French corporation" and no commercial register number is recorded. The pricing page lists a free plan and paid plans by locales and history versions; the figures are prices and are not recorded. The FAQ says the content exposed through the API is stored by Suncel while the Next.js application is hosted by the project owner, and that importing existing data is not possible; the newest blog post is dated April 2023, which is no end signal. The docs version shown is "Suncel v1.1", which is a documentation label and not a release major, so currentMajor is not recorded.
