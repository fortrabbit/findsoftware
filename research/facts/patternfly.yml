notes: >
  The repository holds the HTML and CSS library; the React library is a separate repository, recorded as patternfly-react. npm figures are for @patternfly/patternfly, the package the develop page installs for HTML/CSS. The homepage footer reads "Copyright © 2014- 2026 Red Hat, Inc."; the LICENSE copyright line reads "Copyright (c) 2019 Red Hat, Inc.". The GitHub release list holds the earliest release of 2018-05-04, read from the releases API, so firstRelease is 2018. The develop page says Font Awesome is included by default as part of the PatternFly CSS file, labels it legacy and recommends Red Hat icons instead. The site links a community Slack and a Medium blog, which have no field in the starter list. The X link in the homepage footer carries no text naming it, so it is not recorded. hqCountry is the address of Red Hat, LLC on the Red Hat terms of use page. The highest GitHub release v6.7.0 is the major counted; prereleases such as prerelease-v6.7.0-prerelease.5 are not.
