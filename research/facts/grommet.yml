notes: >
  The documentation site at v2.grommet.io/docs and the install route on grommet.io return only a JavaScript shell to curl, so the install instructions were read from the README. The README install block names grommet with styled-components, which the package manifest lists as a peer dependency with React 16.6 to 19 as peers, so both are needed. The homepage is the source for the x link and the category wording. Grommet Designer and Grommet Themer, linked from the homepage, are web tools and were not read, so no hosted-service facts are recorded. The first GitHub release is 0.1.0 dated 2015-05-02, earlier than the npm 0.2.0 upload. The copyright line is an SPDX notice in COPYRIGHT.md, which names the holder as Hewlett Packard Enterprise Development LP; the homepage shows an HPE logo without a legal line, so parent is unknown and hqCountry was not read. The homepage also links a Slack invitation, which has no matching field. The LICENSE is Apache-2.0 from the repository API.
