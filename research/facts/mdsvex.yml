notes: >
  The repository is a monorepo (packages mdsvex, svelte-parse, svast, svast-stringify, svast-utils and others), so stars and contributors belong to the whole repository; the npm figure is the mdsvex package the install docs name. The docs also name yarn (yarn add --dev mdsvex), the same npm registry, so it is one route. The npm package has no readme; the homepage is a Svelte shell, and the /docs page is the readable source. The homepage the README links as mdsvex.com redirects to the homepage recorded here. The docs also link a mdsvex.pngwn.io address for extensions; it is not recorded. The docs say mdsvex is "Basically MDX for Svelte", a comparison with MDX that names no alternative, so no alternativeTo. No page states a Node.js runtime; the install is a development dependency of a Svelte build with rollup or webpack, so no runtime is recorded. The first npm upload is version 0.1.0 of 2019-01-09, the same day the repository was created. The latest stable release is the GitHub release of 0.12.8, the same version as the npm latest tag; the 1.0.0 line is published only under the next tag as prereleases, recorded as latestPrereleaseDate. The licence file copyright line names pngwn, the GitHub user that owns the repository. The docs say to add the preprocessor to the rollup or webpack config and tell the Svelte plugin or loader to also handle .svx files, and that any remark or rehype plugins can be passed as options. The docs Limitations section says a code block indented by 4 spaces does nothing in mdsvex, since indentation is common in XML-based languages. Besides the preprocessor, the module exports a compile function that turns mdsvex code into Svelte code without hooking into the Svelte compiler. The docs describe mdsvex as using unified, remark and rehype, which are its dependencies, so no basedOn for them.
