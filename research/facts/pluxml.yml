notes: >
  The project states two PHP minimums: the README of the latest release tag and the homepage both say "PHP 7.2 ou supérieur"; the README on the default branch (the 5.9 development line) says "PHP 5.6.34 or higher until PHP 8.1.2". runtimeMin records the latest release's minimum. The maintainer is recorded as the about page names its team: the page lists current and past staff by name and states no legal entity, so no legal form is recorded. The LICENSE copyright line in the repository is the Free Software Foundation text for the GPL and names no project owner. The homepage is served over HTTPS at pluxml.org. The installation steps are taken from the homepage text only; the wiki was not read for them.
