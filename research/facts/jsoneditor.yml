notes: >
  The successor svelte-jsoneditor is named in the README under "Successor" while the README still describes this library as usable, so it is recorded here as a note, not as a status: the successor's record would carry successorOf jsoneditor. The homepage is jsoneditoronline.org, the web application the README says the library was developed in; the npm homepage field names it and the repository names no site of its own, so the reviewer should confirm it as the project's site. The repository has no GitHub releases and its git tags, from 2012, are not releases; currentMajor and latestReleaseDate come from the npm latest version 10.4.3, and firstRelease from the first npm upload (2013). The README lists browsers (Chrome, Firefox, Safari, Edge) and says the editor "can be used as a component in your own web application", but no sentence says it runs in the visitor's browser, so runsAs and runtime are absent. The README names JSON schema validation through ajv, JMESPath queries, Ace-based code mode and the document size limit in its feature lists; these are notes, not fields. The Apache 2.0 license is stated once in the README and the LICENSE file has no copyright line, so the maintainer comes from package.json. The README asks commercial users for voluntary sponsorship; that is no license term or paidEdition.
