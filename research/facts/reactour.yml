notes: >
  Monorepo: the repository holds the packages @reactour/tour (the main package, which the install docs name), @reactour/mask, @reactour/popover and @reactour/utils, plus the docs app. Stars and contributors belong to the monorepo. The registry figures are for @reactour/tour, the package the quick start installs; the npm package named reactour is the earlier line, its docs say it is now on branch v1, and its last publish was 1.19.4 on 2024-05-31. That is a move to the scoped package, not an end, so the status stays accepted and the v1 package has no fact of its own. Its 2026-11-01 to 2026-11-07 weekly total was 88220 downloads, not recorded. The GitHub release object 3.0.0 (2022-08-12) is the highest release object and has the same major as the newest npm stable 3.8.0 (2025-05-07). The React basedOn fact rests on the homepage sentence "Tourist Guide into your React Components"; the README says the same ("travel into your React Components"), and the npm peer dependency on react is not a basedOn statement. The maintainer is the LICENSE copyright line, Lionel Tzatzkin; the npm author field reads Lionel T. The homepage footer links the author's personal X account, which is not recorded as the project's x. The docs welcome page says the project began in 2017 as an attempt to simplify the logic of intro.js with React components, which is recorded as alternativeTo intro-js. The README says the main package uses the other packages to highlight parts of an application from an array of steps; the quick start puts a TourProvider at the application root and opens the tour with a useTour hook.
