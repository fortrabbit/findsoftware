notes: >
  Framework, so contentStore, databases, adminUi and headlessApi do not apply. firstRelease 2016 is the npm creation date of @angular/core; the footer's ©2010 likely spans AngularJS, whose relationship (successorOf) no page read here states. The deployment page lists deploy builders added with ng add, several of them third-party (angular-cli-ghpages, @netlify-builder/deploy, @jefiozie/ngx-aws-deploy). It does not name the server and browser subfolders of dist or the SSR start command, so those are absent. The release page says majors moved from a six-month to a 12-month cycle from v22. renderingModes are set per route with RenderMode.Server, Prerender and Client. contributors is the GitHub API count including anonymous contributors; downloads cover 2026-10-10 to 2026-10-16.
