notes: >
  Status stays accepted: the latest release and the last push (2026-10-17) are both recent. The maintainer comes from package.json, the LICENSE file has no copyright holder line. The homepage and README say CountUp.js "supports all browsers", a browser support statement, so no runsAs is recorded; it names no runtime. The README lists framework wrappers (Angular, React, Svelte, Vue, WordPress plugin, jQuery, custom element) and an Odometer plugin; these are not basedOn statements. The homepage says the package is installed "via npm/yarn"; yarn is the same registry, so one npm installMethod. The UMD script is shipped in the package, not on a CDN, so no CDN installMethod. The repository has releases from 2014; the oldest tag is 2014-01-23.
