notes: >
  Accepted, as the CSV row says; the Community edition (Apache-2.0, README) is a self-hostable database workspace, categorized db-admin like Adminer. The homepage has become the WhoDB Platform sales page ("Data Platform for Lineage, Pipelines & AI"), with WhoDB Cloud and a Managed Private deployment; the README still describes the open-source part as "A lightweight, self-hosted workspace for your databases". The record follows the README for the open-source product and records the cloud as hostedOffering. Hosted plan tiers (Free, Start at $20, Pro at $200 per member per month, Enterprise custom) are on the pricing page; no prices are recorded, and the plan features are not paidEdition. The Platform edition's features (shared projects, more data sources, SSO, fine-grained access controls, audit logs, pipelines, reporting, internal apps) are named in the README; only the SSO item is quoted. The vendor compare pages (WhoDB vs Palantir, Fabric, Databricks) name products outside this dataset and are not recorded as alternativeTo. Clidey, Inc. is the legal name from the privacy notice ("Clidey, Inc." contact block; "© 2026 WHODB / CLIDEY, INC." on every page); the privacy notice carries a Cheyenne, Wyoming postal address, which may be a registered-agent office, so hqCountry is not recorded. The GitHub owner clidey is an organization. The npm package @clidey/whodb is the CLI named by the install docs (version 0.138.0 matches the release), and its weekly downloads count the CLI, not the Docker image; its engines field says node >=14, which is not the runtime of the server. The Docker pull count is the clidey/whodb image named by the README quick start. currentMajor is 0: the highest stable release is 0.138.0 and the project has not reached 1.0. Source build needs Go 1.26.1 or newer (docs installation page); that is the build toolchain, so runtimeMin is absent. Community Edition connection profiles are shared with everyone who can reach the instance (docs warning); recorded nowhere as a field. The README's AI providers (Ollama, LM Studio, OpenAI, Anthropic, Gemini) have no field; not recorded. The forum field is the GitHub Discussions page the README names. The CLI README (cli/README.md) was read: its native installer, Windows PowerShell installer and Homebrew formula install the CLI, not the server, so they are not installMethod entries; the npm entry follows the README's own install line. Fields coined: none.
