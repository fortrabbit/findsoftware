notes: >
  The homepage and README say the project is "Under heavy development now" and "still under heavy development", a project statement that is not an end signal, so the status stays accepted. The GitHub releases list has one release, 0.7.1 (2016), while the tags and the npm latest reach 0.8.2 (2020-07-05); the npm date is recorded as the latest release. The license is stated on the homepage and the README; GitHub reports no license and the repository has no LICENSE file. No docs page states that the built output is static files, so runsAs and renderingModes are left out. The docs pages read are the quickstart and the GitHub Pages guide.
