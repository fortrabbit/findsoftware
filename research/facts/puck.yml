notes: >
  Boundary question from the CSV settled as editor library, not CMS: Puck renders the page data an app passes it and leaves saving to the app ("Save the data to your database"). Puck Cloud (cloud.puckeditor.com) runs the Puck AI features next to the open-source package, under its own terms (puckeditor.com/terms, Puck Technologies, Inc.); its plans are on the pricing page and are not recorded. The npm figure is for @puckeditor/core, the package the install docs name; create-puck-app is a scaffolder. The homepage's own "13k+ GitHub stars" and monthly download figure are not recorded; the registry figures are. currentMajor is 0 because the highest stable GitHub release is v0.23.0. The maintainer is named from the Puck Cloud terms; the MIT LICENSE copyright line names "The Puck Contributors", which is not recorded as the maintainer.
