notes: The homepage says "v1.0 is now live", but the highest stable GitHub release is v0.6.9 and the repository has no v1.0 release; currentMajor follows the releases, so it is 0. The repository holds FormCMS, the .NET server, and the readme says FormMate, the Node.js (Fastify) admin app, lives alongside it; the wiki setup guide names a separate formmate repository and lists Node.js 20+ and the .NET 10 SDK for development, and the Docker guide puts both behind one gateway in a single container. The Docker image is published under a personal Docker Hub account, and the production PostgreSQL setup is on that Docker Hub page, which is not a primary source, so it is not cited. The first release is v0.0.6 of 2024-08-15, the oldest of the GitHub releases. The wiki pages are the docs and the readme links them. The GitHub user account lists a location; it is not recorded. The wiki says only Gemini has been fully tested for the AI features and OpenAI support is experimental. The same repository is listed as fluent-cms in candidates-other-languages.csv.
