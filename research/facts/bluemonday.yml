notes: >
  Go library with no project site: the repository is the only home, so no homepage. The README names OWASP Java HTML Sanitizer and HTML Purifier as inspiration, which is no basedOn statement. The README says the default policy (UGCPolicy) and the StrictPolicy ship with the library; neither is recorded as a field. Maintainer is the LICENSE copyright holder; the organization microcosm-cc owns the repository. Stars and contributors belong to the repository. The Go module proxy gives the dates: v1.0.27 is a tag with no GitHub release object, the newest GitHub release is v1.0.26 (2023-10-12). Go libraries have no download figure, so none is recorded. The repository has no install statement beyond the README line recorded as installMethod.
  The shipped policies are UGCPolicy, which allows a broad set of elements for user generated content, and StrictPolicy, which allows none; script and style are dropped unless the policy enables them, and the README asks that the sanitizer run after any other HTML processing.
