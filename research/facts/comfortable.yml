notes: >
  Comfortable is a hosted service; criterion 2 is waived. The JavaScript SDK comfortable-javascript (cmftable/comfortable-javascript, MIT, npm comfortable-javascript, first published 2018, major 1) is a client of the service, not the service, so its license, stars, contributors, npm figures and release dates are not recorded as the product's. The organization also holds comfortable-nuxt, comfortable-vue-blog and php-sdk. Images are transformed through imgix, stated on the homepage. The docs describe document drafts and version restore in the editor; that is not a live preview of unsaved changes, so livePreview is not recorded. The legal notice gives the registered seat in Bad Dürkheim with no country named; hqCountry DE comes from the GitHub organization location. The pricing page is rendered by script and shows only a FAQ in raw text, so no plan details are recorded. No SSO, SAML or import from named software appears in the 49 docs pages listed in the docs llms.txt. The homepage also links to Facebook and Instagram, which have no field.
