notes: >
  Material Design is the design language the framework follows, not software it is built on, so no basedOn is recorded. The about page says the fork was made because the original developers were inactive; that is the fork's own statement about the original, and the forkOf fact cites it. The npm package materialize-css belongs to the original project (materialize-dogfalo) and is not used here. The homepage version selector still lists 2.2.2 as latest; the GitHub release 2.4.0 is newer and is the one recorded. The GitHub repository language is TypeScript, and the homepage says the project uses TypeScript. Gitter is the project's chat room and is not recorded as a forum. The HTTP Archive technology "Materialize CSS" (5010 mobile origins) covers both this fork and the original, so no httpArchiveSites figure is recorded for either. The first release year comes from the first npm upload of the package the install docs name; the repository was created in 2020. Contributors counts contributor accounts from the API with per_page=1, read from the last page link.
