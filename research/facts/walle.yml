notes: >
  Repository meolu/walle-web (Apache-2.0, Python), homepage walle-web.io and the 2.x install docs, read 2026-10-28. Highest stable release is v2.0.1 (2019-04-16), so latestReleaseDate is over four years old; the import moves the record to stub, status stays accepted here. The alpha tag is dated 2018-12-09 and is older than the latest release, so no latestPrereleaseDate. firstRelease 2015 is the author date of tag v0.8.0 (2015-11-01); the GitHub releases for v0.8.0 to v1.0.0 were published on 2016-01-24, and the repository was created 2015-09-11. Runtime conflict: the dependency page says "Python 3.5+ 和 Python 2.7+", the installation page says to install Python 2.7 with pip, and the README roadmap lists "Python 3.7+兼容" for 2.0.1; no runtimeMin is recorded. Operating system: the dependency page says Linux with Bash, git and ssh, and that it does not support Windows and should not be installed on a Mac. The installation page says the service must be deployed inside an intranet ("务必部署在内网！"). The architecture page says the host must hold SSH keys trusted by the code host and by every target machine; deployment runs through SSH. The homepage lists deployment requests with review, a real-time websocket console, rollback, roles and notifications. The Docker page says the Docker version was contributed by a community member and uses community images (alenx/walle-web). The homepage meta description names "walle 瓦力数字科技有限公司"; no record of a company is made because the homepage does not name it as owner, and hqCountry is not stated by any page read. The About page says the maintainer runs a data platform at another company; that is not recorded. The Gitee mirror and the Weibo link are not facts. The README names the maintainer's WeChat as 吴水永, the name the LICENSE gives as wushuiyong; the reviewer decides which form the record shows.
