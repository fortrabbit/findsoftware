notes: >
  Two license statements, recorded as two entries: the repository's LICENSE file and the README name the Elastic License 2.0, and the documentation's Software License Agreement, which names Frain Technologies Inc. as licensor, grants internal business use only and forbids distributing the software to third parties. Both are current statements of the latest release; the hosted-service limit in the Elastic text and the internal-use limit in the agreement both apply. The LICENSE file's copyright line reads 2021-2024. Calendar versions (v26.9.2, the latest stable line) get no currentMajor; the line is recorded in notes only. The first release is v0.1.0 from 2021-09-07, the oldest tag with a GitHub release; the repository was created in April 2021. The homepage's JSON-LD names the organisation Convoy with a Wilmington, DE address and a parent organisation Frain Technologies; the footer shows 2261 Market Street, San Francisco. Neither address is recorded as hqCountry because neither is stated for the recorded maintainer. The Slack community invite on the homepage and README is not recorded as a field. The SDKs named in the README (Go, Python, JavaScript, Ruby, PHP, Java) are generated clients in the repository, and their package figures are not recorded. The pricing page names Community, Premium and Enterprise; prices are not recorded. The Helm chart route installs Bitnami Postgres and Redis by default for evaluation, per the Kubernetes page. The README names two components, server and agent. The Software License Agreement also forbids distributing the software to third parties (section 3.3). The README says "Add a license key to enable paid features on your own instance" and that the delivery queue can run on Postgres instead of Redis. Not record fields: linkedin https://www.linkedin.com/company/convoy-webhooks/ (https://getconvoy.io/).
