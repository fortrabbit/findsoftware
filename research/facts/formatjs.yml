notes: >
  Monorepo: the repository holds the FormatJS libraries, the Rust crates, the Python bindings and the Hermes SDK; the stars and contributors (337 across the repository) belong to the monorepo, and the registry figures come from react-intl, the package the installation guide names. The React binding is react-intl; the framework-agnostic core is @formatjs/intl, and the homepage says the libraries are built on ICU MessageFormat, Unicode CLDR and the ECMA-402 Intl APIs. The Vue (vue-intl) and Svelte (@formatjs/svelte-intl) bindings are notes only. The repository has no LICENSE at its root and GitHub reports no license; the packages carry their own license files and react-intl is BSD-3-Clause on npm. The LICENSE copyright line names Oath Inc. for react-intl and intl-messageformat; the homepage does not name a legal entity, and the maintainer is recorded as the copyright line states it for reviewer confirmation. The stable release line is react-intl 12.1.6 (2026-10-27) and the GitHub tag history is per package (react-intl@ tags); the latest GitHub release object for the monorepo is a different package. The runtime requirement quote is the Node.js line on the runtime requirements page; react-intl's package.json at the 12.1.6 tag declares no engines field. The Slack workspace linked from the README is a chat, not recorded as a forum. The homepage quotes "In production at" a list of companies; no count is recorded. The first npm version is 0.1.0-rc-1, uploaded 2014-06-19, and the repository was created 2014-04-24.
