notes: >
  The README says "Try it out at app.notifo.io"; the self-hosting page says "use the hosted version at app.notifo.io first", which is the hostedOffering quote. The homepage notifo.io is the product site of Squidex UG (haftungsbeschraenkt), Offenburg, Germany, per its legal notice (notifo.io/legal); the LICENSE copyright line names Qaisar Ahmad and Sebastian Stehle, and under the wave 46 rule the maintainer follows the LICENSE, so Squidex UG stays here and hqCountry is unknown for the recorded maintainer. The footer of notifo.io reads "2020 Squidex UG (haftungsbeschränkt)". The README says the project was "originally developed for the Squidex Headless CMS (squidex.io)"; that is a development origin, not basedOn. Coined fields: the channel list (email via SMTP, Amazon SES, Mailjet, Mailchimp; SMS; mobile push via Firebase; messaging via Telegram, Discord, Threema, WhatsApp; web via SignalR and web push; any HTTP webhook) and the embeddable JavaScript SDK (notification overlay for a web application, per the README); the pricing page charges per notification sent and is recorded here as the pricing model. The wiring that makes this an accepted end-user app is the REST API that a backend calls to create events (POST /api/apps/{appId}/events in docs/architecture.md) and the embeddable SDK; both are the project's own statements. Stars and the Docker pull count are adoption figures; the repository has no npm package recorded here. The last GitHub release is 1.3.0 of 2022-11-30 and the repository was pushed on 2026-09-20; the import keeps the record listed until four years after the last release, so it becomes a stub after 2026-11-30 unless a release lands; a reviewer should decide whether the last commit is a reason to keep it. The README line on OpenID Connect via OpenIddict is the token server library, not a protocol claim; sso records OIDC from the self-hosting page, which says the identity:oidc settings point at the operator's own identity provider. The Docker image squidex/notifo is the published install artifact (selfHostOption is a hosted-service field and is not recorded). The self-hosting page names Redis only for clustering, so it is not a database fact. The Docker Hub repository squidex/notifo was last updated 2023-01-25. The self-hosting page says a domain with TLS is effectively required, because web push and the embeddable SDK need a secure context.
