notes: >
  Coral is the open-source commenting platform of Vox Media. The embed attaches with a script tag: the page loads the server's assets/js/embed.js and calls Coral.createStreamEmbed on a div (docs Integrating on your site). The repository ships the server and client code; the installation page names the Docker image coralproject/talk and the GitHub repository. The Docker example in the installation page pins coralproject/talk:7 and mongo:4.2, while the current stable release is v9.11.8 (2026-07-07); the pinned tag is recorded as stated and not used for currentMajor. The installation page says "Coral requires NodeJS >=14" in the source section and "NodeJS ^18.16.0" in the requirements list and development page; runtimeMin comes from the engines field of the package.json at v9.11.8. The repository's GitHub license field reads NOASSERTION; the Apache-2.0 text is in the LICENSE file at v9.11.8 and in the docs FAQ. Vox Media separated into two companies on 2026-07-08 per voxmedia.com (Vox Media Group, LLC keeps the Coral privacy and terms pages' address at 1701 Rhode Island Avenue NW, Washington, DC 20036); which entity owns Coral is not stated, so hqCountry is not recorded and the reviewer decides. The docs footer and the homepage footer both name Vox Media. Features read from the docs and not recorded as fields: a GDPR data-export and deletion feature set (docs GDPR Compliance), webhooks (docs Webhooks), the Akismet and Perspective API spam and toxicity filters (docs FAQ), Google and Facebook social login (docs Social and Email Authentication), AMP and native mobile apps (docs), Slack moderation (docs). The homepage links a customer status page on status.voxmedia.com, which is the company's page, not the project's, and is not recorded. Single sign-on from the host site: the site signs a JWT with a secret from Coral's admin and passes it to the embed as accessToken; users are created and updated in Coral from it (docs/sso, docs/auth: 'your user database maintains the source of truth for all user information'). The admin sets a default language; the homepage says Coral is used in 23 languages; translations sit in the repository's locales folder.
