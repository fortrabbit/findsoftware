notes: >
  The README and Cargo.toml on main name version 0.8.5, which has no GitHub release or crates.io version; currentMajor and latestReleaseDate come from the highest stable release, v0.8.4, so the reviewer should check whether 0.8.5 is released. The installation page's source clone URL names github.com/rustyll/rustyll, which redirects to betterwebinit/rustyll, the repository recorded here. The README's logo URL is a placeholder and was not used. The README and the docs say Jekyll-compatible and the homepage describes migration guides, which are recorded as importsFrom; no parent software is named, so basedOn is not recorded. The README's maintainer credit is "A Better Web Initiative Project" and Cargo.toml names "Rustyll Team" as author; the Better Web Initiative is recorded as the maintainer, and the reviewer decides whether a legal entity is needed. The installation page calls Rustyll a Rust crate installed with Cargo. The deployment page body lists only the headings Manually, Automated and Third Party. The crates.io download figure is the total count the API reports at the time of the check.
