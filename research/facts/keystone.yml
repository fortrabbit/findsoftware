notes: "GitHub releases are tagged by date (latest 2026-08-31) while packages carry semver; the core package @keystone-6/core is at 8.1.0, so latestVersion names the package. Neither the npm engines field nor the docs state a Node minimum. The docs advise against SQLite in production. Keystone is free with no paid edition or hosted service found. The footer links X and a community Slack without exposing URLs in the fetched text. Coined here: startCommand, repoCreated."
