notes: >
  Status is accepted on criterion 3: the docs source repository htmlburger/wpemerge-docs (docsify, folders framework/ and starter/) holds the quickstart and a 0-to-100 setup guide, both with composer require htmlburger/wpemerge. The docs site docs.wpemerge.com serves an empty JavaScript shell, so the docs are read from that repository. License is stated two ways: the GitHub API reports GPL-2.0 and composer.json reports GPL-2.0-only; both are recorded as their own entries. The version is 0.x, so currentMajor is 0. The last push was 2023-07-13 and the last release 2022-04-16; release age is not a criterion, and no signal of an end (archived repository, abandoned package, a statement of ending) was found. Packagist lists htmlburger/wpemerge as not abandoned. The README also links two starter projects (htmlburger/wpemerge-plugin and htmlburger/wpemerge-theme), which are not candidates here.
