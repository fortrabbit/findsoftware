notes: >
  The repository is the rdme CLI, which the README describes as "ReadMe's official command-line interface (CLI) and GitHub Action". The hosted platform, which the record describes, is not open source; its own site and docs were read. The docs say the current CLI line (rdme@10) is for ReadMe Refactored and rdme@9 for projects not yet migrated, so currentMajor 10 applies to the Refactored platform. The npm package rdme reports 57288 downloads for 2026-10-12 to 2026-10-18. The GitHub repository has releases from 6.0.0 (2021-12-03) to 10.9.6, and the highest stable release is 10.9.6. The company is named "ReadMe" without a legal form on the pages read; the MIT LICENSE of the repository carries the same name in its copyright line. The privacy page is dated April 25, 2024. The docs page names Node.js 20 or later for running npx rdme in CI. The npm metadata gives node >=20.10.0 for the package. The GitHub contributors count is the count of the repository, not of the hosted platform.
