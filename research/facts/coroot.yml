notes: >
  The Community Edition and the Enterprise Edition run the same Docker Compose stack; the Enterprise edition is started with a LICENSE_KEY variable and is sold as a paid subscription priced per monitored CPU core (no prices recorded). The Kubernetes page installs the Community chart (coroot-ce) by default and an Enterprise chart (coroot-ee) separately. Wiring to applications: the node agent instruments containers with eBPF and exports traces and logs over OTLP/HTTP to the Coroot instance, and metrics in Prometheus format or by Prometheus remote write, per the node agent page. No code change in the application is documented, so the record is accepted on the node agent's documented export to Coroot. The Docker Compose stack also runs Prometheus and the cluster agent; Prometheus is not listed as a database. The first release is the tag 0.1 from 2022-09-06. The GitHub description calls it an observability and APM tool; the README heading is quoted instead. The terms name Coroot, Inc. and Delaware law; no country of headquarters is stated, so hqCountry is not recorded. The Enterprise license terms are not read. Not record fields: linkedin https://www.linkedin.com/company/coroot (https://coroot.com/).
