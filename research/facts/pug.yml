notes: >
  The homepage https://pugjs.org/ answers 200 with a JavaScript redirect to api/getting-started.html, so the getting-started page is the quoted source for install and the homepage is recorded as a link. The repository is a monorepo (pugjs/pug, packages/pug); the npm package pug is the one the install docs name, and its release tags are pug@<version>. The LICENSE in packages/pug holds "Copyright (c) 2009-2014 TJ Holowaychuk" and the package author field names the same person; the pugjs organization is the GitHub owner, and the README names no maintainer, so the maintainer follows the copyright line as the rule states. No legal entity or country is stated, so hqCountry is absent. The npm first upload pug 0.0.0 (2013-08-22) belongs to another project (its repository is weareflavor/pig, a Node.js ORM), so it is not used. The README states the project was formerly known as "Jade", and the jade npm package's first upload is 0.0.1 (2010-12-19) by the same author, which sets firstRelease to 2010; the first upload under the pug name is 0.1.0 (2015-12-12), a reviewer decision. The latest stable release is 3.0.4 (2026-03-13), matching npm latest; the canary 3.0.4-canary-8 is not a release. The README gives no Node.js version; runtimeMin 10 comes from the Pug 3 migration page, which says support for earlier Node versions was dropped. The README names Haml as an influence and lists ports in other languages (PHP, Java, Python, Ruby), which are not alternatives; its "Equivalents in other languages" section (Scaml, Slim, HAML) is recorded as alternativeTo for the two with records, and Scaml has none. The Pug 3 migration page says support for Node versions before 10.0.0 was dropped and that 10 would be supported until April 2021. The community support page names Stack Overflow (a tag, no forum) and links the project's Twitter account, recorded as x. The docs site nav links an unrelated coin news site, not recorded. The Express page says Pug integrates with Express as a supported view engine; that is a compatibility statement, not basedOn. The docs nav's "React Integration" links to pugjs/babel-plugin-transform-react-pug, a separate project, not recorded. The README links a Gitter chat room and Tidelift professional support; chat is no forum field and support is no paidEdition. Stars and contributors come from the default branch's API; the contributor count reads the last page of the per_page=1 listing.
