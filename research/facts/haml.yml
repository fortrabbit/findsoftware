notes: >
  The homepage haml.info answers over https with 200; its download box still shows "Latest: 6.3.0" and its footer reads "© 2006-2023 The Haml Team", while GitHub's highest stable release is v7.5.2 (2026-11-03), which the record follows; the reviewer should confirm the site is out of date rather than the release. The README copyright reads "Copyright (c) 2006-2019 Hampton Catlin, Natalie Weizenbaum and the Haml team", and the MIT-LICENSE file the project ships reads 2006-2021 with Takashi Kokubun in place of the team; the maintainer follows the license file. The README lists four current maintainers (Akira Matsuda, Matt Wildig, Tee Parham and Takashi Kokubun), recorded here as notes only. The Discord link is the README badge; the badge alt text is "Discord Server". Haml is a Ruby library used inside Rails and other Ruby web frameworks; the README names no parent, and the Rails development dependency in the gemspec is not a basedOn statement. The README says Haml can be used from the command line or as part of a Ruby web framework; no runsAs is recorded because the library also runs inside a site's Ruby application, and a local value would hide its hosting. The first release is the oldest tag, 0.1.0, committed 2006-10-05; the RubyGems first upload is 2009 per ecosyste.ms, which the oldest tag predates. The npm package named haml is a different project (0.4.3) and is not used. The Google group address in the gemspec is an email contact, not a forum link. Stars and contributors are for the repository. The RubyGems total is the all-time downloads figure the gem API returns.
  The README shows a command-line render command for a .haml file and programmatic use described in the YARD reference, and names Rails as a place where the gem is added to a Gemfile.
  The README formatting section says indentation shows the element structure and that no end tag is needed.
