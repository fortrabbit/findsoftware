notes: >
  The README says "Element will stay with Vue 2.x" and "For Vue 3.0, we recommend using Element Plus". The project is not ended by those statements: the README still gives install and quick-start steps, the repository is not archived, and the npm latest version is not deprecated, so the status is accepted. The last release is 2.15.14 (2023-08-24), and the default branch was last pushed 2024-08-20; a reviewer may want to check these against the criteria. alternativeTo records the README's recommendation of Element Plus for Vue 3, which the README states. The maintainer is the copyright holder named in the LICENSE file; no legal entity or imprint was found in the pages read, so no legal form is recorded, and maintainerType is left to the import. httpArchiveSites is the mobile origin count in the HTTP Archive technologies list, the figure used for the other records in this batch. firstRelease is the oldest GitHub release (1.0.0-rc.1, 2016-09-03); the npm package was created 2016-06-16. contributors counts contributor accounts from the API list with per_page=1, read from the Link header. The npm package reports a deprecation on some older versions only, not on the latest one.
