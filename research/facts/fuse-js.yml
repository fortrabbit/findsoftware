notes: >
  The GitHub language field reads JavaScript; the README says the library is written in TypeScript, and the value recorded is the project's statement. The maintainer is the name on package.json at v7.5.0 (author "Kiro Risk"); the repository has no copyright line in its LICENSE file, and the GitHub user krisk carries the same name. The first registry upload is npm 0.0.0 on 2013-11-29, older than the oldest GitHub release (v1.0.1, 2014-04-07), so firstRelease follows npm. The latest stable release is v7.5.0 (2026-07-13); the npm dist-tag latest is the same version. The beta tag 7.6.0-beta.0 (GitHub prerelease 2026-08-09) is the latestPrereleaseDate. The npm weekly figure is the sum of the range 2026-10-19 to 2026-10-25; the API returns zero for 19 to 21 October. Fuse Cloud is described on the homepage and on fusejs.io/cloud.html as a hosted search API marked "Coming Soon"; it is not an offering yet, so no hostedOffering is recorded. The homepage links x.com/kirorisk and the project's sponsor pages (GitHub Sponsors, Patreon, PayPal); only the x link is a field, the sponsor links are not paid editions. The README names fuse-swift as an official port (Swift, by the same author); it is a separate candidate and is not recorded here. The browser-only figure is taken from the README's statement, and the server half is not recorded as runsAs because no page states a server run mode. The getting-started page also shows a Deno import from deno.land; that is a usage route, not an install method, and is not recorded.
