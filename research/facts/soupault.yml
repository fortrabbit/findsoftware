notes: >
  The homepage soupault.net answers over https and shows the software, so it is recorded. The README and support page name a mailing list (lists.sr.ht/~dmbaturin/soupault) and an IRC channel for support; neither is a forum field, so both are left out. The README says the software is named after Philippe Soupault and uses the lambdasoup library; lambdasoup is a dependency and not recorded as basedOn. The release data come from the GitHub releases API: the oldest entry is 1.0-beta1 from 2019-07-15 and the highest stable release is 5.3.0 from 2026-04-21, so no latestPrereleaseDate is recorded. The copyright holder is written as the LICENSE states it, Daniil Baturin et al.; the homepage names Daniil Baturin as the person behind it and no company. The GitHub owner PataphysicalSociety is an organization. The opam package name is soupault; it is not recorded because no registry figure or fact field covers opam. Per the README and the FAQ, soupault extracts metadata from HTML with CSS selectors instead of front matter, converts other page formats through external preprocessors, and loads Lua plugins. The FAQ says the built-in template processor is jingoo and is used for index rendering, while pages are assembled by inserting content into an element chosen by a CSS selector.
