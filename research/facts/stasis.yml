notes: >
  Stasis is a library, not a generator; the README says "There are no batteries included." It is listed under criterion 1 as a library a web creator adds to a site. It has no GitHub release objects. Its tags run from 0.3.0 (2014-01-13) to 2.5.1 (2021-04-24) and then to the calendar version 2023.11.21, which is the latest tag; a calendar version has no major, so currentMajor is not recorded. latestReleaseDate is the commit date of the latest tag; firstRelease is also confirmed by the push date of version 0.1.0 on Clojars. The README gives the license as "either version 1.0 or (at your option) any later version", so the license is recorded as EPL-1.0+. The project publishes to Clojars, which the import does not read; clojarsName and clojarsDownloads are fields coined here, the download figure is the total the Clojars API reports. The project.clj names the Eclipse Public License without a version, while the README says version 1.0 or any later version, so both statements are recorded as license entries. The README starts its examples with Leiningen and Ring, but no page states the runtime, so none is recorded. Its homepage field is empty and no separate site is named.
