notes: >
  The icon sets are separate projects: the README table names each set's license (MPL-2.0, CC BY 4.0, CC BY-SA 3.0, CC0 1.0, SIL OFL 1.1, ISC, Apache-2.0 and others), and says "Icons are taken from the other projects so please check each project licences accordingly." Those statements are not recorded as license entries because they name no single license for the software itself; the GitHub license field reads NOASSERTION, but the LICENSE file is the MIT text with a 2018 copyright line for kamijin_fanta, which is recorded as the license. The README states the package license as "MIT" under its Licence heading. The npm figures are for react-icons, the package the homepage install command names. The package @react-icons/all-files is a separate install path the README says has had no release for some time; it is not counted. The v6 line is a beta (v6.0.0-beta.0), recorded only as latestPrereleaseDate. The maintainer is the GitHub organization because no page names a maintainer; the 2018 LICENSE copyright holder is an individual and is not the current maintainer by the sources read. The README says the library requires React 16.3 or higher, which is recorded as basedOn. The homepage lists icon counts per set; they change more often than a year and are not recorded. The README shows components imported by name from a set's path, such as react-icons/md for Material Design icons.
