notes: >
  Repo-only project: the GitHub homepage field is empty and the README names no site. The README's runtime requirement is "the latest stable version of elixir", with v0.12.5 named as of its writing in 2013; that is no minimum, so runtimeMin is not recorded. The GitHub API reports license NOASSERTION, so the MIT license comes from the README statement and the LICENSE file. The Hex registry has no package named coil (hex.pm returns 404). The README's run line is "PORT=8080 mix run --no-halt" and it shows a Heroku deploy with a buildpack; neither states what the host must run, so runsAs is not recorded. The README bootstraps a sample blog with mix coil ../blog and lists the routes for the index, pages, articles, the RSS feed and the archives; articles are Markdown files named YYYY-mm-dd-article-title.md (coined field contentFormats, not recorded). The last default-branch commit is dated 2014-03-30, after the only release v0.4.0 (2013-12-16).
