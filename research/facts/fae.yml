notes: >
  The GitHub repository has tags but no GitHub release. The record takes currentMajor and latestReleaseDate from the RubyGems package fae-rails, its stable release 3.0.0 (2023-03-29). The gemspec in the repository declares version 3.1.0, which has no tag or gem, so it is not recorded. The RubyGems name fae has a different gem by another author (fae 0.2.2, finite automata), so the figure from the name fae is not used. The README states "Fae 3.x supports Rails 7" and "For legacy Rails support you can use Fae 2.x on Rails 5.0 to 5.2"; the Ruby version is not stated, so runtimeMin is left out. The homepage links Twitter and Instagram accounts of the agency FINE, not of the project, so no x fact is recorded. The Heroku section of the installation page links Heroku's Rails guides, which does not state how a Fae app runs, so runsAs is left out. The Devise gem handles authentication per the homepage; no sso fact is recorded because no SAML, OIDC or LDAP is stated. The GraphQL support is a tutorial in the docs, not a built-in headless API, so headlessApi is left out. The homepage describes the project as actively maintained; the last gem release is 2023-03-29 and the repository was pushed 2026-10-21.
