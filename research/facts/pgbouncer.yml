notes: >
  The COPYRIGHT file names Marko Kreen and Skype Technologies OÜ for 2007-2009, and the site footer says "PgBouncer Authors"; the maintainer follows the copyright line, and the Skype Technologies OÜ entity is named here only. GitHub reports the license as NOASSERTION; the ISC statement is in the COPYRIGHT file, which is the only license statement found. The changelog's first entry is 1.0 dated 2007-03-13, and the project's 1.5 entry carries the tagline "Bouncing Satisfied Clients Since 2007". The install page names the Windows service and the systemd integration (Type=notify) as ways to run the daemon; only the Windows service statement is quoted. LDAP and PAM authentication of database clients (the install page and the changelog) is not recorded as sso: it validates the users of the pooler, not a sign-in to an admin interface. The downloads page lists source tarballs; the community page links a chat room and a Stack Overflow tag, which have no field. No package registry is named by the install docs, so no download figure is recorded. The Autoconf build is marked as the recommended choice for production builds on the install page.
