notes: >
  The homepage and the repository's dev branch (the default branch) were read; the homepage body is readable text. The quickstart calls the library a mobile-first component library and names an adapter for desktop use. The maintainer is recorded as the LICENSE states it, "varletjs", the GitHub organization; no legal name, imprint or company page was found, so maintainerType is left to the import. The Material Design 2 and 3 support is the project's design system choice, not a basedOn statement, because Material Design is a specification and not a software record. Server-side rendering is stated as "Support the SSR" on the README and homepage, with a Nuxt guide; it is compatibility and stays in notes, and renderingModes is not recorded. The first-party Nuxt module (varlet-nuxt) adds automatic import for Nuxt projects and is a separate package and is not a basedOn or a plugin record. The npm package first version is 0.2.0 on 2020-11-03, before the oldest GitHub release (1.8.0, 2021-07-02) and within a few days of the repository creation; firstRelease takes the registry. The npm latest-v2 tag carries the 2.x line; the GitHub release list shows only the 3.x and some 1.x and 2.x tags. The CSV weekly figure of 1.7k is older than the range figure recorded. The desktop adapter (@varlet/touch-emulator) is needed to use the library on desktop, per the browser adaptation page; it is not recorded as a field. The GitHub Discussions and forum are not linked from the README. HTTP Archive lists no Varlet technology entry.
