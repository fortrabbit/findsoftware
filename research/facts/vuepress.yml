notes: >
  The documentation site describes the 2.x release candidate; facts that hold for both lines (rendering, templating, content in Markdown) are recorded from it. Facts that differ between the lines are left out of fields: the docs name Vite as the recommended bundler with Webpack also supported, install with "npm init vuepress vuepress-starter" and list deployment guides for GitHub Pages, GitLab Pages, Heroku, Netlify and Vercel, all 2.x docs, while the 1.x docs on v1.vuepress.vuejs.org say "Vue + webpack" and Node.js 10+. So installMethod stays unknown.
  The repository README says "Status: Release Candidate". The npm latest dist-tag is 1.9.10 (published 2023-08-14); the next dist-tag is 2.0.0-rc.31 (published 2026-07-24), and the documentation site describes the 2.x line. The major version, runtimeMin and latestReleaseDate follow the latest dist-tag as the schema says, so they describe 1.9.10, while the docs cite Node.js v20.9.0+ for the 2.x line. The reviewer decides whether the record follows the release candidate. The README points v1 users to a migration guide on the docs site. The README names vuepress/ecosystem for plugins and themes, which is not recorded as pluginDirectory because it is not on a page of this project's site. The npm package page shows an earlier version dated 2017-12-12, so firstRelease is 2017, while the npm package record was created 2018-04-12. The Wikidata entry for VuePress points to an older source repository and is not used. The npm weekly figure is for 2026-10-12 to 2026-10-18; the CSV note of 52k per week is an older reading. VitePress describes itself on its own site as the successor of VuePress 1; that is the VitePress record's fact, not this one.
