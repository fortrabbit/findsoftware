notes: >
  The homepage https://graphql-ruby.org/ is the RDoc API documentation site of the gem; its guides sit under /guides/. The http form answers with a 301 to https, so the https URL is recorded. The repository has 13 GitHub release objects, the newest v1.11.12 (2025-07-19), while the tags run to v2.6.14 and rubygems publishes 2.6.14 on 2026-10-29; the stable tag without a release object is the newest release, so currentMajor and latestReleaseDate come from rubygems. The newest prerelease on rubygems is 1.10.0.pre4 (2020-01-15), older than the stable release, so latestPrereleaseDate is absent. The first rubygems upload is 0.0.1 on 2015-02-05, the repository creation date, which sets firstRelease. The rubygems name is graphql, the gem the install page names; the repository name is graphql-ruby. The README says "Implement the GraphQL spec" and "Support Ruby on Rails and Relay" as goals; the GraphQL specification is named as the spec the library implements and is not basedOn. The Rails generator (rails generate graphql:install) is a helper inside the gem and not a separate install route. The getting-started guide declares object types and resolver classes in Ruby, connects them to a schema class with a query root, and runs queries with Schema.execute; on Rails the generator adds boilerplate and mounts GraphiQL in development. The README sets Pro aside: GraphQL::Pro is a separate gem under a special commercial license, and the Pro page lists its features (persisted queries, rate limiters, Pundit and CanCan integrations, subscriptions for Pusher and Ably); its prices are not recorded, and the product page is not a separate pricing page, so pricingPage is absent. The Pro dashboard guide describes a web dashboard as a GraphQL-Pro feature, so adminUi is absent. The Dataloader vs. GraphQL-Batch guide names graphql-batch, which has no record. The maintainer is the LICENSE copyright line's Robert Mosolgo; the gemspec authors line names the same person. The contributors figure counts the contributors endpoint's rel="last" page number at one per page (399). The rubygems download figure is the total. The ecosyste.ms counts are read on 2026-11-09. Discord is the #graphql-ruby channel link in the README.
