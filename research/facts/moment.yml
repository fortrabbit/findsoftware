notes: >
  Status accepted, with the maintenance mode stated in the fact file. Criterion 1: a date library that web and Node.js applications import; it is not an application. Criterion 2: published on npm as moment, the package the README install section names. Criterion 3: the README Installation section and the docs' Webpack and Browser sections give the install routes. Criterion 4: the repository is not archived; the latest GitHub release 2.31.0 and the npm 2.31.0 upload are both dated 2026-09-15. The project says it is "a legacy project in maintenance mode" and "New features are not being accepted" (README, homepage, docs). That is a maintenance statement with releases continuing, not an end statement, so the status stays accepted. The 2026 project status update says the maintainers expect some 2.x maintenance updates, that a 3.0 has no schedule, that the project is "maintained by volunteers", and that the maintainers "would like to recommend alternatives that are excellent choices for use in modern applications today" without naming them in that paragraph. The 2020 announcement on the news page is marked as superseded by the August 2026 update; it still says the maintainers would recommend alternatives, names Luxon and Day.js, and says Chrome Dev Tools recommends replacing Moment for its size, so luxon and dayjs are recorded as alternativeTo from that page. The docs page has no Project Status section of its own; it links to the news page for the current policy, and the August 2026 update names no alternatives. The news page links to third-party blog posts and a you-dont-need list; those are not primary and are not recorded. The README says the project is "an OpenJS Foundation project" and the copyright line names "OpenJS Foundation and Moment.js contributors"; the foundation hosts the project, and the maintainer follows the LICENSE copyright line, "Copyright (c) OpenJS Foundation and other contributors"; the README and docs footer word it as "OpenJS Foundation and Moment.js contributors". Moment Timezone and Luxon are sibling projects on the homepage navigation and are not recorded here. The docs state "Moment can be used in browsers and in Node", which names both, so runtime is node and no runsAs is recorded. The contributors count is the page number of the last contributors page. The firstRelease year is the oldest tag, 0.3.0, committed 2011-03-16; the first npm upload 1.1.0 is 2011-10-27, the same year. The npm weekly figure is the sum of daily downloads for 2026-11-01 to 2026-11-07.
