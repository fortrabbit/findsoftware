notes: >
  No project website: the repository's homepage field is empty and the gem's homepage_uri is the GitHub repository, so no homepage is recorded. The docs are the README. Highest stable GitHub release is v2.2.3 (published 2026-01-07), which matches the RubyGems version 2.2.3; major 2. The oldest RubyGems upload is 0.1.0 on 2021-08-10, earlier than the oldest GitHub release v0.8.0 (2021-10-12), so firstRelease is 2021 from the registry. The MIT-LICENSE copyright line names Basecamp; the RubyGems authors field names David Heinemeier Hansson. The maintainer is recorded as the license states it, Basecamp, a reviewer may prefer the gem author. The README states that Importmap for Rails is included in Rails 7 and later for new applications and can be added to existing ones with the bundler command; the gem depends on railties, activesupport and actionpack at 6.0.0 or later, which is a dependency, not a runtime statement. The README says the pinned files are served through the application's asset pipeline, which Sprockets or Propshaft provides; no runsAs or renderingModes is recorded because the README states neither. Mechanics the README describes: config/importmap.rb pins logical module names to files or CDN URLs, the layout helper javascript_importmap_tags writes the map into the page, and ./bin/importmap downloads npm packages from a CDN into vendor/javascript; enable_integrity! adds subresource integrity hashes, and Propshaft needs an integrity algorithm set. The gem's templating appears only as the ERB layout example, not as a templating statement, so templating is not recorded.
