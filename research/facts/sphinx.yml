notes: >
  The homepage https://www.sphinx-doc.org/ redirects to the documentation root under /en/master/, which is served over https. The docs field records the install page of that documentation; the installation page lists the PyPI, conda, OS package manager and Docker methods, and the README gives pip install -U sphinx. The GitHub license field reads NOASSERTION, while LICENSE.rst states the two clause BSD licence, so BSD-2-Clause is recorded from that file; the README badge agrees. The GitHub releases list starts at v4.3.1 (2021-11-27), so firstRelease uses the first PyPI upload of the sphinx package on 2008-03-21, the same package name the install docs name. The PyPI JSON carries no download figures, so pypiDownloads is not recorded. The Python requirement is taken from the PyPI metadata field requires_python, which reads >=3.13. The README lists the output formats: HTML, PDF, plain text, EPUB, TeX and manual pages. The deployment appendix of the tutorial says the HTML Sphinx generates is static and that any web hosting service will do, which is the basis for renderingModes and runsAs. The support page also lists a sphinx-users mailing list on Google Groups and a Stack Overflow tag; neither is recorded as the forum. The README lists Jinja 2 as the templating engine for the HTML output.
