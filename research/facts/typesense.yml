notes: >
  The LICENSE.txt file is at v31 and the release tags stop at v30.2; the stable major is taken from the latest release tag. The npm package typesense (3.1.1) is the JavaScript client and is not used for the version or as a server source.The install page lists Docker, Kubernetes, Homebrew, DEB and RPM packages and binaries. The system requirements section of the install page was not reached in the text and is not recorded. The hostedService field is coined here for Typesense Cloud, beside the self-hosted server.
