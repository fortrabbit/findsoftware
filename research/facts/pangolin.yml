notes: >
  The first GitHub releases carry 2026-06-11 publish dates for versions tagged from 1.0.0 onward (backfilled); firstRelease takes the commit date of the oldest tag, 1.0.0-beta.1 (2025-01-05), since no page states a first-release year. The Docker Hub registration date is 2025-01-04. The GitHub license field is NOASSERTION; the README states AGPL-3 for the Community Edition and the Fossorial Commercial License for the Enterprise Edition, and LICENSE says that files carry either header. The Fossorial Commercial License allows an unlicensed free tier and requires a license key for Paid Features; the Enterprise page and the README name USD 100,000 gross annual revenue as the free-use threshold. The homepage footer and privacy policy write "Fossorial Inc." while LICENSE and the license page write "Fossorial, Inc."; the LICENSE wording is recorded as maintainer. The pricing page lists Team, Business and Enterprise plans for Pangolin Cloud; they do not create a paidEdition fact on their own. The architecture page names Traefik, Gerbil, Badger and Newt as node and site components, and the README says it is built on WireGuard; no page says Pangolin is based on any of them, so basedOn stays out and WireGuard is not a record id. The Discord link is recorded from a README badge without a quote. The Slack link (pangolin.net/slack), LinkedIn and YouTube have no field. The identity provider docs describe OIDC sign-in to Pangolin (Google, Microsoft Entra ID and others); more than one role per user is limited to Cloud and the Enterprise Edition. The homepage footer links YouTube and LinkedIn through pangolin.net redirects. The Docker compose page pulls the latest tags, so the Docker Hub count is for the image the install docs name.
