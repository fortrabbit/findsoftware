notes: >
  The repository has no tagged release (releases/latest returns 404), so currentMajor and latestReleaseDate are unknown. The generator writes one static index.html file, which the README states; that output is not a runsAs value for the generator itself, and no page states how the generator is hosted, so runsAs is not recorded. The minimum PHP version is not stated. The README says the generator produces pages for LinkFree (MichaelBarney/LinkFree); that is output, not a parent, so basedOn is not recorded. The LICENSE copyright line holds the template placeholder, so the maintainer comes from the homepage footer. Themes live in chriskthomas/linkfree-themes and are not recorded here.
