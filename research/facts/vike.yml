notes: >
  The npm package vike is at version 0.4.268, so the dist-tag major is 0 as the brief sets it; the project versions its releases 0.x. The first npm version is 0.0.0-alpha.0 (2021-06-24), recorded as firstRelease 2021. The Open Source Pricing page says the pricing model is not implemented yet ("everyone can use Vike for free in the meantime") and that Vike stays 100% MIT licensed, so no paid edition is recorded; no prices are recorded. The guide to adding SSR to an existing Vite app names Vite as the starting point, and the guide "Add SSR/SSG to existing Vite app" says "Add Vike to your vite.config.js", which shows a Vite config step but not a statement that Vike is built on Vite; no page read states that Vike is built on Vite, so basedOn is not recorded and the description does not say Vite-based. The team page lists the core team under several names; the LICENSE copyright names Romuald Brillout. The scaffolder is at vike.dev/new, uses Bati, and can scaffold apps with Vike extensions or with Vike's core only; its install command is not on the page, so installMethod is not recorded.
