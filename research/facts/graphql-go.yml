notes: >
  No homepage: the repository's homepage field is empty and the README names only the godoc page, so the repository is the only project page. The README lists queries, mutations and subscriptions as supported, and says the library follows the graphql-js reference implementation; that is a statement about conformance, not a basedOn statement, so no basedOn is recorded. The latest stable release is v0.8.1 dated 2023-04-10, a major version of 0 (pre-1.0 line); the repository's default branch has commits to 2026-06-23 and no release since, so the record stays accepted under the four-year rule until 2027-04-10, after which a release-age check would move it to stub. The go.mod go line at the v0.8.1 tag is 1.13; it is the minimum Go toolchain the module declares, and the import reads it as a runtime minimum only if the runtime vocabulary admits Go. The README lists third-party packages (graphql-go-handler, graphql-relay-go, dataloader and others); they are separate projects and not recorded. The Go module has no download figure on pkg.go.dev or the Go proxy, so no adoption download is recorded. The README's Gitter chat and the PayPal donation links are not recorded. The LICENSE copyright line names Chris Ramón alone, so that name is the maintainer; the README credits Hafiz Ismail as the author of the sibling packages and is not used for the maintainer.
