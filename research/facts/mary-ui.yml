notes: >
  The composer.json at tag 2.9.11 requires illuminate/support, jfcherng/php-diff, laravel/prompts and blade-ui-kit/blade-heroicons and states no PHP constraint, and the docs state no PHP minimum, so runtimeMin stays out. The runtime is left out: the GitHub language bar is no statement and neither the composer.json nor the docs name PHP as a requirement. The repository's license is detected as NOASSERTION because the file is named license.md; the file and the README both state MIT. The Packagist total is 805431 and the monthly figure is 97513 at the read date; the total is recorded. The dependent package count is 0 at ecosyste.ms and the dependent repository count is 1. The docs nav lists a Livewire 4 upgrade section, which is not recorded as a fact. The homepage sponsor link names GitHub Sponsors; no paid edition is stated. The composer file lists Laravel-family packages, and the docs install the components with php artisan mary:install.
