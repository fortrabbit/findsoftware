notes: >
  No project site: the repository's homepage field is empty and the README links only the wiki, so no homepage is recorded and the wiki is the docs. The maintainer is Pawan Dubey as the README copyright line states; the pom.xml gives a personal site (pawandubey.com) that is not recorded because it is not a project site. The highest stable GitHub release is v0.4.2 (2022-01-02), so currentMajor is 0. The earliest release is v0.1.8 (2015-07-08). The Java source level in pom.xml is 1.8, which is a build setting and not a stated runtime requirement, so runtimeMin is unknown. The wiki's Contributing page says Griffin is in early stages of its development. The Maven pom names the project griffin; no Maven or npm download figure is recorded.
