notes: >
  Hosted service: the platform is sold as a hosted service, with merchant-of-record fees on the pricing page (the README lists per-transaction percentages; no prices are recorded). The docs say "While self-hosting is technically possible, we recommend using our hosted service to get the full Merchant of Record benefits including global tax compliance." No self-install guide was found on the docs or the README (the repository has DEVELOPMENT.md, a development environment guide), so the record stays hosted-service and selfHostOption is not recorded. The CSV row was boundary: its wiring test passes, since the README says "You can integrate Polar on your docs, sites or services using our Public API and Webhook API" and the adapters page says the framework adapters "wire Polar checkouts and webhooks into your framework" (Next.js, Nuxt, TanStack Start, Laravel, BetterAuth; several are marked deprecated). The record is hosted-service because no install guide exists. Per the hosted-service rule the repository polarsource/polar (the platform's own server code, Python, Apache-2.0 by the LICENSE file and the README, 10453 stars on 2026-11-03, owned by a GitHub organization) is kept here and not recorded as facts; the docs describe the license as "Apache 2.0 license with 36+ contributors and growing", while the GitHub contributors endpoint counts 126 across all pages, so the API count is the one to use if the repository is ever recorded. The SDKs named in the README are polar-js (JavaScript, Node.js and browsers) and polar-python; the SDK packages' releases in the same repository are tagged sdk/ and @polar-sh/ (for example @polar-sh/checkout, @polar-sh/better-auth), so the repository has no platform release tag and latestReleaseDate and currentMajor are not recorded. The npm and PyPI figures for those SDKs are not recorded here. The README names Polar as the merchant of record: "We're the merchant of record", which the record prose can use. Polar Software, Inc. is the copyright holder on the legal page; the terms page names Polar Software, Inc. and its affiliates and sets Delaware as the arbitration seat, which is not a headquarters statement, so hqCountry is not recorded. The repository was created 2023-01-26, which is not a release date, so firstRelease is not recorded.
  The README says Polar is "built for AI startups that need to charge for tokens, agents, and compute without building billing infrastructure from scratch." It says "We're the merchant of record, so we take on the billing boilerplate (receipts, customer accounts, dunning) and the headaches (sales tax, VAT) on your behalf."
