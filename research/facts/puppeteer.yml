notes: >
  The repository is a monorepo (puppeteer/puppeteer with packages for puppeteer, puppeteer-core and browsers); the stars, contributors and releases belong to the monorepo, and the npm package puppeteer is the one the install docs name. The release tags for the package are puppeteer-v<version>; the latest is puppeteer-v25.17.0 (2026-11-10), matching npm latest. The npm first upload 0.0.0 (2013-03-23) belongs to another project (a puppet setup script by plus3network), so firstRelease takes the first puppeteer upload 0.9.0 (2017-08-16); the repository was created 2017-05-09. The maintainer is Google, Inc. from the pptr.dev footer ("Copyright © 2026 Google, Inc."), the project's own site; the package.json author field reads "The Chromium Authors", and the LICENSE file has no copyright line, so the footer governs (reviewer decision). The site has no hqCountry statement, so hqCountry is absent. The runtimeMin 22 is the Node major of the engines field (node >=22.12.0) in packages/puppeteer/package.json at the puppeteer-v25.17.0 tag; the npm entry for 25.17.0 gives the same range. The README and the what-is guide say Puppeteer runs in headless mode by default and can be configured for a visible browser; the browser it drives is the target, not a runtime, so no runsAs is recorded. The FAQ answer on Selenium says Puppeteer is not a replacement and that Selenium goes beyond it; the sentence states no alternative or switching, so alternativeTo is absent. The footer's Twitter link is the x field; the footer's YouTube link (goo.gle/devtools-youtube) is the youtube field, and the Stack Overflow tag page is no forum field. The system requirements page says "Node 22.12+", the page source for runtimeMin beside the package.json entry. The Docker guide's image (ghcr.io/puppeteer/puppeteer) is recorded as an installMethod; the guide shows it running a Node script and gives no process model, and the guide for running Puppeteer in a browser says only the API runs there while the automation goes to a separate browser, so runsAs stays unrecorded. The FAQ compares Puppeteer with Selenium ("The Selenium project goes beyond what Puppeteer offers"); Selenium has a candidate row but no fact file yet, so alternativeTo is not recorded. The repository's Chrome DevTools and WebDriver BiDi protocol support, and the Firefox support from v23, are the library's features and are not recorded as fields. The chrome-devtools-mcp server built on Puppeteer is a separate project and is not recorded. The npm weekly figure is the sum of the seven daily counts for 2026-11-01 to 2026-11-07.
