notes: >
  The README links the documentation at http://complexity.rtfd.org, which redirects to the readthedocs.io site over https; the homepage is recorded as that https docs site, since the GitHub homepage field is empty. The repository moved from audreyr/complexity to audreyfeldroy/complexity; the recorded repository is the current one. The GitHub API reports license NOASSERTION, so the license is taken from the LICENSE text, which has the three BSD clauses (the non-endorsement clause is the quoted line). The README says "Works on Python 2.6, 2.7, and 3.3, and on PyPy", a list of versions it works on and no stated minimum, so runtimeMin is not recorded; PyPI's JSON carries no requires_python. The README says data from .json files becomes template context data (coined field contentFormats, not recorded), and the docs' history lists 0.9.1 as 2013-12-02. The tutorial deploys the www folder to Amazon S3 with the separate tool alotofeffort. The default branch's newest commit is dated 2015-08-28 and pushed_at is 2019-02-23; the release is the last tag. The PyPI JSON shows -1 downloads, so the figure comes from pypistats.org.
