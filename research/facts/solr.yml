notes: >
  No GitHub release exists for apache/solr: the repository holds release tags only (releases/solr/<version>), so the release date and the version come from Maven Central. Maven Central's solr-core metadata names 10.1.0 as the release, with its tag dated 2026-10-22; the Maven search index still lists 10.0.0 (2026-03-03) as the newest upload, and no release timestamp for 10.1.0 was found, so latestReleaseDate is not recorded. The project's own downloads page, read 2026-10-28, names 10.0.0 as the most recent release, which contradicts the Maven metadata and the tag; a reviewer should decide the current version. The docs link is the Reference Guide, read through its installing page. The install docs name the binary and the Docker image, not a Maven artifact; SolrJ and solr-core are the Java client and library, so no mavenCoordinates and no registry figure is recorded. The Solr homepage describes the software as built on the full-text, vector, and geospatial search capabilities of Apache Lucene; Lucene is no record in this set, so no basedOn is recorded. firstRelease is the 1.1.0 release line in CHANGES.txt on the release tag (20061221), older than the earliest Maven upload (1.3.0, 2008). The Apache Software Foundation page gives the organization as a U.S. 501(c)(3); no street address or headquarters city is stated, so hqCountry rests on that statement and a reviewer should confirm it. The homepage and the install pages carry no social links. The Solr Reference Guide lists the Solr Admin UI as the server's own console; it is not recorded as adminUi because the field describes a content admin. The guide names ZooKeeper for SolrCloud clusters, which is not a database the software stores in and is not recorded.
