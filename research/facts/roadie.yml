notes: >
  This gem is now in passive maintenance mode, per the README badge and banner, which link to issue 155 of the repository; a maintenance-mode statement by the maintainer makes the status stub, not discontinued, so the record stays off the register until a person decides it, and the same sentence is on the master branch. The project has no homepage: the README names only the repository, the RubyGems page and an omniref mirror of its documentation, so homepage is absent and docs is left out, since omniref is a third-party site. The LICENSE copyright line names Magnus Bergmark, Jim Neath / Purify and contributors; Jim Neath and Purify are other legal parties and stay here, and the README copyright line runs to 2022 where the LICENSE runs to 2016. The gemspec requires Ruby 3.3 or newer at v5.3.1 and the README names no minimum, so runtime and runtimeMin come from the gemspec. The README says the gem was "previously tied to Rails" and now serves any HTML documents; roadie-rails is a separate Rails integration by the same author and has no record, so basedOn stays empty. The first version appears as a tag dated 2010-01-02 (v0.1.1), earlier than the 2011 first RubyGems upload. The "legacy" tag of 2010-05-24 is not a version and does not move firstRelease. The stars and contributors belong to the Roadie repository. The rubygems total is the download count of the roadie gem.
