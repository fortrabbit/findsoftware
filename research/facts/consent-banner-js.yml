notes: >
  The repository has no homepage of its own, so the GitHub Pages site the README links (tagconcierge.github.io/consent-banner-js) is taken as the project's site: it is the README rendered with the examples. The default branch is develop. The LICENSE copyright line says "Copyright (c) 2024 Tag Concierge", and the legal name and address come from the footer of tagconcierge.com, which names Tag Concierge sp. z o.o. at Sarego 18 / 1, 31-047 Kraków, Poland. The npm registry has no package named consent-banner-js (404), so no npm figures are recorded; the install page names a CDN build at public-assets.tagconcierge.com with a subresource integrity hash. The project page lists WordPress and PrestaShop plugins and a Cloudflare Worker example under Integrations, each an install route recorded above. No page says in a sentence that the library runs in the browser, so no runsAs is recorded. The banner attaches with a script tag plus a stylesheet link. The README says the library is compatible with Google Consent Mode, a consent-platform integration recorded only here. The GitHub project lists no release before 1.1.0 (2024-04-18), so firstRelease is 2024.
