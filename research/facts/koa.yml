notes: >
  Highest stable GitHub release is v3.2.1 (2026-05-21), which matches the npm latest tag. The README states that Koa is "not bundled with any middleware", so middleware is recorded nowhere as a field. The docs page says Koa was designed by the team behind Express; that is an origin statement and not a fork or successor relationship, so only alternativeTo is recorded, from the project's own koa-vs-express page. No page states how a deployed Koa app runs, so runsAs stays unknown: app.listen() creating an HTTP server does not say the process stays up. The firstRelease year is the year of the first npm publish (created 2013-11-06); the repository was created in 2013-07. The homepage describes the installation as requiring Node v18 or higher; the npm engines field for the latest version is ">= 18".
