notes: >
  Relationship: the repository description and the README say the library is based on the JavaScript reference implementation; it is a PHP port, not built on graphql-js, so no basedOn is recorded.
  Planned transfer: the maintainer's discussion also plans to move the docs from the GitHub Pages address to graphql-php.com. The README says "This repository is planned to move to a new home", and discussion 1912 (by the maintainer, 2026) plans to move the repository to the graphql organization or a personal account and the docs to graphql-php.com. A planned move is no end signal; the repository stays the current one and the status is accepted.
  The README and the discussion name the maintainer spawnia (GitHub Sponsors) and Vladimir Razuvaev as creator; the LICENSE line names Webonyx, LLC, which the discussion describes as the company of Jared Laprise. The maintainer follows the LICENSE line; hqCountry is not stated.
  Spec compliance: the README and docs state full compliance with the October 2021 GraphQL specification and in-progress support for September 2025; kept in notes, not a field.
  The docs complementary tools page lists third-party integrations (Lighthouse, Laravel GraphQL, OverblogGraphQLBundle, WP-GraphQL, API Platform) and utilities; they are other projects, not plugins of this record, and no pluginDirectory is recorded.
  Packagist downloads are the total figure from the package JSON; the monthly figure (3247812) is not recorded.
  Stars and contributors belong to the single repository.
  The first release is the v0.1 tag (commit 2015-08-10), matching the docs' "The first version of this library (v0.1) was released on August 10th 2015."
  The homepage the repository names is the GitHub Pages docs site, the project's own site.
