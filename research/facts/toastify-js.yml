notes: >
  The repository is not archived and the npm latest 1.12.0 is not deprecated. The latest stable release is 1.12.0 (GitHub release and npm, both 2022-07-21), so the release is more than four years old on the record date; criterion 4 says release age never decides status, and the import moves a record with no release in four years to stub on its own, so the status stays accepted here for the reviewer to confirm. The README's maintainer name is "Varun A P" (MIT line), while the LICENSE copyright line names "apvarun", which the record follows. The CDN route is jsDelivr, named in the README sentence quoted for the script tag route. The README says the library works in IE10, IE11, Edge and the last 10 versions of other browsers; a browser support list is not a runsAs statement, so no runsAs is recorded. The README's "Contributors" table is not used for the count; the count comes from the contributors endpoint. The npm figure counts the package toastify-js, which the README installs. The docs are the demo and the README sections on the homepage and the repository, so no separate docs field is recorded.
