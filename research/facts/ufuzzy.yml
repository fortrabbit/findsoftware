notes: >
  No homepage: the repository is the only project site; the GitHub Pages demo (leeoniya.github.io/uFuzzy) is not recorded as a homepage, reviewer decision. The npm figure is the sum of the 2026-09-28 to 2026-10-04 window. The npm package is @leeoniya/ufuzzy; the unscoped ufuzzy name is not the project. The README's Browser section loads dist/uFuzzy.iife.min.js by script tag, a second install route without its own registry figure; runsAs is left out because no page says where the library runs beyond the Node and script snippets. The README contains a comparison section with other fuzzy libraries; no comparison is recorded here. Latest pre-release (1.0.15, 2024-11-20) is older than the latest release and is not recorded. Fields coined: none.
