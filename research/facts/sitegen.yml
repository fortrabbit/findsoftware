notes: >
  The homepage is the project's GitHub Pages site (https, 200) and names no company. The GitHub owner is the ALTLIMIT organization, which runs altlimit.com, a development studio; no legal entity for the organization was found, so the maintainer is the LICENSE.txt copyright holder. The four GitHub releases start on 2026-03-29, while the repository was created 2020-03-27, so firstRelease is the oldest GitHub release year. The Go ecosystem has no download figure, so no registry field is recorded. The install section names the alt distribution proxy, recorded as the install method. The built-in editing UI runs only in serve mode, and the CMS docs say it edits the same source files the generator reads, with no database and no separate content store. The README's -clean flag cleans the public directory before the build and -minify minifies the HTML, JS and CSS output. The runsAs value rests on the README's statement that the share tunnel serves only static files from the public directory. Other thing the pages state, kept here and not as a field: the -share option relays the development server through the sitegen.dev server, and the README says it runs only with the development server.
