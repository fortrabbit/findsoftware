notes: >
  The README says jsPDF "is now co-maintained by yWorks - the diagramming experts". The package ships ES, UMD and Node builds, which the README lists by file name. The LICENSE carries a second copyright line, "(c) 2015-2025 yWorks GmbH, https://www.yworks.com/". The maintainer follows the first line (James Hall, the individual named in it); yWorks GmbH is a second legal entity and is recorded only here. The yWorks fork's features are merged into this repository and described in the README as the advanced API mode, so no forkOf. The live demo and the documentation are GitHub Pages sites the README names, which makes them the project's own site; parall.ax is the maintainer's company site and is not used. The Stack Overflow jspdf tag is named as the support channel, which is a general site, so there is no forum. The twitter.com/MrRio link is the maintainer's own account. The README lists html2canvas, canvg and dompurify as optional dependencies for the html method, so no basedOn. Unicode text needs a TTF font added through the font converter or addFileToVFS; the README says the standard fonts cover ASCII only. The first GitHub release is v1.0.106 of 2014-04-24, earlier than the first npm upload (2015-05-19). The npm figure is the package jspdf, which the install docs name.
