notes: >
  The CSV homepage was the plain http address; the same site answers over https (https://parsleyjs.org/ returns 200 with the project's own homepage), so the https address is recorded. The README's maintenance status says the project "is considered stable, no new features are planned" and that there is "Minimal maintenance by @marcandre"; the project does not say it has ended, so the status stays accepted and a reviewer may decide. The docs say "Parsley relies on jQuery (>= 1.8)" and that es5-shim is needed for IE8; jQuery is a required dependency, not a parent the project calls itself a plugin of, so basedOn is left out (jquery.yml exists). The homepage and doc say it works in browsers ("Frontend form validation", "aims to work on every browser (including IE8)"), but no sentence states the runtime in the browser, so runsAs is left out; a reviewer may take the docs heading "Frontend form validation" as runsAs browser. The LICENSE copyright line names Guillaume Potier and Marc-André Lafortune and contributors; the homepage footer reads "© Guillaume Potier & Marc-André Lafortune 2017 - @Wisembly". The homepage and docs name no legal entity, so hqCountry and a company parent are not recorded (Wisembly is linked in the homepage footer, not as the maintainer). The npm figure counts parsleyjs, the package the download page installs. The npm upload of 2.9.2 is dated 2019-12-10 and the GitHub release 2021-11-21; latestReleaseDate takes the GitHub release date. The homepage's personal social links are the authors' own accounts and are not recorded as project accounts. The StackOverflow tag is the README's help route and is a general forum, not recorded as the project forum. The oldest tag is 0.1.0 (commit dated 2012-12-23); the oldest GitHub release is 2.9.1 (2019-05-27). The docs describe data attributes (data-parsley-required and others) as the configuration route, a JavaScript call such as $('#form').parsley() as the alternative, and the localization section, where locale files loaded after Parsley set the message language. The README maintenance status also says that good quality pull requests fixing bugs will be merged. The docs say Parsley gives users feedback "on their form submission before sending it to your server".
