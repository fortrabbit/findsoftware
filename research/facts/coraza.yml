notes: >
  Coraza is a library at its core, per the README; its integrations (the Caddy module, the NGINX dynamic module through libcoraza, the Envoy and proxy-wasm filters, HAProxy SPOE, Traefik middleware) run inside the host server, so no runsAs is recorded; the runtime is go because the README says Coraza is written in Go and used as a library for a Go program. The README lists a Linux distribution or Mac as prerequisites and says Windows is not supported yet; TinyGo is an alternative compiler. Connectors page (https://www.coraza.io/connectors/) lists the integrations and their stability: Caddy, Envoy (core and contrib), proxy-wasm, HAProxy SPOA, Traefik, Apache APISIX and libcoraza are listed; the README marks Caddy, proxy-wasm and HAProxy as stable, experimental or needing a maintainer, and the docs introduction and the README disagree on HAProxy and Traefik (preview in the docs, experimental in the README). The README says Coraza is a drop-in alternative to the OWASP ModSecurity Engine with partial compatibility, and the homepage calls it a replacement for ModSecurity; not recorded as alternativeTo because the ModSecurity record does not exist in this dataset. The OWASP Foundation is the legal name of the maintainer per the about page; the project is an OWASP Production Project, and the foundation's about page says it is a 501(c)(3) nonprofit, and its incorporation country is no project headquarters, so hqCountry is left out. The release list paginates to v1.0.0-beta.1 (2021-07-29), the oldest tag, so firstRelease is 2021; no stable release predates v1.0.0. The latest prerelease is v3.0.0-rc.3 (2023), older than the latest release, so latestPrereleaseDate is left out. The Go module has no download figure, so no registry figure is recorded. Repository is public Apache-2.0; the coraza.io site redirects the bare domain to www. Build tags and FIPS mode are in the README and are not recorded as facts.
