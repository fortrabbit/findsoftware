notes: >
  The CSV row dates the latest release v1.31.6 (2026-10-15), which matches the GitHub release. The source build docs require Go 1.24 or newer, while go.mod at tag v1.31.6 declares go 1.26.0; both statements are recorded as they stand, with runtimeMin following go.mod and buildRequirements following the docs. The docs page shows a "Supported by Mailtrap" banner, which is recorded here as a fact about the project's support, not as a field. The buildRequirements and docker fields are coined kinds.
