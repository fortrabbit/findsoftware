notes: >
  use-gesture is a monorepo: the stars and contributors belong to pmndrs/use-gesture, and the registry figures come from @use-gesture/react, the package the README badge and the React install command name. The vanilla JavaScript route is @use-gesture/vanilla, a separate npm package of the same repository; the npm weekly figure counts @use-gesture/react only. The React target is one of two named targets (React and vanilla JavaScript), so no basedOn is recorded; the README does not say the library is a React binding. The README recommends pairing it with react-spring, which is not an alternative. No page states the runtime or where the library runs. The releases before 10.0.0 (v5.x from 2019 and the V7 and v6 tags) belong to the older react-use-gesture line in this repository, so firstRelease is 2019 from the repository's oldest release; @use-gesture/react's own first npm version is 10.0.0-beta.1 of 2021-05-08. The Discord link on the README badge and the X link in the homepage nav both go to the pmndrs collective (the Poimandres Discord server and @pmndrs), which owns the repository and several other projects; they are recorded as the project's links because its own pages link them. The docs say the library was originally built for React and that v10 is platform agnostic, so no basedOn is recorded. The repository was last pushed on 2024-07-15, is not archived, and carries no deprecation, end or maintenance-mode statement. The LICENSE copyright line names Paul Henschel, recorded as the maintainer; the pmndrs organization owns the repository.
