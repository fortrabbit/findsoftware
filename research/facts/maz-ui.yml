notes: >
  GitHub reports no license for the repository: the LICENSE file at the default branch returns 404, and the README links to ./LICENSE. The license is recorded from the package.json at tag v5.1.0 and the npm package, both MIT. The npm package declares a Node.js 22 engines minimum, a toolchain line for a UI library, so no runtime or runtimeMin is recorded. The Nuxt module (@maz-ui/nuxt), themes, icons, translations and other packages are separate npm packages; the npm figures are for maz-ui alone. The first release year is the first npm upload (0.2.0, 2019-12-25), older than the oldest GitHub release, which is a prerelease from 2022. The latest release v5.1.0 is dated the day this record was researched. The docs state a Tailwind integration as optional and name no parent software, so basedOn lists vue and nuxt only from the README's "library for Vue & Nuxt". No paid edition or hosted service was found on the homepage or the docs read. Contributors counts contributor accounts from the API with per_page=1, read from the last page link.
