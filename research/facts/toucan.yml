notes: >
  The site footer reads "Binary Birds Kft."; the repository LICENSE reads "Copyright (c) 2022-2025 Binary Birds Ltd.", so the maintainer is recorded as the LICENSE states it (the 2022-2025 line is Binary Birds Ltd.; an earlier line names Tibor Bödecs), and the site footer form is Binary Birds Kft. The homepage footer links an X profile (x.com/tiborbodecs) next to the author page; it is the author's profile, not a project account, so x is left unrecorded. The 1.0.0 release (2026-05-06) is the only stable release; the homepage still announces the release candidate phase and is not an end signal. The docs describe a GitHub Pages deployment through a reusable workflow in toucansites/github-workflows; no hosted service is offered beside the open source part. The quickstart documents toucan generate, a dist folder and toucan serve on localhost port 3000; the homepage footer says the site was generated with Swift and Toucan. The GitHub Pages deployment page says a tag or release can trigger the deploy workflow and that the github-pages environment must allow tag deployments. The docs page lists "Templates" and "Showcases" on the site, which are not plugin directories, so pluginDirectory is absent.
