notes: >
  The repository is django-compressor/django-compressor. GitHub reports the license as NOASSERTION, because LICENSE opens with a 2009-2022 copyright line for the authors and a second line for Andreas Pelme (2008); pyproject.toml at tag 4.6 states license = "MIT", and that is the recorded license. No GitHub release exists; the repository has tags and PyPI has the releases, so the stable version 4.6.0 from PyPI is currentMajor and latestReleaseDate, as the write-record rule for a project without GitHub releases says. The PyPI package is django-compressor (the module is compressor, the install line is pip install django_compressor). The first PyPI upload is 0.5.2 (2010-02-23), and the repository was created 2010-02-05. The docs at /en/latest are the project's own Sphinx documentation and the PyPI Homepage; the readthedocs page title reads "Django Compressor 4.6.0 documentation". The docs say offline compression is run with the compress management command during deployment, which is a build step, so runsAs is local; the in-request mode runs inside the Django process and no page states a hosting model for it. The stated default Django-based scope is "in a Django template"; the PyPI classifiers list Framework :: Django. The pypistats figure is the last-month count from the recent endpoint. The ecosyste.ms counts are for the pypi.org package django-compressor.
