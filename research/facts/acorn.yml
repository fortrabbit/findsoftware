notes: >
  Scope widened on 2026-10-19 from boundary: Acorn is a Composer package that adds Laravel components to WordPress, so it is listed as a framework with WordPress and Laravel as basedOn. The installation page states the Laravel and WordPress requirements (PHP 8.3, WordPress 5.4), so the runtime is PHP and the host is the WordPress host. The page does not say whether a request runs per request or as a daemon, so runsAs stays unknown; the queue worker (queue:work) is a documented command that runs as a daemon but is not required for the site to serve requests. The repository created_at is 2018-08-08, which is not a first release, so firstRelease stays unknown. Packagist lists a maintainer named retlehs; no roots.io page names a legal entity, so maintainer is the LICENSE copyright line, Roots Software LLC.
