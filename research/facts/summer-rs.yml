notes: >
  Rename: the project was published as spring-rs until 0.4.x. The migration post says it was renamed to summer-rs at 0.5.0 (2026-03-21), and the crates changed from spring-* to summer-*. Recorded under the current name only, with no successorOf, because the repository is the same. The first post, titled "summer-rs initial version released", is dated 2024-08-04; the oldest GitHub tag is 0.0.9 (2024-09-06), so firstRelease 2024 holds either way. Major: the highest stable GitHub release is 0.7.1 (2026-05-25), so currentMajor is 0. latestReleaseDate is the crates.io date of 0.7.2 (2026-10-17), which is newer than the GitHub release 0.7.1 (2026-05-25). runsAs is not recorded: the docs show a port configuration key and "cargo run" but no page states that the application runs as a server process. Databases are the drivers the summer-sqlx page lists. The summer-web page says Axum is a dependency and that summer-web is a web framework based on Axum; the core framework's parent is not stated, so basedOn is not recorded. The installation and deployment URLs return 404; the docs source under docs/content holds no deployment page. The FAQ page only links to GitHub issues labeled question. The README lists 16 plugins and the docs index lists 19, so pluginCount is left out as a count that moves.
