notes: |-
  The npm name "cirrus" is an unrelated CloudFormation tool and is not used; the framework's package is cirrus-ui. The homepage footer states two licenses, one for the source code (MIT) and one for the website content (CC BY-NC-SA 4.0); both are recorded as license entries, and the second covers the website, not the software. The homepage describes pre-built components to bootstrap a project and utility classes to polish the final design. The setup page names Font Awesome for glyphs ("To use glyphs, you must include the Font Awesome library."), says to sign up for a Font Awesome developer kit, and calls its CDN link a sample and Google Fonts for its typefaces; both are external dependencies stated by the project and are not recorded as fields. The setup page offers npm, a jsDelivr or unpkg CDN link and a repository download; installMethod records each route on that page as its own entry: npm, yarn, a CDN, a download from the repository and the Cirrus Start template. The npm latest is 0.8.0, the same as the GitHub release, and the npm beta tag 0.4.5 is not used. The setup page also describes importing the stylesheet into React, Vue and Svelte projects and offers three Sass builds (core, extended and all). The HTTP Archive technologies list has no entry for Cirrus, so httpArchiveSites is not recorded. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header.
   The README says all styles require no JS for interactions such as modals and dropdowns, and that the stylesheet build lets you add components, remove utility classes and disable features. It also links a VS Code extension on the Visual Studio Marketplace. The homepage has a newsletter signup form that posts to a Mailchimp list, with no page to link, so newsletter is not recorded. The forum entry is the Community menu item on the docs, which links the repository discussions.
