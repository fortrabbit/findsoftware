notes: >
  Composer description says "Modernized fork." and the pages read do not name the upstream project, so forkOf is absent. The package tencent/biny is not on Packagist (404), so no registry figures. The wiki at billge.cc still gives PHP 5.5 and an nginx root at /web/; composer.json at v2.11.0 requires PHP >=8.1 and the v2.11.0 changelog states PHP 8.x support, so runtimeMin follows the release. The wiki answers only over plain http, so the import leaves it out of the record's links, which accept https only. The wiki's nginx example does not state a process model, so runsAs stays unknown. The wiki is the project's documentation and is recorded as both homepage and docs because the repository names it as its wiki. The v2.11.0 changelog says the update was made with AI assistance; not recorded as a field. The candidate row listed the repository as homepage; the repository is not recorded as homepage. HQ country is absent: the pages name Tencent and give no company location.
