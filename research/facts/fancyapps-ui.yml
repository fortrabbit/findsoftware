notes: >
  The repository holds the distribution build (dist/, with the bundles and index.d.ts) and the README, CHANGELOG, LICENSE.md and package.json, and no src/ folder; sourcePublic is recorded false for the reviewer to confirm. GitHub reports no language and no license (NOASSERTION); the npm package reads SEE LICENSE IN LICENSE.md. The LICENSE.md mentions a docs/ directory under CC BY-SA 4.0, which is not in the repository listing; that statement is not recorded as a license entry. The license page is the Fancyapps UI License Agreement between the Author and the licensee, and the terms page calls the software "a product of Jānis Skarnelis"; neither names a company legal form or a country, so no hqCountry. The pricing page lists Single (one-time), Extended (per year) and Business (per year) licenses; the tiers differ in end products, end users and support, not in features, so no paidEdition. The license page prohibits use in open source projects and sole redistribution; those are license terms, recorded only as the licenseModel statement. The Past Releases page says the project starts in 2007 and lists Fancybox v2 and v3 and Fancyapps UI v4 and v5 under the same name; the v3 repository is a separate candidate (fancybox3, archived), so no successorOf. firstRelease is 2021 from the oldest tag in this repository (v4.0.0-alpha.0). The Fancybox page says the library is built with TypeScript and used with React and Vue (integration pages exist); no basedOn, since the project calls it a framework-agnostic toolkit. No page states a runtime or that it runs in the browser, so no runtime or runsAs. The homepage's "1000+ GitHub Stars" and "50k+ NPM downloads/week" are not recorded; the GitHub and npm figures above are read from the APIs with their dates.
