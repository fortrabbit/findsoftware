notes: >
  The project's own site names the GitHub repository and its styx-site companion repository. The repository has tags but no GitHub release, and no registry package. The version and date come from the project's own news page, which lists Styx 0.7.5 on 2022-08-13 and the older 0.7.0 from 2017-09-02; the tag v0.7.5 is the highest version tag, and a tag named latest also exists. The documentation's release notes list Styx 0.1.0 on 2016/10/07, which gives the first release year; the same notes date 0.7.5 as 2022/08/17 while the news page dates it 2022-08-13, and the news page date is recorded. The documentation describes deployment to GitHub Pages, an Amazon S3 bucket and NixOps, and says rsync over ssh can deploy a site; no deployment field exists for that. The README says site configuration uses an interface like NixOS modules, with every declaration type-checked, and that the styx doc and styx site-doc commands show the embedded documentation and generate documentation for a site. The README describes Markdown, AsciiDoc and Nix content and the Nix themes; the Markdown and AsciiDoc markup is not recorded as a field. The repository description and README say nothing about a hosted service, so none is recorded.
