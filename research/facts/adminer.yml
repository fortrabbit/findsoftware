notes: >
  GitHub reports the license as NOASSERTION (other), so the license entries come from the homepage ("Apache License or GPL 2") and the Packagist metadata, which lists Apache-2.0 and GPL-2.0-only. The homepage says "Supports PHP 5.3+, 7 and 8" while the Packagist metadata for v6.1.2 requires PHP >=7.4; both statements are recorded, and runtimeMin takes the registry value because it describes the latest release. The Packagist "time" value (2014) is the package registration date, not a first release. The Docker Hub pull count in the candidate row (408.3M) was not checked against Docker Hub, so it is not recorded. The homepage lists Docker among user-contributed packages, not as an official image, so no docker field. The maintainer is listed as author on Packagist; no company is named on the pages read. packagistDownloads is recorded twice with its period in the value. githubStargazers was read 2026-10-19.
