notes: >
  The docs site defaults to the Ferron 3 (RC) docs, with the stable docs under /docs/v2. Stable line is 2.8.1 (GitHub latest release, 2026-06-17); the 3.0 line is 3.0.0-rc.10 (2026-10-23), and the docs site labels Ferron 3 as "Ferron 3 (RC)" while the installer (get.ferron.sh/v3) and Docker image (ferronserver/ferron:3) name the 3 line. currentMajor follows the stable release, so it is 2; reviewer to decide. Ferron 1.x is marked EOL on the docs site and is no end signal for the project. The repository default branch is develop-3.x. Cargo.toml at the 2.8.1 tag states no rust-version, so no runtimeMin. The homepage shows "2K+" stars and "50K+" Docker Hub pulls; the recorded figures come from the APIs with their dates. Discord-style chat is a Matrix room (matrix.to/#/#ferronweb:matrix.org), not a field. The docs list Ferron 2 (KDL) as a previous major. Install and service facts cite the stable (v2) docs; the NGINX and Apache migration pages exist only in the Ferron 3 (RC) docs and are cited there. The footer links a Threads account. Fields coined: none.
