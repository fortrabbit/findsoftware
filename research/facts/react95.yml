notes: >
  The CSV boundary question was which release counts. The npm package react95 (4.0.0, published 2022-11-13, repository arturbien/React95, which now redirects to React95/React95) is the old line, and its 2026 figures (2758 downloads in the 2026-10-19 to 2026-10-25 window, 6 dependent packages) are not recorded because the install page names @react95/core. The current package @react95/core has its latest release on GitHub (10.0.6, 2026-10-20). The record is therefore accepted; the reviewer should confirm that the old react95 package is treated as the same project's history and not as a separate record. No homepage is recorded: react95.io is the homepage of the separate GitHub repository react95-io/React95 (not a fork) and its page is a script-rendered app with no readable body text, so nothing ties it to this repository; the page title reads "Refreshed Windows95 UI components for modern web apps". The GitHub homepage field of the repository is react95.github.io/React95, a Storybook that also has no readable text in static HTML; it is not recorded. The LICENSE file adds that "Windows and all associated images are the property of the Microsoft Corp and are not covered by this license." This is a carve-out for images, not a restriction on the code, so the license is MIT. The README badge names the X account @React95lib, recorded as x. The README names a Gitter chat, which has no field. The core package names basedOn nothing: the README says the components are for "your React application" and the package lists react and react-dom as peer dependencies, which is a dependency, not a statement that the project is built on React, so basedOn is not recorded. The maintainer is the GitHub organization because no page names a maintainer; the npm author and maintainers list individual accounts, which are not recorded. The first GitHub release is dated 2019-03-08, the oldest release on the repository. The core README recommends importing a theme stylesheet from the package, with an optional GlobalStyle import for fonts, scrollbars and links, and shows components imported by name from @react95/core.
