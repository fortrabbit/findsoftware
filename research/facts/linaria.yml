notes: >
  The homepage linaria.dev answers 200 but returns an empty JavaScript shell (a root div and a bundle), so it is listed in unreadable and the homepage fact is the repository's homepage field from the API. The documentation is read from the README, which links the docs in the repository. The README says "Linaria is now built on top of wyw-in-js.dev", a tool the project names as its base; no record exists for it, so no basedOn is set. The install line names @linaria/core, @linaria/react and @wyw-in-js/babel-preset; the repository is a monorepo, so the core package @linaria/core is the registry figure and id. Its package figures for the same week are 479147 downloads for @linaria/core and 376156 for @linaria/react; the unscoped linaria package carries only 2582 for the same week, a legacy wrapper. The CSV's "378.4k/wk" matches @linaria/react, not the core package. The GitHub releases list the highest stable version as linaria@8.2.0 (2026-08-10), with no prerelease releases; older tags such as v4.0.0 and v3.0.0-beta.* have no releases. The README's Node.js requirement for version 8 (22.12 or higher) is a build-time toolchain requirement and is not recorded as runtime or runtimeMin. firstRelease is the first npm version (0.0.0, 2017-05-26); the repository was created 2017-05-23. The maintainer is the copyright holder named in LICENSE ("Callstack"); the legal name and country come from the footer of the maintainer's own site, which states the company is seated in Wrocław, Poland. The discord invite resolved on 2026-10-27. The dependent counts are from ecosyste.ms for @linaria/core. The README's trade-offs say that modules used inside CSS rules cannot have side effects and that dynamic styles are not supported in the css tag; they are not recorded as fields.
