notes: >
  The homepage is the docs site named by the repository, which answers 403 to this client, so homepage is recorded from the GitHub API field and the docs are unread; the README points to tablar.ebuz.xyz/docs for the same documentation. The version line follows the Laravel line: 13.8.0 is the newest stable release and requires Laravel 12 or 13, so currentMajor is 13 as the package reports it. The README asks for Node 20.19+ or 22.12+ for the Vite build; that is a build requirement, not a runtime, and it is not recorded in runtime. The Packagist require is php ^8.3, the same minimum the README states. The copyright year 2022 matches the repository's first commit date but no release date is claimed. The package is MIT licensed in both LICENSE and composer.json. The README lists a companion Blade UI kit (tablar-kit) and a demo project; neither is recorded because the scope is this package.
