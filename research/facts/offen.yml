notes: >
  Name taken from the project's pages (Offen Fair Web Analytics). The language is Go on the server and plain JavaScript on the client per the docs' programming languages page; the GitHub language field says JavaScript. The homepage says all website accounts can be shared within teams, and the embedding page documents a JavaScript API for triggering pageviews; the known-issues page says the software does not work behind a Cloudflare proxy. The maintainer follows the copyright line in the README header; that line also carries a contact address, which is not recorded. The offen.dev imprint names an individual operator in Berlin for the website; no hqCountry is recorded for the project, and the operator's country is the website's, not the project's. The README's license section names three statements: Apache-2.0 for all original source code, Apache-2.0 for the documentation, and CC-BY-NC-ND-4.0 for the icon and logo. The Apache-2.0 entry is taken from REUSE.toml because the README's license sentences link through reference-style links that the quote check cannot read; the CC-BY-NC-ND-4.0 logo statement is not recorded as a field for that reason and is for the reviewer to add, since it restricts reuse of the logo. The NOTICE file for bundled works was not read. The offen.dev site's own license (CC BY 4.0 for content, AGPL v3.0 for its code) is the website's, not the project's, and is not recorded. The pages name the binary but no language or minimum runtime for the server, so runtimeMin is left out. The docs say the instance uses first-party cookies only and that data is opt-in, and the consent banner is customizable in color, shape and font; these privacy and embedding kinds are coined and stay in notes. The README and homepage also say usage data is encrypted end-to-end, collected only after opt-in, deleted after six months, and that users can review and delete their own data; no IP addresses or User-Agent strings are collected, per the README. These privacyClaims are coined and stay in notes. Embedding is a script tag from the installed instance (script.js with a data-account-id attribute), best served from a subdomain of the site's own domain, per the installation requirements page. The docs also say the instance must be served over https and that a reverse proxy is advised against. The SMTP and sendmail fallback for account emails is a configuration detail and stays in notes. The "curl https://demo.offen.dev | bash" test drive creates an ephemeral demo and is not an install route. The development setup (docker compose, make setup) is for contributors and is not an installMethod. The project's own Matomo comparison page (offen.dev/matomo-alternative) and its blog post name Matomo as the alternative; the blog post is quoted as alternativeTo. The homepage presents Offen Protocol and Offen Consent Tool as older or related elements; they are not separate records here. No hosted offering or paid edition is stated on the pages read; the Patreon link on the homepage is a donation page and stays in notes. Docker Hub pulls for offen/offen, the image the docs name, were 51899 on 2026-11-03 (hub.docker.com/v2/repositories/offen/offen/), not a field.
