notes: >
  Status accepted from the CSV row. The README says: "I consider this project mostly complete, I still maintain it and review PRs, but it's not under heavy development." The maintainer says the project is still maintained and pull requests are reviewed, so this is no end or maintenance-mode statement. Criteria 1 to 3: a syntax highlighting library for Rust programs, installed with cargo add, with a documented Cargo.toml route. Criterion 4: the newest stable release is v5.3.0 (2025-09-27, GitHub release and crates.io), the repository is not archived, and the default branch had commits on 2026-10-31. The homepage is absent: crates.io lists no homepage, and docs.rs is the generated API documentation, recorded as docs. The crate's first version 0.3.2 is dated 2016-06-20 on crates.io, the oldest release of any kind, so firstRelease is 2016. No rust-version is set in Cargo.toml at the latest tag or on crates.io, so runtimeMin is unset. The LICENSE copyright line names Tristan Hume, Keith Hall and Google Inc with other contributors; the maintainer is the first named holder, and Google Inc is a separate legal entity. The README says the library is used in production by at least two companies and lists open source projects that use it (bat, Scribe, syntect_server, xi-editor and others); these are not counts and are not recorded. crates.io reports 17,749,512 downloads over the recent window in addition to the 41,203,449 total recorded. The README lists built-in output to colored HTML pre tags or 24-bit ANSI terminal escape sequences; output formats are coined kinds and stay in notes. It also describes two regex engines, the default oniguruma and a pure Rust fancy-regex mode. Stars and contributors belong to the single repository.
