notes: >
  No project website exists: the README and the repository are the only pages, so homepage is absent. The README's Status section says the project is "pretty new" with "use at your own risk", and says the issue list is intentionally disabled; neither is an end signal. The same Status section says feature requests are unlikely to be accepted, because the scope is kept to a bare minimum. The repository has three tags (v0.3.0, v0.4.0, v0.4.1) and no GitHub release; the latest tag and the npm latest version are both 0.4.1, published 2022-01-18, so latestReleaseDate is that date. The default branch was last pushed on 2024-07-13 by the repository metadata, which is not a release. Under criterion 4 the import moves a record with no release in four years to stub, so this record is expected to become a stub when imported; the status is left as the candidate row sets it. The httpArchiveSites figure is the mobile origin count for the "petite-vue" entry in the HTTP Archive technologies list. The maintainer is the copyright holder of the LICENSE file; npm lists the author as Evan You.
