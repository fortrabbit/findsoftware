notes: >
  GitHub reports the license as NOASSERTION; the LICENSE file and the npm license field both say MIT, and the file's wording is recorded. The homepage is recorded on https, which answers 200; the GitHub homepage field and the README's links use http. The homepage's "Forum" link goes to a Google Groups list on http, so no forum is recorded; the README's chat badge links a Gitter room, which has no field. The npm author is "The Knockout.js team", the same name the LICENSE copyright line uses. The downloads page's archive lists v1.0.0 dated July 5th, 2010, older than the npm registry's first upload (2.1.0, 2012-05-09) and the oldest GitHub release (v2.3.0, 2013-07-08), so firstRelease is 2010. The last push is 2026-03-25 and the repository is not archived; no end statement was found. The httpArchiveSites figure is the mobile origin count (desktop 17297). The homepage lists tutorials and examples on learn.knockoutjs.com and a Pluralsight course, which are not recorded.
  The README says building from source needs Node.js and Java, and that the built library has no dependency on either and works with any server technology or none.
