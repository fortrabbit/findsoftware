notes: >
  The install docs name @rspack/core with @rspack/cli; the npm figures are @rspack/core, the core package of this monorepo. The first upload of @rspack/core is version 0.0.1 on 2022-04-06, older than the earliest GitHub release v0.1.0 (2023-03-10), so firstRelease is 2022. The LICENSE copyright line names "Bytedance Inc and its affiliates"; the homepage footer repeats it as "© 2022-present ByteDance Inc.", and the homepage links www.bytedance.com; no country is stated, so hqCountry is absent. The homepage says Rspack is a bundler that "modernizes the webpack API to enable seamless replacement of webpack" and the docs say its loaders are "Fully compatible with webpack loaders"; webpack compatibility is a relation the project states, not a basedOn statement, so basedOn is absent. The quick start recommends Rsbuild for web applications, which builds on Rspack; that statement is recorded on the Rsbuild record. The homepage lists companies that use Rspack (among them Amazon, Microsoft, TikTok, Cloudflare, Intuit) as a logo wall with no count; these are names, not a figure, and are not recorded. The homepage's bluesky link is bsky.app/profile/rspack.dev; the Rsbuild homepage links bsky.app/profile/rspack.rs instead, and the Rsbuild record keeps that handle. The Rspack v1 docs at v1.rspack.rs and v0.rspack.rs are not used. The release v2.3.0-rc.0 (2026-10-27) is the newest prerelease and is newer than v2.2.9.
