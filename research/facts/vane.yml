notes: >
  Stub: the project's own site named in the README, http://www.dartvoid.com/vane/, does not resolve (DNS failure) and the GitHub homepage field and the pub.dev homepage (the repository) are the only other project pages, so no homepage is recorded and the record cannot be checked against the project's own documentation. The README's API and project links point to dartvoid.com and to github.com/DartVoid/Vane, which redirects to Scorpiion/vane; the repository is the one that is live. Doubt on whether the project still exists: the last commit on the repository is 2019-03-17, the latest pub.dev release 0.8.2+1 is from 2017-02-11, and no page or file in the repository says the project has ended, is unmaintained or is replaced; a maintainer statement or a new release would settle it. No GitHub release or tag exists, so the registry rule applies: pub.dev package vane, latest stable 0.8.2+1, which sets currentMajor 0, latestReleaseDate and firstRelease (the first pub.dev version 0.1.0 is dated 2014-03-25). The pub.dev sdk constraint for 0.8.2+1 is >=1.9.0 <2.0.0 while the repository's pubspec.yaml on master declares >=2.0.0 <3.0.0 with newer dependency versions, so the repository and the published package differ; runtimeMin is recorded from the published package and the difference is for a reviewer. Install steps: the README has no install section, only code examples that import package:vane/vane.dart, so installMethod is not recorded; the pubspec dependency is the only install statement. The pub.dev page shows likes, points and weekly downloads, which are not recorded. The licence in LICENSE is BSD-3-Clause; the copyright line names the author, who is recorded as maintainer. The README's Summary lists built-in MongoDB support, recorded as databases. The pub.dev dependency list names mustache4dart, but no page states a templating engine, so templating is not recorded.
