notes: >
  The repository has no GitHub releases; its tags run from 0.2.0 (2015-04-12) to 0.9.0, while the crates.io package nickel has stable versions to 0.11.0 (2019-01-15). With no GitHub release, the registry gives currentMajor and latestReleaseDate; the crates.io version list gives the first upload, 0.2.0 of 2015-04-12. The default branch master was last pushed 2022-05-10 and the README's development plan lists 0.11.x as bug fixes only and 0.12.x on master with hyper 0.14, not a stated end of the project. The README says nickel.rs is "inspired by" Express; that is not a parent, so basedOn is not recorded. The README links a Gitter chat in its badge; it is not recorded as forum. The homepage at nickel-org.github.io answers over https and is the project's own GitHub Pages site. The CSV row shows a homepage over http; the https address answers and is used here. The maintainer is the copyright holder in LICENSE; the README names four maintainers (jolhoeft, cburgdorf, Ryman, SimonPersson) and calls the project a community effort. The crate's download count is the total from crates.io. No page states how a nickel app runs on a host, so runsAs is left out. The homepage lists routing with parameters and wildcards, middleware including a static files handler, JSON body mapping onto structs, a custom error handler and mustache templates.
