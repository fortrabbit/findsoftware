notes: >
  Hosted service. The homepage's "View API docs" link leads to no public documentation: the only API link on the page points at a local address (127.0.0.1:8099/openapi.yaml), and /developers returns 404, so the API style is not recorded; the pages say "delivery APIs" and "API keys" without naming REST or GraphQL. The legal entity, its country and the terms are not on the homepage, the pricing page or the about page (/terms, /privacy and /imprint return 404), so hqCountry and a legal maintainer name are unknown; the maintainer is recorded as the product name the pages give. Plans are priced in GBP per month; no amounts are recorded. The pricing page says the Business plan includes SSO without naming the protocol, and the Enterprise plan mentions regions and compliance without a list of regions. The pages mention per-locale revision workflows and revision history, which have no field in the starter list. The about page says Headly is part of product workflows for marketing, product and developer teams; no founding year or first release is stated.
