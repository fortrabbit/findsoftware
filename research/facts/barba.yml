notes: >
  The repository is a monorepo of the @barba/core package and its plugins (@barba/router, @barba/prefetch, @barba/css, listed as tags in the releases); stars, contributors and the GitHub license belong to the monorepo, and the registry figures come from @barba/core, the package the install page names. The npm weekly figure is the sum of 2026-10-26 to 2026-11-01. The README calls the library written in TypeScript and the GitHub language is TypeScript. The npm packages barba.js and barba carry version 1.0.0 (2016-09-11), the pre-scope releases of the same project; the current package is @barba/core. The homepage is the project's own site; its footer reads "barba.js ©️2024" and "Last updated on Dec 2nd", and the docs are the version 2 guide. The homepage links the X account twitter.com/barba_js and a Slack invitation (no Slack field); the README links the sponsor page of one maintainer, not recorded. The maintainer is the LICENSE copyright line's three names, which the npm maintainers list matches; the GitHub organization barbajs owns the repository. The install page gives two CDN script tags, unpkg and jsDelivr, under one sentence that is quoted; the page says the CDN targets the latest version by default and advises a tagged version. runsAs is left out: no page states that Barba runs in the browser in a sentence; the browser support page lists browsers and polyfills, which is support, not a process statement. The browser support page names modern browsers without polyfills and IE10+ with polyfills. The HTTP Archive "Barba.js" entry uses the mobile origins figure (1689); desktop is 1603. Releases on GitHub include prereleases of @barba/core, the newest being 2.1.0 (2019-03-17), older than the latest stable release, so no latestPrereleaseDate.
