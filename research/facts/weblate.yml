notes: >
  Weblate uses calendar versioning (tag weblate-2026.10.1), so currentMajor records the year 2026 and is not a semver major. The GitHub release v2026.10.1 is dated 2026-10-09; PyPI reports the same version. The PyPI license field is null, so the license comes from the GitHub API (GPL-3.0). The minimum Python version is stated by the install docs and matches PyPI requires_python >=3.12. The docs say PostgreSQL 13 and higher is supported, PostgreSQL 15 or newer is recommended; no other database is recorded because the pages read named none. The Docker section of the install docs was read; the image name was not checked, so the docker value says so. hostedService and x are coined here: the hosted offering sits beside the self-hosted install, which is why it is a separate field. hqCountry CZ comes from the company address on the about page ("Cvikov, Czechia"). The docs site shows 2026.11 as its development version; the install facts come from that page. firstRelease was not checked; the repository was created in 2012-02. The homepage pricing link did not resolve at /en/pricing/ or /pricing/, so pricingPage is absent. No project-ended signal was found.
