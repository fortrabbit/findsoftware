notes: >
  Accepted: Pushpin is a server-side proxy, not a finished application, and its own pages document the integration a web backend uses: the backend answers each proxied request with GRIP response headers ("Grip-Hold: stream", "Grip-Channel: mychannel") and pushes data by POST to the control API at /publish on port 5561 ("POST /publish HTTP/1.1"). Protocols the proxy speaks, from the homepage and about page: HTTP streaming, HTTP long-polling, WebSockets, and SockJS translation for older browsers; the GRIP and ZHTTP protocols are documented in the docs; these go to notes, not a field. The about page states "Commercial support is provided by Fastly", a paid support statement, so no paidEdition is recorded. The repository language mix: Rust (about 2.0 MB of code) and C++ (about 1.8 MB), with Python, C and Shell beside them; the record keeps Rust, the repository's main language, and the C++ share stays here. The repository description says Pushpin is "used at the core of Fastly's Fanout service", and the about page links fanout.io/cloud; fanout.io/cloud redirects to Fastly's Fanout page, which does not name Pushpin, so no hostedOffering is recorded. The current release line is 1.42.0 and the install page says all releases have been major version 1. The first release is taken from the oldest tag, v1.0.0, committed 2014-09-15 (the repository was created 2012-08-29). The GitHub release list has no prerelease entries. The docs pages for setup, changes and FAQ returned 404 and were not read; the configuration, usage and about pages were read. The Docker image fanout/pushpin is the one the install page names. The maintainer is Fastly, Inc., as the homepage footer states; the pages read give no headquarters country, so hqCountry is unknown.