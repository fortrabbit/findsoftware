notes: >
  The repository is the only project link: the CSV homepage is the GitHub URL, and the README names no website, so no homepage is recorded. The API documentation is the hexdocs site the README links; the hexdocs readme is also at guardian.hexdocs.pm. The LICENSE file names Daniel Neighman as the 2015 copyright holder, and the README copyright line says the same. The organization ueberauth owns the repository; the Hex package lists the ueberauth owner. The README says Guardian integrates with Plug and works with Phoenix, but names no parent, so no basedOn is recorded; guardian_phoenix, guardian_db, sans_password and protego are separate packages the README lists as related, and none is a candidate. The mix.exs declares elixir "~> 1.13" at v2.5.0; the Elixir version is a language requirement, not an OTP minimum, and no page names an OTP version, so runtimeMin is left out. JSON Web Tokens are the default token type; that is a token format and is recorded here only, not as a field. The first release is the oldest tag, v0.8.1, committed 2015-12-24; the Hex package was created 2015-06-19. Stars and contributors are for the repository. The latest stable GitHub release is v2.5.0 (2026-08-17), matching the Hex latest 2.5.0; the repository was pushed on 2026-08-18 and is not archived.
  The README Basics section names encode_and_sign, decode_and_verify, revoke and refresh as the core functions. Tracking revocation needs a separate library: the README says JWT tokens are not tracked by default, and points to GuardianDb for recording issued tokens.
