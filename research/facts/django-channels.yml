notes: >
  The repository is django/channels and holds the Channels package only; the sibling packages Daphne, channels_redis and asgiref are separate repositories the README lists, and their figures are not recorded here. GitHub has no releases, only tags; the PyPI release 4.3.2 (2025-11-20) is the newest stable version and sets currentMajor and latestReleaseDate. The first PyPI upload is dated 2015-06-15, which gives firstRelease 2015; the repository was created 2015-06-03. The runtime minimum is taken from setup.cfg at tag 4.3.2 (python_requires >=3.9), as the manifest rule requires; the README at main says "All Channels projects currently support Python 3.10 and up", a conflict the reviewer should settle. The Redis channel layer (channels_redis) is an optional backend the deploying page names; no databases value is recorded for it. The maintainer is the Django Software Foundation as the LICENSE line and setup.cfg author state; the README names Carlton Gibson as the maintainer lead, not recorded as the maintainer. The pypistats figure is the last-month count from the recent endpoint.
  The docs index says Channels "is built on a Python specification called ASGI" and builds on Django's native ASGI support, which handles plain HTTP. The installation page says to set ASGI_APPLICATION to a routing object in asgi.py that sends the "http" protocol to Django and other protocols to their own handlers. The deploying page says to run Daphne "inside either a process supervisor (systemd, supervisord) or a container orchestration system", which is the always-on process model recorded in runsAs. The README describes Channels as augmenting Django "to bring WebSocket, long-poll HTTP, task offloading and other async support".
  The deploying page says a channel backend "will connect to one or more central servers that serve as the communication layer", and the Redis backend is one such backend; the channel layer is optional on that page.
