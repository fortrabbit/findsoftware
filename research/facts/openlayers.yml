notes: >
  The library is a single package, so the repository figures and the ol npm package are the same project. The homepage lists the older major lines (v9.2.4, v8.2.0 and earlier) as older versions; their releases are not recorded. The oldest GitHub release is the 2013 prerelease r3.0.0-alpha.2, earlier than the npm package ol (first upload 3.1.0-pre.1 in 2014), so firstRelease takes the GitHub release year. The download page also offers a hosted development build from the jsDelivr CDN as a script tag, marked "not recommended for production", and the README names Skypack for prototyping without Node.js; they are not recorded as installMethod, since the route names only appear in code blocks. The homepage says the library uses Canvas 2D and WebGL and that it has mobile support out of the box, and the README says it has TypeScript declarations; these are coined kinds and belong to notes. The README names OpenStreetMap, Bing, MapBox and Stadia Maps as tile sources; these are data sources, not fields. The README says it runs on all modern browsers (with greater than 1% global usage) and that polyfills are needed for older ones. The quickstart requires Node 14 or higher for the development setup of an application, not for the library. The FAQ and Stack Overflow tag 'openlayers' are a general question channel, not the project's forum. The sponsor logos (Pozi, yey'maps, ela-compil, Ubigu, Scribble Maps) and the fiscal sponsors are not recorded. The httpArchiveSites figure is the mobile count of the HTTP Archive technology entry named OpenLayers. The docs CC BY 3.0 license covers documentation only and is recorded as a separate license entry. The documentation site offers a quick start, an FAQ, tutorials, a workshop, API docs and examples; the README says it displays map tiles, vector data and markers "loaded from any source", and the homepage describes the library as pulling tiles from OSM, Bing, MapBox and Stadia Maps and rendering GeoJSON, TopoJSON, KML, GML and Mapbox vector tiles.
