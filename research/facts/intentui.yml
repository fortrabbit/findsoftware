notes: >
  Criterion 1 and 2 hold on the copy-paste model: the CLI adds source files from the shadcn registry under the @intentui namespace, and the manual path copies source. The install docs name the shadcn CLI, which is not the project's own package, so no npm figure is recorded for it. The paidEdition value is the Design product sold at design.intentui.com, separate from the open source library, which is the reason the edition is recorded here and not the library's license. The installation page names framework guides for Laravel, Next.js, Vite and TanStack Router; none of them is recorded as runtime because the library is React source and the guides are project setup. The LICENSE copyright line gives no legal form, so the name is recorded as written. intentui.com answered HTTP 500 to the quote checker, so every page fact is cited from the docs and config source in the 4.x branch of the repository (src/content/docs, src/config/app.ts), where the Discord server and X follow link are configured. The 4.x default branch is the one the README names, and the highest stable release is v4.0.2.
