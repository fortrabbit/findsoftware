notes: |-
  The homepage is the docs and also the install page, so no separate docs fact is recorded. It lists three ways to get the file: link the unpkg CDN ("Link this CSS in your HTML", https://unpkg.com/chota), download the zip from GitHub ("You can get the latest release from GitHub"), or npm; installMethod records each route as its own entry with its own quote. The GitHub releases end at v0.8.1 (2023-01-18), with tags v0.9.0 to v0.9.2 and no release object; npm latest is 0.9.2 (2023-03-22), the same major, so currentMajor is 0 and latestReleaseDate is the npm date. The npm 0.1.0 upload (2017-03-30) is older than the earliest GitHub release (v0.5.0, 2018), so firstRelease is 2017. The HTTP Archive technologies list has no entry for Chota, so httpArchiveSites is not recorded. The homepage's features list names a 12 column grid, CSS variables for theming, a dark mode switch, a few components and utilities, and icon support; these are described in the prose only and are not fields. The homepage's own size figure is not recorded because it changes with releases. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header.
   The homepage also says Chota "applies a few basic styles to the HTML following the HTML Semantics" and "doesn't require learning a lot of class names like other frameworks". The README says it uses no preprocessor or complex build process and points to a fork for Sass support.
