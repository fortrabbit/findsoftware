notes: >
  The documentation site returns only its page title to this client, a script-rendered shell, so the install and deployment steps come from the README and the homepage. The README names deployment via FTP or Netlify as built in. The README and homepage list the features: a local development server with hot reloading, concatenation and minification of HTML, styles and scripts, image optimization, favicon generation from one source file, linting of JavaScript and CSS, generation of sitemap.xml and robots.txt, and deployment via FTP or Netlify. The homepage's build steps are "npm install", "npm run start" and "npm run build:dist". Node is not named on any page read, so runtime is unknown. firstRelease is from the oldest GitHub release, 1.0.0-beta.1 (2018-12-28). The npm dist-tag latest points to 1.0.0-beta.4 (2019-01-25), while the highest stable GitHub release is 1.1.0; the GitHub release is used for currentMajor and latestReleaseDate. The homepage is the project's own site and shows the boilerplate, so the status is accepted; the release date is over four years old and the import moves the record to stub. The GitHub contributor count is taken from the last page number of the contributors endpoint.
