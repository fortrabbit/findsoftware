notes: >
  Repository only: no project site is named by the README or the repository, and https://mailslurper.com/ answers 404 and https://mailslurper.github.io/ answers 404, so homepage is not recorded. The GitHub repository reports JavaScript as its primary language because of the bundled web interface; the Go module (go.mod, go 1.13) and the README's Go build steps make it a Go program, so language is recorded as Go. The README says "MailSlurper is perfect for individual developers or small teams writing mail-enabled applications that wish to test email functionality"; the wiring statement is "configure your code and/or application server to send mail through the address where MailSlurper is running". The runsAs value rests on the repository description, which says "Local, web-based mail server application."; the reviewer decides whether that is enough for local. The database engines come from the source file pkg/mailslurper/StorageType.go and the default config.json names "dbEngine": "SQLite". Release history: the last tagged release is release-1.15.0 (2023-08-03); the repository was last pushed 2025-12-05. A README with a MIT notice dated 2013-2018 is the license statement. The Docker image is published to GitHub Container Registry, not Docker Hub, so no Docker Hub pull figure is recorded.
