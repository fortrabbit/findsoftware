notes: >
  Stub because the release state is in doubt: the only GitHub release is 2.1.6 from 2020, while package.json and the docs changelog name 3.0.0 (2025-11-08) without a tagged release; a tagged 3.x release on GitHub or a published 3.x package would settle it and list the record. The README title says EggCMS while the repository, the GitHub description, the homepage, the docs site and the LICENSE copyright line say DoraCMS; the record uses DoraCMS. Egg.js and Vue come from the README sentence "based on EggJS 3.x + Vue 3 + TypeScript"; SoybeanAdmin is the admin center base the README names. The README badge says Node.js >= 14.0.0 and the FAQ says the admin center needs 18.20; the docs quick start says "Node.js 18.20+", which runtimeMin records. The language field is GitHub's primary language; GitHub's language bytes also show Vue and TypeScript. The only GitHub release is 2.1.6 (2020-08-01); tags are v1.1.0, v2.0.3 and 2.1.6, and the repository's package.json version and the docs changelog say 3.0.0 with a date of 2025-11-08 while another docs page says "v3.0 (2024)", so currentMajor and latestReleaseDate follow the GitHub release and the import will move this record to stub by its release date. firstRelease is left out: the v1.1.0 tag is dated 2015, the docs changelog gives v1.0.0 in 2018, and neither is a GitHub release. The docs site is a VitePress site; its Docker deployment page is www.doracms.net/deployment/docker. The README gives MongoDB as the default database in Docker Compose and MariaDB under a Compose profile; Redis is optional. The npm package doracms-cli (author DoraCMS Team) scaffolds projects; its registry figures are not recorded. The community link in the README is a QQ and WeChat group image.
