notes: >
  The API reference at app.thebcms.com/open-api-docs answers 200 with an empty JavaScript shell, so no API style is recorded from it. The pricing page lists SSO under the Enterprise plan. Hosted product beside an ended open-source part: thebcms.com offers BCMS Cloud with a 14-day free trial and pricing page (no price recorded), so the record is hosted-service. The open-source repository github.com/bcms/cms (organization-owned, TypeScript, MIT, last commit 2026-06-25, 465 stars and 4 contributors on 2026-10-23, no release or tag) says "This repository is no longer maintained." and that core development moved to a private codebase in October 2024 with no further updates, fixes or releases; it stays public and free to use, fork and build on. Its README lists Node.js 20, Docker and Docker Compose, MongoDB, and a Debian server deploy with the @bcms/selfhosted-cli. These are facts of the ended build, not of the hosted product, and are not recorded as the product's license, runtime or adoption. The README says BCMS Cloud went closed-source, so the cloud product is not recorded as a successor. Terms and privacy pages name Becomes tech, LLC, a Delaware company in Dover, as the operator. The alternativeTo list comes from the "alternative" comparison pages on thebcms.com (the quote is from the Strapi page). The /compare/ pages also cover Forestry, GatherContent, Squarespace, TakeShape, Apostrophe CMS and Webflow.
