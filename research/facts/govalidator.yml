notes: >
  The homepage is the project page on the maintainer's personal site, the only page for the project outside GitHub; its title is the quoted line, and its structured data names Aliaksei Saskevich as the author, which matches the LICENSE line. The latest GitHub release object is v11.0.1 (2021-03-07); the newest stable version is the v12.0.0 tag (commit dated 2026-04-14), which the README installs by its /v12 import path and the Go module proxy serves, so currentMajor is 12 under the registry rule and the release date comes from the proxy's info record. The README intro says the package is based on validator.js, a JavaScript library; that parent has no record id, so it is noted here and basedOn is left out. The Installation section gives go get for the /v12 path and a gopkg.in route, each recorded as installMethod. The README documents ValidateStruct with valid struct tags, plain validator functions, SetFieldsRequiredByDefault and custom validators through CustomTypeTagMap; its recent-breaking-changes section says the custom validator function gained a context as second parameter and that custom validators are now added with a Set method to prevent data races. The README's Recent breaking changes section and its "What to contribute" list name no end, so the status stays accepted. The dependent counts are for the /v12 module path the install docs name: 0 packages and 0 repositories. The unversioned path github.com/asaskevich/govalidator has 14620 dependent packages and 44225 dependent repositories in ecosyste.ms, but it is a different module path and is not recorded. Stars and contributors belong to the repository. The README's Sponsors and Backers blocks are Open Collective funding, not recorded.
