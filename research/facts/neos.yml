notes: >
  The CSV names the monorepo neos/neos-development-collection as the repository; its composer.json is type neos-package-collection and states php ^8.0, while the neos/neos package on Packagist states php ^8.4 and is the one recorded for runtimeMin and the download figures. The licence is stated two ways: GitHub reports GPL-3.0, the monorepo composer.json and the Packagist entry say GPL-3.0-or-later; both are recorded. No paid edition page was read, so paidEdition is unknown. The databases field is left out: the system-requirements table lists MariaDB, MySQL and PostgreSQL in columns whose rows do not parse cleanly for the latest version, and the page heading says "PHP & MySQL or PostgreSQL"; a reviewer should read the table directly. The basedOn parent is Neos Flow (neos/flow); Flow is not a row in any candidates CSV, so a reviewer must decide whether it gets its own candidate. The Neos Foundation e.V. legal form and registration are on the imprint page (Dresden registration VR 11642). The installation docs name Docker, DDEV and manual setup,; the composer command for a new project is not read from a page, so installMethod does not name it. The system-requirements page says the PHP CLI version must match the web server's PHP version, because Neos precompiles classes with it and does not work without it; it recommends VIPS, ImageMagick or GraphicsMagick over GD for images. Neither is recorded as a field.
