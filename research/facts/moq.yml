notes: >
  No homepage: the repository is the project's only web presence that the README or the registry names, so the record has no homepage. The README badges link github.com/moq/moq and the issue tracker is at github.com/moq/moq/issues; that path redirects to devlooped/moq. The default branch (main) README says it "now contains the upcoming version of Moq (v5)" and that the current stable Moq v4.x is on the v4 branch; the project is not archived, and the stable release is v4.21.0 (2026-09-24), so the record stays accepted and currentMajor is the stable 4. The license is recorded from the latest release (v4.21.0, License.txt, BSD-3-Clause); the default branch's license.txt is MIT with the copyright line "Copyright (c) Daniel Cazzulino and Contributors", which belongs to the upcoming v5 and is not a release license. The maintainer follows the copyright line of License.txt at the latest release tag (v4.21.0), the same release the license comes from; the default branch's license.txt reads "Copyright (c) Daniel Cazzulino and Contributors" and belongs to the upcoming v5. The README says Moq was originally developed by Clarius, Manas and InSTEDD. The NuGet package's owners are clarius, Devlooped and kzu. The README says Moq is built to set up dependencies for tests, and that it uses Castle DynamicProxy internally; Castle.Core is a dependency in the nuspec (5.2.1), no record exists, so no basedOn. The v4.21.0 nuspec targets .NETStandard2.0, .NETStandard2.1, net6.0 and .NETFramework4.6.2; these are build targets, not a minimum runtime, so runtimeMin is not recorded. firstRelease is the oldest commit tagged in the repository, v4.0.10827, committed 2010-08-19; NuGet's first real publish is 2011-02-09 (4.0.10827 and 3.1.416.3). The README's Sponsors section and the GitHub Sponsors link are not recorded. The GitHub contributors endpoint reports 7 contributors for the repository.
