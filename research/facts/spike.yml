notes: >
  The README states "This project is currently unmaintained", which sets discontinued; the repository is not archived and the npm package has no deprecation flag. The npm package named spike has a created time of 2013, before this project's first release, so firstRelease is 2016 from the oldest GitHub release v0.2.1 (2016-05-13), and the npm history is not used. currentMajor is 2 from v2.3.0, the highest stable GitHub release; the npm next tag 0.15.0-1 is a pre-release and is skipped. The license is MIT per package.json and license.md; the GitHub API reports NOASSERTION. The maintainer is recorded from the LICENSE copyright line as Jeff Escalante. The docs say the project is "sponsored and maintained by Carrot Creative" and the homepage says "sponsored primarily by Carrot"; no parent is recorded because neither states ownership. The repository owner is the organization static-dev. The README states that the command line tool collects anonymous usage data by default and that `spike analytics disable` turns it off. The runtime is node 6 or newer; the README says so only as a note. The last push is 2019-02-07. The homepage is at http://spike.js.org, which redirects to https; the https address is recorded.
