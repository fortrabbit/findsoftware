notes: >
  Stryker is a monorepo of the JavaScript, C# (stryker-net) and Scala (stryker4s) tools, which the homepage lists as separate projects; stars and contributors belong to the stryker-js repository, and npm figures come from @stryker-mutator/core, the package the README and getting-started page install. The npm figure counts downloads from the registry for that one package over the period shown. The homepage says the site is "Maintained by the open source community at GitHub", and the core package.json names Simon de Lang as author; the author line is recorded as the maintainer and the footer's "Powered by Info Support" is a sponsor of the site, not the maintainer. The LICENSE file has no copyright line. The introduction says the project started as a pure JavaScript mutation testing framework called Stryker and was rebranded to StrykerJS; the name on the record is StrykerJS. The docs list supported test subjects (TypeScript, React, Angular, VueJS, Svelte, NodeJS) and test runner plugins (Jest, Mocha, Vitest and others); these are not basedOn or pluginDirectory statements and are not recorded. The Stryker Dashboard is a separate hosted site at dashboard.stryker-mutator.io that the docs describe as free for open source projects and as hosting reports in the cloud; it is recorded as hostedOffering because its own page offers it as a hosted service; the page says a repository is enabled on it by logging in with a GitHub account and adding a dashboard reporter to the Stryker configuration. The homepage links a Slack workspace invite, a coined kind noted here instead of a field. The dashboard page says it supplies a mutation score badge and is free to use for open source. The homepage lists a FOSDEM talk and a blog; neither is a fact field.
