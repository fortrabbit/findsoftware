notes: >
  A monorepo (messageformat/messageformat) holding the MF2 package messageformat (mf2/messageformat), the MF1 packages @messageformat/core and others, and the Fluent and resource packages. The record is the MF2 package, the one the root README lists first and the MF2 README installs; stars, contributors and the GitHub release history belong to the whole monorepo. The root LICENSE is MIT with the copyright line "Copyright OpenJS Foundation and contributors"; mf2/messageformat/LICENSE is Apache-2.0 for the package. Both statements are recorded as license entries. The maintainer follows the root LICENSE line, which names the OpenJS Foundation; the README says the project is "an OpenJS Foundation project", so a reviewer may prefer the project's own organization as maintainer. The npm weekly figure is the sum of downloads for 2026-11-01 to 2026-11-07. The earlier MF1 package @messageformat/core is a separate npm package with its own figure, not recorded here. The README says the v4 API differs from the earlier majors, which were built on ICU MessageFormat, and points to @messageformat/core for them. firstRelease is the first npm upload of the package name, 0.1.0 on 2012-02-28, published by Alex Sexton from the earlier repository SlexAxton/messageformat.js, which the project later moved to its own organization. The MF2 README installs with "npm install --save messageformat" under no heading; the command is recorded as the npm route. The homepage and the README name Intl.MessageFormat and ICU MessageFormat, and the README links to the MF1 documentation at messageformat.github.io/mf1; that is no basedOn statement. The package manifest sets engines to Node ^20.19, ^22.12 or >=24; the README names no Node.js and the library is also used in browsers, so no runtime is recorded.
