notes: >
  Homepage is https://jotai.pmnd.rs/, the project's own docs site under the pmndrs domain: jotai.org, which the README and the repository homepage field still name, fails the TLS handshake from the research host on 2026-11-16 and over plain HTTP serves a registrar parking page (whois updated 2026-11-09). The docs state Node.js 22.12.0 or later beside React 18; as a browser state library that is a build requirement, so no runtime is recorded.
