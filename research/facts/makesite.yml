notes: >
  No homepage: the GitHub homepage field is empty. The README links a demo at tmug.github.io/makesite-demo, which is a demo, not the project's own site. The repository has no release and no tag, so the last commit date on the default branch decides listing (AGENTS.md criterion 4). The contributor count is the last page of the contributors endpoint with per_page=1. The README says the project does not accept new features such as Jinja templates or YAML front matter, and accepts bug fixes and minor improvements only. The README states that Markdown posts need the commonmark package to render, and that the layout placeholders use the {{ key }} syntax; no template engine field is recorded for this. The README gives Python 2.7 and 3.x as the interpreters it runs under, with no minimum version, so runtimeMin is absent. The PyPI package named makesite is a different project (klen/makesite) and is not recorded.
  The README describes the repository as an example website and says to fork it and replace the content with your own. The README says the generated output is written to a directory whose content may be copied to a hosting location.
