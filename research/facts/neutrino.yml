notes: >
  The homepage neutrinojs.org no longer answers with the project: it redirects to an unrelated gambling site, so no homepage is recorded. Under AGENTS.md a dead homepage alone makes a stub; the record is discontinued here because the repository the README names as its source is archived and the npm package is deprecated ("Package no longer supported"). The reviewer decides between discontinued and stub. The docs at neutrinojs.org are unreachable; the docs folder of the repository is read in its place. The repository has no GitHub releases; the highest stable tag is v9.5.0, published to npm on 2020-12-23, the last push to the default branch is 2024-02-03. The npm package named neutrino has earlier versions from 2014 and 2016 under the same name; firstRelease is taken from the oldest tag in this repository (v4.0.0-beta.0, committed 2017-02-16), not from npm history. The root package.json declares node 12 or later; the published package declares node 10 or later and the docs say Node.js 10+, so runtimeMin is 10. The npm weekly download figure counts the neutrino package the install docs name; the repository is a lerna monorepo of middleware packages, which are not counted here. The README names webpack as the build engine, so basedOn is webpack. The MPL-2.0 license is recorded from the repository metadata and the LICENSE file at v9.5.0.
