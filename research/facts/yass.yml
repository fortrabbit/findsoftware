notes: >
  The homepage is served over https at www.yass.website; the GitHub Pages address in the CSV redirects there. The site's "Last release" line dates 3.1.0 to 2024-08-23, one day before the GitHub release date, which is the date recorded. The alire.toml on the default branch is at version 3.2.0-dev; it is not a release and is not counted. The README states the build needs libcmark (CommonMark) and the Ada Web Server; the installation page lists libcmark as a requirement to run the program as well as to build it. The README adds that libcmark is distributed with the program under several open source licenses. The homepage says the program is headless (no user interface) and used from the console, and that it handles CommonMark through libcmark. The GitHub license field and COPYING both give GPL-3.0. The maintainer is taken from the maintainers entry of alire.toml, which the project publishes; authors lists the same name.
