notes: |-
  The project has no GitHub repository: source is in a git repository at git://ikiwiki.branchable.com/, which the download page names, and the record uses that URL. The homepage is https://ikiwiki.info/. The CSV gave the Debian popcon count of 191 installs, which is not a registry or project figure in the allowed list, so no reportedInstalls is recorded. The major is 3 by the project's own version scheme (3.YYYYMMDD), with the latest announced release 3.20260201 on the news page; no GitHub release exists to check it against. The maintainer is recorded as the homepage names the developer, Joey; the news page lists Joey Hess as a committer, which is not used as the legal name. The install page asks for "a recent version of perl such as 5.10", a hedged figure, so runtimeMin is not recorded. The news page's oldest dated post is from 2006 and the 1.0 release date is not stated on a page, so firstRelease is not recorded. The features page says optional features need CGI, which is the basis for the per-request value. The categories are the project's own words "wiki compiler" and "blogging".
   The license page also gives the basewiki pages (without the smilies) and the templates that become part of a wiki a separate permissive grant, "Redistribution and use in source and compiled forms, with or without modification, are permitted under any circumstances", which has no SPDX id and is not recorded as a second license entry. OpenID and HTTP basic authentication are named as login methods on the features page; they are not recorded as sso. The 2.0 news item calls its own text "the year since the 1.0 release" but no page dates 1.0, so firstRelease stays unknown. The setup tutorial installs with apt-get, Fedora and Alpine packages or the download and install pages.
