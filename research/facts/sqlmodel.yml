notes: >
  The LICENSE copyright line names Sebastián Ramírez (2021), recorded as the maintainer; the PyPI author email carries the same name, and the repository belongs to the fastapi organization on GitHub. The homepage links an x account (tiangolo) and a LinkedIn profile of the same author; the x link is recorded as x, the LinkedIn profile has no field. The features page says SQLModel is based on Pydantic and on SQLAlchemy; both have records and both are recorded as basedOn. The README says the library is designed to be compatible with FastAPI and that it was created by the same author as FastAPI; compatibility is no basedOn statement, so fastapi is not recorded there. The first PyPI upload (0.0.1) is dated 2021-08-24, the same day as the oldest GitHub release (0.0.2); the PyPI JSON sets firstRelease. The latest release list has no prerelease, so no latestPrereleaseDate is recorded. The pyproject.toml at tag 0.0.50 states requires-python ">=3.11" and license "MIT". The install page's Library Skills route (uvx) is an AI agent skill installer, not an install route for the library, and is not recorded. The databases tutorial page names PostgreSQL and MySQL as examples of server databases and the README shows a SQLite file; those are the databases recorded. The PyPI JSON carries no license field; the license comes from the repository. The pypistats figure is the recent endpoint's last_month value.
