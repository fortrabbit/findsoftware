notes: >
  Stub: the homepage sockjs.org (reached by a 301 from http) now serves an unrelated programming school site, so the project's own site no longer shows the software; a later pass settles it by finding a live project site or docs, and the status fact cites that page. Four-year rule: the latest stable release v1.6.1 is dated 2022-05-28, so the import moves a record like this to stub regardless; the repository was last pushed 2026-10-22. No homepage is recorded. The README lists SockJS-node (Node.js), SockJS-erlang, Spring, vert.x and other server counterparts; none is recorded as basedOn because the client is not built on them. Tidelift commercial support is paid support, not an edition. The README says SockJS tries native WebSockets first and falls back to browser transports such as streaming and polling. The README says a single SockJS session uses two browser connections to one domain, and that opening more than one SockJS connection at a time is generally a bad practice. The README names SockJS-node as the server for Node.js and lists servers for other languages. The npm figure counts the package the CDN route in the README names (sockjs-client). The forum entry is the Google Groups mailing list the README names for discussions and support; the README also has a gitter.im chat badge, which has no field. The oldest GitHub tag is v0.0.0 (a preparation commit); the v0.0.1 tag is the commit "Release 0.0.1" dated 2011-08-15, and the oldest npm upload is 2012, so firstRelease is 2011. The package.json on the default branch shows a version newer than the npm latest, which is not a release. Contributors counted with per_page=1 across all pages.
