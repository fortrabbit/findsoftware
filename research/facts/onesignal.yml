notes: >
  Hosted-service rule: the service is only offered as SaaS. The SDK repositories are under github.com/OneSignal (the homepage links the organization); the React plugin OneSignal/react-onesignal is the npm package react-onesignal. Its stars, license and npm figure are not recorded in fields, per the hosted-service rule. The homepage SDK list is "Android, iOS, Flutter, React Native, Expo, and Unity", and the homepage says "drop in our SDKs". The docs describe a web SDK and a mobile SDK set-up.
  Maintainer: the terms say the services are "provided by OneSignal, Inc." and the same terms name San Francisco, California as the forum for disputes. The terms and privacy page name no headquarters address, so hqCountry is not recorded. The about page lists offices in San Francisco, San Mateo, New York, London and Singapore without naming a headquarters.
  Pricing: plans are Free, Growth, Professional and Enterprise, with Professional and Enterprise sold by contact. The Free plan is a feature of the pricing page; prices are not recorded.
  Features named on the pricing and privacy pages (coined fields, notes only): "Two-Factor Authentication", "Audit Logs" and "Security & compliance" for the higher plans, "GDPR Compliance", a Business Associate Agreement "available to customers by request on our Enterprise Plan", and "Event Streams". The pricing page lists "OneSignal AI", "OneSignal AI Agent" and "OneSignal MCP". The docs describe a single API for campaigns, which is noted here rather than recorded as a field. The homepage feature list names Journeys, Personalization, Segmentation, Analytics, Events, API and SDKs.
  Channels: the homepage lists mobile push, web push, email, in-app messaging, RCS, SMS and Live Activities as messaging channels; these are features of the service and are not recorded as fields.
  Terms: the Standard Terms name OneSignal, Inc. as the provider and give no address. Roles: the team-member docs list organization roles (Admin, Finance, Operations, Editor and others) and app-level roles, and mention SSO without naming a protocol. Social: the homepage also links LinkedIn (linkedin.com/company/onesignal), which no field fits, and GitHub organizations OneSignal and OneSignalDevelopers.
  No self-host path: the docs have no self-hosting page and the homepage names no installable part, so selfHostOption is not recorded.
