notes: >
  Criterion 1 is in doubt: Bojler builds HTML email templates that mail clients render, and the criterion covers software that builds or extends a website or web app. A reviewer's decision on whether an email framework belongs in the register would settle it; the CSV row lists it as accepted, and this file stays a stub until then. Status facts: the latest GitHub release v5.0.3 is dated 2022-08-24 and the default branch's last push is 2023-12-06, so the import moves the record to stub on its own after four years without a release. The npm package @slicejack/bojler has dist-tag latest 3.2.1, older than the GitHub release, and its last-week downloads are 2, so no npm figure is recorded; the getting-started page names the release zip and the clone, not an npm package. The license comes from LICENSE.md and the README. The legal name of the maintainer is not on any page read; the homepage names Slicejack. Categories: the CSV row lists css-framework, but the pages describe an email framework, so only email-templating is recorded. firstRelease is the oldest GitHub release, v2.0.0 dated 2017-06-29; the repository was created in 2016. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header.
