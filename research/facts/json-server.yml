notes: >
  The repository is the only web presence, so there is no homepage. The stable line is v0.17.4 (GitHub release 2023-09-29), which gives currentMajor 0; the v1 beta (v1.0.0-beta.15, 2026-03-23) is the one the README documents and npm lists as latest. The README says the v1 beta is "usable but expect breaking changes". The runtimeMin comes from the stable tag's package.json because the beta's engines field is a prerelease value (node >=22.12.0 in v1.0.0-beta.15). runsAs is absent: the README says the server "starts at http://localhost:3000" but no sentence says the tool runs locally or in CI. The installMethod quote is the install command under the README's Install heading. The category comes from the GitHub repository description, which is the project's own words. Dependent counts are from ecosyste.ms for the npm package json-server.
