notes: >
  The repository is the only project site found: the README names no website, and the repository has no homepage field, so no homepage is recorded. The releases named pgcat-0.2.x (latest pgcat-0.2.5, 2024-11-11) are Helm chart releases ("A Helm chart for PgCat" in the release body), not software releases; currentMajor and latestReleaseDate come from v1.2.0 (2024-08-30), the newest software release. The default branch's Cargo.toml says version 1.3.0 with no tag. The first release is the alpha v0.1.0-alpha (2022-02-22, marked prerelease); the first stable release v1.0.0 is dated 2023-03-25. The README's configuration link points to levkk/pgcat, the earlier owner of the same repository. The README's "Join our Discord!" is the alt text of a badge. The LICENSE copyright line names "PgCat Contributors", and the README names no company; the PostgresML name appears only as the repository owner and in a case study link. The repository owner is an organization, and a Helm chart named in the releases is not an install route the README names, so it is left out of installMethod.
