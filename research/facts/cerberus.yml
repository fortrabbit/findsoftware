notes: >
  The homepage given in the CSV, http://python-cerberus.org, answers only with a 301 to docs.python-cerberus.org over http and then https; the record links the https docs site as the homepage, since that is where the project's own site now serves. The repository has no GitHub releases; the registry's stable version 1.3.8 (PyPI upload 2025-11-06) and the matching tag set currentMajor and latestReleaseDate. The default branch is 1.3.x. firstRelease is 2012 from the PyPI upload of 0.0.1 on 2012-10-16, earlier than the oldest GitHub tag. The README says the library has no dependencies; pyproject.toml declares one dependency, importlib-metadata, for Python below 3.8, so the README statement is not recorded as a fact. The README names Nicola Iarocci as the project's author and the LICENSE copyright line gives the same name, which is the maintainer recorded. Eve, the REST framework that uses Cerberus, is a separate project and gets no basedOn or alternativeTo. The docs' community page names a cerberus tag on Stack Overflow; a question and answer tag is no project forum, so no forum fact is recorded. The docs mention a Google Group for the Eve project, which is not Cerberus. The PyPI figure is the pypistats.org last_month count, read on 2026-11-04. In the README example a Validator is built from a schema dict and its validate method returns True for a matching dict.
