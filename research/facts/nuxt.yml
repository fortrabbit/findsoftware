notes: >
  Framework, so contentStore, databases, adminUi and headlessApi do not apply to the core; content and i18n come from separate modules (Nuxt Content, @nuxtjs/i18n) that were not researched here. The team page names no company, while Vercel's own post says NuxtLabs (stewards of Nuxt) joined Vercel in July 2025 and that Nuxt stays MIT with open governance, so parent is Vercel and maintainerType is community per the team page; this pair needs a decision in the schema. renderingModes edge stands for edge-side rendering, which the docs call a deployment target. The templates page mixes free and paid third-party templates and does not mark which are official. contributors is the GitHub API count including anonymous contributors. npmWeeklyDownloads covers 2026-10-10 to 2026-10-16. outputDir .output holds the server entry .output/server/index.mjs and static output in .output/public. supportedVersions: endoflife.date lists 3 as EOL 2026-07-31. The templates page lists 43 templates: 29 free, 2 freemium, 12 premium.
