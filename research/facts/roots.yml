notes: >
  Status is stub: both homepage addresses (roots.netlify.com, which answers 404, and roots.cx, which has no DNS record) are dead, and the docs link in the README is dead too. The README is in the repository the project names as its source and says Roots is in maintenance mode, not under active development, and that the team now works on spike, which it says has superseded Roots; that is not an end statement and no archive flag or deprecation was found. The site roots.netlify.app serves a Roots site, but no project page names that address, so it is not recorded as homepage. The README also links a gitter chatroom, which has no starter field and is not recorded. The GitHub licence field reads NOASSERTION; the MIT licence comes from the LICENSE file and npm. The GitHub release v5.2.0 (2017-06-28) is the highest stable release object and matches npm latest. The npm weekly download figure and the star count are for the week 2026-10-12 to 2026-10-18 and the date of this read. The README credits carrot creative as sponsor; sponsorship is not a field.
