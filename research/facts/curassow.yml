notes: >
  The homepage https://curassow.fuller.li/ redirects to plain http, which is not linked; the https address https://curassow.fuller.li/en/latest/ answers with the project's Sphinx documentation, so that page is recorded as homepage and docs. The docs title reads Curassow 0.5.0 and the copyright reads 2016, while the newest GitHub release is 0.6.1 (2017-04-07); the record keeps the newest release. The repository sits under the kylef-archive organization, but GitHub does not flag it archived, the README and the docs say nothing about the project ending, and the last push is 2019-06-12. Release age alone does not make it discontinued; the import moves the record to stub because its newest release is more than four years old. The docs and README name Nest as the interface, not a parent project, so basedOn is not recorded; the README says it is similar to Python's Gunicorn and Ruby's Unicorn, recorded as alternativeTo. The runtime is recorded as swift, the language the project is written in. The author's personal X account is linked in the docs footer, not the project's own account, so x is not recorded. The Swift Package Manager registry is not used as a download source, so no registry field is recorded.
