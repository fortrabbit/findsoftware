notes: >
  The npm package cva is owned by the same maintainer (joebell93 on both packages) and carries only the 0.0.0 placeholder as latest and the 1.0 beta line as beta; the installation page says the package is published as class-variance-authority and that the shorter name will be used from v1 onwards. npmWeeklyDownloads is the sum of the period 2026-10-18 to 2026-10-24 for class-variance-authority. currentMajor and latestReleaseDate come from the highest stable GitHub release, v0.7.1; the npm latest tag is the same version. The v1.0.0 line is in beta, and the homepage announces cva@1.0 as in beta, so latestPrereleaseDate is the v1.0.0-beta.12 release. firstRelease is 2022, the year of the first npm upload of class-variance-authority and of the first GitHub release v0.0.1. The homepage header links the maintainer's personal X and Bluesky accounts (x.com/joebell_ and bsky.app/profile/joebell.studio, reached through joebell.studio/x and joebell.studio/bluesky); they belong to the maintainer, not the project, so they are not recorded as fields. The LICENSE file carries no copyright holder line; the README license line reads Apache-2.0 License © Joe Bell, and the package.json author field names him too. httpArchiveSites is not recorded: the HTTP Archive technology list has no row for cva. The docs pages name Stitches and Vanilla Extract as CSS-in-TS libraries; that is a description of other tools, not an alternativeTo statement, so alternativeTo is not recorded. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header. The installation page says that by default cva joins class names but does not resolve conflicting Tailwind CSS utilities, and lists approaches for handling style conflicts. It also says that someone had already registered the name cva on npm as a placeholder, and that the shorter name will be used from v1 onwards.
