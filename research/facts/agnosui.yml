notes: >
  npmWeeklyDownloads is the sum of the daily downloads for 2026-10-18 to 2026-10-24 from the range endpoint. The root https://www.agnosui.dev answers 200 with a script that redirects to /latest/, so the homepage is the /latest/ address, which is the project's own site and documentation. The repository and the README name @agnos-ui/core, whose badge is the one the README uses, and that package is recorded as npmName; the framework adapters (@agnos-ui/angular-headless, @agnos-ui/react-headless, @agnos-ui/svelte-headless and the -bootstrap packages) are the install-by-framework path the INSTALLATION guide lists, and their weekly downloads run from 19 to 1721, so they are not recorded as the adoption figure. The install guide names all nine packages and the sample "npm install @agnos-ui/{package}". The project describes its components as compliant with the Bootstrap design, which is a design statement and not a parent, so basedOn is not recorded. The core package npm history starts with 0.0.1-alpha.0 on 2023-08-24, the earliest registry upload, and the repository was created 2023-07-17; the GitHub release list starts at v0.1.1 (2024-02-29). The copyright holder is "Amadeus s.a.s." on the LICENSE; no legal notice page was readable (www.amadeus.com/en/legal-notice redirects), so hqCountry is not recorded. The repository has no latest prerelease newer than v0.11.0. HTTP Archive has no technology named for AgnosUI.
