notes: >
  Two project sites: the English README names https://emlog.dev as the official website, and the Chinese README and emlog.net name https://www.emlog.net. The homepage field uses emlog.dev; emlog.net is the Chinese-language site of the same project. The releases are all tagged pro-<version> (latest pro-2.6.33) and the sites label the current version "Pro"; no page read states a free edition next to a paid one or the license terms of a Pro release, so paidEdition is unknown and the reviewer should decide whether the Pro tag changes the record. currentMajor 2 is read from the pro-2.6.33 tag. The GitHub owner is a user account named emlog; no legal name appears on the pages read, so maintainer stays unknown. The API docs describe JSON form endpoints for account actions and no REST or GraphQL statement, so headlessApi stays unknown. The README says "Built-in API Interface" and the AI docs describe LLM integration; neither is recorded as a field. The Gitee mirror (gitee.com/snowsun/emlog) is not a source. The GitHub license field reads GPL-3.0 and the README and license.txt say GPLv3. The Chinese site footer lists a Beijing ICP filing, which is not a headquarters statement. contributors counts GitHub's anonymous contributor list.
