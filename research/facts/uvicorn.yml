notes: >
  The CSV homepage www.uvicorn.org does not resolve (no DNS answer, 000 on 2026-10-30); the project's own documentation and homepage is uvicorn.dev, which the GitHub repository also names. The homepage https://uvicorn.dev is recorded. The GitHub release 0.54.0 (2026-09-25) is the highest stable release; there are no release candidates in the release list. currentMajor is 0 for the 0.x line, per the release list. The PyPI first upload is 0.0.1 on 2017-06-05 and the GitHub repository was created 2017-05-31; the project's pages do not state a first-release year, so firstRelease comes from the PyPI upload. The release notes page starts at 0.10.0 (2019), so it gives no earlier date. The PyPI JSON reports license as null; the license comes from the GitHub API and the LICENSE.md file of tag 0.54.0, which reads BSD-style. Company: the LICENSE.md copyright line names Encode OSS Ltd; encode.io states "Encode OSS is a UK limited company, trading since 2016." That names the legal form and the incorporation country, not a headquarters, so no hqCountry is recorded; a reviewer decides whether the statement counts. The uvicorn.workers Gunicorn worker class is deprecated in the documentation in favour of the uvicorn-worker package; the deployment page names Gunicorn as the production process manager, and the record does not add a basedOn for Gunicorn. The pypistats figure is the last-month count on 2026-10-30; the CSV weekly figure is older. No dependency on Starlette or FastAPI is stated by uvicorn itself, so no basedOn is recorded. Fields coined here: none.
  The homepage says Uvicorn currently supports HTTP/1.1, HTTP/2 and WebSockets. The installation page lists uvloop, httptools, websockets, watchfiles and python-dotenv as the optional standard extra, installed with pip install 'uvicorn[standard]'. The deployment page says that for production the recommendation is gunicorn with the Uvicorn worker class, and that --reload and --workers are mutually exclusive.
  The homepage says the uvicorn command line tool is the easiest way to run an application and that uvicorn.run, or uvicorn.Config with uvicorn.Server, starts it from Python. The deployment page says uvicorn does not use pre-fork but spawn, which lets its multiprocess manager work on Windows, and that --workers runs several worker processes.
