notes: >
  Stylus is a language and compiler, not a site framework: its own pages present the stylus executable (runsAs local), the JavaScript API and Connect middleware for compiling during development, and no output mode. The site's twitter link goes to a maintainer's personal account, so no x is recorded. The homepage compare page, Stylus vs Less vs Sass, names Less and Sass, both records. The Stylus site has a Playground (try.md) that runs in the visitor's browser; it is not a hosted service and no runsAs browser is recorded because no page states the compiler runs for the live site. The LICENSE file copyright line names Automattic, while the README names TJ and Stylus maintainers and the package.json author is TJ Holowaychuk; the maintainer field follows the LICENSE copyright line, and the package.json author TJ Holowaychuk is recorded here only. The README lists Automattic and mojotech as sponsors; sponsors are not a fact field. The npm figure is the stylus package; there is no sibling package. The latest GitHub release 0.64.0 is dated 2024-10-20; the first upload to npm is 2011-01-31, which is older than the oldest GitHub release (0.54.6, 2019-08-19), so firstRelease is 2011. The homepage describes the project as created by TJ in 2010; the year from the npm upload is used. currentMajor is 0 because the project's own releases are 0.x.
