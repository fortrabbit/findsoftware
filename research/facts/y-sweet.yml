notes: >
  Discontinued under the 2026-11-03 ruling for an acquired project whose homepage redirects to the buyer: jamsocket.com/y-sweet and docs.jamsocket.com/y-sweet both answer 302 to https://modal.com/blog/jamsocket-is-joining-modal (read 2026-11-03), a Modal post that says the Jamsocket team is joining Modal "as part of this acquisition" and that "Jamsocket products will continue to operate normally while the core functionality is being migrated to Modal." The repository stays public and was last pushed 2025-12-04; the README still describes the server and the Jamsocket hosted service, so the reviewer may take a different view, and the record can be set back to accepted by a later pass.
  Because the project's own homepage now shows Modal's pages, homepage and docs are not recorded; the README's docs link (docs.jamsocket.com/y-sweet) redirects to the same post.
  The maintainer follows the LICENSE copyright line (Drifting in Space Corp., 2023); the README says the project "was created by Jamsocket", a company name that is recorded here only as text.
  The npm metadata names the git repository under drifting-in-space/y-sweet, the earlier organization name; the GitHub repository now lives under jamsocket, and the npm figure is for the server package the README's npx command installs.
  The crates.io packages y-sweet and y-sweet-core and the SDK packages (@y-sweet/sdk, @y-sweet/client, @y-sweet/react, y-sweet-sdk) are client or library routes and are not recorded; the README lists the crates in its packages table, and no install step in the guide names cargo, so no cargo installMethod is recorded.
  runsAs rests on the README sentence "Deploys as a native Linux process", which states the process model in general terms; the self-hosting guide does not say whether it runs under systemd or another supervisor, and the reviewer may decide whether the sentence is enough.
  The README says Y-Sweet is built on top of the Yjs CRDT library; Yjs has no record, so basedOn is not set and the relation is recorded here.
  The Docker image named in the guide is ghcr.io/jamsocket/y-sweet, a GitHub Container Registry image, so no Docker Hub pull figure is recorded.
  The oldest GitHub tag is v0.0.2 (commit 2023-08-01) and the oldest release is v0.0.8 (prerelease, 2023-08-02); firstRelease is 2023.
  The Discord invite is a README badge link and is recorded without a quote; the pre-1.0 line is recorded as currentMajor 0 because the version scheme keeps 0 as the major.
