notes: >
  The repository is a monorepo with packages cli, core and web; the npm package mailing is the cli package and the README badge names it, so the npm figures are its own, and mailing-core is the library package the docs install beside it. The repository has tags (mailing@1.2.0 and mailing-core tags) and no GitHub releases, so currentMajor and latestReleaseDate come from the npm package mailing, version 1.2.0 published 2026-07-10. npm also holds a 0.0.1 upload dated 2019-03-13 with no repository field; the 0.1.0 upload of 2022-06-22 names github.com/psugihara/reaction-mailer, the project's earlier repository, so firstRelease is 2022 from that upload. The LICENSE copyright names Peter Sugihara and the repository sits in the sofn-xyz organization. The docs say Mailing Platform is "the advanced version with paid features" and, on the same page, "Still Open Source" and "Self-hosted"; the license of the Platform part is not stated. The Platform page says it "requires a deployment, associated database, and API key" and lists "Self-hosted", and the deploy guide has the user deploy it and connect a Postgres database (needed for the paid Lists feature and for API keys), so Platform is installable with paid features, paidEdition stands and no hostedOffering is recorded. The docs navigation links a Pricing entry that points to a section of the platform page which does not exist, so no pricingPage is recorded. The README says Mailing "requires version 16+ of node and running on Mac or Linux", and the tag mailing@1.2.0 README carries the same sentence. The docs say the default transport is nodemailer's SMTP transport and that the library is "inspired by Action Mailer from Ruby on Rails", which is inspiration, not basedOn. The README names MJML components for cross-client output; MJML is a kind of markup kept in notes. The site's White Glove page sells email template design by the same team; it is a service, not part of the software. The docs say the platform sends marketing and transactional email and offers lists with unsubscribe links, all in the Platform edition. The README feature list names the React components, MJML output, a preview server with live reload, dev mode that opens emails in the browser instead of sending, and test mode. The docs say Mailing is free, that the component prop is the React component rendered to HTML for the email, and that sendMail sends it. The README says Windows is not supported at this time. The root README.md is a symlink to packages/cli/README.md, so the README quotes cite that file. The deploy guide says the Mailing server "can be deployed as a production website" and that "mailing is a Next.js application" under the hood, hosted on Vercel or Netlify or started with a server command; the production process model is not stated in a sentence, so runsAs is left out. The preview server runs on the developer machine ("Running npx mailing will boot the preview server on localhost:3883"), while the sendMail library runs inside the site's back-end, so local alone would be wrong.
