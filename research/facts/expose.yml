notes: >
  The repository has no GitHub release or tag, so no version or release date is recorded, and lastCommitDate is the committer date of the newest commit on master; the repository's pushed_at value is later and is not used. The GitHub homepage field is empty and the README links only to the author's own blogs, which are not the project's site, so no homepage is recorded. The README says Expose is a Bash script, so the language is bash and no runtime from the dictionary applies. It requires ImageMagick, and FFmpeg for video. It says it is tested on Windows/Cygwin and OSX and should be fine on Linux. The templates use {{name}} placeholders that the README describes as a sed regex ("the YAML parser and template engine is simply a sed regex"); this custom placeholder syntax is not a templating value in the dictionary. Gallery generator is the README's own framing ("photoessays"), recorded as ssg because it calls itself a static site generator. The GitHub language field reports perl from the bundled Perl Markdown script, so the language value follows the README.
