notes: >
  The repository moved from uiv-lib/uiv to wxsms/uiv; the GitHub API reports wxsms/uiv, which is recorded. The default branch is dev and the highest stable release is v2.0.7 (2026-09-09), which is also the npm latest. Its releases list starts at v1.0.0 (2020-10-04) and the oldest tags are v0.x, so firstRelease comes from the npm upload history (0.1.0 on 2017-03-10). The package.json at v2.0.7 names author wxsm; the LICENSE copyright line and the homepage footer name Kairui Guo, so that name is recorded. The install guide says the package replaces Bootstrap's JavaScript but needs Bootstrap's CSS loaded separately, which is why basedOn names bootstrap next to vue. The homepage says "Vue 2&3 supported" while the README says the current line targets Vue 3; the older lines are documented on separate sites (v0 and v1 docs), not recorded. Server-side rendering support is stated in the README and install guide; it is compatibility, not a rendering mode. The funding page lists PayPal and Alipay or WeChat pay links; donations are not an edition. npmWeeklyDownloads sums the daily counts for 2026-10-19 to 2026-10-25. The HTTP Archive technologies list does not carry uiv. The homepage runs on a path under github.io; no custom domain was found. Getting-started and the i18n page: components and directives install with no prefix by default and can take one; individual import is supported; all components default to en-US, the locale is configurable, and the locale packs work with vue-i18n.
