notes: >
  Repository only: no project site is named; the repository's homepage field is empty, and the company site (ftxinfotech.com) redirects and is not the project's. Maintainer is the GitHub organization FTXInfotech: the README names no legal entity, and two contacts are listed for contributions. Not on Packagist (ftx/laravel-adminpanel returns 404), so no registry figures. The README says the project is based on the Rappasoft Laravel Boilerplate (v6.0.1); that boilerplate has no record here, so basedOn records only Laravel, which the README names as the version it runs on. The latest release is tag 6.0.3 (2020-10-20), which the GitHub API gives as the newest release; currentMajor takes it since there is no registry. The README targets Laravel 7, and the repository was last pushed 2023-08-25. The project does not declare itself ended, so the status stays accepted; the release age decides nothing. The composer.json description calls it "The Laravel AdminPanel with API Boilerplate." and tags it boilerplate, which is why categories includes it.
