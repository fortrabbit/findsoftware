notes: >
  The site answers 200 with a Chinese-language JavaScript shell (title only, no page text), so the homepage is the repository's homepage field and the site is listed as unreadable; the README links the site only from its logo, and CONTRIBUTING calls https://opentiny.design the official documentation, which is recorded as docs. The maintainer is the copyright holder named in LICENSE, Huawei Cloud Computing Technologies Co., Ltd.; the README calls the project the OpenTiny community and the npm author field reads OpenTiny Team. Parent and hqCountry are not stated on a page read, so they are not recorded. GitHub reports Less as the primary language, which describes the styles, not the component code; language is not recorded until a reviewer decides. The package @opentiny/vue is the one the README installs; the Vue 2 line is the same package at 2.x (npm dist-tag v2-latest) and is not recorded separately. The npm package has no engines field, and the engines entry at the monorepo root names node >= 18 for the repository, not the package, so runtime is not recorded. The first npm upload is 3.1.0-alpha.0 (2022-12-02), older than the first GitHub tag v3.5.0 (2023-02-28), so firstRelease is 2022. The README Credits section says TinyVue draws on Element at the beginning of its design and is compatible with Element's component API, that many components are based on Floating UI, that the Grid component is based on vxe-table, and that drag-and-drop sorting in Grid, Transfer and Tabs is based on Sortable; these are credits, not relation fields. The README features list says one code base supports PC and mobile and that theme customization is supported. The README's WeChat group and mailing list are not a field in the schema. The HTTP Archive technology list has no TinyVue entry.
