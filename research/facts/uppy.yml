notes: >
  Uppy is a monorepo: the stars and contributors belong to transloadit/uppy, and the registry figures come from @uppy/core, the core package the install command names with @uppy/dashboard and @uppy/tus. The same repository tags a separate umbrella package uppy (v6.0.7 on 2026-11-05), also on major 6. The npm weekly figure counts downloads of @uppy/core only. The repository also ships @uppy/companion, a server package recorded as its own record (uppy-companion); it does not set this record's runtime or runsAs. Official bindings for React, Svelte, Vue and Angular are named on the README and the homepage; the core is framework-agnostic, so no basedOn is recorded. The README's Smart CDN bundle is a route of its own (cdn), and the README warns it is not recommended for production. The example's companionUrl points at a Transloadit-hosted Companion; the README does not offer it as a hosted service, so no hostedOffering is recorded. The Transloadit file-processing API is a separate commercial product named as the file-processing partner, not a hosted version of Uppy. The LICENSE copyright line names "Transloadit (https://transloadit.com)", and the imprint gives the legal name Transloadit-II GmbH in Berlin, which is recorded as the maintainer and hqCountry. The Forum link in the homepage nav and its Community footer group goes to community.transloadit.com, Transloadit's community site, recorded as the forum. The comparison page also names Uploadcare, Filestack, Uploader.win and UploadThing, which have no fact file here. The firstRelease year comes from the earliest npm upload of the umbrella package uppy, 2015-11-26; the earliest GitHub release object is from 2021.
