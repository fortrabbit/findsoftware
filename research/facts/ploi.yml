notes: >
  Hosted-service record: the product manages servers the user provisions at UpCloud, DigitalOcean, Linode, Hetzner, Vultr, AWS EC2, Scaleway or a custom VPS, and deploys sites to them; the homepage names Laravel, WordPress, Statamic, Craft CMS, Nextcloud and phpMyAdmin as one-click installs. Criterion 2 is waived for a hosted service and no repository is recorded: Ploi publishes no source, and the GitHub organization ploi is not the product, so its licenses, stars and dates are not recorded per the hosted-service rule. The homepage calls the product a server management tool in its title and describes a Ploi MCP server for AI assistants; that is a feature, not a field. The maintainer is Ploi, the name the terms of service and the chamber of commerce entry (reg. number 94117233, Nijkerk) give; the about page and footer call it part of, and a product of, WebBuilds B.V., recorded as parent. The about page says the company is bootstrapped and has no corporate backer. The alternative pages also name Serverpilot and RunCloud; no record exists for them, so they are not recorded as alternativeTo. The developers.ploi.io API documentation was reached but holds no rate limit; apiLimits is absent. The pricing page lists Basic, Pro and Unlimited plans, recorded as the pricing link only. Server requirements (Ubuntu 26.04, 24.04, Debian 13, 12; 1 GB RAM minimum) are for the servers Ploi installs, not for Ploi itself. The homepage links a status page at status.ploi.io and a GitHub organization; neither has a field. The homepage offers a 5-day free trial; a trial is no free tier, so freeTier is absent. The deploy-target providers are those on the homepage under "Choose a provider". Multi-domain tenants are no multisite, so multisite stays absent.
