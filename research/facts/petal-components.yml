notes: >
  Hex lists the latest stable version 4.17.1 (2026-10-09), above the highest GitHub release v3.2.2 (2026-05-15); the GitHub tags run to v4.17.1 without matching GitHub releases, so the registry major is recorded. The hexDownloads figure is the Hex "all" total. The paid tier is Petal Pro: the pricing page says "Petal Pro is a one-time purchase.", and the petal-pro docs mark some components as available only to Petal Pro members; the Petal Pro boilerplate is a separate product. The terms page at petal.build/license puts Petal Pro and other Petal products under a separate license, not the MIT-licensed components, so it is not recorded as a license of this record. The LICENSE file names Matthew Platts as copyright holder; the terms page names Everfree Pty Ltd as licensor of the other products, and its privacy policy gives an Australian Business Number. No page states where the company is headquartered, so hqCountry is unknown. The MCP server at mcp.petal.build is a hosted companion tool. The package's mix.exs requires Elixir ~> 1.14, which is an Elixir version and no OTP minimum, so no runtimeMin is recorded.
