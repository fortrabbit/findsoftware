notes: >
  The CSV homepage and repository match the GitHub repository luckyframework/lucky; the repository named "lucky/lucky" on GitHub is a different, unrelated repository and was not used. The homepage states the framework is written in Crystal. The project's guides name built-in authentication (optional), email through Carbon and SendGrid, file uploads, and a Lucky CLI; these are not recorded as facts. The firstRelease is the commit date of the oldest tag, v0.2.0 (2017-06-16); the CHANGELOG starts at v0.13 (2019-02-27), and the oldest GitHub release is the v0.18.0-rc1 pre-release (2019-09-24). The v1.0.0-rc1 entry is marked as a non-prerelease on GitHub; it is older than v1.5.0 and does not change currentMajor. The maintainer is the copyright holder named in the MIT license; the team page names Paul Smith as Creator and five core members. The Lucky guides say the framework includes Bun, and Webpack or Vite can be used for assets; no frontend bundler is recorded as a fact. The repository has no registry package, so no download figure is recorded.
