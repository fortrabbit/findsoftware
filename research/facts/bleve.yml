notes: >
  Library, not a server: the install docs show an import of github.com/blevesearch/bleve/v2 and a CLI installed with go install. The README does not state a run mode, so runsAs is absent. Apache-2.0 from the GitHub API and the README "Apache License Version 2.0"; the LICENSE file carries no copyright line. The highest stable release is v2.6.1 (2026-08-24), the module path is /v2, and go.mod at that tag declares go 1.25.0. The v0 and v1 tags are older lines; the first GitHub release v0.1.0 (2016-04-08) is a prerelease tag, the year 2016 is the oldest release date in this repository. Couchbase is the owner: CONTRIBUTING.md says Bleve is a Couchbase project and requires the Couchbase CLA. The footer of couchbase.com states "© 2026 Couchbase, Inc.", which is the legal name recorded; the about and legal pages return 403 to the research client, so hqCountry is absent. The homepage https://blevesearch.com answers over https with the project's own content (title "Bleve"); the README links the http address www.blevesearch.com, which does not answer. The README's Google group is the only discussion list named; a Gitter chat badge is also in the README (app.gitter.im/#/room/#blevesearch_bleve:gitter.im) and no field fits chat. The dependent figures are from ecosyste.ms for the Go module github.com/blevesearch/bleve/v2 (packages and repositories that depend on it); Go modules publish no download figure. The README and site list pre-built text analyzers for about 30 languages and the vector, geo and hybrid search features; these are features, not fields, and no i18n field is recorded because that field describes localization of a site.
