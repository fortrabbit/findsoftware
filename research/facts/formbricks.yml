notes: >
  The CSV row dates 2026-10-16, which is the 6.1.0-rc.2 pre-release; the latest stable release is 6.0.2 (2026-10-01), so latestReleaseDate follows the stable tag. The repository license field is NOASSERTION on the API, so the license entries come from the LICENSE file: AGPLv3 for the core, MIT for packages/js, packages/android, packages/ios and packages/api, and a separate license for apps/web/modules/ee. The licenseModel value open-core follows from that EE carve-out, and the quote is the docs heading that names the Enterprise Features page. The pricing page prints plan names only for two tiers, so the $74 tier is labelled by its badge. The kubernetes install is the official Helm chart named in the docs.
