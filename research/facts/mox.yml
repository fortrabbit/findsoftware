notes: >
  The homepage link names the sources as MIT-licensed, and the repository holds two license files: LICENSE.MIT (copyright Mechiel Lukkien) and LICENSE.MPLv2.0. The README says mox is available under the MIT license and includes BSD-3-Clause code from the Go Authors and the Public Suffix List by Mozilla under the Mozilla Public License 2.0, so the MPL-2.0 file covers that bundled list; both statements are recorded as separate entries. The FAQ names #mox on irc.oftc.net, #mox:matrix.org and the Gopher Slack for discussion (chat, no forum or discord field). The maintainer is the copyright holder in LICENSE.MIT; the contact email in that line is not recorded. The GitHub profile lists a location, but no project page names the country, so hqCountry is absent. Acceptance: the project's own FAQ says apps can send transactional mail through the webapi ("The mox webapi can be used to send outgoing messages that mox composes") and SMTP submission is a documented service, so the mail server is accepted under the wave 46 rule. Coined or unrecorded kinds: protocols (IMAP4, SMTP, SPF, DKIM, DMARC, MTA-STS, DANE, DNSSEC, ACME), the webapi and webhooks (features page, webapi API documentation on pkg.go.dev), webmail, and junk filtering. The Go toolchain requirement on the install page (go 1.23 or later for compiling) is a build requirement for the source route, so runtimeMin is absent. The Docker image is on r.xmox.nl, not Docker Hub, so no dockerPulls. The install page calls the Docker route "not recommended". The bbolt index database is an embedded store and is not recorded as databases. The version line is 0.0 (currentMajor 0 by the rule for 0.x releases).
