notes: >
  No project site is named; the PyPI home page and setup.py url point to the PyPI page, so homepage is not recorded. The GitHub releases run from v2.0.0 (2014-08-10) to 2.4.0 (2017-04-01); the tag v3.0.2 has no GitHub release, and the PyPI package drupan 3.0.2 (2018-08-03) has a higher major than the GitHub release, so currentMajor and latestReleaseDate come from PyPI. The oldest PyPI release is 1.0.0 (2012-10-24), which is firstRelease. License.md has two numbered conditions plus the clause "The views and conclusions contained in the software and documentation are those of the authors", which is BSD-2-Clause-Views; the PyPI metadata says only BSD and is not recorded. The README names deployment to git, AWS S3 and AWS CloudFront, which is not recorded as a field. The runtime Python is taken from the pip install step; no minimum Python version is stated on a page. The README (https://github.com/fallenhitokiri/drupan/blob/master/Readme.md) lists the command switches "nodeploy", "serve" ("runs a development server on port 9000") and "deploy"; the deployment plugins "s3cf" and "gitsub"; and a section "Plugins". The output directory is not named on a page read.
