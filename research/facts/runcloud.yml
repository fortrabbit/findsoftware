notes: >
  Hosted-service record: RunCloud runs as a web panel at manage.runcloud.io and installs its agent on servers the user owns; the homepage names Vultr, Linode, UpCloud, Hetzner, AWS, Google Cloud and DigitalOcean as cloud providers, and the docs name on-premise servers too ("RunCloud supports all major cloud providers and on-premise servers"). The provider list is not a field. The docs name NGINX and OpenLiteSpeed as web server stacks and PHP as the application runtime; no field holds them. Criterion 2 is waived for a hosted service, and no repository is linked from the pages read. The legal form Sdn Bhd is Malaysian; no page read names a country, so hqCountry is absent. The features and docs pages read: homepage, features page, docs index, the API introduction (base URL on manage.runcloud.io, key and secret from the profile menu, no rate limit stated), the workspace roles page and the MySQL and MariaDB migration page. The pricing page shows a free trial ("Free 7-days trial") and does not state plan features in text read here. The homepage's "Free 7-days trial" is not recorded as a field. No founding year is on any page read, so firstRelease is absent. The connect guide says it shows how to connect a server "manually using SSH"; provisioning runs through the dashboard: the connect guide's steps are "Choose Manual Installation" and then entering server details, with no public install command on the pages read. The CSV overlaps FindHost's server-management territory as the row states. Fields coined: none.
