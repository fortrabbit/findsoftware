notes: >
  No GitHub repository was found under the project's name; the project names its own git at yhbt.net (README, "git clone https://yhbt.net/unicorn.git") and a repo.or.cz mirror. The RubyGems metadata names bogomips.org as the source and documentation address, which the README does not use; the README's yhbt.net address is recorded. The homepage https://yhbt.net/unicorn/ is a directory listing of the project's files; the quoted line comes from its README file. Latest release is 6.1.0 (2021-12-25), on RubyGems and in NEWS; no later release appears in NEWS, RubyGems or the directory listing. Four years have passed since that release, so the import moves the record to stub under the release-age rule; the status is left at accepted. The README says "The use of unicorn in new deployments is STRONGLY DISCOURAGED due to the damage done to the entire Ruby ecosystem." That is a recommendation against use, not a statement that the project has ended or is unmaintained, so no status signal is recorded; a reviewer decides whether it counts. The license has two entries: the GPL-2.0-or-later choice from LICENSE and the Ruby (1.8)-specific terms named in README; the RubyGems metadata gives the same two as GPL-2.0+ and Ruby-1.8. The maintainer is recorded as the LICENSE copyright line states it: all contributors; the NEWS release notes credit Eric Wong with many of the changes, and the project does not name him as maintainer. The README says unicorn "is based on Mongrel 1.1.5"; Mongrel has no record here, so it is a note only. The Links page calls Green Unicorn (gunicorn) "a Python version of unicorn"; that is the project's statement about gunicorn, not about unicorn's own basis, so no basedOn is recorded here. The mailing list at yhbt.net/unicorn-public is the discussion channel the README names and is recorded as forum. The README says unicorn's library consists of a C extension and needs a C compiler and Ruby development headers; no language fact is recorded, since no page names the project's language outright. The RubyGems total is 120,229,484 downloads on 2026-10-30, a total, not a monthly figure. The Ruby minimum comes from the 6.1.0 release notes; the README says "Compatible with Ruby 2.0.0 and later." The "Unicorn" name is also used by django-unicorn (a different project, id django-unicorn). Fields coined here: none.
  The README says the server is designed to handle fast clients on low-latency, high-bandwidth connections, that slow clients must be served through a reverse proxy that fully buffers requests and responses, and that unicorn can spawn and manage any number of worker processes; it also says it is built for Rack, Unix and ease of debugging.
