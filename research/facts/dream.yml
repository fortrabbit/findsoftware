notes: >
  The opam package is named dream; it is the install route the homepage names, and opam is not one of the registries the import reads, so no download figure is recorded. The README's Acknowledgements say Dream's handler and middleware types are simplified from Opium; that is an influence, not a stated parent, so no basedOn is recorded. The example switch 5.1.0 in the README is a setup example, not a minimum, so no runtimeMin is recorded. The README names #dream on the Reason Discord and the OCaml Discuss forum as places to discuss Dream; the Twitch stream is not recorded. The runtime is OCaml as the language runs on; the homepage says a Dream program can be integrated into a self-contained binary. The example directory README lists deployment targets Heroku, Fly.io, Docker and systemd; runsAs records always-on from the systemd example, which states it runs on a server as a daemon.
