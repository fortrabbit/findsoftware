notes: >
  Go module: the install route is go get of the v4 module path, and the Go module proxy publishes no download figure, so none is recorded. The repository is the only project URL; the README links only a godoc badge and a go-rest-api starter kit, which are not the project's own site, so no homepage. The is sub-package wraps the validators of the govalidator module; a dependency is not a basedOn statement, so it stays here. The README's go-rest-api link is an example application, not a parent. Releases: GitHub releases start at v1.0 in 2016 (the repository was created in June 2016); the newest stable is v4.5.0 dated 2026-10-27. The v4 line is the current major; the README gives Go 1.21 as the minimum and tests the two newest Go releases. The i18n value covers error code and message translation as the README words it. The README describes validation of simple values, structs, maps, slices and custom types, and an is sub-package of string format rules. Contributors counted with per_page=1.
