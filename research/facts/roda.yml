notes: >
  The GitHub repository is marked as a fork of soveran/cuba, and the README says Roda "started out as a fork of Cuba", so forkOf is recorded from the README. Cuba and Roda are not the same project; the README describes Roda as inspired by Sinatra and Cuba, which is not recorded as basedOn. The project has no GitHub releases; its tags run to 3.109.0, and RubyGems carries the same version (2026-10-09), so the registry is the release source. The first release is 0.9.0 (2014-07-30) per doc/CHANGELOG.old, and the first RubyGems upload is 0.9.0 too. The README names a Google Group as an alternate forum at an http-only address, so it is not linked. The minimum Ruby is stated as 2.0 in the README; the RubyGems record carries no minimum.
