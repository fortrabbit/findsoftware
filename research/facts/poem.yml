notes: >
  No homepage: the GitHub repository and the crate name the repository itself as homepage and the project has no site of its own in its README, so the record is repo-only. The poem.rs address did not connect when checked, and it appears nowhere in the project's pages. The highest stable GitHub release is v2.0.0 (2022-05-31), which is major 2; the crate registry's stable 3.1.12 (2025-07-28) has a higher major, so currentMajor is 3 from crates.io. Poem 4 is in development on the master branch (the workspace Cargo.toml version and the CHANGELOG "[4.0.0] - Unreleased" entry), with no release, so it is not recorded as current. The README badge and the crate README state an MSRV of 1.94.0 for the repository, while the latest release 3.1.12 declares rust_version 1.85 in crates.io; the first runtimeMin entry is the release's crates.io declaration and the second is the README's 1.94.0 statement for the development branch. Two license statements are recorded: the README and workspace Cargo.toml say MIT OR Apache-2.0 and the GitHub repository field detects Apache-2.0. The maintainer is the author named in the workspace Cargo.toml (sunli), an individual; no legal name is stated. The first crate upload is 0.1.0 on 2020-08-05, which predates the GitHub repository creation (2021-08-11), so firstRelease uses the registry. The crateDownloads figure is the last-90-days count from crates.io (recent_downloads); the all-time total is 6152227. The Discord link is the badge image link in the repository README, so it has no visible text to quote. The README's runsAs statement is the example server listening on a port, quoted as the runtime model.
