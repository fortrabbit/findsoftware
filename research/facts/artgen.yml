notes: >
  Stub without homepage: whether the project still has its own site is in doubt, because artgen.io now answers with a domain-for-sale listing; a reachable project site or a confirmed new home would settle it. No homepage is recorded, and the README gives no other site. The install docs name the package @artgenio/core and the image artgenio/core, while the GitHub URL artgenio/core redirects to hisorange/artgen; the repository recorded is the redirect target. The registry name is @artgenio/core (npm); the unscoped artgen npm package is a different project (b3nsn0w/artgen2) and is not used. The README says the project is in the beta phase; its last release is v0.7.1 (2023-03-20), the same as the npm latest, and the repository was last pushed 2026-10-19. The Feature Index also lists an OData API generator and CRON scheduled flows; odata is not a headlessApi value. The README's table of databases names PostgreSQL 14.x and SQLite 3.x as tested versions, which are not recorded. The first GitHub release is v0.0.1 (2021-11-14), read from the paged release list (72 releases). A reviewer may settle the stub by confirming the project's own site or a new home. Maintainer is the npm package author as recorded in the package.json of the registry release; the repository has a GPL-3.0 LICENSE file with no copyright line.
