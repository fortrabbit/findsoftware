notes: >
  No homepage: the row names none, and the repository and pub.dev page are the project's only pages. The pub.dev page is the registry package the install docs name (dart pub add alfred). The pub.dev total is 17.4k downloads, read on 2026-10-24; the earlier candidate row's 17.0k figure is a 30-day count and is not used. The repository has no GitHub release or tag, so currentMajor and latestReleaseDate come from the stable pub.dev release 1.1.3 (2025-05-19). The last commit on master is 2025-01-06, earlier than the pub release, so lastCommitDate is not recorded. The LICENSE file states MIT for the core library and says some parts are BSD licensed; the pub.dev page lists BSD-3-Clause and MIT, so both are recorded. The maintainer is the repository owner rknell, as the project's pages name no legal entity. The README deployment section says the server is containerized and run on a PAAS, with no mode stated, so runsAs is not recorded. The pub.dev page describes Alfred in the same words as the README, and the README names no framework it is built on, so basedOn is not recorded. The pub.dev installing tab lists dart pub add alfred; the README itself gives only the import line.
