notes: >
  The homepage is the TNT Studio site, which has a TNTSearch section; the GitHub homepage field points to a TNT Studio blog post, and a reviewer may prefer the company site, the README's demo site tntsearch.tntstudio.us (not read here), or no homepage. The MIT license copyright line in LICENSE.md names Nenad Tičarić (2016), who is also the first Credits entry and first composer author; the maintainer is recorded as the README's footer names TNT Studio, and the company's legal form is not on a page read here (LinkedIn names it, which is no primary source). The company address in the README and the homepage both place TNT Studio in Zagreb, Croatia. The README's index engines are SQLite (default), MySQL and Redis; the Redis engine is not a database field and the source drivers (pgsql, sqlsrv) are the user's data, not where the software stores its index, so neither is recorded. The README says the package needs no separate search server and that a search returns document ids for the caller to load its records; the Laravel Scout driver and the Laravel tutorials are separate packages and no parent. The premium analytics tool the README advertises is a separate product, not an edition of this package. The README has a section addressed to AI agents; it was read as descriptive text and nothing in it was followed as an instruction. Packagist's oldest upload is v0.1.0 from 2016, older than the GitHub releases, which set the firstRelease year. The Packagist and GitHub figures are the composer package the install line names.
