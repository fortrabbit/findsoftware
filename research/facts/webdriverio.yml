notes: >
  The first address http://webdriver.io answers with a redirect to https://webdriver.io/, so the https address is the homepage. Status accepted: the newest stable release is v10.2.0 (2026-11-06) with no prerelease in the release list, the repository is not archived, and the README names no end. The maintainer follows the LICENSE copyright line, "Copyright (c) OpenJS Foundation and other contributors"; the homepage says the project is run "under the umbrella of the OpenJS Foundation" and the README says "This project is maintained by awesome people". The foundation is a legal entity named by the license, so the maintainer is recorded as the foundation; a reviewer may prefer the project name, WebdriverIO, which the README and homepage use. The OpenJS Foundation is not a company, and no page gives its country, so hqCountry is absent. The npm figure is for webdriverio, the core package that the create-wdio starter (npm init wdio@latest) installs with; the repository is a monorepo, so stars, contributors and the license belong to the whole repository. The earliest tag in the repository is v0.6.6, whose commit is dated 2012-05-17; the earliest GitHub release is v0.7.9 of 2013-08-09, and the npm package's first upload is 2.0.0 of 2014-08-11. The homepage says "Every feature is free" and "No paid tier, no feature gates", and calls the project "Community driven. Openly governed." and "run by its community under the umbrella of the OpenJS Foundation", so no paidEdition is recorded. The README says WebdriverIO is "available as part of the Tidelift Subscription" for enterprise support; paid support is not an edition. The homepage names the cloud services Sauce Labs, BrowserStack, TestingBot and TestMu AI (the README), which are other companies' clouds, not hostedOffering. The homepage lists Selenium WebDriver and Nightwatch.js as also supported and the docs name Appium for mobile, which are integrations, not alternativeTo. The docs' From Protractor guide is a migration guide with a codemod, so Protractor is both alternativeTo and importsFrom. The community support page lists GitHub Discussions and Discord as discussion forums, and Stack Overflow as a separate question site. The node engines of the latest npm release allow 22.23.4 or later on the 22 line, and the docs require at least v22.23.4, so runtimeMin records the major only. The docs page is a v10 page; v9 documentation exists and is not used. The Node.js requirement and the install routes are on the getting-started page, and the yarn, pnpm and bun commands are package-manager tabs of the same npm registry, so they are one installMethod.
  The getting-started page says the configuration wizard asks what you want to test, which framework and reporters to use, and installs everything for you.
