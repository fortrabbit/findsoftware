notes: >
  The repository is a monorepo the install docs name for @rsbuild/core; the npm figure is that package, the one create-rsbuild installs; the scaffolder create-rsbuild is not used for figures. The parent is the copyright holder named in the LICENSE, which is how the page states ownership. The LICENSE copyright line names "Bytedance, Inc. and its affiliates"; the homepage footer repeats it as "© 2023-present ByteDance Inc.", and neither page gives a country, so hqCountry is absent and the reviewer may choose the legal form. The homepage links two Discord invites: discord.gg/sYK4QjyZ4V sits in the Community column and is recorded; discord.gg/XsaKEEk4mW sits in the social links at the page foot and is not recorded, because the page does not say which community it belongs to. The X and Bluesky links on the homepage go to the Rspack accounts (twitter.com/rspack_dev, bsky.app/profile/rspack.rs), listed under the same Community column; they are Rspack's accounts, not Rsbuild's, so x and bluesky are not recorded. Rsbuild is a sibling of Rspress, Rslib and Rstest in the Rstack family; the homepage lists them as projects built on Rsbuild, which is a use, not a basedOn statement for Rsbuild itself. The homepage claims framework support for React, Vue, Svelte and more; that is recorded in the description only as a framework relation the page states, and the SSR page says Rsbuild does not ship SSR by default, so SSR is notes, not renderingModes. The output directory of build is dist, and the deployment page says HTML files "usually need to be deployed on the server", so renderingModes and the static runsAs value are not recorded. The first GitHub release is v0.0.3 (2023-10-10), older than the npm package creation date (2023-10-17). The release v2.3.0-rc.0 (2026-10-27) is the newest prerelease and is newer than the latest stable v2.2.14. The npm dist-tag latest-v1 keeps the 1.x line; the current major is 2. The Node.js minimum for v2 is from the quick start page and matches the npm package engines field.
