notes: >
  The GitHub API returns no SPDX license for the repository, so MIT comes from the registry and from the README statement; the README and the LICENSE agree. The npm package the install docs name is gluestack-ui; the registry latest is 5.0.3, published 2026-06-25, and the highest stable GitHub release is v5.0.0 on the same day, so the major is 5 either way. The weekly figure is the gluestack-ui package's own count for 2026-10-18 to 2026-10-24; the sibling @gluestack-ui/core and @gluestack-ui/themed packages have their own counts and are not recorded. The install page lists "node > 16" as a prerequisite while the npm engines field says ">=18"; the Node line is a requirement of the CLI that adds components to a project, not a runtime of the library, so no runtime or runtimeMin is recorded. The maintainer is recorded as "GeekyAnts", as the README and LICENSE state it. The terms page of geekyants.com names GeekyAnts India Private Limited as the legal name, but that page never mentions gluestack, so the legal name is not recorded as the maintainer. The README gives a second Discord invite (95qQ84nf6f) that differs from the homepage invite; the homepage one is recorded. The homepage footer links gluestack.forumify.io, which answers with the docs installation page rather than a forum, so no forum is recorded. It also links a LinkedIn company page, which has no field. The components are added with the CLI into the project, which the install page describes as copy-paste; the CLI is the npm package. The ecosyste.ms counts are the package endpoint values: 0 dependent packages and 1 dependent repository.
