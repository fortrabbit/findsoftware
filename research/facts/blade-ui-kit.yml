notes: >
  The README is a message from the maintainer that the project will come to an end: the maintainer will not continue maintenance, does not plan to find a new maintainer, and invites forks. The Packagist entry for 0.7.0 is marked abandoned, which is recorded as the second status source. The README names Blade Icons as a personal project that continues, and mentions Flux UI as a more advanced library; neither is recorded as successorOf, because the README does not name either as the replacement. The site blade-ui-kit.com now serves the Blade Icons page; no homepage is recorded. The docs repository's default branch is 0.x and its installation page states PHP 8.0 or higher and Laravel 9.0 or higher, while the 0.7.0 Packagist requirements state php ^8.1 and illuminate ^10.0 to ^12.0; runtimeMin follows the registry. The highest stable GitHub release is 0.7.0 (2025-02-19), which is also the Packagist release, so currentMajor is 0. The Packagist monthly figure is 18,719 and the total is recorded. The maintainer is the copyright line and the composer author, Dries Vints. The docs repository's introduction page says the components are renderless, meaning they ship without any styling, and that each one is a Blade component with a view and a class; its installation page says components make use of CDNs for any third-party library they need, through the bukStyles and bukScripts directives, which are disabled when app.debug is off unless forced, and recommends compiling those libraries through an asset pipeline for production. The community page in the docs repository gives the GitHub Discussions board and the Twitter account.
