notes: >
  Tighten lists offices in Chicago and Atlanta but no country on its homepage or contact page, so hqCountry stays out. The homepage links FieldGoal, a separate Tighten form-backend product for static sites, not part of Jigsaw. Area is php-framework per the queue, though it is a static site generator. Coined fields: contentFormats (source formats it reads), showcase (official gallery of sites built with it).
