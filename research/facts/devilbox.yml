notes: >
  The homepage in the repository is http://devilbox.org. It answers 200 over plain http and does not answer over https, so no homepage is recorded (AGENTS.md: a site that answers only over plain http is not linked). The docs are the Read the Docs site at devilbox.readthedocs.io; its install page was read at /en/latest/getting-started/install-the-devilbox.html. The README states the requirements as Docker Engine 17.06.0+ and Docker Compose 1.16.0+, and it supports Linux, macOS, Windows and WSL2. Docker is the runtime of the stack, not a runtime of the record, so runtime is unknown. The README lists the containers the stack starts (Apache, Nginx, PHP, MySQL, MariaDB, PerconaDB, PostgreSQL, MongoDB, Redis, Memcached and others). They are development services the developer starts, so databases stays unknown for the record. The README does not name a parent project; it lists supported frameworks (CakePHP, Laravel, WordPress and others) as examples. Highest stable GitHub release is v2.4.0 (2022-12-18), and v3.0.0-beta-0.3 (2023-01-03) is the newest pre-release. The oldest release is 0.8-pre (2016-11-03), which the import reads as the 2016 start. The default branch was last pushed 2024-04-19; no archive flag, deprecation or end statement was found in the README or the docs read. The newest stable release is more than three years old: the import moves the record to stub if no release or pre-release appears by 2026-12-18. The README names the maintainer only as cytopia, from the copyright line; no legal name or company is stated. The README's sponsorship links (GitHub Sponsors, Patreon) are not recorded.
