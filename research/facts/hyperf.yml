notes: >
  The install docs name hyperf/hyperf-skeleton, a skeleton; the registry figures come from hyperf/framework, the core component the skeleton requires. latestReleaseDate is the date Packagist gives the newest 3.2 release (v3.2.5); the GitHub releases list is behind it and a 3.1 maintenance release is dated later. hyperf/hyperf is the monorepo package and is not used for figures. The install page requires Swoole >= 5.0 or Swow >= 1.4 (not coded as a field). The README calls the Swoole and Swow engines the basis of the framework. firstRelease comes from the README sentence about the public release date. The docs at hyperf.wiki and the project site are JavaScript apps with no readable text; the docs source in the repository under docs/en was read instead.
