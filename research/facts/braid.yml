notes: >
  The homepage is the project's documentation site (Guides, Foundations, Components, Patterns, Styles). The npm package braid-design-system is the one the README installs; the repository holds other publishes too (@braid-design-system/docs-ui, @braid-design-system/icons, @braid-design-system/codemod), which are not recorded. The highest stable GitHub release for the package is braid-design-system@34.10.0 (2026-10-19), and npm latest is the same version. firstRelease is the earliest GitHub release, v0.0.2 to 0.0.4 in October 2018 (the repository was created 2018-10-01). The maintainer is SEEK as the LICENSE copyright line names it and the README says "Themeable design system for the SEEK Group."; no legal form or country is stated on the pages read, and the SEEK site answers 403 to the request, so hqCountry is not recorded; the au.seek.com about page says SEEK was founded in Melbourne, Australia and is listed on the Australian Securities Exchange, which does not state where it is headquartered. The README's setup guide is written for the sku build tool; the library itself installs through npm.
