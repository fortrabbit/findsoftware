notes: >
  No homepage: the repository's homepage field is empty and the README links only the wiki and the repository. The README calls Gollum "built on top of Git", and no basedOn is recorded because Git is a version control system, not a framework, CMS or UI library, which the field is for; the reviewer decides. The license statement names four copyright holders, recorded as maintainer; the repository owner is the gollum organization. firstRelease is the RubyGems publication date of version 1.0.0 (2010-08-12), because the GitHub release list starts at v5.3.0 (2022-05-25) and does not show the earlier history. The rubygems figure is the total since the gem was first published, from the gem named by the install command. The README lists GitHub and GitLab wiki compatibility as a goal, which is not recorded as a fact. The README gives the default port 4567 for the running server, and the --port option binds it; the rendering mode is not stated, so renderingModes is left out. The README says Gollum ships with support for Markdown and RDoc, and that AsciiDoc, Creole, MediaWiki, Org, Pod, ReStructuredText and Textile work by installing additional renderers; this has no starter field and is kept in notes. The README says pages can be edited in any editor and committed, or in the built-in web interface, and that further markups install as additional renderers.
