notes: >
  The repository README says it documents the B2C Single Vendor backend API (v6.0, headed B2C & B2B APIs) and lists MySQL Server as the database; the repository description's PostgreSQL mention is not recorded because the v6 package.json has mysql only. The homepage shows the 5.4 release while GitHub's latest stable is v6.0.0 (2026-10-16); currentMajor follows GitHub, and the homepage is not treated as a version source. The GitHub repository description says the project is built on Express.js, which is recorded as basedOn from the repository's own words; the README names Node.js, TypeScript, TypeORM and MySQL. The LICENSE file reads MIT with the copyright line "Copyright (c) 2017 w3tecch", and the open-source license agreement on spurtcommerce.com names the Common Public Attribution License 1.0 for the same software, which also restricts selling a modified version; both are recorded as separate license entries and no licenseModel is set by hand, so the import derives it from both statements. The license agreement names the licensor as "Spurtcommerce eSolutions (P) Limited" and the footer as "Spurtcommerce e-Solutions Private Limited"; the agreement name is recorded as the maintainer; the footer reads "Copyright © 2026 Spurtcommerce e-Solutions Private Limited." No page gives the company's country, so hqCountry is unknown; the legal form is Indian. The site says the product is self-hosted and "Is Spurtcommerce a SaaS platform? No." (price-details page); the site sells multi-vendor and shopping-cart source code products, recorded as paidEdition from the price-details page with no prices. The homepage lists Facebook, Instagram and LinkedIn accounts, which no field in the list covers. firstRelease is left out: the earliest GitHub tag, the 2022-12-27 "add-on" prerelease, is an add-on for 4.8, and the LICENSE copyright line dates the code to 2017. The storefront and admin are separate frontends that the docs describe; they are not in this repository. The docs describe the APIs as Admin, Vendor and Store APIs and do not state a REST or GraphQL style, so headlessApi is unknown. Marketplace features (multi-vendor, commission, B2B quotation) are described on the homepage and are not recorded as fields.
