notes: >
  Status is accepted. The Elixir runtime is stated by mix.exs at v3.37.0 (elixir ~> 1.17); the README and the homepage name no version. The homepage calls Ash an Elixir backend framework and says it works with Phoenix LiveView; no page says Ash is built on another framework, so basedOn is absent. The what-is-ash page says Ash builds on Ecto, Phoenix, Oban and Absinthe; it describes integration, not a parent, and is not recorded as basedOn. The GitHub licence field is null, but the README badge and SPDX header and the Hex metadata all state MIT. The Hex package has versions from 0.1.0 (2019-12-04), the oldest registry upload, so firstRelease is 2019; the GitHub tags begin at v0.1.1. The GitHub releases list runs from v3.5.23 (2025-06-19), so the release dates come from the newest release; the newest preview on Hex is a 3.0.0 release candidate from 2024, older than the latest release, so latestPrereleaseDate is absent. The installation guide installs with igniter; Ash's own pages do not state a deployment target or a process model, so runsAs and renderingModes are absent. The admin interface is the separate AshAdmin package listed in the README. The GraphQL extension is listed as an API extension; JSON:API is the AshJsonApi extension and is not recorded as rest. Two Discord invites exist: https://discord.gg/w3AXeARR2p on the what-is-ash docs page, recorded as the fact, and https://discord.gg/HTHRaaVPUc in the Hex package metadata. The bluesky link is the homepage's Bluesky account.
