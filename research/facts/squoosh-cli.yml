notes: >
  Discontinued: the npm package's README opens with "Project no longer maintained" and says "this package is no longer actively maintained", and the repository's commit 13a185de removed the CLI and libsquoosh sources on 2023-01-03. The CSV row's "CLI unpublished since 2023" is wrong: npm still serves 0.7.3 (2023-01-03), and the registry has no deprecation flag. The web app at squoosh.app is maintained by the same team and is a finished application in criterion 1 terms, so it is not a record here; its README says the site "will continue to be supported and improved". squoosh.app is the web app's site, not the CLI's, so no homepage is recorded. GitHub stars and contributors are not recorded because the repository is the web app's monorepo (the stars and contributors belong to it, not the CLI). firstRelease is 2020, the creation of the npm package (version 0.1.0, 2020-09-09); the repository's older tags (from 2018) belong to the web app. currentMajor is 0, from the npm latest version, because the repository has no GitHub release and its tags belong to the web app. The npm weekly figure covers 2026-09-28 to 2026-10-04 for the package @squoosh/cli. The maintainer is the author name in the npm manifest, "Google Chrome Developers"; the npm maintainers listed are three individuals, not used. The Apache-2.0 LICENSE file carries no copyright line.
