notes: >
  No GitHub release or tag-based release page exists; the Hex package esbuild is the registry the install docs name (mix.exs dependency "{:esbuild, ...}"), and its 24 uploads run from 0.1.0 (2021-07-18) to 0.10.1 (2026-10-19), so currentMajor, firstRelease and latestReleaseDate come from Hex. The repository tags run v0.1.0 onward to v0.10.1, the highest stable tag. The GitHub homepage field is empty; the Hex package links name esbuild.github.io, which is the upstream esbuild project's site and is not recorded as this project's homepage. The README says the project installs and invokes esbuild, so basedOn esbuild is recorded; Phoenix is described under "Adding to Phoenix" as the application it is added to and is not recorded as a parent. runtimeMin is not recorded: mix.exs requires Elixir "~> 1.14", but an Elixir version is not a BEAM runtime minimum. The Hex package maintainers list is empty; maintainer comes from the LICENSE copyright line. The Hex license list says MIT. The Hex metadata marks 0.8.0 retired as invalid, which is not a project end. The contributors figure counts all pages of the contributors endpoint.
