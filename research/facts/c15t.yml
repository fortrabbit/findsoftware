notes: >
  The GitHub repository is a monorepo: its latest release is @c15t/tanstack-start@3.2.2, so currentMajor and latestReleaseDate follow the c15t package tags (c15t@3.2.2, 2026-11-01). The newest prerelease (c15t@3.2.0-canary.0, 2026-10-23) is older than the stable release and is not recorded. The LICENSE.md file has no copyright line; the maintainer comes from the terms and privacy notices, which name Consent Management Inc, a Delaware corporation. Its notice address is in San Francisco, California, and no page names the country, so hqCountry is left out. "Inth" is the brand of the hosted service and the company's product name; the privacy notice describes Inth as the name the company uses. The homepage and docs call the hosted service Inth; the hosted plan tiers (Pro, Enterprise) are not recorded as paidEdition. The self-hosted backend is one of two routes: hosted on Inth, or the Node.js SDK run by the operator, which is the selfHostOption. The `free` sign-up for Inth and the policy packs on Pro and above are hosted features, held in notes. The self-host guide says the self-hosted backend route needs a Node.js server and that a static frontend can call a backend deployed elsewhere; no runsAs is recorded for the library itself beyond the browser. The X and Bluesky links are homepage links without a quote. The freeTier and the Inth SOC 2 Type 2 report are coined kinds and are not recorded as fields. The GitHub language is TypeScript and the library runs in the browser; the framework packages (React, Next.js, Vue, Nuxt, Astro, TanStack Start, Svelte) are supported adapters, not a basedOn statement, so basedOn is left out. The comparison pages name OneTrust, Usercentrics, Didomi, Iubenda, Klaro, Osano, tarteaucitron and others; only Cookiebot has a record id in the dataset, so only cookiebot is recorded as alternativeTo. The contributor count is from the default branch endpoint without anon. The npm figure is the sum of the seven daily counts from the range API, for the period in the value. Stars and the Inth-hosted service are dated 2026-11-03.
