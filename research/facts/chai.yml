notes: >
  The homepage given in the CSV, https://chaijs.github.io, redirects to https://www.chaijs.com/, which is recorded; chaijs.com and http://chaijs.com redirect to the same site. The LICENSE copyright line names "Chai.js Assertion Library" with no legal person, so that is the maintainer recorded; the package.json author field names Jake Luer, a former core contributor, and the README lists core contributors by name without a legal entity. The README says Chai works in Node.js and in the browser, and the browser route is the same npm package loaded as an ES module, so no separate install method is recorded. Both environments rule out a single process model, so runsAs is left empty. The Node.js requirement comes from the engines field in package.json at v6.3.0, a shipped requirement of the package. The homepage community section names a Google Group mailing list and an IRC channel for help; the Google Group is recorded as the forum. The README names a Slack chat, a Gitter chat and an OpenCollective page, none of which is a field. The repository's own README names several related projects (assertion-error, deep-eql, loupe, pathval); they are parts of Chai and get no records. The plugin list is the official directory; no plugin count was taken. The npm figure counts downloads of chai, the package the install line names.
