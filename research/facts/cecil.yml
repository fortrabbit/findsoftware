notes: >
  The about page says the first functional version was named PHPoole and was released in September 2013; that is a rename of the same project, so no forkOf or successorOf fact is written. The Packagist and GitHub release dates are both current: the latest tag 9.20.1 was published on 2026-10-20. The homepage states the content store and the lack of a database, and the databases field is left unknown because the page names no database engine. The about page names Arnaud Ligny as the maintainer; the footer copyright gives the same name without a legal form, and the GitHub owner is the Cecilapp organization. The installation page names the PHAR, a standalone binary without PHP, and Composer; the standalone binary embeds PHP but not the PHP built-in web server that serve uses, and the install page says to run the build command and serve the output with another web server. The homepage says the generator produces pagination, taxonomies, sitemap, RSS feeds, robots.txt and redirects automatically, converts responsive images to WebP and AVIF, and states "No database, no server-side code". The installation page says the standalone binary uses GD only, with no Imagick or libvips, has no self-update command, and is unsigned, so macOS users remove the quarantine attribute before the first run. The installation page says the standalone binary is updated by downloading it again. The continuous deployment page names GitHub Pages and GitLab CI as examples. The Packagist figures are for cecil/cecil, the package the composer install command names.
