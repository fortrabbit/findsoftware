notes: >
  The record covers the hosted Chargebee service; no self-host install is documented, so the status is hosted-service. The SDK repository chargebee/chargebee-node (MIT, 61 stars, latest SDK tag v3.35.0 on 2026-11-02, npm chargebee about 124 thousand downloads a week in the candidates row) is a client library and is not recorded as a field. The legal name Chargebee Inc. comes from the copyright line, the terms page title and the security page footer; no page in the static HTML names a headquarters country or street address, so hqCountry is unknown. The pricing page lists Starter, Flow, Enterprise, CPQ Lite, CPQ, Performance and Enterprise plans; plan prices are not recorded. The Enterprise access controls line sits under API, DevOps and Others, so the sso value is taken as the words state them. The pricing page also lists multi-entity management, account hierarchy and a "Migration support" line; no software is named as a migration source on the pages read, so importsFrom is unknown. The Stripe and gateway listings are integrations, not a parent or an installable part. The pricing page offers a Starter plan at no charge for single-brand businesses; this is noted here because the dictionary has no field for it.
