notes: >
  The CSV row and the GitHub API use buildship-ai/rowy; the README links rowyio/rowy, which redirects to buildship-ai/rowy, so that is recorded. The GitHub license field reads NOASSERTION; the LICENSE file is Apache-2.0 and is recorded from it. The docs say Rowy Pro features exist and the install page links to a paid route for them, but no page states the Pro edition's license or features, so paidEdition is unknown. The homepage promotes BuildShip and a Rowy 2.0 waitlist; the README still describes Rowy as usable, so no end signal and no successor is recorded. The last push to the default branch is 2024-11-23; the latest stable release is 2023-10-27, so the import judges listing by the release date. The homepage link in the CSV is http and redirects to https, so the https address is recorded. The docs call the manual install a route for developers who want to contribute, and its Node 16 requirement is for that route only, so runtime is not recorded: the app itself runs in the user's Google Cloud or Firebase project. The README says the backend features need Rowy Run installed in the user's project; the docs do not say which hosting runs it, so runsAs is unknown. The company is named from its LICENSE and terms page; hqCountry is not stated on those pages.
