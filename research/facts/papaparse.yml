notes: >
  Papa Parse is a single JavaScript library with no dependencies, published on npm as papaparse; the repository is mholt/PapaParse under the user account of Matthew Holt, whose name appears on the LICENSE copyright line and on the homepage. The homepage was given as http://PapaParse.com in the discovery row; that address redirects to https://www.papaparse.com/, and the https address is the one recorded. The GitHub release list ends at 5.7.0 (2026-08-24), while the npm latest tag is 5.7.1, uploaded 2026-11-11 and without a GitHub release object; latestReleaseDate takes the newer npm upload, and currentMajor is 5 either way. The oldest tag, 0.5.0, has the commit date 2013-10-07, earlier than the oldest GitHub release (3.0.0, 2014-07-16), so firstRelease is 2013. Runtime node comes from the README's Node.js section; the README also describes in-browser use, so both environments are named and no runsAs value is recorded. The homepage's personal Twitter link is the maintainer's own account and is not recorded as the project's x field. Dependents and downloads are from ecosyste.ms; the npm weekly figure is the sum of the npm downloads range API for 2026-11-01 to 2026-11-07.
