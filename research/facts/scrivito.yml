notes: >
  The product is renamed: the homepage title reads "Future-Proof JustRelate Web Builder | Scrivito" and the pricing page calls the product JustRelate Web Builder, so the record keeps the id and name of the Scrivito site; a reviewer decides whether the name changes.
  The imprint names JustRelate Deutschland GmbH as "a company of the JustRelate Group" and its page title reads "JustRelate Group GmbH", which has a second address and register entry; the maintainer is the entity that imprint opens with, and the group is not recorded as a second maintainer.
  The pricing page marks "Multi-Site Management" and "User Management / SSO" with an enterprise-feature note, so those two values carry the plan.
  The technology page says the CMS is API-first with a RESTful interface and that its content retrieval is available through APIs; the RESTful interface is the stated value.
  The homepage says the product runs on a serverless architecture with a 99.999 percent availability target, and the pricing page lists a "Zero-maintenance headless backend + API"; neither is a deployment field, so they stay in these notes.
  The SSO page does not name SAML, OIDC or LDAP, so the sso value is the plan row only.
  The pricing page gives no request limit, so apiLimits stays unknown.
  The terms page links a general terms document and a service level agreement as PDF files, which were not read, so no terms-based fact is recorded. The pricing page says hosting is included, with the site deployed to a CDN through Netlify. The technology page says the web builder can be extended with the JavaScript library React; no parent is recorded as basedOn.
