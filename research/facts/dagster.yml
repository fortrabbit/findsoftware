notes: "Stub, doubt first: the project's own GraphQL API page (docs.dagster.io/api/graphql) says the API lets clients query runs and launch job executions \"on custom events\", and it describes the API as \"still evolving and is subject to breaking changes\" with \"a large portion of the API is primarily for internal use by the Dagster webserver\". It is not clear that an app is meant to call it, and a data pipeline orchestrator is not a website or web app, so a reviewer should decide, as with airflow. A second doubt is ownership: the homepage banner reads \"Dagster is now part of Prefect\", the page footer reads \"Prefect Technologies, Inc.\", the terms name \"Elementl, Inc.\" as the provider, and the LICENSE copyright line reads \"Dagster Labs, Inc.\", which is the recorded maintainer. The pyproject at tag 1.13.28 gives requires-python >=3.10, while the README says Python 3.9 through 3.14; the manifest value is recorded. The docs also list an External assets REST API, not read in full. The PyPI package dagster is the install target, and the pypistats figure is the last-month count. The governing law in the terms is California, which is not a country; hqCountry is unknown."
