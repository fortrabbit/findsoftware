notes: >
  The repository is the only web presence; the README has no separate site, so no homepage. The repository has tags (v5.0.9 and earlier) but no GitHub releases; currentMajor and latestReleaseDate come from the npm latest tag, which matches the newest tag. firstRelease is the first npm upload (0.0.0, 2020-02-15) because the repository has no release list. The README opens with a warning that the author is on vacation, that v4 is the most battle-tested line and that v5 is a rewrite whose reactivity is not finished. That is a maintenance note, not an end statement; the repository was last pushed in 2026. The README's server rendering section says SSR is a work in progress, which is compatibility and not renderingModes. The README gives the CDN route only, so no npm install route is recorded. The README also lists React-like components, Preact-like signals, and the JSX-inspired syntax, and says the 5.x line is a rewrite whose reactivity is not yet complete while the previous line is the one it calls most tested.
