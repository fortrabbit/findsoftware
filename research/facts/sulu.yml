notes: >
  The homepage names JSON:API next to REST for the headless output; the vocabulary has rest only, so headlessApi is [rest]. Sulu.ai is named on the homepage as a separate product with AI features; its pricing and licensing are not stated, so no paidEdition. The blog post of 15 October 2026 states the codebase stays MIT and Sulu.ai and Sulu.cloud are built alongside it. The imprint names Schönberger Holding GmbH with 75% of Sulu GmbH, recorded as parent. The GitHub repository was created 2013-10-18, which is repository age, not a first release date, so firstRelease is unknown. The contributor count is the default GitHub contributors listing (last page number at one per page); it excludes anonymous contributors. The install docs name sulu/skeleton; sulu/sulu is the core package and only the core package sulu/sulu is recorded (the skeleton has 37578 total and 793 monthly). The docs cited are the 3.x series; the current major is 3.
