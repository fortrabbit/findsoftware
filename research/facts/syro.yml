notes: >
  Category: the CSV row says framework and micro-framework, but the README calls Syro "a very simple router for web applications" and the homepage says "Simple router for web applications", so the category is router. Homepage: the CSV row lists http://soveran.github.io/syro/, which answers 200 over http and over https; the https address is recorded because it is the project's own site and is served over https. Relation to Cuba: the README says Syro was created "in the tradition of libraries like Rum and Cuba", that its design is inspired by some Cuba applications, and that the first idea was a new Cuba version that broke compatibility; no page calls it a fork or a successor, so basedOn and forkOf are not recorded. Releases: the highest stable GitHub release is 3.1.0 (2018-02-01); the tags 3.1.1 and 3.2.0 have no GitHub release, and the gem is at 3.2.1 (2021-03-21), the newest stable upload. latestReleaseDate is the gem date of 3.2.1 (2021-03-21), newer than the GitHub release 3.1.0 (2018-02-01); major 3 is the same under both. firstRelease 2015 is the gem's first upload 0.0.1 (2015-04-23), the same year as the repository's creation. runtime: the tutorial states Syro is a router for web development with Ruby; the gemspec states no Ruby version, so runtimeMin is absent. runsAs always-on is the tutorial's "Running a webserver" chapter: a config.ru started with rackup. The tutorial's template chapter uses Mote as an example; the README says no rendering is built in, so no templating value is recorded. The README's community link is an IRC channel on freenode, not a field. The README says the framework provides no security features, rendering features or Rack middleware support out of the box; those are stated limits, not recorded as fields.
