notes: >
  Boundary ruling for this wave: accepted as a React hooks library, so the general-purpose utility question is decided in favour of the record. The basedOn react fact rests on the README sentence "Collection of essential React Hooks". The README says the project is a port of libreact; a port is not recorded as forkOf or basedOn. The Unlicense has no copyright line, so the maintainer comes from the npm author field, which names @streamich; the GitHub owner is the same account. The latest stable release is v17.6.1 (2026-06-10) on GitHub and npm; the npm alpha 15.0.0-alpha.1 is from 2020 and older, so no latestPrereleaseDate. The homepage is the demo site the repository names; the README and the repository field give it as http, which redirects to the https address recorded, and the page is a JavaScript shell, so the homepage is cited from the GitHub API field. The README groups the hooks into Sensors (battery, geolocation, media queries), UI, Animations, Side-effects (cookies, local storage), Lifecycles, State and Miscellaneous, with a docs page for each hook. Stars and contributors belong to the repository; npmWeeklyDownloads is for the react-use package the README install line names.
