notes: >
  The repository holds the core library, the linq2db.cli dotnet tool, provider packages and the EntityFrameworkCore, Identity and LINQPad integrations; the stars and contributors count the whole repository, and the registry figure is the linq2db package the install page names. The README says the library is one step above micro-ORMs such as Dapper, Massive and PetaPoco and not as heavy as LINQ to SQL or Entity Framework; that is a comparison, not a statement that they are alternatives, so no alternativeTo. The README also says there is no change-tracking, so the application manages that itself. The install page says to install the ADO.NET providers from NuGet where available, or locally for providers with a custom installer. The maintainer follows the MIT-LICENSE.txt copyright line; the NuGet authors field and the docs footer name the same people and "Linq To DB Team" respectively. The linq2db 6.5.1 nuspec lists the target frameworks net8.0, net9.0, net10.0, .NETStandard2.0 and .NETFramework4.6.2; .NET Standard 2.0 and the .NET Framework minimum reach older runtimes, so no runtimeMin is recorded. The README states F# use is supported (Source/LinqToDB.FSharp), and the language stays C#. The database list comes from the docs source file; Microsoft Access, SqlCe, SAP HANA, Sybase ASE and DB2 iSeries providers are in the same table and are not recorded as fields. The first tag v1.0.0.0 is committed 2013-08-21; the oldest GitHub release is v2.0.0-beta5 (2018), and the oldest NuGet package version 0.0.1 has a catalog created date of 2013-02-27, so firstRelease is 2013 from the NuGet catalog. The docs link on the homepage is the project's own documentation site.
