notes: >
  The homepage links GitHub and a personal account of the project lead; that account is a personal one, so it is not recorded as the project's x link. The about page names the company only as "the company located in the middle of the Europe, Prague, Czech Republic"; no legal entity name appears on the about page, the on-prem or buy pages, or the commercial End User License Agreement, which names only "Licensor" and is governed by Czech law. The maintainer is recorded as the project names itself, and hqCountry rests on the about page sentence; a reviewer should confirm the company. The repository is LGPL-3.0 (GitHub API; the root file is executable-license.txt, the repository has no file named LICENSE); the on-prem page says the on-premise product is free up to 5 report templates and needs an enterprise license beyond that; the EULA covers the commercial software. The on-prem page says "All licenses are royalty free." The homepage lists PDF, Excel, DOCX, HTML and CSV outputs. The CLI page describes a command line tool. The import derives licenseModel from these statements. The on-prem page also says node.js (>= 22.18) on the target machine, the same as the registry engines field for 4.15.0, which is recorded as runtimeMin. The on-prem page says the single executable version is currently provided only for versions up to 4.10.0, so no single-file-executable install route is recorded for the latest release. The npm package author field names Jan Blaha, listed on the about page as project lead. The learn section lists clients for the command line, the browser, node.js, .NET and Java. The jsreport registry package is the one the docs name; @jsreport/jsreport-cli is the on-prem installer. The about page dates the first official release to spring 2014 and the oldest GitHub release is 0.1.7 (2014-07-23). Adoption figures on the homepage and about page: 200 000 server installations (homepage), 8049 new servers activated during the past month and 200K+ on premise downloads and 30M+ reports generated using jsreport online (about page). The homepage states 600 subscribed enterprise customers; not recorded. The learn section lists Scheduling, Authentication and Authorization as extensions; the field values are not stated on a page and are left unrecorded. The homepage claims "open source, cross-platform" and the get-started page calls it "an open-source reporting server-side tool"; the license values above describe the terms.
