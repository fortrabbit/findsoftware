notes: >
  Status accepted from the candidate row. The product is a WAF that sits in front of a web app, so it adds to a site (criterion 1). Language is Python per GitHub; the NGINX worker is C and is the basis of the product, not a runtime value, so runtime records Python only, quoted from the all-in-one docs. The Swarm integration is deprecated on the integrations page and is not recorded as an installMethod. The Azure section of the integrations page was not read past its heading, so no Azure installMethod. The README words the license as AGPLv3, the same license as the AGPL-3.0 id. Docs URLs use the 1.6.16 stable path (the 1.6.17 path is a release candidate). The Docker Hub count is for bunkerity/bunkerweb, the image the docs name. The legal form SAS and the headquarters city come from the legal notice; the company name in the footer is Bunkerity. Social links without quotes: the homepage footer and nav icons (Discord, X, Instagram) and the README (LinkedIn, YouTube, Reddit). LinkedIn (linkedin.com/company/bunkerity) and YouTube (youtube.com/@bunkerity4183) have no field in the starter list and are not recorded. The community forum on community.bunkerweb.io is a second forum link in the README and is not recorded. The PRO features are paid add-ons; plugin-level SAML, OIDC and LDAP are recorded as sso with PRO marked in the value. The Docker Hub figure is pull_count for the image name in the docs; the value is recorded with its date. No httpArchiveSites figure was checked for bunkerweb. The CHANGELOG has entries from v1.2.5 (2021/05/14), older than the oldest GitHub release v1.3.0 (2021-08-23), so firstRelease takes the changelog year. The record is a WAF that sits in front of web apps; BunkerWeb's own pages describe it as protecting web services, so no judgement on use is needed.
