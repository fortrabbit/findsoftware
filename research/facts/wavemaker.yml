notes: >
  The GitHub organization profile lists its location as United States of America; that is no statement of the company's headquarters, so hqCountry is not recorded. The public site and its /learn docs answer 403 with a bot challenge to curl, so the docs are read from their source repository wavemaker/docs (the README says it "powers the site: wavemaker.com/learn"), and the homepage is taken from the GitHub organization's website field; a reviewer should open the site in a browser to confirm the homepage. The product source is not public: the wavemaker organization holds connectors, the app runtime (archived 2020), build tools and a React Native plugin under Apache-2.0 or MIT, none of which is the Studio, so no repository is recorded and the only license entry is the license key statement, not an open-source license; a reviewer may decide that the Apache-2.0 docs repository and the component licenses are no statement about the product. The docs repository's own Apache-2.0 license is not recorded. language Java is taken from the wavemaker-commons repository, the one public product library of the Java part of the organization, not from a statement about the Studio. runtimeMin 17 is the lowest JDK the deployment page names for the WAR an app is deployed to, not a requirement of the Studio itself. The docs state that "Apps built can be freely distributed without any licensing concerns", recorded here only as prose context; it is not a license fact. The documentation reference says Enterprise "offers more specific business integrations like Git Enterprise, behind the firewall services, Single sign-on for platform logins, and more", and the deployment page lists Tomcat 10.x, WebSphere Liberty, WildFly 15+ and WebLogic 14c as web servers for the WAR file an app is deployed to. The product has two editions: WaveMaker Online is cloud-based with no installation, and WaveMaker Enterprise is the on-premise product installed on dedicated machines. The on-premise getting-started page says "All machines allocated to the WME Platform must not have any other process running in it." The docs list the security providers as Database, LDAP, Active Directory, CAS, SAML and OpenID; Active Directory and OpenID are not recorded as separate sso values because the sso vocabulary in the dictionary has no entry for them and the quotes would add nothing. databases lists DB2 and HSQL as well, which the dictionary lacks, so they are not in the values. The pricing and purchase plans are described without a pricing page link, so pricingPage is not recorded. The license is a key file; the license terms themselves are not in the docs, so licenseModel is not recorded. The status is accepted from the CSV row, although the product mixes a cloud service with an on-premise build; a reviewer may decide between accepted and hosted-service. The platform overview says the UI layer "is built with Pages, which are composed with widgets using visual drag-n-drop approach" and that it has "clear separation of User Interface (UI) layer and the backend services layer using REST APIs"; the architecture page says each platform service "runs in a separate Docker Container", and the Enterprise getting-started page says the machine "can be hosted on any cloud provider" or bare-metal.
  The prose also relies on the docs: the deployment page says an app is deployed by generating a WAR file for a Java web server; the Enterprise configuration page says "The number of users that can be added is limited by the terms in License and the Developer Capacity of WME"; the localization, pre-requisites and platform overview pages cover the rest.
