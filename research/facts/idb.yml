notes: >
  No project website: the repository's homepage field points at the npm package page, a registry page rather than the project's own site, so there is no homepage fact. Stars, contributors (32) and dependents belong to the repository and package named in the install docs. The repository has no GitHub release objects; the stable line is the registry, npm latest 8.0.4 (published 2026-10-06), which matches the newest tag v8.0.4, so currentMajor is 8. The npm upload 0.0.1 (2015-04-02) carries no metadata and 1.0.0 (2015-08-25) is the first described version; both fall in 2015. The browser-only nature is stated only by the README's browser support sentence and its script-tag sections, so no runsAs fact is recorded;. The npm route is quoted from the install command under the Installation heading; the two jsDelivr routes are quoted from their section headings. The README links idb-keyval as a simpler option for key-value storage; it is a related package, not a statement of an alternative, so no alternativeTo. The README says the library is fully typed and ships TypeScript types; that is a coined kind and stays in notes. The repository's CHANGELOG.md lists breaking changes; not a field. The README's transaction lifetime section says a transaction closes when nothing is left to do after microtasks, so awaiting other work such as a fetch between the start and the end of a transaction makes later writes fail. Its browser support section targets modern browsers and says IE is not supported.
