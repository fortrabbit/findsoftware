notes: >
  The package is an R Markdown output format, not a site generator on its own: the homepage describes articles, a Distill website and a Distill blog, and the name of R Markdown appears as the authoring tool. The project says it combines the Distill web framework with R Markdown; the basedOn fact names the Distill web framework (distillpub/template), and basedOn names R Markdown, which the README says Distill for R Markdown combines the Distill authoring features with. The homepage has no statement that the output is static files, so renderingModes is not recorded. The GitHub releases are v1.4 (2022-05-13), v1.5 and v1.6 (2023-10-06); firstRelease reads 2019 from the oldest file in the CRAN archive, older than the first GitHub release. The main branch DESCRIPTION reads 1.6.1, which is unreleased, so it is not recorded. The maintainer recorded is Posit Software, PBC, the copyright holder and funder in the current DESCRIPTION authors list; the LICENSE file carries the older RStudio, Inc. line and the CRAN page names Christophe Dervieux as the package maintainer. The CRAN page gives the publication date 2023-10-06, which matches the GitHub release.
