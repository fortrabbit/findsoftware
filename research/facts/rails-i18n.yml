notes: >
  Doubt: the repository's homepage is http://rails-i18n.org, which answers only over plain HTTP (an HTTPS request to rails-i18n.org does not complete a TLS handshake with a matching certificate), and the HTTP page is an interviews and tools site for the Rails i18n community with an unrelated author, not the gem's documentation. Per the homepage rule no homepage is linked and the record is a stub; the doubt settles if the gem names its own HTTPS site, or a reviewer accepts the GitHub repository and the RubyGems page as the only links. The README links no docs site; its own sections (Gem Installation, Configuration, Available Locales, Manual Installation) serve as the documentation and are not recorded as a docs fact. The README names Ruby on Rails as the target ("Centralization of locale data collection for Ruby on Rails"), which is the basedOn statement. The README says all modules (locales, pluralization, transliteration, ordinals) are enabled by default and that config.rails_i18n.enabled_modules restricts them; its Manual Installation section describes downloading locale files into an application's config/locales directory, recorded as a second installMethod. The gemspec authors field names "Rails I18n Group" and its contact address is a Google Group; the LICENSE copyright line names Sven Fuchs and contributors, and the maintainer follows that line; the README's Special thanks names Tsutomu Kuroda for taking care of the repository. The gem's RubyGems page reports the first upload as 0.1.0 on 2011-07-12, older than the first GitHub tag v6.0.0 (committed 2019-08-17), so firstRelease is 2011. The repository has no GitHub release objects; the newest tag v8.1.0 matches the RubyGems version 8.1.0 published 2025-11-24, so latestReleaseDate comes from RubyGems. The RubyGems download figure is the total for the gem. The runtime minimum is from the gemspec at the v8.1.0 tag; the README gives "Ruby on Rails version must be 3.0 or higher" for the older Rails range, which is not the gem's Ruby requirement. The stars and contributors belong to the single repository. The README's list of available locales is data about the gem and is not recorded.
