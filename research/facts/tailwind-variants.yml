notes: >
  The LICENSE copyright line reads "Copyright (c) 2020 Tailwid Variants", a misspelling of the project name, so the maintainer comes from the site footer, which names NextUI Inc.; the GitHub owner is the heroui-inc organization and the site footer says it is powered by HeroUI. The repository license and the npm license both say MIT. The npm engines field names node >=16.9.x and pnpm >=7.x; for a UI library these go to notes and not to runtime or runtimeMin. The maintainerType is left to the import, because the footer line "Powered by HeroUI" does not state a legal form. The docs say the default build merges conflicting Tailwind classes and that tailwind-variants/lite skips conflict resolution; no fact is taken from that. The docs also state tailwind-merge is not needed for conflict resolution, which is a dependency statement and not a basedOn statement. The README lists slots, composition, full typing, framework agnostic use, built-in conflict resolution and Tailwind CSS v4 support as features, and the docs describe variants, default variants, compound variants and slots; none of these is a fact field. The npm weekly figure is the range 2026-10-19 to 2026-10-25. Contributors counts registered contributors across all pages of the repository. firstRelease is the year of the oldest GitHub release, v0.0.29 of 2023-02-05.
