notes: >
  The homepage and the getting-started page are server-rendered and read as raw HTML; the docs route /docs/introduce/en answers with the homepage content. Support for the Angular major is stated as "keeps the same major version with @angular/core" with Angular ^22.0.0 on the homepage; no runtimeMin is recorded because that range is a peer dependency, not a runtime. The homepage footer links Blog and Medium (ng.ant.design/blog, medium.com/ng-zorro), which are not fields. The maintainer is the copyright holder the LICENSE names; the homepage credits "NG-ZORRO team", and no legal form or country is stated on a page read. Environment Support lists modern browsers and Server-side Rendering; no runsAs is recorded because the page lists supported environments, not how the library runs; the npm range is 2026-10-18 to 2026-10-24. The npm figure counts downloads of ng-zorro-antd, the package the install page names. The latest GitHub release 22.1.2 is also the npm latest. The prerelease 22.0.0-beta.0 (2026-07-13) is older than the latest stable release and is not recorded. The Companies list on the homepage is not a field. The GitHub API reports the release tags 0.5.0-rc.0 (2017-08-15) as the oldest release, matching the npm creation date.
