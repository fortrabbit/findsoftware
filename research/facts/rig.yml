notes: >
  The CSV homepage is the project's GitHub Pages site, and it answers over https; recorded as is. The homepage's visible text is the one-line description and the links to the docs, the GitHub repository, a Slack invite app (rig-slackin.herokuapp.com, which answers 404, so no slack fact), a Stack Overflow tag (recorded as forum, at its https address) and a Twitter account for a named individual (twitter.com/kevnbadr), which is not the project's account; the x fact is the project's account named in the README. The README's Twitter link redirects to x.com/reactivegateway, and that is the account recorded as the twitter.com address. The repository has no GitHub release after 3.0.0 (2022-08-12) and no stable release after it; the 3.0.0-alpha.1 and alpha.2 prereleases are older than 3.0.0 and are not recorded as latestPrereleaseDate. The CHANGELOG first lists 1.0.0 on 2017-11-09; the repository was created 2017-10-20. The documentation pages and the README describe the project as a gateway that uses Kafka, NATS and Kinesis as message brokers; those are not recorded as databases because no page names them as a database. The runtime value is elixir, and the intro page also describes the Erlang VM (BEAM) that the actors run on. The operator's guide lists the ports and the environment variables for the JWT and message broker settings, and the README says the Kubernetes deployment instructions are in the repository. The FAQ says no knowledge of Elixir or Erlang is needed to use RIG, though a rudimentary familiarity with Erlang data structures helps when reading error messages. The README says RIG acts as a reverse proxy for synchronous requests and says it forwards backend events to clients based on subscriptions. It lists the request modes: synchronous reverse proxying, asynchronous fire-and-forget messages, and two pseudo-synchronous modes that hold the open client connection until the backend answers through Kafka or NATS. The mix.exs elixir version is a variable in the project file, so no runtimeMin is recorded. The LICENSE file carries no copyright line; the license is Apache 2.0 with a patent grant named in the README. The README and the homepage give no headquarters for Accenture, and the company's legal entity was not found on a legal page, so maintainer stays as the project words it.
