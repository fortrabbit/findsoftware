notes: >
  The homepage answers over https (the http address redirects to https), so the https address is linked. The Apache Software License 2.0 statement appears in the README and in the changelog entry "Clarified license (Apache Source License 2.0), added LICENSE file." The GitHub API reports the license as NOASSERTION, so no license fact is taken from it. The documentation page states "The FW/1 documentation is copyright (c) 2009-2018 Sean Corfield and is made available under Attribution-NonCommercial-ShareAlike 4.0 International (CC BY-NC-SA 4.0)" for the documentation, not the software; it covers the documentation only, so it is no license entry for the software, which takes its license from the README and LICENSE. The project links its Google group as http://groups.google.com/group/framework-one/, which redirects to the https address recorded as forum. The docs list the requirements for 4.2 as Adobe ColdFusion 10 or later and Lucee 4.5.0 or later. The documentation page names Adobe ColdFusion and Lucee as the supported engines; no page states that they run on the JVM, so runtime is left out. The documentation says "FW/1 was created in July 2009"; the oldest tag is 2.0alpha dated 2011-08-14 and the oldest tag listing has no 1.x tags, so firstRelease is the tag year. The highest stable GitHub release is v4.3.0 dated 2022-04-18; the README's deploy badge names 4.3.2, and no 4.3.2 release or tag exists in the repository at read time. The last push to the default branch is dated 2024-07-15. The 4.x documentation is labelled "4.3 Documentation (beta)" on the documentation page. The repository is not archived. The CFML Slack channel is a chat link and not a recorded field.
