notes: >
  Monorepo: the repository holds many packages and about 9,600 release entries. The install docs name @yamada-ui/react, so the React package's releases are used: the highest stable is 2.3.0 (published 2026-10-28), and the oldest is 0.1.0 (2023-06-03), which is also the oldest in the repository. The GitHub repository description says "built with React and Emotion", the only project statement of a parent, and basedOn is recorded from it; the React peer dependency (react >=19) and the docs' "compatible with React 19" are dependency and compatibility statements, not basedOn. The docs name framework guides for Next.js, Vite, React Router, TanStack Start and TanStack Router, which are not parents. The CLI install route is in the docs with the placeholder package "@workspaces/ui"; the CLI route is recorded from its command. The homepage lists Discord and X links; the X account is the author's personal one. The author profile shows a location of Tokyo, Japan; that is a personal profile, not a company's headquarters, so hqCountry is unknown. The README gives the license as "MIT © Hirotomo Yamada". The npm author field gives the same name with a company email domain; no legal form was found. Figures: the weekly npm downloads are the sum of the seven days of the period 2026-10-19 to 2026-10-25. The HTTP Archive has no Yamada UI entry.
