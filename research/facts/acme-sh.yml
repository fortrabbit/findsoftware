notes: >
  The homepage at acme.sh is run by ZeroSSL: its title is "acme.sh - Free ACME Client Sponsored by ZeroSSL", it says "sponsored and maintained by ZeroSSL since 2021", and its navigation sells ZeroSSL certificates, a Management Console, a REST API and Enterprise SSL. The project's wiki and README are the open-source source of truth; the ZeroSSL products (Management Console, REST API, paid certificates) are paid CA services and not a hosted acme.sh, so no hostedOffering is recorded. The default certificate authority is ZeroSSL, and the README also lists Let's Encrypt, SSL.com, Google Public CA, Actalis and any RFC 8555 CA; those are not hostedOffering facts. The license is GPL-3.0 as GitHub reports it and as LICENSE.md reads (GNU GPL version 3, no "or later" wording was found); no other license statement exists. The language is Shell per GitHub; the import has no mapping for Shell, so the record gets no language value; runtime has no value for POSIX sh and is left out. The runtime needs a POSIX shell with curl or wget; the README tested list includes BSDs, macOS, Solaris and OpenWRT. The homepage claims support for 180+ DNS providers for DNS validation; it is a count the homepage states, recorded here only. The README calls the project "Docker ready" and links the Docker Hub image neilpang/acme.sh, which has 29,684,253 pulls on Docker Hub as of 2026-10-28; the install docs (the Docker guide) name ghcr.io/acmesh-official/acme.sh, a GitHub Container Registry image with no pull count, so no dockerPulls value is recorded. The GitHub API lists 50 releases; the oldest is 1.2.2 (2016-04-06) and the repository was created 2015-12-26. Release tags from 3.1.6 on are signed with the maintainer's SSH key, per the README. The README links a personal account of the original author (Neil Pang); it is not recorded as x. The acme.sh homepage footer links the Imprint at zerossl.com/legal/imprint, which names ZeroSSL GmbH, the basis for the maintainer. The README also lists a Gitter lobby (gitter.im/acme-sh/Lobby) and an OpenCollective page; neither has a field. The sponsor is recorded as maintainer per the homepage's wording; the GitHub organization is acmesh-official.
