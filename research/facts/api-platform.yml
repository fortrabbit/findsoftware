notes: >
  The repository is api-platform/core, the library that the install docs name as composer require api. The distribution repository api-platform/api-platform (a skeleton with release tags v10.x) is not recorded as a source, and the core's latest release is v5.0.4. The homepage states "Sponsored by Les-Tilleuls.coop" and an "Enterprise subscription" link; the sponsor is not recorded as parent, and the subscription is support, not an edition. The docs describe a separate API Platform for Laravel integration, which is not a second record here, so basedOn names Symfony only. The Symfony distribution is installed by the CLI and includes Doctrine ORM; MongoDB and Elasticsearch can be enabled, so databases is left unknown. The docs site states the documentation is under CC by 3.0, which is not a field. The repository created_at is 2015-01-19, which is not a first release, so firstRelease stays unknown.
