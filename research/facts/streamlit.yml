notes: >
  The homepage streamlit.io answers over https and its footer reads "© 2026 Snowflake Inc.", and the homepage says "Snowflake powered" and offers "Try Streamlit in Snowflake", and the privacy policy page states that Streamlit is owned by Snowflake, which is the basis for parent and maintainer. The GitHub repository was created in 2019 but the PyPI project has uploads from 0.1 on 2018-03-20, which is the earliest registry upload and is recorded as firstRelease; no GitHub release predates 0.73.0 (2020-12-22), so the GitHub releases do not decide the year. The GitHub releases list is the source for currentMajor (1.66.1 is the highest stable release) and latestReleaseDate (1.66.1, 2026-10-21); the PyPI JSON reports 1.66.1 as its version. The PyPI JSON gives downloads as -1, so pypiDownloads is the last_month figure of the pypistats API. The install page offers pip, Anaconda, GitHub Codespaces and Snowflake; the README gives pip only, and the install docs are not quoted here. The architecture page is a concept page rather than an install page and is the source for renderingModes and runsAs. The Community Cloud is cited to the deploy page, and the x link is the homepage footer's Twitter/X link. Streamlit in Snowflake is a hosted product of the same vendor and is recorded as hostedOffering next to the open source part; no prices are recorded. The "Live editing" bullet in the README means saved script changes reload the app, not unsaved edits, so livePreview is left out.
