notes: >
  Rename: the gem README says "RubyUI (former PhlexUI)"; the record follows the current name, and the old name is not a separate record. The project's own README says "This is NOT a component library. It's a collection of re-usable components", while the gemspec summary calls it "a UI Component Library"; categories follow the README wording (copy-paste), reviewer to confirm. Installation: the gem is installed with bundle add, then rails g ruby_ui:install and the ruby_ui:component generators copy the component code into the app; the docs call the setup a Rails app install and name Phlex Rails as the manual dependency. A Rails statement names the target app, not a parent, so Rails is not recorded as basedOn; no page states the runtime model of a running site, so runsAs is not recorded. The repository's own license API field is null because the license file sits in gem/; the gemspec at the v1.6.0 tag and gem/LICENSE.txt both say MIT, and the gem README links to shadcn/ui's MIT license file. The wordings agree, so one entry. The GitHub repository's latest release is v1.6.0; the gem version matches. firstRelease is from the earliest RubyGems upload, 1.0.0.pre.alpha.4 on 2024-10-22, a prerelease; the first stable release is v1.0.0 on 2025-03-31 (GitHub). The RubyGems figure is the all-time total download count of the ruby_ui gem, not a period count; the docs and the gem README name no npm package. The docs introduction says the components are "heavily inspired by shadcn/ui"; that is a design influence, not basedOn. The ecosyste.ms counts are 0 for both dependent packages and repositories. No Discord invite appears on the readable pages (the nav entry is a script-rendered link), so discord is not recorded. httpArchiveSites: the HTTP Archive list has no RubyUI entry. The docs say the app is expected to use TailwindCSS 4 and Stimulus; that is a requirement, recorded only in the basedOn statement.
