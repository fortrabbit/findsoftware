notes: >
  Boundary on inclusion criterion 4: the latest stable release, 1.6.1, is from 2024-08-30, older than 24 months on the check date, and the default branch was last pushed 2025-10-20. PyPI carries 2.0.dev1 to 2.0.dev6 pre-releases (2026-08 to 2026-09) under the mkdocs name, uploaded with author Kim Christie, no project URLs and the summary "HTTP, for Python.", so it is unclear they are the documentation tool. GitHub discussion #4077 (2026-01-21, by lovelydinosaur) announces a version 2 developed in a private repository with preliminary docs at encode.io/mkdocs; discussion #4088 (2026-03-05) is a community request for comment on who should maintain MkDocs. mkdocs.org shows no notice about 2.0 or maintenance. Whether pre-releases count as a release for criterion 4 is open. starters lists the two built-in themes. pypiDownloads is last-month downloads from pypistats.org, which PyPI's own JSON API no longer reports. maintainerType is absent because "MkDocs Team" names no organization type. Coined field pypiName.
