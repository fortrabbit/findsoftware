notes: >
  The stable line is v2 (tag v2.17.2, GitHub release 2026-02-14); the v3 branch is the default branch and its homepage says "NOTE: Resty v3 is in release candidate", with v3.0.0-rc.4 (2026-09-06) the newest prerelease, so currentMajor is 2 and latestPrereleaseDate is the rc. The v2 module path is github.com/go-resty/resty/v2 and the README names it; the homepage install line for v3 is a prerelease and is not recorded as the install route. The go.mod at v2.17.2 declares go 1.23.0, which gives runtimeMin; the v3 README says "Use go1.23 and above." too. The README "Creator" section names Jeevanandam M. and the homepage footer copyright line uses the same name; no company or country is stated, so no hqCountry is recorded. The documentation and website are released under Apache-2.0 per the README ("Resty [Documentation](https://github.com/go-resty/docs) and website released under Apache-2.0"); that is a separate repository, so it is not a second license entry of the library. The Go module has no download figure. Dependents come from ecosyste.ms for the Go module path of v2. The sponsor links (GitHub Sponsors, PayPal) are not recorded. The README names GitHub Discussions for feedback and usage stories, recorded as forum. Contributors are the last page number of the contributors endpoint with per_page=1.
