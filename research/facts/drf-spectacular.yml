notes: >
  Fork: the README says the code is "a heavily modified fork of the DRF OpenAPI generator" that lives in Django REST framework; that names a module of the parent, not a fork of the project, so forkOf stays empty. Sidecar: the optional drf-spectacular-sidecar package ships Swagger UI and Redoc static files for environments without CDN access; it is a separate package and is not recorded. Maintainer: the LICENSE copyright lines name T. Franzel (2021-present) and, for 2019-2021, T. Franzel together with Cashlink Technologies GmbH; the current line gives the maintainer, and the GmbH is a separate legal entity recorded here only. Python: pyproject.toml at tag 0.30.0 sets requires-python >=3.8 and the README states Python >= 3.8. The project states it stays below 1.x.x on purpose (release management section). Django and DRF versions tested are listed in the README requirements and are not recorded. Versions: the latest stable GitHub release is 0.30.0 (2026-07-06), tagged in the repository; PyPI shows the same version. PyPI license metadata is empty, so the license comes from the repository. Downloads: pypistats recent last_month figure; ecosyste.ms counts are for the pypi.org registry.
