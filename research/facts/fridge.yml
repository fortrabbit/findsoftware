notes: >
  The homepage and docs describe a hosted content application that serves a RESTful content API; the docs name API Libraries, Integrations, Webhooks, Static Sites and an API Reference, and the static site page was not read for this record. The homepage pricing section lists a free plan with one Fridge and five content types, a 30-day trial and paid tiers; no prices are recorded, and freeTier is left out because the free plan is labeled a 30-day trial. The terms name the State of Michigan as the governing law; that is not the company seat, so hqCountry is unknown. No legal entity name is stated on the pages read, so the maintainer is recorded as the product name. The homepage links to a GitHub organization fridge-cms that holds API client libraries (fridge_api.php, fridge_api.js, fridge_api.rb), a Jekyll helper and a Next.js helper; the server software is not in those repositories by their names, so no repository is recorded. The homepage states that Fridge is for any kind of content, not only websites, and the features list includes an interface that can be customized. The docs for the API reference were not read in full, so headlessApi rests on the homepage statement. The homepage describes webhooks on content changes and the docs a Jekyll build image for static sites; the starter list has no webhooks field, so they are noted here only. The newest blog post is from 2018 and the GitHub organization shows pushes into 2023; no end statement was found.
