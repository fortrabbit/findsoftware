notes: >
  avored.com now sells a separate hosted product (Avored SaaS) and is not this project, so no homepage is recorded; the README's avored.com links are not used as sources. The repository avored/laravel-ecommerce holds the frontend application; its README installs the backend into a Laravel app with composer require avored/framework, the package that holds the backend code. avored/framework gets no record of its own: it is the core package of this record, so packagistName, packagistDownloads, currentMajor, latestReleaseDate, runtimeMin and license come from it. The older Packagist package avored/laravel-ecommerce (10151 total downloads on 2026-10-20, last stable 2021) is the earlier full application and is no longer what the README installs. GitHub reports the repository language as TypeScript and no license (license null). Neither repository is archived and neither Packagist package is abandoned; the README states no end, so no end signal applies. The README does not name a maintainer, so maintainer is unknown. Packagist downloads are the total since first publication.
