notes: >
  The monorepo's install page names the radix-ui package as the recommended route, and its own npm figures are recorded: radix-ui latest 1.8.1, published 2026-10-12, and 12197667 downloads in the week 2026-10-19 to 2026-10-25. The package re-exports the individual @radix-ui/react-* packages, which are not recorded separately. The repository has no GitHub releases and one tag, 1.6.7, so currentMajor and latestReleaseDate come from the registry. The releases page of the project lists per-primitive changelog entries and is not used for dates. firstRelease is 2020 from the first npm version of @radix-ui/react-dialog (0.0.1, 2020-12-15); the repository was created 2020-06-19. The homepage's visible tag list (v1.2.0-beta tags) is not a source for any field. The httpArchiveSites figure is the mobile origin count of the HTTP Archive technology named "Radix UI", which the list describes as a React component library; its detection markers are the CSS variables and data attributes the primitives emit (checked in the HTTP Archive Wappalyzer rules), so the figure is kept for the primitives; Radix Themes sites are built on the primitives and may carry the same markers. The Bluesky and Twitter links are on the intro page; the twitter.com URL is the one the page gives for X. The LICENSE copyright line names WorkOS (2022) and the homepage says "Made by WorkOS". Contributors counts contributor accounts from the API list with per_page=1, read from the Link header (last page 116). Radix Themes and Radix Icons are separate records.
