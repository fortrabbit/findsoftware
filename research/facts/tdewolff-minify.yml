notes: >
  The homepage go.tacodewolff.nl/minify is the author's online demo of the minifier, which names github.com/tdewolff/minify as its source; no separate project site exists, so the demo is recorded as the homepage. The demo page shows "v2.24.13" as the version it runs, which is stale and not recorded. The Go module github.com/tdewolff/minify/v2 has no download figure. The Go library is the record, so no registry figure is recorded. The JavaScript binding @tdewolff/minify (189 npm downloads for 2026-09-28 to 2026-10-04) and the Python binding tdewolff-minify (8134 pypistats downloads in the last week on 2026-10-28) are separate packages and their figures stay here. The root README's install guidance states "Go (1.18 or higher)", which the go.mod at tag v2.24.24 contradicts with "go 1.26.0"; runtimeMin follows the manifest. The highest stable GitHub release is v2.24.24 (2026-10-26); the major is 2. The first GitHub release is v1.0.0 (2015-09-12), in the same repository. The root README says a user can add new minifier implementations for other media types. The middleware selects the minifier from the Content-Type header or, when that is empty, the request's file extension, and the README says results should preferably be cached. The root README says the library can redirect a media type to an external command such as ClosureCompiler or UglifyCSS. The middleware section describes on-the-fly minification inside a Go HTTP server; no page states that as a runtime, so it is not recorded as runsAs. The .NET port named in the README is a third-party project and is not recorded. The maintainer is the author named in the LICENSE copyright line; the GitHub profile lists no company, so no hqCountry is recorded.
