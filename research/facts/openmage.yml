notes: >
  The composer.json at v20.18.0 is the source for the PHP range; the Packagist p2 feed also lists a 21.0.0-beta2 release, which is a beta and is not the current major. The Packagist package is the one the install page names (openmage/magento-lts). The project describes itself as an unofficial community project in the README, and the supported-versions page says the branch is "Based on Magento Version 1.9.4.5". Magento 1 is not a dataset record; basedOn and forkOf name it as a text value. The homepage claims 100 000 online active Magento installations; this is the project's own figure and is not recorded. The license is stated two ways: the GitHub API reports OSL-3.0 and the README lists OSL v3.0 and AFL v3.0 together, with composer.json listing both; both are recorded. The docs site is built from the docs directory of the main repository, which holds the requirements page read here; the headless API and multistore facts were not read. The composer install page says the v19 release was supported until April 4, 2025. endoflife.date has no openmage entry.
  The README welcomes community pull requests with bug fixes and security patches, and the about page says a pull request is reviewed by two community members before it goes live.
