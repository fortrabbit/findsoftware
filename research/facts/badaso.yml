notes: >
  Packagist lists uasoft-indonesia/badaso as abandoned with replacement badaso/core. The repository, the 2.9.13 release and the install docs (badaso/starter, a skeleton, so the core package is recorded) are the same project, so this is a move and status stays accepted. The main branch composer.json names 3.0.0-alpha; currentMajor follows the latest stable release, 2.9.13. License stated two ways: the LICENSE file on main and GitHub say MIT (Copyright (c) 2021 Uasoft), while composer.json at 2.9.13 says proprietary; both are recorded. Runtime: the installation docs prerequisite page (copyright 2023) states PHP 8.x for v2.x and no minor version, so runtimeMin is absent. The same page lists Laravel 8.x and 9.x for v2.x; not recorded because it predates the 2.9.13 release. The docs Deployment page returned 404 at the path tried, so runsAs is absent. Maintainer "Uasoft" is as the docs and GitHub organization name it; the Uasoft site (soft.uatech.co.id) states it is an Indonesian agency and part of Uatech Group. The README's "Modern PWA Dashboard" line describes the admin dashboard, so renderingModes stays unknown. The docs repository uasoft-indonesia/badaso-documentation is archived; it is not the project's source, so it is not a status signal.
