notes: >
  The README and the homepage state Python 3.6+ in their code samples and text; the registry states requires_python >=3.7 for the latest release; both are recorded as runtimeMin entries. basedOn is not recorded: the pages say the framework builds APIs "with Django" and has "good integration with the Django core and ORM", which is not a statement of what it is built on. The README says "Used by multiple companies on live projects" with no figure, so no adoption figure is recorded. The maintainer is the copyright holder named in the LICENSE file; no other legal notice was found. The PyPI registry shows no license field; the classifier and the LICENSE file both give MIT. firstRelease is the oldest PyPI upload (0.1.0, 2019), older than the first GitHub release (v0.9.3, 2020).
