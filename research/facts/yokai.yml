notes: >
  Monorepo: the repository publishes each module under its own tag (fxcore/v1.17.0, worker/v1.4.0, fxsql/v1.5.1 and so on) and has no root version tag. The framework core is the fxcore module, the one the module docs describe as the core; its tags and proxy record are used for firstRelease, currentMajor and latestReleaseDate. Its highest stable tag is fxcore/v1.17.0, published 2026-10-13; its first is fxcore/v1.0.0, uploaded to the Go proxy 2024-01-12. The README badge says Go 1.20 or later while fxcore/go.mod at the release tag says go 1.26.0; the go.mod line is recorded as runtimeMin and the badge is not, since it is out of date with the module. The README and docs describe the stack as built with Echo, gRPC-go, Viper, OpenTelemetry and Fx; none is stated as a parent, so basedOn is not recorded. The docs name the fxorm database driver list (sqlite, mysql, postgres, sqlserver), recorded as databases with each name's own quote. The HTTP server module renders HTML templates from a configured path, recorded as templating and server rendering. The docs also present an MCP server and a gRPC server application alongside the HTTP one; these are not recorded as fields. The docs' Dockerfile for production is described only as part of the application template; no docker field is recorded. The Go proxy record gives no download figure, so none is recorded. The Ankorstore legal notice pages checked returned 404, so the maintainer is recorded as the LICENSE copyright names it, without a legal form or hqCountry. The fxsql/v1.5.1 tag is newer than the core tag and is a different module, so it does not move latestReleaseDate.
