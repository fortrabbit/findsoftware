notes: >
  The highest stable release is v26.2.0 (2026-03-20), a calendar version, so currentMajor is not recorded; the line is 26.2. The oldest GitHub release is v0.1.1-sandbox+oryOS.1 (2018-11-13, prerelease), so firstRelease is 2018. The repository's LICENSE file names no copyright holder; the maintainer and hqCountry come from the Ory privacy policy, which names Ory Corp as the controller with its Scottsdale, Arizona office. The OSS install guide at https://www.ory.com/docs/oss/keto/install gives the install routes; the docs URL https://www.ory.com/docs/keto redirects to the Ory Network pages, so the OSS install guide is cited directly. The Enterprise License build is distributed only from a private Docker registry and has its own install page at https://www.ory.com/docs/oel/keto/install; it is recorded as paidEdition, not as an install route. The OSS install guide says the APIs of Ory open-source servers have no integrated access control and recommends Ory Oathkeeper or an API gateway in front of them. The ecosystem sections name Kratos, Hydra, Oathkeeper and Keto as companion servers; no relationship field is recorded. Homepage social links: X at https://x.com/orycorp; YouTube is recorded as youtube; LinkedIn (https://www.linkedin.com/company/ory-corp) has no field and is not recorded. The README's Discussions link is recorded as forum and its newsletter link as newsletter; the Ory Community Slack has no field. The contributors count is the last page number of the contributors endpoint with per_page=1. The go build from source needs Go 1.17 or later; a build requirement for software shipped as a binary, so runtimeMin is not recorded. The README says the Ory Permission Language defines the access control policies, and the API overview says all APIs are available to gRPC and REST clients; gRPC has no field.
