notes: >
  Doubt: the repository holds documentation for a file convention and no installable package, so criterion 2 cannot be judged; the setup page lists bundlers and frameworks that support the convention (Webpack's css-loader, Vite through Lightning CSS, PostCSS through postcss-modules and others) and gives no install step for this repository. Settling it needs a decision on whether a specification repository that no project installs is a candidate at all; a reviewer should decide that before any fact moves. The repository has no GitHub release or tag and no LICENSE file in its root listing, so no license and no firstRelease are recorded. The npm package named css-modules (0.3.0) is a different project and is not used. The repository has no homepage, so the docs link is the repository's own docs folder. The owner is the css-modules GitHub organization, the only name the repository gives as maintainer.
  The README defines a CSS Module as a CSS file where all class names and animation names are scoped locally by default, says such files compile to a low-level interchange format called ICSS, and says importing one from a JavaScript module exports an object that maps local names to global names. The repository description reads "Documentation about css-modules".
