notes: >
  The highest stable GitHub release is 0.12 (2025-12-07), so currentMajor is 0. The releases list also holds untagged entries from 2019, which are not version releases and do not set firstRelease; the first tagged release is 0.8.0 (2019-03-17). The README and the getting-started page name no minimum Go version, so runtimeMin is not recorded. The getting-started page says "go get -u" installs the tool; the page also says to download the executable from the releases page, and both are recorded as the install method. The README names the source directories "source/static" and "source/processed" and the target directory "target/", recorded as prose material only. The repository README file is README.MD (upper case), so its URLs use that spelling. The README and the documentation list the features the prose describes: Markdown content converted to HTML, source code highlighting in Markdown, files whose names start with an underscore being fragments that are not copied to the site (get-started page), variables, file includes, components with slots, conditional content, and loops over files and variables.
