notes: >
  Accepted: a Python test utility for mocking the requests library, installed from PyPI, with the README naming pip. No homepage: the repository names none, and PyPI lists the GitHub repository as its homepage. The README note says "Responses requires Python 3.8 or newer, and requests >= 2.30.0"; the requests dependency is a dependency, not a basedOn statement, and the tagline names requests as the library it mocks, which is a mocking relationship, not an extension. A later pass may decide whether a target-library tagline states basedOn requests; none is recorded. The repository owner is the getsentry GitHub organization. The README does not name Sentry, and no page names a legal entity, so no maintainer is recorded from the owner. The maintainer comes from the setup.py author; the Apache LICENSE has no copyright line. The LICENSE file is the Apache License 2.0 text. currentMajor is 0 (0.x releases), with the 0.26 minor line the latest on 2026-08-26. No latestPrereleaseDate: the repository has no prerelease. firstRelease: PyPI lists 0.1.0 uploaded 2013-11-25, and the 0.1.0 tag is dated 2013-11-25 too. pypistats last_month is a rolling 30-day window read on 2026-11-16. The dependent counts come from ecosyste.ms, last synced 2026-11-16. The README's install line is a bare pip command under the Installing heading, recorded as pip with that command as the quote.
