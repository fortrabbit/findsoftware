notes: >
  The homepage (metavert.io/lightcms) and the README disagree on the Go version: the homepage says "Go 1.25", the README prerequisites say "Go 1.24 or later". Neither is recorded as runtimeMin until the go.mod or a single page settles it. The README and the homepage both describe optional outside services: semantic search uses Voyage AI embeddings unless the API key is missing, which falls back to full-text search, and the chat widget streams answers through Claude Haiku and works without an Anthropic key. The embeddings provider can be Ollama ("LIGHTCMS_EMBEDDINGS_PROVIDER=ollama" in the README), so those are not recorded as required. The homepage names a hosted Metavert site running on LightCMS; that is an example, not a hosted offering, and no pricing or hosted plan is stated. The homepage's social links are the author's personal accounts and no software account is named, so no social field is recorded. The homepage's claim that the software was built through conversation with Claude Code is a statement about authorship and is not recorded. The Metavert LLC jurisdiction is not stated on the privacy policy, terms or LICENSE, so no hqCountry is recorded. The GitHub contributors endpoint returns one contributor. Stars and releases come from the API at the date above. The MCP server (128 tools by the homepage) is a feature of the software with no field. The homepage footer social links are the author's personal accounts.
