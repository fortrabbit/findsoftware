notes: >
  The official site teedoc.neucrack.com answers over https with the English index and the quick start page; the site's footer names Neucrack and carries a Chinese ICP filing, which is not recorded as hqCountry. The LICENSE copyright line reads "Copyright (c) 2021 Neucrack" with a contact address, which is not copied. The registry's PyPI page lists the home page as github.com/Neutree/teedoc, while the install docs and the README name github.com/teedoc/teedoc; the teedoc/teedoc repository is recorded as the source. Stated Python requirement: the quick start says teedoc is developed for Python3 and does not state a minimum version, so runtimeMin is not recorded. The newest stable release on PyPI is 1.37.9 (2024-12-24), newer than the last GitHub release v1.37.5 (2024-10-09), so latestReleaseDate follows PyPI as the newest stable release of the package; the GitHub release is the same major. The PyPI JSON reports -1 for downloads, so pypiDownloads comes from pypistats.org. The README says the project is installed with pip, so the install docs name the PyPI package teedoc. The README's features list says the sites use plugins for themes; theme and plugin counts are not recorded. The first GitHub release is v1.23.7 (2021-10-10).
