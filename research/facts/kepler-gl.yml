notes: >
  The homepage https://kepler.gl/ answers 200 but is a JavaScript shell with nothing readable, so no fact comes from it; the repository homepage field (read over the GitHub API) names it and the GitHub-hosted GitBook docs at docs.kepler.gl are the docs. MapLibre GL has no record id here and is named in prose only; deck.gl is recorded as basedOn deck-gl from the README sentence. The README calls the library a React component that uses Redux; it names no Redux record. The Python package keplergl (PyPI) and the Jupyter widget are separate install routes and are not recorded here. The README says that when using kepler.gl as a dependency in your own app, Node 20 or a newer supported LTS is needed, which is recorded as runtime and runtimeMin; the get-started page and the "Env" section about developing the repository are build requirements and are not recorded. The docs site still says "You will need a Mapbox Access Token to use it." while the README says the default basemaps use MapLibre and Mapbox-hosted styles need the mapbox-gl package; the record keeps no hosting fact for it. No sentence in the sources states that it runs in the browser, so no runsAs is recorded. The npm dist-tag latest points to the alpha 3.3.0-alpha.21, while the highest stable GitHub release is v3.2.6 (2026-03-16); currentMajor 3 and latestReleaseDate follow the stable release. The GitHub skill-v0.0.1 release (2026-05-10) is a skill, not a version of this package, and is ignored. The LICENSE copyright line names "contributors to the kepler.gl project", and the npm and PyPI package metadata name an individual author and Uber Technologies, Inc.; those are not the recorded maintainer. The npm package @kepler.gl/components (weekly 9516 for 2026-11-01 to 2026-11-07) is a module of the same monorepo; the record uses the kepler.gl package named by the README's UMD route. Stars and contributors belong to the monorepo.
