notes: >
  The homepage and the docs site answered 429 (rate limit) on every retry in this run, so the homepage is recorded from the npm package's homepage field (api) and the docs from the docs source in the repository (apps/web/content/docs). Re-read the live site before a publish: the homepage's own x and bluesky links are not read; discord and the discussions forum come from the README. The README's first line says "This is a pre-release version - please note that APIs may change before the final release", while the newest GitHub release is flowbite-react@0.12.17 (2026-02-09, not flagged as a prerelease) and the npm latest is 0.12.17; the statement is not an end signal, and currentMajor is 0 for that reason. A reviewer may want it stated on the record. The package is the core of the monorepo, the one the install docs name; create-flowbite-react is a scaffolder whose own release (1.1.2) is not the package recorded. The license page and the LICENSE file both name Bergside Inc. as copyright holder; the npm package has no author field. The maintainer legal form Inc. comes from the copyright line. firstRelease is the npm first upload (0.0.0, 2022-02-28); the oldest GitHub release is 0.4.0 (2023-03-03). Contributors counts contributor accounts from the API list with per_page=1, read from the Link header (128). No paid edition appears on any page read.
