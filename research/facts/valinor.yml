notes: >
  The homepage valinor-php.dev redirects to /latest/, the documentation site, so the final URL is cited. The docs are the MkDocs site the README links as "online documentation"; the getting-started page repeats the composer require line. The alternatives page lists eight packages: spatie/laravel-data is the only one with a fact file (laravel-data), and the others stay here: symfony/serializer, eventsauce/object-hydrator, crell/serde, jms/serializer, netresearch/jsonmapper, json-mapper/json-mapper and brick/json-mapper. The docs name a Symfony bundle (cuyz/valinor-bundle) and a Mezzio package (mezzio/mezzio-valinor) as framework integrations, which are not basedOn statements. The LICENSE copyright line names Romain Canon, the same name as the composer authors list; the GitHub owner CuyZ is an organization, and the record follows the license. The runtime and runtimeMin come from composer.json at the latest release tag 2.7.0, whose php requirement lists the 8.2 to 8.5 ranges. firstRelease is the year of the first GitHub release, 0.1.0 on 2021-11-28, which matches the repository creation. The README says the mapper handles native PHP types and the advanced types PHPStan and Psalm support, such as shaped arrays and generics, reports human-readable errors, and includes a normalization mechanism that turns any input into a data format such as JSON or CSV while keeping its structure. The Packagist download figure is the package total; Packagist publishes the monthly figure too, and it is not recorded. The README credits JetBrains and Blackfire for licenses they provided; these are not sponsorship fields.
