notes: >
  The repository has no GitHub Release; the tag v180.0.1 is the only tag in the repository, and latestReleaseDate is that tag's commit date. The homepage shows "Built with Scroll v180.2.0", a version with no tag in the repository; both give major 180. The FAQ says the project is published to the public domain, recorded as the license statement; the repository LICENSE.md disclaims copyright with a blessing in place of a legal notice and GitHub reports no SPDX id. The maintainer is the publisher the FAQ names; the blog bylines name Breck Yunits as author. The npm package scroll-cli (latest 178.2.3, last published 2025-05-23) exists, but the install docs name the GitHub repository, not npm, so no npm figures are recorded; the npm package named scroll is a different project. The repository created_at is 2019-11-17 and is not a first release, so firstRelease stays unknown. The FAQ and homepage present Scroll as a language as well as a generator; the description keeps both. The homepage links to a Twitter account; the link points to x.com. The GitHub stargazer and contributor counts are as read on 2026-10-22.
