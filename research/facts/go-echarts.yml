notes: >
  The handbook at https://go-echarts.github.io/go-echarts/ is a docsify page whose text loads in the browser, so it was read from its Markdown in the repository at tag v2.7.3: https://raw.githubusercontent.com/go-echarts/go-echarts/v2.7.3/docs/en-us/README.md, with the install, dive-into, render and ecosystem pages in the same folder. The handbook says go-echarts "Provide the generic HTML templates with echarts resources" and "Generate echarts required options and datasets based on go programs"; the README says go-echarts is "built on the top of other open-source projects" without naming Apache ECharts as parent, so basedOn is left empty. The output is HTML written to an io.Writer (rendering target HTML, coined kind, not a field). Stars, contributors and the repository belong to the go-echarts repository (the module is one package in it). The README says the project is developed under v2 and that v1 and v2 are incompatible; the v1.0.0 tag (2020-06-11 commit) is the oldest tag, and firstRelease follows it. The rc tags v2.4.0-rc1 (2024-01-22) and v2.4.0-rc2 (2024-05-20) are older than the latest stable release, so no latestPrereleaseDate is recorded. The maintainer is the LICENSE copyright holder; the repository is owned by the go-echarts organization. The ecosystem page lists templ, GoNB and insyra; they are not recorded. The README's classic GOPATH route is not recorded as an installMethod.
