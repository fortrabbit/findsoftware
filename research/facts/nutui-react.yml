notes: >
  The homepage nutui.jd.com/react is a script shell; its title is read, and the installation guide is read from the docs source in the repository (src/sites/sites-react/doc/docs/react/start-react.en-US.md, branch feat_v4.x). The highest stable GitHub release is v3.1.0, so currentMajor is 3; the v4.0.0-beta tags are betas the GitHub release list does not mark as prereleases, and the npm latest tag is a 4.0.0 beta. The newest npm beta sets latestPrereleaseDate. The repository has no LICENSE file and the GitHub license field is null; the README's MIT statement and the npm license field are the sources. The npm author is jdcfe, recorded as the maintainer; neither the README nor the docs name a legal entity. The README lists server-side rendering as experimental; no page states a rendering mode, so renderingModes is not recorded. The npm weekly figure counts @nutui/nutui-react and is the sum of the daily counts for 2026-10-18 to 2026-10-24. The dependentRepos count of 2 is from ecosyste.ms.
