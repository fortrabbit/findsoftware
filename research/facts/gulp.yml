notes: >
  The npm package and the GitHub latest release both date 5.0.1 to 2025-06-01, the most recent release in the record. The repository was last pushed 2026-02-09; that is recorded as no end signal. The homepage offers "Organization Support" and individual backing through a Donate link; these are sponsorship, not editions. The npm package names "Gulp Team" as author; the LICENSE copyright line names two individuals, and the homepage names no legal entity. The engines field declares ">=10.13.0", recorded as the major 10.
  The quick-start installs gulp-cli globally, then runs gulp from a gulpfile.js in the project root. The homepage describes community-built plugins as building blocks, each doing one small job.
