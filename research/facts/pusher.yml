notes: >
  Hosted-service record for Pusher Channels, the hosted pub/sub API; the Pusher Beams push notification API is a separate product on the same site and is not recorded. No page offers a self-install: the docs cover hosted Channels only, so the status stays hosted-service. The SDK repository pusher/pusher-js, its license, stars and npm figure (pusher-js) are SDK data and are not recorded here. The pusher.com/legal URL serves Bird's terms; the homepage links the MessageBird terms at messagebird.com/legal/terms-and-conditions, the same text. Section 15 of those terms names Bird B.V. for customers outside the USA and MessageBird UK Limited for Push Notifications API services; Channels is not named, so the Bird B.V. row is read as the contracting party for Channels. The Pusher docs footer says "Copyright © 2026 Pusher Ltd." and the security page says "Pusher services are provided by MessageBird UK Ltd."; the three legal names are not reconciled here and need a reviewer decision. The security page states ISO/IEC 27001:2013 certification and says Pusher does not store API data, except Cache Channels values kept in memory for 30 minutes; these are compliance and content-store statements and go to notes. The pricing page lists a Sandbox free plan, paid Startup to Growth Plus plans with monthly prices, and an Enterprise plan with custom pricing; the plans are hosting tiers, so no paidEdition is recorded, and no prices are recorded. The SSO page states the dashboard SSO is available only on Enterprise plans. The docs list SDKs for many languages (for example PHP, Node, Ruby, Java, Go, Python) and client SDKs for JavaScript, iOS, Android, Flutter and React Native; these are sdkLanguages values and go to notes. The homepage shows a Discord and an X link; LinkedIn, YouTube and Twitch links are not recorded fields. The HTTP Archive technology list does not include Pusher, so no httpArchiveSites figure is recorded. The Pusher Channels Protocol is a public protocol the Pusher client libraries speak, and compatible servers exist (Sockudo, Soketi); those records carry their own alternativeTo statements.
