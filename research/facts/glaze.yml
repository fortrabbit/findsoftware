notes: >
  No project website exists beyond the documentation site at josbeir.github.io/glaze, which the README names as its documentation and the homepage of which describes the project; it is recorded as homepage. The repository's CSV homepage was the GitHub URL, which is replaced here. The README says Glaze is built around Djot (php-collective/djot-php), Sugar templates and NEON configuration; these are dependencies named as building blocks, not a parent software, so basedOn is left unknown. The docs describe an optional Vite step for CSS and JS bundling, which needs Node; the docs do not state the Node version, so no Node runtime is recorded. The pages do not state that Glaze runs only on a developer's machine, so only the static output is recorded under runsAs. Packagist downloads are 42 total and 2 monthly, recorded as stated. The repository is 0.x; the latest stable tag is 0.4.0, dated 2026-03-10 on Packagist. The owner's profile location is not recorded because it is a personal detail.
