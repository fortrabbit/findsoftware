notes: >
  Stub: the project's own site kitto.io answers 403 Forbidden over https and its sample dashboard answers 404, so the site does not show the software; a readable kitto.io page or a release after v0.9.2 would settle it. The homepage that GitHub lists, http://kitto.io/dashboards/sample, only redirects to https://kitto.io/, so no homepage is recorded. The repository was last pushed 2020-12-06 and has no archive flag, deprecation or end statement in the README; the newest GitHub release is v0.4.0 (2017), and the highest stable tag is v0.9.2 (2020-12-06), so currentMajor is 0 from the tag. The Hex package kitto is at 0.9.1 while the tag is 0.9.2, and the install docs name the kitto_new archive, which Hex does not carry; the Hex package is recorded as the core package the scaffolder depends on. The README says the framework is written in Elixir with React widgets and that it is heavily inspired by Dashing; neither is a parent, so no basedOn is recorded. The README lists a Gitter chat room, which is not a recorded field. The firstRelease year is the oldest Hex release of the kitto package. The README asset requirements name Node 14.15.1 for building widgets; this is a build requirement, not a runtime of the live server, and is left out of runtime. The wiki systemd unit page shows the server started under systemd with Restart=on-failure, the source for runsAs always-on. The wiki's Distillery page says releases via distillery are supported since version 0.6.0, which is not recorded. The README states a requirement of Erlang/OTP 19 or greater, recorded as OTP 19 under runtimeMin. The LICENSE file is named in the README with the same copyright line; the GitHub license API reports MIT.
