notes: >
  The repository moved from idiotWu/smooth-scrollbar to dolphin-wood/smooth-scrollbar; the npm package.json still names idiotWu, the README demo link idiotwu.github.io/smooth-scrollbar/ redirects with a script to dolphin-wood.github.io, and the homepage recorded is the redirect target. The GitHub repository homepage field names the dolphin-wood page too. The README's Installation section opens with a warning not to use custom scrollbars unless the team knows what it is doing, and links a caveats page; that is no field. The homepage and README describe the plugin as a browser scrollbar; the homepage sentence about momentum scrolling on modern browsers is the runsAs statement; no runtime is stated. The README's Browser Compatibility table (IE 10+, Chrome 22+ and others) is a support list, not recorded. The README Documentation table and the homepage Documentation link point to the docs folder of the repository, which is the docs entry; the forum entry is the GitHub Discussions area the README links for feature requests and FAQ answers. The README's 7.x link points to an older branch that the homepage still links; it is not a current record fact. The "Who's Using It" list names five sites; it is not a count, so reportedInstalls is not recorded. The LICENSE copyright line names Daofeng Wu with the alias Dolphin Wood; the recorded maintainer is the legal name, and the alias is in the line. The latest release is v8.8.4 (2023-06-05), which is also the npm latest; the repository was last pushed on 2023-06-06. Under the four-year rule the import keeps the record listed until 2027-06-05 without a newer release. The npm figure is for the smooth-scrollbar package the README installs, for 2026-11-01 to 2026-11-07. Stars and contributors are for the repository.
