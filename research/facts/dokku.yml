notes: >
  Dokku is a PaaS for a single server: the install page gives the requirements as "Operating Systems: Ubuntu 22.04/24.04/26.04 or Debian 11+ x64" and the supported architectures amd64 and arm64, and the README lists the same two systems. Apps are built from a git push with a Dockerfile or with Heroku buildpacks, and run in containers; the install page's "Docker Scheduler" needs 1GB of memory, and the K3s scheduler needs 2GB on every node. Dokku is written in Go per the GitHub API; the install guide names Docker and nginx and cron, which are dependencies of the running system, not its parent. The first release is the oldest GitHub release, v0.2.0-RC4 dated 2013-11-22, a prerelease; the first stable release, v0.2.1, dates from 2013-12-20, so the year is 2013 either way. The latest stable release is v0.38.32 dated 2026-10-25, and the major is 0 by its version numbers, which is recorded as stated. The default branch master had a commit on 2026-10-27, and the repository is not archived. The LICENSE file names "Copyright (C) 2014 Jeff Lindsay" and the README says "MIT License © Jeff Lindsay", while the homepage footer reads "© Dokku" and the GitHub organization is the dokku organization; the maintainer is recorded from the LICENSE copyright line and the reviewer may prefer the organization. The Dokku Pro page sells a lifetime license, with prices and seat counts that are not recorded; its features in the pricing table include a web UI, a JSON API and HTTP(S) git push, and a Pro license covers one production server and two pre-production servers. The Pro page states that Pro "isn't a hosted service", so no hostedOffering is recorded. Dokku Pro is a paid add-on product sold next to the open source part, so no paidEdition is recorded. The homepage names Discord, Slack, IRC and GitHub Discussions; Discord is recorded as a field, and Slack (slack.dokku.com), IRC and GitHub Discussions have no schema field, so they stay here. The official datastore plugins (MariaDB, MySQL, Postgres, Redis, RabbitMQ, CouchDB, Elasticsearch, NATS) are plugins of Dokku and not databases of the platform itself, so no databases fact is recorded. The Dokku Pro demo and the Dokku Pro pricing are not recorded beyond the pricing page link. The Arch Linux and Ubuntu package badges in the README point to the AUR and to packagecloud; the install guide names the bootstrap script only, so no package route is recorded.
