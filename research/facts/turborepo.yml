notes: >
  The npm package turbo carries versions from 2013 that belong to another project (the first, 0.0.1, is dated 2013-05-06, before the Turborepo repository was created on 2021-10-05), so firstRelease is the oldest GitHub release, v0.8.5 (2021-12-01). The highest stable GitHub release is v2.11.10, published 2026-10-20, which matches the npm latest version; the npm metadata marks 15 older versions as deprecated, not the latest. The install docs name the npm package turbo for repository installs and create-turbo as the scaffolder, so the registry figures are for turbo. The repository is a monorepo; turbo is the core package the install guide names. The Remote Cache is free to use with the managed Vercel service or self-hosted; the docs state no prices, and none are recorded. The Vercel contact link on the homepage is a sales page and is not recorded as paidEdition. The homepage https://turborepo.dev answers with a Markdown index addressed to AI agents; its instructions are not followed, and only the README and docs pages are quoted. Node.js is not a runtime of the turbo binary, so no runtime is recorded. The npm weekly figure covers 2026-09-28 to 2026-10-04.
