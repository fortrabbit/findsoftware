notes: >
  The LICENSE file is LICENSE.txt, and its first line reads "dygraphs is MIT-licenced and fully human-made"; the README reads "available under the MIT licence". Both wordings are one MIT entry. The LICENSE lists many copyright holders and numerous contributors; Dan Vanderkam is the first holder and the npm author, so the maintainer is recorded as him and a reviewer should confirm the choice. The homepage http://dygraphs.com redirects to https://dygraphs.com/, which is recorded. The CDN route is quoted from the README sentence naming UNPKG, jsDelivr and cdnjs; the npm route is quoted from the README sentence "Get dygraphs from NPM:". The firstRelease year is the committer date of tag v1.0.0 (2013-08-13), the oldest tag; the first npm upload is 1.0.1 on 2014-06-23 and the repository was created 2009-11-24. The homepage's footer carries an unfilled imprint placeholder, so no legal name or hqCountry is recorded. The npm figure counts downloads of the dygraphs package. The README names no discord, newsletter or social channel beyond Stack Overflow and the Google Group.
