notes: >
  runsAs is local and static: the README calls Go-Static! a static site generator and `grunt build` generates the output. The homepage field is absent: the repository sets no homepage, and the homepage in package.json (colynb.com/generator-go-static) answers 404. The three GitHub releases (0.1.0 to 0.1.2, 2013) are marked prerelease and there is no stable GitHub release, so currentMajor and latestReleaseDate come from the npm latest tag 0.2.0 (2013-11-17). The wiki linked from the README is the only documentation page; it was checked for reachability only. The README says the project has "just been born and still needs work"; recorded as no end signal. The npm figure is the last full week in the API response.
