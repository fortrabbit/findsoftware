notes: >
  The default branch is master, and the homepage https://python-markdown.github.io/ answers 200 over https. The latest stable release is 3.11.3 (GitHub release and PyPI upload both 2026-11-05, not a prerelease), so currentMajor is 3. The tag's pyproject.toml states requires-python = '>=3.11' and license = "BSD-3-Clause" (license-files LICENSE.md), the same as the PyPI requires_python. The LICENSE.md file lists three copyright lines: The Python Markdown Project for v. 1.7 and later (the maintainer recorded here, as the copyright line names it), Yuri Takhteyev for v. 0.2 to 1.6b, and Manfred Stienstra for the original version; the two earlier holders are authors of past versions and are not recorded as maintainers. PyPI names Manfred Stienstra and Yuri Takhteyev as authors and Isaac Muse as maintainer; those names are not recorded as maintainer for the same reason. firstRelease is 2008: the oldest tag 1.7_Final is committed 2008-02-18, the same day as the oldest PyPI upload (1.7), and the repository was created in 2010. The README and homepage describe the project as an implementation of John Gruber's Markdown, the reference implementation; no record exists for it, so no basedOn is recorded. The homepage's goals say the library is suited to web server environments; a library has no runsAs, so that statement is in notes only. The Extensions pages list extensions bundled in the package (abbreviations, tables, footnotes and others), not a third-party plugin directory, so pluginDirectory is not recorded. The homepage says the project is not a CommonMark implementation and is not trying to be, and that it has a public Extension API for writing own extensions; the command line page says the project is primarily a Python library with a command line script included (python -m markdown), which is not recorded as runsAs because the library is the product. The homepage Support section points to the GitHub bug tracker, which is not a forum. The install page gives a second route, pip from the Git repository, recorded as its own installMethod with the command as the quote. The pypistats figure is last_month as read on 2026-11-16; ecosyste.ms counts are for the markdown PyPI package. The contributors count is the page number of the rel="last" link on the authenticated contributors endpoint with per_page=1 (169).
