notes: >
  The homepage crudbooster.com now answers with a domain sale page (HugeDomains, "CrudBooster.com is for sale"), so no homepage is recorded, as in bowman. The project's own site named the repository github.com/crocodic-studio/crudbooster, which is archived and read-only since 2025-02-09; the Packagist package crocodicstudio/crudbooster is flagged abandoned with no replacement. Both are end signals, so status is discontinued. A reviewer may decide stub instead, since the project's own site no longer shows the software. The repository README says "v5.x is no longer supported, move to v7.x"; no v7 release, repository or package exists in the crocodic-studio organization or on Packagist, so no successor is recorded. The highest stable GitHub release is v5.6.2 (2021-07-07), which matches the Packagist stable tags; the v6.0-beta.1 tag is a prerelease and Packagist flags it abandoned. The repository holds only README.md, so sourcePublic is false. The documentation repository crocodic-studio/crudbooster-doc has 6_0 pages whose installation page names PHP 7.2 and Laravel 5.7 and a 6.0-beta.1 install; those are the docs for the beta, not the latest stable release, so runtimeMin uses the composer.json requirement of v5.6.2. The license, language and databases come from composer.json and the installation page at the v5.6.2 tag, whose docs folder names PHP 7.2 where composer.json requires ^7.4. The Packagist author is an individual (Ferry), recorded only through the organization name Crocodic Studio, which the GitHub organization API gives as the name. The organization's own profile gives Semarang as location and crocodic.com as blog; no legal notice was found, so hqCountry is unknown.
