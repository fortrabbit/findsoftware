notes: >
  The homepage's meta description and visible text give the same statement; the quote is the visible text. The book's Your First App page installs Trunk as the recommended build tool and then runs cargo add sycamore; Trunk is named in the install page and not recorded as a fact field. The Deploy cookbook page is a stub in the docs source and names no hosting target, so runsAs is not recorded. The book's server-side rendering pages and the homepage's SSR line describe rendering support of a UI library, which is compatibility, so no renderingModes is recorded. The README names the Solid, Leptos and Dioxus projects as alternatives; these are the project's own statements of alternatives, not a factual relationship, and are not recorded. The crates.io figure is recent_downloads, the 90-day count, so the period is part of the value; the all-time total of the crate is 317529 and is not recorded, following the leptos record. The crate's versions carry MIT. The major is 0 because the latest stable release is 0.9.4. The runtimeMin is the rust_version of the latest release on crates.io, which the root Cargo.toml of tag 0.9.4 also states. The GitHub release list holds the stable tags from 2021 onward; the earliest crate upload is a 0.5.0 beta in 2021. The CSV gave the category ui-library, and the homepage's own words are a web UI library. The npm and other registries do not apply.
