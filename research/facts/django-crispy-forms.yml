notes: >
  The homepage in the candidates row is http://django-crispy-forms.rtfd.org, which redirects to https://django-crispy-forms.readthedocs.io/en/latest/; the https rtfd.org address returns 404, so the docs address is recorded as the homepage. The repository is django-crispy-forms/django-crispy-forms; GitHub has the 2.7 release (2026-07-29), which sets currentMajor, latestReleaseDate and the PyPI figure is the same package. The first PyPI upload is dated 2011-11-02, the repository was created 2011-11-01, and firstRelease is 2011. The install page says the core ships no static files: template packs (Bootstrap 2, 3, 4, Tailwind, Bulma, Foundation and crispy-bootstrap5 for Bootstrap 5) are separate packages. The README says django-crispy-forms is the new django-uni-form, a predecessor with no candidate row; successorOf is left out until that row exists. The README's maintainer line names Miguel Araujo as lead developer; LICENSE names Miguel Araujo and Daniel Feldroy. basedOn comes from the project's tagline "Best way to have Django DRY forms" in pyproject.toml and the README's "The best way to have Django DRY forms", not from the INSTALLED_APPS step. The maintainer follows the LICENSE copyright line; the README's lead developer line names Miguel Araujo. The README and docs state Django 5.2 or newer; no Django version is recorded as a field.
  The README says the application "mainly provides" a |crispy filter and a {% crispy %} tag, that it helps "Build programmatic reusable layouts out of components" and renders "div based forms" with "full control of the rendered HTML without writing HTML in templates". Frameworks named as template packs in the README are Bootstrap, Tailwind, Bulma and Foundation; Bootstrap 5 support is in the separate crispy-bootstrap5 package.
