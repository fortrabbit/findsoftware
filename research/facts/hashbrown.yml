notes: >
  Stub: the candidate's homepage hashbrowncms.org now redirects to www.nav-links.com, which answers 502 through Cloudflare, so the project's own site no longer shows the software; a later pass should check whether the site returns or a successor is named, and then the homepage can be recorded. The repository's last commit on the stable branch is 2022-06-27 and its latest release v1.4.6 is 2021-07-14, so the import will move this record to stub on the release age rule as well; no archive flag or end statement was found. The stable branch is the default branch. The README gives the install steps (git clone and npm install, and Docker images), so criterion 3 is met from the README; it lists Node.js, MongoDB and ImageMagick as dependencies. The homepage address redirects to unrelated domains (wilhelmaerospace.org, then nav-links.com, which answers 502), and the repository's homepage field still names hashbrowncms.org. The LICENSE copyright lines name Jeppe Zapp (2015-2019) and the HashBrown CMS contributors (2017-2019). The stable branch README says the Docker images are the easiest route and points to the wiki for guides; the wiki Configuration page lists the MongoDB connection settings (environment variables and database.cfg), which is the source for contentStore; the other wiki pages were not read. The GitHub repository description and the candidate row both give the category headless-cms; the README uses the same words.
