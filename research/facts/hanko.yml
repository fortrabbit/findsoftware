notes: >
  Accepted: the backend is an authentication API an app calls, and hanko-elements (npm package @teamhanko/hanko-elements, MIT, installed by npm or a CDN script tag) is the web-component layer an app embeds. The license is stated three ways in the root README (AGPL-3.0 for the backend, MIT for elements and the frontend SDK, a non-copyleft commercial license on request); each is its own entry. The root README labels SAML "Enterprise SSO" and the Cloud pricing lists SAML per connection, but the backend README lists SAML as an API feature; no paidEdition is recorded for the self-hosted server, and the commercial license and private cloud options name no feature set. The homepage quote is from the visible product section. No runtimeMin is recorded: the go.mod Go line is a build requirement, and the install routes are the Docker image and pre-built binaries. The README feature table lists organizations, roles and permissions as in progress, while the backend README documents organization and role endpoints of the Admin API. dockerPulls is not recorded: the install docs name ghcr.io. The imprint and about paths on hanko.io answer 404, so the legal entity comes from the privacy policy. The first release is v0.1.0 (commit 2022-07-08). The cloud is hosted only in AWS Frankfurt per the pricing FAQ, held as regions. The LinkedIn link on the homepage is not a field here. The backend's API is described as HTTP; the record does not claim REST.
