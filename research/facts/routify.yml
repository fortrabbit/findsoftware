notes: >
  The documentation pages of routify.dev are read from the live site. The npm package named routify (version 2.0.1, GPL-3.0-or-later, repository mobily-enterprises/routify) is a different project and is not used for any figure. The install command is npm init routify@latest from the README, which creates a project; the manual installation page imports from @roxi/routify, so npmName and the registry figures use @roxi/routify. The highest stable GitHub release is v3.6.4, which matches npm latest for @roxi/routify. The v2.18.19 tag is flagged as a prerelease on GitHub but is the npm release-v2 line, so no latestPrereleaseDate is recorded. The LICENSE.md copyright line names "Team Routify" with no legal form; maintainer is recorded as stated. firstRelease is the npm created time of @roxi/routify. The homepage lists "Easy route management through meta and file-based routing". renderingStatus is coined here: the render modes page marks SSR and SSG as experimental. runtime is not recorded because no page states the Node.js requirement.
