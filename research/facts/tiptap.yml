notes: >
  The legal notice names Tiptap GmbH with a Berlin, Germany address, which is the source for maintainer and hqCountry; the homepage names it only in JSON-LD. runsAs is browser only: the cited React install page runs a dev server and shows no static deployment. The open-source core is MIT; the homepage names paid features (collaboration, AI agents) and a separate pro license page exists at tiptap.dev/pro-license, which this file does not cite for a field. The npm package entry is @tiptap/core; @tiptap/react, the most common framework binding, had 11,348,991 downloads in the same week and is not recorded as a second npmName. frameworkIntegrations is a coined field: the install section's navigation lists these integrations, and the list is not a claim about which versions each supports. firstRelease is the npm creation date of @tiptap/core; the repository was created in 2018.
