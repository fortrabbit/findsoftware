notes: >
  The repository has no homepage and no GitHub releases or tags. The gem ace (RubyGems, 0.4.9 released 2013-04-27, oldest version 2011) is the release record and names the same repository as its homepage, so latestReleaseDate and currentMajor come from RubyGems. The repository is archived, which is the signal behind status discontinued; the last commit on master is dated 2017-01-21, and the GitHub Pages address botanicus.github.io/ace answers 404. The README links a blog post (blog.101ideas.cz) for more information; that is an article, not a project site, so it is not recorded as homepage. The maintainer is recorded as the LICENSE copyright line states it; the GitHub profile carries a different display name, which is not recorded. The gemspec long description is empty ("TODO: long description"), so the description is taken from the README and the GitHub description. The lastCommitDate is not recorded because the project has a registry release.
