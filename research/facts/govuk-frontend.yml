notes: >
  The get-started page is archived and points to the npm installation page, which was read. Node.js is required by the Nunjucks macros ("To use Nunjucks, your application and any frameworks that support your application must use Node.js") but no runtime fact is recorded for the package itself, which is CSS and browser JavaScript. The install page states "GOV.UK Frontend requires Node.js version 12.17.0 or later to support ECMAScript (ES) modules", while the npm manifest of the latest release declares engines node >= 4.2.0; no runtimeMin is recorded, because the Node lines concern the Nunjucks macros and the build tooling of a front-end package. Maintainer is the copyright holder in the LICENSE, Crown Copyright (Government Digital Service); the GitHub organization alphagov is the same body and its profile location is London, but no legal or imprint page was read, so hqCountry is unknown. The homepage footer states that content is under the Open Government Licence v3.0 while the code is MIT; both are recorded as separate license entries. Browser grades are on the browser-support page; runsAs is not recorded because no page states the JavaScript runs in the browser. Contributors counted from the contributors endpoint per_page=1 last page, without anonymous contributors. The first GitHub release is v0.0.24-alpha dated 2018-03-01.
