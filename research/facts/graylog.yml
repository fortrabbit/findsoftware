notes: >
  Accepted: the boundary question is settled by the project's own docs, which describe listener inputs (GELF, Raw HTTP, Syslog) that an application pushes log data to, so the record is an ingestion endpoint an app sends to. The homepage is not recorded because www.graylog.org answers 403 to every request, and the HQ is unread for the same reason; the maintainer name comes from the footer of the documentation site, and the repository README links the same website. GitHub reports the license as NOASSERTION; the LICENSE file is SSPL version 1. The tarball install is the route the project does not recommend. The Enterprise image is graylog/graylog-enterprise and is not counted in dockerPulls. No GitHub release objects exist; the newest stable tag is 7.2.1 and its commit date is used as the release date. firstRelease is the oldest tag (0.9, commit 2010-07-30), older than the first Maven Central upload (0.20.0-rc.1-1, 2014-01-23; first stable 0.90.0, 2014-09-23). Maven Central publishes no download figure. The repository README is README.markdown. The listener inputs named above are GELF, Raw HTTP and Syslog inputs in the inputs page.
