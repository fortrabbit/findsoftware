notes: >
  The homepage primefaces.org is recorded from the GitHub homepage field and the README's showcase link. Plain-http www.primefaces.org redirects to https://showcase.primefaces.org/, and that answers a bot challenge (403, "Just a moment"), so the site was not read; the README is the source. The README says PrimeFaces is now open source and maintained by the community, and that PrimeTek no longer offers PrimeFaces PRO to new customers; commercial support now comes from the project lead through neroe.org. No PRO features are listed on a page the fetch could read, so no paidEdition fact is recorded and the PRO edition is left for a reviewer. The GitHub releases list marks v16.0.0-RC2 as not a prerelease; it is skipped as a release candidate, and the highest stable release is v16.0.1 (2026-10-16), so currentMajor is 16. The version table in the README gives Java 11+ for the 16.x line, which is the runtime minimum recorded. The earliest Maven Central upload found in the search index is version 4.0 from 2013-10-02, earlier than the earliest GitHub tag (2015), so firstRelease is 2013; the LICENSE copyright line starts in 2009, which is no release date. The endoflife.date API has no primefaces product (404), so no endoflifeId. Maven Central publishes no download figure, so none is recorded. The Java minimum comes from the v16.0.1 pom.xml (maven.compiler.source 11), which matches the 11+ shown for the 16.x line in the README table. basedOn rests on the GitHub repository description "Ultimate Component Suite for Jakarta Faces", and the README's own opening line places the library in the Jakarta EE ecosystem. The maintainer is recorded as the README states it ("maintained by the community"); the LICENSE copyright holder is PrimeFaces (2009-2026). The Discord and discussions links are README badges, so only the discussions label is quotable. The README calls version 15.x the last javax release and sets a support policy, which is described in the README and not recorded as a field.
