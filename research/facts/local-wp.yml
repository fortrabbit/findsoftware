notes: >
  Desktop application with no public repository; the homepage is the record's only source. Operating systems named on the download choice: Mac Intel, Mac Apple Silicon, Windows, Linux Debian-based and Linux RPM-based. The free status is stated on the download page: "It's free and always will be." The Local Pro tier was made free for everyone on 2021-06-29 per its help page, so there is no current paidEdition. Legal entity WPEngine, Inc. is named in the terms of service and privacy policy; WP Engine's own about page says the company was founded in Austin, TX, which is not recorded as hqCountry because it states founding, not headquarters. The terms state the governing law is Texas. The installer for macOS is served from cdn.localwp.com/stable/latest/mac, which redirects to local-10.2.0-mac.dmg with Last-Modified 2026-10-15; the Windows, Linux and Apple Silicon links use the same pattern. A download was started during this research and stopped; nothing is saved in the repository. The releases page on localwp.com renders no release list in its HTML, so firstRelease is not found. Cloud and hosting products next to Local: "Get Hosting" leads to WP Engine's hosting, a separate product not recorded as hostedOffering; Local Connect, Live Links and cloud backups to Google Drive and Dropbox are features described on the homepage and are only noted. Local targets WordPress sites and includes PHP, Nginx or Apache and MySQL, as its feature pages describe; no basedOn is recorded because Local is not built on WordPress. The homepage's "#1 local WordPress development tool" is a claim with no figure, so no adoption figure is recorded. The terms state "The Software is licensed, not sold" and grant use and unmodified redistribution; the license is recorded as proprietary and the import derives the license model. The forum and X links come from the homepage links without a quote. The current major is taken from the 10.2.0 installer name.
