notes: >
  In doubt: whether Elf is still maintained and where its source lives, because the repository the npm package names (github.com/ngneat/elf) answers 404, the docs site named in the npm README (ngneat.github.io/elf) answers 404, and the ngneat organization lists zero public repositories; a public repository, a published archive notice, or a deprecation on npm would settle it, and the newest npm release is 2.5.1 (2024-02-03). The npm package is installable from the registry, but its README names no install command and no installation page could be read, so criterion 3 cannot be judged from the surviving sources. The npm tarball of 2.5.1 has no LICENSE file; the license field and package.json author name are the only license and maintainer statements, the author being Netanel Basal. The README says Elf "is built on top of RxJS", and the package declares rxjs as a peer dependency (>=7.0.0); the statement is a parent statement, but no RxJS record exists, so basedOn is absent and the parent stays in notes. The npm metadata lists 32 versions starting with 1.0.0-beta.0 on 2021-09-29, which sets firstRelease, and the 2.5.1 release on 2024-02-03 is the newest stable one. The npm weekly figure is the sum of the seven daily counts from 2026-11-01 to 2026-11-07. The README names Angular and React examples on StackBlitz; those are examples, not statements of bindings, and are not recorded. The project's repository, changelogs and docs links in the README are all dead on the GitHub side, so no language, stars, contributors or install route are recorded. The README describes the store as one that uses custom RxJS operators to query the state and pure functions to update it, and lists entities, requests, pagination, persist-state, state history and devtools packages in its changelog list. A GitHub search finds ngneat-archive/elf, an archived copy created 2026-06-07 and described as a verified archive of 2.5.1; the project's own pages do not name it, so it is no source and no end signal. The ngneat.com address redirects to the ngneat GitHub organization, which lists no public repositories.
