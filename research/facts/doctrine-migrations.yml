notes: >
  The Migrations introduction says the project "offers additional functionality on top of the DBAL and ORM", so basedOn is doctrine-dbal; the ORM is optional (the docs have a section on diffing without it) and stays in notes. The stable docs are at the 3.9 path; the latest path answers 404. The project page lists 4.0 and 3.10 as upcoming and 3.9.8 as stable, so currentMajor is 3. firstRelease is 2012 from the oldest Packagist upload (1.0-ALPHA1, 2012-10-05). The Packagist monthly figure on 2026-11-04 was 7215898, not recorded because the field keeps the total. The introduction names Composer and the PHAR download as the two install routes, each its own installMethod. The Migrations docs name no database list of their own; the DBAL record holds the vendor list.
