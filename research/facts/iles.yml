notes: >
  The introduction page states "Project Status: Beta" and "Beta APIs may change on minor releases. Lock the version to avoid breakage." The same page footer reads "Last Updated: March 22, 2022", which is older than the npm and GitHub dates. The README install command uses the next tag: npm lists iles latest 0.10.0 and create-iles latest 0.10.0-beta.1; the registry figures are for the iles package, the core package that the scaffolder names. The repository has no GitHub releases; its latest tag is v0.10.0 and the npm latest date is recorded. The homepage pages.dev title reads "îles" and carries the same project. The introduction page says to use client directives to mark which components are interactive, so the build ships only the JavaScript those need, and that Vue and MDX build the site. The Vue dependency is recorded because the frameworks page states the pages and layouts are Vue components, not because the README names it as a base.
