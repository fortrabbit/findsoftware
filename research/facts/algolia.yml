notes: >
  The record covers the hosted Algolia service. The GitHub repository algolia/algoliasearch-client-javascript (npm algoliasearch, 4.74 million downloads a week in the candidates row) is a client library and is not the service's repository, so no repository, license, stars or npm figure is recorded. Algolia, Inc. (Palo Alto, mailing address for subscribers outside Europe) and Algolia SAS (Paris, for subscribers within Europe) are both named in the terms and privacy policy; the terms name Algolia, Inc. first, so it is recorded as maintainer, and hqCountry is left unknown because the pages give two countries and no headquarters statement. The homepage's Discord link is alg.li/discord, which answers with a redirect to discord.gg/ytbZuTQukV (checked 2026-10-28). The pricing page lists Free, Grow, Grow Plus and Elevate plans, recorded without prices; the plans are hosting tiers, so no paidEdition is recorded. The homepage's Crawler and Recommendations products and the Insights API are product features without a field. The homepage and pricing page do not state an installable part, so selfHostOption is unknown. The Algolia docs page for the REST API states the API key and application ID come from the dashboard; no headlessApi value is recorded because the field describes headless CMS APIs. The HTTP Archive technology list tracks Algolia on 21,601 desktop origins and 21,166 mobile origins, and the httpArchiveSites value is the mobile figure. The API methods reference page returned 404 and is not used.
