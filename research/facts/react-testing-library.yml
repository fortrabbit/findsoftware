notes: >
  Status: accepted as its own record, per the wave 65 ruling that framework bindings of a listed library get their own record. The docs say it builds on top of DOM Testing Library (the record id testing-library, a candidate row without a fact file yet); the basedOn entry for it is held back until that record exists. The React basedOn comes from the docs intro sentence. No end statement found: the repository is not archived, the npm latest 16.3.3 is not deprecated, and the last release is 2026-08-27. The GitHub releases list has no prerelease after 16.3.3, so no latestPrereleaseDate. The earliest GitHub release is v0.1.0 on 2018-03-19, the same day as the repository was created. The README says v16 and later need @testing-library/dom installed alongside, a peer dependency; that is an install requirement, so it is in the installMethod quote and no separate field. The Migrate from Enzyme page is a comparison and migration guide for developers moving from Enzyme (record id enzyme), recorded as alternativeTo; it has no import tool, so no importsFrom. The README and docs point questions to Discord and the Stack Overflow tag for the library. The runtime node comes from the engines field of package.json at the v16.3.3 tag, the README's install section says the module is distributed via npm and bundled with node. The repository is a single package. The README's Discord link is for questions about the library. The LICENSE copyright line names Kent C. Dodds; the repository owner is the testing-library organization.
