notes: >
  The record covers the hosted Clerk service; no self-host install is documented, so the status is hosted-service. The open-source SDK repository clerk/javascript (MIT, about 1.8 thousand stars, default branch main, Clerk's own packages), the npm package @clerk/clerk-js (about 552 thousand downloads a week in the candidates row) and the other SDK repositories (clerk-sdk-python, clerk-sdk-java, clerk-sdk-php, clerk-sdk-csharp, all linked from the docs) are client and server libraries, so they go to notes only. The legal name Clerk, Inc. comes from the terms page; the terms are governed by Delaware law, which is no headquarters statement. The homepage names San Francisco, CA only inside a sample session, so hqCountry is unknown. The security page states SOC 2 Type 2 (held since May 2022, report on the Business plan and above), HIPAA with a BAA on the Enterprise plan, and GDPR through the EU-U.S. Data Privacy Framework; these are not recorded as fields. The pricing page lists Free, Pro and Enterprise plans; plan prices are not recorded and no paidEdition is recorded for hosting tiers. The FAQ answers "Is Clerk cheaper than Auth0?" on the pricing page, which is the only comparison named; it is a FAQ question heading, so no alternativeTo is recorded. The pricing page offers a free tier for the first 50,000 monthly retained users and 100 monthly retained organizations; it is noted here because the dictionary has no field for it.
