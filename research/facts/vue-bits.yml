notes: >
  The project has no GitHub release and no tag, so the record is judged by lastCommitDate (2026-10-19, the newest commit on main). The copy-paste route is a registry: jsrepo.config.ts defines the registry @vue-bits and writes a shadcn-compatible registry to public/r, and the Installation page offers the shadcn and jsrepo CLIs over that registry, which is the criterion 2 model. The site vue-bits.dev is a client-rendered app: its HTML carries only the page title, so its pages were not read as text; the Installation and Introduction pages in the repository source stand for the docs. The LICENSE.md and the README both say MIT + Commons Clause, one statement recorded once; the clause allows commercial use in an application, website or product, but not selling, sublicensing or redistributing the components themselves. The npm name vue-bits belongs to another project (99linesofcode, 1.1.1, 2022), so no npm figure is recorded. The README calls Vue Bits the official Vue port of React Bits; it is not recorded as basedOn because the port is not stated as built on React Bits. The README's Tailwind styling is recorded in the Installation page, not as basedOn. firstRelease and currentMajor are unknown without a release.
