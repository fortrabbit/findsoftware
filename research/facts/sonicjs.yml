notes: >
  The README and the repository are published under lane711/sonicjs in the README and on the homepage; that path redirects to SonicJs-Org/sonicjs, which is recorded. The highest stable GitHub release is v2.19.0 (2026-05-29), so currentMajor is 2; the v3.0.0 line is published as betas only (latestPrereleaseDate is v3.0.0-beta.28), and the npm latest tag is 3.0.0-beta.28. Reviewer to decide whether the v3 line counts as the current major under the npm-latest sentence of the major rule. The npm figure is for @sonicjs-cms/core, the core package; create-sonicjs is the scaffolder the install docs name. The README comparison table with Strapi and Payload, the commercial support prices and the homepage version banner are not recorded. The README lists Hono.js under its core framework, which is a dependency statement and not recorded as basedOn. GraphQL is an opt-in plugin per the README, REST is generated from the schema. D1 on Cloudflare and a local SQLite file when self-hosted hold the content. Cloudflare Workers is the default host; the self-hosting page states the Docker and Node.js path, so runsAs records always-on for that path only.
