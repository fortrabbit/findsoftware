notes: >
  The homepage and docs are the GitHub Pages site https://express-validator.github.io, which the README names as its documentation website; the page itself is a Docusaurus shell with no readable text (the docs source is in the repository's docs folder, read there). basedOn express rests on the GitHub description "An express.js middleware for validator.js." and the docs sentence "express-validator is a set of express.js middlewares that wraps the extensive collection of validators and sanitizers offered by validator.js"; the validator.js library is the wrapped dependency and has no record here, so it is not recorded as a parent. The docs note that the package "might work with libraries that aren't express.js" when the HTTP request object resembles express.js; no other framework is named as supported. The README gives Node.js 14 or newer; the docs index says "This version of express-validator requires that your application is running on Node.js 14+". The package.json engines field on npm reads ">= 8.0.0" for the latest version, which the README and docs do not repeat, so the README statement is recorded. The maintainer follows the LICENSE copyright line, which names only Chris O'Hara (2010); the npm registry lists four maintainers (ctavan, gustavohenke, rustybailey, fedeci) and the npm author is Christoph Tavan, and the reviewer should decide whether the record names the copyright holder or the organization. The GitHub release list has the newest stable release 7.3.2 on 2026-04-01 and no prerelease newer than it. firstRelease is the year of tag v0.1.0 (commit dated 2011-10-05), which is also the repository creation date and the first npm upload. The npm weekly figure is the sum of the daily downloads for 2026-11-01 to 2026-11-07 from the range endpoint. The installMethod npm route is the docs sentence "express-validator is on the npm registry! Install it using your favorite Node.js package manager:"; a pnpm tab is the same route and is not recorded separately.  The docs index says "It allows you to combine them in many ways so that you can validate and sanitize your express requests", which is the only description of its use beyond the GitHub line.
