notes: >
  The project is a PHP library without an HTTP layer of its own; it is added to a Laravel, Symfony or Tempest application. The pages give no hosting model, so runsAs is unknown. basedOn is not recorded: the pages call Ecotone a layer on top of Laravel and Symfony but name no parent. Packagist ecotone/ecotone is the core package; the integration packages (ecotone/laravel, ecotone/symfony-bundle) are siblings and not used for figures. The repository ecotoneframework/ecotone is a read-only split that Packagist points to; development happens in ecotoneframework/ecotone-dev, which the homepage links. Stars come from the split. Contributors are not recorded because the split and the monorepo give different counts. currentMajor and latestReleaseDate use the highest stable Packagist version (1.x); the 2.0.0-beta pre-releases are not recorded as current. The Enterprise edition has a separate license file (LICENSE-ENTERPRISE) that was not read; the proprietary license entry comes from composer.json. The maintainer is the company named in the pricing page footer and text; the LICENSE copyright names Dariusz Gafka. Coined fields: commercialSupport (as in cakephp.yml), discord (from the forum key in composer.json). No endoflife.date product exists.
