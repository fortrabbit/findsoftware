notes: >
  The repository has no homepage of its own: the GitHub homepage field is empty and the package.json homepage points to the repository, so homepage is absent under the repo-only rule. The author's blog adamduncandesigns.com is personal and is not recorded. The project has no GitHub releases; the highest version is npm latest 0.3.0, published 2014-12-15, which matches the README release history ending at v0.3.0. The repository was last pushed 2014-12-15 and is not archived; no deprecation on npm and no end statement were found, so the status stays accepted and the import moves the record to stub on its own. The README says "This plugin requires Grunt `~0.4.5`"; no field fits that version range, so it is not recorded. The package.json lists two contributors (Adam Duncan and Thomas Digby); the GitHub contributors endpoint lists one, and that count is recorded. The mustache value is the syntax the README names; the engine is Hogan.js, which the README names as "under the hood" and is not recorded as a field. The npm downloads figure is for the one package the install docs name, grunt-flats.
  Layout, from the README: the task reads a master page, layouts and partials under a base path that defaults to _templates, and compiles each layout into a destination directory that defaults to the same folder. Partials can be nested, can take their own data object, and can carry default values. The task configuration goes in the Gruntfile under a flats key. The build removes every .html file from the destination directory, except the master page when it sits there. The README says the task requires Grunt 0.4.
