notes: >
  The simpleicons.org homepage answers 200 but returns only a script shell with the title "Simple Icons", so it was not read as a page; the homepage fact rests on the GitHub repository's homepage field, which the project sets. The README's legal disclaimer (DISCLAIMER.md) covers the brand trademarks in the icons; it is not a license statement, so it is not recorded. The maintainer is the author name in package.json, since no page names a legal entity. The npm figure is the sum of the daily counts from the npm downloads range endpoint for 2026-10-19 to 2026-10-25 and counts npm installs of the simple-icons package. The Packagist figure is the total downloads from the Packagist package page, not a weekly count. The firstRelease year is the oldest GitHub release (2.0.0, 2017-04-26); the npm package was created 2017-09-17. The classification as an icon set follows the scope decision of 2026-10-19 that accepts icon sets as tooling. The Discord link is the README's badge, whose alt text is the quote. The icon count in the README (3400) changes with every release and is not recorded as a field.
