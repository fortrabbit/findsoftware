notes: >
  Filestack is a hosted service: the open-source part is the JavaScript SDK repository filestack/filestack-js, which is not the product and carries no record fields. The SDK repository is MIT on GitHub, has 212 stars and was last pushed 2026-10-01 (read 2026-11-03); its npm package filestack-js (latest 4.3.9, MIT) had 352,932 downloads from 2026-10-26 to 2026-11-01, the period in the value. The CSV row's 159.0k per week figure is older and is replaced by this one. The homepage's Developers area lists JavaScript, React, Angular, Python, PHP, Java and WordPress SDKs; these are not fields. The security page and the homepage state SOC 2 compliance and the security page names GDPR; compliance claims are not recorded as fields. The legal page lists Filestack among Idera, Inc. products and gives the Austin, Texas address that holds hqCountry. The About page says Filestack is headquartered in San Antonio, Texas; the two addresses disagree and the record follows the legal page, whose address is the one recorded in hqCountry; the data processing terms page gives the same Austin address for Filestack, Inc. The privacy page names Idera, Inc. as controller with Idera affiliates, which is the recorded parent; the Filestack Service Terms PDF and the data processing terms page name Filestack, Inc. as the contracting party, which is the recorded maintainer. The pricing page lists Free, paid and Enterprise plans with team members, Platinum support and premium add-ons such as OCR; no prices are recorded and no plan is a paidEdition. No page read names an SSO, SAML or self-hosted option, so sso and selfHostOption are not recorded. The homepage names S3, Azure and the customer's own bucket as storage destinations; these are integrations and the contentStore fact quotes only the default. The footer Terms link goes to ideracorp.com/legal/filestack, which links the Filestack Service Terms PDF; the PDF names Filestack, Inc. as the party and is the source for the company, with the legal notice. The About page says used by more than 50,000 app developers around the world, which is not recorded as a field. The homepage, pricing and docs footers link https://www.linkedin.com/company/filestack, which no field holds. firstRelease is not recorded: the founding year does not appear on the pages read.
