notes: >
  Discontinued by signal: the repository the homepage links on GitHub (selectize/selectize.js) is archived, per the GitHub API archived flag read 2026-11-16 (also recorded as the CSV row on 2026-10-19). The README on the archived default branch states no end; it says "Selectize is looking for new members on the maintenance team", a recruiting line, not a maintenance-mode statement, so it does not change the status. The npm package @selectize/selectize, which the README and the docs install, has its last version 0.15.2 on 2022-11-18 and no deprecation flag; no page names a successor repository, so the archived repository is the signal. The unscoped npm package selectize is an older one (last version 0.12.6, 2018) with 55,492 downloads in the same week; it is not the package the install page names and its figure is not recorded. Maintainer: the LICENSE file copyright lines name Brian Reavis & Contributors (2013 to 2015) and Ris Adams & Contributors (2020); the README names "Selectize Team" for 2020 to 2022 and the homepage footer reads "Copyright © 2022 Selectize team."; the privacy notice names Ris Adams as the operator of selectize.dev. hqCountry is not stated. Version: the GitHub release line is 0.15 (0.15.2 latest, 2022-11-18); currentMajor is 0 because the project is on major 0, and the minor line is 0.15.x. firstRelease 2013 is tag v0.1.0 committed on 2013-05-28, the oldest tag by commit date. Runtime: the README names jQuery as a peer dependency and no page states a runtime or a runsAs in a sentence, and the npm engines field "*" is no runtime. The README lists jQuery UI as optional for the drag and drop plugin; not recorded beyond the peer requirement. Keybase is the project's chat team link and is not recorded as forum; the homepage Community links also name Stack Overflow, which is a general site and is not recorded.
