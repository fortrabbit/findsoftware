notes: >
  The README says "we can use globbing patterns" to minify all CSS files in a folder and its sub folders, and "glob is supported to add wildcard paths" for tag helper assets. The csproj references Microsoft.AspNetCore.App, so the library runs inside the site's ASP.NET Core application and the host needs .NET. ASP.NET Core middleware. The pipeline is registered in Startup or Program code with services.AddWebOptimizer and app.UseWebOptimizer; output is generated on the first browser request and kept in memory, and the README says that no output files are generated on disk. Caching options are enableMemoryCache and enableDiskCache with a cacheDirectory; the README says the disk cache speeds up application restarts by loading pipeline assets from disk. Tag helpers add a version string to script and link tags that point at registered files, and the README says cache busting cannot be disabled. An inline attribute on link and script tags inlines the file content into the page. Repository has no GitHub release or tag; the release dates and majors come from the NuGet package LigerShark.WebOptimizer.Core, whose stable versions run from 1.0.189 (2017-11-13) to 3.0.477 (2025-09-03). Early prerelease uploads are dated 2017-08-10 onward; the unlisted entries dated 1900-01-01 are placeholders and were not used for firstRelease. No prerelease is newer than the latest stable upload. The README links a demo site (weboptimizer.azurewebsites.net); it is a demo of the library and no project homepage is set, for the reviewer to decide. The NuGet search reports totalDownloads 15558733, recorded as the total. Compiling SCSS needs the separate LigerShark.WebOptimizer.Sass package (README); it is not recorded as a plugin. Repository last pushed 2025-09-03 on master. runsAs is left out: the README describes middleware inside an ASP.NET Core application and names no server or process model, for the reviewer to decide. The README header also says master targets ASP.NET Core 3.0 and points ASP.NET Core 2.x users to a 2.0 branch; the csproj targets net8.0.
