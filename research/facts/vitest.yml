notes: >
  The guide's install commands are in tabs that the raw HTML does not contain, so installMethod is not recorded. The guide states the Vite and Node minimums in one line; both are kept in the runtime notes via the runtimeMin quote. The maintainer is the vitest-dev GitHub organization from the API; the homepage names contributors in its keywords and meta author list, which is not a single maintainer. The homepage's runtime quote uses the guide's HTML entity for the greater-than sign, copied as it appears in the raw page.
