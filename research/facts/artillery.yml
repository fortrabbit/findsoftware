notes: >
  Monorepo: the repository artilleryio/artillery holds the packages/artillery CLI and other packages; the stars and 139 contributors belong to the monorepo, and the npm figure is for the artillery package the install page names. Licenses: the artillery package is MPL-2.0 (package.json at the 2.0.34 tag); the README says some Azure-specific modules are under the BSL (LICENSE-BSL.txt names the licensor Artillery Software Inc and the licensed work as Azure-related code), and that Azure use is for evaluation and proof of concept, with commercial or production use requiring a commercial license. The root LICENSE file is not in the repository at main or at the tag; the MPL text was not readable. Hosted: Artillery Cloud (app.artillery.io) is a paid subscription covering the CLI and the cloud dashboard; the pricing page lists paid plans and an enterprise add-on for SSO (OIDC and SAML), audit logs and BYOC deployment, which are cloud features and are not recorded for the open-source record. Artillery Pro was a paid CLI extension with a self-deployed AWS backend; its docs say it was deprecated in June 2024 and its distributed load testing is now in the main distribution, so no paidEdition is recorded. Distributed runs: AWS Lambda, AWS ECS/Fargate and Azure ACI per the docs; the CLI reference, the Lambda guide and the CI/CD guide were read; the CI/CD guide says Artillery can be triggered from pipelines, which is no statement that it is dev-only, so runsAs is left out. Protocols and engines: HTTP, WebSocket, Socket.IO, Playwright and gRPC and Kinesis per the README; the JavaScript or TypeScript test script option is in the docs; the YAML script is the default. Observability integrations (OpenTelemetry, Datadog, New Relic and others) are on the docs. The homepage tagline is "When performance & reliability are not optional". The engines field reads node >= 22.18.0, recorded as runtimeMin 22 (major) per the Node convention. The cloud pricing has no prices recorded here.
