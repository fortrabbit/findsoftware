notes: >
  The project has no homepage: the repository is the only site, so homepage and docs are left out, and the README on the 7.x branch (the default branch) is the documentation. The README says "Only the latest version of PHPUnit is supported, and thus only the latest version of ParaTest is actively maintained", and that ParaTest "heavily relies on PHPUnit @internal classes". PHPUnit is the parent: ParaTest states its objective as "parallel testing in PHPUnit", it requires phpunit/phpunit in composer.json, and phpunit.yml exists. The composer.json also requires the dom, pcre, reflection and simplexml PHP extensions. The composer.json at v7.29.0 names Brian Scaturro and Filippo Tessarotto as developers; the LICENSE copyright line names Brian Scaturro, which is the maintainer recorded. The install route is the composer package brianium/paratest, so the Packagist figure counts that package (total downloads, Packagist's own page). The GitHub figures (stars, contributors) belong to the repository paratestphp/paratest. Stars and contributors are not compared or ordered. The oldest tag is v0.1.0 (commit dated 2012-11-02); the oldest GitHub release is 0.7.0 (2014-04-17), so firstRelease takes the tag. The prereleases 4.1.1-alpha.1, 4.1.1-alpha.2 and 4.2.0-beta.1 are older than the latest stable release, so no latestPrereleaseDate. The runtime range in composer.json is the library's own requirement and is recorded as runtimeMin 8.4 from the v7.29.0 manifest.
