notes: >
  The homepage is https and answers 200. The repository has no GitHub releases, only tags: stable tags up to v4.1.1 and v5.0.0 betas (beta1 to beta4), so currentMajor and latestReleaseDate come from RubyGems, the registry the install page names (gem install sitepress). The newest pre-release is 5.0.0.beta4 (2026-04-09), recorded as latestPrereleaseDate. The oldest RubyGems version is 0.1.16 (2016-09-12), the year the repository was created; firstRelease is that year. The maintainer is the LICENSE copyright holder; RubyGems lists the author as Brad Gessler. The homepage describes the gem as a Rails embed and a static compiler; the README calls it a file-backed website content manager and the RubyGems summary an embeddable file-backed content management system, but no admin interface is documented, so categories is ssg. No Ruby minimum is stated on the project's pages; the sitepress-rails gemspec requires Rails 7.0 or later as a dependency, which is not recorded as runtimeMin. Two renderingModes entries and two runsAs entries are recorded because the static compiler and the Rails embed are separate modes described on separate pages; the always-on value rests on the Rails getting-started page, where a Rails application server serves the Sitepress pages. The RubyGems metadata of the latest release states no Ruby minimum (required_ruby_version >= 0). The deployTargets field is coined here, as a list of targets the README names.
  The README feature list names frontmatter, page models and helpers, which is where the frontmatter statement in the prose comes from.
