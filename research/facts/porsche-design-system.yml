notes: >
  The root address answers 302 to /v4/, the v4 documentation; the record links the root as the CSV does. The page banner calls /v4/ an earlier release and links to a newer documentation, which was not followed; GitHub's highest stable release is v4.10.1 (2026-10-23), so currentMajor is 4. The GitHub release list holds v1.0.0 to v3.35.0 dated 2026-08-28, a backfill, so firstRelease comes from npm: the earliest version in the registry time field is 2.12.0 (2022-05-19). The license page gives two licenses: Apache-2.0 for the source and a Porsche Design System Assets License Agreement for fonts, icons and marque, which restricts use to Porsche applications; licenseModel is left to the import. The core package is components-js (monorepo); the framework wrappers are components-angular, components-react and components-vue, each its own npm package. The docs say the components are rendered by Stencil and that styling is offered for Tailwind CSS (recommended), SCSS, Emotion and Vanilla Extract; neither is recorded as basedOn because the pages name them as a rendering compiler and styling options, not as the software the design system is built on. The docs list Slack and a Figma library; neither has a field in the starter list. The npm figure is the components-js package; the monorepo's npm packages for frameworks are not summed.
