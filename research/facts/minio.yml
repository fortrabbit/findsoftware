notes: >
  Discontinued: the repository is archived (GitHub API, archived true) and the README's first line says it is no longer maintained. The README names AIStor Free and AIStor Enterprise as alternatives; the homepage markets AIStor. Those are a separate product line and are not recorded as successorOf. The community edition is source only; the README says earlier binaries will not get updates. Last binary release 2025-10-16 (tag RELEASE.2025-10-15T17-29-55Z). Boundary question settled per notes-server-infra: object storage servers are server software, so the record is in with status discontinued. currentMajor is not recorded: the tags are dates. paidEdition is not recorded: the README calls AIStor Enterprise a distributed edition with commercial support, a support and licensing statement, and no page names features the community edition lacks; reviewer decides. Homepage recorded as https://www.min.io/ (min.io redirects there). firstRelease 2016 is the oldest GitHub release; the repository was created in 2015 and NOTICE says 2015-2023, so a reviewer may prefer 2015. The Slack link in the README badge (slack.min.io) has no field. The Docker Hub badge for minio/minio is not an install route: the README builds the image locally, so no dockerPulls. The README's Go 1.24 requirement is a build requirement; runtimeMin not recorded. Prose sources: the README's bare-metal, Helm and Operator sections and its AGPLv3 validation statement. Fields coined: none.
