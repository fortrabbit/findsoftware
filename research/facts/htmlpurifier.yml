notes: >
  The project's site answers only over plain http: https://htmlpurifier.org/ fails the TLS handshake (certificate name mismatch), and http://htmlpurifier.org/ serves the site, so no homepage is recorded and the site's docs, comparison, demo, news and forum pages are not linked. The site's newest news item is the 4.14.0 release (2021), while the GitHub releases list 4.19.1 on 2026-09-15; the site is stale and not used for release data. The composer.json on master and at v4.19.1 says "license": "LGPL-2.1-or-later", and the LICENSE file is the GNU LGPL version 2.1 text; GitHub reports LGPL-2.1. These are one license in two wordings, so one entry is recorded and the "or later" wording is kept here. The maintainer is the author named in composer.json; the repository has no company or foundation statement. The composer PHP constraint lists 5.6 as the lowest series, and the INSTALL file says the library is "actively tested from PHP 5.3 and up"; runtimeMin follows the manifest. The Packagist total is 398,363,604 and its monthly figure at the time was 13,126,271; the total is recorded. The CSV figure of 388.5M total is stale. Packagist reports no abandoned flag on the package. The http homepage says HTML Purifier "decomposes the whole document into tokens and removing non-whitelisted elements, checking the well-formedness and nesting of tags, and validating all attributes"; that statement is the basis of the description. The same page says HTML Purifier "is not perfect; it can interact poorly with existing JavaScript on websites". The INSTALL file lists optional extensions iconv, bcmath and tidy and optional libraries CSSTidy and Net_IDNA2. The mailing list and the forum sit on the same http site or on a Google Group, so neither is recorded.
