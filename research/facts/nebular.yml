notes: >
  The docs site answers 200 for every path with the same application shell, so its article text was read from the docs source in the repository (docs/articles). The README says the repository is "in a state of minimal maintenance" and that the maintainers focus on keeping the Angular version up to date and do not review or merge pull requests; "minimal maintenance" is no end statement, so the status stays accepted and the sentence is repeated in the prose. Releases continue (v17.0.0 on 2026-01-15 is the latest stable). The first GitHub release is a 2.0.0 release candidate from 2017-10-26 and the npm package was created 2017-08-01. The what-is-nebular article lists "Server-side rendering compatibility." among the features; it is no rendering mode of the library's own, so renderingModes is not recorded. The README links the company's Twitter and Facebook pages. The Eva Design System named in the README and docs is a design specification the library follows, not a parent package, so it is not basedOn. The LICENSE copyright line reads "Copyright (c) 2017 Akveo", and the privacy policy names AKVEO Inc. The privacy policy gives the company's location as an Austin, TX address, which is the hqCountry source; the site footer lists offices in Poland, Lithuania and USA (Austin). npmWeeklyDownloads is the sum of daily downloads for @nebular/theme over 2026-10-18 to 2026-10-24. The ng add command configures the package automatically; the manual route installs the peer packages and adds a prebuilt theme stylesheet in the Angular build configuration. The auth, security, date and Firebase modules are separate npm packages, and the ngx-admin starter is built on Nebular modules (docs article what-is-nebular in the repository).
