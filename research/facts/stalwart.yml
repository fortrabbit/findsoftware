notes: >
  Boundary row settled as accepted: the project's own docs describe an HTTP form endpoint (POST /form; the page says "The HTML form posts directly to Stalwart, which validates the submission") that websites post to, and Stalwart then delivers the submission as email, which is a site sending mail through the server (wave 49 ruling); the reviewer should confirm that reading, since the rest of the server is an end-user mail system. The license pair is the README statement: AGPL-3.0 for the community edition and SELv2 for the Enterprise edition, which the README says is the rest of the features; the GitHub license API returns no license, so the two statements are recorded as worded. The Enterprise edition is sold per mailbox, and the pricing page says the server "reverts to Community" on cancellation, so paidEdition stands. The company is Stalwart Labs LLC (US) and Stalwart Labs Ltd (UK, the second entity used for UK, EU, EEA and Switzerland contracts per the legal page); the about page says the company is incorporated in both the United States and the United Kingdom, so hqCountry is absent. firstRelease is 2022 from the about page, which says the first public release shipped in September 2022; the oldest GitHub release is v0.3.0 from 2023-07-16. Managed e-mail (stalw.art/managed-email) is a planned service: it says it is taking expressions of interest and goes live in 2027, so no hostedOffering is recorded. The discord, x and mastodon links are the homepage links. Storage backends listed in the README also include S3-compatible and Azure object stores, not recorded as databases. The docs list 17 languages for full-text search (README), which is search, not i18n. The management API at stalw.art/docs/http/api/ is recorded only as a note. The compare page names no other product. The migration page describes a migration service that goes live in 2027, so importsFrom is not recorded. The forum is the Discourse board at support.stalw.art, linked from the homepage. The sso entries hold the directories accounts can come from (LDAP, an OpenID Connect identity provider) and the built-in OAuth 2.0 server, which is also an OpenID Connect provider other apps sign in with. The homepage also links a Matrix room (matrix.to/#/#stalwart:matrix.org); no field holds it. Multi-tenancy is an Enterprise feature (tenants page: "This feature is available in the Enterprise edition of Stalwart."); no field records it. The form endpoint docs are at stalw.art/docs/http/form-submission/. The about page gives a US address (Sheridan, WY) and a UK address (London) without naming the entity at each, so hqCountry stays unknown. JMAP is an HTTP and JSON protocol, not a REST statement, so headlessApi is not recorded.
