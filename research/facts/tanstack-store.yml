notes: >
  Monorepo: the repository holds the core package @tanstack/store, the framework adapters (react-store, vue-store, svelte-store, solid-store, preact-store, angular-store, lit-store, octane-store) and their tests and docs. Stars and contributors belong to the monorepo. The npm figures, dependent counts and the stable release date are those of the core package. The installation page says "You can install TanStack Store with any NPM package manager" and lists one adapter per framework; the adapter route is one npm installMethod. The adapter compatibility lines are the docs' own: React 16.8 and later with ReactDOM only (the docs say no React Native adapter exists yet and invite contributions to it on Discord), Preact 10, Vue 2 and 3, Angular 19 and later, Solid, Svelte 5, Lit 3 and Octane. The adapters are bindings of a framework-agnostic core, so no basedOn is recorded. Stable core 0.11.2 (2026-09-29) is the npm latest and the newest GitHub stable release, so currentMajor is 0. The npm package @tanstack/store has no prerelease newer than its stable version; its 0.0.1-beta builds date from 2023. The README calls the store "Lightweight and standalone", a claim not recorded as a field. The X, Bluesky and YouTube links come from the footer component of the tanstack.com site source (the footer renders client-side, so a plain page fetch does not show them); its LinkedIn link is not recorded because no field exists for it. The maintainer follows the LICENSE copyright line (Tanner Linsley); the homepage footer reads "© 2026 TanStack LLC", a company name recorded here only as text.
