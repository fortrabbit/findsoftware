notes: >
  Doubt: the GitHub repository the CSV names (primefaces/primevue) is at its 4.x line, with a README that says it "is no longer under active development and receives security fixes only" and that "Development continues at a new home", the PrimeUI site, as PrimeReact's README does. The current line (5.0.4, released 2026-10-22) names primefaces/primevue-nextchapter as its repository in the npm metadata; that repository answers 404 here, so its README, source and license file in the repository cannot be read. The announcement at primeui.dev/nextchapter says "PrimeVue remains PrimeVue", which reads as a continuation under the same name; a reviewer decides whether that is a move (accepted) or a replacement (discontinued), and whether the 5 line's commercial license leaves the record on the open-source register. Settled by a readable copy of the nextchapter repository or a PrimeUI statement that names PrimeVue's status. License: the 5.0.4 npm package carries a PrimeUI License file that requires a license key (the Vite guide says "Provide your PrimeUI license key"); its LICENSE.md says the package "is part of PrimeUI, a family of commercial UI libraries by PrimeTek Informatics", with a free Community License for eligible organizations (under $1,000,000 annual gross revenue, fewer than 5 developers, fewer than 10 employees, under $3,000,000 outside funding) and a paid Commercial License per developer. The 4.x line on GitHub is MIT (the repository license at the API); that older license goes here, not in the license field. The Vite guide names npm as the download route, so npmName is primevue. The package's description in the registry names a premium library with PrimeBlock, which is a separate product and is not recorded. The HTTP Archive technologies list has no PrimeVue entry. The primeui.dev company page names the legal entity and its Ankara address. The earliest GitHub release is 1.0.0-beta.1 from 2019-05-27, which gives firstRelease; the npm history begins with a 0.0.1-SNAPSHOT upload that is not used. Contributors are counted from the per_page=1 Link header.
