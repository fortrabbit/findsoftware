notes: >
  Moved into PrimeUI in 2026 (Frank's decision 2026-10-28, the record follows the product). The public repository primefaces/primevue receives security fixes only; its README says it "is no longer under active development and receives security fixes only" and that PrimeVue continues as part of PrimeUI. PrimeVue 4 (npm dist-tag v4-stable, 4.5.5, released 2026-04-08) is MIT-licensed; PrimeVue 5 (npm latest, 5.0.4, released 2026-10-22) ships compiled under the PrimeUI License. No repository is recorded: the npm package primevue 5.0.4 names primefaces/primevue-nextchapter, which answers 404, and the public primefaces/primevue repository holds the 4.x line. Both repositories are listed here; neither supplies stars or contributors for the 5 line, so none are recorded (the old repository showed 14448 stars and 399 contributors on 2026-10-28). License: the 5.0.4 package carries a PrimeUI License file that requires a license key (the Vite guide says "Provide your PrimeUI license key"); its LICENSE.md says the package "is part of PrimeUI, a family of commercial UI libraries by PrimeTek Informatics", with a free Community License for eligible individuals and organizations (under $1,000,000 annual gross revenue, fewer than 5 developers, fewer than 10 employees, under $3,000,000 outside funding) and a paid Commercial License per developer. The 4 line's MIT license is older and not recorded as a license, since license facts describe the latest release. The npm package is primevue, which the Vite guide names as the download route. The homepage primevue.org (the old repository's homepage field) answers 301 to https://primevue.dev/. The registry description names PrimeBlock, a separate product that is not recorded. The HTTP Archive technologies list has no PrimeVue entry. The primeui.dev company page names the legal entity and its Ankara address. The earliest GitHub release is 1.0.0-beta.1 from 2019-05-27, which gives firstRelease; the npm history begins with a 0.0.1-SNAPSHOT upload that is not used.
