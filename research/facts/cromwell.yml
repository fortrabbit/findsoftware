notes: >
  The repository has no GitHub release objects; its tags are per package (for example @cromwell/utils@3.0.3). The major and release date therefore come from the npm package @cromwell/cli, the package the installation docs name (3.0.7, published 2024-07-12). The last commit on the default branch is also 2024-07-12. Neither the repository nor the registry package is archived or deprecated, and no page states the project has ended. The homepage footer reads "Copyright 2022", which is not an end signal. The CLI and npm install routes need Python and node-gyp next to Node.js 14 or 16, and the docs recommend SQLite only for development. The docs say the default install starts an API server, a Next.js server and an admin panel server behind a Node.js proxy, and that the three can be started and deployed separately. The migration docs describe an Excel-based import and export and say there are no one-click migrations from other specific CMSs. Themes are Next.js apps and plugins can extend the Nest.js REST and TypeGraphQL APIs. The firstRelease 2020 is the earliest upload of the registry package @cromwell/core (1.0.0, 2020-05-06), whose repository field points to this repository and whose author is Astrex LLC. The docs site answers 200 to the default research user agent. The homepage mentions an official theme and plugin store without a URL in the sources read, so pluginDirectory is absent. The homepage links a Patreon funding page. The README lists a "Drag-and-drop theme editor". The CLI install page runs the CMS with "npx cromwell start -d".
