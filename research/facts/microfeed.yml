notes: >
  The README and homepage say microfeed runs on Cloudflare Workers, with Pages installations only in migration docs. The application and its data live in the owner's own Cloudflare account, and every install path requires a Cloudflare account; no page states a runsAs value. runtime is left out: the docs require Node.js 22.12 or newer for the deployment CLI, @microfeed/cli, which is not what the site runs on. The CLI package @microfeed/cli is recorded as npmName because the install docs name it; its AGPL-3.0 license matches the repository. The docs describe a Public, Headless or Offline site access mode, where Headless returns 404 for the generated website pages while feeds, APIs and media stay available, and a dashboard protected by built-in login or Cloudflare Access; no role or SSO feature is stated. The README FAQ says microfeed is "still in open alpha phase". The first GitHub release is v0.1.0 (2022-12-28). The README also says content can be published as web pages, RSS and JSON Feed. The language field is GitHub's primary language (TypeScript).
