notes: >
  Highest stable GitHub release is v1.7.5 (2022-05-31), so currentMajor is 1. The npm dist-tag "latest" for @elderjs/elderjs is 1.8.0-beta.14 (2022-07-31); that prerelease is the latestPrereleaseDate and is not used for the major. The npm name "elderjs" (1.2.14, ISC, 2 downloads in the week of 2026-10-12) belongs to another repository (0xElder/elderjs) and is not used for figures. The README says the ElderGuide.com team "expects to maintain this project until 2023-2024", and the project page calls it "Stable and production ready"; no page states that the project has ended, so the status stays accepted. The maintainer copyright line reads "Elderjs"; the README ties the project to ElderGuide.com, whose co-founder is named there, and no legal entity is recorded. The "Svelte Framework" wording and the README's Svelte templates support basedOn Svelte. The site's build and SSR headings are the only rendering statements; the README's "Supports SSR and Static Site Generation" backs both renderingModes values.
