notes: >
  Permify was acquired by FusionAuth: the README banner and the homepage banner say so, and the acquisition post dated 2025-11-20 says the project stays open source and is not ended, so status stays accepted. The owning company is recorded as parent from the FusionAuth post; the maintainer is the GitHub organization Permify, because no legal entity name appears on the pages read (the footer reads "© Permify.co - All rights reserved."). The hqCountry value comes from the full postal address in the permify.co footer; the country is not spelled out there. The runtime binary comes from the v1.7.5 release assets (tar.gz, deb, rpm and apk archives for Linux and macOS); the go.mod minimum (Go 1.26.0 at v1.7.5) is a build requirement for a binary or image, so runtimeMin is left out. The docs describe two APIs: the README says port 3476 serves the REST API and port 3478 serves the gRPC service, and the API reference lists Check, Expand, Lookup, Write and Watch operations. The default storage is in memory; the configuration page names PostgreSQL as the only database engine and says "Contact with us for your preferred database." The Community Edition is described in the README as "a free and self-hosted solution called Permify Community Edition (CE)"; the README says selected premium features such as observability dashboards and data synchronization are not available in CE, and that Permify Cloud is priced by monthly active users. That is a hosted tier difference, so no paidEdition is recorded. The CE release cadence is four times a year, per the README. The homepage footer names a second Discord invite (discord.com/invite/n6KfzYxhPp) in the site header; the footer invite is recorded. The LinkedIn company page (linkedin.com/company/permifyco), the SDK samples folder, the Helm chart repository (github.com/Permify/helm-charts), the Playground, the Trust Center and the SOC 2 and GDPR statements in the README are not recorded: coined or hosted-only kinds. The docs deployment index also names AWS ECS, Google Compute Engine, Fly.io and Railway guides; these run the Docker image and are not separate installMethod entries. The GitHub organization's profile lists United States of America as location. The first tag v0.0.0-alpha1 has a commit dated 2022-08-03 and the repository was created 2022-07-14. No alternativeTo is recorded: the FAQ names AWS Cognito and Auth0 as identity providers that can feed Permify, not as alternatives. The configuration page lists pre-shared keys and OpenID Connect as the two methods for authenticating clients of the Permify API; that is API authentication, not a sign-on feature, so it is kept here and no sso value is recorded. The API reference says the APIs are exposed over gRPC and REST. The GitHub stars and contributors counts are read on 2026-11-03.
