notes: >
  The package named for this record is @tabler/icons, the SVG package the README names first; the framework packages (@tabler/icons-react, -vue, -svelte, -solidjs, -astro, -angular, -preact, -react-native) and the webfont, sprite, PNG, PDF and EPS packages are the same repository's siblings and are not separate records; the npm figure counts installs of @tabler/icons only. The README says all packages share one version number, so currentMajor and latestReleaseDate are taken from @tabler/icons (3.50.0, 2026-10-27), which matches the GitHub release. The icons homepage says "Tabler Icons is an open-source project. You can get it for free or support our work with an optional payment", and sells a paid premium package of icons; paidEdition records the package, prices are not recorded. The homepage's JSON-LD names Paweł Kuna as founder. The homepage links a Streamline partner page and a Figma plugin; neither is a field on this record, and the Figma plugin is named in the README as a Tabler Icons project. The CSV decision of 2026-10-19 places the icon set in scope; criterion 1 holds because creators add icons to their own sites and apps.
