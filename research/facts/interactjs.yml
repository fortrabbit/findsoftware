notes: >
  The repository has no GitHub releases; its tags run from v1.0.0 to v1.10.28 with release candidates v1.8.0-rc.1 to rc.3 among them. The stable release is the npm package interactjs 1.10.28 (2026-08-01), so currentMajor and latestReleaseDate come from the registry. No prerelease is newer than that, so latestPrereleaseDate is left out. The first tag, v1.0.0, has a commit dated 2013-12-16; the npm package interactjs starts at 1.2.7 (2016-11-30) and its predecessor package interact.js, which the registry marks as renamed to interactjs, at 1.1.3 (2014-12-04), so firstRelease is the tag year. The CSV homepage was http://interactjs.io/; the record uses the https address, which answers with the same page. The Pro page (interactjs.io/pro) lists additional features, but it says interact.js Pro "is still under development" and carries the newsletter sign-up recorded as newsletter, so no paidEdition is recorded: the features are not shipping. The Gitter chat (gitter.im/taye/interact.js) is the project's chat and has no field here. No runsAs is recorded: "for modern browsers" names a target environment, not where the library runs. The Rails route (yarn add, then an asset require) is its own installMethod entry using the same npm package, and the cdn.interactjs.io module imports are another; the Webjars route (org.webjars.npm) is a third-party repackaging and is not an installMethod. The TypeScript typings come from the npm package or @interactjs/types and are not recorded as a field. The npm figure is the range for 2026-11-01 to 2026-11-07 of the interactjs package the install docs name; the CSV point figure was stale. Stars and contributors belong to the repository, which is not a monorepo. The homepage says the library does not do any moving itself and provides the pointer event data, so the page decides what feedback users get (dragging elements, drawing on a canvas or scrolling the page); its feature list names support for HTML and SVG and a unified API for touch and mouse events.
