notes: >
  No package is published: the README says there is no package to install, and registry.npmjs.org returns 404 for hyperui, so no registry figure is recorded. The release tags are names, not versions (next14, next15, pre-astro, astro), so currentMajor is absent. The four GitHub releases run from next14 (2025-02-23) to astro (2026-01-21), which sets latestReleaseDate; the repository was created in 2021 and the components were published before the first GitHub release, so no first-release year is recorded. The homepage links no community, social or newsletter account, and the Templates and Tools pages in its navigation are on the same site. The homepage markets the components alongside templates (application, marketing, neobrutalism) and a blog; the free components are the project's own, and no paid tier is stated. The maintainer is the copyright holder named in LICENSE; the GitHub profile gives the location as the United Kingdom, a person's location, so hqCountry stays unknown. Repository language is what GitHub reports for the Astro site that holds the component pages.
