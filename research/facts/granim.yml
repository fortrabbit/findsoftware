notes: >
  The docs link is the API page the homepage nav links. The forum is the Gitter chat badge in the README. The x link is the author's personal account in the homepage footer ("Created by Benjamin Blonde"). The README example creates a Granim instance for a canvas element with named states, and each state lists gradients of two colors. The README and the homepage name no runtime, and no sentence says the library runs in the browser: the README shows a script tag and a canvas element in HTML, so runsAs and runtime are left out. The homepage is the GitHub Pages demo site that the README links as its demo and that the repository's homepage field names. The install routes are each their own installMethod: npm (npm install granim --save), Bower (bower install granim, a registry the README names and whose own status is not checked here) and a download from the releases page. The npm figure is the package granim for 2026-11-01 to 2026-11-07. The LICENSE copyright line names Benjamin Blonde; the repository owner is the user sarcadass. firstRelease is 2016: tag and release v1.0.0 on 2016-08-30, which predates the first npm version 1.0.1 (2016-09-05). The latest stable release is v2.0.0 (2018-11-11); the repository's last push was 2022-12-06 and it has no release or pre-release since 2018, so under criterion 4 the import moves it to stub without a change here. The stars and contributors belong to the repository.
