notes: >
  Status accepted: the repository is not archived, no page or registry states that the project has ended, and the homepage describes it as actively maintained.
  currentMajor is in notFound because release tags are dates, not semantic versions.
  latestReleaseDate is the publish date of the latest release, which differs from the date in its tag.
  maintainer is not recorded: the README and LICENSE name four copyright holders (Alex Suraci, Arian Xhezairi, Daniel Pimley and others) with no company or legal entity.
  runtimeMin and databases come from the README at the latest release tag, not master.
  Bundled feathers and modules are listed in the README and the wiki; no directory exists, so pluginDirectory and pluginCount are unknown.
  i18n is recorded from the wiki's list of extension kinds, which names translations; no language list is recorded.
