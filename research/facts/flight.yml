notes: >
  The Packagist description names the project as the maintained fork of mikecao/flight, so forkOf is recorded from that statement; the GitHub API redirects mikecao/flight to flightphp/core. The homepage flightphp.com answers with a 301 to docs.flightphp.com/en/v3/, where the quotes are read. The docs example is an index.php entry point and does not state a hosting model, so runsAs is unknown. firstRelease is the date of the v1.0 tag on Packagist. The maintainer is the copyright line on the docs site, with no legal form. Coined fields: chat and discord (as in other records). Stop check: the repository is not archived and Packagist has no abandoned flag.
