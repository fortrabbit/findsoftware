notes: >
  Stars, contributors and the repository belong to mitsuhiko/insta, which is a single crate repository with a companion cargo-insta and a VS Code extension in the same repository. The crates.io figure is the total downloads of the insta crate, the package the install docs name; crates.io's 90-day figure is not recorded. The LICENSE file carries no copyright line, so the maintainer comes from the authors field of insta/Cargo.toml at tag 1.49.0. The homepage says insta, similar and similar-asserts "support Rust down to 1.51", while insta/Cargo.toml at 1.49.0 states rust-version 1.66.0; runtimeMin follows the manifest at the latest release tag. The runsAs local value rests on the quickstart sentence about running tests with cargo test; the quickstart's CI section adds that insta behaves differently in CI environments. Installation: the quickstart's cargo add route is recorded, and the CLI page's two routes for the companion cargo-insta tool (installer script, cargo install). The category is testing. The similar crate is a dependency and is not recorded as basedOn. The docs.rs API reference is the library's documentation alongside the quickstart.
