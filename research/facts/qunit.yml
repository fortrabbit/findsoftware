notes: >
  The homepage's Support and chat link opens a chat room on Matrix (#qunitjs_qunit:gitter.im), which is recorded nowhere as a field because no starter field names a chat room; the intro page's Support section also names StackOverflow, a general site that is not a project forum. The Social media section of the intro page names the Mastodon account @qunit@fosstodon.org, recorded as mastodon; the Mastodon, Bluesky and Threads hashtag links are not accounts. The README says QUnit was originally developed for the jQuery project, has since evolved to test any client-side or server-side JavaScript code, and has no dependencies; the Node.js guide runs tests with the qunit command through npm test, and the browser guide loads qunit.js and qunit.css from an HTML file; no runsAs is recorded because those are command examples. The About page says the work on QUnit is done by volunteers. The LICENSE copyright line names the OpenJS Foundation and other contributors; the README does not name a legal entity, so the maintainer follows the LICENSE line as for lodash. The homepage footer also reads "Copyright OpenJS Foundation", matching that line. The npm figure for qunit is the registry package the install docs name. The first GitHub tag is 1.0.0, committed 2011-10-06; the earliest npm version listed in the registry is 0.2.6, published 2011-11-07, so firstRelease is 2011 either way. The repository was created in 2009, which is no release date. The runtime node comes from a README sentence that names browsers, Node.js and SpiderMonkey together, so no runsAs is recorded. The runtime minimum is the engines field of the 3.0.0 package.json. The download route quotes the homepage line that names the two files for the current release. The contributor count is the page number of the last contributors page. The 3.0.0 release is the newest stable GitHub release; the 3.0.0-rc1 prerelease from 2026-01-11 is older than it and is not recorded.
