notes: >
  Status is discontinued on two signals: the project's own homepage says "As of October 2025, NGINX Unit is archived and unmaintained." and the nginx/unit repository is archived on GitHub (pushed 2025-10-08). Version conflict: the homepage says the latest version is 1.34.2, released on Feb 26, 2025, while the GitHub releases list 1.34.2 on 2025-03-03 and 1.35.0 on 2025-09-11 (a unitctl binary release with a note pointing to the installation guide); latestReleaseDate takes the GitHub value; the homepage line is not recorded as a fact. currentMajor 1 comes from the 1.35.0 line. The installation page lists application languages Unit can run (Go, Java, Node.js, PHP, Perl, Python, Ruby, WebAssembly components); no field for that exists, so it is not recorded. The npm module unit-http is a Node.js language module, not the Unit server, so no npmWeeklyDownloads. The Docker Hub library/unit pull count was read on 2026-10-30. The unit.nginx.org repository install section names the Amazon, Debian, Fedora, RHEL and Ubuntu packages; they are one installMethod route. Fields coined here: none.
