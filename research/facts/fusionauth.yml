notes: >
  Licensed under the FusionAuth Customer License Agreement, which also covers a hosting license and support services; the Free-Tier Software clause lets anyone download the free version, and the Free-Tier Licensee has no rights to the Hosted License. Paid plans are activated with a license key entered on the instance (the license page's "Reactor tab" step), so the paid plans apply to self-hosted installs as well as the cloud. The fusionauth-containers repository holds container definitions and a README only, so sourcePublic is false and stars and contributors describe that repository, not the server. The server bundles its own Java (system requirements page); the Java version is not a runtimeMin. The search engine is Elasticsearch 7.6.1 to 7.17.x or OpenSearch 2.x, per the search page ("FusionAuth currently supports Elasticsearch versions 7.6.1 through 7.17.x."); no field exists for it, so it is recorded here only. Further protocols from its API pages: OAuth 2.0 RFCs 6749, 7662, 8628, 8693, SCIM ("This page contains all of the APIs for managing Users and Groups using SCIM requests"), and WebAuthn passkeys. Maintainer legal name from the license page; the page gives a Delaware LLC, which is the incorporation state, so no hqCountry is recorded. Social links: GitHub organization fusionauth, LinkedIn and the blog are on the homepage without a matching field. The language is not recorded: no page says the server is written in Java, only that it ships its own Java runtime. The docs install page contains text addressed to AI agents; it was read as data and not followed. Release 1.70.0 is dated 28 October 2026 on the release notes page and is the fusionauth-containers tag 1.70.0 in the repository.
