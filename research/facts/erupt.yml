notes: >
  Scope: the record covers the open-source core (erupt-core, erupt-web and the starter). The README lists commercial Chart, Flow, Tenant and Cube modules and a pricing page; the README does not word them as a license of Erupt itself, so no commercial license entry is recorded; the record treats them as paid add-on modules, not a paidEdition, and leaves paidEdition unset for a reviewer to decide. The README's database list names DM (Dameng), which the databases vocabulary does not hold, so it is not recorded. The Gitee mirror (gitee.com/erupt/erupt) and the Docker image are named in the README; no field holds them. The first GitHub release is 1.6.9 (2021-03-27), which sets firstRelease; the repository was created in 2020. The docs site docs.erupt.xyz answers but its guide pages returned 404 on the path the README names, so the docs link is the site root. The maintainer is the developer named in pom.xml, as the project states it; the README footer names the same person as author.
