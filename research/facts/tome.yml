notes: >
  The drupal.org project page is the primary source; its Requirements section on tome.fyi and the getting-started guide both still say Drupal 8/9 and PHP 7, while the release line and composer.json say Works with Drupal ^10 || ^11 and drupal/core ^9 || ^10 || ^11. runtime is taken from the guide's PHP statement and runtimeMin stays unknown because no read page states a PHP minimum for the current release. The license is GPL-2.0-or-later in composer.json; the drupal.org Read license link points to the GPL-2.0 text and is not recorded as a second statement. The drupal.org page shows the project created 18 June 2018, which is not a first release date, so firstRelease stays unknown. Maintainers are listed by name in composer.json as Samuel Mortenson and Lee Rowlands; the drupal.org usernames are samuel.mortenson and larowlan. drupal.org labels the project Minimally maintained, with the note that maintainers monitor issues but fast responses are not guaranteed, and Maintenance fixes only; no field holds that. language is unknown because no page states what Tome is written in. The module is named in the drupal.org repository, and its git repository is git.drupalcode.org/project/tome. The tome.fyi site describes itself as made with Tome and in development; that statement is not recorded.
