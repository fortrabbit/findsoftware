notes: >
  The homepage footer says "Open source under Apache 2.0" while the LICENSE file and the GitHub API say MIT; both are recorded as license entries and the two disagree. The README places Quintessential SFT in Athens, recorded as hqCountry GR. The install page lists Node.js 24+ under source development, so runtimeMin is left out. The hosting page says "Coming soon" for Conduit Hosting, a managed service with no prices and no live status; the record is not a hosted-service. Boundary question from the CSV (backend as a service or content backend?): the homepage describes it as a Backend-as-a-Service with a CMS CRUD capability in the database docs, recorded as data-backend. Standalone and source installs need Redis (install page); not recorded as a database field. The npm figure is @conduitplatform/grpc-sdk: its 0.16.31 matches the GitHub release v0.16.31 of 2026-09-28 and its registry repository field points to this repository (libraries/grpc-sdk). The CLI named in the install docs, @conduitplatform/cli, is stale on npm (0.0.15, 2023, from the separate ConduitPlatform/CLI repository) and carries no figure here. The install page offers the CLI, Docker Compose microservices and the standalone image; the local-source deployment page adds a source route. The first GitHub release is v0.10.6 from 2022-01-31; the repository was created 2022-01-30. The docs state that the Embeddings module is not included in the standalone image. The admin UI runs as the conduit-ui container.
