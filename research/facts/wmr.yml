notes: >
  The README warning says WMR is no longer maintained and recommends Vite with @preactjs/preset-vite in its place; that recommendation is a replacement named by the project, recorded here only in prose because the schema has no field for it. The repository is a monorepo: the GitHub release wmr@3.8.0 (2022-09-27) is the latest release of the package the install docs name, and the registry agrees on major 3. The npm package declares node >=12.17.x in engines. The README describes the production output as Rollup-based, which is a build tool and not recorded as basedOn. The copyright line reads "The Preact Authors", so the maintainer is recorded that way.
