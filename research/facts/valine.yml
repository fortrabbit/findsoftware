notes: >
  The English docs say Valine "was born in August 7, 2017" and is a "Leancloud based no back end comment system"; LeanCloud stores the comments, so the data lives on another platform. That dependency is recorded here and not as basedOn, because LeanCloud has no record in the dataset. The English docs also list a "Firebase-based comment store" under a to-do heading, which is planned and not recorded. The README says that "the src directory will be suspended from updating after v1.4.0" (quoted with backticks in the README); the project's own site and repository still show releases to v1.5.3 on 2024-12-15, so this is a partial freeze of the source directory, not an end statement. The docs name integrations with Jekyll, Hexo, Hugo, VuePress and Gatsby, which are sites that embed the comment script; no integration makes a basedOn statement. The site footer reads "Powered By xCss" and the repository owner is the user xCss, so the maintainer is recorded as the project names it. The English quickstart shows the script tag or npm import that mounts the widget with a LeanCloud appId and appKey. The homepage of the Chinese docs is the default; the English pages sit under /en/ and are the source for the English quotes. The npm figure is for the valine package the install docs name; the GitHub release and npm version agree at 1.5.3. The repository has no commit after 2024-12-15 on master per the commits endpoint, so lastCommitDate is not needed.
