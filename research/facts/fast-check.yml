notes: >
  Monorepo: the GitHub repository holds the fast-check package beside its test-runner integrations, a worker package and the website, so stars and contributors belong to the monorepo. The npm figure is for fast-check, the package the README install line names. The README compatibility table lists a 5.x row with a Node.js 22.12 minimum; no 5.x release exists on GitHub or npm, so currentMajor stays 4. The latest stable GitHub release is v4.10.2 (2026-09-19); the old v0.0.1 prerelease (2017-12-28) sets firstRelease. The minimum Node.js version comes from the package.json engines field at the latest release tag; the README footnote recommends a newer Node.js 14 line for 4.x, which is coined detail and stays in notes. The README names no browser runtime, so no runsAs is recorded. The docs tutorials set fast-check up with the Deno and Bun test runners (Deno imports it as npm:fast-check), so deno and bun are runtime entries beside node; runtimeMin is the Node.js minimum only. The Bluesky link is in the header and footer of the documentation site configuration; the plugin directory is the ecosystem page the README links as "Awesome fast-check".
