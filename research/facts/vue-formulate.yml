notes: >
  Doubt: none on status, but the newest stable release is npm 2.5.3 (2022-01-21), more than four years before this check, and the last push to the repository is 2023-05-06; the import's four-year rule will move this record to stub unless a release appears, and the status is left as accepted. The homepage says "Need Vue 3 support? Checkout the Vue Formulate successor FormKit." and the installation page says "The next major version of Vue Formulate for Vue 3 is called FormKit." A named successor is no end signal, so the record stays accepted; successorOf and alternativeTo are not recorded because the statement names a successor for Vue 3 only and the record's own successorOf field would need the FormKit record to be the one that carries it. The installation page says "Vue Formulate is compatible with Vue 2." The registry name @braid/vue-formulate is the package the install page and the README badge name. The unscoped npm package vue-formulate (last version 0.12.1, modified 2022-05-23) belongs to the repository wearebraid/vue-formulate-legacy, so its figure (169 in the week 2026-11-01 to 2026-11-07) is not recorded. The npm weekly figure is the sum of the seven daily values of the range endpoint for @braid/vue-formulate. The GitHub repository has no releases; its tags run from 0.1.0 (commit dated 2018-01-31) to v2.5.2, and the npm latest 2.5.3 is newer than the last tag, so the registry date and major are used. firstRelease is 2018 from tag 0.1.0 of this repository. The homepage and README list a plugin system, validation rules, grouped repeatable fields and form generation from a JSON schema. The community page names Stack Overflow with the vue-formulate tag, which is no forum field, and the Discord server. The i18n quote is from the homepage; the localization translations are in the separate repository wearebraid/vue-formulate-i18n, which the README names. The copyright line in LICENSE.txt is "Copyright (c) 2020 Braid LLC"; the README gives "2020-present". The wearebraid.com footer names Braid LLC, and its privacy page names a Virginia privacy law; no page names the country of Braid LLC, so hqCountry is not recorded.
