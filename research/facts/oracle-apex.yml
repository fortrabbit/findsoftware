notes: >
  The CSV homepage https://apex.oracle.com answers 403 with an "experiencing technical difficulty" page to curl, so the homepage recorded is Oracle's product page at https://www.oracle.com/apex/, which answers 200. The current release is 26.2 in Oracle's documentation; APEX versions are year and month (26.2), a calendar version, so currentMajor is absent by the rule for calendar versions, and no release date is stated on the pages read. The oracle/apex GitHub repository, which GitHub reports under the UPL-1.0 license, holds sample code, starter apps and plug-ins, not the APEX engine; the repository is recorded for that reason and the engine's license was not found on the pages read, so license and licenseModel are absent. The product page states that APEX is included at no additional cost with supported Oracle Database editions and that there are no separate license fees; that is a price statement without a license, so it is not recorded as a fact field. ORDS, the Java web server, has licensing costs for WebLogic Server where that is the chosen server, per the requirements page. Database Vault is a licensable option of Oracle Database Enterprise Edition, not an APEX edition, so paidEdition is absent. The CSV names the language as PL/SQL; no fetched page states the language in those words, so language is absent. The databases value oracle is new in this batch. ORDS is a Java-based web server (a J2EE application) in front of the database; APEX itself runs inside the Oracle Database, and the register has no runtime value for that, so no runtime is recorded and the runsAs fact cites the ORDS deployment statement. The product page's social links are Oracle corporate accounts, not APEX's, and are not recorded. The product page mentions Oracle Autonomous AI Database and an Always Free tier; the hosted fact cites only the product page text.
