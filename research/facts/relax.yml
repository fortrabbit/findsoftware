notes: >
  No homepage: the repository and the Hex documentation are the only project pages, so homepage is absent. The README calls Relax Alpha software with APIs still stabilizing and says the project is pre 1.0; no page states that the project has ended, and no archive or deprecation flag is set. Activity is old: the repository's pushed_at is 2016-05-14, and the newest Hex release is 0.3.0 from 2015-08-29, so the record is stale and a reviewer should decide whether it stays accepted (the import moves a record with no release in four years to stub on its own). The GitHub repository has tags v0.0.1, v0.0.2 and v0.1.0 and no GitHub releases; the CSV lastRelease 2015-07-03 is the v0.1.0 tag, and the Hex registry has later versions, so the registry figures are used for the release fields. firstRelease is 2014 from the oldest Hex upload (0.0.1, 2014-12-17); the repository was created 2014-11-29. The mix.exs elixir requirement is "~> 1.0", which is not a minimum version of the release, so runtimeMin is absent. The Hex package description reads "A jsonapi.org serializer and optional server implementation in Elixir"; the README describes the project as a Plug based toolset, and the record follows the README. The hexdocs page describes the resource and router modules but states no run model, so runsAs is absent. The Hex download figure is the all-time total.
