notes: >
  Mastodon's about page says the project was incorporated as a gGmbH in 2021, lost its non-profit status in Germany, and that the team began moving it to a foundation in 2025; maintainerType company reflects the GmbH named in the imprint and the foundation move is not yet recorded as a fact. The repository holds a Dockerfile (api, v4.7.3), but the install docs read did not name an official image, so docker is not recorded. Runtime minimums come from the v4.7.3 Gemfile and package.json engines field.
