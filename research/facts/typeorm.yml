notes: >
  Accepted: an ORM that a Node.js application adds as an npm dependency and that runs against the databases its docs list. Monorepo: the repository holds the ORM only, so its stars and contributors are the library's own. The 1.0 line is the current major; the GitHub release objects run 1.0.0 (2026-05-19) to 1.1.3 (2026-11-12), and the 0.3.x line continues with 0.3.31 (2026-07-13) under the legacy docs site at v0.typeorm.io, which is recorded here as a link only. The README states the database list as "Microsoft SqlServer, MySQL/MariaDB, MongoDB, Oracle, Postgres, SAP HANA and SQLite" and the getting-started page adds Google Spanner and CockroachDB; SAP HANA, Spanner, CockroachDB and sql.js have no field value in the vocabulary, so they stay here. The getting-started page names the platforms as Node.js, Browser, Cordova, Ionic, React Native, NativeScript, Expo and Electron; the runtime value is node because the supported-platforms page says "TypeORM is compatible with Node.js 20+", and browser use goes through sql.js. The package manifest at 1.1.3 sets engines node to "^20.19.0 || ^22.13.0 || >=24.11.0", so runtimeMin is 20. The first upload to npm is 0.0.1 (2016-04-19) and the GitHub repository was created 2016-02-29; firstRelease is 2016. The maintainers page says TypeORM was created by Umed Khudoiberdiev in 2016 and that maintenance passed in late 2024 to a team led by Michael Bromley and David Höck; no legal entity is named, so the maintainer is recorded as the LICENSE line states it, "TypeORM". The homepage's Discord link is the community chat; the Stack Overflow tag link is a general forum and is not recorded as the project's forum. LinkedIn (linkedin.com/company/typeorm) is in the homepage footer; the linkedin field is coined and stays here. The support page offers professional commercial support from the core team, which is no paidEdition. The docs page "Migration from Sequelize to TypeORM" is a manual code guide with no import tool, so Sequelize is recorded as alternativeTo and importsFrom stays empty. The README says TypeORM is highly influenced by Hibernate, Doctrine and Entity Framework, which is a credit, not an alternativeTo statement. The Sponsors section (Open Collective tiers) and the README extensions list (third-party packages) are not recorded. The Quick Start command "npx typeorm init" creates a starter project for a Node.js application; it is part of the npm route and is not a separate installMethod. Getting-started setup: install the npm package, the reflect-metadata shim (imported once in the app), optionally node typings, and a database driver listed per database on the driver pages; the page asks for TypeScript 4.5 or higher with experimentalDecorators and emitDecoratorMetadata enabled in tsconfig.json, which are setup requirements, not runtime values. The README's example declares entities with decorators and reads them through a repository, and the feature list names an entity manager, a query builder with joins and pagination, migrations with automatic generation, and a CLI.
