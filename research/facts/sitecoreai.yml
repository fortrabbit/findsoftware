notes: >
  Discovery name XM Cloud: the old product URL https://www.sitecore.com/products/xm-cloud answers 200 and lands on the SitecoreAI page, and the docs still name an "XM Cloud plugin"; no page states the rename in words, so the record is named by the product page. The product page leads with SitecoreAI; the Sitecore Cloud Portal product page is the access point. Sitecore Holding II A/S, a Danish limited liability company (CVR 37624071), is the group the privacy policy and terms of use name as operator of sitecore.com; the maintainer follows the footer copyright line, and the legal notice address is the Copenhagen address on the terms of use. The SitecoreAI user security page says authentication and user creation are managed by the Sitecore Cloud Portal; the Cloud Portal SSO page names OIDC and SAML. The SDK for the front end (Sitecore/jss, Apache-2.0, 275 stars at read time, the npm package @sitecore-jss/sitecore-jss-nextjs at 22,929 downloads for 2026-10-26 to 2026-11-01) is an SDK repository and goes to notes only. The product page names Next.js, Angular and .NET Core for the front end; no basedOn statement is recorded. The product page gives no price, and no pricing page is linked from it. The on-premises Sitecore XP product is a separate record (sitecore), not this one.
