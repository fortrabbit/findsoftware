notes: >
  The repository has no homepage: the GitHub homepage field is empty, and the npm homepage https://jaredreich.com/pell answers 404, so no site is recorded. The README names no project site, only the repository, the CDN and the npm package. The README opens with a link to a v2 working branch and project board; that is development work, not a release, so currentMajor stays 1 from the v1.0.6 release. The release list runs from v0.2.2 (2017-07-10) to v1.0.6 (2018-12-05) and npm starts at 0.1.0 (2017-07-08), so firstRelease is 2017. The last release is more than four years before the import date, so the import will move the record to stub under the listing rule; the status stays accepted as the CSV row has it. The README has a Comparisons table of other editors (squire, medium-editor, quill, trix, ckeditor, trumbowyg, summernote, draft, froala, tinymce) that compares sizes and jQuery, Bootstrap and React support; its heading is the quote for alternativeTo, which lists only the peers that have a record (medium-editor, ckeditor5 for ckeditor.com, draft-js, froala). The README lists framework examples for React and Vue, which are not recorded as basedOn because the README names them as examples only. The browser support list in the README is not recorded as runsAs. The script tag install route is quoted from the README heading that introduces the HTML example, which loads the library from unpkg; the tags themselves are code and the README gives no sentence before them.
