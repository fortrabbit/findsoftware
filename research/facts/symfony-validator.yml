notes: >
  Status accepted from the CSV row. Criterion 4: the newest stable release is v8.1.11 (2026-11-04); v8.2.0-BETA2 is published on GitHub with the prerelease flag unset, but its tag names a beta, so it is recorded as latestPrereleaseDate and not as a release. The repository is a read-only split of symfony/symfony (the README sends issues and pull requests to that main repository), so stars, contributors and downloads here belong to the split; the monorepo is not recorded as a figure. The homepage symfony.com/validator redirects to symfony.com/packages/validator, which is recorded. First release: the tag v2.0.0 is dated 2011-07-20, Packagist's first upload 2011-09-29, and the Symfony packages page says October 2011; all give 2011. The maintainer is the LICENSE copyright holder, Fabien Potencier. The legal notice on symfony.com names Symfony SAS (France) as the trademark owner; that is a different legal entity from the recorded maintainer, so no hqCountry is recorded for the maintainer and the company is a gap a reviewer may settle. The Symfony packages page shows Dependents 3,952, which differs from ecosyste.ms (3,053) and is not recorded. The page also lists projects built on the validator (Drupal, TYPO3, PrestaShop and others); these are named dependents, not an install count. The validator is a component of the Symfony framework; no page says it is based on Symfony, so basedOn is unset. The validation guide says the component is based on two concepts, constraints that define the rules and validators that hold the validation logic; the repository README says it follows the JSR-303 Bean Validation specification. The translations page says the constraints used in forms can translate their error messages, so i18n is scoped to those messages. The README and the guide name no accounts or forum of the component itself; the symfony.com footer accounts belong to the Symfony project.
