notes: >
  The CSV lists the homepage over plain http; the same page answers 200 over https (https://necolas.github.io/normalize.css/), so the https address is recorded. The project has tags but no GitHub releases: the highest stable tag is 8.0.1, the same version as the npm latest, and the npm upload time for 8.0.1 is the latestReleaseDate. That release is older than four years, so the import moves the record to stub by its release rule; the status stays accepted here, and no end signal was found (the README and homepage carry no end-of-life notice, the repository is not archived, and the npm latest is not deprecated). The LICENSE names Nicolas Gallagher and Jonathan Neal as copyright holders; the maintainer is recorded as both names, as the LICENSE gives them; the repository owner is Nicolas Gallagher. The npm range is 2026-10-18 to 2026-10-24. The category css-reset is not in the field dictionary, so the record uses css-framework. The README's Gitter chat link is not a field. The npm figure counts the normalize.css package. The firstRelease year comes from the npm upload of 0.0.1 on 2012-06-08; the GitHub repository dates from 2011, and no GitHub release exists to compare.
