notes: >
  The project has no website of its own: the gemspec homepage, the RubyGems homepage_uri and the README all point to the GitHub repository, so no homepage is recorded (repo-only project). The gemspec metadata names documentation_uri https://guides.rubyonrails.org/i18n.html, which is the Rails Guides page and not the project's own documentation, so it is not recorded as docs; the README's wiki link is recorded. The README says "You will most commonly use this library within a Rails app" and "We support Rails versions from 6.0 and up", and it also documents use without Rails; the gem is not built on Rails, so no basedOn is recorded. The gemspec description is "New wave Internationalization support for Ruby." The README says "Currently maintained by @radar"; the maintainer follows the LICENSE copyright line, which names "The Ruby I18n team" and carries the 2008 date. The gemspec authors field lists six people. The gemspec requires concurrent-ruby ~> 1.0 as a dependency, not recorded. The README lists pluralization (CLDR compatible), an ActiveRecord backend that stores translations in a database, and a KeyValue backend, as coined features and backends, kept in notes. The runtimeMin is from the gemspec at the v1.15.2 tag, the latest release. The first tag v0.2.0 is dated by its commit (2009-07-12); the oldest RubyGems upload is 0.1.0 (2009-07-25). The latest GitHub release v1.15.2 is dated 2026-06-19, the same day as the RubyGems version. Stars and contributors belong to the single repository.
