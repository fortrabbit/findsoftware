notes: >
  Boundary ruling for wave 62: node-tap is a testing library and command line runner, accepted under the test-runner category (testing); the CSV status accepted stands. The record is the package tap, which the install docs name, inside the tapjs monorepo: stars and contributors belong to the monorepo, and the npm figures are for the tap package. The highest stable GitHub release is tap@21.8.0 (2026-09-03), which sets currentMajor 21; npm lists tap 21.8.1 as latest (2026-11-03) with no GitHub release object, so latestReleaseDate takes the newest stable registry release by date. The npm package named node-tap was published in 2023 and unpublished, so it is not the registry id. The homepage field on GitHub and the README link the site over http; the https address answers 200 and is recorded. The docs are the site at node-tap.org, whose Getting started guide is the basics page; the install step there is the npm route. The license is the Blue Oak Model License 1.0.0 in src/tap/LICENSE.md; the root LICENSE.md only says that each package under src/ carries its own license, and the repository's other packages are not recorded. The maintainer comes from the author field of the tap package manifest, since the Blue Oak license has no copyright line. The runtimeMin comes from the engines field at the tap@21.8.0 tag. The README calls it a TAP test framework for Node.js; the site also states it supports TypeScript, ESM and CommonJS, which are compatibility statements, not fields. The site lists a Matrix chat room and a GitHub Sponsors page; neither is a field kind, so both stay out of the record. The site documents a nock plugin that loads nock into tap tests and a sinon plugin; these are plugins of tap, so nock gets no basedOn or alternativeTo. The synonyms plugin page explains aliases of assertion names and is not a comparison page. The TypeScript source under src/ is reported by GitHub as JavaScript, recorded as the API states it.
