notes: >
  Criterion 3 is in doubt: the GitHub README and the npm package (which carries no readme field) show import examples from "ndx" and "ndx/query" but no install command, so a documented install is not found; a README install section or an install page would settle it. The repository has no GitHub release, and the npm package has 16 versions, the latest 2.0.1 (2023-03-14); the registry's stable version gives currentMajor, and latestReleaseDate follows npm. The last commit on the default branch is 2023-03-15, so the project is under the four-year limit of criterion 4 until March 2027. The README badge links github.com/ndx-search/ndx; GitHub resolves that address to localvoid/ndx, so the repository is recorded at localvoid/ndx. The homepage field on npm points to the same repository, so no homepage is recorded. The README calls the library a lightweight full-text indexing and searching library for documents stored on disk (IndexedDB), and names no runtime; runsAs is not recorded. The npm weekly figure is the sum of the range 2026-09-28 to 2026-10-04, a full week. The README describes BM25 ranking, per-field score boosting and a trie-based inverted index, and states that queries support only disjunction operators and that the index stores no term locations. It names alternative solutions (a uFuzzy benchmark link and fst) without a migration or comparison page, so alternativeTo is not recorded. The HTTP Archive technologies list does not carry ndx.
