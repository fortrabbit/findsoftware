notes: >
  Foundation: the homepage says "We are a Cloud Native Computing Foundation incubating project", and the footer names The Linux Foundation. The foundation is hosting and is not recorded as maintainer. The LICENSE file has no copyright line, so the maintainer is the project name as the homepage uses it. Reviewer decision if a legal entity should be added.
  Inspiration: the homepage says OpenFGA "takes the best ideas from Google's Zanzibar paper". This is not a software basis, so basedOn is not recorded.
  SDKs (coined sdkLanguages, notes only): the install SDK page lists the Node.js package @openfga/sdk on npm, the Go module github.com/openfga/go-sdk, the .NET package OpenFGA.Sdk, the Java package dev.openfga:openfga-sdk, and the Python package openfga-sdk on PyPI, plus the fga CLI. The homepage says "SDKs for the most popular languages have already been written". The SDK packages are the apps' integration point; their downloads are not recorded here.
  Wiring: the homepage says the SDKs make it "easy to integrate and grow alongside your applications", and the API reference describes authorization checks, which is the route applications call.
  Authorization calls: the homepage says OpenFGA "is designed to answer authorization check calls in milliseconds". The docs navigation lists modeling, relationship tuples, check and list-objects requests. The homepage says the project is "a Cloud Native Computing Foundation incubating project".
  Playground: the README calls it "intended for local development only" and says it can only connect to a server on localhost. The configuration page says datastore engines are memory, postgres, mysql and sqlite; memory is not recorded as a database.
  Auth: the docker page shows the server can use preshared keys or OIDC for API authentication (authn-method options). Not recorded as sso because the field describes single sign-on for people, and the option authenticates API callers.
  Hosted: the homepage links "Auth0 FGA Playground" in the resources section; no page read states that a hosted service runs this code, so hostedOffering is not recorded.
  Community: the community page links GitHub Discussions (recorded as forum), a YouTube channel (recorded), a CNCF Slack channel and LinkedIn, which have no field. Adoption: the homepage's "Adopted by teams at" logos and the adopters page name companies; they are not recorded as fields. The Docker Hub pull count is for openfga/openfga, the image the README names.
