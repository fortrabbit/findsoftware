notes: >
  The repository lists http://bearclaw.blog as its homepage. On 2026-10-23 the host answered over plain http only (the HTTPS handshake presents a certificate for *.github.io), and the page, titled "bearclaw blog", says it was made with bearclaw and describes bearclaw as a tiny static site generator. A plain-http site is not linked, so homepage is not recorded; the software is still shown there, so status is not stub. The latest stable release is v2.2.0 (2023-11-18); v1.2.x are marked prerelease on GitHub. The oldest release is 1.0.0 (2023-02-12). The advanced-options page lists the flags -input, -output, -plugins, -templates and -watch; the build command is "go build" per building-from-source.md. Plugins are HTML documents dropped into a plugins folder as zip files.
