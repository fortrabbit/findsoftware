notes: >
  The record is the library, not a server: the about page calls it "an in-process library" with no separate server process, so no runsAs and no runtime are recorded; the sqlite3 command-line tools in the precompiled binaries are a developer tool and no runsAs local statement is recorded. The canonical source is the Fossil repository at sqlite.org/src; the GitHub repository sqlite/sqlite is an official Git mirror ("Official Git mirror of the SQLite source tree", GitHub API description), and its 10857 stars are the adoption figure recorded, dated 2026-10-30. The mirror's contributor count is not recorded because the project does not take outside contributions ("Open-Source, not Open-Contribution" on the copyright page). The latest release is 3.54.1 (2026-10-16); the major is 3, from the endoflife.date cycle 3 with eol false. The project's own start date is 2000-05-09 ("The SQLite project was started on"); version 1.0 followed on 2000-08-17 per the chronology page, so firstRelease agrees with the project's own year. The public-domain statement is the license and is recorded as its own wording, public domain; the copyright page's "Open-Source, not Open-Contribution" wording is the licenseModel quote. The paid-support page names the company as Hipp, Wyrick & Company, Inc. (Hwaci), a Georgia corporation with headquarters in Charlotte, North Carolina; the copyright page calls Hwaci the company that employs the developers. No page names a country, so hqCountry is absent. Hwaci sells a Warranty of Title, a legal document, not an edition; no paidEdition is recorded. The project's own estimate, not a count and so not a reportedInstalls field, is worded "it seems likely that there are over one trillion (1e12) SQLite databases in active use". The homepage's "most used database engine in the world" and the about page's "most widely deployed database" are comparative claims and are not recorded as fields. The Docker Hub and package registry figures are not recorded: no install route names a registry package. The support page's "SQLite Forum" is the public forum the project names as preferred; the quote is the text around the link. The keyword "database" is the category; the databases field is absent because SQLite is the database itself, not a software that offers a choice of databases.
