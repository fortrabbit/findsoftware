notes: >
  Boundary row, accepted: the docs say each script and flow gets autogenerated webhook endpoints (docs/core_concepts/webhooks, "Each script and flow created in Windmill gets autogenerated webhooks"), and the homepage says a function "becomes an API endpoint and a form", so a site or app calls it; this meets the wiring rule, not an API over its own data.
  The LICENSE file names three licenses and the README says the binary without the enterprise feature flag is AGPLv3; each statement is its own license entry, and the terms page (windmill.dev/terms/2026-07-21, "Windmill self-hosted license terms") covers the self-hosted Enterprise plans, not the open-source binary.
  The homepage footer gives Windmill Labs, Inc. at 1111B S Governors Ave STE 6013, Dover, DE 19904, USA; the terms are governed by California law; the homepage says 'Made with passion in San Francisco and Paris'.
  The docs say the self-hosted server runs in server mode and worker mode as separate containers, and the Helm chart is for Kubernetes; the repository README names the Rust backend and a Svelte 5 frontend; the Caddy proxy is part of the Docker Compose setup.
  Scripts run in 20 or more languages (homepage, docs intro); that is what the platform executes, so no runtime fact is taken from it.
  The homepage's "Trusted by 10,393 instances" is the only install count; the terms (section 3.5) say self-hosted installs send lightweight telemetry, which is not recorded as a fact.
  The repository has no GitHub release before v1.6.0; the oldest release is v1.6.0 from 2022-05-10, so firstRelease is 2022.
  The install image is ghcr.io/windmill-labs/windmill through the compose file's WM_IMAGE variable, not Docker Hub, so no dockerPulls figure is recorded; the npm package windmill-cli is a client and is not recorded.
  The docs' webhook page names the version-pinned flow webhooks; the peers page names Zapier and Make only as examples it does not compare itself to; Retool, Lovable, Superblocks, Replit and dbt have compare pages but no record here. Hatchet, Tooljet and Appsmith are in alternativeTo from the peers page. The README alternative sentence also names Lovable and Retool, which have no fact file.
  Coined fields not in the dictionary: linkedin (https://www.linkedin.com/company/windmill-dev/), SOC 2 Type II (trust.windmill.dev), and the Enterprise-only features (audit logs, git sync, dev, staging and prod environments) which sit in the pricing table.
  The discord invite in the footer, discord.gg/aT3NhuxSK4, is a second invite to the same community; the nav and social row link discord.com/invite/V7PM2YHsPB, which is the one recorded.
  The footer "Questions" link (questions.windmill.dev) is a label without a sentence, so no forum fact is recorded.
  The integrations hub (hub.windmill.dev) is a script and integration catalog, not a plugin repository, so no pluginDirectory fact is recorded.
  The LICENSE file says the Community Edition in the ghcr.io/windmill-labs/windmill images and the GitHub binary releases contains the AGPLv3 and Apache 2 sources plus proprietary, non-public code, free to use without restrictions other than the in-software limits and quotas, and not to be sold, resold, served as a managed service, modified or wrapped without an agreement; only a binary compiled from source without the enterprise feature flag is AGPLv3. The README line 'Windmill is fully open-sourced (AGPLv3)' predates that clause in the same file.
  SAML and SCIM are Enterprise Edition features (docs/advanced/saml_and_scim: 'This feature is available under Enterprise Edition'). The OAuth and SSO page lists Google, Microsoft, Okta, GitHub, GitLab, Jumpcloud, Keycloak, Authentik, Authelia, Kanidm, Zitadel, Nextcloud and PocketID as sign-in providers.
  Workspace roles are Developer and Operator, with Admin as a flag on top; Enterprise users can add custom roles.
  importsFrom is left out: the Pipedream compare page gives a migration path (export each project as a ZIP and convert it with a coding agent prompt) but no import tool. headlessApi is left out: the docs describe HTTP APIs with an OpenAPI spec, but no page calls them REST.
