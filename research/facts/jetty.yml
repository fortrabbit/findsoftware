notes: >
  The homepage names Webtide as the company that funds and develops Jetty; the footer reads "Copyright © 2008-2026 Webtide", and the Eclipse Foundation hosts the project and holds the Eclipse trademark, which the homepage states, so the Foundation is named as host, not as maintainer or parent. Jetty is dual-licensed: the NOTICE file names the Eclipse Public License v2.0 and the Apache License 2.0 as "or" alternatives, and the homepage says "under both the EPL2 and Apache2 licenses"; two license entries, one per alternative. The LICENSE file at the 12.1.14 tag is the EPL 2.0 text. GitHub detects no license (NOASSERTION). Highest stable GitHub release is jetty-12.1.14 (2026-10-05), in major 12, the same major as jetty-12.0.40. Java 17 is the minimum on the docs index for the 12.1 line. The download page lists 11 and 10 as EOL and the endoflife.date record covers 12.1 and 12.0 as supported. The Docker image library/jetty is named nowhere on the pages read, so its pull count (46,646,587 on 2026-10-29 from Docker Hub) is not recorded as dockerPulls. firstRelease follows the project's own version table on the download page, which lists Jetty 1 from 1995; the oldest Maven Central upload of org.eclipse.jetty:jetty-server is 7.0.0.M0 (2009-04-03), GitHub's oldest release is jetty-9.4.32 (2020) and its oldest tag is a 2009 repository import. Webtide support is a paid service, not an edition, so no paidEdition is recorded. The project's mailing lists (users and dev, on dev.eclipse.org) are not a forum field. The Jetty 12.1 Operations Guide and the download page were read; no page read states a daemon or service unit, and runsAs always-on rests on the "standalone server" statement.
