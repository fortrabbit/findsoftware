notes: >
  The homepage http://skf.jeannedhack.org/ does not resolve: the host has no DNS record (NXDOMAIN) and neither http nor https answered on 2026-10-23. No page of the project's site was read, so the status fact cites the address without a quote. The status is stub without a homepage, as in bowman.yml. The README still gives install steps (make install from the source tree, and an Arch Linux AUR package named skf-framework), so criterion 3 holds. The repository has no releases or tags; lastCommitDate is the committer date of its newest commit on master. The README does not describe what the software is, so the description is the repository description. The skf script starts with a bash shebang, which is the runtime fact, and carries the copyright line used as maintainer. Its header grants GPL version 2 or later while the LICENSE file and GitHub give GPL version 3, so both are recorded as license statements.
