notes: >
  Monorepo (assistant-ui/assistant-ui); the install docs name @assistant-ui/react, and the CLI package assistant-ui is the scaffolder that the docs run with npx, so the npm figures come from the React package. The GitHub release list carries per-package tags; the newest stable tag of @assistant-ui/react is 0.15.31 (2026-10-22), so currentMajor is 0. The npm weekly figure is the sum of the daily downloads API for 2026-10-18 to 2026-10-24. The README lists backend integrations for the Vercel AI SDK, LangGraph, LangChain and other agent protocols, and says the CLI starter comes in a Base UI or Radix UI flavor. The README names the license as MIT with an optional Assistant Cloud; the pricing page offers a free tier and paid cloud plans without prices here. The library's MIT license is a fact of the open package; assistant-cloud is recorded as hostedOffering because the pricing page describes it as optional and separate. The first npm upload of @assistant-ui/react is 0.0.1 on 2024-05-07 and the first GitHub release is v0.0.1 on 2024-05-14, so firstRelease is 2024. basedOn React is taken from the README phrase "TypeScript/React library" and not from a React package dependency. The homepage describes runtimes for React, Vue, React Native and the terminal; the Vue and Ink packages are not separate candidates.
