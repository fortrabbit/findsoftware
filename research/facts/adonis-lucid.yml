notes: >
  The homepage quote is from the docs introduction page, which the site serves as its front page. The npm figure is the package the installation page names, @adonisjs/lucid; the CSV figure of 90.9k a week is a stale point count. The release tag v22.4.2 is dated 2026-04-05 and the 22.x line is the current major; the 21.x line is older and the v22.0.0-next tags are prereleases. The installation page shows npm, yarn and pnpm as tabs, and only the npm command is in the static text, so only the npm route is recorded. The homepage says "Lucid is built on Knex", and the README says "built on top of Knex"; Knex has no record, so it stays in notes, and the homepage's "Lucid is the database layer AdonisJS is built around" describes a component of the framework. The README calls Lucid "SQL ORM for AdonisJS", the project naming its parent, so basedOn is adonisjs. The homepage quote for databases lists PostgreSQL, MySQL, SQLite, MSSQL and LibSQL; LibSQL has no value in the databases dictionary, so the recorded value omits it. The LICENSE copyright line names Harminder Virk, and the GitHub owner is the adonisjs organization; the copyright holder is recorded as the maintainer and the organization stays in repoOwnerType. The firstRelease year comes from the GitHub tag v3.0.0 dated 2016-06-26; the npm history starts at 4.0.0 on 2017-07-16. The package.json engines field at the v22.4.2 tag states node 24 or later, so runtimeMin is 24. The GitHub figures are taken on 2026-11-04. The homepage says models extend the generated schema classes and inherit column types without declaring them twice; Lucid generates database/schema.ts from the live database after migrations run. The homepage says Lucid "combines a Knex-powered query builder with class-based Active Record models, hand-written migrations, and schema classes", and the installation page says that for an existing AdonisJS application Lucid is installed from the npm registry.
