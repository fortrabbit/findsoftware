notes: >
  Homepage: monkeywebserver.com answers 200 and is the project's own GitHub Pages site (footer "Copyright Monkey Software 2025"). Its "Latest Release" block still shows Monkey v1.6.9 (June 2016), and its documentation page covers only the 1.6 and 1.5 lines, with the current docs in the monkey-docs repository; no end statement was found. The repository's GitHub owner is named "Monkey I/O" while the NOTICE names Monkey Software LLC; the NOTICE is the legal name recorded. License: the homepage says "Monkey is under the terms of the Apache License v2.0", the same license as the API entry, so one entry is kept. Releases: the GitHub release v1.8.7 (2026-04-14) is the latest; tag v1.8.10 (2026-09-21) has no release and is not recorded as latest. firstRelease 2001 is the first changelog entry in ChangeLog.old, which calls itself "Primera version" for v0.0.5. The GitHub tags begin at v0.10.0-rc1 (2010), so the repository's own history is the older source. Install: the homepage shows a ./configure route for version 1.6.9; it is not recorded because the README gives the current build. runsAs always-on rests on the README's "works both as a standalone web server"; the -D daemon flag alone is not a statement. The Twitter link is the legacy domain for X. Fields coined: none.
