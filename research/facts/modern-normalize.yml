notes: >
  The package is CSS: its only file is modern-normalize.css, so language is CSS even though the GitHub language field reads TypeScript. The README compares the stylesheet with normalize.css under "Differences from normalize.css" and says it is smaller, so the relation is recorded here only as text; no forkOf, basedOn or alternativeTo field is set, because the README does not call it a fork or port. The license file carries the copyright lines of Jonathan Neal and Nicolas Gallagher beside Sindre Sorhus, the normalize.css authors; the record names the maintainer from the first line. The README line "The goal of this project is to make itself obsolete" describes a goal, and the README says "Maintained", so it is no end signal. The npm weekly figure is the sum of the daily download counts for 2026-10-18 to 2026-10-24; the README lists download links and CDN links (jsDelivr, unpkg, cdnjs). The GitHub release list starts with v0.6.0 (2019-12-23) and the npm registry starts with 0.1.0 (2018-02-08), so firstRelease takes the older registry upload. The category comes from the npm description "Normalize browsers' default style"; the README states none. The project has no homepage field and no separate site; the README is the documentation.
