notes: >
  The CSV lists the homepage as http://scalatra.org; the https address answers 200 and the http address redirects to it, so the https address is recorded. The site has no end signal: its latest news item is dated 2024 but the repository is pushed to on 2026-10-25 and the Maven artifacts run to 3.2.1. GitHub has no releases, only tags: the latest stable tag is v3.2.1 and the oldest registry upload is scalatra_2.8.0 1.2.1 (2010-07-20), and the repository has no GitHub release to date from, so firstRelease is taken from Maven. The GitHub license API reports NOASSERTION; the LICENSE file is the two-clause BSD text with the copyright line for Alan Dipert, a named contributor and not the maintainer, and it names no SPDX id, so BSD-2-Clause is the identification of that text and the file's own words are quoted. The Scalatra 3 guides name Twirl; the guide says Scalate integration was dropped in 3.0, so no Scalate templating is recorded. The internationalization guide reads "This guide still needs to be written", so i18n is unknown. The site describes Scalatra's DSL as Sinatra-style; that is a stated design resemblance, not a parent, so no basedOn is recorded. The install docs name the giter8 template repository; the maven artifact recorded is the Jakarta build of the core module for Scala 2.13, which the guides name for Servlet 5 and 6 containers, and the javax build is not recorded separately; the guides name the javax artifact for Servlet 4.0.1. Persistence guides show H2 as the example database and name MySQL and PostgreSQL as drop-in alternatives through Squeryl's adapters.
