notes: >
  The project's homepage https://grazedocs.io/ answers with a page that says "Sorry, the website has been stopped" and "Website not found" under an aaPanel footer, so no homepage is recorded and status is stub, as with bowman. The README still points to that address for more documentation; the docs folder in the repository is the only documentation read. The repository has no GitHub release, so currentMajor, latestReleaseDate and firstRelease come from the NuGet package, the install source the docs name; the earliest NuGet version is 1.0.0.1 (2019-03-18), which sets firstRelease, and the latest is 2.0.2 (2021-04-23). The repository has tags v2.0.0 to v2.0.2 without release pages. The NuGet count is total downloads. The repository was last pushed on 2021-04-23. The docs publish output is a folder of HTML files, which the runsAs quote supports. The README and QuickStart do not state a minimum .NET version, so runtimeMin is unknown.
