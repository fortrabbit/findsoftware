notes: >
  The CSV homepage is the GitHub repository; guzzlephp.org does not resolve (DNS failure), so the documentation site docs.guzzlephp.org, which answers 200 with the Guzzle docs, is the homepage and the docs fact. Boundary ruling for wave 60: Guzzle is an HTTP client and is in. The LICENSE file names seven copyright holders from 2011 to 2016 (Michael Dowling, Jeremy Lindblom, Graham Campbell, Márk Sági-Kazár, Tobias Schultze, Tobias Nyholm, George Mponos); the README names no maintainer, so the maintainer is the first LICENSE holder, Michael Dowling, and the other six holders are the LICENSE and composer.json authors; the docs footer reads "Copyright 2015, Michael Dowling". The README gives Stack Overflow (tag guzzle), PHP-HTTP Slack and Gitter for support; the Stack Overflow tag is recorded as forum. The README and the docs say the package is an HTTP client for PHP, and the PSR-7, PSR-18 and PSR-15 mentions name interfaces, not a parent project, so no basedOn is recorded. The Tidelift line in the README is paid support for the dependency, not an edition, so no paidEdition is recorded. The README version table gives 8.3 as latest and 7.16 as maintenance, and endoflife.date lists 8 and 7 as not end of life; the docs overview page still states "PHP 7.2.5", which conflicts with the ^7.4 requirement in composer.json at 8.3.1, and runtimeMin follows the manifest. The first release is the oldest tag, v1.0.0beta1, committed 2011-03-02; the Packagist package was first published 2011-11-14. The highest stable GitHub release is 8.3.1 (2026-10-25), which matches the Packagist stable version, and the 7.16.1 release has the same date. The Packagist figure is the total of all downloads of guzzlehttp/guzzle, and dependent counts are from ecosyste.ms for the Packagist package. Stars and contributors are for the repository.
  The README bullets name synchronous and asynchronous requests through one interface, streamed uploads and downloads, PSR-7 and PSR-18 interoperability, transport independence from cURL, PHP streams or sockets, and middleware. The README version table marks the previous major line as Maintenance, and the docs site is at docs.guzzlephp.org.
