notes: >
  The homepage answers over https and is the project's own site; the GitHub mirror says "main repo still on lighttpd.net", so the repository is the mirror the GitHub API reports, and the lighttpd.net source is not separately read. The license is stated two ways, the GitHub API (BSD-3-Clause) and the homepage ("Open Source revised BSD license"); both are recorded and agree, and the COPYING file is the BSD text. The COPYING copyright line names "Jan Kneschke, incremental"; incremental is a second name in that line and is not recorded as the maintainer, and the wiki and homepage name no maintainer or legal entity, so the maintainer follows the line and a reviewer should decide whether the project's current maintainer is "lighty labs" as the site title shows. No hqCountry was found on a page naming the country. The release line is lighttpd-1.4.x, a semver-style number whose major is 1; the newest stable is 1.4.85 (2026-07-08) per the wiki and homepage. The forum board URL linked from the homepage answered 402 to curl, so it is recorded from the homepage statement only; IRC on libera is named on the wiki and has no field. The GitHub repository has no releases, only tags; the release date comes from the wiki's Latest Release line and the homepage news. The oldest entry in NEWS is 1.0.2 (2004-02-07), and the NEWS file is the project's changelog, so firstRelease is 2004. The install page names the build frameworks automake, cmake, meson and scons, and a PCRE build dependency; these are build requirements, not a runtime minimum. The module list on the configuration options page names mod_fastcgi, mod_proxy and mod_openssl; the proxy module is not a reverse-proxy statement and categories stay web-server. Fields coined here: none.
