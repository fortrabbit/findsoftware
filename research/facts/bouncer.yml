notes: >
  The GitHub repository has no homepage field and the project names no site of its own, so homepage is absent and the README is the docs. The README's first sentence calls Bouncer "framework-agnostic", and the install section has two routes, "Installing Bouncer in a Laravel app" and "Installing Bouncer in a non-Laravel app", both starting with the same composer command; the package requires illuminate/* packages, which is a dependency and no basedOn statement, so basedOn is absent. The CSV's laravel tag is not a category here; the README's own wording is "roles and abilities". The Alternative section names spatie/laravel-permission as a package that "nicely integrates with Laravel's built-in gate", and the CSV row for laravel-permission is a candidate without a fact file, so alternativeTo is absent until that record exists; a reviewer should add it then. The composer.json at v1.0.4 names "php": "^8.2" and the README note says v1.0.2 requires PHP 8.2+ and Laravel/Eloquent 11+ with older Laravel lines on older releases; the runtime is the composer manifest value. The LICENSE copyright line contains the name in angle brackets, which is recorded without them. The first Packagist version is v0.0.1 dated 2015-09-17, earlier than the first GitHub release (v0.0.22, 2015-11-22), so firstRelease is 2015. The Packagist name silber/bouncer differs from the repository owner, as the install docs name it. The ecosyste.ms figures are for the Packagist package silber/bouncer. No Blade directive is recorded: the README says "Bouncer does not add its own blade directives" and points to Laravel's @can. The README's feature statements, kept as notes for the prose: it grants abilities to users and roles, restricts an ability to a model type or a model instance, forbids an ability, lets a user or role own a model, and checks abilities at Laravel's gate, where "Bouncer will automatically be consulted".
