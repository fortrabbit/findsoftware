notes: >
  The build command is "minista build" with output in dist/ (build and deploy guide), and the homepage says "Write content in Markdown or combine it with JSX in MDX." The site footer reads "© 2021-present QRANOKO" and the homepage says "minista concept by Qrac"; the LICENSE in packages/minista reads "Copyright (c) 2021 Qrac". The maintainer field takes the LICENSE name. The GitHub API reports license null because the LICENSE sits in packages/minista, a monorepo with packages minista and create-minista. The install command runs create-minista, so the registry figures come from the core package minista. GitHub counts JavaScript as the main language and TypeScript second. The docs are in English and Japanese. The homepage also states interactive islands and client-side JavaScript, which the rendering fields do not hold.
