notes: >
  Both installation pages (archive download, Apache and Nginx setup) state the setup is a testing environment on a local server, not recommended for applications deployed to production; they do not say how a live site runs, so runsAs stays unknown.   The install page documents a download of the archive, not Composer; the Packagist package kumbia/framework is the only registry entry for the framework and is used for the registry figures, although the install docs name no package. The Packagist latest version v1.2.1 requires PHP >= 8.0, which matches the install page; the master composer.json requires PHP >= 8.1, so the release and master disagree. The README says v1.2 needs PHP 8.0 as a minimum and older versions PHP 5.4. The GitHub release is dated 2024-04-16 while Packagist dates v1.2.1 2024-03-30. The homepage redirects to a blog page in Spanish; the install and the manual are in Spanish and English in the KumbiaPHP/Documentation repository. The composer.json lists the forum, a Google group and a Slack channel as support channels, not recorded as fields. firstRelease is not stated on a readable source; the LICENSE copyright starts in 2005.
