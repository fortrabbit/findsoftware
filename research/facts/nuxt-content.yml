notes: >
  The record covers the module only; the visual editor is the separate record nuxt-studio, which the homepage names as "our visual editor", so no adminUi is recorded here. The homepage footer links an X account named nuxtstudio, which belongs to the editor, so x is not recorded. The server deployment page asks for an OS with glibc newer than 2.29 when the default better-sqlite3 connector is used. The homepage feature list says "SQLite powered" for the query layer and the define page lists the databases the module works with; the content itself stays in flat files. The engines field of the npm package states ">= 20.19.0", so runtimeMin is the Node major 20. The homepage calls the project "The git-based CMS for Nuxt projects" in its title and "File-based CMS" in its feature list; the record uses "file-based", as the feature list does. The LICENSE copyright line names "Nuxt Project", and no legal entity appears on the pages read. The GitHub organisation nuxt-content owns nuxt-studio, a separate record. The Markdown files page says "use the MDC syntax to integrate Vue components" (https://content.nuxt.com/docs/files/markdown). The installation page tells the user to "Create a content.config.ts file" for the first collection (https://content.nuxt.com/docs/getting-started/installation). The static deploy page says "Nuxt Content will load the database in the browser using WASM SQLite" (https://content.nuxt.com/docs/deploy/static). The categories fact keeps only "File-based CMS" from the homepage; the module is also a Nuxt module, which the basedOn fact holds.
