notes: >
  Wiring into an app: the eSignature API page says the API lets a developer "Programmatically create, send and track signature requests with a free, open-source eSignature API and webhooks" (https://www.opensignlabs.com/esignature-api), and the API v1.2 reference lists Documents, Templates, Contacts, Webhook and Folder groups (https://docs.opensignlabs.com/docs/API-docs/v1.2); that is the criterion 1 basis. The GitHub API reports the license as NOASSERTION; the README and LICENSE give AGPL-3.0 and the carve-out above. The LICENSE file names no copyright holder; the maintainer is the company named in the terms and conditions, "Qik Innovations Pvt Ltd" in the contact block and "Qik Innovations Private Limited" in the opening paragraph, recorded in the longer form. The privacy and terms pages name no country or address, so hqCountry is absent. The README names the X account @opensignlabs while the homepage links opensignhq; the homepage link is recorded. The terms call OpenSign "a SaaS solution", and the self-host docs describe the same product, so the cloud is a hostedOffering fact. Cloud plans are on a page that did not render its text, so no pricing or freeTier fact is recorded. The README features list names multi-signer support with signing links, templates, audit trails with a completion certificate, and an API. The Docker route downloads docker-compose.yml, a Caddyfile and an env file for the operator's HOST_URL. The homepage also links LinkedIn, which has no field. The homepage advertises a free plan with unlimited e-signatures, not recorded as freeTier because the field is coined (notes only). The npm registry holds no OpenSign server package. The README also links a DigitalOcean one-click deploy (a badge, not text, so no installMethod fact is recorded). The default Docker compose stack needs MongoDB without authentication, per the warning on the run-locally page, which the docs state as a security note.
