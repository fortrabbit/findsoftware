unreadable:
  - https://wp2static.com (the homepage named in the README, composer.json and plugin header; checked 2026-10-21 with curl over http and https, no HTTP response (exit 000); the requester reports a 301 to https://elementor.com/hosting/, not re-observed here; no homepage fact is recorded)
  - https://wp2static.com/documentation (docs link in composer.json, not reachable with the homepage)
  - https://wp2static.com/download/ (installer zip link in the README, not reachable with the homepage)
notes: >
  Criterion 3 is met by the README's installation options section: a git clone with composer install, composer require, and an installer zip. The README's clone address (github.com/wp2static/wp2static) and composer package (wp2static/wp2static) do not match the repository cited here (elementor/wp2static) or the composer.json name (leonstafford/wp2static); wp2static/wp2static returns 404 on Packagist, and leonstafford/wp2static is the Packagist package whose repository is elementor/wp2static. Packagist monthly downloads for leonstafford/wp2static were 29 at check time; only the total is recorded. Criterion 4: the README states, quoted as written, "Strattic is generously keeping the WP2Static plugin available and maintained for open source users!" It is recorded as stated and not as a verified maintenance signal; the default branch was last pushed 2024-02-14 and the latest tag is 7.2 from 2023-01-31. The project is not discontinued on any signal in the criteria. The wordpress.org plugin API returns "Plugin not found" for slug wp2static (checked 2026-10-21), so no pluginDirectory is recorded. The README's "A WordPress plugin" supports basedOn wordpress. runsAs is unknown: no page states that the output is static files or how the site runs; the README says only "static site generation". The plugin header lists the author as "Strattic by Elementor"; the maintainer is recorded as the README names it, and no parent company is recorded because no page says who owns Strattic.
