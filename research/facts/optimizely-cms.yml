notes: >
  The product page at optimizely.com describes a hosted, agentic CMS with front-end hosting and edge delivery, next to the self-hosted CMS 13 whose install guide covers a SQL Server deployment on .NET 10. The Optimizely docs name a separate hosted edition, CMS (SaaS), beside the self-hosted CMS 13, which the hostedOffering fact records. The install guide requires Opti ID and Optimizely Graph for CMS 13, both included in the license. The CSV row has no repository; the NuGet package EPiServer.CMS.Core is named by the release notes and the package-family page, but a NuGet search and the flat-container lookup on 2026-10-26 returned no record for it, so nugetName is not recorded and the release notes are the only registry-side statement. The release notes page is a running log, and the latest entry read is for EPiServer.CMS.Core 13.1.0 dated June 1, which is the major and date recorded here. The legal entity named on the privacy notice is Optimizely North America Inc. with Optimizely AB; no page read gives the company's seat, so hqCountry is not recorded.
