notes: >
  Doubt on criterion 4: the project page says "Development is currently paused while we focus resources on other projects. We hope to get back to it soon." A resumed release or an end statement settles it. The repository's homepage field and the Prossimo initiative page are the same link; the page is the River project page on the Prossimo site, and Prossimo is an initiative of the Internet Security Research Group. The CLI help names the project "A reverse proxy from Prossimo", so the maintainer follows the footer copyright line on the same site. The 548 Market St address is the group's address on its terms page; the page names no country, and the mailing address carries "USA". Status is stub because of the pause, which is no end statement. The README says "Until further notice, there is no expectation of stability." currentMajor 0 stands for the 0.x line. firstRelease 2024 is the Prossimo announcement date (2024-02-28); the oldest GitHub tag is v0.0.0 (2024-03-25) and the repository was created 2024-02-12. The install page lists builds for x86-64 Linux (GNU and MUSL libc) and aarch64 macOS. The user manual lives at onevariable.com, which the README links; the repository carries the same manual under user-manual/. Configuration is by KDL file (the CLI flags --daemonize, --upgrade and --pidfile are documented in the manual). runtimeMin not recorded: the Cargo manifests state no rust-version. The project exposes no registry package for install; the crate named river is not in the install docs. Fields coined: none.
