notes: >
  Hosted-service record: the product is managed Apache Solr hosting with no installable server, so criterion 2 is waived, and no prices are recorded. The pricing page's "Enterprise" plan is custom-priced and its features are plan terms, not an edition with a license; no paidEdition fact is recorded. The pricing page lists "Teams & Sharing" (invite colleagues or freelancers by email) and "IP Firewall & Private Net" and "Custom .jar Plugins" on the plans; none is a userRoles or sso statement, so those fields stay unknown. The provider's own repositories (github.com/phpcip) are client plugins and a sponsor page, not the service's source; they are not the record's repository and no GitHub figure is recorded. The footer carries "© 2011 - 2026 Opensolr.com" and the homepage says "Managed Apache Solr since 2011"; no firstRelease is taken from it. The homepage and the pricing page list a web crawler, hybrid search, a RAG API and a hosted search page as features of the service. The homepage claims about traffic and indexed data are vendor claims and are not recorded. The documentation says Solr versions 7, 8 and 9 are offered and that the region choice includes a Germany Solr 9 environment; a region list is not recorded beyond the privacy statement. The footer names ISO 9001 and ISO 27001 certification; not a schema field. The record is a hosted-service row, so it has no runsAs, runtime, license or release fields. The HTTP Archive technologies list names Apache Solr only and carries no Opensolr entry, so httpArchiveSites is not recorded.
