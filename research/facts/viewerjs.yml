notes: >
  Accepted: a JavaScript image viewer with modal and inline modes, published on npm and as a script for the browser; the GitHub repository, the README and the project's GitHub Pages site (fengyuanchen.github.io/viewerjs, named as the Website in the README) agree; the site carries the project's own documentation (Docs, Options, Methods), so it is kept as the homepage. The README install section gives the npm command, and the "In the browser:" block loads viewer.js and viewer.css by script and link tags from a path, which is recorded as no separate route beyond the CDN statement. The cdnjs project serves the CSS and JavaScript; that is a route in the README, recorded as cdn. The README lists browsers as the latest Chrome, Firefox, Safari, Opera and Edge and Internet Explorer 9 and later; that is a browser support list, so no runsAs is recorded. The README's jquery-viewer link is a separate jQuery plugin wrapper project and is not recorded. The site's Examples (custom title, custom toolbar, dynamic viewer, moving range limit, viewer in modal) are the project's own pages and are not facts. The repository topics and the 61 options and 23 methods are features of the README, not fields. The npm first upload is 0.1.0 (2015-12-24), the same day as the GitHub tag v0.1.0, which sets firstRelease. The latest release v1.15.2 is dated 2026-10-01 and is the highest stable release. The LICENSE copyright line names Chen Fengyuan, and the README gives the same name with a personal site link, recorded as the maintainer. The ecosyste.ms counts are for the npm package viewerjs. The site contains an outdated browser banner pointing to browsehappy.com; that is not a fact.
