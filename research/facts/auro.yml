notes: >
  The design system is a set of repositories, one per component, and the id stands for the set. The record's repository, stars, contributors and release figures are for auro-button, the representative named in the CSV; the npm figures are for @aurodesignsystem/auro-button. The auro umbrella repository is archived and holds only documentation. The npm weekly figure is the sum of the daily downloads API for 2026-10-18 to 2026-10-24. The npm package's first upload is 7.0.1 (2023-06-06), but the repository's GitHub releases begin at v2.5.6 (2019-05-23), so firstRelease is 2019. The site pages are a JavaScript shell, but its llms.txt is readable and gives the homepage, docs and category statements; installMethod comes from the component README. The auro-button package lists lit as a dependency in the npm registry, but no project page or README says Auro is built with Lit, so basedOn is not recorded. The footer says "Alaska Airlines Auro Design System"; the company's headquarters are not stated on the pages read (the site title gives Seattle, WA, which is not a country statement), so hqCountry is absent.
