notes: >
  A template folder holds html, subject and optional text files; the render call takes locals and returns the rendered string; the i18n option takes a configuration object that is passed to the ladjs i18n package. The CSV row names a forwardemail.net docs page as homepage. That page is a Forward Email tutorial on the company's own site, a copy of this README with a different title, so the project has no site of its own and no homepage is recorded; the repository is the project link. The forwardemail.net page's install block reads "npm install email-templates preview-email pug" under an "npm" label with no sentence naming the route, so installMethod is left out. The README says the package is "Made for Forward Email and Lad", and recommends Forward Email as the transport, which is a service the user chooses and is not a hosted offering of this software; no relation field is recorded. The repository owner is forwardemail; the LICENSE copyright line names Nick Baugh (2017) and that line decides the maintainer. Nick Baugh's country is not stated, so hqCountry is left out. The first npm upload of the package, 0.0.1, is dated 2012-07-01 and sets firstRelease; the oldest tag in the repository is 0.1.0, committed 2013-12-05. The GitHub release v13.0.1 published 2025-12-31 matches the npm latest. The v13 breaking change states Node v18+, and the package.json at that tag carries the engines field recorded as runtimeMin. The optional preview-email dependency opens rendered emails in a browser or the iOS Simulator during development; the library sends through a Nodemailer transport, supports attachments and subject templates, inlines stylesheets with juice and can render templates without sending. The README names pug as the recommended engine, EJS as an example and Handlebars and Nunjucks in the default extension map; the i18n option is off by default. The ecosyste.ms and npm figures are the email-templates package the README names.
