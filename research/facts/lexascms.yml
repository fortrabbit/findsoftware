notes: >
  Homepage features: personalized content, content scheduling, content previews, multi-language, edge-based content delivery and e-commerce integrations; the Content Delivery API is the name the developers page gives the API. Replicates from six regions and a flexible content model reused across websites and mobile apps are stated on the homepage and pricing page. No installable product, self-host option or product license appears on the pages read (homepage, docs, pricing, for developers, terms, privacy, contact, the e-commerce integration docs), so the hosted-service rule leaves out repository and install fields. The GitHub organization LexasCMS holds client libraries, integration modules and example sites (for example vsf-lexascms and ember-data-lexascms); their licenses and counts are not used. The CSV row says accepted and should read hosted-service. The footer copyright reads 2022, which is not a first release, so firstRelease stays out. The homepage says "Preview any content updates, even if they have not yet been published", which is preview of unpublished content and not a view of unsaved edits; livePreview stands as yes on that wording. The pricing page names WooCommerce, Magento 2 and commercetools as connectable platforms, and the docs have an integration guide for each; no field in the starter list holds that. The pricing page says Professional, Business and Custom plans and that organisations include an unlimited number of spaces; the Custom plan states a guaranteed uptime SLA, and no figure for apiLimits is stated beyond usage quotas with soft limits and overages. The terms name Stripe for card payments and the privacy policy names the company as a data processor for hosted customer content. The feature pages (content previews, scheduling, multi-language, personalised content, edge delivery) were read and add no field beyond the homepage wording. The homepage and footer also link github.com/lexascms (the organization noted above). The homepage links twitter.com/lexascms, recorded as x.
