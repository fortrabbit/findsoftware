notes: >
  No own homepage: the README and the repository's homepage field name only the GitHub repository, so the record has no homepage and its repository is the source. Installation: the getting-started section gives "bundle add devise" as a command under "Run:" and names no package manager in a sentence, so no installMethod is recorded; the reviewer decides whether a sentence-level route is enough. The LICENSE copyright lines name Rafael França and Carlos Antonio da Silva (2020 to current) and Plataformatec (2009 to 2019); Plataformatec is a company and goes here, not into maintainer. The README says "Devise 5 works with Rails 7 onwards" and the gemspec at v5.0.4 requires railties 7.0 or later; the runtimeMin is the gemspec's Ruby floor. The version 0.1.0 on RubyGems (2009-10-21) is the oldest registry upload and sets firstRelease. The README says Devise is "an engine" and that its views are "packaged inside the gem" and uses Warden; the basedOn values rest on "based on" sentences. The README states Devise supports ActiveRecord and Mongoid, and that its tests need a MongoDB server for Mongoid; neither is recorded as databases because the README names the ORMs and the test requirement, not a database Devise stores data in. OmniAuth support is named with no protocol, so sso is not recorded. The Devise logo is under CC BY-NC-ND 4.0 per the README, the gemspec's file list (app, config, lib, changelog, license, README) does not ship the logo, so it is no license entry. The repository's last push was 2026-10-06; the last release v5.0.4 (2026-05-08) matches RubyGems. Stars and contributors are from 2026-11-04. RubyGems publishes only totals; the downloads figure is the all-time total. The README sends questions to the StackOverflow devise tag and calls its Google Groups mailing lists deprecated, so no forum is recorded. The README says Devise requires a good understanding of the Rails framework and recommends that someone building a first Rails application not use it and start a simple authentication system from scratch. The RubyGems authors field lists José Valim and Carlos Antônio; the LICENSE line decides the maintainer.
