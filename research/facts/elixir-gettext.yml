notes: >
  The repository has no GitHub release objects. Its newest stable tag is v1.0.2, the same version Hex publishes, uploaded 2025-11-08 according to the Hex release record, so currentMajor and latestReleaseDate come from the tag and the Hex record. The oldest tag is v0.5.0, committed 2015-09-13, the same day as the first Hex upload, which sets firstRelease to 2015. The Hex docs at gettext.hexdocs.pm are the project's documentation, so no homepage is recorded; the repository is the only other project link. The LICENSE appendix names two copyright holders: Plataformatec (2015) and Dashbit (2020). Dashbit is recorded as maintainer as the later holder; the Plataformatec attribution is not a maintainer statement of its own. hqCountry PL comes from the owner line of Dashbit's privacy policy ("Dashbit, Poland"), linked from dashbit.co. The README describes the workflow: gettext calls in source code, messages in Portable Object files under priv/gettext per locale, and mix gettext.extract and mix gettext.merge to sync them; it calls Gettext a standard for i18n across communities. mix.exs and the Hex metadata require Elixir ~> 1.14, and no OTP minimum appears in any page, so runtimeMin is left out. The Hex 'week' figure (392200 downloads over the last seven days as of 2026-11-08) is a second download figure and is not recorded as a fact. Stars and contributors belong to the single repository.
