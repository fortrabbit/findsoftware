notes: >
  Formerly Ink: the README says "Foundation for Emails (previously known as Ink)", and the repository's oldest tag v1.0.0 (2013-11-07) predates the current name, so firstRelease is 2013 for the same repository. The README's "Future Plans" section says the project "will be merging into the Inky project starting with Inky v2.0", that "This repo will continue to receive maintenance updates but new feature development will happen in Inky v2", and that the styling part will "live on as Inky Styles" in the Inky repo. The project is still maintained, so status stays accepted; maintenance only plus a merge into Inky is no end signal. No basedOn is set: the pages call Foundation for Sites a sibling ("If you've worked with Foundation for Sites, you'll feel right at home") and share its CLI, and no page says Foundation for Emails is built on or extends Foundation for Sites. Runtime is not recorded: the Sass version "requires you to have Node.js installed" for the build, while the output is HTML and CSS files. The maintainer follows the LICENSE copyright line ("Foundation, inc."); the site footer reads "© 1998–2018 Foundation, Inc." and the docs describe the company as "a product design company in Campbell, CA" with no country, so hqCountry is unknown. The gem (foundation_emails) and inky-rb are separate packages; only foundation_emails is named by the README for the styles route. The npm figure is the foundation-emails package the install docs name. The docs page shows version 2.3.0 while the registry and tag say 2.5.1; the registry is used. The "Foundation Forum" link in the site navigation is a general Foundation community forum and is not recorded. The social links on the homepage are recorded as x and youtube; the homepage title reads "A Responsive Email Framework from ZURB". Bower is named on the Sass page with npm; both routes quote the same sentence. The README's main route is the separate foundation-emails-template repository (the email template stack), which it says needs Node.js no greater than version 10; that is a ceiling, so no runtimeMin is recorded. The RubyGems gem's latest version (2.2.1.0) trails the npm package.
