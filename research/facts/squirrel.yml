notes: >
  Doubt: the README opens with a maintenance statement, "Squirrel is "complete"." followed by "Bug fixes will still be merged (slowly). Bug reports are welcome, but I will not necessarily respond to them.", and carries a "Stability: Maintenance" badge, so the record is a stub, not accepted, until a reviewer decides whether a library in maintenance mode is listed; the rule for such statements is stub, not discontinued. The same doubt covers installation: the README gives only the import path (import "github.com/Masterminds/squirrel") and no install command, so criterion 3 is not settled by a project page; a reviewer should decide whether the import path or the Go module proxy counts as the documented route. No homepage: the repository is the only project page, and the README links only a GoDoc badge and an unrelated table-struct mapper (structable), so the GoDoc page the README badge links is recorded as docs. GitHub detects the license as NOASSERTION; the LICENSE file reads "MIT License" and the README says "Squirrel is released under the MIT License.", so one MIT entry is recorded and the detector gap is noted here. The LICENSE copyright line names Lann Martin, Google, and Matt Farina and Matt Butcher for 2014 to 2016; the maintainer is recorded as "Squirrel: The Masterminds", the project's own name in the LICENSE. The README says "Squirrel is not an ORM", which is why no databases fact is recorded; its PostgreSQL section ("Squirrel loves PostgreSQL") shows placeholder formatting, not a list of supported databases, so databases is left out for a reviewer to settle. firstRelease is 2017 from the v1.0 release (published 2017-10-19; its tag commit is dated 2017-08-25). No npm package exists, so no npm figure is recorded; Go modules have no download figure. The README shows SELECT and INSERT statements built with ToSql, execution through RunWith(db), a StmtCache for prepared statements and PlaceholderFormat(sq.Dollar) for numbered placeholders; these describe the code, not a databases list. The README says "If another fork (or substantially similar project) actively improves on what Squirrel does, let me know and I may link to it here", which names no record and is not recorded.
