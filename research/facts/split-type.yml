notes: >
  Homepage doubt: the GitHub Pages site answers 200 but its HTML holds only the text "Webpack App" and a script bundle, so the demo or docs it shows could not be read; the README is the readable source. License: the repository has no LICENSE file and GitHub detects none (license null), while the npm package.json of 0.3.4 says "ISC"; the license fact is the npm statement for the latest release, and the repository holds no other license text. Versions: the newest GitHub release is v0.3.3 (2022-10-29); npm's latest is 0.3.4 (2023-10-22), which has no tag or release object, so latestReleaseDate is the npm date. The major is 0 (pre-1.0 line), recorded as currentMajor 0; the minor line is not recorded. firstRelease: the npm 0.2.0 upload and the package creation are both 2020-11-10, and the oldest GitHub release v0.2.0 is 2020-11-15, so 2020, though the repository itself dates from 2014. Maintainer: the npm package.json author field names Luke Peavey and the GitHub profile name matches; the author's email is not recorded. The README says SplitType was inspired by GSAP's SplitText plugin and can be used with any animation library; that is no alternativeTo or basedOn statement. The README's supported browsers list (Chrome, Firefox, Edge, Safari; no Internet Explorer) is a support list and gives no runsAs or runtime. The npm figure is the sum of daily downloads for 2026-11-01 to 2026-11-07.
