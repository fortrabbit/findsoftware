notes: >
  The homepage answers over https with a docsify shell; its title is the only static text, and the content comes from the README. Feature, install and wiring facts are read from the README and the docs folder of the default branch. The maintainer is the person package.json names as author; no company, imprint or legal entity appears on the site, README or LICENSE, so maintainerType is community and no hqCountry is recorded. The LICENSE file is the GNU AGPL v3 text with no copyright holder line; the repository metadata gives AGPL-3.0. Criterion 1 holds: the ForwardAuth endpoints (/api/authz/forward-auth and /api/authz/auth-request, docs/ProxyAuth-and-Trusted-Header-SSO-Setup.md) are called by a reverse proxy for each request, and OIDC clients follow docs/OIDC-Setup.md. The forward-auth flow is no sso value, so it is not recorded in sso. The Docker image is voidauth/voidauth; no dockerPulls is recorded for app-services. Runtime node comes from package.json engines and the Dockerfile base image (node:24-alpine); runtimeMin is left out because the software ships as a Docker image. The README calls the product unaudited (Disclaimer section) and lists passkeys, MFA and encryption at rest; not recorded as fields. Contributors is the page number of the rel="last" link on the contributors endpoint with per_page=1.
