notes: >
  Homepage: lottiefiles.com/dotlottie is the dotLottie format site; its page names @lottiefiles/dotlottie-web in an import example and links the LottieFiles GitHub organization. The docs site (developers.lottiefiles.com) is a JavaScript shell with no readable text. installMethod is not recorded: the README Quick Start shows an npm install command only in a code block, and the sentence naming npm belongs to the Web Component package. The social and forum links are LottieFiles accounts from the site footer; the footer line names Design Barn Inc. as the company, while the LICENSE copyright line names LottieFiles.com, which is the recorded maintainer. Framework bindings: the README names first-party packages for React (dotlottie-react), Vue (dotlottie-vue), Svelte (dotlottie-svelte), Solid (dotlottie-solid) and a Web Component (dotlottie-wc); the core is framework-agnostic, so basedOn stays empty. Rendering backends: Software (Canvas2D), WebGL2 and WebGPU (experimental), selected by subpath import. Core: Rust and WebAssembly via dotlottie-rs and ThorVG, documented in the README; not recorded as a field. Runtime: the core package README says it is isomorphic and supports Node.js 18 and higher, and also names browsers, so runtime node is recorded and runsAs is left out. Browser requirements are a support table, not a sentence about where it runs. Figures: the repository is the monorepo LottieFiles/dotlottie-web, so stars and contributors belong to the monorepo; npm figures are for @lottiefiles/dotlottie-web, the package the install docs name. The npm dependent counts come from ecosyste.ms for the npmjs.org registry. Release: latest stable GitHub release for the core package is @lottiefiles/dotlottie-web@0.82.1 (2026-11-02); the npm dist-tags pre, beta, alpha and dev carry prerelease versions published before that date, so latestPrereleaseDate is not recorded. The 0.x line gives currentMajor 0.
