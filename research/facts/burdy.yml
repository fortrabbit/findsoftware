notes: >
  The homepage burdy.io says the company is rebranding and will release new enterprise tools; it still offers the headless CMS, so no end is recorded. The docs links in the README (burdy.io/docs and its subpages) answer with a storage bucket 404, so no docs fact is recorded and the README is the only documentation read. The npm packages create-burdy-app (the install command, a scaffolder) and burdy (the core package) are both published; the core package burdy is recorded with its downloads, and its latest version 2.1.3 is dated by npm (2022-01-27), the same release that the repository tags as v2.1.3. The repository has tags up to v2.1.3 and no GitHub release objects. npm lists the license as SEE LICENSE IN LICENSE, and the LICENSE file is MIT, with the copyright line Burdy Technologies; GitHub detects MIT. The default branch's last commit is dated 2022-02-23 per the repository API. The README lists Express and TypeORM for the backend and React with Fluent UI for the admin as its tech stack; these are dependencies, so basedOn stays empty. The README lists a tech stack, a headless API is named as Content API without a REST or GraphQL style, so headlessApi is unknown. The repository's source contains Express controllers under src/server/controllers, which is not a fact from the pages read and is not recorded.
