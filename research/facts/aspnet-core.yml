notes: >
  The CSV row has no note; the repo is the dotnet/aspnetcore monorepo. The endoflife.date product for ASP.NET Core is listed under dotnet (the .NET runtime line), which is recorded as endoflifeId; there is no aspnetcore product there. The release notes page fetched is for .NET 10. The getting-started page carries a not-latest-version banner, so its install command is cited with that caveat. The homepage describes Blazor as part of the framework, so templating lists razor and blazor. Kestrel is named on the overview page as the HTTP server, recorded as processModel. The homepage has no X or Bluesky link in the text read, so none is recorded.
