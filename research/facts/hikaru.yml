notes: >
  The CSV homepage is the GitHub repository; the project's docs site at hikaru.alynx.one is its own site and is recorded as the homepage. The npm package named hikaru belongs to another author (hongxuanlee, version 0.0.4) and is not this project; the install docs name hikarujs. No page or the LICENSE names a maintainer or copyright holder (the LICENSE copyright line is the unfilled template), so maintainer is left out; the npm author field and the GitHub profile are not recorded as one. The README names the default theme hikaru-theme-aria (a separate repository). The npm figures cover 2026-10-12 to 2026-10-18; npm reports 90 downloads for the month to 2026-10-18.
  The README has a "Start Live Server" step (npx hikaru serve) and a "Build Static Files" step (npx hikaru build). It says the CLI is installed in the site directory and run with npx, that pages are Markdown files with front matter in a source directory, and that the setup adds hikaru-generator-feed, hikaru-generator-sitemap and hikaru-generator-search beside the core package.
  The README says to clone the theme into themes/ or add it as a git submodule, and to set themeDir in site-config.yaml.
