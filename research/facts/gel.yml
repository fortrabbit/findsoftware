notes: >
  In doubt whether the project continues: Gel Data Inc. shut down and its team joined Vercel (blog post "Gel joins Vercel", 2025-12-02), while the post says Gel stays open source and the repository is not archived; a new release or an end statement would settle it. Renamed from EdgeDB: the footer reads "(Formerly EdgeDB Inc.)" and the deployment page links the old github.com/edgedb/edgedb docs path; the record follows the Gel name. The maintainer is the legal name in the homepage and about-page footer; no page names a country for it, so hqCountry is absent, and the team's locations on the about page are not a company HQ. Postgres is the base the homepage names ("a scalable, integrated data platform on top of Postgres"), and basedOn postgresql follows that wording now that the postgresql record exists. The language is Python by GitHub's primary language, while the repository is also Rust, Cython and EdgeQL; no page names the runtime the server needs, so runtime is absent. The docs bare-metal page installs gel-6 while the latest GitHub release is v7.0 (2025-11-05); currentMajor follows the release. The npm package gel is the JavaScript client that runs the CLI through npx (per the install page); its npm history starts in 2012 under another project, so firstRelease comes from the GitHub releases. The PyPI package gel is the Python driver (3.1.0); PyPI dependents are 0 per ecosyste.ms and are not recorded. The blog post "Gel joins Vercel" (2025-12-02, linked from every page banner) says Gel Data Inc. is shutting down and its team is joining Vercel, Gel Cloud takes no new instances and shuts down on Jan 31 of the following year, and "Gel will remain fully open source and available on GitHub"; the repository is not archived and no page says the project has ended, so the status stays accepted, and hostedOffering and pricingPage (the pricing page still lists Cloud plans) are left out. Vercel is the employer of the team, not stated as the project's owner, so parent is absent. The Homebrew, PowerShell, Nixpkgs and bash installer routes install the CLI, which can then install servers; the server packages come from the bare-metal page. The homepage footer also links a YouTube channel under the EdgeDB name (youtube.com/@EdgeDB) with no quotable text, not recorded. The homepage's "Gel is a scalable, integrated data platform on top of Postgres" and the README's "graph-relational database" are the sources of the description. Fields coined here: none.
