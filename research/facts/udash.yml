notes: >
  The maintainer comes from the project site's footer component in the repository, which reads "Proudly made by AVSystem"; the README logo also links to avsystem.com. AVSystem's privacy policy names AVSystem sp. z o.o. as the controller of that company's website data and registers it in Poland, but it is the company's own website and not a statement about Udash, so the legal form and hqCountry are not recorded. The repository's LICENSE names no copyright holder (it carries the placeholder). The Stack Overflow tag udash is linked from the project site's footer; no field carries it. Udash's own docs say the backend is independent of the framework (README "Backend-independent"), so no runtime is recorded; the guide sample uses Jetty and Spring, which are not the framework's runtime. The README states the Scala.js frontend is compiled to JavaScript; runsAs browser follows the frontend. The README describes a type-safe layer over HTML, CSS and JavaScript and a backend-independent design. The first release year is the oldest tag, v0.1.0 of 2016-02-25. The highest stable release is v0.26.0 (2026-10-05), matching the Maven Central latest version. The Maven coordinates use the Scala.js artifact of the core module (_sjs1_2.13), as the README's Maven Central badge names it.
