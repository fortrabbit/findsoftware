notes: >
  Hosted only; criterion 2 is waived. The API documentation is a Swagger UI on the project's resources page (contentchef.github.io/contentchef-resources); the page does not say REST or GraphQL, so headlessApi is left out and the reviewer decides. The docs landing page at docs.contentchef.io renders in a script and has no readable text. The hqCountry fact cites the privacy policy linked from the site footer (hosted at iubenda), which lists Byte-Code SpA as owner at Via Mauro Macchi 38, Milano (MI); the contact page shows the same street in Milan, Italy. The footer reads "ContentChef 2020." and the CSV note says the npm SDK was released in 2026; no firstRelease is recorded from a copyright line. The npm SDK @contentchef/contentchef-node (101 a week) and the Postman collections in a GitHub repository are not recorded. The site names a 30-day trial with no credit card, and the Freelance, Team, Agency and Enterprise plans list users, spaces, media, API calls and bandwidth; no prices are recorded. The Enterprise plan asks "SSO?" as a question without naming a protocol, so sso stays out. The features page describes a schema language for content models, a UI schema builder, preview before release and scheduled visibility dates; the record does not carry a live preview field. WebHooks are listed as a Team feature; webhooks are a coined kind and stay in notes. The LinkedIn link (linkedin.com/company/content-chef-cms) is coined and stays in notes. The Enterprise plan offers shared or dedicated infrastructure, which is hosting, not a self-install.
