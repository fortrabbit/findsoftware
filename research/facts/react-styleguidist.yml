notes: >
  Gitter chat is linked from the README badges and the Open Collective sponsor page is not a field. Maintainer is Artem Sapegin as the LICENSE copyright line states it; the project's footer says the same name and gives no legal entity or country. The GitHub owner is the organization styleguidist. The npm package react-styleguidist is the install docs' package; the v13.1.4 tag's package.json still carries version 11.0.0-beta2, so the version field there is stale and the npm latest 13.1.4 (published 2025-01-07, matching the GitHub release) is the current major. basedOn react rests on the homepage and README tagline, an isolated React component development environment; the homepage's "Works with Create React App out of the box" and the install page's "Install webpack if you don't have it already" describe integrations and a required toolchain, not parents. firstRelease is 2015 from the npm package creation date (2015-09-10), older than the oldest GitHub release 1.2.0 (2015-11-16). The npm weekly figure is the window 2026-09-28 to 2026-10-04, as the build-dev rule sets. The README says the tool "lists component `propTypes` and shows live, editable usage examples based on Markdown files" and "a living style guide that you can share with your team"; the homepage says "Focus on one component at a time, see all its variants and work faster with hot reload" and "Share components with your team, including designers and developers". The cookbook lists Catalog among the active projects like this one; it has no record here and is not recorded. The Vue Styleguidist project is a separate repository and is not recorded here. The last commit on the default branch and the v13.1.4 tag date are both 2025-01-07; the repository is not archived and npm shows no deprecation.
