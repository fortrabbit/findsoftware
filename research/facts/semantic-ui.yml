notes: >
  The getting started guide has the user install NodeJS and run Gulp build tasks that compile CSS and Javascript for use in the project; no page says the output is static files, so neither runsAs nor runtime is recorded. Not declared ended: the README and the homepage do not state that the project has ended or is unmaintained. The homepage asks for donations under "Help Preserve This Project", which is no end signal. The last GitHub release and npm release are 2.5.0 (2022-10-06), more than four years before 2026-10-28, so the import will move this record to stub by its release-age rule; status is left as the CSV row has it. The CSV's homepage http://www.semantic-ui.com is replaced: https://semantic-ui.com answers 200 and serves the same site. The README says "Semantic UI is now compatible with Node 18 and Gulp 4" for the 2.5.0 release; that statement is not recorded as runtimeMin, since package.json at 2.5.0 has no engines field. The LICENSE file has no copyright line; the maintainer is the package.json author at tag 2.5.0, which names Jack Lukic. The npm figure is the semantic-ui package; the separate semantic-ui-css and semantic-ui-less packages are not used. The HTTP Archive count is the mobile origin count of the technology named "Semantic UI", which the archive matches by name. The React integration is a separate record, semantic-ui-react, which the React docs describe as a separate part from the CSS themes.
