notes: >
  The repository is a monorepo in the sense that the npm package's repository field points to packages/driver, while the README says the library lives in src/; stars and contributors belong to the repository. The homepage says the library works with any framework or with vanilla JavaScript, so no basedOn is recorded. The homepage lists browser support and mobile devices, and the README and docs say it is dependency-free; no page states where the code runs, so no runsAs or runtime is recorded. The homepage's "4M+ monthly downloads" and "27K+ github stars" are site claims and are not recorded; the registry figures are. The npm install command and the CDN route are the two install routes; the CDN route names the jsDelivr package host and the docs give the hints and checklist entry points as separate files, which are not separate records. The README has no install section, so the installation quotes come from the docs installation page. The footer Twitter link is the x field, recorded without a quote as a link fact. The homepage and README name no forum or chat. The first npm version 0.1.0 and the repository creation date both fall in 2018.
