notes: >
  Checked 2026-11-16. The README says the toolchain combines the functionality of Swashbuckle and AutoRest and that the two libraries are not needed; Swashbuckle is recorded as alternativeTo, AutoRest has no record. No homepage: http://NSwag.org answers over plain http only and redirects to the GitHub repository (https://github.com/RicoSuter/NSwag), the https address fails at TLS, and https://www.nswag.org redirects to the same repository; the record uses the repository and the wiki as its sites. The maintainer comes from the LICENSE.md copyright line and the README sentence "developed and maintained by Rico Suter and other contributors". The README names the wiki as the docs, and the wiki's CommandLine page gives the dotnet tool route. The README's "Apimundo" is a separate documentation product built on NSwag and NJsonSchema, with its own site; it is not recorded as hostedOffering. Paid consulting and sponsorship are not a paidEdition. The NuGet figure is NSwag.Core, the core package the README badge names; NSwag.MSBuild (110177294 total) is not recorded. The npm package nswag is the command line distribution the README names; its 96514 weekly downloads, 297 dependent packages and 516 dependent repositories on npmjs.org are the npm side of the same monorepo and are not recorded as the main figure. The repository and its stars and contributors cover the whole monorepo. firstRelease is 2015 from the first NuGet upload of NSwag.Core (0.11.5770.31403, 2015-10-19); the repository was created 2015-09-02. The binary download route is the GitHub releases page; NSwagStudio is the Windows GUI from the same download. The middleware statement "Run as part of the Swagger/OpenAPI specification" does not state a process model, so runsAs is not recorded.
