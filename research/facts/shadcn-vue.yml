notes: >
  The repository description says "Vue port of shadcn-ui" and the footer says "Ported by unovue"; the project does not call itself a fork, so the shadcn/ui link is notes only and basedOn is vue, the framework the install page names. The maintainer is recorded as the GitHub organization, the name the LICENSE copyright line gives; no legal name or imprint was found on the site. The Vite install page is the one read for the command; the Nuxt, Astro and Laravel pages name other install routes through the same CLI. The CLI package shadcn-vue on npm is the package the install command runs, and its version matches the GitHub release v2.9.0 of the same day. No runtime or runtimeMin is recorded: neither the CLI package nor the root package declares an engines field for Node, and the root declares only pnpm. The project shows a sponsorship page (Open Collective) and no paid tier; sponsorship is not a paidEdition. The VS Code extension on the installation page is by a third party and is not an install route of the project. The x value is the project's Twitter account as linked from the homepage footer. The GitHub default branch is dev, and the README's documentation link is http.
