notes: >
  Coined themeCount (theme directory size, shown beside the plugin count). The docs disagree on how the REST API ships: getgrav.org/headless says it ships with Grav, the Learn API docs describe a GPM-installed API plugin; both entries are kept. The Grav 1.7 docs (learn.getgrav.org/17) list PHP 7.3.6 as minimum for the legacy line. Premium prices are shown with "$" only, no currency code.
