notes: >
  Status accepted: the README's opening note reads "Testify is being maintained at v1, no breaking changes will be accepted in this repo." That is a version-compatibility statement, not a maintenance-mode statement, so the record is not a stub; the README also links a discussion about v2, whose opening comment says the proposal's author has come to agree with most maintainers that v2 should not be made. Homepage: the CSV homepage is pkg.go.dev, which hosts the module reference, not a project site, so no homepage is recorded and the reference is the docs field. The LICENSE copyright line names Mat Ryer, Tyler Bunnell and contributors; the README says this project is MIT licensed. The README's installation section names the packages assert, require, mock, suite and an http package it marks deprecated. The README names mockery as a tool that generates mock code for interfaces and testifylint as a linter; both are companion tools, not parents or alternatives. The README says the suite package does not support parallel tests. The README names the Gophers Slack channels for chat, which has no field here. The Go module has no download figure, so none is recorded. The README support sentence gives runtimeMin 1.19; go.mod at the latest tag declares go 1.17 as the minimum it tests, recorded as a second runtimeMin entry. firstRelease is 2015 from the commit of the earliest tag v1.0, since the oldest GitHub release (v1.1.4) is from 2016 and the tags predate it. The current major is 1 from the highest stable GitHub release. Stars and contributors belong to this one repository, which holds the library only. Contributors: 261 across all pages.
