notes: >
  The repository has no GitHub release, only the tag 0.1 dated 2020-06-23, and the tag is recorded as the release. The opam package finch 0.1 is the install route the README names; the opam registry is not one of the registries this dataset reads, so no opam figure is recorded. The README also gives a Docker image, roddylm/finch, which exists on Docker Hub (verified, last pushed 2021-06-12). The README says finch can also be used as a tiny version of Gatsby and as a server side renderer for React components (see the examples directory); the generic static site generator is the main use and the one recorded. The README footnote says finch builds faster than Hugo in ad hoc comparisons; that is not recorded because it is a comparison claim, not a fact field. The documentation site is the homepage; no separate project site was found. finch.opam names the GitHub repository as homepage and the documentation site as doc. The homepage (https://roddyyaga.github.io/finch/) says: "It compiles documents written in Markdown with optional frontmatter into (usually) HTML using templates written in Jingoo", and "A content document either consists of Markdown and some YAML frontmatter (delimited by --- lines)", and "A layout file is a Jingoo template." The tag 0.1 is the only tag. The latest tag is older than four years, so the import will move the record to stub.
