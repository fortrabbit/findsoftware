notes: >
  tusd is the server half of the tus protocol (tus.io); the protocol is an HTTP extension for resumable uploads, not an identity protocol, so no protocol field is recorded. The homepage lists the storage backends, the hook mechanisms (scripts, HTTP, gRPC) and the Go embedding option; the hook and embedding statements are not recorded as fields. The GitHub repository topics in the candidates row list object-storage; the import would map that to database, so the categories are file-upload only. The LICENSE.txt copyright line names Transloadit Ltd; tus.io has no imprint page of its own (the imprint and privacy paths answer 404) and its footer says it is created and maintained by Transloadit, so the LICENSE line is recorded; the transloadit.com imprint names Transloadit-II GmbH as the operator of the Transloadit service, which is a page of Transloadit and not of tusd. tus.io links an X account (@tus_io) and a community forum for the tus project as a whole, and the tusd docs do not link the X account, so x is not recorded. The client libraries tus-js-client, Uppy, tus-java-client, TUSKit and tusdotnet are separate projects and are not recorded here; the tus.io implementations page lists them. The tusd build requires Go 1.26 (go.mod); that is a build requirement of a binary and Docker distribution, so runtimeMin is left out. The Docker Hub figure is the tusproject/tusd image named in the install guide, pulls in total at the checkedAt date. The GitHub repository has releases back to 2015 (0.0.5-test), so firstRelease is 2015. The README of the repository was not used: the project's documentation site is the source for install and usage facts.
