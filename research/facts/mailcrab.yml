notes: >
  No homepage: the repository is the only project site, and the GitHub homepage field is empty, so the record has no homepage link. The maintainer is the GitHub organization tweedegolf, since no page of the repository names a legal entity. The company site tweedegolf.nl (Nijmegen, Netherlands) is not linked from the README, so its address is not recorded as hqCountry. The Cargo.toml of the backend at v1.9.0 sets edition 2024 and no minimum toolchain, so runtimeMin is not recorded. The Docker Hub figure is the image the README names, marlonb/mailcrab. The Helm chart named in the README is the Kubernetes install route. The Apache-2.0 LICENSE file has no copyright line, so the maintainer comes from the organization. The LICENSE file holds the Apache text only and the Cargo manifests declare Apache-2.0 OR MIT. v1.10.0 (2026-09-17) is on crates.io and Docker Hub only; GitHub's newest release is v1.9.0. The crates.io crate mailcrab is the SMTP library core of the same repository (3511 downloads in total on 2026-11-03), not the app, so no crate figure is recorded; the app is installed from the Docker image or a binary build. The README lists a JSON HTTP API (GET /api/messages, GET /api/message/[id], POST /api/delete/[id]) and a websocket; it does not use the word REST, so no headlessApi is recorded. The README says MailCrab is inspired by MailHog and MailCatcher (no alternativeTo: inspiration is no alternative statement); messages stay in memory until restart unless MAILCRAB_RETENTION_PERIOD clears older ones; the web interface shows formatted mail, attachments, headers and raw source. The repository also holds a fly.io deployment guide (flydotio_deployment.md) and a reverse proxy guide (reverse_proxy.md).
