notes: >
  The README opens with "I will be discontinuing active maintenance of Siema", a statement from the maintainer that the project is unmaintained, so the status is discontinued with that sentence as the status fact; the same note invites anyone who wants to continue maintenance to do so, and it calls carousels an anti-pattern and suggests a different UI pattern, a judgement not recorded as a fact. The homepage names Flickity and Swiper for readers who need a more powerful library, recorded as alternativeTo. The homepage lists other implementations by third parties (Angular, React, Vue and a Rails gem); they are not recorded. The license is in LICENSE.md, which carries the MIT text and the copyright line. The npm package's latest version dates from 2018-02-14 and matches the latest GitHub release. The first npm upload (2016-11-28) is earlier than the first GitHub release (2016-12-08), so firstRelease is 2016. The npm package's homepage points to pawelgrzybek.com/siema, a page this record does not read; the project's own GitHub Pages site is the homepage. The npm weekly figure counts downloads of the siema npm package named in the install section. The README's browser support list is not a runsAs statement, so no runsAs is recorded.
