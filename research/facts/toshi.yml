notes: >
  In doubt, so stub. The only registry release is crate toshi 0.1.0 (2018-10-18), and its crates.io metadata names no repository, so the link between that crate and toshi-search/Toshi is unconfirmed. A crate published from this repository, or a statement by the maintainer, would settle it. The repository has no GitHub release or tag. The default branch's newest commit is dated 2023-10-12 (api), while pushed_at is 2026-06-28. The README and toshi.rs both call Toshi experimental and not production ready. The README's "1.39.0" build requirement is not recorded as runtimeMin: it is an old statement with no current release to tie it to. Data and indices are written under the configured data path ("The data path where Toshi will store its data and indices."), so no contentStore is recorded. The crate download count is a total, all time. The project site toshi.rs answers over https.
