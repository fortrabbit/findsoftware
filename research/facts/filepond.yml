notes: >
  The repository is a single package, so its stars and contributors are the project's own. The homepage says FilePond 5 is in beta, and the npm latest is the 4.x line; the GitHub releases stop at 4.28.2 (2021-06-09), so the newest stable release is the npm version 4.32.12 (2026-03-02), which the latestReleaseDate and currentMajor come from. The beta tags 5.0.0-beta.* and the alpha 5.0.0-alpha.17 are prereleases; the npm dist-tag beta points at 5.0.0-beta.77 (2026-10-28), the latestPrereleaseDate. The homepage says "Run by Rik Schennink", the person behind the project; the LICENSE copyright line names "Pqina", recorded as the maintainer. The terms page defines "Pqina" as Pqina B.V. (Veldhoven, The Netherlands), the hqCountry source, and the terms are dated 2024-04-18. Image editing in the Image Edit plugin is powered by Pintura, a separate commercial editor sold by the same company; it is not a paid edition of FilePond, so no paidEdition is recorded. The adapters for React (react-filepond), Vue (vue-filepond), Svelte (svelte-filepond), Angular (ngx-filepond) and jQuery (jquery-filepond) are separate repositories of the same organization, named on the homepage; they are not recorded as basedOn. The homepage says the core library is written in vanilla JavaScript and can be used everywhere; no runsAs is recorded because no page says where it runs. The HTTP Archive figure is the mobile origin count for the FilePond technology entry.
