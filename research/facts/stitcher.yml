notes: >
  The CSV homepage is the GitHub repository, which is not the project's own site. The README points to stitcher.io as the Stitcher website, but that site is the blog of the author Brent Roose and holds no pages of the project, so homepage stays unknown. The install command names pageon/stitcher, a skeleton ("A Stitcher Project", 192 total downloads on Packagist); the registry figures are from the core package pageon/stitcher-core, per the rule for skeletons. The README says "static websites" and "static site generator" but names no static output files, so renderingModes and runsAs are not recorded. The LICENCE names Pageon VZW, a Belgian non-profit association; maintainerType is left unset because the sources do not classify it. Latest release 1.0.6 is 2024-03-16 and the repository was pushed 2024-11-26; no archived flag, no deprecation on Packagist and no end statement was found, so the status stays accepted.
