notes: >
  The Scala 2.13 Maven artifact http4s-core_2.13 is the core package the quickstart names as the core; the metadata lists 1.0-57 builds beside 0.23 releases, so only the coordinates are recorded. currentMajor is 0 because the highest stable release is v0.23.38; v1.0.0 is still a milestone (v1.0.0-M49 is the latest prerelease). The changelog gives the first public release as v0.1.0 on 2014-04-15, older than the earliest GitHub tag (v0.1.0 re-tagged 2017-10-04), so firstRelease is 2014. The homepage describes the cross-builds for Scala.js and Scala Native and the browser and Node.js targets; these are not recorded in runtime because the server runtime is the JVM. The project describes itself as a Typelevel project; no separate parent is recorded, and the homepage has no X, Bluesky or Mastodon link. The README says the blaze backend needs a JDK newer than 8u252 (JDK8u252 or later, including 9+); runtimeMin is not recorded because the quickstart uses Ember. The README gives the license as Apache 2 and the changelog as Apache-2.0; both statements are recorded. The getting-started and tutorial URLs on the site return 404; the quickstart is the install page. The deployment page shows a GraalVM native image as an option; runsAs records only the JVM path it states.
