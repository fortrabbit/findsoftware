notes: >
  The GitHub latest release tag v5.3.3 and the Packagist stable v5.3.3 agree on the version; the release date comes from the Packagist version time. The Packagist download figure is the all-time total (period total). The Packagist metadata for v5.3.3 requires phpunit/phpunit ^13.4.3, which is the basis of the description's PHPUnit wording. The homepage also markets Pest for AI agents and browser testing; the description covers only the testing framework.
