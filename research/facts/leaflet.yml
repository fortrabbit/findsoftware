notes: >
  The stable release 1.9.4 dates from May 2023. The only release after it is the prerelease 2.0.0-alpha.1 of August 2025, which GitHub lists as a prerelease; criterion 4 (a release in the last 24 months) rests on that prerelease, so the candidate needs a decision. The GitHub organization Leaflet has no location and no description, and no maintainer is named on the project's pages, so maintainer and maintainerType are not recorded. latestPrerelease is a coined field: the download page lists the stable and prerelease versions with their dates. The npm latest tag is the stable 1.9.4. The GitHub repository also has a dev tag from 2025-09-17, which is not a release and is not recorded.
