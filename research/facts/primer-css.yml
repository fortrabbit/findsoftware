notes: >
  Maintenance mode: the README of primer/css says "This project is in KTLO mode!" (keep the lights on), asks users to use the existing utility classes where needed, and directs them to primer/react or, if necessary, primer/view_components for more complete patterns that include styling and markup. Maintenance mode is no end signal, and npm still publishes releases, so the status stays accepted. The documentation site primer.style/css answers 200 with a Storybook shell that carries no text, so the homepage could not be read and the README stands in for it. The highest stable GitHub release is v22.3.0 (2026-06-17) while npm latest is 22.3.2 (2026-09-25) with no GitHub release; the major is 22 on both. The npm next tag is 22.3.3-rc.5caa2e7e (2026-10-21), the only prerelease newer than the latest release; the canary tag is not a prerelease. The LICENSE copyright reads "Copyright (c) 2021 GitHub Inc." without a comma, a second wording of the maintainer's legal name; the about page reads "GitHub, Inc.", which is recorded. The country of GitHub, Inc. is not stated on the pages read. The firstRelease year comes from the oldest GitHub release, v2.0.2 of 2015-03-25; the npm history begins in 2019 with prerelease versions. The npm package ships Sass source files, not a runtime; no runtime is recorded.
