notes: >
  Status accepted: the project's own site lists release 12.4 with a changelog entry dated 2026-09-15, the default branch has a commit of 2026-09-26, and no end statement was found. The release is 12.4 on the GitLab release record dated 2026-09-26 (released_at, and the release tag's commit date); the project's changelog dates the entry 15 Sep 2026, and latestReleaseDate follows the changelog. firstRelease is the changelog's oldest entry, 0.1 ("Initial release.") dated 27 Jan 2002, the quote being its date line; the about page names 1.0 in September 2002 as the first full release. The repository is on GitLab (hsleisink/hiawatha, 4 stars and 2 forks at 2026-10-29, project created 2026-05-05), with a mirror on Codeberg (hsleisink/hiawatha, 1 star). Neither platform is a GitHub figure, so githubStargazers is absent and the star counts stay in these notes. The download page names the GitLab and Codeberg repositories as the places to browse the source. The homepage and every page of the site carry the line "Built upon the Banshee PHP framework": that describes the website's own code, not the Hiawatha server, so no basedOn is recorded. The Hiawatha Monitor is a separate PHP web application, downloaded as its own tarball, and requires cron for periodic collection; it is not part of this record. The features named on the site and in the changelog include CGI, FastCGI, reverse proxy, URL rewriting, IPv6, TLS through mbed TLS, HTTP/2 (since 12.1) and an OS sandbox; the about page's "Support" list names the operating systems the project has compiled and run on, which is not a runsAs or platform field. The CMake options for cache, reverse proxy, TLS and XSLT are configuration of the build, not separate facts. The Debian and Ubuntu packaging repository is by Chris Wadge, a third party, and the FreeBSD and OpenBSD ports are third-party packages; they are listed as install routes, not as the project's own. The site's Windows package is documented as compiled via Cygwin and the project advises against production use of it, which is recorded here only as the install route.
