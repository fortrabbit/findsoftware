notes: >
  Stub risk: the newest stable GitHub release is 3.6.4 (2019-09-30) and the only later release object is 5.0.0-alpha.3, published seconds after 3.6.4 on the same day, so latestPrereleaseDate is not recorded and the import's four-year rule (AGENTS.md criterion 4) will move this record to stub. Status is kept as the candidates row has it, for the reviewer to decide. The homepage answers only over https (plain http redirects with 301), so the https address is recorded. The homepage calls it a "jQuery date & time input picker" and its usage examples call $.fn.pickadate; that wording is recorded as basedOn jquery, and the reviewer may drop it if a jQuery plugin is not a binding. The install page names two routes: the zip download and bower; the git clone line under "To get it" is the same source, not a separate route. The npm package "pickadate" is the one the README's jsDelivr badge names; the install page does not name npm, so no npm figure is recorded. Its latest dist-tag there is 5.0.0-alpha.3, a prerelease. The GitHub tag list holds tags from 2013-01-19 (2.0.5), and the npm first upload is 2013-03-21, both in 2013. The homepage nav links a v5 docs page for a rewrite that says v5 is not yet ready for a full-featured release. The homepage says "Supports jQuery 1.7 and up" and "Made by Amsul" with a link to twitter.com/amsul_, the maintainer's personal account, recorded as the x link from the homepage. The README links a Spectrum community; Spectrum.chat now redirects to a GitHub Discussions page, so no forum is recorded. The README links "Support" to an external donation page, which is not a fact field.
