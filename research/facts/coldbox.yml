notes: >
  The README and license.txt name Ortus Solutions, Corp as the copyright holder, with Luis Majano; the README says Ortus backs the project. The highest stable GitHub release is v8.3.0 (2026-10-13). The README's LTS table lists a 9.x line for 2026, but no 9.x tag exists yet, so currentMajor is 8. The earliest GitHub release is v5.0.0 (2018-07-02) and the changelog starts at 8.0.0, so firstRelease is 2018; the README's "Since 2005" and "Since 2006" are not release dates. GitHub reports the license as NOASSERTION, while the README and license.txt both state the Apache License, Version 2.0. ForgeBox is not in the listed registries, so its download figures are not recorded. The x fact is the Ortus Solutions account, linked from the homepage, not a ColdBox-only account. The LTS table gives support windows, not endoflife.date ids, so endoflifeId stays unknown. The README names BoxLang as a JVM language and lists Adobe ColdFusion 2023+ and Lucee 5.0+ as CFML engines; the engines are not recorded as runtimes because no page states their runtime.
  The README recommends BoxLang, names WireBox, CacheBox and LogBox as libraries usable in other BoxLang or CFML applications, lists the ColdBox CLI and the starter templates, and says the documentation sites embed MCP servers.
