notes: >
  The README's "Official Site" link, rkdev.info, has no DNS record and answers nothing, so it is listed as unreadable and is not recorded as the homepage. The CSV homepage, rk.mofcloud.com, is the project's own landing page ("Opensource project maintained by rk-dev", the plugin list and a link to the documentation), and it is recorded as homepage; the name rk-dev is the project's own, and the docs copyright line names "rookie ninja", which is recorded as maintainer. The docs site is rkdocs.mofcloud.com (the rookie-ninja/rk-docs source); the plugin pages for each database are linked from the docs site and are not read one by one. The database list is the docs site's Database section; ClickHouse and Redis are in that list but outside the dictionary's database values, so they are named here and not in the databases fact. The highest stable GitHub release is v2.2.22 (2024-04-09) on the v2 module, and the repository last pushed on 2024-10-04; there is no end or deprecation statement. The first GitHub release is v1.0.0 (2020-11-22), which gives 2020. The go.mod at the v2.2.22 tag declares go 1.18. The Go module is github.com/rookie-ninja/rk-boot/v2; the Go proxy has no download figure, so none is recorded. The README describes rk-boot as starting and configuring a gin server, and the docs list gin, gRPC, echo, gf, fiber, gorilla/mux and go-zero as the web frameworks it wraps; those are plugins of rk-boot, not parents of it, so basedOn is not recorded. The Slack link is the project's invite workspace from the README; no other community link was found. The rk-docs plugin pages and the README example describe the YAML entries (for example a gin entry with a name, a port and an enabled flag) that the application registers handlers on. The landing page lists rk-boot as a set of plugins for web frameworks, databases and clouds, and the rk-cloud plugins for AWS and Tencent are not recorded.
