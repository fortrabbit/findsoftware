notes: >
  The homepage is answered over https (https://www.webtoolkit.eu/wt returns 200); the CSV's http address redirects to it, so the https address is recorded. The GitHub releases API lists 105 releases across two pages; the highest stable is 4.14.4 (2026-10-01), and the 4.x releases with an rc suffix are prereleases (the newest rc is 4.5.0-rc1, older than the latest release), so no latestPrereleaseDate is recorded. firstRelease is unknown: the ReleaseNotes give dates only from 2.1.1 (April 2008), while the 1.x and 2.0.x releases appear there undated, so 2008 would not be the first release; the oldest GitHub release is from 2015; no page gives the first release year, so it is left out. The license is dual: the README names the GNU General Public License, Version 2, with OpenSSL exception, and a commercial license; each is recorded as its own statement. The README's wording of the GPL is the project's words; GitHub reports NOASSERTION. The download page gives a commercial license price (a euro figure); no price is recorded, and the page is recorded as the pricing link only. The runtime value binary rests on the overview page, which says the application binary and the resources folder are all a deployment needs; the README names libwthttp as an HTTP and WebSockets server and the features page lists FastCGI and ISAPI connectors as alternatives. The Wt License Agreement is the commercial license; the download page lists a price, which is not recorded. The Changelog file in the repository says it is no longer used and points to the release notes. Wt's own pages name no social or community accounts on the homepage; the mailing and bug tracker links are on redmine and were not recorded.
