notes: >
  The end is stated on the project's own homepage and on the README of the default branch: the notice is dated April 20, 2022, and recommends Vite; the same README names esbuild and parcel as see-also projects, which stay in notes because the notice says see also and not alternative. The status fact is the README statement; the homepage quote supports the same status. The repository is archived false and the npm package has no deprecation flag, so the end is a README statement only. The repository API reports the default branch last pushed on 2023-03-05 and the repository's own README badge points to snowpackjs/snowpack; the API resolves that name to FredKSchott/snowpack, which is the repository recorded. The npm latest version is 3.8.8 from 2021-08-26 and the GitHub release of the same version carries that date; the oldest GitHub release is v0.3.1 from 2019-03-09, so firstRelease is 2019. The npm engines field gives node >=10.19.0 for the latest version, recorded as runtimeMin 10. The maintainer is recorded as Fred K. Schott from the LICENSE copyright line; the project has no legal entity on its pages. The plugin catalog is the project's own directory of plugins on snowpack.dev. The npm weekly figure is the sum of the seven days 2026-09-28 to 2026-10-04; the CSV figure of 8.9k per week came from an earlier window. The homepage shows the version number and a current npm install line; no version is recorded in prose.
