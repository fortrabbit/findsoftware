notes: >
  Boundary row settled as accepted. The CSV row says only release candidates since 1.0.2; the GitHub API gives v1.0.2 as a release on 2023-10-02, so the CSV's 2023-02-05 date is not used, and the v1.1.0-rc-4 release (2026-02-23) is the latest prerelease, though GitHub does not mark it as one. npm's latest tag is 1.1.0-rc-4, so the npm figure counts the release candidate's package; reviewer decides whether that is the right package to show. Criterion 4: the 2026 release candidate keeps the project inside the four-year window, and no end statement exists. runtimeMin "Node 14" comes from the package.json at the latest stable tag (v1.0.2, "^14.17.0 || >=16.0.0 || >=18.0.0"). The v1.1.0-rc-4 manifest says ">=18.18", the default-branch manifest ">=22.0.0" and the default-branch README "Node.js v22 or higher"; those describe the unreleased line. The README's security notice says the web interface can run JavaScript sent in documents on the server, so mongo-express should only be used privately for development purposes; the prose carries it. Docker Hub's official image page (a Docker notice, not a project statement) says the image is deprecated due to maintainer inactivity and has no supported tags; the README still names that image, so dockerPulls is the figure of the image the install docs name. The maintainer's own Docker repository (mongo-express/mongo-express-docker) is not recorded as a route. runsAs always-on rests on the --port option text ("listen on specified port"); the reviewer may drop it if a stricter reading is wanted. maintainer is the GitHub organization named in package.json; the LICENSE copyright lines name Chun-hao Hu (2012) and multiple contributors (2016 onward), no company. firstRelease 2012 is the first npm upload (0.11.0, 2012-05-07) and matches the 2012 copyright line. Prose sources: the README feature list (databases, collections, documents, OpenID Connect) and its connection-string statement. Fields coined: none.
