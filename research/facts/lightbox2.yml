notes: >
  firstRelease is the oldest tag of the Lightbox2 line (v2.05, 2012-04-08), since Lightbox3 continues the same project under the same author and site. The candidate row is Lightbox2, and the record follows its successor. The Lightbox2 README opens with "Lightbox2 is in maintenance mode" and links Lightbox3, and the npm latest version of lightbox2 carries the deprecation notice "Lightbox2 is in maintenance mode. Lightbox3 is available", naming the Lightbox3 page on the same site by the same author. The Lightbox3 page calls itself "The original lightbox script", has an "Upgrading from Lightbox2" section and lists Lightbox2 in its navigation, so the deprecation is a move to the next version of the same project, not an end. Maintenance mode is no end signal. The record id stays lightbox2 and every field follows Lightbox3: repository lokesh/lightbox3, npm package lightbox3, the GitHub releases of that repository. The old repository lokesh/lightbox2 and the npm package lightbox2 hold the earlier version, which required jQuery; Lightbox3 is stated as having zero dependencies. The homepage says the project is MIT licensed with no license keys. No sentence says where the library runs, so runsAs is left out. firstRelease is 2026 from the first npm upload 0.90.0 (2026-04-07) of lightbox3. The GitHub repository was created in 2020 and holds releases from v1.0.0. The npm weekly figure is the sum of the daily downloads of the lightbox3 package the install section names; stars and contributors belong to lokesh/lightbox3.
