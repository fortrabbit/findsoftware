notes: >
  The documentation site answers with an empty client-rendered shell (a page with a title and a script, and no body text), so the docs were not read and the homepage fact rests on the package.json homepage field and the README. The README names IBM as the owner of the design system; the repository carries no copyright line with a legal name, and the IBM legal page read lists trademark ownership only, so the maintainer is recorded as the README names it and no legal form is recorded. The LICENSE file is the Apache 2.0 text. The package is version 0.x; currentMajor is the major of the latest stable release, 0. The README says the compiled stylesheets come from carbon-components v10 SCSS themed with Carbon v11 tokens; that is a build detail and is not recorded. The README says the package uses IBM Telemetry to collect de-identified and anonymized metrics data in CI environments; this is a note, not a field. The npm package firstRelease is the 0.1.0 upload of 2019-12-15, earlier than the GitHub release list, which starts in 2020. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header. The npm weekly figure is the sum of the daily counts for the period in the value. The README says the telemetry applies once the package is installed as a dependency, that installing it is agreement to the collection, and that opting out is documented in the IBM Telemetry project. The README also says each stylesheet is imported once at the top-level entry point of the app.
