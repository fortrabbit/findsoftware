notes: >
  The homepage and the repository's README name shakapacker.com as the documentation site; the homepage is the project's own site. The README calls Shakapacker "the official, actively maintained successor to rails/webpacker"; successorOf names the webpacker record. The README and the "Why Shakapacker" page name Rspack as a supported bundler (Rspack is not a record). The installation page gives "Node.js ^20.19.0 or >=22.12.0" as a requirement next to "Ruby 2.7+", so node is recorded as a runtime; the runtimeMin field holds the Ruby minimum from the gemspec at the latest release tag, and no Node minimum is recorded. The gemspec at tag v10.3.2 gives the Ruby minimum; the authors line names David Heinemeier Hansson, Gaurav Tiwari and Justin Gordon, and the MIT-LICENSE copyright line names David Heinemeier Hansson and Basecamp; the maintainer is recorded as ShakaCode, LLC, the company that maintains the project per the README. The GitHub organization is shakacode. The RubyGems gem is the install route the README names, so its figures are recorded; the npm package shakapacker is the matching JavaScript package and its weekly figure is recorded too; ecosyste.ms dependents are the RubyGems package's counts. The README's Rails gem badge and the installation page name the gem and npm package as released together. The runsAs local value rests on the deployment page's build step (assets:precompile runs the compile task); the dev server is not quoted and no always-on value is recorded. basedOn rails rests on "gives Rails apps a manifest-backed bridge"; webpack and Rspack are the bundlers it bridges to, not parents, so they stay in notes only. The GitHub releases list has fifteen entries; the oldest RubyGems upload is 6.0.0.rc.12 from 2022-01-18 and firstRelease takes that year. The README's sponsor and ShakaCode consulting links are not fields. The pre-releases (for example v10.1.0-rc.2, 2026-05-24) are older than the latest release and are not recorded.
