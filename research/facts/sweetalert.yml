notes: >
  Status and the four-year rule: the repository is not archived, the npm package is not deprecated, and no page states that the project has ended. The last stable release is 2.1.2 on npm (2018-10-29); the GitHub release list ends at v2.1.0 (2017-12-14), and the default branch was last pushed on 2023-04-15. The import moves a record with no release in four years to stub, so this record is expected to be stubbed on the next import; the status is left as the CSV row sets it. The README and homepage give the install command "npm install sweetalert"; the Guides page adds a CDN route (unpkg and jsDelivr) for the global swal variable. The React binding @sweetalert/with-react is a separate package, and no runsAs is recorded because no page says where the library runs. The LICENSE.md copyright line is "Copyright (c) 2014-present Tristan Edwards"; the homepage credits the same person. The maintainer's own site is linked from the homepage and is not a legal notice, so no hqCountry is recorded. The sweetalert2 project is a fork of this package; its record states the fork. The homepage's docs link points to sweetalert.js.org/docs/, which answers 200. The Guides page also documents the 2.0 upgrade (callbacks replaced by promises); no page states that the project has ended. The README contains an Open Collective backers and sponsors section, which is not a fact.
