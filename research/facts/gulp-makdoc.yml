notes: >
  The repository is archived (GitHub API archived true, last push 2015-12-08), and the package.json names it as the repository, so the status is discontinued under the archive signal. The npm package reports no deprecation. The repository has no homepage of its own: the GitHub and npm homepage fields both point to the repository, so homepage is absent. The LICENSE file at the repository root returns 404 on the raw URL; the license is recorded from package.json and the README ("MIT © Changwoo Park"). The GitHub license API field is null for the same reason. The GitHub releases list is empty and the only tag is v0.1.0; npm latest 0.2.0 (published 2015-09-09) is used for currentMajor and latestReleaseDate, and firstRelease comes from the npm package's creation in 2015. The install docs name gulp-makdoc, which is the registry package recorded. The package has peer dependencies only, as the README says; the Node runtime is not stated on any page read and is not recorded. The README's Links section names three Korean-language blogs and a Yeoman generator; none is a field.
  Usage, from the README: tasks run through the gulp command (gulp builds, gulp server runs a local live-reload server, gulp watch rebuilds on changes), and the default target directory is dist. Markdown and Handlebars documents become HTML, and Handlebars templates become files such as index.html and sitemap.xml, decorated with layouts and partials. Document metadata comes from a model.json file beside each document, not from YAML front matter. The README shows deploying the dist output to GitHub Pages with gulp-gh-pages. basedOn gulp is not recorded because no page states the parent in words; the README only shows gulp commands. outputDir is not a field; the value is in this note.
