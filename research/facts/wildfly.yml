notes: >
  Accepted: a Java application server on GitHub (Apache-2.0, not archived, last push 2026-10-30) that the Getting Started guide runs from a zip or tgz distribution with standalone.sh or domain.sh. The stable release is 42.0.0.Final (2026-10-22), major 42; the 42.0.0.Beta1 prerelease (2026-10-08) is older than the final, so latestPrereleaseDate is absent. firstRelease is 2013 from the Maven Central upload of org.wildfly:wildfly-dist: its first version 8.0.0.Alpha1 has a timestamp of 2013-05-18 in the search.maven.org index, which is older than the oldest GitHub release (17.0.0.Beta1, 2019-05-24); the project's own pages give no first release date. The maintainer is recorded as the about page words it, "an open source community project sponsored by the Commonhaus Foundation"; the foundation sponsors the project and is not recorded as parent. Maintenance policy from the about page: the 41 series is maintained until 42 is released, and earlier releases are no longer maintained; that is a support policy, not an end signal, so the status is accepted. The about page also names the Commonhaus Foundation OSSI as a source of end-of-life support for organizations that depend on EOL releases; a third party's support is not recorded. The Getting Started guide says Java SE 17 or later and recommends Java SE 25; runtimeMin is the minimum. The WildFly Preview and EE 10 variants share the distribution family and are not recorded as separate records. The downloads page and news page name the Maven Central Galleon feature packs for WildFly 42; the install docs name the zip, so Maven coordinates are recorded only as the registry id of the distribution. Contributors counted with per_page=1 and the rel="last" page, which is 298. The homepage lists Zulip chat (wildfly.zulipchat.com) and the Google Groups forum; the forum field takes the Google group. The x field is an icon link in the homepage footer (x.com/WildFlyAS), quoted by the footer's "Follow us" label because the icon has no text. The GitHub homepage field in the API is https://wildfly.org; https://www.wildfly.org answers 200 and is recorded. Fields coined: none.
