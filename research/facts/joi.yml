notes: >
  The README's Installation section gives the npm command, which is the installMethod quote. The README's Documentation and API link (joi.dev/api/) answers 404, as does joi.dev/api; the joi.dev landing page and the modules page were read. The joi.dev landing page describes chainable validators, cross-field references and conditional schemas, and an extension system for custom schema types. The project has no GitHub releases, so currentMajor and latestReleaseDate come from the npm latest tag, and the joi.dev module status page lists version 17 beside the current line with a lower Node.js minimum. GitHub detects no license (NOASSERTION); the license is taken from the manifest at the latest tag. The LICENSE.md copyright lines name Project contributors, Sideway. Inc. and Walmart; Sideway. Inc. is recorded; the joi.dev footer names the hapi.js team, so the footer is not used for the maintainer. The npm package is the one the README names; stars and contributors belong to the hapijs/joi repository. The npm latest-17 tag is a separate maintained line and is not recorded as a fact.
