notes: >
  Doubt: whether Boulder is in scope. The boundary rule admits a certificate authority only when its own pages say it serves, protects or exposes websites or web apps. Boulder's README says it "is the software that runs Let's Encrypt" and that it is "intended only to support the Web PKI"; the website statement ("enable HTTPS (SSL/TLS) for websites") is on letsencrypt.org/about, the service, not on Boulder's pages. The README also says the Docker development environment is "not suitable for production usage" and that the maintainers "recommend evaluating a project other than Boulder" for organizations, so no site owner installs it to serve a site. Settle by a boundary decision on whether CA software that only its operator runs counts as server software for websites. The project has no homepage of its own (repository homepage field is empty); the operator's site is letsencrypt.org. The release tags are calendar strings (v0.20261027.0), so currentMajor is not recorded. The Internet Security Research Group is named as the copyright holder (LICENSE.txt "Copyright 2016 ISRG") and as the service provider on letsencrypt.org/about; the legal form and country are not on the pages read. firstRelease is the oldest GitHub release, release-2022-03-22.
