notes: >
  The record covers the hosted Shopify platform. The storefront docs name Hydrogen, a headless toolkit, and Oxygen, hosting for what is built with it; neither is recorded as a runtime of the platform, and Hydrogen's own repository is not used. The terms of service are a service agreement and state no license, so no license fields are recorded; licenseModel follows from the hosted-service status. The pricing page lists staff accounts and, under POS Pro, staff roles and permissions; these are not recorded as userRoles because the page does not state the admin permission model. The compare page lists named platforms in its Shopify vs. headings; each is recorded as alternativeTo. No version or release fields exist for a hosted service.
