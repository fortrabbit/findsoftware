notes: >
  The repository has tags but no GitHub releases, so latestReleaseDate and currentMajor come from the npm package ress: its latest version 6.0.0 matches the highest stable tag 6.0.0, and the npm time entry gives its publish date. The older tags (v1.2.2 and the v-prefixed lines) are not the current line. firstRelease 2015 is the oldest tag, v0.3.0, dated by its commit (2015-11-13); the npm registry starts at 1.0.0 in 2016. The README says the project "uses Normalize.css under the hood with some customizations", a dependency and not a basedOn statement. The categories value is css-framework because the import map has no css-reset value; the reviewer decides whether that mapping fits a reset. The CDN links (unpkg, jsDelivr) are part of installMethod. The homepage and docs pages answer over HTTPS and carry the install text in their HTML.
