notes: >
  No stable version exists on npm: the only versions are 1.0.0-alpha.* and the npm latest tag points at 1.0.0-alpha.80 (2023-06-12). The repository has no GitHub releases or tags, so currentMajor is left unknown. The homepage install example names cuttlebelle@1.0.0, which is not on npm. The GitHub languages list ranks HTML first by bytes; JavaScript is the language of the code. The README lists a CHANGELOG, which was not fetched.
