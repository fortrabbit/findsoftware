notes: >
  The CSV row dates the repository, not the software; the latest GitHub release is v3.2.1 (2026-05-15). Plausible Community Edition is AGPLv3, the deployment repo plausible/community-edition is MIT, and the cloud service is separate. The self-hosting docs describe the CE as a twice-yearly long-term release, while the cloud ships several times per week. The "docker" field is recorded as a coined kind for the official compose setup. The repository file reads (mix.exs, .tool-versions) are at tag v3.2.1. The "contributors" count is from the GitHub contributors API with anonymous contributors included.
