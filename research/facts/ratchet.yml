notes: >
  Status accepted from the candidate row. The homepage socketo.me answers only over plain http (https returns no connection), so it is not linked, and the documentation pages named here (docs/install, docs/deploy) are on the same http-only site; the install and runsAs quotes come from those pages. The default branch is 0.4.x (last pushed 2026-06-14). The latest stable release is v0.4.4 (2021-12-14), a 0.x line: currentMajor is 0 and the minor line is 0.4. The README opens "Reviving Ratchet!" and says the project is being revived, with no end statement, so no status signal. The last release is more than four years old, so the import will move this record to stub unless a newer release appears. The earliest tag is v0.1 (commit date 2012-05-11, the same date as the first Packagist version). Packagist monthly downloads at the same read: 420955 (monthly); recorded total only. The composer.json at v0.4.4 requires react, ratchet/rfc6455, guzzle psr7 and Symfony routing and http-foundation; these are dependencies, not basedOn. The README Install section names Composer and says the library supports PHP 5.4 through PHP 8+; its Requirements section says shell access is required and root access is recommended, and that a reverse proxy or a second machine is needed to serve WebSockets on port 80 or 443 beside a sync web stack. The README's "Need help?" forum link is the project's Google Group. The project's owner is the GitHub organization ratchetphp; the LICENSE copyright line names Chris Boden alone. Contributors counts the contributors endpoint with per_page=1, read from the rel="last" link (50).
