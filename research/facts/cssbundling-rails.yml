notes: >
  No homepage: the repository is the only project page, and the GitHub homepage field is empty. The gem's own README is its documentation, so no docs field is recorded. The maintainer is the LICENSE copyright line (David Heinemeier Hansson); the gemspec lists David Heinemeier Hansson and Dom Christie as authors, and the GitHub owner is the rails organization. Rails is basedOn because the README says the gem delivers its output "via the asset pipeline in Rails"; Tailwind CSS, Bootstrap, Bulma, PostCSS and Dart Sass are the bundlers it installs, not parents. Node and yarn are required at build and watch time, and the README names npx 7.1.0 or later; no Ruby version is stated, so runtimeMin is unknown. The build step (css:build attached to assets:precompile and test:prepare) runs wherever the Rails app is built, the gem does not run on the live site by itself, and the README does not say where the production build runs, so runsAs stays local and the reviewer may decide. The first GitHub release is v0.2.7 (2021-12-03), and older tags exist without releases; the repository was created 2021-09-07, so firstRelease is 2021 either way. The rubygemsDownloads figure is the gem total as the RubyGems API states it, with no period. The project has no prerelease.
