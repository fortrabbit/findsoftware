notes: >
  The homepage listed on GitHub and PyPI is http://simiki.org/, which answers only over plain http (no TLS), so it is not linked and homepage is listed in notFound. The site on that address is the project's own and shows the software. PyPI reports the download counts as -1 (unavailable), so pypiDownloads is not recorded. GitHub has 31 tags from v0.1.0 to v1.6.2.3 and no GitHub releases; the tag v1.6.2.3 and the PyPI release of the same version are both dated 2019-05-11. The README's changelog lists the last version as 1.6.2.3 (2019-05-11). Simiki's README does not name its template engine, so templating is left unknown.
