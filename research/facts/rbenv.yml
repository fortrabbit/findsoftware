notes: >
  rbenv.org is the project's own site and serves the install script; it names Sam Stephenson as "the original creator of rbenv", which matches the LICENSE copyright line. The README says rbenv is a version manager, not a runtime; no runtime is recorded because it is a Bash-based shell tool, and Shell falls outside the language vocabulary, so the import drops it (as with phpenv and pyenv). The oldest tag is v0.1.0 (commit 2011-08-11), which has no GitHub release; the first GitHub releases are from 2013-10-07, and no page states a first-release year, so firstRelease is 2011 from the oldest tag commit. The CSV lastRelease (2025-01-08) is current: v1.3.2 is the newest stable release, and the major is 1. The README says rbenv "is a version manager tool" and that the ruby-build plugin provides rbenv install; ruby-build has no record. The wiki page "Comparison of version managers", linked from the README, describes other version managers; asdf and mise have records, so alternativeTo is asdf and mise (the page also names chruby, direnv, frum and RVM, which have none). The page names mise as rtx, its former name: the rtx link now redirects to jdx/mise. Build and install routes are listed as the README gives them; the README says the Debian and Ubuntu package is out of date, which is recorded only here. The pyenv record names rbenv as its fork parent (forkOf), and the rbenv README does not name pyenv.
