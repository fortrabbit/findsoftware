notes: >
  The npm package @electric-sql/pglite is the core the install docs name; GitHub publishes one release per package (for example "@electric-sql/pglite@0.5.13", dated 2026-10-28), and the alpha tags v0.2.0-alpha.0 to alpha.9 are older than that release, so no latestPrereleaseDate is recorded. The README badge reads "Status - Alpha"; the homepage and docs state no status, so no status is recorded. The npm weekly figure is the sum of the daily counts for 2026-10-19 to 2026-10-25; the npm point endpoint returns a stale window. The Electric legal terms name Electric DB Inc. and give a Wilmington, Delaware address for legal notices, which is a registered-agent address; no headquarters country is recorded. The Electric company also runs a hosted cloud for its sync services; the terms describe it as a managed platform for those services, not for PGlite, so no hostedOffering is recorded. The database's content is kept in memory, in the file system (Node and Bun) or in IndexedDB (browser), as the about page states; the contentStore vocabulary has no value for that, so the storage details stay in notes. The Discord link is the README badge alt text; the homepage links the same URL as an icon.
