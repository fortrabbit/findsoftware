notes: >
  Stub: the homepage named by the candidate row, and the project's website at www.simplesoftware.io that the Laravel docs and the package's composer.json name, now serves unrelated gambling content (its raw page carries the title "XOILAC TV"), so no homepage is recorded and the record is a stub until the project's own site or a maintained docs page settles it; the install steps in the repository's docs/en/README.md still name the route. The stable release 4.2.0 is dated 2021-02-08 and is the newest release on GitHub and Packagist; the release age alone would move the record to stub under the four-year rule. The candidate row's homepage is a GitHub docs file; the repository docs are recorded as docs. The repository's default branch is develop and the README asks pull requests for it; the 4.2.0 tag and its composer.json are cited for runtimeMin. The README's "Use Cases" section names one customer site, not a fact field. The Packagist total is since listing. The composer.json lists ext-gd and the bacon/bacon-qr-code package as requirements; these are package dependencies and are not recorded as basedOn, since the README names Bacon/BaconQrCode as the work the wrapper is based on but that is not a record. The repository docs say the PNG format needs the imagick PHP extension; not recorded as a field. The maintainer is recorded from the LICENSE copyright line; the Packagist maintainers are individual accounts. The HTTP Archive technologies file lists no Simple QrCode entry, so httpArchiveSites is absent.
