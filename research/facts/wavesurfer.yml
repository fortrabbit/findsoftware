notes: >
  The CSV homepage is https://wavesurfer.xyz and answers as such. The site's About page says the library is licensed under a Creative Commons Attribution 3.0 Unported License, while its footer, the LICENSE file and the repository say BSD-3-Clause; each statement is its own license entry. The About page also says the project started in March 2012 and the library is written by katspaugh with the help of many contributors; the Contact page asks questions to go to the forum. The repository's owner is the user katspaugh, and the license file names katspaugh and contributors as the copyright holder, so the maintainer is katspaugh. The package is TypeScript and ships its own types, which the README states; no typings package is involved. The README and the homepage both say the library is for audio waveforms in web applications, and the homepage lists HTML5 Audio and Web Audio support; the runsAs browser value rests on the FAQ sentence about decoding in the browser. The README's getting-started example sets waveColor and progressColor among the options, and the README says the docs cover common use cases, plugins, framework integration and troubleshooting. The official plugins (Regions, Timeline, Minimap, Envelope, Record, Spectrogram, Hover) are named on the README and the examples page, and no plugin directory page is recorded. The FAQ says audio is decoded entirely in the browser, so large clips may fail to decode for memory reasons, pre-decoded peaks are recommended for large files and are needed for streaming, and audio fetched from another domain needs CORS headers. The npm package is the one the install section names; the registry figure is summed over the 2026-11-01 to 2026-11-07 range, since the last-week endpoint returns a stale window. The first tag 0.0.1 has a commit dated 2013-12-16; the npm package first appears as 0.0.6 on 2014-03-14, and the repository was created in 2012. The current line is 8.x: 8.1.0 is the latest stable release on GitHub and npm, and 8.0.0 beta releases in 2026 are older than it. The v7 line is documented under Shadow DOM CSS styling but is not the current major. The README's FAQ names audiowaveform and a Closed Caption Creator sponsor line; neither is recorded. The CDN route on the homepage quick start (a jsdelivr ESM import) is the same script route as the README's UMD tag, so one script tag installMethod covers it.
