notes: >
  The README has no install section: it links to the demo and usage page, so the install routes come from that homepage's quickstart. The quickstart lists npm and bower commands, GitHub and the CDNs; the npm and bower routes are recorded without a quote because the page gives them as commands. The GitHub release v1.0.0 was created on 2026-06-15 for a tag committed on 2023-01-30, and the npm registry shows 1.0.0 published on 2023-01-22, so latestReleaseDate takes the registry date. The oldest tag is v0.0.2, committed 2015-04-27, which sets firstRelease. The homepage's chat link on Gitter is a community channel with no field. No runsAs is recorded: the homepage sentences about the DOM and the browser scrollbar describe the mechanism, not a process model. The README calls it a tiny vanilla JS plugin. The LICENSE copyright line names Denis Lukov, and the homepage credits Denis Lukov with GitHub, LinkedIn and Twitter links; the maintainer is the individual named there. The npm figure counts downloads of clusterize.js for the week 2026-10-26 to 2026-11-01. Prose sources: the homepage's "How does it work?" section gives the DOM and spacer-row mechanism, the rows option takes an array of strings, the existing-markup option takes the page's own markup, and the container tags are table, ol, ul and div; the quickstart includes the stylesheet and the script.
