notes: >
  Accepted: a Python form validation and rendering library, criterion 1 through its own README, which says it can work with whatever web framework and template engine you choose. No basedOn: the README says it is designed to work with any framework, and the framework integrations it names (Flask-WTF, Starlette-WTF, Bootstrap-Flask) are community libraries that build on WTForms, not parents of it. Flask-WTF, WTForms-Alchemy, WTForms-SQLAlchemy and WTForms-Bootstrap5 are separate projects and are not recorded as plugins. maintainer: the LICENSE copyright line reads "Copyright 2008 WTForms"; the repository is hosted under the pallets-eco GitHub organization, which is not recorded as the maintainer under the copyright-line rule. The PyPI project links a Chat at discord.gg/pallets, the Pallets community server; the record uses the Discord link in the project's README. firstRelease 2008 is the oldest tag of any kind (0.1, commit dated 2008-07-25); the first PyPI upload is 0.4 (2009-10-10). The fact file uses the PyPI name wtforms (the JSON API name is WTForms). pypiDownloads is the pypistats last-month figure, which the PyPI API no longer reports. The docs' Sphinx footer states "Copyright 2008 WTForms" and names no legal entity. The translation service hosted.weblate.org is named in the README and is not recorded. The docs link is the stable docs root, and the homepage is the readthedocs root named in the README and in the CSV.
