notes: >
  The project's README says Arctic was deprecated on July 2026 and points to a deprecation post, which states the npm package is deprecated and that its author has not touched the project in nearly a year; the homepage carries the same notice, so the record is discontinued. The post names no successor package: it points to example code under the repository's code folder and to the Auth Book, which are not packages. Two other Oslo and Lucia packages are named in the same post; they belong to other projects and are not recorded here. The README names the website arcticjs.dev, which redirects to arctic.pilcrowonpaper.com; the redirect target is the homepage. The README says the project is maintained by Pilcrow, and the homepage says the site is maintained by Pilcrow; the LICENSE copyright line names pilcrowonpaper, which is the maintainer recorded here, and Pilcrow is noted but not recorded as a legal entity. The npm package is marked deprecated on its latest version with the registry's generic notice; the npm readme says the library is runtime-agnostic and built on the Fetch API, so no runtime is recorded. The first GitHub release is v1.1.1 (2024-01-31), and the npm history from 2015 belongs to an earlier package under the same name, so it is not used for firstRelease. Old documentation lives in the repository README and the homepage links to it, so no docs URL is recorded. The npm weekly figure covers 2026-10-26 to 2026-11-01, and the last GitHub release is v3.7.0 (2025-05-21).
