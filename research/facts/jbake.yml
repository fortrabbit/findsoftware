notes: |-
  The homepage https://jbake.org/ answers over https (the GitHub homepage field and the CSV use http, which redirects to https). The latest stable GitHub release is v2.7.0 (2025-12-26), and the early-access release (2025-12-30) is a prerelease. The project's download page still lists v2.6.7 as the latest distribution, while the homepage news announces the v2.7.0 release candidate; the GitHub release history is used for the version. The oldest GitHub release is v2.2.0 (2021-04-12), but the oldest tag is v2.0, whose commit is dated 2013-03-13, and Maven Central lists jbake-core from 2.1 (2013-09-22), so firstRelease is 2013. The GitHub organization type is recorded from the users endpoint; the maintainer is the JBake Team named in the homepage footer. The homepage links a Gitter chat room for the project; no forum fact is recorded for it.
   Coined content-format fact moved here: the homepage says it "Supports AsciiDoc, Markdown and good old HTML formatted content". The homepage also lists plugins for Gradle, Maven, mill, SBuild and sbt.
