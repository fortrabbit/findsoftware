notes: >
  The docs site at kahlan.github.io/docs is older than the 6.1.3 release: its getting-started page states "PHP 5.5+" and its Composer line reads "kahlan/kahlan": "~4.0", so the requirement comes from composer.json at the 6.1.3 tag and the installMethod quote is the sentence that still applies. Maintainer is the LICENSE copyright line; no legal form is stated anywhere the research found. Default branch is dev. The README names an IRC channel (#kahlan on freenode) and no other community space. Adoption figures: GitHub stars and contributors on 2026-11-16, Packagist total downloads on the same day. firstRelease from the 1.0.0 tag commit, matching the Packagist first upload of 2015-01-24. The README says Kahlan lets you stub or monkey patch your code directly without any required PECL-extensions, and that mockery or prophecy are no longer needed; that describes its own stubbing and is not a basedOn statement. The README and the docs state phpdbg or Xdebug as a requirement for code coverage analysis only. The README's git clone route runs the project's own specs from a checkout and is not recorded as an install route for a user's project. The docs describe the Composer package as a development dependency, but no sentence says where tests run, so runsAs is absent.
