notes: >
  Two release lines share the repository: bootstrapvuenext-v tags for the library and nuxt-v tags for the Nuxt module (@bootstrap-vue-next/nuxt, a separate install step on the Nuxt page), plus an mcp-v tag. The figures use the bootstrapvuenext-v tags and the npm package the Getting Started page installs. firstRelease is the earliest GitHub release, 0.0.1-alpha dated 2021-07-26. The homepage names VividLemon as an administrator; the LICENSE copyright line names BootstrapVueNext, which is recorded as the maintainer, and the npm author field is empty. The OpenCollective donation links on the homepage are not recorded as a paid edition.
