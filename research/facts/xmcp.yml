notes: >
  Highest stable GitHub release is xmcp@1.8.0 (2026-10-22), so currentMajor is 1. The install docs name create-xmcp-app, a scaffolder, so the registry figures come from the core package xmcp. The build runs through @xmcp-dev/compiler, a separate npm package that the Vercel guide says to keep installed as a development dependency during the build; the built server is self-contained at runtime. The installation page names an HTTP transport, which runs on a server, and a STDIO transport, which runs on the user's machine; runsAs records the production server (always-on) and the Vercel Function (per-request) only. The docs name Next.js, Express and other adapters, which add xmcp to an existing app; they are not recorded as basedOn. The integrations (Polar, Stripe, Upstash and others) are third-party services, not recorded. The Vercel OSS Program badge and "Supported by Vercel" in the site footer are not recorded as parent. The maintainer is the copyright holder in license.md. firstRelease is the year of the first npm publish.
