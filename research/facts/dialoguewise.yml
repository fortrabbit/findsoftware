notes: >
  The homepage answers 200 but serves only a script shell, so the homepage fact cites the footer link on the docs introduction page, and the description rests on the docs. The docs say the product is a headless CMS with a web portal, a Pilot and Publish deployment and a Test sandbox, and that it delivers content through an API at api.dialoguewise.com. The docs do not state the API style, so headlessApi is unknown. The features page lists location and device based delivery and sentiment based delivery; these are described as delivery features and no i18n field is recorded. The docs list SDKs for Angular, .Net, NativeScript and Flutter, and integration guides for Gatsby, Next.js, React and Vue. The Github repo link in the docs points to github.com/dialoguewise; no repository was read, so none is recorded. Plans, prices and the free trial are on pages that did not render, so no pricing fact is recorded. The docs state that "content is delivered via API" and list webhooks that send real-time notifications on content changes, a global CDN, image transformations through URL parameters, and a test sandbox; the starter list has no field for these, so they are noted here only. The GitHub organization dialoguewise holds client libraries and demo apps (a Dart package under BSD-3-Clause, a Gatsby source plugin) and a repository named dialoguewise with no description; none is the CMS, so no repository is recorded. The sitemap lists use-case, pricing, about and sign-up pages that render only through JavaScript.
