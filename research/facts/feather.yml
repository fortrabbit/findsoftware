notes: |-
  The homepage is a client-rendered shell; its title and the "Made by @colebemis" credit were read from the page, and the homepage links the author's personal X account (twitter.com/colebemis), which is not recorded as x because it is not an account the project names for itself. The README names the npm package feather-icons; the npm package named "feather" is an unrelated project and is not used. The CDN delivery named in the README (jsDelivr, unpkg) is not a separate field. The firstRelease is the oldest GitHub release (v2.0.0, 2017-05-24); the repository was created in 2014, and no earlier release is recorded. The homepage shows v4.29.0 while the latest stable release is v4.29.2; no version is recorded from the homepage. The README describes feather.icons[name].toSvg(), which returns an SVG string, and feather.replace(), which swaps elements carrying a data-feather attribute for their icon; it also offers a sprite file and CDN delivery. Its "Related projects" section links framework wrappers such as react-feather and vue-feather-icons, which are separate projects.
   The README opens with "Feather is a collection of simply beautiful open-source icons. Each icon is designed on a 24x24 grid", shows a Node usage with require('feather-icons'), and says Feather is available as a Figma component library. The install routes recorded are the ones the README lists: npm, a CDN, copying feather.js or feather.min.js, and copying the sprite file.
