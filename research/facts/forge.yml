notes: >
  The homepage answers with a meta refresh to forge/v3/, a Storybook app that renders no text without JavaScript, so the docs fact cites the Installation page in the repository, the page the docs site publishes. The install docs name @tylertech/forge; the monorepo's latest GitHub release is forge-mcp@1.3.1 (2026-10-26), a different package, so currentMajor and latestReleaseDate use the @tylertech/forge@3.23.0 tag. The npm dist-tags include next (3.0.0-next.31) and dev (3.14.4-dev.0), and the newest prerelease in npm is 2026-05-13, older than the latest release, so latestPrereleaseDate is not recorded. The version-2 line is still published on npm, which is a maintained older major, not an end. The design system is described by the README as a derivative of Material Design; that is a design language and not a software parent, so basedOn is not recorded. The maintainer is the author named in the package.json, and the Apache license file names no copyright holder. The headquarters quote is the Tyler Technologies corporate address on its own site; the country code follows from Texas. The npm weekly figure is the sum of the daily counts for 2026-10-18 to 2026-10-24. The contributors count is the last page of the per_page=1 listing. runsAs is browser because the installation page has the page import the components to register them in the browser's custom element registry. The public documentation site is the forge.tylerdev.io Storybook; forge.tylertech.com, which the package README calls the design system site, answers with a sign-in redirect. The package README says the web components can be used with any modern web framework or no framework at all, and the repository README lists React and Angular adapter packages beside the core web components package. The installation page describes the package as ES modules, pre-built CSS stylesheets and Sass sources, and links framework guides for Angular, React, Vue, Svelte and Blazor. The repository also holds a rich text editor package and an MCP server package, each released separately.
