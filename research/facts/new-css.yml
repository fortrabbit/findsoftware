notes: >
  The install docs name @exampledev/new.css, the npm package the README and usage page load from jsDelivr; no npm package named new.css exists, so the npm figures count @exampledev/new.css only. The npm weekly download range is 2026-10-18 to 2026-10-24. The repository's GitHub homepage field and the CSV name new.css.site; the README calls newcss.net the demo, and the npm manifest names newcss.net as its homepage, so newcss.net is recorded. The site new.css.site serves the same pages. The LICENSE copyright line names Brendan Hersh and the GitHub owner xz is an organization account with blog xz.style; the npm manifest author field holds a placeholder name and is not used. The only GitHub release is v1.1.3 (2020-05-20), and the default branch main was pushed 2026-09-04. The site footer lists "Sponsors: none (currently!)", so no sponsor fact is recorded. The new.css README calls the project a classless framework and says community ports exist for other platforms; no port is recorded. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header. Dependent counts are ecosyste.ms figures for @exampledev/new.css. The HTTP Archive technologies list has no new.css entry.
