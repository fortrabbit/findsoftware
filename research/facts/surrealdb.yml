notes: >
  The core database code in this repository is under the Business Source License 1.1; the LICENSE parameters name SurrealDB Ltd. as Licensor, add an Additional Use Grant that forbids use of the Licensed Work as a Database Service, and set Change License to Apache License, Version 2.0 with a fixed Change Date (2030-01-01). The README says the SDKs and libraries are under Apache 2.0 or MIT, in their own repositories; those licenses and their adoption figures are not recorded here. The GitHub API reports NOASSERTION for this repository. The docs installation page and the about page name a 4.0 beta, and the about page calls v4.0.0-beta.1 the latest release; no GitHub release or tag of that name was found (the tag lookup returned 404), so no prerelease date is recorded and this is not recorded. The newest GitHub prerelease, v3.3.0-beta.4 (2026-09-28), is older than the stable v3.3.5, so latestPrereleaseDate is not recorded. The about page gives the 2022 public launch; the oldest GitHub release is v1.0.0-beta.1 (2022-07-18). The Enterprise plan is a self-hosted edition priced on request; the pricing page marks single sign-on as an add-on or an inclusion per plan, and the plan column mapping was not read, so sso is not recorded. The Cloud plans and their prices are not recorded. Agent Memory, a product on the same engine per the about page, is not recorded. The alternativeTo entries come from the project's own comparison pages, one per record id. Fields coined here: none.
