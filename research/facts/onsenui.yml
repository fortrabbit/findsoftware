notes: >
  The homepage answers with a bot challenge (Cloudflare) to this research client, so it is recorded from the npm package's homepage field and is not read; for the same reason the site's guides could not be read and only the links the README gives are recorded. The GitHub API reports no license for the repository; the Apache License 2.0 text is at onsenui/LICENSE in the repository and the npm package states Apache-2.0. The LICENSE copyright line names ASIAL CORPORATION, recorded as the maintainer; the npm maintainer list uses asial.co.jp addresses. The most recent GitHub release is from 2022; the npm latest is a later release of the same major, so the registry date is used for latestReleaseDate. The Discord server is community-run, as the README states. The README names Monaca, a separate toolkit made by the Onsen UI team, which is not a record of its own here. The npm figures count onsenui, the core package. The README names community packages for Aurelia and EmberJS; they are not recorded. The README states that the core library is pure JavaScript on top of Web Components and framework agnostic, names binding packages for React, Angular 2+, Vue and AngularJS 1.x, and says both flat (iOS) and Material (Android) designs are included, auto-styled per platform by default.
