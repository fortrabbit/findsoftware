notes: >
  The repository README calls itself a development monorepo; the npm package react-native-web sits in its packages folder and is the one the homepage install command names, so the figures are for that package. The major is 0: the latest GitHub release is 0.21.4 (2026-10-08), and the project keeps the 0.x line. The homepage and docs name React Native as the parent of the components and APIs, but no record for React Native exists; basedOn names only React, through the docs statement that the project "builds upon React DOM", and the reviewer should decide whether that counts. The docs say the project is a compatibility layer between React DOM and React Native. The homepage copyright line names "Nicolas Gallagher and Meta Platforms, Inc."; the LICENSE file names Nicolas Gallagher alone, which is recorded as the maintainer, and Meta Platforms, Inc. is named only in the homepage footer. The npm dist tags next (0.11.0-alpha.3) and canary builds are older or not releases, so no latestPrereleaseDate is recorded. The record has no runtime, because the sources state none; the package engines field is not read as a runtime. The category react-native has no entry in the category map, so the record takes ui-library only. The package has no social links on the homepage or in the README. The docs page says React Native for Web makes it "straight-forward for React DOM apps to incrementally adopt the framework" and that components author their styles in JavaScript, which are converted to native CSS. The docs introduction says the library "can be used in new and existing apps, web-only and multi-platform apps". The setup page describes pre-rendering the app ("server-side rendering or build-time rendering") with module-alias; renderingModes is not recorded because rendering support of a UI library is compatibility, as for Nebular.
