notes: >
  The homepage at fontawesome.com is a client-rendered shell; its text and navigation could not be read, so the homepage fact rests on the page's own address and the social links come from the footer of the docs site. The footer's Mastodon link points at Web Awesome, a separate product by the same company, and is not recorded here; Web Awesome is its own candidate. The GitHub API reports the license as NOASSERTION; the README states three licenses for the Free download (icons CC BY 4.0, fonts SIL OFL 1.1, code MIT), and the npm package carries the expression (CC-BY-4.0 AND OFL-1.1 AND MIT). The Pro license page is client-rendered and its text could not be read, so the Pro edition is cited to the get-started page only. The contributors count is the last page of the per_page=1 contributors listing, which reads 5 on the default branch 7.x. The oldest tag in the repository is 2.0.0, an annotated tag with the message "release 2.0.0" dated 2012-06-04, which is older than the first npm upload of font-awesome (3.2.1, 2013-07-02), so firstRelease is 2012. The docs name the npm package @fortawesome/fontawesome-free for the free packages and @fortawesome/fontawesome-pro for Pro, and the registry figures are for the free package. The HTTP Archive figure is the mobile count of the Font Awesome technology entry. The README states versions 3, 4 and 5 are end-of-life while version 6 is in long-term support; the project itself is not ended, so no status change is recorded. The docs define Pro+ icons as available only through Kit packages. endoflife.date tracks Font Awesome by cycle under the id font-awesome. The docs describe two self-hosting routes from the downloaded files, web fonts with CSS and SVG with JavaScript.
