notes: >
  Boundary resolved: the CSV row says no versioned release was found, but Oracle's ADF documentation states a current release, 14.1.2.0.0, and the ADF homepage lists it as the "14 Release (14.1.2.0)"; currentMajor is 14 from that page, not from a registry, so it is a vendor statement and not a GitHub release. The CSV homepage https://www.oracle.com/application-development/technologies/adf/ answers 404 to curl, so the homepage recorded is the ADF page Oracle links as its technical overview. Criterion 2 holds on the install pages: the application server needs the ADF runtime, installed into WebLogic Server with the Fusion Middleware installers; the pages read name no other server, so GlassFish is not recorded. The license was not found: no page read states the license of ADF or ADF Essentials, and the Oracle license pages named in the links did not answer, so license and licenseModel are unknown. The ADF homepage labels "Oracle ADF Essentials - FREE"; that is a price statement without a license, so no paidEdition is recorded. The 14.1.2 index says the release runs on a newer platform and keeps the development features of 12.2.1.4. The ADF runtime requirement names no minimum Java version: the release notes name Java 17 and Java 21, so runtimeMin is absent. No first release year is stated on the pages read; the older-version list names 10.1.3 and 11.1.1.9 without dates. The ADF homepage calls ADF an end-to-end Java EE framework, and the 14.1.2 index says it builds on Java EE standards and open-source technologies; no basedOn is recorded because a standard is not a parent project. The 12.2.1.4 deployment page says ADF applications are packaged as an EAR file for deployment and that installing the runtime is not required when JDeveloper runs them in its Integrated WebLogic Server; it also says the application server runs ADF applications; no run model (always-on, per-request) is stated, so runsAs is absent. Oracle Java Cloud Service is named as a deployment target on that same page, and the free cloud tier link on the homepage is generic, so neither is recorded as hostedOffering.
