notes: >
  The LICENSE copyright line names Zeno Rocha without a legal form, and the homepage footer says "Made with ♥ by Zeno Rocha under MIT license", so the maintainer is an individual. No runsAs is recorded: the README sentences about older browsers and the Selection and execCommand APIs are support statements, not a process model. The homepage footer says "Brought to you by Liferay", a sponsor credit with no ownership statement, so no parent is recorded. The README's bonus browser extension is a separate product and not a plugin of the library. The npm figure counts the package clipboard, which the README installs, for the week 2026-10-26 to 2026-11-01. The repository is not archived; the latest release v2.0.11 dates from 2022-05-04, and the release age does not change the status. The GitHub releases start with v1.0.0 on 2015-09-28. Prose sources: the README's usage section names the data-clipboard-target, data-clipboard-action and data-clipboard-text attributes and the target and text options that take a function, the success and error events, the event delegation, and the note that the library includes no CSS or tooltip; the README's tooltip suggestion for the error state is the feedback the prose mentions.
