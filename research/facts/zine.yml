notes: >
  The homepage (https://zine-ssg.io/) states "Warning Zine is beta software" and "not all planned features have been implemented yet"; no status is recorded from it, since a beta label is not an end signal. The project has no pre-release, and every GitHub release is marked stable. The first release is v0.2.0 (2024-07-27), the oldest GitHub release object; the oldest tag v0.1.0 is from 2024-07-25. Zine is installed from a downloaded binary or built from source with Zig, and the docs also show integration as a Zig dependency through zig fetch; the minimum Zig version in build.zig.zon is a development version and is not recorded as runtimeMin. The live site is static files; the dev server (zine, served at localhost) is recorded as a local runsAs entry. The docs name GitHub Pages, Cloudflare Pages, Codeberg Pages and sourcehut pages as deploy targets, and a GitHub Action (setup-zine) as the way to run Zine in CI. The content format is SuperMD, an extension of Markdown, and the layouts use SuperHTML; neither is basedOn, because they are Zine's own languages. No basedOn is recorded: the project is written in Zig and built on no CMS, framework or generator. Maintainer per the LICENSE copyright line and the community page ("designed and maintained by Loris Cro").
