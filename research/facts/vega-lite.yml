notes: >
  Maintainer from the LICENSE copyright line (2015); the homepage team sentence names the UW Interactive Data Lab as leading development. Runtime is not recorded: no page reads names Node.js as the runtime of the library (the compile page only shows npx and node_modules/.bin commands), and the embed page says the library goes "on your own web page" without a sentence stating it runs in the browser, so runsAs is left out for the reviewer to decide. The npm package engines field says node >=22; that is a build-time requirement of a browser library and is not a runtime. The compile page's npx CLI (vl2png and similar) is not a separate record. Dual or second license: none. The npm versions 0.9.1 and 4.5.0 are deprecated on npm; the latest 6.5.0 is not, so no end signal. Latest prerelease on GitHub (5.x rc and next tags, 2019 to 2023) is older than the latest stable release and is not recorded. The "vega-lite" npm figure covers 2026-11-01 to 2026-11-07. Stars and contributors belong to the vega-lite repository. Coined kinds: the rendering target is Vega's (Canvas or SVG) and not repeated here. The locale config (number and date formatting definitions) is the basis of the i18n entry. The slack link is the Vega Slack invite on the homepage. The Altair Python API named on the Vega homepage is not a record in this dataset.
