notes: >
  The homepage https://qr-code-styling.com answers 200 over https. It hosts a browser demo of the library ("Try it here" in the README and the page's generator form), not a hosted service, and its footer badge reads npm v1.8.3, older than the 1.9.2 release. The README's only install route is npm, under its Installation heading. The Usage example is an HTML page that appends the generated code to a div element, and it loads the library from unpkg at version 1.5.0 in a script tag; that is a code example, not an install sentence, so no script-tag installMethod is recorded. The README's Node Support section says the library can be used on a node server by passing the node-canvas or jsdom object, and that getRawData returns a Buffer instead of a Blob; it names no Node version. The package.json engines field (node >=18.18.0) is a build floor, so neither runtime nor runtimeMin is recorded, and no runsAs is recorded because no sentence says where the library runs. The latest release is 1.9.2 (GitHub release and npm, 2025-04-11), so currentMajor is 1; the npm dist-tag latest is the same version. firstRelease is 2019: npm's time record gives version 0.1.0 on 2019-08-26, earlier than the oldest GitHub tag v0.3.0 (committed 2019-09-23); the repository was created 2019-08-07. The license is MIT in package.json and in the LICENSE file, and the copyright line names Denys Kozak, recorded as maintainer; the npm author and maintainer fields name the same person and the email addresses are not recorded. The README calls the options passed to the qrcode-generator library a dependency, not a parent, so no basedOn is recorded. The README's Extensions section links one third-party npm extension, qr-border-plugin; an extension is not a directory, so no pluginDirectory is recorded. The npm weekly figure is the sum of the seven daily counts for 2026-11-01 to 2026-11-07 on the npm downloads range endpoint. The ecosyste.ms counts are for the npmjs.org package qr-code-styling. The contributors count is the page number of the rel="last" link on the authenticated contributors endpoint with per_page=1 (17).
