notes: >
  The homepage states the license as "GNU General Public License ... either version 2 of the License, or any later version", which is GPL-2.0-or-later; GitHub detects GPL-2.0 for the same project, one license entry. The documentation's own license page (copyright 2001-2015) covers the manual, not the software, and is not recorded. Highest stable release is 2.4.3 per the download page; the project has no GitHub releases, only tags, so the tag v2.4.3 (commit date 2026-07-20) matches the page. Major 2 is the major of the stable line; the minor line is not recorded. The first changelog entry is release 0.2.1 dated 2000-12-22; GitHub tags do not reach back that far. The CSV's "date from git tag" is the same date as the project's download page. Keepalived is a Layer 4 load balancer and VRRP failover daemon for server pools; none of its pages name websites or web apps, so criterion 1 is held through its load-balancer role, a judgement for the reviewer. The download page says the main site provides no binary packages. The forum field is the Keepalived Users Group at Groups.io; the old SourceForge mailing lists are inactive and not recorded. The introduction page states that IPVS gives Layer 4 load balancing, that health checkers keep load-balanced server pools current, and that VRRP gives high availability; the installation page says the package ships a systemd unit and gives configure, make and make install as the source build. The download page says most Linux distributions ship Keepalived as a mainline package.
