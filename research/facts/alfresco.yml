notes: >
  The candidate row names alfresco.com's Community Edition page, which now redirects to a Hyland product page; that final page is recorded as homepage. The Hyland docs landing page answers without its content (a script shell), so it is unreadable and no fact is taken from it. The installation sources are the packaging project README (Docker image, distribution zip, and the acs-deployment project for docker-compose and Helm) and the repository README (artifacts from the Alfresco Maven repository, not Maven Central). Criterion 1 is judged as the candidate row states: the REST API serves HTTP, and the row marks the tooling in scope. This repository has no GitHub release, only build tags (26.3.0.x) that follow no stable release. The stable community image tags on Docker Hub, the registry the packaging README names for releases, give latestReleaseDate (alpha and milestone tags with -A or -M are skipped). Versions are calendar style (26.2.0), so currentMajor is not recorded. firstRelease is not recorded: the packaging project's oldest GitHub release is 2018, which is not the first release of the software. The databases and sso values come from the Community documentation source repository; those pages are written for the 23.x line (the zip install page names the 23.2.x distribution) and the recorded values are that scope. The repository was pushed on 2026-10-23, so the project is not ended. The enterprise projects that extend this repository are named in the README. paidEdition is the Enterprise version the acs-deployment page says is installed by default, with a limited trial. latestPrereleaseDate is the 26.3.0-M.1 milestone image on Docker Hub (2026-10-16); the 26.3.0-A alpha images pushed later are not used. No hosted or cloud edition of the community software is stated on the pages read, so hostedOffering is not recorded; the Hyland page's "cloud-native" wording describes the suite, not a hosted offering.
