notes: >
  Hosted-only product: the API docs at poeditor.com/docs/api describe a REST API, and no self-install page was found, so status is hosted-service. The FAQ says: "POEditor doesn't offer a self-hosted/on-premise copy." It also names an official MCP server and an OpenAPI specification next to the REST API, and says the service is hosted on its own physical infrastructure within the EU. The API rate limits are on a separate page, poeditor.com/docs/api_rates, which gives limits per account type; the free-account request limit is recorded. The pricing page lists Free, Start, Plus, Premium and Enterprise plans SAML SSO is an Enterprise plan feature for organizations, with setups for Okta, OneLogin, Ping Identity and Microsoft Entra (FAQ). The pricing page also lists Git service integrations, webhooks and callbacks, a translation memory, backups, and an unlimited contributors feature; those are plan features, recorded here only as notes. The homepage links the X and Facebook accounts; the LinkedIn page is not recorded as a field. The POEditor "about" page dates the company to 2003 ("since 2003") and the launch of the free version to 2012; the internal version launched 2011 and is not counted as a release. The privacy page names Stripe, Inc. (US) as the payment processor that receives name and email. No public repository was linked from the pages read, so repository is out; the CSV row also names no repository. The features page says translators are added to a language by assigning them as contributors. The Free plan is priced at $0 per month on the pricing page; prices are not recorded.
