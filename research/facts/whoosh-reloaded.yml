notes: >
  The README opens with a notice that the repository is "NO LONGER MAINTAINED", the only end signal found; it is the project's own README and the status is discontinued for that reason. The PyPI release history holds two uploads (2.7.4 and 2.7.5, both 2024), the GitHub releases list holds three (v2.7.4.3, v2.7.4.4, v2.7.5), and the repository tags reach back to v2.5.6, with no release object for them. The readthedocs and project pages title themselves "Whoosh 3.0.0 documentation" while the newest release is 2.7.5; the major is taken from the release, not the docs. The CSV row calls the project a fork of Whoosh; the README says Whoosh was created by Matt Chaput and does not call this project a fork, so no forkOf fact is recorded; the original is a separate candidate (mchaput/whoosh, last pushed 2024-01-03). The LICENSE.txt file reads "Copyright 2011 Matt Chaput", and the README credits Matt Chaput as creator. The license is stated as "simplified BSD" in the README and "Two-clause BSD license" on PyPI, one license in two wordings. No Python minimum is stated: setup.py sets no python_requires and the PyPI classifiers list Python 2.7 and 3.4 through 3.12, so runtimeMin is not recorded. The Python classifiers are not a minimum statement. The pypiDownloads figure is pypistats last_week at the check date, 20547; the registry's own API reports no download figure.
