notes: >
  The repository names no homepage, so none is recorded. The README says the gem is installed with gem install photish and also lists Debian, RPM and binary packages; only the gem command is recorded as installMethod. The runsAs static value comes from the README sentence about hosting the generated site; the local preview server (photish host, WEBrick) is not recorded as a runsAs value. The RubyGems downloads figure is the total since release, as the RubyGems API reports it. The repository has releases, so no lastCommitDate is recorded; the last push is 2020-09-20 and the newest release is 2016-01-19. The first release year comes from the oldest GitHub release, v0.7.3 dated 2016-01-16. The MIT copyright line is dated 2015. The README lists ImageMagick or GraphicsMagick (image conversion) and Exiftool (image metadata, only when a template reads Exif data) as dependencies that the packages do not install. The README says the native packages (Debian, RPM, binaries) bundle the Ruby runtime, and that not all features are available in them. Deployment goes through deploy plugins (photish deploy --engine=name); no built-in target is recorded.
