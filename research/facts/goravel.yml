notes: >
  Current major is v1 (highest stable release v1.18.0, 2026-07-05); the framework module is github.com/goravel/framework, so repository, stars, contributors and releases follow it; github.com/goravel/goravel (default branch v1.18.x) is the project skeleton that the install docs clone or the installer creates, and its README and LICENSE are cited for the license, maintainer and feature statements. Both repositories carry the same release tags. The README states the framework style is consistent with Laravel, and the project has a "Compare With Laravel" page whose text says Goravel follows the structure of Laravel; the page is recorded as alternativeTo only as worded there, and no basedOn is recorded because no page says Goravel is built on Laravel. The LICENSE copyright line names "goravel", recorded as the maintainer; no legal name appears in the sources read. The homepage shows a "One binary" deployment claim ("Upload the binary and your .env. No runtime to install.") and the build command "go run . artisan build --static"; the static flag is not read as a runsAs value because the sources do not say the output is files. Discord is taken from the README; the homepage carries the same invite and the X link in its navigation. The homepage says "in one framework" for its features and the docs list the Authentication and Authorization modules; no userRoles field is recorded because the README describes permission-based access control through policies and gates, which is not a role model stated in a field's terms. The Open Collective sponsor link in the README is not a field. The README module table lists routing, an ORM, validation, queues, events, cache, sessions, an Artisan console, task scheduling, a view engine and mail. The documentation pages read are the installation, configuration, routing, database, packages, Laravel comparison, contributions and authentication pages on www.goravel.dev.
