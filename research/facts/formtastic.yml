notes: >
  No project homepage: the gemspec homepage and the repository are the same GitHub repository, so only docs (rubydoc.info) and the repository are recorded; the README also links a GitHub wiki and a StackOverflow tag, which are not recorded as fields. The gemspec authors line names Justin French and the README says the project "was created by Justin French"; the MIT-LICENSE copyright line reads "Copyright (c) 2007-2025" with no holder, so the maintainer is recorded from the creator statement and a reviewer should confirm it. The README install section pins "gem 'formtastic', '~> 5.0'" while the latest major is 6.0.0; the route is recorded, the pinned major is not. The README says "Formtastic 6.x requires Rails 7.2 and Ruby 3.1 minimum" and the 6.0.0 gemspec sets required_ruby_version '>= 3.1.0' and the actionpack dependency '>= 7.2.0'. The RubyGems total (65,493,917) covers all versions. Stars and contributors are the repository's own. The basedOn value comes from the README sentence, not from the actionpack dependency in the gemspec. The 6.0.0.alpha tag was published before the stable release, so it is no latestPrereleaseDate. The repository's Gemfile route is the only install route named; rails generate formtastic:install is a generator run after it.
