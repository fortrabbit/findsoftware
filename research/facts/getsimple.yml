notes: >
  The installation and requirements pages that the README and homepage name both return 404, so the install method and the server requirements are unknown; the README's "PHP 5.2+" is the only runtime statement and is quoted from the v3.3.16 tag. The GitHub API lists v3.3.16 (2020-03-03) as the latest release; tags named v3.4.0.x exist, but the newest is a pre-release dated 2018-03-10, so it is not used. The repository was last pushed 2025-03-21 with no release after 2020, and no ended-project signal is stated on the homepage or in the README. The founder and lead developer are named on the homepage, with no legal entity, so maintainer is unknown and maintainerType is community as the homepage words it. The Discord link comes from the master README, which the v3.3.16 tag does not carry. Fields coined: none.
