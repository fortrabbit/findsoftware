notes: >
  No homepage: the repository is the only site, and the npm homepage points to the README. The README is the documentation; it has no docs site. The README's Browser usage section shows a unpkg script tag under a heading with no sentence naming the route, so no cdn installMethod is recorded for it; the esm.sh route is named by a sentence before its snippet and is recorded. The runtime list comes from the README's own statement that the library runs for NodeJS, Browser and Deno; the browser is not a runtime value, so no runsAs is recorded. The README gives Node.js 8 only as the requirement for its async validators, and the package manifest has no engines field, so runtimeMin is left out. The x link is the maintainer's account in the README contact badge, recorded without a quote; the Tweet badge at the top names no account. The README's benchmark figures are not recorded. Stars and contributors are for the repository. The README describes a schema of fields with a type and rules (such as min and max), compiled once into a checker function that returns true or a list of error objects; built-in validators include string, number, array, date, email and uuid; it covers optional and nullable fields, custom and asynchronous validators and custom error messages (its heading says l10n; not recorded as i18n because the section only sets message text). The Supported frameworks list names Moleculer as natively supported and Fastify and Express through separate packages. The package's license is MIT in both the README and the npm package; one entry is recorded. Release dates: GitHub latest release v1.19.1 (2025-04-30); the npm first upload 0.2.0 (2017-03-08) sets firstRelease, and the oldest GitHub release (2017-07-03) falls in the same year.
