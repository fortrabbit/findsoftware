notes: >
  Accepted as database server software, per the server-infra rule that puts database servers in scope. Calendar versioning (for example 26.10.2.103-stable, published 2026-10-24) has no major, so currentMajor is not recorded; the GitHub release names carry the lines: stable releases and the lts releases (26.8 and 26.3 lines in the newest tags). The newest prerelease in the release list is v22.4.1.2305-prestable (2022-04-21), older than the latest release, so no latestPrereleaseDate is recorded. The first GitHub release is from 2020 (v20.3.20.6-lts, 2020-10-08); the project's own company timeline dates the open-source release to 2016, which is the firstRelease value. The Docker Hub count is the clickhouse/clickhouse-server image pull_count from the Hub API. The company timeline names the headquarters as the San Francisco Bay Area; an area name is no country statement, so hqCountry is not recorded. The company page also states a European office in Amsterdam. The homepage nav and the README link Slack, Telegram, YouTube and LinkedIn; no field covers them. The cloud pricing page lists single sign-on with Google or Microsoft social login and multi-factor authentication for ClickHouse Cloud tiers, and the cloud JWT option is an Enterprise plan feature; those are hosted features and are not recorded as the product's sso. Hosted plans are not a paidEdition. The introduction calls the system role-based access control for its users; that is database access control, not the userRoles field, so userRoles is not recorded. The docs page on system requirements at its usual path returns the install page, so no requirements fact is recorded. The contributors count excludes anonymous contributors per the rule. The repository is Apache-2.0 per the GitHub license field and the README badge.
