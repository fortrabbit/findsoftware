notes: >
  The homepage raytha.com answers over https and is the project's own site; the first release is the news post "Raytha launches v0.9.0: ten years in the making", dated December 30, 2022, which precedes the GitHub release v0.9.0 dated 2022-12-31 by the tag. The release notes of v0.9.1 through v0.9.4 are dated January 2023 and the v1.0.0 post February 12, 2023. The Terms of Service (version 1.1, revised October 2, 2026) say raytha.com "no longer offers user accounts or a hosted Raytha service", and the blog has a post titled "Raytha Cloud Hosted Platform is now live"; because the terms state the hosted service has ended, no hostedOffering fact is recorded, and the reviewer should confirm. The homepage says "Free and open source forever", and the site has no pricing page, so pricingPage is not recorded. The README names one-click Railway deployment, a third-party host, which is not recorded as a fact. The GitHub API stargazer count is 248. The hqCountry US comes from the Austin, Texas address in the terms, not from a stated country; the company's own pages do not name the country outright. The maintainer is recorded as the legal name from the terms ("Raytha, Inc"); the LICENSE file copyright line reads "RAYTHA INC.". The social links on the about page are labelled Youtube, Twitter and Instagram; only the Twitter link is recorded as x. The runtimeMin is taken from the README, which says .NET 10 for the 2.0 line; global.json pins the SDK to 10.0.100. The comparison posts under raytha.com/blog/comparisons are recorded as alternativeTo, one entry per post. The hqCountry US rests on the terms' Austin, Texas address. The CSV categories listed cms and headless-cms; both are recorded.
