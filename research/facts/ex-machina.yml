notes: >
  Status accepted. The project has no site of its own: the hex.pm package page is the registry listing, not the project's site, so homepage is left out. The README links the docs on hexdocs.pm; the Hex metadata also names https://ex-machina.hexdocs.pm/ as the docs HTML URL. The library's description on Hex is "A factory library by the creators of FactoryBot (née FactoryGirl)", which names the creators but is no parent: FactoryBot is inspiration per the README, not a basis, so no basedOn and no alternativeTo. The README says it "works great with Ecto" and is configurable for other persistence libraries; that is a works-with statement, so no basedOn for Ecto, although an ecto record exists. The runtime is Elixir, which runs on the Erlang VM; the OTP minimum is not stated on any page read, so runtimeMin is left out. The Hex weekly figure is the downloads.week value of the Hex package API for ex_machina; the API gives no start and end dates, so the period is recorded as week on the date read. The GitHub owner is the beam-community organization, and the LICENSE copyright line names BEAM Community, a community maintainer. The contributors count is the last page of the contributors endpoint. Test library: no runsAs, since no page states that it runs as a process. The first upload on Hex is version 0.0.1 of 2015-09-15, which sets firstRelease to 2015.
