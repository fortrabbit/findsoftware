notes: >
  The repository has no LICENSE file, and GitHub reports no license for it; the license is taken from the README's "GNU General Public License v2" section. The GitHub latest release is v8.4.5, published 2022-10-08, while the homepage names 8.4.7. The homepage and install.php both use the name PHPNuke 8.4 MT Edition. The homepage belongs to a Persian-language community site that also sells hosting plans; the hosting plans are not recorded as an edition or a hosted service. The maintainer is the team name as the homepage states it, with no legal form; The README and the repository description name no parent project, so forkOf is not recorded even though the software's name matches the older PHP-Nuke project. The repository has no installation guide: the install step is the install.php web installer, and the forum at phpnuke.ir is the only support channel named. The runtimeMin comes from install.php in the default branch, not from the v8.4.5 tag. The candidate row lists no homepage; phpnuke.ir is the site the README names. Adoption figures are GitHub stars and contributors.
