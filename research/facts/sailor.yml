notes: >
  Doubt: the homepage sailorproject.org, listed as the project's site in the candidate row over plain http and on the repository, now serves an unrelated business and science blog for both the root and the docs route, so no homepage is recorded and status is stub; a live project site or a stable release would settle it. The repository has no stable release: every GitHub release is a prerelease from v0.1-venus (2014-01-10) to v0.5-alpha (2015-12-02), so currentMajor and latestReleaseDate are unknown. The rockspecs directory lists LuaRocks versions 0.2.1 to 0.5-4, but LuaRocks is not a registry this set reads, so no version figure is recorded. The open issue "Maintainers wanted" (issue 173, last updated 2025-08-22) is a maintainer's call for help, not a statement that the project has ended, so it is not a status fact. The last push was 2022-10-28; the repository is not archived. The README's Gitter badge has no field in this schema and is left out. The install page names Apache with mod_lua, Nginx, Lwan, Lighttpd and CGI servers as hosts, but no page states a request model, so runsAs is not recorded. The maintainer is the copyright holder named in LICENSE; the repository owner is the organization Sailor Project.
