notes: >
  The repository is django-oauth/django-oauth-toolkit; GitHub reports the license as NOASSERTION and PyPI normalizes it to BSD-3-Clause, but the LICENSE file lists two conditions and no endorsement clause, but it adds the FreeBSD views-and-conclusions paragraph, so BSD-2-Clause-Views is recorded from that file. The pyproject sets license = {file = "LICENSE"} and the README says "released under the terms of the BSD license". The README's Requirements section says Python 3.11 to 3.14 and Django 5.2, 6.0 or 6.1, while the manifest at tag 3.4.1 says requires-python >=3.10; runtimeMin follows the manifest, and the reviewer should decide. The homepage and docs are the Read the Docs site named in the README. The first PyPI upload is dated 2013-06-03 and the repository was created 2013-05-20, so firstRelease is 2013. The sso entries follow the sentences: the authorization server issues OAuth 2.0 tokens, and the OpenID Connect page says the toolkit supports OIDC, which "is not enabled by default because it requires additional configuration". The README says the toolkit "makes extensive use of" OAuthLib, and that it can also act as a resource server to protect a Django or Django REST Framework API; the toolkit provides no API of its own, so headlessApi is left out. As of 3.4.0 the README says the toolkit supports the authorization server role required by the MCP authorization specification, with PKCE required by default; kept here as a note, not a field. The Django REST Framework and Django Ninja pages are integrations, not records of a headless API.
  The README says the toolkit uses OAuthLib "so that everything is rfc-compliant", and that Dynamic Client Registration and Client ID Metadata Documents can be enabled with the DCR_ENABLED and CIMD_ENABLED settings. The installation page says to add oauth2_provider to INSTALLED_APPS, include the oauth2_provider URLs under a path such as o/, and run the migrate command for oauth2_provider.
  The README says the toolkit provides "the endpoints, models, and logic to issue and manage OAuth2 tokens from your existing Django project, instead of standing up and operating a separate service."
