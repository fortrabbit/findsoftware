notes: >
  The homepage is the project's own documentation site, which names the Kickflip repository as its source through the "Contribute on GitHub" link to github.com/mallardduck/kickflip. That URL redirects to github.com/KickflipCli/kickflip, which is archived (read only), so the status is discontinued. The other repositories of the project, KickflipCli/kickflip-src (the monorepo, archived) and KickflipCli/kickflip-cli (archived, README says the documentation is TODO), are archived too; the candidate row names kickflip-cli, and it is not used as the repository because the project's own site names the kickflip repository. The Packagist package mallardduck/kickflip (named by the install docs) is flagged abandoned on version 0.10.2 with the replacement kickflip/kickflip, which points to the same archived repository, so it is not recorded as a successor. The LICENSE copyright line names Dan Pock; the site footer says "Built by MallardDuck", the GitHub handle of the same maintainer, and the maintainer field follows the license line. The GitHub release list is empty; the highest stable tag is 0.10.2 (major 0), and latestReleaseDate is the Packagist time of that version. The documentation says Kickflip was inspired by Jigsaw; that is not recorded as a relationship field. The homepage was checked with the docs pages getting-started, installation, building-and-previewing and directory structure; the installation page is at docs/getting-started-installation, which is the URL used in the facts.
