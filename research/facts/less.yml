notes: >
  Less is a CSS preprocessor: the Less.js monorepo holds the npm package less, which the homepage's install instructions name. The homepage (https://lesscss.org/) answers over HTTPS and HTTP; the HTTPS page is recorded. The homepage describes a Node.js command-line route (npm install -g less, lessc) and a browser route (a stylesheet/less link and the jsDelivr script); both are recorded as runsAs values. The package is a monorepo, so the npm figure is the core package the install guide names. The README copyright reads "Copyright (c) 2009-2025 Alexis Sellier & The Core Less Team". The first release is the npm upload of version 1.0.11 on 2011-01-23; the GitHub releases list starts at v1.4.0 (2013-07-22), and the CHANGELOG starts at 1.1.4 (2011-11-14). The v5.0.0 alphas are prereleases; the latest stable line is 4.x. The README links Twitter (x.com) through a badge only, so the x fact has no quote.
