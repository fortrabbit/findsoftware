notes: >
  The homepage navigation and the quickstart label the documentation "2.x", while the GitHub releases and the Packagist framework package run to 3.x; currentMajor comes from the registry. runsAs is unknown: the quickstart only says to point the web server at the project's /web folder. The last push to the repository is 2020-10-17, and no page or README declares the project ended or unmaintained, so status stays accepted. The docs URL is the quickstart page; the phpixie.com docs directory is a 2017 file listing and was not used. The install docs name phpixie/project, a skeleton, so the Packagist figures come from phpixie/framework, the core package; the core framework's source repository is PHPixie/Framework, while the record uses the repository named in the candidate row. The maintainer is recorded as the project name; the license copyright line has no holder name, and Packagist names the maintainer account dracony, which a reviewer may prefer. The README says "MongoDB Support" and mentions SQL databases without naming one, so databases lists mongodb only. No minimum PHP version appears on the pages read, so runtimeMin stays unknown.
