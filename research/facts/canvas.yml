notes: >
  Status accepted: the repository is not archived, Packagist has no abandoned flag, and no page states that the project has ended.
  The docs describe Canvas as headless, and the same page says its JSON routes are not a public blog API; headlessApi is recorded as none on that second statement. The same page says "Build your public site with Eloquent (or an API you own)."
  Forks and contributors are shown on the homepage only and are not recorded; the GitHub API figure is the stargazer count.
  The homepage badges say PHP 8.4 while composer.json at v7.2.4 requires ^8.3; runtimeMin follows composer.json.
  basedOn Laravel is the single parent named by the README; the Laravel requirement (12 or 13) is in the installation docs.
  The homepage footer links to the GitHub Discussions page and to an X account under the maintainer's name; neither is recorded because the page gives no quoted description for them.
  runsAs is left out: the docs describe installation as a Laravel package but do not state where the application runs.
  Blade templating is from the homepage; the docs do not name a template engine.
