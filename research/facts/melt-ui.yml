notes: >
  The homepage links a "new version, with Runes" to next.melt-ui.com, which calls itself "The next generation of Melt UI" built for Svelte 5; no release of that line is on GitHub or npm, and a named successor is no end signal, so the record stays accepted. The npm dist-tag next (0.28.0-next.0, 2023) is older than the latest release and is not recorded as a prerelease. The introduction page says "Melt UI is in its early stages. Expect breaking changes in minor releases until 1.0 is ready!", which is a stability statement, not an end. The install package is @melt-ui/svelte; the registry name melt-ui is not on npm. The @melt-ui/cli package is the installer the docs name and is not a figure of its own. The npm figure is the sum of downloads for @melt-ui/svelte in the stated week. The HTTP Archive technologies table does not list Melt UI, so httpArchiveSites is not recorded. The introduction page says builders are functions that generate a collection of properties that can be assigned to any element or component. The README says Melt UI is meant to be used as a base for the project's own styles and components.
