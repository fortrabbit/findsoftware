notes: >
  The default branch is dev, and its README opens with "Reach-UI is currently not maintained!" and links issue 972, opened by the maintainer on 2022-09-27: the maintainer says the project is not currently maintained and suggests other libraries. The repository is not archived and its last commit is 2025-02-10. reach.tech answers 526 (TLS origin error) on this check, so the docs link is recorded from the README only. The homepage at reacttraining.com says the docs moved to reach.tech and names no other product. The repository is a monorepo of about twenty @reach packages with separate npm names and no core package, so no npm figure is recorded. The npm @reach/dialog package shows version 0.18.0 as latest, published 2022-10-13, with no deprecation. firstRelease is the first npm publish, 2018; the GitHub release list starts later at v0.3.0 (2019-10-11). The React Training copyright line covers 2018 to 2024 in the LICENSE. The HTTP Archive technologies list does not carry Reach UI. The React Training homepage shows Twitter for the company, not for the project, so no social field is recorded.
