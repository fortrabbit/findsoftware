notes: >
  Originally created by Muut Inc. (LICENSE.txt); the maintainer is the one the same file names as actively maintaining it. firstRelease 2013 is the oldest tag, v0.9.2, an annotated tag dated 2013-11-08; the npm registry's earliest existing version is 0.0.0 (2014-06-04) and the GitHub release history starts in 2019. The package.json engines field (node 18 or later) is not recorded as runtime: no page states a Node requirement for running a Riot application. runsAs browser comes from the README sentence on custom components in modern browsers; renderingModes lists server only because the docs state server-side rendering with Node.js and no page names another mode. httpArchiveSites is the mobile origin count of the HTTP Archive technology named "Riot" (JavaScript frameworks category); the technology's detection (global riot, scripts named riot.js or riot.min.js) and website riot.js.org match this project. The GitHub license detection reads NOASSERTION for the repository, and the npm package reads MIT. The Riot-named sub-projects (compiler, ssr, cli, lazy) are separate packages and are not counted. The docs say "Riot supports server-side rendering with Node.js." (https://riot.js.org/documentation/); that is compatibility of a UI library, so renderingModes is not recorded.
