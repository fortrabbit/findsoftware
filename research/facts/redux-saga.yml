notes: >
  The repository is a monorepo: the npm package redux-saga is the core package in packages/core, and the repository also publishes @redux-saga/core, @redux-saga/types, @redux-saga/testing-utils, @redux-saga/unplugin and babel-plugin-redux-saga. Stars and contributors belong to the whole repository, not to the redux-saga package. The latest GitHub release is babel-plugin-redux-saga@1.2.2, which is a different package; the record follows the release of redux-saga itself, redux-saga@1.6.0 published 2026-11-13, and currentMajor is 1. The README names the license MIT and the copyright line "Copyright (c) 2015 Yassine Elouafi"; the LICENSE file names "Copyright (c) Redux-Saga team and other contributors". Both name the MIT license, so one license entry is recorded and the maintainer follows the LICENSE file. The README says redux-saga "is a redux middleware", which is the basis of basedOn redux. The repository's npm figure is the redux-saga package; the packages @redux-saga/core and the babel plugin have their own npm figures, which are not recorded. The discord link comes from the homepage navigation and has no quote. The npm latest dist-tag is 1.6.0, and the beta dist-tag is 1.1.1-alpha.0, which is older than the stable release, so no latestPrereleaseDate is recorded. The README says redux-saga uses an ES6 feature called Generators to make asynchronous flows readable, writable and testable. The README compares it with redux-thunk ("Contrary to redux thunk, you don't end up in callback hell"); recorded as alternativeTo. No runtime is recorded because the README states no runtime, only that the browser needs ES2015 generators for the UMD build. The README's examples use React and react-redux and the homepage uses react-redux; neither is a basedOn statement, because the project names Redux as its parent.
