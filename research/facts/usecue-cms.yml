notes: >
  Hosted-service (criterion 2 waived): the sign-up process checks a Hugo website for compatibility before an account is made, and the docs describe no self-hosted install, so selfHostOption is not recorded. The sign-up page lists as unsupported managing files other than index.md in page bundles and managing media outside static/uploads. The product page names Hugo as the site generator it is "purpose-built for", which is a relationship the pages state, but it is not recorded as basedOn because the CMS is not built on Hugo. The contact page of the company site at usecue.com places the office in Amsterdam, the Netherlands, and the about page there says Usecue BV was founded in 2007. Three GitHub repositories with the name usecue are not the project's own (a democontent repository, a company website, and an unrelated MCP server), so no repository is recorded. The feature list names multi-user support, two-step verification and one-click translations; roles are not described, so userRoles is not recorded. The docs show a Dashboard with Content, Data, Uploads, Users, Forms and Statistics sections, which is recorded in the notes only.
