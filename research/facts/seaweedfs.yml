notes: >
  Community channels: Slack, Telegram and the Google mailing list are named in the README and have no field. Homepage: seaweedfs.com opens on "SeaweedFS Enterprise - Scalable Distributed Storage" and sells the Enterprise edition, so under the Enterprise sales page rule it is no homepage for the community edition; no homepage is recorded. Status accepted: the repository is not archived, the latest stable release is 4.51 (published 2026-10-25, the highest stable GitHub release, major 4), and the README links the project's Docker image and binaries. The docs link is the wiki named in the README; seaweedfs.com/docs/ runs the Enterprise product's pages, and the pages read are the EULA, pricing and the Open Source vs. Enterprise comparison. The comparison page's Enterprise column marks as Enterprise-only: S3 over RDMA, Data Recovery, Point-in-Time Recovery, Customizable EC Ratio, Automatic EC Shard Repair, Automatic EC Volume Vacuum, EC Bitrot Scrub, Admin UI OIDC Login, Admin Audit Log, zstd Storage Compression, Sealed Directories and Central Metrics Monitoring. The sso fact comes from that table, so it is an Enterprise feature. Maintainer: the open source repository belongs to the seaweedfs GitHub organization, and the EULA names "Seaweed Data" as publisher of the Enterprise Edition; no page names a legal form or a country, so hqCountry is absent.  The GitHub contributors count (399) uses per_page=1 and the rel=last page. firstRelease 2015 is the oldest GitHub release (v0.69, 2015-04-21); the repository was created in 2014. The README says "as Apr 25, 2026 MinIO ceased development" and names RustFS as a MinIO reimplementation; RustFS and Ceph are recorded as alternativeTo from the README's comparison headings. The README's other comparisons (HDFS, GlusterFS, MooseFS) have no records. The filer's metadata stores are the README's list; LevelDB, RocksDB and similar stores outside the databases vocabulary are not recorded. The README's S3 STS with OIDC and LDAP is for S3 clients, so only the Admin UI login is recorded as sso. The EULA license entry is the Enterprise Edition's own license; the open source license is Apache-2.0. The go.mod of tag 4.51 declares go 1.26.6; runtimeMin is left out because the runtime value is a binary. Docker Hub figure is for chrislusf/seaweedfs, the image the README names. Maven Central's client artifact (com.github.chrislusf:seaweedfs-client) is a library and is not recorded. Fields coined: none.
