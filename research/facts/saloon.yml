notes: >
  The README is at .github/README.md on the v4.5.2 tag; the default branch is v4. The docs homepage says the library "works in any PHP framework, or just regular PHP applications (with Composer)" and the README says "Framework agnostic", so no framework is a basedOn parent; the Laravel plugin and the other installable plugins listed on the docs navigation (pagination, caching, rate limits, XML, auto SDK generator) are not recorded as fields. The README says it is "Built on top of Guzzle", so basedOn is guzzle. The installation page names the ^4.0 constraint, which is not recorded. The maintainer comes from the LICENSE copyright line, "Sam Carré"; the Packagist maintainer is "SamCarre", and the README credits the same name with a GitHub link to Sammyjo20. The Packagist figure is the total; the monthly figure, 1691785, is left out. The dependency counts come from ecosyste.ms for the packagist.org registry. The GitHub Sponsors link is not a field. The README says Saloon "moves your API requests into reusable classes so you can keep all your API configurations in one place", with connector and request classes as the docs name them.
