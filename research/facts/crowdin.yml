notes: The record covers the hosted Crowdin service. The client libraries (github.com/crowdin/crowdin-api-client-js, npm @crowdin/crowdin-api-client) are the SDK for the hosted API and are not the service's own source, so no repository, license, stars or npm figure is recorded as a field. The developer portal documents a REST API and a GraphQL API, lists in-context SDKs for Android, iOS, Flutter and the website JavaScript, and describes a Serverless and Self-Hosted apps model for extending the Crowdin web app; the self-hosted apps run on a server the app's author operates and do not let a customer host Crowdin itself, so they are not a selfHostOption. The on-premise and self-hosted pages named in the site's paths return 404, and no other page states an on-premise Crowdin, so selfHostOption is left out. The privacy policy names Crowdin OÜ with an Estonian registered address, which is the basis for hqCountry. The Crowdin Enterprise page lists SAML SSO and SCIM provisioning, RBAC, data residency and ISO 27001 as Enterprise features; the security page states GDPR compliance and HIPAA compliance (with a business associate agreement). The pricing page lists the plans, recorded without prices. The About page names Serhiy Dmytryshyn as founder and sole owner. The site footer links github.com/crowdin and LinkedIn (linkedin.com/company/crowdin), not recorded as fields. The About page says the founder started Crowdin in 2009 (https://crowdin.com/about).
