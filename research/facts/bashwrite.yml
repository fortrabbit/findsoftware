notes: >
  The homepage is the project's own demo blog, built with BashWrite; its footer reads "Generated by BashWrite". The README says the script is "Inspired by bashblog", which names no parent, so basedOn is absent. The releases list holds 10 entries; the only prerelease, "0.12 beta" (2025-04-17), is older than v1.1.9, so no latestPrereleaseDate is recorded. The last push to the repository is 2026-06-12, a documentation commit, while the newest release is 2025-04-29. The README and demo state the GitHub Pages deploy (a gh-pages branch, served from its root) but do not state that the output is static files, so renderingModes and runsAs are absent. The README says "Hard to customize" and that the Markdown converter "is not perfect"; the bug list is on the demo site. The script's own settings (BLOG_NAME, AUTHOR_NAME, BASE_URL) name the author "raycc" in the sample profile; the LICENSE line is the maintainer name recorded. The script declares the version in code as v1.1.9.
  The README lists the generated files: the posts and tags folders, index.html, all-posts.html, all-tags.html, 404.html, rss.xml, sitemap.xml, robots.txt and style.css, plus backup and checksum folders. Posts take frontmatter with title, description, date, lastmod, tags, draft, pin and banner. The settings at the top of the script set the blog name, author name, base URL, theme color and the number of recent posts. The GitHub Pages option publishes from a gh-pages branch.
