notes: >
  No project site exists: the GitHub homepage field is empty, so no homepage is recorded; the README's example output link is a demo, not a homepage. The last GitHub release is v0.4.0 (2021-06-30), the same date as the npm publication, so the record falls under the four-year rule for stub although the repository was pushed 2026-03-29 and carries no archive flag. No page states that the project has ended. The README's FAQ declines new features that do not fit the minimal concept; that is a scope statement, not an end statement, and none is recorded. Data files are all *.md and *.yml files in the source folder, templates are *.ejs files, and templates starting with an underscore are skipped so they can be used as includes. Pagination is not supported, per the FAQ. The FAQ answers how to make a multilingual website with a shared include template rendered once per language, each reading its content from a per-language Markdown file. Markdown is rendered according to the GitHub Flavored Markdown specification.
