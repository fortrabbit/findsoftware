notes: >
  The CSV homepage http://www.luminusweb.net/ does not answer over https; plain http redirects to luminusweb.com, which answers over https, so the https luminusweb.com address is recorded. The CSV row names the GitHub repository luminus-framework/luminus-template, which is the Leiningen template that generates apps; the template is the install path the homepage names (lein new luminus). The Clojars page lists the homepage as github.com/yogthos/luminus-template, a different URL for the same template; the repository recorded is the luminus-framework organization's. The registry artifact is luminus/lein-template at version 4.52, so the registry major (4) is higher than the GitHub tag major (v1.17.9, 2015) and currentMajor is taken from the registry. The homepage says Kit is a successor to Luminus ("Check out Kit , a successor to Luminus"); no successorOf fact is recorded on this record because the field describes the successor, so the Kit record should carry successorOf Luminus. The first release is the commit date of the oldest tag, v0.5.2 (2013-03-29); the repository was created 2012-12-24, and the Clojars version history was not read for an earlier upload. The template README states Leiningen 2.5.3 or later is required; no runtimeMin is recorded because Leiningen is a build tool, not the runtime. The template's +immutant option is marked by the README as no longer funded or maintained; that concerns one optional server dependency and is not a status signal for the project. The +war profile and the deployment guide's WildFly section describe the alternative servers. Graphql, swagger, ClojureScript and other add-on profiles are not recorded as facts. The "template" category is not mapped by the import, so only framework is recorded.
