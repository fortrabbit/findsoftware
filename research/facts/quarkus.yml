notes: >
  Status is accepted. The homepage quarkus.io is the project's own site and answers 200. The latest stable release is 3.40.1.1 (2026-10-19), the highest stable GitHub release; 4.0.0.Beta1 is a prerelease dated 2026-10-01, older than the latest release, so no latestPrereleaseDate is recorded. The maintainer is the Commonhaus Foundation, which the homepage news item says Quarkus moved to; the same item says the move addresses the perception that the project was overly dependent on a single vendor (Red Hat), and Red Hat is not recorded as parent. The Maven coordinates are the core artifact, io.quarkus:quarkus-core, from the Maven Central metadata; the Maven guide's plugin io.quarkus.platform:quarkus-maven-plugin is not recorded as the coordinate. The first release is recorded from the about page's 1.0 date (November 2019); the GitHub tags begin with 0.0.1 (commit dated 2018-12-12), which is a version-numbered tag and not a news post, so it is not used. The get-started page names a JBang or SDKMAN install for the CLI, and the getting-started guide names JDK 17+. The native executable guide (https://quarkus.io/guides/building-native-image) was read: it builds a native executable with GraalVM or Mandrel and runs it directly, recorded as the binary runtime beside jvm. The i18n value comes from the Qute reference's Localization section. The homepage lists a Zulip chat, which has no field. The Kubernetes deployment guide was searched for deployment targets and was not read in full, so it is not a source for runsAs, which comes from the getting-started guide.
