notes: >
  Drafted 2026-11-03 from the homepage, self-hosting overview, Docker Compose and Helm pages, the license-key and SSO pages, the docs page, the root LICENSE and ee/LICENSE at tag v4.72.0, package.json at the same tag, and GitHub. The root LICENSE copyright line names ClickHouse, Inc., which is recorded as maintainer under the LICENSE rule. The imprint names Langfuse GmbH, Oranienburger Strasse 91, 10178 Berlin, Germany, with a footer line "Finto Technologies Inc."; neither is recorded as maintainer or hqCountry, and the imprint is a legal notice for the Langfuse site, so a reviewer should decide whether it describes the recorded maintainer. The homepage headline "Langfuse joins ClickHouse" is a headline and no parent is recorded. GitHub reports the license as NOASSERTION because the root is MIT and ee/ is under its own Enterprise License; both statements are recorded. The npm package langfuse is the JavaScript SDK, not the server, so no npmName or npmWeeklyDownloads is recorded. The docs page says traces are captured "via our native SDKs for Python/JS", and the docs also list SDKs for Go and Java. The categories keyword llm-observability has no categoryMap entry and is not recorded. The self-hosting page also lists Terraform routes for AWS, Azure and GCP (only the AWS page is recorded) and community-maintained Render and Railway guides, which are not recorded. The package.json engines field names Node.js 24 for the repository; the product ships as Docker images, so it is a build requirement and no runtimeMin is recorded. The homepage says the Docker images have been pulled 38M+ times; that is a claim on a marketing page, not a registry figure, and is not recorded. The authentication page says OAuth/SSO provider sign-in is enabled through environment variables per provider and lists Auth0, Authentik, AWS Cognito, Azure AD/Entra ID, GitHub, GitLab, Google, Keycloak, Okta and a custom OAuth provider; the Okta section mentions an OIDC app. The self-hosting page names two application containers: Langfuse Web (the web application serving the UI and APIs) and Langfuse Worker (asynchronous event processing).
