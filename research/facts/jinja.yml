notes: >
  Status accepted. Criterion 1: Jinja is the template engine that web frameworks such as Flask render pages with; this record is the engine itself, so no templating fact is recorded, since the templating language would be Jinja. Criterion 2: BSD-3-Clause on GitHub and installed with pip from PyPI. Criterion 3: the installation section gives the pip command. The firstRelease year is the oldest upload of the PyPI package Jinja (the Jinja 1 line, by Armin Ronacher, whose homepage was jinja.pocoo.org), 2006-07-06; the changelog's Jinja 2.0rc1 on 2008-06-09 is the first release of Jinja 2 and the oldest tag in the repository. The PyPI package is named jinja2; its requires_python is >=3.7, the same minimum the docs give. The Pallets Discord is the chat link in the documentation's project links and is shared by Pallets projects. The introduction says templates hold placeholders written in a syntax close to Python code and that the template is passed data to render the final document. The i18n fact covers the Babel-based translation support for templates, a template-level feature, not the multilingual support of a site built with Jinja. The Sphinx footer shows Copyright 2007 Pallets, which matches the LICENSE line. The pypistats figure is the rolling last-month count on the day of the request. The installation section lists MarkupSafe as a dependency installed automatically and Babel, which provides translation support in templates, as an optional dependency that is not installed automatically. The guide "Switching From Other Template Engines" has sections for Django templates and Mako; Mako is recorded as alternativeTo, and Django templates are part of the Django framework, which supports Jinja as its template engine, so no alternativeTo django is recorded.
