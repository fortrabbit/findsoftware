notes: >
  Doubt about listing: the v2.0.0 README says "this project is quite stable, but is currently in maintenance mode. Critical fixes will still be released, but for now no additional features or changes will be considered". The main-branch README and the documentation site carry no such note and no statement that the project is actively developed, so the record is a stub; it is not discontinued because the repository is not archived and the npm latest is not deprecated. A person can settle it by confirming whether the 3.0 release candidate line is the project's current work: the repository has no GitHub releases, only tags, and the npm latest dist-tag is 3.0.0-rc.3 (2025-12-09), a release candidate, while the highest stable tag is v2.0.0 (npm time 2021-06-24), so currentMajor is 2 and the rc date goes to latestPrereleaseDate. The main-branch README is short and has no install section; the install section and the maintenance note sit in the README of the v2.0.0 tag. The v2.0.0 README gives the peer dependencies as rxjs 6.x and redux 4.x, while its package.json lists rxjs ^7.0.0 as a dependency and redux 4 as a peer; the README figure is not recorded and no runtime is recorded. The README publishes a UMD build inside the npm package for use through the unpkg CDN, recorded as the cdn route. RxJS is the other half of the RxJS-based middleware and is a boundary candidate without a record, so it is named here and not in basedOn. The gitter chat badge and the Discuss section name a chat channel with no field in the schema and are not recorded. The categories value state is the CSV row category. The npm weekly figure counts all published versions of the package, not only the stable line. The maintainer follows the LICENSE copyright line, which names Ben Lesh, Jay Phelps and redux-observable contributors; the v2.0.0 README names Jay Phelps as the maintainer. The repository is not a monorepo. The homepage is the project's documentation site and shows the README text.
