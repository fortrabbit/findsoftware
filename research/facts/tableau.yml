notes: >
  No homepage is recorded: the GitHub repository has an empty homepage field and the README links only the Hex docs, a Discord and GitHub Discussions. The docs at hexdocs.pm/tableau are the project's published documentation; the README points there. The Hex package is tableau (hexName), with the total download count from the Hex API (downloads.all, 13257); the Hex API also reports 65 for the last week, not recorded. Hex lists the license as MIT with the project's GitHub URL. The LICENSE copyright names Mitchell Hanberg; the GitHub owner is the elixir-tools organization, whose blog is elixir-tools.dev and which is not recorded as a parent. The first release is v0.1.0, whose tag commit is dated 2023-06-13. The latest stable GitHub release is v0.30.0 (2026-01-24). The README says the generator can create sites with HEEx, Temple and EEx templates and Tailwind or plain CSS assets; the Built-with table lists sites but does not state the output form beyond the static site generator description. The minimum Elixir version is the "~> 1.15" requirement in mix.exs. The README's example dependency is "~> 0.26", which is a version in an example and not a requirement. The hexdocs configuration page gives _site as the default output directory. No page says the output is static files beyond the name "Static Site Generator for Elixir", so renderingModes and runsAs are not recorded.
