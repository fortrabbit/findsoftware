notes: >
  The package npm tw-elements is the Standard (Tailwind) port, and the React, Angular and Vue ports are separate packages, not recorded here. The GitHub repository is not archived and the npm latest (2.0.0, published 2024-03-04) is not deprecated; the release list holds v1.0.0-rc.1 (2023-08-28) as the newest prerelease, older than the latest release, so no latestPrereleaseDate. The npm package field says "SEE LICENSE IN <License.txt>", and the file in the package says "MIT license for TW Elements Free", which is the same MIT statement as the license page and the GitHub API; one wording, one entry. The license page also names an End User License Agreement for Premium Access features under a recurring subscription; that is recorded as a second license entry and drives licenseModel open-core, which the reviewer should confirm. The GitHub repository license is MIT and its LICENSE file names "Copyright (c) 2024 MDBootstrap", which the GitHub organization MDBootstrap matches; the maintainer is recorded as MDBootstrap, the name the LICENSE copyright line uses. The contact page of mdbootstrap.com names StartupFlow Dawid Adach, Michał Szymański s.c. in Warsaw as the company, and its privacy page names the same company as data controller; that is a legal name for the reviewer to confirm, and hqCountry PL is taken from that contact page. The tw-elements.com privacy page contains a policy for an unrelated website, so it is not used. The homepage lists "Free hosting" without a definition; not recorded. The Tailwind CSS dependency is stated as "built on top of the Tailwind CSS framework" on the local installation page. The quick start says TW elements is a plugin that is included inside tailwind.config.js, and the npm route runs the Tailwind setup first. The npm weekly figure is the sum for 2026-10-19 to 2026-10-25. The README's "MDB GO / CLI" section describes a hosted step ("Create, deploy and host anything with a single command", then "mdb publish"); the MDB CLI "mdb init tailwind-elements-free" template and the "mdb publish" step to MDB hosting are no install route and are not recorded as one. The HTTP Archive list has an entry MDBootstrap for the Bootstrap-based UI kit, which is a different technology from TW Elements, so no httpArchiveSites is recorded.
