notes: |-
  The docs introduction adds that it supports branching, merging and time travel queries over the data history. The candidate row names TerminusDB and TerminusCMS; the id terminuscms is kept. The cloud page at terminusdb.com/docs/cloud says TerminusCMS was a former name of the hosted service, now "one product name" with TerminusDB Cloud, so the record is the open-source database and the CMS label is not stated by any current page; the categories field carries only graph-database. The docs repository terminusdb/terminusdb-docs still holds a terminuscms folder with dashboard login steps, read as the former hosted product and not recorded as adminUi. The hosted service is managed TerminusDB Cloud, in early access, on Azure, AWS and Google Cloud; no prices are recorded. The README's Enterprise row lists enterprise features (clustering, higher write performance, backup API) with an empty link and no license statement, so only the cloud page's purchasing statement is recorded as paidEdition. The Discord invite on the homepage (GZ5gaCmBHc) differs from the one in the README (yTJKAma); the homepage invite is recorded. The current major is 12 from the v12.0.8 release (2026-10-12); the homepage says "Next Release: 12.1" with no tag. Runtime is Prolog per the GitHub language field, with no page naming the Prolog system.
   The gettier.ai privacy policy is issued by DFRNT AB of Lund, Sweden and says it contracted Data Chemist Limited (T/A TerminusDB) for licensing and support; no page read states how Gettier relates to either company, so maintainer stays "Gettier" as the homepage states it and hqCountry is unknown. The homepage also says the whole database runs in a single Docker container. TerminusDB is a graph database, recorded beside the CMS records under the database category.
