notes: >
  The maintainer is the copyright holder named in the LICENSE, The Grow.dev Authors; no legal entity is named on grow.dev. The PyPI JSON reports downloads of -1, so pypiDownloads comes from pypistats (last month). The runtimeMin is the requires_python of the PyPI release 2.2.3. The GitHub release list ends at 0.0.26 (2014-03-17), which is the oldest release, so firstRelease is 2014 although the repository was created in 2013. The highest stable release is v2.2.3 (2022-07-21), so currentMajor is 2. The Grow site also documents Google Cloud Storage, Amazon S3, local, SCP and Git deployment destinations in the deployment page; no field holds them and they are not recorded. The grow.dev homepage has no social links.
