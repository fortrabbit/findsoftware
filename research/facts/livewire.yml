notes: >
  The homepage quotes and testimonials attributed to the creator of Laravel are not recorded as facts. The docs at livewire.laravel.com/docs/4.x/upgrading list configuration renames for v4, which is the current major. The Packagist entry requires illuminate components from ^10 to ^13, so basedOn is laravel. No maintainer is named on the pages read, and the GitHub organisation page was not read. Endoflife.date has no Livewire entry.
