notes: >
  Monorepo: naver/egjs-flicking holds @egjs/flicking, @egjs/flicking-plugins, @egjs/react-flicking and @egjs/vue3-flicking, so stars and contributors belong to the repository; the npm and dependent figures are for @egjs/flicking, the package the quickstart installs. The React and Vue 3 packages are described as ports of @egjs/flicking, and the plugins package is a separate package: none is a basedOn statement, and the plugins package is not a pluginDirectory. The README names the library as a carousel component and says it is "Reliable, flexible and extendable"; the homepage repeats it and says the framework use is with "React, Vue 3, or Vanilla JS". The README's supported browsers table lists the latest Chrome, Firefox and Safari and iOS 7 and Android 4 as minimums; that is a browser support list, so no runsAs or runtime is recorded, and no page says where it runs. The quickstart and the SSR guide say Flicking works with Next.js and Nuxt; that is compatibility and no runtime or basedOn statement. The current stable release is 4.17.1 (2026-09-30); the 3.x line appears in the docs version switcher and is older. firstRelease is the oldest npm upload, 2.0.0-rc.1 on 2017-04-28 (a prerelease, counted under the rule); the repository was created the same day. The maintainer follows the LICENSE copyright line, NAVER Corp.; the homepage footer reads "Copyright © 2026 NAVER, Inc.", a different legal form, so the reviewer may prefer it. No address or country for NAVER Corp. was found on the company page fetched, so hqCountry is absent. The homepage links the Naver Open Source site and GitHub Issues; neither is a field. The docs installation route 404s; the quickstart carries the install routes. The SSR guide says panels may shift after hydration, because Flicking measures DOM element sizes to place panels. The README feature list names SSR ready, circular mode, free scroll, virtual scroll, plugins (AutoPlay, Fade, Parallax, Arrow, Pagination) and TypeScript types.
