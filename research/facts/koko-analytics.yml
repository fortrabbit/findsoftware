notes: >
  The plugin is a WordPress plugin: basedOn wordpress, from the plugin page's description. The wordpress.org plugin API reports 70000 active installs (recorded as reportedInstalls); the homepage says "60,000+ active sites", the author page "50.000", and a 2026-10-28 blog post "over 70,000 sites": those are not recorded. 2.5.3 (tag 2026-09-21; wordpress.org last_updated 2026-09-24) is a tag without a GitHub release object; it is the wordpress.org stable tag and the source of latestReleaseDate. The highest GitHub release object is 2.5.2 (2026-08-04). Two license wordings: the LICENSE file that GitHub reports is GPL-3.0 (API spdx id), while readme.txt and composer.json at 2.5.2 say GPL-3.0-or-later; recorded as one entry. The homepage and plugin page say only "the GPL license, just like WordPress itself" (WordPress core is GPL-2.0-or-later); that names no version and is not recorded as a second license. The Pro add-on (paid, a separate pro.kokoanalytics.com product, tiers at the pricing page, multisite counted as one activation) is a paid add-on plugin, so no paidEdition fact; its features (email reports, geolocation, device and event tracking, UTM tracking) are listed on the pricing page. Privacy and cookie statements (no cookies, no personal data processed, GDPR, CCPA, PECR; "cookieless" tracking method, optional cookies) are coined kinds recorded here, not as fields. The tracking script is output into the WordPress site by the plugin; a server-side route is documented in the docs (developers section) and not read. Integrations: Complianz consent plugin (docs article integrate-with-complianz). Single-page application support and action/filter hooks are developer docs, not read further. The wordpress.org page shows the plugin's ratings (5 out of 5 from 250+ reviews): ratings are not recorded. The wordpress.org API reports 2,523,301 total downloads: not a field, not recorded. Maintainer: the privacy policy names ibericode BV, located in Nijmegen (NL); the repository owner is the ibericode organization; the author on wordpress.org is Danny van Kooten (individual, from the plugin page), not recorded as maintainer. Two capabilities, view_koko_analytics and manage_koko_analytics, go to administrators by default and can be granted to other WordPress roles. Koko Analytics stores all statistics in the WordPress database (export and import docs page). Multisite is mentioned only in the Pro pricing FAQ ("If you activate Koko Analytics Pro from a multisite, it counts as just a single activation"), so no multisite fact. The plugin page FAQ names built-in importers for Jetpack Stats, Plausible Analytics, Burst Statistics, Statify, WP Statistics, Independent Analytics and SlimStat Analytics; only Plausible has a record, and Statify there is the WordPress statistics plugin, not research/facts/statify.yml (a Python static site generator), so the others stay in these notes.
