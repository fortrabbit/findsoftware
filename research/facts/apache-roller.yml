notes: >
  Status is accepted. The highest stable tag is roller-6.1.6 (tag object dated 2026-09-24, the project's downloads page calls 6.1.6 the "best available" general-availability release); the GitHub releases list holds only roller-6.1.2 (2023-08-03), so the release date comes from the tag and currentMajor from the 6.1 tags. roller-6.1.7-rc2 is the newest preview. The tags run back to roller_2.3 (2007), the oldest tag in the repository; the project's older releases are not read, so firstRelease is the oldest tag's year. The install guide dates from the Tomcat 7 era and states Java 1.6; the runtimeMin of 11 is the release level in the pom at roller-6.1.6. The install guide's sso line names OpenID and LDAP; OpenID is recorded as stated and is not OIDC. The adminUi and categories entries rest on the user guide's editor pages; the register maps blog to cms, so the import treats Roller as a CMS. The homepage Twitter link is the only X account named; the Lucene search and the MetaWeblog API are features not recorded as fields. The Maven Central search returns no org.apache.roller artifact, so no mavenCoordinates is recorded. The README quick starts (Maven with Jetty and an embedded database, and Docker Compose with PostgreSQL) are described as ways to try or demo Roller, so runsAs local is not recorded. The MetaWeblog API for blog clients and the RSS and Atom feeds are listed on the homepage; they have no field.
