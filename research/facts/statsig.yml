notes: >
  Hosted-service row. The homepage says "Statsig is part of the Amplitude family", and the terms name "AMPLITUDE, INC. ("STATSIG")" as the provider, so the maintainer and parent are Amplitude, Inc.; the privacy URL redirects to amplitude.com, which is not an end signal because the Statsig homepage still serves the product. No self-install guide was found: the self-hosting and self-host docs URLs return 404, so the record stays hosted-service. The SDK repository statsig-io/js-client-monorepo (ISC per GitHub, 18 stars, pushed 2026-10-26) and the npm package @statsig/js-client (1.8 million weekly downloads per the candidates row) are SDK figures and are kept in notes only, per the hosted-service rule. The homepage has no founding date and the about page loads its text by script, so firstRelease is absent. The pricing page lists a free starting tier ("start for free") with no prices recorded here; the free tier is a pricing-page statement and not a field. The pricing page lists Warehouse Native, Infrastructure and Product Analytics among its products; these are product lines, not install routes. The homepage lists linkedin.com/company/statsig, which is a social field not in the field list and goes here: https://linkedin.com/company/statsig. The sso entries follow the pricing page's SSO, SAML, OAuth and SCIM lines; the reviewer should check whether they are plan-gated. The homepage also links a Slack community (statsig.com/slack), which is not a recorded field. The Console API docs describe a CRUD API for managing gates, experiments and settings, not a content API, so headlessApi is not recorded.
