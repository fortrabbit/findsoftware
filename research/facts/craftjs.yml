notes: >
  Boundary question from the CSV (page editor library or CMS) settled as a library: the README calls it an abstraction on which the developer implements a page editor, with no ready-made interface, and no page describes content management, storage or an API, so it is not categorized as a CMS. The editor state serializes to JSON and can be restored from it; where that JSON is stored is left to the developer, so no contentStore is recorded. The root README of the repository only points to packages/core/README.md, which is the README read. GitHub releases are tagged per package (@craftjs/core@x.y.z); the highest stable core release is @craftjs/core@0.2.12 (2025-02-14), matching npm latest, so currentMajor is 0. The v0.3.0-alpha tags have no GitHub release and the newest prerelease release (v0.2.0-beta.13, 2023) is older than the latest release, so no latestPrereleaseDate. firstRelease is from the oldest GitHub release, v0.1.0-beta.0 (2020-01-04), which is not flagged as a prerelease. @craftjs/core declares react 16.8 to 19 as a peer dependency; no Node or runtime minimum is stated, and runsAs is not recorded because no page states where the editor runs. The maintainer's personal social account, listed in the docs footer, is not recorded as the project's. The project takes sponsorship through GitHub Sponsors, Open Collective and Ko-fi. An additional package, @craftjs/layers, provides a layers panel. The README names react-dnd, GrapesJS and use-methods as references and sources of borrowed code; none is recorded as basedOn or alternativeTo.
