notes: >
  The repository has no GitHub release; its tags run to v0.2.5 (2012) and package.json reads 0.2.6. The npm package wheat at 2.0.1 (2016-03-31) has the same author and no repository field; the repository's v2 branch holds the same files (renderers.js, server.js, markdown.js, prettify.js), so currentMajor 2 and the npm figures belong to this project. The default branch is the older 0.2.x line. The GitHub API reports the license as NOASSERTION; the MIT statement is in LICENSE and the npm package. The README lists Graphviz as an optional install for rendering DOT files on the fly. The repository has no project website; homepage is not recorded.
