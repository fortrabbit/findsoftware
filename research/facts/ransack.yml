notes: >
  Ransack is a library; there is no server, admin UI or content store to record. The gemspec at v6.0.1 sets required_ruby_version '>= 3.2' and the README says Rails 8.1 on Ruby 3.4 and later, while the getting-started page says Ruby 3.3 and later; runtimeMin follows the gemspec; the README statement (Ruby 3.4 and later) and the getting-started statement (Ruby 3.3 and later) are not recorded as minimums. The README names three maintainers (Sean Carroll, Deivid Rodriguez, Greg Molnar); the first is recorded. Support is by volunteers with Open Collective donations and a Tidelift commercial support subscription, recorded in notes only; no paid edition. The rubygems versions list starts with 0.1.0 uploaded 2011-03-31, earlier than the first GitHub release (v1.3.0, 2014), so firstRelease is 2011. The category search-library is a mapped value. Activity: repository pushed 2026-10-25, no archive flag.
