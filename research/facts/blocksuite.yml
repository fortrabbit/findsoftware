notes: >
  Monorepo: the stars and contributors belong to toeverything/blocksuite, which holds the framework and the component packages; the npm figure is @blocksuite/presets, the package the quick start names for prebuilt editors. The npm figure counts all published tags, including canary and nightly builds; the registry latest tag is an earlier release than the newest GitHub release, and the quick start installs @canary builds that the project releases daily. The latest GitHub release is v0.22.4 (2025-07-01); the repository has commits in 2026. The homepage x link (twitter.com/AffineDev) is the AFFiNE developer account, so x is not recorded. The README says BlockSuite originated from the AFFiNE knowledge base and that AFFiNE uses it; that is a relationship to an app that uses the toolkit, not a parent, so basedOn is not recorded. The maintainer is the copyright holder named in the LICENSE, TOEVERYTHING PTE. LTD.; the homepage names the company only as Toeverything, and no page read gives its country or address, so hqCountry is not recorded. No page read says the components run in the browser in words; the README calls them native web components, which is left out of runsAs for the reviewer to decide. The first GitHub release is dated 2023-04-25 and the first npm publish 2023-12-05 is a nightly build.
