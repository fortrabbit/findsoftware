notes: >
  Status accepted. Criterion 1: a QR code library that a site or web app calls to render QR images, SVG, HTML and other outputs. Criterion 2: installed with Composer from Packagist (chillerlan/php-qrcode), the route the installation guide names. Criterion 3: the v6.0.x installation page gives the composer command. Criterion 4: the repository is not archived; the latest stable release is 6.0.1 (2026-03-30) and the default branch main is in development for a future major. The homepage smiley.codes is a demo page that generates QR Codes with the library; it links the maintainer's personal X account and a Ko-fi page, and the X link is recorded as x. The README calls the generator based on the implementation by Kazuhiko Arase and the reader based on a PHP port of ZXing; neither parent has a record, so basedOn is not recorded. The README on main says PHP 8.4+, a development requirement; runtimeMin is 8.2 from composer.json at tag 6.0.1. The release composer.json lists MIT and Apache-2.0 as two licenses, recorded as two entries; the Apache-2.0 part is the code ported from ZXing according to the README and NOTICE. The copyright line names Smiley; composer.json lists Kazuhiko Arase, the ZXing Authors and Ashot Khanamiryan as authors of ported parts. The npm package @chillerlan/qrcode is a separate JavaScript port with its own package and is not the install route, so no npm figure is recorded. The installation guide's manual route (download the package, then run composer install in its folder) is the second installMethod; the guide calls use without Composer unsupported and it is not recorded. The README requirements say the reader needs either ext-gd or ext-imagick, and the GdImage and ImageMagick output modules need ext-gd and ext-imagick respectively. The Packagist total download figure is cumulative since listing. The output formats (GdImage, ImageMagick, SVG, HTML, EPS, PDF via FPDF, JSON, plain text) and the QR Code reader are described in the README features list and are not recorded as fields.
