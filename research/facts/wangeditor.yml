notes: >
  The CSV homepage is the http address. It answers over https (http redirects to https), so the record links https://www.wangeditor.com/en/. The repository is a monorepo: the stars, contributors and license are the monorepo's, and the registry figures come from @wangeditor/editor, the package the English installation page names. The unscoped npm package wangeditor is the v4 line (latest 4.7.15, 2022-04-12) and is not the install target; its first upload (2.0.14, 2016-03-06) sets firstRelease, and the GitHub v4 releases stop at v4.7.13 (2022-04-04). The v5 major comes from @wangeditor/editor 5.1.23 (2022-11-14), and the repository's tag @wangeditor/editor@5.1.23 is its newest stable tag. The installation page names official Vue 2, Vue 3 and React wrapper packages, each marked optional, (@wangeditor/editor-for-vue, @wangeditor/editor-for-react) next to the core, so the core is framework-agnostic and no basedOn is recorded. The English installation page also shows a CDN route (jsdelivr and unpkg script tags under "CDN") with no sentence naming it, so no script tag installMethod is recorded. The compatibility section says it supports most PC browsers and not mobile editing, which is a browser support list, so no runsAs is recorded. The homepage says the editor is independent of third-party frameworks and can be used in jQuery, Vue or React. The English i18n page says Chinese and English are provided by default (Chinese is the default) and shows how to add other languages. The compatibility section names the PC browsers it supports, says mobile editing is not supported, and says Internet Explorer is no longer supported. The Chinese home page is the default at www.wangeditor.com; the English pages are under /en/.
