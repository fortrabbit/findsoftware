notes: >
  Language: the package ships Python bindings, so the language is Python; the GitHub repository language is Rust, because the binding wraps the Rust crate ammonia (github.com/rust-ammonia/ammonia), which is no record and is not basedOn. Version line: v0.3.7 (2026-08-24) is the highest stable GitHub release, so currentMajor is 0 and the minor line 0.3 is the one in use. The first tag v0.1.0 has the commit date 2021-08-03, which sets firstRelease. Runtime: the pyproject sets requires-python to >=3.8 at tag v0.3.7, which sets runtimeMin 3.8. The README says the benchmark shows nh3 "about 20 times faster than the deprecated bleach package"; that is a benchmark sentence, not an alternative or switching statement, so alternativeTo is left empty. The pypistats figure is the rolling last-week count read on 2026-11-16. Maintainer: the LICENSE copyright line names Messense Lv, an individual, and the repository owner is a user account. The homepage is the readthedocs site over https, which is the project's own documentation site and the homepage field of its GitHub repository.
