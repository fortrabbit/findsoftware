notes: >
  The homepage is the author's page at https://tapiov.net/live-server/; the plain http address answers too, and the https address is recorded. The repository has no LICENSE file; the MIT statement is the README's "(MIT License)" line and the npm license field. Release age decides listing, not status: the latest release is 1.2.2 (npm, 2022-04-27), more than four years before 2026-10-28, so the import moves this record to stub under AGENTS.md. Status is left at accepted here, as the CSV row has it; a reviewer should expect the stub move. No GitHub release object exists; the GitHub tags stop at 1.2.1, and the npm registry is the release source, so the npm upload dates are used. firstRelease is 2012 from the first npm version and the 0.1.0 tag. The GitHub repository was pushed on 2024-04-28 while its newest commit's committer date is 2022-04-27; the record has a release, so lastCommitDate is not used. Runtime minimum is the engines field of the package.json (node >=0.10.0), a registry statement, so runtimeMin is recorded as the old node 0.10 line. The npm figure is for the live-server package named by the install docs. The lastCommit and stargazer figures are as read on 2026-10-28. The GitHub owner profile names Helsinki as location, which is not a legal notice, so hqCountry is not recorded.
