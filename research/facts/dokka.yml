notes: >
  The homepage kotl.in/dokka redirects to the Kotlin documentation at kotlinlang.org (dokka-introduction and the get-started page), which are read as the project's documentation; the repository's homepage field is the same short link. The maintainer is recorded as the README states it ("JetBrains official project"); the company contacts page names JetBrains s.r.o. in Prague and JetBrains N.V. in Amsterdam without saying which holds Dokka, so hqCountry is not recorded. The README badge names the project as Kotlin Beta; that is a stability label, not an end signal. The kotlinlang pages for Gradle, Maven and the command line were read: the Gradle task is :dokkaGenerate (the README still lists the older dokkaHtml task) and the default Gradle output is build/dokka/html. The pages never state that Dokka needs a JVM (the command line runner is started with java -jar and the Maven plugin takes a jdkVersion for external links, which imply it), so runtime is not recorded. The introduction names a #dokka channel in the Kotlin Community Slack, which has no field. The oldest GitHub release is v0.11 (2015-03-18) and the oldest tags go back to 0.9, so firstRelease is 2015. The latest stable release is v2.2.0 (2026-03-26), and v2.3.0-Beta (2026-09-15) is newer, so it is latestPrereleaseDate. Dokka documents KDoc and Javadoc input and writes HTML, Javadoc HTML and Markdown (GFM and Jekyll) output, per the README and introduction.
