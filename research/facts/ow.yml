notes: >
  Single-author repository. The README says the same validation works "on the server, in the browser, or in CLI tools", and that label inference is in Node.js but not in the browser; runtime is node from the Node.js sentence and no runsAs is recorded, since the README names the browser as well. The engines field at v3.1.1 is node 20 or newer. firstRelease is 2016 from the npm upload of version 0.0.0 (2016-02-04), which is older than the first GitHub tag (v0.9.0, 2019-01-09) and predates the repository (created 2017-09-29); the npm maintainer is the same author. The README's "Related" section links @sindresorhus/is and ngx-ow; neither is a basis or an alternative statement. The README recommends zod for complex schema validation ("For complex schema validation (API responses, database queries, JSON parsing), use zod instead."), a recommendation, so no alternativeTo is recorded. The homepage sindresorhus.com/ow/ hosts the complete API documentation the README links. The LICENSE copyright line names the author; only the name is recorded. The npm figure is the ow package, 2026-11-01 to 2026-11-07. The README's dev-only import (ow/dev-only) exports a shim in production builds when the bundler runs with NODE_ENV set to production, which lowers the bundle size.
