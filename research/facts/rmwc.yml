notes: >
  Status: the README carries a warning from the maintainers (quote: "there will be no major updates to RMWC either") and says they "will only perform essential maintenance going forward". That is a maintenance-mode statement, not a declared end or "unmaintained", so the record stays accepted. The README does not say RMWC itself is archived or unmaintained, so the status stays. The warning also says the material-components-web base library was archived, which the material-components-web record covers. The maintainers named in the README are the RMWC Development Team (Emily, Brett and Jens); the copyright line and the README credit name James Friedman as creator, so maintainer is his name. The registry figures are from the core package @rmwc/base, which the README's own downloads badge uses. The umbrella package rmwc, which the install docs name for installing all of RMWC, had 3278 weekly downloads for 2026-10-19 to 2026-10-25 (https://api.npmjs.org/downloads/range/2026-10-19:2026-10-25/rmwc), 22 dependent packages and 261 dependent repositories (ecosyste.ms, read 2026-10-28). The 63 contributors count excludes anonymous contributors. The npm package rmwc has no GitHub releases, but the repository has git tags; the registry date and major come from npm. The README lists "Server side rendering support" as a feature; that is compatibility of a UI library, so renderingModes is not recorded. No runtime or runsAs value is recorded because no page names a runtime or a deployment target. The installation guide is read from the copy the repository holds under docs/assets (the rendered docs site is a JavaScript shell). The README says the library is "a React UI Kit"; react is the record id used for basedOn because the install guide states it as a React wrapper. The installation guide says "Include the individual components stylesheets (listed on their docs page) in your project", and its examples import them from @material/button/dist. The README warning says "Pull requests are always welcome, but please be aware that we might not have the capacity to prioritize them."
