notes: >
  The English getting-started page asks for Node 18 or above and the Chinese one for Node 22 or above; the npm package declares engines node >=14. The English page is the documented requirement and is recorded as runtimeMin; the sources disagree. The site root is in Chinese; the English pages are under /en-US/docs. The English getting-started page says the build output in the dist directory is deployed to a server; no page says the output is static files, so runsAs is not recorded. The introduction names MFSU, a Webpack packaging solution, and no other build engine; Vite appears only in a comparison. The introduction's "over 10,000 applications" figure is undated and is not recorded. The create-umi scaffolder is named by the install docs, so the core package umi is the registry id.
