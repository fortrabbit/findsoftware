notes: >
  The repository has no homepage set on GitHub and no separate site, so no homepage is recorded; the README is the docs. The README says DataLoader is "often used when implementing a graphql-js service" and that it is "broadly useful in other situations"; a use with graphql-js is not a parent, so basedOn is not set. The README lists ports to other languages under "Other Implementations" (Elixir, Go, Java, .Net, Perl, PHP, Python, Ruby, Rust, Swift, C++); these are separate projects and are not recorded here. The LICENSE copyright line names "GraphQL Contributors"; the README says the repository is managed with EasyCLA under the GraphQL Specification Membership agreement and that GraphQL Foundation membership is invited; the foundation is not recorded as the maintainer. The npm figure is the range 2026-10-26 to 2026-11-01; the CSV figure of 7.8k a week is a stale point count. The npm registry first upload is 1.0.0 on 2015-09-14, the same year as the repository creation and its first GitHub release. The dependent counts come from the ecosyste.ms npm record of the package. The last commit on the default branch is 2026-09-16, so the project is not in the listing's no-release branch; its newest stable release is 2.2.3 from 2024-12-03.
