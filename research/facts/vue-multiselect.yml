notes: >
  Doubt: none on status. The project's documentation site vue-multiselect.js.org answers with an empty JavaScript shell (a div with id app and a bundled script), so no sentence of it is read; the homepage value rests on the README sentence "For the full docs for v3 and previous versions, check out" that links the site. The site's HTML meta description says "Probably the most complete selecting solution for Vue.js, without jQuery." and is not recorded because it is a superlative claim. The README says "Documentation for version 3 (Compatible with Vue 3)" and "Documentation for v3.0.0 is almost the same as for v2.x". The GitHub release list names v3.5.0 (2026-03-17) as the newest stable release; the v4.0.0-alpha.0 prerelease (2026-09-17) is newer, so latestPrereleaseDate is recorded. The npm package vue-multiselect (latest 3.5.0, published 2026-03-17) matches the GitHub release. The README's install section names npm install vue-multiselect. The README's features list includes "NO dependencies", "Vuex support" and "Async options support"; these are features of the component and no fact field, and Vuex is not recorded as a basedOn or importsFrom value. The README's "Build Tool Compatibility" section says "vue-multiselect requires Vue's Options API to function properly"; that is a constraint kept here for the prose. The README's sponsor logos are not recorded. The CSV figure of 172.9k per week is a stale point count; the range sum is recorded. The repository has no statement that the component runs in the browser, so no runsAs is recorded. The repository's tags run from v0.1.0 (commit dated 2016-04-30) to v4.0.0-alpha.0; firstRelease is the year of the oldest tag. The LICENSE copyright line names Damian Dulisz; the npm maintainers include the handle shentao, recorded as the handle and not as the name.
