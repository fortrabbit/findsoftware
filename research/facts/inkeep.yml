notes: >
  Hosted search product, so no repository is recorded: the CSV repository inkeep/widget returns 404, and inkeep/agents is the open-source Inkeep Agent Framework, a different product. The framework's license is Elastic License 2.0, source-available, per docs.inkeep.com/community/license; it is recorded here, not as a license fact, because the hosted search product is not covered by it. The agents repository (created 2025-09-05, latest tag v0.68.4 dated 2026-04-15, GitHub reports no license) and the npm SDK @inkeep/cxkit-js (CSV: 481 downloads a week) are SDK and client figures and stay out of the fact file. Unified AI Search (Managed RAG) is listed only in the Enterprise column of the pricing page, and the open-source column names no search feature. The pricing URL inkeep.com/pricing returns 404; the pricing page is docs.inkeep.com/pricing. No prices were recorded. The legal name is Inkeep, Inc. from the terms of service, last updated Nov 13, 2024, and the page gives no country. Category search-integration is the nearest mapped value for AI search SaaS. The social links are on the homepage. The Enterprise page lists Cloud, Hybrid or Self-Hosted deployment options ("Cloud, Hybrid, or Self-Hosted deployment options for Hosting Types"). The pricing page has an Open Source column ("free forever", the agent framework) and an Enterprise column that holds Unified AI Search; the plan tiers are no paidEdition and no prices are recorded. Features with no page found: i18n, live preview, import from other software, API rate limits, data regions.
