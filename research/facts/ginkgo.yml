notes: >
  Gomega, the matcher library the README says Ginkgo is "complemented by", is a separate project under the same maintainer (github.com/onsi/gomega) and is not a basedOn statement; the docs' install sentence fetches it with a go get line. The README says Ginkgo "builds on top of Go's testing foundation": the standard library's testing package is the language's own test runner, not a record, so no basedOn is recorded. The docs homepage describes Ginkgo as "a testing framework for Go" and says it "is sometimes described as a Behavior Driven Development (BDD) framework" while being "a general purpose testing framework"; the category follows the general-purpose sentence. The homepage on the GitHub homepage field is http://onsi.github.io/ginkgo/, which redirects with a 301 to https; the https page is the record's homepage and docs. The README copyright is on the LICENSE line "Copyright (c) 2013-2014 Onsi Fakhouri" for an individual maintainer; no company or legal entity is named, so no hqCountry is recorded (the GitHub profile location, Denver, CO, is a personal profile field). The docs say Ginkgo "came together" under Pivotal in 2013; that is history, not a parent. The docs say "V1 is no longer supported"; that is a version note, not an end statement for v2. The first tag is v1.0.0 (commit date 2014-05-24); the repository was created 2013-08-23. The go.mod at v2.34.0 declares go 1.25.0, recorded as runtimeMin "Go 1.25". The stars and contributors belong to the repository, which holds the library and the ginkgo CLI together.
