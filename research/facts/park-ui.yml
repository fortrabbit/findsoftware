notes: >
  The copy-paste model: the introduction page says components are distributed "as source code rather than shipping them as an NPM package", and the CLI installs them into the project, so @park-ui/cli is the package the install page names and its dependent counts are not a measure of components in use. The installation page shows React and Solid tabs; no category fact is recorded for either framework. The LICENSE copyright line reads "Copyright (c) 2025 cschroeter", a GitHub handle, and is recorded as the maintainer; the blog post about joining the Chakra UI organization says "Park UI was created by Christian Busch", which names a creator and is kept here in notes. The repository moved from cschroeter/park-ui to chakra-ui/park-ui as the blog announces ("The repository will move to github.com/chakra-ui/park-ui"); the npm repository field still names cschroeter. The changelog states that @park-ui/panda-preset is retired in favour of recipes in the codebase; the record is not affected. The CLI engine field is not stated, so no runtime is recorded. Latest stable CLI tag is @park-ui/cli@1.0.1, npm publication 2025-11-20. The GitHub release list holds tags for several packages (panda-preset, tailwind-plugin, presets); the figures are for @park-ui/cli. The docs also state the CLI can add color palettes (npx @park-ui/cli add teal); no fact recorded. The quickstart page lists Next.js and Solid Start examples.
