notes: >
  Accepted on criterion 1: the homepage says a site adds a small browser script with one line of HTML, or sends events from its server, and the homepage states use "with any framework or CMS". The tracking script (tracking guide) and the server-side event API are the attach routes. An API exists with API keys and client packages (JavaScript and Rust), the npm package README calls the API experimental, and no page states its protocol, so headlessApi stays out. Runtime: a compiled Rust binary (runtime binary); runtimeMin is left out because the software ships as a binary and a Docker image, and the Cargo.toml at tag liwan-v1.8.2 names rust-version 1.99 as a build requirement. Releases: liwan-v1.8.2 (2026-10-29) is the newest stable release, a release candidate series (liwan-v1.8.0-rc.0 to rc.5, September and October 2026) is older than the stable line and is not recorded as latestPrereleaseDate. The repository tag prefix is liwan-v; the first tag is liwan-v0.1.0-beta.1 (2024-08-13). Maintainer: the LICENSE file has no copyright line; the impressum at henrygressmann.de names Henry Gressmann as the operator of liwan.dev (the page says "This legal notice applies to ... https://liwan.dev"). The address is the maintainer's own; it is recorded as hqCountry DE for the reviewer, since the maintainer is an individual. Two Docker image names: the README and homepage name ghcr.io/explodingcamera/liwan (GitHub Container Registry, not Docker Hub), so no Docker Hub pull figure exists. The authentication guide names a team assignment through the provider's groups and that a regular "User" account is created on first sign-in; no further role names are stated, so userRoles stays unknown. The dashboard and the database are built into the binary (homepage), with bot filtering and no tracking cookies stated: coined kinds (privacyClaims, botFiltering, cookieless) are in notes. The authentication guide names Google Workspace and Microsoft Entra ID beside "any OIDC-compliant provider"; only OIDC is recorded as the protocol. The impressum's phone number and email address are not recorded.
