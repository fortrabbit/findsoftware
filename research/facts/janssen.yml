notes: >
  The CSV homepage jans.io answers with a 301 to the GitHub repository, so the homepage is the documentation site docs.jans.io, which the repository About names as its website. The Linux Foundation hosts the project: the platform-goal page says "In 2020, Gluu contributed the code to the Linux Foundation Janssen Project." The foundation and Gluu are not recorded as maintainer. The Auth Server is built on the Java Weld framework (auth-server page, "It is based on the Java Weld framework"); Weld has no record id, so it stays here. The repository also ships Agama, a DSL for web authentication flows, and Cedarling, a policy decision point with Java, Go, Rust, Python and C SDKs; both are components of the same repository and are not separate records. The docs present the Docker quick start as a demo ("AIO") install with 8 GB RAM and 4 CPU; the VM requirements page lists 8 GB RAM and 4 CPU for development and test. The license is Apache-2.0 on the repository; the docs name no separate license. The highest stable GitHub release is v2.6.1 (2026-11-03); the release list also holds component tags such as docker-jans-auth-server-v1.0.0-beta.13, which are not the server release. The first release is the oldest GitHub release of the repository, the alpha v1.0.0-a2 (2020-12-30). The auth server implements OAuth 2.0, OpenID Connect, SAML 2.0, FIDO2, SCIM and UMA 2.0 (docs home page). The pom compiler source is a build target, so no runtimeMin is recorded. Gluu offers commercial distributions named Gluu Flex and Gluu Solo (README).
