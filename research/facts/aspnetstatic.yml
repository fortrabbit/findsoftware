notes: >
  The repository has no homepage set and the README names none, so no homepage is recorded. The docs are the README (Readme.md, capital R, on master). The NuGet package AspNetStatic is the one the install step names; the AspNetStaticContrib and AspNetStaticContrib.Stekeblad packages are add-ons in the same repository and are not recorded. The README badge alt text says "ASP.NET Core 6.0+" and its badge message says "8.0 - 9.0", while the csproj targets net10.0, net9.0 and net8.0; runtimeMin is recorded as 8 from the NuGet package's lowest dependency group. The README names Netlify and Azure/AWS storage as places to host the generated files; no field holds deploy targets. The README says "It has no templating system", so templating is absent. The oldest GitHub release, v0.10.0 (2023-04-10), is a prerelease; firstRelease takes its year. The three prereleases are all from 2023 and older than the latest release, so no latestPrereleaseDate is recorded. The NuGet download figure is the package total at the read date, not a period figure.
  The README describes two modes. In standalone generation the app writes the static files, which are then copied to a web host, and it can exit once they are written. In partial static site mode the app keeps running, serves the generated files for the static routes and serves other routes dynamically. The README says it works with Blazor (SSR), Razor Pages and MVC, that routes for static content must not sit behind authentication or anything that needs user interaction, and that Blazor pages must not rely on client-side JavaScript or WASM to render. The routes are listed in an IStaticResourcesInfoProvider registered in dependency injection.
