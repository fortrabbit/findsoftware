notes: >
  The record is the free core package livewire/flux, which the README names as the install target, and the Pro tier is a paid edition of the same product; the pricing page lists single-project, unlimited and team licenses, and no prices are recorded. The core package's composer.json says license proprietary, and the Flux Terms of Service and License Agreement (last updated 2024-09-24) grants a license to use Flux components and templates; both are recorded as stated, and the import derives licenseModel from those two statements. The terms bar use of Flux in open source projects and redistribution of its components apart from an End Product. The terms name Wireable LLC and give New York as the governing law, which is not a headquarters statement, so hqCountry is left unknown. The composer.json authors list Caleb Porzio as an individual; the copyright footer gives Wireable LLC, which is recorded as maintainer. The README requires Laravel 10 or newer, Livewire 3.5.19 or newer and Tailwind CSS 4 or newer; these are prerequisites, not basedOn statements, so Laravel is not recorded. The first release year comes from the first stable release, v1.0.0 on 2024-09-21; the v1.0.0-beta series began on 2024-09-19. The homepage footer links two personal X accounts (calebporzio and hugosaintemarie), not an account of the project, so x is not recorded. The Packagist download total is the all-time figure. The runtimeMin is the PHP minimum of the composer.json at the latest release tag. The setup adds Blade directives to the layout and imports the Flux stylesheet into the Tailwind CSS file; the free components include buttons, dropdowns, icons, separators and tooltips; a Pro license is activated with an artisan command; components are customized by publishing their Blade files with an artisan command.
