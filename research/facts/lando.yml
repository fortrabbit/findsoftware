notes: >
  The repository lando/lando is the umbrella repository: it holds the releases and the README, and its source directories are submodules (core, core-next, hyperdrive, mailpit, setup-lando, website). The CLI source is lando/core (MIT, package @lando/core 3.26.9, engines node >=20.17.0), which the source install guide clones; reviewer to decide whether repository should be lando/core. Stars, contributors and releases are read from lando/lando, as the CSV row names it. The homepage gives "50,000+ Developers Supported" and "Used by 50,000+ developers across 300+ organizations"; these count developers, not installs, so no reportedInstalls is recorded. The Lando Alliance is a 501(c)(3) nonprofit, recorded as foundation; the homepage and the terms page say nonprofit, not foundation, so a reviewer may prefer community. The terms page names the entity "Lando Alliance" with no legal form. firstRelease is 2020 from the oldest stable-named tag v3.0.0 (2020-05-05), which GitHub marks as a prerelease, and v3.0.1 (2020-05-08); the 2017 alpha tags are alphas. Platforms from the requirements page: macOS 12 or higher, Windows 10 Home or Pro 21H2 or higher with WSL2, and Linux with kernel 4.x or higher. Docker Engine is required and the installers install it. Lando is "built on Docker container technology" per the what-it-do page; Docker is no record, so no basedOn. Services and recipes lists (MySQL, MariaDB, Postgres and others) are service containers, not recorded as databases. The Slack channel has no field. The Lando Alliance Terms are dated 2025-07-04 and govern the software under MIT.
