notes: >
  The record is a fork of Commento (forkOf commento) by the project's own statement; the README also says the fork "bears a remote resemblance" to its predecessor and that since version 3.0 "there's literally no legacy code left", which is not recorded as a field. The GitLab repository carries tags from 2018 (v1.0.0, commit date 2018-08-17) inherited from the Commento history, which are not Comentario releases; firstRelease 2023 is the first GitLab release page, v2.0.1 (2023-01-18), the fork's own first release. The LICENSE file has a second copyright line, "Copyright 2018 Commento, Inc.", which is another legal entity and is left to notes; the maintainer follows the first copyright line, Dmitry Kann. The company that runs the cloud service is "Yktoo Solutions" according to the terms of service, and the terms name the laws of the Netherlands as governing law; no page names the company's legal form or its country, so no hqCountry is recorded. The GitLab project shows 110 stars and 111 forks; GitLab stars have no field here, so they are left to notes. The GitLab languages endpoint gives Go at 32.77 percent and TypeScript at 56.08 percent; the language field follows the server, and the front end (TypeScript) is not recorded. The project hosts Docker images at registry.gitlab.com/comentario/comentario; the GitLab registry offers no pull count, so no dockerPulls is recorded. The README lists the Cloudron store app and an unofficial Railway template as deploy routes; these are third-party distributions and are not installMethod entries. The README lists the social login providers and the extensions for spam checking (Akismet, APILayer, Perspective); those are coined kinds and go to notes with the webhooks, statistics, WCAG statement and privacy claims.
