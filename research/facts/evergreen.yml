notes: |-
  The last GitHub release and the npm latest are both 7.1.9 from 2023-06-21; the repository is not archived and the npm package is not deprecated, so no end signal is recorded and the import decides the status by release age. The install page asks for react and react-dom 16.8.0 or higher; that is a peer requirement, so no runtimeMin is recorded. The README lists GitHub Discussions under Documentation & Community, recorded as forum. The homepage copyright line reads 2023 and the LICENSE reads 2017; both are Segment.io, Inc. The row lists the project's own maintainer as Segment; the parent company is not stated on these pages, so no parent is recorded. The installation URL returned 404 and the getting-started page was read instead. The introduction page says evergreen components are built on top of a React UI primitive, and the site lists foundations, components and patterns sections.
   The README says Evergreen "bundles its own CSS-in-JS solution from ui-box" and offers server side rendering and automatic hydration through an extractStyles() function. The segment.com legal pages now redirect to Twilio Inc., so no hqCountry or parent is taken from them. The README calls the BlueprintJS icon license a "custom Apache 2.0 license"; the linked palantir/blueprint LICENSE file is the standard Apache License 2.0 text, so it is recorded as Apache-2.0 for the icons and the import reads the project as open source.
