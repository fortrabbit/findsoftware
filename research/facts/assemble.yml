notes: >
  The CSV homepage assemble.io is, per the README, the website of grunt-assemble, so no homepage is recorded for this package. GitHub reports the language as CSS, which does not describe the code, so language stays unknown. The repository has no GitHub release; its tags run to v0.4.42, and the npm latest tag 0.24.3 (published 2017-05-20) is the stable release used for currentMajor and latestReleaseDate, per the fallback rule. The README describes the move of grunt support to grunt-assemble as a major refactor. That is a history note, not an end signal, so status stays accepted. The maintainer is taken from the LICENSE copyright line; package.json lists Brian Woodward and Jon Schlinkert as maintainers.
