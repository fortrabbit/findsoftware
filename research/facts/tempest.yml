notes: >
  The governance page names individuals and no company or sponsor, so maintainerType is community. The bluesky and x links point to the lead maintainer's personal accounts via tempestphp.com redirects, not project accounts. The deployment page names no hosts; it describes an SSH deploy script and recommends a dedicated server. The starter tempest/app has 5828 total Packagist downloads. Coined fields: governance (decision structure), majorReleases (date of each major version), blog.
