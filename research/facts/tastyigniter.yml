notes: >
  pluginDirectory is the marketplace of extensions and themes. Marketplace extensions and themes carry their own Regular and Extended licenses; those are not the license of the software and are not recorded. The homepage says "Free core" and "Self-hosted, forever free". The About page reports 1.2k GitHub stars and 20,000+ restaurants; both are the page's own counts and differ from the API (3803 stars), so only the API figure is recorded. The About page calls 2016 an official launch and 2013 the founding as a university project; neither is a first release year, so firstRelease is unknown. The Igniter Labs terms state "registered in England and Wales", which fixes hqCountry as GB. Criterion 1: TastyIgniter is a web application that restaurants run to take orders and reservations on their site, which is software to run a website with ordering; the record stays accepted. The install docs name tastyigniter/core for package installs; the registry figures are for that core package, since tastyigniter/tastyigniter (the create-project skeleton) shows 383 monthly downloads against 5935 for the core. The installation guide also covers a queue worker for production (the queue runs synchronously by default), so runsAs holds per-request and scheduled only. The docs for localization state no multilingual site support, so i18n is left out. The restaurant-ordering category name is coined here.
