notes: >
  Status stays accepted. The installation page says "we no longer support beginning new projects with Lumen. Instead, we recommend always beginning new projects with Laravel." That is a support statement, not an end signal. The laravel/lumen repository, which the framework README calls "the main Lumen repository" for building applications, is archived (pushed 2024-04-09); the framework repository is not, and no page says Lumen has ended. Reviewer decides whether the archived skeleton counts as the project's source. Registry figures come from laravel/lumen-framework, the core package; the laravel/lumen skeleton shows 1204878 total on Packagist. The lumen-framework README says Lumen is open-sourced under MIT, and the docs say Lumen is "a totally separate framework from Laravel". The docs install section names no install command in the fetched page, so installMethod is unknown. The maintainer is the copyright line of the docs footer and LICENSE.md, which name an individual; the repository owner is the laravel organization.
