notes: >
  The monorepo holds three projects: the React v9 package @fluentui/react-components recorded here, the v8 React packages (@fluentui/react) and the web components package (@fluentui/web-components), which are candidates of their own; the root README calls v8 mature and v9 the one to migrate to, and says Fluent UI React Northstar was superseded and reached end of life in July 2025, which concerns another package. The root README and the package's own README both say the library is MIT; the LICENSE file, package.json and the GitHub API agree on MIT, while the API reports the repository license as NOASSERTION. The README says fonts and icons are used under the assets license agreement, recorded as its own license entry, and no paid edition is stated. The first release is the first stable 9.0.0 upload to npm on 2022-06-28; the package's 9.0.0-alpha line began in 2021-02 and is a pre-release, and the repository history predates the package. The Quick Start states React 17, 18 and 19 are supported, and TypeScript support follows the three latest major versions; these are not recorded as fields. The package.json homepage field is absent, and the homepage is the repository's homepage setting. Contributors counts the whole fluentui repository. hqCountry is read from the Redmond, WA address in the terms page. Downloads are the sum of the 2026-10-18 to 2026-10-24 range, and the Microsoft Corporation maintainer name comes from LICENSE. The quick start says the components are styled with CSS in JS and that a FluentProvider with a theme supplies the style renderer; the introduction names design tokens as the route to Fluent Design Language updates.
