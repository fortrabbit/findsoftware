notes: >
  No homepage is recorded. The GitHub Pages address yuin.github.io/goldmark answers 404; the playground at yuin.github.io/goldmark/playground/v2/ is a demonstration built with WebAssembly and is not the project's site. The default branch is v2, and the README's install and usage code are for the v2 module path github.com/yuin/goldmark/v2; the v1 line remains on the tags. The README's Installation section gives only a shell command (go get), and no sentence names the route, so installMethod is not recorded. The README names no documentation site; the pkg.go.dev badge is the module's API reference and is not recorded as a docs field. The maintainer is the copyright holder on the LICENSE line and the author named in the README; the owning account is a personal GitHub user. The README's maintenance policy covers bug and security fixes for the latest major version and the one before it. The v2 status line says v2 is still in the early stages of release, which the README keeps alongside a stable v2 release; it is not an end statement. The README points to a Rust port named rushdown, which is no field. The extension list in the README is long and mixes v1 and v2 support; no extension is recorded. The stars and contributors belong to the single repository. The CommonMark conformance is stated as 0.31.2 in the README; the version is not recorded here because it rots, and the spec compliance kind is notes. The first tag v1.0.0 dates from May 2019, the repository from April 2019. The module has no download figure.
