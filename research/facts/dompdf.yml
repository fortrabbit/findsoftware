notes: >
  Dompdf is a library that a PHP application requires, so it has no server of its own; runsAs per-request reflects the PHP runtime that loads it. The composer require pulls masterminds/html5, dompdf/php-font-lib and dompdf/php-svg-lib, and the homepage lists the PHP extensions DOM and MBString as requirements. The composer constraint of the latest stable tag is "^7.1 || ^8.0"; runtimeMin records its lower bound. The homepage lists PDFLib as an optional PDF backend that needs a PECL extension, and says the bundled R&OS CPDF class needs no external PDF library. The homepage says the library does not tolerate poorly formed HTML well and suggests the built-in HTML5 parser or a validator, and that a table row must fit on one page. The maintainer is named as "dompdf project" on the homepage; that page names no company, so maintainerType community follows from the organization. The homepage's x link is the twitter.com address it still publishes.
