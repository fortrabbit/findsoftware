notes: >
  The homepage credits Cake Software Foundation, Inc. with copyright and names CakeDC as the commercial entity behind the framework; maintainer records the foundation, and CakeDC goes into the coined field `commercialSupport` (a company selling development, support or training for the software, separate from the maintainer). cakefoundation.org is a placeholder ("New website coming soon"), so the foundation's country is unknown. The supported-versions page (updated August 2026) still lists 4.x security support until 2026-09-10, a date already past on 2026-10-18; endoflife.date keeps 4.6 as not EOL. The plugin directory shows packages with download counts but no total. Twig is available through a separate plugin. Coined field `chat` as in symfony.yml.
