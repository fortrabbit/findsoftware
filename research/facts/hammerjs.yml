notes: >
  The homepage answers over both http://hammerjs.github.io and https://hammerjs.github.io without a redirect, so the https address is recorded as the homepage. The repository has no GitHub release objects; its tags run from v1.0.0 (commit 2013-02-26) to v2.0.8 (commit 2016-04-22), and npm has 2.0.8 uploaded 2016-04-22, so latestReleaseDate and currentMajor come from npm and firstRelease from the 2013 npm upload that matches the oldest tag. No release in four years makes the import move this record to stub; the status stays accepted because the project states low maintenance mode, not an end. The LICENSE copyright line names Jorik Tangelder (Eight Media) for 2011 to 2017; the footer links eight.nl, which is not recorded as a parent. The getting-started page states the library has no dependencies. The README installs it through npm (npm install --save hammerjs), Yarn and a cdnjs CDN entry, but those routes appear only as headings and code blocks, so the npm and yarn routes are recorded from the README commands and the CDN route is not. No sentence on the site states where the library runs, so runsAs is not recorded. The Support link in the site nav goes to the hammer.js tag on Stack Overflow. The getting-started Extensions list names a jQuery plugin and an Angular.js directive; no plugin directory or count is recorded. The README badge links a Slack community at hammerjs.herokuapp.com, which fits no field. The npm figure is the sum of daily downloads for 2026-11-01 to 2026-11-07; the point endpoint for last week returns a shifted window. The gestures category from the candidates row has no entry in the import map, so the record takes ui-library. The getting-started page lists the default recognizers (press, tap, double tap, horizontal pan and swipe), says pinch and rotate are disabled by default because they would make the element blocking, and describes building a Manager with custom recognizers.
