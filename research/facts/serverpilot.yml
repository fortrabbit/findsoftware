notes: >
  Hosted-service: criterion 2 waived by the CSV row (no repository, SaaS). Criterion 1 holds on its own pages: the homepage and docs say it hosts "any application" and offers "One-click WordPress", and the docs page states it creates apps "to host any type of website". The pages read name no social profile, so no social field is recorded. Maintainer and hqCountry come from the privacy page and terms (Less Bits, Inc. is "SERVERPILOT, US, OR WE", Delaware governing law at serverpilot.io/terms/). The company page says ServerPilot is part of the same company as EarlyDog, a separate cloud-ops service; no record. Pricing has three hosted tiers (Economy, Business, First Class) billed by server and app, hourly; these are hosted plans, so no paidEdition, and no prices are recorded. The what-is page says "Your servers belong to you and stay in your account at your preferred cloud provider." and that the installer sets up Nginx, Apache, MySQL and several PHP versions. The same page says "You can directly use your cloud provider's features such as automated backups." A 14-day free trial is in the account docs. The docs name Google Cloud, AWS and DigitalOcean as providers and the what-is page says "any other server provider"; no deployTargets field is recorded. The features page names MySQL; the packages docs also install MongoDB, Redis, Memcached and ImageMagick on the server. The docs recommend two-factor authentication; no SSO or user-role feature is documented. The API is named in the features page ("Use ServerPilot's API") with no limits stated, so apiLimits is absent. No page on the site gives a founding or first-release year, so firstRelease is absent. Blog posts from 2026 cover security patches, not releases. Fields coined: none.
