notes: >
  ScrollMagic v2 is no longer actively maintained. (v2.0.9 README, the stable release: "ScrollMagic v2 is no longer actively maintained. It has been replaced by ScrollMagic 3.0, a complete rewrite in TypeScript with a modern API. This branch is preserved for existing users but will not receive new features.") The replacement is in beta (npm dist-tag next 3.0.0-beta.5, 2026-06-25), so the record is a stub until a stable ScrollMagic 3.0 release ships or the maintainer ends v2 in a way the import can read. Facts above describe v2.0.9, the latest stable release; the main branch README describes the 3.0 beta and is not cited. The README names GSAP and VelocityJS as animation frameworks ScrollMagic works with; they are named as optional companions, not as parents, so no basedOn. The homepage (scrollmagic.io, reached over https from the plain http address in the CSV) is the v2 demo page, which carries a sponsor message and a donate link; neither is recorded. The support site named in the README is a paid premium support offer, not an edition, so no paidEdition. The Bower route is a third-party registry and is not recorded as an install method. The README calls ScrollMagic a complete rewrite of its predecessor Superscrollorama and recommends the skrollr project for a simple CSS-animation solution; neither has a record here, so no successorOf or alternativeTo fact. The npm repository field names janpaepke/ScrollMagic, the repository the candidate row names. The maintainer's personal social profiles are not recorded as project social links. The v2 package.json declares a Node engines minimum; a browser library's engines field is no runtime, so none is recorded.
