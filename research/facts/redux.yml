notes: >
  The httpArchiveSites figure is the HTTP Archive technology named "Redux" (mobile origins). The repository is the Redux core. Stars and contributors belong to it, and the npm figure is the redux package the installation page names for the core by itself. The Redux Toolkit (redux-toolkit, its own candidate) includes the Redux core and is named in the README as the official recommended approach; the React bindings (react-redux) are named on the installation page as the official React bindings; neither is recorded here. The npm package history starts in 2011, years before the repository was created in 2015, so that history belongs to another project and firstRelease follows the oldest GitHub tag v0.1.0. The README says Redux "can be used with React, or with any other view library" in its own words as "You can use Redux together with React, or with any other view library"; no basedOn is recorded because Redux is standalone. The README says it helps applications "run in different environments (client, server, and native)"; no runtime is recorded because no sentence names Node.js for the core package. The installation page says that without a bundler the core package files can be accessed on unpkg, recorded as the cdn route. The maintainer follows the LICENSE copyright line (Dan Abramov); the documentation footer names "Dan Abramov and the Redux documentation authors", a wording kept here as notes. The discord link is the #redux channel of the Reactiflux Discord community named in the README, not the Reactiflux server as a whole. The language is the GitHub primary language TypeScript.
