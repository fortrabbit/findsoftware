notes: >
  Doubt first: the product is closed to new teams, so it is a stub until Netlify states that it is still offered or retired; the availability sentence in the overview and the set-up page says a new project or team cannot enable visual editing, so the status is stub on that statement. Netlify's Create product page (https://www.netlify.com/products/create/) redirects to https://www.netlify.com/platform/, which does not mention the Visual Editor, so no homepage is recorded; the overview docs page is the product's own page and is recorded as docs. The CSV name "Netlify Visual Editor (Create; Stackbit)" comes from discovery: the docs pages name the product Netlify Visual Editor, and the set-up page installs the Visual Editor CLI from the @stackbit scope without naming Stackbit as the product owner, so the name follows the docs. The overview says the editor is part of the Netlify platform, runs in a Node-based environment by default, and stores content back to each content source (Contentful, Contentstack, DatoCMS, Git, Hygraph, Sanity and a custom source interface). The set-up page covers a local setup from a template. Maintainer and hqCountry come from the Netlify website terms, which give the full address of Netlify, Inc. in San Francisco, California, United States; the country is taken from that US address. The @stackbit npm packages are not recorded beyond the CLI install route. No API for the software itself was found: the Content Source Interface is an API the sources provide, not an API of the visual editor, so headlessApi is not recorded.
