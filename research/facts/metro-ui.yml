notes: >
  The v5 documentation page links to docs.metroui.org.ua, which does not answer, so the v5 site is cited for docs. The homepage's NuGet link is not an install route on the install page and no NuGet figure is recorded. The npm package named "metro-ui" (3.0.15, a different package from an earlier line) is not the install package and no figure from it is recorded; the npm figure is @olton/metroui. The LICENSE copyright runs 2012-2020 and the README runs 2012-2025; the maintainer's name is the same in both. firstRelease follows the 2012 start of the copyright line in the README and the docs footer, under the same maintainer; the repository itself was created in 2012 and was renamed, and the first GitHub release is 5.0.0 (2024-05-07). The README's "Previous versions" lists Metro-UI-CSS-1 to -4 as separate repositories. The "SUPPORT PACK" annual subscription and the "premium support" from the author are paid support, not an edition, so paidEdition is not recorded. The author's Latte test system is a separate product and is not part of this record. The homepage "Discuss" link and the README's Discord badge are recorded as forum and discord. The runsAs browser statement comes from the quick-start page, which says the page is opened in a browser. The v5 introduction lists a reactive data model, a router and DOM helpers among the special libraries. The README says long-term support of older versions does not currently exist, so older versions are left to the user.
