notes: >
  Open source ASP.NET Core CMS in the mixcore organization on GitHub. The README is the readable project documentation; the dev docs sites named in the README (docs.mixcore.org, mixcore.dev) and the community site do not answer, so the docs field points to the README and no install step beyond the README is recorded. The newest stable release is v1.0.7 (2022-05-01) and the newest pre-release v2.0.0-alpha.1 has the same day, so no pre-release date is recorded; the import judges the release age against the four-year rule. GitHub marks v2.0.0-alpha.1 as a non-prerelease; the tag name is an alpha, so it is counted as a pre-release here. The master branch is the v1.0.x LTS line and develop is v2.0.0-alpha; currentMajor is the stable 1. The homepage says the product is "Built on top of ASP.Net Core 6 / Dotnet Core 6", which is a stated parent, and no minimum runtime is stated as a requirement, so runtimeMin is absent. The homepage shows a directory rating with a review count; ratings are not recorded. The homepage footer credits a theme author and a studio; those are not the project. The README names the databases MySQL, SQL Server, PostgreSQL and SQLite as "Special features (Out of the box)"; the API style is not stated on a page of this record, so headlessApi is absent even though the homepage says "Headless & Decoupled CMS". Multisite and rendering modes are not stated.
  The README gives the start commands (docker run, dotnet run) but no page states how the live site is run, so runsAs is absent, and no page states where content is stored, so contentStore is absent.
