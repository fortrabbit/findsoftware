notes: >
  Vite is the build tool here, not a parent, so basedOn leaves it out. The GitHub and npm homepage honohub.dev answers 200 but shows only a placeholder page ("TODO: Add a description of the project"), so the record uses v1.honohub.dev, the docs site that carries the project description, as homepage and docs. The v1 documentation describes the same architecture as the README (Hono, Drizzle, Zod, Vite), but no v1 release is tagged or on npm: the highest GitHub release and the npm latest are 0.3.0 from 2024, so currentMajor is 0 under the release rule. The README says HonoHub is in alpha and that breaking changes ship without semantic versioning. The npm package honohub is the registry figure; the repository's packages/core is that package. The REST and GraphQL pages describe the default endpoints and the useGraphQL plugin, and the README names the Discord server of Hono, which is not recorded as HonoHub's. The Admin Panel is documented as a React application that can be served from the API server or deployed as a static site, so adminUi is recorded as optional. The docs build on Drizzle without naming supported databases: the quickstart example uses a Neon PostgreSQL schema and the REST page mentions MySQL output, which only imply support, so databases is left out. The footer of the v1 site links an X account of Rhinobase (recorded as x) and a Discord invite that is the Hono server named in the README (not recorded). The quickstart mounts the hub as a route in a Hono app, the REST page says request validation uses Zod schemas generated from the Drizzle schema, and the GraphQL plugin is a separate package. The deployment page says the admin panel can be served from the API server or deployed to static hosting, and the APIs deploy wherever Hono runs. The admin panel page says the dashboard is not needed and that the APIs can be used directly as a headless CMS. The quickstart describes the project as a hub configuration file that defines collections from Drizzle schema tables.
