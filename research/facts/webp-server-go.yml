notes: >
  Go server (module webp_server_go) that converts images on request: the README lists JPEG, PNG, BMP, GIF, SVG, HEIC, NEF and WEBP as inputs, and output as WebP, AVIF or JXL (docs.webp.sh). A reverse proxy such as Nginx or Caddy sits in front of it for public use (quick start). Docker is the recommended route: the README says "We strongly recommend using Docker" because the binary can hit glibc and dependency problems. The binary page says the binary needs libvips installed (brew, apt or dnf) and notes "a potential memory leak problem with this server and remains unsolved". The Docker images are published on Docker Hub (webpsh/webp-server-go) and GHCR (docs deployment page); the README header badge shows Docker pulls with no figure. Go modules have no download figure, so none is recorded. The release list has 78 GitHub releases; the oldest is 0.0.3 (2020-03-01) and the repository was created 2020-02-09. No prerelease is listed. Two license statements: the GitHub detection reads GPL-3.0 and the README says "WebP Server is under the GPLv3". The LICENSE file is the GPL v3 text and names no copyright holder. Maintainer: the about page of webp.se describes WebP Cloud Services as the team and says it keeps the core WebP Server project on GitHub; no legal entity name, legal form or HQ country is stated, so hqCountry is absent and the maintainer is the name the page uses. WebP Cloud (webp.se) is the hosted offering next to this project: its plans are hosting tiers and not a paidEdition, no prices are recorded, its homepage names regions in Germany, Finland and the United States, and its features are on its own pages. The webp.se homepage links an x.com account, which belongs to the hosted service, so no x fact is recorded. The README names a blog (blog.webp.se) and a status page; neither is a field. The project also names a "WebP Cloud Services" public Fly service; not recorded as a fact.
