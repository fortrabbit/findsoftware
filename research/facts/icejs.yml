  - https://ice.work (answers 404 with a page that refreshes to https://v3.ice.work)
notes: >
  The site is in Chinese; the quotes are the Chinese text as published. The root domain ice.work answers 404 and refreshes to v3.ice.work, so v3.ice.work is recorded as the homepage; the npm homepage field names it too. The install docs name create-ice (npm create ice), a scaffolder; the registry figures are for its core package @ice/app, which the docs import defineConfig from. The GitHub latest release is v3.6.2 dated 2025-06-30 while the npm latest tag is 3.6.5 dated 2025-07-24; the npm date is recorded. The "基于 React" statement in README and site are the only basedOn evidence. The docs describe SSR as a Node.js program that renders HTML on the server; no process model (per-request or always-on) is stated, so runsAs stays at static. ice.work and its /docs paths answer 404, so no other path of the old domain serves the docs. The repository is a monorepo, so the GitHub stars are for the whole repository. The GitHub repository was created in 2016; no first-release year is stated on the pages read.
