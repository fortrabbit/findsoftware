notes: >
  The homepage coisas.fiatjaf.com answers 200 with an empty application shell (a root element and bundle.js), so no page text was read from it; the homepage value is the address the README sends users to. The repository has no GitHub release and no tag, so currentMajor, firstRelease and latestReleaseDate are unknown, and lastCommitDate is the committer date of the newest commit on master. The README calls the project a headless CMS; the GitHub description calls it a client-side CMS for editing GitHub Markdown files, but no README sentence states where it runs, so runsAs holds only static, from the README's static server remark. The previews in the README are an edit and a preview view toggled by buttons, not a live preview of the site, so livePreview is not recorded. The README says a static server is needed, recommends HTTPS for the service worker, and says it can be embedded in a site's own admin section. The runtime is not stated in the pages read; the README names npm for the build. The personal site fiatjaf.com is not the project's site and is not recorded.
