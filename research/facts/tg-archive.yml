notes: >
  Discontinued on the project's own README statement "I'm no longer actively maintaining or developing this tool." The README adds that the maintainer can still review and merge small, documented PRs; that is recorded here as stated and does not change the status. The last push to the default branch is dated 2026-03-01 and the newest PyPI release is 1.3.1 (2026-01-26); the latest GitHub release is v1.3.0 (2025-05-01), and the tag v1.3.1 has no GitHub release, so latestReleaseDate follows PyPI as the newest stable release. The PyPI JSON reports -1 for downloads, so pypiDownloads comes from pypistats.org. The first PyPI upload is 0.3.0 (2021-03-22); the oldest GitHub release is v0.2.0 with a 2025 publish date that does not reflect the first release, so firstRelease uses PyPI. The install step needs Telegram API credentials for a user account (not the Bot API), and the sync writes a session file that the README says must not be shared; both are README statements and not recorded as fields. The README's "tested with Python 3.13.2" is a test statement, not a minimum, so runtimeMin is not recorded. No homepage or docs site is named; the README is the only documentation page read. The GitHub owner is a user account (knadh), and the copyright line names Kailash Nadh.
