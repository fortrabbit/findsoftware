notes: >
  Scope call for the reviewer: the CSV row was boundary as a generic SSH task runner and moved to accepted in the 2026-10-19 scope pass; the project describes a library for remote execution and deployment, so criterion 1 rests on its deployment wording. It builds on Invoke and Paramiko ("It builds on top of Invoke ... and Paramiko"), which are dependencies and not records, so no basedOn is recorded; the setup.py install_requires lists invoke, paramiko, decorator and deprecated. The setup.py field is written python_requres (misspelled), so the >=3.6 value is not enforced by the installer and no runtimeMin is recorded; PyPI reports no requires_python. The project's own homepage text still says "Python (2.7, 3.4+)", which is out of date against the 3.2.3 manifest, and the record uses the manifest. The repository has no GitHub releases; PyPI carries the releases, and the repository tags run to 3.2.3. The PyPI 0.0.1 upload (2008-01-13) is the first release. The installing page says a separate fabric2 PyPI entry exists for migrating users and that fabric3 is an unauthorized fork; neither is recorded. The PyPI project URLs, which come from the package's setup.py, list the Twitter account https://twitter.com/pyfabric; it is recorded as x. The pypistats figure is the last-month count of the fabric package and is not a weekly figure.
