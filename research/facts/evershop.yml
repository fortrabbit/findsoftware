notes: The README says the company is "scaling our operations and building EverShop Cloud" and the homepage says EverShop cloud solutions are coming soon; no hosted plan or price is on the pages read, so no pricingPage or hosting field is recorded. The maintainer is the package.json author "The Nguyen"; the GitHub organization evershopcommerce owns the repository and no legal entity is stated on the pages read, so hqCountry is unknown. The npm package @evershop/evershop is the core package the installation guide names. Its first upload is a 1.0.0-beta of 2022 and the first GitHub tags are release candidates, so firstRelease follows the oldest stable release, v1.0.0 of 2024-01-07. The latest stable release is v2.3.0 (2026-10-08) and its npm upload matches. The docs list the core modules (catalog, checkout, customer, orders, promotions, CMS pages, page builder, blog, tax) and Stripe, PayPal and cash on delivery as built-in payment modules; they also document webhooks, cron jobs and an event system. The docs say the public Docker image is for a local environment only, that migrations run on every start, and that the additional storefront languages setting is only reachable through the settings API in 2.2.1. The Docker row of the starter list is recorded as docker.
