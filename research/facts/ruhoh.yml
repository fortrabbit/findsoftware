notes: >
  The homepage http://ruhoh.com, linked by the GitHub repository and the gem, does not serve the project: both the http and https addresses redirect to a third-party domain (xavola.id) that shows the text "This website is not available" for a hosting account, so no homepage is recorded and the status is stub under AGENTS.md. The README points its usage and quick start at that homepage; the repository README and the gemspec are the only install sources that remain, and they state the Gemfile entry. There are no GitHub releases, only tags; the highest stable tag is v2.6 (2013-12-13), which matches the gem 2.6. The README states official support for ruby 1.9.2, 1.9.3 and 2.0.0 only, so no runtimeMin is recorded. The gemspec names Jade Dominguez as author; the GitHub owner is the ruhoh organization. The first gem version is 0.0.2 (2012-03-07) from the RubyGems version list. The gem's license field is the MIT URL; the repository has no LICENSE file at its root.
