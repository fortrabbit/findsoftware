notes: >
  Stub: no page of the project says how to install grant itself. The README names the npm package only in a badge link and shows require('grant') in code; examples/README.md says "$ npm install" in a code block to start the example app, which installs that app's dependencies, so criterion 3 (documented installation) cannot be judged. What would settle it: a sentence or page naming the install route for the grant package. The OAuth Playground at grant.outofindex.com, which the README links, answers with a JavaScript application shell that carries no readable text, so no homepage is recorded and the page is listed as unreadable. The package's runtime is Node.js from the engines field of package.json at tag v5.4.24, the manifest the install uses; the README names no runtime in prose. The README's Configuration section sets providers in a configuration object, and its Session section says Grant uses the session to persist state between the redirects of a login; it documents OAuth 1.0a, OAuth 2.0 and OpenID Connect flows. Its Callback: Response section says Grant can also request the user profile beside the tokens. The README names Express, Koa, Hapi and Fastify as HTTP frameworks and AWS Lambda, Azure Functions, Google Cloud Functions and Vercel as serverless targets; it does not say grant is built on any of them, so no basedOn is recorded. The README's provider table lists more than 200 OAuth providers by name; no field takes that list, so it is left in these notes. Grant is an OAuth client that logs users in through other providers, so sso is not recorded, and the README's OpenID Connect section is a client feature. The README warns that the querystring transport may leak private data in server logs, and that the id_token signature is not verified by default. The version 5.x line is the current major; the README's migration guide covers v4 to v5. There are no GitHub release objects; the newest stable tag is v5.4.24, which matches the npm latest version and its release time. firstRelease is 2014 from the npm upload of version 1.0.0 (2014-06-22), which predates the oldest GitHub tag 1.0.3 (2014-08-02) and the repository's creation date (2014-10-21). The npm figure counts the package grant. The maintainer is the LICENSE copyright holder; the README names none. Stars and contributors belong to the repository.
