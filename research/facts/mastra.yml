notes: >
  The npm package the install command creates is create-mastra (scaffolder); the figures are for @mastra/core, the core package, per the write-record rules, and the repository is a monorepo. Highest stable GitHub release is @mastra/core@1.79.0 (2026-10-21), matching npm latest. The repository LICENSE.md licenses most content under Apache 2.0 and the ee/ directories under the Mastra Enterprise Edition License; the license and licenseModel entries follow those statements. The mastra.ai home page describes Mastra Cloud as a deploy target next to the open source framework; no prices or cloud fields are recorded. The pricing page lists an Enterprise tier with licensed self-hosted features next to the Mastra Platform; the paidEdition entry cites it without any price. The Apache header in LICENSE.md names Kepler Software, Inc.; the ee license names Kepler Software Inc. as doing business as Mastra. The engines field of @mastra/core declares node >=22.13.0; the runtimeMin value is the Node major.
