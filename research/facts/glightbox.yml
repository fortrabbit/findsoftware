notes: >
  The homepage links the maintainer's site www.biati.digital, which answered a Cloudflare block (HTTP 403) to this research, so the legal form, address and hqCountry of the maintainer are unknown. The npm install route appears only in the bash block under Usage ("$ npm install glightbox"), and the CDN and ES module examples only in code blocks, so no npm or CDN installMethod is recorded; the one sentence naming a route is "Or manually download and link glightbox.min.js in your HTML". The runtime node value rests on the homepage sentence that the library "can be used with nodejs"; no runsAs is recorded because no sentence says where it runs. The README says GLightbox includes the Plyr player and injects the player library only when required and only when the lightbox is opened; that is no basedOn statement. Version 4.0.0 exists only as beta tags (glightbox@4.0.0-beta.8, dated 2024-03-31), older than the 3.3.1 release, so no latestPrereleaseDate is recorded. The homepage states "GLightbox is free to use for personal and commercial projects." with the MIT license; this sentence is no paidEdition. firstRelease is the tag 1.0, whose commit is dated 2017-11-28, the day the repository was created; the first npm upload is 1.0.6 (2018-06-08). The package.json author is Biati Digital. npmWeeklyDownloads is the daily sum from the api.npmjs.org range endpoint for 2026-11-01 to 2026-11-07.
