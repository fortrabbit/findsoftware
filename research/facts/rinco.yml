notes: >
  The homepage field in the GitHub repository and on npm is http://rincojs.com/sg, which does not resolve (no DNS record). The official webpage named in the README, http://rincojs.github.io/rinco-sg/, answers 200 and is recorded as homepage. The GitHub release 0.1.2 (2015-09-21) is the highest stable release object, so currentMajor is 0; npm latest 0.2.3 (2016-06-17) is also major 0 and is the newest release date recorded. The README calls the template engine mustache only through the r-object section, so templating records mustache from that section; the r-tag syntax is Rinco's own and is not a field. The runtimeMin fact comes from the npm engines field (node >= 0.8.0), which is the only stated minimum. The npm weekly download figure and the star count are for the week 2026-10-12 to 2026-10-18 and the date of this read. The README names a templates folder for main pages and partials in .html and .md files, and says files whose names start with an underscore are partials that are not generated. The README documents the r-include, r-render, r-data, r-object and r-script tags that pull in partials and data files and run inline JavaScript. The r-css and r-js tags compile Sass, Less, Stylus, CoffeeScript and ES6 files in the order they appear. The rinco server command runs a development server, on port 3000 by default. The README lists a CDNJS library picker (rinco add) and an uncss build variant; these are described in the README and are not fields.
