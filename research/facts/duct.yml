notes: >
  Stub: two repositories each claim part of Duct, and the project naming one current home would settle which the record follows. duct-framework/duct (the row's repository) is the old Leiningen template whose README says it has been DEPRECATED and points to duct-framework.org, and duct-framework/main (Clojars org.duct-framework/main, the entry point the docs use) has a README calling the tool experimental. The site and docs (dated 2026-08-07) describe the current Duct and are alive, so the project is not recorded as discontinued. The EPL-1.0 license statement is on the homepage and in duct-framework/main; the MIT statement is in the deprecated template. latestReleaseDate and the Clojars figure follow duct-framework/main (tag 0.4.9); stars, contributors and firstRelease (the 0.0.1 tag of 2014) follow duct-framework/duct. The row's homepage was the repository; the project's own site is duct-framework.org. The docs page does not state a runtime, so runtime is not recorded. The Clojars entry duct/core (771577 total downloads, latest 0.8.1) belongs to the deprecated core, and is not recorded as the record's figure.
