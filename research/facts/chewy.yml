notes: >
  Ruby gem for an Elasticsearch object document mapper; the README says it is built on the official elasticsearch-ruby client. That client is a separate package and has no record here, so no basedOn is recorded. The README says Chewy can be used without Rails ("ActiveSupport and the elasticsearch gem are the only hard dependencies; the Rails railtie loads conditionally"), so Rails is not recorded as basedOn even though the ActiveRecord integration exists. The README's compatibility matrix ties Chewy 8.x to Elasticsearch 8.x, and the FAQ says OpenSearch is not officially supported; no field for that exists, so it stays in notes. Elasticsearch stores the index, so contentStore and databases are not recorded. The highest stable GitHub release is v8.4.1 (2026-06-19), which matches the gem version on RubyGems. The v8.0.0-beta tag carries no prerelease flag but is a beta by name, so it is not counted. The first upload on RubyGems is 0.0.1 (2013-12-11), which is older than the first GitHub release, so firstRelease is 2013. The RubyGems download figure is the total for the gem named chewy, which the install docs name. The license is MIT in the GitHub API, the RubyGems metadata and LICENSE.txt. The copyright holder Toptal, LLC is the maintainer; the toptal.com pages return 403 to the research client, so no hqCountry is recorded and the legal form comes from the LICENSE copyright line.
