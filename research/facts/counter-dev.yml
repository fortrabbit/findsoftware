notes: >
  The repository has no tag or GitHub release, so the record is judged by lastCommitDate (committer date of the newest commit on master, 2026-09-04) and no release fields are recorded. The first commit date is 2020 (repository created 2020-05-10). The main repository holds the hosted service's code and the self-host route is a separate repository, ihucos/counter.dev-selfhost, which the main README links for self-hosting; its README calls the self-hosted version beta, and its three releases (0.1, 0.2, 0.2.1, 2023) are all marked prerelease on GitHub, so no stable release exists in either repository. The self-host README says archiving is not implemented in the self-hosted version. Its download link spells the repository "counter.dev-selfhosted"; the repository read is counter.dev-selfhost. The install route is recorded from that README; a local development route (make devserver with a local Redis) is in the main README and is not a deployment route. The tracking code is given to a site after sign-up (welcome page: "Tracking code is shown after sign up."); the repository's docs/script.js is the tracking script served from counter.dev and reads a data-id attribute (default server https://t.counter.dev), so the attachment is a script tag, recorded here and not as a field. The main README names a SQL database for archiving older data without naming the engine, so databases records only Redis. The main README has two struck-through paragraphs (a fetched script hosted externally, tracking every page); they are not recorded. Privacy claims from the homepage ("No Cookies. No logging. No IP address fingerprinting.") and the README (no per-user identifiers, aggregated data only) are kept in notes as a coined kind and not as a field. The FAQ says that under the ePrivacy Directive all SaaS web analytics, counter.dev included, needs consent; recorded here as stated by the project. The README says the real-world hosting costs are covered via donations; no donation page is recorded. The maintainer is named from the README contributors list (an individual, not a company); the LICENSE file is the FSF AGPL text with no project copyright line. The README lists Ana Maria Sandoval Jimenez as a second contributor (data scientist); not recorded as maintainer. The homepage pricing is "Pay when ready"; no prices are recorded.
