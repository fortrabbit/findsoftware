notes: >
  The CSV row points at github.com/imdario/zas, which redirects to darccio/zas; the repository field records the current owner.
  The project's homepage is the maintainer's domain at dario.cat/zas, which hosts the project's own guides and states the Go requirement.
  The README describes RSS feeds and sitemap generation as native features; no field in the record set holds them, so they are not recorded.
  The homepage states the Go requirement as the current source's; the release tag may differ.
  The oldest GitHub release is v0.0.1 (2016-03-11).
  The maintainer is recorded as the name in the footer of the project's guide pages; the AGPL text carries no copyright line. The homepage states AGPL-3.0 or any later version, the GitHub license field and the LICENSE text state AGPL-3.0.
