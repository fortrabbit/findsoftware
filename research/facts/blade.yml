notes: >
  The repository's default branch is v2.1.3, pushed 2026-05-15, but the highest stable release is 2.1.2.RELEASE (2022-05-09); no 2.1.3 release exists, so currentMajor is 2 and latestReleaseDate is 2022-05-09. Four years have passed since that release, so the import will judge the listing from the release age. The Maven Central blade-core metadata matches the GitHub release, latest 2.1.2.RELEASE. The earliest tag is 2.0.0, committed 2017-06-25, and the repository was created in 2015; firstRelease is 2017. The homepage lets-blade.github.io is the project's own site in Chinese, with the English pages under /en; the Chinese guide under /docs is recorded as docs and the English FAQ under /en is not. The README says the project is based on Java 8 and Netty 4, recorded as basedOn Netty, which is not a record in this register. The pom.xml developer is hellokaton, the maintainer named by the project; the README and the homepage link Biezhi's social accounts, which are not recorded as maintainer. The templates guide states a built-in simple template engine and a Jetbrick Template wrapper, recorded as templating.
