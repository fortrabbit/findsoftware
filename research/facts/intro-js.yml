notes: >
  The homepage link in the repository is http://introjs.com; that address redirects to https://introjs.com/, which is recorded. The maintainer follows the LICENSE copyright line in license.md, which names Afshin Mehrabani; the project site's footer reads "© 2026 Usablica", which is the organization that owns the repository. The license is stated two ways: license.md names the GNU Affero General Public License and then adds a commercial license for commercial applications, themes or plugins, and the homepage says the code is "published under AGPL license". GitHub reports the repository license as Other (NOASSERTION) because of the commercial note, and the npm package declares AGPL-3.0; both are recorded as the source words them. The commercial tiers on the pricing section (one project, five projects, unlimited projects, with support periods and custom themes) differ in project count and support and not in features, and the open source tier lists all features, so no paidEdition is recorded. The homepage says "Trusted by 5000+ teams"; teams are not sites or installs, so reportedInstalls is not recorded. The README says tours run entirely in the app and does not state a browser runtime, so no runsAs is recorded. The install page offers a git clone route and says the project does not recommend downloading directly from GitHub, so no git installMethod is recorded. The wrappers for React, Angular, Ember, Rails, WordPress and others are listed on the docs site and are integrations, not basedOn. The forum link is the project's Stack Overflow tag, which the README lists under "Support and discussion". The GitHub repository has 57 tags; the oldest is v0.1.0, dated 2013-03-15, which is older than the 2014 npm upload.
