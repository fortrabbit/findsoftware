notes: >
  The repository has no GitHub release or tag and no registry package, so no version, release date or firstRelease is recorded, and lastCommitDate is the committer date of the newest commit on main. The project's own site at the GitHub Pages address answers and describes the same software, so it is the homepage. The README says Jinja2 templating is under development and the Jinja templates are coming soon, so no templating value is recorded. The plugin placeholders are written as <% name %> in the Markdown files, and plugins are Python modules with a main.py and a run method. The pyproject version 0.1.0 is not a release. The GitHub description says the project is built on Python 3.9 and the pyproject caret gives ^3.9. The organization profile names no legal details, so the maintainer is the copyright holder named in the MIT license.
