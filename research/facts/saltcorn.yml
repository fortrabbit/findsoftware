notes: >
  Accepted under criterion 1: the builder is used to build web and mobile database applications (https://github.com/saltcorn/saltcorn), and the JSON API lets an app read and write its tables (https://wiki.saltcorn.com/view/ShowPage/api). The CSV listed app-builder as a category; no import mapping exists for it, so only low-code is recorded. There is no GitHub release: the newest stable tag is v1.6.2, the npm latest for @saltcorn/cli is 1.6.2 on 2026-08-05, and the stable major is 1. The newest prerelease is v1.7.0-beta.3 (tag commit and npm time 2026-10-08); a v1.7.0-alpha.0 tag is also present. The oldest tag is v0.0.1, committed 2020-05-23, so firstRelease is 2020. Runtime requirement conflict for review: the README asks for "node.js 20+", the install page for Node 20 to 24, while the CLI manifest at the latest tag declares "node": ">=18.0.0"; runtimeMin records the manifest value. The package root is named saltcorn-monorepo; the install docs name @saltcorn/cli, so the npm figures are for that package. Maintainer: the LICENSE copyright line names Tom Nielsen; the GitHub organization is saltcorn, and its profile lists a London location, which is not a page naming a country and is not recorded as hqCountry. The homepage lists a Discord invitation (https://discord.gg/cbrTB8bp6e) and a Twitter account (https://twitter.com/saltcorns) in the Resources list, and a second Discord invitation (https://discord.gg/JnnV8K3fA3) and Twitter account (https://twitter.com/saltcorn_db) in the footer icons; the reviewer decides which pair is the project official one, and the Resources pair is recorded. The homepage links LinkedIn (https://www.linkedin.com/company/saltcorn), kept in notes. The module store page (https://wiki.saltcorn.com/view/ShowPage/module-store) describes plugins, themes and packs installed from an in-app store. The wiki states ten UI locales (en, fr, de, da, es, no, sv, ru, nl, pt), machine-translated except two. Identity: the wiki lists external identity-provider plugins (Twitter, GitHub, Google, LDAP, generic OAuth 2.0 provider); sso records OAuth 2.0, whose quote names it (LDAP is listed beside it as a list item), delivered as a plugin that work on single-tenant installs and root tenants only. The wiki's module store page names no directory URL. Free hosting: the README says the saltcorn.com service "is free, but there are no guarantees about the security or availability of your application", kept in notes as a coined value. Desktop trial and the docker-compose quickstart are local tryouts, not runsAs statements. Dependencies named in the README (node-postgres, express, Blockly, CodeMirror, craft.js) are no basedOn statement.
