notes: >
  The homepage zoxjs.com in the candidate row does not resolve (NXDOMAIN over HTTP and HTTPS, checked 2026-10-23), so the status fact has no quote, so the record is a stub without homepage under the dead-homepage rule; the README's only pointer to docs is that site, so no docs URL is recorded. The project has no GitHub releases or tags; firstRelease, currentMajor and latestReleaseDate come from the npm registry (version 1.1.2 is npm latest, first version 1.0.0 published 2018-07-05, the GitHub repository was created the same day). The repository was last pushed 2022-01-15 and is not archived; no deprecation is set on the npm package. The README shows no statement of runsAs; controllers "send the HTTP response" but no page states a long-running process, so runsAs is left unknown. The repository's own README mentions zox-plugins, zox-react, zox-graphql-ws and zox-handlebars as separate npm packages; they are not recorded as the install package. The npm weekly figure (week 2026-10-12 to 2026-10-18) is the zox package, the package the README's first install line names. The npm maintainer and package author are listed as Zoran Ravic, matching the LICENCE line.
