notes: >
  No project site: the repository's homepage field is empty and the README names none, so homepage is not recorded. Maintainer is Neil Jenkins as the LICENSE copyright line names him (2011–2023); the fastmail GitHub organization owns the repository, but no page names it as maintainer, so it is not recorded as one. No hqCountry: the maintainer is an individual and no page gives a country. The repository has no GitHub release object; its tags end at v1.9.0 (tag commit dated 2018-10-14) while the npm package squire-rte is at 2.x, published from the same repository, and its registry repository field still names neilj/Squire, the earlier location. Because the registry major is higher, currentMajor and latestReleaseDate follow npm, as the import rules require. firstRelease is 2014 from the v1.0.0 tag object (tagger date 2014-12-15), older than the first npm upload (2015). Runtime and runsAs are left out: the README says Squire "supports all reasonably recent browsers" and can be inserted in place of a textarea, but no sentence says it runs in the browser, so a reviewer may add runsAs browser. The README says Squire was designed to handle email composition for the Fastmail web app, that it must handle arbitrary HTML because the HTML remains the source of truth, and that it provides no toolbar, widgets or overlays, so the application builds its own UI. It says developers MUST provide a method to convert raw HTML safely into DOM nodes: Squire integrates with DOMPurify when the page has it, and otherwise needs a custom sanitizeToDOMFragment function. The README names production users (ProtonMail, SnappyMail, StartMail, Tutanota, Zoho Mail, Superhuman, Teamwork Desk, Google Earth) without any count, so reportedInstalls is not recorded. The README names no alternative editors; it says Squire differs from most other modern rich text editors without naming them.
