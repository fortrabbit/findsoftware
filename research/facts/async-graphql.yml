notes: >
  The repository has no GitHub releases, and its tags stop at v7.0.13 while crates.io publishes 7.2.1 (2026-01-20) with no matching tag; latestReleaseDate and currentMajor come from crates.io, which states the same major as the tags. Prerelease 8.0.0-rc.5 (2026-04-21) is the newest line on crates.io and the repository's Cargo.toml version. firstRelease is the year of crate version 0.5.0 (2020-03-03), the oldest upload. The book's quickstart and integration block still show async-graphql = "4.0"; the install line is quoted as the page states it, and the current crate is 7.x. The README says the minimum supported Rust version is 1.86.0, while the crate manifest (rust-version 1.89.0 on crates.io for the latest release) gives 1.89; both are recorded as runtimeMin entries. The root https://async-graphql.github.io/ answers with a meta refresh to the book, so homepage is the book's final URL. The README names Poem, Actix-web, Warp, Rocket and Axum integrations as crates glued to a web server; they are not basedOn, because the project does not call itself a binding of any of them. The book's introduction names Juniper as the library the author used before, with the reason it was left; no record exists, so alternativeTo is absent. The README's feature list names WebSocket subscriptions, multipart uploads and Apollo Federation v2; they are not fields. Maintainer is the first Cargo.toml authors entry "sunli"; a second author, Koxiaet, is listed and the manifest's contact address is not recorded. Dual license "MIT OR Apache-2.0" is stated once in the README and the crate metadata, so it is one entry. The repository's contributors endpoint reports 254 pages at one per page, read from the rel="last" link.
