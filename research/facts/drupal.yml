notes: >
  The repository field is the GitHub mirror, which states it mirrors git.drupal.org; the mirror has no GitHub releases and its contributor list does not reflect authorship, so contributors is left out. reportedInstalls is the sum of drupal.org's weekly project_usage per branch for Drupal core (sites that report via the Update module), coined here. pluginCount counts full module projects of any status on drupal.org, including unsupported ones. distributions is coined for the two documented starting points, Drupal CMS and Drupal core. The Drupal Association is a non-profit; its location was not stated on its page, so hqCountry stays out. Docker Hub's "drupal" image is a Docker Official Image, not published by the project.
