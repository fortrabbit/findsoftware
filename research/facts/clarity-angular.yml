notes: >
  The Angular edition of Clarity; Clarity Core is its own candidate (the clarity row). Both sites answer 200 with a JavaScript shell (a title and a meta description, no page text); the homepage comes from the repository's homepage field and the docs link from the README; the docs themselves were not read. The root package.json engines (Node 24, npm 11) are the project's own build environment, not a requirement of a user's site, so runtime and runtimeMin are not recorded. The install page names @clr/ui and @clr/angular; npmName is @clr/angular, the Angular package, and the npm figures count only it. The npm history under the @clr scope starts with 0.11.0-alpha.1 (2017-12-15), earlier than the oldest GitHub release (v12.0.0, 2022), so firstRelease is 2017. The README and LICENSE state two licenses: MIT for the project, and the SIL Open Font License 1.1 for the fonts; both are recorded as their own entries. The LICENSE copyright names Broadcom; the HQ country of Broadcom Inc. is not in any source read. The HTTP Archive technology named "Clarity" is Microsoft Clarity analytics, not this project, so httpArchiveSites is not recorded. The latest GitHub release v18.4.0 is stable; the repository is not archived and was last pushed 2026-10-27.
