notes: >
  Maintainer is the copyright holder in LICENSE; the npm author field gives the same name. The README describes a component model based on plain objects and pure functions that uses the Web Components API under the hood, with a global store, an app-like router, a layout engine, localization, and hot module replacement. The README lists a Gitter channel (gitter.im/hybridsjs/hybrids) for help; no field takes it, so it is not recorded. The docs describe client-side apps only and name no server rendering mode, database or server run model. The README describes the project as a JavaScript framework; the categories follow those words. Releases: GitHub v9.2.1 is the highest stable release (2026-09-26), and npm hybrids 9.2.1 was published one day earlier, so the GitHub date is used. The first npm upload is 0.0.0 on 2016-09-28, earlier than the GitHub repository creation on 2016-12-06. The download figure is the sum of the daily counts for 2026-10-18 to 2026-10-24. Contributors is the page number of the rel="last" link with per_page=1.
