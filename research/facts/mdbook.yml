notes: >
  The highest stable GitHub release is v0.5.4 (2026-07-06), so currentMajor is 0. The oldest release is v0.0.1 (2015-08-11), which gives firstRelease 2015. The crates.io figure crateDownloads is the all-time total from the crates.io API, not a period figure; recent_downloads is not recorded. The install page says mdBook currently requires at least Rust version 1.88, which applies to building from source with cargo and is not recorded as runtimeMin, because the released binary has no runtime requirement the page states. The organization name comes from the GitHub organization API, as the repository's owner; the LICENSE file carries no copyright line. The mdbook serve command is the local development server; the creating page describes it as a local webserver, which is why runsAs also lists local. The rust-lang/mdBook repository's default branch is main; the guide's source link points at master. The preprocessors page points to the Third Party Plugins wiki page as the list of community preprocessors; the wiki is recorded as pluginDirectory, and its entries are not counted. The maintainer value is the display name of the rust-lang GitHub organization that owns the repository: no project page names a maintainer, and the homepage only says the Rust project uses mdBook.
