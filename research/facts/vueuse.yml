notes: >
  The homepage says "SSR Friendly" and "Works perfectly with server-side rendering/generation"; that is compatibility, so no renderingModes and no runsAs are recorded. The homepage and README say no bundler is required, which is the script tag route. The install guide names the Nuxt module as a separate install path; it is the same repository's @vueuse/nuxt package, not a route for @vueuse/core, so it is not a second installMethod. The add-ons (Electron, Firebase, Head, Integrations, RxJS and Router) are packages of the same monorepo, and the Add-ons section is a feature list. The homepage nav links a discord icon to chat.antfu.me and a bluesky icon to the vueuse.org profile. The homepage says each function comes with an interactive demo in the documentation. The homepage counts its functions in its feature list and the documentation shows them grouped by category; the count changes over time and is not recorded. The README states "From v12.0, VueUse no longer supports Vue 2. Please use v11.x for Vue 2 support." The repository is a monorepo: stars and contributors belong to it, and the npm figure is for @vueuse/core, the package the install guide names. The LICENSE copyright line names Anthony Fu; the homepage footer names Anthony Fu and VueUse contributors. The v15.0.0 release is dated 2026-09-16 on both GitHub and npm. The earliest upload of @vueuse/core is a 0.0.2-beta.1 prerelease from 2019-12-24, which sets firstRelease, prereleases included.
