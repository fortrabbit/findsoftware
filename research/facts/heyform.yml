notes: >
  Criterion 1: the embed script puts a form on any web page (docs page "Embed your form": "Easily embed a HeyForm on any webpage"), so it is accepted under the embedding rule. Maintainer: the terms page calls HeyForm a product of EarlyBird, Inc. with a Sheridan, Wyoming address, and the privacy policy says "We, EarlyBird, Inc. built HeyForm". The hosted service (my.heyform.net) and its plans (Basic, Premium, Business, Enterprise) are hosted offerings, so no paidEdition is written; the terms page mentions a HeyForm Enterprise Terms of Use that this pass did not find on a public page. The self-hosting page names MongoDB and KeyDB; KeyDB is a Redis-compatible store that the compose file reaches through REDIS_HOST. The environment variable page lists S3-compatible storage for uploads. The webhook docs say a submission is sent to the creator's URL as JSON by POST. Embed types (standard, modal, popup, full page) and the webhook are wiring, recorded here because no field fits. LinkedIn (linkedin is a coined field): https://www.linkedin.com/company/heyform/. Docker Hub counts the community-edition image at 243191 pulls on 2026-11-03. The default branch is next. Sign-in with Google and Apple is available on self-hosted instances (authentication page). The embed code loads the @heyform-inc/embed script from unpkg. The 3.0.0 series lists alpha and release candidate releases before the stable line; prereleases are not recorded. The self-hosting guide's compose example runs three services: the HeyForm server, MongoDB and KeyDB. The license page asks a commercial fork to publish its modifications and to link to the original project (https://heyform.net) and to the fork's own repository. Node is the server runtime per the README structure; runtimeMin is left out because the image ships the runtime and the engine requirement is a build requirement.
