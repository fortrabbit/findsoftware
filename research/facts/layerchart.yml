notes: >
  The docs site is a client-rendered shell: its HTML holds only navigation and the text "Loading...", so the docs field is the /docs link from the homepage navigation and the getting-started source in the repository (docs/src/routes/docs/getting-started/+page.md) is cited for the install route. The repository is a monorepo: packages/layerchart holds the npm package, and the docs, examples and the Svelte UX companion live beside it, so stars and contributors belong to the monorepo and the npm figure is the layerchart package named by the install steps. The homepage and README describe the project as composable Svelte components; the 2.0.0 release notes say the library is rebuilt on Svelte 5, and packages/layerchart/package.json names svelte ^5.57.0 as a dependency, so Svelte 5 is a requirement in notes only. The 2.0 release notes also say the library no longer requires Tailwind CSS. The firstRelease year comes from the npm upload 0.0.1 on 2021-08-12, the day the repository was created; the first GitHub release is 0.26.1 from 2023-11-22, so the GitHub release list is not the first date. The release list reaches back to 1.0.x and 0.x lines, and the highest stable release is layerchart@2.10.1, so currentMajor is 2. The newest prerelease, layerchart@2.0.0-next.66 from 2026-07-01, is older than the latest stable release and is not recorded as latestPrereleaseDate. The README names the companion library Svelte UX for a larger set of components, actions and stores; no alternativeTo or basedOn follows from that sentence. The Bluesky link is the one in the README badge and the homepage, pointing to the maintainer's profile at techniq.dev; it is recorded without a quote as a link fact. The README lists cartesian, radial and polar, hierarchical, graph, geo and calendar charts; the features page in the repository adds tooltips, brushing and pan and zoom, and says charts use Svg, Canvas and Html layers. The Discord invitation is named "LayerStack Discord community" in the README image alt text, the project's earlier name. The server-side image guide says rendering to PNG or JPEG needs a native Node.js canvas library, which is an optional feature of the library and not a runtime requirement, so no runtime is recorded.
