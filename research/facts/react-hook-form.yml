notes: >
  Library for form state in React; no page states where it runs, so no runtime or runsAs is recorded. The README and get-started page say it works with React Native too ("Build with React Native"), which is not recorded as a runtime. The homepage and get-started page both say "Released under the MIT License." The license is one entry: the LICENSE file and the homepage state the same MIT license. The v8 line is in beta: the GitHub release v8.0.0-beta.5 (published 2026-10-23) is older than the stable v7.92.0 (published 2026-11-11), so no latestPrereleaseDate is recorded under the rule for prereleases published before the stable release; the homepage navigation links "Migrate to v8 (beta)". Stars, contributors and releases are the repository's own figures. The FAQ answers "How does React Hook Form differ from Formik and Redux Form?" with a comparison table: React Hook Form is "Uncontrolled by default; controlled too" with a hooks API, Formik uses controlled React state, Redux Form keeps controlled state in Redux; formik and redux-form are recorded in alternativeTo. The about page names Beier(Bill) Luo under Maintainers, matching the LICENSE line. The homepage links a newsletter archive (resources/newsletters) that lists third-party newsletters, so no newsletter is recorded. The npm weekly figure is the sum of the seven daily counts from the downloads API for 2026-11-01 to 2026-11-07. The discord and x links are homepage links; the README badge names Discord too. Vercel hosts the documentation site; that is not a hosted offering of the library.
