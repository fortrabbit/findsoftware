notes: >
  Twill is a package installed into a Laravel app, not a standalone CMS; the boundary between CMS and admin-panel toolkit may matter for categories. Coined buildRuntimeMin (Node version needed to build admin assets), attributionRequired (license-mandated credit in the UI), paidSupport and demo. The docs list Laravel 9 to 11 as compatible while the latest composer.json accepts Laravel 9 to 13. The homepage lists Twitter and other social accounts but the read gave no URLs. AREA 17's about page names no country.
