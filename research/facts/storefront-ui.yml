notes: >
  The storefrontui.io domain answers 200 after a redirect to alokai.com/product/storefront-ui, so that page is the homepage; the reviewer decides whether a vendor product page counts as the project's own site. The docs at docs.storefrontui.io are a client-rendered shell; the install commands are read from the docs source in apps/docs of the v2-develop branch, the default branch. The docs site says "Vue Storefront is now Alokai!", so the maintainer is Alokai and the legal name comes from the Alokai privacy policy; the LICENSE reads "Copyright (c) 2024 Alokai". The record is a monorepo: the npm figure, the currentMajor and the latestReleaseDate are for @storefront-ui/vue (the package the README badge names). The React package @storefront-ui/react is at major 4 and has its own figures, about 2475 weekly downloads, not recorded. The project describes itself as built for ecommerce storefronts; the e-commerce use is recorded here and in prose, not as a category, because the software is a UI library. Blocks are copy-pasteable elements on the product page; no criterion for them is recorded. The company LinkedIn and YouTube links on the Alokai product page belong to the company and are not recorded.
