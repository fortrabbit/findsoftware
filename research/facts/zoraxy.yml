notes: >
  Status: GitHub marks the release candidates as ordinary releases and its releases/latest endpoint returns v3.3.5-rc4, so the highest stable release is v3.3.4 (2026-08-22) and rc4 (2026-10-22) is latestPrereleaseDate; the tags with rc in their names are not stable. The first GitHub release is the 2.2 prerelease of 2023-05-04. The homepage says "This site is currently under development. Some information might not be ready." The docs are the GitHub wiki: its Getting Started page was read, and its Linux systemd step is the always-on statement. The README links a third-party tutorial for setup, which is not a primary source. Maintainer: the homepage footer reads "© Toby Chui", the README calls tobychui the primary author, and the LICENSE file is the unmodified AGPL text with no copyright holder line; the GitHub owner is a user account. No country is stated, so hqCountry stays out. Language: GitHub's detected language is HTML because of the web UI; the README says the project is written in Go, so Go is recorded. Build requirement: the README says building from source needs Go 1.23 or higher; the runtime is a compiled binary, so no runtimeMin is recorded. Docker: the docker folder README names the image zoraxydocker/zoraxy on Docker Hub, and the pull count comes from the Docker Hub API. ACME: the README says Zoraxy has ACME features with auto-renew and DNS challenges for Let's Encrypt; it is recorded here only. Access control: forward auth (Authelia, Authentik) and OAuth2 are listed as community-contributed features; neither protocol is one of the sso values, so sso stays out. The homepage links Discord; the README has no X, Mastodon or newsletter link. The plugin repository aroz-online/zoraxy-official-plugins hosts the moved plugins, including the ztnc plugin. The homepage download section lists Linux, Windows and SBC builds. The README calls the nginx to Zoraxy config converter experimental. The wiki's Docker section tells readers without Docker networking experience not to use the Docker version. Fields coined here: none.
