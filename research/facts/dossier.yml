notes: >
  The repository is a monorepo of published packages; the record uses @dossierhq/core, the core package of the published-packages table, since the install docs name the templates dossierhq/dossier-astro-sqlite-app and dossierhq/dossier-next-sqlite-app and the npm package versions in that table are the library. The repository has no GitHub release objects and tags per package, so the version and date come from the npm registry: the latest version 0.7.21, published 2025-07-25, and the earliest version 0.1.41 published 2023-01-17. The current major is 0 under the rule for zero-major versions. The homepage says Dossier does not come with its own auth and is in active development, with some features unsupported; the getting-started page says the web interface is only available in development mode. The maintainer is the individual the homepage names, Jonas Bengtsson; the repository owner is the dossierhq organization. The docs list the templates as Astro and Next.js starters, which are not recorded as basedOn since they are templates, not parents. The runtime is not stated on the pages read.
