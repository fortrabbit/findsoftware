notes: >
  Codeberg is the only forge that carries the project; there is no GitHub mirror, so releases come from the Codeberg API. The Codeberg API shows 356 stars at the time of reading; no star field exists for forges other than GitHub, so the figure is not recorded, and its contributors endpoint answers 404, so contributors is not counted. The highest stable release is 7.3.6 (2025-10-08, confirmed by the project's release post), which is on the 7.3 line; the minor line is not a field. The homepage calls Redict a fork of Redis OSS 7.2.4. firstRelease 2024 is the year of the release post announcing 7.3.0 as the first stable version (2024-04-03). The license page says changes made by Redict are LGPL-3.0-only on top of the Redis OSS 7.2.4 source, which is BSD-3-Clause, so both statements are recorded; the LICENSES folder also holds LGPL-3.0-or-later.txt, but the license page explains why only LGPL-3.0-only applies. The community page names Matrix and IRC chat and a mailing list, which have no field. The maintainer is named only as "the Redict project"; no legal entity or country is stated. The docker route is the project's own registry, registry.redict.io, not Docker Hub, so no dockerPulls figure exists. Fields coined here: none.
