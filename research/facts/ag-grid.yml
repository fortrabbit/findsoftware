notes: >
  Monorepo: the stars and the 150 contributors belong to ag-grid/ag-grid, which also holds the React, Angular and Vue binding packages (ag-grid-react, ag-grid-angular, ag-grid-vue3) and the AG Charts section; the bindings are notes, not basedOn, because the README says the grid 'comes with support for React, Angular and Vue' through those packages, and the homepage FAQ points other frameworks to community integrations. The README says 'Founded in 2016'; the oldest GitHub release (1.0) is dated 2015-01-25 and the footer reads © AG Grid Ltd 2015-2026. The installation page gives npm packages and jsDelivr script tags for both ag-grid-community and ag-grid-enterprise, and a direct download of each from GitHub. The npm figure is ag-grid-community, the package the install docs name; ag-grid-enterprise had 2344094 downloads in the same window and is not recorded as a field. The npm weekly window covers 2026-10-26 to 2026-11-01. The CSV's 2.0M a week figure came from the stale point endpoint. The GitHub API reports the license as NOASSERTION because the repository holds one LICENSE.txt that names per-package licenses; the two license entries come from the README and the pricing page. The pricing page says the Community edition is "free and open source under the MIT licence, including for production use", which agrees with the MIT entry. The CSV homepage is plain http; the https site answers 200 and is recorded. The footer states "registered in England & Wales" and a registered address in London, so hqCountry is GB. The default branch is latest, and the release tags begin with release-. The earliest GitHub release is the tag 1.0 from 2015-01-25. The runsAs value is not recorded: no page sentence says the grid runs in the browser, only that it is available from npm or a CDN. The "Supported Browsers" table on the compatibility page is not a runs-in-the-browser statement. Price figures on the pages are not recorded.
