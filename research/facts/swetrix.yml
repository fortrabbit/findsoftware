notes: >
  The CSV row dates tracker-node@3.5.0 (2026-09-26), a sub-package. The GitHub latest release is that sub-package, so latestReleaseDate and currentMajor follow the main application tag v5.4.1 (2026-08-04). The pricing page prints the Standard price with a struck-through figure, so only the text that remains is quoted. The licenseModel open-core follows from the Community Edition statement and the hosted plans. The swetrix.com homepage gives the Google Analytics import as a plan feature only, so importsFrom is not recorded. The Node.js minimum comes from backend/package.json at v5.4.1, the main application tag.
