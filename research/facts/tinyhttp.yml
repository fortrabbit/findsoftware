notes: >
  The highest stable release of the package @tinyhttp/app is 3.0.13, which the npm latest tag also names; the repository is a monorepo with tags per package, so only @tinyhttp/app tags count. The docs disagree on the Node.js minimum: the README says "Node.js 16+ is required" and the @tinyhttp/app npm engines field says >=16.10.0, while the getting-started page says "Node.js 14.21.3 or newer" (the root package.json engines also says >=14.21.3). runtimeMin is 16, from the package the install docs name. The docs text comes from the tinyhttp/website repository, because the quote check cannot read quotes on the rendered site. The getting-started page lists differences from Express: no static server and no body parser, to be added as external middleware. The advanced page describes deploying to a serverless platform, a VPS, or anything with a Node.js runtime, behind a reverse proxy and a process manager. The docs site notes it is "Forked from viem docs"; that is the docs theme and not a software relationship, so it is not recorded. The LICENSE copyright line names "v 1 r t l" and the GitHub owner is the organization tinyhttp; the maintainer value follows the license line. The homepage lists projects that use tinyhttp; those are not recorded.
