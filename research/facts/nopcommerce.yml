notes: >
  The homepage and the docs site answer 403 with a bot challenge, so the homepage and docs facts cite the README and the docs source repository on GitHub (nopSolutions/nopCommerce-Docs, default branch master), which hold the same text. The license is NOASSERTION on GitHub; the LICENSE.md is three statements and each is recorded as its own entry: the nopCommerce Public License 4.0 (an AGPL v3.0 base with a "powered by nopCommerce" requirement on every user interface screen), and a Commercial License for embedding in proprietary applications. A paid commercial license is a license, not an edition with features, so paidEdition stays unknown; the pricing and licensing pages could not be read. The version figures come from GitHub releases: release-4.90.8 (2026-09-04) is the highest stable, and release-5.00.0-beta (2026-09-30) is the newest prerelease. The develop branch README says the product "runs on .NET 10" and its global.json pins SDK 10.0.401, but the stable 4.90 system requirements name .NET 9, so runtimeMin follows the 4.90 docs; the develop branch is ahead of the current stable line. firstRelease is absent: the oldest GitHub tag (release-1.70, 2010-07-06) is a repository import and the GitHub release entries were published in 2016, after the fact. The README says the product has been developed since 2008, which is a development date, not a release, and the nopcommerce.com release notes answer 403. The maintainer is the <Company> value in Nop.Web.csproj. The Web API is a plugin per the README, and the docs describe it as a RESTful API, so headlessApi is recorded as the docs state it. Other facts the README gives (MFA, async methods, web farms, Azure support) fit no field and are not recorded. The docs define the storefront and admin area only as a catalog frontend and an administration backend, so adminUi is recorded with that wording.
