notes: >
  The homepage https://www.cludo.com answers with a 301 to https://cludo.com, so the apex is recorded as the homepage. The CSV row lists no repository: the GitHub organization cludo holds only a private docs repository, which is not product source, so no repository is recorded. No SDK repository is named on the pages read, and none is recorded. The FAQ states "No server-side installations required – Cludo is cloud-based", so no self-host option is recorded. AI Chat, AI Summary and AI Mode are premium add-ons with separate pricing (FAQ: "AI features (AI Chat, AI Summary, AI Mode) are premium add-ons with separate pricing."); hosted plan tiers and add-ons are no paidEdition, and prices are not recorded. Two legal entities appear: Cludo ApS (Denmark, Danish law for the EU terms) and Cludo Inc. (Delaware, Minnesota law for North America); maintainer and hqCountry follow the Danish entity named as HQ on the about page. The about page says Cludo was founded in 2015 in Copenhagen; no software release is dated from it, so firstRelease stays out. The homepage links LinkedIn and YouTube only; no field exists for either, and no X, Bluesky, Mastodon or Discord link appears. The pre-built WordPress and Drupal plugins named in the FAQ are not recorded as pluginDirectory, since the pages name no directory; the documentation is an API reference built on Mintlify, and the quickstart and authentication text is rendered by script, so no install steps are recorded. The developer page states that the index is filled by pushing raw data or by a Cludo crawler, and that the REST APIs cover search and autocomplete requests; the FAQ names pre-built WordPress and Drupal plugins. Documentation pages of the Cludo API: the docs site is a JavaScript shell, and its text was read from the page payload.
