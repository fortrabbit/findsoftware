notes: >
  Boundary (CSV correction to report: the row says repo not found, but the repository exists): the CSV row gives www.tadam-framework.dev, which does not resolve (no DNS). Repository found: github.com/tadam-framework/tadam-core, linked from the homepage field of the GitHub repository and from its Clojars listing; the project's site is tadam-framework.andros.dev, which answers 200 over https and carries the install steps, so the homepage is that address and the dead www address is not recorded. The reviewer decides whether the CSV boundary is resolved; the status is accepted on the strength of the repository, the site and a Clojars artifact with recent downloads. Maintainer: the site footer states "Author: Andros Fenollosa" and the page's author meta tag agrees; the LICENSE file and README name no person, and the Clojars user is andros. The site's Flask comparison ("in someway equivalent to Flask") is the alternativeTo entry; runsAs always-on is the deployment section (a standalone jar run as a systemd service behind an Nginx reverse proxy); the x entry is the twitter.com link in the page, an icon with the alt text Twitter and no readable words, so it carries no quote. The GitHub owner is the tadam-framework organization. Requirements: the installation steps need a JDK (OpenJDK or Oracle JDK), Clojure and Leiningen. Registry: the install docs name the Leiningen template tadam-lite, which is the Clojars artifact tadam-lite/lein-template at 0.4.5; per the scaffolder rule the core package tadam-core is recorded, so downloads are the core's, and the template's download figure is not. Releases: the highest stable GitHub release is v0.4.4 (2020-10-11), and the Clojars artifact is also at 0.4.4; the template's 0.4.5 has no GitHub release. The repository tadam-website is archived (2024), and its GitHub homepage field names the same site; the site's own links point to tadam-core, not to the website repository, so the archive is not recorded as a signal, and a reviewer may decide otherwise. The repository tadam-core was last pushed in 2020. The contributors endpoint returns one page, so the count is 1. firstRelease 2020 rests on the Clojars upload of 0.3.0, dated by the Last-Modified header of its pom (2020-02-10). Templating is taken from the project.clj selmer dependency; the site describes its templates but does not name the engine.
