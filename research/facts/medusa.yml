notes: "Medusa is a commerce backend; it renders no storefront itself, and create-medusa-app optionally adds a Next.js Starter Storefront to the monorepo. The standalone repository medusajs/nextjs-starter-medusa is archived on GitHub. The repository LICENSE is MIT except Enterprise Edition materials, which need a commercial agreement with MedusaJS, Inc.; GitHub reports NOASSERTION. The pricing page lists only Medusa Cloud plans and does not state that self-hosting is free. Docker is documented for local development only. The integrations library groups npm plugins into categories without a total count. The homepage footer links Discord, X and LinkedIn without exposing URLs in the fetched text. Coined here: startCommand, hostedOffering, repoCreated."
