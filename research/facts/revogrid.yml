notes: >
  The maintainer name follows the MIT LICENSE copyright line, "Copyright (c) 2024 Revolist OU". The Pro terms and the Pro license page name the company as REVOLIST OÜ, registered in Estonia at Ruunaoja tn 3, Tallinn, so the entity is the same and the legal form with the umlaut is only in the terms; hqCountry comes from the terms page. The homepage footer says "RevoGrid is a powerful data grid library made by Revolist OU." The MIT wording appears on the homepage guide page, in the README and in the LICENSE, one license entry. The RevoGrid Pro license agreement (an annual per-developer license for the paid edition, at rv-grid.com/pro/policies/license) is not a license entry of the open library. The Pro edition adds the Pivot, Charts, Kanban, Gantt and Scheduler modules and Excel export and filtering features; the homepage lists them under "Explore modules" and names the Pro Lite and Pro Advanced plans, recorded here only as paidEdition without prices. The README says the framework wrappers (React, Angular, Svelte, Vue) are built by the continuous delivery of the same repository, and the React wrapper is installed as a separate package (@revolist/react-datagrid) that is not recorded as an install route. The homepage and the guide describe the core as a web component usable from JavaScript, TypeScript and the four frameworks, so no framework basedOn is recorded. The README calls the Stencil basis "built with StencilJS", recorded as basedOn stencil. The LinkedIn company page (revogrid-dev) is a social link recorded here only in notes. npm weekly downloads are the sum of the 2026-11-01 to 2026-11-07 range for the package the install page names. The first release year comes from the npm package history, since the repository was created in 2020 and no older tag exists. Contributors are the last page number of the contributors endpoint with per_page=1. The GitHub Discussions link is in the homepage navigation. The compare pages also name MUI X Data Grid, Tabulator, Wijmo, Dash DataTable, Bryntum and DHTMLX Gantt, which have no record or a different record id, so only the four ids with a record are alternativeTo values.
  The React guide says RevoGrid depends on browser APIs, so server-rendered React environments load it on the client side.
