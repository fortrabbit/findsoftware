notes: >
  The docs state that Sanctum offers API tokens with abilities and cookie-based SPA authentication, and that the package is installed with the install:api Artisan command; no page sentence says the package extends Laravel, so basedOn is not recorded although the docs and the GitHub owner are Laravel's. The docs say Sanctum issues API tokens without the complication of OAuth, storing them in a single database table, and that for single page applications it uses no tokens but Laravel's built-in cookie based session authentication services. The LICENSE copyright line names Taylor Otwell, the GitHub organization laravel is recorded as repoOwnerType, and the organization's legal name and country are on no page read here, so hqCountry is absent. The stable major is 4, from release v4.4.0, while the default branch is 4.x. The candidates row carried 227.1M Packagist downloads; the current total is 241157203 and is recorded with its date. The firstRelease year comes from the Packagist version v0.1.0 dated 2020-01-20, one day before the oldest GitHub release. The Laravel Passport candidate (laravel-passport) is an OAuth server and is not named on the Sanctum pages, so alternativeTo stays on the Passport record, whose docs present Sanctum as the other option. The dependentRepos figure is the ecosyste.ms count as the endpoint returns it.
