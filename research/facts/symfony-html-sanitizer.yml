notes: >
  The HtmlSanitizer component is a read-only split of symfony/symfony; the README sends issues and pull requests to the main Symfony repository, so the stars, contributors and dependents are the split's own counts. The component docs say the sanitizer "is based on the HTML Sanitizer W3C Standard Proposal", a specification it follows, so it is not recorded as basedOn. The docs state that the Symfony framework exposes the class as the html_sanitizer service, and that the component integrates with Symfony Forms through the sanitize_html option on text fields; the docs also show a Twig filter named sanitize_html and a standalone use beside the framework use; these are not recorded as fields. The docs also say it is meant for untrusted HTML such as WYSIWYG editor output and that it rebuilds the markup from allowed elements and attributes. The Packagist totals are as of 2026-11-16 (total and monthly) from the Packagist package API. The GitHub prerelease v8.2.0-BETA2 (2026-11-13) is newer than the latest stable v8.1.11 (2026-11-04). The maintainer follows the LICENSE copyright line: Fabien Potencier.
