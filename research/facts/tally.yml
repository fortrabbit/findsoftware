notes: >
  Hosted-service record: the form builder runs on the vendor's servers, with no installable part, so no repository, license or selfHostOption. The homepage names embeds: "Seamlessly embed your forms into your website, landing page, or Notion" (https://tally.so/), which is how a site receives a form; popup forms and a share link are on the same page. The API and webhooks sit under criterion 1 as an API a site calls and a webhook a site receives: "Tally API. Create forms and sync submissions from your code." and "Webhooks. Send events for new submissions to HTTP endpoints." (https://tally.so/). The homepage also names an MCP server (https://tally.so/help/mcp), a Zapier, Make and n8n integration set, and a referral program; none is a field. The free tier is stated on the pricing page as "Tally gives you unlimited forms and submissions, completely free, as long as you stay within our fair usage guidelines"; no field is recorded for it, as the free-tier wording is a coined kind. The Pro and Business plans are hosted tiers, so no paidEdition is recorded, and no prices are recorded. The homepage says "Powering 2,500,000+ teams at the world's best companies": a count of teams, not of sites or installs, so it is not reportedInstalls. The "linkedin" link is https://linkedin.com/company/tallyforms, a coined social kind, so it is recorded here only as a note. The pages read were the homepage, /pricing, /about, /features, /help/api, /help/webhooks, /help/gdpr, /help/integrations, /help/mcp and /help/terms-and-privacy; the vendor's own /help/embed path returned 404 and no firstRelease statement was found on these pages. The legal entity is Tally BV (copyright line on the terms and privacy page), and the pricing page places the company in Belgium.
