notes: >
  No project site: the repository's homepage field is empty, so no homepage is recorded. The CSV row links github.com/piranha/gostatic, which redirects to sansolovyov/gostatic; the README still links piranha/gostatic for its releases, and the repository recorded is the one the API returns. The GitHub release list starts at 1.12 (2014-07-25), though the repository was created in 2012, so firstRelease is 2014. Highest stable release is 2.36 (2023-02-28), and the registry check is not needed because the repository has releases. The README does not state a minimum Go version, so runtimeMin is unknown. The README says the HTTP server and watcher run during development ("make w"); runsAs records only static, since the README describes the generated output as deployable files. The template syntax is stated as Go templates in the Configuration section. No Go module download figure is recorded, because a Go module has no download figure.
