notes: >
  No public source: the npm metadata names github.com/splinetool/spline (packages/runtime), which answers 404 through the GitHub API, so there is no repository, no GitHub release and no stars or contributor count; sourcePublic is false because the package holds build output (build/*.js, WebAssembly, .br and .gz copies), runtime.d.ts, README.md and AGENTS.md only. License: neither package.json, the tarball nor the README names a license id, so no license id is recorded; the terms page (section 15, "Company Proprietary Rights") calls the software used with the service proprietary, which is the license statement recorded as commercial. Hosted editor: scenes are designed and published in the Spline editor, a hosted platform; the pricing page lists "Code & Self-hosted exports" only on Enterprise and "Download Code Export" on Max, so no self-hosted install of the editor is recorded. Runtime: the README says the runtime "renders it on a <canvas> (WebGPU, with a WebGL fallback)" and the AGENTS page describes browser adapter selection; no page states "runs in the browser" as a sentence about the runtime, so runsAs and runtime are left out. npm figure 789308 is the sum of daily counts for 2026-11-01 to 2026-11-07; the npm "latest" tag is 2.0.187, published 2026-11-16, and the oldest npm upload is 0.6.5 on 2021-10-26. Social links are from the homepage footer. The package's AGENTS.md addresses coding agents; its instructions (remix, attribution) are not recorded as facts.
