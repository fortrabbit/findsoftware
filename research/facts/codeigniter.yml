notes: >
  The repository is codeigniter4/CodeIgniter4 (development); Composer installs the read-only split codeigniter4/framework, whose Packagist figure is recorded, and new projects start from codeigniter4/appstarter. The credits page gives the history: developed by EllisLab, acquired by the British Columbia Institute of Technology in 2014, managed by the CodeIgniter Foundation since 2019; it gives no first-release year and no country for the foundation. The requirements page lists more database drivers as not yet converted for CodeIgniter 4 (PDO variants); only the converted ones are recorded. No endoflife.date entry exists. CodeIgniter 3 is a separate, older branch not researched here. Coined field `chat` as in symfony.yml.
