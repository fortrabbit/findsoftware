notes: >
  The repository has no GitHub release object; its tags run from v0.1.0 (commit dated 2021-11-18) to the 1.x line, and the stable line is on npm, where 1.0.0 was published 2026-08-01 and 1.0.6 is the latest. The README calls 1.0.0 the release, so the latest stable is the npm latest, and its date is the npm upload date. The unscoped npm package canvas-editor is a different, unmaintained package (1.0.0, 2019, no repository field); its download figure is not recorded here. The npm figure counts downloads of the scoped package named by the README install block. The maintainer is taken from the LICENSE copyright line, which reads hufe; the GitHub owner is Hufe921, the README copyright reads Hufe921 for 2022 to present, and the docs footer reads Hufe for 2021 to present. The reviewer decides which wording the record shows. The quick start creates the editor on a container element with an options object whose main array holds the content. The README feature list names pagination with headers and footers, tables, images, form controls, a table of contents and print output. The docs site has English and Chinese versions, and the README links the Chinese docs. The README says the project is a Canvas or SVG rendering editor with an SVG render backend selected by an editor option, and that official plugins are published in the separate canvas-editor-plugin repository; both are outside this record's fields. Development needs Node 24.13.1 and pnpm, a build requirement, so no runtimeMin is recorded. The docs describe the API as fully typed TypeScript, which is kept here as a note. No page names the maintainer's country, so hqCountry stays out; the GitHub profile location is not a source for it.
