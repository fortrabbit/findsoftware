notes: >
  Scope call: the CSV row marked this boundary between a workshop and a hosted service. The open source CLI and the component toolchain are installable under Apache-2.0 with a documented install, so the record is accepted with Bit Cloud as a hostedOffering fact, as the README describes the hosted scopes beside self-hosted ones. A reviewer may prefer hosted-service if the hosted cloud is judged the product. Version line: the highest stable GitHub release by version number is v14.8.8 (2020-07-13), but v1.0.0 (2023-09-20) and v2.0.0 (2026-06-30) are the current line, with v2.0.26 as the latest release (2026-07-21), and npm @teambit/bit latest is 2.2.164; currentMajor is 2 and a reviewer decides whether the rule should read by version number. The runtimeMin comes from the engines field of the npm package @teambit/bit, the package the install docs name (node >=18.12.0); the root package.json at v2.0.26 lists node >=12.22.0. The GitHub API reports the license as NOASSERTION; the LICENSE file carries the Apache License 2.0 text and the README links it as Apache License, Version 2.0, so one entry. The homepage links Discord with a text label, recorded as discord; its X link and its subreddit link are icons with no text, recorded without a quote. LinkedIn and YouTube have no field in the starter list. The Bit Cloud legal pages (privacy, terms, imprint) return a JavaScript shell with no text, so the legal name is taken from the LICENSE copyright line and hqCountry is unknown. The ecosyste.ms lookup for @teambit/bit returned no counts, so dependentPackages and dependentRepos are unknown. The docs link bit.dev/docs redirects and the install page bit.dev/docs/getting-started/installing-bit returns 404; the install route is the README's npx @teambit/bvm command. The README also describes: components created from templates, previewed in the Bit UI with bit start; shell applications that compose components, started with bit run; components versioned with bit tag and released with bit export; a default build on Ripple CI, or on the local machine with the --build flag; use in a monorepo, polyrepo or no repository; official dev environments for Node.js, React, Angular, Vue, React Native and Next.js; and a linked guide for hosting scopes on a server of the team's own.
