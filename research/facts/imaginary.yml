notes: >
  No project site is named: the README badges and deploy buttons point to Docker Hub, fly.io, Cloud Foundry and Google Cloud Run guides, and none is the project's own site, so homepage and docs are absent (the README itself is the documentation). The latest stable release is v1.2.4 dated 2020-08-12; the default branch was last pushed 2025-11-08 (api, pushed_at). The import's four-year rule moves a record with no release or pre-release in four years to stub; status is kept as the candidate row has it, and the reviewer should expect the import to set stub. Tags as old as 0.1.0-rc.0 (2015) set firstRelease. The LICENSE copyright line names Tomas Aparicio and contributors; the README author list gives "Tomás Aparicio" as "Original author and maintainer", recorded here from LICENSE; the README license line "MIT - Tomas Aparicio" is the same license and is not a second entry. The Go requirement "Go 1.12+" and the libvips 8.8+ prerequisite are build requirements of the source install and the Docker image bundles its own, so no runtimeMin is recorded. The HTTP interface is an image API with one endpoint per operation, not a headless CMS API, so headlessApi is not recorded. Coined, recorded here only: outputFormats JPEG, PNG and WEBP (README); image library libvips through the bimg Go binding (README); urlSigning with an HMAC-SHA256 sign parameter behind -enable-url-signature (README); token authorization with -key (README); image placeholder fallback (README). Docker image h2non/imaginary is the image the README names. Contributors counted with per_page=1 across all pages (52). The repository homepage field points at a Fly.io guide, which is no project site.
