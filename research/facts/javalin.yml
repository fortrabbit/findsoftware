notes: >
  The homepage javalin.io and the documentation at javalin.io/documentation are the project's own site. The repository's latest stable release is javalin-parent-7.2.4 (2026-10-25); the release list also holds 7.2.1 marked prerelease, which is skipped. The Maven Central metadata for io.javalin:javalin lists 7.2.4 as latest and first uploads from 0.0.1 in May 2017; the search.maven.org index stops at 6.7.0 and is not used for the current version. The site names the Apache 2 license and the LICENSE file is Apache License 2.0. No person or legal entity is named as maintainer on the homepage, the documentation or the LICENSE file, so maintainer stays unknown. The documentation lists per-engine template rendering artifacts, javalin-rendering-freemarker, -velocity and -thymeleaf, each followed by "etc.", so only those three engines are recorded. The configuration section describes "The embedded Jetty webserver configuration". The docs describe the embedded Jetty server; the runsAs fact cites the statement that app start launches the server. The homepage names Discord with a live member counter; the anchor with the Discord link is the one recorded. The sponsor page at github.com/sponsors/tipsy names a GitHub account but does not state a role, so it is not recorded as a maintainer.
