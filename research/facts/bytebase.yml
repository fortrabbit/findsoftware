notes: >
  GitHub reports license NOASSERTION. The LICENSE file says MIT for content outside the directories it names, and that source files with "enterprise" in their dirname are under LICENSE.enterprise; the two license entries are kept separate. The Enterprise license permits production use only with a valid subscription. Pro is cloud-only and Community self-hosted instances can start a 14-day Enterprise trial, per the self-host page. The pricing page prices (Pro at per-user monthly rate) are not recorded. The hqCountry is not in the pages read: the Terms give Delaware as governing law, the legal page lists no address; the Service Agreement is linked from the legal page and was not read. Runtime is not recorded: GitHub reports Go, but no read page names a shipped binary; the README's go build lines build the project's own repository. The Docker Hub count is for bytebase/bytebase, the image the README names. LinkedIn (linkedin.com/company/bytebase) and YouTube (youtube.com/channel/UCIlxsMmakGxeaAwpu1Z6jJg) appear on the homepage; no starter field, not recorded. The docs footer names x.com/bytebase; the homepage uses x.com/Bytebase, which is recorded. The Terraform provider and the MCP server are integrations and are not install methods. The Bytebase vs DBeaver and vs CloudBeaver compare pages are the alternativeTo facts; the other compare pages name tools with no record in this dataset.
