notes: >
  The homepage poi.js.org, linked by the README and the GitHub repository, answers 200 only with a js.org frame; the frame loads js.org's "302" error page, which reads "the subdomain does not exist", so no homepage is recorded and the docs link at poi.js.org is not recorded either. The README says "Poi has been deprecated, please migrate to Vite", and the repository is archived (GitHub API, archived true); both are recorded as discontinued signals. The named successor is Vite, which the README names as the migration target, so it stays in notes and successorOf is not set. The npm package poi shows no deprecated flag on its latest version, so the end signal rests on the README and the archive. The GitHub release list starts at v3.4.0 (2016-11-21) and currentMajor 12 comes from poi@12.10.3, the highest stable release; the repository's pre-release tags (v12.0.0-alpha.4 and older betas) are not used. The core package at poi@12.10.3 declares no engines field, so no runtimeMin is recorded; the README prerequisite "Node.js (>=8)" is an old-README statement and stays here. The README's Spectrum forum link is not recorded as forum, because the page was not read. The maintainer name is the copyright name "EGOIST" in the README; no legal name appears on a page read.
