notes: >
  The homepage is not recorded: the README warns that the seed-rs.org link is "temporally disabled because a third party may have acquired it", and the domain now redirects to an unrelated site, so no homepage is recorded under the dead-homepage rule. Status is discontinued on the project's own README signal ("Seed is not maintained at the moment"), not stub: the dead-homepage rule says stub, and the reviewer should decide between the two. The highest stable GitHub release is 0.10.0 (published 2023-03-06), matching the crates.io max stable version and the Cargo.toml version; the last commit on the default branch is 2025-01-11. The README links the Seed website and the Seed guides, which are not reachable; the API docs at docs.rs are the only documentation the README names. The LICENSE copyright line names David O'Connor and Cargo.toml lists three authors; the copyright holder is recorded as the maintainer with maintainerType individual, which is a judgment since the project does not name a maintainer entity. The README says the templating system is Rust macros (the div! macro), recorded only in prose, and the Elm-like architecture is not a basedOn parent. The README's list of alternatives and the awesome-seed-rs resource list are not recorded as fields. firstRelease is the oldest crates.io upload (0.0.1, 2018-12-09), older than the oldest GitHub release. The README says there is no server-side rendering yet but names no rendering mode, so renderingModes is absent. No database, admin interface or server rendering is named; the README says there is no server-side rendering yet. Coined: none.
