notes: >
  Lighthouse is the audit tool itself. The Chrome extension was superseded by the DevTools panel; the extension is listed under installMethod because the README still names it. The category is dev-tool: the project describes itself as a tool for developers ("insights on developer best practices") and the mapping has no performance-audit value. Criterion 1 rests on a creator running it against their own site, not on building one; a reviewer may want this as a testing category instead. The GitHub releases list also includes a non-version release named lantern-test-data (2026-10-09); it is test data, not a version of the package, and is excluded from latestReleaseDate. The npm figure is the lighthouse package named by the install docs; the weekly figure is the sum of 2026-09-28 to 2026-10-04 per the build-dev rule. The tags list contains 1.0.x and 1.1.x versions; the oldest GitHub release is 1.1.1 (2016-08-06), so firstRelease is 2016. Maintainer is Google LLC as the package.json author states; the legal notice for hqCountry was not checked. The repository's own release tags use v-prefix; the current major is taken from v13.6.0. The Lighthouse CI product is a separate project and is not recorded here. PageSpeed Insights runs Lighthouse on Google's servers; that is a hosted service of Google's and is not recorded as a hostedOffering. The LICENSE file words the license as "Apache License, Version 2.0", the same license as the API id. The README states Lighthouse runs locally and that reports are not sent to a remote server.
