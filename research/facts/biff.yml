notes: >
  Biff is a Clojure framework, not a CMS; its library list is in the README. The database engines are SQLite (biff.sqlite, the default) and XTDB (biff.xtdb, an alternative), as the README states. The Clojars page for com.biffweb/biff lists 0.4.2-beta (2022) as its latest version, while the README installs the 2.x libraries as com.biffweb/ring, com.biffweb/admin and similar, so no Clojars figure is recorded. The first GitHub release is v0.4.1-beta (2022-04-09), so firstRelease is 2022; the repository dates from 2020. The highest stable release is v2.0.0 (2026-09-10); the GitHub releases list has no later stable tag, and the CHANGELOG lists 2.0.1 and 2.0.2 without a matching release. The starter repository named by the README is biff-starter, cloned with git and run with clj. The newsletter link is on the README. the marketing site lists deployment tooling for an Ubuntu VPS, an uberjar or a Docker container, which the libs/tasks README confirms for Ubuntu servers. The admin library is a dashboard with usage metrics, a user directory and email alerts, which is the only admin interface recorded. The Clojurians Slack channel named in the README is not a field.
