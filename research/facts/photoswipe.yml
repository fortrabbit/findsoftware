notes: >
  The homepage photoswipe.com answers over https (the http address redirects to it) and is the project's own site, which names the software PhotoSwipe in its title and nav. The default branch is master. The homepage footer reads "Made in Ukraine by Dmytro Semenov" and the npm author field says the same name, while the LICENSE copyright line reads "Dmitry Semenov" with the year range 2014-2022; the maintainer follows the LICENSE line and the other spelling is not recorded as a second maintainer. The footer country names where the maintainer is from, not a headquarters, so hqCountry is absent. The footer's Twitter link is the project's account (twitter.com/photoswipe), which resolves to x.com; the final URL is recorded. The homepage links an Open Collective sponsorship page; no field holds sponsorship, so it stays out. The homepage says PhotoSwipe v6 is under development and the README asks for feedback on it; that is a planned version with no tag or release, so it is no end signal and no latestPrereleaseDate is recorded (the 5.2.0 beta tags date from 2022, before the stable 5.4.4). The v4 docs and the v4.1.3 code are older major lines the README links; they are not recorded. The homepage's "Frameworks" section (React, Vue, Svelte) documents wrappers and examples of the library, and the GitHub description calls it framework independent; no basedOn is recorded because no page says PhotoSwipe is built on a framework. The dynamic caption and tiled deep zoom plugins are separate repositories that the homepage links; they are plugins of PhotoSwipe, not listed here. The README says the project is tested with BrowserStack, which is no fact field. The firstRelease 2011 is the oldest tag, v1.0.1 (commit dated 2011-04-12); the npm package begins in 2014. The npm figure is the sum of daily downloads for the package photoswipe for the week 2026-11-01 to 2026-11-07. The contributors count is the page number of the rel="last" link on the contributors endpoint with per_page=1. The GitHub stars count is the repository's own count. The homepage says the script is an ES module with no build step, that the single CSS file needs no external assets because the icons are generated in JavaScript, and that larger images load as a visitor zooms through srcset. The getting-started page says the core and the lightbox are separate files, that images need predefined width and height, that the library is not designed for very large images (the tiling plugin is experimental), and that it works only in browsers that support ES6 modules, with a link to the image as fallback. The homepage lists what version 5 removed from the core (the history API, social sharing, a fullscreen button, captions and inline galleries), and says some are or will be plugins. The homepage says version 5 is mainly designed to be used as a dialog and that touch gestures should feel more fluid. The getting-started page says the JS files are separated, so Core can be loaded only when the user needs it, and its sidebar lists Options, Events and Methods pages and a Frameworks section with pages for React, Vue and Svelte.
