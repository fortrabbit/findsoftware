notes: >
  GitHub reports the license as NOASSERTION because the file is named license.txt; it holds the GPL version 2 text, and the homepage states GPL v2 without "or later". The two about pages linked from the homepage returned 503. The master readme gives PHP and MySQL minimums, but the downloads page states none for the newest stable release, so runtimeMin is not-found rather than taken from master. The homepage names an older major than the downloads page; currentMajor follows the downloads page. The downloads page and the GitHub release give different dates for the newest release; latestReleaseDate uses GitHub. The repository is not archived and no page states an end of the project, so no end signal applies. Categories record the blog and forum features only; galleries and newsletters are left out.
