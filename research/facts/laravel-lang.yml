notes: >
  The Packagist package laravel-lang/lang is the one the install page names (composer require --dev laravel-lang/lang); the GitHub repository is Laravel-Lang/lang with default branch main. The install page documents a lang:update Artisan command and a post-update-cmd hook; no runsAs is recorded because the package ships translation files and the page states no process. The page's compatibility table lists the Laravel packages whose keys are translated, among them Jetstream, Fortify, Cashier, Breeze, Nova, Spark and UI; those are not records here. The package's own major, 15, comes from its tags (15.38.0 on GitHub); its compatibility table pairs it with Laravel ^15.10 and other Laravel majors, and its publisher dependency carries a separate major. The maintainer is the LICENSE copyright holder Laravel Lang Team, a community team; the Laravel-Lang organization on GitHub is the same project. The license page on laravel-lang.com gives the copyright as 2026 and the repository LICENSE gives 2013-2026, so the repository wording is recorded. The basedOn Laravel value rests on the site sentence that the package holds translations of the official keys of Laravel projects. The GitHub README is titled Laravel Localizations and the site and organization use Laravel Lang; the name follows the site. The forum is the GitHub Discussions board of the Laravel-Lang organization, which the contribution guide names as the place to propose a new locale. firstRelease is 2015 from the oldest Packagist upload, 2.0.1 dated 2015-03-30, which matches the commit date of the oldest 2.x tag; the GitHub releases begin in 2019.
