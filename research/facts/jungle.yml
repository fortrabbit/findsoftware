notes: >
  The homepage junglejs.org is live and shows the software, so status stays accepted. The last GitHub release and the npm latest are both 1.1.2 (2020-07-18), and the repository was last pushed 2022-12-13; the import moves a record with no release in four years to stub, so a reviewer should expect that move. The package installed by the docs is junglejs (npm, MIT), not the unrelated npm package jungle (Space-Ed/jungle-cli). The docs describe a GraphQL data layer over sources such as headless CMSs, Git-based CMSs, APIs, CSV and JSON; no database or headless API field is recorded because the data is read at build time and the docs name no store. The quick start says the build output is in jungle/build and "can be deployed immediately", and the homepage lists Netlify as a static host. The npm monthly figure for 2026-09-19 to 2026-10-18 is 38 downloads; only the weekly figure is recorded. The runtime is node because the install steps use npm, but no page names Node.js, so runtime is not recorded. The LICENSE copyright line names Conner Aldrich; the homepage footer names JungleJS.
