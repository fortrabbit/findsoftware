notes: >
  Hosted service: CloudCannon is the hosted editing layer over a Git repository and static site generator, and it builds and hosts the site or hosts it elsewhere (BYO hosting), per the homepage. The open-source page lists separate tools by CloudCannon developers (Pagefind, Flatlake, Rosey, Reseed, Pagebreak and agent skills); Bookshop is a further MIT project on the GitHub organization. None is the product's source, so no repository, license or adoption figure is recorded. The pricing page lists Standard, Team and Enterprise plans with a 21-day trial and no free plan, so freeTier is not recorded. The terms name CloudCannon Limited with company number 3234469 and the privacy page names New Zealand as the country where the company is incorporated. renderingModes static comes from the homepage statement about building the static site. The features and pricing pages list build deploys, a deploy preview feature and site mounting, which are not recorded as fields. SSO/SAML appears in the Enterprise plan list on the pricing page. Custom permissions appear in the Team and Enterprise plans. The homepage also links to LinkedIn and YouTube, which have no field.
