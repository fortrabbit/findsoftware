notes: >
  The homepage is the project site and the docs page is a JavaScript shell with no readable text, so the README link to the documentation is the docs fact. The README and the homepage both name it a Node.js-based testing framework and a user-friendly end-to-end testing framework; the Node.js runtime comes from the README. The README's Installation section says Node.js 16 or higher, while the latest npm package (3.7.7) declares engines node >=20.0.0; runtimeMin follows the package manifest, and the README sentence is a stale requirement that a reviewer may want to confirm. The README says TestCafe runs on Windows, macOS and Linux and drives desktop, mobile, remote and cloud browsers, and that it does not need WebDriver: these are environment statements and stay in notes; runsAs local comes from the FAQ sentence calling TestCafe a command-line application that runs test scripts. The docs also install it from yarn, the Docker image and source, and the ad hoc npx route is the same registry as npm. The FAQ says TestCafe does not use Selenium or WebDriver and runs a hybrid automation engine in which a proxy injects client-side automation scripts into web pages. The homepage footer links Facebook and a YouTube playlist. TestCafe Studio is a separate paid IDE built on the open-source version, described in the README as a different product; it is not recorded as paidEdition. The README links Stack Overflow with a tag; that is a general community, not the project's forum, so no forum is recorded. The README lists plugins in its body and links no plugin directory. The firstRelease is the oldest GitHub release, v0.0.11 on 2016-02-01, though the repository was created in 2015. The maintainer is named in the LICENSE copyright line and the README calls the creators Developer Express Inc.; the company's pages give no country or address, so hqCountry is absent. The GitHub contributors count covers the repository.
