notes: >
  The homepage answers over http and over https; the record links the https address. The repository has no LICENSE file (master returns 404) and GitHub detects no license; the license is the README statement "The MIT License (MIT)" with the copyright line "Copyright (c) 2012-2020 Dan Grossman". The homepage states "Copyright (c) 2012-2019" for the same license and "Copyright © 2012-2018" in its footer; years are not recorded. The homepage says to include jQuery and Moment.js in the page, so both are required by the component and neither is a basedOn statement. No installMethod is recorded: the homepage says to include the files in a page and offers a "Download ZIP" link, and no sentence names a route. The homepage demo page loads Bootstrap CSS; basedOn comes from the package.json description. No runtime or runsAs is recorded: the pages say the component "can be attached to any webpage element" but do not state in words where it runs. The npm package daterangepicker is the one the repository's package.json publishes (version 3.1.0, same date as the GitHub release); the install page names no registry, so the npm figure is the package the project publishes. Stars and contributors are from 2026-11-04. The last release is v3.1 (2020-05-24); the repository was last pushed 2024-08-09. The 2014 first release is the v1.3 release object published 2014-01-18. The package.json description calls it a "Date range picker component for Bootstrap"; a component for Bootstrap is no statement that it extends Bootstrap, so basedOn is not recorded (as bootstrap-datepicker).
