notes: >
  The first GitHub release is 2018 (release-5.3.4); the first tag, release-1.0.0, points at a commit of 2008-04-11, which gives firstRelease 2008. The GitHub license is MIT and LICENSE carries the MIT text under the Asynchronous B.V. copyright line; the homepage and README do not name a second license, and the Enterprise edition is described only on its own page as premium features for businesses. The maintainer follows the LICENSE line (Asynchronous B.V.). The privacy statement at phusion.nl names Phusion B.V. at an address in Apeldoorn, The Netherlands; that entity is not the LICENSE holder, so hqCountry stays out for a reviewer to decide. The what-is docs say Passenger runs Ruby, Python, Node and Meteor apps and, since Passenger 6, all languages through Generic Language Support; these are app runtimes, not the server runtime. The server core is C++ (enterprise page); installed through the Ruby gem, APT and YUM packages, or the nginx and Apache modules through the source-tree installers in the README. The rubygems figure is the total downloads of the passenger gem, the package the Bundler install names. The README links Twitter (twitter.com/phusion_nl), which is the company account, recorded from a README link without a quote. The homepage figure (over 650,000 sites) is the project's own statement, not a measured count. Stars read 2026-10-30; the GitHub default branch is stable-6.2. runtime binary follows the C++ server core and the APT and YUM packages; the apps it runs (Ruby, Node.js, Python, Meteor) are not the server runtime. The what-is page also says Passenger serves multiple applications at the same time.
