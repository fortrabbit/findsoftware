notes: >
  The homepage is taken from the repository's homepage field, which says http://www.mysql.com/; the https address answers, but only with the bot check, so no page of the vendor site is quoted. Calendar version: the current release is 26.10.0 (MYSQL_VERSION sets the maturity to INNOVATION and names 9.7.0 as the previous LTS), so currentMajor is not recorded; the line is 26.10 and the LTS line is 9.7 (endoflife.date lists 9.7 as lts with an end of life of 2034-04-30). The release tags mysql-9.7.x and mysql-26.x both exist; latestReleaseDate is the commit date of tag mysql-26.10.0, the newest. firstRelease is 2000 from the commit date of the oldest release tag in the repository (mysql-3.23.22-beta); the project's own first-release year is not readable. License: the LICENSE file states GPLv2 with additional permissions, including the Universal FOSS Exception for the Connector; the SPDX id GPL-2.0 is recorded and the permissions are not. The MySQL Enterprise Edition and the commercial licence are not on any page read here, so paidEdition is not recorded and a reviewer should check the vendor pages before the record is published. The Docker Hub official image mysql had pull_count 5223059874 on 2026-10-30; it is not recorded as dockerPulls because the install docs that name the image could not be read. runsAs is not recorded: mysqld_safe's man page calls it "the recommended way to start a mysqld server on Unix", which names a server process but no run mode in a quotable sentence. The copyright holder is "Oracle and/or its affiliates" as the LICENSE and README state it; the legal entity and its country are not on any page read, so hqCountry is not recorded. Fields coined here: none.
