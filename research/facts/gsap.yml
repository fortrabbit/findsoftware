notes: >
  GitHub reports no SPDX license for greensock/GSAP (license null), so the license entries come from the license page and the npm package metadata, which both state the "Standard No Charge" license. The license is not an SPDX identifier; licenseModel is source-available because the code is public but the license prohibits use in tools that compete with Webflow's visual animation builder. The license page's plain-English summary, including the Business club clause for products that charge end users, is commented out in the page HTML and is not recorded. The GitHub repository has no releases (releases API returns 404), so the version and date come from npm. The license page names Webflow as the owner of the intellectual property; the GitHub organization is greensock. The homepage states "GSAP is now free for everyone" and the pricing page says "GSAP is now 100% free for all users"; no prices are recorded. Adoption periods: npmWeeklyDownloads covers 2026-10-12 to 2026-10-18; githubStargazers was read 2026-10-19. The repository created_at (2012) is not a first release, so firstRelease stays out.
