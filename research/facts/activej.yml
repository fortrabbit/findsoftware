notes: >
  No GitHub release exists; the repository has tags only, and the newest is v6.0-rc2 (a release candidate). The homepage title says "ActiveJ 6.0", but no stable 6.0 is on Maven Central or in the GitHub tags, so currentMajor is taken from the highest stable Maven Central version, 5.5 (uploaded 2023-06-15 per the pom Last-Modified header). A reviewer should decide whether the 6.0 line counts as stable once a final version is published. The README quick start pins the archetype to 6.0-beta2. The Maven Central release date is the pom Last-Modified header, not a registry release field. Maven Central publishes no download figures, so none is recorded. The getting-started page (activej.io/tutorials/getting-started) is the install page; the /docs path returns 404. The README states no minimum runtime, the getting-started page states JDK 17+. No process model is stated, so runsAs is left out.
