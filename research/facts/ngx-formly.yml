notes: >
  The site formly.dev answers 200 with an application shell that carries no page text, so the homepage is recorded from the README link and the docs are read from the docs folder of the repository (getting-started.md and faq.md). The repository ships the core package @ngx-formly/core, which the install guide names with npm; the schematics package (@ngx-formly/schematics) is the ng add route. The UI theme packages named in the install guide (bootstrap, material, ng-zorro-antd, ionic, primeng, kendo, nativescript) are separate packages of the same repository and are not records. The npm downloads for @ngx-formly/core are the figure; the repository's stars and contributors belong to the monorepo that holds all packages. Releases: the GitHub release list holds the v11 line (v11.2.0, 2026-11-10) and older major lines published as stable backports on 2026-11-12 (v10.1.0, v9.1.0, v8.1.0, v7.2.0); the latest release date follows the newest stable release by date. The release v11.1.0-rc.0 (2026-11-03) is a prerelease older than the latest stable release, so no latest prerelease date is recorded. The first tag is 2.0.0-alpha.0 of April 2016, from the commit date; the npm upload history starts in 2017. The maintainer follows the LICENSE copyright line. The README links a Twitter badge (twitter.com/formlydev), recorded as x, and a Gitter chat badge, which is no field here. The project's ngx-formly skill and the MCP service it names are tooling for coding agents, not recorded as fields. Formly uses Angular Reactive Forms, a part of Angular, as its base.
