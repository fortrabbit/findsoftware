notes: >
  The README is the current default-branch README and says the open-source project is deprecated; the record is discontinued on that statement, which the project's own README gives. The README says "To explore Marqo's product search and discovery platform, go to marqo.ai", the hosted product. The docs at docs.marqo.ai describe the hosted platform (its introduction and API pages) and name no self-hosted install, so docs is not recorded, and the README names no install route. The "Marqo vs Marqo Classic" page named in the docs navigation is not linked from the pages read and was not found. The company's legal name is S2Search Australia Pty Ltd on the privacy policy; the terms page gives the same name with ACN 660 091 074, which differs in its last digits from the privacy policy's ACN 660 091 974, so no ACN is recorded. The homepage footer lists offices in San Francisco, London and Melbourne and no headquarters, and the registered entity is Australian, so hqCountry is left out for a reviewer to decide. The LICENSE file is the Apache 2.0 text with no copyright line. The repository's language is Python, recorded from the API; the README names no runtime. The homepage footer also links LinkedIn, the Marqo status page and a Hugging Face profile; no field is recorded for these. The GitHub repository description is "Ecommerce Search and Discovery - marqo.ai".
