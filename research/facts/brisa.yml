notes: >
  The README warning states: "The 0.x versions of Brisa are considered experimental, use it for experimentation, we do not recommend using it in production until 1.x." The npm dist-tag next is a canary and is not recorded. The Building section of the docs lists Bun, static, Node.js and Deno outputs and desktop, Android and iOS apps; the static page says "Pure server stuff like api endpoints and server interactions will not work in runtime" for a static export and that redirects must then be set up on the host. Runtime is recorded as bun only, because the quick start states Bun as the system requirement. The LICENSE copyright line reads "Copyright (c) 2024 Brisa"; the homepage footer reads "MIT License © 2026 Brisa Framework". The README lists sponsors, which are not recorded.
