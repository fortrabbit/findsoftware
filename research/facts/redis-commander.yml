notes: >
  The latest release is the npm latest, 0.9.0 (2025-05-24), so currentMajor is 0 for the 0.x line. The repository tag v0.9.1 (commit of 2025-07-21) has no GitHub release object and was never published to npm, so it is not the latest release. The package name and first version are from npm: 0.0.1 is dated 2012-06-22, and the repository was created 2012-06-18; no page states a first-release year, so firstRelease 2012 is the npm upload date. The LICENSE copyright line names "Joseph M. Ferner" while the project homepage and package.json name "Joe Ferner"; the copyright line is recorded as the maintainer. The Docker route is the GitHub Container Registry image ghcr.io/joeferner/redis-commander, which the README names; the README says new versions are not published to Docker Hub, so no Docker Hub pull figure is recorded. The README says installation through yarn is not supported; no install entry is recorded for it. The Helm chart is installed from a local checkout of the repository, as there is no chart repository. runsAs rests on the homepage calling it a node.js web application; the README says the container makes it available at localhost:8081, and the command line options include the address and port the server runs on. npmWeeklyDownloads is the sum of daily downloads for 2026-10-19 to 2026-10-25, and counts installs of 0.9.0 and earlier. The README also names Redis Sentinel and Redis Cluster connections, which have no field. Fields coined here: none.
