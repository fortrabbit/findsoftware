notes: >
  The live preview server is served from the same binary that builds the static output, so the site runs as always-on while it is being edited and as static files once built.
  The docs site lists 37 extensions; the pluginCount figure comes from the README.
  firstRelease comes from the oldest tag, v0.3.0 (2022-10-14); the repository was created in 2014 and has no earlier tag.
  The homepage is itself an XLog site, served from the project's own domain over https.
