notes: >
  The repository publishes tags and no GitHub release objects; the highest stable tag is 5.110.0, which matches the RubyGems version (2026-11-01), so latestReleaseDate is the gem's date. The CHANGELOG points older entries to doc/CHANGELOG.old, where the first entry is version 0.1 dated 2007-12-30. The website is served over https, and the README and CSV list http; the https address answers, so it is recorded. The README's "Sequel supports advanced database features" list is a feature statement and is not a field. Database adapters outside the field vocabulary stay in notes: IBM_DB (DB2), SQLAnywhere, Amalgalite and ODBC (generic), and the JDBC subadapters Derby, H2 and HSQLDB; the adapter docs name MariaDB only in a test note, so no mariadb value. The gemspec sets s.required_ruby_version to ">= 2.0", and the README support policy repeats the minimum 2.0 for the current version. The README names a GitHub Discussions forum for questions and an archived sequel-talk Google group; only the GitHub Discussions link is recorded. Maintainer per the MIT-LICENSE copyright line (Jeremy Evans and contributors); the README's maintainer section names the same person. The README names no parent framework, so no basedOn is recorded. No page states a process model, so no runsAs is recorded. The README says Sequel includes an IRB console, bin/sequel, which also supports migrating databases, dumping schema migrations and copying databases, and that datasets are safe to use by multiple threads. The README's advanced features sentence names prepared statements, savepoints, two-phase commit, transaction isolation, primary/replica configurations and database sharding; the documentation index lists Sequel for SQL Users, Migrations and Model Plugins pages, and the README names no ActiveRecord comparison, so no alternativeTo is recorded.
