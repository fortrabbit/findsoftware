notes: >
  The project's repository moved on 2025-07-07 to the fritztwo organization, and the old jwstegemann/fritz2 repository is archived with a README notice that the official development "has been moved to a dedicated organization and therefore a new repository"; the website and the Maven Central coordinates stayed the same, per the blog post "Yesterday - Today - Tomorrow" on fritz2.dev. A move is no end, so the status stays accepted and the new repository is the record's repository. The new repository's counts are its own: 23 stars against 705 on the archived one, and 25 contributors. The new repository has only release candidates (v1.0-RC21, 2025-12-17, marked as a prerelease by name though GitHub lists it as a full release); the highest stable release is v0.14.6 on the old repository (2023-07-27), which Maven Central also lists as 0.14.6, the highest non-RC version there. So currentMajor is 0 while the 1.0 line remains a release candidate. The Maven Central search API timestamps the 0.14.6 upload separately; the GitHub date is used. The docs page at /docs/start/ gives the build file with the dev.fritz2:core dependency; the Kotlin/JS browser target and the JVM target are both in that build file, and no page names a runtime or runsAs value, so none is recorded. The maintainer is named in the LICENSE of the new repository; the blog names two founders, Jens Stegemann and Jan Weidenhaupt, and the license names one. No download figure exists for Maven Central.
