notes: >
  Repository only: the project has no website of its own. The GitHub repository sets no homepage and the npm package names the repository as its homepage, so no homepage is recorded, and the README is the only documentation. The README says "TAP-producing test harness for node and browsers" and its examples run tests with node or the tape binary; no page states where tests run as a service, so no runsAs is recorded, and the runtime is node. The TAP output format (TAP version 13 in the examples) is a specification the output follows, recorded here rather than as a field. The maintainer follows the LICENSE copyright line (James Halliday); the package.json author is Jordan Harband, and the npm maintainers are ljharb, domenic and raynos, so the maintainer's name differs by source. The repository has no GitHub release objects and its tags match the npm versions, so currentMajor and latestReleaseDate come from the npm registry (5.10.3, 2026-10-14). The git tag v0.0.0 dates from 2012-11-25, the same day as the npm 0.0.0 upload that firstRelease records. npm marks versions 4.6.1 and 5.6.2 deprecated; neither is the latest version, so no end signal applies. The README's "Things that go well with tape" section lists pretty reporters, uncaught-exception helpers, babel preloading and other test-syntax packages; none is a plugin of tape recorded as pluginDirectory, and none is an alternative the project names. The package has no engines field in its manifest, so no runtimeMin is recorded. The GitHub repository reports JavaScript as its language. The README says the assertion methods are heavily influenced or copied from the methods in node-tap; that is a stated influence, not an alternative or a fork, so no relationship field is recorded. The README's "Things that go well with tape" section says the core is minimal and extra features come from other modules used alongside tape.
