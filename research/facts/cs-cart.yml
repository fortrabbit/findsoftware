notes: >
  No public repository exists; the CSV row has none, and the GitHub and registry fields are not applicable. Source access is granted under the license, as the About page says "while retaining access to the source code", and the license treats the source as Confidential Information, so the source is not public; sourcePublic is left unset because the field is defined by a repository. Criterion 2 rests on the downloadable distributable: the download page offers "a free 7-day trial with full access to all CS-Cart features". The license agreement gives a Trial License of thirty (30) days, so the two sources differ on the trial length; both are recorded here and not as a fact. The license agreement names the company as Bolide Network LLC, San Diego CA, USA, and the About page describes the company as US-based; the San Diego address on that page belongs to a trademark registration, so it is not used for hqCountry beyond the US. The About page carries a customer testimonial that calls the software "100% open source"; it is a testimonial, not a project statement, and it contradicts the license, so it is not recorded. The license names editions Multi-Vendor Standard, Plus, Ultimate and Unlim, and the compare page is the pricing link; no open or free edition is named, so paidEdition stays unknown. The lastRelease value comes from the version history page; the 4.21.x line is the docs' current series. The docs say "PHP version 7.4.0 or higher" and also that PHP 8.3 is supported from 4.19.1, so the minimum shown is the page's stated floor for the current series. The system requirements page also lists PerconaServer 5.5 or higher, not recorded as a database value. The adoption figure is not public: the About page cites over 150 partners, which is not an adoption figure, so no adoption value is recorded; the company behind it satisfies criterion 5. The homepage describes the on-premises edition as a self-hosted platform and also offers cloud hosting, and the Apache install guide lists "Step 5. Install CS-Cart" after the upload step. The docs say each store has separate storefronts, settings and checkout mechanisms. The EULA and the homepage give no repository and no release API, so the release date rests on the docs page only.
