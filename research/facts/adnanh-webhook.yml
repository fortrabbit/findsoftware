notes: >
  The GitHub homepage field is empty and the README names no project website, so no homepage is recorded. The CSV row is accepted for the webhook server: a site's git host or chat tool calls an HTTP hook, which runs a configured command, and the README gives a GitHub push-to-redeploy example. The README's Docker section names only community images (almir/webhook, roxedus/webhook, thecatlady/webhook, lwlook/webhook), which the project does not own, so no Docker installMethod and no dockerPulls are recorded. The README names a Go 1.21 requirement for building from source, which matches go.mod at the 2.8.3 tag. The oldest release in the repository is 1.0.4, dated 2015-03-13. The README's Multipart and Templates sections describe the server's own configuration handling, which is not a site templating fact. The README lists sponsors (DigitalOcean, BrowserStack) and an OpenCollective, PayPal and Patreon funding route, which are not fields. The README warns that a hook without a trigger-rule can be triggered by anyone who knows its endpoint, and points to the Hook rules page; it also describes serving https with the -secure flag and systemd socket activation. The README's Hook examples and webhook-contrib links are recorded only as docs and pluginDirectory.
