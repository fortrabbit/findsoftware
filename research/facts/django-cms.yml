notes: >
  The default branch README (main) reads "Lean, open-source enterprise content management powered by Django"; the develop branch wording differs, so the main branch is cited. The repository LICENSE carries the BSD-3-Clause text with copyright "2020-present, django CMS Association and contributors" and earlier lines by Divio AG and Batiste Bieler; GitHub reports NOASSERTION, so the file is recorded as BSD-3-Clause and the homepage's "BSD Open-Source License" is recorded as a second statement. The homepage footer also reads "Copyright © 2001 - 2025 Divio AG"; no page names a legal entity for the association, so maintainer is the association's name as the homepage gives it, and hqCountry stays unknown. The CSV row lists the homepage as http; the https address answers, so the fact uses https. firstRelease is the 2009 BSD release stated on the who-is-behind docs page; the oldest PyPI upload is 2.4.3 (2014). The same page names Divio AG of Zurich as the original creator; the association's own seat is not stated, so hqCountry stays unknown. currentMajor and latestReleaseDate follow the highest stable version (5.1.3, 2026-09-23); the 5.0.13 patch was published a day later on the 5.0 line. The Slack channel linked from the README and the LinkedIn link on the homepage have no field here. Coined here: none.
