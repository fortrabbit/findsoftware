notes: >
  Accepted. The CSV row was accepted; the repository has no GitHub release and one stray tag, 5.0.0-2-addons, which is not a release; the versions ship as branches (16.0 through 20.0, default branch 20.0). currentMajor is 20 from the nightly page ("Odoo 20 was released in September 2026"); no page gives a release day, so latestReleaseDate is unknown, and lastCommitDate (2026-10-26, the default branch) stays. The PyPI package named odoo is an unrelated project by Vauxoo (version 1.0) and is not recorded; Odoo publishes no registry package the install docs name, so no registry figures are recorded. The license API field reads NOASSERTION; the LICENSE file on the 20.0 branch states LGPLv3, recorded as LGPL-3.0, and the Enterprise subscription agreement is recorded as a separate statement, which makes the model open-core. The Enterprise edition is installed from a separate GitHub Enterprise repository for subscribers; that repository was not read and no license is recorded from it. The docs say Python 3.12 or later and PostgreSQL 16 or later (the database version is not recorded as a field). The maintainer is written "Odoo S.A." on the privacy page ("Odoo S.A. - Data Protection"); the subscription terms page writes "Odoo SA"; hqCountry is Belgium from the registered address given on the privacy page (Chaussée de Namur, Grand Rosière); the terms alone only name Belgian law. The documentation's JSON-2 external API page is not recorded as headlessApi because the vocabulary has no value for it. The pricingPage link is the homepage link to the editions page, which answers 200. The forum is the Help badge link in the README, recorded without a quote because the link is the evidence. The hosted offerings are Odoo Online, named in the subscription terms as "Odoo's SaaS hosting platform", and Odoo.sh, named only in the privacy page's list of services, since the terms page body names the Cloud Platform without naming Odoo.sh. SSO also covers Google and Microsoft Azure OAuth sign-in from the users documentation. The x fact is the twitter.com link in the homepage footer, recorded without a quote because the link is the evidence. The README names Website Builder and eCommerce among the main apps, so each is recorded as its own category.
