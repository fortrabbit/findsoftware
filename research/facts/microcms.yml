notes: >
  microCMS is a hosted service only; no installable part was found, so criterion 2 is waived and the status is hosted-service. The product's own pages name an open-source part: the features/sdk page says its SDKs and tools are open source, and the footer links the GitHub organization github.com/microcmsio. Their licenses, stars, versions and downloads describe SDK repositories, not the service, so none are recorded here. The Japanese company site microcms.co.jp (株式会社microCMS, 設立 2017年9月4日) gives the company history; the first service release is the 2019 launch the company history gives. The pricing page states the SAML single sign-on on the Enterprise plan and 権限管理 on Business and Enterprise; the plan structure is not recorded. The draft preview ("下書き保存・画面プレビュー") shows saved drafts, not unsaved edits, so livePreview is not recorded. The site's sole multi-site statement is marketing copy, and the CSV import is per-service, not a named migration, so multisite and importsFrom are not recorded. The company site gives the founding date 2017-09-04 (設立 2017年9月4日); it is not a field. The Hobby plan is described as having unlimited API calls; plan limits are not recorded. Extra links, not recorded as fields: YouTube channel UCjdOq0rAB8Or1uHio9N0_pQ, community page microcms.io/community, template marketplace templates.microcms.io, MCP server page microcms.io/mcp-server. The site and documents are in Japanese; an English homepage at microcms.io/en exists and only partly mirrors the Japanese pages.
