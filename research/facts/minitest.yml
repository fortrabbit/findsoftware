notes: >
  Accepted: a testing library that a Ruby project adds with gem install (criterion 2 and 3 from the README's INSTALL section), with releases through 6.1.0 on 2026-11-06 (criterion 4 holds). The repository has tags but no GitHub release objects, so currentMajor and latestReleaseDate come from the RubyGems stable version, as the registry fallback allows; the tag v6.1.0 has the same date. The GitHub license field is empty because the repository has no LICENSE file; the MIT statement is the README's LICENSE section at tag v6.1.0, and its copyright line names Ryan Davis and seattle.rb, so seattle.rb, a group rather than a legal entity, goes here and the maintainer is Ryan Davis. The contributors endpoint returns two accounts when read with per_page=1 (anon excluded, rel=last page 2), which is the count recorded; the other commits are not linked to GitHub accounts. firstRelease 2009 is the oldest RubyGems version (1.3.1, 2009-07-25); the repository was created in February 2009. The README describes unit tests as methods whose names begin with test_, specs that wrap expectations in a value call inside describe and it blocks, minitest/autorun as the way to run a suite, a Minitest::TestTask rake task, and plugins that add command line options and reporters. The homepage lists the projects that use Minitest (rails, rack, nokogiri and others) and the README lists prominent projects; neither is a count, so no reportedInstalls. The README quotes a third party comparing Minitest with RSpec, and the homepage's comparisons page charts Minitest against RSpec and test-unit; neither is the project's own alternativeTo statement and no record exists for either, so alternativeTo is absent. The README's AI Policy section says AI is not allowed in pull requests or issues; it is a contribution rule and is no field. The README lists Known Extensions, including minitest-related gems on other sites; no plugin directory is linked, so pluginDirectory is absent. The homepage's superlatives about speed and size are not recorded.
