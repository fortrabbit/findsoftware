notes: >
  Hosted only; criterion 2 is waived. Two products share the company: Code, a visual IDE that generates and edits application code from repositories and design systems, and Content, the headless CMS with a visual page builder and the Content API; the record covers both, and the homepage leads with the Code product. The GitHub repository BuilderIO/builder holds MIT SDKs only, and the @builder.io/sdk and @builder.io/react packages are npm SDKs (53k a week for @builder.io/sdk); those figures and the license stay here, not in the record. The Content API is a GET endpoint at cdn.builder.io/api/v3/content; the Headless CMS page names REST and GraphQL APIs. The Admin API is GraphQL for back-end servers; the Write API creates and updates content. SSO is an Enterprise plan feature; the docs give SAML and OIDC setup for Okta, Google Workspace, Entra and any identity provider, and SSO-only login on request. The roles page marks Contributor and custom roles as Enterprise; custom roles can be limited by environment and locale. Enterprise plan lists "Connect with self-hosted or custom git providers" as an add-on, which is a git connection, not a self-hosted Builder. Security addendum and homepage state SOC 2 Type II compliance; privacy policy states storage and processing in the United States and other countries. The About page places headquarters in the San Francisco Bay Area without naming a country, so hqCountry stays out. Terms are under the SaaS Services Agreement, governed by California law. Free, Pro and Team plans per user and the Enterprise custom plan are plan features with no prices recorded. The LinkedIn link on the homepage is coined and not recorded as a field. The Pro plan lists built-in MCP servers, a feature the record does not carry as a field.
