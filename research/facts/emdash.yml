notes: >
  The README calls EmDash a full-stack TypeScript CMS built on Astro, so Astro is recorded as basedOn. The homepage calls EmDash "the spiritual successor to WordPress"; that is the project's own description of its inspiration, not a successor relation, so successorOf is not recorded, and the README says it takes the ideas that made WordPress dominant and rebuilds them on serverless foundations. The homepage names no pricing page that answers; emdashcms.com/pricing returns 404, so pricingPage is not recorded. The repository's first GitHub release is the 2026-04-01 release of a plugin package, which sets firstRelease to 2026. The npm package emdash is the core package; the install docs name npm create emdash, a create-* scaffolder. The README runs Cloudflare (D1, R2, Workers) or a Node.js server with SQLite; the Cloudflare deployment is in the user's own Cloudflare account, and the README names no hosted EmDash service, so no hosted option is recorded. The homepage playground is a sandbox, not a hosted service of the project, and is not recorded. The docs name a built-in MCP server and a CLI; neither is a field in the schema, so they are not recorded. The authentication guide names passkeys as the default login and GitHub, Google, Microsoft and Atmosphere as login providers; the preview guide describes signed preview URLs for unpublished content, not live editing, so livePreview is not recorded. The x link is read from the homepage markup and has no readable text. The Node.js deployment page names 22.23.4 or higher and says 22.16.0 is enough on Astro 7.3 or earlier, and the npm engines field says 22.16; runtimeMin records the major, 22.
