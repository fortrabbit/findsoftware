notes: >
  The homepage is the project's GitHub Pages docs site, read over https: the home page, getting-started, configuration and commands pages. The CSV row lists the site over http; the https address answers 200, so it is the homepage. The maintainer is the NOTICE copyright holder, "The respective authors and developers"; the GitHub organization is named Kobo project and no page names a legal entity. Groovy is the language the tool is written in and the README calls it the base of the tool; no basedOn is recorded because it is a language, not a framework or CMS. The docs name no minimum Java version: they say a Java SE installation is needed and Groovy is bundled. The first release is the oldest GitHub release (v0.3, 2013-09-30); the highest stable release is v1.3 (2022-12-15), the latest GitHub release. The npm package named gaiden is unrelated to this project and is not recorded. The docs describe the build output as HTML pages and static resources, and a dist command zips the HTML files. The category docs-generator in the CSV maps to ssg. The Gradle build also builds a Docker image, which the docs do not mention. The docs say a project has two configuration files, config.groovy for settings and pages.groovy for the list of pages, and that the Gaiden Wrapper downloads Gaiden automatically when a command is first run through it.
