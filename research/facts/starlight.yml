notes: >
  Starlight is an Astro integration, not a standalone tool: it runs inside an Astro project, so build command, output directory, Node.js minimum and deploy hosts are Astro's (see astro.yml) and the Starlight docs do not restate them; astroMin is a coined field for the Astro peer dependency range of the latest release. The site credits "Astro" without a legal name; astro.yml records The Astro Technology Company joining Cloudflare in 2026, which Starlight's pages do not mention, so parent is left absent here. Versions are still 0.x. pluginCount is the number of external links in the Plugins section of the plugins page, counted from the page HTML, excluding the separate community tools list. No Wikidata item found for the docs theme. Coined fields: astroMin, search (built-in site search), contentFormats, officialPlugins, themeDirectory. contributors is the GitHub API count including anonymous contributors. Boundary to consider: a theme for another framework may fit better as a related entry of Astro than as its own record.
