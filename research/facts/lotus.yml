notes: >
  Accepted on criterion 1 as a billing service a SaaS app wires into its backend: the getting-started page says "In the app's backend, add event tracking with the Lotus SDK or API" and shows API calls that create customers and subscribe them to plans. The project site and docs site are unreadable here, so the docs field points at the docs source in the repository (docs/overview/self-hosting.mdx and getting-started.mdx). Last GitHub release 0.10.2 is dated 2023-03-23; the repository has commits after that date, which is no end signal, and no page says the project has ended; the record stays accepted for the reviewer to confirm. The README calls self-hosting "currently the only version". The README names a Slack community (join.slack.com/t/lotus-community) and Django, Celery, Redpanda, Redis and Go microservices as the tech stack; Django is not recorded as basedOn because the README does not say the project is based on it. The Dockerfile in backend uses python:3.9, a build detail of the Docker install, so no runtimeMin is recorded. The docs' footer socials also list LinkedIn (company/uselotusio). The LICENSE copyright line names "Lotus Tech Co."; no page gives its country. Coined fields: none.
