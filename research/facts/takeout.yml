notes: >
  Takeout has no website of its own; the repository README is its documentation, so no homepage is recorded. The Docker image tighten/takeout on Docker Hub is the recommended route and its image publishing is in the repository, but no Docker Hub figure is recorded. The Composer package tightenco/takeout is the registry package the README names for the PHP route, so packagistName is that package; its total is 21142 downloads on the Packagist page read 2026-10-28, and monthly is 28. The Packagist p2 record lists the latest version v3.2.1 (2026-01-29) with require php ^8.2 and license MIT. The README says the PHP route supports only the current major version of PHP, and the Composer example pins the 2.9 line, so the composer route is not the current major. The first GitHub release is v1.0.0 (2020-08-26). The tool is described as a Docker-based development-only dependency manager; the README's "CLI tool" sentence is the quoted runsAs source. The README lists macOS, Linux, Windows 10 and WSL2 as supported platforms and recommends the Docker image through a shell alias. The README says deleting a container, which it calls disabling a service, leaves its data in a Docker volume, and it uses Meilisearch and Redis as examples of services. The Docker alias pulls tighten/takeout:latest. The README names Laravel Valet as a tool it is meant to be paired with; that is a pairing, not a basis, so basedOn stays unknown. The copyright line names "Tighten Co." and the Tighten website footer reads "©2026 Tighten Co"; no page read names a country or a legal form, so hqCountry stays unknown. The repository is not archived and its last push is 2026-04-09.
