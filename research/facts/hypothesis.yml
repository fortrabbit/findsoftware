notes: >
  Boundary: none; accepted as a testing library, matching the CSV row. The repository is a monorepo: the Python package sits in the hypothesis folder beside tooling, docs, benchmarks and a Rust folder, so stars and contributors belong to the repository, and the registry figures come from the hypothesis package on PyPI. The README gives "pip install hypothesis" under its Installation heading, which is the installMethod quote. The docs community page names a Stack Overflow tag (python-hypothesis) and a mailing list for questions; the mailing list is recorded as forum. The license is MPL-2.0 in the package pyproject at the latest release tag and in the LICENSE.txt, which says some code "comes from other projects" and is "dual licensed with the original license"; the GitHub API reports NOASSERTION, and the PyPI metadata has no license field. The LICENSE.txt copyright line names David R. MacIver (2013); the PyPI author field also names Zac Hatfield-Dodds, kept here only in notes. The PyPI classifiers list a pytest framework; the project does not say it is built on pytest, so basedOn stays out. firstRelease is the 2013 upload of 0.0.1 on PyPI, older than the first GitHub tag from 2018. currentMajor and latestReleaseDate follow the GitHub release v6.170.15 from 2026-11-06. The README says Hypothesis chooses inputs from the declared range, including edge cases the developer might not have thought about, and reports the simplest possible failing case. Coined kinds (strategies, stateful tests, health checks, the example database) stay in notes.
