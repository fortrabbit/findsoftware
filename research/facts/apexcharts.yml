notes: >
  The oldest npm upload of the apexcharts package is 1.0.0 (2018-07-23), older than the first GitHub release (2019), which sets firstRelease. The homepage footer links an X account and a Facebook page. ApexCharts is one of several Apex products; the charting library is the apexcharts.js repository and the npm package apexcharts, and the other products (ApexGrid, ApexMaps, ApexGantt, ApexTree, ApexSankey, ApexStock) are separate and not recorded. The license is dual: the LICENSE.md file sets a Community License that is free only to organizations under USD 2 million in annual revenue, budget or funding, and a Commercial License for the paid SKUs; both statements are recorded as license entries and the model is derived from them. The paid SKUs are Pro, Premium and OEM, named on the license file; no prices are recorded. GitHub detects no license for the repository, so the LICENSE.md text is the source. The legal name comes from the terms page, which names Apex Software, Inc. as the provider and Infragistics, Inc. as its parent; the terms give one address, 2 Commerce Drive, Cranbury, NJ 08512, for Infragistics, Inc. and Apex Software, Inc. together, so no hqCountry is recorded and a reviewer decides whether the address belongs to the maintainer. The installation page lists the default bundle, the apexcharts/full bundle and per-feature entry points; the server rendering page describes apexcharts/ssr, which runs in Node.js and in the browser, and the browser build apexcharts/client; no page in the record states that the default bundle runs only in the browser, so no runtime or runsAs is recorded. The rendering target is SVG, with a canvas renderer option on some charts; the homepage states the framework bindings (React, Vue, Angular, vanilla JavaScript) and the community wrappers are separate repositories. TypeScript definitions ship with the package per the server rendering page. The homepage states 8M+ npm downloads per month and 238k+ dependent repositories; those are the project's own figures without a date and are not recorded as fields.
