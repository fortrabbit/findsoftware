notes: >
  Open source code line of Movable Type, published from the movabletype/movabletype repository. The CSV marked it as a boundary; it is accepted here because the repository holds the source, the installation guide on movabletype.org names "Movable Type Open Source" as a download, and the repository is public. Two license statements were found and recorded as the files word them. The repository has no LICENSE file on develop or at the mt9.3.0 tag, and GitHub reports no license (api license field is null). The mt.cgi header says "This code cannot be redistributed without permission from www.sixapart.com." and the POD in lib/MT.pm says "The license that applies is the one you agreed to when downloading Movable Type." Both give value custom, which the import reads as a restricted license; the record therefore reads as source-available, not open source. The homepage is not linked: https://www.movabletype.org/ is the product site of the commercial Movable Type, shared with the movable-type record, and the repository is the project's own source. The default branch is develop. The tags listing has no GitHub release objects; the highest stable tag is mt9.3.0 (the mt-6.8.1, mt-7.8.0 and mtpa tags belong to earlier lines), so currentMajor is 9 and latestReleaseDate is the committer date of the mt9.3.0 tag commit (2026-09-25). firstRelease is the year the product site states Movable Type was launched; the oldest tag in the repository is mt3.31 (annotated 2006-07-15). The develop README names Perl 5.16.3 or greater and MySQL as the example database; other databases and the MT 9 feature set are not stated by a page of this record, so they are left out. The installation guide is cited only for the line that names this code as a download. hqCountry is that of Six Apart, from the product site's about page.
