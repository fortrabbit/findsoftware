notes: "Facts come from the French project page, the README and the English installation docs on the elche branch. The repository default branch is master/elche, GitHub reports no license for it and the LICENSE file is absent there; the license comes from the README and the page. Core source headers read '@copyright 2011 Novius' and novius.com is a separate company site whose legal notice names the company without a legal form, so the maintainer is recorded as Novius, as the source header states it. The README names 5.0.1 (Elche) as current and the latest release is from 2014; no ended signal was found, so status stays accepted. The 'Novius OS' repository was created 2011 and the API reports a last push in 2018. No maximum PHP version is stated."
