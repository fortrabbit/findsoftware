notes: >
  The homepage, docs and PRO page answered 200 on the second pass; the install routes come from the README and the repository's docs/getting-started.md. The README and the getting-started guide also show script tags with CDN links (cdnjs, unpkg, jsdelivr) under a heading only, with no sentence naming the route, so CDN is left out as an installMethod; yarn is the npm registry and is not a separate route. The README gives a browser support list and no sentence saying where the editor runs, so no runtime or runsAs is recorded. The README's PRO paragraph names premium plugins: Finder file manager, PDF and Word export, @mentions and an AI Assistant, sold under a one-time commercial license. The README names a separate PHP connector (xdan/jodit-connectors) for testing the file browser and uploader. The LICENSE.txt copyright line names the site xdsoft.net, which is the recorded maintainer; the package.json author is Chupurnov, the site's license page names the same person as the copyright holder of the MIT core, and the privacy policy says the website and the Jodit products are operated by Individual Entrepreneur Adelia Chupurnova (XDSoft), Tbilisi, Georgia, which gives hqCountry. firstRelease is 2016 from the npm upload 1.0.1, whose repository field is xdan/jodit. The vs pages on xdsoft.net also compare TinyMCE and Quill, which have no record id here, and show a review-site rating that is not recorded. Stars and contributors belong to the single repository. The npm figure counts the jodit package, not the jodit-react wrapper.
