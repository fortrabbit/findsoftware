notes: >
  Boundary row in the candidates CSV (no versioned release): the repository has no GitHub release, no tag and no registry package, so the project is judged by its last commit, which is recorded as lastCommitDate. The repository's LICENSE.md is a custom "Float UI licensing model", and the same terms are on floatui.com/license: it permits unlimited End Products, including sold ones and ones for clients, and forbids building tools that let End Users make their own End Products, distributing the Components on their own either as code or design assets, and distributing themes, templates or starter kits made from them. The README and the homepage call the project fully free and open source; both statements are recorded as licenses. The homepage offers a sponsorship, not a paid edition, and the license page mentions team and other license tiers without a page describing them, so no paidEdition is recorded. The README says the components are for React and Vue "soon"; the homepage tabs also show HTML and Svelte snippets. GitHub's language split puts MDX first; the components are JavaScript. The maintainer is the MarsX organization on GitHub; marsx.dev gives no legal form.
