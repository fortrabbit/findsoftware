notes: >
  Repo-only project: crates.io lists no homepage and the README names none, so homepage is absent; the demos are on the maintainer's GitHub Pages and are not the project's site. Sauron is said to be inspired by elm-lang and to follow The Elm Architecture; that is a design lineage, so no basedOn is recorded. The README and getting-started guide show sauron = "0.61.0" and "0.60.0" in their Cargo.toml examples while the crate is at 0.70.0; the examples are stale and no version is recorded from them. GitHub's latest stable release is 0.40.0 (2021-08-15), but the crate has been published since then up to 0.70.0 (2025-01-27), and the tags run past the releases, so latestReleaseDate comes from crates.io and the GitHub release count is not used for it. The crate and the LICENSE file both say MIT. The README says a sauron application has only a model, a view and an update function; the getting-started guide builds a page that displays the text hello and serves the output with basic-http-server, which it describes as serving static files locally. The browser runtime is the WebAssembly build loaded by a page, so runtime records the Rust language only.
