notes: >
  The installation page at ui.vuestic.dev/getting-started/installation is server-rendered and readable; it names three routes, create-vuestic (npm create vuestic@latest, which scaffolds Vuestic Admin, create-vue or Nuxt projects), the manual npm install, and the Nuxt integration page. The npm package named in the manual route is vuestic-ui, the core package, so the figures are its own. firstRelease is the oldest npm upload of vuestic-ui, 0.1.0-alpha.1 from 2019-03-17; its package contains the va-button components and Epicmax test files, so it belongs to this project, and it predates the GitHub repository (created 2019-08-03). The project site says "It was initially released in May 2021 by Epicmax", which differs from the npm history and is not recorded as a fact. The GitHub releases run from v1.1.0 (2021-06-11) to v1.10.3 (2024-10-17), the latest stable, which falls inside the four years. The npm next tag builds (1.10.4-next-<commit>-<date>, last 2025-08-25) are commit snapshots, not prereleases, so no latestPrereleaseDate is recorded. The footer of epicmax.co reads "© 2026 Epicmax" with no legal form, so the maintainer is recorded as the LICENSE states it. The installation page states Node.js (>=v14.0.0) as a prerequisite; no runtime is recorded because it is a build prerequisite of the library, not a runtime the site needs. The README links a paid consulting service, which is not an edition and is not recorded. The README and homepage name Vuestic Admin as built on this library; that is a separate candidate and is not recorded here.
