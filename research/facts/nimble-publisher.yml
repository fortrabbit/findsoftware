notes: >
  The repository has no LICENSE file, so the GitHub license field is null; the license is recorded from mix.exs and the Hex package, both stating Apache-2.0. The repository has no GitHub release, only tags (v0.1.0 to v2.1.0), so currentMajor and latestReleaseDate come from the Hex package, whose latest stable version is 2.1.0. No homepage: the project names only its repository and its hexdocs page. The maintainer is the owner organization, whose GitHub profile name is Dashbit and links dashbit.co; no page states a legal form or names this project as one Dashbit maintains. runsAs is not recorded: the README only shows the dependency with runtime: false. mix.exs requires Elixir "~> 1.16", which is a repository file and not a page or registry statement, so runtimeMin is not recorded. The Hex download figure is the all-time total; the same API gives 9413 for the last week. The README says Markdown files are converted to HTML with MDExNative; that dependency is not recorded as a field.
