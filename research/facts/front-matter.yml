notes: >
  The candidate row lists https://frontmatter.codes, which answers over https and is recorded as homepage. The homepage carries a banner saying the page is the beta version of the documentation with a link to the main release documentation; the docs path used here is the getting-started page, which describes the stable marketplace install and a beta install alongside it. The extension is a Visual Studio Code extension, so it is installed in the editor and runs on the developer's machine (runsAs local); no runtime is recorded because the pages name Visual Studio Code, not a language runtime, and the package.json engines field (vscode ^1.125.0) is an editor requirement. The README names Hugo, Jekyll, Hexo, Next.js and Gatsby as the generators it supports; these are not recorded as basedOn because the extension supports them rather than building on them. The README's 2026 priorities update says Front Matter CMS will continue to be maintained, that major changes will only happen with a personal reason, a company commitment or significant community support, and that feature requests may take longer; it is no end signal. The sponsor link is GitHub Sponsors. The Marketplace install total comes from the extension page statistics and is recorded as reportedInstalls; no ratings are recorded. livePreview stays out: the site preview page describes a view of the running site that opens inside the editor once frontMatter.preview.host is set, and no page read says it shows unsaved edits (https://frontmatter.codes/docs/site-preview). The highest stable GitHub release is v10.13.0 (2026-10-12); the release list has no prereleases. The oldest GitHub release is v1.15.0 (2021-05-04), but CHANGELOG.md starts at 0.0.1 on 2019-08-26, which is the firstRelease year.
