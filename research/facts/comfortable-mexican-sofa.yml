notes: >
  The repository has no homepage, so none is recorded. The README and LICENSE name Oleg Khabarov as the copyright holder for 2010-2019. The highest stable GitHub release is v2.0.19 (2019-12-31), which matches the RubyGems version; the README says the CHANGELOG lives in the GitHub releases. The RubyGems upload history begins with version 0.0.18 dated 2009-10-14, which predates the GitHub repository (created 2010-11-29), so firstRelease 2009 rests on a registry date that a reviewer should confirm. The README's Rails 5.2+ requirement is recorded in the description and basedOn, and no Ruby minimum is stated, so runtimeMin is unknown. The gem's RubyGems metadata has no required Ruby version. The repository is not archived and states no end; its newest release is from 2019 and the newest commit on master is from 2020, so the import's release-age rule decides listing. The README names a Gitter room and the maintainer's personal Twitter account, neither recorded.
  The README describes drop-in gem integration with minimal configuration; a site with a hostname, content path and language; layouts with content tags such as text and wysiwyg; comfy_route entries for the admin area and content; images resized through ActiveStorage with ImageMagick; pagination through Kaminari or will_paginate; older Rails versions on separate branches and older gem versions; and a changelog kept in the GitHub releases.
