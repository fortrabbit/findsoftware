notes: >
  Monorepo: the repository holds three gems, elasticsearch-model, elasticsearch-persistence and elasticsearch-rails. This record is the elasticsearch-rails gem, the one the README names for Rails; its rubygems and ecosyste.ms figures are for that gem. The README says the Elasticsearch client and Ruby API come from the elasticsearch-ruby project; that is a dependency statement, not a successor. The gemspec at v8.0.1 lists the authors as "Elastic Client Library Maintainers" and the homepage as the Elastic Rails docs page; the legal name Elasticsearch B.V. comes from the license text. The README says the libraries follow the Elasticsearch major versions, so the major 8 matches the Elasticsearch 8.x line. The README says the libraries are compatible with Ruby 3.0 and higher, and the gemspec at v8.0.1 states required_ruby_version '>= 3'; the record uses the gemspec. The README lists Rails application templates for generating an example app and says an Elasticsearch cluster is needed to run them; no runsAs is recorded, since no page states where the library runs in production. The GitHub repository has releases from several gems in one list, including prereleases; the registry starts with version 0.0.0 uploaded 2013-09-25. The rubygems downloads figure is the all-time total. The release date 2025-09-01 is the rubygems and GitHub date for 8.0.1. The repository's last push is 2025-10-08, and the README points to the Elastic support lifecycle page for version support, not to an end of the project.
