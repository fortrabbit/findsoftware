notes: >
  Three end signals agree with the status: the GitHub repository koseven/koseven is archived (api), the Packagist package is abandoned (api), and the README reads "Project Status: Archived" and says no development or security fixes are guaranteed. The homepage koseven.dev still loads and says "Successor of the Kohana Framework - fully compatible with PHP7+" and "Maintained with from our contributors"; that contradicts the README and is kept as homepage under the decision on this candidate, with the README treated as the stronger statement. The homepage is recorded as successorOf Kohana; the GitHub description calls the project a fork of Kohana, recorded as forkOf. basedOn is left out because forkOf states the parent; reviewer to decide. GitHub reports the license as NOASSERTION because LICENSE.md is a custom agreement; the BSD-3-Clause statement comes from composer.json at tag 3.3.10 and LICENSE.md is named "Koseven License Agreement". Maintainer is "Koseven Team" as LICENSE.md states it; composer.json also lists a "Kohana Team" author, not recorded. The Packagist figures are for koseven/koseven, the package the composer.json at the repository declares; the install docs name git clone, not Composer. Two packagistDownloads entries: 144703 is the all-time total and 3838 is the monthly figure, both as Packagist states them. contributors is 33 counted from the rel="last" page of the contributors endpoint without anon=true. firstRelease 2017 is from the oldest non-prerelease GitHub release, 3.3.6 (2017-01-10). The homepage links a Telegram group (telegram.me/koseven); no field in the starter list covers it, so it is not recorded. The modules page lists third-party modules without a total, so pluginCount is unknown. The start page has the web server's document root on the public folder with index.php answering requests, recorded as per-request. The homepage line on translation tools is recorded as i18n. endoflife.date has no entry for koseven or kohana (404), so endoflifeId is unknown.
