notes: >
  The maintainer is the copyright holder named in the appendix of the Apache-2.0 LICENSE; the docs footer reads "Kong, Inc.". The README says swrv is largely a port of swr, the React library, and its FAQ compares the two, so swr is recorded as an alternative; the project does not say fork or based on. The README says Vue 2 reached end of life on 31 December 2023 and that swrv no longer supports it; the last Vue 2 releases stay installable under the v2-latest and legacy tags (0.10.0 and 0.9.6). Server-side rendering was removed in 0.10.0. The stars, contributors and dependents are the repository's; the npm figure is the sum of daily downloads from 2026-11-01 to 2026-11-07. The first GitHub release is v0.1.1 from 2020-02-16 and the npm package was created 2020-01-27, so firstRelease is 2020 either way.
