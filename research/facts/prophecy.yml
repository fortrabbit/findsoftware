notes: >
  Status accepted from the CSV. Criterion 4: the repository is not archived, the Packagist package is not abandoned, and the newest stable release is 1.26.1 (2026-04-13, from the Packagist p2 metadata and the v1.26.1 tag). GitHub has no release object for 1.26.1; the highest GitHub release is v1.26.0 (2026-02-24), which has the same major. Criterion 3: the README's "Setup through composer" section gives the Composer route under require-dev. The README says "Prophecy requires PHP 7.2.0 or greater", which conflicts with the 1.26.1 composer.json (8.2 to 8.5); runtimeMin follows the manifest, and the README statement is not recorded. No homepage: the composer.json homepage and the repository description point to the GitHub repository only. The README says Prophecy was "initially" created "to fulfil phpspec2 needs" and can be used "inside any testing framework"; the phpspec record links it as a companion, which is not basedOn. The LICENSE copyright lines name two people (Konstantin Kudryashov and Marcello Duarte, 2013) and the composer.json authors are the same two; the maintainer is recorded as those two people, as the LICENSE copyright line names them; the GitHub owner is the phpspec organization. The README FAQ says Prophecy does not support calling the original methods on a prophesized class, and the README contrasts how PHPUnit or Mockery use call counts with Prophecy promises, which is not an alternativeTo statement. No runsAs: the README shows require-dev and does not say the package is for local development. Tags run from v1.0.0-BETA1 (2013-03-25), which sets firstRelease. The Packagist total download figure is cumulative since listing.
