notes: >
  Discontinued on the README: the default branch opens with "# DEPRECATED" and the repository description reads "DEPRECATED - Dependency-free notification library". The npm package is marked deprecated on its dist-tag: latest points to 3.2.0-beta-deprecated, whose deprecation message reads "no longer supported" (registry.npmjs.org/noty). The npm package named noty is this project's package; the install docs name npm, yarn, Composer and Bower. Highest stable version is 3.1.4 (release object of 2017-12-13); the release object v3.2.0-beta (2017-12-21) is a beta and is recorded as latestPrereleaseDate; the GitHub API flags it as not a prerelease, which the name contradicts. The npm dist-tag 3.2.0-beta-deprecated was published 2021-02-15. firstRelease 2012 comes from tag v1.0.0 (commit 2012-04-05), older than the first release object of 2013. Composer is listed in the install docs as composer require needim/noty; no Packagist figure is recorded. Stars and npm figures are adoption data only. The docs site at ned.im is a docsify page whose content comes from the repository docs folder; the page itself states the description quoted under homepage. The README feature list names named queues, eleven layouts, custom containers for inline notifications, progress bars for timed notifications, callbacks, and Web Push notifications with Service Worker support. The npm latest dist-tag points to 3.2.0-beta-deprecated, published 2021-02-15, a deprecation republish of the beta; latestReleaseDate stays on the last stable release.
