notes: >
  Shopware 5 has its own repository (shopware5/shopware, default branch 5.7) and its own record; the existing shopware.yml covers Shopware 6 at shopware/shopware. The status fact is the README statement that the repository "is no longer actively monitored or maintained"; every 5.x cycle on endoflife.date is also past end of life (5.7 on 2024-07-31, the latest 5.7.20 released 2025-06-05), and endoflifeId is not recorded because the shopware id there covers 6.x too. The Shopware developer portal states that the official Shopware 5 documentation is now continued by SafeFive, a continuation that is kept here in notes and not recorded as a status. The homepage is not recorded: shopware.com no longer shows Shopware 5, only a "Shopware 5 to Shopware 6" migration topic. The README links the user documentation at docs.shopware.com/en/shopware-5-en, which redirects to docs.shopware.com/en/shopware-5/ and answers 410 Gone, so docs is unknown; the developer documentation at developer.shopware.com/shopware-5 answers 200 as the SafeFive continuation page. The README links the Shopware Store (store.shopware.com), which still carries a Shopware 5 category, so pluginDirectory is recorded. The maintainer shopware AG is taken from the copyright line in the shopware.com footer. The README names a fork, Safefive's Shopware 5 with ongoing infrastructure compatibility updates (github.com/safefive/shopware); it is not recorded as forkOf because the Shopware 5 repository does not name it as its own fork. No successorOf is recorded: no page of this repository names Shopware 6 as a successor, and the Shopware home page links "Shopware 5 to Shopware 6" as a migration topic only. The licence statements disagree: the README states GPL v3 in its header and AGPL v3 under "Copying / License", license.txt says GNU General Public License 3, and composer.json lists AGPL-3.0; each README and license.txt statement is its own entry. The Packagist package also lists a "proprietary" value with no page behind it, which is not recorded. The README lists the Apache, MySQL 5.7 and PHP 7.4 requirements; the "Based on technologies like" sentence names Symfony 4, Doctrine 2 and Zend Framework, and none is recorded as basedOn because the sentence lists technologies the software is based on rather than naming a parent project. The backend login and demo data in the README are not recorded.
