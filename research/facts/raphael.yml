notes: >
  Status accepted from the candidate row. The newest stable release is v2.3.0 (2019-08-14), so the import will move this record to stub unless a newer release appears. The repository was last pushed 2024-01-12, and its default branch is master. The GitHub repository has no LICENSE file: the license text is license.txt, copyright 2008-2010 Dmitry Baranovskiy. The README copyright reads 2008-2013 and adds Sencha Labs; the homepage footer says "Part of Sencha Labs" and the README "Copyright and license" section names Sencha Labs (sencha.com) as a copyright holder. These are older statements and no parent is recorded. The npm package raphael is the repository's own package.json (name raphael, version 2.3.0, same as the latest GitHub release); the README and homepage name no npm install route, and the npm figure counts that package. The homepage states the browser support list (Firefox 3.0+, Safari 3.0+, Chrome 5.0+, Opera 9.5+, Internet Explorer 6.0+), which is compatibility and not recorded as a field. The README names eve as a dependency and includes it in raphael.min.js; no basedOn statement. The README "Related Projects" list (graphael, raphael.boilerplate, backbone.raphael, mapael, snap, react-raphael) names no alternative or successor in the project's own words. The earliest tag is v1.2.9 (commit date 2009-12-17), before the npm upload of 2011 and the GitHub releases from 2016. Contributors counts the contributors endpoint with per_page=1, read from the rel="last" link (36). Stars belong to the repository.
