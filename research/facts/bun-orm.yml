notes: >
  The project's own name is "Bun" (README title "Bun: SQL-first Golang ORM"); the same name belongs to the JavaScript runtime record bun, so a reviewer should decide whether the display name needs a qualifier such as "Bun ORM". The Go module has no registry download figure, so no registry field is recorded. The repository is a single Go module, github.com/uptrace/bun; the README's driver table names the Oracle driver go-ora as a separate module, which is not recorded as a fact. The go.mod at v1.3.0 declares go 1.24.0 with toolchain go1.24.1; runtimeMin is recorded from the go line, and runtime is go, from the README sentence naming it a Golang ORM. The homepage is bun.uptrace.dev, the project's own documentation site, which the README links as its documentation. The README's getting-started link (bun.uptrace.dev/guide/golang-orm.html) returned a 468-byte response, so the guide index is cited as docs and carries no quote. The Discord invite is quoted from the README badge markup; the README lists GitHub Discussions as its community channel, recorded as forum. The LICENSE is BSD 2-clause; the GitHub API reports BSD-2-Clause. The repository is owned by the uptrace organization, which also runs the Uptrace product; the maintainer follows the LICENSE copyright line. The GitHub tag list includes submodule tags such as dbfixture/v0.1.8, which are separate modules and not used for the release line. The Go proxy lists v0.1.0 at 2021-05-18, which is the earliest version, so firstRelease is 2021. The highest stable GitHub release is v1.3.0 (2026-10-03), so currentMajor is 1.
