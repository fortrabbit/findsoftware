notes: >
  The homepage says "Server components, client components, streaming SSR, React Native, all one API." The homepage code examples write the styles as tagged template literals on styled elements. The README says "styled-components is largely maintained by one person" and asks for funding through Open Collective; the maintainer field follows the LICENSE copyright line, which names two people. The homepage links the X account twitter.com/quantizor; it is not recorded as the project's account because the sources read do not state that it is. The latest stable release is 6.6.0; the 7.0.0 line appears only as prerelease tags, and latestPrereleaseDate is the newest of them, published on 2026-10-19. The tag is named prerelease by GitHub and the tag name carries the word prerelease; it is not a canary. The homepage's Latest Post, Ecosystem and Donate links are not recorded. firstRelease is the oldest stable release in the repository, v1.0.4, from 2016.
