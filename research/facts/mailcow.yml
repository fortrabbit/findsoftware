notes: >
  Doubt: the boundary wiring test (an SMTP relay an app or website sends to) is not settled. The Unauthenticated Relaying guide (docs.mailcow.email/manual-guides/Postfix/u_e-postfix-unauthenticated-relaying/) says registered hosts or subnets may send mail without authentication and names "monitoring e-mails ... sent from Linux servers in the same network"; it names servers, not apps or websites. What would settle it: a mailcow page stating that websites or applications submit mail through its SMTP server. The docs also describe App Passwords for external mail clients, which are not apps. Stub until a reviewer decides. The README wording "Any part of mailcow itself is released under GNU General Public License, Version 3" is the same license as the GPL-3.0 entry. firstRelease is the oldest GitHub release (2022-01); the tag list starts there. The docs name PHP as the language of most web-based mailcow applications, so no language is recorded for the whole project. The docs list imapsync for migrating or retrieving remote mailboxes; no other software is named as an import source. Calendar release "2026-10" gives no currentMajor. The homepage's Mooctober 2026 post and the GitHub release 2026-10 are the same release. No runsAs is recorded: the docs call it an "e-mail server" in the introduction, which is not a daemon statement. The Docker Hub count is not recorded because the install docs name a git clone and a set of images, not one image. The maintainer is The Infrastructure Company GmbH per the imprint; mailcow is a registered word mark of that company.
