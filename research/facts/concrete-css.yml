notes: >
  The npm package concrete.css is the one the install page names; the npm version 3.1.0 has a tag and a registry upload on 2025-03-15 but no GitHub release object, so latestReleaseDate comes from npm and currentMajor from the GitHub release v3.0.0 (2024-04-12), both major 3. The homepage says it is "Inspired by Milligram and Skeleton"; that is an inspiration, not a parent, so basedOn is not recorded. The homepage's CDN link carries a version number; it is not recorded. The repository's Related projects list names forks, which are not records. The npm first version 0.0.1 and the repository creation date both fall in 2019. Contributors counts accounts from the API list with per_page=1 without anonymous accounts, read from the Link header. The GitHub repository has no separate documentation site; the homepage doubles as the reading page.
  The README says it switches to a dark theme if the operating system uses one, and that it is inspired by Milligram and Skeleton.
