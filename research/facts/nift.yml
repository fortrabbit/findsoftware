notes: >
  The CSV row points at nifty-site-manager/nsm (last release v3.0.3, 2024-01-13, not archived). The homepage JSON-LD and the installer name github.com/nift-dev/nift as the code repository, so the record uses nift-dev/nift; reviewer to decide whether the CSV row changes. nift-dev/nift was created 2026-08-14 and its first release is v4.0.0 (2026-08-16). firstRelease is the oldest GitHub release of nift-dev/nift (v4.0.0, 2026-08-16). The earlier nifty-site-manager/nsm repository (releases from 2019) is not recorded as part of this project, because no nift.dev page states that Nift continues it; the homepage logo alt text reads "Nift — nifty-site-manager" only. githubStargazers and contributors cover nift-dev/nift only; nsm had 251 stars when the CSV row was written. No legal entity is named on nift.dev or in the LICENSE, so the maintainer is the MIT copyright holder, Nicholas Ham, without a legal form. The docs describe ordinary HTML, CSS and JavaScript output and say the production server does not have to run Nift; no always-on process is documented. The Snap, Flatpak, Homebrew, Chocolatey and FreeBSD channels are recorded as install methods only; the installing page says these channels can lag the GitHub release. The about page presents Nift as a website build system with a native scripting language and an interactive shell. The hosting page names platform targets for Vercel, Netlify, AWS Amplify, Azure, Firebase, Render, Cloudflare, GitHub Pages and Supabase. The migrations page describes an agent-assisted workflow, not an importer, so no importsFrom is recorded.
