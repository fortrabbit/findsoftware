notes: >
  The record is named after the project's own site, wsrv.nl; the repository is weserv/images and its README title uses that name. Accepted: the public service is the same code (the README says "Source code of wsrv.nl ... to be used on your own server(s)"), and the Docker instructions build or pull the container for a self-hosted server. The repository is not archived, its default branch is 5.x, and the last commit is 2026-11-01. The only tags are v5.0.0 and v5.1.x; no GitHub releases exist. The CHANGELOG headings say "started" with dates that differ from the tag commit dates (5.0.0 started 2019-02-07 in the changelog, while the tag commit is 2019-09-01); latestReleaseDate is taken from the v5.1.2 tag commit (2026-11-01) and the changelog heading gives 2026-10-01. firstRelease is 2007 from the 1.0.0 changelog heading, older than any tag. The image is published on GitHub Container Registry, not Docker Hub, so no pull figure is recorded. The docs list input formats (JPEG, PNG, BMP, GIF, TIFF, WebP, PDF, SVG, and others through libMagick), output formats (jpg, jxl, png, gif, tiff, webp, json), and parameters for size, fit, crop, mask, orientation, adjustment, format and cache lifetime; these are notes, not fields. The docs name libvips as the image library and the CHANGELOG says it requires libvips 8.13 or newer, a build requirement, so no runtimeMin. The docs show no URL signing parameter. No page states the process or binary the server is compiled to, so no runtime is recorded and hosting follows the Docker route. The public service runs behind Cloudflare, with an origin domain filter through OpenDNS, a rate limit per visitor IP, Valkey for rate limiting (README) and a 7-day log retention in the privacy policy; these describe the hosted service and are not statements about a self-hosted install. The FAQ says the service is free and privately funded since 2011, and that the code can be run on your own server without its filtering and limits. The homepage's figure of 20 million images per hour is traffic, not a count of sites or installs, so reportedInstalls is not recorded. The LICENSE copyright line names two people; no legal entity, address or country is stated, and the FAQ names servers near Helsinki and Falkenstein, which are server locations, not a headquarters. The homepage names Cloudflare and the README names nginx and libvips as the stack.
