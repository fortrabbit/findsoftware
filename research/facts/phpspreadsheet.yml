notes: >
  Status accepted. Criterion 1: a library a site or app calls to read and write spreadsheet files, such as exports and uploads. Criterion 2: installed with Composer from Packagist (phpoffice/phpspreadsheet), the route the install docs name. Criterion 3: the install section of the documentation gives the composer command. Criterion 4: the repository is not archived; the latest stable release is 5.11.0 (2026-11-08), and no prerelease is newer. The README says PhpSpreadsheet is the next version of PHPExcel, which is no longer maintained, and links an automated migration tool from PHPExcel; PHPExcel has no record, so importsFrom and successorOf are not recorded. The repository also carries a tag phpexcel-last-release-1.8.1 (2015-05-01), which is PHPExcel's last release imported into this repository; the oldest tag of PhpSpreadsheet itself is 1.0.0-beta (2017-08-17), so firstRelease is 2017. The LICENSE file names PhpSpreadsheet Authors; the README's Patreon for articles is run by Mark Baker, and composer.json lists Maarten Balliauw first among its authors; the maintainer follows the LICENSE line. The README links a Gitter chat room and Stack Overflow for support questions; neither is a field. The Patreon supports articles and is not a paidEdition or a sponsor record. The file format table on the docs homepage (ODS, XLSX, XLS, XML Spreadsheet, Gnumeric, HTML, SYLK, CSV, PDF writing through TCPDF, Dompdf or mPDF, which the docs say are installed separately) is a coined kind and stays in notes. The recipes page documents a locale setting that translates formula function names, constants, error messages and argument separators, recorded as i18n. The Packagist total download figure is cumulative since listing and is taken from phpoffice/phpspreadsheet, the package the install docs name. Stars and contributors belong to the single repository.
