notes: >
  The homepage is the Read the Docs stable page; the GitHub homepage field points to factoryboy.readthedocs.io, which redirects to /en/stable/. The repository has no GitHub release objects: its tags run to 3.3.3 (2025-02-03), the same date as the PyPI upload of 3.3.3, so latestReleaseDate and currentMajor come from those. firstRelease is 2010 from the PyPI 1.0.0 upload (2010-08-22), older than the oldest git tag (v1.0.4, 2011). The Credits page (https://factoryboy.readthedocs.io/en/stable/credits.html) says the project "is operated and maintained by" Jeff Widman and Raphaël Barrois; the LICENSE copyright line names The FactoryBoy project, and that line is the recorded maintainer. The README says factory_boy is based on thoughtbot's factory_bot, a Ruby library; it is a Python library modeled on it, not built on it, so no basedOn (port ruling, as commonmark-php). The ORM integrations on the ORMs page are Django, Mogo, MongoEngine and SQLAlchemy; ORMs are not databases, so no databases field is recorded. The README also lists a source install (git clone and python setup.py install); only the PyPI route is recorded as installMethod. Faker is used for random values through factory.Faker: a dependency, not a basedOn. The mailing list (googlegroups) is the project's own list, not a forum, so no forum field. Python 3.8 is the requires_python minimum of the latest PyPI release; the ORM pages do not state a minimum.
