notes: >
  The root README.MD is a symlink to packages/tsoa/README.MD, and that file is the one read. The npm dist-tag latest points to 7.0.0-alpha.0, a prerelease, so the stable line is taken from GitHub: v6.6.0 (published 2024-12-08) is the newest stable release object and sets currentMajor, latestReleaseDate and runtimeMin. A tag v6.6.1 (committed 2025-01-27) has no GitHub release object and no npm version; a reviewer may decide whether it counts as the latest release. The 7.0.0-rc.0 release (2026-11-15) is the latestPrereleaseDate. runtime node comes from the main-branch README (Node.js 22.12 or later), while runtimeMin comes from the v6.6.0 manifest, which states node >=18.0.0. Routes are generated for Express, Hapi, Koa and Fastify, which the README names as supported middleware; tsoa is not built on any of them, so basedOn stays empty. The README asks for additional maintainers because of the number of pull requests and issues; that is a request for help, not an end statement. Stars and contributors are checked 2026-11-16.
