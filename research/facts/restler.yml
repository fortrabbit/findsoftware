notes: >
  The CSV homepage (http://luracast.com/products/restler/) answers with a redirect to https://www.luracast.com/restler/, which is recorded. The README names a LICENSE file that returns 404 at tag 6.0.3, so the MIT statements are cited to composer.json and the README. GitHub releases/latest returns 5.0.16 (published 2026-08-22); the stable major is 6 per Packagist, so latestReleaseDate is the 6.0.3 tag. The README dates production use to 2010 and the repository was created 2011; neither is a first-release year, so firstRelease stays unknown. The Packagist monthly figure is the luracast/restler package, the one the install command names. The contributor count is what the GitHub anonymous contributor list returns, and one of the two entries is named claude. The README documents an interactive API explorer and OpenAPI 3.0 output generated from PHPDoc; no dictionary field fits, so they are recorded here only. The always-on value comes from the Swoole/OpenSwoole section of the README, which names the swoole and openswoole PHP extensions as the server. The README lists Lambda deployment through Bref; runsAs is not extended to it because the page does not state how the Lambda process runs. The homepage links to Facebook, X and Instagram, but the fetched HTML carries no matching URLs, so no social handle is recorded.
