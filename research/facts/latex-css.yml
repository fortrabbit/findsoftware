notes: >
  The homepage and the README were read in full; the homepage carries the language section, the optional MathJax and Prism scripts, and the "May 2020" date. The README says optional classnames add special styles to elements such as the author subtitle, abstract, lemmas and theorems. The GitHub language label reads HTML because the repository ships the documentation page; the package the install docs name ships style.min.css, so language is CSS. The README says "This project is based on David Zollikofer's project latexCSS", so the parent is named by the project, but no record exists for latexCSS and basedOn takes record ids only; the repository is not a fork according to the API. The maintainer is named in the LICENSE copyright line; the homepage names the same author as the page's author. No legal entity or country is stated, so hqCountry is not recorded. The GitHub releases start with v1.0.1 on 2020-05-24, the same day as the npm package's first version. The npm figure is the sum of the range endpoint for 2026-10-18 to 2026-10-24. The CSV's "npm 150/wk" figure is out of date. The docs field points to the homepage, which is the documentation.
