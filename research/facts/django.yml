notes: >
  Django publishes no GitHub releases; latestVersion and its date come from PyPI, cross-checked against the download page. The download page announces a version scheme change: from Django 2028 every feature release gets three years of support and ships each January, replacing the LTS designation; both cadence statements are recorded. Third-party database backends (CockroachDB, SQL Server, MongoDB, Snowflake and others) are listed on the databases page but are not counted in `databases`. The foundation page names no country, so hqCountry stays unknown. Coined or reused beyond the starter list: `webServers` (servers with an official how-to guide), `pypiName`, `funding`; `pypiDownloads` takes the pypistats.org recent figures because PyPI's own JSON no longer carries download counts.
