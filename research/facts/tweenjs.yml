notes: >
  tween.js is an animation library for web pages, accepted under the animation group of the dev-libs rules. Its README uses Node.js only for the build from source and for the build tools that bundle it, and no sentence names the browser or Node.js as the library's runtime, so runtime and runsAs stay out. The LICENSE copyright line names "Tween.js authors" as the holder, which is the maintainer here; the README names Joe Pea (@trusktr) as the maintainer, a person the LICENSE does not name. The GitHub API reports the license as NOASSERTION, so the license comes from the LICENSE text, which is the MIT License and also carries the Robert Penner easing equations copyright. The UMD global build from a CDN is marked deprecated in the README, which says the UMD file will be removed in a future major version, and so is the CommonJS build, so neither is an installMethod entry; the script tag route above is the ES module import from a CDN, which the README recommends. The README's feature list says the library tweens the properties of an object and nothing else: it does not add CSS units, does not interpolate colors and makes no animation loop of its own, so the caller drives it from an update loop; easing functions are reusable outside a tween and custom easing functions are accepted. Its example chains a target value, a duration and an easing function onto a tween and starts it, then moves an element with a CSS transform from an update callback. The GitHub repository has tags named r1 and r2 that are not version numbers; r1 has a commit date of 2011-05-18, which is firstRelease. The install docs name the scoped npm package @tweenjs/tween.js, which is the package the figures count; the README's Chinese translation and the libtween C port are not recorded. The GitHub stars and contributors belong to the single repository. The deprecation notes in the README cover build outputs and module formats, not the project, so the project is not an end signal.
