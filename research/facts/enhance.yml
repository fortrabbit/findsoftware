notes: >
  The repository holds a README, a LICENSE and .github files only; the framework modules are public in other enhance-dev repositories the README links (for example enhance-styles and enhance-ssr), and they were not read, so sourcePublic is not recorded for the named repository. The GitHub org named Enhance and the npm maintainers are individuals; no legal name or company is stated, so maintainer is the org name and maintainerType is community as a fallback. The install docs name @enhance/cli with npx on enhance.dev; the README names @enhance/create. The record uses @enhance/cli because the project's docs name it; @enhance/create was not counted. The npm package named enhance is an unrelated project by another author (jico/enhance, last version 0.0.7, 2013) and is not used for any figure. The README says Begin is the best way to deploy Enhance apps, and begin.com is linked from the README; no deployment field is recorded for it. basedOn is not recorded: the glossary on enhance.dev says Enhance is implemented as an Architect plugin, but Architect has no record or candidate row in this dataset. The GitHub repository has no releases; the latest release date is the @enhance/cli publish date. The candidate row lists the old npm package's 91 downloads a week; the current @enhance/cli figure is 84.
