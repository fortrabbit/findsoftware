notes: >
  Monorepo: the reshaped npm package is the one the install docs name; @reshaped/headless, @reshaped/core and @reshaped/utilities have their own packages and tags and are not counted. firstRelease 2022 is the oldest version the npm registry still lists (1.0.1, 2022-04-20); the repository was created in 2023 and its GitHub releases start in 2025. The latest stable release is 4.2.0; the default branch carries a 4.3 canary, which is not recorded as a prerelease. The package's peer dependencies (react 18 or 19, postcss 8) are not runtime facts and are not recorded. The homepage lists a Figma library, a Figma plugin and an agents entry, and a Storybook MCP support; none is recorded as a paid edition because no page states a price or a paid tier. The homepage footer reads "Built with Reshaped in Amsterdam"; no legal entity or country is stated, so hqCountry is not recorded. The maintainer is recorded as the README names him, with no legal form. The x and bluesky links are the maintainer's accounts as the homepage structured data lists them.
