notes: >
  The README says vanilla-extract can "generate static CSS files at build time"; that is a build output, not a page stating that a site's output is static files, so runsAs holds local only. Monorepo: the repository holds the @vanilla-extract/css package (the install guide's npm package), the bundler integrations and the optional packages Sprinkles, Recipes and Dynamic CSS, each on its own npm name. Those packages are not records here; the docs describe Sprinkles as "built on top of vanilla-extract", a relation between packages of one repository. The npm figures and the currentMajor and latestReleaseDate come from @vanilla-extract/css: latest 1.21.3 (2026-10-08), the same tag date as the newest release of the repository, which is the integration package at 8.0.11. The @vanilla-extract/css GitHub tags have no stable prerelease newer than the latest stable; npm dist-tags carry canary builds (for example "1.21.3-replace-deepmerge-20261008001944"), which are not prereleases. The first registry upload of @vanilla-extract/css is 0.1.0 (2021-03-26), older than the first GitHub release 0.2.0 (2021-04-12), so firstRelease takes the registry date. The LICENSE copyright line names SEEK, which is also the npm author; the project pages do not give a legal entity or a country, so hqCountry is not recorded. The docs list the bundler integrations (Astro, esbuild, Gatsby, Next.js, Parcel, Remix, Rollup, Vite, Webpack); the Vite integration installs @vanilla-extract/vite-plugin with npm, a package of the same repository. The README's optional runtime for development and testing is not recorded as a runtime. HTTP Archive has an entry "Stitches" but none for vanilla-extract, so httpArchiveSites is not recorded. The site's Discord link and GitHub Discussions link are the community links on the homepage; the discussions page is recorded as forum, the same convention as other records. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header (page 140).
