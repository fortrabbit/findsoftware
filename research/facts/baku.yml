notes: >
  The README calls Baku the spiritual successor to Tinkerer and links the Tinkerer repository; recorded as successorOf. The repository has no GitHub release. It has tags v0.1.0 to v1.0.1 (the oldest, v0.1.0, dated 2022-09-04 by its commit), and PyPI carries 1.2.0 (2025-10-18) with no matching tag, so currentMajor and latestReleaseDate come from PyPI, and firstRelease comes from the oldest PyPI upload, which is 0.1.0 on 2022-09-04. The PyPI home page and project URLs point to the GitHub repository, so no homepage is recorded. The pypiDownloads figure is the last-month count from pypistats.org (last week 5, last day 1). The contributor count is the page number of the rel="last" link on the contributors endpoint with per_page=1. The setup.py requires Pygments, misaka and pyquery; the README does not name any of them as the software it is built on, so basedOn is not recorded. The README says Baku "uses a custom, simple templating engine to avoid dependencies", with {{ }} expressions; templating is coined as custom and kept in notes, not in a field. The README describes MathJax and Mermaid support; no field holds it. The README names no admin interface, so adminUi stays unknown.
