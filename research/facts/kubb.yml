notes: >
  The repository is a monorepo: the record follows the kubb package the install page names (npm name kubb, tags and releases kubb@<version>), while the GitHub stars and contributors belong to the whole kubb-labs/kubb monorepo, which also ships @kubb/cli (npm 377747 for 2026-11-01 to 2026-11-07), the plugins and the adapters; the kubb package's own weekly figure is the one recorded. The GitHub releases list in the API returns releases from 2026-05 onward and the npm upload history starts 2023-06-16 with version 1.2.1, which sets firstRelease. The homepage and the install page say Kubb runs anywhere Node runs, requires Node.js 22.22 or later and TypeScript 5 or later for the generated code, and the libraries the generated code imports (axios, react, TanStack Query) are installed by the user, not by Kubb. runsAs local follows the homepage sentence about running kubb generate in CI, and the integrations page says the Vite, Nuxt and Astro plugins generate during builds only. The comparison page also names orval and openapi-typescript, which have no record; only hey-api is recorded as alternativeTo. The Kubb Studio browser product is hosted at kubb.studio and also runs as a local agent started with kubb studio on the user's machine; only the shared sandbox is a hosted offer. The homepage runs a live WebContainer demo in the visitor's browser; it is not a runsAs statement for the library. The about page names Stijn Van Hulle as creator and maintainer and a Bluesky account of his; that account is not recorded as the project's. The README gives a second Discord invitation (discord.gg/4dQjA6vrWX) for community help; the homepage and maintainer link use discord.gg/shfBFeczrm, which is the one recorded. The sponsor links (GitHub Sponsors, Open Collective) are not recorded. The README says the project is looking for maintainers. OpenAPI 2.0, 3.0, 3.1 and 3.2 are the spec versions the project reads; the spec kind is coined here and not recorded as a field.
  Each output is a plugin listed in kubb.config.ts, and kubb generate writes the files; the generated files are imported by the application like any module. Studio is optional: the README says Kubb remains MIT-licensed and works without Studio.
