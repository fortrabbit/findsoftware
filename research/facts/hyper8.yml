notes: |-
  The CSV homepage simonrepp.com/hyper8/ redirects to https://hyper8.org/, which is the project's own site, so that is recorded as homepage. The repository is on Codeberg, not GitHub: the Codeberg star count (108 at the check, from the Codeberg API) is not recorded as a fact because githubStargazers names GitHub and the Codeberg releases endpoint returns not found, so the newest tag 1.1.0 (commit dated 2026-09-15) is the latest stable release; the oldest tag is 0.12.0 (2024-05-18), which gives firstRelease. The README gives the license and says "No database, no programming, no maintenance required." The Codeberg user record has no type field, so repoOwnerType is recorded as user from the personal account. Contributors could not be counted: the Codeberg API has no contributors endpoint, and no page shows a count. The desktop application is the generator; the live site needs only static file hosting. The ALTERNATIVES.md in the repository names PeerTube, voctoweb and thumbsup. The homepage says Hyper 8 "ships with two languages already"; the languages are not named, so i18n records only that. Mastodon link is taken from the homepage's Follow development footer.
   The homepage lists "Deploy over FTP or SSH/SFTP directly from the graphical editor" as a built-in deployment feature. The CLI is part of the same project; the build-from-source page asks for Rust 1.88 or later, which is a build requirement and not recorded as runtimeMin. The maintainer is taken from the REUSE.toml copyright line.
