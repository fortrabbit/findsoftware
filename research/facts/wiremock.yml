notes: >
  Status accepted: the newest stable release is 3.13.2 (2025-11-14), the repository is not archived, and the README names no end; the 4.0.0 line is in beta (4.0.0-beta.43, 2026-11-13) and is recorded as latestPrereleaseDate only. The maintainer is the company named in the terms page of its cloud and mock services, "WireMock, Inc."; the repository's Apache LICENSE.txt carries no copyright line, and the about page says the company works on "the open source API Mock platform", so the company is the maintainer. A reviewer should confirm this, since the GitHub organization is "wiremock". The overview page and the README say the project started in 2011 as a Java library. firstRelease is 2012 from the oldest version in Maven Central, com.github.tomakehurst:wiremock 1.18 (uploaded 2012-04-08), which is older than the oldest GitHub tag, 1.33 (commit of 2013-06-17). The current Maven Central group org.wiremock:wiremock starts at 3.0.0-beta-11 in 2023. No docs page states a Java minimum for WireMock itself: the JUnit 4 quick start lists "Java 11 or 17" as the prerequisite of its own example and also describes a Java 1.8 test, and the Jetty 12 tutorial lists Java 17. The pom's compiler setting is a build requirement, so no runtimeMin is recorded. The README says WireMock is "the popular open source tool for API mocking, with over 6 million downloads per month" and the overview says "over 5 million downloads per month"; these are the project's own claims with different dates, so they stay in notes and the Maven Central and Docker figures are recorded instead. The downloads page says WireMock currently has two releases, the 3.x release and the 4.x beta releases. The REST API named on the overview page configures the standalone server; it is an admin API, not a headless content API, so headlessApi is not recorded. WireMock Cloud adds RBAC, SSO, audit logs and team workspaces; the cloud features page and the commercial page put these on the hosted service, so they are not recorded on the open source record. The commercial page's Enterprise subscription plan is a hosted plan tier, not a paidEdition. The homepage names a community Slack (slack.wiremock.org) for questions; a chat is not a forum, so no forum is recorded. The FAQ words the license as "Apache 2.0" and the repository API as Apache-2.0; one license, so one entry. The repository has no country for its company on any page read, so hqCountry is absent: the terms name a California governing law, which is no headquarters statement. The Maven Central ecosyste.ms entry reports zero dependents for org.wiremock:wiremock, which does not match the library's use, so no dependent counts are recorded. The Docker image wiremock/wiremock is the one the download page names, and its pull count is recorded with its date. The LICENSE of the repository is Apache License 2.0 with no notice line, and the FAQ states the same license.
  The overview page says WireMock can run as a library or client wrapper in many languages, or as a standalone server, and the standalone page calls it a standalone service. The overview page says WireMock supports several approaches to creating mock APIs: in code, via its REST API, as JSON files and by recording HTTP traffic proxied to another destination. It also names adapters and implementations for Python, .NET, Golang and Rust.
