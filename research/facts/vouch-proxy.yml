notes: >
  No project website is named: the repository homepage field is empty and the README links no site, so no homepage is recorded and the repository is the source. The project publishes no GitHub releases; its tags are the only versions, so currentMajor and latestReleaseDate come from the highest stable tag v0.50.0 and the date of the commit it points to (the CSV note records the same rule). The major line is 0 under semantic versioning. The LICENSE copyright line names The Vouch Proxy Authors; the GitHub organization Vouch is the owner of the repository. firstRelease takes the year of the commit the earliest tag v0.2.0 points to (2017-07-21). The Helm chart is listed in the README under the project's own helm-charts repository, maintained by named contributors; it is recorded as installMethod helm, and a reviewer may decide the chart is a third-party route. The README's Docker section names quay.io/vouch/vouch-proxy and a Docker Hub arm image voucher/vouch-proxy; the Docker pull figure of the arm image is not recorded. The go.mod go line (1.27.1) is a build requirement for a binary shipped in a container and is left out of runtimeMin. The protected-site wiring is the /validate endpoint called by Nginx auth_request (README, Installation and Configuration), which meets criterion 1. The README names login providers it supports (Google, GitHub, Okta, Keycloak and others); those are not recorded as fields. The README calls an OpenResty alternative to Nginx; not recorded. Contributors is the page number of the rel="last" link on the contributors endpoint with per_page=1.
