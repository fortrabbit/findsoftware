notes: >
  Discontinued: the README and the legal page both say the framework is not under active development, and the repository is archived. The maintainer is the copyright holder named in the LICENSE file; the legal notice on the website names Aut O’Mattic A8C Ireland Ltd (users in the Designated Countries) or Automattic Inc. as the owner of the website, not of the software, and no company country is stated, so hqCountry is unknown. The parent is Automattic, which acquired Frontity according to the project's blog. The homepage, the legal page and the README all carry the end statement. The npm package frontity has a 1.0.0 upload dated 2018-02-09, before the repository existed (2019-02-26), so firstRelease does not use it; firstRelease comes from the oldest GitHub release. Major 1 comes from frontity@1.17.2 (the stable release of the package the install docs name); the npm beta tag 2.0.0-beta.1 is a prerelease and does not set the major. The admin interface is the WordPress dashboard, and the content store is WordPress, so neither is recorded as a Frontity field. The forum link is the community forum named in the README. The homepage and the README link only Twitter among social accounts. The homepage is https; the Vercel, Layer0 and Heroku deployment guides are named on the deployment page. The docs guide on the Node.js requirement names no minimum version, so runtimeMin is unknown.
