notes: >
  The repository is a monorepo holding Highcharts Core with the Stock, Maps, Gantt, Dashboards and Grid packages, so the stars and contributors belong to the monorepo; the npm figure is the highcharts package the install page names. The GitHub repository has no release objects; its tags run from v2.0.2 (commit 2010-08-06), and the npm latest tag is the stable version, so currentMajor and latestReleaseDate come from npm. The repository readme says "Highcharts is a source available product. Please refer to shop.highcharts.com for details on licensing." The shop's Standard License Agreement 19.1 covers the commercial license types (Internal, SaaS, OEM); the End User License Agreement (license-eula) grants a free Personal Use and Educational Use license and requires a Commercial Use License for other use, so the two are recorded as separate license entries. The download page says "Production and commercial use require a commercial license." The CDN is for "local development, product evaluation, and other non-production use" under the Acceptable Use Policy. The homepage navigation's Pricing link goes to shop.highcharts.com; no prices are recorded. Grid Lite is free and Grid Pro needs a paid license; Grid is a separate product in the same monorepo and is not recorded as a paidEdition of the charting library. The Highcharts Python wrapper, the Flutter integration and the iOS wrapper (highcharts/highcharts-ios, community-maintained) are separate packages and are not recorded. The LinkedIn link on the homepage is a company account and is not recorded as a field. The homepage product menu lists official integrations for React, Angular, Vue, Svelte, Flutter, Node JS and Python. The license terms name the Norwegian corporation's registered address as the notice address; hqCountry is taken from that full address. The HTTP Archive technology list gives Highcharts 11538 mobile origins with no period.
