notes: >
  Homepage vapor.codes answers 200 and is the project's own site; the GitHub homepage field matches. Repository vapor/vapor (MIT, Swift). The highest stable GitHub release is 4.122.3 (2026-10-21), so currentMajor is 4; 5.0.0-alpha.1 and 5.0.0-alpha.2 are prereleases older than the latest stable release, so latestPrereleaseDate is not set. The docs site lists 5.0 as an alpha pre-release, not a stable line. firstRelease is 2016 from the oldest GitHub release, 1.0.0 (2016-09-15). The install page for macOS and Linux states Swift 5.9 or greater (runtimeMin); the hello-world page says the template used by the Vapor Toolbox requires Swift 6.0 or later, recorded here only as a note because it is the template's requirement, not the framework's. The Discord button on the homepage links to vapor.team, which redirects to discord.com/invite/vapor; the discord fact uses the invite URL, which vapor.team redirects to, and cites the homepage button; vapor.team itself renders no text without JavaScript. The homepage footer and the LICENSE file name the company as Qutheory, LLC (footer spelling QuTheory, LLC); the LICENSE copyright line is recorded as the legal name. No terms, imprint or privacy page answered on vapor.codes, so hqCountry is unknown. The team page lists the core team and the supporters; sponsorship through GitHub Sponsors is not a paid edition. The Store at store.vapor.codes was not read as a hosted offering because it sells no hosting for Vapor apps. The Vapor Team name on vapor.team is a Discord redirect in this record, not a consultancy. Swift Package Index and the Vapor showcase were not recorded as directories: no plugin count was stated. The Fluent overview page documents MySQL, PostgreSQL, SQLite and MongoDB drivers. Leaf is a separate package in the same organization and is recorded as templating because the docs describe it as Vapor's templating language.
