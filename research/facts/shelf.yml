notes: >
  Shelf is a package in the dart-lang/shelf monorepo, and the install docs name the shelf package on pub.dev, so the registry id is pubName shelf and currentMajor comes from the shelf-v tags only (highest stable shelf-v1.4.3). The repository holds no project website, so homepage is absent. The pub.dev page shows publisher tools.dart.dev and the LICENSE names the Dart project authors; both are cited as the project's own statements. The pub.dev figures are not recorded: the registry gives no download count in its API. firstRelease is the first stable upload on pub.dev (0.0.1, 2014-03-02), which is older than the oldest GitHub tag. The contributor count is the whole monorepo, which holds several packages, so it is the repository figure rather than the shelf package alone. The stated SDK constraint is sdk ^3.9.0 in the registry metadata, recorded as runtimeMin Dart 3.9.
