notes: >
  The row's homepage https://alyxshang.boo/mandy answers 404 (GitHub Pages "File not found"); the project's documentation index is at https://alyxshang.boo/content/mandy and is recorded as homepage and docs. The site's own pages name the content format Extended Jirai and the layout language Jirai; they are not recorded as templating because the pages do not name a template engine by a standard name. The license is the author's own Fair Software License, version 1, which is not an SPDX identifier; its clause 3 restricts commercial use by corporate entities, and its clauses 4 and 5 prohibit analysis or modification with large language models, which a reader may want to know. The install page names cargo install from the git repository at tag branch v.0.1.0; no crate on crates.io is named by the docs, so no crate figures are recorded. The only GitHub release is v.0.1.0 (2026-09-11), so currentMajor is 0. The CLI page lists the compile command (--build) as the way to produce the HTML files; the compile step runs as a command-line tool, which is why runsAs records only the static output. The repository holds one contributor and one star at the time of reading. Criterion 5 (signal of use): one individual author, one star, no company; the threshold is open, so the record stays listed and a reviewer decides. The runtime is not recorded: the install page names Rust and Cargo as tools to install from source, with no statement of what running the built tool needs.
