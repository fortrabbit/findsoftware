notes: >
  Boundary ruling settled for wave 62: Nodemailer sends a site's email, so it is accepted; it is not a templating framework, and the email category is in the vocabulary. The GitHub homepage field and npm's homepage give http://nodemailer.com/ and https://nodemailer.com/ respectively; the https address answers 200, so the https form is recorded and the http form is not. The site lists the install and requirements, the license page and the Deno guide; the README and the site both state the Node.js 20 minimum, and the runtimeMin comes from the engines field at the v10.6.0 tag. The Bun statement is in the README only, and the Deno statement in the site only. Cloudflare Workers with the nodejs_compat flag is a stated target, but it is not a runtime value in the vocabulary, so it stays in notes. The maintainer is Andris Reinman by the LICENSE copyright line and the site footer ("Made with love by Andris Reinman"); the author's GitHub account is linked from the site. The EmailEngine product is named on the homepage, the README and the license page: the team behind Nodemailer sells it as a self-hosted email API, and the site says Nodemailer development is sustained by EmailEngine licenses. It is a separate product, so it is no parent, no successor and no paidEdition of this record. The license is MIT No Attribution (MIT-0) on the README, the site and the LICENSE file, one wording in the record. The license history on the /license page says version 3 was briefly licensed under the European Union Public License 1.1 and then reverted to MIT; that history is notes only, since the license describes the latest release. The site also lists donations by Bitcoin and PayPal and GitHub Sponsors, which are no record fields. The transports named on the homepage (SMTP, Sendmail, Amazon SES, streams, JSON) and the Ethereal test accounts, the plugin API and the zero runtime dependencies are features, not fields. The Deno and Node permission model guides describe run flags, not runsAs. The site and README name companion packages (the extra modules page says their licenses differ from Nodemailer's), including imapflow, which the site links; they are separate projects and stay out. The npm figure is the package nodemailer; ecosyste.ms counts are for the same npm package. Stars and contributors are for the repository.
