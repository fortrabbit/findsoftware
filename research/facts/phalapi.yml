notes: >
  The license is stated three ways: Apache 2.0 on the homepage license page and in the GitHub metadata, and GPL-3.0+ in composer.json (and so on Packagist); all are recorded. The homepage states the company as the long-term maintainer and gives Chinese-language docs at docs.phalapi.net (a docsify app; the install and PHP lines were read from the homepage, not the docs). Packagist's latest stable version is v2.23.4 (time 2026-01-29), while GitHub's releases/latest is 2.23.2 (2024-10-17); the registry values are recorded. runsAs is not recorded: the homepage line about setting the site root to the public directory is a server setup step, not a statement of how the framework runs. The Packagist package phalapi/phalapi is the one the homepage tells users to install; the registry shows 102 downloads in the last month. The homepage states the 1.x line has stopped updating and 2.x is current, so the project is not recorded as ended. Responses are JSON by default ("默认返回JSON" on the homepage), a fact kind not in the starter list, not recorded. The homepage's "2.x 扩展推荐 (40+)" extension count is not recorded as its link is not stated. The hqCountry is not stated by a page: the company name contains Guangzhou, which is not treated as a stated headquarters.
