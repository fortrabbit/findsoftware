notes: >
  Acceptance: the Webhook node is documented as the way "services connect to n8n and run a workflow" (docs page for the Webhook node, quote "can receive data from apps and services when an event occurs"), and the Chat trigger's embedded mode has a site call the workflow's webhook URL through n8n's chat widget (docs page for the Chat Trigger node, quote "Embedded Chat lets you use n8n's chat widget or your own interface, which calls the Chat URL webhook shown in the node."). That is the wiring the scope rule asks for; the status stays accepted. The license is split: the README names the Sustainable Use License and the n8n Enterprise License, and LICENSE.md says files with ".ee." in their name or ".ee" in their directory need an Enterprise license; the GitHub API reports NOASSERTION, so both statements are recorded and the reviewer decides how licenseModel reads them. The npm package carries "SEE LICENSE IN LICENSE.md". The npm install page says Node.js "between 20.19 and 24.x"; the latest npm release metadata sets engines node ">=24.0.0". runtimeMin takes the registry value by the release-metadata rule; the install page range stays here. The one-line setup page says npm installs "no longer works from n8n 3.0" and that "From n8n 3.0, n8n is only distributed through Docker"; the current stable is 2.x and 3.1.0 is a prerelease, so npm stays documented as a route for the 2.x line. runsAs is absent: the pages read describe the self-hosted instance and its restart and logging, but no page states a server, service or daemon process model, so the reviewer decides whether a quote exists elsewhere. The cloud service, the SSO and LDAP protocols and the Enterprise tiers come from the pricing and enterprise pages; no prices are recorded. The SSO line is taken from the pricing table, where it sits in the Enterprise column. The pricing table names Business and Enterprise as paid self-hosted editions. Coined or unrecorded kinds: the container image n8nio/n8n (docs.n8n.io install page), webhooks, embedded chat, the public REST API, the LinkedIn link, the Sustainable Use License text. The maintainer is n8n GmbH from the Enterprise License copyright line; the registered address on the privacy page gives Berlin, Germany. The npm figure counts downloads of the n8n package, which the one-line setup page now replaces for new installs.
