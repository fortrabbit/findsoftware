notes: >
  The product was called Jexcel CE and is renamed Jspreadsheet CE (README); the record uses the current name. Registry: the install docs name the npm package jspreadsheet-ce (npm install jspreadsheet-ce@5), so the figures are for that package; the npm package jspreadsheet is the Pro product and is not used. The newest GitHub release is 4.15.0 (2024-12-18), but npm's latest is 5.0.4 (2025-08-25) with no GitHub release, so currentMajor is 5 by the registry rule and latestReleaseDate is the npm date. The npm license field is null; the GitHub repository and the docs both say MIT, and the LICENSE file names Jspreadsheet Ltd. Pro (Enterprise and Ultimate editions) is a commercial product from the same company, described on jspreadsheet.com with a pricing page; its plan prices are not recorded, and the Pro product is not a separate record. The README names bossanova.uk/jspreadsheet as an official website. The jsuites library the install depends on comes from the same vendor and is not a parent. The terms page gives the registered office in Leeds, England, which is the country behind GB. The Handsontable upgrade article is the README's own migration reference. The XLSX import is a feature with an experimental SheetJS integration, not an import from other software, so importsFrom has only Handsontable. The first GitHub release is 1.2.1 of 2017-08-29. The alternatives and comparison pages sit on jspreadsheet.com, the site of the company's commercial product, and compare Jspreadsheet in general; the CE docs add a comparison table of the CE and Pro distributions.
