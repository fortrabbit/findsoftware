notes: >
  Cosmic is a hosted service; criterion 2 is waived. The JavaScript SDK cosmicjs/cosmic-sdk-js (MIT, npm @cosmicjs/sdk, major 2) is a client of the service, not the service, so its license, stars, contributors, npm figures and release dates are not recorded as the product's. The older cosmicjs-node repository and the cosmicjs npm package are a previous SDK and are not recorded either. The privacy policy names the company as Cosmic JS, a Delaware corporation with an office in Plano, Texas; no legal form is stated, so the name is recorded as the project states it. The product pages name AI agents, an agent marketplace and a plugin marketplace; these are not fields. The migration page offers a site import on the dashboard without naming a source system, so importsFrom is not recorded. The docs state SAML SSO is included on the Large Workspace and Enterprise plans and SCIM directory sync is not available. The subprocessors page lists Stytch for SAML SSO, a third party that is not recorded. The homepage also links to YouTube, which has no field.
