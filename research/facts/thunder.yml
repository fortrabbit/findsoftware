notes: >
  The distribution is a Drupal install profile, so the package thunder/thunder-distribution is the one recorded. The install docs name thunder/thunder-project, a project template with 42377 total and 244 monthly downloads on Packagist against 688618 total and 8722 monthly for the distribution it requires; the template is a skeleton, so the distribution's figures are recorded. The GitHub API reports no releases, so latestReleaseDate is the Packagist time of version 8.4.6; the default branch is 8.4.x. The homepage states "Downloads from drupal.org" as 114,900 and "Monthly visits on Thunder websites" as about 80 million; these are the project's own claims, undated and not recorded as fields. The Thunder Core Team page lists its members; the imprint names BurdaVerlag GmbH as operator, and the about page says Hubert Burda Media designed Thunder, which is not recorded as parent because no page names it as the owner. The community chat is a Slack invitation and LinkedIn is linked; neither has a field. The setup page installs a site with drush si thunder and exports configuration with drush cex, and its quick start is described as useful only for trying Thunder locally. The GitHub source includes a headless GraphQL module, thunder_gqls, recorded as headlessApi. The homepage states that Thunder is maintained by the Thunder Core Team, that it includes media handling and scheduled publishing, and that its modules come from publishers and industry partners, as the README also says; these statements are not recorded as fields.
