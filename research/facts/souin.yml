notes: >
  No basedOn: the README names Caddy, Traefik, Tyk, Apache and Nginx as places it sits, and the Go framework list runs past twenty, so no single parent is stated. The standalone server is "deprecated but still maintained for testing purpose"; the docs call the Caddy module the recommended way, so the standalone route is an install route with that caveat, and runsAs is absent because the module runs inside the proxy process. Since v1.7.0 Souin ships one in-memory storage; Badger, Etcd, NutsDB, Olric, Otter, Redis and Simplefs are cache backends added at build time, not databases. The Caddy docs call github.com/caddyserver/cache-handler "the stable version" of the same module; no forkOf is recorded. The Docker Hub count is for darkweak/souin:latest, the image the quickstart names. The oldest GitHub release is v0.1 (2019-11-20, prerelease); v1.0.0 followed on 2019-12-06, so firstRelease is 2019. The LICENSE copyright line names Sylvain Combraque from 2020; the README names no company. The docs site's HTML head holds a Hugo theme's author and email metadata, which describe the theme and not the project, so they are not used. The CSV categories "cache" and "http-cache" have no categoryMap value, so categories uses web-server.
