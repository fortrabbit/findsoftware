notes: >
  The record covers the hosted Liveblocks service. The GitHub repository liveblocks/liveblocks is the SDK monorepo, so no repository, license, stars, contributors or npm figure is recorded; the monorepo's stars are 4767 and it has 44 contributors on the GitHub API, the GitHub license reads NOASSERTION, and the npm package @liveblocks/client (Apache-2.0 on npm) had 750488 downloads in the week 2026-10-26 to 2026-11-01. The candidates row figure of 234.1k per week for that package is out of date. The pricing page lists self-hosting as an Enterprise option "available as paid add-on"; no self-install guide was found in the pages read (the docs URL for self-hosting returned 404), so selfHostOption is not recorded so it stays hosted-service. The pricing page names Pro, Team and Enterprise plans without prices. The company says it is headquartered in the United States in its terms and privacy policy. The about page's founding statement (2021) is recorded as firstRelease. The footer lists LinkedIn (linkedin.com/company/liveblocks) and a status page; linkedin is not a mapped social field and is not recorded. HTTP Archive's technology list does not track Liveblocks, so httpArchiveSites is not recorded. The pricing page lists a directory sync (SCIM) row on the Enterprise plan, which is not recorded as a field. The pricing page links a Yjs hosting page (/technology/hosting-platform-for-yjs), which was not read, so no compatibility fact is recorded. The homepage names SOC 2, HIPAA and GDPR as compliance. The docs name the @liveblocks/react package and the REST API; the pricing page has a Free plan for personal development, prototyping and testing. SAML SSO is listed from the Team plan up. None of these are fields.
