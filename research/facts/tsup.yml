notes: >
  The README opens with a warning that the project is not actively maintained and points to tsdown; the commit that added it (chore: add maintenance info in README, #1332) is dated 2025-08-14. Release v9.0.0 was published 2026-10-14, after that notice. The notice is recorded as the end statement under the rule that a README end-of-life notice ends a record even while releases continue, and the status is for a reviewer to confirm. The npm latest version 9.0.0 is not deprecated; the registry metadata marks one older version as deprecated. The homepage and docs are the same site, which is a JavaScript shell here, so the README link is the source for both. The package.json author is EGOIST, matching the copyright line. The npm weekly figure covers 2026-09-28 to 2026-10-04. The README's install commands are for npm, yarn and pnpm; global install is described as not recommended and is not recorded. The successor named in the README is tsdown, recorded on the tsdown record.
