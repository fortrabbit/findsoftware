notes: >
  The project has no site of its own beyond its GitHub repository, so no homepage is recorded. The README title, the rubygems name and the gemspec all say searchkick. The repository has no GitHub releases, only version tags; the highest stable tag is v6.2.0, which rubygems also lists as 6.2.0, published 2026-10-27 (the candidates row's 2026-06-05 is 6.1.2). The rubygems total of 29,473,208 downloads is the gem's all-time count, not a weekly figure. The README says the latest version works with Elasticsearch 8 and 9 and OpenSearch 2 and 3, and that Elasticsearch 7 and OpenSearch 1 need version 5.5.2; the search server is a separate process and the gem runs inside the application, so runsAs is not recorded for the gem; the engine it needs (Elasticsearch or OpenSearch) is a separate process started by its own commands. The README's "works with Active Record and Mongoid" names two ORMs; it does not say the gem is built on Rails, so no basedOn is recorded and a reviewer decides whether Rails should be one. The README's "Battle-tested at Instacart" links to Instacart's open source page; it is a company statement, not a usage figure, and it is not recorded as reportedInstalls. Not recorded because the README states no value: a hosted option, a license other than MIT, a pricing or support page. The README's "Searchjoy" and "Autosuggest" links name the author's separate gems, not a parent. The rubygems download total is recorded and not compared with the GitHub stars.
