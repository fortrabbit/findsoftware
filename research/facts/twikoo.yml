notes: >
  The record covers the open source Twikoo comment system, not a hosted service. Two packages come from the docs: the twikoo npm package (the front-end script, the figure recorded above) and the tkserver npm package (the self-hosted server, not counted in the figure). The repository README.md is Chinese and README.en.md is its English twin; quotes come from the English file or the docs pages. The docs pages in the repository are VitePress pages under the project's own site; this record reads the published pages at twikoo.js.org. Cloud functions run on Tencent CloudBase, Vercel, Netlify, Hugging Face, Railway, Cloudflare Workers, AWS Lambda and EdgeOne Makers (backend page). Self-hosted storage defaults to lokijs under a data folder when MONGODB_URI is not set (the tkserver settings table), so lokijs is not in the databases value. The monorepo root manifest of version 2.0.17 requires Node 26; that is a build requirement and is not recorded as runtimeMin. No page names an alternative project in a comparison sentence, so alternativeTo stays unknown. Coined kinds, notes only: notificationChannels (email, Server 酱, Qmsg, go-cqhttp, and pushoo channels such as DingTalk, Feishu, Telegram, Discord), spamDetection (Akismet, Tencent Cloud content security, manual review), imageHosts (CloudBase, S.EE, Lsky Pro, S3-compatible storage), embedMethod (script tag, theme support), freeTier (free to run, the cost is the hosting). A site theme that supports Twikoo needs only a configuration entry, per the quick-start page. The self-hosted server listens on port 8080 by default and the docs say to put a reverse proxy in front of it for HTTPS, and spam checks through Akismet or Tencent Cloud content security each need the operator's own account (both from the docs). The project's community is a QQ group (1080829142), which is no forum or chat field. The Chinese README states the same data sources as the English one (Valine, Artalk and Disqus imports).
