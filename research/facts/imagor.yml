notes: >
  The project's own site is the docs site: imagor.net answers with a redirect to docs.imagor.net, which is cited as homepage and docs. The README links the docs pages for image endpoint, filters, storage, security and configuration. The statement "It adopts the thumbor URL syntax representing a high-performance drop-in replacement" is recorded as alternativeTo thumbor, a relation the project states itself; the README does not name a parent. Coined, recorded here only: URL signing with IMAGOR_SECRET, HMAC with SHA-1 by default and SHA-256 or SHA-512 by configuration, and an expire filter (security page); output formats WebP, AVIF (experimental), JPEG and pass-through for SVG (configuration page); image library libvips through the vipsgen Go binding (README); loaders for the file system, AWS S3, Google Cloud Storage and HTTP, and storage backends (storage page); video thumbnails through a separate imagorvideo project (README). The docs configuration page lists environment variables only, and the Docker image is the install route the README and the docs home name. The HTTP image endpoint is an image URL syntax, not a headless CMS API, so headlessApi is not recorded. Commercial support and consulting by Adrian C. Shum (consulting page) is not an edition, and the imagor project stays open source per that page. Imagor Studio, listed in the ecosystem menu, is described as a self-hosted product with an early bird price; it is a separate product in the ecosystem and is not recorded as an edition. The Imagor MCP server, imagorface and the Elestio deploy button are not recorded as facts of this record. Contributors counted across all pages with per_page=1 (40). The GitHub user type is User, and the owner's name on GitHub is Adrian C. Shum.
