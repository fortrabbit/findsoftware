notes: >
  The CSV says Saleor is not on PyPI; PyPI does list a saleor project, but its latest release is 2.10.1 from 2020, so it is not the current core and no pypi field is recorded. The CSV has two identical saleor rows; the record follows one. The pricing page gives the tier names only for Forever Free and Volume; the $1599 tier name is not in the page text, so it is listed by price. The $ sign is the page's own currency sign; the page does not state a currency code. Saleor Commerce Cloud is a hosted service, and the record is listed by default because the open-source core is installable under BSD-3-Clause. The pyproject pins Django 5.2 as a dependency range; only the basedOn relation is recorded, not the version. Saleor's docs list a versioned GraphQL schema at raw.githubusercontent.com for 3.22; the record does not use it.
