notes: "The GitHub repository localgovdrupal/localgov is archived in its README, which points to https://www.drupal.org/project/localgov, and the Packagist package localgovdrupal/localgov is abandoned in favour of drupal/localgov. That is a move, not an end, so status stays accepted; repository and registry figures follow the drupal.org project (git.drupalcode.org, drupal/localgov). The README requirements list covers a local test setup only, so contentStore, databases and runsAs are not recorded. currentMajor is 4 from the highest stable drupal/localgov version; the drupal.org page says 3.x supports Drupal 10 and 4.x Drupal 11. liveSites is a coined adoption field: the homepage count, undated. The maintainer is a company limited by guarantee; its jurisdiction is not stated on the pages read. The GitHub organization location is not recorded as hqCountry. Subscriptions for councils and suppliers are membership fees, not an edition."
