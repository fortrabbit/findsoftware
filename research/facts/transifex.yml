notes: >
  Hosted service only. The pricing page's "Self-hosted and maintained" row sits in the comparison column for a DIY LLM pipeline, not for Transifex, and no self-install guide was found on the homepage, the pricing page, the developers hub, the security page or the terms, so there is no selfHostOption and the status stays hosted-service. The SDK repository github.com/transifex/transifex-javascript (Apache-2.0, 51 stars, latest tag v8.0.3 on 2026-09-01) and the npm package @transifex/native (41,080 downloads in the week 2026-10-26 to 2026-11-01) are SDK figures, recorded here in notes only. The legal entity is Transifex Opco LLC, a US LLC; its correspondence address is in Covina, California, and the terms name it as the contracting party. The developers hub describes the API as "based on {json:api}" and does not say REST, so no headlessApi is recorded. The pricing page states "SSO & 2FA included" and "Every capability is included from the start, with no tiers or feature gates", and it names no free tier, so freeTier is not recorded. The security page says compliance with SOC 2 Type II, GDPR and the EU AI Act, recorded in notes. The homepage links LinkedIn (linkedin.com/company/transifex, coined field, kept here) and YouTube (youtube.com/user/TransifexInc, no field). The homepage footer also links the XTM International LinkedIn page and xtm.ai for sales contact and the privacy policy uses an xtm.cloud address; no page states an ownership relation, so parent is unknown. The "regions" value is the hosting location the security page gives for the virtual machines; it does not state where customer data is stored in every case.
