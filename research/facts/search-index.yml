notes: >
  The README gives no npm install command: the install docs name the import of search-index and a dist file for script tags, and the npm package search-index is the one the import names. The npm figure is the sum of the full-week range 2026-09-28 to 2026-10-04, 39,197 downloads. The npm package homepage is the GitHub Pages site, which is the project's own and answers over https. The repository has no homepage field; the Pages site is recorded. Storage: the API page says indexedDB is the keystore in a browser and levelDB in Node.js, and the database option accepts other abstract-level stores such as memory-level and Redis or Postgres backends; no database value is recorded for the default store because the page names no database product for it. The Node.js run mode is not stated as a deployment mode, so only browser is recorded for runsAs. The package's level and memory-level dependencies are not basedOn statements. The first GitHub release is v0.10.0 (2017-04-12); the repository was created 2013-07-04. The copyright line in LICENSE gives 2013-2021 and the maintainer is recorded from it, with the homepage stating the project is maintained by fergiemcdowall. The browser demo on codesandbox is a third-party sandbox and is not recorded. The README quick start uses PUT to add documents and QUERY to read them.
