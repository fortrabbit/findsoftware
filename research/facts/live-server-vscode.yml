notes: >
  A VS Code extension: the Visual Studio Marketplace listing ritwickdey.LiveServer is its registry. Marketplace installs are 83,899,740 as read on 2026-10-28 (vscodeInstalls, a figure coined here for notes; the rating figures are not recorded). The engines field of package.json requires VS Code 1.51.0 or later; that is a host requirement, not a runtime minimum, and no runtime field is recorded. The package.json depends on a bundled copy of live-server under lib/ (dependency file:lib); the README does not name live-server as a parent, so no basedOn is recorded. The README's pointer to the server-side PHP companion and to Live Server++ are sibling projects and are not recorded. The repository's latest prerelease, 5.4.0-alpha6 (2019), is older than the latest release, so no latestPrereleaseDate is recorded. The oldest GitHub release is v3.1.0 (2018-01-24). Maintainer Ritwick Dey is named as the author in package.json; the copyright line in LICENSE reads 2017-2022 Ritwick Dey. The homepage at ritwickdey.github.io redirects to its trailing-slash address, which is recorded. The VS Code Marketplace publisher is ritwickdey as well. The npm registry is not used: the package is not published to npm as the extension.
