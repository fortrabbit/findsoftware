notes: >
  The repository has no project website: the GitHub homepage field is empty and the README links only a Cloudflare blog post, which is not the project's site, so no homepage is recorded. The maintainer is Cloudflare, Inc. from the terms page, the company that operates the Cloudflare websites; neither the LICENSE nor the README names a copyright holder, so the GitHub organization cloudflare is the repository owner. The repository is a Rust workspace of crates; the crate named in the install guide is pingora, and the README lists the others. The runtime is a compiled Rust program built with cargo; the systemd guide installs the program as a binary and the daemonization guide describes running the server as a daemon. The README states an MSRV of Rust 1.85 and build requirements of Clang and Perl 5; no field holds them, and runtimeMin is not recorded for a binary. Pingora is a library that an application embeds, so the runsAs value describes the server process the quick start builds, not a deployed site. The README marks caching APIs as experimental and volatile. firstRelease is the oldest crates.io upload of 0.1.0 (2024-02-28), which is older than the GitHub tag 0.1.0 (2024-04-05); the crate's 0.0.0 upload of 2022-12-07 is a placeholder, not a release. The CSV's adoption note reads "gh 27.6k stars"; the figure here is read 2026-10-30. Adoption figures are recorded with their periods; the crate's recent downloads (90 days) are not recorded.
