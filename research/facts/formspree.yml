notes: >
  Hosted-service record: nothing is taken from an SDK or client repository. The archived repository github.com/formspree/formspree (archived, last push 2023-05-22) has the description "The successor to this repository is actively maintained at https://formspree.io. Its source code is not available", so it is not recorded as repository and no selfHostOption is recorded. Its 2,749 stars and its 5 contributors are the archived repository's figures and are not recorded. The homepage links formspree.io as its own site, so the record keeps it as the homepage. The compliance statements on the security page are SOC 2 Type II, GDPR and CCPA; compliance is a coined kind, so SOC 2 Type II, GDPR and CCPA stay in these notes as the security page states them. The plans page lists a Free plan with 50 monthly submissions and a Personal, Professional, Business and Custom plan with higher limits; the plan limits are the vendor's own terms and are not prices, and freeTier is a coined kind, so it stays in these notes. The plans page also lists Premium Plugins for CRM, newsletter and support tools, Custom Branding, a custom email domain, a rules engine and file uploads of up to 10 files per submission; these are features of the hosted plans and are not recorded as fields. The homepage lists native integrations ("Formspree builds and maintains direct connections to dozens of 3rd party services"), a LinkedIn company page (https://www.linkedin.com/company/formspree) and a YouTube channel (https://www.youtube.com/@formspree); linkedin and youtube are not fields in the starter list and go to these notes. The homepage's "Trusted by 1 million+ freelancers, agencies, and Fortune 500 companies" counts customers, not installs, so no reportedInstalls. The category is the mapped value forms, as ruled for form backends. The homepage describes the post-submit workflow as user-controlled (notification emails, auto-responses, redirects and routing to a CRM), and the help center lists plugins alongside a Forms API and a CLI. The plans page lists team members per plan, from one login on the free plan upward. The homepage FAQ says Formspree "works with anything that can send an HTTP request", naming Next.js, Astro, Hugo and Webflow: a form's action points at a Formspree endpoint. The help center lists a Forms API and a CLI, which go to notes as the API styles and an installable tool. hqCountry is not recorded: the terms say only that the Services are provided "from our offices within the United State of America" and from facilities in the United States, with no office address, and the Texas governing-law and Bexar County clauses are not a headquarters. The plans page describes API Access as fetching submissions from a JSON HTTP endpoint, available on the higher plans.
