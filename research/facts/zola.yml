notes: >
  License changed on 2026-01-09 (commit "Change license to EUPL"): the README says code introduced after 0.22 is EUPL-1.2 and code that existed before commit 3c9131db stays MIT, so the project is dual-licensed by code age; GitHub and Cargo.toml report EUPL-1.2 only. Hence two license entries. maintainer rests on the homepage linking the author site vincentprouillet.com; the README speaks in the first person of the original author. Zola is a self-contained binary, so runtimeMin does not apply; building from source needs Rust, Cargo and a C compiler with no minimum stated (buildRuntimeMin). firstRelease is the oldest GitHub release, v0.0.2 on 2017-03-24; Wikidata gives 2018. The README calls multilingual support "Basic currently". Zola has no plugin system. The theme page lists about 40 entries without a total, so themeCount is absent. Coined field formerName (earlier project name). Not on endoflife.date (404).
