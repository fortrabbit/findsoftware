notes: >
  The repository README says the repository holds the current major line and points to other branches for earlier lines; the record covers the current line. The installation guide's Composer path is composer create-project concretecms/composer, a project skeleton whose composer.json requires concrete5/core, the core package; packagistDownloads is the concrete5/core total. The repository's own composer.json name, concrete5/concrete5, is a separate Packagist package with 2839 total downloads on 2026-10-20, and the skeleton concretecms/composer has 12273. The system requirements page gives PHP 7.3 as the minimum for the current line and says PHP 7.3 is end of life. The legal entity is PortlandLabs, Inc., which the company's own pages call Concrete. The installation guide gives the zip download and Composer as the two install paths.
