notes: >
  Status is accepted. The README opens with a banner, "medium-editor needs help!", asking people to help maintain the project. It asks for maintainers and does not say the project has ended or is unmaintained, so the status stays accepted and the reviewer decides. The last GitHub release and the last npm version are both 5.23.3, dated 2017-12-20, and the default branch was last pushed on 2024-10-24, so the four-year rule will move the record to stub on its own. GitHub detects no license (NOASSERTION); the license comes from the npm package (MIT) and the LICENSE text, which grants permission in the MIT wording and names no license. The LICENSE copyright line names Davi Ferreira and says the software consists of voluntary contributions from many individuals; the repository owner is the yabwe organization. The homepage calls the software a vanilla JavaScript editor with no libraries, and the README says no additional frameworks are required, so no basedOn is recorded. Framework wrappers are listed in the project wiki and are not parents. The README and the demo page show the editor attached to page elements by a script tag, but no sentence states that it runs in the browser, so no runsAs is recorded. The homepage browser support list and the README "Browser Support" section are not recorded. The README's Gitter badge is a chat, not a forum, and is not recorded. The homepage says "We're not affiliated with Medium.com, just fans!", which is not an alternativeTo statement. The npm weekly figure covers 2026-11-01 to 2026-11-07; the ecosyste.ms counts were read on 2026-11-16. The firstRelease year comes from the oldest npm upload, 1.1.1 on 2013-10-04; the oldest git tag 1.0.0 has a commit dated 2013-08-26, the same year. The contributor count excludes anonymous contributors.
