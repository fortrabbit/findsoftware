notes: "The terms page names Strapi, Inc. with a registered office in Delaware, US; the repository LICENSE names Strapi Solutions SAS as copyright holder, so two legal entities appear. GitHub reports the license as NOASSERTION because the file mixes MIT with an enterprise license for ee/ directories; the self-hosted pricing page calls the Community plan MIT. The npm engines field allows Node >=20 while the docs restrict support to the LTS lines 22, 24 and 26. Strapi is API-only and renders no website itself, recorded as renderingModes \"none (api only)\". The Wikidata item Q105826887 is labeled Strapi with a dewiki sitelink but has no official website claim, so the match is not verified. Coined here: startCommand (production start command), hardwareMin (stated minimum and recommended server size), hostedOffering (the vendor's own hosted service), repoCreated (GitHub repository creation date), customerCount (self-reported customer figure). The plugin marketplace shows no count. The homepage footer lists LinkedIn, Facebook, Instagram, Twitch and YouTube, not recorded as no field exists for them."
