notes: >
  Boundary row, accepted because the README gives an install guide for the open source code: the Development section lists requirements, composer install, the schema import, php -S and bin/worker, and it is the only install route the repository states. The hosted service at webmention.io is the same project run by the maintainer; the homepage calls it a hosted service, and the README says the receiving service can be run separately from the blogging software. A site attaches to it with a link tag (rel webmention) in its HTML or a Link header, and the homepage offers a small script that renders a page's mentions. The README says webmentions are verified in the background by bin/worker, which pops jobs from a Redis list. The default branch is php and has no tags or releases, so no version, release date or firstRelease is recorded; lastCommitDate is the newest commit on that branch. The README names the BSD License and points to LICENSE.txt, but the php branch has no LICENSE.txt; the main branch (an earlier Ruby implementation) has a LICENSE.txt with the two-clause BSD text and the 2013 copyright line, so the BSD-2-Clause entry is taken from there. The README copyright line reads 2018-2026. Redis is a job queue for bin/worker, not a database for the records, and it is recorded in the notes only. The worker is run as a systemd service per the README; the PHP front controller is not stated as a per-request process, so runsAs records always-on only. Standards and features that stay in notes: the W3C Webmention protocol and Private Webmention (code parameter), the sending endpoint with rate limits and the 429 and 503 answers, web hooks for received and deleted webmentions, the blocklists and moderation settings, IndieAuth sign-in with an indielogin.com fallback that an operator setting can switch off, the migration tool. The main branch holds earlier Ruby code, and the README of the default branch names no successor, so no successorOf is recorded. No headlessApi is recorded: the API is described as a JSON API with GET endpoints and the README never uses the word REST.
