notes: >
  No project site: the repository is the only project page; the maintainer's personal site (wooorm.com) is not the project's, so homepage is not recorded. The maintainer is recorded as the LICENSE copyright line names him, Titus Wormer; no hqCountry, since the maintainer is an individual and the GitHub profile location is not a page naming the maintainer's company or address. The README says it "has a WASM dependency" and rather big grammars, that it "might be too heavy particularly in browsers" where lowlight or refractor "might be more suitable", that its output is meant to match GitHub in that it "produces classes and works with the CSS it ships", and that the CSS "supports light and dark mode automatically"; it also says the tree can be turned into HTML, React nodes or ANSI output. The README says the package "is ESM only" and that it targets "maintained versions of Node.js", with Node.js 16 as the minimum for the 3.x line; runtime lists node and deno because the README installs it in Node.js and in Deno through esm.sh, and no runsAs is recorded because the README names browsers too (per the rule for libraries naming both). The README's browser section (esm.sh with a script module) is the cdn route. The package has no engines field at the 3.11.0 tag, so runtimeMin comes from the README's compatibility statement. License: the LICENSE file gives MIT for the package and "All other files"; the README adds that the grammars in the package are "covered by their repositories' respective licenses, which are permissive (apache-2.0, mit, etc)", recorded as a second entry naming Apache-2.0, the only one besides MIT that it names. GitHub reports MIT. firstRelease is 2022 from the 1.0.0 release (2022-05-14). The README calls the project "similar to the excellent shiki" (alternativeTo shiki, which has a record) and lists lowlight and refractor under Related as similar projects based on highlight.js and Prism; those two have no fact files. The README counts "600+ grammars" and "±35 languages" in the common list; those counts are not recorded as fields. npm figures come from the scoped package the README installs, @wooorm/starry-night; the unscoped starry-night name on npm does not resolve.
