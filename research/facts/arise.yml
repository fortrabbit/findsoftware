notes: >
  The homepage https://ari.se.net is the project's live example, which the README says is deployed from this repository. GitHub reports no license (null) because the terms sit in LICENSE/README.md, so the license facts come from the README and that file. The LICENSE file says the Arise Software is under "GNU Affero General Public Licence, Version 3" with no or-later clause; AGPL-3.0 is recorded without one, and the reviewer decides whether the SPDX id should be AGPL-3.0-only. The example site (MIT) and the logo (CC-BY-SA 4.0) are recorded as separate license statements, as the parts are licensed differently. GitHub reports the language as Shell; the README says written in Bash. The README lists GNU date, find and awk, pandoc and sed as dependencies; no field holds them, so they are not recorded. The deploy targets are Cloudflare Pages, DigitalOcean and GitHub Pages; all three guides were read and each one deploys the html branch as a static site. The last push is 2024-04-04 and the last release 2023-11-17, both within four years, so the status stays accepted.
