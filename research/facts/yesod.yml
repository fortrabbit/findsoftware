notes: >
  The CSV homepage is http://www.yesodweb.com/; the same site answers 200 over https, so the https address is recorded. The GitHub repository has no releases and its tags are per package (yesod-form-1.7.10, yesod-websockets-0.3.0.3), so the Hackage package yesod, the umbrella package the quickstart installs through Stack, is the release source. Its highest normal version is 1.6.2.3, uploaded 2026-06-16; no version above it is listed. The first version on Hackage is 0.0.0, uploaded 2010-03-08; no earlier release was found, so firstRelease is 2010 although the repository was created in 2009. The repository's LICENSE copyright runs 2012-2017 and the record uses that line as the maintainer statement. No minimum GHC version is stated on the pages read, so runtimeMin is unknown; the quickstart needs Stack version 2 or later, which is a build tool and not a runtime. The deployment page names Keter as one option with scaffolding support and gives Warp as a server that can run without a frontend server; the always-on value rests on that page's Warp sentence. The authentication chapter names OpenID, BrowserID and OAuth plugins; none is recorded as sso, since the field covers SAML, OIDC and LDAP. The Persistent chapter also names experimental Redis support, which is not recorded as a database. The community page lists a Stack Overflow tag, a Google group, a web-devel mailing list and IRC; the Google group is recorded as forum; the others are not, and the homepage carries no social links.
