notes: >
  The homepage www.vaultproject.io answers with a redirect to developer.hashicorp.com/vault, which is recorded as the homepage. The LICENSE file names the Licensed Work as Vault 1.15.0 or later under the Business Source License 1.1, with a Change License of MPL 2.0 four years after publication; the license fact describes the latest release. Releases before 1.15.0 are under MPL-2.0: the LICENSE file at the v1.14.0 tag reads "Copyright (c) 2015 HashiCorp, Inc." and "Mozilla Public License, version 2.0". The what-is page says Vault encrypts data at rest, gates access with authentication and policies, and audits all activity; the README says it records a detailed audit log. The LICENSE Additional Use Grant allows production use but not offering the Licensed Work to third parties on a hosted or embedded basis in order to compete with IBM Corp's paid versions of it. The LICENSE parameters name the Licensor as International Business Machines Corporation (IBM); the maintainer is the copyright line's IBM Corp. and the Terms link (429, unreadable) would name the contracting party. The paidEdition quote states that Vault Enterprise needs a license applied to the cluster; no page read names a price or a paid license, so the paid nature of the Enterprise edition is for the reviewer to confirm, and the pricing page (429) could settle it. The SSO protocols come from the OIDC and SAML auth method pages and the what-is page naming LDAP; the SAML method needs an Enterprise license (its page says so), and the auth methods list marks it ENT. Kerberos and RADIUS are also auth methods on that list and are not recorded in sso. The storage page lists Raft, the file system, Consul, etcd, PostgreSQL, MySQL, MSSQL, CockroachDB, DynamoDB, Cassandra, CouchDB and others as storage options; PostgreSQL and MySQL are recorded as databases from their storage backend pages (community supported), and integrated Raft storage is the recommended default. Apps call Vault's HTTP API (the what-is page and the README point to examples for calling Vault from application code), which is the criterion 1 link. The Docker image is not named by the install page, so dockerPulls is not recorded. The coined kinds are not recorded as fields: the HTTP API is named on the homepage ("using a UI, CLI, or HTTP API"). The README names a Google Group announcement list (recorded as newsletter) and the community forum on Discuss.
