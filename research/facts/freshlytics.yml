notes: >
  The project's GitHub Pages site is not recorded as homepage: the repository's homepage field is empty and the README does not name the Pages address. The repository has tags 1.0.0 and 1.0.1 (both 2019-09-03), 1.1.0 (2020-04-12) and no GitHub release, so firstRelease is the oldest tag and latestReleaseDate is the newest tag, which is 2020-04-12 and is more than four years before this check; the import's four-year rule decides listing, so the status stays accepted and the reviewer decides. The tag 1.1.0 manifest says version 1.0.0-beta, which the record does not use. The tracking snippet goes in the head of each page and sends events to a collect endpoint of the instance: this is the embed method, a script tag, and it goes to notes. The README and the features say cookies are not used and that personally identifiable information is not collected: privacyClaims in notes, not a field. The installation page says the service depends on PipelineDB for data storage and the example uses the pipelinedb/pipelinedb-postgresql-11 image; the database is recorded as postgres from that image name, and PipelineDB's own status is not checked here, so a reviewer decides whether that dependency is an end signal for the stack. The Docker Hub image has 56802 pulls and a last update of 2020-08-17; the Docker image is built on Node 12 (its Dockerfile), a build requirement, so no runtimeMin. The docs' default admin credentials are not recorded. The docs describe the software as self-hosted, so no hosting service applies. PipelineDB status: the README of github.com/pipelinedb/pipelinedb says it joined Confluent and "will not have new releases beyond 1.0.0, although critical bugs will still be fixed"; that is the status of a dependency, not a statement that Freshlytics has ended, so no end signal is recorded for Freshlytics. The docs list the system requirements as 1 CPU core and 1 GB RAM.
