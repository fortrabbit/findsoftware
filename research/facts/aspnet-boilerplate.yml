notes: >
  Stub: the project's own pages state an end and the repository contradicts them. The end-of-support page says ASP.NET Boilerplate "will gracefully transition out of active development" and that after May 12, 2026 "no updates will be provided"; the README says support "will officially end in May 2026". The repository nonetheless published v10.5.1 on 2026-10-13, and the same page says the NuGet packages will keep being maintained and upgraded to .NET 10.0 for ASP.NET Zero users. A release-free period after the stated date or an archived repository would settle it as discontinued. The end-of-support page names ABP.IO as "the natural successor to ASP.NET Boilerplate"; that relation is recorded as successorOf on the abp record. ASP.NET Zero is a commercial product built on this framework and is not recorded as an edition. The NuGet package Abp is the one the README lists first; the figure is its total downloads. The first GitHub release is v0.2.0.0 (2014-05-04); the repository was created in 2013. No maintainer legal form appears on the pages read, so the maintainer is recorded as the LICENSE copyright line states it.
