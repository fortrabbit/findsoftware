notes: >
  Start lives in the TanStack Router monorepo (github.com/TanStack/router), so the repository, stars and contributors are shared with TanStack Router. The homepage tanstack.com/start states "A full-stack framework for React and Solid."; the docs path and the recorded package are the React ones (the Solid package is not recorded). The LICENSE names Tanner Linsley; the docs overview says "TanStack.com (also open source) is owned by TanStack LLC" and the site footer reads "© 2026 TanStack LLC", which concern the website, so the maintainer is the LICENSE line. runsAs holds static only: the hosting guide has a Node.js / Docker section with a start script, but no page read states a long-running process. The homepage is the Start site at tanstack.com/start; the candidate row pointed at the Router site. The docs name Vite or Rsbuild as the build tool. The separate npm package @tanstack/start (1.120.20) is not recorded.
