notes: >
  The CSV homepage https://lib.vizzuhq.com redirects to lib.vizzuhq.com/latest/, which is the page quoted, so the final URL is the homepage. The README lists a blog at blog.vizzuhq.com and an e-mail contact, which no field holds. The FAQ says the constructor loads the WebAssembly module asynchronously, so any method except animate() throws an exception until the initializing promise on the Vizzu class has resolved. The README says "Written in C++ compiled to WebAssembly" and "Dependency-free"; the C++ core is a coined detail and stays here. GitHub's primary language is C++ and the CSV row says cpp; the record takes JavaScript from the README's "Javascript/C++ library" so the npm figure applies to the npm package the install route names, and a reviewer decides whether the language should be C++ instead. HTML5 canvas rendering is stated in the README and is a coined kind. No runsAs or runtime is recorded: the README and docs do not say where the library runs. The version line is 0.18 (v0.18.0, 2026-04-20), so currentMajor is 0 by semver, and a reviewer decides whether a 0.x line gets a major. firstRelease is 2021; the npm package vizzu was first uploaded in 2021-03 and the oldest GitHub release (v0.2.0) is from 2021-08, so the registry sets the year. The npm figure is the package named in the install section; the CSV figure came from a different window. Stars and contributors belong to the vizzuhq/vizzu-lib repository.
