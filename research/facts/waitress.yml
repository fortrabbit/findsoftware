notes: >
  Accepted. Waitress is a WSGI server that an application runs under, so runsAs is always-on from the usage page, which runs it on a port until stopped ("Press Ctrl-C ... to exit the server"); the runner page calls waitress-serve "useful for development, and in production situations". The Pylons Project is the maintainer the docs name; the PyPI metadata names the same maintainer and lists the author as "Zope Foundation and Contributors", and the docs footer reads "Copyright 2012-2026, Agendaless Consulting", so the legal holders differ by page and a reviewer decides the maintainer name. The LICENSE file names ZPL 2.1 with no copyright line; the GitHub license is NOASSERTION. firstRelease is 2011 from the first tag (0.1), whose commit date (2011-12-30) matches the first PyPI upload; the repository was created on 2011-12-17. The changelog on the repository covers 3.0.0 onwards, so it gives no earlier date. The CHANGES file lists "4.0.0 (unreleased)", which is not a release and is not a prerelease, so latestPrereleaseDate is absent. runtimeMin takes the PyPI requires_python of the latest release (3.0.2); the README agrees with 3.9+. No docs page, README or PyPI metadata shows a pip command (the PyPI project page answers with a bot challenge); the Heroku section only says to include waitress in requirements.txt, so installMethod is absent; the usage and deployment pages document how to run the server, which is the criterion 3 evidence. The pypistats figure is the "last_month" total for the day of the read; the PyPI JSON reports no download figure. The reverse-proxy page says "Waitress does not natively support TLS" and describes running it behind a reverse proxy. Waitress is not built on another project: the README names Flask, ASP.NET Core and uvloop only as inspirations, and the docs name no parent, so basedOn is absent.
