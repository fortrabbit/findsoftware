notes: >
  The record covers the open source MaxKey server, version 4.2.x per the current Chinese documentation. The English homepage at https://www.maxkey.top/en/ still reads "Last Published: 2024-07-19 Version: v4.1.0", so it is not used for dates. The site footer names 江苏麦克思软件有限公司 as the company behind the site; that legal entity is not recorded as maintainer, and no page states the country of the project's headquarters, so hqCountry is unknown. Dromara is the organization that hosts the project, recorded as the foundation the project sits under. The Enterprise Edition (企业版) appears beside the Community Edition on the comparison page, but no page states a price, a licence or a commercial model, so no paidEdition fact is recorded. The Docker install page names no image; its script pulls maxkeytop/maxkey:latest, which is not recorded as dockerPulls. The Rainbond install page describes deploying the components from an app store and is not recorded as an install route. The runtime quote is the Windows bundle's JDK, and runtimeMin 21 rests on the 4.2.0 release note; the README's JDK badge says the same. The runsAs quote is the Windows bundle directory table, which lists the authentication service with its port. SCIM 2, LDAP, Kerberos, WebAuthn, multi-tenancy and the RBAC permission model are stated on the README and docs but are coined fields and sit here. The QQ group, the support email and the WeChat and knowledge-planet channels have no field. The README badges give MySQL 8.4+, while the Linux install page installs MySQL 8.0. Stars and contributors are adoption figures recorded with their dates.
