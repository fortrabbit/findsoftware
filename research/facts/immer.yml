notes: >
  Doubt: Immer is a general-purpose immutability utility rather than a tool for building a website or web app, like effect and es-toolkit in the general-purpose utilities group; it stays a stub until a ruling on state utilities settles whether the register takes it. The facts are complete and checked; the stub only waits on that ruling. The repository's tags carry no prerelease, and the npm next and beta tags (4.0.0-beta.0, 2019; 10.0.4-beta, 2024) are older than 11.2.10, so no latestPrereleaseDate is recorded. The repository's GitHub release 11.2.10 (2026-11-10) is the newest stable release. The oldest tag in the repository is 0.4.0 (2018-01-09), and the npm package immer starts at 0.0.1 (2016-10-07), so firstRelease is the registry year. The LICENSE copyright line names Michel Weststrate and the package.json author field gives the same name. The category value state maps to library in the import; the page's "Support Immer" link is an OpenCollective funding page and is not recorded. The source is TypeScript (package.json "source": "src/immer.ts") while GitHub reports JavaScript; the language field keeps the GitHub value. The installation page says the package works in any ES5 environment, but the same page says the fallback for engines without Proxy is dropped in recent versions, so the ES5 line is a compatibility statement that is not recorded and no runtime is recorded. Opt-in features (Map and Set support, JSON patches, array-method optimization) are enabled by calling functions once at application start. The introduction lists strong typing, structural sharing, object freezing and first-class JSON patch support as benefits.
