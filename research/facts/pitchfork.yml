notes: >
  The repository has no GitHub releases; its tags run from v0.1.0 to v0.18.2, and the current stable line is read from RubyGems (0.18.2, 2026-01-28). firstRelease is the oldest RubyGems upload (0.1.0, 2022-10-05); the repository was created 2022-09-16. The gemspec homepage is the GitHub repository, so no homepage is recorded. The README's copyright line reads "pitchfork is copyright 2022 Shopify Inc and all contributors", and Shopify Inc. is a Canadian corporation with a registered office in Ottawa per the Shopify terms page; the LICENSE file names no current holder, so the maintainer is Shopify Inc. from the README copyright line; the gemspec author is Jean Boussier. Lineage: the README says "It is based on Unicorn 6.1.0" and docs/WHY_MIGRATE.md says it "started as a fork of Unicorn"; basedOn is unicorn from the README statement; the docs/WHY_MIGRATE.md fork wording is not recorded as forkOf. The docs/WHY_MIGRATE.md migration guide covers moving from Unicorn and Puma, which is a server migration, not an import of content, so importsFrom is not recorded. The GitHub license field reads NOASSERTION; the gemspec's two entries are recorded as stated, and the gemspec comment says "Ruby" stands for the Ruby 1.8-specific terms, which the README words as "Ruby (1.8)-specific terms". The README's "Ruby(MRI) Version 2.5 or above" and the gemspec's required_ruby_version agree. Adoption: stars and contributors read 2026-10-30; the RubyGems total is for the gem name the install guide gives. The CSV note "date from git tag" is superseded by the RubyGems upload date.
