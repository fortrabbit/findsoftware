notes: >
  The homepage is the project's GitHub Pages docs site, which is its own website; the repository holds the source. The LICENSE at master names Vitor Capretz in its only copyright line (2019), and the package.json author of @bull-board/api is the GitHub login felixmosh (the repository owner, whose GitHub profile name is Felix Mosheev). The maintainer follows the LICENSE line as the rule says; the current maintainer is a reviewer decision. The README says the project is a dashboard for Bull and BullMQ and gives Express, Fastify, Koa, Hapi, NestJS, Hono, H3, Elysia and Bun adapters; these are the integrations with frameworks, not a basedOn statement, so no basedOn is recorded and the adapter list stays here. The registry figure is the core package @bull-board/api, which the install command names; the sum of the seven daily values for 2026-10-23 to 2026-10-29 is 2780640. The npm latest version is 9.10.5, MIT, with no deprecated flag. The Node.js 20 minimum and Bun 1.x come from the installation guide prerequisites; the packages/api manifest has no engines field. The homepage also offers a live demo and the BullMQ Pro and Bull support; the Pro product belongs to BullMQ, not to this project's editions, so no paidEdition is recorded. The metrics package (@bull-board/metrics) is marked beta in the README and is not an edition. The first GitHub release is v0.0.6 (2019-08-30). The Docker image is on GitHub Container Registry, not Docker Hub, so no dockerPulls is recorded. Redis is the store the dashboard reads queues from; PostgreSQL appears as the storage of v6 queues in the postgres-backend recipe, which the README links. The metrics package README text says BullMQ keeps only a short ring buffer of per-minute metrics, and the package snapshots them into longer-retention Redis buckets. The CLI guide and Docker guide pages were read and add no further fields.
