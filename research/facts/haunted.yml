notes: >
  The README links the docs at hauntedhooks.netlify.app, which is the project's own docs site and is the homepage here; the CSV homepage was the README anchor. The README says Haunted supports the Hooks API "the same API as React Hooks" and names React's Hooks API as its model; Haunted does not depend on React, so no basedOn is recorded. The npm registry shows the package created 2013-08-05, before the repository (created 2018-10-27), so firstRelease comes from the oldest GitHub release (v1.3.0, 2018-10-31) rather than the npm created date. The homepage example defines a component as a function that calls useState and registers it with customElements.define through component(), which is the basis for describing it as turning a function into a custom element. The README and docs name lit-html and hyperHTML as renderers; they are not recorded as basedOn because the project describes them as templates it works with, not software it extends. Downloads come from the npm package the install docs name. The guides list "Bring your Own Renderer" among the topics; the renderers the README names are lit-html and hyperHTML. The getting-started page also describes loading the bundle from a CDN without build tools.
