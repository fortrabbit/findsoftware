notes: >
  The homepage zewo.io and the docs at docs.zewo.io answer only over plain http (https gets no TLS response), so neither is linked and homepage and docs are in notFound. The x link (twitter.com/zewo_io) and the install steps (Swift Package Manager) appear only on those plain-http pages and nowhere on an https page, so installMethod and x are not recorded; the README has no install section. The README says Zewo is not a web framework and calls itself a library; categories follow that wording, not the CSV's framework. The last push and last commit are 2020-03-26; the last release is 0.16.1 (2018-04-13). No archive flag, deprecation or end statement was found, so status stays accepted; the import moves a record with no release for four years to stub on its own. firstRelease is 2015 from the tag 0.1.0, whose commit is dated 2015-12-26; the oldest GitHub release object is 0.8.0 (2017). Maintainer is the copyright holder in LICENSE.md, with no legal form. The runtime value swift follows existing records; runtimeMin is the swift-tools-version the manifest declares. Whether the code can be installed without the plain-http docs is for a reviewer: the manifest declares a library product, but no https page gives install steps.
