notes: >
  The README says "A solid base built on Normalize.css" and the homepage says Pure "encourages you to write your application styles on top of it" and "makes it easy to override styles"; the modules are base, grids, forms, buttons, tables and menus. The CSV homepage http://purecss.io answers over plain http with a redirect; https://purecss.io/ answers 200 and redirects to https://pure-css.github.io/, so the https address is recorded as the homepage and the redirect is noted here. The Get Started page at purecss.io/start/ also resolves to pure-css.github.io. The repository's GitHub license field reads NOASSERTION, while the LICENSE file and the npm metadata give the BSD-3-Clause license; the LICENSE file names the Yahoo! Inc. BSD-3-Clause license, and both statements agree, so one entry is recorded with the npm figure as its API source. The LICENSE copyright line names Yahoo! Inc. for 2013, which is the maintainer as the license states it; no page read gives Yahoo's country, so hqCountry is not recorded. The npm weekly figure is for the install-docs package purecss and covers 2026-10-19 to 2026-10-25. The npm latest 3.1.0 is the highest stable GitHub release. The npm next tag 2.0.0-rc.1 is a prerelease and is not used. firstRelease is 2013 from the oldest GitHub release v0.1.0 (2013-07-02). The repository's contributors are counted from the last page of the Link header. The Get Started page gives the CDN link and version, so installMethod is cdn; no npm install command is quoted from a page read.
