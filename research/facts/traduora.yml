notes: >
  Homepage: traduora.co answered 404 with a Next.js error page on a second read on 2026-11-03, so the record links the project's own docs site, which answers 200 and describes the software; facts first read on the homepage now cite the docs or the README, and the X link, found only on the homepage, is no longer recorded.
  Self-hosted only. The FAQ at docs.traduora.co/faq says "There is no hosted version of Traduora at the moment", and the terms at traduora.co/tos say "There is no hosted Ever Traduora", so no hostedOffering is recorded. The terms sell a self-hosted commercial licence for a copy, as a subscription or a one-off licence, with plans at ever.co/pricing (the pricing page's "Pay once and self-host" tier for Traduora, and its member limits). It is a licence for the product as a whole and the tiers change member limits, so no paidEdition is recorded. The contracting party for that licence is Ever Technologies LTD (Bulgaria, company number 204599535), and the privacy notice says Ever Co. LTD owns the intellectual property in the software; Ever Co. LTD is the maintainer. The GitHub API reports the license as AGPL-3.0 and the README badge says AGPL-v3; the terms say "v3.0 only", recorded as the one wording. The LICENSE file holds the FSF text and no copyright line. The runtime comes from the configuration page ("The node runtime environment"); the Node.js v10+ build prerequisite is a build requirement and the Docker image is the first install route, so no runtimeMin is recorded. The deployment page says the database type can be any typeorm connection type (mysql, postgres, sqlite), but the same page states Traduora requires MySQL 5.7+, so only MySQL is recorded. The admin user is seeded by default; the README describes a default password published in versions 0.21.0 and 0.22.0, which is not recorded as a fact. The homepage claims "more than half a million downloads and 1500+ stars"; the figures recorded are the GitHub API stars and the Docker Hub pull count. The contributors count runs over all pages (34). The community CLI at github.com/iilei/traduora-cli is labelled "not official" in the README and is not recorded. The X link is the Ever platform account shared by the group's products, not one for Traduora alone.
