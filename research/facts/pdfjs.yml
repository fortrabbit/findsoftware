notes: >
  The record is the pdf.js project; the install docs name the pdfjs-dist package for web applications, and its npm figure is recorded under npmName. The repository has 91 GitHub releases and the latest stable is v6.5.438 from 2026-11-01, so currentMajor is 6. The earliest tag in the repository is milestone-0.2, dated by its commit 2011-07-02, which sets firstRelease. The homepage is the project's own site; its footer names Mozilla and individual contributors as the copyright holder, and the README says the project is supported by Mozilla. The README says the project is community-driven and gives a Matrix room for questions; that chat is not recorded as forum. The homepage says the documentation is licensed under CC BY-SA 2.5; the license field describes the code. The README's online demo links are the viewer, not a hosted service. No runsAs or runtime is recorded because the README does not state where the library runs; the pdfjs-dist engines field in the npm registry lists a Node version that the README does not mention, so runtimeMin is left out.
