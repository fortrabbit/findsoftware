notes: >
  The homepage (https://vincentgarreau.com/particles.js/) is the project's own site and answers over https; it hosts a configuration generator and CodePen demos, which are demos on the same site, not a hosted service. The latest GitHub release is 2.0.0 (2015-05-09), and the default branch was last pushed on 2024-03-28; the newest release is more than four years old, so the import judges listing by latestReleaseDate. The README's Packages install section also lists Rails Assets and Meteor (third-party package indexes), which are not recorded as install routes. The README's CDN line points to jsDelivr ("Please use this host or your own"), recorded as the cdn route. The README's usage shows loading particles.js with a script tag and calling particlesJS.load with a DOM element id and a JSON configuration file; no sentence says the library runs in the browser, so runsAs is left out (a reviewer may take the visitor's browser from the usage example). The README names no rendering target, so none is recorded. The LICENSE copyright line is "Copyright (c) 2015, Vincent Garreau", and package.json names the same author. The first GitHub release is 1.0.0 (2014-11-12), the repository was created 2014-09-06; the npm package was first published 2015-05-09, later than the GitHub release. The homepage's share buttons link to third-party share endpoints; they are not social accounts of the project. Stars and contributors belong to the repository, and the npm figure counts particles.js, the package the README installs. The README options cover the particle number, color, shape, opacity, size, line links, movement and interactivity settings in the JSON file.
