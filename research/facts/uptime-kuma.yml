notes: >
  The CSV row dates 2026-10-09, which matches the latest release 2.5.6. The project's documentation URL redirects to the GitHub wiki, and the wiki pages returned only the GitHub page shell to curl, so the install facts come from the README at tag 2.5.6 and the homepage. The default branch is on 3.0.0-beta.0, whose package.json requires Node.js >= 26.2.0; this is a pre-release line and is not recorded as runtimeMin. The maintainer is the GitHub account that owns the repository. The docker value is a coined kind for the image tag the homepage shows.
