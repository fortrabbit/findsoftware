notes: >
  currentMajor is 0: the project is on the 0.x line, and its latest stable release is 0.17.0 (the docs pin ^0.17). The repository created_at is 2021-02-04, which is not a first release, so firstRelease stays unknown. The CSV note mentions a window ending 2026-12; no source on the project's pages, repository or changelog states an end date, so no status fact was written. The homepage says "composer require" is the install step; the record's installMethod is the composer command, and the quickstart creates a public/index.php entry point. The community page says the project offers commercial support through clue·engineering; no paid edition of the software is named, so paidEdition stays unknown. hqCountry DE comes from the imprint on clue.engineering, which is the imprint of the clue·engineering the homepage names as the company behind Framework X. The maintainer is recorded as the homepage states it. basedOn ReactPHP rests on the homepage FAQ: it builds on existing open-source projects and uses ReactPHP for its event-driven architecture.
