notes: >
  The docs site (docs.totaljs.com) serves an empty JavaScript shell to the request, so no install, deployment or requirements page could be read; the install line comes from the README. The npm package named in the README is total4, with latest 0.0.99 published 2025-03-01; the repository master declares 0.1.0-1, which is not on npm. currentMajor is the npm dist-tag major (0) as the brief sets it; the project calls itself v4. The npm package total.js (3.4.13, repository totaljs/framework) is the older line and is not recorded. The LICENSE file holds two MIT blocks: Peter Širka (2012-2024) and a second MIT block for Jozef Gula (2011); GitHub detects the file as NOASSERTION. The LICENSE copyright line names Peter Širka, which is recorded as maintainer. The privacy policy names Total Avengers s.r.o. as the operator of the website only, and the site footer reads "© 2026 Total.js Platform / Total.js CMS", so no page states the project's maintainer beyond the LICENSE. firstRelease is not recorded: the total4 package was first published on npm in 2020, but the older total.js package (3.x line) dates from 2014 and the LICENSE copyright starts in 2012. The install line in the README names total4; the repository framework5 (Total.js v5, npm total5) exists, but the install docs read name total4, so total4 is recorded. The README calls the framework "similar to PHP's Laravel or Python's Django or ASP.NET MVC" and says it can be used "as a web, desktop, service, or IoT application". The website also offers a hosted cloud and online services, with no prices recorded. Weekly npm downloads are for 2026-10-12 to 2026-10-18.
