notes: >
  The project's own site is the GitHub Pages site at pietroppeter.github.io/nimib, which holds the rendered documentation and examples. The README says the ecosystem is being migrated to the NimibLand organization on GitHub; the repository named as source is still pietroppeter/nimib, so it is recorded. The nimble package file requires nim 1.4.0 or newer; it is a repository file, not a page, so runtimeMin is left unknown. Nim compiles to native binaries, so no runtime is recorded. The README says to compile and run the Nim file and open the generated HTML file, which does not state where the software runs, so runsAs is left unknown. The README names no rendering mode; the output is HTML documents and renderingModes is left unknown. The release list holds 27 releases with v0.1.1 (2021-05-14) as the oldest, which sets firstRelease. The nimble registry (nimble.directory) has no download figure recorded here because it is not one of the registries the research uses.
