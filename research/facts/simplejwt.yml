notes: >
  The homepage is the Read the Docs site, which redirects from the CSV address to its /en/latest/ path; the redirect target is recorded. The repository belongs to the Jazzband organization, which the README badges name; the maintainer follows the LICENSE.txt copyright line, which names David Sanders alone, and the docs footer gives the same name. The jazzband.co front page says Jazzband is winding down and its projects are being transferred to new homes; this repository is not archived, still receives pushes and names no new home, so that notice is no end signal for the project. The README sentence "a JSON Web Token authentication plugin for the Django REST Framework" is the basedOn django-rest-framework statement. The docs Requirements block lists Django and Django REST Framework versions; that is a requirement list, not a statement of a parent, so Django is not recorded as basedOn. The two runtimeMin entries come from different sources: setup.py at the v5.5.1 tag (and the PyPI requires_python) says 3.9, and the docs Requirements block lists supported Python versions from 3.10. The Acknowledgments section says the project borrows code from the Django REST Framework and concepts from django-rest-framework-jwt, and that both licenses are kept in the repository's licenses directory (BSD-style and MIT); that is an acknowledgment, not forkOf or alternativeTo, and the sdist manifest ships only LICENSE.txt, so those licenses are no license entry of the package. The docs describe a token blacklist app, installed through INSTALLED_APPS with its own migrations, a stateless authentication backend that does not look up the user in the database and that the page says can help with single sign-on between separately hosted Django apps sharing one secret key, and a drf-yasg integration page. The setup.py install requirements name django and djangorestframework minimum versions. The cryptography extra is optional and not recorded as a runtime. The PyPI figure is the pypistats last-month count as of the check. The stars and contributors belong to the single repository; the CSV figures were earlier readings.
