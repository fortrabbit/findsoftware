notes: >
  Status is discontinued on the project's own homepage, which carries the note "Consider this deprecated." beside a pointer to Macro.swift, described there and in the README (2021-11-09 note) as the more modern version. The README note says the project is not recommended for production. The repository is not archived and its last push is 2021-11-09; no registry package exists (Swift Package Manager only), so no registry figures are recorded. Every GitHub release, from 0.2.7 (2016-06-16) to 0.6.5 (2019-03-16), is flagged as a prerelease, and the tags 0.6.6 and 0.6.7 have no release object, so no stable release date is recorded and currentMajor 0 comes from the highest tag 0.6.7. The license is a copyright line only ("Copyright (c) 2016 ZeeZide GmbH"); GitHub reports no license, so no license fact is recorded. The about page calls the project a Node.js port; the record does not list basedOn Node.js because the project builds no code on Node. The CSV row gives status accepted; the record moves to discontinued on the homepage statement. The about page lists a mailing list at Google Groups and a Slack channel; only the mailing list is recorded as forum. The start page names Mustache templates in its express-simple example. The homepage is recorded with https, which answers 200 (the CSV gives http). The docs and install pages are old (Swift 3 era) and say the project has no full documentation, so the install method is stated only as the start page gives it.
