notes: >
  The Spin Pro Laravel Template, sold at getspin.pro, is a separate paid template product with its own feature table in the README, not an edition of this tool, so no paidEdition is recorded. The docs say Spin is built on Docker Compose (local development), Docker Swarm Mode (production) and Ansible (server provisioning) under the heading "What Spin Is Built On Top Of"; none of these is a record id, so no basedOn is recorded. Docker Desktop is a stated requirement on macOS and is not recorded as basedOn. The docs describe two deploy routes, "spin deploy" from the developer's machine and GitHub Actions; production containers run in Docker Swarm on servers the user provides or Spin provisions, and no page calls them always-on, so runsAs is local only. The repository license is GPL-3.0 through the GitHub API; the LICENSE file names the GPL version 3 text and carries no copyright line of its own. The maintainer is the legal entity from the terms page; the README names two founders, Dan Pastori and Jay Rogers, who are not recorded as maintainer because the terms name the company. The hqCountry value follows the privacy policy statement that the product is operated in the United States; the terms page names no country, so the reviewer may decide. The packagist total is the figure the Packagist package endpoint reports; npmWeeklyDownloads covers 2026-09-28 to 2026-10-04 for the scoped package. The npm dependents are for the npm package; the Composer package has three dependent repositories on ecosyste.ms and no dependent packages. The first GitHub release is v0.1.0-0 (2021-12-02). Highest stable release is v3.5.2 (2026-09-29); prereleases exist only up to 3.0.0-beta10 (2024-12).
