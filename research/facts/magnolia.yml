notes: >
  Magnolia has no public core repository: the magnolia-cms GitHub organization holds demos, tutorials and documentation sources, and no DX Core or Community Edition source, so no repository is recorded. The Community Edition is downloaded as a zip that contains an Apache Tomcat directory with the Magnolia webapps, per the install page; the Certified stack page names Tomcat 10.1 and Java 17 to 25, and the Java 17 line calls it the build base, so no runtimeMin is recorded. The GraphQL module page marks the module as bundled with DX Core, so the graphql headlessApi entry applies to DX Core and the Community Edition is not stated to include it; the REST delivery endpoint is recorded separately. The templating page names FreeMarker as the script language and says a template script is interpreted by a renderer to produce HTML, recorded as server rendering; Magnolia also has an SPA renderer for headless front ends. The hostedOffering is Magnolia DX Cloud from the pricing page, no price recorded. The license page says the Community Edition is free and open-source under GPLv3 and that DX Core needs a key; both statements are recorded as separate license entries. The About page says Magnolia was founded in Basel, Switzerland, in 1997. The Certified stack page names the Apache Jackrabbit Java Content Repository as the repository, stored in the databases listed. The contact page lists Magnolia International Ltd, Münchenstein (Basel), as the headquarters entity, recorded as maintainer; the About page names GENUI as majority shareholder since 2022, which is not recorded as parent. The SSO module and the Multisite module beyond one site are extensions or bundled with DX Core under the DX Core license; the Community Edition allows one site. The currentMajor comes from the release notes list on the releases page, not from a registry. The homepage describes a hosted Cloud deployment next to the on-premise editions; no price is recorded.
