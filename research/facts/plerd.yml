notes: >
  The CSV homepage http://jmac.org/plerd/ redirects to https and the https page answers 200; the https address is recorded. The README describes plerdwatcher as a daemon that watches the source folder and says the source folder can sit on the web server, synced by Dropbox or rclone; runsAs lists only static because the README says the live site is static files and plerdall can regenerate them by hand. The release history starts at tag "0.1" (2015-02-08); the repository was created in December 2014. The current release is tagged "2.000" (2026-07-25) and needs a newer Perl than 1.x; the 1.x line is kept on the maint/1.x branch. The README says LLM-based coding assistants wrote parts of the code from version 1.900 on; no field holds that. The author's personal links (Twitter, masto.nyc, jmac.org contact) are not recorded as project accounts. The homepage names a Freenode IRC channel; not recorded. The CPAN distribution (cpanm Plerd) is not in the list of registries, so no download figure is recorded.
