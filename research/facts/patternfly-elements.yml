notes: >
  The monorepo also ships create-element and pfe-core, and the install docs name @patternfly/elements, the figures above are for that package. The highest GitHub release of @patternfly/elements is 5.0.0 (2026-05-03) and the site documents the pf-v5 elements. The homepage shows usage in HTML, React, Vue, Angular and Svelte, and no page states a framework the elements are built with, so no framework basedOn is recorded. The homepage wording "based on PatternFly design" is a design basis, not a statement that the elements implement or are built on the PatternFly design system software, so no basedOn patternfly is recorded. The homepage describes the project as community-created while the LICENSE copyright line names Red Hat, Inc.; both are recorded. npmWeeklyDownloads counts installs of @patternfly/elements, which the get-started page names as the install package.
