notes: >
  The icon set is distributed as the npm package @radix-ui/react-icons, which the docs name as the install route. The repository is a pnpm workspace; the npm figures are read from the package the docs name. The GitHub releases list holds only the 2021 tags 1.0.0 to 1.0.3, and the registry's latest 1.3.2 was published 2024-11-14, so latestReleaseDate and the registry-based dates come from npm; currentMajor 1 is the same on both. The npm weekly figure is the sum of the daily downloads for 2026-10-19 to 2026-10-25. The icon set is in the CSV as a boundary row, and its scope call is recorded there: categories follow the icon-set mapping. basedOn is not recorded: the docs sentence "All icons are available as individual React components" describes the package's form, and no page says the package requires React. The LICENSE and README name WorkOS as the copyright holder with no legal form; the homepage says "Made by WorkOS". The authors listed in the README are individuals and are not recorded as maintainer. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header (last page 15). The ecosyste.ms counts are for @radix-ui/react-icons.
