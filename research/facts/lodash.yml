notes: >
  Lodash is a general-purpose utility library, accepted under the ruling that general-purpose utility libraries used in web apps count as helper libraries, as are effect, es-toolkit and immer. Criteria 1 to 3 hold for it as a helper library: npm install is documented, and the README shows a browser script include only in a code block, so it is no installMethod entry, and the MIT license is stated. The LICENSE file names OpenJS Foundation and other contributors as the copyright holder, and the README says the project is part of the OpenJS Foundation's governance and is being rebooted for a feature-complete maturity stage with Sovereign Tech Agency support, with a draft charter and a technical steering committee to come; the maintainer follows the LICENSE copyright line, and the homepage footer words it as \"Maintained by the core team with help from our contributors\". The LICENSE also credits Underscore.js (Jeremy Ashkenas, DocumentCloud and Investigative Reporters and Editors) and says sample code in the documentation is CC0; the CC0 grant covers documentation samples only, so it is no license entry of the library. The GitHub API reports the license as NOASSERTION because the LICENSE file holds several statements, which is why the license is recorded from the README and the LICENSE text. The runtime values come from the homepage's tested-in sentence beside the README's Node.js installation section; the statement is a tested-in list, not a minimum, and the package declares no engines field, so runtimeMin is not recorded. The README links a Twitter account, a Gitter chat and a CDN copy list on jsDelivr; these are not recorded as fields, and the CDN list is a label without a sentence naming the route. The first GitHub tag is 0.1.0 from 2012-04-24, and the newest stable release is 4.18.1 from 2026-04-01; npm figures are for the lodash package the install docs name, which is not a monorepo. The GitHub stars and contributors belong to the single repository. The README says the library is exported as a UMD module, that lodash-cli generates its builds, that cherry-picked methods make smaller bundles, and that per-method packages and lodash/fp are module formats.
