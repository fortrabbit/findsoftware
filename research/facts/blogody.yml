notes: >
  Stub: www.blogody.com now redirects to blogody.com, a blog about blogging with no product page, so the hosted service is no longer visible; a live product page would settle it. The only trace is the npm package @blogody/api-client, whose registry description reads "An isomorphic JavaScript/TypeScript client for Blogody. This package makes pulling data from headless Blogody CMS a breeze." The package is a client, not the product, so its license, versions and download figures are not recorded as the product's. No homepage is recorded because the domain no longer shows the software.
