notes: >
  Major and release dates: the highest stable GitHub release is 3.0.12 (2026-09-30); 2.9.12 is the 2.x line and is not the highest. The Maven Central metadata lists 3.1.0-M9 as latest, and the GitHub tag 3.1.0-M9 (commit 2026-04-12) is the newest pre-release, recorded as latestPrereleaseDate; no GitHub release object exists for it. firstRelease is the year of the oldest tag the API returned for dating (2.0, commit 2012-03-13); the 1.x line predates it, and no playframework.com page read dates a 1.x release (the changelog's oldest dated entries are 1.2.x patch releases, 2015) and Maven Central holds only 2.x and later under the typesafe and playframework groups, so 2012 stands as the oldest dated release. Maintainer: the README's copyright comment names "The Play Framework Contributors" (2022 onward) and "Lightbend Inc." (2011-2021), recorded as the first statement only; Lightbend is not a maintainer statement for the current project. Play 3.0 replaces Akka with Pekko, per the installation page; the page does not name a parent project, so basedOn is not recorded. Java requirements: the page lists Java LTS 11, 17 and 21 and recommends 17; runtimeMin records 11 as the lowest version the page names, and the page says Java 11 support will be dropped. The docs' Production page is navigation and a license line; the deployment and requirements pages carry the facts. Anorm is a separate project per the Anorm page; databases are not recorded. The deployment page says the dist build needs only a Java installation on the server. No paid edition or pricing page was read, so paidEdition and pricingPage are unknown.
