notes: >
  Doubt: nordhealth.design returns an empty page to a plain fetch and the repository is not public, so install steps (criterion 3) could not be read; a readable install page would settle it. The package LICENSE.md, read through unpkg, which serves the files of the npm package, says Nordhealth grants a limited license to use the package solely for performing duties for and on behalf of Nordhealth and forbids other use, so criterion 2 is also in doubt. The npm author field reads "Nordhealth" and the LICENSE.md names Nordhealth Ltd; its governing law is the laws of Finland, which is no headquarters statement. The package README on npm is the development readme of the components package and the package.json has no repository field; the README badges point to github.com/nordhealth/design-system, which is not public. The npm figure counts @nordhealth/components for the range 2026-10-18 to 2026-10-24. The latest npm release is from 2026-10-15 and the next tag 5.0.0-alpha.0 is older.
