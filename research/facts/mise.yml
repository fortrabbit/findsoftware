notes: >
  Boundary settled per notes-server-infra: runtime version managers are developer tools, so the record is in with runsAs local. currentMajor is not recorded: the releases are calendar versions (v2026.10.24), so the line is 2026.10 and goes here, not in the major field. latestReleaseDate is the API's published date of that release. Category dev-tool follows the existing map: the import has no version-manager entry; the homepage also describes running tasks and bootstrapping a machine (system packages, dotfiles, services), which are not recorded as fields. The tool registry of more than 1,000 tools (mise.jdx.dev/registry.html) is a list of installable tools, not a plugin directory, so pluginDirectory is not recorded. The npm package named "mise" is the one the install page names; the page says the older @jdxcode/mise package should not be installed, so that name is not recorded. The Docker Hub figure is for jdxcode/mise, the Docker Hub image the install page names; the ghcr.io image has no figure. The GitHub owner is the user jdx; the LICENSE copyright line names Jeff Dickey. No hqCountry: the GitHub profile location is not a page of the project or a company address. The homepage shows a sponsor line (Entire, Omacom Foundation); no field. Prose sources: the backends list (GitHub releases, Cargo, npm, PyPI) and per-project version pinning from the homepage, and the npm package statement from the install page. Fields coined: none.
