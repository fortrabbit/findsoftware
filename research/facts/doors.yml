notes: >
  The homepage https://doors.dev answers with a redirect to a regional host, and the page read is the one it serves. The project's GitHub releases list six releases (v0.12.7 to v0.17.0, all stable); the repository also carries tags for release candidates (v0.18.0-rc1 to rc10) that have no GitHub release, so no latestPrereleaseDate is recorded. The oldest tag is v0.0.1, committed on 2025-06-23 (the day the repository was created), which sets firstRelease; the oldest GitHub release is from 2026. The homepage names the framework's own parts: GoX, the Go language extension, is a separate repository (github.com/doors-dev/gox) and is recorded as templating. The homepage footer gives the company as doors dev LLC with a Wilmington, Delaware address; the legal form is LLC as the page writes it. The contributor count is one contributor on the default branch.
