notes: >
  Node.js server from parse-community/parse-server; the README says it works with Express ("Parse Server works with the Express web application framework") and that it can be mounted on a new or existing Express app, which is a works-with statement and not a based-on statement, so basedOn is not recorded. The default branch is alpha; the release branch is named release in the README, and the LTS branches are release-<version>.x.x (8.x, 7.x and older). The highest stable release is 9.10.7 (2026-10-24), so currentMajor is 9, while the newest stable release by date is 8.6.119 (2026-10-30, the 8.x LTS line); latestReleaseDate follows the date rule, and runtimeMin is read from the 9.10.7 manifest for the current major. The alpha prerelease 9.10.8-alpha.4 (2026-11-02) is newer than the latest stable release, so it is latestPrereleaseDate. The README compatibility tables list MongoDB 6 to 8 and PostgreSQL 13 to 18 with support windows; the support windows are not recorded. Live Query (WebSocket server for real-time queries), GraphQL (REST and GraphQL APIs, --mountGraphQL), Cloud Code triggers and webhooks, push notifications, and third-party authentication adapters (the guide states "Parse Server supports 3rd party authentication by using authentication adapters") are documented features with no field; the guide does not name SAML, OIDC or LDAP, so sso stays unknown. Back4App deployment guides in the guide are third-party hosting, not a hostedOffering. The endoflife.date API has no entry for parse-server. The Twitter link is an account follow badge in the README. The LICENSE file names no copyright holder; the maintainer follows the README, which calls Parse Platform the maintainer of the official adapters and thanks sponsors for supporting its development. The GitHub organization is parse-community. The guide says to install Parse Dashboard globally, as a separate project from the server repository, so adminUi is not recorded for the server itself.
