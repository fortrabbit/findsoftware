unreadable:
  - "https://pigjian.com/ (the project's homepage named in the README; GET and HEAD answer 416 Requested Range Not Satisfiable with no body)"
  - "https://manual.pigjian.com/ (named in the README as the documentation; DNS does not resolve)"
  - "https://example.pigjian.com (named in the README as the example; DNS does not resolve)"
notes: >
  The CSV names the homepage as https://www.pigjian.com; the README names https://pigjian.com, and the homepage is the author's own site, which the README header presents as the project's site. The GitHub repository is the one the project names as its source. The latest stable tag is v1.5.3 (2019-11-04), and Packagist's p2 file gives its require.php as >=7.1.3; the README states "PHP >= 7.2.5" and the default branch composer.json requires "^7.3|^8.0", so the three statements differ and runtimeMin uses the release only. The default branch composer.json requires laravel/framework ^9.0 while the v1.5.3 release requires 5.8.*, so basedOn names Laravel without a version. The README title says PJ Blog, and the repository and CSV call it jcc/blog; the name field follows the README. The README lists "Laravel 5.*" and "Laravel 7.*" in different places and the default branch was last pushed on 2023-06-08, which is recorded only as the repository's push date and is not a signal of end. The Packagist release and the default branch both state MIT, and the LICENSE copyright line names Jiajian Chan with the year 2016. No install step or quote names a web server, so runsAs is not recorded.
