notes: >
  The repository has no stable GitHub release: its only release is the rolling "nightly" prerelease, dated 2023-02-08, so latestPrereleaseDate carries that date and currentMajor and firstRelease stay unknown; a reviewer decides whether the rolling tag should count. The GitHub API reports no license. The README states CC BY-NC 4.0 for the software and the repository has no LICENSE file on master; the homepage footer, next to its copyright line, says CC BY 4.0, which is not recorded as a license because it sits in the site footer, not in a statement about the software. The homepage is a Chinese-language site (紙小墨) with an English switch and a footer dated 2017 to 2023; its footer copyright line names 紙小墨 (the project's name in Chinese) and no legal entity, so that is the recorded maintainer; the GitHub organization is InkProject. The homepage's "RELEASE 2017-09-24" line is not recorded as firstRelease because it is not labelled as the first release. The README describes the Go toolchain for building from source and a Docker build example, and gives no minimum Go version. The "Themes" section lists theme repositories by other authors, which are not recorded.
