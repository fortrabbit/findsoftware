notes: >
  The record covers the hosted AddSearch service. The GitHub client repository AddSearch/js-client-library (npm addsearch-js-client, 1.2.3 in the install snippets) and the search UI repository AddSearch/search-ui belong to client code and are not the service's repository, so no repository is recorded; the npm figures of 2.1k a week in the candidates row are not recorded. The about page (addsearch.com/about) says the company was founded in Helsinki in 2013; no firstRelease is recorded because that page does not state a first release. The Quick Install page states a script tag loaded from the AddSearch CDN with the site key. The installation guidelines and API reference pages carry no further install facts beyond that. The pricing page states a 14-day free trial and a 99.9 percent SLA on plans other than Core and Growth; neither is a free tier, and no prices are recorded. The homepage states a 99.99 percent SLA while the pricing page states 99.9 percent; the two figures are not reconciled and no SLA field exists. The footer of the homepage links Facebook, X, LinkedIn and YouTube; only X and Facebook are recorded as fields, and LinkedIn and YouTube have no field. The homepage states AI features use OpenAI models across 30 languages; those are not recorded as fields. The httpArchiveSites value is the mobile origin count for the Addsearch technology.
