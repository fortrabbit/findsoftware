notes: >
  Boundary ruling for this wave: plotly.py is accepted because its own pages say the output is an HTML file that opens in a web browser ("Any figure can be saved as an HTML file using the write_html method", plotly.com/python/interactive-html-export/) and can be inserted into HTML templates. The README also says graphs can be viewed in Jupyter notebooks and marimo; those are notes only. The HTML output is stated on the export page: "Plotly allows you to save interactive HTML versions of your figures to your local disk." (plotly.com/python/interactive-html-export/). The PyPI package is plotly; the README names it in pip install plotly. The PyPI first upload is version 0.2 on 2013-06-12, and the oldest GitHub tag is 0.5.7 on 2013-12-25, so firstRelease is 2013 on both counts. The runtimeMin comes from the pyproject.toml at the v7.1.0 tag, the latest GitHub release. The pypistats figure is the last month, a rolling window with no fixed dates. The LICENSE.txt line is the maintainer; the README's copyright footer on the Plotly homepage reads "Copyright 2026 Plotly. All rights reserved." and is not used. The README states that plotly.py is built on top of plotly.js and the plotly-js record carries that charting engine. The README labels the Plotly community forum (community.plotly.com) as the user forum and the community forum, so it is recorded as the forum. The homepage at plotly.com/python/ lists Plotly Studio and Plotly Cloud, which are hosted products and not recorded. The adoption figure for the homepage is not recorded beyond the pypistats figure.
  The export page says a self-contained HTML file inlines a copy of plotly.js, which makes the file large (5Mb+), and that the export options control its size. The export page names the to_html method for returning the HTML as a string. The README says the figures can also be viewed in Jupyter notebooks and marimo. The README says static image export uses the kaleido package, which requires Chrome or Chromium, and that Jupyter widget use needs the jupyter and anywidget packages; both are separate pip installs and not recorded as routes. The README says the Plotly graphs can also be integrated into Dash applications.
