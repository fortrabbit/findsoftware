notes: >
  Chinese-language sources; quotes are the original text. The GitHub license field reports NOASSERTION while the README and composer.json state Apache-2.0; both statements are recorded. The install command in the README creates the topthink/think application skeleton, which requires topthink/framework, so registry figures come from topthink/framework. The homepage is recorded as https://www.thinkphp.cn; the CSV carries http://www.thinkphp.cn, which redirects to the https address. The maintainer is the legal name the homepage copyright line and the README trademark line give, with its 有限公司 legal form; its address is not stated on the read pages, so hqCountry stays unknown. The README names think-orm as the ORM dependency (think-orm 3.0+); it is a separate package and is not recorded in databases. The official manual at doc.thinkphp.cn is a client-rendered page; its content was not read, so docs rests on the README link. ThinkPHP's cloud services are run by a separate company named in the README, not recorded as parent. Packagist's latest stable is v8.1.4, matching the GitHub release.
