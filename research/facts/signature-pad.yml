notes: >
  The homepage is the Signature Pad demo on GitHub Pages, which the README names as its Demo; the README's link is plain http, and the same page answers over https, so the https address is recorded. The package.json homepage points at the repository, so the repository is not recorded as a homepage. The npm figure is the signature_pad package the install route names; the period is 2026-11-01 to 2026-11-07. The stable line is 5.x: v5.1.4 (2026-07-31) is the highest stable release and the npm latest; the v5.0.0-beta.1 prerelease (2024-04-05) is older than the stable release, so no latestPrereleaseDate is recorded. The oldest tag v1.0.0 is dated 2013-09-07 (committed date of the tagged commit), earlier than the npm upload 1.3.3 (2014-09-29), so firstRelease is from the tag. The CSV names forms and signature as categories; the project's own pages say "drawing smooth signatures" on an HTML5 canvas, so the category is canvas, and the import has no signature category. The README says the library "doesn't depend on any external libraries", so no dependency is recorded. The HTTP Archive technologies file lists no Signature Pad entry, so httpArchiveSites is absent. The LICENSE copyright line names the author as the maintainer; the package.json author field gives the same name.
