notes: >
  The project has no GitHub release, only tags, so currentMajor comes from the Clojars latest version and latestReleaseDate from the commit the Clojars scm entry names for that version. firstRelease is the date of the oldest entry on the project's news page (Reagent 0.0.2, 2013-12-17); the Clojars API gives no upload dates, and the Clojars repository listing shows 2020 for the oldest version, which is a re-signed upload and is not used. The homepage was served over http in the candidate row and answers over https, which is what is recorded. The LICENSE copyright lines name Dan Holmsand (2013-2017) and "Reagent contributors" (2017); the maintainer field takes the later line, so a reviewer may prefer the name Dan Holmsand. The ecosyste.ms Clojars entry reports zero dependent packages and zero dependent repositories for reagent/reagent, which does not match a package with several million Clojars downloads, so dependents are left out as unknown. The README's Clojure Slack channel and the third-party video links (affiliate parameters, a paid course) are not recorded: no field holds a chat channel, and the links are not the project's own. The README says to provide React using npm "when using e.g. Shadow-cljs", and to use cljsjs packages for React 18 or older. The Clojars group name is reagent; the install docs name project.clj only, so no deps.edn or npm figure is recorded; React is not counted. The runtime is not recorded: Clojure runs on the JVM at build time and the page does not state a runtime for the output, which runs in the visitor's browser.
