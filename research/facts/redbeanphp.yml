notes: >
  The license page says "RedBeanPHP has been dual licensed New BSD and GPLv2"; composer.json at the latest release says BSD-3-Clause. New BSD and BSD-3-Clause are one license in two wordings, so the BSD entry is one entry, and GPL-2.0 is the second entry from the license page. GitHub detects no license for the repository, and the repository root has no LICENSE file; the license text ships in the download tarball as license.txt, which is not read here. The requirements page says RedBeanPHP requires PHP 5.3.4 or higher and PHP 5.3.0 minimum in its summary; the homepage claims tests on PHP 5.2 through 8.5. The About page lists existing applications with a custom database under less suitable projects and names Propel to use instead, recorded as alternativeTo. The first release year follows the About page footer line "since 2009"; the oldest GitHub tag (v3.2) is dated 2012. The Frameworks page says RedBeanPHP is a framework agnostic library, so no basedOn is recorded. The download is the recommended install: the README says "Installation (recommended)", the install page says the tarball holds a license.txt and the compiled rb.php script, and the README says RedBeanPHP is one file with no autoloaders and no package tools. The Composer route is marked not recommended on the install page and is recorded as its own route. The install page's Composer section names the dev-master branch; packagist versions are not used as the stable version. The Google Group named as Forum on the homepage is the project's forum link. The homepage's Monero donation block and sponsor link are not recorded. The GitHub profile location is not recorded as hqCountry. Coined kinds from the site's pages stay in notes and out of fields.
