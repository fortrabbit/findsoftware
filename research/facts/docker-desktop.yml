notes: >
  No repository: Docker Desktop has no public source repository of its own (the docker/desktop-release-notes repository returns 404 via the GitHub API on 2026-10-28), so the record is a desktop app with a download install, not a GitHub-sourced one. Operating systems, read 2026-10-28: macOS, where the install page says Docker Desktop "is supported on the current and two previous major macOS releases"; Windows 10 22H2 and Windows 11 23H2 or later (Enterprise, Pro or Education editions, with Home limited to Linux containers); and Linux distributions (Ubuntu, Debian, Fedora) from the Linux install page. The Homebrew cask, which lists version 4.97.0 and depends on macOS 14 or later, is a distribution channel and not a fact source here. The release notes page starts at 4.0.0 dated 2021-08-31 and says older release notes are kept in the documentation repository, so firstRelease is not recorded: the earliest entry on the page is not the product's first release. The release notes (4.0.0 entry, read 2026-10-28) say Docker Desktop "remains free for small businesses (fewer than 250 employees AND less than $10 million in annual revenue), personal use, education, and non-commercial open source projects." The Docker Desktop license page says it distributes components "licensed under the GNU General Public License" and links their source; this is a statement about bundled components, not a license of the product, so it is not a license entry. The Docker Desktop license page and the Docker Subscription Service Agreement name the paid subscriptions (Pro, Team, Business); their prices are on the pricing page and are not recorded. The footer social links on the product page are recorded as found: the X link is written as twitter.com in the page. The LinkedIn link (https://www.linkedin.com/company/docker) has no schema field and stays here. Adoption: the CSV row's Homebrew figure (528.1k cask installs per year, read 2026-10-19) is not re-read and not recorded; the company (Docker, Inc.) is the criterion 5 signal.
