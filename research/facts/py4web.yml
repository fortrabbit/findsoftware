notes: >
  No GitHub release exists; the repository has 188 tags, and the PyPI release is the release source. The PyPI version 1.20260805.0 leads with 1 and then carries a date; currentMajor is recorded as 1 from the registry, and a reviewer should decide whether a date-stamped version has a major at all, which would make the field absent. The earliest PyPI upload is 0.1.20190718.1 (2019-07-23), older than the earliest tag (v20200329.1), so firstRelease is 2019. The PyPI JSON endpoint returns no download figures (every period is -1), so pypiDownloads is the last-month count from pypistats.org, a third-party aggregator. The installation prerequisite reads Python 3.7+ in the docs and in the README's "Tell me more" list, 3.9+ in the README installation section, and PyPI requires_python is >=3.10; each is its own runtimeMin entry. The database drivers list also names Ingres, Sybase, Teradata and SAPDB, which are not in the databases vocabulary. The homepage calls py4web the successor of web2py, which is recorded as successorOf; no basedOn is recorded because the project does not state that it builds on web2py. The GitHub API reports the license as NOASSERTION because the license text on PyPI adds a trademark policy to the BSD text; the trademark policy restricts the name and logo and is not a second license for the code. The README says the project is not stable yet, which is recorded here as a statement on the README, not as a status.
