notes: >
  The README and DEPLOYMENT.md say the project is in development: the README says "Since we don't have a stable release yet", while GitHub marks v0.1.0 (2024-03-15) as a stable release, so currentMajor is 0 and the reviewer decides whether that release counts. The only pre-release is v0.1.0-rc1 (2024-02-23), which is the oldest tag and gives firstRelease. The docker-compose.yml SPDX header says AGPL-3.0-or-later, the same license in another wording as the GitHub AGPL-3.0, so one entry is recorded. The homepage says "Client libraries are licensed using proprietary-friendly free software licenses but the core is AGPL'd"; the client library is not this record. The installation guide offers serving the integration library yourself or loading it from a CDN such as unpkg (@mcaptcha/vanilla-glue). The deployment docs say mCaptcha does not implement SSL yet and recommend a reverse proxy such as Nginx. and the homepage calls its APIs compatible with reCAPTCHA and hCaptcha; compatibility is not an import, so nothing is recorded as importsFrom. Coined kinds left in notes: captchaMethod proof of work (SHA256), embedMethod script tag from a CDN, privacyClaims "no tracking" with cookie-free CAPTCHA routes and no IP addresses for rate limiting, redis as cache (MCAPTCHA_redis_URL), and a server-side token verification endpoint under /api/v1/pow/siteverify. The docker-compose.yml and the Docker self-hosting page name the image mcaptcha/mcaptcha:latest, while DEPLOYMENT.md builds the image locally; Docker pull counts are not recorded. The self-hosting docs name Postgres and MariaDB as supported databases and say a Redis cache (mCaptcha/cache) is optional, with an internal cache otherwise. The community page names a Matrix community, a chat route with no field. The homepage says the APIs are compatible with reCAPTCHA and hCaptcha (xCaptcha drop-in replacement); neither is a record, so no alternativeTo. The API docs section documents Rust and browser libraries, not a content API. The blog says the project was incorporated in India, which is no notice address, so hqCountry stays out. The docs badge link (mcaptcha.github.io) returns 404. The About page spells the author's name differently from the SPDX header and is not used as the maintainer source. The CONFIGURATION page mentions an instance option for commercial plans with no prices, which is not a paid edition of the software. The demo instances (demo.mcaptcha.org, demo2.mcaptcha.org) are not a hosted offering stated by the project.
