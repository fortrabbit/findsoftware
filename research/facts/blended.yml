notes: >
  The homepage given on GitHub and PyPI is http://jmroper.com/blended/, which is not linked because it answers only over plain http; the https address answers 403 to the request, so the site could not be read and no homepage is recorded. The README is the project's own documentation; it names the repository as johnroper100/Blended, which resolves to BlendedSiteGenerator/Blended, the repository recorded. The repository is archived, the signal behind status discontinued; the last push is 2017-11-21 and the README does not state an end. The GitHub releases stop at 3.3 (2016-12-23), but PyPI carries 5.0.2 (2017-04-10); the registry major is higher, so currentMajor and latestReleaseDate come from PyPI, the package the install docs name. The PyPI package named blended is this project; PyPI JSON carries no download counts, so pypiDownloads comes from pypistats (last month). The maintainer is recorded as setup.py names the author; the email address in setup.py is not recorded. The GPL-3.0 license statement on GitHub and the setup.py license string GPL3.0 are the same license. The README lists plugins on PyPI and GitHub; no plugin directory page was found.
