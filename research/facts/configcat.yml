notes: >
  Hosted service. The open-source ConfigCat Proxy (repository configcat/configcat-proxy, MIT, Go, organization-owned, current major 3, first release 2023, installed from Docker Hub or a GitHub release executable) still reads config JSON from ConfigCat's CDN with an SDK key from a ConfigCat account, and works without it only in offline mode from a cache or file; the on-premise plan on the pricing page is "Hosted or On-premise" and needs a quote and a sales contact. Vendor onboarding or a sales contact keeps the record hosted-service, so the repository, the proxy license and the proxy figures (20 stars, 6 contributors, 148002 Docker pulls on 2026-11-03) stay in notes only; the selfHostOption facts name both routes. The on-premise page says the service "is not open-source". Plan tiers (Pro, Smart, Enterprise, Dedicated) are hosting plans, so no paidEdition is recorded and no prices are recorded. The SDKs are a separate set of repositories in the configcat organisation (the candidates row names configcat/js-unified-sdk, MIT, 2 stars, no release); their figures are left out per the hosted-service rule. The homepage shows G2, TrustRadius and Trustpilot ratings; none are recorded. The homepage also states that Enterprise-level security features including SSO are in all plans; SSO and SAML are recorded from the docs. The legal name and the seat in Hungary come from the terms page at configcat.com/legal/. The HTTP API is the Public Management API at api.configcat.com, a REST API for managing flags; it is not the feature flag evaluation path. Not record fields: linkedin https://www.linkedin.com/company/configcat (https://configcat.com/).
