notes: >
  Status is accepted. The gem's documentation_uri on RubyGems is http://www.rack-app.com/, which answers 403 to the research user agent (a bot check), and https://www.rack-app.com/ and https://rack-app.com/ answer the same; the site is unreadable, so no homepage is recorded and homepage is in notFound. The GitHub wiki linked from the README as the official how-to site (Official website How To examples) and set as the gemspec homepage is recorded as docs; its pages load their content with JavaScript, so only its navigation was read. The README says the framework is inspired by Sinatra, grape and rack; this is recorded as no basedOn because the README says inspired, not built on, and the only dependency it names is rack, which is recorded as basedOn. Templating is recorded from the README's front_end extension example, whose layout file is layout.html.erb; the extension is a separate gem, rack-app-front_end, which the README says adds dependencies. The maintainer is the gem's author line on RubyGems; the README's copyright line covers the logo only. The README lists parameter validation, per-endpoint middleware, file upload and download, streaming, app mounting, static file serving and a built-in test module, says the framework is meant to be used by seasoned web developers, and says it will not gain features without real-life use cases. The README says it is used in production and that it powers Heroku-hosted micro-services; these are statements without a figure and runsAs comes from the wiki's getting-started guide, which starts the application with bundle exec rackup and a config.ru file. The minimum Ruby version is not stated by the gemspec or the README, so runtimeMin is unknown. The RubyGems version history starts with 0.1.0 on 2015-10-03, which matches the first GitHub tag. The highest stable tag is v11.0.2 (2023-09-14); there are no GitHub release objects, and the RubyGems version 11.0.2 is dated 2023-09-14. The homepage_uri on RubyGems is the wiki and the gemspec homepage is the wiki too. The prose claims about the router, the Gemfile entry and mounting come from the README (https://raw.githubusercontent.com/rack-app/rack-app/master/README.md): "The routing uses a prefix tree, thus adding a large number of API endpoints won't affect the routing lookup time"; "Add this line to your application's Gemfile: gem 'rack-app'"; "App mounting so you can create separated controllers for different task", with the usage example "mount SomeAppClass".
