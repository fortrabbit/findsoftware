notes: >
  Status: the last GitHub release and the last commit on the default branch 1.x are both 2024-03-25 (1.6.1); the repository is not archived, and the four-year stub threshold for a project with no release is 2028-03-25, so the record stays accepted; the reviewer decides whether to keep it under the stub rule's watch. Every route the install docs name: npm (cli-installation page), Docker image on quay.io/soketi/soketi (not Docker Hub, so no dockerPulls), Helm chart in the separate repository charts/soketi. Node.js LTS (14.x, 16.x) on the 1.x install page is a stated requirement, not a minimum for the latest release, so runtimeMin is left out. Pusher-compatible HTTP API: the docs describe an HTTP API endpoint that backend SDKs call to send events and to a user id, and the Pusher PHP SDK configuration (backend-configuration pusher-sdk page) and Laravel Broadcasting page show the site wiring; that is the criterion 1 statement. Webhooks to the app are documented on the app-webhooks page (soketi POSTs events to a URL the app defines) and are not recorded as a field. The Pusher protocol section on the README says soketi implements the Pusher Protocol v7; the alternativeTo fact uses the README sentence that names Pusher as what existing projects swap. The npm figure is the sum of daily downloads for 2026-10-26 to 2026-11-01 from the range endpoint, not the point endpoint. The package npm @soketi/soketi and the GitHub org soketi are the same project; the npm author field is the maintainer named above, and the GitHub owner is an organization. The LICENSE file is the AGPL-3.0 text without a copyright holder line, so the maintainer comes from package.json. The homepage soketi.app is a client-rendered page with no readable text in its HTML; the docs at docs.soketi.app are the readable primary source. The docs state the 1.x line (the docs nav reads 1.x); GitHub shows 77 tags and 51 releases, the oldest 0.0.1 dated 2021-06-21. No hosted offering or paid edition was found on the pages read. The discord and forum facts come from README sentences; the badge and the discussions board are the same links.
