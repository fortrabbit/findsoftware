notes: >
  The repository holds two projects: Entity Framework Core and Microsoft.Data.Sqlite, an ADO.NET provider for SQLite that the EF Core SQLite provider is built on. The stars and contributors belong to dotnet/efcore; the NuGet figure is Microsoft.EntityFrameworkCore, the package the install page names for the core library, and its total is the count NuGet reports for all versions. The README says the projects "are maintained by Microsoft" and the LICENSE copyright line names ".NET Foundation and Contributors"; the LICENSE line is recorded as the maintainer, and Microsoft goes to notes. The learn.microsoft.com pages are Microsoft's own documentation for the project and are cited as its homepage and docs. The README names "EF Core works with" and "and other databases through a provider plugin API"; the providers page lists more engines (Firebird, MongoDB, Oracle and others) through third-party providers, which are not recorded as databases because the sentence that names them is not quoted. The providers page warns that not all providers are maintained by the EF Core project. The hub page offers "Which version should I use - EF Core or EF 6?", a comparison of two product lines; it is not recorded as alternativeTo because it does not say alternative or switching. The install page says the runtime needs "a recent version of .NET" and points to the releases page for the minimal version; runtimeMin is the net10.0 target in the 10.0.14 nuspec, the latest stable package. The GitHub releases stop at v10.0.13 (2026-10-13), while NuGet lists 10.0.14 (2026-10-25); the NuGet date is the newest stable release. The tag v11.0.100 exists without a GitHub release, and NuGet lists only preview and release-candidate builds for major 11, so currentMajor stays 10. The newest release candidate 11.0.0-rc.3 was published on NuGet on the same day as 10.0.14, 24 seconds later, so no latestPrereleaseDate is recorded at day precision. The oldest GitHub release is 7.0.0-alpha2 (2014-07-08), from the project when it was named EF7, so firstRelease is 2014 from this repository; the NuGet package's first version 1.0.0 is not used. The license statement is MIT for the repository.
