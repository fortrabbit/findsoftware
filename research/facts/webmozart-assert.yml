notes: >
  The repository has no homepage of its own; the GitHub homepage field is empty and the README links only the repository, so no homepage is recorded. Status accepted: the newest stable release is 2.5.1 (2026-11-15), the repository is not archived, Packagist flags no abandonment, and the README names no end. The category "assertions" maps to testing in the import, so the record takes validation only, which is the README's own subject. The README's FAQ asks "What's the difference to [beberlei/assert]?" and says the library is "heavily inspired by" that package while fixing its error messages; that is a comparison and an inspiration, not a fork, so it is recorded as alternativeTo beberlei-assert, which has its own record, and not as forkOf or basedOn. The README says this package provides consistent placeholder ordering across all assertions, where beberlei/assert orders them differently for each assertion. The 2.0.0-beta prerelease of 2025-12-21 is older than the latest stable release, so no latestPrereleaseDate is recorded. The first Packagist version is 1.0.0-beta (2015-03-19), which is older than the first stable 1.0.0 (2015-05-12), and the repository was created 2015-03-11. The maintainer is the copyright holder named by the MIT LICENSE; the README's author line gives Bernhard Schussek a.k.a. @webmozart with a link to webmozart.org, which is no country. The packagist figures are total and monthly downloads from the Packagist package API. The runtime and runtimeMin are taken from composer.json at the 2.5.1 tag. No sentence states where the library runs, so no runsAs is recorded.
  The README says every assertion throws Webmozart\Assert\InvalidArgumentException when it fails, and that a custom message can use a %s placeholder for the tested value.
