notes: >
  The Packagist package is justinrainbow/json-schema (the vendor name in composer.json) while the GitHub repository is jsonrainbow/json-schema; the packagist figures come from the package the install docs name. The LICENSE copyright line reads "Copyright (c) 2016" with no name, so the maintainer comes from composer.json at tag 6.14.0, whose authors list names Danny van der Sluijs with the role Maintainer; the Packagist maintainer list also names justinrainbow, the Packagist vendor name, and the record follows the manifest's role instead. The docs homepage's "Get Started" and the README's "Installation" section give Composer as the install route; the README's git clone command has no sentence naming the route, so it is not recorded. The highest stable GitHub release is 6.14.0; the 5.3.x releases are a maintained older line, so currentMajor is 6. The homepage lists Draft 3, 4, 6, 7 and 2019-09 support and the README says features of newer drafts might not be supported, with a Bowtie compliance report linked; these are prose, not fields. The docs say the library integrates into frameworks such as Laravel and Symfony; no basedOn is set because the framework is not the parent of this library. The JetBrains logo under "Powered by" is a sponsorship mark, not a field. firstRelease is 2012 from Packagist version 1.1.0 (2012-01-03), which is also the oldest GitHub tag; the first GitHub release is 1.3.4 (2013-12-08). The runtimeMin 7.2 is the lowest PHP version in the composer.json require line at the latest release tag.
