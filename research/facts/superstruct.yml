notes: >
  Status: no end signal. The repository is not archived, the npm latest version 2.0.2 is not deprecated, and the last commit on the default branch is from 2024-09-27, inside the four-year window. Boundary note: the 2.0.0 changelog says maintenance has moved to a volunteer team of two named contributors; the LICENSE copyright line names Ian Storm Taylor, which is the maintainer recorded, and the team is noted here only. The README says the API "was inspired by" TypeScript, Flow, Go and GraphQL, and that is inspiration, not basedOn. The "Why?" section names joi, express-validator, validator.js, yup, ajv and is-my-json-valid as existing validation libraries and argues against them; it is recorded as alternativeTo for the ones that have a fact file (joi, express-validator, validator-js, yup, ajv; the validator.js link in the README points at the repository now under validatorjs); is-my-json-valid has none and stays here. The newest GitHub pre-release v2.0.3-1 (2024-07-27) is newer than the latest release. The Changelog names a maintainers Discord and GitHub Discussions. The README has no install section; the install route is the getting-started guide, which shows npm and a UMD script tag. The README badge links the JSR package; the JSR metadata lists the package at version 2.0.2, and that is recorded as the jsr route. The JSR package page lists browser, Deno, Node.js, workerd and Bun as compatible runtimes, so deno and bun are recorded beside node. The runtime node is recorded because the 2.0.0 changelog names Node.js, and the README says the library is used "on your servers and in the browser", so no runsAs is recorded. The engines field at the 2.0.2 tag is the runtimeMin source. The npm weekly figure is the sum of the daily counts for 2026-11-01 to 2026-11-07 for the package the install guide names. The ecosyste.ms dependent counts were read on 2026-11-16. The "Demo" and "Examples" sections name CodeSandbox and example files; they are not fields.
