notes: >
  The homepage goblog.app answers with a 302 to https://github.com/jlelse/GoBlog, so it is the repository, not a project site, and no homepage is recorded. The repository has no releases and no tags (releases and tags API both empty), so currentMajor, latestReleaseDate and firstRelease are unknown; the repository was created 2021-09-20 per the API, which is not a release date. Under AGENTS.md a project that never tags a release is judged by its last commit (lastCommitDate 2026-10-21), so the record stays accepted. go.mod declares go 1.27.0, but it is a repository file, not a page, so no runtimeMin is recorded. The README calls GoBlog a blogging platform with an editor, settings UI, plugins and a Matrix chat room; the chat room has no field. livePreview is not recorded: the editor preview renders inside the editor, not on the published site. Categories: a blog platform, mapped to cms by the import. The GitHub profile location is a personal profile, not a company headquarters, so hqCountry is unknown.
