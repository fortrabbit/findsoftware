notes: >
  The homepage footer reads "© 2023 Usablica. All rights reserved.", and the license file names Afshin Mehrabani as the copyright holder; the maintainer follows the license, so Usablica goes here as the only other name. The homepage is https and answers 200. The repository description is "Advanced table plugin". The homepage and install page say the table works with React, Angular, Vue and VanillaJs; the React integration page (gridjs.io/docs/integrations/react) describes a separate React wrapper that needs Grid.js as a peer dependency, so no basedOn is recorded. Grid.js is a browser library: the install page says it "can be used directly" from a CDN and the homepage shows a render call on a document element, but no page states runsAs, so none is recorded. The npm package gridjs has an ecosyste.ms first-release date of 2013, which predates this repository (created 2020-04-15); firstRelease is the oldest tag in this repository, 0.1.11, committed 2020-05-30. Stars and contributors belong to the repository. The npm figure is the sum of the daily downloads from 2026-11-01 to 2026-11-07. Dependent counts are from ecosyste.ms for the npm package. The latest stable GitHub release is 6.2.0 (2024-03-03), matching npm latest; the repository was pushed on 2026-01-29 and is not archived. The project's own pages show no end-of-life or deprecation statement. Localization and server-side storage are documented on the docs pages (localization/locales, server-side) and are not separate fields.
  The install page and the homepage show the constructor takes columns and data, and that render attaches the table to an element on the page.
