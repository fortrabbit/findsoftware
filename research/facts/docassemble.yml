notes: >
  Self-hosted community software with no paid edition or hosted product found on the homepage, deploy, download, installation, security, roles, API, language and packages pages; the deploy page says "Since docassemble is free software, there are no fees for using it". Install routes: Docker (the easiest route, per the deploy page), Docker Compose and Helm (both named on the deploy page), a manual installation without Docker (docs/installation.html), and the PyPI packages docassemble.base and docassemble.webapp (pip). The PyPI package is docassemble.webapp, named in the download page's pip command; its 1.10.15 release (2026-10-29) is the newest stable version and carries requires_python ">=3.12"; GitHub has tags but no releases, so the registry gives the version and date. runtimeMin is recorded from that registry requirement; the installation page's Python 3.12 line is the most recent compatible version, a ceiling, and is not used. The GitHub language detection reads JavaScript; the homepage states the software is based on Python, so language is Python. The first tag date is the CHANGELOG's oldest entry (0.1.4, 2017-05-27). The license entry is the code under MIT (repository); the homepage puts the documentation under CC BY 3.0, which stays here and is no license entry. OAuth2 login providers on the configuration page: Facebook, Google, Auth0, Keycloak, Authentik, Zitadel, miniOrange and Microsoft Azure; phone login is a separate option. The support page offers a Slack group (support chat, no forum field) and an announcements mailing list (newsletter). The Docker Hub pull count is for the jhpyle/docassemble image the deploy page names. The maintainer is the LICENSE copyright line's Jonathan Pyle; the homepage says "Designed and built by Jonathan Pyle". The GitHub profile location is Philadelphia, PA; it is no headquarters statement, so hqCountry is not recorded. Redis (required by the installation page's services list) and RabbitMQ and Celery (background tasks) are the software's supporting services; the Redis and RabbitMQ names are not in the database vocabulary, so they stay here. Coined kinds (Celery background tasks, SMS and fax interviews, live chat with screen sharing, signatures, OCR, LLM and machine-learning features, cloud storage sync for templates, two-factor login, encrypted interview answers, Mako and YAML interview language) sit in notes as text. The demo at demo.docassemble.org is a demonstration interview, not a link field. The API is specified in OpenAPI format (assets/openapi.yaml). The download page also says "The docassemble web application requires more than just its Python packages to run".
