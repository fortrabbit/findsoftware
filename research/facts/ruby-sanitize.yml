notes: >
  The project has no website of its own: the README's Home link and the gemspec homepage both point to the GitHub repository, and the Online Demo at sanitize-web.fly.dev is a demo, not a homepage, so no homepage is recorded. The README says "Sanitize is based on the Nokogiri HTML5 parser" and "Crass", which parses CSS; both are declared runtime dependencies in the gemspec (nokogiri >= 1.19.7, crass ~> 1.0.8), and neither has a record, so no basedOn is recorded. The README's warning that Sanitize cannot fully sanitize math or svg elements, and its noscript note, are coined facts kept out of fields. The maintainer follows the LICENSE copyright line, which names Ryan Grove; the contact address on the same line is not recorded. The gemspec authors field also names Ryan Grove. The repository is owned by the user account rgrove. The current major 7 and the latest release v7.0.2 (2026-11-02) are from the GitHub release object. The runtimeMin is from the gemspec at the v7.0.2 tag. The README gives no Ruby version and no runtime sentence beyond the install line, so runtime ruby is recorded from the gemspec's required_ruby_version. The oldest tag release-1.0.0 is dated by its commit (2008-12-25), older than the oldest RubyGems upload of 1.0.0 (2009-07-25), so firstRelease is 2008. RubyGems also lists 2.0.x development versions as prereleases, dated before the stable line; none is newer than v7.0.2, so no latestPrereleaseDate is recorded. The RubyGems download figure is the gem total.
