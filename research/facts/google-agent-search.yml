notes: >
  Criterion 1 is in doubt: Agent Search is an enterprise search and RAG platform, and a site search widget is one use among others; a visitor-facing site search widget on a creator's site (the product page's website search) would settle it as in, an enterprise-data and RAG-only focus would put it out. Held as a stub until then. The docs.cloud.google.com pages return different bodies on different requests, so the sentences for headlessApi, importsFrom, userRoles, regions and i18n are not kept as quotes; the URLs and the read date stand. Renamed: the product page reads "Agent Search on Gemini Enterprise Agent Platform (formerly Vertex AI Search)" and the migration page says "Vertex AI Search is being renamed to Agent Search"; the record follows the new name. The maintainer is Google LLC from the consumer terms at policies.google.com/terms, which define "Google LLC and its subsidiaries"; the Google Cloud service terms were not readable, so the cloud contracting entity and the headquarters country are not recorded. The consumer terms also name Google Ireland Limited as the service provider in the EEA, which is a consumer-terms statement and is not recorded as the maintainer. The website search widget is deployed as an HTML component from the console (product page), or the API is used directly; a search app takes a site URL and indexes it. Search and grounding use Google's own models; the product page says data is not used to train models, which is not recorded as a field. The Custom Search Site Restricted JSON API of Programmable Search Engine is a documented migration source (importsFrom); the migration page states the API key versus OAuth 2.0 difference. The candidate row's category "vector-search" is not recorded: the product page's Vector Search is a separate Google Cloud product (docs.cloud.google.com Vector Search quickstart), and the product page presents it as the component under Agent Search. The candidate's boundary question (whether a hosted enterprise search and RAG service is a site-building tool under criterion 1) is decided by the website search widget and the site search pages, not by the RAG and generative answer features.
