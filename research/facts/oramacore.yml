notes: >
  No live homepage: the README links docs.oramacore.com, which does not resolve (DNS failure), and the candidates row's docs.orama.com is Orama's own docs site, not an OramaCore site; homepage is left out for the reviewer to decide. The record is kept accepted because install steps (docker-compose.yml, the Docker image, docs/api.md) and the public AGPL-3.0 source are on GitHub. The Cargo.toml has no author and the LICENSE has no copyright line, so the maintainer is the company the cloud docs name ("which we called OramaCore"), taken from orama.com's terms; the reviewer confirms that attribution. The SDK @orama/core (npm, "JavaScript and TypeScript client for OramaCore") is a client package and holds no figures here; its window downloads read 0. Its first GitHub release is 0.0.1 (2025-01-16), though the repository was created in 2024. The cloud docs page says in its script payload (not visible text) that "Orama 4.0" is a Rust rewrite called OramaCore that "now powers the cloud version of Orama"; no check-quotes can read that payload, so the hostedOffering quote is the visible title.
