notes: >
  Status accepted. Criterion 1: a spec tool a project adds as a dev dependency and runs in its development environment; the testing libraries are accepted under the dev-libs scope. Criterion 2: installed with Composer from Packagist (phpspec/phpspec). Criterion 3: the installation page of the stable docs. Criterion 4: the repository is not archived; the latest stable release is 8.3.1 (2026-07-04), and 9.0.0-rc.8 (2026-11-16) is recorded as latestPrereleaseDate. The CSV homepage http://www.phpspec.net is plain http and answered 403 to the research client; the README names https://phpspec.net as the main website, which redirects to the stable docs, so that address is recorded. The stable docs are labelled 5.x and say PHP 5.6 or 7, which conflicts with the 8.3.1 manifest; runtimeMin comes from composer.json at 8.3.1 and the docs statement is not recorded. GitHub detects no license (NOASSERTION); composer.json at 8.3.1 says MIT and the LICENSE file names Konstantin Kudryashov and Marcello Duarte with 2013-2016 copyright; the maintainer follows the LICENSE copyright line; composer.json at 8.3.1 also lists Ciaran McNulty as an author. The docs link the Prophecy mocking library repository (github.com/phpspec/prophecy) as a companion; no basedOn is recorded because no page says phpspec is built on it. The README gives phpspec-dev@googlegroups.com for development discussion, a mailing list and not a forum. The Packagist total download figure is cumulative since listing. Stars and contributors belong to the single repository.
