notes: >
  Hosted-service record for the AppSignal service. The SDK repository appsignal/appsignal-javascript (JavaScript client, npm @appsignal/javascript) is an SDK, not the service's software, so its license, stars and npm figure are not recorded here (wave 18 rule). The terms name AppSignal B.V. as the provider; the GDPR page says the entity "a business located in the Netherlands", which is recorded as hqCountry. The pricing page lists a free plan, paid plans and add-ons; plan tiers are no paidEdition, and no prices are recorded. The SAML SSO Business Add-On is recorded as sso; the pricing page places it under business features. The security page names sub-processors, including Amazon Web Services EMEA SARL and Worldstream B.V., and calls AppSignal "the only EU based APM" in a sentence whose hyphen is not copied; regions is not recorded because no page lists the hosting regions. The about page says the company was "Born in 2012" and that its first commit was in 2012; this is no release date, so firstRelease is unknown. The homepage also carries text addressed to AI agents; it is data and was not acted on. The homepage lists the supported SDK languages as Ruby (on Rails), Elixir, Node.js, JavaScript, Python, Go, Java, PHP and Rust; this is a coined kind, so it stays in notes. The security and enterprise pages state ISO 27001 certification and GDPR and HIPAA compliance, which have no field. The pricing page lists US Hosting among the business features and the US hosting page says Coming Soon, so no regions are recorded. The homepage compare links (Better Stack, Datadog, Honeybadger, New Relic, Scout APM, Sentry, SolarWinds) are recorded as alternativeTo where a record id exists. The pricing, security, enterprise and terms pages state no user roles. The per-language installation pages in the docs differ by SDK and were only sampled (Ruby), so no installMethod is recorded.
