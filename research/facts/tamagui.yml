notes: >
  The site footer links a privacy policy and a data processing agreement, and neither names a legal entity or country, so hqCountry is left out. The maintainer comes from the LICENSE copyright line; the npm maintainers are nwienert and alitnk. The LICENSE also lists copyright lines of other projects that Tamagui bundles (Nicolas Gallagher, Facebook, Radix, Framer); those are third-party notices and are not recorded as maintainers. The installation page states the requirements React 19+, TypeScript 5+ and React Native 0.81+ with the New Architecture for native apps; no Node.js runtime is stated, so runtime is left out. The homepage describes typed style props, Tailwind classes on the same compiler and a zero-runtime mode; the intro page describes an optimizing compiler that flattens component trees at build time for web and native. Those are styling options, not templating or rendering facts. The docs say the features work on the server with SSR support; that is compatibility, so renderingModes is left out. The npm package tamagui is the core package named by the install docs; the scaffolder create-tamagui is not recorded as the npm figure. firstRelease is the year of the first npm upload, 0.18.3 of 2021-10-27; the oldest stable GitHub release is v1.0.1 of 2022-12-29, and the v1.0.0-beta tags start 2022-05-02. The npm weekly figure is the range 2026-10-19 to 2026-10-25. Contributors counts registered contributors across all pages of the repository. The Tamagui GitHub tags include v1.x releases from 2022 to 2025 and v3.x from 2026; the highest stable is v3.1.6.
