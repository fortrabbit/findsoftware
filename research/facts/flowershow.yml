notes: "Stub: whether the web application can be installed and run by a user is in doubt. The project's own pages describe Flowershow as a multitenant platform that publishes sites to a hosted address, and the repository README documents only local development (Docker, PostgreSQL, MinIO) and a hosted deployment on Vercel, Neon and Cloudflare R2; no self-hosting guide was found in the docs, so a self-hosting guide, or a statement that the web app runs only as the hosted service (status hosted-service), would settle it. The installable item is the Go command line tool fl, which publishes to the hosted service. Its GitHub releases carry the cli/ tag prefix, so currentMajor is taken from cli/v2.9.0; the oldest GitHub release in the repository is @flowershow/publish@1.1.0, so firstRelease is 2026 although the repository dates from 2022 and older npm packages of the same name come from a different repository. The hosted service, Flowershow Cloud, is described in the web app README; the pricing page URL is recorded without prices. The pricing page lists a free tier and a Premium tier for custom domain, removed branding and search, which are hosting plans and not a paid edition of the code. discord, x and subreddit are the links on the homepage."
