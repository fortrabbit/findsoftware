notes: >
  The homepage cms.sgsoft-studio.com and the documentation at webed.sgsoft-studio.com do not resolve in DNS, and the docs-site repository named in the README returns 404, so no homepage or docs is recorded. The README is the only source read, and its install steps are the basis for installMethod. Status is discontinued on the README statement and on the Packagist flag: the package sgsoft-studio/webed is marked abandoned. The Packagist figures are for sgsoft-studio/webed, the package the README names for create-project; the core package sgsoft-studio/base, named for existing projects, has 6339 total downloads and is not recorded. The GitHub contributors endpoint lists one contributor. The maintainer is the copyright line of the LICENSE file; the README is written in the first person and names no maintainer, and its contact is a personal address, which is not recorded. The Packagist runtime minimum comes from release 4.0.5, which requires PHP >=7.0.0.
