notes: >
  The maintainer is recorded as SPATIE BVBA, the company the privacy statement of spatie.be names as the operator of the website, with its Antwerp address. The LICENSE copyright line reads "Copyright (c) spatie" with a contact address, and the GitHub organization is spatie; the legal form comes from the privacy statement. The README credits Ruben Van Assche and Aidan Casey (validation attributes) as people, which are not fields. The requirements page reads "PHP 8.1 or higher" and "Laravel 10 or higher"; the composer.json at 4.23.1 requires illuminate/contracts for versions 10 to 13, and only the PHP minimum is recorded as runtimeMin. The basedOn Laravel value rests on the docs sentence "Powerful data objects for Laravel", which is the page's own title line for the package and the README's h1 title. The intro page says "you only need to describe your data once" and that a data object is a regular PHP object that "extends from Data", that data objects transform into resources like the Laravel API resources, and that the package generates TypeScript definitions from them; those kinds are left to notes, as are the casts for Eloquent models and the validation rule inference. Spatie's paid products named in the README belong to Spatie and are no paidEdition of this package. The README's postcard request is no license term. The ecosyste.ms dependent counts are for the Packagist package spatie/laravel-data. The Packagist total of 49863316 is read on 2026-11-16 and replaces the CSV's 45.9M figure. firstRelease 2021 comes from the Packagist upload 0.0.1 dated 2021-06-30; the GitHub tags also start at 0.0.1 in 2021. The social and newsletter links are in the footer of Spatie's docs pages and name the company's accounts, not the package; LinkedIn has no field and stays here.
