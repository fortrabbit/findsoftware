notes: >
  The project has no GitHub release; its tags (v0.1 to v0.4) are not releases. The PyPI release history is read as the registry's release record: the current major is 0 from version 0.4, and the first upload is 0.1.2 on 2011-12-27. The GitHub tag v0.4 is dated 2020-05-18, the same day as the PyPI upload. The PyPI metadata and the site link github.com/Anomareh/mynt, which GitHub redirects to uhnomoli/mynt; the README names uhnomoli/mynt and that is the repository recorded here. The PyPI project name mynt is this project (same author and homepage). The PyPI license field reads "BSD"; the LICENSE file holds two redistribution conditions and a clause against using contributor names to endorse, which is the text of the BSD 3-Clause license, and GitHub reports NOASSERTION. The license is recorded as the registry states it, for a reviewer to settle. The docs give a generate command and a serve command; the serve command is described as local only, and the docs name no hosting target, so runsAs is local only. The download figure comes from pypistats because the PyPI JSON shows none. The docs describe the site as having the features of a CMS, which is the project's wording; the project has no admin interface, so no CMS category is recorded.
  The docs describe the gen, watch and serve subcommands, five reserved directories (assets, containers, locales, posts and templates), automatic tag and archive pages, and Jinja as the default renderer. The docs say the ".mo" locale files are for localization and name reStructuredText as an optional install extra.
