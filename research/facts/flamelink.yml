notes: >
  Flamelink is a hosted service that reads and writes Firebase projects the customer connects; the security page says content is stored in Firebase and not in Flamelink. The pages show 2025 copyright and a 2024 terms revision, so no end signal was found. The homepage and tech page name a Headless API and webhooks, and the pricing page lists plan limits for users, webhooks, environments, languages and schemas; the API style is not stated, so headlessApi is unknown, and no prices are recorded. Webhooks, multiple environments and workflows have no field in the starter list and are not recorded as fields. The Flamelink GitHub organization holds SDKs (the JavaScript SDK flamelink-js-sdk is MIT-licensed and was last pushed in 2023), an examples repository and a Gatsby source plugin; the CMS itself is not in them, so no repository, license or star figure is recorded. Firebase is a hosted dependency, not software the project builds on, so basedOn is not recorded. The terms PDF (read with pdftotext; the quote check cannot read PDFs, so those two facts carry no quote) reads "Registered Business: Flamelink B.V, North Holland, 1721 PW, Netherlands" and names Dutch governing law. The Slack community is reached by a sign-up form on flamelink.io/slack.
