notes: >
  The homepage gobuffalo.io answers over https; the candidate row's http address redirects there. The current major is 1 from the v1.1.4 release (2026-03-20), which the README also names as the stable line, with main as the development branch. The README and homepage state no end of maintenance, and the repository is not archived. runtimeMin follows the installation page and homepage (Go v1.16.0); the v1.1.4 go.mod requires Go 1.25.0 and the README says the team supports the last two Go versions, so the stated minimum is older than what the module file requires. The maintainer is Mark Bates, the copyright holder in LICENSE.txt; no legal entity is stated. The oldest tag is v0.4.0.pre and the oldest GitHub release object is v0.13.3 (2018); firstRelease is the year of tag v0.4.1 (2016-12-09). The Go module path is github.com/gobuffalo/buffalo, with no registry download figure. The README points to a Slack channel on gophers.slack.com and to Stack Overflow, and the homepage links the project's Patreon page; neither is a field in the dictionary. The homepage says the Plush templating default can be replaced with html/template, which is why both are listed.
