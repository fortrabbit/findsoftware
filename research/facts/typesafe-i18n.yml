notes: >
  Accepted: an i18n library that a site or app adds as an npm dependency. The project has no website of its own; the repository's homepage field names the GitHub repository, so no homepage is recorded and the README is the documentation. The repository moved from the ivanhofer namespace to codingcommons; the GitHub redirect and the README links still point to ivanhofer. The README header credits Ivan Hofer as the creator; LICENSE names "Hofer Ivan" as the copyright holder (2021), so that is the maintainer. The codingcommons organization profile lists a location in Austria; that is an organization profile line, not a page naming the country for the maintainer, so hqCountry is not recorded. The latest GitHub release is 5.27.1 (2026-02-11), which matches the npm latest. The tags before the 5.x line are 2.x tags, the oldest of them committed 2021-05-25; the first npm upload is 2021-02-14, so firstRelease is 2021. The README says the generator outputs TypeScript definitions based on the base locale and creates wrappers for it, that wrong or missing arguments and missing translations show as type errors, that the translation function injects arguments, formats them and finds the correct plural form, and that locales can load asynchronously. The Usage list names Node.js apis, backends and scripts, which is the runtime value, and a browser-via-CDN example whose README gives the unpkg CDN route, recorded as installMethod cdn. The runtimeMin comes from the adapter-node README, the Node.js usage route; the core package declares no engines field. The README says the package supports SSR, has no external dependencies and its core functions are about 1 KB; these are bundle and compatibility claims, kept here. Framework adapters for React, Vue, Svelte, Angular, Solid and Node.js are separate packages in the monorepo's packages folder and not records; the core is framework-agnostic, so no basedOn is recorded. The README names a locale import and export through importers and exporters, an Inlang plugin, and a plural rules runtime; these are features, not importsFrom. The Get started step runs the setup command npx typesafe-i18n --setup-auto (or --setup) and the manual route is npm install; both are recorded. The Discussions link and Discord link are the project's own support channels. The sponsor link points at a personal GitHub Sponsors page.
