notes: >
  Stub: the project's own homepage https://www.highlight.io/ answers with a 308 redirect to launchdarkly.com and highlight.io/docs redirects the same way (checked 2026-11-03), so the site the project names no longer shows the software. A live project homepage, or an end statement from the project or LaunchDarkly (which would make it discontinued), would settle it. LaunchDarkly's April 2025 post says Highlight is joining the LaunchDarkly team and that the open source community will be supported; it names no end. The repository is not archived, its last push is 2026-10-23, and its newest stable release is docker-v0.5.6 of 2025-08-08; the README (default branch) still gives the Docker install steps (cd docker && ./run-hobby.sh) and names app.highlight.io as the hosted sign-up, which answered 200 with the application shell when checked. The README says the hosted app is free to get started. The README's hobby install says the app is reachable on localhost and names no process model, so no runsAs is recorded. The enterprise/ and highlight.io/ directories carry their own licenses; the enterprise license restricts production use to a subscription. The repository has 57 releases. The oldest tag, v4.3.9 (an SDK version tag, commit of 2022-08-31), sets firstRelease; the oldest GitHub release is docker-v0.1.0 of 2023-04-20. The npm package highlight.run (64.2k downloads a week in the candidates row) is the client SDK, so no npm figure is recorded. The highlight.io docs redirect; their source in the repository's docs-content/ directory was read for the hosting pages.
