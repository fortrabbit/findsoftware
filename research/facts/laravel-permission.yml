notes: >
  The candidates row carried 125.4M Packagist total downloads; the current Packagist total is 134743775 and is recorded with its date. The stable major is 8, from release 8.5.0; the 8.x line also appears as the docs version v8. The MIT license is stated in composer.json and the LICENSE file; the README's postcard request is a request, not a license term, so it is not recorded. The maintainer is SPATIE BVBA, the company behind spatie.be; the LICENSE copyright line reads "Spatie bvba", and the privacy page gives the same company in capitals, so the capitalized legal form from the privacy page is recorded. The prerequisites page states that the User model must not have a role or roles property or method, and that it must implement Laravel's Authorizable contract, because the package's HasRoles trait defines those. The README's Alternatives section names laratrust, ultraware/roles (archived), zizaco/entrust and Bouncer; only Bouncer has a record, so only it is alternativeTo, and the three others stay in the README. The firstRelease year comes from the oldest Packagist version 0.0.1 dated 2015-09-15, which matches the oldest GitHub release. The introduction says every guard has its own set of permissions and roles. The prerequisites page covers MySQL and MariaDB index length limits and foreign-key support; it does not list supported databases, so databases is not recorded. The bluesky, mastodon and youtube links are Spatie's company accounts from the docs footer. The install and usage pages state no process model, so runsAs is not recorded. The dependentPackages and dependentRepos figures are the ecosyste.ms counts as the endpoint returns them.
