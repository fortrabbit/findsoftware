notes: >
  Drupal module on drupal.org, repository on git.drupalcode.org (GitLab, no GitHub mirror, so no GitHub figures). The project's declared "Home page" link is drunkenmonkey.at/topic/search-api, the maintainer's own site; homepage is the drupal.org project page instead, a reviewer decision. Maintainers listed on the project page are borisson_ and drunken monkey; the record names drunken monkey as the creator. Release history from updates.drupal.org: 8.x-1.42 released 2026-10-11 is the highest stable release, major 1 (the 8.x in the version string is the Drupal core line). The 7.x line starts 2010-08-19 (7.x-1.0-beta1), the oldest release in the repository. The project page shows 214,878 sites, the CSV row had 170,882. Requirements from the project page: the Views module for the Views integration and the Facets module for facets, plus at least one search backend module. The Database search module in the project "indexes and searches content using Drupal's own database" and is meant for testing and smaller sites. Named backends on the page are Solr and Elasticsearch. The composer.json at 8.x-1.42 has no php constraint, so no runtimeMin. Language and runtime come from the Drupal composer package metadata, as for drupal-commerce. Security advisories cover stable releases. The project page says the Search API does not provide access restrictions on its own: keeping only accessible items in an index or in results is the site owner's responsibility, with node access checks available as a data alteration. The release history at updates.drupal.org states maintenance status "Actively maintained".
