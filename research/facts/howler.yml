notes: >
  The homepage download link names v2.2.3, while npm and GitHub both have 2.2.4 (2023-09-19) as the latest stable; the homepage figure is stale and not recorded. The LICENSE.md copyright line reads "Copyright (c) 2013-2020 James Simpson and GoldFire Studios, Inc.", and the README closes with "Copyright (c) 2013-2021 James Simpson and GoldFire Studios, Inc."; the maintainer follows the homepage credit "Created by James Simpson & many contributors", and GoldFire Studios, Inc. is the company named beside him. The README gives four install routes: a repository clone, npm (Yarn installs from the same npm package, so it is one route), Bower, and the hosted CDNs cdnjs and jsDelivr. The README names no sentence on where the library runs (its "In the browser:" line only labels a script tag example) and no Node.js support, so no runsAs and no runtime are recorded. The GitHub API lists v1.1.0 as the oldest tag, committed 2013-04-11, which is older than the first npm upload (2014-05-29), so firstRelease is 2013. npm lists 2.0.0-rc2 under the beta tag, and the GitHub prereleases (v2.0.0-beta14 and earlier) predate the stable release, so no latestPrereleaseDate is recorded. The CSV figure of 615.2k per week is stale; the recorded figure is the sum for 2026-11-01 to 2026-11-07. The README says the sources given to a sound "should be in order of preference", that the library loads the first one the browser can play, and that full browser coverage needs "at least two of them" (codecs), with the mp3 fallback needed for Internet Explorer.
