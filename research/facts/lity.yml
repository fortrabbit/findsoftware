notes: >
  The README says Lity requires jQuery or Zepto, with some Zepto modules; a dependency is not a basedOn statement, so no framework is recorded and the libraries go here only. The homepage and README both describe it as a lightbox plugin, and the README does not say it runs in the browser, so no runsAs is recorded. The README gives a total footprint of about 3kB minified and gzipped; bundle size is a coined kind and stays here. The LICENSE copyright line reads 2015-2020 while the homepage reads 2015- with the same holder. The first release is v0.1.0 on 2015-02-24, the same day as the tag v0.0.1, and the newest stable release is v2.4.1 from 2020-04-26; the repository was last pushed on 2023-07-28, so the import will judge listing by the release date. The npm figure is the lity package, the one the README names; the Bower route is named in the same sentence as npm and is recorded as its own installMethod. The GitHub stars and contributors belong to the single repository. The README says the lity function returns an instance with close, element, opener, content and options methods, that data-lity-target opens a different URI than the href, and that the library fires lity:open, lity:ready, lity:close, lity:remove and lity:resize events.
