notes: >
  Latest stable release 2.0.1 on npm, published 2020-05-25; the GitHub release list holds only v2.0.0 (2019-08-07), so currentMajor 2 comes from that release and latestReleaseDate from the npm registry. The repository was last pushed 2024-05-17, is not archived, and npm carries no deprecation on 2.0.1; the release age alone is no end signal, and four years without a release make the import move the record to stub. Status stays accepted. firstRelease is 2014 from the npm upload of 0.1.0 (2014-08-29), older than the oldest GitHub tag 1.0.0 (2014-10-16). The README says footnotes, tables and strikethrough are enabled by default and that a commonmark preset enables strict CommonMark mode. The README says the default configuration is similar to GFM with HTML disabled, that it supports CommonMark with syntax extensions (footnotes, tables, strikethrough), that syntax rules can be added or replaced, and that it has a typographer option and presets; these are coined kinds left in notes. The README's community plugins link is an npm keyword search, not a project directory, so no pluginDirectory. The README benchmark compares against marked-0.3.2 and the CommonMark reference; it is a benchmark, not a statement of alternative, so no alternativeTo (marked has a record, marked.yml). The npm figure is the sum of daily downloads for 2026-11-01 to 2026-11-07. The live demo at the homepage answers 200 over https. The package.json at v2.0.1 declares engines node >= 6.0.0. The LICENSE names two copyright holders, Jon Schlinkert and Vitaly Puzrin (2014); the maintainer is the first holder, and the README's authors list names Alex Kocharin and Vitaly Puzrin too.
