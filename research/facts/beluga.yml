notes: >
  The repository README says the project is deprecated because Stripe's product and order objects were replaced by price, and names no successor; the homepage belugajs.com now documents a rewrite in github.com/binx/beluga-v2, which is a candidate for a later wave. The homepage calls this repository the original. The repository has no release or tag, so lastCommitDate is the default-branch commit of 2023-12-22. The install steps and the Heroku deploy are on the v1 documentation at v1.belugajs.com. The v1 admin dashboard is reached at /login; the config route holds product and collection settings. The npm package named beluga (latest 1.0.0) is not linked from the README and was not recorded. The README names Stripe for payment processing; payment providers are not a field. The CSV category static is not stated by any source and is not recorded. The README also says Beluga is the next iteration of react-stripe-store; the README text cannot be quote-checked because of an inline angle bracket, so successorOf is not recorded.
