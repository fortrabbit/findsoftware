notes: >
  The repository the project names is the forge at code.haverbeke.berlin; the GitHub copy codemirror/dev is archived because development moved, so the archive is no end signal. The mirror's stars (7806 on 2026-11-04) and contributors count (21, rel="last" page with per_page=1) are not recorded as fields because they belong to the stale copy; its language comes from that copy. The npm figure is for the codemirror package named by the install guide, which bundles the core packages; the same package name also carries the 5.x line (dist-tag version5), so the weekly figure is for all versions. latestReleaseDate and currentMajor follow the npm codemirror package (latest 6.0.2, published 2025-06-19); the individual @codemirror/* packages release more often (the changelog lists @codemirror/view 6.43.15 on 2026-10-19). firstRelease is the year of the first dated version on the CodeMirror 5 release page (0.62, 2009), which is the same project name and maintainer as CodeMirror 6; the 6.x line starts in 2022 on npm. The homepage says the library supports browsers "up from Internet Explorer 11", which is a browser list and is not recorded as runtime; no page states a process model, so runsAs is not recorded. The homepage says that commercial use carries "a social (but no legal) expectation" of funding; no paid edition exists, so paidEdition is not recorded. The i18n fact is the homepage feature "Internationalization" (custom text to display or announce); the translate example says there is no repository of translations. The language packages for Angular, CSS, Go, HTML, Java, JavaScript and others, and the CodeMirror 5 modes, are separate packages and are not recorded as fields. The archived GitHub repository codemirror/CodeMirror holds the 5.x line (MIT, 2011 created). The LICENSE on the forge reads "Copyright (C) 2018 by Marijn Haverbeke, Adrian Heine, and others" (email addresses left out here); the first-named holder, who is also the npm package author, is the recorded maintainer. The guide says the packages are distributed as ES6 modules and that it is "not currently practical to run the library without some kind of bundler" or module loader; it names Rollup and Vite. The homepage feature list also names bidirectional text (right-to-left mixed with left-to-right), recorded as a second i18n entry.
