notes: >
  The repository README is the RubyGems template with TODO placeholders and no usage text, so the record relies on the docs site and the gemspec. The CSV lists the homepage as http; the https address answers 200 and is recorded. The GitHub language field reads JavaScript; the docs site says weave files contain Ruby code, so language is recorded as Ruby from the page. The repository has no GitHub releases; the tag v0.9.11 matches gem version 0.9.11 (2026-10-17), and the registry is used for the major and the release date under the rule for a repository without releases. The gem's download figure is the total from the RubyGems gem endpoint, not a period. The npm package named weaver belongs to another project (n4kz/weaver) and is not recorded. The docs site says "Welcome to Weaver 0.9.0" while the gem is 0.9.11; no version is recorded from the site. The dynamic features page shows form and button widgets written in the weave DSL; it is not read as a server mode. No page says the build output is static files, so renderingModes is absent and runsAs holds only the local preview. The docs site says weave files are Ruby code that calls methods named after HTML tags, such as h1 and center_page, and that the documentation page is itself written in Weaver. The gemspec gives no required Ruby version, so runtimeMin is absent.
