notes: >
  Deployer is a command-line tool that a developer or CI job runs; the deployed site runs on the target server, so runsAs is local only. The deploy tasks reach servers over SSH (remote_user and deploy_path in deploy.php); the provision recipe targets Ubuntu and installs the server stack; provisioning needs root SSH key login, which recent Ubuntu images disable by default, and the default layout keeps each release in its own folder with a current symlink (getting-started page). The homepage logo row names framework and CMS recipes (Laravel, Symfony, WordPress, Drupal, Magento, CakePHP, CodeIgniter, Yii, Contao, Shopware, TYPO3, Sulu); these are recipes on the recipes page, not separate records. maintainer is the deployphp GitHub organization. The docs example output names Anton Medvedev as a release author; no page states who maintains the project, so maintainerType community is inferred from the organization. Packagist monthly and total downloads are two figures with different periods. The homepage recipe counter is rendered by script and was not read. The 8.x docs path is the current one; the Deployer homepage lists 8.x as the default version. The api runtime min comes from the latest stable tag's composer require.
