notes: >
  The package is published from the WordPress/gutenberg monorepo; the highest stable tag of @wordpress/env is @wordpress/env@12.0.0 (tagged 2026-10-20, the npm latest). firstRelease is the package's first npm upload (2019-11-14); the Gutenberg monorepo's oldest release (2017) belongs to the Gutenberg plugin, another product. basedOn wordpress rests on the docs line about a local WordPress environment for plugins and themes. The docs name Docker as the default runtime ("Ensure that Docker is running, then:") and describe two runtimes without Docker: Playground, which runs WordPress in WebAssembly (wp-env start --runtime=playground), and PHP, which uses the PHP installed on the computer with SQLite (wp-env start --runtime=php). The docs call the two non-Docker runtimes experimental, and say the Docker runtime uses MySQL while the non-Docker runtimes use SQLite, so databases is not recorded as one value. The docs say plugins, themes and mappings are linked into the environment's work directory, so file changes show up in the environment. The GitHub contributor count is the repository's figure. The GitHub license detection reads NOASSERTION; the package manifest license is recorded. The npm weekly figure is the range 2026-09-28 to 2026-10-04.
