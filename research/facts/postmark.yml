notes: >
  Hosted-service record: the SDK repository ActiveCampaign/postmark.js (MIT, 361 stars, pushed 2026-07-10 on the GitHub API) and the npm package postmark (version 5.1.0 on the registry's latest endpoint) are client libraries and are recorded here only as notes, per the hosted-service rule. The homepage quote is the service-history sentence; the "Since 2010" statement is a service history, not a first release. The terms name AC PM, LLC as the contracting party and the privacy notice calls AC PM LLC a related body corporate of ActiveCampaign, which the parent fact quotes. No hqCountry: the terms give a governing law of the State of Illinois and no principal address. The pricing page lists "User Roles" and "Multi-Region Routing (SMTP)" as plan features and "Number of Users" per plan, without a sentence stating what the roles are, so userRoles and the routing feature are not recorded. The API is HTTP JSON: the homepage example posts to api.postmarkapp.com/email with the X-Postmark-Server-Token header, and inbound email and delivery events are webhooks; the coined fields apiStyles and webhooks are not in the dictionary, so they are not recorded. The developer page's SMTP service and inbound email pages describe the same product. The pricing page states a free Developer plan with 100 emails every month that never expires, and the LinkedIn company page is linked from the homepage; both are coined fields (freeTier, linkedin) and sit here in notes. The vendor pages do not describe a self-install, so selfHostOption is unknown. firstRelease is unknown.
