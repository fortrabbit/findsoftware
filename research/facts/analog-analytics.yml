notes: >
  The project names no website; the CSV row points at the repository, so homepage is not set. The README documents POST /api/events with an event name in the body and a token header when ANALOG_TOKEN is set, which a site calls directly; that endpoint is the wiring under criterion 1 (no embed script is documented). The README says the project is "heavily inspired by" piratepx, a GitHub user; that is no basedOn or forkOf statement. The GitHub name is ΛNΛLOG in the README title and the repository is named analog; the record name follows the README title, a reviewer may prefer ANALOG. The LICENSE copyright line names RCKT and package.json author is RCKT; the GitHub owner is orangecoloured, a user account, so the maintainer follows the LICENSE line. Releases run from v0.0.1 (2025-06-11) to v0.2.3 (2026-09-16); all are stable, no prerelease. currentMajor is 0 because the line is pre-1.0, and the minor line 0.2 goes here. The repository was pushed on 2026-10-31 after the last release. Cloud routes (Koyeb, Netlify, Render, Vercel) are documented as deploys of a copy of the repository; the Netlify and Vercel scheduled clean-up (a daily function, not recorded as runsAs) may not run, per the README. Storage notes from the README: MongoDB, PostgreSQL (use a transaction pooler), Redis, and SQLite via libsql (Turso or a local file). Environment variables are coined kinds and stay here: ANALOG_DATABASE_PROVIDER, ANALOG_TOKEN, ANALOG_PROTECT_POST, ANALOG_STATIC_SERVER. The package has no npm release (404). The GitHub contributors count is one. Adoption figure: 51 stars on 2026-11-03. The project has no homepage, no forum and no newsletter.
