notes: >
  The build command is pagic build and the README says Pagic is powered by Deno + React and supports React Hooks; no basedOn is recorded because the pages name no parent software, and the dictionary has no field for a build command.
  The install docs name Deno (deno install from deno.land/x/pagic), not npm, so no npm figures are recorded. The npm package pagic has version 0.6.0 as its latest; the highest stable GitHub release is v1.6.3, so currentMajor is 1.
  The releases run from v1.0.0 (2020-12-14) to v1.6.3 (2023-06-06); the repository was pushed on 2023-09-19 and the README names no end of the project.
  The homepage is the project's own site, linked from its README as the official website; the homepage page itself was fetched and answers 200.
  The README names the Deno version 1.34.1 in a badge; a badge is not a minimum requirement, so runtimeMin is left unknown.
  The LICENSE copyright line names xcatliu, the GitHub account name, with no legal form, so the name is recorded as the project states it.
