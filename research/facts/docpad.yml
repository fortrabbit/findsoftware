notes: >
  The project site says DocPad "should be considered archived for the history books" and that its final releases "wrap up the project", so status is discontinued. The repository is not archived on GitHub and the npm package is not deprecated, so the signal is the project's own statement. The GitHub API reports the license as NOASSERTION; the LICENSE.md file and the README both state MIT, and both are recorded. The version and release date come from npm because the repository has no GitHub releases; the npm latest is 6.83.2. runtimeMin comes from the engines field of the npm package. The site's "over 2000 stars" and "200 plugins" are old figures and are not recorded.
