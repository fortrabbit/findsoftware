notes: |
  Every project page this client requested on www.litecart.net and wiki.litecart.net answers 403 with a browser verification page, so the install, documentation and homepage facts come from the README at tag 2.7.1 and the homepage fact comes from the repository's homepage field. The README states "This project is licensed under the terms specified in LICENSE.md", and LICENSE.md at tag 2.7.1 is the Creative Commons Attribution-NoDerivatives 4.0 International license, which is not an open-source software license; GitHub reports the license as NOASSERTION ("Other"). The licenseModel is left to the import, and a reviewer decides whether a CC-BY-ND license counts as open-source, source-available or other for the record. The repository has no LICENSE file or composer.json on the dev branch. The README gives PHP 5.6 as the minimum at tag 2.7.1; that statement is the project's own, and it is not checked against endoflife.date. There is no GitHub release, so latestReleaseDate is the date of the 2.7.1 tag commit, which is the highest version tag. The repository was pushed on 2026-10-19, which is not an end signal. The GitHub organization profile names Sweden; that is not recorded as hqCountry because it is a profile field, while the README names LiteCart AB, whose legal form AB is Swedish. The maintainer is the legal name the README gives. The README links a Developer Kit add-on on the project's own site; it is not recorded as paidEdition because its price and terms were not read.
