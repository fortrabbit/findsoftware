notes: >
  Status is discontinued on two project statements: the README calls it deprecated and "in long-term stasis", and the docs site says it "has been deprecated". The CSV row says accepted; the reviewer decides whether the row changes. The install docs name create-react-app, a create-* scaffolder, so the registry figures come from its core package react-scripts. The contributor count is exact: 900 on the first nine pages plus 46 on the last. The npm latest of create-react-app is 5.1.0 (2025-02-15) and the GitHub release is v5.0.1 (2022-04-12); both have major 5, and the GitHub release is recorded. The docs say "Node 14.0.0 or later" for the local machine only, which is the only runtime fact recorded.
