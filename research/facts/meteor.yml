notes: >
  The npm package named by the install docs is "meteor", which the docs describe as an installer: "Do not install the npm Meteor Tool in your project's package.json. This library is just an installer." The npm figure is for that installer package, for 2026-10-12 to 2026-10-18. The GitHub API reports the license as NOASSERTION; the LICENSE file reads "The MIT License (MIT)", recorded from the file. The homepage is taken from the README's "Official Website" link because the site itself did not render as text. The install page says "Make sure you have Node.js v24 or higher installed" for the npm install fallback, while a table there lists the Node.js version each Meteor release bundles and the README badge says Node 22 or higher, so runtimeMin stays unknown. The deployment guide says "meteor build" creates a bundle that "contains a plain Node.js application", started with "node main.js" and a MONGO_URL, and that the environment needs "connectivity to a MongoDB server"; databases and runsAs come from that page. The install page says "meteor create" prompts for "a project name and frontend framework", and the README links tutorials for React, Blaze, Vue, Svelte and Solid. Galaxy (galaxycloud.app) is a hosted platform "By the creators of Meteor" that deploys Meteor, Node, AdonisJS and Python apps from a git push, and the README names it under "Deploy on Galaxy"; no plans or prices are recorded.
