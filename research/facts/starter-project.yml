notes: >
  Status is discontinued on the archive flag of the repository, which the npm package starter-project names this repository and no npm deprecation is set. The starter-project-cli repository that the README names for version 2 is archived too, so it is not a move to a live successor. The highest stable release is 2.2.13 (tags carry no v prefix); the next dist-tag on npm, 2.0.4-rc4, is a prerelease and is not used. The LICENSE copyright line reads Star Bist and package.json names Silvestar Bistrović as author; both are recorded as stated. The homepage is the Starter Project CLI page, which package.json also names as homepage. The oldest GitHub release is 1.1.5 (2018-01-12), so firstRelease is 2018 even though the npm package was created in 2017.
