notes: >
  Status accepted from the CSV row. Criterion 4: the newest stable release is v4.39.0 (2026-09-24), the repository is not archived, and the default branch had commits on 2026-10-19. The GitHub licence field reads NOASSERTION because the LICENSE file has no title line; the file is the MIT text and package.json states "license": "MIT", which is the statement recorded. The npm package the install section names is @yaireo/tagify; an unrelated npm package named tagify exists and is not used. The homepage at yaireo.github.io/tagify is the project's GitHub Pages site and shows examples, the same project the README links. The tagline names Vanilla, React, Vue and Angular: the README has React and Vue wrapper sections, the Vue section says the wrapper was written by someone else, and no Angular section was found, so no basedOn is recorded and the bindings stay here. The jQuery wrapper is marked deprecated (April 2024) in the README. The README describes modern evergreen browsers only and says Internet Explorer is not supported; that is compatibility, not a runsAs statement, so runsAs is unset. Building from source needs Node.js 22 or later and pnpm 10 or later; that is a contributor requirement, so runtime is unset for the published component. Stars and contributors belong to the single repository. The repository LICENSE file holds the MIT text without a copyright line, so the maintainer is the package.json author on npm, Yair Even-Or. The README's installation section is headed as an import from a CDN with a jsdelivr script tag; the sentence that names the CDN route in prose is the unpkg version example, which is the cited quote. The React wrapper is raw ES module source exported as react.tagify.js, and the README says Tagify is not a controlled component.
