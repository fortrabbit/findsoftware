notes: >
  Criterion 1: the bridge serves a static site's fediverse presence; the site publishes a feed (JSON, Atom or RSS), serves the .well-known files Hatsu returns as static files and adds an alternate link tag to each page (docs page "Redirecting with Static files and Markup"), and the bridge runs on the creator's side, so it is accepted under the bridge rule. ActivityPub is the protocol it speaks, so it is recorded here only as prose context. The docs say it is "Hatsu is still a Work-In-Progress"; the README says it works with "any SSGs and most static hosting services". The README says a fediverse search for the site URL redirects to the matching post on the Hatsu instance, that Hatsu accepts follow requests, pushes new posts to followers' homepages, and sends replies from fediverse users back to the static site as backfeed; the intro page says Hatsu uses the site's Feed (JSON, Atom or RSS) as its data source instead of HTML pages with microformats2. The environment page lists the settings as environment variables read from a dotenv file. Hatsu is the Rust server and a Docker image; the Docker image is published to GitHub Container Registry, not Docker Hub, so no dockerPulls figure is recorded. The README badge names a minimum Rust 1.85 (MSRV); it is a build requirement for a binary and image that ships compiled, so runtimeMin is left out. The README "Fediverse compatibility" section says Hatsu uses the activitypub-federation library from the Lemmy project and includes code copied from Lemmy and activitypub-federation (AGPL-3.0 both); that is a dependency, not basedOn. The docs comparison section names Bridgy Fed and Bridgy as similar services; neither has a record, so alternativeTo is not written. The Matrix chat badge in the README is not a field. The docs, not the README, state the Docker environment variables. The currentMajor value 0 follows the 0.x version line: the repository never tagged a 1.0 release. The maintainer is the author named in Cargo.toml at the v0.3.5 tag; the GitHub owner is an organization named importantimport. The HATSU_ACCESS_TOKEN Admin API is a management API for the instance, not a headless content API, so headlessApi is not written.
