notes: >
  Maintenance: the README says "go-pg is in a maintenance mode and only critical issues are addressed." and names Bun as the place new development happens; the docs homepage says "go-pg is in a maintenance mode and will NOT receive new features. Please use Bun instead." The project does not declare itself ended or unmaintained, and it still publishes tags, so the status stays accepted; a reviewer may decide the maintenance statement should make it a stub. The Bun link is recorded as alternativeTo (the docs name it as the thing to use instead), and the successor relation is left to this note because go-pg is the older project. The README's Ecosystem section lists migrations, a code generator and a sharding package, which are not recorded. The README's "Chat" badge links the Discord invite, which is recorded as discord. The repository default branch is v10; the v11.0.0-alpha tags date from 2021 and are older than the latest stable release, so no latestPrereleaseDate is recorded. The repository has tags v1 (2014-06-02 commit) and v2.1 (2014-09-12 commit), so firstRelease is 2014. The LICENSE copyright line names github.com/go-pg/pg Authors, and the README names no maintainer. The go.mod at v10.15.1 states go 1.24.0. The installation route is named in the README only as a code line after the sentence quoted under installMethod.
