notes: >
  Hosted-service record for the Bonsai managed search service of One More Cloud, Inc. (Delaware corporation, Austin, Texas address in the privacy policy). The terms and privacy policy both name the company; the homepage footer says Makers of Bonsai and Websolr, and Websolr is a separate hosted product, not a candidate here. The about page says Bonsai was developed by One More Cloud, a bootstrapped firm, so the owner is recorded as maintainer and no separate parent is recorded. No repository is recorded: the CSV names none and the company GitHub organization (github.com/omc, linked from the homepage) is not a record's repository. The homepage JSON-LD and the title name Elasticsearch and OpenSearch; the JSON-LD also lists SolrCloud, which the visible pages do not repeat, so SolrCloud is not recorded. The "Bring Your Own Cloud" option deploys Bonsai into the customer's own AWS or GCP account and is run by the vendor, so it is not recorded as selfHostOption, which needs an installable part. Compliance statements (GDPR, CCPA, SOC-2, HIPAA, FIPS-140-2 on the Enterprise plan) sit on the pricing page and are not recorded as fields. The pricing page lists a multitenancy feature (separate tenants) and per-plan concurrency and document limits; no field fits multitenancy and the limits are plan-dependent, so apiLimits is not recorded. The pricing page's plan prices are not recorded. The homepage structured data says a free tier is available with no credit card; that text sits only in the page's JSON-LD, not in its visible copy, so no freeTier fact is recorded. Team Members are listed as unlimited; that is seat count, not userRoles. No SSO or SAML text appears on the pages read (homepage, pricing, docs, terms, privacy, about). The homepage's GitHub, LinkedIn and Twitter icons link to github.com/omc, linkedin.com/company/bonsai-search and twitter.com/bonsaisearch; only the X link is recorded. The homepage JSON-LD says founded 2009 (company) and the about page says launched 2012 (service); firstRelease uses the service launch year. The docs site is docs.bonsai.io. The Bonsai about page quotes 16,000+ active clusters, recorded as reportedInstalls with the date it was read. The pricing page lists Standard, Business and Enterprise plans; plan tiers of a hosted service are no paidEdition, and no prices are recorded.
