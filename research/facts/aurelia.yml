notes: >
  The npm latest dist-tag is 2.0.0-rc.2 (published 2026-08-04) and the GitHub releases API returns no release, so currentMajor and latestReleaseDate come from npm. The README states "Note: Please keep in mind that Aurelia 2 is still in beta. A number of features and use cases around the public API are still untested and there will be a few more breaking changes." (raw README, read 2026-10-21) while the npm latest tag is a release candidate; both statements are the project's own. The README names https://aurelia.io/ as the project's site through its logo link and the npm homepage field agrees. The README's Node.js requirement (v8.9.0 or above) is older than the npm engines field of the latest release (>=20.16.0), so runtime and runtimeMin follow npm. The npm package aurelia is the one the browser-without-a-build-step page imports; @aurelia/kernel, the package the README badge names, shows the same weekly download figure. The migration guide says "Aurelia 2 is a complete rewrite of Aurelia that shares many of the same loved and familiar features of Aurelia 1." and names the @aurelia/compat-v1 package. The LICENSE copyright line dates 2010 - 2020; the npm maintainers are eisenbergeffect and aureliaeffect, not used as the maintainer name.
