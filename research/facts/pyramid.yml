notes: >
  Status is accepted. The homepage trypyramid.com is the project's own site and answers 200; the CSV row was accepted and the criterion column is empty. The install page shows pip install "pyramid==2.1" and states Python 3.10 or greater; the requires_python on PyPI is >=3.10. The development configuration and the project page describe the WSGI server in the generated ini file and name Waitress for development and light production, mod_wsgi and gunicorn as alternatives; runsAs is recorded as always-on on that basis, since the page describes a server process listening on a port. The narrative deployment chapter URL returns 404; the Pyramid Community Cookbook deployment page states that any WSGI server can serve the application. The license is stated two ways: LICENSE.txt gives a BSD-style license for most of the code and, for code marked as stolen from Paste, the Paste license (MIT text, Ian Bicking and Contributors); GitHub reports NOASSERTION, and both statements are recorded as their own entries. The copyright line on the docs footer names Agendaless Consulting, and PyPI names Chris McDonough, Agendaless Consulting as author; the copyright holder is Agendaless Consulting, but the README states the project belongs to the Pylons Project, so that is the maintainer. The first PyPI upload is 1.0a1 on 2010-11-05, so firstRelease is 2010. The GitHub repository has tags but no release objects; currentMajor is taken from the highest stable tag 2.1. The docs footer also names the Pylons Project. The README links a Discord server and IRC on Libera.Chat; IRC has no field. The homepage lists the add-on directory at trypyramid.com/extending-pyramid.html.
