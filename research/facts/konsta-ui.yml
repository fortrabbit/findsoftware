notes: >
  The npm figure counts the konsta package, which the install docs name ("npm i konsta"). The project's own pages say the components are available for React, Vue and Svelte; each framework has its own documentation section, and the homepage names Ionic and Framework7 as parent frameworks for an app shell, which is usage and not a basedOn statement. The npm engines field declares "node >= 4.7.0", which is not a runtime for the site and is not recorded. The LICENSE copyright line names Vladimir Kharlampidi (2021); the homepage footer reads "2026 © Konsta UI by" followed by a nolimits4web logo link. The GitHub profile location is not a legal address and is not recorded as hqCountry.
