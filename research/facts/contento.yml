notes: >
  Contento is a hosted service; criterion 2 is waived. The SDK repository gocontento/sdk and the npm package @gocontento/client (first published 2023, major 0) are clients of the service, not the service, so their stars, contributors, npm figures and release dates are not recorded as the product's; the SDK carries no license statement. The docs name @gocontento/client for the JavaScript client and a Next.js toolkit for the visual preview. The organization's GitHub location is Ireland, which is recorded as hqCountry from the API; the terms name the Republic of Ireland as a jurisdiction. The docs describe teams that users belong to, with sites inside teams; no role names are stated, so userRoles is not recorded. The Community plan is stated as free forever; no prices are recorded. Auto translation is listed as a beta add-on on the pricing page, not recorded as a field. The homepage links to starter kits on GitHub and Vercel, which are examples, not the service.
