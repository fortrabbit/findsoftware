notes: >
  The GitHub repository is the development repository; its description says it is not intended for end users and points to the Composr CMS website for packages. Stable tags on GitHub run to 10.0.52, whose commit is dated 2025-08-02; the highest 11 tag is 11.beta8, dated 2025-08-01, older than the stable release, so no latestPrereleaseDate is recorded. The repository was pushed on 2026-06-25 and nothing in it declares the project ended. The record is listed on the repository, the install page and the CPAL license file in it; composr.app answers 403 to every request, so the download, requirements and homepage statements are unread and homepage is not recorded. The THANKS page says the software was developed mainly by the former company ocProducts Ltd, founded by Chris Graham, names the current Core Development Team, and the README links a GitLab project under composr-foundation. The license file is titled Composr CMS Terms and Conditions and sets the CPAL; GitHub license detection returns none. The git history on GitHub starts with the 10.RC1 tag in 2016, so firstRelease is not recorded.
