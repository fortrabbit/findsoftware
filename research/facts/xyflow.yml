notes: >
  The repository xyflow/xyflow is a monorepo with React Flow (@xyflow/react, the package the install docs name), Svelte Flow (@xyflow/svelte), Vue Flow (@xyflow/vue) and the shared @xyflow/system package. The record follows React Flow, the CSV name, and its install package; Svelte Flow and Vue Flow are not recorded as fields, and the record is for the reviewer to decide whether Svelte Flow sits beside it as the CSV note suggests. Stars and contributors belong to the monorepo. The React Flow 11 legacy package reactflow is a separate npm package and is not recorded. The npm package @xyflow/react is first uploaded as 12.0.0-next.0 on 2024-01-03; the GitHub releases and tags reach back to 1.3.0 on 2020-05-11, which sets firstRelease. The current stable release is @xyflow/react 13.0.1, published on 2026-11-16 with the monorepo's other packages. The LICENSE copyright line names webkid GmbH, the company behind xyflow, and the xyflow about page says the company was founded as the agency webkid; the imprint at xyflow.com/imprint is the legal notice of webkid GmbH, with a Berlin street address that names no country, so no hqCountry is recorded; the tax office line and the copyright notice on that page name Germany and German law. The homepage links the Discord invite https://discord.gg/RVmnytFmGW, while the README links a second invite, https://discord.gg/Bqt6xrs; both are the project's. The homepage is reactflow.dev and xyflow.com is the company site. The Pro page sells subscriptions with monthly prices, which are not recorded; the MIT license covers the library and the Pro subscription buys Pro Content, prioritized issues and support. The React Flow attribution link is a support expectation in the README and the Pro page, not a license term, and is not a fact of the record. The ecosyste.ms npm entry for @xyflow/react reports zero dependents against a package with tens of millions of weekly downloads, so no dependent counts are recorded.
