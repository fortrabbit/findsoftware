notes: >
  Doubt: no install steps appear in the README, the repository or the docs, so criterion 3 cannot be judged; a README or docs section with install and run steps would settle it. The README is one badge and one sentence, and the rubydoc page (www.rubydoc.info/gems/dimples/14.0.0) holds only API reference. The repository has no GitHub release or tag, and the RubyGems registry has versions 11.0.0 to 14.0.0 published from 2026-06 to 2026-09, while the repository default branch ends with a commit on 2025-12-22 and lib/dimples/version.rb reads 10.6.1; the gem names this repository as its homepage and carries the same author, so the registry figures are recorded, but a reviewer should check where the 2026 gem versions were built from. firstRelease is the date of the oldest gem version on RubyGems (1.0.0, 2015). The registry major 14 is recorded as currentMajor because the repository version is 10 and the registry major is higher. The gemspec requires Ruby "> 3.0", which is not recorded as runtimeMin because the constraint is open-ended. The rubygemsDownloads figure is the total from the RubyGems API. The repository is not a Packagist or npm package, so no other registry name is recorded. The maintainer is named in the LICENSE copyright line.
