notes: >
  The README says factory_bot supports multiple build strategies (saved instances, unsaved instances, attribute hashes, and stubbed objects).   The GitHub homepage field and the README's "thoughtbot.com" link point to the maintainer's company site, so the project's own site is the factory_bot book on GitHub Pages, which the README names as its reference ("the factory_bot book") and which is also the docs; the book page is mdBook and its text is readable. The maintainer follows the LICENSE copyright line, "Copyright (c) 2008-2019 Joe Ferris and thoughtbot, inc."; the README says the project "was originally written by Joe Ferris and is maintained by thoughtbot", so thoughtbot, inc. is recorded and Joe Ferris is named here only. The company's legal form is taken from its own footer "© 2026 thoughtbot, inc."; the footer and the about page give no country or street address, and the phone numbers (US and UK) are not a country statement, so hqCountry is absent. The README names factory_bot_rails as the Rails integration gem and the wiki for RSpec and Rails integrations; these are separate projects and no basedOn is recorded, because factory_bot does not state it builds on Rails. The repository's GETTING_STARTED.md is marked deprecated in its first line and is not used for fields. The runtimeMin comes from required_ruby_version in factory_bot.gemspec at tag v6.6.0 (">= 3.0.0"); the README's supported Ruby versions are listed in a CI workflow file that is not read here. The firstRelease is the year of tag rel_1-0 (commit dated 2008-05-31), the oldest tag; the RubyGems history begins with 1.0.0.alpha in 2017, which is later. The gem's RubyGems total downloads is the registry figure with its period 'total'. The GitHub release list's newest stable release is v6.6.0 (2026-05-04), so currentMajor is 6. The license is MIT from the GitHub license field; the README gives the license only as a pointer to the LICENSE file.
