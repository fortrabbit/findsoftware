notes: >
  Three Redis entities sign the Cloud terms, depending on where the customer is domiciled: Redis Inc., a Delaware corporation with offices in San Francisco, for Asia, Pacific and the Americas; Redis Ltd., with a registered office in Tel-Aviv, for Israel; and Redis EMEA Ltd., with a registered office in London, for Europe, the United Kingdom, the Middle East and Africa. The maintainer is recorded as Redis Ltd because the license page and the privacy policy name it as the company behind Redis; the choice and the headquarters country are for the reviewer, so hqCountry is not recorded. The Redis Cloud tiers Free, Essentials and Pro are hosted plans, so no paidEdition is recorded, and no price is recorded. The pricing page lists Essentials and Pro with SAML SSO and RBAC; the access-control docs describe SAML single sign-on, so sso is SAML. The Redis Cloud homepage calls the service the fully-managed version of Redis, recorded as basedOn redis; the Azure Managed Redis page says it is built on Redis Cloud technology, which is another product. The homepage footer also links LinkedIn, which has no field. The homepage compare menu lists Redis against other products; those pages describe Redis, not Redis Cloud, so no alternativeTo is recorded. The Redis Cloud pages name "Redis 8.4" and the open-source framework "Redis 8.8"; versions are not recorded. The hosted service has no repository, so no stars, contributors or SDK figures are recorded, as the rule for hosted records requires. The regions value names the cloud providers from the pricing page and the regions page lists EU regions. Fields coined here: none.
