notes: >
  The homepage is a Storybook build with no text in the HTML, so the docs were not read beyond the links the README gives; the README is the source for install, scope and the basedOn statement. The README names peer dependencies react and react-dom and no runtime, so runtime is not recorded. The README says Bootstrap 4 users need reactstrap v8, a version note only. npm carries v10 prerelease builds (release-please, dated 2023-02-17 in the npm time field), older than the latest release, so latestPrereleaseDate is not recorded. The GitHub releases list has no stable release after v9.2.3. The npm figure is the sum of daily downloads for 2026-10-19 to 2026-10-25 (zero on the first three days). The HTTP Archive technologies list has no entry named reactstrap or React Bootstrap, so httpArchiveSites is absent. The first npm upload is 0.1.0 on 2016-02-19, the same package, so firstRelease is 2016 rather than the 2018 oldest GitHub release. The LICENSE copyright names three people, not an organization, and the maintainer field records them as the license states it; the GitHub owner is the organization reactstrap.
  The README About section says the library contains React Bootstrap components that favor composition and control and does not depend on jQuery or Bootstrap JavaScript, and that the install step needs Bootstrap installed separately because reactstrap does not include the Bootstrap CSS.
