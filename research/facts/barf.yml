notes: >
  No project website is named, so no homepage is recorded. The README is the only documentation; its examples live in an example folder of the repository. The highest stable release is v1.1.1 (2023-12-09), and the repository was last pushed on 2024-08-14, after the last release. No minimum Go version is stated on the README; go.mod declares go 1.18 but no page states it, so runtimeMin is left out. The README title expands the name as "Basically A Remarkable Framework". No page states how the server process runs (the README only comments "start barf server" in code), so runsAs is left out. The README names REST and GraphQL architectures for the APIs it builds, and its examples use the standard net/http handler types; no parent framework is named. The copyright line in the MIT LICENSE names Perfection Loveday, an individual.
