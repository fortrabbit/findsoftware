notes: >
  Status accepted under criterion 1: the bundle is part of the Symfony framework's auth layer that a site or app is built with (login, firewalls, access control, password hashing), and it is listed under auth. Criterion 2: installed with Composer from Packagist (symfony/security-bundle). Criterion 3: the package page and the security docs. Criterion 4: not archived, no abandoned or deprecated flag, the latest stable release v8.1.11 is dated 2026-11-04. The repository is a read-only split of symfony/symfony, whose README sends issues and pull requests to the main Symfony repository; stars, contributors and downloads belong to the split. The maintainer follows the LICENSE copyright line (Fabien Potencier); Symfony SAS is named in the Symfony legal notice at sensiolabs.com and is not recorded here. The docs list the authenticators the bundle comes with: form login, JSON login, HTTP basic, login link, X.509 client certificates, remote users and custom authenticators. The docs list the built-in user providers: Entity (Doctrine), LDAP, memory and chain; of the user providers only the LDAP provider is recorded as sso, the others are not login protocols. The access token authentication page documents handlers for OpenID Connect, OAuth 2.0 token introspection and CAS 2.0, recorded as sso beside LDAP. For social login through providers such as Google, Facebook or Twitter, the docs point to the HWIOAuthBundle community bundle and the Oauth2-client package, which are not recorded. The docs say the bundle comes with authenticators and that firewalls and access control rules in the security configuration govern requests. The docs also cover password hashing, CSRF protection, Remember Me and login throttling, not recorded as fields. The firstRelease is 2011, the year of the oldest Packagist version (2.0.7, 2011-11-23); the packages page gives November 2011.
