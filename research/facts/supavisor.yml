notes: >
  Maintainer is the organization that owns the repository; the homepage and docs name the project without a legal entity, and SECURITY.md names the hosted Supabase platform and says the project "is also run by people who self-host it". The Supabase legal entity in research/facts/supabase.yml is not carried over. The docs pages describe the pooler as a cluster of nodes and the Management API as a Phoenix HTTP server, and no page says it runs as a daemon or service, so runsAs is not recorded. The Elixir floor in mix.exs at the v2.9.13 tag is "~> 1.14" (Elixir, not OTP); the runtime vocabulary has no Elixir version field, so runtimeMin is not recorded. The Docker Hub image supabase/supavisor (2418399 pulls) is not named by the install docs, so dockerPulls is not recorded. firstRelease is the year of the oldest GitHub release, v0.1.0. Fields coined here: none.
