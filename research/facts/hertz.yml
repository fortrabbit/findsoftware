notes: >
  Hertz has no project domain; the CloudWeGo docs site at cloudwego.io hosts its docs, so the docs URL is the homepage. The repository's latest stable release v0.10.6 is the main module and sets currentMajor 0 and latestReleaseDate 2026-08-06; the hz command tool is released separately under cmd/hz tags (latest cmd/hz/v0.9.8, 2026-10-20), and no fact records that tag. The README links a CloudWeGo community Slack; slack is not a field. The go.mod of the v0.10.6 tag states go 1.20, while the getting-started docs state Go 1.19 or later; runtimeMin follows the docs. The README names ByteDance only in the titles of linked blog posts, so no parent fact is recorded. The CSV lists the homepage as the cloudwego.io site, which the record keeps as the docs URL. The Lark user group in the README is not recorded as a field. The forkOf fact is the README's own statement; no basedOn is recorded because the README names fasthttp as the origin, and gin as an inspiration only.
