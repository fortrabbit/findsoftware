notes: >
  The homepage is the project's documentation on readthedocs, which answers over https; the record links the stable documentation root. The GitHub license field reports NOASSERTION, while the LICENSE file and the PyPI metadata both state MIT, so MIT is recorded from the PyPI metadata and the LICENSE file. The homepage says ABlog is part of the SunPy Project, an umbrella project rather than an owning company, so no parent is recorded. The maintainer is the copyright line of the LICENSE file; the PyPI author field reads The SunPy Community. The latest stable release is v0.11.13 (2026-01-20); the 0.11.0 release candidates are older than it, so no latestPrereleaseDate is recorded. The PyPI JSON carries no download figures, so pypiDownloads is not recorded. The first PyPI upload is from 2014 under the same package name and homepage, while the GitHub releases start in 2018, so firstRelease uses PyPI. The commands page describes ablog deploy for GitHub Pages; no field covers deploy targets.
