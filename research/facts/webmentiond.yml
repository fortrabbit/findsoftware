notes: >
  Accepted: the repository is not archived, the last commit is 2026-10-30, and the default branch has no end statement. The API lists v1.3.1-rc1 to rc3 without the prerelease flag; tags with rc are treated as prereleases, so v1.3.0 (2025-12-01) is the latest stable release and v1.3.1-rc3 (2025-12-03) is the latest prerelease. The oldest tag is v1.0.0 (2023-08-26). The Dockerfile in the repository says it is no longer maintained and that the image is built in ci/package.go; that is a note about the file, not an end statement for the project. The README badge "status-maintained" links to a blog post of the author. The README says the repository holds the backend used at zerokspot.com; the footer of that site names Horst Gutmann, who is recorded as the maintainer (GitHub owner handle zerok). The LICENSE file is the plain GPL-3.0 text with no copyright line. The frontend integration is a link element with rel="webmention" in the head of the page and a script tag that loads the widget from the server's ui path, which the getting-started page shows; this embedding is recorded in these notes only. The server speaks the W3C Webmention protocol as the docs describe it. Sign-in to the admin UI uses an e-mail link sent through an SMTP server, with the administrator addresses set by a flag, and access keys for CI; these are not sso or userRoles facts. Configuration sets --public-url for a reverse proxy, and the database path is a SQLite file. The Go version requirement on the install page (Go 1.24 or newer, Node 22 or newer) is a build requirement for building from source and the project ships a binary and a Docker image, so no runtimeMin is recorded. The policies page describes URL policies: a regular expression on the source URL with an approve action, stored in the url_policies table, checked during verification, and not yet configurable in the admin UI. The configuration page says the server needs write access to the SQLite file and its folder, and that it requires an SMTP server for the login e-mail and notifications.
