notes: >
  The README opens with "YEAH SO THIS IS PRETTY MUCH DEAD" and names tiny-slider (https://github.com/ganlanyuan/tiny-slider) as the switch; that is the end signal, so the status is discontinued; the repository description also reads "DEPRECATED jQuery Responsive Carousel.". The repository is not archived and was last pushed in 2024; the successor is not recorded as alternativeTo because the project's own pages only say to switch to it, and no record exists for it. The GitHub license field reads NOASSERTION because the LICENSE file carries two copyright lines, "Copyright (c) 2014 Owl" and "Modified work Copyright 2016-2018 David Deutsch"; the README states MIT, which is recorded. The maintainer follows the modified-work line, the name the homepage also gives; reviewer to confirm. The npm figure counts downloads of owl.carousel, the package the install section names; the bower route is recorded as a second install route. The README also points to the old owlgraphic domain, which it says is no longer in use; no field holds it. Releases: the first GitHub releases are 2.0.0 betas from 2015, the newest stable is 2.3.4 from 2018; the npm package starts in 2016. Contributors counted with per_page=1.
