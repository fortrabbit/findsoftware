notes: >
  The stable docs at andurel.com/docs/latest describe v1.5.5 (Go 1.26, go install of the unversioned module path); the README and the homepage describe the unreleased v2 line on master, which needs Go 1.27 and whose install channel is a nightly binary. currentMajor is 1 because v2.0.0 is not published; the v2 alphas are the latestPrereleaseDate. The nightly prerelease on GitHub is not a named alpha, beta or rc and is not used. The homepage names the same Twitter/X account the README lists under Author, the maintainer's handle; it is recorded as the homepage link. The docs state the Linux and macOS targets and PostgreSQL in the installation page; the README table lists PostgreSQL, narsilc and goose. The sites built with Andurel (DeployCrate, MBV Blog, Master Golang) are other products built on it and are not hosted offerings of Andurel. The mbvlabs.com and LinkedIn links on the homepage are the maintainer's and are not recorded. The first release date is the v1.0.0 release on 2026-07-10; the repository existed from 2025-08-26 without releases. The stable documentation (introduction, frontend options, database pages) is the source for categories, databases, templating, renderingModes and runsAs; it names Templ with Datastar as the default frontend and Inertia as optional, while the README on master describes the v2 line with Inertia as the only UI. The stable docs state that Windows is not supported.
