notes: >
  The CSV row names roadiz/core-bundle-dev-app, the development monorepo, as the repository; the docs link their changelog to it. The install docs name roadiz/skeleton, a skeleton, so the Packagist figures come from its core package roadiz/core-bundle (MIT, read-only mirror at github.com/roadiz/core-bundle). The v1 repository github.com/roadiz/roadiz is not recorded: its description says v1 and points to roadiz/skeleton for v2 and later. The homepage is docs.roadiz.io because roadiz.io answers 522 and www.roadiz.io redirects to the GitHub organization. The docs say the software is maintained by Rezo Zero Team; the legal notice names Rezo Zero without a legal form. The docs state "Native REST API exposure" through API Platform and name no GraphQL, so headlessApi is rest only. The requirements page says Roadiz is not meant to be deployed directly to a production server out of the box: it is a Symfony application configured and customized in a development environment first, and deployment needs cache clearing and migrations, which may require shell access. The docs cover two uses: headless through API Platform, and classic websites through Twig.
