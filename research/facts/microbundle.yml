notes: >
  Repository only: the GitHub homepage field points at npm.im/microbundle, a short link to the npm package page, not a site of the project, so homepage is absent. The README names Rollup as the bundler it is "powered by"; the README also lists Babel for ESnext and async/await syntax, Terser compression, TypeScript support, a watch mode and the output fields of package.json (main, module, unpkg, exports), which are features, not fields. The README states no Node.js requirement and the npm package declares no engines field, so runtime and runtimeMin are absent. The version line is 0.x, so currentMajor is 0. npm latest is 0.15.1 (2022-08-12), not deprecated; the repository is not archived, its default branch last had a commit on 2025-10-24 and its last push is dated 2026-02-01. The last release is four years old on 2026-10-28, and the release-age rule is decided by the import (listing), so status stays accepted. The README has no end-of-life or maintenance notice. npmWeeklyDownloads takes the microbundle package the install line names, summed over 2026-09-28 to 2026-10-04. The repository tags and releases run from 0.1.0 (2017-12-11) to 0.15.1; firstRelease is the oldest of them. The package's dist-tag next is 0.12.0-next.9 (2020-05-01), older than the latest stable release, so latestPrereleaseDate is absent. The LICENSE copyright line gives the maintainer as Jason Miller; no legal form or country is stated. The repository's GitHub owner is an individual account. The project's own pages are the README only; no docs site is linked.
