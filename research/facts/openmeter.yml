notes: >
  Stable GitHub releases stop at v0.2.0 (2023-07-11); every v1.0.0-beta.N tag is flagged as a non-prerelease on GitHub but is skipped as a beta, so currentMajor is left out and the reviewer decides whether the line in use (1.0 beta) or 0 is the record's major. The README calls releases beta and says they can include breaking changes. Criterion 4 holds on the latest push (2026-11-02) and the 2026-10-09 beta. The homepage footer and privacy page name "Tailfin Cloud Inc." as the copyright holder, a legal entity other than the parent; it is not recorded as maintainer. The LICENSE file carries no copyright line. The about page says the managed product is "Konnect Metering & Billing", a hosted service next to the Apache 2.0 code. The homepage and the README name the Trust Center and SOC 2 compliance for deployments, and the homepage lists "RBAC and SSO" next to them; it does not say which edition, so no sso or userRoles fact is recorded. The architecture page lists an API server, sink, balance, billing and notification workers and a Kafka, ClickHouse and PostgreSQL runtime. Redis is optional and Svix is used when webhook delivery is enabled (README). The README names JavaScript, Python and Go SDKs and webhooks; the Python SDK is in preview on PyPI. They are client libraries, not recorded as fields. The homepage also links LinkedIn, which has no field. The Go module and the Helm chart are not registry figures. Kong's country is not stated on the pages read, so hqCountry is absent. The Kubernetes page says the Helm chart is for development deployments, not production (README wording).
