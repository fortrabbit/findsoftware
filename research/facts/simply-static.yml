notes: >
  The license is stated two ways. The plugin header in simply-static.php reads GPL-2.0+ and GitHub reports GPL-2.0; both are recorded. The GitHub repository is Simply-Static/simply-static, and the plugin header was read from the repository's raw files. The npm package named simply-static is unrelated and is not used. The free plugin is the core; Pro and Studio are the paid tiers. Coined fields: wordpressPluginPage, wordpressActiveInstalls (the page's own figure, a range), wordpressDownloads, because WordPress.org is the plugin directory for this software.
