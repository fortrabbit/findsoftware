notes: >
  The project's name is written DotVVM on its homepage and repository; the framework is for ASP.NET, and the homepage names ASP.NET Core and .NET Framework as its runtimes. runtimeMin has two entries from the same homepage sentence, ASP.NET Core 8 and .NET Framework 4.7.2. The homepage pricing list has three paid tiers of add-ons and support: DotVVM Business Pack, DotVVM Tailwind UI, Bootstrap for DotVVM and the Visual Studio extension are sold as paid add-ons, and Premium is paid support; the Complete bundle combines the paid add-ons. None is recorded as paidEdition because they are add-ons and support, and no prices are recorded. The products page is recorded as a link only; the nugetDownloads figure is the all-time total the NuGet search service reports. The highest stable GitHub release is 5.0.0 (2026-08-21); the NuGet package DotVVM reports 5.0.2, which has the same major and no GitHub release on the releases list. The oldest tag is v0.8.6.13-pre, committed on 2015-12-16, which sets firstRelease; the oldest GitHub release is 1.1.5 of 2017. The preview 5.0.0-preview11 (2026-08-08) is older than the stable release, so no latestPrereleaseDate is recorded. The docs base URL is recorded as the docs root; the quick start page is the one the install method cites. The docs say "DotHTML markup" for the page language, which is the templating value. The docs show the rendering mode of controls, not of the whole framework, so both renderingModes entries cite the mode as a feature.
