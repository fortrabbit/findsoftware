notes: >
  The homepage is live and describes the 2.0 beta. The docs at amberframework.org/docs/v2 list "1.5 Stable" and "1.4.1 Legacy" documentation versions, but the 1.5 pages named by URL returned 404, so no fact is taken from v1 documentation; the v1 facts come from the README and the v1.5.0 release notes. The V2 documentation describes Grant ORM with SQLite by default and PostgreSQL or MySQL on request; because it describes the beta, databases is not recorded. The V2 manual deployment page describes a compiled binary run under systemd, which is recorded as runsAs always-on for the framework's run model. The README's Linux install steps are for v1.4.1, a superseded stable release, so installMethod cites only the Homebrew command in the README. The latest stable GitHub release is v1.5.0 (2026-08-01), so currentMajor is 1 even though the 2.0 beta releases (latest v2.0.0-beta.5, 2026-08-13) are prereleases. The README links the Amber docs at docs.amberframework.org/amber, which now redirects to amberframework.org/docs/v2. The LICENSE copyright names "Amber Team"; no legal entity is named, so maintainerType is community. The Shards package name is not recorded because the install docs name the GitHub repository. The site's stated "inspired by" list (Kemal, Rails, Phoenix, Hanami) is not a basedOn statement, so basedOn is not recorded.
