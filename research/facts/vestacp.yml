notes: >
  In doubt whether the current version continues: the install page says "The current version of Vesta is deprecated! We are working on a full rebuild" while the README says it is back under active development and releases landed in October 2026; a 2.0 release or an end statement would settle it. The sources disagree on whether the project is live: the README says "Vesta is back under active development as of 25 February 2024", the homepage says "Vesta 2.0 is coming soon", the default branch was pushed 2026-10-22 and GitHub lists stable releases 1.0.0-8 to 1.0.0-10 on that date; but the install page carries "IMPORTANT! The current version of Vesta is deprecated! We are working on a full rebuild of Vesta." That notice announces a rebuild, not an end, so it is no end signal; no page states the project has ended, and the repository is not archived. The 2.0 rebuild is announced under the Business Source License 1.1 in a private codebase; the license recorded is the GPL-3.0 of the released code. The docs say Vesta "was acquired in early 2024 and is under a new direction with a new maintainer and sponsor"; the progress update names Outroll as the current owner and says a separate VestaCP company is being created, with no legal form or address given, so hqCountry is absent. The repository's releases run back to 1.0.0-5 (2021-11-23) and 0.9.8-18 (2017-12-29); the oldest tag is 0.9.8-10, committed 2014-08-04, so firstRelease is 2014 from the tag commit date. The name is the one the README title uses, "Vesta Control Panel"; the CSV name is VestaCP. HestiaCP's record says HestiaCP is based on VestaCP; this record takes no forkOf or basedOn from it. Paid add-on plugins (SFTP Chroot and others) are no paidEdition, and the docs now list paid plugins as free. The homepage also claims 25000 installs every month. The install page lists old supported operating systems (RHEL 5 to 7, Debian 7 to 9, Ubuntu 12.04 to 18.10) and the AWS Marketplace listing is an image, not a hosted service; neither is recorded. Language is the GitHub primary language PHP; no page states the panel runtime, so runtime is absent. The README's Gitter chat badge is not a field.
