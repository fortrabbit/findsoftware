notes: >
  The homepage suave.io answers over https and the getting-started page is the install page. The project's own pages name Ademar Gonzalez as the creator and maintainer; the LICENSE copyright line names Ademar Gonzalez, Henrik Feldt and contributors (2018), which is recorded as a second statement rather than a second maintainer. The GitHub API reports the license as NOASSERTION, and the LICENSE file and the homepage both state Apache-2.0, so license is recorded from those two sources. The getting-started page lists .NET 8 or later and F# 4.7 or later; the runtime minimum is the .NET major, and the F# version is not recorded. The GitHub releases list starts in 2014 with v0.18.0 (2014-11-17) and the repository was created in 2010; the tags before the first release are not counted, so firstRelease is 2014. The NuGet search index gives totalDownloads 5539112 for the package Suave, with no period stated. The homepage says the server runs as an executable or a container, which is a packaging statement, so runsAs rests on the deployment page, which shows Suave run as a systemd service. Templating is the Suave.DotLiquid package documented on its own docs page. The homepage's "Static & hybrid sites" and "REST APIs" items describe uses and are not rendering or headless API facts.
