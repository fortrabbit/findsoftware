notes: >
  Status: accepted. The README opens with a notice: "svelte-i18n is due to some reworking, like moving from a singleton to instances. This will be worked on when I find the time and priority". That is a statement of deferred work, not a maintenance-mode or do-not-use statement, so the row stays accepted; a reviewer should decide whether it counts as a maintenance notice. The repository is not archived, the npm latest version 4.0.1 is not deprecated, and the latest npm upload is 2024-10-21, inside the four-year window. No GitHub release object exists; the newest stable tag is v4.0.0 and the npm stable version 4.0.1 is the newer one, so currentMajor and latestReleaseDate come from the npm registry. The README has no homepage; the npm package names the GitHub README as its homepage, so no homepage is recorded. Requirements in the README: Node ">= 11.15.0" and browsers "Chrome 38+, Edge 16+, Firefox 13+, Opera 25+, Safari 8+". Both name a platform, and the Node line is a requirement of the Svelte tooling rather than a runtime the library serves, so neither runtime nor runtimeMin is recorded and no runsAs (the README gives a browser support list, not a sentence about where it runs). A reviewer should decide whether the Node requirement is a runtime statement; the npm engines field at the main branch is ">= 16". The Svelte-Kit guide says the library supports SSR, which is compatibility and not renderingModes. The FAQ names intl-messageformat, which the library builds its formatting on; that is a dependency, not basedOn. The Migration guide covers v1 to v3 of this library, so importsFrom is absent. The install section of the Getting Started guide shows "yarn add svelte-i18n", recorded as the npm registry route. The npm weekly figure is the sum of the daily counts for 2026-11-01 to 2026-11-07 for the package the install guide names. The ecosyste.ms dependent counts were read on 2026-11-16 from a sync dated 2026-11-09. The CSV row names 70.5k a week, a different window, which the record does not use.
  The Getting Started guide says a locale dictionary is a regular JSON object. It loads dictionaries with addMessages for synchronous imports and with register for loaders, and init sets fallbackLocale and initialLocale; the Svelte-Kit guide sets the locale on the server from the Accept-Language header.
