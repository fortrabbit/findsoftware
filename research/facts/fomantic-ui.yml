notes: >
  The fork statement comes from the homepage and the README, which says the project was created to continue Semantic-UI development and intends to merge back once that restarts; the README also says a v3 is being planned. The default branch is develop. The npm dist-tag nightly points to 2.10.0-beta.128, published 2026-10-21; it is a nightly build, so it is not recorded as latestPrereleaseDate. The LICENSE file has no copyright holder line and the project names no legal entity, so the maintainer is the GitHub organization; the npm author Jack Lukic created the original Semantic UI and is not recorded as maintainer of this fork. The docs name jQuery nowhere in the pages read, so basedOn is not recorded. The HTTP Archive "Semantic UI" entry counts the upstream product, not this fork, so no httpArchiveSites figure is recorded. The first npm upload, 2.3.1, is dated 2018-06-04, the same day the repository was created. The docs and README name no runtime for the CSS and JavaScript distribution; Node 12 and npm 6 are listed as installer requirements only, so no runtime is recorded. The getting-started guide describes the base concept as adding descriptive class names to HTML nodes (the example is "ui primary button"), offers npm or a CDN provider and allows hosting the distribution files locally, and says theming requires the npm install because that is how a project gets the files needed to create and manage a theme. The README packages table lists the project's own CSS-only and LESS npm packages, and third-party SASS and React packages that are not recorded. The README says work on version 3 has started, with proposals tracked in a GitHub issue.
