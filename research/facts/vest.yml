notes: >
  Monorepo: the default branch is "latest" and the npm package vest lives in packages/vest; stars and contributors belong to the monorepo (ealush/vest), and the npm figure is the vest package the install page names. The homepage footer reads "Copyright © 2026 ealush" (the GitHub login); the maintainer follows the LICENSE copyright line (Evyatar, 2021). The npm registry lists a 0.0.1 version of "vest" published in 2014 by a different author (the vest-node project); it is not this project's history, so firstRelease is 2019, the first upload of ealush's own versions (1.0.0-rc.1 on npm, 2019-12-14; the first GitHub release 1.0.0, 2019-12-22). Runtime node comes from the server-side page sentence naming Node.js; the README also lists "rules shared between browser and server", and no sentence states a runsAs value, so none is recorded. Vest 6 is the current major (homepage: "Vest 6 is here!"); npm versions 5.0.0 and 5.2.1 are deprecated and the latest is not. The alternativeTo entry rests on the when-not-to-use page, which names five schema tools as alternatives for the job of parsing a payload at a boundary; the vest-vs-the-rest page and the README call Zod, Valibot and Ajv complementary layers to Vest's validation state, and React Hook Form and Formik as form managers that work together with Vest, so those two are not recorded in alternativeTo (reviewer: drop the entry if complementary reads as not an alternative). Coined kinds (Standard Schema interoperability, Enforce schemas, stateful suites) are described in notes only. The npm dist-tags next, nightly and dev are not recorded. Behaviour in the README and homepage: "Vest runs the tests for the field or step that changed and keeps the results for everything else." and the homepage line "Run the rules for the field that changed. Keep the other results." The npm weekly figure covers 2026-11-01 to 2026-11-07. The README's Discord badge and the homepage link name the same invitation; the discord fact is a link fact with no quote.
