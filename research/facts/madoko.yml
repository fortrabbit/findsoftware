notes: >
  The homepage https://madoko.net cannot be read: the TLS certificate names reroute443.microsoft.com and does not match the host (curl error 60 and no subject alternative name), and www.madoko.net does not resolve. No homepage is recorded and the status is stub, as the dead-homepage rule sets it; the status fact has no quote because no page of the project answers. The record is also stub by age: the npm package latest is 1.2.3 from 2020-03-03, and the repository has no GitHub release (tags only, latest v1.2.0). The license.txt file opens with a Microsoft and Daan Leijen copyright notice and "Madoko is free software; You can redistribute it and/or modify it under the terms of this license", then reproduces the Apache License 2.0 text. GitHub reports the license as NOASSERTION; the Apache-2.0 entry is the reviewer's decision. The readme also names an online service at Madoko.net with storage and collaboration through Dropbox or GitHub, which cannot be read; it is not recorded as a fact. The GitHub language field reads HTML, so the language is recorded as the readme states it (written in Koka). The author named in the license file is Daan Leijen; the maintainer is recorded as the copyright holder. The npm package has no license field; its registry figures are from the package the readme names. The weekly npm downloads cover 2026-10-12 to 2026-10-18.
