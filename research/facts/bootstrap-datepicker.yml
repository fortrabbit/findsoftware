notes: >
  Accepted. The GitHub Pages demo named in the README is the project's own site and carries the heading "Datepicker for Bootstrap". The documentation requires Bootstrap 2.0.4 or later and jQuery 1.7.1 or later, and package.json lists jquery as a dependency; both are dependencies, so basedOn is not recorded: the project calls itself a datepicker "for twitter bootstrap" in its GitHub description, with no "based on" wording. No page says the widget runs in the visitor's browser, so runsAs and runtime are not recorded. The docs list the datepicker's data-api and No Conflict mode as jQuery plugin behavior. The install routes the README names are the CDN (cdnjs) and cloning the repository for development; the npm package bootstrap-datepicker exists and its figure is recorded, but no install page names npm. The CSV figure of 93.1k per week predates the current npm window. The project's repository has an Apache-2.0 LICENSE with no copyright line; the package.json author gives the maintainer. The earliest tag is v1.0.0 (commit 2013-02-11). The newest stable release is 1.10.1 (npm 2025-09-16, GitHub release 2025-09-15); no prerelease is newer than it, so latestPrereleaseDate is not recorded. The README links a Google Group and a Gitter room by link label only, so neither is recorded. The x entry quotes the README badge text "Twitter Follow". The docs call the data-api "in true bootstrap fashion" and compare it with "bootstrap's own plugins", which is no statement that the project is a Bootstrap plugin, so basedOn stays out.
  The documentation shows the widget called from JavaScript on Bootstrap-style markup, with a data-api; the Bootstrap dropdown styles and sprites are required for some styles, and the page loads Bootstrap and jQuery alongside it. The GitHub Pages site hosts an online demo and a sandbox where the options can be tried.
