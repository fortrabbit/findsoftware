notes: >
  Hosted only; criterion 2 is waived. The product family also uses the names doc2.live (the content delivery service in the pricing and getting started pages), doc2.email and doc2.mail, which the pricing page describes as low-code email templates; the homepage and legal pages use doc2.site and DOC2.SITE LTD. The developer docs name a "Headless API" with an API reference and a /docs and /search endpoint; no page names REST, GraphQL or another API style, so headlessApi is left out. Content lives in Google Drive, Docs and Sheets, which the service reads, so contentStore is left out. Output is HTML and JSON (the features page says it "Produces regular JSON"), recorded here as output formats. Frameworks Next.js, Nuxt.js and Astro are supported, per the features page. Subscribing to a plan requires a Google account. Developer plan is free for personal non-commercial projects; Business plan is per user with a yearly option; Enterprise is by sales contact. No prices are recorded. The Developer, Business and Enterprise plans list core APIs (Docs, Spreadsheet, Image and File API), preview and live content, private and preview workspaces and tag-driven content; these are plan features. The legal pages name no street address and no country; the terms send arbitration to a Brussels court and a privacy notice refers to Canada and the UK, which do not name the company's headquarters, so hqCountry stays out. The privacy policy is dated January 19, 2023. The homepage has no social links. The copyright on the homepage is 2026.
