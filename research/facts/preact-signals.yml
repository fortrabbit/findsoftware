notes: >
  The GitHub repository is a monorepo: its stars and contributors belong to all of its packages, and the npm figure is for @preact/signals, the Preact integration that the guide's installation section names; it re-exports the core library. The root README calls the project "a performant state management library" that should "Integrate into frameworks as if they were native built-in primitives", and the guide says its utilities "are framework-agnostic tools from the Signals library" that "work great with Preact" but "are not Preact-specific". The root README says "Signals can be accessed directly and your component will automatically re-render when the signal's value changes", which the prose paraphrases. The core package is framework-agnostic and the Preact and React packages are its bindings, so no basedOn is recorded: the bindings are @preact/signals for Preact and @preact/signals-react for React, both in the same repository. The homepage is the Signals guide on the Preact site; the announcement post at preactjs.com/blog/introducing-signals (dated 2022) is the other page the README names. The v10 guide, which is a previous major of the Preact documentation, carries the same installation sentence. The release list is one list for every package in the monorepo; the highest stable release of @preact/signals is 2.11.4 on 2026-10-27, and the latest release of the React package is 3.12.0 on 2026-08-04, which is not used for the record's version. The repository's default branch is main and its LICENSE names "Preact Team" as copyright holder; the Preact organization's own site is the source for the x and bluesky links. The guide does not state a runtime or a process model, so runtime, runsAs and hosting stay empty.
