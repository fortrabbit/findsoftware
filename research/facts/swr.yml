notes: >
  The address swr.vercel.app answers with a redirect to vercel.com/oss/swr, the maintainer's own project page, which is recorded as the homepage; the README links swr.vercel.app as its documentation. The stars, contributors and dependents belong to vercel/swr, a single package repository. The npm figure is the sum of daily downloads from 2026-11-01 to 2026-11-07 (the registry API range), not a point endpoint. The npm package swr has a 0.1.0 upload dated 2018 by another author (a Selenium runner), so firstRelease takes the first GitHub release, 0.1.1 dated 2019-10-29. The getting-started page lists pnpm, yarn and bun commands beside npm; all are the npm registry route. The README and docs say SSR and SSG are supported, a compatibility statement, so renderingModes is left empty. The project page vercel.com/oss/swr calls it a library "from Vercel", matching the LICENSE copyright line. The Next.js usage page adds no field.
