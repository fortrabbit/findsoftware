notes: >
  The README's Status section says the feature set is frozen while the project "might continue to get important security- and bug-related updates". That is a maintenance statement, not an end, so the status stays accepted. The maintainer's advice to build such widgets into an app with a framework is an opinion and is not recorded. The Browser heading covers the jsDelivr script and stylesheet routes; the sentence before the tags is "jsdelivr:", and the README says the script tag does not work with defer. The README names no runtime and no page says in those words where the widget runs, so no runsAs is recorded. The yarn install line is the same npm route. The GitHub API reports JavaScript as the repository language. The CSV row names the package "Pickr", but the npm package and the repository are @simonwep/pickr; the ecosyste.ms figure for the unscoped name "pickr" belongs to another project (snit-ram/pickr) and is not used. The npm figure counts the seven days 2026-11-01 to 2026-11-07. The homepage is the GitHub Pages site the README links as "Fully Featured Demo". The oldest tag is 0.0.2, committed 2018-06-10, so firstRelease is 2018. Dependents are counted for @simonwep/pickr only. The README features list names themes, swatches, opacity control, touch support and shadow-DOM support, and its Themes section shows classic, monolith and nano; these are features, not fields, as are the i18n and accessibility claims; the i18n value rests on the README feature line and the i18n option block.
