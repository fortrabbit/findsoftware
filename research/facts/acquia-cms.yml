notes: >
  The README says "Acquia CMS has been officially renamed to Acquia Drupal Stater Kit" (spelling as published), so the name fact follows the README and the CSV name "Acquia CMS" is the former name; the id stays acquia-cms. The repository is a Drupal module on Packagist (type drupal-module, package acquia/acquia_cms); the installable project is the Composer template the README links, which is not in this repository, so its install page was not read. The license is stated three ways: GitHub reports GPL-2.0, Packagist reports GPL-2.0-or-later, and the README names version 2 as published by the FSF; the "or later" clause is the only difference and was not resolved. No product website was found; the repository is its only page, and www.acquia.com is the company site and is cited only for the company address and copyright. docs is the Acquia documentation site the README links, which covers all Acquia products. The newest stable Packagist version matches the latest GitHub release; the repository is not archived and the package is not abandoned, so no end signal applies. The Packagist require lists the Drush and Drupal module dependencies but no PHP or Drupal core minimum, so runtimeMin is not-found.
