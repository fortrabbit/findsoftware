notes: >
  The README and homepage say HiQ is built with PostCSS; PostCSS is the build tool the source version is processed with, not a UI framework, so basedOn is not recorded. The README names three PostCSS plugins the source version requires, postcss-mixins, postcss-custom-selectors and postcss-custom-media; they are not recorded as fields. The README describes HiQ as a simple CSS foundation with responsive typography and input styling. The README says HiQ is built with custom properties, that the source version gives access to utility mixins, and that the custom property reference lists the values to override. The Theme Builder linked from the homepage is a separate web tool at hiq-theme-builder.netlify.app and is not a hosted service of the software. The LICENSE copyright line reads 2018 and the homepage footer reads 2017-present; both are kept as their sources state them, and the LICENSE line is the one recorded as maintainer. The npm registry's dist-tags list latest 4.2.11 (2024-07-23) and a beta tag on 2.3.0-beta, the beta is not a stable release.
