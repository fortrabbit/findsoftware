notes: >
  mPDF is the PHP library of the mpdf/mpdf repository; its default branch is development, which the README warns can differ from the last stable release, so the stable tags and Packagist v8.3.1 are used for currentMajor and latestReleaseDate. The GitHub releases list stops at v8.1.0 (2022-04-16) while the tags and the Packagist package run to v8.3.1; the registry is the newest-stable source. firstRelease is the oldest entry of the manual's changelog, mPDF v1.1 dated 2008-05-01, which is older than the oldest git tag (v5.3.0, commit dated 2011-09-14) and the oldest Packagist upload (v5.5.1). The README says "It is based on FPDF and HTML2FPDF (see CREDITS)" and the manual's credits page also names TCPDF and UFPDF code: those projects are not record ids, so they stay in notes and no basedOn is recorded. The README calls mPDF "quite dated" and says "better alternatives are available, albeit not written in PHP", and points to headless Chrome for state of the art CSS support; no alternativeTo is recorded because the README names no record id. Requirements from the README: the PHP mbstring and gd extensions have to be loaded, with zlib, bcmath and xml for some features, and an nginx or Apache server rather than php -S for fetching external HTTP resources. License wording: composer.json and Packagist say GPL-2.0-only and the README says "released under the GNU GPL v2 licence", while the manual's license page (copyright line "Copyright (C) 2010 Ian Back") says version 2 "or (at your option) any later version", so both are recorded as separate entries; the LICENSE file is the GPL version 2 text. The README links a donation button; a donation is not a paid edition. The runtimeMin value comes from the composer.json require of the latest tag, ^5.6, which is the manifest's lowest accepted PHP. The maintainer is the author the README names; the repository owner is the organization mpdf. Contributors count across all pages of the contributors endpoint. The ecosyste.ms counts are dependents of mpdf/mpdf on Packagist. The README also points to the mpdf tag on Stack Overflow, which is no forum field.
