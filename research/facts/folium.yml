notes: >
  Boundary ruling for the Python plotting group (wave 55): accepted because the getting-started page says a map can be saved as an HTML file and the README describes an interactive Leaflet map; the output is HTML. The README lists packages and plugins that build on folium; they are not recorded as records here. GitHub reports no license for the repository (NOASSERTION); the LICENSE.txt file is MIT and PyPI states MIT. The maintainer follows the LICENSE copyright line ("Folium developers"); the PyPI metadata names Rob Story as author, which is not the copyright holder and is not recorded as maintainer. Current major line: 0.20 is the newest stable release (2025-06-16); the 1.0.0 line exists only as a prerelease tag (v1.0.0-pre.1, 2026-07-26). The Gitter room linked from the README is a chat service, not recorded as a forum. The repository's stars and contributors belong to this repository. The project's own docs are at python-visualization.github.io, and the homepage is that same site.
