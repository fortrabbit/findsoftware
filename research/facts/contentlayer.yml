notes: >
  Discontinued: the README of the repository states the project "is no longer maintained due to lack of funding" and links a fork, timlrx/contentlayer2; the fork is a named successor and is not recorded as a fact. The repository is not archived and was last pushed 2024-11-07. The latest release is 0.3.4 from 2023-06-29; the release date alone does not set the status. The homepage and docs say Contentlayer supports Next.js, Remix, SvelteKit and Astro with some marked as considering; those are environments the content is built in, not parent software, so basedOn is not recorded. The content sources are local Markdown, MDX, JSON and YAML, with Notion and remote files marked experimental and Contentful marked planned; the content store is the files the project reads, so contentStore is left out. Contentlayer runs as part of the Next.js dev server or through its CLI, which gives runsAs local. The LICENSE names Stackbit Inc. and Johannes Schickling as copyright holders; the company is recorded as maintainer, with the individual named here. The Node floor comes from the npm package engines field (major 14 of a 14.18 range). The X and Discord links are on the homepage.
