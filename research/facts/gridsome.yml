notes: >
  The install docs name @gridsome/cli, a CLI in a monorepo; the core package gridsome is the record's registry package, so npmName and the npm downloads are for gridsome, and the CLI's own weekly downloads (940 for 2026-10-12 to 2026-10-18) are not recorded. The project has no GitHub releases; the repository's tags run from v0.0.1 to v0.2.1 and do not match the npm line, so currentMajor and latestReleaseDate come from the npm latest tag 0.7.23 (published 2020-11-22), and firstRelease from the npm package's creation (2018-09-16). The npm engines for 0.7.23 state node ">=8.3", which is recorded as runtimeMin 8; the repository's package.json now states "^12.13.0 || ^14.0.0 || >=16.0.0", which is not recorded because it is the unreleased repository state. The latest release is four years old, so the import moves the record to stub on its own; no end statement was found: the README says "This project is under active development", the repository was pushed on 2024-04-10 and is not archived, and npm shows no deprecation. The homepage says "An open source project by @hjvedvik, @tommyvedvik and Contributors"; the maintainer field follows the LICENSE copyright holder, "Gridsome", since no legal form is stated. The docs' Gatsby comparison page is the project's own text and is recorded as alternativeTo. The homepage names Netlify as a sponsor of hosting infrastructure; that is not a field. The contributor count is from the contributors endpoint with per_page=1, page 120 of the rel="last" link.
  Build and deploy, from the how-it-works and deployment pages: the build command is gridsome build and writes a dist folder. The deployment page says a site needs a static web host and lists Netlify, AWS Amplify, Vercel, GitLab Pages, GitHub Pages, Surge.sh and Azure Static Web Apps for Git-based deploys, and FTP upload of the dist folder. Gridsome builds one .html and one .json file for every page, and source plugins fetch content from local files or external APIs into a local database that a GraphQL data layer queries; the data is stored as static JSON at build time. The introduction page says the JavaScript runs as a Vue SPA after the first page loads.
