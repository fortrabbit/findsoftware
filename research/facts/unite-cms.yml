notes: >
  Status is discontinued on the README's own statement, read 2026-10-20: "At the moment there is no active development on this open source cms". The repository is not archived and its last push is 2023-01-05, so the README statement is the signal. The candidate row still says accepted and needs the reviewer to move it. The README's "Version 0.10" is the current line and names no release tag; the currentMajor value 0 is the pre-1.0 line, and the latestReleaseDate is the date of the GitHub release 0.10.0, which is flagged as a pre-release. The description and the Symfony and GraphQL statements come from the GitHub repository description, which is the project's own text. The LICENSE copyright line names Franz Wilding without a legal form; no page gives a company. The composer.json requires Symfony components and four path-based bundles (core, doctrine-orm, admin, media); those are not separate records here. The release and runtime figures are from the 0.10 line, so runtimeMin 7.2 is the composer.json constraint, not a tested minimum.
