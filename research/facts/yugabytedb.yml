notes: >
  Status and sources: the repository has releases (GitHub's latest flag is v2026.1.2.0 from 2026-09-22), so no lastCommitDate. The version scheme is calendar-based (2026.1 series, marked STS on the releases page, and 2025.2 series, marked LTS), so currentMajor stays out; latestReleaseDate is the newest stable release by date, v2025.2.8.0 of 2026-10-23, a maintenance release of the older series. The oldest GitHub releases (v0.9.5.0, 2018-02-22, to v0.9.8) are prereleases; firstRelease is the oldest stable release, v1.0.0 (2018-05-04). GitHub detects no license (NOASSERTION): the README and LICENSE.md split the repository: Apache 2.0 for the database under src/, java/ and the rest, and the Polyform Free Trial License 1.0.0 for YugabyteDB Anywhere under managed/ and troubleshoot/ ("For production use of YugabyteDB Anywhere, a commercial license is required", LICENSE.md); that is another product's license, so it is not a license fact of the database. The README says the default build generates only the Apache binaries. YugabyteDB Anywhere is a separate self-managed management product, free for evaluation use of up to 32 consecutive days and commercially licensed for production, and is no paidEdition: it is a product paid as a whole, and the README says the open-source version has the enterprise features such as distributed backups and encryption at rest. Hosting: YugabyteDB Aeon is the fully managed cloud DBaaS; the pricing page was read for the pricing URL only. The quick start calls the local single-host cluster development and learning, and the deploy pages cover production; the yugabyted reference says it can be used for production deployments on VMs. Maintainer: the terms of service name YugaByte, Inc. with a Sunnyvale address, while the site footer reads YugabyteDB, Inc.; the legal name is the one the terms give, and the address names no country, so hqCountry US rests on a full street address with a California state and ZIP code. The GitHub organization is the repository owner. Contributors counted from the contributors endpoint with per_page 1, last page 299. The CSV row names a C language; GitHub reports C. The homepage also lists LinkedIn and YouTube, which are not fields. The comparisons page also names Amazon Aurora, Google Cloud Spanner, FoundationDB, DynamoDB, Azure Cosmos DB and Redis, which have no record ids. YugabyteDB Voyager also lists MySQL and Oracle sources, but the docs state MySQL and Oracle offline migration is deprecated with support ending October 13, 2026, so only PostgreSQL is recorded in importsFrom. Fields coined here: none.
