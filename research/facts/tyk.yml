notes: >
  Dual license: the README and LICENSE.md put every directory except ee/ under the Mozilla Public License 2.0, and ee/ under a commercial license (ee/LICENSE-EE.md, with the EULA). GitHub reports the license as NOASSERTION. The default branch is master; the repository holds the gateway itself, so the Go module and its toolchain are not registry figures. go.mod at v5.16.0 names go 1.26.5; a Go toolchain is no runtimeMin, so none is recorded. The latest GitHub release flag is v5.16.0 (2026-10-27); a maintenance release v5.13.5 was published 2026-10-30 on the 5.13 line, so the newest publication date is later than the recorded one; the reviewer decides which date the field takes. The oldest GitHub release is 1.0 (2014-08-13), which matches the README's "since 2014". Redis is required by the open source gateway (quick start and installation pages); it is no databases value in the register, so it is not recorded. Tyk Dashboard, Developer Portal, Operator and the Multi Data Center Bridge are paid components on the open source docs page; the self-managed plans and the Core, Professional and Enterprise tiers are not recorded as editions beyond the Tyk Self-Managed platform line. Tyk Cloud, Hybrid and Self-managed plan names on the pricing page are not editions. Separate Tyk-maintained projects named on the README (Tyk AI Studio under AGPL-3.0, Tyk Pump, Tyk Identity Broker, Tyk Mserv) are not recorded here. The tyk.io comparison pages for Apigee, Azure, MuleSoft and WSO2 name products without a record, so no alternativeTo for them. The homepage company footer links Facebook and Instagram; the LinkedIn link is not a field. The "London, UK" line on the about page is the office statement used for hqCountry; the terms give a London address for Tyk Technologies Ltd registered in England. Fields coined here: none.
