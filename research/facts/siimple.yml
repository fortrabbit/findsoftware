notes: >
  The README says siimple is inspired by bulma and names the library's methods and dependencies, but no statement makes it built on another framework, so basedOn is not recorded. The getting-started page says the CLI needs Node.js 14 or higher; that is a build step requirement, not a runtime of a live site, so no runtime is recorded. The getting-started page describes a CLI that compiles a customized stylesheet from siimple.config.js. The standalone package (@siimple/standalone, marked experimental) compiles the configuration in the browser; it is a separate package and is not recorded as runsAs. The x value is the README's "Follow @siimplecss" badge link. The root package.json names siimple-repo, which is not published; the npm package siimple is the one the install docs name, and its latest version 4.4.0 matches the GitHub release of 2025-11-02. The npm figure of 180 weekly downloads is the sum of the daily counts for 2026-10-19 to 2026-10-25. The CC BY 4.0 entry covers the documentation only, and the MIT entry covers the code, as the README and homepage state.
