notes: >
  The project page lists 3.0 as upcoming and 2.17.3 as stable, so currentMajor is 2 and the default branch is 2.18.x. The stable introduction states that a prerequisite is "the MongoDB PHP extension installed and enabled"; that is a requirement of the PHP runtime, not a field. The README says the package ships a coding-agent skill under skills/mongodb-odm; that is no field. The stable docs list an ORM integration ("Create relations between your Doctrine ORM entities and ODM documents"), which is recorded as no basedOn because the wording names no parent. firstRelease is 2012 from the oldest Packagist upload (1.0.0-BETA4, 2012-08-07). The Packagist monthly figure on 2026-11-04 was 497804, not recorded because the field keeps the total. The maintainer is the Doctrine Project as the LICENSE copyright line names it; no legal entity was found on the project site. The stable docs URL is the README link; the stable introduction is the page the quotes come from. Doctrine's own Doctrine ORM is a separate record.
