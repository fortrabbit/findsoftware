notes: >
  Scope and version calls for the reviewer: the GitHub releases list includes v2.0.0-nightly-20250827162746 marked as not a prerelease; it carries a prerelease suffix, so currentMajor is 1 from v1.7.11 (the registry's latest is 1.7.11 too). The release list stops at 2025-08-04; the repository is pushed to in 2026, so the record is active, and the nightly builds are the project's own published channel, noted on the docs site ("Farm will continue to release nightly versions"). The project calls itself "Vite-compatible" in its repository description; no basedOn is recorded because Farm is not built on Vite on the project's pages. The homepage shows two X links, to x.com/brightwwu46799 and x.com/FarmFe71928, and their owners are not stated; neither is recorded. The maintainer is the GitHub organization because the LICENSE names it and no page gives a company or person. The npm author field names an individual, which is not used. The npm figure is for @farmfe/core, the core package the quick-start installs through create-farm (create-farm itself has no download figure here). The CSV's npm figure (4.2k/wk) is not the core package and was not used. The docs link https://www.farmfe.org/docs/quick-start is the docs entry used for the install and build statements; the getting-started URL returns 404.
