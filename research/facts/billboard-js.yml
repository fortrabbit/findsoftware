notes: >
  The maintainer is NAVER Corp. from the LICENSE copyright line; the navercorp.com page read names the company without a country or address, so hqCountry is not recorded. The homepage shows an older version number than the GitHub release; the release date and major come from the releases API. The homepage's "built on D3 v4+" is the source for basedOn d3, and D3 has a record. runsAs is left out: the README lists browser support, not a process model. The wiki comparison table, linked from the README as "Comparison table with other libraries", sets billboard.js beside Chart.js, Apache ECharts, Recharts, plotly.js and Frappe Charts (2024) and beside Chart.js, Highcharts, C3.js, nvd3, Chartist, ECharts, plotly.js, Britecharts and TauCharts (2017); the ones with a record are alternativeTo. The wiki migration guide from C3.js says every interface is identical to C3.js apart from the namespace and a few option names. A React component ships in the package under billboard.js/react. A wiki page generates chart images in Node.js through Puppeteer, a headless browser, so no Node runtime is recorded. The homepage has no social or community links. The npm figure counts all published versions of billboard.js; the registry latest tag is the current release. Preview releases (4.1.0-next) are not used. Stars and contributors belong to the repository, which is a single package.
