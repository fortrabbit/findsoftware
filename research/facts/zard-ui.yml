notes: >
  Monorepo: the install docs name zard-cli (npx zard-cli@latest init), so its npm package zard-cli is the registry figure, not @ngzard/ui. The CSV's npm figure and its "npm latest deprecated" note belong to @ngzard/ui: its latest version 1.0.0-beta.31 carries the npm deprecation "Package no longer supported. Contact Support at https://www.npmjs.com/support for more info." The deprecation names no successor; zard-cli was first published 2025-12-21, four days after the last @ngzard/ui release, and the docs and CLI README name zard-cli for the same project. The deprecated @ngzard/ui and the zard-cli of the same project are a move, not an end, so the record stays accepted. The repository has 100 GitHub releases, all listed; the highest stable tag is v1.1.1 (2026-10-22) and the oldest is 2025-10-17 (1.0.0-beta.21, a prerelease). Tags with beta in the name are skipped even when GitHub marks them as non-prerelease. The CLI README says the source lands in the user's codebase, the registry model that criterion 2 counts. The LICENSE copyright line reads "Copyright (c) 2025 Zard"; the zard-cli package author is "ZardUI Team", which is recorded nowhere as maintainer. The site's about page names the project "an open-source Angular component library built with TailwindCSS, inspired by shadcn/ui"; the shadcn inspiration is not a parent. The site's footer says "Made with ❤ in Brazil", which is not a company headquarters, so hqCountry is unknown. The pages /about, /terms, /privacy and /contact return the same JavaScript shell without the text, so no legal name or imprint was read. The about page sponsors section is GitHub Sponsors, not a paid edition. The WhatsApp group in the README is no starter-list field. The version support page states the policy "Zard UI maintains backward compatibility with Angular 20 and above". The about page credits Shadcn/ui ("The design philosophy and component patterns that inspired ZardUI's architecture and aesthetic") and Ng-zorro ("An enterprise-class Angular UI library that inspired ZardUI"); both are inspirations, not a basedOn.
