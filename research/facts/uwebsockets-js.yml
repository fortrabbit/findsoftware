notes: >
  Boundary ruling for this wave: a web server for Node.js back-ends is server software under criterion 1, and the install route is the GitHub repository, so it is accepted on criterion 2 as a distributable. The README names no runtime other than Node.js, so runtime is node with no runsAs quote except the "standards-compliant web server" sentence, which states the server process model; a reviewer may decide whether that sentence is enough for always-on. The repository has no homepage of its own and the GitHub Pages root answers 404, so no homepage is recorded. The package is not on the npm registry: the README says so and installs it with the npm client from GitHub, which is why there is no npmName and no npm figure. Release binaries are distributed on GitHub, per the candidate note. The package.json at the latest tag v20.71.0 has no engines field, so runtimeMin is absent. The major version 20 is the numbering the project uses for the line since 2021 (v20.0.0), read as the major. The README opens its licensing section with "Intellectual property, all rights reserved.", a reservation of rights over intellectual property in general, and licenses source code that carries an explicit notice under Apache-2.0; only the Apache-2.0 statement is a license of the code and is recorded as the license. The maintainer is the GitHub organization profile name, uNetworking AB; the org location names a region, not a country, so hqCountry is absent. The README mentions a fork of µWS carried by Bun; that is not this project and is not recorded as forkOf. Stars and contributors belong to the repository.
