notes: >
  The npm package the start page names is vanjs-core, which is the one the figures come from; the npm package "van" (0.0.4, a different project by Michael Bleigh) is not used. The GitHub releases start with 0.11.9 (2023-05-22), older than the first npm upload of vanjs-core (2023-07-27), so firstRelease 2023 comes from the GitHub release. The highest stable GitHub release is 1.6.1 (2026-07-16), the same as the npm latest tag; the repository has no prerelease. The about page says the copyright belongs to the creator, Tao Xin, because Google waived its claim on work done during his employment there; Google is not recorded as parent or maintainer. The about page states the MIT license; the repository API reads MIT. The X and LinkedIn links are the creator's personal accounts named as "Contact us" on the homepage; x is not recorded because the account is the creator's personal one. The runsAs browser value comes from the homepage sentence that any VanJS code "can be pasted and executed directly in your browser's developer console"; the start page's CDN and download routes load the script in pages, and the README does not state a Node requirement for running VanJS, so no runtime is recorded. The README names Mini-Van and Hydration for server-side rendering, a compatibility statement that is not recorded as renderingModes. The README describes state as values that bind to the DOM and components as plain functions. The homepage calls VanJS a reactive UI framework; the CSV row lists ui-library, and the category map has no framework value for it, so ui-library is kept. HTTP Archive has no VanJS entry, so httpArchiveSites is not recorded. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header (page 23); the README's all-contributors list reads 69 and is not used.
