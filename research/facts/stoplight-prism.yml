notes: >
  Name: the homepage and README call the product "Prism"; the CSV's "Prism (Stoplight)" is a discovery label. The id stoplight-prism keeps it apart from other projects named Prism. Maintainer: the LICENSE reads "Copyright 2019 Stoplight Inc" (no comma), while the Elements LICENSE reads "Stoplight, Inc."; each record keeps its own LICENSE wording. Parent is SmartBear, from the about page. No hqCountry: the subscription terms (about Stoplight, Inc.) name the laws of the State of Texas, U.S.A. as governing law, which is not a headquarters statement. The docs site (docs.stoplight.io/docs/prism) returns a JavaScript shell with no text, so the docs fact cites the repository's installation page; the GitHub docs folder is a primary source for the same product. Runtime: the README install section says "Prism requires NodeJS >= 18.20.1" and describes Open Source Prism 3.x as the current version, which is out of date; the latest release (5.16.0) has engines node >=24.18.0 in packages/cli/package.json, and the manifest at the latest tag governs runtime and runtimeMin, so the README sentence is not used. runsAs has two values: local, from the README's "Run it locally" for mock servers on a developer's machine, and always-on, from the README's "an open-source HTTP server run from the command-line" (a server process); the CLI page also says that the CLI may be used in production in a Docker container, which is a server process statement. Install routes: npm (README), the standalone binaries (installation page), and the Docker image (installation page). The installation page gives a shell script (curl to raw.githack.com, piped to sh) as the quickest way to install the standalone binaries; it is recorded as its own route, install script. The Docker image stoplight/prism is the one the installation page names; its tag examples use major 4, while the release line is 5, and the pull count is Docker Hub's total. The hosted mock servers (Stoplight Platform, Stoplight Studio) are a vendor cloud of the same code, recorded as hostedOffering. The forum fact stands without a quote as a link fact, from the README's Community link. The x and facebook links come from the footer of the product page; The LinkedIn footer link is not recorded (linkedin is a coined field). The README says the mock server answers from the API description, that the validation proxy checks traffic against it, and that Prism uses localhost by default, so a mock server in Docker is reachable outside the container only with -h 0.0.0.0 (FAQ). The CLI page says that with -m, or with NODE_ENV set to production, the HTTP server and the CLI's log printing run in two processes, for use in production such as a Docker container. Criterion 1: Prism is a development and testing tool for the API a web app calls, accepted as a build or dev tool; the README's local use is the developer's machine, and the live site does not need it.
