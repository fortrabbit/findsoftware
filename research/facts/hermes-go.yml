notes: >
  Status accepted: the repository is public, not archived, and its README documents go get (criterion 3); the last release v1.3.0 is dated 2025-04-04 and the last push 2025-04-04. The repository has no homepage of its own (the GitHub homepage field is empty), so the record is repo-only. The README calls Hermes "the Go port of the great mailgen engine for Node.js" and links mailgen; "port" is not stated as fork or based on, so no forkOf or basedOn is recorded, and mailgen is not a record. currentMajor is 2 by the rule (highest stable tag v2.1.0, 2020-01-29), but the README says the v2 tags use the import path github.com/matcornic/hermes/v2 and that v1.3.0 moved the module back to github.com/matcornic/hermes, with v1.3.0 the install line; v2.1.0 is a GitHub release object, so 2 stands, and the README's install line for v1.3.0 is noted here. runtimeMin is from the go line of go.mod at the v1.3.0 tag. The LICENSE copyright line names Hermes - Mathieu Cornic; the README license section says Apache 2.0. The README bundles two themes, default and flat, both adapted from Postmark templates, and says theme templates are embedded in the application binary; a theme implements the hermes.Theme interface to use external templates. CSS inlining since v2.1.0 uses Premailer, and Markdown content is rendered with Blackfriday; both are named in the README and not recorded as fields. The README's RTL support section and its language customizations section (custom greeting and signature strings) are the i18n entries. The Gitter link appears only inside an example sentence, not as the project's own chat, and is not recorded. No registry is named for Go modules, so no download figure is recorded. The README says CSS inlining is automatic since v2.1.0 through Premailer and can be turned off with DisableCSSInlining; a v2 release line exists and the README asks users to move back to the v1 import path.
