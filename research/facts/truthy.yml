notes: >
  Accepted; the import will move this record to stub on its own, since its latest release (0.3.3, 2022-08-01) is more than four years old and the repository has no pre-release. The repository has no homepage, and the README links a live deployment by IP address, which is not recorded. The README describes Redis as the key-value store for queues and throttling, which is not a content database, so it is not in databases. The API is REST with Swagger docs (the @nestjs/swagger dependency); no GraphQL dependency is listed. Authentication is JWT and passport, with two-factor sign-in by time-based codes, which is not a single sign-on protocol, so sso is left out. The README says the frontend is in a separate repository, gobeam/truthy-react-frontend. The LICENSE file names only the copyright year, so the maintainer comes from the README. The repository holds a single package, and the install command npx truthy-api names the npm package truthy-api, version 0.3.3, which matches the GitHub release. The npm package was created on 2022-01-17, the same day as the first GitHub tag 0.1.0, so firstRelease is 2022. The README names the Docker Compose setup, which starts PostgreSQL, Redis and the API as three containers. The README says the Swagger docs are only available in development mode, and it names role-based access control (RBAC) support alongside role and permission management. The README lists the modules as authentication, user management, role and permission management, email, account settings, one-time passwords, throttling, RBAC and localization.
