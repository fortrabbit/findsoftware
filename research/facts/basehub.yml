notes: >
  Hosted headless CMS. The SDK repository basehub-ai/basehub (MIT, described as "SDK for BaseHub") and the npm package basehub are SDK sources and go here only. Acquisition: the blog post "BaseHub Is Joining Vercel" (2026-06-02, read at https://basehub.com/blog/basehub-is-joining-vercel) says BaseHub is joining Vercel, that "For BaseHub customers, nothing changes for now", that "BaseHub will continue to work as it does today" and that Vercel is not planning to enter the CMS space; no end statement, so the status stays hosted-service, with Vercel recorded as parent from the post title. Maintainer doubt: the terms name the contracting party as "BaseHub AS" outside the United States and "BaseHub" inside it; the privacy policy (https://basehub.com/privacy) says it "pertains to BaseHub Corp."; the maintainer field follows the terms. No address or country is stated, so hqCountry is absent. Planned, not shipped: the December 2025 post "Files, Agents, and the Future of BaseHub" describes a file-based re-architecture and an open-source BaseHub Core; it is no fact of the shipping product. Free plan "Personal" and the Team and Unlimited plans with per-user and monthly prices appear on the pricing page; no prices recorded. The API reference page names the GraphQL API only; no REST wording was found. Webhooks (workflow block), forms, analytics, search and MCP server pages exist in the docs; they are coined kinds and stay in notes. Role names come from the members page; the pricing page lists "View Only Mode" and "Teams" as features. The help center offers "Members management" and "Edit mode"; edit mode hides block properties for content work.
