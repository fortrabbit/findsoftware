notes: >
  The site answers 200 with a WebAssembly loader and no page text, so the homepage is the repository's homepage field and the site is listed as unreadable; the README names it as the documentation. The README's install path is the thaw-template repository, a cargo-generate template; the installation page in the repository's demo_markdown folder gives the cargo add route for an existing project, and each is its own installMethod entry. The installation page says Thaw supports CSR and SSR and not islands; that is compatibility, so renderingModes is left out. The crate is on crates.io (name thaw, crateDownloads from the crates.io API). The maintainer is the copyright holder named in LICENSE, a handle; the repository owner is the thaw-ui organization. The README names Fluent Design as the design language, which is not a parent software, so only Leptos is basedOn. The Leptos compatibility table in the README names Leptos 0.6 to 0.8 for the crate lines and is not recorded. The Cargo.toml license is MIT, the same license as LICENSE. The latest GitHub release 0.5.0-beta is older than v0.4.8 in date (2025-05-03), so no latestPrereleaseDate; the newest crates.io version is 0.5.0-beta, a prerelease. The Discord link is on the README. The thaw template's own README is not a record; its components are the thaw crate.
