notes: >
  Operating systems: the docs say "Laravel Sail is supported on macOS, Linux, and Windows" (Windows through WSL2). Default branch is 1.x; latest stable release v1.69.0 is 2026-10-13, the first Packagist upload (v0.0.1) is 2020-12-04. The Composer package requires php "^8.0" at v1.69.0, which is the installer's requirement; the README says no software besides Docker is needed on the local computer, so runtime and runtimeMin are not recorded. The databases field lists the MySQL and MongoDB service containers the docs describe; Redis and Valkey have no vocabulary value. Sail is derived from Vessel by Chris Fidao, per the README; Vessel has no record. The language is Shell per the GitHub API, and the Composer package ships the PHP and sail script. Dependency counts come from ecosyste.ms for the Packagist package laravel/sail.
