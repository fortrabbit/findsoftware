notes: >
  The npm figure is the autoprefixer package, which the README's install commands name; npmWeeklyDownloads is the sum of the daily downloads from 2026-09-28 to 2026-10-04, the window the build-dev rules name. The README calls Autoprefixer a PostCSS plugin and its parent project is PostCSS (postcss/postcss); there is no postcss record, so basedOn is absent and the parent is named here. The README says "Autoprefixer is built by Evil Martians", a US design and engineering consultancy; the LICENSE copyright names Andrey Sitnik, which is the record's maintainer, and the reviewer should decide whether the consultancy is the maintainer instead. The demo at autoprefixer.github.io is the project's own GitHub Pages site and is named by the README as its interactive demo. The GitHub releases list starts with 0.6 (2013-07-16), which sets firstRelease. The category is build-tool because css-processor maps to css-framework in the import, which does not fit a PostCSS plugin. The Node engines field in 10.6.2 allows Node 10 and later; the dependency of the same package on PostCSS is a package dependency, not a basedOn statement. The package is also shipped as a standalone browser build, which the README mentions as an alternative to Node; no separate runtime is recorded for it. The hqCountry of the maintainer is not stated on any page read. The README usage sections cover Gulp, Webpack through postcss-loader, CSS-in-JS, the postcss-cli command line and other build tools, and say that text editor plugins are a fallback for projects that cannot use a build tool.
