notes: >
  GitHub reports the license as NOASSERTION. The monorepo license file says content outside the ee/ and webapp/src/ee directories is Apache-2.0, and ee/LICENSE covers those directories for non-commercial use only, bars hosting them as a managed service and bars removing the license-key functionality. Both license entries stand. OpenID Connect SSO is documented on the SSO getting-started page as a licensed feature ("If you use the self-hosted version, you must set up the license and then follow the sso server setup guide to use this feature"). OpenID Connect SSO is an Enterprise plan feature; a self-hosted instance needs a license key for it (SSO getting-started page), recorded under sso as oidc.  Granular permissions are licensed; the userRoles fact covers the permission levels of the members page. The pricing page sells a self-hosted On-Premises plan with prices; no prices are recorded. The free self-hosted version includes core localization features and up to 10 seats (getting-started page). The server is a Java application started with java -jar; the repository language field reads TypeScript and the README badge names Kotlin, so language records the GitHub value. The bundled PostgreSQL in the Docker image is for testing (the Docker page warns against keeping data in it) and v4 removes it; the record keeps postgresql as the store the docs name. The Docker image tolgee/tolgee is named by the install docs; the npm packages @tolgee/core and the JavaScript SDK are client SDKs and their downloads are not recorded. The Docker Hub figure is pull_count from the Docker Hub API. The homepage links LinkedIn (https://www.linkedin.com/company/tolgee), not a field here. The LDAP settings on the configuration page are marked removed in 3.31.0, so no ldap value. The OAuth 2.1 authorization server of the sign-in-for-apps page lets other apps sign users in through Tolgee and is no sign-in method for Tolgee itself. The Slack invite (tolg.ee/slack) is in the homepage and README and no social field holds it. The maintainer's registered office is Brno, Czech Republic (terms section 2.1, the Czech company register entry is named there too). The About page names funding from the Czech Ministry of Industry and Trade and CzechInvest; no field records it. The README names an MCP server for AI coding assistants that manage translations (DEVELOPMENT.md) and in-context editing, where a developer holds Alt or Option and clicks an element to edit its translation in the running app. The Docker page says the bundled PostgreSQL is the default and can be replaced with an external PostgreSQL 17 container in the same Compose file. The ee/ directory is the Tolgee EE License: it allows non-commercial use, bars offering the software as a hosted or managed service, and bars changes to the license-key functionality.
