notes: >
  Maintainer: the LICENSE.md copyright lines name Pine View Software AS for 2014-2021 and BrowserStack Limited for 2022; the current maintainer is BrowserStack Limited, which the homepage says maintains the project since 2021. hqCountry is not recorded: the only address found is the EU representative address in the BrowserStack privacy notice, which is no headquarters. Runtime: the README names Node.js and the package.json engines field at v3.16.0 requires node >= 18.20.5, which sets runtimeMin 18; the quick start page instead says Nightwatch supports all Node versions above V14.20, the manifest at the latest release tag decides. runsAs local is taken from the quick start page, which says the tests can run on the developer's machine or on a cloud machine; the cloud grids it names (BrowserStack, Sauce Labs) are third-party services, not Nightwatch hosting. The npm install route is npm init nightwatch, which runs the create-nightwatch scaffolder; npm figures are for the nightwatch package the scaffolder installs. The homepage counts "141K" used by repos and "over 100k repositories": repository counts, not installs, so reportedInstalls is not recorded. Stars and contributors belong to the single nightwatch repository. The discussions link is the project's own GitHub discussions, recorded as forum. The Protractor migration guide installs Nightwatch into an Angular project with the Angular schematic (ng add @nightwatch/schematics), a second install route beside npm init; protractor has a discontinued row in the dev-libs candidates. The package is MIT per the LICENSE and the npm latest version.
