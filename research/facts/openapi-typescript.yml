notes: >
  The repository is a monorepo: the root README lists the openapi-typescript package and the openapi-fetch package, which ships separately. Stars, contributors and the release history cover both; the npm figures and firstRelease from the oldest GitHub release (v0.1.0, 2018-12-13) follow the openapi-typescript package. The introduction page says the library "requires the latest version of Node.js installed (20.x or higher recommended)", a recommendation, so runtimeMin is not recorded; the package manifest at the release tag declares no engines field. The introduction says the library loads schemas "from YAML or JSON, locally or remotely", and its examples import the generated types for paths, parameters and responses. The homepage says the static TypeScript types "provide zero runtime cost and zero client weight", and the introduction page lists OpenAPI 3.0 and 3.1 support with OpenAPI 2.x only through versions 5.x and earlier; both are spec compliance and go to notes, not fields. The homepage and introduction carry no social or community links. The npm figure for the period 2026-11-01 to 2026-11-07 is the sum of daily downloads from the range endpoint. The GitHub release tags for this package are named openapi-typescript@<version>, and the repository's tags also cover other packages.
