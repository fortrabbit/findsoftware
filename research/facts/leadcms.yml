notes: |
  No GitHub release is stable: all 62 releases are marked prerelease, the oldest v0.0.1 (2022-11-09) and the newest v1.2.38-pre (2025-02-03), so currentMajor is unknown, and no stable NuGet version was found (the NuGet LeadCMS package's highest version is 1.5.17-pre). The repository's tags run past the release list (to v1.5.155-pre), and its release objects stop at 2025-02-03; latestPrereleaseDate is the NuGet publish date of 1.5.17-pre (2026-05-13), the newest build the registry lists. The repository was renamed: the release notes link onlinesales.core and the README overview still says "OnlineSale", so the old name is in the source and not used as a name. The homepage lists where to deploy (a private cloud, on-premises or a managed host) and names no service run by LeadCMS; no prices are recorded. The terms state the MIT license for the platform and say professional services fall under separate agreements. The ops deployment page calls its Docker Compose file a sample for evaluation, development, or a starting point for a production setup. The default plugins include an Azure AD plugin, but no page read says what SSO it provides, so sso is unknown. The only roles evidence is the backup page, which names users, roles and permissions tables, so userRoles is narrowed to that. The README describes a plugin model: a plugin is connected to the core project through a common interface called IPlugin. The CRM part is noted here and not as a category, since the dictionary has no CRM value. The static export guide is about the frontend site built from LeadCMS content, so no rendering mode is recorded for LeadCMS itself. Maintainer is the name the copyright line states; no legal entity name is given on the pages read, and the terms are governed by the laws of California, which is not recorded as hqCountry because it is a jurisdiction, not a company address.
