notes: >
  The GitHub releases run from 0.10.0 (2013-10-17) to 7.11.1 (2020-11-17), so GitHub gives major 7 and the last release in 2020; the Hex package n2o has stable versions to 13.4.15 (2026-04-14), a higher major, so currentMajor and latestReleaseDate come from Hex. The homepage's version line reads "VER 8.11" and matches neither source; it is not recorded. The license is stated two ways: the README and homepage say ISC, and the LICENSE file is the DHARMA License (GitHub reports NOASSERTION); both are recorded as their own entries. The maintainer is the copyright holder in LICENSE (Synrc Research); the author 5HT is the footer name on ws.n2o.dev and the GitHub account 5HT, not recorded as maintainer. The homepage is n2o.dev, the top page of the N2O family documentation; ws.n2o.dev holds the N2O library manual and is the docs link. The databases are the storage backends of KVS, the database layer listed among the protocol extensions in the README, not of the core loop. No page states how the library runs on a host, so runsAs is left out. The README names REST, KVS and BPE as separate libraries of the family; they are not recorded here. Contributor count is the page number of the last contributors page with per_page=1.
