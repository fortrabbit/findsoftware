notes: >
  The homepage was given as http://paperjs.org in the discovery row; that address redirects to https://paperjs.org/, and the https address is recorded. The license is MIT in both LICENSE.txt and the README ("Distributed under the MIT license"). The LICENSE copyright line names two holders, Jürg Lehni and Jonathan Puckey, and the GitHub repository description credits them as "@lehni & @puckey"; the maintainer field keeps both. The GitHub description calls the project "Scriptographer ported to JavaScript", naming an earlier product by the same author group; no page states a successor or fork relationship, so no successorOf or forkOf is recorded. The README says the main paper package can be used directly in a browser context, and it describes PaperScript support in the full build (paper-full.js), a script mode of the same library, not a separate record. The runtimeMin 8 comes from the engines field of the v0.17.0 package.json. The GitHub latest-release list includes tags on the 0.12 line published 2026-10-18; the highest stable release is 0.17.0 (2026-11-03). The npm package paper is the one the install docs name; paper-jsdom and paper-jsdom-canvas are separate npm packages for Node.js and are not counted. The forum is the project's own Google group named in the README; the README also links a Stack Overflow tag, which is not recorded as a forum.
