notes: >
  The install page on the homepage shows unpkg and npm; the GitHub release list is the source for currentMajor and latestReleaseDate. The npm registry holds version 0.21.1, published on the same day as GitHub release v0.21.0 (2025-07-27), so the date is shared. The npm figure is the sum of the daily counts from the npm downloads range endpoint for 2026-10-18 to 2026-10-24. The language is CSS: the package ships dist CSS, although the repository's primary language is SCSS. The npm first version (0.1.0, 2020-12-31) is older than the first GitHub release (v0.4.1, 2021-07-03), so firstRelease is 2020 from the registry. The HTTP Archive technologies list (cdn.httparchive.org/v1/technologies) does not carry this project, so httpArchiveSites is not recorded. The project's README describes XP.css as the base, and XP.css is recorded as basedOn by the project's own words.
