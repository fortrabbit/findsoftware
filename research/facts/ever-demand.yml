notes: >
  Stub candidate under the import rule: the newest release is the pre-release v0.3.0-alpha.3 (2020-10-27) and no stable release exists, so the import will move the record to stub on its own after four years; the status is left at accepted here. All 11 GitHub releases are alphas, so firstRelease is the date of the first alpha (2019) and currentMajor and latestReleaseDate are not recorded. The README warns that the platform is in alpha and that the develop branch may be unstable; it also says the demos are not available. User roles and permissions are listed under Planned Features, so userRoles is not recorded. The README names Ionic and Angular for the mobile and web apps and Nest for the backend; React Native (Expo) and Flutter apps are marked WIP, and no per-app facts are recorded. The README names Stripe as the only payment gateway, and tax calculation and third-party shipping integrations are planned; these stay in notes. The repository is a Lerna monorepo; the one npm name checked, @ever-co/ever-demand, is not on the registry, and no other registry figure is recorded. LICENSES.md names the Community Edition (AGPL-3.0, with GPL-3.0 and MIT parts) as the default and says commercial Small Business and Enterprise licenses exist under a separate written agreement; the import derives licenseModel from those statements, and no feature difference between the editions is stated on the pages read. The homepage's Cloud Commerce is a hosted offer of the same group; no prices are recorded. The maintainer is Ever Co. LTD., the copyright holder in the README, LICENSES.md and the site footer. The privacy notice says Ever Co. LTD is registered in Israel and owns the software's intellectual property, and that Ever Technologies LTD, registered in Bulgaria, operates the Ever Demand service under licence from it; the Bulgarian company is not recorded as maintainer. The README's Spectrum, Gitter, Slack, Telegram and Codementor links have no fields and are left out, and so is the Facebook link.
