notes: >
  Core module is github.com/go-kratos/kratos/v3; the CLI and each contrib integration (JWT, OpenTelemetry, Consul, Sentry and others) are separate Go modules with their own versions, per the docs landing page. The integrations page says "Kratos has no runtime plugin loader", so there is no plugin directory; extensions are Go modules wired in at compile time. The project template (kratos-layout) uses MySQL, Ent and Wire, and the docs state "Kratos itself does not require Wire, Ent, MySQL, or that exact package layout", so databases are not recorded for the framework. The homepage header links an external "Blades" product (Blades Agent), a separate project not recorded here. The homepage links GitHub, Discord, the blog RSS and a Chinese-language site; only Discord and GitHub are facts. Major v2 (2022 to 2025 releases) is the prior line; the migration guide is at go-kratos.dev/docs/migration/v3-new-features/. The first GitHub release, v0.1.0, is dated 2019-06-11 and gives firstRelease 2019.
