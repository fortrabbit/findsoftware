notes: >
  The homepage, the download page and the docs index and usage pages are read; the docs install URL returns a redirect and was not used. Michael Bayer is named as the author in pyproject.toml at rel_1_4_3 and as the copyright holder of the website content on makotemplates.org; the LICENSE copyright line names the Mako authors and contributors, so that is the recorded maintainer and Michael Bayer is not recorded. The homepage calls Mako an embedded Python (Python Server Page) language, and says its syntax and API borrow from Django templates, Cheetah, Myghty and Genshi; the borrowing is no basedOn or alternativeTo statement. The Jinja switching page (research/facts/jinja.yml, alternativeTo mako-templates) names Mako; Mako's own pages name no alternative. The PyPI info license field is null; the MIT license comes from the GitHub license API and the LICENSE file. The repository's oldest release tag is rel_0_1_0, but the PyPI upload history starts with version 0.1.0 on 2006-12-31, which is older than any GitHub tag, so firstRelease is taken from PyPI. The PyPI figure is pypistats last_week; the value is a rolling window, not a fixed week. The community page sends development to GitHub under the SQLAlchemy organization and security reports to Tidelift. The CSV row listed 461 stars and 48.6M per week; both are older reads. The mako.yml record is a different project (a Rust-based bundler on npm) and is not used here. The homepage says Mako uses a non-XML syntax that compiles into Python modules. The docs index lists inheritance with blocks and defs, namespaces, the Mako runtime, caching and the framework integrations WSGI, Pygments and Babel; the usage page is the cited page for those integrations. The community page names GitHub under the SQLAlchemy organization as the place for issues and pull requests.
