notes: >
  The docs at pocket-id.org are the stable docs: the page's "unreleased version" notice is hidden on the production host. The README links docs.pocket-id.org; that host was not read. Community installation methods on the install page, maintained by the community and not recorded as installMethod: Podman Quadlet, a Proxmox helper script, two Helm charts and a Kubernetes operator, Unraid, NixOS and Homebrew. The LICENSE file grants BSD 2-Clause to the whole repository, and the copyright year is 2024 with the holder named as the author. The README names Keycloak and ORY Hydra as other self-hosted OIDC and OAuth 2.0 providers and calls them too complex for simple cases. alternativeTo records the two names from that sentence; the judgement wording stays out of the prose. The homepage also names LDAP sync and SCIM provisioning, recorded under sso as ldap and scim (docs pages "LDAP" and "SCIM provisioning"). The sso entries hold OIDC and OAuth 2.0 (served to apps), LDAP (user and group sync, read only: 'Pocket ID doesn't serve LDAP to other apps') and SCIM (pushed to apps). The demo runs at demo.pocket-id.org, named in the README. firstRelease is 2024 from the oldest tag, v0.1.0, committed 2024-08-12. currentMajor is 2 from the highest stable release v2.19.2. The install docs name ghcr.io/pocket-id/pocket-id and pocketid/pocket-id on Docker Hub; no pull figure recorded.
  The README says the project "only supports passkey authentication", and the sign-in docs say an admin "can create a login code that signs a user in once, to add a first passkey or to get back in after losing all of them." Browsers allow passkeys only on HTTPS pages, or on localhost while trying it out; the Docker setup keeps its database and uploads in ./data. The install page says "HTTPS is required" for passkeys, that "Pocket ID is a single program with a built-in SQLite database", and that it "keeps its data in a data directory next to it."
