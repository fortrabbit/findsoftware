notes: >
  The repository has no project site: GitHub's homepage field is empty and the README links only the repository and its tests, so homepage and docs are absent and the README is the documentation. The LICENSE copyright line names Barry vd. Heuvel; the README badge "Powered By Fruitcake" links to fruitcake.nl, a company whose legal name and country are not read here, so it is not recorded as maintainer or parent. The README's TODO section says "This package is still very alpha". That is the maintainer's own status statement and no end signal, so the status stays accepted; a reviewer may want the sentence in view. The README says the package imports the PHP and JSON translation files into a database, finds translation keys in php and twig sources, exports them back, and offers artisan commands for import, find, export, clean and reset; the database engine is not named, so databases is absent; the contentStore value rests on the workflow line saying all translation files are saved in the database. The license entry is GitHub's detection of the LICENSE text, which carries no title line. The web interface lives inside the Laravel app under a configured route with middleware, and the README asks for the views to be published, so adminUi is yes. The Laravel 5.2 session note is a historical middleware instruction, not a requirement. The alternative Google Translate integration is a third-party package (tanmuhittin/laravel-google-translate) the README suggests installing; it is not recorded. The composer.json at tag v0.6.9 requires php ^8.1 and illuminate/support and illuminate/translation for Laravel 9 through 13, and its extra laravel block marks it as a Laravel package. The README says the package "does not replace the Translation system" and that the export step overwrites the translation files and removes their comments, so a backup comes first; it also says missing translations can be recorded by swapping in a custom translator while the application runs, for development only. The 0.x line is the only line, so currentMajor is 0; the tags run v0.1.0 (2014-06-01) to v0.6.9. The first Packagist upload is also 2014-06-01. Stars and contributors are the repository's.
