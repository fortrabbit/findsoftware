notes: >
  No homepage: the project has no website of its own, only the GitHub repository and its README, so the repository is the only project URL. The repository has no GitHub releases; the GitHub tags frontend-plugins-x.y.z are the release markers, and the newest is frontend-plugins-2.0.2 (2026-07-28). The stable line is 2.0.2 on Maven Central, which sets currentMajor 2 under the registry fallback. The master pom is at 2.0.3-SNAPSHOT and is not a release. The latestReleaseDate is the lastUpdated stamp of the Maven Central maven-metadata.xml (20260728184320), the registry's date for the latest version. The first Maven Central upload is 0.0.3 (2013-09-20), the repository was created 2013-08-30. The README says Windows, OS X and Linux, and that the plugin supports Maven 3.6 with Java 17 and Maven 4. Node and npm are downloaded from nodejs.org and not installed globally; the plugin does not support an already installed Node. The Maven Central maven-metadata lists versions 0.0.3 to 2.0.2; the solr index lists only up to 1.15.1, so the upload dates of the 2.x versions come from the metadata file, not from search. Maven publishes no download figure, so none is recorded. The README names Bower, Grunt, Gulp, Jspm, Karma and Webpack as tools the plugin runs; these are not basedOn statements, since the plugin runs them and does not build on them.
