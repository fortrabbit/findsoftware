notes: >
  No project website: the gem's homepage_uri and the README point to the GitHub repository, so no homepage is recorded. The repository has tags v0.1.0 to v0.32.0 but no GitHub releases, so currentMajor and latestReleaseDate come from the RubyGems stable version 0.32.0 (2026-05-27, not a prerelease); major 0 means the project has not reached 1.0. The README says "Based on ImageOptim.app": that is inspiration from a macOS application, not a parent the gem extends, so basedOn stays empty; the gem can run the ImageOptim.app binaries when they are on PATH. The external tools the gem runs are not parts of this project: advpng, gifsicle, jhead, jpeg-recompress, jpegoptim, jpegtran, optipng, oxipng, pngcrush, pngout, pngquant and svgo. The README points to image_optim_pack, a separate gem that installs most of these binaries, and to image_optim_rails, a separate gem for Rails asset optimization; neither is recorded. Docker image ghcr.io/toy/image_optim is built from the image_optim_pack repository, per the README. The LICENSE.txt copyright line reads 2012-2026 Ivan Kuchin; the repository owner is the GitHub user toy, and the maintainer name is taken from the copyright line. The RubyGems required_ruby_version of 1.9.3 is the minimum the gemspec states; the gem's stated runtime is Ruby. 