notes: >
  Current major is v2 (highest stable release v2.10.3, 2026-08-26); the first GitHub release listed is v2.0.0-rc2 (2022-01-24), the Go module proxy lists v1.0.898 of github.com/gogf/gf on 2018-10-24, so firstRelease is 2018. The English site at goframe.org/en is read as the homepage; the bare goframe.org serves the Chinese page, whose title compares GoFrame to Laravel and Spring Boot; that comparison is not a basedOn statement, and no basedOn is recorded. The README names the gf CLI (go install github.com/gogf/gf/cmd/gf/v2@latest) and scaffolds with gf init. Most pages under goframe.org/en are Chinese-language; databases follow the driver packages listed in the repository, templating the template engine page, and runsAs the standalone deployment page. The ORM page says drivers are installed as separate packages. The English homepage calls the framework enterprise-grade; that is the project's own word and is not recorded as a field. The English homepage links GitHub but no social accounts that were read.
