notes: >
  The maintainer is recorded as Cachix: the cachix.org about page says the team has "shipped open-source developer tools like devenv and secretspec" and the repository owner is the cachix GitHub organization. The company behind the Cachix brand is Enlambda OÜ in the terms page of cachix.org, which covers the Cachix web application; no devenv page names that legal entity, so neither the legal name nor a country is recorded. The getting-started page names Nix as the install base: devenv is installed from nixpkgs with the Nix installer from nixos.org as a prerequisite, and the README names Nix as its basis; Nix has no record, so basedOn stays empty. Supported platforms are stated as "Linux, macOS, x64, and ARM64 (including WSL2)" in the README and as Linux, macOS, Windows (WSL2) and Docker on the install page; no runtime is recorded because the CLI is a native binary the page does not name. Languages (over 50) and services (over 40) are listed on the homepage, not recorded as fields. The cloud offering: the cloud page says "cloud.devenv.sh is in private beta, sign up for early access", and no field exists for a hosted cloud beside the open source tool, so it stays in notes. The highest stable GitHub release is v2.4.0 (2026-09-24); the README's usage banner names version 2.0.0 and is not used. There is no prerelease. The machines page (new in 2.4, marked experimental) says a machine is a NixOS, nix-darwin or home-manager configuration that "devenv machines" installs or deploys over SSH from the developer side, and the containers page builds OCI images from the environment with "devenv container build"; both are CLI actions run from a developer machine, so runsAs stays local and no deployment mode is recorded. The Discord link comes from a README badge and carries no quote; the X link comes from the homepage navigation. The getting-started page says inputs such as nixpkgs and devenv modules are downloaded and pinned in a devenv.lock lockfile.
