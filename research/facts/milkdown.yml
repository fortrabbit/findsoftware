notes: >
  A monorepo (Milkdown/milkdown) of @milkdown/core, @milkdown/kit, @milkdown/crepe and theme and plugin packages. The README's version and download badges name @milkdown/core, so that is the npm figure; the getting-started page also installs @milkdown/kit and @milkdown/crepe, which are the same npm route. Stars and contributors belong to the monorepo. The README and the homepage say the project is built on top of ProseMirror and remark, and the getting-started page names Y.js for collaboration; remark has no fact file yet, so only prosemirror is recorded as basedOn. The homepage says everything in Milkdown is a plugin (syntax, theme, UI) and that the editor comes without CSS; the getting-started page describes @milkdown/crepe as the ready-to-use route and @milkdown/kit as the build-from-scratch route. The homepage describes Milkdown as headless, and the getting-started page says the editor can be themed with packages; that is a rendering choice, not a field. The homepage's Discord and Twitter links sit in its Community footer. The install command and the FAQ are cited from the docs source in the Milkdown/website repository, which the live milkdown.dev pages render from. The FAQ says the editor relies on DOM APIs and cannot run on the server, so it is initialized on the client side. The npm weekly figure is the sum of downloads of @milkdown/core for 2026-11-01 to 2026-11-07. The license is MIT in the LICENSE file and the README. firstRelease is the 2021 year of the first npm upload of @milkdown/core, which precedes the oldest GitHub release of 2021-08-03. No prerelease is newer than the stable release; the npm next tag points at an older 7.1.2 preview.
