notes: >
  The homepage http://editor.md.ipandao.com/ answers only over plain http (its https address does not resolve, 2026-11-08), so it is not linked; the project's own GitHub Pages site, which the README names as its examples and documentation, is the homepage. The Chinese home page at pandao.github.io/editor.md/ is the same project. The npm figure is the editor.md package the README install section names; it counts downloads of that package from 2026-11-01 to 2026-11-07 (npm total 641 for the window). The README names Marked as a dependency in the same "based on" sentence; there is no record for marked yet, so it is not in basedOn. The README lists its dependents (CodeMirror, marked, jQuery, FontAwesome, KaTeX, flowchart.js and others), which are dependencies and not basedOn statements beyond the three named. The LICENSE copyright line names "pandao" and the README says "Copyright (c) 2015-2019 Pandao"; the LICENSE line is the one recorded. The last commit on master is from 2024-04-26 and the latest GitHub release v1.5.0 is from 2015-06-09; the repository is not archived and carries no deprecation statement, so no end signal is recorded. The latest release is older than four years, so the import moves the record to stub under criterion 4; the status stays accepted here as the rule says. The runtime is a browser-side script: the README says "Compatible with all major browsers (IE8+)", a browser support list, so no runsAs or runtime is recorded for the reviewer to decide. The install section has three routes (npm, Bower, zip download); each label names its route and is the quote. The npm weekly figure from the last-week endpoint is stale and is not used.
