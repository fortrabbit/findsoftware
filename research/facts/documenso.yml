notes: >
  Documenso is accepted on criterion 1 through its own pages: the REST API reference and the webhooks guide on docs.documenso.com name an integration surface a site or app uses. The license file is AGPL-3.0 (GitHub API, latest release v2.21.1). The Enterprise Edition is a commercial license, and the Community Edition page says the open version is free; the Enterprise page lists the features packages/ee/ holds (SSO, embed editor white label, 21 CFR Part 11, CSC signing, Stripe billing module, email domains). The Business Edition is the Enterprise Edition without CSC signing; the paid tiers are recorded as paidEdition without prices. The privacy page names Documenso Inc. and copyright 2026 Documenso, Inc.; no postal address or country appears on the terms, privacy or enterprise pages, so hqCountry is unknown. The first release tag is 0.9-developer-preview (prerelease, 2023-03-13); the first stable tag is 0.9 (2023-08-01); both are in 2023 and the repository was created 2023-03-12. The docker image is documenso/documenso on Docker Hub, pulled 916,715 times as of 2026-11-03 per the Hub API; the GHCR image ghcr.io/documenso/documenso is the same project, not counted. The docs say Documenso requires a signing certificate, a .p12 file, which it does not ship; without one, signing fails. The docs state a PostgreSQL 14+ requirement and say MySQL and SQLite are not supported. Background jobs use PostgreSQL by default, with optional BullMQ on Redis or Inngest. Email transports are smtp-auth, smtp-api, resend and mailchannels. Storage can be S3-compatible; the docs name SeaweedFS and RustFS as alternatives to evaluate, not bundled. The README says the project is built on TypeScript, React Router v7, Hono, Prisma, tRPC and Stripe; these are the stack, not a basedOn statement. The README calls Documenso "The Open Source DocuSign Alternative", a name the project uses for itself; the DocuSign record does not exist, so no alternativeTo is set. The homepage says Documenso is open source and shares its code, designs and metrics. The README pauses external pull requests except for trusted contributors; that is stated on GitHub and is not a field. The public API base URL is app.documenso.com/api/v2; the API reference says documents and templates are being replaced by envelopes, which is not recorded as a field. The GitHub repository has 60 releases in total; the contributors count is 180 with anonymous contributors excluded from the count. The rate limit page applies the 1000 requests per minute limit to /api/v1, /api/v2 and /api/v2-beta routes. The docs describe a Documenso demo environment and a team-scoped API, not recorded as fields.
