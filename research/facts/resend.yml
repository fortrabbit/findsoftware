notes: >
  Hosted-service record: the product is offered only as Resend's cloud service. The docs self-hosting address is a 404 page, and no page read gives a self-install guide, so the status stays hosted-service. The SDK repository github.com/resend/resend-node, its license, stars and npm figure (resend, about 8.2 million weekly downloads) belong to the client library and are not recorded as fields; the SDK list on the homepage (Node.js, Ruby, Python, PHP, Go, Rust, Java, Elixir, .NET, plus REST and SMTP) is a coined field, sdkLanguages, and goes here. The homepage's "Open source" mention and the component library react-email are a separate open source project, not this software, so no license or repository is recorded for it. Webhooks, with endpoint limits per plan, are named on the pricing page and the API reference; webhooks is a coined field and goes here. The pricing page names SOC 2 Type II and GDPR compliance, and the security page says Resend is not HIPAA or ISO 27001 compliant; compliance is a coined field and goes here. The legal entity Plus Five Five, Inc. is the operator named on the privacy policy and the data processing addendum; the company name Resend is the product. The data processing addendum gives the San Francisco address for Plus Five Five, Inc. as data importer, and the privacy policy repeats it under Contact Us; hqCountry is taken from that full address. The pricing page has a Free plan with a daily sending limit (freeTier, a coined field). Social links on the homepage are X (x.com/resend) and YouTube; LinkedIn (linkedin.com/company/resend) and GitHub (github.com/resend) are coined or non-recorded fields and go here. The homepage lists REST and SMTP as integration methods; that is recorded in the sdkLanguages note above, not as headlessApi, which is not a content API here. The pricing page lists "API key permissions" but no member role model was found on a page read, so userRoles is not recorded. The docs teams page is a 404 page on the retrieval date.
