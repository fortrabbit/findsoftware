notes: >
  No homepage: the repository and NuGet package name no site beyond GitHub. Carter has GitHub tags but no GitHub releases, so currentMajor and latestReleaseDate come from the NuGet registration for package Carter, whose highest stable version is 10.0.0 (listed, published 2025-11-13). The NuGet download figure is the package total (totalDownloads) at the time of the query, not a period. The README links a Slack community channel and a CI feed on feedz.io; neither is recorded, as no field in the dictionary holds a Slack link. The README states that Carter registers its components with ASP.NET Core dependency injection; no page says how the application is hosted, so runsAs is not recorded. The LICENSE copyright line names Jonathan Channon, and the NuGet package lists the same author.
