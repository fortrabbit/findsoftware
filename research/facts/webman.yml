notes: >
  The CSV homepage is webman.workerman.net, which answers 200 after a redirect to its English documentation; the project's own site, so homepage is the root of that host. The install page is in the English documentation, and the install command installs workerman/webman, the package the docs name, so its Packagist count is recorded. The Packagist p2 entry for workerman/webman shows the stable line through v2.2.3 with PHP >=8.1, and v2.2.3 is also the GitHub latest release, published 2026-02-24. The always-on value comes from the install page's daemon mode, labeled for production; its debug mode is for development and is not recorded as local, since the framework also runs on live hosts. per-request is not stated. The project names Workerman as the server it is built on, so workerman is basedOn. The maintainer is the author named in composer.json; no legal entity is named on the pages read. The GitHub contributors count is the default listing at per_page=1 page count. The repository was pushed on 2026-04-15 and is not archived; the package is not abandoned, so no end signal applies.
