notes: >
  The npm name in the CSV, legend-state, returns 404 from the registry; the package the install page names is @legendapp/state, and the npm figure counts its downloads. The homepage (legendapp.com/open-source/state/) is the project's own page over https; the docs site at www.legendapp.com/open-source/state/ serves the v3 documentation. The README and docs describe v3 APIs (observable, use, observer); the registry's latest stable is 2.1.15 (2024-08-30), with 3.0.0-beta.48 (2026-07-12) on the beta tag and 3.0.0-next.0 (2026-11-16) on the next tag. latestPrereleaseDate is the next tag, the newest prerelease of any kind. The repository has no GitHub release objects, only tags, so the registry's stable version sets currentMajor to 2. The maintainer follows the LICENSE copyright line (Moo.do LLC, 2022); the privacy page at legendapp.com/privacy/ uses the same name, "The company (\"Moo.do LLC\")". The README says the library is "created and maintained by" Jay Meistrich with Legend and Bravely; the personal X account of Jay Meistrich linked from the homepage is not the project's X and is not recorded. No page read gives a country or full address for Moo.do LLC, so hqCountry is absent. The homepage names Legend Kit, a CLI and set of tools with free and premium tools and a subscription; it is a separate product, so paidEdition and pricingPage are not recorded for this library. The README names the sync plugins for Keel, Supabase and TanStack Query, and the homepage adds Firebase, CRUD and fetch, with persistence to LocalStorage, IndexedDB, MMKV and AsyncStorage; these are coined kinds kept here, not fields. The React bindings ship in the same package (@legendapp/state/react), so no framework basedOn is recorded. The homepage benchmark names Jotai, MobX, Recoil, Redux, Zustand and Valtio; a benchmark is not an alternative statement. The README describes observables read with get() and written with set(), observers and computed observables that re-run on change, and sync that applies changes locally first and retries them until they reach the server. The README says the browser and React Native get local persistence plugins; it does not say where the library runs, so runsAs is absent. The Legend homepage at legendapp.com has company social links (Twitter and Facebook, LegendAppHQ); they belong to the company, not the library.
