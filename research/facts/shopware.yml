notes: >
  The GitHub release v6.7.15.1 is dated 2026-10-07; Packagist and endoflife.date give 2026-10-02 for the same version. The Community Edition's Fair Usage Policy requires a paid plan for Shopware Account and Store access above EUR 1 million GMV in 365 days; the software itself stays usable. Shopware Frontends (Nuxt and Vue based) are the official headless storefront toolkit; renderingModes "headless" means the Store API serves a separate frontend. The pluginCount comes from the repository description, not from a count of the store. Founders and foundedYear are coined fields reused from earlier files. Contributors counts GitHub accounts on the repo, anonymous excluded. The installation page labels the shopware-cli path Alpha and links Docker, Devenv and Symfony CLI setups as legacy.
