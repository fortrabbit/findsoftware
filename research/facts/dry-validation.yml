notes: >
  In doubt on criterion 3: no install step is documented. The README has no installation section, and the Hanakai docs for dry-validation (introduction and quick start), the Hanakai getting-started guide and the CHANGELOG name no gem install command and no Gemfile line. The gem is published on RubyGems with a gemspec, so a documented install line on the README or the dry-validation docs would settle it and return the record to accepted. The homepage dry-rb.org/gems/dry-validation redirects to hanakai.org/learn/dry/dry-validation/v1.11, the Hanakai documentation for the dry family, which the README links as user documentation; the homepage is the page that redirect lands on. The docs say the schemas are powered by dry-schema, a sibling gem with no record, so no basedOn is recorded. The gemspec sets required_ruby_version to 3.1 or later at the v1.11.1 tag. The GitHub release v1.11.1 and the RubyGems version of 2025-01-21 agree. The LICENSE is the MIT License with the copyright held by the Hanakai team; the README names the dry-rb repository owner as an organization. The RubyGems total is the figure for every version since 2015. The earliest RubyGems version is 0.1.0 on 2015-11-25, and the repository was created 2015-07-22.
