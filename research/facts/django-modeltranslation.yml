notes: >
  The repository is deschler/django-modeltranslation and has no homepage field on GitHub; the readthedocs documentation is the only project site the README names, so it is recorded as docs only: neither the repository's homepage field nor the PyPI Homepage entry names it, and PyPI lists it under Documentation, so homepage is left out. The LICENSE copyright line names Peter Eschler and Dirk Eschler; the pyproject lists Peter Eschler as author and Sergiy Tereshchenko as maintainer, and the docs say "I'm sole maintainer of this project" without a name. The maintainer field follows the LICENSE line per the rule; the reviewer should decide between that and the pyproject maintainer. The pip route appears only as a heading and a command in the docs ("Using Pip"), with no sentence stating it, so only the source-tarball route is recorded as installMethod; the reviewer should decide whether a heading plus command suffices for pip. The GitHub release v0.20.6 is the newest stable release and the major is 0 (the 0.20 line, recorded here as the major only). The first PyPI upload is dated 2011-04-28, earlier than the repository creation date 2012-10-16, so firstRelease is 2011. The README says the app uses "a registration approach (comparable to Django's admin app)", that translation fields are stored "in the same table (no expensive joins)", and that it is "fully integrated into the Django admin backend"; those statements are the source for the prose. The installation page says LANGUAGES must list the translated languages and that the first language is the default; this is a setup step, not recorded as a field. The docs' supported-versions matrix is not recorded as a field. The GitHub API reports the repository owner as a user account.
  The installation page says to create a translation.py in the app directory and register TranslationOptions for every model to translate, then to run makemigrations and migrate. It also says to set USE_I18N = True and to list the languages in LANGUAGES, with the first language as the default.
