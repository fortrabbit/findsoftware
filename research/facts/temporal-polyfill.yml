notes: >
  A general-purpose date utility, accepted under the ruling that general-purpose utility libraries used in web apps count as helper libraries. The project has no website of its own: the npm homepage and the GitHub homepage field point to the repository README, so no homepage is recorded. The repository is a monorepo: the root README lists temporal-polyfill, the tree-shakeable function API, temporal-polyfill-codemod, temporal-utils and temporal-spec. The registry figures and the install route are temporal-polyfill alone; stars and contributors belong to the monorepo. The repository root has no LICENSE file and GitHub detects no license; polyfill/LICENSE in the repository (MIT License, Copyright (c) 2026 Adam Shaw) and the npm package.json agree on MIT, so the license entry is the npm registry statement and the maintainer comes from the LICENSE line. The root README names dayjs and date-fns only in a dilemma about bundling date libraries, not as a comparison, so no alternativeTo is recorded. The npm package.json names Adam Shaw as author and the repository owner is the fullcalendar organization; the README calls the creators FullCalendar and names arshaw as lead developer. The README describes the package as a polyfill for Temporal, the successor to the JavaScript Date object, which is a specification statement (Temporal, with a spec compliance claim and two intentional deviations) and stays in notes, as do the browser support table, the calendar systems list and the bundle size. CommonJS use needs Node 20.19 or later, or 22.12 or later, per the README, while the ESM minimum is Node 16. The npm latest package.json has no engines field, so runtimeMin comes from the README sentence. The README compares the package with @js-temporal/polyfill; that package has no record, so no alternativeTo is recorded.
