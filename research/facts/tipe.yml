notes: >
  Whether tipe can be installed by a user is in doubt: the homepage at tipe.io calls it an open-source headless CMS and carries the heading "Tipe - Private Release", the GitHub organization tipeio lists no public repositories (repos/tipeio/tipe returns 404), and no docs or pricing page was found (tipe.io/docs and tipe.io/pricing return the homepage). A public repository, a published package or a docs page from the project would settle criteria 2 and 3. The npm package named tipe is an unrelated type checker by 3meters and is not used. The homepage's blog post about a seed round says the team graduated from YC's Winter 18 batch and announces a community Slack; it carries no date, so no funding or release fact is recorded. The homepage says support for Gatsby, React, Gridsome, Vue and Angular is "coming soon". The github.com/tipeio organization page answers, but no repository was found and the npm search for the tipeio maintainer returns nothing. The homepage names no hosted plan, so the record is not marked hosted-service.
