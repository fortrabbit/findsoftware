notes: >
  Listed: the repository holds releases up to v0.3.2 (2024-06-28) and the last push is 2025-04-23. The major is 0, from the highest stable GitHub release. Mavo stores data in a cloud or local backend chosen by the page author, so no content store is recorded for the project itself. The homepage names the MIT CSAIL Haystack Group as the place of development, which is not a company, so no parent is recorded. The Get Mavo page says Mavo was released publicly on May 16th, 2017, which sets firstRelease; the GitHub release v0.0.3 of 2016 is a prerelease. The homepage says a Mavo app needs "no server backend" but no page says the output is static files, so runsAs holds browser only. The Get page also calls the project a mature beta. The homepage links a Gitter chat, which has no field.
