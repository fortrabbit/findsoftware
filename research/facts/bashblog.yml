notes: >
  The repository has no GitHub release or tag and no registry package, so the lastCommitDate fact decides the listing (committer date of the newest commit on master, 2026-10-20); the boundary question in the CSV is therefore settled and the status is accepted. The version 2.11 appears in bb.sh and the README changelog but is not a tagged release, so currentMajor is unknown. The GitHub API reports no license (the repository has no LICENSE file); the README's License section gives GPL version 3 or any later version, which is recorded as GPL-3.0-or-later. The script's default global_license value "CC by-nc-nd" is a default for a blog's own content and is not recorded as the software's license. The README changelog credits version 1.5 with i18n and version 2.8 with Slavic language support, recorded as i18n; posts are plain files written in an editor, recorded as flat-file. The README says "No templating" and describes its output as static pages with a generated RSS file, tags pages and an index; no templating library is recorded. The README names no output directory beyond the public folder the user copies the script into, so outputDir is unknown. The author's personal blog and site are not the project's site and are not recorded. The README usage section runs ./bb.sh to list the commands and ./bb.sh post to write a post. The README states GNU/Linux, OSX and BSD support, and a Markdown converter is used when installed, which is not recorded as a field. The GitHub API lists 14 contributors on the last page of the contributors endpoint with per_page=1. The project's GitHub Pages site is the project's own site and is recorded as homepage.
