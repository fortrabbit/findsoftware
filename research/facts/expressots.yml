notes: >
  The repository is a monorepo (core, CLI, Express adapter, Studio, templates), so the npm figures are for the core package @expressots/core, not the @expressots/cli scaffolder that the install docs name. The owner is the GitHub organization expressots; the LICENSE copyright line names Richard Zampieri, and the governance page says ExpressoTS is maintained by a small core team, so maintainer is the copyright holder and not the team. The app-provider page says the underlying HTTP server instance is Express.js by default and that AppExpress is the Express.js adapter implementation, which is the basis for basedOn; the homepage line "Minimal overhead on Express" agrees. The first-steps page says ExpressoTS centers on a DI container that wires controllers, use cases, providers and repositories through modules. The runtime minimum comes from the first-steps page; @expressots/core declares a slightly higher Node minor on npm, and the major is the same. ExpressoTS Studio is a local development tool that runs alongside the app during development. The homepage names GroundZero as an official deploy partner, a hosted platform run by another company; it is not recorded as a project-owned hosting option. The homepage counters (weekly downloads, GitHub stars) show placeholder zeros and were not used. The x field is the Twitter link on the homepage, which the project lists as its account.
