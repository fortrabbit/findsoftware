notes: >
  basedOn and runsAs are not recorded: the docs say the easiest way to use Hyperstack is to integrate it with a Rails application and that it wraps React and ReactRouter, but no page says it is built on either, and none states how the live site runs. The site hyperstack.org, named in the README and on the RubyGems page, does not resolve (DNS lookup fails); the homepage recorded is the documentation site docs.hyperstack.org, which answers. The GitHub language field reports JavaScript; the README states Ruby, so language is Ruby. The README Development Status table is dated April 12, 2021 (version 1.0.alpha1.8, 128 open issues), and the docs say the project is in work in progress; neither states an end, so no status signal is recorded. The highest stable GitHub release that is not named alpha is v0.99.6 (2019-01-30), which gives currentMajor 0; the newest tag is 1.0.alpha1.8 (2021-04-13), recorded as a prerelease. The RubyGems gem rails-hyperstack has nine versions, all prereleases; the newest was uploaded 2021-04-13, so no stable registry version exists and the registry major is not used. The RubyGems homepage_uri is http://hyperstack.org, which is not recorded. The Stack Overflow tag and the Slack group named in the README are not recorded as fields. The maintainer is the GitHub organization name; the MIT license copyright line in LICENSE lists five named authors (2015 to 2019), which the import does not record. The roadmap states 1.0.alpha1.5 as the current release candidate in the docs, which predates the newest tag.
