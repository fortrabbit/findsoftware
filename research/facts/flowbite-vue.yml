notes: >
  The homepage and the documentation site answer only a bot challenge, so the homepage value is the repository's homepage field and the docs are read from the docs/ folder of the default branch. The package README says documentation is not yet finished and points to flowbite.com. The quickstart source says "Flowbite Vue requires version 18 or newer", while the v0.4.0 package.json engines field says node >=22.12.0; runtimeMin follows the manifest at the latest release tag, and the 18 statement is a conflict for a reviewer. The LICENSE.md copyright line gives Crafty Dwarf LLC, and the README trademark line says Crafty Dwarf Inc.; the record keeps the LICENSE form. The npm author field is themesberg. The Discord invite is the Flowbite server the README links for the library. The Nuxt module (flowbite-vue/nuxt, added in v0.4.0) is a feature of this package, not a separate candidate. The package is a sibling port of Flowbite for Vue, so basedOn names Flowbite as the package.json description does. httpArchiveSites has no entry for flowbite-vue in the technologies list. npmWeeklyDownloads is the sum of the 2026-10-18 to 2026-10-24 range. The quickstart installs flowbite and flowbite-vue, imports the package stylesheet and registers the Flowbite plugin in the CSS file. The Nuxt module, added in the v0.4.0 release, auto-imports the components and the toast composable (named useFwbToast in Nuxt) and injects the stylesheet. runtimeMin is not recorded: the Node minimum is a build requirement for a UI library (the v0.4.0 manifest engines field says node >=22.12.0, the quickstart says 18 or newer). The forum entry is the Flowbite discussions board on the parent project repository, which the README names for help with the library. The homepage value comes from the package.json homepage field because the site answers only a bot challenge. runtime is not recorded: the README names Node.js and Tailwind CSS as prerequisites for installing a front-end package, not a runtime the library runs on.
