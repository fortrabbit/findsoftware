notes: >
  Filament is a set of Laravel packages (panels, tables, forms, schemas, infolists, actions, notifications, widgets) developed in the filamentphp/filament monorepo; Packagist's filament/filament points to the split repo filamentphp/panels, so its star count there (51) is not the project figure. The team page names founders and staff but no company, so maintainerType is community pending a company check. Databases follow Laravel and are not stated by Filament. Official paid themes are add-ons, not editions; the plugin directory also lists third-party paid plugins priced in USD and EUR. Its fit as php-framework is a boundary question: it is an admin-panel and UI layer on top of Laravel. Coined fields: demo (live demo URL), frameworkMin (minimum host framework versions), paidAddons (paid extras that are not editions), sponsorship, blog.
