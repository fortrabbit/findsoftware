notes: >
  Hosted-service record: the product is only offered as Raygun's cloud service, and no page read gives a public self-install guide, so the status stays hosted-service. The SDK repository github.com/MindscapeHQ/raygun4js, its license, stars and npm figure (raygun4js, about 18k weekly downloads) belong to the client library and are not recorded as fields; the SDK packages are the way an app sends events to the service, per the language guides in the docs. The pricing page lists a "Raygun API" for extracting and manipulating data and for on-demand events; no REST or GraphQL style is stated on a page read, so headlessApi is not recorded. The pricing page lists plans with a 14 day free trial; a trial is not a free tier, so freeTier is not recorded. Plan prices and event limits change more than yearly and are not recorded. The terms name Raygun Limited as a New Zealand company and New Zealand law as the governing law; neither is the company's headquarters, and neither the terms nor the privacy policy give an address, so hqCountry is not recorded. The about page says "100,000 +" developers use Raygun across 120+ countries, a developer count and no install count. The security page states GDPR compliance; compliance is a coined field and goes here: GDPR compliance statement on the security page, no certifications named. The founding year is not stated on a page read, so firstRelease is not recorded. Social links are the homepage footer X (twitter.com/raygunio) and YouTube, recorded without quotes because they are link targets only; the LinkedIn company page is a coined field and goes here, at linkedin.com/company/raygun-io.
