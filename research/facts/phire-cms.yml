notes: >
  The project's website is not a reliable source. Its documentation page serves unrelated gambling content, its footer carries links to unrelated commercial sites, and its copyright line (2009-2010) names Moc 10 Media, LLC. The maintainer is NOLA Interactive's name from the repository LICENSE.TXT line, which is also the company in the composer.json author homepage; the homepage footer is not used. The homepage feature list dates from the 1.0 line (it names PHP 5.3), so it is cited only for the project description and its multisite claim is not recorded. The README says a new website and documentation are "coming soon". No end signal was found: the repository is not archived, Packagist has no abandoned flag, and no page declares the project ended, so status stays accepted. The repository's GitHub license field reads NOASSERTION, while composer.json and LICENSE.TXT both state BSD-3-Clause. The v3 branch has no release, so currentMajor is 2 from the stable tag. phirecms/phirecms is the package the README tells users to install; its Packagist monthly figure is 0.
