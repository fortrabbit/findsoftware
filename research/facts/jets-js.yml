notes: >
  The GitHub repository has no releases; its tags run to v0.14.1 and the npm package jets is at 0.15.0, published 2022-12-11, which has no GitHub tag. The registry version is the one recorded for currentMajor and latestReleaseDate. The npm package is named jets, while the record id follows the repository name. The homepage names no maintainer beyond the author line; the LICENSE copyright line matches it. The project's last commit on the default branch is also 2022-12-11. The last release is over three years old: the import moves the record to stub when four years pass without a release, on or after 2026-12-11. The homepage's Quickstart lists Bower, which the project still names in its install steps; it is recorded as an install route. The README's badges are the only other link set: a Gitter chat badge names a chat room, which is not recorded as forum or discord. The homepage describes a list or table rendered on the backend and filtered in the browser with Jets.js, and says the search term can be set from a text field, a select or a call in code. The homepage links the author's personal X account (twitter.com/DenisLukov), which is not a project account and is not recorded as x.
