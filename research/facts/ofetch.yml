notes: >
  Boundary ruling: an HTTP client is accepted as a helper library, so the CSV boundary state is not a record status. Repository only: the GitHub homepage field is empty, the npm homepage is the GitHub README anchor, and no page names a site of its own, so no homepage is recorded. The main branch is the v2 alpha development line and the README points to the v1 branch for v1 docs; currentMajor is 1 from the highest stable GitHub release v1.5.1 (2025-11-01), which matches npm latest. The newest prerelease, v2.0.0-alpha.3 (2025-10-28), is older than the latest release, so no latestPrereleaseDate is recorded. The oldest tag v0.0.1 is dated 2020-12-09, earlier than the npm registry's first upload 0.0.0 (2022-05-03), so firstRelease is 2020. The README says the library works "on node, browser, and workers"; runtime is recorded as node because the Node.js statement is the one that says what must run on the server, and no runsAs statement is recorded because the README names several environments. The README's proxy section names undici and Bun and Deno proxy options; these are not runtime values. The npm figure counts downloads of the ofetch package named by the install command. Stars and contributors are for the repository.
