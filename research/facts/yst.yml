notes: >
  No homepage: the repository is the only site the project names, and the Hackage homepage field points to the same GitHub repository. The project has tags 0.1 to 0.7.2 and no GitHub release objects, so firstRelease is the upload date of version 0.1 on Hackage. The current major is taken from the highest stable tag, 0.7.2, which Hackage also lists as the latest version. The license is the cabal file entry; GitHub reads the LICENSE file as GPL-2.0. The README says the site can be built with pandoc (pandoc extensions for Markdown) and that a SQLite3 build needs the builtin-sqlite3 flag; pandoc is a conversion tool the project calls, not a parent, so basedOn is not recorded. The Hackage maintainer field holds an e-mail address, which is not recorded; the author name John MacFarlane is recorded as maintainer.
