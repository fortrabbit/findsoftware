notes: >
  The README states Node.js 8.15.0 and later as the supported minimum, while the npm registry declares engines node >=12.0.0 for the latest version; runtimeMin records the registry value because it is the declared minimum of the latest release. The GitHub release page shows 4.0.4 published 2024-10-19, but npm latest is 4.0.5, published 2025-10-08, so the npm date is recorded. The about-installation page returned the same index content as the homepage, so the installation facts come from the README. The first npm version dates from 2011, but no page states a first release year, so firstRelease is not recorded. JSDoc is a developer tool that generates documentation; no page states where it runs, so runsAs is not recorded. The homepage is jsdoc.app; the README names a mailing list, which is not recorded as a forum.
