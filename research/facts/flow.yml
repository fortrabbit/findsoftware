notes: >
  The install docs name neos/flow-base-distribution, a skeleton, so Packagist figures come from its core package neos/flow. The repository neos/flow-development-collection is the monorepo with the core packages; neos/flow on Packagist points to github.com/neos/flow. The sentence about GPL v3 on flow.neos.io describes the Neos CMS, so it is not recorded; the repository LICENSE and composer.json say MIT. The maintainer is the Neos project as the Flow site names it; the MIT LICENSE copyright reads "Neos project contributors". The neos.io imprint names the Neos Foundation e.V. as provider of that website only, so it is not recorded as maintainer. firstRelease is not recorded: Packagist's earliest version is the 2.0 beta of 2012 under the later name, and the repository history starts earlier as FLOW3. The installation page gives no hosting model, so runsAs is unknown. The stable Definitive Guide pages are out of date: the requirements page still says PHP 7.3.0 while the latest release requires ^8.4; runtimeMin uses the registry, and the databases quote comes from the same page. basedOn is not recorded: Flow is the framework Neos CMS is built on. Stop check: repository not archived, no abandoned flag on Packagist.
