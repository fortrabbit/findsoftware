notes: >
  Boundary settled for this wave: a runtime version manager is a developer tool that runs on the developer's machine, so the row is accepted with runsAs local. The LICENSE names one copyright holder, Akash Manohar J, while the repository owner is the asdf-vm organization; the maintainer is recorded from the LICENSE and the reviewer decides whether the organization is the maintainer. The highest stable release is v0.20.2 (2026-09-22). The major is 0, as the version scheme is pre-1.0 semver. The install routes come from the getting-started page's own sections (Homebrew, Zypper, Pacman AUR, pre-compiled binary, go install, git clone). The page says asdf primarily requires git, and its dependency lists add bash and coreutils. The README community section links GitHub Issues and a StackOverflow tag, no forum. The homepage names plugins for runtimes such as Ruby, Node.js and Elixir; plugin repositories are not recorded because the plugin registry is a separate project. The homepage says asdf reads .nvmrc, .node-version and .ruby-version files and provides a GitHub Action; neither is a field here. firstRelease comes from the v0.1.0 tag (2016-07-05), not from a releases-page check.
