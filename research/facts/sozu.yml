notes: >
  Two license statements: the GitHub API reports AGPL-3.0 for the repository, the README says sozu and sozu-lib are under AGPL version 3 and sozu-command-lib under LGPL version 3, and each is its own entry. The legal notice names Clever Cloud SAS as the publisher, with its registered office in Nantes, France; the README copyright line reads "Copyright (C) 2015-2026 Clever Cloud". The site footer says "Designed & Developed by Clever Cloud". The about page says businesses building on Sozu should contact Clever Cloud for a business agreement; that is a licensing term, not a paid edition, and no price is stated. Tags predate GitHub releases: tag 0.1.0 has commit date 2017-04-04, the oldest GitHub release is 0.14.2 (2022); the repository was created 2017-01-18. The current major is 2 from tag 2.3.3 (2026-10-19). The crates.io entry for sozu is a different artifact from the install routes the docs name, so no crate figure is recorded. The README's sozu top terminal dashboard is an operator TUI, not an admin UI for websites, so adminUi is absent. The Docker image is built in a builder stage on the Rust 1.93.1 image, per the README note; runtimeMin uses the toolchain pin at the latest tag. The homepage's social-platform scripts (LinkedIn, Twitter) are embed code, not profiles, so no social field is recorded.
