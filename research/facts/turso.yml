notes: >
  The README says Turso Database is "an in-process SQL database", so only the browser runsAs is recorded, from the README line on WebAssembly support: an embedded library runs inside the application that loads it. Its CLI (tursodb) can run an MCP server over stdin and stdout; a CLI description is no runsAs statement. The homepage (turso.tech) is the vendor's site and lists the open-source Turso beside Turso Cloud; the GitHub homepage field is empty. Turso Cloud is a managed service; a private-preview feature on it is no hostedOffering statement. The rewrite of SQLite is not a fork (README FAQ), so no forkOf; the README says the rewrite "replaces libSQL as our intended direction" and the libSQL README says libSQL is still maintained, so successorOf libsql is recorded for a reviewer to confirm, and the libsql record is unchanged. The homepage banner states "Turso is joining Supabase" and the 2026-10-02 blog post says Turso "is being acquired by Supabase" and that "Turso Database remains open source and actively developed"; that is no end statement, and the owning company is not recorded as parent because the acquisition is pending on that page. The Postgres frontend is marked experimental in the README, so postgres is not a databases value. The project has not reached 1.0 (README FAQ), so currentMajor is 0. The crate turso is the Rust engine; the README also names the npm package @tursodatabase/database, the PyPI package pyturso, the Maven Central artifact tech.turso/turso and the NuGet package Turso.Data.Sqlite.Provider, none of which is recorded as a registry name. Discord: the homepage links the user community at tur.so/discord, while the README badge names a Core Developers server at discord.gg/jgjmyYgHwB; the reviewer may prefer the second. Hosted plans on the pricing page are not editions. The maintainer name follows the contact page ("Company Turso, Inc"); the terms of use name the contracting party as CHISELSTRIKE INC., the company's former name Chiselstrike. hqCountry is absent: the contact page gives a Claymont, Delaware address ("Claymont, DE 19703, United States"), which is a registered-agent address and incorporation, no headquarters, and the homepage says the company is "technically San Francisco based". The oldest GitHub release is v0.0.1 (2024-07-17). Fields coined here: none.
