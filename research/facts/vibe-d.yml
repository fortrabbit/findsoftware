notes: >
  The homepage vibed.org answers 200 over HTTPS; the GitHub homepage field is null, so the site is taken from its own pages. The repository is vibe-d/vibe.d (MIT, D, organization). Highest stable GitHub release is v0.10.3 (2025-12-17), so currentMajor is 0; the homepage and docs still show 0.10.1, which the site has not updated. No prerelease was found. firstRelease is 2012 from the CHANGELOG entry for v0.7.0 (2012-05-06), which predates the oldest GitHub release (v0.9.0, 2020); the repository was created in 2012. The maintainer is rejectedsoftware e.K. as the About page copyright line states it; the Impressum names Sönke Ludwig as the person responsible, and the LICENSE.txt of the repository is copyright Sönke Ludwig for 2012-2020. The Impressum gives no address, so hqCountry is unknown. The README says vibe.d supports the 10 latest minor releases of DMD and the LDC versions that implement the same frontend; that is a rolling window with no fixed minimum, so runtimeMin is not recorded. runsAs always-on rests on the docs' first-steps page, which says running the project starts an HTTP server on a port. The runtime value native is the import's key for compiled-to-machine-code software. Authentication is HTTP Basic and Digest, with OAuth left to extension libraries, so sso is not recorded. The DUB registry at code.dlang.org lists the package vibe-d, but no registry figure is in the brief's list of pairs, so no download figure is recorded. The About page names a German legal form (e.K.); no maintainerType is recorded, since the import derives it from the name. The site has an RSS feed of its news, which is not a newsletter, and no discord, bluesky, mastodon or x link was on the homepage. A German translation of the licence is in LICENSE_DE.txt; it states the same licence and is not recorded as a separate statement.
