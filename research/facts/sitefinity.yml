notes: >
  Criteria 2 and 3 hold: the product page states an on-premises option, and the documentation has system requirements and installation pages for Sitefinity CMS 15.4 (Windows, IIS, SQL Server, NuGet). The documentation calls the full package legacy MVC mode next to a hybrid mode with an ASP.NET Core renderer. No end statement was found. No page read gives license terms for the on-premises product, so license and licenseModel are left out; the documentation only describes activating an installed license. The NuGet package Telerik.Sitefinity.All is the package the candidate row names, and the major 15 comes from its latest listed version, which matches the 15.4 documentation. The CSV row's last release date is not confirmed by a page or registry field read here, so latestReleaseDate is left out. The community forum link is the product's discussion topic on the Progress community site.
