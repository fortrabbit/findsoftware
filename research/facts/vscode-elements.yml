notes: >
  Doubt on criterion 1: the pages say the library builds the user interface of a Visual Studio Code extension inside the editor's webview, not a website or a web app a creator publishes; a reviewer decides whether webview UIs count, and a yes returns the record to accepted. The status is stub until then. The homepage and guides are readable; the guide names a lighter sibling, VSCode Elements Lite, as an alternative without a link to a fact. The maintainer is Adam Bender, named by the LICENSE copyright line; the GitHub organization is VSCode Elements. The latest GitHub release is v2.5.1 (2026-02-22) and the npm latest tag points to the same version; the newest preview, npm next tag v2.4.1-pre.1 (2026-01-12), is older than that release, so no latestPrereleaseDate is recorded. The oldest GitHub release is v0.3.1 (2021-06-12), though the repository dates from 2019. The npm package is the one the install guide names. The GitHub language is HTML, which the README does not state as the shipped language, so the language fact is TypeScript from the README.
