notes: >
  Hosted service, criterion 2 waived. The homepage calls it "a modern cloud server control panel designed to manage WordPress sites"; it connects to the user's server over SSH and runs commands, so the description follows that and does not claim the software runs on the managed server. The about page says it was a Delicious Brains product until Delicious Brains was sold to WP Engine in June 2022, and that the founder "has continued on with SpinupWP as an independent company"; no parent is recorded. The footer's "From the creators of the Delicious Brains plugins" names a sister company, not a parent. The about page says "Founded in 2017"; that is a company founding year, not a first release, so firstRelease is absent. Prices on the pricing page (per user, per site monitor, plan names) are not recorded. The compare page lists "SpinupWP vs" entries for cPanel, Plesk, EasyEngine, GridPane, Ploi, RunCloud and ServerPilot, recorded as alternativeTo where a fact file exists; Cloudways has no fact file, and "Laravel" names no single record, so both are left out. The free trial and the trial terms are not fields. The REST API and PHP SDK named on the homepage and the API Docs link are not recorded as headlessApi or apiLimits: the API controls servers and sites and the docs give no limits on the pages read; the SDK is a client library and is not used as a source. Sign-in with GitHub, Google or X is account login, not a single sign-on protocol, so sso is absent. The community forum at community.spinupwp.com is open to existing customers by invitation only. The homepage's "used by thousands of teams" is not a count, so reportedInstalls is absent. The privacy page places the company in Ontario, Canada and the application and databases on DigitalOcean in the United States; no EU hosting is stated. Social links are the footer's twitter.com/spinupwp and bsky.app/profile/spinupwp.com icons. The footer's LinkedIn company page is not a social field.
