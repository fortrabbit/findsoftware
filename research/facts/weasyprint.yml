notes: >
  The homepage answers over https and is the project's own site. The documentation is hosted by CourtBouillon and the stable docs root is recorded. The maintainer is the legal entity behind CourtBouillon, the brand that the README says provides maintenance, and the PyPI metadata names CourtBouillon as maintainer. The README says WeasyPrint "has been created and developed by Kozea"; the docs footer and LICENSE copyright line name Simon Sapin and contributors, and pyproject names Simon Sapin as author. These are recorded here, not as maintainer. The legal notice gives a Villeurbanne street address without a country name, so hqCountry is not recorded. The minimum Python is the requires_python of the latest PyPI release (>=3.10); the README and docs index at the v70.0 tag and the first-steps page say Python 3.10 as well, while the README on the main branch already says 3.11+ for the next release, so 3.10 stands. The first-steps page names Pango 1.44.0 or later as a system library the install needs, which is a dependency of the native build, not a runtime. The Docker images, the .NET wrapper and the AWS Lambda layer named on the first-steps page are maintained by third parties, and the Conda Forge and Macports routes are listed there as other solutions that are not tested, so none is recorded as an installMethod. The docs say the Python API is preferred in long-lived processes when many documents are converted, to avoid paying start-up costs each time, but no page states a process model, so no runsAs is recorded. The README says the project is based on various libraries but not on a full rendering engine such as WebKit or Gecko, and that its CSS layout engine is written in Python and designed for pagination. The homepage says the software can be plugged into applications and websites, and the first-steps page shows the weasyprint command-line tool beside the Python API. The security section says untrusted HTML or CSS can cause high memory use, endless renderings or local file leaks, advises not launching the service as root, running it as a user with limited access, or in a container, and says WeasyPrint is pretty slow and can take a long time to render long documents. The Why WeasyPrint section of the docs names wkhtmltopdf and PagedJS as projects that add paged-media features to existing browsers, and Prince, Antennahouse and Typeset.sh as renderers that are not open source; only wkhtmltopdf has a record here, so it is the one alternativeTo. Flask-WeasyPrint and Django-WeasyPrint are third-party integrations named on the docs page; they are not a parent. The homepage's chat link is a Matrix room and has no field; its Mastodon link is CourtBouillon's account. The homepage's "25M downloads last month" claim is a site statement that is not a registry figure, so it is not recorded. The pypistats figure is the last-month count at the check date.
