notes: >
  The homepage perun.io answers only over plain http with the Perun site, and https fails to connect, so no homepage is recorded and the http site is not used for facts. The README says "This project is currently unmaintained!" and points to Montaigne for websites and blogs; the README does not name Montaigne as a successor, so no successorOf is recorded. The repository was last pushed on 2026-07-25 while the README still states it is unmaintained; the README statement is the signal used. The GitHub repository has no release objects; the tags 0.3.0 (2016-01-17) and 0.5.0 (2020-12-10) are the sources for firstRelease, currentMajor and latestReleaseDate, using the commit dates of the tags. The highest stable tag is 0.5.0; the SNAPSHOT tags are not stable. The README names a Clojurians Slack channel #perun for help; Slack is not a recorded forum field. The newsletter is the author's, linked from the README. The README's dependency line shows [perun "0.3.0"] while the example build uses 0.4.3-SNAPSHOT; the install method is recorded as a Boot dependency, with no version. The README says Perun is tested against Boot 2.8.2 only; no runtimeMin is recorded because that is a Boot version, not a runtime version of the project's own release. Clojars hosts the package but is not in the registry list, so no figure is recorded.
