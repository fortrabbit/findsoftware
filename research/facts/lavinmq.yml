notes: >
  Drafted 2026-11-03 from the homepage, the about and license pages, the installation guide, the getting-started page, the systemd and management interface pages and GitHub. The license page gives the copyright line as "Copyright 2019-2026 84codes AB (SE556898-0782)", so 84codes AB is the maintainer. The about page calls 84codes "a Swedish tech company", the only country statement on the pages read; the registration number prefix SE agrees. A reviewer should confirm hqCountry SE, since the quote names the company's nationality, not an address. The about page says LavinMQ was born in 2020 and 84codes was founded in 2012; no founding year is recorded for the maintainer. Its statement that 45 or more engaged contributors work on the project is not used; the contributor count is the GitHub count. The Docker Hub image is cloudamqp/lavinmq, named by the installation guide. The release history shows release candidates for 2.11.0 and the 2.10.4 stable release on 2026-10-29; the stable line is 2. The candidates row lists the GitHub figures only, no registry package; no npm or other registry package is recorded. The documentation states that LavinMQ is distributed in packagecloud repositories for Debian, Ubuntu and Fedora, recorded under the install routes. The homepage lists "LavinMQ supports single-node and multi-node setups" and a stream queue feature; clustering and stream support are not recorded as fields. The community page links a Slack workspace and GitHub Discussions; Slack has no field here. The authentication page lists OIDC issuer settings for the HTTP API and management UI SSO.