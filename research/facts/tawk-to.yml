notes: >
  Status stub, criterion 1 in doubt: the title and the first product are live chat, but the homepage body leads with an all-in-one customer experience suite (shared inbox, CRM, pipeline, tickets, knowledge base, feedback, AI agents, hired chat agents on the why-free page), a helpdesk and CRM lead that would make it a finished application under criterion 1, as with crisp; a reviewer deciding that the chat widget a site embeds is the record would move it to hosted-service. The widget attaches by a script snippet (homepage "One snippet of JavaScript"; developer portal "call a method after the embed code on your page"), recorded as a note. The developer portal names a JavaScript API (Tawk_API), webhooks and a Zapier integration; no REST or GraphQL API is named on the pages read, so headlessApi is not recorded. The hosted service is the only product: the vendor publishes no repository, no self-host option and no license for the service; the SDK or client code is not a data source here. The homepage counter reads "M+ Businesses" without a number, and the body says "Millions of businesses run on tawk.to"; no reportedInstalls figure is recorded. The homepage says "delivered · since 2013", a claim about the service that is not recorded as firstRelease. The free tier is stated as "Free Forever" on the homepage and why-free page; freeTier is a coined field and stays here. The why-free page lists paid add-ons (removing the "Powered by tawk.to" branding for $29/month, AI Assist from $29/month, human agents at $1/hour); hosted plan tiers are no paidEdition, and no prices are recorded. The legal name comes from the terms of service and the country from the partner agreement's address in the same terms; the address sits in the partner agreement section. The privacy policy names EU-U.S. DPF certification and sub-processors on Digital Ocean, AWS and Google Cloud. The pricing page was not separately located; the why-free page is the pricing explanation read. Social and community links are read from the homepage footer.
