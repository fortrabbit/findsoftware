notes: >
  The homepage lists websites among the output formats ("static and dynamic output formats including HTML, PDF, MS Word, Beamer, HTML5 slides ... websites"), which is the basis for criterion 1. The homepage also points to RStudio Connect, a Posit product for publishing and scheduling reports; it is not part of the package and nothing about it is recorded.   Boundary: the candidate row marks this a document converter used by static site generators, and the package's own pages describe analysis documents rendered to formats including HTML. The record stays as the candidate row has it; the reviewer decides whether a document converter meets criterion 1. The README requires Pandoc (>= 1.12.3) outside RStudio, which is a dependency and not a parent, so no basedOn is recorded. The GitHub release v2.32 (2026-09-07) and the CRAN publication (2026-09-01) differ by six days; latestReleaseDate follows the GitHub release, which the candidate row also gives. The oldest GitHub release is v0.1.2 (2014-02-24). The API reports license NOASSERTION; the CRAN license line is "MIT", and the LICENSE file names Posit Software, PBC as copyright holder. The CRAN page names Yihui Xie as maintainer; the record uses the copyright holder from the LICENSE file. The homepage answers at rmarkdown.rstudio.com with the R Markdown site, and the README links its Get Started page at pkgs.rstudio.com.
  runsAs lists always-on for a Shiny document, which the run function serves from a Shiny server, and local for rendering on the user's machine; a rendered document is a set of files. The ssg category follows the render_site function, which renders a directory of documents as a website.
