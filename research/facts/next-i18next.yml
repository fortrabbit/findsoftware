notes: >
  basedOn i18next comes from the README sentence that calls next-i18next v16 a thin layer on top of i18next and react-i18next. react-i18next is named in the same sentence but has no record, so it stays out of basedOn; a record for it would make the link. basedOn nextjs rests on the README and repository tagline "The easiest way to translate your Next.js apps."; the README also says the library handles "the Next.js-specific wiring", and the package's peer dependency next >= 14.1.0 is no statement. The Node.js runtime comes from the README sentence about backends running in Node on the server pass; the engines field of package.json at v16.4.10 says node >=20, recorded as runtimeMin. runsAs static comes from the README's static export section: with output export in next.config.js and the proxy deleted, next build writes one page per language and route, while hideDefaultLocale, localeInPath false and localeInPath internal depend on the proxy and do not work in that setup. The homepage says getT works in Server Components, useT in Client Components and createProxy for proxy.ts; the README says Server Components, Client Components, middleware, the Pages Router and mixed setups are supported, which is compatibility and no renderingModes statement. The README says translation files can sit in public/locales or be bundled with dynamic imports through resourceLoader, that files in public are not available on the filesystem at runtime on serverless platforms such as Vercel or AWS Lambda, and that custom i18next backends such as HTTP, chained or Locize backends load them; backends passed to the client provider run only in the browser, and the server pass renders from loaded resources. The proxy detects the language from a cookie, the Accept-Language header or the fallback, and redirects bare paths to locale-prefixed ones in the default mode. Locize is named as a hosted translation service with a backend plugin, i18next-locize-backend, and as sponsor; Locize is a separate product, not a hosted offering of this package, so it is not recorded as hostedOffering. The README also names i18next-cli, i18next-icu and i18next-mf2 as companions; they are other packages, not parents or forks. The version history starts with tags v0.1.0 to v0.54.0 and the 16 major; v0.1.0 is a prerelease in the GitHub release list dated 2018, and the oldest npm upload is also 2018-11-25, so firstRelease is 2018. The homepage is the project's own demo and docs site, next.i18next.com, which answers over https; it links blog posts on locize.com and no forum, discord or social account. The npm figure counts the next-i18next package the install command names, which is not a monorepo. The GitHub stars and contributors belong to the single repository. The README has a Migration from v15 section; it documents the same package's own versions, so it is no importsFrom.
