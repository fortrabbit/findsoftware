notes: >
  Status is discontinued on the repository description, which the project words as "(unmaintained)". The homepage https://posativ.org/acrylamid/ answers 404, so no homepage is recorded and the site cannot be read; the end signal outranks the dead homepage. The README's Code Shelter notice asks for maintainers. The README says it compiles Markdown, reStructuredText and Textile articles, with incremental builds and a built-in server, and that PyPI releases 0.7.x do not work with Python 3.3 and later. The README names the license as BSD Style, 2 clauses; PyPI classifies it as "BSD revised" and the GitHub API reports NOASSERTION, so the recorded value is BSD-2-Clause from the README. No GitHub release exists; the repository has tags, and the newest is the PyPI version, so currentMajor and latestReleaseDate come from PyPI. The first PyPI upload is in 2011, which sets firstRelease. The LICENSE copyright line names Martin Zimmermann as maintainer. The README calls the project a mixture of nanoc, Pyblosxom and Pelican; no basedOn is recorded, as the README does not say it builds on them.
