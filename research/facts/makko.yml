notes: >
  The forge HTML and raw file URLs answer with a "Cookie Monster" bot challenge, so the README and LICENSE are read through the Forgejo contents API (base64 content); those facts carry no quote, and check-quotes cannot confirm them. The Forgejo API reports the repository language as C; the README build section and the description say Zig, so language is Zig. The stars field is coined as forgejoStargazers, following codebergStargazers, because the repository is not on GitHub. The forge has no contributors endpoint, so contributors stays unknown. The homepage and English documentation are read in full; the docs FAQ states that the project is primarily designed for blogs and does not fully support custom templates beyond post.html and feed.html, which is a constraint for prose. The FAQ also says Makko is not engineered as a web server, and that the output is static files servable by any HTML host. The docs name IRC and XMPP channels on the forge's community page, but no field in the list covers chat channels, so they are not recorded. The config file is makko.json; its paths block sets the source folder (blog/, posts and static media), the output folder (web/) and the templates folder (templates/). The latest release 3.0.0 is stable, and the newest prerelease (3.0.0-pre2, 2026-07-01) is older than it, so no latestPrereleaseDate is recorded. The docs describe a feeds setup (html, rss, atom, json) and a live mode that reloads the browser on save, and neither is recorded as a field.
