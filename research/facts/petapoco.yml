notes: >
  The repository has no project website: the GitHub homepage field is empty, and the README links only the author's personal site (toptensoftware.com, Brad Robinson, the originator), which is not recorded as the project's homepage. The documentation is the GitHub wiki, which says the documentation is being rewritten. The default branch is development and master has the same LICENSE.txt. The README says PetaPoco is "tiny & fast" and "Like Dapper, it's fast because it uses dynamic method generation"; the Dapper sentence is a comparison of technique, not an alternative statement, so no alternativeTo is recorded (dapper and dapper-orm records exist). The add-ons PetaPoco.SqlKata, StaTypPocoQueries.PetaPoco and PetaPoco.DBEntityGenerator are separately published packages and are not recorded. The NuGet package PetaPoco (single file, version 5 line, 5.1.304 last published 2018-07-02) is the legacy version 5 and is not the package the README names for version 6; its first upload 1.1.0 (2011-03-21) sets firstRelease. The GitHub tags end at v6.0.316 (2018-07-18) and have no release objects; the NuGet registry gives the newer stable 6.0.683 (2024-09-20) and the beta 6.0.684-beta (2025-09-14). The databases the README lists that the field vocabulary has no value for (SQL Server CE, MS Access, Firebird) are kept in the quote and not in the field. The README's MIT and Apache 2.0 sentence and the LICENSE.txt Apache 2.0 text are recorded as two license entries. The LICENSE copyright line names the GitHub organization CollaboratingPlatypus, the maintainer is taken from the wiki sentence instead. The README names Wade Baglin and Aaron Sherber as the people who maintain and extend the project; their names are not recorded as the maintainer because the wiki and LICENSE name the group. The latest NuGet package targets .NET Framework 4.0, 4.5, .NET Standard 2.0 and 2.1 per its nuspec; a .NET Framework minimum goes to notes, so no runtimeMin is recorded, and the nuspec copyright line also reads Collaborating Platypus.
