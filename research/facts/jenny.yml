notes: >
  The repository is not a project site and GitHub reports no homepage, so no homepage is recorded; the README's "Plugs" section links a personal blog, which is not a project site. The highest stable GitHub release is v1.2.5, published 2024-09-09. The README and LICENSE.txt disagree on the copyright line: the README says "Copyright (c) 2024" with no name, while LICENSE.txt names Conrado Patricio Ambrosio for 2017 to 2021; the legal notice is used as maintainer, and the README's own author link is @hmngwy, the GitHub account. The README documents a Docker image on ghcr.io and a GitHub Action, where the Docker image is recorded as an installMethod and the GitHub Action, which builds the blog in CI, is not.
