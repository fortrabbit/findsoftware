notes: >
  The homepage is the project's own site and links the Guide and the API reference; docs is the Read the Docs manual the README links. The Packagist package phpmv/ubiquity is the core package; the skeleton phpmv/ubiquity-project is what the README names for create-project, and its downloads are not recorded. The runtimeMin 7.4 is the stable 2.5.2 require on Packagist; the master composer.json requires PHP 8.1 or later, which is newer than the release and is not used. The README lists Workerman and Swoole among its managed servers and says it is optimized for asynchronous platforms; that does not state how the process runs, so only per-request is recorded. The homepage mentions a local development server, which is not recorded as runsAs local because the software also runs on live hosts. The latest GitHub release is 2.5.2 from 2023-02-05; the repository was pushed on 2025-11-30 and is not archived, and the package is not abandoned, so no end signal applies. The maintainer is the lead developer named in composer.json; no company or legal entity is named on the project pages. The contributors count is the page count of the contributors listing at per_page=1 with anonymous contributors included.
