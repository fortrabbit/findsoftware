notes: >
  The GitHub API reports license NOASSERTION for the monorepo; the LICENSE file and the npm package both say MIT. The repository's latest GitHub release is a sub-package (@astrojs/vue), so latestVersion and latestReleaseDate come from the npm package astro. The Astro Technology Company announced joining Cloudflare on 2026-01-16; the homepage itself names no owner. The integrations directory shows no total, only "Page 1 of 106", so pluginCount is absent; officialAdapters (cloudflare, deno, netlify, node, vercel live in packages/integrations of the repo; the docs page names node, netlify, vercel, cloudflare). basedOn vite is from the npm package dependencies (vite ^8.3.4), not a docs page. The homepage shows a newsletter signup but no URL was captured. Not on endoflife.date. Coined fields here: officialAdapters (adapters published by the project, separate from deployTargets host guides), contentFormats (file formats a content layer reads), themeDirectory (theme gallery URL, separate from pluginDirectory), youtube. contributors is the GitHub API count including anonymous contributors.
