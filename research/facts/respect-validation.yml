notes: >
  Accepted: a PHP validation library with its own docs site, installed through Composer. The GitHub homepage is the readthedocs site; composer.json names http://respect.github.io/ as its homepage, which answers over https too and is not the docs. The LICENSE copyright line names the Respect Project Contributors, and composer.json authors name "Respect/Validation Contributors"; the LICENSE line is recorded. currentMajor is 3 (highest stable release 3.1.2, composer.json requires PHP >=8.5 at that tag). latestReleaseDate is the newest stable release by date: 2.5.0 was published 2026-07-22, after 3.1.2 (2026-06-02), and 2.5.0 requires PHP >=8.1 on Packagist. The migration guide states PHP 8.5 for 3.x and PHP 8.1+ for 2.x. latestPrereleaseDate: the 2.3.0-RC release (2023-03-04) is older than the latest stable release, so none is recorded. firstRelease: the oldest tag, 0.3.9, has a commit dated 2012-04-08, and its Packagist upload is 2012-04-07; the repository was created in 2010 with no older tag. The Packagist figure is the total of all downloads, and the monthly figure on the same page was 1338091 on 2026-11-16. i18n is recorded as yes from the translation page, which says the library does not enable translations by default and ships no official translations other than English; the user supplies them through a translation contract. The README's "More than 150" validators line is not recorded as a figure. The installation sentence is the getting-started page; the getting-started page also names PHP 8.5 as the requirement.
