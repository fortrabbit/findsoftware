notes: >
  The install docs name npx @foal/cli createapp, which is the CLI, so the registry figures come from the framework package @foal/core. The home page names an ORM built on TypeORM; the TypeORM introduction page lists PostgreSQL, MySQL, SQLite and MongoDB as officially supported and says a new project uses SQLite by default. The README lists a CLI, testing tools, frontend utilities, scripts, authentication, an ORM, deployment environments, GraphQL and Swagger API and AWS utilities as provided in one place. The README quick start installs with npx and starts a development server with npm run dev. The deployment checklist covers setting NODE_ENV to production, HTTPS, secrets and production database migrations. The ExpressJS page says createApp returns an ExpressJS application. The LTS table in the README gives Node 22 and 24 for 5.x. Maintainer is the copyright line of the LICENSE, which names the project, with no legal form. firstRelease is the year the @foal/core package was created on npm.
