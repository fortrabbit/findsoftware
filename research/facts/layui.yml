notes: >
  The English README (README.en-US.md) and the Chinese README were read in full; the documentation at layui.dev/docs/2/ is in Chinese and is cited in its own words, and the i18n page is read at layui.dev/docs/2/i18n/. The descriptions and the category are from the English README. The 2021 notice that the original website was taken down, and the README line that 2.13.0 is the final major version of the 2.x series, are read and are not end signals: the project's README says development continued on GitHub and Gitee, and releases continue to 2.13.9 (2026-08-11). The next line, Layui 3, is in development; its GitHub prereleases (latest alpha 2026-03-02) are older than the latest stable release, so latestPrereleaseDate is not recorded. The LICENSE copyright line names "Layui contributors"; no legal name or country is stated on the homepage or the documentation, so hqCountry is not recorded and the maintainerType is community as a fallback. The npm package has no author field. The homepage links third-party extension and theme sites and the Gitee mirror; none is recorded. The HTTP Archive figure is the mobile origin count, the convention used across records. The npm figure is the sum of the range endpoint for 2026-10-18 to 2026-10-24 (the npm package is the core package the install docs name).
