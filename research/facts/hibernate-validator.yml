notes: >
  The highest stable GitHub release is 9.1.6.Final (2026-11-01), so currentMajor is 9; the 6.2, 7.0 and 8.0 lines are older majors. The 9.2.0.Beta1 preview (2026-10-13) is older than the latest stable release, so it is no latestPrereleaseDate. The README says the default metadata source are annotations, which XML validation descriptors can override and extend. The README names Jakarta Validation 3.1 as the specification the project implements; a specification is not a basedOn parent. The homepage says "Hibernate is part of the Commonhaus Foundation" (https://hibernate.org/community/commonhaus/); the foundation hosts the project and is not the maintainer. The LICENSE file has no copyright line, so the maintainer is the homepage copyright line's "Hibernate". firstRelease is 2007 from the oldest Maven Central upload of the artifact org.hibernate:hibernate-validator, 3.0.0.ga (Last-Modified 2007-05-29), whose pom names the project Hibernate Validator; that line was developed in the Hibernate SVN, so the oldest git tag of this repository is 4.0.0.GA (2009-10-08). The org.hibernate.validator coordinates start with 6.0.0.Alpha1 (2017). The 3.x pom states the LGPL; the current releases are Apache-2.0. The Maven search index lists versions only up to 9.0.1.Final, so latestReleaseDate comes from the GitHub release. The homepage's "Paid support" link, the CDI extension and the annotation processor are parts of the same project and are no paidEdition. Contributors counts all pages of the contributors endpoint.
