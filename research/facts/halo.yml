notes: >
  Community edition (GPL-3.0, Docker image halohub/halo) and paid editions Halo Pro and Halo Shop (image halohub/halo-pro, commercial license sold by 凌霞软件) are both on the homepage and install docs; the record's license facts are the community edition's, the paid edition is a paidEdition fact. The homepage and docs are Chinese; quotes are copied from the Chinese text. LDAP authentication is a paid-edition app listed on the users page, so it is no sso fact for the free edition. The homepage states 3.8M+ Docker pulls, which counts pulls, not installs, and is not recorded. The homepage links a Telegram channel (t.me/halo_dev) and a Telegram group; telegram is not a field. The docs say Java 21 is needed from version 2.21 and Java 17 before; runtimeMin records 21 for the current major. The lxware.cn pricing link is the version comparison page without its affiliate code.
