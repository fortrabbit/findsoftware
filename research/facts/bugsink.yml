notes: >
  The pricing page is not a separate URL: the homepage pricing section is anchored on /#pricing, so no pricingPage is recorded. The managed plans carry prices on the homepage; none are recorded. The self-hosted edition is free with "All Features" and "Unlimited users", and the paid "Premium Support" line is paid support, which is not an edition, so paidEdition is absent. The license sources are the LICENSE file at tag 2.6.2 (PolyForm Shield 1.0.0 for most content, BSD 3-Clause for the sentry directory, MIT for the Heroicons SVG icons) and ee/LICENSE, which says there is no public ee license and that the directory may not be used without a license from Bugsink B.V. Each license statement is its own entry. The licenseModel is left to the import rules, which read the ee/ statement as an enterprise part; the ee/ directory's content is not described on any page read, so nothing more is recorded. The GitHub API reports the license as NOASSERTION. The first release of the Python package is 0.0.1 (2024-02-21, PyPI upload history); the changelog starts at 1.2.0 (2025-02-11), and no GitHub release object exists before 2025-02-22. The only prerelease, 2.0.0a1 (2025-09-05), is older than 2.6.2, so no latestPrereleaseDate is recorded. The Docker install page says the quick throw-away instance uses SQLite and loses its data when the container is removed. The Docker Hub figure is the count for bugsink/bugsink, the image the installation page names. The pypistats figure is the last-month count. The homepage shows "1400+ teams use Bugsink every week" and "GitHub 2.2K" and these are not recorded as adoption fields. The homepage and about page name the company as Bugsink B.V. in Utrecht; the terms say the software is "provided by Bugsink B.V." and the governing law is the Netherlands. The Kubernetes guides are user-contributed manifests with no official guide, and the one-click platforms (Coolify, Caprover, Dokploy, Railway, PikaPods and others) are user-contributed or third-party listings, so no installMethod is recorded for them. The LinkedIn link has no field. The docs also describe Virtualenv install and Single Server Production with Gunicorn behind Nginx; Gunicorn gives runsAs always-on.