notes: >
  The npm package named "wasp" (version 1.0.11, 25 downloads in the last week) is not the one the install docs name, so it is not recorded. The install docs name @wasp.sh/wasp-cli, which the registry figures follow. The quick start requires Node.js >= 24.14.1; runtimeMin is the major. The homepage names Fly.io and Railway as the providers for the wasp deploy command and says a generated Dockerfile can deploy the server anywhere Docker runs. The deployment overview says the server app is built on Express and Node.js and comes with a Dockerfile. The copyright line reads "wasp-lang" without a legal form, so maintainerType is left to the import.
