notes: >
  Hosted-service record. Rename: the homepage and the FAQ state "Forminit is the new name for Getform.io" and "The platform rebranded from Getform to Forminit in January 2026", so the record follows the new product under the same id getform, with formerName Getform in these notes (formerName is not a starter field). getform.io answers by redirecting to https://forminit.com/, so the homepage is the redirect target. The company behind the service is UXPLUS LTD, the legal name on the terms page, with a registered office in London, England, which gives hqCountry GB; the privacy page gives the same address. The about page says the service was founded in October 2015; that is a founding date, not a release, so it is not recorded as firstRelease. The homepage footer and its structured data link X and YouTube profiles, which are recorded; the GitHub organization and npm package it also lists belong to the SDK and are not recorded. The terms page describes the service as "developed and operated by UXPLUS LTD". The docs list quickstarts for HTML, React, Next.js and Astro, and the homepage says the service validates every submission server-side. The pricing page lists a REST API for managing submissions and Zapier, Google Sheets, Slack, Discord and webhook integrations; the REST API is a coined kind, so it stays in these notes. The free plan allows 100 submissions a month; freeTier is a coined kind, so it stays in these notes, and the paid plans are hosted plan tiers, so no paidEdition. The pages call the service a headless form backend API, which is recorded as the forms category. The compare page for Formspree names alternativeTo formspree. A GitHub repository for the service is not named by its pages, so no repository is recorded. The homepage says Forminit handles receiving data, server-side validation, storage, email notifications, file uploads, webhooks, spam protection and integrations, and that "All features, accounts, and data carried over" in the rename. The security page states that application data is hosted in the EU, and that backups use AES-256 encryption.
