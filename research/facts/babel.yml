notes: >
  The install docs name @babel/core, @babel/cli and @babel/preset-env; the monorepo's core package @babel/core is the registry package recorded, so npmWeeklyDownloads and the ecosyste.ms counts are for @babel/core. npmWeeklyDownloads is the sum of the daily downloads from 2026-09-28 to 2026-10-04, the window the build-dev rules name. The GitHub releases are tagged v<version> across the monorepo; the highest stable release is v8.0.9 (2026-10-23), which matches the npm latest of @babel/core, and the first GitHub release in the list is v6.3.0 (2015-12-04). The project was published as 6to5 from the same repository (github.com/6to5/6to5, now babel/babel); the oldest npm upload of the 6to5 package is 2014-10-01, which sets firstRelease. The homepage announces Babel 8.0.0 as released; no end-of-life statement for Babel 7 was read. The maintainer line in LICENSE names Sebastian McKenzie and other contributors; the README says Babel "is maintained by a group of volunteers" and points to babeljs.io/team, which was not read, so the maintainerType is community. The runtime and runtimeMin come from the @babel/core package.json at the v8.0.9 tag. The Slack workspace and Open Collective donation page are community and funding links, not recorded fields; the GitHub stars belong to this repository, which is the Babel project itself. The hqCountry is not stated on any page read. The setup page lists integrations with build systems (Broccoli, Browserify, Gulp, Rollup, Webpack and others), test frameworks, and template engines; the README calls Babel a community-driven project used by many companies. The engines field of @babel/core at the v7.29.11 tag declares Node 6.9.0 or later, so the runtime minimum rose with major 8. The usage guide says the Babel modules are published as separate npm packages scoped under @babel, and that a babel.config file in the project root holds the presets.
