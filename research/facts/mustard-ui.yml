notes: >
  The project's own site is the GitHub Pages site kylelogue.github.io/mustard-ui, named as homepage by the repository and read here. The domain mustard-ui.com answers 200 with unrelated content (Japanese university entrance guide reviews), so it is not linked. The repository has tags up to v1.0.2 and no GitHub release; the registry latest is 1.0.4, dated 2020-02-28 on npm, which is the release date and major recorded. The import's four-year rule decides listing from that date. The site says the framework has no JavaScript and no CSS reset ("Mustard does not include a CSS reset such as normalize."), so no basedOn is recorded and the reset is not part of the package. The npm weekly figure is the sum of the daily counts for 2026-10-18 to 2026-10-24. The homepage and docs sit on GitHub Pages; the docs installation page is read at kylelogue.github.io/mustard-ui/docs/installation. The README says "Mustard UI is currently in release v1.0", which matches the npm latest.
