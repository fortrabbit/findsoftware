notes: >
  Repository only: the GitHub repository is the project's only web presence in the sources read, so no homepage is recorded. Accepted: a WebSocket library is a realtime backend part a site or app wires in, criterion 1 holds. The README title calls ws "a Node.js WebSocket library", and it says "This module does not work in the browser." and names the browser's native WebSocket object and the isomorphic-ws wrapper for shared code; no runsAs is recorded because the README states no process model. The README's protocol section also states that permessage-deflate is disabled by default on the server and enabled by default on the client, and that it adds significant overhead. The README's protocol section names HyBi drafts 07-12 and 13-17 and the permessage-deflate extension (RFC 7692); the Autobahn test suite is named as passed. Those are spec-compliance statements and stay in notes. The optional native modules bufferutil and utf-8-validate are separate packages, not recorded. maintainer: the LICENSE first copyright line names Einar Otto Stangvik (2011), and package.json at tag 8.23.0 names the same author; the other two lines name "Arnout Kazemier and contributors" (2013) and "Luigi Pinca and contributors" (2016), which are not recorded as maintainer. The GitHub owner is the websockets organization. currentMajor 8 is the highest stable GitHub release (8.23.0, 2026-11-12); the 7.x and 6.x and 5.x lines have releases in 2026 too. runtimeMin 10 is the engines field at tag 8.23.0. firstRelease 2011 is the oldest npm upload (0.2.6, 2011-12-04); the repository was created 2011-11-09. npm weekly downloads cover 2026-11-01 to 2026-11-07.
