notes: >
  The record covers the hosted Doofinder service. The GitHub repository doofinder/js-doofinder (the candidates row's repo, npm "doofinder" at 66 a week) is a JavaScript client for the search service, and doofinder/php-doofinder, pydoof and the platform modules (doofinder-magento2, doofinder-prestashop, doofinder-woocommerce) are client and integration code. None is the service's repository, so no repository is recorded and no npm, release or star figure is taken from them. The pricing page lists Basic, Pro and Advanced plans with monthly prices in euros; hosted plan tiers are no paidEdition, and no prices are recorded, and the plan request limits (for example "Up to 10k requests/month for each product") are not recorded because plan terms change. The docs landing page does not name an API style (REST, GraphQL), so headlessApi is not recorded. The site has no SSO, user-role, live-preview or self-hosting statement in the pages read, and the import path from other search products is not stated. The homepage and pricing page name Magento, PrestaShop, BigCommerce, Shopify and WooCommerce as platforms and "30+ other platforms" in a FAQ; the platform list is in the notes and not a field. The Spanish homepage links Twitter at twitter.com/doofinder; the English docs site links x.com/doofinder, which is the value recorded. LinkedIn (linkedin.com/company/doofinder) has no field. The HTTP Archive count is the mobile figure (desktop 10321). The terms page names the company as Doofinder S.L. with its registered office in Madrid; the privacy page gives the same name and address.
