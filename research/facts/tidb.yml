notes: >
  The TiDB Enterprise (Self-Managed) product is named in the legal page (a subscription schedule and an enterprise trial license agreement) and on the self-managed page, which calls it the former TiDB Enterprise Edition; no page read lists features the Community Edition lacks, and the subscription schedule was not read, so paidEdition is not recorded. The Community Edition is described as Apache 2.0 on the self-managed page, which matches the GitHub license; the page's "900+ contributors" and "39.1k stars" are not recorded, the GitHub API figures are. The LICENSE file has no copyright line; the legal entity comes from the privacy policy, which names PingCAP (US), Inc. as the controller of its sites and products. The pingcap.com page and the tidb.io page show the same content. The GitHub latest release is v7.5.8 (2026-09-17), a maintenance release on the 7.5 line; the highest version is v8.5.8 (2026-08-27), which sets currentMajor to 8. latestReleaseDate is the newest stable release by date (v7.5.8). Tags v26.3.x exist on GitHub without releases and are not in the docs release list, so they are not recorded. The homepage tidb.io redirects to pingcap.com; the homepage footer links a Slack community, LinkedIn and TiKV, which have no field here. The docs name no Docker image for TiDB, so the Docker Hub pingcap/tidb image is not recorded. TiKV, the storage layer named on the TiDB pages, is a separate project and not recorded here. The Docker Hub pull count is not recorded. The migration guide named in importsFrom is one of the Migrate pages of the docs; the alternativeTo entries come from the comparison index page. Fields coined here: none.
