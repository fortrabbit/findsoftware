notes: >
  The homepage and the docs site are a Next.js shell that serves no text to a plain request, so no quote is taken from them; the README names airbnb.io/visx as its Docs link and the gallery under it. The maintainer follows the LICENSE copyright line, which names Harrison Shoff for 2017-2018; the GitHub organization is airbnb, and the npm package lists other maintainers, so a reviewer decides whether the maintainer should be the organization instead. No parent is recorded: the README names no owner; CODE_OF_CONDUCT.md says Airbnb has adopted a code of conduct for project participants and that its moderators are Airbnb employees, which does not state who owns the project. The README FAQ says packages can be picked individually ("pick and choose the packages you need"). No basedOn is recorded: the README says visx "combines the power of d3" with "the benefits of react" and that it requires React 18 or 19 as a peer dependency, none of which is a "based on" statement; a reviewer decides. The monorepo is recorded as one record; the npm figure is the @visx/shape package the README names in its install line and its download badge, and the CSV figure came from a different package. Stars and contributors belong to the airbnb/visx repository, which holds all the visx packages. firstRelease is 2017 from the oldest GitHub release (v0.0.134, 2017-09-26); the @visx/shape package was first uploaded to npm in 2020, and the older GitHub release sets the year.
