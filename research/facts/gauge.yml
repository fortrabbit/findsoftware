notes: >
  The README's "Important note" says Gauge's official sponsorship ended in 2021, that the core team now looks at issues only in spare time with slower response times, and that users should consider Gauge only if they are prepared to adopt and support it fully on their own. The project is not declared ended or unmaintained in those words and releases continue, so the note is no end statement. The copyright line in the README's Copyright section reads "Copyright 2018 ThoughtWorks, Inc."; LICENSE has no copyright line, so ThoughtWorks, Inc. is the recorded maintainer, though the README says the sponsorship ended. The Gauge Google Group (groups.google.com, getgauge) is listed under "Engage" on the homepage; it is not the forum recorded, which is the GitHub Discussions the README names. Taiko, a browser automation project the README calls "maintained by Gauge", is a separate project, not a basedOn statement. The docs say step implementations can be written in Java, C#, Python, TypeScript and Golang; the language runners are plugins listed on the plugins page; no language runner is recorded as a runtime. The install page's route names are quoted from its own sentences; the npm route installs @getgauge/cli, the package named in the install docs. The Java, C#, JavaScript, Python and Ruby runners are plugins (gauge.org/plugins), not records of their own here. Stars and contributors belong to this repository. The first tag is v0.0.1, commit date 2014-05-20; the repository was created 2014-03-24. Categories are testing, from the docs overview's acceptance-testing sentence.
