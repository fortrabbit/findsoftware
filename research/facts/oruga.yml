notes: >
  The docs page at oruga-ui.com/documentation names @oruga-ui/oruga-next as the install package and states that "Oruga for Vue 2 (@oruga-ui/oruga)" is deprecated, with further work only on @oruga-ui/oruga-next; the old package's npm latest (0.7.0) carries a deprecation notice, which is a sibling package and no end signal for this record. The oruga-ui/oruga repository is the same project and is on its develop branch. The homepage footer reads "Copyright 2020-2026 Oruga UI", the organization; the LICENSE copyright line names Walter Tommasi and is recorded as the maintainer. Latest stable release v0.14.4 (2026-09-21), so currentMajor is 0. The oldest stable GitHub release is 2020-07-10. Adoption figures are for @oruga-ui/oruga-next, the package the docs name. The docs describe Oruga as shipping no built-in CSS, with components styled through a CSS class-mapping approach and ready-made themes for Bootstrap, Bulma, Tailwind and Oruga's own styles; each component can be imported on its own, and the Vue plugin registers the components on the app.
