notes: >
  Requirements from the getting-started page and the README: Docker with Docker Compose v2.20 or newer; the homepage shows Linux, macOS and Windows ("3 Platforms Linux · macOS · Windows"). The ./laradock ship command builds one image that the README says can run on Kubernetes, Google Cloud Run, AWS ECS, Kamal or a server; that is the deployed application, so no always-on runsAs is recorded for Laradock itself. The homepage's "5M+ Downloads From Docker Hub" is not recorded as reportedInstalls, since Docker Hub counts pulls, not installs. The README's service list (MySQL, PostgreSQL, MariaDB, MongoDB, Redis and others) describes service containers, not the software's own data store, so databases is not recorded. GitHub reports the language as Dockerfile, a value outside the import's language vocabulary, so the import will leave it out; the repository holds Dockerfiles and a shell CLI. firstRelease is 2016 from the oldest stable tag v0.2.0 (2016-02-17); the repository was created in 2015 and the README's "since 2015" is not a release date. The current major is 20 from tag v20.4 (2026-07-15), the highest stable release. The maintainer's name comes from the LICENSE copyright line; the README's maintainer table lists about twenty people, and the project's own site names no company. No country is stated.
