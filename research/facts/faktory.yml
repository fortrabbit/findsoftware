notes: >
  Faktory is the server only: the README and the license note say the Faktory client and worker libraries are not covered by the AGPL license, and the client libraries are separate projects that are not recorded here. The repository license is reported by the GitHub API as NOASSERTION; the LICENSE file is the AGPL-3.0 text, and the homepage table says AGPL for the open edition. The homepage table also names a commercial license for Faktory Enterprise, with prices and a dedicated support row that are not recorded; the Licensing wiki page says Enterprise is priced by concurrent connections and that a development mode runs without a key. Faktory Enterprise has a remote-Redis option and a Redis Gateway feature, recorded in the wiki only. The Redis dependency is embedded: the Deployment page says Faktory starts Redis as a child process. The wiki names AWS ECS and Render.com as deployment routes and the Kubernetes page in the wiki runs a single replica with a Recreate strategy; no deployTargets value is recorded. The Administration page says Faktory requires a 64-bit Linux image and a Redis binary in the PATH (the Docker image ships its own). firstRelease 2017 comes from the maintainer's project announcement "Introducing Faktory" dated 2017-10-24, which precedes the earliest tag in the repository (v0.6.0-1, with the oldest GitHub release v0.9.0-1 dated 2018-10-15). The maintainer is named in the README as Mike Perham; the legal maintainer is Contributed Systems LLC from the homepage footer. The homepage links to a Sidekiq site and a Sidekiq Mastodon account, which belong to a sibling project and are not recorded. The Ruby Users Forum link is the forum named in the README. No hqCountry statement was found on the homepage or the wiki pages read.
