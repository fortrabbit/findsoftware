notes: >
  Stub: the homepage links the repository github.com/hpakdaman/unfoldcms as the source, but the GitHub API and the link return 404, so the source cannot be read; the homepage says "Open-source under MIT License" while the getting-started page says "source-available software under a one-time commercial license", and whether the software is installable as open source or only as a purchased distribution decides listing, so a readable source repository or a settled license statement would settle it. The public docs describe a web installer and composer install, and the requirements page states PHP 8.2 or higher; the getting-started page names Laravel 12, which is not recorded as a basedOn version. Node.js 18 or later and npm are needed to build the frontend, per the getting-started page, and are not recorded as runtime. The docs and homepage name no legal entity, so maintainer is unknown. The pricing page also lists a free Community tier for personal use with a required "Powered by UnfoldCMS" footer, which sits beside the paid tiers; its terms are not recorded as a license. The alternativeTo entries come from the project's own vs-pages; the PHP headless CMS guide is not recorded.
