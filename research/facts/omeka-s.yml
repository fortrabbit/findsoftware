notes: "The maintainer is the copyright holder the README names, 'Corporation for Digital Scholarship', recorded as stated. The API reports v4.2.1 as the latest release; the install page names 4.2 as the latest version. The 'Omeka Classic Importer' module is listed in the user manual and is recorded as importsFrom, not as a migration path for every install. Omeka.net is a hosting service run by the same project; it is not recorded as a hosted-service candidate. The user manual is the documentation field; the developer documentation is at omeka.org/s/docs/developer/ and is cited for the REST API. No ended signal was found; status stays accepted."
