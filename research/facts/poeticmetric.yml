notes: >
  The repository the project names is the Forgejo instance at forgejo.localherd.org; the GitHub repository the CSV row lists is a mirror, and its repository description says so. The GitHub figures (268 stars, 1 contributor) are the mirror's. The Forgejo instance reports 20 releases, the newest stable one v2.0.0 (2026-02-27); its beta tags start 2025-10-05, which sets firstRelease. The GitHub mirror's contributor count is the one published there. The homepage also links code.unius.sh/poeticmetric/poeticmetric, a second forge, and a LinkedIn company page; neither is recorded as a field. The README spells the license "APGL-3.0" once and then names "GNU Affero General Public License version 3.0"; the record uses the second wording. Maintainer: the terms of service name WebGazer, Inc. as the contracting party ("the WebGazer, Inc. (PoeticMetric)") and its copyright line; the README and the project's manifesto are written in the first person by the maintainer, whose personal name no page in the sources gives. hqCountry follows the address at the top of the privacy policy, which names WebGazer, Inc. The self-hosting docs list SMTP settings, Google Search Console integration variables and a RabbitMQ password (RABBITMQ_PASSWORD) alongside the stores; RabbitMQ is a queue and stays in notes. The docs state the self-hosted stack as Docker images for linux/amd64 and linux/arm64 and a minimum of 2GB RAM (4GB recommended); these stay in notes. The architecture page says the backend (REST API, worker, scheduler) is a Go application and the frontend a Next.js application exported as static files and served by NGINX in the official image; language TypeScript comes from the GitHub language statistics. RabbitMQ is the message broker between the backend components. The team permissions page describes the organization owner role, which also covers billing on the managed service. Coined kinds, kept in notes: embedMethod (a script on the site), cookieless and privacyClaims (GDPR, CCPA, PECR and KVKK, as the README lists them), smtp configuration, googleSearchConsole integration.
