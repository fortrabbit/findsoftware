notes: >
  No homepage: the repository's homepage field is empty and the README names none, so the record links the repository only. The gemspec names David Heinemeier Hansson as author; the MIT-LICENSE copyright line names Basecamp, which is recorded as maintainer, the legal notice's name. The README says that with Rails 8 Propshaft is the default asset pipeline for new applications; this is not recorded as a field. The precompile copy into public/assets is a build output, not a statement about how the site is served, so runsAs holds local only, from the development server and precompile quotes. The runtimeMin is from the gemspec at tag v1.3.2 (required_ruby_version). The GitHub releases start at v0.2.1 (2021-11-09); the repository was created 2021-09-18, so firstRelease is 2021. The RubyGems downloads figure is the total for all versions. ecosyste.ms counts dependent packages and repositories for the rubygems.org package. The README "Migrating from Sprockets" section is a migration guide; Sprockets has no record, so it stays in importsFrom as a name, not a record id. The README says Propshaft has a configurable load path of directories from the app and its gems, that digest stamping lets assets use long-expiry cache headers, and that it makes all assets in the configured paths available for serving. The README says Propshaft was explicitly not designed to provide full transpiler capabilities, and that it digests CSS url() references to the digested file names, that precompiling leaves a manifest file that maps logical paths to digested names, and that development needs no precompile step; these are in the README, and the migration section says projects that rely on Sprockets transpiling need a Node-based transpiler instead.
