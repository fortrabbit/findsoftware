notes: >
  Doubt: the pages read do not show apps or websites submitting mail through the box. The homepage and README describe the box as the mail server for its own users, its control panel API and static website hosting; the guide's only relay sentence is "You may also need to configure relaying for outbound transactional email," which does not say a site or app submits mail to the box. Criterion 1 and the mail-server rule are therefore unsettled; a statement from the project's own pages that websites or apps send mail through the box's SMTP would settle it, and it would then be accepted. Boundary row in the CSV says the same. Coined fields: none. The homepage names iRedMail and Modoboa as more advanced options; neither has a fact file, so no alternativeTo is recorded. It also links a Slack chat room. The release line is v77 (published 2026-09-26); a v78 tag exists without a GitHub release, and the integer release number is a line, not a major, so currentMajor is omitted and v77 is recorded in latestReleaseDate. The LICENSE is CC0 1.0 Universal; the README says the box installs Postfix, Dovecot, Nextcloud, Roundcube and others, which are third-party components and are not records. The README says the install targets Ubuntu 22.04 LTS; that is an operating system, not a runtime, so no runtimeMin.
