notes: >
  The CSV homepage http://laktek.github.com/punch does not resolve (curl exit 000, no DNS), so the homepage is the project's live site at laktek.github.io/punch, which names the repository as its source and carries the Punch name and description. The repository is archived (API archived: true; the wiki banner says so). No GitHub release exists; the registry's latest is 0.5.46, published 2014-12-07, and that is the currentMajor source. The npm first version 0.0.1-beta dates from 2012-03-20, the same month the repository was created. The homepage links to two tweets as testimonials, not to project accounts, so no x field is recorded. The README lists inheritable layouts and partials, Markdown content and the Punch Guide wiki as its documentation; the wiki's Home page and the Quick tutorial are the pages read beyond the README.
