notes: >
  No source repository was found: GitHub has no apachefriends/xampp repository and GitLab has no project at that path, so the record is built from the project's own site and the SourceForge file host it names ("SourceForge has been hosting XAMPP since the very start!"). The license is stated as "XAMPP is a compilation of free software ... only the compilation of XAMPP that is published under GPL"; the contained products keep their own licenses, which the page asks readers to check, and no SPDX version is stated, so the value is GPL. The about page states "There are currently distributions for Windows, Linux, and OS X." The download page lists XAMPP for Windows at 8.5.12 (PHP 8.5.12) and says Windows XP and 2003 are not supported; the homepage still carries a 2023 news item saying Linux and OS X versions "will come soon", which is stale and not recorded. The SourceForge page carries the 8.5.12 Windows release date only in a title attribute, and the XAMPP Windows folder is dated 2026-10-23 as a last-modified value, so latestReleaseDate is not recorded; reviewer to decide. The download page lists phpMyAdmin with the stack and the XAMPP Control Panel; the homepage describes Apache Friends as a non-profit project to promote the Apache web server. The about page says the project was founded in 2002 and that XAMPP and Apache Friends are trademarks of BitRock; no first release year is stated on a page, so firstRelease is not recorded, and BitRock is not recorded as parent because the pages do not name it as the owner of the project. The about page says commercial use is free from XAMPP's point of view and points to the product licenses; no paid edition exists. The Bitnami mentions are team member statements, not a parent. The Windows FAQ describes the XAMPP Control Panel for starting and stopping Apache and MySQL, and the download page says the documentation is a set of FAQs.
