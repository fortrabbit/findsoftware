notes: >
  The homepage is stub-worthy: the only project site the sources name, www.seaside.st, fails TLS verification, so under the rule for dead homepages no homepage is recorded and status is stub; a read of https://www.seaside.st/ with a working certificate chain, or an official project page that states the status, would settle it. Every other criterion is readable: the README, the wiki and the GitHub repository show the MIT-licensed framework, an install path through Metacello in Pharo, GemStone, Squeak and VAST, and releases through v3.6.0 (2026-01-06). The highest stable GitHub release is v3.6.0, so currentMajor is 3; the oldest GitHub release is v3.1.3 (2015-05-25), while LICENSE.md copyright begins 2001, and no readable page states a first release year, so firstRelease is unknown. The GitHub organization is named Seaside and its profile holds no legal entity, so the maintainer is recorded as the GitHub organization's name; no legal form or hqCountry is stated. The README says Seaside for Squeak is unmaintained and lists a low traffic mailing list and a Pharo Discord channel; the Discord invite is recorded with its https form, the mailing list is linked over http only and is left out. Coined: none.
