notes: >
  The homepage is https and answers 200; the homepage also links the Developer's Guide and a template project. Clojars is the registry the install docs name (com.fulcrologic/fulcro); the downloads figure is the total across all versions. The tag fulcro-3.10.0 is the highest stable tag and the repository has no GitHub release objects (releases endpoint returns 404), so currentMajor comes from the Clojars release (3.10.0) and latestReleaseDate is the Last-Modified date of that release's pom on repo.clojars.org. Fulcro has no pre-release newer than that tag. The guide's client side compiles to JavaScript with shadow-cljs and its server setup names Ring and http-kit ("a common easy-to-use HTTP server is http-kit"); neither is stated as runsAs in a page, so runsAs is left out. The homepage says "Commercial Support Available from Fulcrologic, LLC" and "Contact us for more information"; that is consulting, not a paid edition. The homepage says "Fulcro picks up where Om Next left off", a successor statement not recorded as a field. The About page describes the company as founded in 2017 by Tony Kay, the maintainer of the Fulcro libraries; the country is not stated on any page read.
