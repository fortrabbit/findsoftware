notes: >
  The maintainer is the copyright holder on the MIT LICENSE, Automattic; no page read names its legal form, country or a full address, so hqCountry is absent. The repository is a single package. The default entry runs in Node.js; juice/client is the browser entry, which exposes the inlining functions but not the file or remote-resource ones (no runsAs, since the project names both Node and the browser). Juice is ESM-only as of v12. The repository's README lists a PROJECTS.md page of projects that use Juice; no field takes it. The npm figure is the juice package the README names; the sums are daily downloads for 2026-11-01 to 2026-11-07. The stable release list starts at v1.0.2 (2015) on GitHub; the tags 0.0.1 to 0.0.3 date from 2011, and npm starts at 0.0.1 on 2011-10-09, so firstRelease is 2011. Rules that use pseudo-classes such as :hover cannot be inlined and stay in a style tag, per the README. The functions take an HTML string, a file, a cheerio document or remote resources, and the command-line tool works on files and directories. The README lists HTML emails and embedded HTML in third-party websites as its uses. The options object controls media queries, font faces, table attributes and template code blocks such as EJS, Handlebars and FreeMarker. The homepage is the GitHub Pages site the repository names, and the README links it as the web client to try the library.
