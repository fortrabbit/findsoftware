notes: >
  The install.sh script and the Helm chart are shown only as commands in the README, so their installMethod entries carry no quote; the Docker route has a sentence on the docker deployment guide. The README credits Plausible Analytics: "vince started as a Go port of Plausible with a focus on self hosting". A port is not a fork or a based-on statement in the project's words, so no forkOf or basedOn is recorded; the Plausible relation is alternativeTo from the README's own drop-in sentence. The README says existing Plausible scripts can point at a vince instance, and the script is "< 1KB" (the README table lists it as "<1KB script"): embedMethod is a script tag, coined and kept here. The homepage describes custom storage based on Compressed Roaring Bitmaps in columnar storage, and the logs show a Pebble store under vince-data; those are storage facts that the list lacks, so they stay in notes. The project's own pages list no hosted offering and the README's comparison table marks enterprise features and hosted offering as absent, so paidEdition and hostedOffering are not recorded. The about page is the source for the server process statement; the README's "start server" command is shown as a shell line and is not quoted. The maintainer is an individual named in the footer; no company or address is given, so hqCountry is absent. The repository license is the AGPL-3.0 text, and the releases page lists the first release as v0.0.6 on 2023-06-02 (the oldest in the paginated list).
