notes: >
  The homepage is https and answers 200. The legal page gives the imprint of Andreas Nägeli, individual, with an address in Ehrenkirchen, Germany; the imprint is headed "Legal information regarding GenHTTP.org" and names an individual, so hqCountry is the maintainer's country. The support page says GenHTTP "is led and supported by senior engineers from a Swiss IT service provider"; no parent is recorded because the page does not name the company. The support page offers commercial options (workshops, prioritized development, consulting); these are services, not a paid edition. The documentation says the framework is "Similar to other frameworks like Nancy, embedio, NetCoreServer, or Watson"; this is a comparison, not a recorded alternativeTo. The Liquid Pages handler is a third-party package by Kinetq, and the documentation says so; it is not recorded as templating. The Dockerfile in the hosting documentation uses .NET 11 images; the homepage states .NET 10 as the minimum, which is recorded. The Localization concern is recorded as i18n: yes because the page describes a concern that serves content by language; the page shows a single concern, not a full translation workflow. The NuGet total downloads figure is the search index total for GenHTTP.Full. The Kestrel and ioxide engines are documented under Server Engines but are not recorded as fields. The Links page lists projects built on the webserver engine; these are not plugins of GenHTTP.
