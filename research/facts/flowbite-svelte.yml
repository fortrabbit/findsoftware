notes: >
  The homepage and the docs site answered 429 (rate limit) on every retry in this run, so the homepage is recorded from the npm package's homepage field (api) and the docs from the docs source in the repository (src/routes/docs/pages). Re-read the live site before a publish. The current major is 1: the newest GitHub release is v1.33.1 (2026-04-07), and the 2.0.0-next tags are prereleases, the newest of which (next.14, 2026-04-02) is older than the stable release, so no latestPrereleaseDate is recorded. The package peer-depends on Svelte ^5.40.0 and Tailwind CSS ^4.1.4, read from the npm registry; a Node minimum is not stated on any page read. The LICENSE names the creator Shinichi Okada as the copyright holder, and the npm package's author field names him too; no legal entity is named. The GitHub repository reports CSS as the largest share of its code, followed by Svelte; the language is recorded as TypeScript from the package manifest's types entry, which ships declarations for every component. The Discord link is the Flowbite server the README names; it is shared with flowbite-react. firstRelease is the npm first upload (0.6.0, 2022-02-25). Contributors counts contributor accounts from the API list with per_page=1, read from the Link header (161). No paid edition appears on any page read.
