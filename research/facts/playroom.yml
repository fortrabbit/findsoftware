notes: >
  The LICENSE file titles the license "MIT License", the same license the GitHub API reports as MIT. The repository is a pnpm workspace on master; the public package is the one the install docs name, playroom, which is the root package of the v1.4.0 tag (package.json, name playroom, engines node >=18.12.0). The npm package lists the GitHub README as its homepage, so no homepage is recorded. The maintainer is the LICENSE copyright line, "SEEK"; the SEEK terms page (https://au.seek.com/terms) names the contracting company SEEK Limited and does not name Playroom, so the legal name is not recorded. The terms page and the about page give no headquarters statement; the about page says SEEK was "Founded in Melbourne, Australia in 1997", which is a founding fact and is not recorded as hqCountry. No runsAs static is recorded: the README says the build is a "standalone bundle that can be deployed alongside your existing design system documentation" and does not say the output is static files. The Storybook integration (storybook-addon-playroom) is a third-party project and is not a parent. The npm weekly figure is the sum of the 2026-09-28 to 2026-10-04 range.
