notes: >
  The repository has no releases and no tags, so the criterion 4 date is the committer date of the newest commit on main, read from the commits endpoint, and the record is listed as active. The install path is the shadcn CLI registry at reactbits.dev under the @react-bits namespace, which meets criterion 2 as a copy-paste collection. The README also names a jsrepo command against the same registry; the install guide names the shadcn CLI and copying by hand. LICENSE.md reads "MIT + Commons Clause License Condition v1.0": the components may not be sold, sublicensed or redistributed, while exported code and images may be used in any product, including paid ones. The introduction page calls the library "open source", and the README badge reads "License: MIT + Commons Clause". GitHub reports the license as NOASSERTION, so no SPDX id is recorded. The license covers the React Bits tools (Background Studio, Texture Lab, Shape Magic, Center Stage, Sound Lab) and the sounds in the same way; those are web tools on the same site and are not recorded as software of their own. The Pro tier sells one-time access to additional components, blocks, templates and an agent kit; the page's prices are not recorded. The maintainer is recorded as the LICENSE copyright line states it, "David Haz", with the GitHub account DavidHDev as the owner of the repository. Contributors and stars are from the repository API on the check date.
