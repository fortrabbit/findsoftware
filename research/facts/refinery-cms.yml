unreadable: ["https://www.refinerycms.com/ (403 to the research client; the README says the website is not currently live; its download and extensions pages were not requested)"]
notes: >
  The homepage is not linked: the README states "our website is not currently live", and refinerycms.com answers 403 to the research client, so no homepage is recorded and the repository and the guides in doc/guides carry the facts. Install steps exist in the repository's guides and the README, so criterion 3 holds. The README and the getting-started guide also give a Rails application template at refinerycms.com, which is not recorded as an install route because that website is not live. The README says the Docker guide's app runs behind an Nginx proxy with Puma as its application server; renderingModes is not recorded because no page states a rendering mode. The prerequisites guide states Ruby 3.2 and later, and the RubyGems entry for the latest release declares Ruby 3.1 or later; both are recorded as runtimeMin. The guides say they are written for Refinery 3.x and 4.0.0 in places, so the stated Rails and Ruby versions are taken only from the README and the prerequisites guide. The license MIT is stated by the README, license.md and the gemspec. The copyright holder in license.md is "Resolve Digital" with no legal form given, so the maintainer is recorded as the project states it. The user-role feature the README describes is per-extension access control for each user (users only get access to the extensions assigned to them), recorded here as notes only because no userRoles value fits. Authentication uses Devise per the README. The x link is the twitter.com address the README gives. The rubygemsDownloads figure is the total, not a period figure.
