notes: >
  The CSV homepage http://asika32764.github.io/vaseman answers 301 to about.asika.tw/vaseman/, the project's own site, so that site is the homepage. The README names the GitHub repository as its documentation. The repository has no LICENSE file; the license is the MIT line in composer.json, which Packagist also lists for 4.0.9. Packagist lists LGPL-2.0+ for the old 3.0-RC5 only, which is not the current line. The GitHub repository description says the project supports Twig and Blade, but composer.json has no Twig dependency and the site names only Blade, so only Blade is recorded. The Packagist stable line is 4.0.9 (2025-05-31); the GitHub latest release 4.0.4 (2022-06-29) is older and is not used. The maintainer is the author named in composer.json; the GitHub profile names a company, but no page for the software names it as the maintainer, so it is not recorded. The site footer says "Powered By Windwalker Framework" and composer.json requires windwalker/core; no record has a windwalker id, so basedOn is not recorded. The repository was pushed on 2025-05-31 and is not archived, and the package is not abandoned or deprecated, so no end signal applies. The site footer reads "Copyright © 2022 Vaseman"; this is not an end signal.
