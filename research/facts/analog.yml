notes: >
  The homepage shows build output in dist/client and dist/ssr, while the getting-started docs state dist/analog/public and dist/analog/server; the docs value is recorded because it is the documented one, and the homepage paths are not recorded. The docs recommend Node 22 and higher; the repository root package.json lists engines node ^22.22.3 || ^24.15.0 || ^26.0.0 for the monorepo, which is not recorded as the runtime minimum. The docs require Angular v17 or higher; the record uses the README's "meta-framework for Angular" for basedOn and does not record the v17 floor. The README names Nx and CodeRabbit as sponsors and Zerops as a partner; these are not fields. The company or team behind Analog is not named on the pages read; "free, open source" comes from the homepage. The deployment section named in the docs sidebar was not fetched, so deployTargets and serverNeeds stay unknown. The GitHub contributor count is capped at the first API page.
