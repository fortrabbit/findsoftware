notes: >
  Status accepted. Criterion 1: a test-time library that builds mock objects for Rust code; the README says it is "typically ... only used by unit tests", so runsAs is not recorded. Criterion 2: installed as a dev-dependency from crates.io, which the README names in its Cargo.toml example; the crate version 0.15.0 on crates.io and the GitHub tag v0.15.0 agree. Criterion 3: the Usage section gives the Cargo.toml line. Criterion 4: the repository is not archived and has commits through 2026-11-03 (pushed_at); the repository has tags but no GitHub release objects, so latestReleaseDate is the crates.io publication date of 0.15.0. The version is 0.x, so currentMajor is 0; the minor line 0.15 goes to notes. The repository has no homepage of its own: the GitHub repository and docs.rs are the only pages, so homepage is not recorded. The firstRelease year is the oldest crates.io upload, 0.1.0-pre and 0.1.0 on 2019-07-03; the oldest git tag v0.2.0 is dated 2019-08-03, the same year. The license line in README says the crate is "primarily distributed under the terms of both the MIT license and the Apache License (Version 2.0)"; the crates.io metadata of 0.15.0 reads "MIT OR Apache-2.0", and GitHub detects Apache-2.0 for the repository. The MSRV is stated in the README as Rust 1.77.0 and higher, and the crates.io rust_version of 0.15.0 is also 1.77.0; the README adds that the MSRV will not change without bumping the major or minor version. The GitHub user asomers has the name Alan Somers, and the LICENSE-MIT copyright line gives the same name.
