notes: >
  The FAQ on cot.rs/faq/ names Rinja as the server-side template engine, while the current templates guide names Askama; templating is recorded from the guide and the FAQ statement is left out. The FAQ also says Cot is inspired by Django, which is an inspiration, not a parent, so no basedOn. The guide lists the framework's admin, authentication and forms in its chapters; sso and i18n were not found in the guide index or the pages read. No page read states that a Cot application runs as a long-running process or how to deploy it, so runsAs is left out. The framework comparison page says Cot is built on top of Axum. The cot-cli package is the install entry point; the library crate cot is the registry figure. The GitHub API license of Apache-2.0 is one choice from the dual license the project states on its licenses page. The first GitHub release is v0.1.0 of 2025-02-18; the cot crate name on crates.io has an earlier 0.0.1 upload of 2018 that the project does not describe. The guide states Rust 1.88 as the minimum while the crates.io rust_version of cot 0.7.0 is 1.94; both are recorded and conflict. The contributor count is taken from the paginated contributors endpoint.
