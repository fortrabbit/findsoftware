notes: >
  Rolldown is the bundler the Vite homepage names as its underlying bundler ("The unified bundler powering Vite 8+"); that is a use by Vite, not a basedOn statement, and the README's credits name Rollup and esbuild as inspirations and oxc and napi-rs as dependencies, so basedOn is not recorded. The README says the project partially contains code derived or copied from rollup and esbuild, both MIT, listed in THIRD-PARTY-LICENSE; that is no separate license statement. The parent is VoidZero Inc., the direct owner, per the README's "Rolldown is a project of VoidZero". The voidzero.dev banner "VoidZero is joining Cloudflare" is an announcement about VoidZero, so Cloudflare is noted here and not recorded as a parent. The copyright line names VoidZero Inc. and the voidzero.dev footer repeats "© 2026 VoidZero Inc."; no country is stated, so hqCountry is absent. The homepage also links twitter.com/rolldown_rs next to x.com/rolldown_rs; the x.com link is recorded. The npm package rolldown reports a creation date of 2017-01-01, before the repository was created (2023-09-18); that history is not this project's, so firstRelease uses the oldest GitHub release (v0.10.0, 2024-04-01). The first stable GitHub release that is not a beta or release candidate is v1.0.0 (2026-05-07); the 1.0.0 beta and rc tags are prereleases by name, and no prerelease is newer than v1.2.15, so latestPrereleaseDate is absent. The runtimeMin is the lower bound of the engines range on the 20 line; the range also allows 22.12 and later. The ecosyste.ms endpoint returns one dependent package and two dependent repositories for rolldown; recorded as returned. The npm weekly figure is the period 2026-09-28 to 2026-10-04, as the build-dev rule sets.
