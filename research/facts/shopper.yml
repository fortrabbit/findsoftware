notes: >
  The framework package is shopper/framework on Packagist, which the install docs name. Its source is the read-only subtree shopperlabs/admin, whose description points to shopperlabs/framework; the monorepo shopperlabs/shopper (the repository recorded here, and the one the CSV names) holds the same code and its composer.json is named shopper/shopper. The LICENSE.md copyright line names Arthur Monney with no legal form, recorded as stated. The docs site is Mintlify; the v1 pages say v1 is no longer maintained, and the current docs are v2 (the version recorded is the Packagist stable v2.12.0). The homepage describes Shopper as headless, and the docs say the storefront is built separately, but no API reference was read, so headlessApi is not recorded. No runtime or deployment page states whether the live site runs per request or as a long-running process, so runsAs is not recorded. The v2 docs list the Stripe payment driver as a first-party package under shopper/stripe; no paid edition was found. The installation page is the only deployment reference read; Laravel Herd, Valet and Docker are named as development environments on the requirements page. The contributors count is the default GitHub contributors listing, which excludes anonymous contributors; the project's own page shows 22 with anonymous contributors included.
