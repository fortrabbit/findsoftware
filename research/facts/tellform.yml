notes: >
  Status discontinued: the repository is archived (api, archived true) and the README states the project is no longer maintained and its issues board is closed, so the two status facts are the archive flag and that statement. The README also says the project's code moved on to a fork, OhMyForm (ohmyform.com, github.com/ohmyform/ohmyform), and the fork is a candidate of its own with no fact file here; the successor relation is the project's words, not recorded as successorOf because the ohmyform fact file does not exist yet. The homepage tellform.com still answers and describes the software as "Host it yourself"; the status is set by the README and the archive flag, not by the homepage. Versions: the highest stable GitHub release is v1.3.0 (2016-04-23, the only release and the only tag); the master README title and master package.json say 2.1.0, and the v1.3.0 package.json says 1.2.1 with engines node "~5.0.0" while master says "6.x.x", so runtimeMin is not recorded and the disagreement is left to a reviewer. The v1.3.0 release body calls the release alpha, and the release is not marked a prerelease; a reviewer may decide whether currentMajor 1 holds. The license: LICENSE.md says MIT; the GitHub API reports NOASSERTION because the file does not parse as a standard license; package.json says MIT. The repository has no legal name for the maintainer in its files; the GitHub organization tellform is recorded as the maintainer because nothing else names one. The README features list "Embeddable Forms", "Forms as a Service API", "Native Analytics and Google Analytics Support" and "Custom Subdomains for each User"; these are recorded in notes only, as is the Redis requirement, which the configuration table makes needed only with ENABLE_CLUSTER_MODE. The Docker setup in the README points at the docker_files repository, and the README says the Docker file is out of date; the installation instructions list only Docker and the AWS AMI route, which are not recorded as installMethod entries because the Docker route is stated to be out of date. The social links in the README are inside HTML comments and are not recorded. Contributors: 31 pages at one per page, from the rel="last" link.
