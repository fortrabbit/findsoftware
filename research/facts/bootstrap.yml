notes: >
  The homepage shows v6.0.0-alpha.1 as the current release and Bootstrap 5 as the latest stable line; currentMajor is 5 from the npm latest tag, which is the stable release.
  Two license statements: code under MIT (repository) and docs under CC BY 3.0 (homepage), each its own entry.
  Maintainer type is community because the page names a team and contributors and no company; the npm author field reads The Bootstrap Authors.
  GitHub reports the repository language as MDX, which describes the documentation site, so no language fact is recorded.
  Contributors counts contributor accounts from the API list with per_page=1, read from the Link header.
