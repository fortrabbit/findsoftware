notes: >
  No homepage: the repository's homepage field is empty and the npm package points to the GitHub README, so the repository is the project's only site and homepage is absent. The README lists Google Fonts and local fonts as the supported font services; these sit in the README and are not a fact field. The --dynamic option traces fonts in a headless browser, which is a tool option and not a runsAs browser value. The README runs subfont on the files a site is ready to deploy to a static file hosting service, and it documents a -subfont-text property on @font-face and a --text switch for extra characters in the subsets; these are notes only. The npm package is the subfont package the README installs. The highest stable GitHub release is v6.0.0 (2021-04-18), while npm latest is 7.3.0 (2026-09-20) and the v7.x tags have no GitHub release; the registry major is higher, so currentMajor is 7 and latestReleaseDate comes from the registry. The npm first upload 1.0.0 is dated 2017-09-04, older than the oldest GitHub release v1.1.0 (2017-10-05), so firstRelease is 2017. The LICENSE copyright line names the maintainer as Peter Brandt Müller, the npm author as Peter Müller; the LICENSE line is recorded. No maintainer legal form or country is stated, so hqCountry is unknown. The repository and npm figures describe the project's CLI package, which is the install target.
