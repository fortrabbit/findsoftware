notes: >
  The homepage is the GitHub Pages docs site named by the repository's homepage field. The repository README is short and links the same docs site. The repository is an organization (python-babel); the LICENSE copyright line names Armin Ronacher, so that name is recorded as maintainer. The tag 4.1.0 exists without a GitHub release or PyPI upload, so it is not the current major line. The docs site says Flask-Babel is built with "babel, pytz and its own copy of speaklater": Babel here is the Python package, and the babel record in this dataset is the JavaScript compiler, so no basedOn is set for it; pytz and speaklater are named in the docs. The README says "This is based on the Python babel and pytz modules." firstRelease is 2010 from the oldest tag, 0.5.1, whose commit is dated 2010-05-29; the GitHub repository was created the same year. The pyproject.toml at tag v4.0.0 declares python ^3.8, which is the runtimeMin. The PyPI figure is the pypistats last-week count; PyPI's own API reports no downloads. The docs say Flask-Babel "requires Jinja >=2.5", a dependency, not recorded as a field. The GitHub API reports the repository license as NOASSERTION; the LICENSE file is BSD 3-clause, recorded from the file text.
