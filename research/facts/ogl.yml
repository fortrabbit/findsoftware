notes: >
  Accepted: a WebGL library installed with npm, from a CDN or as a zip, under criterion 2 and 3. The repository has no LICENSE file and no tags or GitHub releases, so GitHub reports no license; the license is recorded from package.json at master and the README's Unlicense section, and the npm registry gives Unlicense as well. The registry is the release source: the npm version 1.0.11 is dated 2025-01-27, and its first upload 0.0.1 is dated 2018-06-03, about a week after the repository's creation. The README says the Math component is "an extension of gl-matrix", a library with no record in this dataset, so no basedOn is recorded. The README compares the API with ThreeJS ("the API shares many similarities with ThreeJS"); that is a description, not an alternativeTo statement, and is left out. The README says the library is written in ES6 modules with zero dependencies; that is in the README but no field holds it. No sentence in the README or package.json says the library runs in the browser, so runsAs is left out, although its examples append a canvas to document.body. The maintainer is the package.json author, an individual; the GitHub owner oframe is an organization with no name set. The GitHub page's homepage field is the examples site, a GitHub Pages site the repository names. Contributors and stars are for the repository.
