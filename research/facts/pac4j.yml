notes: >
  The repository has no GitHub releases; it tags each module (pac4j-parent-<version>, pac4j-<version>, scribe-up-<version>). The registry therefore sets currentMajor and latestReleaseDate: Maven Central's pac4j-core metadata names 6.6.1 as the release, and the parent tag for 6.6.1 is dated 2026-11-04 as well. The docs index shows a 6.7 line, which is ahead of the stable release and not used. firstRelease is 2013 from the oldest tags and the first Maven Central upload (1.4.0, both 2013-04-22); the homepage's "Open source since 2012" is a statement about the repository, which was created in January 2012, and is not used as a release. The maintainer is the name the homepage footer gives ("Made by Jérôme LELEU and other volunteers"); the LICENSE carries no copyright line, and no legal entity or country is stated. The sso value follows the README sentence naming the login protocols; LDAP, Kerberos and JWT appear in the README as authenticators or other mechanisms and are not sso values here, and the reviewer may decide whether a client library takes sso at all. The pac4j README names frameworks it integrates with (Spring Boot, Jakarta EE, Play, Vert.x and more) and the products that embed it (Apereo CAS, Apache Syncope, Apache Knox); none is a basedOn or importsFrom statement. The framework integrations Lagom and Akka HTTP are archived in separate repositories and Pippo is inactive, per the homepage; they are not separate records here. The commercial support page is a support offer, not a paid edition or pricing page. The homepage's mailing lists are not the project's forum field. Contributors counted with per_page=1.
