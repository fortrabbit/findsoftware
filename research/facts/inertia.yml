notes: >
  The CSV repo column names inertia-laravel, the PHP adapter; the core repository is inertiajs/inertia (TypeScript), recorded as the first repository entry, and the adapter stars are a second entry. The CSV star figure (2.5k) is the adapter. The homepage says "Inertia works with Laravel, Rails, Django, Phoenix, and more", so no basedOn is recorded. The docs say the Laravel adapter is official and others are community adapters, which is why no maintainer is recorded: the pages read name the Laravel adapter as official but not the company behind the core. Endoflife.date has no Inertia entry. The npm @inertiajs/core package declares no engines field, so runtimeMin comes from the PHP adapter only.
