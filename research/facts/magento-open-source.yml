notes: >
  magento.com redirects to business.adobe.com, whose pages timed out, so the README in magento/magento2 is the self-description source. Magento Open Source is not on Packagist: Composer installs come from repo.magento.com and need Marketplace access keys, so no download figures were found. Adobe Commerce is the paid product built on it; the README recommends it "for those who need a full-featured eCommerce solution", but its price was not readable. The lifecycle, schedule and web API pages speak of Adobe Commerce only and never name Magento Open Source. GitHub's releases/latest returns 2.4.10-alpha1 because it is not flagged as a pre-release; 2.4.9 is the newest stable tag. endoflife.date lists PHP 8.5 for 2.4.9 while composer.json allows ~8.3 to ~8.5. Contributors counts GitHub accounts, anonymous excluded. Coined: latestPrerelease.
