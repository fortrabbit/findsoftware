notes: >
  Discontinued: the repository is archived on GitHub (api, read 2026-10-23), and the repository is the project source the README links for its wiki and contributing guide. The README gives no statement of end, so the status rests on the archive flag alone. No homepage is recorded: the repository is the only project site, and the npm homepage field points to the README. The npm package frontpress has a 1.0.2 upload dated 2016-11-17; the GitHub release v0.1-beta.1 (2016-07-09) is a prerelease and v0.1-beta.2 carries a beta tag, so firstRelease comes from the oldest npm upload, 2016. The LICENSE.md copyright line names "Teles", and the name is recorded as the project states it because no legal name is given on any read page. The wiki pages the README links all resolve to a page that says the documentation is under construction.
