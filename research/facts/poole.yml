notes: >
  Stub: criterion 5 is in doubt, since the maintainer is an individual and the project's own pages name no adoption figure; the sites list on the project wiki at man.sr.ht names about two dozen websites without a count, so no figure is recorded. A figure from a primary source would settle it. The repository has no tagged release (its tags page lists only tip), so no release fields are recorded, and lastCommitDate is the date of the tip commit a4d630823083, which sourcehut shows in the commit's timestamp rather than in visible text; the import will move the record to stub on its own because the last commit is more than four years old. The repository is on sourcehut, and the repository page is the only project page; no separate project site is named, so no homepage is recorded. The source header of poole.py states GPL version 3 or any later version; the poole.py copyright line names Oben Sonne with the year 2012; the sourcehut account is "~obensonne", and the name is recorded as the copyright line states it. The install steps are the README's clone and make, and the tarball of the default branch is the only download the forge offers. The README needs the Python Markdown module (pulled in by make) and shows both Python 2 style and Python 3 style print calls, and poole.py itself imports Python 3 modules, so runtimeMin is not recorded. Language and runtime rest on the poole.py shebang line.
