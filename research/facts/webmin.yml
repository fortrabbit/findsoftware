notes: >
  Accepted by Frank on 2026-10-30 as a server admin UI that manages web servers and websites; the CSV row said boundary. The homepage and about page say it configures system internals and "control[s] open-source apps, such as BIND DNS Server, Apache HTTP Server" (about page), and the docs list Apache, Nginx, PHP and MySQL modules, which is the statement the boundary rule asks for. The GitHub homepage field is http://www.webmin.com/; https://webmin.com answers 200, so the https form is recorded. The GitHub owner webmin is a user account. The about page's "over 1,000,000 installations worldwide" (2017) and the homepage's "about 1,000,000 yearly installations worldwide" (current) differ; the current wording is recorded and the other goes here. The homepage's Forum link is the Webmin category on forum.virtualmin.com; the same developers run Virtualmin, which the virtualmin record notes is a Webmin module; Frank adds basedOn webmin to virtualmin himself, so virtualmin.yml is not edited here. Usermin is a sibling product of the same codebase and is not recorded. Virtualmin Pro and paid developer help are not Webmin editions; the about page offers developer help "for a price", which is paid support, not an edition. Supported systems: the about page lists more than 150 operating systems and distributions, not recorded as a field; the download page names RHEL and derivatives, Debian and derivatives, Solaris, FreeBSD and source installs. runtimeMin is absent: the about page names Perl version 5 without a minimum, and the FAQ says only how to build Perl from source. The highest stable GitHub release is 2.670 (2026-09-21), prerelease false; 97 releases exist, the oldest being 1.700 (2014-08-12), which is later than the changelog's oldest dated entry (April 2004) and is therefore not used for firstRelease. The © line on the changelog page reads 1997 to 2026, which is not a first release date. Contributors counted with per_page=1 and the rel="last" page, which is 133. Social links: none found on the homepage or the about, download, FAQ or docs pages. The docs page exposes a table of modules; the module list is not recorded field by field. Fields coined: none.
