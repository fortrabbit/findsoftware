notes: >
  The project's own site and README both state the end: the homepage says the maintainers decided "to archive the project", and the README heading reads "No Longer Maintained". The repository is archived and the Packagist package is flagged abandoned. The last commit is dated 2020-05-19. The highest stable GitHub release is 0.12.7 (2018-03-07), so currentMajor is 0, following the import rule for 0.x. The docs page says "Anchor CMS is no longer in active development". The site links http://twitter.com/anchorcms and the readme links http://forums.anchorcms.com/; both are plain http, so neither is recorded. The Packagist package lists a PHP requirement of ">=5.6" for 0.12.7; the README states "PHP 5.6+" and "MySQL 5.6+". The composer.json on master also requires "php": ">=5.6", the same minimum as Packagist. The license file is the GNU GPL version 3 text; the GitHub API reports GPL-3.0. The site's footer carries "© 2021" but no legal form for the maintainer team, so the maintainer is recorded as the project states it. The README requires MySQL 5.6+ and recommends 5.7; the databases field records both mysql and sqlite because the readme names pdo_sqlite as an option.
