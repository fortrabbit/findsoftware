notes: >
  Status accepted: the repository is not archived, no page states that the project has ended, and no registry applies.
  maintainer is the name the license page and footer state, with no legal form; maintainerType is left to the import.
  Docs, requirements and about pages are the project's own site; the docs page lists the Docker image and cPanel install options without a separate page, so both are cited there.
  The requirements page states Apache, NGINX and IIS server configs; no runsAs value beyond per-request is stated.
  firstRelease is not recorded: the about page says the project was developed since 2008 and open sourced in 2010, which is a development date, not a first release, and the GitHub repository was created in 2013.
  contributors is the page's rounded count ("Over 50"), not an API count.
  The homepage states in-place editing and a theme and plugin installer; neither maps to a starter field, so neither is recorded.
  The about page says the site data is saved to a text file (database.js) in JSON format, and that all files can be copied to move, back up or restore a site.
  The docs list server configurations for Apache, NGINX, IIS and Caddy.
