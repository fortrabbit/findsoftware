notes: >
  Status accepted: the repository is not archived, no page states that the project has ended, and no registry applies.
  www.wondercms.com answers 403 to the research user agent, so every fact is cited to the repository: the README at .github/README.md, the license file and the GitHub API.
  homepage, docs and forum are the URLs the README links; the README is the cited source, the linked pages are unreadable.
  maintainer is the copyright line in the license file; maintainerType is left to the import.
  The README states PHP 7.4 or greater; index.php refuses to run below PHP 7.2, which is a code check and not recorded.
  The README names Apache, NGINX, IIS and Caddy and does not state how the process runs, so runsAs stays unknown.
  The README says the site data is stored in database.js in JSON format and that moving a site means copying the files; the earlier databases value none is dropped, since no readable source states it.
  The earlier contributors figure (over 50) came from the blocked homepage and is dropped; the GitHub API lists 10 contributors, which is not recorded.
  firstRelease is not recorded: the README badge says the project was founded in 2008, which is a founding year, not a first release, and the GitHub repository was created in 2013.
  The README lists a theme and plugin installer, 1-click updates and backups; none maps to a starter field.
