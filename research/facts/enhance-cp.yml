notes: >
  Enhance is a commercial control panel: its terms license the software per website and the pricing page prices the licence, so no paidEdition is recorded. The terms define the software as "micro-service-based software" and the FAQ says the frontend is React and TypeScript with Rust underneath; no page states that the server ships as a native binary, so no runtime is recorded. The install guide requires Ubuntu 24.04 LTS on x86_64 and lists the requirements that rule out ARM and containers; the install script installs its packages with apt. Web servers Apache, Nginx, LiteSpeed and OpenLiteSpeed are offered per server, and PHP 5.6 to 8.5 runs per website, both stated on the technology page; no field records them. The release-notes page lists 12.26.4 as the latest release dated 29th October 2026, which replaces the 12.25.14 in the CSV row. No first release date is printed on any page read, and the release notes list only back to Core 9.1.2 (26 March 2023) before an "older release notes" link that points to the same page; firstRelease is left out. The terms name Enhance Hosting Automation Ltd (company number 11757770) with a registered office in Beaconsfield, England; the footer gives the same company name in upper case. A LinkedIn company page is linked from the homepage footer; no social field for it exists yet. No page states whether the source is published, so sourcePublic is left out. The homepage shows a 4.8 out of 5 rating and the pricing page a monthly calculator; neither is recorded. The GitHub repository EnhanceSoftware/Enhance returns 404, so there is no repository fact.
