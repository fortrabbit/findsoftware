notes: >
  The project has no homepage of its own; svelte.dev/docs/kit is the GitHub homepage field. The GitHub latest release is a sub-package (@sveltejs/package), so latestVersion and latestReleaseDate come from the npm package @sveltejs/kit. firstRelease 2020 is the npm package creation date, which predates a stable release. The create-a-project page states no Node.js minimum, so runtimeMin comes from npm engines only. The packages directory lists about 118 entries across 20 sections, with overlaps, so pluginCount is absent; it lists 12 SvelteKit adapters. The repository also ships adapter-auto, which picks an adapter for the detected platform. Coined field here: funding (donation or sponsorship channel), and officialAdapters as in astro. contributors is the GitHub API count including anonymous contributors.
