notes: >
  Accepted. The README and the docs both say FastSchema is in beta and under active development, which is a stated status, not an end signal. The repository's default branch is develop; the releases are v0.0.1 (2024-04-03) through v0.15.1 (2026-07-11), with no prerelease. The GitHub owner is an organization, and the copyright line names Nguyen Ngoc Phuong and Contributors. The homepage lists a live demo that runs the dashboard in the browser as WebAssembly, which is a demo and not a hosted service; no hosted offering or pricing page was found. The storage docs name rclone drivers for local filesystem and S3-compatible storage, and say that many storage systems are not yet supported. The docs describe the configuration as environment variables, with DB_DRIVER values sqlite, mysql and pgx; pgx is the driver name for PostgreSQL. The authentication page names social providers (GitHub, Google) and federated social or OIDC providers; sso records OIDC only from the words social/OIDC on that page. The README lists JavaScript and Go plugins on the homepage and in the plugin docs; no plugin count is stated. The README's roadmap lists GraphQL support as not done, so GraphQL is not recorded. The README names Fiber, Ent, Rclone and Next.js as dependencies, which are not a parent project, so basedOn is left out. The Go requirement for building from source is 1.24, and the binary needs no runtime, so runtimeMin is left out. The pages show the server on port 8000 after ./fastschema start but never say it stays running, so runsAs is left out. The docs describe a self-service signup policy and webhook hooks, which are not fields here. The homepage says schemas are defined in the dashboard, that each schema gets CRUD endpoints and an OpenAPI specification, and that the backend runs standalone or embeds in a Go app; the README describes resources, hooks and an ORM for the framework use. Social providers are GitHub and Google in the configuration example. The Docker image is the one the deployment page names. The access-control docs say a new install creates the admin, user and guest roles, with admin as the root role.
