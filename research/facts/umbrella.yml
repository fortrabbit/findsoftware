notes: >
  The candidate row lists ui-library and dom; the import maps dom to library, and the project describes itself as a DOM manipulation and events library, so categories is library. The homepage says the API is "strongly influenced by jQuery", which is no basedOn statement. The GitHub releases list holds one release object, 3.0.0 (2018-08-19); tags run on to 3.3.4, which npm lists as latest on 2026-10-24, so latestReleaseDate and the registry's stable version come from npm and currentMajor stays 3 for both. firstRelease is 2015 from the commit date of the 1.0.0 tag, which is older than the npm history (the earliest npm upload is 2.6.2 on 2016-06-09); the repository was created in 2014. The npm package named umbrella is a different project, so umbrellajs is recorded. The README and homepage name Francisco Presencia as author and maintainer; no imprint or legal name found, so hqCountry is unknown. The homepage lists the MIT License only. The porting guide names the lack of support for IE10 and earlier and of SVG on IE11 as trade-offs, and the README says IE11 and later is the supported range. The HTTP Archive technologies list does not carry Umbrella. The README's Alternatives section lists other libraries; only the migration guide's statement about jQuery is recorded as alternativeTo. npmWeeklyDownloads sums the daily counts for 2026-10-19 to 2026-10-25. Prose basis from the homepage and porting guide: the handle method attaches a listener that receives the event; ajax and serialize are documented helpers; append and similar methods accept more argument types than jQuery's; the porting guide says the library uses native DOM methods.
