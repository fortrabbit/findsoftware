notes: >
  The homepage over https is turbogears.org; the http address redirects to it. The GitHub license field reads NOASSERTION, so the license entries come from the README ("MIT-style") and the LICENSE.txt ("This is the MIT license"), recorded as two statements. The highest stable GitHub release is tg2.5.1 (2026-10-12), major 2. The first release year comes from the PyPI JSON of the TurboGears 1 package, whose earliest upload, 1.0.2, is dated 2007-05-02. The TurboGears 2 changelog starts later: its oldest version heading, 1.9.7a3, is dated July 29, 2008, and the 2.0.1 entry June 21, 2009. The homepage shows a single-file start and a generated full-stack project, and the features page names SQL databases through SQLAlchemy. The features page lists SQL databases through SQLAlchemy without naming engines, so only MongoDB and the SQLite of the tutorial are recorded as databases. The homepage example serves with httpd.serve_forever(), which is no quote, so runsAs comes from the deployment guide, which describes a WSGI server behind a reverse proxy or Apache with mod_wsgi. The community page links a Google Groups discussion group, recorded as forum. The runtimeMin 3.10 is the homepage's stated minimum. The x link is the homepage's follow link. The docs field is the readthedocs site that the documentation page links for its complete reference. The CogBin page is the project's own directory of pluggable applications, recorded as pluginDirectory.
