notes: >
  The company is named "Berrie AI Incorporated" on the about page footer, the company table and the enterprise license copyright line ("Berrie AI Inc."), and "Berri AI" on the MIT LICENSE copyright line and in the enterprise license; the spelling differs between pages and the reviewer should confirm the legal name. The maintainer follows the MIT LICENSE copyright line, so "Berri AI" is recorded; the about page company table gives "LiteLLM (Berrie AI Incorporated)" and the headquarters "San Francisco, California, USA". The about page calls the company a Y Combinator company (Winter 2023). The repository's license is reported as NOASSERTION by GitHub because of the enterprise/ directory; the MIT statement is in pyproject.toml at v1.106.6 and the enterprise directory has its own license file, LICENSE.md, not enterprise/LICENSE as the top LICENSE file says. The enterprise license statement is recorded as its own entry, as the license is not the MIT one. The Docker Hub repository litellm/litellm exists with a pull count, but the install docs name docker.litellm.ai/berriai/litellm and ghcr.io/berriai/litellm, so no dockerPulls is recorded. A Rust AI Gateway is in beta on the homepage and docs ("LiteLLM Rust AI Gateway"), a separate binary of the same project; the record covers the Python proxy and SDK. The homepage says LiteLLM is "Open source. Self-hosted."; the docs describe Railway and Render as hosts of the same gateway, which are third-party hosts and not hostedOffering. The homepage's LinkedIn link (linkedin.com/company/90867735) is not a mapped social field and is not recorded. The releases list shows v1.106.6 (2026-10-28) as the newest stable release; ecosyste.ms reports 1.107.0, which has no GitHub release or PyPI upload, so it is not used. The contributors count on the about page (1,700+) differs from the GitHub contributor count (370) and is not recorded. The docs call the proxy an OpenAI-compatible gateway (compatibleWith, noted only, not a field). The docs state requirements of Python 3.10 or higher for the proxy; runtimeMin uses the pyproject range.
