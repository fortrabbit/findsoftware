notes: >
  The homepage is a client-rendered application shell with no readable text, so the homepage fact comes from the NuGet package's projectUrl and the docs are not read; the README, the nuspec and the build props are the sources. The README's Online Examples badge links the same site. The maintainer is recorded as the .NET Foundation, which the README says the project is part of; the LICENSE copyright line reads ".NET Foundation and Contributors". The NuGet nuspec names Argo Zhang as author and copyright holder and the build props name Longbow as company; the person is not recorded as maintainer. runtime and runtimeMin come from the nuspec of the 11.0.1 package, whose dependency groups target net6.0 through net11.0; 6.0 is the lowest target the package declares, and no page states a supported .NET minimum. firstRelease is the NuGet registry's earliest upload, 3.1.0-beta01 on 2020-04-14, which is older than the earliest GitHub release (v5.5.0, 2021-08-05). The GitHub release list reports 11.0.1 as the highest stable version; 11.0.2 previews on NuGet are not used. The sponsorship link in the README is not recorded. The repository ships en and zh locale files under src/BootstrapBlazor/Locales and the Chinese README lists QQ groups; neither is quotable from a page, so i18n and any chat link stay unrecorded.
