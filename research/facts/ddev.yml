notes: >
  DDEV needs a Docker provider on the developer's machine; the install page says "Once you’ve installed a Docker provider, you’re ready to install DDEV!" This is a requirement, so the docker field (official image) is not filled. The release is v1.25.4 (GitHub, published 2026-09-02); the install page's Homebrew and script examples mention v1.24.10 as an example version only. The repository created_at (2017) is not a first release. GitHub stars were read 2026-10-19. The CSV row lists 3.9k stars, which matches the API value of 3923.
