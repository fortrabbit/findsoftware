notes: >
  The legacy README says the project is no longer maintained and names a new project at github.com/hope-ui/hope-ui, which targets SolidJS 2.0 and which its README calls a pre-release not yet on npm; that is a replacement, so the status is discontinued and the successor is not recorded here. The repository is archived, and the npm package @hope-ui/solid has a deprecation notice reading "Package no longer supported." The npm package names hope-ui.com as its homepage and that domain gives no answer (no connection); hope-ui.dev, the repository's homepage field, now serves the successor's site, so no homepage is recorded for the legacy project. Contradiction for review: hope-ui.dev says "npm i @hope-ui/components" and lists the project as "early preview", but the successor's README says nothing is published to npm yet and registry.npmjs.org returns 404 for @hope-ui/components on 2026-10-27. Releases: 19 GitHub releases, the first v0.1.0 on 2022-03-23, latest v0.6.3 on 2022-08-01; npm @hope-ui/solid 0.6.7 was published on 2022-08-02 with no matching GitHub release. The contributor count is read from the Link header of the contributors endpoint with per_page=1.
