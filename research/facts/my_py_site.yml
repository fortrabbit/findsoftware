notes: >
  No homepage: the GitHub homepage field points to a jamstack.org directory entry, which is a third-party listing, not the project's site; the README's Live Demo at mypysite.netlify.com is a demo. The repository has no release and no tag, so the last commit on the default branch decides listing; the commits endpoint gives 2021-11-09 while the GitHub pushed_at field is 2024-01-11. The README says the project is under 90 lines of code and that its documentation is still in progress. The README gives the Netlify deployment as a fork plus a Netlify import, which is the basis for runsAs static. The README also lists compatibility with Netlify CMS, a third-party admin interface, which is not recorded as adminUi. The contributor count is the last page of the contributors endpoint with per_page=1.
  The README describes a config.json file whose values templates read through a data variable, a list of collections read from a collections folder, and YAML front matter on pages. The README says a Netlify deployment works by forking the repository and adding it to Netlify.
