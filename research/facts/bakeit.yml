notes: >
  The npm package names lumarama/bakeit as its repository and the GitHub repository moved to curvednebula/bakeit, which the old address redirects to; the current location is recorded. No homepage: the project names no site of its own, and the npm page is a registry page. The repository has no LICENSE file and no GitHub release or tag; the npm package is the release source, and its license is MIT. Runtime and runtimeMin are not stated on a page: neither the README nor the package names a Node.js version. The README calls the project a static site generator in its title but does not describe the output folder, so runsAs stays unknown. firstRelease is 2018 from the npm publish history of 0.1.0. The package has been stable on npm since 2018-11-06, and the GitHub repository is not archived.
