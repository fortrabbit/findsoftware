notes: >
  The maintainer follows the LICENSE copyright line, which also reads "Copyright (c) 2015-2017 Sebastian Erhart"; that second holder is no maintainer statement and is not recorded. The GitHub owner go-acme is an organization and no company is named on the site, so no company or hqCountry is recorded. The docs site states the challenge types DNS-01, HTTP-01, TLS-ALPN-01 and DNS-PERSIST-01, more than 200 DNS providers, ACME servers Let's Encrypt and ZeroSSL among others, and RFCs 8555, 8737, 8738 and 9773 with draft profiles and DNS persist extensions; these have no field in the starter list and are not recorded. The library use is documented under Library on the docs site. The install page states go1.25+ for building from sources, a build requirement, so runtimeMin is not recorded. The project asks for support through a sponsorship page and a Donate link; that is not a paid edition. The homepage links GitHub Discussions, recorded as forum. The Docker Hub figure is pull_count of goacme/lego, the image the install page names. The Go module has no download figure. Fields coined here: none.
