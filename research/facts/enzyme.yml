notes: >
  Status is accepted: the CSV row says the repository is archived, but the GitHub API returns archived false on 2026-11-08 (last push 2025-10-22), and no README, docs/future.md or homepage text ends the project; no npm deprecation. The import moves the record to stub on its own, since the newest stable release is 3.11.0 of 2019-12-20 and nothing in four years. The README names Mocha and Chai in its examples and no runtime. Adapters for React 16 and earlier are the compatibility the README lists; no page states a run mode, so runsAs and runtime are left out. The library is a testing utility, so it has no runsAs. The repository has no GitHub release objects: the npm latest 3.11.0 is the stable line, the GitHub tags enzyme@3.11.0 match it. The README badge links a Gitter room (gitter.im/enzymejs/enzyme); no field takes chat, so it stays here. firstRelease is 2015 from the oldest tag in the repository, reagent-v1.0.0 dated 2015-12-03, and v1.0.0 dated 2015-12-06. The npm figure is the enzyme package for 2026-11-01 to 2026-11-07, the install docs name it. The stars and contributors count the repository, which holds one library. The copyright line in LICENSE.md names Airbnb, Inc. and contributors; the country is not stated on a page read, so hqCountry is left out. The README points at third-party adapters (preact, inferno) that are not sibling records. Pages not read: the Mocha, Jest and other guides under docs/guides, which do not change any fact.
