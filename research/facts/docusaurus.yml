notes: >
  webpack is the build tool here, not a parent, so basedOn leaves it out. The homepage credits no maintainer in prose; the footer copyright and the Meta Open Source logo name Meta Platforms, Inc., and the repository sits in the facebook GitHub organization. firstRelease 2017 is the creation date of the v1 npm package docusaurus; v2 and later ship as @docusaurus/core, whose npm entry dates from 2019. The deployment page documents static rendering only, no server rendering. The community resources page lists community plugins by category with no total. starters are the examples directory templates the scaffold command uses. Coined fields: contentFormats, officialPlugins, showcase (project-hosted gallery of sites built with it). contributors is the GitHub API count including anonymous contributors.
