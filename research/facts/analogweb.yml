notes: >
  The candidate row gives no homepage. The project's site analogweb.github.io answers over https and is the Analogweb Framework site that the build file names (the build file names the same site over http; the https address answers, so the https form is recorded). The site's quick start and the README both show the sbt dependency; the example version on the site is 0.12.0 and the README shows 0.13.0, so installMethod is recorded without a version. The Maven Central artifact is org.analogweb:analogweb-scala_2.13, and its versions 0.12.0 (2019-10-12) and 0.13.0 (2021-12-08) are in the repository metadata; the GitHub tag v0.13.0 is dated 2021-12-05, and that tag date is recorded as latestReleaseDate. The project's tags run from v0.9.0 (2014-09-04), recorded as firstRelease. The repository has no GitHub release; the highest tag is v0.13.0, so currentMajor is 0. The default branch's last commit is dated 2022-07-19; the repository's pushed date (2025-01-04) is from another branch, and neither date changes the listing because the project has tags. The README and site name Netty and servlet plugins; the site says the built-in HTTP server does not support TLS or SSL. The runtime is not stated on any page read, so runtime is not recorded, although the build uses sbt. The license is recorded from the LICENSE file, whose first line reads "The MIT Lisence" as written in the repository.
