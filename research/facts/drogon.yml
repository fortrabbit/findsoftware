notes: >
  The homepage row pointed at the documentation site; the project's own site is drogon.org (the GitHub organization's blog field and the site's own pages), and the docs live on drogonframework.github.io/drogon-docs, which is a single-page app, so its text is read from the docs repository's ENG markdown files on GitHub. The documentation source repository is drogonframework/drogon-docs, and its ENG folder holds the English pages. The overview names C++17/20 as the base and the installation page says Boost is needed only when the compiler lacks C++17; that is a language standard, not a runtime, so no runtimeMin is recorded. The README's Telegram group and the Conan Center and Docker Hub badges are not recorded as fields; the Docker image is recorded as an install method because the installation page states it. The installation page lists hiredis as the optional Redis client library; no field fits Redis, so it is not recorded. The README lists the ORM and C++ coroutines as features; they are not recorded as fields.
