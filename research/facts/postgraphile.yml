notes: >
  The homepage postgraphile.org is the project's own site and quotes its description; the older graphile.org/postgraphile address is the same documentation. The docs are the v5 line (the postgraphile/5 path), with the v4 line still documented at postgraphile/4 for PostGraphile V4 Core; the record follows the v5 line that the homepage and npm latest name. The monorepo graphile/crystal holds several packages; the npm figures are for the postgraphile package the usage page installs. The npm weekly figure is the sum of the seven-day range the registry's downloads endpoint returns (155349), not the point endpoint, which is stale. firstRelease is 2016 because the oldest GitHub release in the repository is v1.3.0 (2016-05-11), older than the postgraphile npm package's first upload (2017-08-10); a reviewer decides whether the repository-wide date applies. PostGraphile Pro is a commercial plugin for PostGraphile V4 Core sold to sponsors and to licence buyers; it is an add-on plugin, so no paidEdition is recorded. The GitHub license and the postgraphile package's MIT license agree; the copyright line in the LICENSE is 2025, and the year is not a field. The runtime statement "PostGraphile is just a node app / middleware" names Node; the usage page says the CLI spins up a Node http server (or cluster thereof), which sets runsAs. The production page lists deployment targets (Heroku, a VM, a container, bare metal); the Docker deployment page says its official image is for standalone use without custom plugins and carries a warning that it is not yet tested with V5, and its Docker Hub image has no push since early 2025, so no dockerPulls figure is recorded. Copyright in the footer reads Graphile Ltd.; the LICENSE line names Benjie Gillam, which the maintainer follows. The install guide names npm, Yarn and pnpm as package managers for the same install sentence; only npm is recorded because the quote covers all three. The v4 introduction says PostGraphile is formerly PostGraphQL, so the record follows the current name. Grafast is a planning and execution engine the project uses, not a basedOn parent with a record. The introduction says PostGraphile runs as a CLI, as Node.js middleware or as a standalone GraphQL schema. Contributor count is the non-anonymous page count (179) of the contributors endpoint. The introduction lists schema plugins and server plugins for customization, which the record does not hold as a field.
