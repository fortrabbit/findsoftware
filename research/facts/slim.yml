notes: >
  The GitHub repository was created in 2010; Packagist's earliest tag is from 2012, and firstRelease follows the registry. Slim ships no database layer; the docs carry a Doctrine cookbook entry only, so databases and contentStore stay out. A 5.x branch exists in the repository with no release. SECURITY.md lists 3.x and 4.x as supported, and 3.13.0 shipped on 2026-04-28. The skeleton slim/slim-skeleton has 469823 total Packagist downloads. Coined fields: psrStandards (PHP-FIG standards implemented), webServers (documented web server configs), slack, blog, securityAdvisories (where advisories are published).
