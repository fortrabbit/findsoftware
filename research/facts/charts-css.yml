notes: |
  The npm package and the homepage are both https. The homepage names the maintainer as Rami Yushuvaev with a second contributor, Lana Gordiievska, listed as designer, not a maintainer; the LICENSE copyright line names Rami Yushuvaev alone. Language is CSS per the install page; the repository's GitHub language is HTML, which describes the docs site. The installation page offers a ZIP download from the releases page, a jsDelivr or unpkg CDN link, and npm or yarn; each route is its own installMethod entry. The introduction page says that for complex charts with special behaviors not covered by Charts.css you should search for JS alternatives (quote: "you should search for JS alternatives"), and the design principles page says "The core project should not use JS.". The usage page builds every chart on a standard HTML table element, so the data is written into the markup as rows and cells. The design principles page states that the core project does not use JavaScript (quote: "The core project should not use JS."), recorded here only, not as a field. The HTTP Archive technologies list has no entry for Charts.css, so httpArchiveSites is not recorded. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header. The earliest GitHub release is 0.1.0, dated the same as the npm 0.1.0 upload.
