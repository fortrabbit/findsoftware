notes: >
  The homepage answers 200 over https. Genie Builder is a separate product on the same site: a VS Code extension with a no-code UI editor, sold as a free EDU license, a Pro license and an Enterprise license. Genie Builder is not an edition of Genie.jl, so no paidEdition fact is recorded for the framework; a reviewer decides whether the Genie Builder record takes it. The maintainer is recorded as LICENSE.md states it (copyright 2016-2019, Adrian Salceanu and Genie.jl Contributors); the homepage copyright line names HPC Stipple SL, and that company's country is not stated on any page read (the terms link is not reachable as a static page), so hqCountry is left out. The site's Genie Builder terms page is not reachable at a static address. Julia is recorded as the runtime because the Genie.jl introduction says the framework builds apps "using Julia"; Julia is not a value in the runtime vocabulary of src/data/fields.yml, so a reviewer decides whether to add it. The Julia General registry publishes no download count for the package, so no registry figure is recorded. The README names Stipple.jl as a reactive UI package built on the framework; the introduction page says Stipple.jl is "built on top of Genie.jl", recorded on that package's record, not here. The plugin system's authentication and authorization plugins (GenieAuthentication, GenieAuthorisation) are general-purpose and are not listed. The introduction page says the framework "offers a built-in web server"; no page states a rendering mode, so renderingModes is left out.
