notes: >
  The repository homepage field names https://github.com/symplify/symfony-static-dumper, which is the successor the README names, not the project's own site, so no homepage is recorded. The project's own site https://www.statie.org/ answers 200 with the placeholder page "maintenance" and is recorded as unreadable. The README title and first line state the deprecation: "[DEPRECATED since 2020-03]" and "Use Symfony Static Dumper instead". The Packagist package symplify/statie is flagged abandoned on v7.2.3 with the replacement symplify/symfony-static-dumper; the repository symplify/symfony-static-dumper returns 404 on the GitHub API when checked and is not recorded as a repository. The repository deprecated-packages/statie is archived. The Packagist maintainer is TomasVotruba; the LICENSE copyright names Tomas Votruba. The highest stable tag is v7.2.3 (major 7), released 2020-02-27 according to Packagist. The first version on Packagist is v1.2.10 from 2016-11-19. The GitHub release list is empty. The README links two migration guides, from Jekyll and from Sculpin, hosted on the maintainer's blog; they are recorded as importsFrom. The output directory is stated in the README as /output by default.
