notes: >
  The repository has no tags and no GitHub releases, so lastCommitDate is the committer date of the newest commit on master, 2022-02-12; the import moves a record with no release in four years to stub, and this one passes that point, so the next import will hide it unless a commit lands first. The status stays accepted; the import's four-year rule decides listing. The CSV note "last push 2024-08-15" is the repository pushed_at field, which the commits endpoint does not match on master, so the commit date is the one recorded. The README says comments live in GitHub issues ("All data stored in GitHub issues"); that is a dependency on GitHub, not a store the software runs, so it stays here and out of contentStore. Users authorize the utterances app through the GitHub OAuth web flow to post, which is a dependency on GitHub, not an sso statement. The homepage embeds the widget with a script tag whose src is https://utteranc.es/client.js and whose repo and issue-term attributes are set; the snippet is code, not a sentence, so installMethod is not recorded. The widget attaches to a site as that script tag. The maintainer is taken from the LICENSE copyright line (Jeremy Danyow, 2018); the GitHub organization utterance is the repository owner. The README shows sites using utterances (Haxe documentation, sadsloth.net, danyow.net) and no record in the dataset is named there.
