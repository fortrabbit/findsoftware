notes: >
  The README and the docs give the same project site, marshmallow.readthedocs.io, which answers over https (plain http redirects to it). The docs "Why marshmallow" page says it makes no assumption about web frameworks or database layers, so no basedOn is recorded, and it names Django REST Framework, Flask-RESTful and colander as influences, which is not a basedOn statement. The LICENSE copyright line is "Copyright Steven Loria and contributors"; pyproject.toml names Steven Loria as author and maintainer, and the project's maintainers list adds two more names, Jérôme Lafréchoux and Jared Deckard, recorded here only as notes. The GitHub organization marshmallow-code hosts the repository. The README's sponsorship line names Route4Me and a Tidelift subscription offers paid professional support; neither is an edition, so paidEdition is absent. The repository's default branch is dev, which the README and LICENSE citations use. The repository has GitHub tags up to 4.4.0 and no GitHub release objects; the PyPI upload of 4.4.0 on 2026-11-04 sets latestReleaseDate. The earliest PyPI upload is 0.1.0 on 2013-11-11, the year the repository was created, so firstRelease is 2013. The docs API reference groups the library into Schema, Fields, Decorators, Validators and utility functions, and the docs list extension examples such as Flask with SQLAlchemy; those are the project's own pages and no integration is recorded as a field. The PyPI download figure is the pypistats.org last_month count, read on 2026-11-16. The contributors count is the page number of the last contributors page at per_page=1.
