notes: >
  Status accepted: the repository is public and not archived, the 2.1.8 release (2026-11-04) is current, and the intro page gives the pip route (criterion 2 and 3). The CSV homepage is already https and is recorded as such. currentMajor is 2 from rel_2_1_8, the highest stable GitHub release; the 2.1 line is the current minor series named on the homepage and is not recorded as a field. The newest prerelease, rel_2_1_0rc2 (2026-09-08), is older than the latest release, so no latestPrereleaseDate is recorded. firstRelease is 2006 from the rel_0_1_0 tag (commit 2006-02-14), the oldest tag in the repository. The LICENSE copyright line names "SQLAlchemy authors and contributors" and that is the recorded maintainer; the homepage says "SQLAlchemy is a trademark of Michael Bayer" and names Michael Bayer as the trademark holder, which is a trademark statement and not the maintainer line. The PyPI JSON reports no license field and requires_python of 3.11 or later, which agrees with the intro page. The PyPI figure is the pypistats last_month count from the package the install page names; the last_week count read on the same day is 98104867. The databases values are the included dialects' own support sentences, one entry per dialect; the MySQL and MariaDB dialect page covers both, so mysql and mariadb share one quote. Third-party dialects listed in the external dialects section are not recorded as databases. The mastodon value is the first account in the homepage footer; a second account, https://fosstodon.org/@zzzeek, is listed beside it on the same page. The docs field is the documentation URL the README names. The intro page's "Changed in version 2.1" note is the source of runtimeMin 3.11. The support page names GitHub Discussions as the forum-style place for support and links a Gitter room, which is not a recorded field. The install guide says that since 2.1 the asyncio support needs the greenlet dependency, which a plain install no longer includes, and that the source distribution installs with setup.py. Stars and contributors belong to the sqlalchemy repository, a single-package repository.
