notes: >
  The homepage is read over https; plain http redirects to it. The "UIkit Pro" navigation item leads to /pro, which sells YOOtheme Pro, a WordPress and Joomla theme and page builder, so it is not recorded as a paidEdition or a pricingPage; a reviewer decides whether the nav label warrants a fact. The discord link's visible text is "Community". The npm figure is the uikit package named by the install docs (pnpm add uikit). httpArchiveSites is the mobile origins count for the HTTP Archive technology named UIKit, the same convention as the other records. The documentation of the default branch is on develop. The maintainer is named by the LICENSE copyright line and the imprint of YOOtheme GmbH in Hamburg. The compiled JavaScript is described as ECMAScript 5 output, which is not a runtime. The contributors count reads the Link header of the API list with per_page=1. The HTTP Archive "UIKit" definition has website getuikit.com and matches the class names uk-container and uk-section, so the httpArchiveSites figure is this project.
