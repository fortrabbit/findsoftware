notes: >
  The record name follows the wave 60 ruling, "Gutenberg block editor". Boundary ruling for wave 60: the Block Editor Handbook's package reference for @wordpress/block-editor says "This module allows you to create and use standalone block editors" and the packages page has a "Using the packages via npm" section, so the record is in with the npm package as its unit. The handbook's React Native mobile editor guide is not used: it says that native library is unmaintained and known to be broken on React 19. The record is the npm package, not the Gutenberg WordPress plugin: the plugin's GitHub releases (v24.x) are another product and are not used; the package's highest stable tag is @wordpress/block-editor@20.0.0, and that tag's npm publish date is 2026-11-04. The first release is the first npm upload of the package, 2019-03-06 (ecosyste.ms agrees); the repository's oldest release (2017) belongs to the Gutenberg plugin. The package is distributed under GPL-2.0-or-later, per its npm metadata. The repository LICENSE.md says contributions are dual-licensed under GPL and MPL 2.0, which is recorded as its own license entry; the project license stays GPL. The GitHub license detection reads NOASSERTION. The package says it works in an ES2015+ environment and names a babel preset polyfill for older environments; no runtime or runsAs is recorded because the page names none. The WordPress relationship is the editor WordPress uses, and the README describes the Gutenberg plugin as a way to try the editor on a WordPress site; no basedOn wordpress is recorded. The README's "block editor live demo" link is the homepage; the WordPress.org page it links is the plugin listing. Stars and contributors are for the whole monorepo, and the npm package is one of its packages. The npm weekly figure is the sum of daily downloads from 2026-11-01 to 2026-11-07. The npm package's engines field requires Node.js 22.13.0 or higher; that is a package tooling requirement, so it is not recorded as a runtime.
