notes: >
  The maintainer is the company behind the VOXmail service: the homepage says Mosaico is "brought to you by italian email marketing firm VOXmail.it VAT# IT02137700395", the VOXmail footer reads "Void Labs Snc ... P.IVA 02137700395" (same VAT number), and the VOXmail contact page gives the Void Labs Snc postal address in Faenza (RA). The address is not recorded as a field; hqCountry IT rests on the VOXmail statement that the service is delivered by an Italian company. The README offers "COMMERCIAL support" through a sales address; paid support is not an edition, so paidEdition is not recorded. The repository's GitHub language is HTML; the README says "Mosaico is a JavaScript library", and the language fact follows the README. The README says "Mosaico itself does not define what you can edit or what styles you can change: this is defined by the template"; the build route runs npm install and grunt for a local server on port 9006, and the Dockerfile route serves the same port. The README says the project needs NodeJS v24.0 or higher and npm 8.3 for changes to dependencies; that is a build requirement, not a runtime, so no runtime is recorded. The wiki's Serving page says Mosaico "needs a server based backend" for image upload, email download and send, and lists PHP, Python, .NET and Ruby backends written by other people; the backend's process model is not stated, so runsAs is browser only, from the sentence that calls it a frontend/javascript application. The Developers wiki page was last edited in 2015 and is the only page that says it is "heavily based on Knockout.js"; the knockout record is the parent named. The README lists MailTrain, GoodEnough's Mosaico and CiviCRM as projects that use Mosaico; those are not basedOn statements. The README names "Mosaico Basics" (the wiki) as its documentation. The live demo at mosaico.io has a custom backend and a second template (versafluid) that is not in the open-source distribution, per the README. The README and the wiki name no npm package as an install route (the README builds with npm install from a clone), so npmName and the npm download figure are not recorded; an npm package named mosaico exists with the repository's name. The Serving Mosaico wiki page says the open source distribution provides "a minimal node.js backend suitable just for tests". The template language is described in the wiki's Template-language page for creators' email templates; it is not a templating engine and is not recorded as templating. firstRelease is the oldest tag or release v0.11 (2015-09-28); the repository was created 2015-06-04; the npm package's first version is dated 2016-11-23. The GitHub release v0.18.11 is the newest stable release; the 2022 releases marked prerelease are older than it, so no latestPrereleaseDate is recorded. currentMajor records the major 0 only.
