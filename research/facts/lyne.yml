notes: >
  The homepage is the SBB design system site, which names Lyne as the design system for SBB websites and applications; the component docs are the Storybook app at lyne-elements.app.sbb.ch, recorded as docs. The highest stable GitHub release is v5.13.0 (2026-10-27), which matches the npm latest tag; v4 is the npm v4-lts tag and v5.0.0-next prereleases are older than the release, so no latestPrereleaseDate is recorded. The deprecated npm package @sbb-esta/lyne-components (repository lyne-design-system/lyne-components, last published 2026-02-23) is a different, older repository and is not the package this repository ships; the @sbb-esta/lyne-elements package is not deprecated. The README says the software is "unsupported unless otherwise clearly stated. Use at your own risk." That is a support disclaimer beside active releases (5.13.0 on the release date), so status is accepted; a reviewer should decide whether it reads as an end statement. firstRelease is the first tag in this repository (v0.1.0, commit "chore(release): 0.1.0", 2022-06-24); the repository's history predates it through another organization. The README says the components are created using Lit; no runtime or rendering mode is stated. The README names the browsers the library supports, which is the runsAs browser statement. The LICENSE copyright line is the legal name; the imprint on digital.sbb.ch names Swiss Federal Railways SBB with the Bern address. The getting-started guide covers plain JavaScript, Angular and React/Next.js; the React wrapper is published as @sbb-esta/lyne-react.
