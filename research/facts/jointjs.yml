notes: >
  The CSV row is accepted and the earlier stub doubt is settled: the docs.jointjs.com installation page says to install the open-source package (@joint/core) with a package manager, and the JavaScript integration page describes using JointJS without a build process from a script tag, so criterion 3 holds. The homepage and docs answered 200 on the second pass. The repository is a monorepo: stars and contributors belong to clientIO/joint as a whole, and npmWeeklyDownloads counts @joint/core, the package the installation page names. JointJS for React (@joint/react) is a React binding over the framework-agnostic core, so it is not basedOn; the Angular, Vue, Svelte and Salesforce Lightning pages are integration guides and are not basedOn either. The docs also have a migration page for converting saved mxGraph diagrams to JointJS. The npm package named jointjs (0.7.0, 2013-11-04) comes from the same repository, so firstRelease is 2013. The README gives supported browsers as a list and no sentence saying where the library runs, so no runsAs is recorded. The README's commercial paragraph and the docs name JointJS+, which adds plugins on top of the open-source library; its trial link is not a pricing page. The privacy policy and the site's copyright line name client IO s.r.o., the contact page gives a Prague address, and the homepage footer says the project is part of client.IO and links a LinkedIn showcase page, which is not a field here. The homepage footer shows the Twitter, Reddit and YouTube accounts of the project.
