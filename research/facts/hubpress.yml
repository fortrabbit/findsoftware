notes: >
  The README warns that the project "is not actively maintained anymore", and the GitHub repository is archived (last push 2019-09-17), so status is discontinued on both signals. The GitHub homepage field is empty; the project's site is hubpress.dev, and http://hubpress.github.io/ leads to the same content. The repository has no GitHub releases, only tags up to 0.6.0, so no currentMajor or latestReleaseDate is recorded. firstRelease is not recorded because the repository has no GitHub release; its creation date (2015-02-01) is not a release. The README describes posts as AsciiDoc and the admin console as a browser application that calls the GitHub API; no page states where the admin runs, so runsAs and runtime are not recorded. GitHub reports CSS as the primary language, which is recorded as stated. The README states that hosting for the blog is provided by GitHub Pages. The candidate row gives 2.8k stars, which matches the recorded figure.
