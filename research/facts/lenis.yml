notes: >
  The homepage lenis.dev answers over https and is the project's own site; it names the project as "an open-source project by darkroom.engineering" on the privacy page. The maintainer is darkroom.engineering as the LICENSE copyright line states it (2024); no page read gives a legal form or a country for it, so hqCountry is absent. The darkroom.engineering contact page describes the studio as a "global design and development studio" and gives no entity name. The npm package lenis has versions from 0.0.1 (2022-03-08), and the first GitHub release is 0.2.6 (2022-09-20); firstRelease uses the npm upload, the same product name. The GitHub release line is 1.x; currentMajor is 1 and the current release is 1.3.27 (2026-10-15). The README names framework packages for React (lenis/react), Vue (lenis/vue) and Framer (lenis/framer), and lenis/snap for scroll snapping; these are official bindings of a framework-agnostic core, so no basedOn is recorded. The Framer plugin and the Lenis Framer Starter Kit appear on the homepage; they are not separate records. The homepage footer names a LinkedIn page (linkedin.com/company/lenis-smooth) and a GitHub organization; LinkedIn is a coined field kept here. The homepage lists a Showcase, a Templates page and a sponsor page; these are coined kinds and are not recorded. The README's 'Sponsors' section and sponsor links are sponsorship, not a paid edition. The README says the library's npm package is installed through npm, yarn or pnpm; the three are one registry and one route. The script tag route loads the same package from unpkg. The npm figure counts downloads of the lenis package, the same registry route as the install line. The GitHub stargazer and contributor counts are the repository's own. The README lists the limits: no CSS scroll-snap (lenis/snap covers it), a 60 fps cap on Safari and 30 fps in low power mode, no smooth scroll over iframes, and lag on macOS Safari before M1 for position fixed. The README says the library wraps native scroll, so position sticky, anchor links and accessibility keep working, and that one loop can drive WebGL scroll scenes, GSAP ScrollTrigger and parallax. It also says the no-code script setup needs no build step, and that Lenis honors prefers-reduced-motion by default.
