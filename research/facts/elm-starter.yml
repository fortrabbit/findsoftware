notes: "The domain elm-starter.guupa.com, named as homepage on GitHub and in the README demos, does not resolve (curl: Could not resolve host) on 2026-10-22, so no quote is given, no homepage is recorded and status is stub under AGENTS.md. The README says elm-starter is not published on npm, so there are no registry figures. The repository has no GitHub releases and no release dates are read, so the major and the release date are unknown (tags run to 0.0.14, the package.json version is 0.0.14). GitHub reports the license as unrecognized (NOASSERTION) because the LICENSE file first credits elm-html-string; the BSD-3-Clause statement is the package.json license field, and the LICENSE text holds the three BSD clauses for Luca Mugnaini. The README describes the tool as experimental, pre-rendering at build time with no live server-side rendering. Last push 2022-12-11; not archived, no end statement found."
