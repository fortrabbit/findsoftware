notes: >
  The homepage and the README both name Bootstrap as the stylesheet the components rely on; the README describes the components as Bootstrap 5 components built with React. The README table marks the 1.x and 0.33.x lines as not maintained, and the 2.x line is the one it lists for Bootstrap 5; the new major is in beta: the docs site labels 3.0.0-beta.5 as current and the npm next tag is 3.0.0-beta.6 (2026-10-22); the stable major is 2 and latestReleaseDate is the v2.10.10 release. firstRelease is the first npm publish, 0.2.0 (2014-01-26); the repository was created on 2013-12-27. The LICENSE copyright line names three people and no organization, so the maintainer is recorded as the line states it. The docs footer names React Bootstrap as the copyright holder. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header. The Discord invite is the only community link recorded; the Stack Overflow tag page is not a field.
