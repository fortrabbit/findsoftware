notes: >
  The repository the npm package names is the monorepo jldec/pub-server-monorepo (package path packages/pub-server). The original repository jldec/pub-server is not archived and its README still describes v2; its star count belongs to that repository, so no star figure is recorded for the monorepo, which has none. The package README says "requires node.js v6 or later", while the monorepo README lists Node.js 22+ (tested on 22, 24, 25) under development prerequisites and npm declares no engines field; the two disagree, so runtimeMin is not recorded. firstRelease is the year of the first npm publish (registry time.created), read from the registry API. The README's "Other examples" links are not facts for this record.
