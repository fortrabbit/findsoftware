notes: >
  The API overview page describes two coexisting APIs: v2, read-only and built on Django REST Framework, and v3, built on Django Ninja with authenticated create and edit; GraphQL is not native and needs a third-party package such as wagtail-grapple. The deployment pages name no database engine, so `databases` stays unknown rather than inherited from Django. firstRelease is the year of the first PyPI upload (0.1, February 2014). frameworkMin is the lowest Django version endoflife.date lists for the latest cycle. The upgrading page labels LTS releases but states no policy; support dates come from endoflife.date only. Paid support is sold by Torchbox, no prices shown. Reused coined fields: `frameworkMin`, `paidSupport`, `slack`, `youtube`, `funding`, `pypiName`.
