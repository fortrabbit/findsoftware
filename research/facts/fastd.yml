unreadable: [https://fastdlabs.com/, https://docs.fastdlabs.com/]
notes: >
  fastdlabs.com timed out on every attempt (connection timeout after 45 seconds, over HTTPS and HTTP), and docs.fastdlabs.com answers with an expired certificate, so neither was read; homepage and docs are the URLs the repository's composer.json and README state, and the README is the cited source.
  The README is in Chinese. It names Swoole mode as resident in memory and FastCGI mode as compatible with PHP-FPM deployment, so both runsAs values are recorded; Swoole is described as optional. The README lists four run modes (Swoole Server, FastCGI, Console, Process) and names PSR-11 for the container, PSR-14 for events, PSR-7 for HTTP messages and PSR-15 for middleware. It links documentation in Chinese and in English.
  currentMajor and latestReleaseDate come from the Packagist tag v8.0.0; the GitHub releases/latest endpoint returns the stale v3.2.10.
  The repository is not archived and Packagist does not flag the package abandoned; the maintainer is the name in the LICENSE and composer.json authors.
