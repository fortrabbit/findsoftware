notes: >
  The record id is rust-validator because go-playground-validator already holds the name validator; the README title and crate name are validator. The repository has no GitHub release objects: its tags stop at v0.20.1, while the crates.io registry lists 0.21.0 published on 2026-07-27 with no matching tag. The registry's stable version therefore sets currentMajor 0 and latestReleaseDate, and the minor line 0.21 stays in notes. The 0.21.0 metadata states a rust_version of 1.88, which is recorded as runtimeMin; the workspace Cargo.toml on master states the same value. The README says the crate is inspired by marshmallow and Django validators, which is no basedOn or alternativeTo statement. The docs.rs page for 0.21.0 still shows a 0.16 dependency line in its installation example, so the sentence is quoted and the version is left out. The README's features list names the derive and derive_nightly_features cargo features, which are not recorded. The first crates.io version 0.1.0 is from December 2016, the same month as the GitHub repository. The download figure is the crate's all-time total. The GitHub stars and contributors belong to the single repository, a Cargo workspace whose members are validator, validator_derive and validator_derive_tests; the crate the install line names is validator.
