notes: >
  The stable line is 1.28.2, released 2025-12-14 (Framagit release list). The npm package gancio has 1.6.13 as latest (2023-05-16), so the registry does not show the current release; npmName and npmWeeklyDownloads are recorded as the registry states them. The homepage and install docs describe 2.0.0-beta.7 (2026-10-13) as an alpha or beta documentation set, advise new instances on v2 and existing ones not yet upgraded; betaVersion is coined here. The two node requirements conflict: the beta install docs say node >=20, the stable package.json says node >=14 <=23; both are recorded. The project is hosted on Framagit (GitLab), so the adoption figure is framagitStars, coined here, not githubStargazers. federation is coined here for the ActivityPub support. Maintainer is the package.json author "lesion", a pseudonym with no company named; mapped to individual. firstRelease not checked: the Framagit project was created in 2019-08. hqCountry not stated by any source read. Stable tags listed on Framagit: v1.28.2 (2025-12-14), v1.28.1 (2025-11-02); the 2.0 line has beta tags from 2026-07-06 onward. No signal that the project has ended.
