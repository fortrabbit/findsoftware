notes: >
  The maintainer is the author in backend/package.json at the v2.16.0 tag ("Jamie Curnow", with an address that is not recorded); the LICENSE file names only "Copyright (c) 2017" and the homepage names "jc21.com" as the copyright holder, so the maintainer's legal name is not confirmed by a legal page. The root package.json and backend/package.json state version 2.0.0 at the v2.16.0 tag, so no version was taken from them. There is no engines field, so no runtimeMin. runsAs always-on rests on the guide's statement that the running container serves the admin interface on port 81 (the compose files also set restart unless-stopped). The guide names the Docker image tag "jc21/nginx-proxy-manager:2.16.0" in its setup examples; the README uses docker.io/jc21/nginx-proxy-manager:latest. The Docker Hub pull count of 291407225 was read on 2026-10-30; the CSV figure (287.2M) is older. The setup page says armv7 is no longer supported from 2.14; that statement is not recorded as a field. The Docker Hub page is not a social field; GitHub Discussions is recorded as forum. Fields coined here: none.
