  - https://kunstmaancms.be/documentation (linked from the README, 404)
notes: >
  The README links the documentation at kunstmaancms.be/documentation, which answers 404; the docs live on readthedocs. The system requirements page says the minimum PHP version is 7.1 and describes the Standard Edition, which the installation page marks deprecated; the 7.3.2 composer.json requires "^8.1", so runtimeMin is read from composer.json, and the requirements page is stale on PHP. The install entry is kunstmaan/cms-skeleton, a project template; packagist figures are taken from kunstmaan/cms-skeleton, the package the installation docs name, which is on Packagist with downloads (2405 total, 32 in the last month); the core package kunstmaan/bundles-cms (299698 total) is not recorded. The contributor count reads two pages of the API (100 and 94) with anon=true. The LICENSE says "Copyright (c) 2012 Kunstmaan (https://kunstmaancms.be)" without a legal form, and the company site shows no legal notice, so the maintainer has no legal form. The community chat is a Slack invite on the homepage, which the field list has no slot for. The system requirements page lists ImageMagick and Elasticsearch; the installation docs name the imagick extension. The documentation has a Cookbook page on anacrontab that describes cron, but no page here states that the CMS needs a scheduled job, so runsAs has no scheduled value.
