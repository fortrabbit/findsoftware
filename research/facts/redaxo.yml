notes: >
  The repository named on the home page, github.com/redaxo/redaxo, redirects to redaxo/core, so the record names redaxo/core. The GitHub API reports the license as NOASSERTION; the license entries come from the license page and Packagist. The license page states the MIT terms for REDAXO 5 and later, and the GPL for 4.x and lower, without a GPL version; only the MIT terms are recorded as license entries, since 4.x is not the current line. The MIT terms add that the link to www.redaxo.org and the REDAXO logo must be visible and clickable in the backend, as the license page says. The install docs describe zip, loader, command line and docker installs and name no Composer package, so no Packagist download figure is recorded: redaxo/core has a tiny count, and the root composer.json names redaxo/source, a package described as for static analysis. packagistName stays redaxo/core, the package of the repository the project names. The 5.x default branch and the release tag 5.21.5 agree. The redaxo/core Packagist entry lists PHP >= 8.3 for 5.21.5; the download page says PHP 8.3 or higher is required. The download page lists older PHP-compatible releases (5.20.2 for PHP 8.2 and older); no recording of that list, as the rule keeps supported-version lists out. The add-on count of 310 is the number of results the add-on directory shows for all categories. The site's Slack link is recorded under a coined field slack, since the starter list has no chat field for it; the discord field is unrelated. The Wikidata entry Q2136131 is labelled "Redaxo" with the description "Content management system". The maintainer is the imprint's legal name with its legal form. The home page describes the structure of categories and articles, content blocks and a media pool, and the templates page says templates can be nested; these are not fact entries and the prose names only what the fact entries state.
