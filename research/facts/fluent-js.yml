notes: >
  Monorepo: the repository holds the packages @fluent/bundle, dedent, dom, langneg, react, sequence and syntax, and the stars and contributors belong to the whole monorepo; the npm figure and the runtime come from @fluent/bundle, the package the README lists first and the core of the set (its README says it "can be used both on the client-side and the server-side"). The README's "Node.js 20.19" requirement is for building the repository and is not recorded as runtimeMin; the npm metadata of the latest release (0.19.1) sets engines node ">=18.0.0", which gives runtimeMin Node 18. runsAs is left out because the package states where it runs, not a process model. The projectfluent.org homepage says "Client- and server-side implementations in JS, Python, and Rust. React bindings." Fluent for Python and Rust are their own candidates (fluent-rs is the Rust one, python-fluent is not in this area) and the React binding @fluent/react is a package of this monorepo, so neither is recorded as basedOn. The NOTICE copyright line names "Mozilla Foundation and others", recorded as the maintainer with the "and others" group in prose as "maintained by"; the package.json author "Mozilla" with a list address is not recorded. The homepage calls Fluent "a research project by Mozilla"; no page read gives a Mozilla legal address, so hqCountry stays out. currentMajor is 0 from the highest stable @fluent/bundle release, 0.19.1 (GitHub release 2025-04-02), and the package stays in 0.x. latestReleaseDate is 2025-07-18, the registry date of @fluent/dom 0.10.2, the newest stable release across the monorepo; @fluent/bundle 0.19.1 is dated 2025-04-02. firstRelease is 2017 from the tag fluent@0.1.0 (commit 2017-02-02). The forum is the Fluent category of the Mozilla Discourse, named in the README as the discussion place; Discourse hosts many Mozilla projects, so the reviewer decides whether a category link counts as the project's forum. The docs link is the generated API reference for @fluent/bundle (its version line reads v0.19.0), the only JavaScript reference page the project site links; the syntax guide at projectfluent.org/fluent/guide is for the FTL language and is not recorded here. The npm figure is the sum of the daily values from api.npmjs.org for 2026-11-01 to 2026-11-07; the CSV row carries an older figure from another package.
