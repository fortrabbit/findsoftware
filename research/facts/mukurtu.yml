notes: >
  The candidate's CSV row lists 10.9k Packagist downloads; the mukurtu/mukurtu package reports 1355 total and 125 monthly, which is what is recorded. The row's category list has distribution; the package type on Packagist is drupal-profile, and the basedOn entry names Drupal, so the Drupal dependency is recorded as basedOn. The license is stated two ways: GitHub reports GPL-3.0, composer.json says GPL-3.0-or-later, and the homepage says GPLv3 for the materials it publishes; all three are recorded. The maintainer is the university named on the homepage as the body that manages the project through its Center for Digital Scholarship and Curation; the homepage gives no other legal name, so maintainerType is left to the import. The README's install section names MariaDB and MySQL and says PostgreSQL is not supported. Server tools for PDF thumbnails (poppler-utils) and video thumbnails (FFmpeg) are named in the README; not recorded as a field. The README installs new sites from the project template mukurtu/mukurtu-template, which requires the profile mukurtu/mukurtu; the registry figures are the profile's, as the core package. The README also recommends a 512MB PHP memory limit and says the team works with nginx, with Apache untested. The homepage names funders (NEH, IMLS, Mellon, NSF); not recorded. The scope change on 2026-10-19 (drupal distribution) is reflected in basedOn.
