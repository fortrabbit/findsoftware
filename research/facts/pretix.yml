notes: >
  No GitHub releases exist (the releases list is empty and the repository has tags only), so the registry is the release source. The version scheme is calendar versioning (2026.8.0), so the record has no major version and currentMajor is absent. The earliest registry upload is 1.0.0b1 on 2017-01-04, a beta, and firstRelease uses its year. The GitHub API reports the license as NOASSERTION; the LICENSE file and the README state AGPL v3 with additional terms, and the LICENSE file's Additional Terms waive AGPL section 13 (Remote Network Interaction) as long as pretix is not used for any of the listed purposes, among them making its functionality available to third parties as a service (SaaS); they do not forbid SaaS, they leave section 13 in force for it. The terms also say "you are not allowed to remove the attribution notice indicating the generated website is built using pretix at the bottom of all generated web pages", and a modified version may rephrase it as "powered by <Company> based on pretix" with the word pretix linked to https://pretix.eu/. The README says the project is "100 percent free and open source software", and the additional terms qualify the AGPL, so the license model is a reviewer decision and no licenseModel fact is recorded. The README's wording "AGPL v3 with additional terms" is the same statement as the LICENSE file's and is not a separate entry. The Python requirement is 3.11 or newer on the install page and requires_python is 3.11 on PyPI. The general installation page says pretix runs on SQLite when no database is configured, "useful for evaluation and development purposes" and adds "Do not ever use SQLite in production", so sqlite is not recorded as a database. The manual installation page lists "A nodejs installation" among the systems to set up beforehand, recorded as the node runtime. The customer accounts guide says SSO support there is built on OpenID Connect; SAML login is a separate plugin, "Presale SAML Authentication", which the SAML guide says is available through pretix Hosted support or installed on pretix Enterprise, so it is not recorded as sso. The general installation page states that Redis is required for production (caching, sessions and task queuing) and that RabbitMQ or memcached are optional; these are not recorded as fields. Django is named only as the framework that supports the database, so basedOn is not recorded. paidEdition rests on the features page, which marks the features available only in the Hosted and Enterprise Editions and not in the Community Edition; no prices are recorded. The PyPI download figure is the last-month count from pypistats.org, a third-party aggregator.
