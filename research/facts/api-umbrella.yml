notes: >
  Doubt: the homepage in the candidate row, apiumbrella.io, now answers with an unrelated WordPress sports-betting blog, so no project-owned homepage is linked; a project-owned site, or a link from the README or the docs to a new homepage, would settle it, and the record returns to accepted when one is found. The README and the docs (api-umbrella.readthedocs.org) are the project's own pages and name the repository. The docs are dated: the getting-started and compile pages give 2015-era instructions (Debian 8 and 9, Enterprise Linux 7 packages served from Bintray, the source tarball of v0.15.1), while the repository carries tags to v1.9.8 (2026-10-27 commit date). GitHub releases stop at v0.15.1 (2019-05-14); latestReleaseDate follows the newest stable tag's commit date, and firstRelease is the oldest GitHub release (v0.6.0, 2015-03-27). The repository moved from the NREL organization to NatLabRockies (the candidate row says so); the GitHub organization is named National Laboratory of the Rockies, and the LICENSE copyright names Alliance for Sustainable Energy, LLC, recorded as maintainer. The README names three deployments (api.data.gov, the NREL Developer Network, api.sam.gov) with no figure, so no adoption figure is recorded. The organization's location is Golden, CO, which is not a country statement, so hqCountry is not recorded. Fields coined here: none.
