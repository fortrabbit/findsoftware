notes: >
  Countly Lite is the free, open-source, self-hosted edition of the server in countly-server (README plan list; LICENSE title 'Countly Product Analytics - Countly Lite License'). The README says the server is installed with the install script on Ubuntu, CentOS or RHEL, that the install script needs a fresh server with no service on ports 80 or 443, and that a Docker image and docker-compose route exist; the installation guide on support.countly.com returns 403 with a bot check and is unread. Versioning is calendar-based (for example 24.05.55 and 25.03.58, two lines with LTS builds); no currentMajor is recorded. The latest release by date is 24.05.55 (2026-10-30); the oldest tag is countly-server-v13.06, whose commit is dated 2013-06-17, so firstRelease is 2013 although the GitHub release for it is dated 2016. The root package.json at the latest release names no engines field, and the README names NodeJS without a version, so runtimeMin is not recorded. The license statements are recorded as the LICENSE.md file words them (AGPL-3.0 with modified Section 7, which adds a logo-retention term) and as the README's plan list words Countly Lite (open-source, non-commercial). The LICENSE.md copyright line reads "Countly" and the terms page names Countly Ltd; the record uses Countly Ltd as the legal name of the same company. Countly Enterprise and Countly Flex are paid plans on the README's plan list; the self-hosted Enterprise edition is paidEdition, and Flex is hostedOffering. The README names the Countly Server Write API for sending data from any source and a read API that the dashboard uses; The API reference at api.count.ly is a script-rendered page; the features page names the REST API (Database viewer, marked lite, flex and enterprise). The site-side wiring is the Countly SDKs for web and other platforms (README: "Countly can collect and visualize data from mobile, web and desktop applications." and "Using the write-API you can send data into Countly from any source."). Coined kinds recorded in notes: privacy-first positioning, compliance hub for consent and data subject requests, webhooks and email hooks, the AI agent. The features page marks Hooks as Flex and Enterprise; the README lists hooks in the repository. Authentication add-ons (SSO) are Enterprise only on the features page. Countly also has vs pages for Google Analytics, Mixpanel, Amplitude and Heap, none with a candidate row, so they are not recorded as alternativeTo; a blog post countly-vs-firebase-analytics compares Firebase Analytics, not the firebase record.
