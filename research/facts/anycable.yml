notes: >
  Accepted: the open-source Go server is MIT licensed; the editions page states a commercial license for Pro and a managed AnyCable+ service. The homepage and docs name Rails, Laravel, Node.js and Python clients, which are SDKs in other repositories (anycable/anycable-rails, anycable-client, anycable-serverless-js), so no record is taken from them. The editions page says Pro is "a drop-in replacement for the open-source binary" and "distributed in two forms: a Docker image and pre-built binaries" on the Pro install page; no Pro install route is recorded as an installMethod because it requires a GitHub token from the vendor. The Docker Hub count is the image the deployment page links, anycable/anycable-go. The npm package named by the install page, @anycable/anycable-go, is the wrapper that installs the matching binary, so its 172 downloads a week are recorded as its own figure. The first tag is 0.1.0, commit dated 2016-09-03, which is the firstRelease year. The LICENSE copyright line names one person, so the maintainer is recorded as an individual. The homepage footer credits Vladimir Dementyev and Evil Martians; the LICENSE line names only the person. The message brokers are the embedded NATS server, Redis and NATS (homepage). The docs footer X link is twitter.com/any_cable. The documentation's "Are you an LLM" text is page data addressed to agents and was not followed. The repository's stars and contributors come from the API; the candidate row figure of 2.4k is stale.
  The homepage and the editions and getting-started pages state the features the record's prose names: delivery guarantees with recovery after disconnects, presence tracking, message ordering, reliable streams, signed streams and JWT (editions page), and no additional infrastructure needed for operation and scaling, with an embedded NATS pub/sub server and optional Redis or NATS (homepage). The editions page names Apollo GraphQL, long polling and OCPP as Pro-only protocols. The install routes are Homebrew, the release binary, npm and Docker, each recorded as its own installMethod.
