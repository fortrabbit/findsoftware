notes: >
  No homepage is linked: the GitHub homepage field points to endler.dev/2019/tinysearch, a blog post by the maintainer that the README lists among sites using tinysearch, so it is not the project's own site; a reviewer may decide otherwise. The README names Jekyll, Hugo, Zola, Cobalt and Pelican as static site generators it is used with, and lists sites that use it; neither is recorded as a field. The README says tinysearch is a Rust and WebAssembly port of Python code from an article on stavros.io, which is a source and not a parent. Other maintainers named in the README are Jorge-Luis Betancourt and Mad Mike. The GitHub license is Apache-2.0 alone while the README and Cargo.toml state Apache-2.0 OR MIT; the wordings are one entry. The 0.6.x releases are marked as prereleases on GitHub and are excluded from the major; the crates.io uploads 0.1.0 and 0.1.1 from 2019 are older than the first GitHub tag, so they set the firstRelease. The README lists the endler.dev blog and two other sites as users, which are not recorded. The README's binaryen optimizer is a build tool the install uses, not a runtime.
