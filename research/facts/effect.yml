notes: >
  General-purpose utility library: in only if general utilities count as web helpers (open for Frank). The package is a general TypeScript library for production applications; its README and homepage name no web-specific use beyond the platform packages in the monorepo (browser, Bun, Deno and Node.js platform services, SQL clients, AI providers and atom bindings), which are separate packages. The stars, contributors and npm figure belong to the monorepo Effect-TS/effect and the package effect, which the README names as the core package. The npm registry lists versions of "effect" from 2015, which do not match this project (the registry created date is 2022-11-23), so no npm first release is used; the oldest effect@ tag in the monorepo is effect@2.0.0, committed 2024-01-03, but the repository holds about 14,600 tags of other packages that were not all dated, so firstRelease is not recorded. The docs install page says "Node.js 18 or newer, Deno, and Bun are supported" and "Node.js 22.18 or newer can run TypeScript files directly"; the README says "Node.js 22.19 or newer is the general minimum", so the project's own pages disagree and runtimeMin is not recorded. The install page gives npm, pnpm, yarn, bun and deno commands in code blocks under "Install the necessary package as dependency:", which is no route sentence, so installMethod is not recorded. The README's package table names SQL clients for PostgreSQL, MySQL, Microsoft SQL Server, SQLite, libSQL, Cloudflare D1, PGlite and ClickHouse; these are client packages of the monorepo, so databases is not recorded as a field and the list is left to the reviewer. The README names a long-term support line for Effect 4.x and says Effect v3 lives on the v3 branch; both are notes and not fields. The homepage and README name a LinkedIn account, which is not a field. The maintainer's copyright line names Effectful Technologies Inc, and the effectful.co footer reads "© 2025 Effectful Technologies Inc."; no country or address is stated, so hqCountry is not recorded. The category is open: the CSV lists validation, schema and effect-system, and the README describes unified schema validation as one of its areas. The repository was created 2019-11-13 and last pushed 2026-11-08.
