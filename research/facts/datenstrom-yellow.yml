notes: >
  The repository has no GitHub releases and no tags; the What's new page dates Datenstrom Yellow 1.0 to 2026-09-25 and lists 0.9 and 0.8 before it, so no first release date is stated and the newest commit (2026-10-23) shows the project is active. The product page says Open source, see license terms; the license terms page and the repository's license.md hold the EUPL 1.2 text, and GitHub detects no license. The maintainer is the developer the extensions page names for the core extension; the site is branded Datenstrom with no legal form, and the root page says Technology from Sweden, which does not state a headquarters. The product page lists Scope of use as small websites, extensions for features, languages and themes, Markdown text formatting, and documentation in English, German and Swedish. Product information: a database is not required. The help shows installation on a web server and on a computer with php yellow.php serve, which runs PHP's built-in web server. The CMS category rests on the homepage statement that pages are edited in a web browser after login; a reviewer may decide whether that counts as a content management system or a website generator.
