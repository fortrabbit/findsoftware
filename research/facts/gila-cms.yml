notes: >
  No GitHub release or tag exists, so currentMajor and latestReleaseDate are not recorded. The readthedocs page reads "Gila CMS 2.0.3 documentation", which the docs state but no registry confirms. The readthedocs install page says "PHP 7.4+", while composer.json on the default branch requires "^8.0"; runtimeMin records the composer.json value and the docs statement is unresolved. The repository was last pushed on 2023-07-15 and is not archived; no page or registry states the project has ended, so the status stays accepted. The Packagist entry gilacms/gila exists with no versions, and its 31 downloads are recorded as the total the API states. The homepage describes website-builder, CRM and email-marketing features; only the "Website Builder" term is recorded as a category. The composer.json description reads "A framework to build your next awesome web application", not recorded. The license is BSD-3-Clause in both LICENSE and composer.json. The maintainer is the copyright holder of the LICENSE file, an individual.
