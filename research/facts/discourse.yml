notes: "There are no GitHub releases; the latest version comes from the tag v2026.9.0 as endoflife.date lists it. Versions use year.month, so currentMajor is the 2026.9 cycle and not a semantic major. The README gives Ruby 3.4+ as the minimum for the codebase, while INSTALL.md gives Ruby 3.2+ under software requirements; both are recorded. The README says the self-hosted install is one command that runs the discourse_docker launcher. The GPL statement appears as GPL-2.0 in the API and as GPL-2.0 or later in the README, both recorded. The contributor count includes anonymous contributors where GitHub lists them."
