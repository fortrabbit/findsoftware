notes: >
  Status: the CSV row is boundary; the ruling for this wave accepts load testing under category testing. Monorepo: no, a single repository. The homepage and the README describe Grafana k6 as open source; Grafana Cloud k6 is the SaaS form with free and paid plans and volume pricing (no prices recorded), so no paidEdition. The k6 Studio desktop app, the k6 Operator and Grafana Cloud k6 are separate products and are not recorded as features. Protocols named on the README: HTTP, WebSockets, gRPC and Browser; scripts in JavaScript or TypeScript per the homepage. The README links the k6 category of the Grafana community forum as Community Forum, recorded as forum. Chocolatey and Windows Package Manager packages are third-party (the install page calls the Chocolatey one unofficial and the winget manifests community-created), so they are not installMethod entries. The latestReleaseDate is the 1.8.3 backport release of 2026-11-13, a day after the 2.4.0 release that sets currentMajor. firstRelease 2016 is the commit date of tag v0.0.1 (2016-08-19), older than the first GitHub release (v0.6.0 prerelease, 2017-01-18). The Go module has no download figure. The install page names Linux, Mac and Windows packages; apt, dnf and Homebrew are separate routes on the install page. The README says scripts run on the CLI, in CI, or across a Kubernetes cluster. The README example scripts set thresholds and ramp virtual users through stages, and the README says extensions add new protocols and use cases. The maintainer and the legal name come from the privacy notice (Grafana Labs Inc.), and the OSS page calls the company Grafana Labs, which owns the project after acquiring the startup that started it.
