notes: >
  Versions: the rocicorp/mono repository holds the Zero package (packages/zero) and the Replicache packages; no GitHub release names Zero (the two releases are v12.2.1-source and v12.2.2-source, from 2023). The major, the registry dates and the npm figures follow the zero/v1.11.3 tag and the @rocicorp/zero npm package; the npm latest is 1.11.3 (2026-10-23), the newest canary 1.12.0-canary.12 (2026-10-31). The firstRelease 2024 is the year of the Zero package's first npm version (0.0.0-202410031711, 2024-10-03); the oldest repository tag (v0.0.1, commit 2020-06-09) is a Replicache-era tag and is not Zero's. The npm weekly figure for 2026-10-26 to 2026-11-01 is 276665; the CSV figure of 121.4k per week was from an earlier window. The npm package author field reads "Rocicorp, Inc." while the terms, privacy policy and footer name Rocicorp, LLC; the LLC is recorded from the terms and the npm author is not. The terms name California only as the governing law and venue, so no hqCountry was recorded. Pricing tiers (Hobby, Professional, BYOC) are hosted plans, not a paid edition; no prices are recorded. Zero's own page says it also has paid support options and closed-source companion software may come later; neither is a recorded edition. The homepage and docs say the sync design works with Postgres replicas; the Docker Hub image rocicorp/zero is the one the deployment page names (version tags 1.11.3). The REST APIs docs page (zero.rocicorp.dev/docs/rest) describes a REST surface an app builds from its own mutators, not an API the software ships, so headlessApi is not recorded. The Zero client is described as client-side without a browser statement, so runsAs is recorded only for the server parts.
  Further statements from the pages read: the homepage says all reads and writes flow through the app code on the app server, and that Zero works with normal Postgres schemas; the deployment page says a self-hosted Zero needs zero-cache, a Postgres database, the frontend and an API server for the query and mutate endpoints; the install page says the development Postgres needs logical replication enabled.
  The homepage says the zero-client keeps a client-side store of recently used rows, that queries answer locally first and that the server returns authoritative results asynchronously.
  Reviewer: the rocicorp/mono README (read on the default branch) says the repository is published from an internal repository, that releases of Zero are built and published from it, that zero-cache, zql and zqlite tests were removed on 2026-09-30 and that those earlier published copies remain Apache 2.0; the packages zero-cache and zero-client still hold source, and packages/zero/package.json on main reads Apache-2.0 with the author Rocicorp, Inc. The repository history was rewritten on 2026-09-30, so tags older than that date may differ from earlier clones. Contributors counted through the public API cover the published repository only.
