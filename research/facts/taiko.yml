notes: >
  Status accepted from the CSV row. Criterion 4: the newest stable release is v1.5.2 (2026-11-11), the repository is not archived, and no maintenance-mode or end statement was found in the README, the docs landing page, the overview, the FAQ or the Docker page. Criterion 3: the README names npm (global install), and the docs installing page adds an npx route and installing unreleased versions directly from GitHub; global and local npm installs are one route, npm. The package.json at v1.5.2 has no engines field, and the installing page states only Node.js latest LTS, so runtimeMin is unset. The overview compares Taiko with Selenium in its own section ("Taiko is very different from Selenium.") and in a benchmark table with WebdriverIO, TestCafe, Cypress and Puppeteer; alternativeTo holds the peers that have a fact file (selenium, testcafe, cypress, puppeteer), and WebdriverIO has none. The same section says Taiko uses the Chrome DevTools Protocol, needs no driver such as ChromeDriver, and can automate any browser that supports that protocol. The docs say Taiko drives Chromium-based browsers (Chrome, Microsoft Edge, Opera) and Firefox as an experimental feature (the docs landing page lists "experimental Taiko features such as Firefox and TypeScript support"), and not Safari or mobile applications; that is recorded here as notes only. The docs and README describe an interactive recorder, a REPL that generates a script from the commands typed. The docs recommend Gauge as the test runner (Gauge has its own record); Taiko is used with Gauge, not built on it, so basedOn is unset. The thoughtworks.com address appears only in JSON-LD on the homepage, not in visible text, so hqCountry is left unset. Stars and contributors belong to the single repository.
