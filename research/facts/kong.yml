notes: >
  The repository is open source under Apache-2.0 (api and README); the package installs the docs name are Enterprise (kong-enterprise-edition on the install page, kong/kong-gateway on the Docker page). The open source deb and rpm packages are not named by the current docs, so installMethod lists the packages the install page shows; reviewer to decide whether the list stays. The paidEdition quote is the Enterprise quickstart's license requirement; the product page's "Kong Gateway for Kong Enterprise" column lists features the open source column lacks (FIPS 140-2 data planes, Software Bill of Materials, enterprise support) and is a second source if wanted. Docker Hub pulls: kong/kong (open source image named by the repository README) has 8808391 pulls (2026-10-29); the dockerPulls fact records kong/kong-gateway, which the current Docker install page names. The product page is the homepage: it covers both the open source and Enterprise columns. Kong Gateway's GitHub releases stop at 3.9.4 (2026-10-12) while the Enterprise docs list 3.16 as latest; currentMajor is 3 on both. The first release is 0.0.1alpha-1 of 2015-02-25 in CHANGELOG-OLD.md; the repository itself was created 2014-11-17. The runtime (OpenResty/LuaJIT) is not stated on any page read, so runtime is not recorded; the README names Lua for plugin development only. The Kubernetes Ingress Controller and Kong Mesh are separate products and are not recorded here. The README links x.com/thekonginc, a second X account; the homepage links x.com/kong, which is recorded. A serverless gateway hosting option is named on the topology page, not recorded as a field. The RBAC and Kong Manager OIDC and LDAP docs pages do not say which edition carries those features; the facts record what the pages state. The product page compares an open source and an Enterprise column and links compare pages to Apigee, AWS API Gateway, MuleSoft, Postman, LiteLLM and IBM API Connect, none of which is a record, so no alternativeTo. Fields coined here: none.
