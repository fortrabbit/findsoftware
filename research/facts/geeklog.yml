notes: >
  No ended-project signal: the homepage recommends v2.2.2 for production sites and the repository was pushed 2026-10-01, while the latest release object is dated 2022-09-27. The root of the repository has no LICENSE file; the license is the documentation's statement "released under the GNU GPLv2" (public_html/docs/english/index.html on the v2.2.2 tag; the source headers add "or any later version", which the quote check cannot read), and the About page links a source download without naming a license, so no other license statement is recorded. The install page states PHP 5.6.4 as the minimum, and the homepage release notes say PHP 8.1 is supported; runtimeMin follows the install page. The GitHub API reports no license for the repository. Fields coined: none.
