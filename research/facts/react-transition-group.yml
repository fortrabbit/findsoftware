notes: >
  The latest stable release is v4.4.5, published 2022-08-01 on GitHub and npm; the npm next tag 2.3.0-beta.0 is from 2017 and older, so no latestPrereleaseDate. The last release is more than four years before the import date, so the import lists the record as stub; the status stays accepted here. The GitHub license detection reads NOASSERTION; the BSD-3-Clause comes from the LICENSE file. The README says the API from v2 on is not backwards compatible with the original React addon, and that the v1 codebase is no longer updated; the v1 branch is not recorded as a separate record. TypeScript definitions are published through DefinitelyTyped (README), a coined kind kept here. The basedOn react fact rests on the repository description, "An easy way to perform animations when a React component enters or leaves the DOM", which names React as the target; the homepage and README text do not. The maintainer is the LICENSE copyright line, React Community. The homepage lists the components Transition, CSSTransition, SwitchTransition and TransitionGroup. The homepage says the library is not an animation library like React-Motion and does not animate styles by itself; it exposes transition stages, manages classes and group elements, and manipulates the DOM. Stars and contributors belong to the repository; the npm and ecosyste.ms figures are for the react-transition-group package the install page names.
