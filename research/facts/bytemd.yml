notes: >
  The README opens with "This is ByteMD v1 repository." and says v2 is under development in the HashMD repository (github.com/pd4d10/hashmd). The v1 repository is not archived and no page declares it ended, so the record is accepted. The bytedance/bytemd repository the npm metadata names redirects to pd4d10/bytemd. Stars and contributors belong to the monorepo, which holds the bytemd, @bytemd/react, @bytemd/vue and @bytemd/vue-next packages and the official plugins. The Installation section is a table of npm packages with no install command, so no installMethod is recorded. The React and Vue bindings are the framework packages, not a basedOn statement. The README says the component is SSR compatible, that the default npm entry supports modern browsers only, and that HTML is sanitized by default: compatibility and security claims, not fields. The Vue 2 binding is @bytemd/vue and the Vue 3 binding is @bytemd/vue-next. The npm figure counts the bytemd package the install table names.
