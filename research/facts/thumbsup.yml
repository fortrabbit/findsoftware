notes: >
  The GitHub releases list is empty, so currentMajor and latestReleaseDate come from npm: latest 2.18.0, published 2023-12-03, and the first npm version 0.0.1 (2014-04-19) gives firstRelease. The repository has no LICENSE file; the MIT license comes from the npm package and the README sentence. The package author field names Romain Prieto while the GitHub owner is the thumbsup organization; the author is recorded as the package states it. The homepage describes the project as a static gallery generator and it has a runtime Node.js dependency listed in the README requirements. Boundary for review: the output is a photo and video gallery site, which the criteria count as produced web output (criterion 1). The repository was last pushed 2026-02-28, carries no archive flag, and no page states that the project has ended. The output directory has no default in the CLI reference (the --output option is required), so outputDir is unknown. The README names exiftool and GraphicsMagick as required tools. The concepts page says the tool groups photos into albums by folder, creates HTML pages for every album, and generates thumbnails and multiple resolutions; the deployment page says the output can be browsed from disk or hosted on any simple web server, with no application server.
