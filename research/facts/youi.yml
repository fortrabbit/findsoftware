notes: >
  The youi.io address redirects to https://www.youi.io/, a single page titled "yoUI" with a disabled "Download Now" button and no install steps or links, so the homepage is recorded and nothing else is taken from it. The README's Maven badges name com.outr, which has no Central release; io.youi:youi-core_2.12 carries the releases (0.14.4, uploaded 2021-11-28). The oldest Maven upload is 0.1.0 (2016-12-22), older than the first GitHub release, so firstRelease is 2016. GitHub has release objects only through v0.10.0 (2019-01-30); tags run to 0.14.4 without release objects, so currentMajor and latestReleaseDate follow the newer Maven upload (0.14.4, lastUpdated 2021-11-28). The README's Gitter and Travis badges are chat and CI, not fields. The README says heavy development is under way toward 1.0. build.sbt sets scalaVersion 3.8.2 and version 1.0.0-SNAPSHOT1; no stable 1.x exists, so currentMajor is 0.
