notes: >
  The install docs (README) name typicms/typicms, so the Packagist figures come from that package: 230 total downloads and 18 in the last month on 2026-10-20. The candidate row's 20.4k total is the older package typicms/base (20433 total, 12 monthly on 2026-10-20), which the repository's former name used; typicms/typicms is the current package and the one the README installs. The core module package typicms/core is a sibling with 415 monthly downloads and is not recorded. The homepage names github.com/typicms/base as its link and the CHANGELOG and CONTRIBUTING links point to TypiCMS/Base; the repository fact records typicms/typicms, which the README and composer install from. The LICENCE.md copyright line gives the name without a legal form, and the project states no company, so the maintainer is the individual the license names. The README links LICENSE.md, but the file in the repository is LICENCE.md. The homepage's bluesky link is recorded as a social account only. The README lists modules (news, events, pages and others) as separate Composer packages; those are not separate records here.
