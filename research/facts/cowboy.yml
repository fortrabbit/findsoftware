notes: >
  The project has no GitHub releases; its version tags run from 0.2.0 (commit of 2011-09-05) to 2.20.0, so firstRelease comes from the oldest tag and currentMajor, latestReleaseDate and the stable version come from the Hex package cowboy, which names 2.20.0 as latest stable. The first Hex upload is 1.0.0 of 2014-08-01, later than the tag. The README says Cowboy uses Ranch for managing connections; that is recorded as a dependency in the text and not as basedOn, since the project does not call Ranch its parent. The user guide's Erlang.mk and rebar examples and the release chapter are the install and run sources; the guide's getting started chapter uses relx for the release. The maintainer name is the copyright holder in LICENSE; the organization ninenines owns the repository. The site ninenines.eu serves over https and lists Cowboy, Cowlib, Erlang.mk, Gun and Ranch as projects of the same author. The introduction names HTTP/1.1, HTTP/2, WebSocket, Server-Sent Events and Webmachine-based REST as supported; these are not recorded as fields because the field list has no protocol list.
