notes: >
  Repository only: the NuGet projectUrl and the repository homepage are the GitHub repository and no project site exists, so no homepage is recorded. Install is the NuGet package named in the README; the package Infidex 1.0.8 was the newest stable release, GitHub v1.0.8 dated 2025-11-30. The NuGet catalog holds 1.0.0 published 2025-11-21, the oldest upload, so firstRelease is 2025; GitHub lists releases only from v1.0.2. The csproj on the v1.0.8 tag targets net8.0 and net10.0; the csproj Version line still reads 1.0.7, which the reviewer may treat as a stale value. The README says the index persists to disk via Save and Load, which is a feature of the library, not a runsAs statement. NuGet totalDownloads is 5981 (all versions), and the candidates CSV figure 5365 is stale. The LICENSE copyright line names the maintainer as an individual; the GitHub owner is a user account. The copyright year on the LICENSE is 2025.
