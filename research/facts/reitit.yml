notes: >
  Homepage is not linked: the project has no site of its own in the README. The documentation is hosted on cljdoc, a third-party documentation host, and is recorded as docs. The README gives the status as stable, which is not a field. The CSV row named cljdoc as the homepage; the rule that the homepage is the project's own site rules it out. The highest stable GitHub release is 0.11.0 (2026-09-18); 0.11.0-rc1 is older than the latest release, so it is not a latest prerelease. The GitHub releases list starts at 0.9.2-rc1, so firstRelease comes from the changelog, whose 0.1.0 entry is dated 2018-2-19 and labeled "First release" there. The Clojars downloads figure is the all-time total. The maintainer is Metosin Oy, as the README's copyright line names it; the README also calls Metosin a consulting company. No page read states a headquarters country (the company site lists Finnish cities without naming the country), so hqCountry is absent. The README also gives a Clojurians Slack channel for discussion, recorded as slack. The Clojars group is metosin for the bundled artifact, and the fi.metosin group is used for reitit-openapi only. The CSV scope note said router library; the categories value is library because the import maps router to library.
