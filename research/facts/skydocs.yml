notes: >
  The repository is archived on GitHub (archived true, checked 2026-10-23) and the project's own site links to it as the source code, so the status is discontinued. The README and the site do not state that the project has ended, and the site still answers. The latest stable release is v0.7.4 (2019-02-16), so currentMajor is 0. The releases run from v0.1 (2017-06-19); firstRelease is the year of the oldest one. The last commit on master is dated 2020-08-05. The maintainer is Skyost, as the site's About page states; no page names a legal person. The documentation pages do not state the output directory of the build, so outputDir is unknown.
