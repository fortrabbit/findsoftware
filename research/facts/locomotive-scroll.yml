notes: >
  The README and the docs introduction say version 5 is built on top of Lenis, a separate smooth scroll engine (lenis.darkroom.engineering) that the bundle includes. Lenis has its own record (lenis), so basedOn names it. The docs say the library may not be fully compatible with server-side rendering, because it relies on the window reference and Intersection Observer; that is a compatibility statement, so renderingModes is not recorded. No page states that the library runs in the browser: the docs say it uses the browser's native Intersection Observer API, which is not a runtime statement, so runsAs is not recorded. The LICENSE copyright line names Locomotive Inc., and the homepage calls the company Locomotive; the Montreal address and the country come from the company's own site footer, which says "Based in Montreal, Canada" and gives a street address in Quebec. The docs footer links LinkedIn (https://www.linkedin.com/company/locomotive-mtl/), a field with no entry in the dictionary, so it is named here only. The v5.1.0 beta (5.1.0-beta.1) is older than the v5.1.0 release, so no latestPrereleaseDate is recorded. The first tag in the repository is 3.0.0 from 2019-07-11; the GitHub releases start with 3.4.5 in 2020, and the older tags are not on GitHub releases, so firstRelease uses the tag. The npm figure is the locomotive-scroll package the install docs name; the NPM route and the CDN route are separate installMethod entries. The docs list Lenis 1.3.27 as the bundled engine and the homepage calls the library a wrapper around Lenis; the bundled engine version is not recorded. The README and the docs introduction describe parallax effects set with the data-scroll-speed attribute.
