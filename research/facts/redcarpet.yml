notes: >
  No project site exists. The GitHub repository has no homepage, and the gem's homepage_uri names the repository, so homepage is left out. The README is the documentation. The repository has no LICENSE file; the COPYING file holds the MIT text with the copyright lines "Copyright (c) 2009, Natacha Porté" and "Copyright (c) 2015, Vicent Marti", and the README's "Boring legal stuff" section holds "Copyright (c) 2011-2016, Vicent Martí". Both name the same MIT license, so one license entry is recorded, and the maintainer follows the README line. The README says Redcarpet "was written by Vicent Martí. It is maintained by Robin Dupret and Matt Rogers"; a reviewer may decide whether the current maintainers should be the record's maintainer instead. The gem's authors field names Natacha Porté and Vicent Martí. The README credits the Sundown library and its authors as the basis of the parser; "would not be possible without" is not a based-on statement, so no basedOn is recorded, and Sundown has no record. The renderers named on the README (HTML, XHTML, HTML_TOC, StripDown, and the SmartyPants module) are kinds for notes, not fields. The README says custom renderers are created by inheriting from a built-in renderer and overriding the methods for individual elements. Language is the GitHub primary language C; the Ruby API is the runtime. The README says the gem will build some native extensions, but the parser is standalone and requires no installed libraries. The rubygems upload of 3.6.1 is dated 2025-02-25, earlier than the GitHub release dated 2025-03-06; latestReleaseDate follows the GitHub release as the candidate row records. The gem's first version 1.0.0 was uploaded 2011-03-29, which matches the repository creation in 2011. Stars and contributors are the repository's own counts. The rubygems downloads figure is the gem total as reported by the registry.
