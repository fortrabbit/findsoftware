notes: >
  The project has no site of its own; the repository is the only project page, so homepage is not recorded. There are no GitHub releases; the tags run to v0.1.6 and the PyPI release 0.1.6 (2020-08-31) is the registry's stable version, which gives currentMajor 0 and latestReleaseDate. The earliest PyPI upload is a development release 0.1.dev1 (2016-08-18); firstRelease uses the first stable release 0.1 (2017-02-22). The LICENSE lists three copyright holders (Miro Hrončok, Honza Javorek, Petr Viktorin); the first is recorded as maintainer. The GitHub license field reads NOASSERTION while the README states MIT. basedOn Frozen-Flask is not recorded: the README says Elsa helps build Frozen-Flask based websites and treats a Frozen-Flask warning as an error, but does not state that Elsa is built on it. The README says the tool is based on scripts from the PyLadies.cz repository, which is a website and not recorded as a parent. The quickstart deploys through Travis CI to GitHub pages; the README says the Travis CI deployment force-pushes the gh-pages branch in a single commit, and that a URL without a trailing slash makes GitHub Pages serve the wrong content type, so Elsa treats that mismatch as an error.
