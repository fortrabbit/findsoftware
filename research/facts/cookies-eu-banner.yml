notes: >
  The homepage is the project's GitHub Pages site, which the GitHub repository names as its homepage. The package is MIT licensed under the npm license field and the LICENSE file; the README says the project is MIT-licensed and that the Patreon and PayPal donations are support, not an edition, so no paidEdition is recorded. The headless build (cookies-eu-banner/headless) are install and API details not recorded as routes. The library is TypeScript: the README says it is "written in TypeScript" and the repository language is TypeScript. No page says in a sentence that the library runs in the browser (the README only lists supported browsers), so no runsAs is recorded. The banner attaches as a template element plus a script, from a package manager or a CDN. Coined and not recorded as fields: the bot and Do Not Track checks, the headless UI mode, the document.cookie choice, and the Google Analytics cookie removal on reject. The maintainer's other projects and donation pages are not recorded. The Bluesky link is the author's personal account on the presentation site, recorded as the social account the site names. The latest release tag 3.0.0 matches npm latest, and the release is not a prerelease.
