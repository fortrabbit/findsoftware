notes: "The GitHub release list marks 3.0.0-beta.672 (2026-10-16) as a non-prerelease, so latestVersion from the API is a beta; the stable line is 2.x, and latestVersion and latestReleaseDate above take the stable line. The homepage shows Stable 2.5.316 while the GitHub stable release is 2.5.315; both are recorded. The 3.0 beta docs (docs.js.wiki) require Node.js 26 and PostgreSQL 18, and the stable docs (docs.requarks.io) list Node.js 22 and 24, so runtimeMin 22 is the stable line and 26 belongs to 3.0. The 3.0 beta docs describe PostgreSQL as required; the stable requirements page calls it highly recommended. The Docker install guide uses the 3.0 beta image tag. The GitHub API lists beta.js.wiki as the homepage; the project's own homepage is js.wiki, which is the value recorded. The contributor count includes anonymous contributors."
