notes: >
  Adds full-text search to Java applications that use Hibernate ORM, with local Lucene indexes or a remote Elasticsearch or OpenSearch cluster that is configured separately; it ships no server of its own, so runsAs is not recorded. The 8.4 reference states Java Runtime 17, 21 or 25; the 8.4.0.Final pom sets the release target to 17. The homepage releases table lists 8.4 as latest stable and 9.0 as development; 9.0.0.Beta1 is the newest tag and is a beta, so it is latestPrereleaseDate. GitHub marks 9.0.0.Beta1 as its latest release; the brief's stable rule keeps currentMajor at 8. firstRelease comes from the 3.3.0.Alpha1 tag commit date (2010-07-26): GitHub lists no release before 4.4.1 (2014). It is built on Hibernate ORM (the reference heading reads "Supported frameworks when integrating into Hibernate ORM"); Hibernate ORM has no record, so basedOn is not recorded. Maintainer is the footer copyright "Hibernate."; the Commonhaus foundation appears only as a membership link, so no legal form is recorded. The Maven artifact hibernate-search-mapper-orm starts at 6.0 on Maven Central; earlier releases shipped under other artifacts, so no Maven first-upload date is recorded.
