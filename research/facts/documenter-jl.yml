notes: >
  The package is registered in the Julia General registry, which has no field in the dictionary, so no registry figure is recorded. The repository's Project.toml states julia = "1.6" as the compat bound; it is a repository file, not a page, so runtimeMin is not recorded. The homepage names GitHub Actions, Travis CI and Woodpecker CI, and the hosting guide names GitLab and other deployment systems. The hosting overview page is read; deployTargets lists GitHub Pages only, the target the homepage names, and the GitLab and Woodpecker pages are not read. The homepage lists the features Markdown input, doctests of Julia code blocks, cross references, LaTeX syntax, and checks for missing docstrings and incorrect cross references. The oldest tag is v0.1.0 (commit dated 2016-06-16); the oldest GitHub release object is v0.8.1 (2016-12-02). The latest stable release is v1.19.0 (2026-09-02). The LICENSE copyright line dates from 2016-2021 and names three people and the contributors; the maintainer field follows that line. The README says the package is tested against and developed for Julia 1.6 and above; that is a development statement, so runtimeMin is not recorded. The README also names the #documentation channel of the Julia Slack and a Gitter room, which have no field. Hosting guide: GitHub Pages hosts the generated HTML files (deployTargets is a coined field, not recorded).
