notes: >
  No homepage: the GitHub homepage field is empty. The README's sample blog at monkeyman.flotsam.nl is a sample, not the project's site. The repository has no release and no tag, so the last commit on the default branch decides listing; its newest commit is dated 2013-04-18 by the commits endpoint, while the GitHub pushed_at field is 2015-01-19. The maintainer is not recorded: neither the README nor the COPYING file names the author, and the GitHub profile name of the repository owner (Wilfred Springer) is not a project statement. The README says the project will no longer be maintained if a solution with its feature set arrives; that is a conditional statement, not an end signal, and is not recorded. The releases are linked to the project wiki, which this record does not read.
  The README describes live updates when files change, layouts in HAML, Jade, SSP or Mustache, Markdown content with YAML front matter, and LESS and ZUSS to CSS transformation. The README lists the server command for the preview and the generate command for the static build.
