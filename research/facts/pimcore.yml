notes: >
  The license is stated two ways. LICENSE.md at the release tag names the Pimcore Open Core License (POCL), and the README and editions page use the same name. Packagist shows the license of the release as "proprietary", which the project does not state on its own pages; both are recorded as sourced. GitHub reports the license as NOASSERTION because POCL is not an SPDX identifier. Section 1.2 of LICENSE.md grants a free license for Production Use to organizations under a revenue threshold of EUR 5 million, self-certified, and section 1.3.1 says the Customer may not offer the Software as a hosted or managed service; these terms are not a field in the starter list and stay in notes. OpenID Connect appears on the editions page only as an Enterprise-edition module, so sso is not recorded for the core. The version is a calendar version (2026.3.2), so currentMajor is 2026 and the platform's own YEAR.MINOR scheme applies. The docs installation page says "Pimcore 2026.x uses Docker for local development and installation"; the installer and Docker environment are the install path shown there. The skeleton and demo packages are named by the docs; installMethod stays with the docs' own wording. The maintainer is the legal entity named in the copyright line of LICENSE.md. The README describes background processing through Symfony Messenger without stating whether a worker runs on the live site, so no runsAs value is recorded. The contributors figure is the total from the paginated contributors API with anonymous contributors included. The packagistDownloads figure is the total from Packagist; the monthly figure of 70246 is not recorded. The endoflife.date API returns 404 for pimcore, so endoflifeId is not set.
