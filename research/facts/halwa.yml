notes: >
  The GitHub repository has no release or tag. Its registry release is PyPI halwa 0.1.9, uploaded 2014-03-04, which sets currentMajor and latestReleaseDate, so no lastCommitDate is recorded; the newest commit on master is dated 2014-05-21. The PyPI JSON shows no download counts, so pypiDownloads is the last_month figure from pypistats. The README does not state a Python minimum, and PyPI lists none. The first PyPI upload, 0.1, is dated 2013-02-04. The README says the sample configuration is in another repository, mhlakhani-com, which is not read. The project has no homepage on GitHub and the README names none.
