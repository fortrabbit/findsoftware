notes: >
  The guide says Vue Test Utils is framework agnostic and works with any test runner: Vitest is named the recommended runner, Jest works through vue-jest, and Cypress, Playwright (experimental) and WebdriverIO are named as browser-based runners. The guide names Cypress Component Testing and Testing Library as tools that use Vue Test Utils under the hood, which is an integration, not an alternative. The guide says Vue Test Utils 1 targets Vue 2 and the migration page covers the move, so the v1 line is not a separate record. The installation page lists yarn and Deno commands for the same npm package; they are the npm route. The docs homepage links the Vue community chat (chat.vuejs.org) under a discord label; it is the general Vue chat, not a project channel, so no discord fact is recorded. The LICENSE copyright line names vuejs; the docs footer names Evan You, and the maintainer follows the LICENSE. The repository holds the single @vue/test-utils package, so stars and contributors belong to it. The v2.6.0 release is on npm dated 2026-11-15 and as a GitHub release dated 2026-11-16; the later date is recorded. The npm figure counts downloads of @vue/test-utils. The earliest npm upload of the same package name is 1.0.0-beta.10 from 2018-01-10, which sets firstRelease, ahead of the 2020 creation date of this repository.
