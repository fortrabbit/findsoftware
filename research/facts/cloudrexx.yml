notes: >
  The CSV row says hosted-service because no repository was found. The Cloudrexx GitHub organization says its repositories moved to Bitbucket, and the Bitbucket workspace holds the public repository cloudrexx/cloudrexx-oss (AGPL, default branch main, last updated 2026-10-20). The source is public and runs locally through the cx command line interface, but the dev docs call the on-premise releases discontinued and describe Cloudrexx as a SaaS, so the record is hosted-service with the ended self-hosted line noted here. Cloudrexx AG also sells Cloudrexx as a SaaS hosted on servers in Switzerland only (FAQ); no price is recorded. The dev docs System Requirements page says "Cloudrexx is a software as a service and does therefore not require any installation" and calls the legacy on-premise releases discontinued; the local Docker environment is the documented way to run the open source code, so runsAs is local only. The Bitbucket tags are the release source: cloudrexx_5.1.1 (2021-03-26) is the highest stable tag, so currentMajor is 5, and the repository has no older tag, so firstRelease is unknown. The System Requirements page says the product runs on "a classical LAMP stack"; no database engine is named, so databases is unknown. The About page calls Cloudrexx "die SaaS-Version des bewährten Contrexx-Systems" and dates the first Contrexx version to 2005-04-04; Contrexx is not a candidate and no successorOf is recorded. The i18n and userRoles statements come from the product page at /de/cms/funktionen.
