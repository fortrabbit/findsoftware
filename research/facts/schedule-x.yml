notes: >
  The npm package the install page names is @schedule-x/calendar; the registry name "schedule-x" is an unrelated fork (0.0.9, 2025) and is not recorded. The CSV figure of 104.6k a week is stale: the npm range for 2026-11-01 to 2026-11-07 gives 279835. Framework components for React, Vue, Angular, Svelte and Preact (@schedule-x/react and the others) are official bindings of a framework-agnostic core, so no basedOn is recorded; the calendar package lists preact, @preact/signals and temporal-polyfill as peer dependencies, which are not parents. The GitHub repository description reads "Modern alternative to fullcalendar and react-big-calendar", which the project states in its own words; fullcalendar has a record, so alternativeTo records it, and react-big-calendar has none. The Premium edition is a commercial license with one license per project and yearly or lifetime plans; the terms say "Use it whatever way you see fit, except reselling the Schedule-X premium source code", and no price is recorded. The docs navigation marks ten plugins with a star, among them Drag and Drop, Gantt chart and Draw; the page does not say what the star means, so it is not recorded. The Cloud plans on cloud.schedule-x.com include a free plan; prices and plan limits are not recorded. Cloud pairs the Premium UI with a managed backend and Google Calendar sync. The imprint names Tom Österlund, Schedule-X, as a sole proprietorship (Einzelunternehmen) not entered in the commercial register, with an address in Heroldstatt, Germany; the trading name is not a separate legal entity. The LICENSE copyright line reads "2023 Tom Österlund" and the README reads "2023 - present". The docs and README name dark mode, responsive layout, drag and drop, event resizing, LTR and RTL writing, and a calendar MCP server for AI agents; these are features and kinds, not fields. The docs CDN example pins version 2.2.0; no version is recorded. The homepage demo says a working calendar is "powered by sample data in the browser", a demo statement; no sentence states where the library runs, so runsAs is left out for the reviewer to decide. The X link appears only in a README badge and is recorded without a quote. The homepage has no x or discord links.
