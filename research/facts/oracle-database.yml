notes: >
  Boundary row from the CSV: no repository exists, and the release date was not read from the own site. This record is accepted on criterion 2 (a documented self-install: RPM, ZIP, Docker image and Windows download) and on criterion 4 (no end signal found on the own site). A reviewer decides whether the missing release date is enough to hold the listing: the four-year rule needs a date, and none is on the pages read. The newest RPM named on the install guide is 23.26.2, and the download link on the Free page names 23.26.3; the release date of those files is not on any page read, and the installation guide page carries only a "July 2026" document date, which is not recorded as latestReleaseDate. The version line is 26ai (the product name) on 23.26 numbering, so no currentMajor is recorded. The product was renamed to Oracle AI Database 26ai, so the name follows the new product; the CSV name is Oracle Database. The Free edition has resource limits (2 CPUs, 2 GB RAM, 12 GB user data) and is not supported and gets no patches; the features not included are listed in the Oracle AI Database Licensing Guide, which is script-loaded and was not readable, so paidEdition rests on the FAQ's statement that patches require a fully supported edition, and a reviewer may want the feature list. The Oracle Free Use Terms are the free edition's license; the paid editions are under an Oracle license agreement, as the license page says, so both statements are recorded. The maintainer is Oracle America, Inc. as the Free Use Terms define "Oracle"; no page read names Oracle's headquarters country, so hqCountry is left out. Runtime is not recorded: no page states how the database binaries run, and no page says the database runs as a service. The Docker image is at container-registry.oracle.com, which has no pull count, so no dockerPulls value. The Free FAQ's statement that the Free edition is not supported is recorded in notes, not as a status.
