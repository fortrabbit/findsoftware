notes: >
  The homepage and install page are read, and the README and manual name no hosted offering: the /cloud/ and /pricing/ paths return 404, so no hostedOffering is recorded. One license entry, GPL-3.0: GitHub reports GPL-3.0 and the README words the same license as "GPLv3 or later". The LICENSE file is the unmodified GPL text with no copyright line for the project. The manual states the daemon is C++ and that Manticore Buddy, a component installed with the packages, is written in PHP; php is not recorded as runtime. The README names Elasticsearch as an alternative ("It is a great alternative to Elasticsearch"), which is not recorded as alternativeTo because it is a marketing sentence rather than a named relation. The README names Slack and Telegram chats, which have no field. The manual names the data directory ./data/ and the Columnar Library, which are not recorded as contentStore. The release tags use two schemes (release-29.9.0 and 27.1.5); the highest stable major is 29, from release-29.9.0. The first GitHub release is 2.3.3-170706 (2017-07-11). The README lists Craigslist, Socialgist, PubChem and Rozetka as users, and no count, so no reportedInstalls is recorded. The HTTP Archive technologies list does not carry Manticore Search, so httpArchiveSites is not recorded. The README's Slack and Telegram chats and the homepage reached with this user agent show no bluesky, mastodon or discord link.
