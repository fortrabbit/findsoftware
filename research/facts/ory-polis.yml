notes: >
  The highest stable release is v26.2.0 (2026-03-20), a calendar version, so currentMajor is not recorded; the line is 26.2. The oldest tag v0.2.2 has a commit dated 2021-12-16, the same as its GitHub release, so firstRelease is 2021. The project was published as BoxyHQ Jackson: the README says "Ory Polis - formerly known as BoxyHQ Jackson". The Docker image boxyhq/jackson and the npm package @boxyhq/saml-jackson keep the old name and are the install names the docs give, so both are recorded under their own fields. The service guide installs the service from the Docker image or a pnpm source build, not from npm; @boxyhq/saml-jackson is the embedded library, so its weekly downloads (84194, 2026-10-26 to 2026-11-01) are held here and not recorded as a field. The LICENSE file names no copyright holder; the maintainer and hqCountry come from the Ory privacy policy. The runtimeMin comes from the root package.json at v26.2.0, which the repository uses for the service; it is the engines field, not a build tool version. The pages say the service can be configured in Docker Compose and Kubernetes orchestration; the health endpoint /api/health is documented in the quickstart. The README describes the separate service as a Next.js application with an admin portal; the npm library is an embedded alternative to running the service. The README's Discussions link is recorded as forum and its newsletter link as newsletter. The README names SCIM and Directory Sync as the directory feature; SCIM is recorded as protocols. The database list is the one the quickstart gives; the PlanetScale and Neon pages it links are hosted services and are not recorded as databases. Homepage social link: X at https://x.com/orycorp. The contributors count is the last page number of the contributors endpoint with per_page=1. The OSS introduction at https://www.ory.com/docs/oss/polis describes the same SAML and OIDC features. The homepage footer links X (recorded), YouTube (recorded as youtube) and LinkedIn (no field).
