notes: >
  wso2.com and is.docs.wso2.com answer 403 with a bot-check page and were not retried. The docs are read from their source repository, wso2/docs-is on GitHub (folder en/identity-server/7.3.0 and the shared en/includes folder), whose pages are cited as GitHub blob links; the homepage, docs and hostedOffering facts rest on the README alone.
  Criterion 1 holds: the docs overview says the server's Management APIs are "consumed by an application with WSO2 Identity Server as the Identity Provider", and the README names an authentication API for in-app sign-in, so a site or app calls the server. Criterion 3: the README and the install page give the steps (JDK, unpack the distribution, run the wso2server script, open the console at https://localhost:9443/console). Criterion 4: no end signal; the latest stable release is v7.3.0 on 2026-05-13.
  runtimeMin 21 comes from the 7.3.0 install page, which describes the latest release; the README (also at the v7.3.0 tag) still says JDK 11 through JDK 21, which is not recorded.
  The docs list the embedded H2 database as the default and recommend an industry RDBMS such as Oracle, PostgreSQL, MySQL or MS SQL for production; H2 is not in the databases vocabulary. User stores can be JDBC, LDAP (OpenLDAP) or Active Directory, or custom stores; LDAP is recorded under sso.
  The README's Asgardeo link is a hosted offering "built on the same technology core"; the hostedOffering fact records the README's offer. The README also names "Private Identity Cloud", which is not recorded.
  The LICENSE file is the plain Apache 2.0 text with no copyright line, so the maintainer follows the README footer "(c) Copyright 2019 - 2026 WSO2 LLC."; no legal notice page was readable, so hqCountry is absent.
  The README's Digital Public Goods badge, the Jenkins build badges and the Stack Overflow tag wso2is (the README's help link uses the tag wso2-is) are no fields beyond the forum link.
  Commercial support: the README describes a WSO2 on-premises subscription for expert support, updates and a licensed distribution; this is paid support, not a paid edition, so no paidEdition fact.
  The oldest release is product-is-5.1.0-M1 from 2015-04-30 (a prerelease) and the oldest tag identity-server-parent-5.1.0 is dated 2015-02-06, so firstRelease is 2015.
  The CSV note "criterion 5 met by company behind it" holds: WSO2 LLC is named as the copyright holder; the adoption figures are stars and contributors, both dated 2026-11-03.
  The database pages also cover IBM DB2, Oracle RAC and a remote H2, which are outside the databases vocabulary.
  The README names a Developer and Administrator Console (/console) and an End User Portal (/myaccount).
  The docs guide multitenancy with tenant domains; not recorded as multisite. The GitHub organization profile gives a location (787 Castro Street, Mountain View, CA 94041), which is no notice address of the maintainer, so hqCountry stays out.
