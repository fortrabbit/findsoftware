notes: >
  The repository has no GitHub release or tag, so no release fields are recorded and lastCommitDate is. The project's own README says it is open source since 2026, which the repository creation date (2026-07-15) matches; firstRelease is not recorded because no release exists. The README describes Sitepins Cloud as a hosted option ("Try Cloud Version for Free", pricing page); no price is recorded. The self-hosted build is described as having no plans, billing or usage limits. The README project structure lists app/ as the Next.js app that is the CMS UI and api/ as an Express and MongoDB backend; basedOn is not recorded because no sentence says the CMS is built on Next.js as a framework in the sense of a parent project. The self-hosted requirements are Node.js 22 or later, pnpm 11 or later and a MongoDB replica set. The About page says the founders also run Themefisher and Gethugothemes; the footer address is in Dhaka, Bangladesh, and the terms name Texas law, so hqCountry follows the address. The supported site generators named in the README (Astro, Hugo, Next.js, TanStack Start, Nuxt, Svelte, Eleventy, Jekyll) are what it edits, not what it runs on, so they are not recorded as basedOn. The AI assistant takes an API key from OpenAI, Anthropic, Google or xAI, which the README lists; it is not a field.
