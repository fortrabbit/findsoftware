notes: >
  The atomicojs.dev docs routes return the homepage shell, so the docs are read on the gitbook site and in its source repository atomicojs/docs. The README carries the npm badge and imports from "atomico", so installMethod is the npm package; "npm init atomico" is only the monorepo project recipe in the gitbook guides, and an unpkg import map appears in the server-rendering guide. The youtube fact is the homepage navigation link, an href with no page text to quote. The npm weekly figure is the sum of the daily downloads API for 2026-10-18 to 2026-10-24. The record does not claim a React basis: the project describes a React-like syntax but does not name a parent.
