notes: |-
  The start guide places the admin in a static files folder with an index.html and a config.yml, and says the admin signs in with a Git hosting provider (GitHub, GitLab or Gitea/Forgejo). The site answers over https and is the project's own site. The homepage calls the software a Git-based headless CMS with no database and no server; the architecture page says the CMS is served from a CDN and runs client-side without a backend server, with GitHub authentication as the only exception. The docs state it is in beta before a stable 1.0 release, so currentMajor is 0 from the highest stable GitHub release v0.250.2 (2026-10-22). No headlessApi value is recorded: the sources describe reading and writing the Git repository and a JavaScript API for customization, and do not name a REST or GraphQL content API. The license statement in the README and the LICENSE copyright line both name the MIT license; the copyright holder is the individual named in LICENSE.txt, while the GitHub organization is sveltia. No legal entity or country is stated on the site, so hqCountry is not recorded. The start guide lists GitHub, GitLab and Gitea/Forgejo as Git backends; no field holds that list.
   The homepage and architecture page say there is no database, which is why databases is unknown rather than a value. The CMS is served from a CDN or from the site's own static folder, and each project holds its own copy of the admin files.
