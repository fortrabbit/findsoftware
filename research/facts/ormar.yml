notes: >
  The repository moved from collerek/ormar to ormar-orm/ormar. The CSV and the GitHub homepage field name collerek.github.io/ormar, which now redirects to ormar-orm.github.io/ormar, so the homepage recorded is the final URL. The package's PyPI project page names the same documentation site. The README's versioning note says breaking changes bump the minor number, with 0.5.2 to 0.6.0 as the example, and the package is still 0.x, so the major line recorded is 0; the minor line of the latest release, 0.30, is the one in notes. The README says the package is "still under development" and recommends pinning dependencies; the release notes for 0.30.0 list breaking changes to relation traversal and generated SQL aliases. The README says ormar is built on SQLAlchemy core and bases its data validation on pydantic; sqlalchemy has a candidate row but no fact file yet, and pydantic has no record. The install page names optional extras for postgresql, mysql, sqlite and crypto (pip install ormar[postgresql] and similar). The README documents a migration tool, sqlalchemy-to-ormar, that translates existing SQLAlchemy models; this is recorded as importsFrom sqlalchemy. The README says the models can be used directly as request and response models with fastapi; the FastAPI integration is documented in the docs' Use with Fastapi section, which is a use with a framework and not a basedOn statement. The docs cover models, queries, relations, signals and transactions, and include a PyCharm plugin, mypy support and Alembic migration guidance; these are not fields. The runtime and runtimeMin come from the pyproject.toml at the 0.30.0 tag. The PyPI download figure is the last-month count from pypistats, and the period is in the value. The PyPI metadata gives the maintainer as Radosław Drążkiewicz, the same name as the LICENSE copyright line. The first upload on PyPI (0.1.0, 2020-08-14) is older than the oldest GitHub release (2020-09-14); both fall in 2020.
