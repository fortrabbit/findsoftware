notes: >
  Checked 2026-11-16. The GitHub license detector reports NOASSERTION, but the README and LICENSE.txt both state MIT; the license entry follows the README sentence. The GitHub latest release is 3.2.6 (2026-07-17); tags 3.2.7 and 3.2.8 have no release object, and the npm registry marks 3.2.8 as latest (published 2026-08-04), so latestReleaseDate is the registry date. The install page's npm and yarn tabs are one registry route; the CDN options (cdnjs, jsDelivr, unpkg) are one script tag route. The unscoped npm package svg.js (last version 2.7.1, first upload 2014) is an older package name of the same project and is not the install package, so it is not recorded as npmName. firstRelease is 2012 from tag 0.1, whose commit is dated 2012-12-21; the first npm upload of svg.js is 2014. The Node.js docs page says the library runs in Node.js once a DOM implementation (svgdom) is registered, so runtime is node and no runsAs is recorded; no page states a process model. The install page's CDN line is the script tag route and its download line points to the release page. The plugins page lists eleven plugins from the project and others, counted by hand. The FAQ names Stack Overflow and Gitter for help, general chat and Q and A sites, so no forum is recorded. The category svg from the CSV has no category value in the import, so only animation is recorded. The x value is the Twitter badge in the README, recorded without a quote. Gitter chat is a community chat, not recorded as forum. The stargazer and contributor counts are from the repository API on 2026-11-16 (contributors across all pages). The docs page is the 3.2 line; the README's own link points to the 3.0 docs.
