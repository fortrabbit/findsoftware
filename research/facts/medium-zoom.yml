notes: >
  Status is accepted. The README says clicking the image zooms it. The JavaScript package is installed with npm and the React component is copied into the project by the shadcn CLI from the project's own registry namespace (@medium-zoom/image-zoom), which the README states; the component and stylesheet are copied in and medium-zoom is installed as a dependency, so the route is recorded under criterion 2 by the shadcn model. The React component is a shadcn/ui component, not a React binding, and the README does not say medium-zoom is built on React, so no basedOn is recorded. The README's "Zero dependencies, any framework" and the homepage's "3 kB" and "Zero dependencies" statements are the project's own claims and are not recorded as fields. The documentation has a browser support list, which is a compatibility statement and is not recorded as runsAs; the JavaScript library is used on a page through a script tag or a bundled import, and no sentence states that it runs in the browser. The homepage lists Angular, Vue, Svelte, Solid, and Astro components; these are the project's own wrappers under one repository and are not records. The npm weekly figure covers 2026-11-01 to 2026-11-07. The npm dist-tag next (1.0.0-next.0) dates from 2018, older than the latest release, so no latestPrereleaseDate is recorded. The firstRelease year comes from npm version 0.1.0 published 2016-07-26; the GitHub tag v0.1.0 has a commit dated 2016-07-28. The maintainer follows the LICENSE copyright line; the GitHub owner is the same person. The homepage shows a monthly npm download count that differs from the registry figure and is not recorded.
