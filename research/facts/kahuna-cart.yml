notes: >
  Sold as a per-site license with a year of updates; the installed version keeps working without renewal. No public source repository: the GitHub organization kahunacart holds only kahunacart-issues (an issue tracker) and kahunacart-bench (checked through the GitHub API), so repository is absent. The about page names Andy Miller, creator of Grav, as the author. Requires Grav 2.0 or later plus the Grav Admin and API plugins; it does not run on Grav 1.7. Paid add-ons (license keys, subscriptions, newsletters, shipping, bookings, rentals, print on demand, affiliates, point of sale) and paid themes sit on the same key; the three storefront themes Kahuna, Slate and Pebble are MIT. Every release on the releases page is dated 2026, the newest core release 1.6.3 on 2026-10-23. Listed under the plugin rule: it turns Grav into e-commerce software.
