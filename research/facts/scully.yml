notes: >
  The install docs name @scullyio/init, so its npm figures are recorded; the package @scullyio/ng-lib is published from the same repository and the unscoped npm package scully is a placeholder with version 0.0.1-security, so neither is used for figures. The GitHub release list holds 35 entries, one of them a release named refs/heads/ga/changelog (2021-01-20) that is not a version; the first version release is 1.0.0 (2021-12-17). firstRelease is taken from npm because the @scullyio/init history starts on 2019-12-09, the repository creation month. currentMajor is 2 because the 3.x line exists only as npm betas (next 3.0.0-beta.1, beta 3.2.0-beta.0); latestPrereleaseDate is the newest beta, from npm only. The requirements page states that Scully v2 supports Angular 12 and above, that Angular 9 to 11 use the 1.1.1 version, which receives only security updates, and that Scully uses Chromium, which must be installable on the machine running the build. The README states the same support change. The homepage's Twitter link is recorded as x. The CSV's lastRelease of 2022 matches the last GitHub release. The repository is not archived and the README names no end of life. The README says the Angular app loads and bootstraps on top of the pre-rendered HTML. The overview page says Scully creates one index.html for each route, and the installation page says its config file lists the routes. The installation page says routes with route parameters are not pre-rendered until the config lists them.
