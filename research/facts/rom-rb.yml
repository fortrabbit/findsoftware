notes: >
  The CSV homepage is https://rom-rb.org, which redirects to https://hanakai.org/rom, the page the Hanakai team hosts for ROM with the same content; that final address is recorded, and the rom-rb.org domain stays in the repository gemspec. The repository moved from rom-rb/rom to hanakai-rb/rom; the rom-rb name is the project's own old name, and the gem metadata still names rom-rb.org. The LICENSE copyright line reads "Copyright (c) 2015-2019 rom-rb team"; the homepage footer reads "© 2026 Hanakai team" and the Hanakai page lists ROM as one of its projects, so the maintainer follows the LICENSE and the Hanakai team is named here only. No README sentence states a maintenance mode, and the latest stable release is 5.4.3 of 2025-11-20; the only later tag is the 6.0.0.alpha1 prerelease of 2022, which is older than the stable release and is not a latestPrereleaseDate. The gem package rom depends on rom-core, which declares Ruby 3.1.0 or newer in its gemspec at v5.4.3, but the rom gemspec states no Ruby version, so runtimeMin stays empty. The README's adapters (rom-sql, rom-mongo, rom-http and others) name databases only by gem name; rom-sql's README states supported Ruby versions and no database list, so no database field is recorded. The forum, Discord, Mastodon, Bluesky and newsletter links are the Hanakai-wide accounts linked from the footer of the ROM page on hanakai.org; the README also links a rom-rb Zulip chat, which is no field. The SQL guide documents PostgreSQL, MySQL and SQLite sections for rom-sql, one entry each, and the compared-to-ActiveRecord guide gives alternativeTo. The README lists core, changeset and repository components in the main rom gem, and the homepage says ROM works with document databases, search engines, HTTP APIs and local data files beyond SQL. The installation page covers adapters as separate gems, each installed with gem install. The firstRelease year comes from the v0.1.0 tag commit of 2013-08-23; the rom gem's first upload is 0.0.1 of 2013-05-31, same year. The rom-rb name in the record id is the CSV id; the product name on the homepage is "Rom".
