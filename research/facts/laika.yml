notes: |
  The repository and the project's pages name no copyright holder or legal entity: LICENSE carries only the Apache template and the owner is the Typelevel organization, so the maintainer is recorded as the GitHub organization name, Typelevel (from the organization API). The output formats are HTML, EPUB and PDF per the README and the sbt plugin page; no field holds output formats, so they are not recorded. The sbt plugin needs sbt 1.x, the sole version stated, and the JVM runtime is stated only as the library's target; no runtimeMin is recorded. The README says 1.x artefacts moved from org.planet42 (0.x) to org.typelevel, so the 0.x releases under the older group are the same project's earlier line. The stable release list runs from 0.1.0 (2016-05-23) to v1.3.2 (2025-04-01); the newest prerelease, 1.0.0-M5 (2023-09-24), is older than the latest release, so no latestPrereleaseDate is recorded. The Typelevel Discord is a shared community server that the README names for questions; it is recorded as the discord link because the project's pages name it.
