notes: >
  The homepage is websharper.io, which the README names as the upcoming website; websharper.com is named the legacy website and answers over https with a footer dated 2009-2018, so it is not recorded as homepage. The first release is the oldest NuGet upload of the WebSharper package, 2.4.85.235 (2012-06-14), which is older than the oldest GitHub release (2015-06-25); the NuGet registration is the source. The highest stable release is 10.1.7.680 (2026-10-18), so currentMajor is 10. The runsAs value static is recorded from the websharper-html template description; always-on rests on the ASP.NET Core integration page, which names Kestrel and puts WebSharper's middleware in the application pipeline. The docs say the template for websharper-web is a client-server application; renderingModes covers the three templates. The support page is a pricing link only: it names support plans, which the record does not treat as a paid edition. The .NET version the templates target is not stated on the pages read (getting-started, ASP.NET Core integration, NuGet and CLI pages), so runtimeMin is left out. The README says Apache 2.0 and the docs say Apache 3.0; the LICENSE.md file is Apache License Version 2.0, and the docs' "Apache 3.0" is recorded only as its own statement, not as the license. Contributors is 23 from the last page of the contributors endpoint with per_page=1. The maintainer legal form and country were not found on the pages read, so hqCountry is unknown.
