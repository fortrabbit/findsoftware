notes: >
  The docs list the providers Socialite supports out of the box: Facebook, X, LinkedIn, Google, GitHub, GitLab, Bitbucket and Slack, and state that the package supports OAuth 1.0 and OAuth 2.0 providers. The README says the project is not accepting new adapters, and the adapters for other platforms sit on a community site, recorded as pluginDirectory. Socialite is an OAuth client that signs users in with third-party providers; it is not an SSO server, so sso is not recorded. The composer.json description at the latest tag calls the package a Laravel wrapper around OAuth 1 and OAuth 2 libraries, which gives basedOn laravel; the OAuth libraries are no records. The category "oauth" maps to auth in the import. The stable major is 5, from release v5.32.0; the default branch is 5.x. The candidates row carried 129.4M Packagist downloads; the current total is 137860682 and is recorded with its date. The firstRelease year comes from the Packagist version v1.0.0 dated 2014-08-24, older than the oldest GitHub release (v4.0.0, 2018-12-20). The maintainer follows the LICENSE copyright line, Taylor Otwell; the GitHub organization laravel is recorded as repoOwnerType. The dependentRepos figure is the ecosyste.ms count as the endpoint returns it.
