notes: >
  The repository is archived and its README opens with "DEPRECATED. Please use Next.js instead", so status is discontinued under AGENTS.md. The homepage www.phenomic.io still serves the project's pages and does not state the deprecation; the docs were last updated 2021-12-09 per the page footer. The GitHub homepage field points to nextjs.org, which is not the project's own site, so it is not recorded. The npm package named phenomic (0.21.3) is an older package from the same repository; the install docs name @phenomic/core, which is recorded. The highest stable GitHub release is v1.0.0 (2019-05-29) and npm @phenomic/core latest is 1.0.0, both major 1. The oldest GitHub release is 0.1.0 (2015-10-21), which sets firstRelease. The renderer and bundler are plugins: the docs name React (@phenomic/plugin-renderer-react) and Webpack (@phenomic/plugin-bundler-webpack) as examples, so no basedOn is recorded. The install docs describe the CLI as a local devDependency with start, build and preview scripts.
