notes: >
  The first release is the oldest GitHub release object, v1.0.0-alpha.0 published 2024-04-15, which predates the npm package's first version, 1.0.0, published 2025-12-11. The npm package is @base-ui/react; the older name @base-ui-components/react is deprecated on npm with the message "Package was renamed to @base-ui/react", so it is not recorded as npmName. Install commands are pnpm, npm, yarn and bun on the quick-start page. The registry declares engines node >=14.0.0 for the package; the library runs in the browser through React, so no runtime is recorded. The homepage describes the library as built by the creators of Radix, Floating UI and Material UI; that is a statement of authorship on the homepage and is not recorded as basedOn. The homepage FAQ says Base UI has no enterprise SLA and that dedicated support goes to some design partners; no paid edition or price is stated, so paidEdition is absent. The maintainer is the copyright holder named in the MIT LICENSE. The mui.com privacy page names a Material-UI SAS located in Paris, but base-ui.com does not name MUI as its publisher, so hqCountry is not recorded. The discord link on the homepage is /r/discord, which answers with a redirect to the invite recorded here. npmWeeklyDownloads is the sum of the daily range 2026-10-18 to 2026-10-24. The HTTP Archive technology named "Base UI" carries the same description as the project, which is the only match in the list; the figure is the mobile origin count.
