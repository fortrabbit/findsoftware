notes: >
  The homepage answers over http and redirects to https://liftweb.net/, which is recorded. The README's Java compatibility table gives Java 11 for the 4.0 line, so runtimeMin is that row. The highest stable GitHub release is 4.0.0-release (2026-05-17); the 4.0.0-RC1 and M-series prereleases are not used. The maintainer is the organizationName in build.sbt, not a legal entity; no page states a legal form or seat. firstRelease is the oldest upload of net.liftweb:lift-webkit on Maven Central (2008-11-25, version 0.7); the oldest GitHub release is 2.6-M1 from 2014. Persistence components (Mapper and Record) are no longer in the main repository as of 4.0.
