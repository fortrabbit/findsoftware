notes: >
  No project site is named in the README or the package metadata, so no homepage is recorded; the npm homepage field points to the repository README. The README says it "Internally uses validator.js to perform validation": validator.js is a dependency, not a parent, so basedOn stays empty. The LICENSE copyright names TypeStack, the organization that owns the repository, so the maintainer is recorded as TypeStack and not as a person. The oldest GitHub tag is v0.8.0 (2018); the npm package was first published in 2016, which is the oldest release of the package, so firstRelease takes 2016. No engines field is declared in package.json, so no runtimeMin is recorded. The README's Extensions section lists third-party extensions, which are not recorded. runtime node comes from the README sentence that names both the browser and Node.js; runsAs stays empty because browser plus Node is no single process model. The README says schema-based validation without decorators is no longer supported ("This feature was broken in version 0.12 and it will not be fixed"); non-decorator validation means calling the validator functions (isEmpty, isBoolean) directly. It covers custom messages, nested objects, validation groups, whitelisting and custom validators that run synchronously or asynchronously. Plain objects are validated after they are turned into class instances, for example with class-transformer. The npm figure comes from the package the install docs name.
