notes: >
  Shipped as a single npm package, canvas-confetti, with no dependencies. The CDN route names the package at a pinned version in the jsDelivr URL; the page says to use the latest version. The npm figure is the downloads of this package for the stated week, read from the range endpoint because the point endpoint returns a stale window. The homepage is the GitHub Pages demo the README links; the same demo also answers at www.kirilv.com/canvas-confetti/ under the maintainer's own site. The README says the library "will not run in Node" but names no browser sentence beyond that and the window global; runsAs browser rests on the client-component sentence, reviewer to confirm. The CDN build exposes a confetti function on window. Options set the particle count, angle, spread, origin, colors and shapes, and the README says the reduced-motion option can be set per call or per canvas instance. The README says a call returns a promise when the browser supports promises, that calls made before an animation ends share one promise, and that the reduced-motion option is off by default. The README documents a canvas helper (confetti.create with a supplied canvas, optional web worker rendering), SVG path shapes and emoji shapes, and a reduced-motion option; these are feature statements and stay in notes, not fields. The npm first upload is 0.0.1 from 2018-02-08, older than the first GitHub tag, so firstRelease is 2018. The latest GitHub release is 1.9.4, the stable line major is 1. No prerelease tag was seen on the releases list.
