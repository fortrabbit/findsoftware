notes: >
  The record covers the Panda CSS package @pandacss/dev, the one the docs install, from the chakra-ui/panda repository whose default branch is v2. Panda states its generation model on the Why Panda page: codegen and extract run at build time, and "Values have to be visible in source" for dynamic styles to be extracted. GitHub reports Rust as the repository language; the docs state that styles are written in TypeScript, which is the value recorded. The license figure comes from the repository API; the LICENSE copyright line names Chakra Systems Inc. The chakra-ui.com home page states "Project by Chakra Systems", which supports the same name without a legal form; the legal form and the country were not found, so hqCountry is not recorded. The engines field of @pandacss/dev 2.4.0 is node >=22, the source of runtime and runtimeMin. The chakra-ui/panda repository also carries an older tag for @pandacss/config 2.0.0 beta prereleases, which is not newer than the stable line and is not recorded. Adoption figures are for @pandacss/dev. The HTTP Archive figure is the mobile origins count for the technology named Panda CSS. Codegen writes the styled-system folder, and the CLI emits styled-system/styles.css; the docs say that values have to be visible in source and point to a dynamic-styles page for styles that exist only at runtime.
