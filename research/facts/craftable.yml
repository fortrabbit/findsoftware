notes: |
  Status is discontinued on two statements. The homepage at getcraftable.com says the project is announcing the end of support for Craftable by the end of 2024, and the Packagist package brackets/craftable carries an abandoned value of www.craftable.pro on its latest version. The abandoned value and the README name Craftable PRO, which the README calls the premium version of this open-source admin panel builder; a reviewer decides whether that is a move to a new home for the same project (which keeps status accepted) or an end. The GitHub repository is not archived and was last pushed 2024-11-27; the latest release v8.1.0 is dated 2023-10-30 on GitHub and 2023-10-25 on Packagist, and latestReleaseDate follows the releases API. The README says Craftable requires PHP 7.4+, MySQL 5.7+ and PostgreSQL 9.5+ and is compatible with Laravel 8, and calls itself the documentation for Craftable 6; the v8.1.0 composer.json requires PHP ^8.0.2 and the Laravel 9 and 10 illuminate packages, so runtimeMin follows composer.json and the README's database versions are recorded as the README states them. The homepage says Craftable relies on Vue 2. The installer command installs brackets/craftable-installer, which is not the package recorded; packagist figures are for brackets/craftable, the core package. The homepage gives no country and no legal form beyond the LICENSE copyright line. The CSV row lists status accepted; this fact file sets discontinued and the CSV is not edited here.
