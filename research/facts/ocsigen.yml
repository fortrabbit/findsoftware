notes: >
  The CSV homepage is http://eliom.org, which redirects to https://ocsigen.org/, the Ocsigen project site; the site presents Eliom as the first project and carries the Eliom install and tutorial pages, so it is recorded as the homepage. The Eliom documentation index at ocsigen.org/eliom/latest/index.html is a short shell page. The credits page names Be Sport, CNRS and Paris Cite university as the main developers of the Ocsigen project; the maintainer is recorded as the project name, Ocsigen, since the credits page gives no legal entity for Eliom. The two license statements differ in wording (COPYING gives LGPL 2.1 with an OpenSSL exemption, LICENSE gives the LGPL with an OpenSSL linking exception without a version); both are recorded as the project words them. The version is recorded by major only: 12.1.0 (2026-06-25) is the highest stable GitHub release, and the tags list has older 0.99 betas whose dates were not read, so firstRelease comes from the CHANGES file, whose oldest entry is 0.3.23 (2006-02-07). The latest release's opam file requires OCaml 4.12 or newer, while the development version requires 4.14. The tutorial uses PG'OCaml for PostgreSQL in the Ocsigen Start template and says any database library can be used; the internationalization library and the persistent storage library are separate Ocsigen projects. The opam file gives a third wording of the LGPL with a linking exception. The Ocsigen install page names opam packages for the full-stack and server-side use cases; the README gives the Eliom package.
