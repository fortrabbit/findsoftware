notes: >
  The repository has no GitHub release and no tag, so lastCommitDate (2026-10-30, default branch main) is the listing date. The CSV row marked the record boundary because the note says mobile and desktop only; the homepage title and the README both say "Mobile, Desktop and Web apps", and the docs list a web SDK (@aptabase/web, installed with npm), so the record is accepted under criterion 1. The web SDK's npm downloads for 2026-10-26 to 2026-11-01 total 3275 (api.npmjs.org range for @aptabase/web); these count the SDK, not the server, and the SDK repositories are not recorded as data sources. The docs list SDKs for React Native, Electron, Tauri, Flutter, Swift, Kotlin, Python and others; those are the SDK install routes and are not recorded as separate installMethod entries. The README calls the project "highly inspired by" Plausible; that is an inspiration statement, not basedOn, forkOf or alternativeTo. The homepage and docs call it "an alternative to Google Firebase Analytics"; Firebase has no record, so alternativeTo is not set. The docs state the product collects no personal data, uses no cookies or device identifiers and needs no consent banner; these privacy claims are notes only (coined kinds privacyClaims and cookieless). The privacy policy says analytics uses a daily hashed identifier from IP and user agent; notes only. The hosted Cloud plans are priced per events on the pricing page; plan prices are not recorded and the plan tiers are not paidEdition. The self-hosting guide lists a one-click RepoCloud deploy, a third-party platform, not recorded. The self-hosting guide's compose file runs PostgreSQL and ClickHouse next to the app image ghcr.io/aptabase/aptabase:main; the compose file's default passwords are example values and are not recorded. The terms page says the company is registered in Romania, so hqCountry is RO; the registered seat, not a stated headquarters address, is the basis, a reviewer may want to decide. The social links are the README's Discord and Twitter links. The docs mention an MCP server for the dashboard, a coined kind, not recorded. The SDK repository's license is MIT according to the README; the server is AGPLv3, and the two license statements are about different repositories, so only the server license is recorded.
