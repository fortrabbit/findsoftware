notes: >
  The install docs name the core package @b9g/crank, so the npm figures are that package's; the unscoped crank package on npm belongs to another project (node-crank, 0.0.8) and is not used. The npm command on the homepage, npm create crank, scaffolds an app and is not the core package. The getting-started page says create-crank scaffolds "a full SSR or SSG app powered by Shovel.js"; that is the scaffolded app's stack, not the core library's, so no rendering mode is recorded for the core package. The homepage links the npm package and the GitHub repository only, so no social or chat link is recorded. firstRelease uses the oldest upload of @b9g/crank on npm (0.4.0, 2021-10-09), since the repository is older (created 2019) and its history predates the scoped package. The LICENSE copyright line is "Copyright 2019–2026 Brian Kim"; the organization on GitHub is Bike Shaving. Contributors is the page number of the rel="last" link with per_page=1. The homepage says components can be awaited "client or server", which names no fixed runtime, so the runsAs value covers only the single-file HTML setup the getting-started page shows.
