notes: >
  The project site valor-software.com/ngx-bootstrap is client-rendered: the HTML carries the navigation and the homepage text, and the documentation routes return the "Please enable JavaScript" shell, so the docs field points to the documentation route named in the README and no docs page text was read. The install steps come from the README on the development branch, the default branch. The README states the Angular requirement (Angular 22.0.0 or higher, zoneless change detection) and names Bootstrap CSS as a styling dependency, while basedOn Bootstrap rests on the README sentence "provides Bootstrap components powered by Angular". The README says Bootstrap 5 and Bootstrap 4 components are supported; its compatibility table ends at 21.2.x, so the table does not cover version 22. The maintainer is "Valor Software" as the LICENSE copyright line names it; the LICENSE also names Dmitriy Shekhovtsov (npm author) as a copyright holder for 2015, which is not recorded as maintainer. No legal form or country is stated on a page read. The x, facebook and instagram links in the site footer belong to Valor Software, not to the project, so they are not recorded. The homepage footer says the docs are CC BY 3.0, which covers docs only and is not a license for the software. The README shows a setTheme call from ngx-bootstrap/utils for projects where the Bootstrap version cannot be detected, and a TooltipModule import from ngx-bootstrap/tooltip as the install example. The npm range is 2026-10-18 to 2026-10-24. The README's Slack community link is not a field. The Bootstrap 3 build is stated as no longer maintained; no fact is recorded from that. The GitHub API lists the default branch as development; the release v22.0.0 is the highest stable tag, and no prerelease is newer than it.
