notes: >
  Highest stable GitHub release is v8.0.0 (2022-03-04), so currentMajor is 8; npm @dojo/framework latest is 8.0.0 too. The dojo.io version menu lists "Latest v7.0", which contradicts the GitHub release and the npm tag; the record follows the release. The npm package "dojo" (1.17.3) is the Dojo Toolkit, a different project, and is not used for figures. The repository's package.json reads 8.0.1-pre and the last push is 2023-04-26; no page states that the project has ended. The homepage and the learn pages describe the framework as covering both pre-rendered and single-page applications; the renderingModes entries rest on the two quoted sentences. The repository LICENSE names the OpenJS Foundation as copyright holder; the GitHub API reports the license as NOASSERTION, and the BSD-3-Clause id comes from the LICENSE text and package.json.
