notes: >
  The homepage https://jmoiron.github.io/sqlx/ is the GitHub Pages site the repository names for its user documentation; the plain http address answers too, and the https address is the one recorded. The LICENSE copyright line names Jason Moiron (2013), recorded as the maintainer; the GitHub account is a user (jmoiron) whose profile name matches, and no page gives a country, so hqCountry is absent. The README says it is a library of extensions on Go's database/sql, and the "Compatibility with the most recent two versions of Go is a requirement" statement is a support policy, not a minimum, so runtimeMin comes from the go line of go.mod at tag v1.4.0 (a build requirement for consumers of the module). The oldest tag of any kind is sqlx-v1.0 (commit 2014-04-29), which sets firstRelease. The README's "Recent Changes" section still lists 1.3.0; the latest release is v1.4.0 (2024-04-23), and the README does not say the project is in maintenance. The default branch's last push is 2024-08-15; the latest release is inside four years, and release age never decides status. The README's examples use the lib/pq and mattn sqlite3 drivers and the user documentation mentions sqlite3; no database is named as supported by sqlx itself, so databases is absent. Go modules have no download figure, so no registry field is recorded. The GitHub stars and contributors belong to the repository, which holds one module.
