notes: >
  Status is accepted. The repository apache/lucene also holds Solr tags (releases/solr/...), so the Lucene release comes from the releases/lucene/ tags; the homepage says Solr has moved to its own top level project. The highest stable release is releases/lucene/10.5.2 (2026-10-04); the GitHub release list has no prerelease, and the Maven metadata agrees on 10.5.2 as the release. The homepage says Lucene is the search core of Apache Solr, Elasticsearch and OpenSearch; those products build on Lucene in their own pages, so no basedOn is recorded here. PyLucene is a Python binding that the homepage lists as a sub project with its own page at lucene.apache.org/pylucene; it is not a separate candidate in this area. The install docs name the binary archive (lucene-VERSION.zip, which holds the lucene-core jar); Maven Central holds the same artifact, so mavenCoordinates is recorded from the Maven repository and no Maven install step is claimed. Maven publishes no download figure, so no download count is recorded. The first Maven upload is 2006 (version 1.9.1), so firstRelease comes from the changelog instead; Release 0.01 is dated 2000-03-30 in Changes.html. The homepage copyright line gives the maintainer; the ASF about page gives the U.S. charitable status, and the ASF contact page gives the Wilmington, DE mailing address. The docs page and the release notes page name the system requirements as Java 21 or greater for 10.5.2.
