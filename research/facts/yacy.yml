notes: >
  The download page offers version 1.942 (the Windows installer file name carries the build stamp 202608150808) with no matching GitHub tag; the highest GitHub tag is Release_1.941, dated by its commit, so latestReleaseDate is the tag date and the reviewer decides whether the page's newer build should be the latest release. The repository has no GitHub release objects, only tags; the oldest tag is 0.99. The README and the imprint page state the project was started by Michael Christen in 2004; the imprint page says the YaCy brand "is owned by a private company" without naming it, so no legal name or hqCountry is recorded. The default operation is a peer-to-peer search network that peers join automatically; the README says a peer can opt out in the web interface, or per search, and then computes results from the local index only. The README names the license as GPL 2.0 or later and says some elements are LGPL without a version, so the LGPL entry has no SPDX version. The x and mastodon links are footer links on the homepage. The README lists no contributor count, so the count comes from the contributors endpoint with anonymous contributors excluded.
