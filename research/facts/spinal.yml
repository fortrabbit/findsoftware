notes: >
  Hosted service: the terms place Spinal under app.spinalcms.com and the docs describe no install, so criterion 2 is waived.
  The homepage and the supported-frameworks page list 11ty, Astro, Docusaurus, Gatsby, VitePress, VuePress, Perron, Bridgetown, Jekyll, Middleman, SitePress, Hugo and Zola; Spinal reads and writes Markdown files in the connected GitHub repository, and two-way sync needs a webhook on the repository and an auto-deploy on the site's host, per the docs.
  The docs describe a JSON API over HTTPS with API keys to read and manage workspace content, with a rate limit per key; the limit is volatile and not recorded, and the docs do not name REST or GraphQL, so headlessApi is unknown.
  The about page says the first lines of code were written in mid-February 2022; that is not a first release, so firstRelease stays unknown.
  The homepage shows counts of resources published and teams; these are the project's own counts of content and customers, not installs, and are not recorded.
  Plan limits and prices on the pricing page are not recorded.
  The privacy page gives a street address in Amsterdam and no legal form, so the maintainer is recorded as the terms name it.
