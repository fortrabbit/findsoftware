notes: >
  The install guide targets RoadRunner v3 with v6 plugins; it requires Go 1.27.1 for the source build and PHP 8.5 with the sockets extension for the examples, so runtimeMin is not recorded as a minimum for the server. The roadrunner-home page calls Spiral Scout "Our sponsor" and lists "Other products" from Spiral Scout (Spiral Framework, Cycle ORM, Wippy.ai); the page gives no ownership statement, so the maintainer field follows the page's company name. The worker and plugin model is in the docs (PHP Worker, Workers pool). Fields coined here: none.
