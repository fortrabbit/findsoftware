notes: >
  The homepage is not linked. https://plottablejs.org/ fails the TLS handshake (the certificate does not match the host name), and http://plottablejs.org/ answers 200 over plain http, so per the homepage rule the field is left out and the site is named here. The README links the same site for examples, tutorials and the API, and the README's upgrade guides are on the GitHub wiki. The README's CDN example pins plottable@3 while the latest release is 4.0.0, which the npm latest tag confirms; the 3.x line is not recorded as the current major. The first GitHub release is v.0.1.0 on 2014-02-04, and the repository was created 2014-01-22. The README states that Plottable is developed in TypeScript and distributed in ES5 JavaScript. Its requirements are D3 7 and a browser with ES2015 support, and CommonJS consumers need Node.js 22.12 or later to load D3's ES modules; these describe the dependency and the consumer, so no runtime or runsAs is recorded. Plottable is used and developed at Palantir Technologies per the README; the LICENSE copyright line is the maintainer, and no hqCountry is recorded because no fetched page names the country of the company. The develop branch is the default branch; the repository's last commit there is dated 2026-11-04.
  The README says the components include plots, gridlines and axes, which are combined and arranged in tables instead of set through high-level chart options. The README links a Gitter room (gitter.im/palantir/plottable) for help and shows a Gitter chat badge; the field list has no chat field, so it is noted here. Yarn and npm are one registry route. The CDN link in the Get Plottable list points at jsDelivr. The README's CommonJS Node.js 22.12 requirement is stated for consumers loading D3's ES modules, so it records runtime node but no runtimeMin; the npm package declares the same engines minimum. The README says Plottable is not a charting library but a library of chart components, and calls itself a D3 for charts.
