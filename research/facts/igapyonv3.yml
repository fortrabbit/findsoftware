notes: |-
  The homepage http://igapyon.github.io/igapyonv3/ (the CSV row and the GitHub homepage field) returns 404 over both http and https, and the owner's root page at https://igapyon.github.io/ does not list the project, so no homepage is recorded and status is stub. The README is in Japanese and calls the project a diary system (OSS diary system, Igapyon Diary System v3); the AGENTS.md and the repository description call it a static site and blog generator, and both are recorded as categories. The latest GitHub release is tag20260104a, whose release name gives the version as 2.0.20260104.2, so currentMajor is 2. The release tags are not semantic versions. The pom sets Java 11 as the compile target; no page states a runtime minimum, so runtimeMin is unknown. The README notes that GitHub Pages output is deprecated, and the repository has no archive flag or end statement. The maintainer name is the GitHub profile name, Toshiki Iga; no legal notice was found. The docs folder was read only through docs/README.md.
   The two license entries are the two halves of the dual license the README states ("LGPL or ASL, or both"). Maven and Java are both required, per docs/README.md. The release tags are not semantic versions; the oldest GitHub release is v20161231, which gives firstRelease. The maintainer is the GitHub profile name; no page names a legal owner.
