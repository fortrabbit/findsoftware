notes: >
  The README states the Bootstrap stylesheet is not embedded: Bootstrap 5 CSS must be added by the user, through a link tag, an import or the component Styles, which is why installation lists the stylesheet as a separate step. The README names Svelte 4 and later in its heading, so the Svelte requirement is stated but not recorded as basedOn, which takes the Bootstrap statement. The README names the original sveltestrap package for Svelte 3 projects; that npm package (sveltestrap, a different scope and repository, owned by the other listed maintainer) is not a successor fact here and is not recorded as a record. The README lists two maintainers by GitHub handle, dysfunc and bestguy; the LICENSE copyright lines name Kieran Boyle and Gary Thomas, and both are recorded as maintainer as the lines word them. The MIT license is stated in the README and the LICENSE file; one entry holds the license. The Bootstrap basedOn rests on the README's statement that Sveltestrap wraps Bootstrap 5 components; the project does not describe itself as a fork. The npm figure is the package the install command names; the GitHub figures are the same repository. The dependent counts are zero in the registry index at the time of reading.
