notes: >
  Categories are not recorded as a fact: the candidates row lists forms and phone-input, and the own word phone-input has no entry in the import's category map, so the row's forms value applies. The npm package intl-tel-input is the one the install page names; its package.json points at packages/core inside the repository, which is a single library and not a monorepo of several products. The npm weekly figure is the registry range for 2026-11-01 to 2026-11-07; the CSV's last-week figure was 475.5k and is not used. The homepage gives "117k websites" as its own count of sites; it is recorded as stated and not verified. The page says the library is available as React, Vue, Angular and Svelte components; these are official bindings of a framework-agnostic core, so no basedOn is recorded. The vanilla JavaScript page states browser support versions, which is compatibility, and no sentence says the library runs in a browser, so no runsAs is recorded. The i18n value counts the 57 translations the homepage states. The repository has 657 tags; the oldest tag is 0.1.0, dated 2013-06-01 by its commit. The repository was created in 2013, before any npm upload (2014-08-04). The integrations page says the framework components wrap the shared core library that the vanilla library exposes directly. The homepage feature list names country picking by name or dial code, formatting as the user types, E.164 extraction, validation with specific error types, and 57 translations. The FAQ and the vanilla page say the utils script, which enables formatting and validation helpers and country-specific placeholders, is loaded separately from the main library. Sponsorship by Twilio is in the README and is not recorded.
