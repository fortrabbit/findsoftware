notes: >
  The category browser-automation maps to testing in the import and is not recorded; documents and pdf-generation come from the homepage statement that the service generates screenshots and PDFs from any URL via API, and the README lists the PDF and screenshot REST APIs among the premium features. The GitHub API reports the license as NOASSERTION because the LICENSE file is not in an SPDX form; the two license entries are the file's own words, the MongoDB Server-Side Public License (SSPL-1.0) or the browserless commercial license, and the README's SPDX line reads "SSPL-1.0 OR Browserless Commercial License". The licenseModel comes from the import. The README's "Premium Features" list, which it attributes to the self-serve cloud and Enterprise offerings, names BrowserQL, persistent sessions, session replay, REST APIs, /smart-scrape, /crawl, /map, /search and Webhook Integrations; they are not recorded as open-source features. The Enterprise overview lists User Data Directory, Watching Sessions, Live Debugger, Utility Functions and Queue Management as Enterprise features. The enterprise docs and the README name no Docker Hub image; the quick start names ghcr.io/browserless/chromium, so no pull figure is recorded. Releases on GitHub start at v2.51.1 (2026-06-08); the earliest versioned tag is 1.2.0, a commit of 2018-04-26, which gives firstRelease. The tags include 684 entries, most of them puppeteer version tags. Puppeteer and Playwright are client libraries the scripts use and are not recorded. The pricing page names a Free plan, Starter and higher tiers, and an Enterprise tier with custom pricing; no prices are recorded. The homepage links to LinkedIn and YouTube, which have no field. The maintainer's address is given on the privacy page as the mailing address of browserless.io, Inc. Stars and contributors are from 2026-10-31. The comparison page also names Apify, ScrapingBee, Cloudflare Browser Run, Scrapy, Zyte, Bright Data, Firecrawl, Oxylabs, Hyperbrowser, Anchor Browser and Kernel, which have no record ids.
