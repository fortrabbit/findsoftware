notes: >
  Hosted headless CMS for blogs; the open part is the npm client "zenblog" (latest 1.2.0, major 1, MIT on the npm record, first upload 0.1.1 on 2023-11-30; 719 downloads from 2026-10-26 to 2026-11-01 by the npm range API), kept here as notes only per the hosted-service rule. The GitHub organization zenbloghq publishes two template repositories (zenbloghq/nextjs and zenbloghq/astro, both unlicensed and not forks), no SDK repository, so no repository fact. The docs API reference page at /docs/api-reference returns 404 and the public API docs at /api/public/docs holds no endpoint text. Pricing: a free plan (1 blog, 1 author, limited files, images and videos, 40k API requests per month) and a Pro plan billed per year or per month; prices are not recorded. No maintainer is recorded: the terms of service and the privacy policy both name Zenblog Software, Inc., but both describe a screen-recording service (videos, recordings, webcam), not the blog CMS, and no page ties the name to the blog product. Homepage: "We host your media for you." The getting-started guide: create a blog in the dashboard, copy its API key, install the client, list posts, fetch one by slug and render its HTML. Pro lists unlimited blogs, authors, posts, API requests, images and videos under a fair use policy. The npm package names an individual author (Jordi Enric) and no repository. No address or country is stated, so hqCountry is absent.
