notes: >
  The stable GitHub release is 5.14.1 (2026-10-04). The 6.0.0 line ships only as pre-releases (6.0.0-b6.20261016180604 is the newest at the time of research), so currentMajor stays 5 until a stable 6.0.0 tag. The requirements FAQ says PHP 8 for Matomo 5, while the Packagist composer metadata for 5.14.1 states require php >=7.2.5; both are recorded as stated, with runtimeMin following the FAQ. The pricing page prints two Cloud figures without a tier name for the 29 price and with a different unit for the €230 figure, so both are kept verbatim. The Matomo legal entity and headquarters are not named on the pages read, so maintainer and hqCountry are not recorded. Packagist downloads are kept with their periods.
