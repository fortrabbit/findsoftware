notes: >
  A type-safe SQL query builder, accepted under the query-builder group. The major is 0 because the project is pre-1.0 semver: the highest stable GitHub release is v0.29.9 (2026-11-12), the minor line is 0.29, and the release-0.28 maintenance line still publishes 0.28.20 on the same day; the 0.30.0-beta prereleases of July to September 2026 are older than the stable release and are not recorded. The homepage and the getting-started page are the project's own site; the API reference is hosted at kysely-org.github.io and the playground at kyse.link, and neither is recorded as a field. The install page names pnpm, Yarn and Bun for the npm registry, so those are one npm route, and the JSR package @kysely/kysely is the Deno route. The homepage says the project has no runtime dependencies. The README says Kysely makes sure only the tables and columns visible to the part of the query being written are referred to, that the result type has only the selected columns with their aliases, that Kysely infers names and types from selected subqueries, joined subqueries and with statements, and that the library runs in web browsers as well. The getting-started page says a dialect usually needs its database driver library as a peer dependency. The README points to escape hatches for what the types cannot express: the sql template tag and the DynamicModule class. The getting-started page says Kysely only deals with types at the TypeScript level, so the database interface has to match the schema, and the runtime output types are the driver's. The README calls Kysely inspired by Knex, and the Knex comparison page describes a query-by-query move with the kysely-knex bridge, recorded as alternativeTo. The comparison pages call Sequelize and TypeORM alternatives to Kysely (a Sequelize alternative and a TypeORM alternative); neither has a record id, so they stay here. The migration guides move queries one at a time with the same database; they are code migrations, not importsFrom. The README gives the node runtime as its main target, and the package.json at the latest release names node 22 or later; the library also runs in browsers, so no runtimeMin is recorded. The Dialects section of the getting-started page also lists PGlite, which has no vocabulary value. The maintainer is the copyright holder named in the LICENSE, Sami Koskimäki; the npm package names two maintainers, and the README core team names Sami Koskimäki and Igal Klebanov as project leads. The homepage's Discord and Bluesky links are the links the README badges carry. Stars and contributors are for the repository.
