notes: >
  The CSV homepage is the http address; the https site www.kitura.dev answers 200 and is recorded. The homepage states "Kitura is now a community run project" and links the Swift forums and Slack; the copyright line in the source headers names IBM Corporation, which is recorded as the maintainer because the LICENSE file names no copyright holder. The newest GitHub release is 3.0.0 (2022-09-18), and the highest stable tag is 3.0.1 (2022-10-07); the 3.0.1 date is the tagged commit. The oldest tag 0.0.1 is dated 2016-02-09 by its commit. The README says most Kitura packages require at least Swift 5.2; that is a statement about most packages, not the core, so no runtimeMin is recorded. The README names Swift-NIO as the default network engine. The Swift Package Index and SwiftPM carry no registry download figure, so no registry figure is recorded. The docs list CouchDB and IBM Cloudant support, which is not in the databases vocabulary, and MongoDB through a third-party repository, which is recorded under databases because the Kitura docs list it. The homepage links a Slack workspace, which is not a recorded field. The docs name a Kitura CLI and a Swift Package Manager setup; the CLI is recorded as the install method. No end signal: the repository is not archived and the homepage presents Kitura as a current community project.
