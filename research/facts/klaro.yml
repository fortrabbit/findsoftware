notes: >
  The repository has no GitHub releases, only tags; the newest tag v0.7.22 is dated 2024-03-26 by its commit, and the npm time map gives the same date for 0.7.22, so latestReleaseDate uses the npm time map. The npm dist-tag latest names 0.7.21 while 0.7.22 is published with the same date, so the npm figure is taken from the package the install docs name and the currentMajor fallback reads the registry latest, both major 0. The repository was last pushed on 2025-03-27, after the last tag, and it is not archived. No end signal was found in the README, the homepage, the docs or the repository, and the last tag is within four years, so the record is accepted. The README and the LICENSE file both call the license BSD-3, and GitHub reports NOASSERTION because the LICENSE copyright line adds a second author line; one entry is recorded. The README states the CDN "latest" tag is no longer updated and points at version tags, so the CDN route uses a versioned path. The homepage says 23 languages and the README lists 17; no count is recorded. The docs describe the hosted version as a sign-up with an installation wizard, which is recorded as hostedOffering without prices. The pricing page lists plans with server-side features; those are hosted plans, not paidEdition. The imprint gives a Berlin address for KIProtect GmbH and no country name, so hqCountry is not recorded. The runsAs browser value rests on the homepage sentence about browser support. The docs list a Google Tag Manager and Consent Mode v2 integration guide; the library attaches to a site as a script tag with a config file. Orejime is a fork of this project and is recorded on its own record.
