notes: >
  The homepage states "V1.6.1 is the current version" while the npm latest tag is 1.6.3 (published 2026-07-28); the GitHub latest release is v1.6.1 (2023-01-31), so latestReleaseDate comes from the npm registry. The getting-started page still says "Grunt 0.4.x requires stable Node.js versions >= 0.8.0", which describes a version the endoflife.date entry lists as past end of life; runtimeMin comes from the npm engines field instead. endoflife.date lists the 1.6 cycle as not end of life. The README names HeroDevs as a commercial support provider for past versions; that is third-party support, not an edition, so paidEditions stays unknown. The copyright line in LICENSE-MIT names two individuals, while the homepage names the OpenJS Foundation.
  The homepage describes tasks such as minification, compilation, unit testing and linting, each run through a plugin published on npm. The getting-started page explains the Gruntfile that configures the tasks, and grunt-cli, which runs the version of Grunt installed next to a Gruntfile. The README table marks 1.6 as supported and 1.5 and older as not supported.
