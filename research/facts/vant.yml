notes: >
  The quickstart in the repository describes importing single components with their stylesheet into a Vue app, and a CDN route in which all components are reachable through the global variable vant. The docs site (vant-ui.github.io/vant) and the backup docs (vant.pro/vant) return the page title but a JavaScript shell as body; the homepage is the repository's homepage field, since the page body is a shell, and the docs quickstart was read from the repository source at packages/vant/docs/markdown/quickstart.en-US.md. The npm package metadata names the repository as vant-ui/vant, which redirects to youzan/vant; youzan/vant is recorded. The maintainer: the youzan.com footer gives 杭州起码科技有限公司 next to "Youzan.com", the LICENSE says "Copyright (c) Youzan" and "Copyright (c) Chen Jiahan and other contributors", and the npm maintainer is an individual; hqCountry CN is read from the Hangzhou company name in the youzan.com footer; no page read states the country in words, so a reviewer may drop it. The npm weekly figure is the sum of daily counts for 2026-10-19 to 2026-10-25; the CSV figure of 135.6k a week is older. The npm package first version is 0.0.1 on 2017-04-19, the day the repository was created; the GitHub releases list starts at v2.0.8 (2019-07-25), so firstRelease takes the registry. The latest stable release is v4.10.2 (2026-08-31); v2 releases continue on the npm tag latest-v2, and the quickstart says "npm i vant@latest-v2" is for Vue 2 projects. The quickstart names Vue 3 for the current major. Browser support (Chrome 51 and iOS 10 for Vant 3 and 4) and SSR are compatibility statements and stay in notes. The Nuxt integration is a separate module (@vant/nuxt) and the scaffold is a separate Rsbuild command; neither is recorded as basedOn or installMethod. The changelog is at the docs site under the changelog page. httpArchiveSites is the mobile origins count for the Vant technology entry (desktop 239), matching the convention of other records.
