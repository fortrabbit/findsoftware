notes: >
  The repository moved from JamesRamm/longclaw to longclawshop/longclaw; the GitHub API for the old name redirects to the new one, and the PyPI home page still names JamesRamm/longclaw, so the record follows the organization the README and docs name. The project has no homepage: the docs site at longclawshop.github.io/longclaw is its documentation and is recorded as docs. The README states a call for maintainers and says the package is being upgraded for the latest Django and Wagtail; it does not say the project has ended. The latest release, 1.0.2 on PyPI and as the v1.0.2 tag, dates from 2019-03-28, so the import will move the record to stub under the four-year rule. The README names Stripe, Braintree and PayPal as payment backends; these are not recorded as fields. The README's supported versions are Django 2.2 to below 3.1 and Wagtail 2.11 to below 2.14; version ranges are not recorded. The GitHub repository has tags and no GitHub releases; the release date and major come from the PyPI upload of the same version. The PyPI JSON API carries no download counts, so pypiDownloads comes from pypistats.org (last month). The docs footer reads "Copyright © 2019 James Ramm" and the LICENSE file reads 2018; both name the same person.
