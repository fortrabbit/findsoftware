notes: >
  The CSV row dates the last release to 2025-03-13; the GitHub releases show v5.0.8 on 2026-10-28, which is used. The GitHub API reports the license as NOASSERTION; the README and the LICENSE.txt (University of Illinois/NCSA Open Source License) agree, so one license entry is recorded with the README quote. The LICENSE copyright line names the Board of Trustees at the University of Illinois; the developer team named in the same file is Scholarly Communication & Repository Services, University Library, which is not the legal entity. No allowed maintainerType fits a public university board, so maintainerType is left out. The manual says "There is currently no official Docker image", so no dockerPulls or Docker installMethod is recorded. The runsAs always-on value comes from the homepage sentence "A web server is built right in."; the deployment page also describes the built-in web server's request thread pool and running behind an Apache or nginx reverse proxy. The oldest GitHub release is 1.0-beta1 (2015-09-16, a prerelease). Coined kinds, kept here: image library and output formats, the manual's processors page lists the pluggable processors (Java 2D as the default, JAI, TurboJPEG, Kakadu Native, OpenJPEG, Grok, FFmpeg, PDFBox) and the supported source formats per processor; output formats follow from the source format and processor and the information response lists them, so no single list is recorded. Sources are pluggable (filesystems, databases, remote web servers, cloud storage) and derivative caches are pluggable (filesystem, JDBC, Redis, in-memory, S3, Azure); a database is optional for a cache or source, so no databases value is recorded. The endpoints are IIIF Image API 1 to 3 (homepage: "Fully conformant to all IIIF Image API versions through 3.0") plus an optional HTTP API for status, configuration and cache purging; neither is recorded as headlessApi. Customizing behavior through a delegate class written in Ruby or Java is a coined kind. The project has no prerelease after 2015. Contributors are read from the default branch endpoint without anon.
