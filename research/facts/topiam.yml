notes: >
  The GitHub homepage field is empty; the README and the site name https://topiam.cn, which answers over https. The README is in Chinese; its quotes are copied from the repository text. The README names a "项目负责人" (project lead) and no person; the copyright holder on the site footer is 济南源创网络科技有限公司 (Jinan Yuanchuang Network Technology Co., Ltd.), recorded as the maintainer. No page names the country: the Jinan name, the ICP filing "鲁ICP备2022035564号-1" and the Shandong mark imply mainland China, but no page states it, so hqCountry stays out for a reviewer to decide. The last release is v1.1.0 (2024-05-10); the default branch was last pushed 2025-09-03, and the site footer reads "Copyright © 2022-2025". No page says the project has ended or is unmaintained, so the record is accepted; release age is no end signal under criterion 4. The research note marked TOPIAM as stale, which this record does not act on. The README and the documentation offer a commercial license on request ("请联系我们进行商业授权") next to AGPL-3.0; the editions page (/enterprise/) lists a Community edition under AGPL-V3, a Commercial edition described as a commercial license for the community edition, and a Flagship edition with more features; prices on that page are not recorded. The commercial license is recorded as a second license entry, so the import reads the license as dual. The edition table repeats 不支持 cells for SAML, CAS and AD/LDAP under two of the three editions without a legible header, so protocols are recorded as the homepage and docs state them. The install page (deployment-online) says to install Docker and run the one-line script; the image name is not on the docs, so no pull figure is recorded. Runtime and JDK: the README badge reads JDK 17+ and the backend is Spring Boot, but the install docs ship a Docker deployment and no runtime or minimum is stated on a page that is not a badge, so runtimeMin stays out; the architecture page says the server is written in Java, which gives the runtime. The BaoTa app page offers version 2.0.0 and the installer script says VERSION=v2.0.1, while the GitHub and Gitee releases end at v1.1.0; currentMajor follows the repository release, and a reviewer may decide. Redis is listed beside MySQL as middleware (README architecture section); it is a cache and session store, so it is not a database value. Protocols named on the homepage: OAuth 2.0, OpenID Connect, SAML 2.0, JWT, CAS and SCIM 2.0; the README adds forms-based sign-in for legacy apps (表单代填) and social and enterprise identity sources (DingTalk, WeCom, Feishu, QQ, WeChat). The mirror repositories on Gitee (gitee.com/topiam/eiam) and GitCode (gitcode.com/topiam/eiam) are listed on the site and not recorded. The site footer lists QQ and WeChat groups; no social field holds them. The README architecture section names Spring Boot and Spring Security for the backend and React with Ant Design for the front end, with MySQL and Redis as middleware. The README feature table lists organization and user management, user groups, identity-source sync, application management, audit logs and session management. Identity sources named by the README include DingTalk, WeCom (企业微信), Feishu, LDAP and AD; the site lists social sign-in with WeChat and QQ.
