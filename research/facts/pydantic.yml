notes: >
  The homepage is the Validation product page, which the repository's homepage field names; the pydantic.dev root is the company site and leads with Pydantic Logfire and the AI products, so it is not recorded as homepage. Logfire, Pydantic AI, Pydantic Evals and Monty are separate products on that site: the Logfire hosted and self-hosted Enterprise offer is not a hosted offering of this library and gets no hostedOffering, paidEdition or pricingPage. The maintainer is Pydantic Services Inc., named by the LICENSE copyright line, the pydantic.dev footer and the terms of service ("a Delaware corporation"). The terms and privacy notice give a Wilmington, DE mailing address but no country, and a state of incorporation is no headquarters, so hqCountry is absent. The latest stable release is v2.14.3 (2026-11-05), matching the PyPI latest version; the v2.14.0 beta and release candidates are older than the latest release, so no latestPrereleaseDate is recorded. The GitHub releases also hold v1.10.27 (2026-10-29), the Pydantic V1.10 line the README says is maintained on the 1.10.X-fixes branch; the highest stable version is 2.x, so currentMajor is 2. The runtime quote and runtimeMin come from the get-started page, and the PyPI requires_python field for 2.14.3 is ">=3.10", the same minimum. The README and install page say pydantic-core, the core validation logic, is written in Rust, and list typing-extensions, annotated-types and typing-inspection as dependencies; these are not recorded. The pypistats figure is the recent endpoint's last_week value and is recorded as the endpoint returns it. The home page's marketing figures (18B+ all-time downloads, 840M+ monthly, 20 of the 25 largest NASDAQ companies) are company claims without a registry period, so they are not recorded. The install page's "install from repository" route is a development install from the main branch and is not recorded as installMethod. The help page names GitHub Discussions (recorded as forum), Stack Overflow, a YouTube search results link (no channel, not recorded) and a Slack workspace that belongs to Pydantic Logfire and covers all Pydantic products, which is no forum field for this library. The footer also links a LinkedIn company page, which has no field. The version policy page says active development of V1 has stopped, with critical fixes until V3, and drops a Python version when it has reached end of life and under 5% of downloads use it; neither is recorded as a field. The Migration Guide covers V1 to V2 of the same project and names no other software, so importsFrom and alternativeTo stay absent; the why page names no alternative. The newsletter is the company's "The Pydantic Stack", which covers Logfire and Pydantic AI as well as Validation, recorded as the homepage-linked newsletter. The stars and contributors come from the repository's default branch; the contributor count reads the last page of the per_page=1 listing.
