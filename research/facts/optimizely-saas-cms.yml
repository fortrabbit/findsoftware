notes: >
  Optimizely SaaS CMS is the managed cloud edition of Optimizely CMS; the self-managed PaaS edition is a separate record (optimizely-cms) and is not used for this one. The plans page says "Every Optimizely plan is individually packaged" and gives no prices. The sso value comes from the Opti ID single sign-on page, which is the identity service the SaaS CMS signs users in through (get-started page: "Login Opti ID provides multiple options for managing user identity and permissions"); the get-started page says CMS (SaaS) users sign in through Opti ID, and the protocols come from the Opti ID page. The developer page links an Optimizely community Slack invite; no field exists for Slack. The maintainer is taken from the privacy notice, which names Optimizely North America Inc. and Optimizely AB; the SaaS order terms could not be found at the paths tried (legal/master-subscription-agreement, legal/saas-terms, legal/terms-of-service returned 404), so the contracting party is unconfirmed and Optimizely AB is the other entity the notice names. The hqCountry value uses the notice address of Optimizely North America Inc. from the website terms. The SaaS CMS page lists "Multi-site/multi-channel management" as a feature label without a sentence, so multisite is unknown. The SaaS docs navigation lists a "HIPAA-enabled CMS" entry; that is a compliance kind and goes to notes only. The SDK repository episerver/content-js-sdk (Apache-2.0, 21 stars at read time) and the npm package @optimizely/cms-sdk (5,229 downloads for 2026-10-26 to 2026-11-01, api.npmjs.org range) are SDK figures and are recorded here only. The product page is Optimizely's shared CMS page, which also lists the PaaS product and the agent features; agents are not fields.
