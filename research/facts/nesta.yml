notes: >
  The project has no GitHub releases; its tags run from v0.9.0 (tagged 2010-12-20) to v0.18.0, and the RubyGems release 0.18.0 (created 2024-11-19) is the registry's stable version, so currentMajor and latestReleaseDate come from RubyGems. The GitHub tag for 0.18.0 is dated 2024-11-19 too. The homepage is https; http redirects to it. The deployment guide names Netlify for the static output and Heroku, a VPS or own hardware for server rendering; the server case needs a Rack server (the guide recommends Puma), and no always-on statement is recorded because the page does not state one. The gem's copyright line in LICENSE starts in 2008 and the first tag in 2010. The homepage quotes Nesta 0.16.0, an older release; the registry and tags are newer. The README links the maintainer's personal Mastodon account, not a project account, so mastodon is not recorded. The gem page gives no license field and the GitHub license is MIT.
