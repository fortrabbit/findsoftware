notes: >
  The package the install page names is AntDesign on NuGet (dotnet add package AntDesign). The repository's csproj lists TargetFrameworks from netstandard2.1 through net10.0; runtimeMin follows the README's list of supported .NET Core versions (3.1 first) rather than the netstandard2.1 entry, which is a library standard, not a runtime. The README states WebAssembly static file deployment and SignalR-based server-side UI interaction, recorded as runsAs static and always-on; the getting-started page's Blazor WebAssembly project published to dist/wwwroot describes an application, so no renderingModes is recorded. The README also lists C# as the language and says seamless integration with ASP.NET Core MVC and Razor Pages projects. The docs site has a Localization page (AntDesign.Extensions.Localization) and an MCP documentation page for the AntDesign.Docs.MCP tool; the NuGet nuspec for the latest release names James Yeung as author. The getting-started page says that static and Auto render modes do not support automatic import and that styles and scripts must be imported manually there. The docs site offers a "Try 2.0 preview (antd v5)" page; the highest stable GitHub release is 1.6.2 and previews are not counted. First NuGet upload is 0.1.0-nightly-1 on 2020-04-27 (the registry lists some older entries dated 1900 as unlisted, not counted); first GitHub release 0.1.0 on 2020-06-30. NuGet total downloads is the figure the search API returned. The GitHub API description, "A rich set of enterprise-class UI components based on Ant Design and Blazor.", is quoted under basedOn; it is the repository's own words. The getting-started page says to register the library with services.AddAntDesign() and to add the AntContainer component for pop-ups. It says that after version 0.17.0 styles and scripts import automatically, that the import position can be set with the antblazor-css and antblazor-js attributes, and that the no-antblazor-css and no-antblazor-js attributes disable it.
