notes: >
  The CSV homepage https://www.qgoda.net/ answers 200 over https. The installation page says the CPAN release is outdated and names version 0.9.8 as the one to install; the GitHub release list ends at v0.11.0 (2025-02-24) and that is the version recorded. The installation page says Node.js is "not a strict requirement for Qgoda but most Qgoda sites will make use of it", so no Node runtime is recorded. The homepage footer and the legal disclosure both carry "cantanea EOOD"; the imprint's name fields are empty in the page text, and the "Bulgaria" value sits under its "Company Information" heading. The README copyright line names Guido Flohr (2016-2025), the author, and is not the maintainer field. The oldest entry on the release list is the pre-release v0.9.0-alpha.1 (2017-12-08); firstRelease is the year of the first stable tag, v0.9.2 (2018-05-18). The README says Qgoda is considered feature-complete and ready for beta testing; that is not an end signal. The homepage news list ends in March 2025, and the repository's last push is 2025-03-23. The README's badge links a Twitter account, recorded as x; the badge is the only place it appears. The no-database claim comes from the homepage. The installation page's Docker command uses a watch subcommand with port 3000. The mode-of-operation page says Qgoda copies files from the source directory into the destination directory _site, and the homepage says the author can use as many taxonomies as they want, not only tags and categories. The installation page says the official themes use Yarn.
