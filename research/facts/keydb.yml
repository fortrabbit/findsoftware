notes: >
  The homepage keydb.dev answers over https with a page that redirects to the documentation repository, github.com/Snapchat/KeyDB-docs, which says the documentation has moved there; no homepage is recorded, because keydb.dev and docs.keydb.dev only redirect to that repository and hold no product content. The repository's default branch is main, and GitHub detects BSD-3-Clause. The README says "There is no separate commercial product and no paid support options available", so no paidEdition is recorded. The GitHub release list holds 29 releases from v0.9.2 (2019-03-11) to v6.3.4 (2023-10-30); v6.3.0 is a prerelease older than v6.3.4. The newest release is more than three years old, which is not a discontinued signal; the repository was pushed on 2026-10-22, not archived, and the README still describes the project as maintained. Snap's terms page names its Santa Monica, California address, used as the maintainer's full address for the country. The docs repository holds no license file reported by GitHub (NOASSERTION), so the code license comes from the README and GitHub. The Docker image named by the docs is eqalpha/keydb; the README links the same image. The community Slack named in the README and docs is not a recorded field. The docs say KeyDB is "compatible with all Redis client libraries", and the README says KeyDB "is a high performance fork of Redis with a focus on multithreading" and "maintains full compatibility with the Redis protocol"; the README also says KeyDB is used by Snap as part of its caching infrastructure. No databases field is recorded for the software itself. The repository was created in 2019, the CSV's 2023 date is the last release.
