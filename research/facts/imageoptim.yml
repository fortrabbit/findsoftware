notes: >
  Desktop app for macOS. The homepage and the README describe it as a Mac app; the download page states "Requires macOS 11+", the 1.9.3 changelog states "Requires macOS 10.15 (Catalina) or newer", and the appcast states minimumSystemVersion 10.16. Older versions for Mac OS X 10.4 to 10.14 are on the versions page; a reviewer may pick which requirement the record shows. The app is free and open-source under the GPL: the homepage words it "under terms of the GPL v2 or later" and the repository LICENSE file is the GPL version 2 text; both are one license, recorded once as GPL-2.0-or-later in the homepage wording. The homepage also says PNGOUT "is bundled with permission of Ardfry Imaging, LLC and is not covered by the GPL", a bundled part under other terms, recorded here only as this note. The homepage says it is "not in the App Store" and the Mac App Store answer is a "No"; no store listing is recorded. The repository's GitHub releases are empty; the tags run from 1.2.3 (the tagged commit has author date 2009-12-04, the date firstRelease takes; its committer date is 2013-02-03) to 1.9.3; 1.0.x versions carry no date in the sources read; and the version and date come from the download page and the appcast, the only dated release source. The appcast holds one item, 1.9.3, pubDate 2023-10-29; the last commit on the default branch is 2026-07-13, a later date than the latest release, and no end signal was found. Homebrew cask installs (7179 in 365 days per formulae.brew.sh/api/cask/imageoptim.json on 2026-10-28) are no reportedInstalls: a package manager count is not a figure the project states. The ImageOptim API page offers sign-up and pricing: hostedOffering and pricingPage record it, its plan tiers are no paidEdition. The homepage links the maintainer's personal Mastodon account (mastodon.social/@kornel), not recorded, and an occasional newsletter form; the homepage FAQ compares ImageOptim with TinyPNG, MozJPEG and Guetzli, and only MozJPEG is recorded as alternativeTo; the terms name the operator of the ImageOptim service as ImageOptim Ltd.; the Muskverse link on the homepage is a share button to twitter.com, not an account, so no x field is recorded. The homepage's contact is by email only. The GitHub languages API counts HTML first because the repository also holds the website, so language is recorded as the app's Objective-C.
