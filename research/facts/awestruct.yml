notes: >
  The CSV homepage http://awestruct.org/ now serves unrelated casino content (checked 2026-10-23, redirected to https://awestruct.org/), so it is not recorded. The project's own site is https://awestruct.github.io/, named by the README and the RubyGems homepage_uri. The site's install box says version 0.6.4; the highest stable GitHub release is v0.6.7 (2024-01-07), which is recorded. firstRelease is the first RubyGems version (2010-02-26); the GitHub releases begin with a 2019 prerelease. The site says the project is "inspired by the Jekyll utility" and that is a statement of inspiration, not of a base, so basedOn is not recorded. RubyGems downloads are the all-time total for the gem awestruct. The last push was 2025-01-14, so the status stays accepted.
