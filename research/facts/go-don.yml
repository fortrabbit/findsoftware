notes: >
  In doubt on criterion 3 (documented installation): the README shows a runnable example and import paths for the module but no install command, and no docs site is linked; a go get line or a docs page on installation would settle it. The project has no homepage: the repository is the only project site, and pkg.go.dev, the module's documentation index, is not the project's own site. The README says that while Don is on v0, minor version updates are breaking changes; currentMajor is 0 under the rule that the major is taken from the highest stable release. The README names fasthttp and a custom httprouter as the basis of its speed; the README does not say the project is built on either, so no basedOn is recorded. The latest release v0.2.2 is dated 2025-10-11 and the repository was pushed on 2026-10-22, so the status is decided on the install question, not on release age. The MIT license copyright line names Adam Bouqdib; the GitHub account abemedia has type User.
