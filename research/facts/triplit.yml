notes: >
  Doubt: the homepage triplit.dev, which also hosts the docs and the getting-started guide the README links to, fails the TLS handshake on every attempt on 2026-11-03, so the install route and the runtime rest on the README and on the docs source in the repository (packages/docs, the self-hosting pages), and whether the project is still maintained rests on the repository (last push 2026-01-19, newest stable release 2025-07-31); a working homepage or a maintainer's statement on the project's status would settle it. Criterion 4 shows no end signal: the repository is not archived and the npm package @triplit/client carries no deprecated flag. The README's install route is "npm create triplit-app@latest my-app" for a new project and "npm install --save-dev @triplit/cli" for an existing one; the create-triplit-app package and @triplit/cli release at the same tags, so they are not recorded as npmName. The README names pluggable storage providers (SQLite, IndexedDB, LevelDB, Memory) and a development sync server started with "npm run triplit dev", which the README presents as the local development route; the development server is not recorded as a field. The repository docs describe production self-hosting as the server Docker image (Node.js or Bun variants) with a mounted volume for durable SQLite or LMDB storage (lmdb noted here), JWT_SECRET configuration and a /healthcheck endpoint. The repository docs also say Triplit Cloud is no longer accepting new users and recommend self-hosting, so no hostedOffering is recorded. The license appears as AGPL-3.0 in the GitHub API and as AGPL-3.0-only on npm for @triplit/client: one license, two wordings, the GitHub wording is recorded. The repository is a monorepo with per-package tags; the newest stable client tag is @triplit/client 1.0.50, the newest release of any package is 2025-07-31, and the first tag is @triplit/client 0.0.28 of 2023-07-24. The candidates row cites 119.1k weekly downloads for @triplit/client; the range endpoint for 2026-10-26 to 2026-11-01 gives the figure recorded here. The SDK packages and the React and Svelte bindings are not recorded.
