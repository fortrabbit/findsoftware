notes: >
  The Core server is the record: the repository supertokens/supertokens-core is Java, and the frontend and backend SDKs (supertokens-node, supertokens-python, supertokens-web-js and the others the homepage lists) are client libraries, so their npm and other figures are not recorded; the npm supertokens-node package at about 29 thousand weekly downloads per the candidates row is an SDK. The license is Apache 2.0 for content outside the ee/ directory and the SuperTokens Enterprise license for ee/, both recorded as their own entries; the ee/ license covers production use of that directory, and the pricing page lists paid features (multi-factor authentication, account linking, multi-tenancy, attack protection) with a self-hosted column, which is why paidEdition is recorded from the ee license text. The pricing page says "Self hosting the open source features is free without any limits!", the self-host statement behind the installMethod entries. The pricing page says "Free under 5K monthly active users" for the managed cloud (freeTier, coined, kept here). The Core docs say MySQL and MongoDB support was dropped with the 11.0.0 release, and the supported database is PostgreSQL. The Docker guide is the self-hosting guide the site links from its homepage. The Core docs name no Docker image, so dockerPulls is not recorded. The terms of service PDF names SuperTokens, Inc as provider (the maintainer) with Delaware governing law; no address or headquarters country is stated, so hqCountry is unknown. The ee/ LICENSE.md copyright line reads SuperTokens Inc. The README says the JDK ships with the binary and Docker image, so the Core needs no separately installed Java. The footer forum link community.supertokens.com answered 429 (a bot check) and stays unread. The homepage footer also links LinkedIn, a community forum (community.supertokens.com) and a status page; LinkedIn is not a field and the forum link is a footer label, so neither is recorded. Multi-tenancy and account linking are product features without a field. The earliest tag is v0.0.1 (commit date 2020-01-28); the earliest GitHub release is from 2022. The homepage line "Transition effortlessly from Auth0 and enjoy the benefits of a more affordable and intuitive authentication solution." is marketing, the migration page is a sales form for a white-glove service (Auth0, AWS Cognito, Clerk, Firebase Auth, Frontegg, FusionAuth) and the docs migration guide is generic bulk import over the Core API, so no importsFrom is recorded. The sso oidc entry rests on a pricing-table label ("Custom Open ID connector"). Unified Login (OAuth2 provider) is available only with the SuperTokens Managed Service, so it is not recorded under sso. The forum is not recorded: community.supertokens.com answered 429 and stays unread.
