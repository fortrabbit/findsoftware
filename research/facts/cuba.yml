notes: >
  The CSV homepage is the http address; the same page answers over https at https://soveran.github.io/cuba/, which is recorded. The GitHub releases list stops at 4.0.2 (2023-09-14), while the tag 4.0.3 and the RubyGems gem 4.0.3 date from 2024-01-24, so latestReleaseDate comes from RubyGems; both are major 4. The README calls Cuba essentially Rack in the testing section and describes Cuba::Response as an optimized version of Rack::Response, but no sentence states that Cuba is built on Rack, so basedOn is not recorded. The README describes running the app with rackup but names no run mode, so runsAs is not recorded. The README says Cuba was originally inspired by Rum, a mapper for Rack applications, which is an inspiration and not a parent. The README names IRC on freenode for community contact; IRC has no field, so it is not recorded. The LICENSE file reads as MIT, and the GitHub API reports MIT as well. The gem authors field names Michel Martens as the maintainer. The project has no discontinued signal: not archived, no deprecation, the README describes the project as current.
