notes: >
  Motion is the React and JavaScript package of the motiondivision/motion repository, and the README and docs also name Vue, served by the separate motion-v package (record motion-vue). The repository has no GitHub release objects, so currentMajor and latestReleaseDate come from the npm registry under the registry fallback; v14.14.0 is also the highest tag. firstRelease is the oldest tag of the repository (v0.0.1, commit dated 2019-01-14). The npm package named motion has an upload history from 2013 under the Popmotion and motionone maintainers, which belongs to an earlier project and is not used for firstRelease. The README says "Framer Motion is now Motion. Import from motion/react instead of framer-motion": the older name is framer-motion, a rename and not a fork or successor record. The npm weekly figure counts downloads of the motion package from the install docs. Motion+ is a paid plan for examples, tutorials and premium APIs (Cursor, Ticker), and its page says "Motion+ APIs and examples are licensed under MIT", with a Builder's Licence only for products that resell Motion+ capabilities. Paid access to MIT code is no paidEdition, so none is recorded; the plan stays in this note. The LICENSE copyright line names Motion B.V., while the about page calls Motion an independent animation library built and maintained by Matt Perry. The terms page names the Netherlands only as governing law, which is no headquarters statement, so hqCountry stays unknown. The homepage footer links X and YouTube and has a newsletter sign-up form; no discord, bluesky or mastodon link was found on the public pages. The GSAP migration page at motion.dev/docs/migrate-from-gsap-to-motion backs the alternativeTo entry.
