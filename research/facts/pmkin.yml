notes: >
  Hosted only: PMKIN runs the service and the pages state no installable part, so criterion 2 is waived under hosted-service. The GitHub organization pmkin-cms publishes an SDK (pmkin-js, MIT, npm client), examples and a Next.js quick start; per the hosted-service rule none of them is the repository field and their licence, stars and dates are not recorded. The organization profile names a blog at https://pkmin.io (missing the i), which is not the project's site and is not recorded. No legal entity, imprint or company country appears on the terms or privacy pages; the footer says "Made with ❤️ in Barcelona", so hqCountry and a legal-form maintainer are unknown. The about page gives no founding year and no release is dated on the pages read. The delivery API rate limit is stated on the delivery API overview page as 25 requests a second per IP address. The delivery API is read-only GraphQL at content.pmkin.io and the management API is REST at api.pmkin.io, from the developer docs. Keys come as Read or Read and write; the Read key is the one a website needs. Documentation says a team can run several projects, each one website or publication with its own documents and keys; this is not recorded as multisite. The Enterprise plan lists SAML SSO and user provisioning (SCIM) on the pricing and billing pages; SCIM is provisioning, not sso, and the Enterprise tier is a hosted plan, so no paidEdition is recorded. Plans and pricing per seat are on the pricing page and are not recorded as prices. The data model page says a document body is GitHub Flavored Markdown and that each document keeps a draft and a published version; the website sees only the published one. The pricing page says an agent's changes show both its name and the person it works for. The about page says agents never see API keys, members or billing. The docs describe an MCP server through which AI agents such as Claude, ChatGPT and Cursor claim briefs, write drafts and send them to review, a planner with a board and a calendar, and a review queue where drafts are approved or sent back with notes. The footer links Twitter, which points to x.com/pmkincms.
