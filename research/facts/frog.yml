notes: >
  Status is stub while criterion 4 is in doubt: the README says "low-maintenance mode" and the Racket package catalog entry says "No longer under active development". Revisit when the project states its maintenance status or releases again.
  The project names no homepage: the README links only its documentation at docs.racket-lang.org, so homepage is not recorded. No GitHub release or tag exists; the Racket package catalog (pkgs.racket-lang.org/pkg/frog) shows no version number, so currentMajor and latestReleaseDate stay unknown and lastCommitDate judges the listing. The README says "This project is in low-maintenance mode." That is not a statement that the project is unmaintained or ended, so the status stays accepted. The Racket package catalog describes the package as "Static blog generator application. (No longer under active development.)"; that is a registry description and not a statement on the project's own pages, so it sets no status, and a reviewer decides whether it reaches criterion 4. One license is recorded, from the frog/LICENSE file (BSD-2-Clause, copyright Greg Hendershott); the README badge says MIT and links to the same file, and the badge is not recorded. Pygments, which needs Python 3, is optional and only used for syntax highlighting of fenced code blocks. The README names the GitHub Pages repo and Amazon S3 as deploy targets, both static hosting. The default output directory is the project directory itself (the docs show raco frog -b writing index pages, feeds and tags there), so outputDir is not recorded.
