notes: >
  Doubt: the homepage the README and docs name, pdfmake.org, cannot be read, since its TLS certificate names another host and plain http returns a GitHub "Forbidden" page; the status would be settled by the site answering over https with the project's own pages, or by the maintainer naming another homepage. The code, the README and the docs at pdfmake.github.io are readable and the repository is active; the release line is 0.3 with 0.3.14 the latest stable (2026-11-08), so currentMajor is 0 and the minor line stays in notes. The LICENSE names bpampuch for 2014-2015 and liborm85 for 2016-2026; the maintainer field follows the first holder, and the README's Authors list names bpampuch as founder and liborm85 beside it. GitHub detects no license (NOASSERTION) for the repository, while the LICENSE file and the npm registry both say MIT; the license fact follows the LICENSE file. The README names PDFKit as the library pdfmake is based on, so basedOn is pdfkit and the PDFKit record holds the other side of the relationship. The npm engines field for 0.3.14 requires Node 20 or later, recorded as runtimeMin. The README shows a Node.js example that writes a PDF file with a document definition passed to createPdf, and a browser example that offers a download through a script-tag build with fonts in a separate file; the README's helper methods cover opening, printing and downloading the PDF. The docs site documents a client-side build (CDN, npm or the repository's build directory) and a server-side npm install; its Composer route goes through asset-packagist. The README's feature list names tables, images, SVG, QR codes, headers and footers, watermarks, PDF/A output and encryption, which are product features the fact file does not hold as fields.
