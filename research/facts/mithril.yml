notes: >
  The getting-started address the README links, mithril.js.org/getting-started.html, answers 404; the homepage on mithril.js.org carries the getting-started tutorial and was read in its place. The highest stable GitHub release is v2.3.8 (2025-11-08), which matches the npm latest. The homepage shows the docs version in its header; that version is not recorded. The project's chat is a Zulip server, mithril.zulipchat.com, linked from the homepage's Chat entry and the README; no field in the starter list holds a chat service other than discord, so it is not recorded. The npm author is Leo Horie, the same name as the LICENSE copyright; the homepage footer reads "MIT. © Mithril Contributors". Stack Overflow is named in the README by tag only and is not recorded.
