notes: >
  The LICENSE file is the unmodified Apache text with no copyright line; the maintainer is the author named in Cargo.toml, and the README says the work is done mostly in free time. The Docker image is ghcr.io/sebadob/rauthy. The project's support contact is an email address on the README, not recorded. The security audit by Radically Open Security is named in the README and on the homepage; it is not a fact field. The README says Rauthy runs by default on top of Hiqlite, an embedded store that needs no external database, with Postgres as the alternative; Hiqlite is not a database value, so only Postgres is recorded under databases. The Rust toolchain minimum in Cargo.toml is a build requirement of a binary shipped in a container image, so runtimeMin is not recorded. The README describes an account dashboard for each user with self-service. The Kubernetes guide says there is no Helm chart or Kustomize files yet. Releases run from v0.12.0 (2023-07-01) to v0.37.2 (2026-10-19), all stable; no prerelease is listed, and the repository is not archived. The PAM and NSS modules are published in the separate repository rauthy-pam-nss, which the README says relies on GPLv3 dependencies; that repository is not this record's license. The SCIM v2 feature is named on the README feature list; webhooks and event delivery by email, Matrix and Slack are not recorded as wiring, because they go out from the server rather than being called by a site. The project is pre-1.0, so currentMajor is 0 from the v0.37.2 tag. The Docker image is published on GitHub Container Registry, which the registry fields do not count.
