notes: >
  The GitHub releases start with v0.1.1 (prerelease, 2021-05-14), so firstRelease is 2021. The current major 3 and the latest stable release (2026-10-07) come from the GitHub releases; PyPI has the same date. The PyPI JSON carries no download counts, so pypiDownloads is the last-month figure from pypistats.org. The nicegui.io pages render only in JavaScript, so the deployment, storage, imprint and footer facts are read from the website source in the project repository (website/ folder), which is the project's own documentation source. The README names FastAPI as the base ("We have built on top of FastAPI"); Vue and Quasar are the frontend of its tech stack, and the README says they inspired the choice for the frontend, so neither is recorded as basedOn. The README says it acts as a web server accessed by the browser or runs in native mode, for example a desktop window, and that it uses one uvicorn worker. Redis is an optional storage backend next to the default file storage. The site nicegui.io is built with NiceGUI itself, per the README. The CSV row listed app-framework as a category too; the README calls NiceGUI a UI framework, so only framework is recorded.
