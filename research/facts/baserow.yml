notes: >
  Boundary question settled as accepted. The CSV note asks whether an end-user app is wired into a web app: the project's own REST API page says the endpoints "should never be used to show data on your own website", and that a database token exposes data publicly for a site, so a website calls its API; the README also says "Create applications and portals, and publish them on your own domain." Both are the project's own words. The open-core split is recorded as the README and the three LICENSE statements give it: the MIT Expat license covers everything outside the premium and enterprise directories, the PE and EE licenses cover those directories and need a subscription in production, and the docs directory is CC BY-SA 4.0. The homepage's stated company is Baserow B.V., registered office Keurenplein 4, Amsterdam, under the laws of the Netherlands, from the subscription terms (section 1.1). Figures: 6,246 stars, 54 contributors and the Docker Hub pull count are from the API on 2026-10-31; the tag 0.0.1 is the first version, dated 2020-04-30 by its commit. The homepage's "Join 200,000+ active users" and the README's "Trusted by over 150,000 users" are user counts of the platform, not installs, and are not recorded as reportedInstalls. The pricing page gives plan tiers Free, Premium, Advanced and Enterprise for Cloud and Self-host without prices; the Advanced plan carries role based permissions and audit logs, and the SSO line sits in the pricing table. The homepage's "How Baserow compares" table names Google Sheets, Smartsheet, Excel, Airtable and NocoDB; only the Airtable alternative statement is recorded as alternativeTo. The status page (status.baserow.org) is not a field. The README says Baserow moved from GitLab to GitHub, so release history before the move sits in the GitLab repository (gitlab.com/baserow/baserow), which is not read here. The README lists "Headless and API first." as a feature. The FAQ page says an iframe can embed a publicly shared grid view and that webhooks report data changes. The README's install list ends with Elestio, a third-party managed host, which is not recorded as an install route of the project.
