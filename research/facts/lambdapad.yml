notes: >
  The homepage lambdapad.io, named in the README and on the repository's own docs, answers 200 over https with an aaPanel page: "Sorry, This site has been stopped by the administrator". No homepage is recorded and status is stub under AGENTS.md, since the project's own site no longer shows the software. The install steps and the documentation are in the repository's docs folder, which is the source for every fact here. The repository has no GitHub release or tag, so currentMajor and firstRelease are unknown and lastCommitDate is recorded. The maintainer is recorded as the GitHub login gar1t, which the front page uses for its author ("see this blog post from gar1t"); the LICENSE file has no copyright line. The contributors figure counts GitHub accounts only (per_page=1, without anonymous); with anonymous contributors the count is 8. The getting-started page lists system requirements: "Non-windows (for make support - see next point)" and "Developer configure/make environment" (docs/articles/getting-started.md). The README links the site over plain http. runtimeMin R17 is the system requirement the getting-started page states for the Erlang runtime; it is not a release version. runtime erlang is not in the starter list; it names the language runtime the project runs on. The front page compares it with Jekyll; no alternativeTo is recorded because that comparison is not a migration guide or a named alternative page.
