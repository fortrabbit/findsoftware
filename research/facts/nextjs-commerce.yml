notes: >
  The repository is archived and its README, the project's own page, says the template is deprecated and that development has moved to vercel/shop, Vercel's Shopify storefront built with Next.js. Both the archive flag and the README statement are recorded as status signals, so the record is discontinued; vercel/shop is a separate repository and is not recorded as a successor record here. The homepage named in the CSV, vercel.com/templates/next.js/nextjs-commerce, now redirects to vercel.com/templates/next.js/vercel-shop, which describes vercel/shop, so no homepage is recorded. The README lists Shopify as this repository's provider and names other providers' forks (BigCommerce, Medusa, Saleor, Shopware and others) that are separate repositories; they are not recorded here. The repository has one tag and release, v1 (2023-04-18), and the repository itself dates from 2020, so firstRelease is the year of that release. The README links the v1 code and release notes for those who look for the earlier version. The README says the repository is a template and that providers can fork it and replace lib/shopify; the template category is recorded for that reason. The README says to run it locally and names Vercel for the live storefront without stating a process model, so runsAs is not recorded. vercel/shop is named as the successor development home but is not a candidate yet.
