notes: >
  The CSV row is a boundary: a host security tool. Its own pages say it protects web applications (the AppSec component: "Application Security (WAF capabilities)", and the nginx bouncer page: "Protect NGINX with IP Blocking, CAPTCHA & WAF"), so it is recorded as in scope and accepted; a reviewer should confirm the call, since the same engine also covers SSH, databases and SMTP. The installation pages name packages for Linux, FreeBSD, Windows and macOS, plus Docker and Kubernetes; only the Linux and Docker routes are quoted. The current version is v1.8.2 (2026-10-26, a stable release); the CSV gave 2026-09-03, which is v1.8.1. The major is 1. The oldest GitHub release is v0.0.1 (2020-05-15), so firstRelease is 2020. The legal notice names CrowdSec SAS (registered office in Montrouge, France, and a registration at Nanterre); the docs footer says "Copyright © 2026 CrowdSec, Inc.", a second name recorded here only as a note. The Console is at app.crowdsec.net, and its Premium tier is described on the pricing page as SaaS; the pricing page also names a free Community plan, which has no field of its own here. The intro page says participants share the attacks they detect and receive a community blocklist through the Central API. The Enterprise plan is named on the pricing page without a price; no price is recorded. The Docker Hub image crowdsecurity/crowdsec is the one the Docker install page names; its pull count is 25,810,426. The runtime is recorded as binary from the Go language field, and no install page states it. The hub at hub.crowdsec.net is the detection-rule directory the README names; it is recorded as pluginDirectory, with no count recorded. The discord, forum and X links on the homepage have no visible text, so they carry no quote. The Console Premium is a separate hosted service and no feature edition of the engine, so no paidEdition is recorded. The Windows installation page says the installer sets CrowdSec up as a Windows service, recorded as always-on.
