notes: >
  The docs and README call the package a trait for Eloquent models. basedOn is not recorded: the requirements page says the package requires PHP 8.4+ and Laravel 12 or 13, which is a dependency statement, and no sentence calls it a Laravel extension. The maintainer is the LICENSE.md copyright line, Spatie bvba; the disclaimer and privacy pages give the same company as SPATIE BVBA with an address in Antwerp, Belgium, and a VAT number, which is not recorded. The introduction page's examples use setTranslation and getTranslation to write and read one locale, and the README names whereLocale to filter records by locale. The composer.json at tag 6.15.0 requires php ^8.4 and illuminate/database and illuminate/support ^12.0 or ^13.0. The README says translatable attributes are declared with the Translatable PHP attribute or a public $translatable property, and that translations are stored as JSON with no extra table; the installation page says non-JSON databases can use text columns. The databases rows are the two the docs name: the requirements page names MySQL, the querying page names MariaDB for the JSON column type; SQLite appears only in a note on case conversion and is not recorded. The query methods named in the docs are whereLocale, whereLocales, whereJsonContainsLocale and whereTranslationLike; whereTranslationLike is case-insensitive only as far as the database allows, and SQLite converts ASCII case only. The README's Alternatives section names DB-Fields-Translations, which has no record, so alternativeTo is absent. The README's postcardware request asks for a postcard, not a fee; Spatie's paid products are its own support offers, so no paidEdition is recorded. The social and newsletter links are in the footer of Spatie's docs pages and name the company's accounts, not the package; LinkedIn has no field and stays here. The packagist monthly figure is in the record's source but only the total is recorded. The contributors count is the rel=last page number of the contributors endpoint at per_page=1, and stars are the repository's. firstRelease 2016 is the oldest Packagist upload and GitHub release, 0.0.1 dated 2016-04-07.
