notes: >
  The candidate row gives amusewiki.org as the site; the homepage is recorded from its live page. The repository has no GitHub release, so the annotated tags v_X.Y are the project's releases: the highest stable tag is v_2.618 (tagged 2026-09-30), which gives currentMajor 2. The tag v_2.618-devel-1 is a development tag and is not used. The first tag in the repository is v_0.90 (2014-07-24), recorded as firstRelease. The LICENSE file's first line names the copyright holder and states the Perl 5 terms without naming Artistic or GPL; the GitHub API reports NOASSERTION, so the value is recorded as the file words it. The install page names a stripped TeX Live installer, nginx with FCGI as the recommended web server, and systemd units for amusewiki-web and amusewiki-jobber; these are recorded as runsAs always-on for the web service. The Text::Amuse markup is said to be based on Emacs Muse; the markup is not parent software in the sense of basedOn, so basedOn is not recorded. The README names a third-party Docker repository (rojenzaman/amusewiki-docker) for images; it is not a fact of this record. The Debian package repository at deb.amusewiki.org has no registry figure in the allowed list, so no download figure is recorded. The homepage calls the Debian packages at deb.amusewiki.org unofficial, while the install page recommends the Debian repository. The install page states that Windows is not supported and that the installer needs TeX Live, a database, Xapian libraries and git. The homepage also names an IRC channel on Libera Chat, which has no field.
