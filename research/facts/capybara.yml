notes: >
  Drivers are part of the library: Rack::Test runs in-process against a Rack app and Selenium drives a real browser; the README says WebKit is supported through an external gem, and the Capybara DSL is used from RSpec, Cucumber, Test::Unit and Minitest. Rails and Rack applications need no setup; a Rails app loads capybara/rails. These are integration facts for the test suite and stay out of fields. No runsAs is recorded: no page says the library is for development or CI only. The DSL visits pages, clicks links and buttons, fills in forms and queries the page, as the README sections on navigating, forms, querying and finding name. The maintainer follows the License.txt copyright line; the GitHub owner is the teamcapybara organization, which the homepage footer credits to Elabs as the site builder, not as the maintainer. The Patreon link in the README is a funding link and has no field. The Ruby mailing list on Google Groups is a discussion list linked from the homepage; the README sends help questions to GitHub Discussions, which is the forum fact. The homepage answers over both http and https; the https address is recorded. The repository has no GitHub release object, so the stable line is the RubyGems latest, 3.40.0, released 2024-01-27; its History file dates the same release 2024-01-26. The gemspec requires Ruby 3.0 or later at the same tag as the runtimeMin value.
