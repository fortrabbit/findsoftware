notes: >
  No homepage: the repository and its quick start are the project's own pages; the command reference the README links is on valkey.io, the Valkey project's site. Valkey 9.1.0 or later is named as the server to use in QUICK_START.md; no field fits that requirement. Build needs GCC 12 or later, or Clang 16 or later (README). The QUICK_START.md names a pre-built Docker bundle at a Docker section the README does not contain, so no docker install route is recorded. The README calls it a search engine; recorded as search-server. The module's copyright names "valkey-search contributors"; the Valkey project under LF Projects is named on the valkey record, not on this module's pages. The latest release by date is 1.1.1 (2026-07-15); latestReleaseDate follows the releases/latest endpoint, which reports 1.2.1 (2026-07-07). Fields coined: none.
