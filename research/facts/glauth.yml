notes: >
  Stable tag GLAuth-v2.5.4 (2026-09-13) is the highest GitHub release; release tags carry the GLAuth- prefix and the major is taken from it. The module is github.com/glauth/glauth/v2 in the v2 directory, whose go.mod states go 1.25.0; a Go toolchain is not a runtimeMin, so none is recorded. Copyright holders in the LICENSE file are Ned McClain, Ben Yanke and Chris Ravenscroft (2018); the homepage footer names The GLAuth Project Contributors, which is the maintainer recorded. firstRelease is 2018 from tag v1.0.0 (commit date 2018-04-19), which predates the GitHub release list. The README calls GLAuth a "Lightweight alternative to OpenLDAP and Active Directory" for development or a homelab; OpenLDAP has no fact file, so no alternativeTo is recorded. The quickstart says to set up SSL (TLS) before production use, and the README names production use of the single-server setup with Puppet, Chef or Ansible. The docs have SQLite, MySQL/MariaDB and PostgreSQL backend pages that show plugin configuration lines only; no sentence there names the engines as supported, so no databases value is recorded. The README lists an LDAPS listener (--ldaps); the docs also have pages for multi-factor authentication and OpenSSH keys, which were not read. The homepage names a Gitter chat (gitter.im/glauth/community) and a Matrix bridge; no field holds chat links. The homepage "Downloads" and "Docker Pulls" badges were not used: the Docker Hub API figure is the one recorded. The docs describe a beta channel for container images; the standalone binary tracks the master branch.
