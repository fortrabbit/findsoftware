notes: >
  Checked 2026-11-16. Single-package repository; the npm package sveltekit-superforms is the one the get-started page installs. The homepage's Discord link and the README's Discord link are the same invite (discord.gg/g5GHjGtU2W); the README also names two channel invites for free and commercial support (discord.gg/8X9Wfb2wbz and discord.gg/m6hUXE4eNQ), not recorded as discord. The x value is the maintainer's personal account linked from the homepage, not a project account. Latest release v3.1.0 (2026-10-29) is stable; the v3.0.0-next prereleases (2026-08-27 and 2026-09-30) are older than it and are not recorded as latestPrereleaseDate. The firstRelease year is the oldest release in the GitHub list (v0.8.2, 2023-04-24); the repository was created 2023-02-20. The homepage states the library works "even in static and single-page apps" and the README states it works "both on the server and with single-page applications"; that is compatibility, so it is in notes and not in renderingModes, and no page states a process model, so runsAs is not recorded. The validation libraries it adapts (Arktype, class-validator, Effect, Joi, JSON Schema, Superstruct, TypeBox, Valibot, VineJS, Yup, Zod) are named on the homepage and the get-started page; they are used by the project, not basedOn. No page names Node.js, so runtime is not recorded. Sponsorship links (GitHub Sponsors, Buy Me A Coffee, Ko-fi) and commercial support bought by donation are not a paidEdition or a pricingPage. Formsnap, a component library the Superforms site describes next to its own pages, is not recorded as alternativeTo or importsFrom. The Superforms version 1 docs live at superforms-v1.vercel.app, a docs site of the same project. The get-started tutorial builds a form from a schema, the server function superValidate in a load function, and a form action; it says to define the schema at the top level of the module so the adapter caching works, and to return the form object from every load function and action path. The homepage links a Discord invite and a list of validation library pages (get-started/valibot, zod4, yup and others), which are not separate records. The npm weekly figure is the sum of the daily downloads for 2026-11-01 to 2026-11-07 from the npm range endpoint.
