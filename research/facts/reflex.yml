notes: >
  The release history has a stable line at 0.x: v0.10.0 (2026-10-08) is the highest stable GitHub release, and v0.9.13 was published the next day with a lower version, so the major is 0 and the date is that of v0.10.0. The v0.10.1a1 prerelease (2026-10-23) is the latest prerelease. The architecture page is the project's own account of its React and FastAPI parts. The self-hosting page names redis and postgres in its container examples and redis for the state store; the database docs page lists MySQL, PostgreSQL, SQL Server and SQLite as supported. The homepage names a Reflex Build AI builder and a managed platform; the managed workflow appears in the hosting docs and the pricing page, which says every plan includes the open-source framework. The pricing page lists Free, Pro and Enterprise plans for hosting and the AI builder; these are hosting plans, not editions of the framework, and no prices are recorded. Separately, the docs describe Reflex Enterprise, a pip package of paid features under its own EULA, which is the paidEdition; its OIDC authentication plugin is the sso fact, and the SAML single sign-on on the pricing page covers the hosted workspace, so it is not recorded. The terms of use name the legal entity as PYNECONE, INC. (d/b/a REFLEX) and say they are governed by California law; the same page gives a San Francisco, CA address, which is the hqCountry source. The about page names the founders but gives no location. The pypiDownloads figure is last_month from pypistats.
