notes: >
  The GitHub repository LEPTON-project/LEPTON is an archived mirror: its README names gitlab.com/lepton-cms/LEPTON as the official repository, and it is not used for any fact. The GitLab project is not archived and its last activity is 2026-10-19. No GitHub figures are recorded.
  Highest stable release is 7.5.0 (GitLab tag, 2026-04-24, also on lepton-cms.org as released 24.04.2026). The GitLab release objects go back only to 2.0.0 (2014-11-29); firstRelease comes from the oldest tag, 2.0.0.0 (2013-02-09), and is a tag date, not a release date. The project site dates its copyright from 2010.
  Criterion 5 is not clearly met: the project site calls itself "LEPTON Project (private, none commercial)", and its legal notice names cms-lab UG as the service operator, and no public adoption figure was found on the project's own pages or the GitLab API used here. Status accepted follows the decision recorded for this candidate; a reviewer must confirm criterion 5 before publishing.
  The license is GPL-3.0 from the COPYING file; the project's license page states only "GNU General Public License" without a version, so both statements are consistent. The GitHub mirror's license and the GitLab API's license field are not used.
  The site's commercial addons are paid add-ons for the core, not a paid edition of it, so paidEdition is not recorded.
  The homepage states "LEPTON is fully PHP 8.5.x compatible"; the release page states PHP 8.1.x as the minimum and 8.4.x recommended. The minimum is recorded from the release page.
  The install page describes the upload and the /install wizard; a server precheck file is offered separately and not recorded.
  The addons repository (LEPAdoR) at lepton-cms.com is the free addons directory the project's site links; no addon count is stated there. The site also lists commercial addons.
  The GitLab project shows a star count, but githubStargazers is a GitHub figure and no established field fits, so none is recorded. The imprint places the legal notice in Germany, but no page ties the maintainer's headquarters to a country, so hqCountry stays out.
