notes: >
  The npm package named bolt is a different project (boltpkg/bolt), so npm figures come from bolt-cli, the package the install section names. GitHub reports the language as HTML; the build files are CoffeeScript and the README does not name a language, so language stays unknown. The package.json version 0.0.6 is older than the latest GitHub release v0.1.4 (2016-07-26), which is recorded. firstRelease is the earliest release in the GitHub release list (v0.0.6, a prerelease, 2014-10-28). The README states Stylus is the default stylesheet preprocessor alongside Jade; no field covers stylesheets yet, so Stylus appears only in the prose. The dev and prod builds write separate output directories, per the README. The repository has no LICENSE file; the license is the MIT line in package.json. The last commit on the default branch is from 2016-10-28, which is not an end signal.
