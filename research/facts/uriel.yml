notes: >
  The license is taken from the header of the uriel script (version 3 or any later version); the GitHub API and the homepage give GPL version 3. The maintainer is the copyright holder named in the same header; the README byline is "By Nathan Rosenquist". The contributors count is 1.   The README says the script runs from any directory without installation and that each run after the first regenerates the site from the project files. The documentation says a project can execute lib/soju.py and lib/handlers.py during the build and asks users to trust a project before building it. The docs site at documentation.uriel.foo is itself a Uriel project and states the commands used for the install and the build. The README and the homepage name no minimum Python version; the homepage says "As long as you can still get a working copy of python3", so runtimeMin is absent. The homepage download link is the release tarball uriel-1.6.1.tar.gz. The GitHub repository has releases from v1.0.0 (2022-11-18) and the latest stable release is v1.6.1 (2026-09-24); firstRelease is taken from the oldest GitHub release. A PyPI package named uriel exists, but neither the install docs nor the project's pages name it, so no registry figure is recorded. The homepage also links the author's personal site and the Unsong novel, which are not project links and are not recorded.
  dependencies is coined here for the dependency statement the homepage makes.
