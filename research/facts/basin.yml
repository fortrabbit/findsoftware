notes: >
  Basin is a hosted form backend: an HTML form posts to a Basin endpoint, and submissions are filed, filtered and forwarded from the dashboard (homepage). The GitHub repository and any SDK are not recorded, since the CSV row names none and hosted-service rows take nothing from client code. The vendor is Moonshot Ventures Inc. of Abbotsford, British Columbia, Canada (terms page mailing address); the company founding year is October 2017 (about page), but no release history is stated, so firstRelease is left out. The pricing page lists a free plan next to paid plans (coined kind freeTier, no limits recorded). Coined kinds, kept here: embedMethod is an HTML form action plus the BasinJS JavaScript library (docs.usebasin.com/guides/form-creation/basin-js); webhooks and webhook signatures (features page, "Webhook Signatures"); Zapier, Slack and Google Sheets integrations (pricing page). The pricing page lists a Growth plan with API access and webhooks, and a 14-day free trial; no prices are recorded. Data regions are not stated: the GDPR subprocessor list names Hetzner (EU, inside the EEA) for infrastructure, DigitalOcean (Canada) and AWS (US) for other parts, so regions is left out for a reviewer to settle. The terms and GDPR pages mention a privacy representative for the EU and UK, which is not recorded as a fact. The site has a status page (status.usebasin.com) for its own service; the record's homepage leads with forms, so criterion 1 holds.
