notes: >
  The package ships SVG files, a sprite, an icon font, CSS and Sass; language is recorded as CSS, the vocabulary value the import maps for a package that ships CSS and Sass, since the vocabulary has no SVG value; the README's own list is the quote. The homepage says the icons work with or without Bootstrap, and the README calls the library the official icon library for Bootstrap, so no basedOn is recorded: an icon set for Bootstrap is not built on it. The homepage's count of icons changes each release and is not recorded. The highest stable GitHub release is v1.13.2 (2026-10-08); the earliest tag, v1.0.0-alpha, dates from 2019-11-26, so firstRelease is 2019. The npm figure is the sum of the period 2026-10-18 to 2026-10-24 as the range endpoint returns it. The legal name comes from the LICENSE copyright line, The Bootstrap Authors; the npm author is an individual handle and is not used. Packagist publishes the same package as twbs/bootstrap-icons; the install docs name npm first, so the npm figures are recorded. The jsDelivr CDN link in the README pins a version; the quote names the CDN method only. httpArchiveSites is the HTTP Archive mobile origin count for the technology named Bootstrap Icons. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header.
