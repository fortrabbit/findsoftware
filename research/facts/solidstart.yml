notes: >
  The main branch README calls itself the 2.0.0-alpha branch and names the 1.x branch as the maintained line, while npm dist-tag latest is 2.1.0 published 2026-10-22; currentMajor follows npm, and the README is stale. The docs have a migration guide from v1 (Vinxi and Nitro v2) to v2; it is the same project, so no importsFrom or successorOf fact is recorded. The docs name three deployment plugins, Nitro (portable presets), Netlify and Cloudflare, and say the Netlify and Cloudflare plugins integrate directly with their platforms; there is no field for deploy targets, so they are not recorded, and runsAs stays unknown because the docs say the live runtime depends on the chosen preset. The GitHub organization is named SolidJS and the copyright holder in LICENSE is an individual; the maintainer follows the LICENSE line. The npm downloads figure covers 2026-10-12 to 2026-10-18, and the candidate row had recorded about 73k. basedOn comes from the v2 docs overview, which says SolidStart v2 builds on Solid and Vite. The homepage is the project's own start.solidjs.com, which also says SolidStart v2 is stable.
