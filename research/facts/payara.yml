notes: >
  Doubt: www.payara.fish now answers with a 301 to azul.com's Payara Server product page (migration dated July 2026 in the redirect), the community download and documentation are branded "Azul Payara Community" at docs.azul.com, and payara.org says "A new payara.org is coming" with "© 2026 Payara Foundation"; a statement from the Payara Foundation on who maintains the community edition and which address is its homepage would settle the homepage and maintainer fields, and until then status is stub. The GitHub repository is still the payara org and its latest stable release is payara-server-7.2026.10 (2026-10-14); the version scheme is 7.YEAR.n, so currentMajor is left out for a reviewer (the line is 7). The GitHub license is NOASSERTION; LICENSE.txt is CDDL 1.1 without a copyright line, and no page names a second license. Mapping the Payara Enterprise edition: the README names it and the docs index says production users "should use the Payara Enterprise Edition", but no fetched page states a price or paid license, so paidEdition stays out. Java runtime minimum is not stated on the pages read; the release notes say "stable, fully supported production" Enterprise runtimes for Azul Payara Server, which is recorded only as text. The README also covers Payara Micro Community in the same repository, which is not a separate record. The Azul pages describe Azul Payara Server as a product and Azul as the vendor (about page); whether that makes Azul the maintainer is the open question above. The supported platforms page lists Java 21 and 25 builds in its table without a sentence stating a minimum, so runtimeMin stays out. The README names a Payara Forum as plain text without a link.
