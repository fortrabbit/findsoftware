notes: >
  The GitHub language is Jupyter Notebook because the source lives in notebooks; the language field records Python from the README. The README and the About page describe a hypermedia approach with HTMX ("thanks to HTMX"); no field carries it. The About page says FastHTML was started at Answer.AI by Jeremy Howard, and its footer names AnswerDotAI, Inc as the copyright holder. The About page lists one-click deploy to Railway, Vercel and Hugging Face; this record does not treat those as hosting facts. The About page says FastAPI was a major inspiration; that is a stated influence, not a parent, and is not recorded. The rendering mode is not stated as a term on any page read, so renderingModes stays out.
