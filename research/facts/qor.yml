notes: >
  Doubt: the register's QOR is the Go library repository github.com/qor/qor, whose latest stable release is v1.3.0 (2022-11-14); the project's homepage at getqor.com now presents QOR5, linking to github.com/qor5/admin (MIT, pushed 2026-10-25) and docs.qor5.com, so it is not settled whether the software on the homepage is this repository or its successor line. Settling it needs the project's own statement of which repository is current, or a release of qor/qor after v1.3.0. Status is stub under the rule that the project's own site no longer shows the software in the form the record describes; the homepage is https and answers 200, so it is recorded. The README calls the library set QOR and says QOR 1.0 was the first open source version under MIT; the v1.0 tag has no GitHub release object (the earliest release is v1.1, 2019-04-23), so firstRelease is the 2016 date of the v1.0 tag. The Go module directive at v1.3.0 is go 1.13; the master branch's go.mod names go 1.26.0, which is not the latest release and is not recorded. The maintainer's legal name and address come from the privacy policy of The Plant, which the README and docs name as the company that uses QOR and wrote it. The docs site (doc.getqor.com) is GitBook; its get-started page gives the go get step and an example that uses the QOR Admin package. The Plant's privacy policy lists a Tokyo address, recorded as hqCountry. The homepage's enterprise references (NHK, ASICS, a quick-service restaurant chain) are not recorded as adoption, because they are named on the homepage without a figure. Gitter links on the README have no field. The Go module path is github.com/qor/qor. The README says the original QOR was a proprietary Ruby on Rails framework used internally at The Plant, that QOR is not a boxed turnkey solution and needs coding skills, and that building the frontend files needs Node.js and Gulp. The homepage describes QOR as a cloud-based SaaS CMS. The docs overview lists the modules (admin, publish, transition, media library, worker, exchange, i18n, l10n, roles) as plugins that can be used independently.
