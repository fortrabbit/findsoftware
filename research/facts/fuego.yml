notes: >
  The highest stable GitHub release is v0.18.0 (2025-02-05), so currentMajor is 0. The Go proxy lists v0.21.0 (2026-09-15) as the latest version, which is the latestReleaseDate, and also lists v1.0.0 and v1.0.1, but go.mod retracts both ("Published accidentally", "Contains retractions only"), so currentMajor stays 0. The docs say Go 1.22 or above; go.mod at v0.18.0 names 1.23.3 and at v0.21.0 names 1.26.6, which the docs do not state. The Go module has no registry download figure. The site footer names "Fuego, Inc.", while LICENSE.txt names go-fuego; the LICENSE line is recorded as the maintainer. The README compares the framework with Chi, Gin, Fiber and Echo; that comparison is not recorded as alternativeTo because it is not a comparison page of the project. The Gin and Echo adaptors are documented on the docs site, and the README describes them as ways to generate OpenAPI for an existing server. The docs index page has no description sentence, so the docs value is recorded without a quote.
  The README describes OpenAPI generation from code, routing with middleware and grouping, serialization of JSON, XML and HTML forms, validation through go-playground/validator, RFC 9457 error handling and html/template rendering.
