unreadable: [https://wyam.io/]
notes: >
  The homepage wyam.io no longer belongs to the project: it redirects to an unrelated site, and the README's "wyam.io" links are dead, so no homepage is recorded. The README opens with "This project is essentially archived.", says Wyam was rebranded and rebooted as Statiq, and says the issue tracker and code stay open for ongoing issues; the status is discontinued. Statiq succeeded Wyam: the Statiq record carries successorOf Wyam, from its own README line "This project is an evolution of Wyam". The GitHub repository is not archived. The docs are the Wyam.Web repository's input/docs folder, the source of the former wyam.io site. runtimeMin is the ".NET Core 2.x" requirement from the obtaining page, which also lists the release zip, the NuGet tools package and Chocolatey next to the global tool. The Blog recipe's CleanBlog theme folder holds .cshtml files, recorded as Razor. firstRelease 2016 is the oldest NuGet upload of the Wyam package (0.11.1-beta, 2016-02-03); the 86 GitHub releases were bulk-created on 2020-03-05, so they say nothing about the first release. latestReleaseDate is the Wyam.Tool 2.2.9 upload on NuGet, 2019-10-11, and currentMajor 2 comes from the same package line. The install docs name the NuGet tool Wyam.Tool, the registry package recorded; the 80354 figure is NuGet's total downloads. The maintainer is Dave Glick, the copyright holder named in the MIT license. The "static content generator" wording comes from the README and is recorded as static output; the install as a .NET global tool is recorded as local.
