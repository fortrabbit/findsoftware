notes: >
  OneEntry is a hosted platform: the pricing page sells per-project installations on the OneEntry infrastructure, and no installable part is named on any page read. The site links a GitHub organization (github.com/ONEENTRY-PLATFORM) and a dev.to profile; the organization is not recorded because it holds client code for a hosted service. The About page describes content delivered over APIs to any frontend and an admin panel, and the pages name an SDK, an API and an MCP server, and the docs page mentions a REST API only inside a tab that the served text does not carry as readable text, so headlessApi stays unknown. The legal pages (terms, privacy, legal) return the same application shell as the homepage, with no company name or country, so hqCountry is unknown and the maintainer is recorded as the copyright line states it. The pricing page lists Stripe as the only payment system integration, which has no field in the starter list, and it is left to notes. The home page lists the Study plan as free and gives a monthly price for each paid plan, none of which is recorded.
