notes: >
  Two npm packages: @blaze/atoms (web components, the package this record names, repository BlazeSoftware/atoms) and @blaze/css (the CSS, repository BlazeSoftware/css, 140 weekly downloads in the same range, 4 dependent packages). The install page names both for the CDN links. The atoms repository has no LICENSE file (the GitHub license endpoint returns 404); the MIT statement comes from the npm package and the homepage. The homepage "Our components rely solely on native browser features" is not a statement that the code runs in the browser, so runsAs is not set. The atoms README says the components are compiled with Stencil ("Blaze uses Stencil to compile our components"), a build tool, so no basedOn. GitHub releases run from v1.0.0 (2016-01-25) to v4.2.0 (2018) and stop there; the tags and npm versions run on to 13.1.0 (2023-06-20), so the registry major is used. The repository's last push is 2023-06-20 and the npm package has no release since; no end signal is stated. The GitHub organization profile gives a United Kingdom location, which is not a legal notice, so hqCountry is not set. Maintainer is the npm author and sole maintainer; no page names a legal entity. Blaze Theme (theme.blazeui.com) is a CSS variable generator on the same site and is not recorded separately. The install page says linking the stylesheet changes nothing by itself and that each element needs its Blaze class, such as c-button. The custom build page says to clone the css and atoms repositories, change the variables and mixins, and build the toolkit, as the route when so much needs overriding that a customized version is wanted.
