notes: >
  Hosted-service record: the product is only offered as a service, with no open-source server. The SDKs the company publishes on GitHub (for example its Node and Laravel packages under the cloudinary and cloudinary-community organizations) are not the service and their license, stars and npm figures are left to a later note, per the hosted-service rule; no repository field is recorded. The legal name is Cloudinary Ltd., the company that owns and operates the service under the terms of use, which name Israeli governing law for the Ltd. contracting party; the about page lists an office in Petah Tikva, Israel, and offices in San Jose, California and the United Kingdom, but no page names a headquarters, so hqCountry is left out for a reviewer to decide. The about page says the company "was founded in 2012"; that is not a firstRelease, and no first release of the service is stated. The pricing page lists "User management (SSO, provisioning API)" on the enterprise plan and the trust page names "single sign-on" among security features; neither names a protocol, so sso is left out. The pricing page lists plans with a free tier at $0; freeTier and the plan prices are not recorded, as coined and dated kinds. The trust page says the company "uses AWS servers located worldwide" and "regional redundant data centers"; regions is left out because no page names a data region a customer can choose. The homepage footer also links LinkedIn, which is a coined field and is not recorded. The terms of use (cloudinary.com/tou) hold no postal address for a notice, so hqCountry stays out. The category image-cdn in the CSV has no entry in the import's category map, so only media-processing is recorded. The social links (X, Facebook, Instagram, YouTube) carry no quote because the homepage links are icon links. The documentation landing page lists "Cloudinary Image Upload REST APIs" under its developer section; that is the only API style named there.
