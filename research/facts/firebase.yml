notes: >
  Firebase is a hosted platform: no self-hosted option was found on the pages read, so no runtime, install or license fields are recorded for the product. The open-source part is the SDK repository firebase/firebase-js-sdk, which is not the product: its GitHub license field reads NOASSERTION and its LICENSE file is Apache-2.0 with a BSD-3-Clause protobuf part; it had 5,157 stars and was last pushed 2026-11-03 (read 2026-11-03). Its npm package firebase (latest 13.2.0, Apache-2.0) had 13,798,842 downloads from 2026-10-26 to 2026-11-01, the period in the value; the CSV row's 6.3 million per week figure is older. Both are recorded here only as notes. The privacy page names Google LLC as the company for the US part of its services and the terms page names no legal entity in the text read; the hqCountry of Google LLC is not stated on the pages read, so it is not recorded. Products named on the homepage include App Check, App Hosting, Authentication, Cloud Functions, Cloud Storage, Firestore, Hosting, Realtime Database, Cloud Messaging, Crashlytics, Google Analytics, Remote Config and A/B Testing; the homepage lists them under Build and Run, and the categories are taken from the Authentication and Realtime Database docs pages and the platform sentence on the homepage. The pricing page lists a Spark plan with no-cost limits and a Blaze pay-as-you-go plan; no prices are recorded. Authentication's SAML and OIDC support is priced per monthly active user on the pricing page, and the auth product page names OpenID Connect and SAML. The Firebase console is the admin interface the setup guide names. Firestore and Realtime Database are data stores the product offers; the pages read do not state a contentStore value, so none is recorded. The Google Analytics, Cloud Messaging and Crashlytics pages were not read for this record.
