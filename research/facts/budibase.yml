notes: >
  The license is GPL-3.0 per packages/server/package.json at v3.50.0 and the LICENSE file on master, which reads "You can consider Budibase to be GPLv3 licensed overall." and states that each package has its own license; the monorepo LICENSE of the tag is the same wording. The GitHub API reports NOASSERTION, so no SPDX id comes from the license file itself. The LICENSE file also names SQS_LICENSE for Structured Query Server, a bundled component by The Neighbourhoodie Software GmbH, which is not recorded as a license of the project. The homepage copyright line reads "2026 Budibase, Inc.", while the terms name Budibase Limited (NI662141, Belfast) as the contracting entity; the terms entity is recorded as maintainer and Budibase, Inc. is not. The paid cloud plans on the pricing page are not recorded as paidEdition; the self-host Enterprise tier is. The pricing page sets SSO on the self-host tiers without a clear mapping in the page text, so the sso entries cite the homepage and the OIDC wording of the pricing page, not a tier. The GitHub releases include prerelease tags such as v3.51.0-cloud.7 (2026-10-21); they are cloud builds, not alpha, beta or RC, so latestPrereleaseDate is not recorded. The highest stable release is v3.50.0 and the first release is v0.1.2 (2020-07-13). The repository was created in 2019, before its first GitHub release. The docker-compose page lists CouchDB as the database service and MinIO as the object store for files; MinIO is not recorded as a database. Other external data sources (PostgreSQL, MySQL, MongoDB, Redis, S3 and others) are connectors listed in the docs and are not recorded as databases of the software. The docs say the hosting methods include Docker, Docker Compose, Kubernetes, DigitalOcean, Portainer and Windows Server, Azure App Service and Google Cloud Run; the installMethod entries record the routes whose pages were read in this pass. The embedded-app docs page (https://docs.budibase.com/docs/embedded-app) says "Embed a Budibase app as an iframe within your own webpages." and lists allowed domains and embedded-user authentication in the embed settings. The homepage also links LinkedIn and YouTube, which have no field and stay here. The homepage's "27.5K" and "300K teams" figures are not recorded. The README calls it an open-source operations platform for AI agents, apps and automations, and the Docker Compose page says the services can be hosted separately if the URLs reach each other. The pages read: the homepage, the terms, the pricing page, the docs index, the Docker, Docker Compose and Portainer pages, and the README and package manifests at v3.50.0.
