notes: >
  Status: accepted per the CSV. The docs page testng.org is the homepage and the documentation; its Download section shows Maven and Gradle dependency blocks for version 7.9.0, an older release than the latest. Those blocks are code only and name no route in a sentence, so the maven installMethod cites the Maven Central search API, where the package is published. The docs say the project "is compiled to target Java 11 bytecode" in the README at 7.12.0 and state "TestNG Upto v7.5: JDK 8" and "TestNG v7.6.0 and above: JDK 11 or higher" in the requirements section of the docs; the older JDK 8 line is kept here, not in a field. The LICENSE file is the Apache License 2.0 text with no copyright line, so the maintainer falls back to the GitHub organization testng-team, with no legal entity named anywhere checked. The docs describe the project as in the history section of the manual: the original author is named there as a historical author and is not recorded as maintainer. Maven search reports the first upload as 4.4.7 from 2010-07-17, older than the first GitHub release, so firstRelease is 2010. The search index lists releases only up to 7.11.0, while the Maven metadata file lists 7.12.0 as the latest; the GitHub release 7.12.0 is used for currentMajor and latestReleaseDate. The docs describe tests marked with annotations, a testng.xml suite file with groups and parameters, and runs from the command line, Maven and Gradle; these are coined kinds kept here. The Eclipse and IntelliJ plug-ins are separate projects listed in the docs; none is recorded. The docs name the users mailing list on Google Groups, which the README also lists for questions, and that is the forum; the StackOverflow tag is not the project's forum. The docs migration section says TestNG can run JUnit tests and converts them through the Eclipse plug-in, which gives importsFrom and alternativeTo junit; the docs say it is inspired by NUnit as well, which is not a comparison. The source-build route is the docs' own Build TestNG from source section, and the command-line statement gives runsAs local. Stars and contributors (223 across all pages) belong to the repository, which holds the framework and its modules.
