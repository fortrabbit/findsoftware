notes: >
  The maintainer is The Apache Software Foundation, as the NOTICE states. The ASF page read at apache.org/foundation calls the foundation a U.S. 501(c)(3) nonprofit; a foundation incorporation is no project HQ, so hqCountry is not recorded and the reviewer decides. The storage engine is RocksDB, which has no record of its own, so it is not basedOn. The README says Kvrocks is compatible with Redis clients and Redis cluster SDKs, and its introduction says it aims to lower memory cost compared with Redis; the README sentence comparing it to Redis and its migration tools (RedisShake, kvrocks2redis) are recorded as alternativeTo and importsFrom. The Docker image is in the apache namespace on Docker Hub (not the official library), and its pull count is the figure the getting-started page names. The homepage links GitHub and a Zulip chat (kvrocks.zulipchat.com); no Zulip field exists, so none was coined. Companion repositories named on the docs (kvrocks-controller, kvrocks-exporter, kvrocks-search, kvrocks2redis) are separate projects and are not recorded here. The first release is v1.0.1 of 2019-08-23 (the repository was created 2019-08-15); the current stable line is 2.17.0 (2026-09-19), so currentMajor is 2. The README lists supported platforms as Linux and macOS on x86_64, ARM and RISC-V. The download page says the project releases source artifacts only. The README social section also links Medium, which has no field. Fields coined here: none.
