notes: >
  The CSV note "GPL edition" is not supported by the sources read: the licenses page (https://dhtmlx.com/docs/products/licenses.shtml) puts GPL v2.0 on the Standard editions of other DHTMLX products and MIT on the Gantt Community Edition, and the current README and LICENSE.md say MIT only. The GitHub repository and npm package both carry MIT. The README's maintainer line reads "XB Software Ltd." while the LICENSE copyright line reads "XB Software"; the LICENSE line is recorded, the legal form is left to a reviewer. The licenses page sells Gantt under commercial licenses with prices, which are not recorded; the PRO edition is the paid tier the README names. The framework-agnostic core has integrations for React, Angular, Vue and Svelte; the PRO edition adds ready-made components, so no basedOn is recorded. The PRO edition's auto-scheduling and critical path are the paid features. The README says PDF, PNG, Excel, iCal and MS Project export run through the DHTMLX online export service, a hosted dependency for those exports, so those export routes need the hosted service. The README does not state where the library runs, so runsAs is left out. Stars and contributors belong to the single package repository. The docs footer links the DHTMLX company accounts (x, youtube, facebook); the product has none of its own. The docs state that free versions v9 and earlier were GPL v2 and that v10 onward is the MIT Community edition; the older license is noted here only. The firstRelease year comes from the oldest GitHub release v2.1.1 (2014-03-28), older than the npm upload history starting 2016.
