notes: >
  The README describes automatic publishing to an Amazon S3 bucket through a deployed AWS publisher. No homepage is recorded: the repository has none, and the README names no project site. The content lives in Contentful, a separate hosted service that Stacy reads through its API, so no contentStore is recorded for Stacy; the Contentful webhooks and the AWS publisher Lambda are parts of the setup the README describes, and the Lambda publisher runs as an event handler, a runsAs value the list does not hold, so it is noted here and not recorded. The highest stable GitHub release is v2.0.0 (2019-10-24), which matches the npm latest tag. The repository was last pushed on 2022-12-06 and no end statement was found. The contributors endpoint lists one contributor. The docs link points to the tutorial that the README names; its file is in the repository docs folder.
