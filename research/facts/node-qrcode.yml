notes: >
  Boundary ruling for wave 62: node-qrcode generates QR code images in a Node or browser program, a helper library, accepted under the qr-code category (media); the CSV status accepted stands. No homepage: the GitHub homepage field is empty, and the npm homepage points at the repository, so the repo-only rule leaves homepage out. The package the install docs name is qrcode on npm; the repository is named node-qrcode and the README title is node-qrcode. The repository has no GitHub release; its tags run to v1.5.4, and the npm latest version 1.5.4 (2024-08-05) is the stable registry release, so currentMajor and latestReleaseDate come from the registry. The first upload of the qrcode package is version 0.0.1 on 2010-12-21, the year of firstRelease. The README's Node.js section and its Server API section show Node use, and the README says it works on server and client; no sentence states the runtime in one line, so runtime and runtimeMin are left out for a reviewer to decide. The package engines field (node 10.13 or later) is not recorded because the library runs in the browser too, and the rule on browser libraries keeps a Node minimum in notes. No runsAs: the README does not say it runs only in the browser. The README says the library is based on "QRCode for JavaScript" by Kazuhiko Arase, MIT licensed; that is not a record id, so basedOn stays absent. The README's Installation section also names a global npm install for the qrcode command line tool; it is the same npm route. The QR Code trademark line (DENSO WAVE INCORPORATED) is a note, not a field. The license statement in the LICENSE file and the README link to it are one wording.
