notes: >
  No project site: the GitHub repository's homepage field points to the crates.io listing, which is a registry page, so no homepage is recorded. The install docs name GitHub release downloads, a Debian package feed, cargo install sonic-server, a Docker image and a source build; a Homebrew formula is named as a non-official source and is not recorded. The Docker image is valeriansaliou/sonic; the README's Docker examples use two image tags. The maintainer is the first author in Cargo.toml at the v1.10.2 tag; the same manifest names two more authors, Baptiste Jamin and Rémi Bardon, and no legal entity. The license is stated once in the manifest and in the LICENSE.md file (Mozilla Public License Version 2.0). The rust-version of 1.92.0 comes from the v1.10.2 manifest; the rust runtime name is not in the runtime vocabulary of src/data/fields.yml, so it is not recorded as runtimeMin. The README says the server speaks only the Sonic Channel protocol and offers no HTTP endpoint; that is a client-protocol fact, and no headlessApi field fits it. Official client libraries are listed in the README and are not recorded. The README states that the search is performed on the file system and the index is kept in a key-value store and FST files on disk; those storage details are not recorded as a field because they are not named in a field vocabulary. The project's own README names Crisp as the product it was built for and a user of it; that is no parent relation and no basedOn. The GitHub repository and the crate both name a homepage of crates.io or the repository, so no project site exists to record.
