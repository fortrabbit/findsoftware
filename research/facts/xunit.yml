notes: >
  The maintainer follows the LICENSE copyright line, ".NET Foundation and Contributors"; the README and homepage also say the project is part of the .NET Foundation and governed by a Project Lead, and the project calls itself xUnit.net. The LICENSE grants Apache License 2.0 for the source and carries a second MIT notice for one source file adapted from MSBuild, recorded as its own license entry. GitHub detects no license (NOASSERTION), so the license is taken from the README sentence and the LICENSE text, which is Apache License 2.0. The GitHub releases list holds only the v3 line: the current stable release is v3-4.0.3 (2026-11-11), and its major is 4. The NuGet package xunit (the v2 line, 2.9.3) has 1,147,797,238 total downloads; it is not the package the v3 getting-started page installs, so its figure is not recorded here, and the earlier CSV figure for it is superseded. The v3 getting-started page installs the xunit.v3.templates package and creates projects that reference xunit.v3.mtp-v2; xunit.v3 is the package named for the record. The first release is taken from the NuGet registration for xunit, whose oldest upload is 1.7.0.1540 (2011-01-31). Stars and contributors are the xunit/xunit repository's figures. The README says the tool works with the .NET SDK, Visual Studio, Visual Studio Code, JetBrains Rider, NCrunch and Microsoft Testing Platform or VSTest. The runtime and runtimeMin come from the README sentence that names .NET 8.0; the .NET Framework 4.7.2 minimum is stated in the same README and is not recorded as runtimeMin.
