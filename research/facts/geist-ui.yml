notes: >
  The project's own homepage at geist-ui.dev reads "Archived - Geist UI ... Geist UI is archived. Geist UI is no longer actively maintained. The source and published packages will stay available for reference, but no new releases, bug fixes, or support are planned." The README on master says "Geist UI will be archived and will no longer receive active updates." and the GitHub repository is archived (API archived true, last push 2026-06-01). The record is discontinued on both signals. The README and the homepage name no install steps and no runtime, so runtime and runsAs are not recorded; the GitHub release list has 97 entries, the highest stable being v2.3.8 (2022-03-22), and the first entry is the 0.0.1-beta.1 prerelease from 2020-03-29, which sets firstRelease. The docs source in the repository (pages/en-us/guide/installation.mdx) names @geist-ui/core as the install package, whose latest version 2.3.8 is the same as the last GitHub release; the figures are that package's. The npm package named geist-ui is a different package whose link to this repository is not shown. The introduction page says it is a community project not associated with Vercel. The maintainer is the copyright holder named in the LICENSE, "Geist UI", which is the name the project states.
