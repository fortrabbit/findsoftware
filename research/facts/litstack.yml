notes: >
  The README opens with "Development discontinued ... in maintenance only mode"; that is the end statement for criterion 4, so the status is discontinued although commits and a release landed in 2026-06. The CSV scope note (widened from boundary on 2026-10-19) is taken as settled: an admin panel package for Laravel that a web creator adds to an application. The litstack.io footer credits www.aw-studio.de; that studio's imprint names Alle Wetter GbR (Kiel), recorded as maintainer. The official packages (pages, 2FA, location, bladesmith, meta, rehearsal) are separate packages and are not recorded here. runsAs is not recorded: the docs do not state how the live site runs. The Packagist package is the one the install docs name.
