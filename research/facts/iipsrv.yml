notes: >
  Criterion 1: the server is a FastCGI back end that the site or a web app calls over HTTP, and the project's own pages name client viewers that call it (IIPMooViewer, OpenSeaDragon, Mirador, UniversalViewer; download page: "in conjunction with client-side viewers"), so it is accepted under the server rule. The homepage says streaming is tile-based and that source images can be TIFF, JPEG2000 or JPEG; the homepage's image security line says only compressed derivative views are sent to the client and the full-resolution image does not need to be accessible. Image library and output formats (libtiff and libjpeg, optional libpng, libwebp and libavif output; JPEG, PNG, WebP, AVIF and TIFF output), the IIP, IIIF, Zoomify and DeepZoom APIs, image security (only compressed derivative views are sent to the client), Memcached caching and watermarking are kept here because no field fits them. Optional Kakadu for JPEG2000 input is a commercial, non-open library that the builder must license; OpenJPEG is the open option the README names for the same input. The project does not offer a paid edition of the server, so no paidEdition. The download page says the commercial license statement is for use "in a commercial product"; the GPL-3.0 entry is the license of the server source. The commercial statement is recorded as the page words it; the reviewer decides whether that changes licenseModel. The maintainer is Ruven Pillay per the homepage copyright line and the AUTHORS file. The homepage links a Twitter account (twitter.com/iipimage) as well as x.com/IIPImage, and a LinkedIn company page (linkedin is a coined field, not recorded). Docker Hub counts the iipsrv/iipsrv image at 32482 pulls on 2026-11-03. The first release on GitHub is iipsrv-1.0 (2016-03-22), but the tag iipsrv-0.9.8 predates it: its commit is dated 2009-12-02, so firstRelease is 2009. The current stable release is iipsrv-1.3 (2025-05-28); the download page says it is the latest stable version of the server. The contact page names IIPImage Ltd for commercial licensing and support; the LICENSE and homepage copyright name Ruven Pillay, so he stays the maintainer. The server page says the distributions package it with Apache, Lighttpd and Nginx configuration, and that it can run standalone or as an independent service; the Alpine package starts through OpenRC. The official Debian and Ubuntu APT repository is the signed-keyring route on the server page.
