notes: >
  The project site astronomersiva.github.io/lego is readable and is the homepage. The README is the docs; the build command is lego build (README, section Usage); the repository's docs/ folder holds only the site's 404 page and index. The repository has no GitHub releases; the highest tag is 3.3.0 and npm latest is 3.3.1, so currentMajor and latestReleaseDate come from the npm package @astronomersiva/lego (the scope the README installs). The unscoped npm package lego is a different project (imweb/lego, "Static Package Manager", from 2014), so npmName is the scoped name and that package's download figure is not recorded. firstRelease is 2018 from the npm package created 2018-08-04, and the repository was created 2018-07-28. The README benchmark against Jekyll and the site's speed claims are not recorded: they are the project's own figures, not facts about the software's fields. The homepage's link to siva.dev carries UTM parameters and is not cited. The maintainer name comes from the README license line; the package.json author line gives the same name with an email address, which is not recorded.
