notes: >
  Status is accepted because no end signal exists: the README and the homepage state no end, the npm latest version is not deprecated and the repository is not archived. The last npm release is 2.3.9 on 2020-08-19, the same day as the v2.3.9 tag, so the import's four-year rule moves this record to stub on its own; the status is left as the candidates row says. The repository has no GitHub release objects, so currentMajor and latestReleaseDate come from the npm latest version; the highest tag is v2.3.9. The README's install section and the getting started guide both name npm install lunr, and the getting started guide names unpkg for a script tag; the unpkg URL is not recorded as a separate install method. The homepage tagline compares Lunr with Solr; it is a comparison, not a basedOn statement. The npm figure is the sum of the daily counts for the full week 2026-09-28 to 2026-10-04; it counts the lunr package only, not the lunr-languages add-ons. The package's npm latest version is the source for the npm figures; the npm 2.1.0-alpha.2 tag dates from 2017 and is older than the last release, so no latestPrereleaseDate is recorded. firstRelease 2012 is the commit date of tag v0.1.0, the oldest tag, because the repository has no release objects; npm's first version is 0.2.0 on 2013-03-04. The homepage is served over https, so it is linked. The homepage repository link is the only forge link on the site.
