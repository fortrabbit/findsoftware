notes: >
  The install page names the BlazorBlueprint.Components NuGet package; it pulls in BlazorBlueprint.Primitives, which is not recorded separately, and the icon packs are separate NuGet packages. The repository is a monorepo with components/ and primitives/ tags, and it holds no GitHub release objects, so the registry major (4.1.0 on NuGet) is used. The earliest NuGet upload visible is 2.0.0 on 2026-02-02 and the earliest tag is components/v3.4.0 on 2026-03-06; the FAQ says the library has been "actively developed since 2025", a development statement and not a release, so firstRelease is 2026. The homepage says the enterprise components are free: "Free and open source, including the enterprise components." and the enterprise page says "No per-developer fees", so no paidEdition is recorded. The NuGet author is Mathew Taylor; no legal entity is named on any page read, and the LICENSE file carries no copyright line. ecosyste.ms lists no dependent packages or repositories for the NuGet package, so no dependent counts are recorded. The homepage links the MCP package on npm (@blazorblueprint/mcp), which is a tooling package and not the library. The install page says the project ships pre-built CSS that includes all component styles, and that blazorblueprint.css is a fully compiled Tailwind CSS file, linked from App.razor or index.html. The README says the library is inspired by shadcn/ui. The install page lists dotnet new BlazorBlueprint.Templates as the fastest way to start. The forum is the GitHub Discussions link on the homepage footer.
