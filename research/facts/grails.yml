notes: >
  The homepage is https and answers 200. The repository's default branch is 8.0.x; the highest stable GitHub release is v8.0.0 (2026-10-04), so currentMajor is 8, and the 7.x lines are maintained releases the homepage lists under older versions. The first-release year is a judgement for the reviewer: the oldest GitHub release is v1.1.1 (2015-01-16), but the tag v0.1 exists and its commit is dated 2006-03-29; the homepage says versions before 7.0.0-M4 were not ASF releases, and no page in the sources gives a 1.0 release date, so 2006 is the earliest dated release. The download page lists versions back to Grails 0.1, and the GitHub release v0.1 carries grails-0.1.zip, whose archive entries are dated 2006-03-29. GitHub shows 2018-07-02 as the publication date of the v0.1 release, which is when the old releases were imported, not when 0.1 shipped. Maven Central's first upload of org.apache.grails:grails-core is 7.0.0-M4 (2025); that is newer than the GitHub tags, so it does not decide firstRelease. The project's support and commercial options are named in the README; those are not recorded as a paidEdition because the README says the Apache project does not endorse any of the listed products. The README names Grails Forge and start.grails.org as the preferred way to create an application; the generator is a tool for creating applications and is not recorded as a hosted offering. The 8.0.0 guide states a Java 21 minimum baseline for Grails 8, which is runtimeMin. The homepage's Spring Boot statement is recorded as basedOn; the parent is not a company, so parent is left out. The GORM statement covers the NoSQL implementations named on the homepage; the homepage also names Hibernate for SQL, which is left out of databases because it is an ORM implementation rather than a database; the guide names MySQL, PostgreSQL and SQL Server through the driver and default config its dependency table adds, besides the H2 default data source. The footer reads 2005-2026; no page states a 1.0 release date, and GitHub shows 2018-07-02 for v1.0 for the same import reason. Contributors are counted across all pages with per_page=1.
