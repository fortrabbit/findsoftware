notes: >
  The license is stated two ways: LICENSE.md is GPL version 3 and composer.json states GPL-3.0-or-later. GitHub reports NOASSERTION because the license file is not named LICENSE, so the api figure is not recorded as a license fact. The requirements page at https://docs.opencart.com/getting-started/system-requirements states PHP 8.0 or later, while composer.json at tag 4.1.0.4 requires >=8.1.0 and the README badge says >= 8.0; runtimeMin records the composer.json at the latest release. The maintainer is "OpenCart", the name the homepage copyright line states; no page gives a legal name or legal form. The company page at https://www.opencart.com/index.php?route=cms/company says OpenCart was registered as a business in Hong Kong in 2012; that is a registration, not a headquarters, so hqCountry is not recorded. The install docs and INSTALL.md name no Composer package, so no Packagist figures are recorded, although a Packagist package named opencart/opencart exists with 33 versions. OpenCart Cloud and dedicated hosting are offered by the company as hosted services; they are not recorded as editions. The forum URL returned HTTP 403 to curl, so the forum fact is a link from the homepage with no quote. firstRelease is the year the company timeline gives for OpenCart v0.3 on sourceforge.net; the repository was created in 2011.
