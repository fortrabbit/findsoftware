notes: >
  The homepage daptin.github.io describes Daptin as an open-source, self-hosted product with SQLite, MySQL and PostgreSQL; the README gives the install paths. The GitHub release list holds 86 stable releases and no prereleases; the oldest, v0.1.20, is dated 2017-07-02, and the highest, v0.13.44, is dated 2026-10-13. The current release line is 0.x, so currentMajor is 0 under the rule for zero-major versions. The README names the project's Go client and JavaScript client repositories; they are not recorded. The README's feature table lists a JSON:API surface as the resource API and GraphQL as optional, and the record keeps both as stated. The maintainer is the name in the homepage footer, "Daptin contributors"; no page read gives a legal entity. The README calls Daptin an application server, which is not a category value, so the category is backend (the homepage calls it a connected backend); the pages read do not call it a headless CMS, although the GitHub topics do, so a reviewer decides whether headless-cms applies. The JSON:API surface is recorded as rest. There is no npm or other registry package for the server in the sources read; the Go module has no download figure and none is recorded. The Docker Hub image is not recorded as a registry figure.
