notes: >
  The repository is django-guardian/django-guardian. The docs path /en/stable/installation.html returns 404; the install page is /en/stable/installation/ and says "This application requires Django 3.2 or higher", while the homepage says "django-guardian supports Python 3.9+ and Django 4.2+"; both are older than the 3.5.2 manifest, which requires Python 3.10 (runtimeMin); the reviewer should confirm. The LICENSE file holds the BSD-2-Clause text for the code and a separate CC-BY-4.0 statement for the Font Awesome SVG icons under guardian/static/guardian/img, recorded as its own license entry. GitHub reports the license as NOASSERTION. The first PyPI upload is dated 2010-06-05 and the repository was created 2010-06-04, so firstRelease is 2010. The maintainer is the copyright holder named in LICENSE, "The django-guardian Contributors", which is a community rather than a legal entity; the pyproject lists individual authors. The install page says that by default Guardian uses generic foreign keys to relate to any Django model, "which has implications on performance", and points new projects to the performance and configuration docs. The docs list django-authority, django-permissions (archived) and django-rules as other third-party projects; none has a candidate row, so alternativeTo is left out. The docs' Django Unfold integration (a contrib module) is an admin integration and is not recorded as adminUi. The 3.5.2 release is the newest stable release.
  The README describes the installation as adding "guardian" to INSTALLED_APPS and "guardian.backends.ObjectPermissionBackend" to AUTHENTICATION_BACKENDS next to Django's ModelBackend, then running the migrate command to create the guardian tables. Its usage example assigns a permission on one object with assign_perm and checks it with has_perm, and shows that the same user has no global permission. The README says Guardian is "an implementation of _per-object permissions_ on top of Django's authorization backend".
