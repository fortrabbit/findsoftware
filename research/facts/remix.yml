notes: >
  The CSV row gives the category react and the npm figure 327k per week for @remix-run/react; neither matches the record. The repository and the npm package remix are Remix 3 (remix@3.0.0, released 2026-10-01). The Remix 3 blog post says "Remix 3 is a reimagining of what a web framework can be" and that the project is "building our own component model"; it also says the component runtime starts "with a fork of Preact". Remix 3 is a set of single-purpose packages built on Web APIs, distributed as the single remix package (README: "Remix will be distributed as a single `remix` package"), with its own component runtime; the README and homepage name no React dependency, so basedOn is not recorded; the reviewer decides whether the Preact fork is a basedOn fact for the component runtime. The blog states that Remix v1 and v2 moved "from Remix directly into React Router v7", which is a named successor for the older line, not an end of the Remix 3 project; the record stays accepted. The npm package named by the install docs is remix itself (the CLI is in it), so no core-package substitution applies. The npm name remix has a version 0.0.1 published in 2014, before the repository was created in 2020, so firstRelease is not recorded. The production chapter says "This chapter is unfinished", which is why runsAs has one value only. The docs root at remix.run/docs redirects to guides.remix.run. The Node engines field is >=24.3.0 in the 3.0.0 package. The README opens "This is the source repository for Remix 3. It is under active development." The LICENSE copyright line names Shopify Inc., which the footer of remix.run repeats as the maintainer; no page states an ownership relation, so parent is not recorded. Field kinds coined here: none.
