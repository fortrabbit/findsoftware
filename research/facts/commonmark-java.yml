notes: >
  The repository is a monorepo: its releases are tagged commonmark-parent-<version>, and the core artifact org.commonmark:commonmark shares that version (0.32.0), so the latest release is the parent tag. The GitHub release history begins with commonmark-parent-0.1.0 on 2015-08-21, which gives firstRelease. The project is a 0.x line; the README says the API "is not considered stable yet and may break between minor releases", and currentMajor is recorded as 0 from the 0.32.0 tag. The README says the project "started out as a port of commonmark.js" (commonmark-js is a candidate in this wave, a port is not a stated basedOn and is not recorded as forkOf). The README gives the module names for Java 9 and the extension artifacts (tables, strikethrough, autolink, front matter, image attributes, task list items). It says the library "works on Android too, but that is on a best-effort basis", and the Android minimum API level is 24. The README's "Used by" list names Quarkus Roq, Lucee, Atlassian and the OpenJDK module, and the repository is credited to Atlassian as the initial developer; those are not recorded. The repository has no homepage on GitHub; commonmark.org is the CommonMark specification site and is not the library's own site. The GitHub API lists the license as BSD-2-Clause and the LICENSE file names Robin Stocker as copyright holder. The Maven Central search reports no download figure, so none is recorded. The spec compliance (CommonMark) and HTML or Markdown output formats are kept in notes, not fields.
