notes: >
  The homepage and docs say formats come from predefined options for international numbers and currencies, with custom options for other formats. Default branch is next; the docs say master holds the stable line (4.6.* on the docs page, the latest release v4.10.10 on 2026-04-16 is the highest stable tag). The first tag is 1.8.2 with a commit dated 2013-02-09; the repository was created 2013-01-14. The LICENSE copyright line names Robert J. Knothe, which the maintainer field follows; the docs site footer reads "Copyright 2016–2026 © Alexandre Bonneau", a different name that a reviewer may want to settle. The homepage shows "No dependencies are needed to use AutoNumeric" and "Web Workers compatible"; the docs call the mobile Android Chrome browser partially supported. The how-to-use page shows the script loaded in an HTML page, from a local file or a CDN, and also as an ES module import. Support goes through a Gitter chat room and IRC, which are chat and no forum field. The "Donate" page and the README's support request are donations, not a paid edition. The README links a Gitter chat room, which has no field here. The docs say the library works on input elements and most text elements with the contenteditable attribute.
