notes: >
  Monorepo: the install docs name @zag-js/tooltip and the adapter @zag-js/react; the README badge names @zag-js/core, which holds the downloads and dependent counts recorded here. The homepage is https://zagjs.com/: the CSV lists plain http, which answers with a 308 redirect to https. Highest stable GitHub release is @zag-js/core 1.47.0 (2026-10-26), matching npm latest; the 2.0.0-next.3 prerelease (2026-09-14) is older than the stable release, so no latestPrereleaseDate. The GitHub releases list is capped at 10,000 results by the API, so the oldest GitHub release could not be read; firstRelease 2022 comes from the oldest @zag-js/core npm version (0.0.0-dev-20220406), which is a dev build; a reviewer may decide whether the first stable is the intended firstRelease. The repository was created 2021-07-07 and the LICENSE copyright line reads "Copyright (c) 2021 Chakra UI", a second wording of the MIT license, while the README reads "MIT © Chakra Systems Inc.", the legal name used as maintainer; the footer reads "A project by Chakra Systems" with no legal form or country. The author of the core package is Segun Adebayo, and the chakra-ui.com footer names "Sage and contributors" as maintainers. No basedOn is recorded: the README says Zag grew out of building Chakra UI and draws inspiration from other libraries, which is an origin, not a parent; the adapters for React, Vue, Solid and Svelte are targets, not parents. The docs say "At the moment, Zag is available for React, Vue 3, Svelte and Solid.js", which is compatibility in notes. The Discord and X links are on the homepage.
