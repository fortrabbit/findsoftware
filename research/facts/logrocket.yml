notes: >
  Hosted-service record for the LogRocket service at logrocket.com. The SDK repository (github.com/LogRocket/logrocket) and the npm package logrocket belong to the client SDK; per the hosted-service rule their license, stars and download figures are not recorded. The pricing page names the plans Core, Pro and Enterprise, and the docs call the Pro plan the Professional plan; the RBAC docs and the pricing page both place roles on that plan. The pricing page lists 500 free API / MCP credits per month on the Pro plan (not a field). It lists self-hosted deployments under Enterprise with a talk-to-sales link and no install guide. The pricing page offers a 14-day trial with no free plan stated, so freeTier is unknown. The pricing page lists SOC 2, PCI, GLBA, HIPAA, HITRUST, FedRAMP and StateRAMP against industries; compliance is not recorded as a field. The HQ address is Boston, MA; a New York office is listed on the contact page and is not recorded. The pricing page contains a paragraph addressed to AI agents; it gives no fact and was not followed. The status page is status.logrocket.com. LinkedIn (linkedin.com/company/logrocket) is not a field.
