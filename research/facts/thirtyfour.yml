notes: >
  The README says the license details are in a NOTICE file; the repository root has no NOTICE, LICENSE or LICENSE-MIT file, so the dual license comes from the workspace Cargo.toml and the README sentence "This work is dual-licensed under MIT or Apache 2.0." (GitHub reports NOASSERTION for the same reason). The workspace Cargo.toml at v0.38.3 names two authors, Steve Pryde and Vrtgs; the first is recorded as maintainer, the second is not recorded. The repository's GitHub owner is a user account. The book's "Translating Selenium And Playwright" guide covers porting existing Selenium or Playwright tests to thirtyfour; it names neither as a replacement of thirtyfour, and it is not an import tool, so no alternativeTo or importsFrom is recorded. The docs.rs page is the API reference; the book at the homepage is the project's documentation, and its llms.txt is not a source for any field. The install needs a browser on the developer's machine and a matching driver that the crate downloads at first use; that is a local statement, not a runtime. The crates.io download figure is the all-time total; the last 90 days are 705510 and are not recorded. Stars and contributors are from the repository's default branch main. The crate's first upload (0.1.0) is 2019-11-30 and matches the repository's creation date.
  The README's example is an async Rust program using tokio, and the quickstart's test uses run_browser_test with a tokio test attribute; the book names WebDriver Manager, Selenium Grid and Chrome DevTools Protocol and WebDriver BiDi as features behind feature flags (cdp-events, bidi).
