notes: >
  The repository has no GitHub release and no tag; the npm package is the only release record, so firstRelease is the oldest npm version (1.1.0-beta.16, 2024-12-10) and latestReleaseDate is the npm latest, 1.1.3 (2025-04-27). lastCommitDate is the committer date of the newest commit on main, and it is recorded because the candidate notes ask for it; the registry release already decides listing. No prerelease is newer than the stable release. The npm package names formsmd as its registry id; the npm weekly figure counts the install route npm install formsmd, while the browser download route is not counted by npm. The pricing page sells a Pro licence that removes the Forms.md branding from forms; its feature table lists "All features available" for both the free and the Pro tiers, so no paidEdition fact is recorded. Reviewer decision: whether the branding removal is a paid edition. The homepage says "Trusted by over 7,000 registered users"; that counts accounts, not installs, so no reportedInstalls. The project's own text names a Google Sheets integration through Apps Script, a WordPress plugin at wp.forms.md (a separate product page, not recorded here), reCAPTCHA as a built-in spam protection, and a Markdown-like text syntax for form definitions; these are integrations and kinds outside the list, so they are notes only. The docs say the library has no backend for storing submissions: the developer provides the endpoint at postUrl, so no database is recorded. The project describes itself as a Typeform alternative in its README title; Typeform is not a record, so no alternativeTo. The homepage links the GitHub repository and the Pro checkout, and the account signup is for buying the licence, not for a hosted form service, so status is not hosted-service. The README states the project was formerly Blocks.md. The docs page for React says the library is plain JavaScript that needs a form template string and a container element, and shows it mounted in a React component; the README also names a right-to-left stylesheet. The repository status was boundary in the candidate row (no tagged releases); the npm release record and a newest commit in 2025 settle it as accepted.
