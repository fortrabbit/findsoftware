notes: >
  The go-app.dev pages render their Markdown in the browser, so the page text fetched without a browser holds only the navigation; the Markdown the site renders is read from the go-app-docs repository, which is the source the site's own build reads, and the claims from it cite that raw file. The docs say "requires a fully functional Go environment installed with Go 1.18 or greater" and the README says Go 1.26 or newer; runtimeMin takes the go.mod line at the latest release tag, which is go 1.26.0. The site has no pricing page or paid edition; the sponsorship link on the repository is a donation page and is not recorded. The Go module has no download figure, so none is recorded. The first GitHub release is 2.6.0 from 2018-07-13; the repository was created in 2016, and the earlier history is not a release. The docs site footer names a privacy policy page, which was not read because it holds no field. The major is from the highest stable release v11.1.3. The first tag, 1.0.0, is dated 2018-02-03 and the first GitHub release is 2.6.0 in 2018, so 2018 stands. The docs pages for getting started, install, SEO, static resources and architecture name no database, language-translation feature, Docker image or forum. The docs' Go 1.18 prerequisite is older than the manifest line and is not recorded.
