notes: >
  The homepage franklinjl.org answers over https and is the project's own site. Maintainer is recorded from the homepage footer, "© Thibaut Lienart"; the footer names no legal form. The highest stable GitHub release is v0.10.97 (2025-10-14); the release list holds no prerelease, and the release line is major 0. The oldest GitHub release is v0.1.0 (2019-04-28), while the repository was created in 2018. The deploy page says the contents of the __site folder can be deployed to any existing server, and the GitHub and GitLab sections describe the deployment steps. Julia ≥ 1.3 is the install minimum on the homepage, recorded as runtimeMin. The optional extras need python3 and node.js for minification and pre-rendering, and the homepage says these can be ignored. The Julia General registry is not in the registry list, so no package download figure is recorded. The deploy and troubleshooting pages send questions to a Slack channel named #franklin, which is not a link, so no forum is recorded.
