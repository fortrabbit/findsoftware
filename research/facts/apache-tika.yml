notes: >
  Accepted: a Java toolkit that embeds in an application or runs as a server, and the project's own docs state both, so criterion 1 holds through the tika-server and Java API routes. The GitHub repository has no GitHub releases; the highest stable tag is 4.2.0, a stable tag with no prerelease in its name, and the 4.0.0-beta-1-rc1 and 4.0.0-alpha-1 tags are prereleases. The homepage news dates the 4.2.0 release 28 October 2026, and the tag's commit is dated 2026-10-25 (api), so latestReleaseDate follows the homepage. The Maven Central metadata gives tika-core as the latest version 4.2.0; its earliest upload in the search index is 0.4, dated 2009-07-27, which is older than the earliest tag 0.1-incubating (commit 2010-05-12), so firstRelease is 2009. The homepage says Tika "was formerly a subproject of Apache Lucene"; that is a history statement, so it is in notes only and no parent or forkOf is recorded. The homepage links an AI agent skills directory on GitHub; it is not an installation route for the library and was not recorded. The Docker Hub count is for the image the docs name, apache/tika (the docker image name is not a field). The homepage description gives the file-type count (over a thousand file types), and the mailing lists are on the mail-lists page; neither has a field.
  The Java API getting-started page states that for most use cases Tika should run as a separate service rather than be embedded, because a parser crash then cannot affect the application, and that PipesForkParser parses in a separate JVM when embedding. These statements are not recorded as fields.
