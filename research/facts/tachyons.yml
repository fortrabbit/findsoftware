notes: >
  Doubt: the latest GitHub release v0.2.1 (2026-07-20) points to a merge commit of the dev branch, which is not on the default branch main (last commit 2026-01-08, by the maintainer). That release is published by mrkhdly, not by the maintainers, and its notes link a fork (mrkhdly/tackeons) and an "AI disclaimer", so it is not recorded as the project's release. currentMajor 4 and latestReleaseDate come from the registry, where 4.12.0 (2020-04-26) is the latest tag and its major is higher than the release's; the import moves the record on release age. Settled by the project's owners saying whether the v0.2.1 release is theirs. firstRelease is the first npm upload (2015-03-07), older than the oldest GitHub release. The docs at tachyons.io/docs answer only as plain http (301 to http://tachyons.io/docs/), so no docs link is recorded. The homepage shows v4.12.0 and the registry carries 4.12.0 as latest, so the project's own pages still show the software. The homepage links a Slack invitation and Open Collective over plain http, so neither is recorded. The README links a "Tachyons Pro" quiz, a community resource that is not a paid edition. The maintainers named on the LICENSE are individuals; the repository's default branch is main. The x link is the project's Twitter account from the homepage, shown as an icon with no text; no quote is recorded. The llms.txt describes single-purpose utility classes composed directly in HTML, and the README calls the framework mobile-first. The contributors count reads the rel=last page of the contributors endpoint. The README says the stylesheet is shipped minified, which the CDN line on the homepage uses.
