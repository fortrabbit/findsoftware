notes: >
  The product page https://acoustic.com/products/content/ now answers 308 to the company home page, so the product is described from its developer documentation at developer.goacoustic.com. The company home page is a marketing site for other Acoustic products and does not name Content as a product page. The privacy notice gives offices at 1125 Oak Street in Conway, AR, but does not name a headquarters, so hqCountry is unknown. No EU hosting statement was found in the docs, so regions stays out. The Sites feature runs an Angular site application hosted on the Content CDN per the developing-your-own-website page; no renderingModes or runsAs are recorded because the docs do not give those values for the product itself. The GitHub organization acoustic-content-samples holds sample applications and tools (wchtools-cli, wchconvert-cli, wch-openapi-documentation), not the product source, so no repository is recorded; the CLI repositories carry their own licenses, which are not the product's license.
