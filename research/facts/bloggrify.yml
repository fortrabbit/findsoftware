notes: >
  basedOn holds Nuxt (README: "Bloggrify is a Nuxt layer that turns Markdown files into a blog.", installation page: "First, you need to create a new Nuxt application.") and Nuxt Content (README: "Built on the excellent Nuxt Content framework"; comparison page: "Bloggrify is an open-source Nuxt Content starter specialized for blogging."). The README lists pre-configured analytics, newsletter and comment integrations, "Nuxt SEO modules pre-configured (sitemap, robots, schema.org)" and an "Auto-generated RSS feed"; none has a field here. The README lists a free theme and two themes marked "paid" (Bento, Epoxia) and gives no prices; they are not recorded as a paidEdition. The deployment page gives npm run generate to produce the static files and one-click deployments to Netlify and Vercel. The npm package @bloggrify/core is the one the installation page tells users to install; no npm package named bloggrify exists. The npm weekly figure is 5 downloads. No page states the runtime, so runtime is unknown. The LICENSE copyright line names Hugo Lassiège, and the npm maintainer is hlassiege.
