notes: >
  No homepage: GitHub lists none and the CSV row is empty; the repository is the only project address, so homepage is not recorded. The README is the documentation; no separate docs site was found. Registries: the install docs name Swift Package Manager, CocoaPods ('Swifter', pod version 1.5.0 in the README) and Carthage; each install route is its own installMethod entry; no download figure is recorded for CocoaPods or SPM. Release history: the highest stable GitHub release is 1.5.0 (2020-09-26), with 1.5.0-rc.1 (2020-09-17) recorded only as prerelease history and therefore no latestPrereleaseDate, since it is older than the stable release. The CHANGELOG starts at 1.4.6, so firstRelease comes from the oldest tag, 1.0.2 (tag object dated 2015-10-06); reviewer may decide the tag is a version-numbered release and keep 2015. runtimeMin is not recorded: the only Swift minimum is the swift-tools-version line in Package.swift (5.0), a manifest comment and no page statement, and the README names Swift versions only in a badge image. The category is web-server only: the README calls the master branch an "experimental web-framework layer" (the default branch is stable), and the 2.0 branch (async IO) is experimental. The README lists platforms (Linux, macOS, tvOS) in a badge only, and WebSockets appear in code examples; no field carries either. The LICENSE copyright line names Damian Kołakowski, and the podspec names the same author. The owner is the httpswift organization; the maintainer as the project states it is the individual named in LICENSE.
