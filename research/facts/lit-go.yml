notes: >
  The only web page is the pkg.go.dev documentation, which is a registry, not the project's own site, so no homepage is recorded. No page states how the server is run, so runsAs is left out. The README names httprouter as the router it uses; that is a dependency, not a parent, so no basedOn is recorded. Go modules have no download figure. The latest release is v0.2.1 (2024-02-27), the first stable release is v0.1.0 (2024-01-01), so firstRelease is 2024; the v0.0.1-alpha prerelease (2023-05-06) is not used; currentMajor is 0 because the project is pre-1.0. Go 1.21 is the go directive at the v0.2.1 tag. The repository has one contributor on the first page, which is the whole contributor list.
