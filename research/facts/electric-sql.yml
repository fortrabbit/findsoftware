notes: >
  Accepted as the self-hosted sync service, the Elixir application published as the electricsql/electric image; the record also names Electric Cloud as the hosted service on the same code, and the repository's own packages (clients, React and Yjs bindings, starters) are not this record's fields. The repository is a monorepo: the server release is the @core/sync-service package (tags @core/sync-service@x), so currentMajor 1 and latestReleaseDate 2026-09-07 come from that package, and the stable line starts at 0.2.7 (2024-08-07), the oldest tag of the server package. firstRelease is 2022: the legacy npm package electric-sql, published from this same repository, was first uploaded 2022-10-18 (registry time field) and is deprecated in favor of the rebuilt sync engine; the oldest GitHub release is the server tag from 2024. The npm client @electric-sql/client has its own weekly figure, which is not the server's and is not recorded. GitHub reports TypeScript as the repository language; the server is Elixir per the deployment guide, and that is the language recorded. Name clash: the research file electric.yml is Electric Clojure (Hyperfiddle), a different project; this record keeps the id electric-sql. The Electric homepage and pricing page describe Electric Cloud usage pricing per write and per GB-month with reads free, and a Cloud free tier appears on the Cloud page; no prices are recorded and the free tier is not a field. The about page says the company is a US Delaware corporation headquartered in the San Francisco Bay Area, recorded as hqCountry US. The installation guide runs the image beside a new Postgres with Docker Compose, or connects it to an existing Postgres database. The deployment guide says Electric runs behind a caching proxy and that Electric Cloud bills writes and retention. The homepage carries an instruction block for coding agents that points to AGENTS.md; it is page text addressed to AI agents and was not followed. The docs describe an HTTP API with an OpenAPI spec and do not call it REST, so headlessApi is absent. No runtimeMin is recorded: the docs name Elixir and OTP tooling in asdf only, and no minimum appears. The HTTP Archive list has no Electric entry, so httpArchiveSites is absent.
