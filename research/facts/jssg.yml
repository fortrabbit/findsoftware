notes: >
  The repository has no GitHub release, no tag and no LICENSE file, and GitHub reports no license, so license and firstRelease are unknown. The default branch's newest commit is dated 2014-06-12, so lastCommitDate is recorded and the import judges listing by it. The README calls the project a simple static site generator like Jekyll; that comparison is not recorded as basedOn or alternativeTo. No homepage is recorded because GitHub reports none. The maintainer is the developer pom.xml names. pom.xml gives the project url http://www.grison.me/jssg/, which now answers 404, so no homepage is recorded. The README says code highlighting uses Pygments, which has to be in the PATH or have its path set in config.properties. The README's build names jssg -build -serve, and -serve starts a Jetty server for local preview.
