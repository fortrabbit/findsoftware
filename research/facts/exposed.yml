notes: >
  Scope: an ORM framework for Kotlin, a library whose modules are added to a Gradle or Maven project (criterion 2 by Maven Central distribution, criterion 3 by the modules guide). The homepage text says "Developed and maintained by JetBrains." and the LICENSE file carries no copyright line, so the maintainer is JetBrains as the project names it. The legal entity and country were not readable: the JetBrains legal pages at jetbrains.com/legal/ are JavaScript shells with no text, and the company page has no legal name, so no legal form and no hqCountry are recorded; a reviewer may want the legal notice to settle the name. The homepage sentence "Popular databases: PostgreSQL, MySQL, SQLite, Oracle, H2, and others." names four supported databases in the vocabulary, and the README's Supported Databases list adds MariaDB and Microsoft SQL Server; the README badge alt text carries the names. H2 and Amazon Redshift have no field value, so they are only in these notes. The README states two transport modules, JDBC (exposed-jdbc) and R2DBC (exposed-r2dbc), and that the R2DBC modules need JDK 11 and the Spring modules need JDK 17; the runtimeMin is the JDK 8 minimum stated for all other modules, so it reads the core minimum. The license is Apache-2.0 from the LICENSE file; the README gives the same license for contributions. firstRelease is the year of tag 0.1 (commit dated 2016-01-25), the oldest tag of any kind; the Maven Central history of exposed-core begins at 0.30.1 in 2021, and the GitHub repository dates from 2013, so neither is used. The GitHub release list starts at 1.0.0-rc-4 (2025-11-27) and the current stable line is 1.x, so currentMajor is 1. The Maven Central latest version agrees with the GitHub release 1.6.1. The modules guide says the Maven Central repository is enabled by default for Maven users. The README links a Slack channel (#exposed on the Kotlin Slack) and a YouTrack tracker, which have no vocabulary field here and are not recorded.  The modules guide says an application requires exposed-core and exactly one transport module, exposed-jdbc or exposed-r2dbc, and that the database access modules are optional and build on exposed-core. The README says the DAO module works only with the JDBC transport, that the R2DBC DAO module (exposed-dao-r2dbc) is an experimental preview whose API may change between releases, and that the R2DBC modules need JDK 11 while the Spring modules need JDK 17.
