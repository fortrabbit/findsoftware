notes: >
  The PyPI homepage field is https://ponyorm.com, which answers with a redirect to https://ponyorm.org/; the final site is recorded as homepage, with its URL as the cited page. The docs first-steps page says Pony can be installed on Python 2.7 or Python 3, which conflicts with the latest PyPI requirement of Python 3.10 or later; the registry statement is the recorded runtimeMin and the docs sentence is an older statement. The docs introduction contrasts Pony with Django and SQLAlchemy and lists what Pony provides in comparison to Django, recorded as alternativeTo. The docs site names the same project, and its source is the pony-doc repository, which is not recorded as a field. The latest stable release is v0.7.20 (GitHub release and PyPI upload both 2026-08-09), so the major is 0 and the minor line 0.7 is not a field. The first PyPI upload is 0.1 of 2012-12-01, earlier than the repository creation date of 2013-02-08, so firstRelease is 2012. The runtimeMin 3.10 comes from the requires_python of the latest PyPI release (>=3.10); the docs firststeps page still says Python 2.7 or Python 3, which is an older statement and not recorded. The README lists SQLite, MySQL, PostgreSQL and Oracle, the docs database page adds CockroachDB, and the homepage SQL translation samples also show Microsoft SQL Server; the docs page is the recorded list and SQL Server is not recorded as a database. The README states the Apache 2.0 license and the docs say the license applies from version 0.7 on; the LICENSE file is the Apache text. The Entity-Relationship editor at editor.ponyorm.com is a separate online tool and no hosted offering of the ORM. The community Telegram group and Stack Overflow tag are general community channels, not the project's own forum fields. The pypiDownloads figure is the pypistats last_week count read on 2026-11-16.
