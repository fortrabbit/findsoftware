notes: >
  Doubt: Airflow is a batch pipeline orchestrator that people log into and operate; its REST API (JWT-authenticated, with documented CORS settings) triggers and manages DAG runs and is no documented wiring into a website or web app, so the status stays stub (criterion 1). A page showing a site or app calling Airflow as a component would settle it. The homepage links a YouTube channel and the Slack workspace apache-airflow.slack.com, which have no field. The registry package apache-airflow on PyPI is the install route the docs name (pip, latest version 3.3.2, requires-python ">=3.10,!=3.15"). Release figures come from the core tags only: the repository is a monorepo whose provider packages have their own tags (providers-...), and the highest stable core tag is 3.3.2 (published 2026-09-17). The oldest core tag found is 0.2.1, whose commit is dated 2015-01-22; the first PyPI upload is 1.8.1 (2017-05-09), so firstRelease takes the tag date. The contributor count is the rel="last" page number of the contributors endpoint with per_page=1 (411). The docs' Helm chart and Docker image pages are named in the installation page; the chart and image repositories were not read. The start page's standalone command starts all components locally; the core-concepts page says the API server serves the REST API and the UI, which is the runsAs always-on statement. The apache.org sites give no hq country and the foundation's address was not read. pypistats.org answered 429 to the recent-downloads request; the figure is not retried and not recorded.
  The public REST API, per its security page, requires a JWT token in the Authorization header, obtained from the auth manager's token endpoint. The docs describe the standalone command as a way to try Airflow without all production complexity. These statements are not recorded as fields.
