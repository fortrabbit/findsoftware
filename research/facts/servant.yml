notes: >
  The CSV homepage http://docs.servant.dev/ is the cabal Homepage over plain http; the https site www.servant.dev answers 200 and is recorded as the homepage. The GitHub repository has no release objects; its highest stable tag is v0.20.2, and Hackage's newest stable version is 0.20.3.0 (uploaded 2025-06-04), so latestReleaseDate takes the Hackage upload, and currentMajor is 0 (both are 0.x). The CSV lastRelease 2026-08-21 is a Hackage metadata revision (Revision 7 by janus), not a release, and is not used. The cabal file on master says version 0.20.4.0, unreleased, and is not recorded. The LICENSE copyright line credits Zalora South East Asia Pte Ltd for 2014-2016, while the cabal author and Hackage author is "Servant Contributors", recorded as the maintainer; the cabal maintainer is a mailing-list address, not recorded. The GitHub API license field is null because the LICENSE sits in the servant/ subdirectory; the cabal file and that LICENSE both state BSD-3-Clause. The servant package is the core library; serving uses servant-server, which the tutorial names as the package that runs webservers, and the install page builds the tutorial with cabal or stack. The README names IRC (#haskell-servant on libera.chat) and a mailing list for help, recorded in prose only as no field holds them. The tutorial's Ubuntu note concerns the toolchain only. Coined: none.
