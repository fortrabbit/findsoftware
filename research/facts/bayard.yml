notes: >
  No project homepage: the GitHub homepage field is empty, the Cargo.toml homepage points at the repository, and the GitHub Pages address the Cargo.toml documentation field names answers 404. Repo-only record, so no homepage fact. The license is MIT in the GitHub API, the LICENSE file and Cargo.toml; all three agree, so one statement is recorded. The highest stable GitHub release is v0.9.0 (2022-08-03); the last push to the default branch is 2023-03-06, and the repository is not archived. The Cargo.toml version (0.9.0) matches that release. The crate named bayard exists on crates.io, but the install docs name only cargo build from source, so no crate figure is recorded. The Dockerfile builds from rust:1.62.1 but no image is published by the project, so no docker field. The build needs protoc (protobuf-compiler), stated in docs/build.md. The README calls the server "Multilingual support" among its features; the analyzers page lists lindera (Chinese, Japanese, Korean) and stemmers for 18 languages, but no i18n field is recorded because that field describes localization of a CMS. The README says the server is a "master node-less cluster" with gossip-based membership discovery over the SWIM protocol and index sharding and replication; these are features, not fields. Tantivy is a dependency in bayard/Cargo.toml, but no page names it as the base, so basedOn is absent. The data directory holds index files on disk (docs/getting_started.md shows a directory tree); the page does not name a storage kind, so contentStore is absent. Release age: the latest release is more than four years before the check date, so the import will move this record to stub on its own; status is left at accepted per AGENTS.md.
