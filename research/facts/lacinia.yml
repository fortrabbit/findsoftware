notes: >
  Accepted: a GraphQL engine for Clojure that a site's own HTTP handler calls, which meets criterion 1 under the API-an-app-calls rule; the README says it can be plugged into any Clojure HTTP pipeline. The repository has no GitHub release objects, only tags; the highest stable tag is 1.3.0, whose commit is dated 2026-06-02 and is titled as the prep for that release, and Clojars lists 1.3.0 as its latest release, so currentMajor and latestReleaseDate follow the tag and the Clojars registry. The oldest tag v0.13.0 is dated 2017-03-15, the day the repository was created. The license is Apache-2.0 as the README states it and the LICENSE file says; the GitHub API reports the license as NOASSERTION, so the README and LICENSE are the sources, and Clojars lists the same Apache License, Version 2.0. The maintainer is the copyright holder in the LICENSE, WalmartLabs; no terms or imprint page was read for a legal name, so none is recorded. The language is Clojure; the docs say Lacinia targets Clojure 1.9 and the deps file at 1.3.0 pins Clojure 1.12.5, which is a language version, not a runtime. Runtime jvm follows from the language, cited at the docs sentence naming Clojure; no page states a minimum JVM or Clojure runtime requirement beyond the language version, so runtimeMin stays unknown. The README states the library needs a preparation step, clojure -X:deps prep, because it ships precompiled ANTLR parsers; that is a build step, not a route. The tutorial's Creating the Project page adds the Lacinia dependency to deps.edn, which is the installMethod. The README says a schema alone does not identify where data comes from, which is the job of a field resolver that might query a database or send a request to another web service, and shows a compiled schema executed inside a Ring handler function, and says the companion lacinia-pedestal library supplies HTTP support for Pedestal. The docs say the library uses clojure.spec and that Clojure 1.8 needs the clojure-future-spec dependency added. The README says the library has been in production at Walmart since 2017 and moved to 1.0 on 9 October 2021; these are project statements, not fields. The README names lacinia-pedestal, an HTTP companion for Pedestal, and duct-lacinia, an external library for Duct; both are companions, not alternatives, and neither has a record id. The README states Lacinia is not an Object Relational Mapper, so databases are not recorded. The docs title shows a version number on the page, which is not recorded. Stars and contributors are for the repository.
