notes: >
  The Apache-2.0 license is stated on the product page as "The Versity S3 Gateway is an Apache 2.0 licensed open source project", the same license as the repository. The product page says the gateway supports generic POSIX file storage, ScoutFS and Azure Blob Storage, and the README names other S3 servers as backends: these are backends the gateway translates to, not databases the software keeps its state in, so databases is not recorded; the gateway is stateless per the README. The README and the product page name Versity's commercial products (ScoutAM, S3 Tape Archive Engine, Versity Storage Manager) and "enterprise support" through sales: these are separate products or paid support, not an edition of this software, so paidEdition is not recorded. The S3 RDMA service (vgwrdma) is named in the README as a VersityGW-based service; it is not a field here. The Standalone IAM service is started with the iam subcommand of the same binary, per the Quickstart page; its process model is not separately recorded. The homepage links an X account, a Bluesky profile, a YouTube channel and LinkedIn; the LinkedIn link (https://www.linkedin.com/company/versity/) is a coined kind and is only recorded here. The social links on the homepage are icons without text and are recorded without a quote; the README badges serve the same links. The Docker image named in the README is versity/versitygw:latest. The GitHub releases start with the prerelease v0.1 (2023-06-07); firstRelease takes the oldest release of any kind. Versity's terms-of-use URL answers 404 and is not read.
