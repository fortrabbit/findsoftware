notes: >
  The cart is a JavaScript script in the visitor's browser, and the order dashboard is hosted on the company's servers; runsAs browser is the cart, not a rendering choice. The features page says the cart is a JS-powered shopping cart, and the docs say the dashboard is hosted on Snipcart's servers. The about page gives Quebec City as the team's location and the footer says Built in Canada; hqCountry CA is recorded from the about page. The GitHub organization snipcart is linked from the homepage, and its repositories hold client and sample code, so no repository is recorded for a hosted service. Multi-currency and a discount feature are listed on the features page and are not recorded as fields.
