notes: >
  The project page on ionide.io is the Ionide organization's documentation site, which documents Fornax; the GitHub repository has no homepage set. The README says Fornax is part of the Ionide tooling suite; the maintainer is recorded as the LICENSE.md copyright line states it (2017). The highest stable GitHub release is v0.16.0 (2025-11-09), and the newer v0.16.0-beta006 is a prerelease published before it; the release line is major 0. The oldest GitHub release is 0.2.0 (2019-08-05). The NuGet package fornax is the one the install line names; nugetDownloads is the NuGet total. The README requires the .NET 8.0 SDK to build the project, which is a development requirement and not a runtime minimum, so runtimeMin is not recorded. The fornax watch command serves the generated site on a local server, which is recorded as local in runsAs.
