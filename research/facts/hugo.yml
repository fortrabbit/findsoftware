notes: >
  Hugo ships as a self-contained binary, so runtime is "go binary" and runtimeMin does not apply; the Go 1.27.0 minimum only matters when building from source and goes in buildRuntimeMin. Coined field editions lists the free build variants (standard, deploy, extended, extended/deploy); they are not paid editions. The pages credit "the Hugo Authors" and name no company; the logos are copyright Steve Francia, and the homepage links the personal X accounts @spf13 and @bepsays without stating roles, so x is left empty. maintainerType community rests on that credit. The theme gallery gives no total, so themeCount is absent. Hugo extends via modules and themes, not a plugin system, so pluginDirectory is absent. sponsorship lists the sponsors named in the README and on the homepage. docker and dockerPulls come from the GHCR package page of the official image, which shows 557K downloads; the installation pages read do not mention it. Not on endoflife.date (404). contributors is the GitHub API count including anonymous contributors.
