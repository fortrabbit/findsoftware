notes: >
  Monorepo: the npm package named by the install docs is @blueprintjs/core (core), so the core package is recorded; the repository publishes several packages (icons, table, select, datetime, and build tooling), and the per-package GitHub releases are the release signal. The GitHub release for @blueprintjs/core 6.21.0 (2026-09-30) is the highest stable release, so currentMajor is 6; npm's next tag (6.0.0-alpha.1) is a prerelease and is not used. The install docs are the getting-started page source in the docs app, read on GitHub, since blueprintjs.com/docs renders client-side. The homepage footer shows "© 2014–2018 Palantir Technologies", which is out of date, so the npm author field, Palantir Technologies, is recorded as maintainer. The palantir.com footer reads "© 2025 Palantir Technologies Inc. All rights reserved.", but it is served inside a script payload, so the legal form Inc. is not recorded as a checked quote. Palantir's headquarters is not stated on any page read, so hqCountry is not set. The core package's peer dependencies are react and react-dom, versions 18 and 19 (package.json at packages/core); a manifest is a source but not a runtime statement, so runtime is not set. The npm downloads figure is the sum for 2026-10-18 to 2026-10-24. The first npm upload is 0.1.0 on 2016-11-11, and the repository was created on 2016-10-25. The homepage has GitHub and careers links only, and the README links no social account. The HTTP Archive technology list has no Blueprint entry. The getting-started page says each package contains a CSS file and a collection of ES modules exposing React components, and that the icon font stylesheet comes from the icons package, imported next to the core stylesheet. The README lists icons, date and time, select, table and color packages in the repository.
