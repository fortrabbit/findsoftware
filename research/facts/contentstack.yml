notes: >
  Contentstack is a hosted service; criterion 2 is waived. The TypeScript SDK contentstack/contentstack-typescript (MIT, npm @contentstack/delivery-sdk, first published 2024, major 5) is a client of the service, not the service, so its license, stars, contributors, npm figures and release dates are not recorded as the product's. The older unscoped contentstack package is the previous JavaScript SDK. The legal page gives the company address as Austin, Texas, USA, so hqCountry is US; the GitHub organization location is San Francisco and is not used. The docs home page states that the platform provides REST APIs for anything done with content, and the Content Delivery API has a GraphQL variant; both are recorded. The regions entry lists the seven data-center regions the Regions page names, including EU hosting on AWS, Azure and GCP. Importing from WordPress and Sitecore comes from the content migration docs; the older WordPress XML converter repository is archived and no longer cited. SSO with SAML 2.0 comes from the administration docs, which do not say which plans include it. The pricing page lists custom roles per plan with numbers that are not recorded. The homepage also links to LinkedIn and YouTube.
