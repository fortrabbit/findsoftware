notes: >
  The GitHub repository is a pnpm monorepo (packages g6, g6-extension-react, g6-extension-3d, g6-ssr, cli and others); its stars and contributors belong to the monorepo, and the npm figure is the core package @antv/g6 that the install page names. The README says G6 is a graph visualization engine and supports React nodes through the React ecosystem; no framework is recorded as basedOn because the core does not say it is built on one. The g6-ssr package belongs to the monorepo and is not a recorded fact. The maintainer is the LICENSE copyright line, Alipay.inc; the site names AntV as its team and the footer names Ant Group Co., Ltd. as copyright holder, which is recorded as parent. The site footer gives no country or full address, so hqCountry is left out. No page states that the library runs in the browser in those words, so runsAs is left out for the reviewer. The newest stable release is the npm 5.1.1 upload of 2026-05-08, which is newer than the GitHub release object of 2026-04-17 and has no GitHub release page of its own. The 5.1.0-beta.1 prerelease (2026-01-28) predates it and is not recorded. The first release year comes from the npm 1.0.0 upload of 2017-04-11, the repository was created 2017-02-13. The npm weekly figure is the sum of daily downloads for 2026-10-26 to 2026-11-01. The repository owner is an organization.
