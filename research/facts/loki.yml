notes: >
  Monorepo: the root README points to packages/loki/README.md, and the npm package loki is packages/loki (repository.directory in its manifest at v0.35.1), so the package README is the source. The package README names Joel Arvidsson as Author and Tomas Echeverri Valencia as Maintainer; the maintainer fact follows the LICENSE copyright line, the second name is not recorded. The npm version 0.0.0 uploaded in 2013 predates the repository (created 2017-07-10) and is read as another project, so firstRelease uses the 0.1.0 upload of 2017-07-10; the oldest GitHub release is v0.17.0 (2019-06-04). Latest stable release v0.35.1 (2024-08-27) is inside the four-year window; the repository was pushed on the check date and has no archive flag. Node 16+ is stated on the getting-started page, but the v0.35.1 manifest has no engines field, so runtimeMin is left out until a manifest states it. The x link on the homepage is the author's personal account and is not recorded. The homepage lists BBC under "Users of Loki" with no count, so no reportedInstalls. The serverless renderer guide URL guessed as serverless-renderer.html returned 404; the other guide pages were read. The npm figure is the week 2026-09-28 to 2026-10-04. The README says "Loki will not start any servers for you". The getting-started page says the reference images "should be checked into your git repository" and lists the optional dependencies: GraphicsMagick for the gm diffing engine, Docker for the chrome.docker target and Chrome 59+ for the chrome.app target. The README lists Chrome in AWS Lambda among the supported platforms.
