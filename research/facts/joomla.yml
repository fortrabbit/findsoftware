notes: >
  Coined accessControl (built-in role or ACL system), webServers (supported servers with versions, split out of serverNeeds) and dockerPulls (Docker Hub pull count, an adoption figure). The homepage lists X, Bluesky and other social accounts but the read gave no URLs, so they are not recorded. Open Source Matters holds the trademarks "in the United States and other countries"; its country of incorporation was not stated. Joomla is not on Packagist as a CMS package. GitHub contributor count covers the joomla-cms repo only. The manual lists PHP 8.4 as recommended for 6.x.
