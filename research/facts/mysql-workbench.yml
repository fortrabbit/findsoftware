notes: >
  Status is discontinued: the repository description says "This repository contains the now EOL version of MySQL Workbench 8. For the new Workbench, see https://github.com/mysql/mysql-shell-plugins". The end statement outranks the dead homepage: the homepage the README links, mysqlworkbench.org, fails TLS with a certificate that does not match its host name, so no homepage is recorded. The successor is a separate project in the same organization, mysql-shell-plugins, which is not recorded as a field. The README names no end of life, and the repository still tags 8.0.47 (2026-04-02). The desktop client is in scope as a developer tool with runsAs local. The GitHub repository has no releases, only tags: currentMajor 8 is the 8.0 line of the highest stable tag, and latestReleaseDate is the commit date of that tag. firstRelease is the commit date of the oldest release tag (6.2.5, 2015-03-04). License: GPL-2.0 from the License.txt; the file adds permissions, recorded in no field. The README names its download page only as an http link that answered 403 to the research client, so install routes and runtime are not recorded. Fields coined here: none.
