notes: >
  Alembic is a Python package on PyPI under the name alembic; the front matter's Installation section installs it with pip into a virtual environment. The README calls it a database migrations tool written by the author of SQLAlchemy, describes migration scripts that upgrade a database and can downgrade it, and describes an autogenerate step that compares the database with the Python models, and the front page says it is developed by Mike Bayer and is part of the SQLAlchemy project. No basedOn is recorded because the project names SQLAlchemy as a required dependency and a tool used with it, not as the software it builds on. The LICENSE copyright line names Michael Bayer and is the maintainer value. The release 1.20.1 is the newest stable release; the pyproject at that tag sets requires-python to 3.10 or later. The first upload on PyPI is version 0.1.0 dated 2011-11-30, earlier than the GitHub tags. The contributors count excludes anonymous contributors. The PyPI figure is pypistats last_month, the rolling 30 days to the read date; ecosyste.ms counts are read on the same date. The docs have no REST or GraphQL API; the operation API is a Python API. No runsAs is recorded because no page states where a migration run executes. The batch page says SQLite has almost no support for ALTER, so migration tools are expected to produce copies of tables in the new structure and transfer the data; Alembic's batch mode does this.
