notes: >
  The docs site marked.js.org answers over https and is the project's own site; the README calls its documentation pages a rendering of marked itself. The README says marked works in a browser, on a server, and from a command line interface, and its docs say it runs in client- or server-side JavaScript projects; runtime node comes from the Node.js sentence, and no runsAs is recorded because the library names both the browser and Node.js. The package.json engines field asks for Node.js 20 or newer; for a library that also runs in the browser that minimum is a build requirement, so it is kept out of runtimeMin. The CLI is installed with npm install -g marked, which is the same npm route. GitHub detects no license for the repository because LICENSE combines two statements: the MIT license for the project, with the copyright lines MarkedJS and Christopher Jeffrey (2011-2018), and a BSD-style notice headed Markdown, copyright John Gruber (2004), which covers the original Markdown syntax text. Both are recorded as license entries since the LICENSE file ships with the package. The maintainer follows the MarkedJS copyright line; the import cannot derive the maintainer type from the name MarkedJS, so community is recorded as a fallback. The README and docs say marked does not sanitize its output HTML and recommend DOMPurify, sanitize-html, js-xss or insane on the output. The earliest npm version, 0.0.1, is dated 2011-07-24, the same day the GitHub repository was created. The npm download figure is the sum of the daily counts for the week, read on 2026-11-16. The stars and contributors belong to the single repository.
