notes: >
  The README calls this a Python port of markdown-it; the port is a statement of relationship that is not a fork or based-on sentence, so no basedOn or forkOf is recorded, and the JavaScript record is markdown-it. The README says it is a port of markdown-it "and some of its associated plugins". The PyPI license field is empty; the classifier and the LICENSE file both say MIT. The pyproject names Chris Sewell as author; the LICENSE copyright line names ExecutableBookProject, which is the maintainer followed here. The README and the docs name the Google Assured Open Source Software membership and the markdown-it-pyrs experimental Rust binding; neither is a field here. The http://talk.commonmark.org forum and the CommonMark reference projects in the docs are general community or upstream links, not the project's forum. The pypistats figure is the last month figure, not a weekly one; PyPI's own API reports no download figure. The conda route is a second install route under the Installation heading, recorded as its own installMethod. The repository's GitHub releases start at v0.1.1d (2020); the release list has no earlier entry. Stars, contributors and downloads belong to the single package repository.
  The README shows the Python API: MarkdownIt with the commonmark preset, plugins added with use, and table parsing switched on with enable; it also shows a command-line tool named markdown-it that reads files or standard input. The README says tables are disabled by default, as in CommonMark. The docs say the port changes as little of the JavaScript code structure as possible.
  The docs contents list the parser, the token stream and the renderers as separate sections.
