notes: >
  Status: the docs introduction says "Laravel Homestead is a legacy package that is no longer actively maintained. Laravel Sail may be used as a modern alternative." The repository is archived (GitHub API, last push 2024-11-06) and the Packagist package is flagged abandoned with no replacement named there; both are end signals. Sail is named as an alternative, not as a successor, so it is only mentioned here. Operating systems: the docs say Homestead "runs on any Windows, macOS, or Linux system". The README describes the Homestead application as a wrapper around Vagrant, and Vagrant has no record, so it stays in notes. Versions: the README table lists Homestead 15.x on the main branch as development and the release branch as stable; the latest stable release is v15.0.3 from 2024-04-29, and the first Packagist upload (2.0.0) is from 2014-11-17. The composer.json at v15.0.3 requires php "^8.1 || <8.3", which is the installer's requirement; the docs say the host needs no PHP, so runtime and runtimeMin are not recorded. Language is Shell per the GitHub API. Dependency counts come from ecosyste.ms for the Packagist package laravel/homestead.
