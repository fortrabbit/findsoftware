notes: >
  The open-source part is the widget (npm altcha, MIT, repository altcha-org/altcha) and server verification libraries for TypeScript, Dart, .NET, Go, Python, Java, Elixir, PHP, Ruby, Rust and C++, listed on the server integration page; the library packages are not recorded as separate figures. ALTCHA Sentinel is the self-hosted server, a separate closed product under the Sentinel EULA, with a 30-day trial and a paid license for production; the Sentinel install page needs no vendor contact, so it counts as a public self-install. The Sentinel documentation says it adds code challenges, adaptive decisions and threat intelligence over the open-source widget, and that the widget's code challenges need Sentinel or a custom server. The Sentinel license page says Sentinel verifies its license by default with eu.altcha.org, sending application version, node ID and process ID. ALTCHA Cloud runs the same engine as Sentinel, hosted in the EU; its plan prices are not recorded. The pricing page's Sentinel tiers are paid licenses, and the Cloud tiers are hosted plans, so only the Sentinel license is recorded as paidEdition. Sentinel's own version line is 1.x (the license page cites 1.15.0), so currentMajor follows the widget's v3 releases, the repository's only release line. Homepage claims recorded only as notes: no cookies, no tracking, GDPR compliant, WCAG 2.2 AA, self-hosting option, and the reCAPTCHA comparison table; no reCAPTCHA record exists, so alternativeTo is not set. The homepage states "300,000+ live websites according to builtwith.com"; builtwith.com is not a primary source, so the figure is not recorded as a field, and the HTTP Archive technologies file does not list ALTCHA. The widget is also available as a WordPress plugin (github.com/altcha-org/altcha-wordpress-next) and a Django package; these are extensions and are not recorded as separate records. The widget's setCookie option is optional, and the default sends the payload as a form field. Coined kinds left in notes: captchaMethod (proof-of-work with Argon2, Scrypt and PBKDF2 algorithms, plus code challenges through Sentinel). The GitHub contributors count is one (no second page in the API); the package.json author is named Daniel Regeci, and the legal notice names BAU Software s.r.o., so the company is the maintainer. The npm weekly figure is the sum of the seven days 2026-10-26 to 2026-11-01 for the altcha package the install page names. Sentinel's HTTP endpoints (GET /v1/challenge and POST /v1/verify/signature) are the server API; no headlessApi value is recorded because the docs do not call it REST.
