notes: >
  The CSV homepage is http://doug-martin.github.io/goqu/; the https address answers 200 with the project's own site ("View on GitHub"), so it is recorded. The README recommends "gorm" and "hood" for ORM features, which the project names as alternatives without the word alternative, so no alternativeTo is recorded. The docs/version_migration.md page covers goqu's own major versions, not an import from other software. The dialect page names sqlite3; the value is recorded as sqlite. The README names the go directive in go.mod as the minimum Go version for using goqu, and runtimeMin records it. The dialect page says dialects work like Go drivers: none is registered until its package is imported. Go modules have no download figure. The contributors count covers the repository, and the stars and releases are the repository's too. The README says goqu "is not intended to be used as an ORM" for associations or hooks. The dialect page says a dataset keeps the dialect it was created with, and that goqu.SetDefaultDialect sets a package-level default once at startup.
