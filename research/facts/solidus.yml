notes: >
  The homepage is https://solidus.io, which answers 200; the homepage links Slack, Stack Overflow and the security guide, none of them a field the record holds. Current major is 4 (v4.8.0, 2026-10-09, the highest stable tag of the solidus gem; solidus_admin tags are a separate package, and the monorepo's v3.0.0.rc2 is the newest prerelease, older than the stable release). firstRelease is 2015: the first stable tag is v1.0.0 (2015-08-11), and the repository dates from 2015-02-18. The rubygems figure is for the solidus gem, the package the installation guide names, with downloads recorded as the registry states them. The maintainer is Nebulab, Inc. as the terms page names the operator of the site; the homepage says the project is maintained by Nebulab and the open source community, and the README names Nebulab as the main code contributor, so a reviewer may decide whether the operator of the website is the right maintainer. The enterprise page names Solidus Cloud as a hosted option and a DYI Edition for self-hosting; no price or plan is recorded. The guides do not state a Ruby or Rails minimum, only that the oldest maintained branch is supported, so runtimeMin is left out. The guides name solidus_starter_frontend as the default storefront and Paypal, Stripe and Braintree as bundled payment options; neither is a field the record holds. The rails-engine category is the CSV's own word, and the guides state the Rails engine form.
