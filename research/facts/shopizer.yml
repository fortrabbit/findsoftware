notes: >
  The record is the shopizer-ecommerce/shopizer repository on its 3.2.7 default branch, the Spring Boot headless backend. The homepage now describes a separate Shopizer microservices product (Spring Boot 3 services, pricing with an open source $0 plan) and calls this version "Legacy Shopizer Headless Version 3.2.7 is still available for download and use"; no page here says this repository is discontinued or succeeded by a named repository, so status stays accepted and successorOf is left out. The GitHub homepage field is http://www.shopizer.com, which redirects to the https site that answers 200, so the https address is recorded. The highest stable GitHub release is 3.2.5 (2022-12-30); 3.2.6 and 3.2.7 exist only as branches, with no tag and no release object, so latestReleaseDate is the 3.2.5 release date, while the README and the default branch name 3.2.7 as the last version. runsAs comes from the README line saying the administration tool requires the Java backend to be running. The README lists catalog, shopping cart, checkout, merchant, order, customer and user as the headless components and gives the Swagger UI address of the running backend. The maintainer is recorded as the footer names it, Shopizer, with no legal form on any page read. The Slack channel named in the README is a community link with no field of its own. Maven Central holds com.shopizer:shopizer, but its versions are 2.x, and the install docs name Docker and the Maven wrapper rather than that artifact, so no mavenCoordinates is recorded. The 3.2.7 branch LICENSE.md is the Apache License 2.0 text. The GitHub owner shopizer-ecommerce is a user account, not an organization.
