notes: >
  Bundled data renders at once and works offline; fetched data adds network latency and needs a ServiceWorker to work offline. The README describes a picker with categories, skin tones, custom emoji, a locale list and a search that can run without the picker. Monorepo: the stars, contributors and license belong to the missive/emoji-mart repository, which also holds the @emoji-mart/data and @emoji-mart/react packages. The registry figure is the emoji-mart package the README names in its install commands; the other two packages are separate npm packages and their downloads are not counted. The homepage is the project page on Missive's learning site; missiveapp.com/open/emoji-mart redirects there, and the page title is "Emoji Mart" with the README's tagline. The LICENSE names "Missive"; the privacy policy names the owner as Heliom Inc., which is the legal entity behind the Missive product, and the about page places the headquarters in Quebec City, Canada. The install section holds a shell command for React, an import example and a CDN script tag for the browser build, and no sentence names an install route, so installMethod is left out. The README says the picker is a web component and lists browser APIs it relies on (Shadow DOM, custom elements, IntersectionObserver), but no sentence says where it runs, so runsAs is left out. Data is decoupled into @emoji-mart/data, which can be bundled or fetched from a CDN; the README also covers a search index, a native emoji lookup and an emoji web component, none recorded as fields. The latest emoji data the README names is Unicode 14; that is a version of the data, not recorded. The last release v5.6.0 is also the last commit on the default branch.
