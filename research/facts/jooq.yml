notes: >
  Status accepted: criterion 3 is settled. Every jooq.org page answers 403 with an ORA-01031 page to the research client, and no other user agent was tried; the manual pages were read as Internet Archive copies of the project's own pages (the step 1 page of the 7-step tutorial, the supported RDBMS page, the support page, the terms page), cited by their web.archive.org URLs. The tutorial says to download jOOQ or create a Maven dependency for the org.jooq artifacts, and the Maven Central artifact org.jooq:jooq is the registry route. The supported RDBMS page lists many databases (Aurora, Azure, BigQuery, CockroachDB, Databricks, DB2, Derby, DuckDB, Firebird, H2, HANA, HSQLDB, Informix, Snowflake and others); the databases value holds those the field dictionary has. The project's download page, read as an archive copy, describes a free Open Source Edition and paid Express, Professional and Enterprise Editions with per-developer prices that are not recorded; no pricingPage is recorded because the page itself answers 403. The Apache-2.0 license covers the open-source code, and the LICENSE file says commercial licenses replace it and add support and commercial database integrations; those are two license entries. The footer of the manual pages says "Data Geekery GmbH" holds the jOOQ trademark and the copyright, which names the legal form; the terms page names Swiss law and Zurich as jurisdiction, which is a governing-law clause and gives no headquarters, so hqCountry stays out. The repository is a monorepo: stars and contributors belong to jOOQ/jOOQ as a whole, and the module with the runtime library is the jOOQ directory, whose README says most systems include it as a dependency. The jOOQ-bom module README describes a Maven BOM and the jOOQ-codegen-maven module README a Maven plugin for code generation. The demo repository (jOOQ/demo) names Maven and a Professional and Enterprise editions module set, which the paidEdition fact quotes. The Java version the open-source edition needs was not found on a readable page, so no runtimeMin is recorded.
