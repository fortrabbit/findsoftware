notes: >
  Sentry's year-based release tags (26.10.0) are calendar versions, so currentMajor is the year part, 26. The GitHub API reports the license as NOASSERTION because LICENSE.md is an FSL file rather than an SPDX text; the FSL converts to Apache 2.0 after two years, so it is not an OSI open-source license. The Business price is printed as a monthly plan base; the Team plan is priced per error on the pricing page. The self-hosted installer lives in a separate repository, recorded as selfHostedRepository, a coined kind. The docs list minimum requirements for the self-hosted stack, which is a separate install from the SaaS.
