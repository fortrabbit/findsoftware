notes: >
  The LICENSE copyright line names Riza, Inc. (2024), recorded as the maintainer; no page the sources name gives a country, so hqCountry is absent. The oldest tag of any kind is v0.0.0-devel (commit 2019-07-19), which sets firstRelease to 2019; the first GitHub release is v0.1.0 (2020-01-08). The stable release list ends at v1.31.1 (2026-04-22); v1.9.0-beta1 and v1.17.1 are flagged prerelease or draft on GitHub and are older than the latest release, so no latestPrereleaseDate is recorded. The Database and language support page (https://docs.sqlc.dev/en/latest/reference/language-support.html) lists MySQL, PostgreSQL and SQLite as table columns with Stable and Beta cells, beside ClickHouse, DuckDB, Spanner and SQL Server for the built-in Go generator; the databases fact holds the four the dictionary has ids for. The go install route needs Go 1.21+ on the install page; that is a build requirement, so no runtimeMin is recorded. The sqlc Cloud section (managed databases, sqlc push) is a separate product in the docs sidebar and gets no hostedOffering fact. The homepage shows customer logos with no count, so reportedInstalls is absent. The sqlc-gen-* plugins for Kotlin, Python and TypeScript are listed in the README as community or beta language targets; they are not recorded as fields. The docs' Community projects section and the GitHub topic it links are not a plugin directory URL, so pluginDirectory is absent.
