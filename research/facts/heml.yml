notes: >
  Status accepted, with a doubt the import will settle: the last release is 1.1.3 (2017-11-30), the npm latest tag is the same version, and the repository was last pushed 2020-02-09; the project states no end, so criterion 4 is left to the import's four-year rule, which moves a record with no release in four years to stub. The homepage heml.io answers over https and still shows the software; the site also hosts an online editor at heml.io/editor, which the usage page describes as a place to code HEML and save the output locally, recorded here only as a note and not as a hosted offering. The usage page gives two routes under npm: a global CLI install (npm install heml -g) and a local Node module (npm install heml); both are the npm package heml and one installMethod entry is recorded. The repository is a Lerna monorepo (packages/heml, heml-elements, heml-parse, heml-render, heml-styles, heml-validate and others); stars and contributors belong to the monorepo, and the npm figure is for the heml package the usage page names. The usage page shows the develop command for watching files and refreshing a browser and the build command for producing email code; no page states where the output runs, so runsAs is not recorded. The LICENSE copyright line is "Copyright (c) 2017-present SparkPost"; the homepage footer says "Made with ❤️ by @SparkPost" and a second footer link names the personal account of the maintainer (twitter.com/theavigoldman), which is not recorded. The earliest tag is v1.0.2-0 (2017-11-01) and the npm package was created 2017-09-19; firstRelease is the year of the earlier of these, 2017. Contributors is the number of pages of the contributors endpoint without the anon parameter (8). The usage page says the CLI inlines CSS by default and that the --embed flag turns inlining off; the Node module returns the rendered HTML, the metadata exported from the head and any validation errors.
