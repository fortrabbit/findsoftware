notes: >
  The homepage answers over https and is the project's own site; the CSV row named the repository as the source. The repository's default branch has no root README: the package README at packages/slicknode/README.md and the docs folder carry the product description. The npm package slicknode is the CLI named by the install step, and it is the registry figure recorded. Latest GitHub release is v0.14.0 (2021-10-12) and the first is v0.6.0 (2019-07-18); npm latest is 0.14.4, published 2023-05-08, which gives latestReleaseDate. currentMajor is 0. No release has been published since 2023-05-08, so the four-year rule in AGENTS.md would move the record to stub on or after 2027-05-08 unless a release appears; the repository was last pushed 2023-07-25 and is not archived. The quickstart requires a Slicknode Cloud account, and the package README states self-hosting as an option next to the managed cloud. The README also links a Slack community, which has no field here. The company is Slicknode LLC: the copyright line in LICENSE and the terms page name it, and the terms give an Austin, TX address. The privacy page names Slicknode Inc. and Meissner Consulting LLC as operators of related websites, which is not recorded. Slicknode S3 file storage is needed for image and file modules per the start command page; it is not recorded as a field.
