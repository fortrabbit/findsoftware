notes: >
  Drafted 2026-11-03 from the homepage, the self-hosting overview, Docker and Kubernetes pages, the API introduction, the privacy policy and GitHub. The overview's editions table gives the open source edition as AGPL-3.0 and the premium edition as Commercial, and both are recorded as license statements. The privacy policy names "Get Lago Corp." with a Dover, Delaware seat, which is the incorporation seat, so no hqCountry is recorded. A TechCrunch article calls Lago Paris-based; it is a third-party article and is not used. The docs index names the REST API, recorded as headlessApi; the API introduction also says "Integrate Lago with the JSON HTTP API, or with one of the Lago client libraries". The client library lago-javascript-client (28.2 thousand weekly downloads in the candidates row) is a client, not the server, so no npmName is recorded. The Docker page names the front application, the API, its workers, the clock worker, Postgres, Redis (a Sidekiq job queue and a cache) and a PDF service. The Docker Hub figure is for getlago/lago, the image the Docker page names. The Kubernetes page calls lago-api "The Rails API" and the Docker page names a Sidekiq queue, so the runtime is Ruby; the repository's GitHub language is Go. The Docker page's optional ClickHouse event store is recorded as a database; Postgres holds the application data.
