notes: >
  The project has no GitHub release or tag listing on the releases endpoint (it has 430 tags, none of them a release), so currentMajor, latestReleaseDate and firstRelease come from the npm registry: latest 4.2.5 published 2026-06-16, earliest version 0.0.1 published 2020-07-03. The site at antoniandre.github.io/wave-ui answers with an application shell and no body text (the page has only a script and an empty root element), so the README is the readable source for the homepage and docs links; the docs themselves could not be read. The README covers the Vue 2 install route as npm i wave-ui@legacy (legacy dist-tag 1.70.0); the record follows the current version. The package manifest declares a peer dependency on vue ^3.5.0 and Node engines of 16 or later; neither is recorded as runtime or runtimeMin. The GitHub API reports the repository language as Vue. The package manifest and the LICENSE file name Antoni Andre as the author and copyright holder. The FUNDING file names GitHub Sponsors; no field fits it. No end signal was found: the repository is not archived, the npm latest version is not deprecated, and the README describes the framework as current.
