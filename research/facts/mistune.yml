notes: >
  Accepted: a Markdown parser that Python web code calls to turn Markdown text into HTML (the README's Overview), installed with pip (criterion 2 and 3). The record's homepage is the docs site, whose PyPI Documentation link is the same address over HTTPS; the plain-HTTP address in the candidates row redirects to it. The PyPI version 3.4.0 declares requires-python >=3.10 and the tag's pyproject says the same, so runtimeMin is 3.10; the main branch pyproject says >=3.11, which is newer than the release and is left out. The LICENSE copyright line names Hsiaoming Yang with the year 2014, and the PyPI and GitHub license fields both say BSD-3-Clause. The highest stable GitHub release is v3.4.0 (2026-10-19), and the newest prerelease, v3.0.0rc5, is older, so latestPrereleaseDate is absent. firstRelease 2014 is the first PyPI upload 0.1.0 on 2014-02-26; the repository was created in February 2014. The README says create_markdown() escapes raw HTML by default and that mistune.html() enables raw HTML and several plugins, to be used for trusted input or with output sanitized elsewhere; both are features in prose, not fields. The README's benchmark table compares Mistune with markdown, markdown2, mistletoe and markdown_it; a benchmark table is not a statement of alternatives, so alternativeTo is absent. The README announces Wenmode, a Markdown parser by the same author that is inspired by lessons learned from Mistune; no sentence calls it a successor, so successorOf is absent. The pypistats figure is the last-month count read on 2026-11-16. The README's sponsors section names a commercial Office document converter as a sponsor; that is a sponsor, not a field.
