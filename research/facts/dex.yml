notes: "The homepage footer reads \"Dex IdP Contributors\", which is the recorded maintainer; the repository's MAINTAINERS.md names the current maintainers group. The homepage says \"Dex is developed under the Cloud Native Computing Foundation\" and marks the project as a CNCF Sandbox project: that is hosting, so it is recorded here and not as maintainer, and no parent or hqCountry is recorded because a foundation incorporation is no project headquarters. The README marks the SAML 2.0 connector as unmaintained and likely vulnerable to auth bypasses. The storage page also lists etcd and Kubernetes custom resource definitions as storage backends; they are not SQL and are not in databases. The getting started page's build instruction says Go 1.19 or greater; no runtimeMin is recorded because that is a build requirement, not a runtime of the released binary. The docs page names the #dex channel on the CNCF Slack (cloud-native.slack.com/archives/C01HF2G1R34) and the GitHub Discussions board; the homepage footer has no social profile link. Dex provides a gRPC service for programmatic modification of its state (dexidp.io/docs/configuration/api/), off by default; the headlessApi vocabulary has no grpc value, so no field holds it. The container image entrypoint uses gomplate to pre-process the configuration file, which is a configuration feature, so templating is not recorded. The Docker Hub figure is the docker.io/dexidp/dex count from the Docker Hub API, which the docs name beside ghcr.io/dexidp/dex."
