notes: >
  The README links the documentation at theiceshelf.com/firn.html, and that address now returns 404 with a page for an unrelated blog, so the project's own site no longer shows the software and status is stub with no homepage. The README's install step (download the binary from the GitHub releases page) is the only install source left, so the record stays. The GitHub releases start at v0.0.1 (2020-05-11), and the oldest release listed is a prerelease; firstRelease uses it. The latest stable release is v0.0.21 (2022-03-29); no prerelease is newer, so no latestPrereleaseDate is recorded. The crates.io crate named firn belongs to another project (wseaton/firn), so no crateName is recorded. The README's development section names Rust 1.58.0 as the development toolchain; it is not recorded as runtimeMin because it describes the contributor setup, not the minimum for running the binary. No page names a maintainer: the LICENSE and Cargo.toml carry no name, and the GitHub profile name Ty is not recorded. The README marks the status as Alpha in its badge.
