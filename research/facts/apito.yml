notes: >
  The homepage links GitHub, GitHub Discussions, LinkedIn and X; the LinkedIn and X links are the company's. The terms and privacy policy name Apito LLC and give no address or country, so hqCountry is unknown. The AGPL-3.0 Engine is installable (CLI, Docker Compose), so the record is accepted; Apito Cloud is a managed hosting of the same project beside it (the self-hosting guide says Free Cloud and Pro stay on Apito-managed hosts), and LICENSING.md says paid Cloud features stay in private repositories. The pricing page lists Free Cloud, Pro and Dedicated hosting plans beside the Open Source row; Dedicated adds database-per-tenant, but that is a hosting plan, not an edition, so paidEdition is not recorded. The self-hosting guide says Pro Console features may require a Pro-capable build; the page leaves that open. LICENSING.md says tags through v1.8.25 are Apache-2.0 and tags v1.8.26 to v1.8.30 are FSL-1.1-ALv2; only the current AGPL statement is recorded. The databases listed come from the README; the reference Compose file in the self-hosting guide pairs the Engine with ArangoDB. The tag v1.0.0 has the earliest date found (2025-07-22), so firstRelease is 2025, although the repository was created in 2022. Tenant-based SaaS support is documented as tenant_id filtering and is not recorded as multisite.
