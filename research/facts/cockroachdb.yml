notes: >
  No GitHub release exists; the project ships from tags, and the newest stable tag is v26.2.9 (commit date 2026-10-21), used for latestReleaseDate. The project's release notes use the 26.2 line (v26.2.0 to v26.2.9), a calendar-style numbering, so currentMajor is absent rather than read as 26; the reviewer decides whether the year counts as a major. The first release is not dated on the release notes page read (the v1.0 notes carry no date in the text), so firstRelease is absent. The license for the latest release is the CockroachDB Software License, which the README names with its change date: releases from 24.3.0 on are under the CSL, and the releases page says binaries released before 24.3.0 are under the Business Source License; those older licenses go to notes and are not recorded as license facts. The maintainer is Cockroach Labs, Inc. (privacy policy address, New York); the privacy policy states the company is headquartered in the United States. Cockroach Cloud is the hosted service: the licensing FAQ says "All Cloud deployments automatically have a valid Enterprise license", and the hosted offering sits beside the self-hosted server; the hosted service is recorded as hostedOffering. The runsAs value rests on the cockroach-start page, which says its --background flag is not intended to start a long-running server. Paid Enterprise and Enterprise Free licenses are described on the licensing FAQ; no prices are recorded, and the pricing page holds no feature list that could be quoted. The GitHub API reports the license as NOASSERTION; the README and the LICENSE file carry the CSL text. Fields coined here: none.
