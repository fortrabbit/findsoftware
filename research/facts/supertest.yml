notes: >
  No homepage: the repository names no site, and the README title links to the superagent documentation site at forwardemail.github.io/superagent, which describes superagent, the library supertest is built on. The README says the module is "HTTP assertions made easy via superagent" and that it is driven by superagent; that is the basedOn statement. The repository description names node.js HTTP servers, which is the runtime statement, and the README shows require('supertest') in Node examples. No runsAs is recorded: the README does not say where the tests run beyond the examples. The README's Notes section says the library is "Inspired by" api-easy; that is inspiration, not alternativeTo or basedOn. The README names express, cookie-parser and should as example dependencies in its examples; they are not basedOn. The install section is the Getting Started section and gives one npm command with --save-dev. The LICENSE copyright line names TJ Holowaychuk and "other contributors"; the maintainer is recorded from the named holder. The README says the library is maintained for Forward Email and Lad, both GitHub organizations. The npm weekly figure is the sum of the daily counts for 2026-11-01 to 2026-11-07 for the package the install command names. The ecosyste.ms dependent counts were read on 2026-11-16. The first npm upload is 2012-06-26 and the repository was created on 2012-06-27, so firstRelease is 2012.
  The README says supertest works with any test framework and shows mocha examples, that request() accepts an http.Server or a function and binds the server to an ephemeral port when it is not already listening, and that an expect() failure inside end() does not throw and must be passed to done or rethrown.
