notes: >
  Doubt first: popmotion.io, the site the repository, the README and the npm metadata all name, answers 403 AccessDenied from its storage host (read again on 2026-11-16) and serves only an access-denied page, so the homepage is not recorded and the project's documentation is unreachable; a working site, or a statement that the project no longer has one, would settle it. Not an end signal as found: the README has no end or successor statement, the repository is not archived, and npm carries no deprecation. The import will also move the record to stub on its own rule: the newest stable release is of 2022-08-15 and nothing newer is published in four years. The GitHub repository has no license object and no LICENSE file at its root (the contents API lists none); the MIT statement is the npm latest metadata, which matches the package.json license field. The repository is a monorepo, so stars and contributors belong to it. The README says the animate function is "just ~4.5kb", a bundle size statement kept here and not as a field. The GitHub tags reach 8.7.1 among stable versions, with 9.0.0 release candidates and no 10.x or 11.x tags; the npm latest is newer, so currentMajor is 11 from the registry. The oldest tag v0.0.1 has a commit dated 2014-10-21, earlier than the first npm upload 0.0.1 of 2015-07-20, so firstRelease is 2014. The README gives the browser and requestAnimationFrame as drivers but names no runtime, so no runtime or runsAs is recorded. The README's Twitter follow badge is the x fact, recorded without a quote. The contributor count is the last-page link of per_page=1, 53.
