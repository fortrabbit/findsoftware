notes: >
  Boundary question: the project's own pages document push APIs an app or site calls. The VictoriaMetrics docs say "VictoriaMetrics can accept metrics via the following popular data ingestion protocols (aka push protocols)", listing the Prometheus remote_write API, the DataDog submit metrics API, the InfluxDB line protocol, Graphite plaintext, the OpenTelemetry http API and the OpenTSDB http /api/put protocol, and the data ingestion page says "If your tool is not listed it is likely you can ingest your data into VictoriaMetrics using one of the protocols listed". The docs say "VictoriaMetrics supports the following handlers from Prometheus querying API", which the description's Prometheus-compatible query API rests on. The license of the latest release is Apache-2.0 (the docs name "Apache License 2.0" for the open-source components); the Enterprise edition is a separately licensed edition, recorded as paidEdition. The docs name two deployment types, the single-node version and the cluster version, and the quick start runs the single binary; the enterprise page's cloud and trial details are not recorded. The docs describe the Enterprise components as "provided in two kinds - Community edition and Enterprise edition"; the Enterprise releases are free to evaluate with a trial license. The privacy policy writes the company as "Victoria Metrics Inc." and the ESA as "VictoriaMetrics Inc."; the ESA spelling is recorded. The homepage footer carries no legal name and no address, so hqCountry is unknown. importsFrom comes from the vmctl page's list of migration modes. Coined kinds go here: linkedin (https://www.linkedin.com/company/victoriametrics/), slack (https://slack.victoriametrics.com/), telegram (https://t.me/VictoriaMetrics_en). The Docker pull figure is the victoriametrics/victoria-metrics repository the docs name for Docker images. The homepage's public figures (17K+ stars, 1B+ Docker pulls) are rounded and are not recorded. The Plans & Features link is the pricing page entry in the site menu; its content was not read. The youtube link is the one in the VictoriaMetrics site footer, shared with the VictoriaLogs product page.
