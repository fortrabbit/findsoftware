notes: >
  Status is stub while criterion 3 is in doubt: no page documents installing motyl itself, only its dependency gems and running it. Revisit when the project documents an install step.
  No homepage: the GitHub homepage field is empty. The author's site cambus.net is linked from the README as the author's site, not the project's. The README documents the gems the program requires (kramdown, mustache, rouge) and says to run motyl, but it does not document how to install motyl itself; the repository has no Makefile, gemspec or Gemfile. installMethod is absent: the README, ChangeLog and repository tree hold no step for installing motyl itself, so the candidate fails criterion 3 (documented installation) and is reported for a status decision. The README names the examples directory as the starting point for a site. The README's theme instruction names a separate theme repository (Chrysalide), which is not read. There is no RubyGems package named motyl, so no rubygemsName is recorded.
  The README describes Markdown pages and posts rendered with Mustache templates, syntax highlighting with Rouge, custom URLs built from file names, multiple categories per post and an Atom feed. The README says running motyl writes posts and pages into a public directory and copies static assets there.
