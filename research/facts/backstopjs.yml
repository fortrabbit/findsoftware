notes: >
  The README's News section says "BackstopJS needs a new maintainer/owner." and asks interested people to get in touch; a call for a new maintainer is no end signal, so the status is accepted. The repository still takes commits (last push 2026-10-10) and the last npm release is 6.3.25 from 2024-09-07. The CSV homepage backstopjs.org answers over https and redirects to garris.github.io/BackstopJS/, which the homepage fact records. The GitHub releases list stops at v3.8.8 (2019-01-21) among its stable entries, so currentMajor is taken from the npm latest tag 6.3.25, a registry major higher than the GitHub release; v6.3.25 is not a git tag, and the manifest at master carries version 6.3.25 and the engines field. The contributors count is the last page of the contributors endpoint. The Docker Hub image backstopjs/backstopjs reports 2,290,795 pulls in its listing; it is not recorded as a figure. The npm weekly figure is the sum of the seven days 2026-09-28 to 2026-10-04. The README describes an in-browser report UI with approve actions; it is a test report, not an admin interface, so adminUi stays unknown. Engines: Puppeteer and Playwright are the browser engines the README names; no basedOn is recorded because no parent is stated. The README describes the workflow (backstop init, test, approve), scenarios captured at the viewport sizes set in the config, the HTML report with approval of changed screenshots, the scenario and config files kept in backstop_data by default, and the Docker rendering that keeps text rendering the same across machines.
