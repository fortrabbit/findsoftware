notes: >
  Scope call: the candidate row's category spreadsheet-io is not in the import's categoryMap, so the record takes library, the closest mapped category; the README sentence quoted is the only description. No homepage: the repository's homepage field is empty and the README names no site; the npm homepage points to the GitHub README. The README has no separate docs site, so docs is absent and the README is the documentation. installMethod is absent: the only route is the "# Installation" heading over a shell block "npm install exceljs" with no sentence stating it, so under the quote rule no route is recorded. The README's browser section says "A portion of this library has been isolated and tested for use within a browser environment" and that the streaming reader and writer are not included there; the browser build is named as a dist bundle (exceljs.js, exceljs.min.js), so browser is not recorded as runsAs and the runtime is node. The maintainer follows the LICENSE copyright line, which names Guyon Roche for 2014 to 2019; the npm registry also lists siemienik as a maintainer, and the README names no other maintainer, so the second name is not recorded. The tag v4.4.1 (commit dated 2025-01-21) has no GitHub release and no stable npm version; the npm dist-tag prerelease is 4.4.1-prerelease.0 (2024-12-20), so the latest prerelease date uses the registry, and the tag date is not recorded. The npm weekly figure is the sum of the daily figures for 2026-11-01 to 2026-11-07 from the range endpoint. The discord link is the one the README gives under "Let's chat together:" (a SiemaTeam server), recorded without a quote as a link fact. The contributors count is the rel="last" page of the contributors endpoint with per_page=1. The ecosyste.ms dependent counts are for the npm package exceljs.  The README names no company behind the project; no legal entity or country is recorded.
