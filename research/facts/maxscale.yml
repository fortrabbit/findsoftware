notes: >
  Status is discontinued from the repository's own README on the 24.02 branch, the default branch: "NOTE The Open Source version of MaxScale is no longer supported or maintained. A fully supported version can be obtained" from MariaDB plc's contact page. The same README says the open source release line is "licensed under the Business Source License" "up until version 24.02", with change dates from 21.06 (2024-06-03) to 24.02 (2027-04-10). GitHub reports NOASSERTION. The newest tag is maxscale-24.08.0 (annotated tag tagger date 2024-08-27); the repository has no GitHub release objects. The license file for the newest tag, licenses/LICENSE2408.TXT at maxscale-24.08.0, is Business Source License 1.1 with MariaDB plc as licensor, an additional use grant for fewer than three production server instances and a change date of 2027-09-09 to GPL version 2 or later; the README on the default branch says the BSL applies up until version 24.02. The versions use a year.month scheme (24.08), so currentMajor is not recorded. The CSV row names a 2025-12-31 release and the tag maxscale-22.08.18; neither appears in the tag list fetched (232 tags, the newest by version maxscale-24.08.0), so the CSV date is not used. The homepage is not recorded: the mariadb.com MaxScale product page is the enterprise sales page, and the open source repository names the documentation at mariadb.com/docs/maxscale. The Docker Hub repository mariadb/maxscale has 9,264,649 pulls, but the docs' Docker guide names an image in the private MariaDB Enterprise Registry that needs a subscription token, so dockerPulls is not recorded. The docs say MaxScale "follows the MariaDB Enterprise release schedule". The README describes load balancing and high availability "transparently to the applications", with plugin components for protocols and routing decisions, and a fully supported version is named as available from MariaDB plc through its contact page. The firstRelease value is the year of the oldest tag in the repository, maxscale-0.4.2 (annotated tag dated 2016-09-22); the repository was created 2013-12-16, and the older history is not in the tag list, so a reviewer should confirm the year. Fields coined here: none.
