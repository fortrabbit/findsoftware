notes: >
  The repository has no homepage. Its README points its documentation at the Comfortable Media Surfer wiki, an inherited project, so no docs fact is recorded for this repository. The README says the project continues the lineage of Comfortable Mexican Sofa and Comfortable Media Surfer; only Sofa is a candidate row, so the successorOf fact names it. The repository is not a GitHub fork (the API reports fork false), and the contributors API returns 129 entries for it, a count that a reviewer should check against the repository history. The README's copyright line names Oleg Khabarov (2010-2019), ShakaCode LLC (2024-2026) and Andrew vonderLuft (2026); the record takes the 2026 holder as maintainer, and the 2024-2026 ShakaCode line is a copyright statement, not a second maintainer. The highest stable GitHub release is v4.5.0 (2026-10-25). The earliest GitHub release and the earliest RubyGems version are both from September 2026, so firstRelease is 2026. The README's compatibility table states Ruby 3.2 or newer, recorded as runtimeMin; the Node.js 18 requirement is for asset compilation and is not a runtime. The gem's RubyGems author list includes Oleg Khabarov, while the README names Andrew vonderLuft as the revival maintainer.
  The README describes a self-hosted engine that is not intended as a hosted SaaS CMS or a JavaScript-first visual page builder; configurable admin and public routes; layouts with the cms tag syntax; Active Storage for files; image resize options that depend on ImageMagick or libvips through Active Storage; an upgrade path from Sofa that replaces the gem and converts the initializer; and a documentation link to the Comfortable Media Surfer wiki for inherited features. The README says its comfy_cms_* database tables match Sofa's, so the Sofa upgrade does not rename them.
