notes: >
  TypeGraphQL is a TypeScript framework for building GraphQL APIs in Node.js, accepted as an API framework used to build web application backends. The GitHub releases list has no stable release after v1.1.1 (2020-11-04); the npm dist-tags name 2.0.0-rc.3 as latest and 2.0.0-rc.4 as next, and the docs site and homepage label 2.0.0-rc.4 as the current version. The 2.0 line is release candidates only, so currentMajor is the stable 1 line and the rc dates sit in latestPrereleaseDate. The runtimeMin 10.3 comes from the engines field of the v1.1.1 package.json, the latest stable release; the 2.0.0-rc.3 manifest declares node >= 20.11.1, a prerelease, so it sets no runtimeMin. The installation page names graphql-js and graphql-scalars as peer dependencies, a dependency relation, so there is no basedOn; the same page says class-validator decorators supply validation, also a dependency relation. The README says the schema is defined with classes and decorators as the one source of truth, instead of a separate SDL file plus interfaces; object types, inputs, arguments and resolvers are classes, with the Query, Mutation and field resolver decorators. The docs name TypeORM, Prisma and NestJS integrations, and the README names TypeORM, so these are notes and no databases or importsFrom values. The AWS Lambda page calls a standard Node.js server deployment the usual case and describes Lambda as the variation, which gives runsAs always-on. The browser usage page says it is a Node.js framework that does not work in a browser. The maintainer is the LICENSE copyright holder, Michał Lytek, and the homepage footer repeats it; the homepage says the project has no large company behind it and is community supported through Open Collective, which is notes only. The README's security contact is a Tidelift page and the sponsor list on the homepage is left out. The discord link comes from the README badge and the x link from the homepage footer. The GitHub stars and contributors belong to the single repository.
