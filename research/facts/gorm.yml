notes: >
  The homepage and the docs Install section show "go get -u gorm.io/gorm", recorded as installMethod. The community page lists a Gitter chat, recorded as forum. runtimeMin is the go.mod go line at the latest tag. GaussDB and TiDB are named in the same sentence as the officially supported databases; no databases value covers them, so they stay in notes. The GORM Gen code generator, linked from the README and the docs' CLI menu, is a separate project surface and is not recorded here. The LICENSE copyright line and the homepage copyright both name Jinzhu; the maintainer is recorded as Jinzhu, and the GitHub organization is go-gorm. The x link is the twitter.com account in the homepage footer and the Twitter Follow badge; it is the maintainer Jinzhu's own account. The Generics API and the Database Resolver and Prometheus plugins are documented features with no field of their own. The README lists associations, hooks, eager loading with Preload and Joins, nested transactions and save points, batch insert, auto migrations, a SQL builder, and composite primary keys. The connecting page shows each driver as a separate Go module, for example gorm.io/driver/mysql, passed to gorm.Open.
