notes: >
  Better Stack is a hosted-service record under the rule for hosted rows. Classification: the homepage hero reads "The AI SRE observability stack" and its price box compares traces, logs and metrics ingested per month, so the lead is log and telemetry ingestion, which apps reach through the HTTP API the logs docs describe ("sending your logs to our HTTP API", /docs/logs/ingesting-data/http/). The homepage also lists incident management, status pages and uptime monitoring; status pages and uptime monitors are finished applications under criterion 1, and they are not the lead. Reviewer decision: the brief asks for rejected criterion 1 only when the lead is status pages or uptime monitoring, so the record is kept; confirm. The vendor is Better Stack, Inc., a Delaware corporation (terms page); no full address with a country appears on the pages read, so hqCountry is left out, and the Delaware incorporation is not an HQ. The security page says data is stored in the EU regions by default, and the pricing form offers United States, Europe and Singapore; the enterprise page names self-serve clusters in Virginia, Oregon, Germany and Singapore. Enterprise custom VPC deployment is vendor-run, so selfHostOption is left out. The pricing page lists SSO with Google included, Azure and Okta at $5 per user per month, and SCIM on the enterprise tier; SAML is the protocol recorded. The CSV row had no repository, so no SDK, client or GitHub figure is recorded (hosted rule). The X, Instagram and YouTube links are homepage icon links without a quote. The pricing page lists a free plan for personal projects (freeTier, a coined kind). The SCIM entry on the pricing page is a list label without a sentence, so no sso value is recorded for it; LinkedIn is a coined field and is not recorded. Coined kinds, kept here: the OpenTelemetry collector, Vector and HTTP ingestion (docs), and MCP server (homepage) are integration kinds not recorded as fields.
