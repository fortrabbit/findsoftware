notes: >
  Status: accepted per the CSV. This record is the DOM Testing Library, the npm package @testing-library/dom; "Testing Library" on testing-library.com is the family name, and the testing-library.com root page describes the family. The CSV homepage testing-library.com/dom answers with a redirect to the intro page, which is the homepage recorded here. The LICENSE copyright line names Kent C. Dodds for 2017; the docs footer reads "Copyright © 2018-2026 Kent C. Dodds and contributors". Framework bindings, including react-testing-library (record id react-testing-library, basedOn this id), are separate packages built on it. The README says the library works with JSDOM by default with Jest or in the browser, and says the module is distributed via npm and bundled with Node; the runtime is node and no runsAs is recorded, per the rule for libraries that name both the browser and Node.js. The README's install section gives the npm command for the devDependency route; no other route is named. npmWeeklyDownloads is the sum of the daily counts for 2026-11-01 to 2026-11-07; the CSV carried an earlier figure of 50.5M per week, and the period in the value is the one this record uses. The npm latest version is 10.4.2, published 2026-09-13, the same day as the GitHub release. The 13 GitHub prereleases are all older than the latest release (the newest is v10.0.0-alpha.3 from 2024), so no latestPrereleaseDate. firstRelease is 2018 from the v1.0.0 tag commit (2018-04-06); the npm package's first upload dates from 2019, later than the GitHub tags. The npm dist-tags also list next, beta and alpha builds, none newer than the latest. The repository holds this one package, so stars and contributors (185 across all pages) belong to it. Discord is linked from the README badges.
