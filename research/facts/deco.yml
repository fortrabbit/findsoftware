notes: >
  Whether deco-cx/deco is the current product is in doubt; what would settle it is a docs page that says which repository the Deno framework now lives in. The docs at docs.decocms.com say "Blocks 7.x is the released default" and "Fresh and the former admin are retired" (llms.txt) and link github.com/decocms/blocks (the Blocks 7.x framework, with TanStack Start and Next.js bindings) and github.com/decocms/studio as the current repositories; neither is deco-cx/deco, whose README still describes the Deno framework and whose releases continue to 1.214.1 on 2026-10-16. A deco blog post of 2026-09-03 says the old admin at admin.deco.cx is discontinued on 30 October 2026 and that Studio stays compatible with Deno sites on Fresh and HTMX, so no end of the framework is stated. The README's self-hosting note for the editor is dated: it says self-hosting the editor is "coming in early 2025", and the editor is at admin.deco.cx. deco.cx redirects to www.decocms.com, a services and software site in Portuguese, recorded as homepage; the README gives no maintainer name, so maintainer is left out; the deco.cx PRO hosting price in the README is not recorded. The docs at docs.decocms.com list a Studio self-hosting section (Docker Compose, Kubernetes), which belongs to Studio, a separate product. The X link is recorded only as a URL in README. The CSV says "also sold as deco.cx SaaS".
