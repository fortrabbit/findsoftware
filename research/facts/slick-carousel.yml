notes: >
  Name collision: the id slick is the Haskell static site generator (research/facts/slick.yml), so this record takes the id slick-carousel; the README title and npm package name are slick and slick-carousel. The homepage is the project's demo page on GitHub Pages and is the only site the project names; it answers 200 over https. The slick.jquery.json description, "A jQuery responsive touch carousel", names jQuery as the target, which is the basedOn statement under the tagline rule; the homepage meta description says slick is a jQuery plugin, but that text sits in a meta tag. The README's Dependencies section says "jQuery 1.7" and the Version 2.0 section says the release is compatible with jQuery 4; those are dependencies, not basedOn. The npm package peerDependencies name jquery >=1.8.0. The repository has no GitHub release objects; its tags run from 1.0.0 to v2.0.1 (v2.0.1 commit 2026-07-30, not on npm). Per the registry rule the current major and latest release date come from npm: slick-carousel 2.0.0, published 2026-09-13, the newest version on npm. The npm figure counts the slick-carousel package the README names, for 2026-11-01 to 2026-11-07. The LICENSE copyright line reads "Copyright (c) 2013-2024" with no name; the maintainer comes from the package.json author, which matches the README copyright "Copyright (c) 2017 Ken Wheeler". The README's "Browser support" list (IE8+ and modern browsers) is a support list, not a runsAs statement, so no runsAs or runtime is recorded for this browser library. The homepage shows a jQuery plugin demo with no social or community links; its twitter:creator meta tag names a personal account, which is no project link. The i18n entry is the right-to-left option in the README settings table. The release date and the repository's last push (2026-09-14) are within the four-year window.
