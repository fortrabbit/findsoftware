notes: >
  The npm dist-tag latest is 3.0.0-beta.20, a prerelease; currentMajor follows the highest stable GitHub release (v2.4.0), as the package.json on master also states 2.4.0. The last push to the repository is 2022-12-10 and no end statement was found, so the status stays accepted and the import decides listing from latestReleaseDate. The about page describes the wider Staart ecosystem of SaaS starters, which is not this software, so it is not quoted. The configuration page lists the default output directory as ./public; the content folder is the contentDir option, which the page calls a folder with markdown content. The GitHub Pages workflow example uses Node.js 12 in CI; that is an example, so runtimeMin is left unknown. Hosting of the project's own docs on Netlify is not a fact about the software and is not recorded.
