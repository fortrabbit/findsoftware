notes: >
  The project has no npm or Packagist package; the install docs point to the GitHub releases page for desktop installers, so no registry fields are recorded. The highest stable release is v0.9.3, major 0; the oldest release is v0.4.2 (2018-03-27). The repository is not archived and no end statement was found in the README, the docs, the FAQ or the changelog. The LICENSE says "Copyright (c) 2019 EryouHao" and the README says "Copyright (c) 2020-2023 EryouHao"; the maintainer is recorded as "EryouHao" with no legal form stated. No runtimeMin is recorded: the README's Node 10 requirement is for development only. No basedOn is recorded: the project's pages do not state Electron or Vue as a parent. The homepage links web.gridea.dev ("Gridea Web"), a separate product not read beyond its link; no hosted service is described on a page read here. The homepage X link is the author's personal account, not a project account, so x is not recorded; the Telegram channel and QQ groups in the README have no field. The quick start names three deploy targets: GitHub Pages, Coding Pages and SFTP upload to the user's own server. The homepage shows a live counter of sites built with Gridea, not recorded because it changes continuously. The source folder defaults to ~/Documents/Gridea; the homepage says there is no database to manage.
