notes: >
  The record covers the Errbit server, an error catcher that receives notices from applications through the Airbrake API. The airbrake gem and airbrake-js client are the Airbrake project's packages, not Errbit's, so no registry figure is recorded for them. The README says Errbit is "Airbrake API compliant" and names the airbrake gem as the client; the Airbrake project is not a basedOn parent of the Errbit code. Versions: the highest stable release is v0.11.6 (2026-10-20), so currentMajor is 0 and the minor line 0.11 is not recorded. The v0.11.0.rc1 tag (2026-05-20) is a release candidate and not recorded as latestPrereleaseDate because it is older than the latest release. firstRelease is 2013 from the commit date of tag v0.1.0, which predates the first GitHub release (v0.9.0, 2020-03-16). The docs/deployment/docker.md page says no non-latest tags were published since 2023 and that the last release was v0.9.0 in 2020; the releases page lists releases up to 2026, so that Docker page is out of date and is not used as an end signal. The Errbit Team in the LICENSE copyright line is recorded as the maintainer. The docs name Heroku as the only route with official support; Dokku and Kubernetes (marked experimental) are documented in docs/deployment. Errbit states its own error log goes to an internal app named Self.Errbit; the GitHub Issues plugin is named as the only officially supported issue tracker plugin. The Google Group in the README is a mailing list for updates and is recorded as newsletter. The docs folder documents a JSON statistics API (docs/api/stats.md, /api/v1/stats/app with an API key), which no field holds. The MongoDB requirement comes from the README; the configuration page states MONGO_URL defaults to mongodb://localhost.
