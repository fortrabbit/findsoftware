unreadable:
  - "homepage https://studiocms.dev (the TLS handshake fails from the research host with an internal error alert, on two attempts; the docs site at docs.studiocms.dev answers)"
notes: >
  Stub: the homepage studiocms.dev listed on GitHub fails the TLS handshake from the research host, so no homepage is recorded and the project's own site cannot confirm the software; a reachable https answer from that site would settle it. The docs at docs.studiocms.dev answer and describe the current release. The docs describe the dashboard as available in production mode and say the dashboard is served by the built project. The getting-started page configures the Node adapter in standalone mode with output server but does not say whether the process stays running, so runsAs is left out. The docs have a locale.i18n config option without saying whether it covers content or only the dashboard, so i18n is left out. It says the CMS needs a Node.js version supported by Astro without a number, so runtimeMin is left out. The docs describe authentication as built in and oAuth providers as plugins (GitHub, Discord, Google, Auth0); oAuth is not one of the sso values, so sso is left out. The docs describe customizable permission levels; no role names are documented on the pages read, so userRoles records yes on that statement alone. The docs describe the database as an Astro integration setting, with libSQL as default; Turso is named as a managed libSQL service and is not the project's own hosting. No hosted or cloud offering of the project was found on its docs, README or pricing pages, so no pricingPage is recorded. Node is named as the runtime; Bun and Deno are stated as unsupported. The repository is a monorepo: the registry figures are for the core package studiocms, which the install docs name. The GitHub releases start as beta prereleases in 2024 (npm package created 2024-09-05); the oldest stable release studiocms@0.1.0 is from 2026, which firstRelease follows. The weekly npm figure covers 2026-10-12 to 2026-10-18. Rendering plugins are @studiocms/html, md, mdx, markdoc and wysiwyg, and the getting-started page says at least one must be installed. Dashboard tokens for the REST API are generated in the dashboard, under the API tokens section of the REST API page. Built-in authentication takes a username and password, with an encryption key set in the environment, and oAuth providers come from plugins. File storage uses a no-op manager by default, and the S3 storage plugin is one option. The docs say development mode can show a Vite dependency error for the dashboard.
