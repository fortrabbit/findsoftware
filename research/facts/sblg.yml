notes: >
  The homepage is https and answers 200; it is the project's own site under the BSD.lv project (kristaps.bsd.lv). The README points to it for documentation and releases. The release list has two entries (VERSION_0_6_0 and VERSION_0_6_1); the repository's tags reach back to VERSION_0_5_5 and earlier, so firstRelease is the year of the oldest entry on the project's own version history (0.0.13, 04/12/14), which predates every GitHub release. The repository was created in 2016 (created_at 2016-02-09). The npm package sblg exists under the same author (latest 0.5.12, published 2024-09-24, weekly downloads 3), but the install page names source archives and make install, not npm, so no npm figure is recorded. The homepage's npm link and TypeScript wording describe that package, not the C utility. The maintainer name comes from the LICENSE copyright line; the GitHub profile name is "Kristaps Dz". The homepage describes sblg as a BSD.lv project with mandoc and lowdown as sibling tools; no record is made for them. The archive and the release are static output: the README says it generates static HTML files, Atom feeds and JSON files.
  The README says sblg merges articles into templates, so the merge is stated there rather than in a quoted field.
