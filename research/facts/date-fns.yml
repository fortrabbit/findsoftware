notes: >
  The repository is a pnpm monorepo (pkgs/) and the npm package date-fns is its core package; stars and contributors belong to the monorepo. The root directory has no LICENSE file, so GitHub detects no license; the license is the one in pkgs/core/LICENSE.md, which names "Sasha Koss and Lesha Koss", and the README says "MIT © Sasha Koss". The homepage date-fns.org and its Getting-Started page answer 200 but carry a JavaScript shell with no readable text, so they are listed as unreadable; the homepage is recorded from the GitHub repository field and the docs from the README link. The README says the library is "the most comprehensive, yet simple and consistent toolset", lists "I18n: Dozens of locales", "Native dates", "Immutable & Pure" and "TypeScript" features, and says "It's like Lodash for dates"; the Lodash line is a comparison, not an alternative or switching statement, so alternativeTo is not set. The X link is in the nav of blog.date-fns.org, the blog the README links. The README's "NEW" banner announces time zone support in v4.0; no field. The GitHub release list holds v5.0.0-alpha.0 published 2026-05-29 at 23:45 UTC, twelve minutes after v4.4.0 at 23:33 UTC; latestPrereleaseDate is that alpha date, and currentMajor is 4 from the stable release. The npm figure is the range 2026-10-26 to 2026-11-01; the CSV figure of 57.3k a week is a stale point count. The npm registry's first upload is 0.1.0 on 2014-10-06, the same day as the GitHub repository's creation. The dependent counts come from the ecosyste.ms npm record of the package.
