notes: >
  Proprietary control panel with no public source repository; the CSV's company note is the maintainer, WebPros International GmbH (formerly Plesk International GmbH), a Swiss company; the EULA names WebPros International L.L.C. as the operating entity for cPanel, not Plesk. The about page says that when a user creates a website through the Plesk GUI, Plesk passes the request to Apache or IIS, which is the basis for criterion 1. Installation: the installer script named in the change log is at autoinstall.plesk.com/plesk-installer (the script's own header says plesk-installer and one-click-installer modes); the deployment guide's installer run is the quoted installMethod. The requirements page lists Ubuntu, AlmaLinux, Debian and CloudLinux for Linux, and Windows Server versions for Windows; no field holds operating systems, so none is recorded. runsAs is not recorded: the pages read say Plesk is installed on a server, but none says it runs as a daemon or service process; per notes, not recorded. Paid editions: the pricing page lists Web Admin, Web Pro and Web Host editions as paid subscriptions that differ by domain count and modules, and the only trial is a two-week one; with no free edition, paidEdition is not recorded. currentMajor 18 is the 18.0 line of Plesk Obsidian (the 18.0.82 build number is the release). The changelog lists Plesk Obsidian 18.0.84 with the Social Login deprecation scheduled for January 2027 and Horde Webmail deprecated since 18.0.64; neither ends the product. firstRelease is not stated on the pages read.
