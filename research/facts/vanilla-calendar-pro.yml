notes: >
  The homepage describes the library as a universal JavaScript component with TypeScript support that works with any JavaScript frameworks and libraries without additional dependencies, and its Components for Libraries section lists Angular, React, Vue and Web Component packages. The core is framework-agnostic and the bindings are not recorded as basedOn statements; the bindings are named here only. The README lists browser versions under Browser support (Chrome 57+, Firefox 52+, Edge 80+, Opera 44+, Safari 10.1+); a support list is no statement of where the library runs, so no runsAs value is recorded, and no page says it runs in the browser in those words. The package.json at the repository root is named vanilla-calendar-pro-project and is not the published package, so its node engine is not recorded as a runtime. The homepage footer names Yury Uvarov, the same name as the LICENSE copyright line, and the GitHub owner is a user account. The npm figure is the vanilla-calendar-pro package the install lines name; the npm dependent counts from ecosyste.ms are zero. The npm legacy dist-tag points to 2.9.10 and the beta dist-tag to 3.0.0-beta.34, published 2024-11-06, older than the latest stable release, so no latestPrereleaseDate is recorded. The GitHub repository has no pre-release. firstRelease is 2022, the year of the oldest GitHub release v1.5.5 (published 2022-10-20); the npm package vanilla-calendar-pro first published in 2023 and is not the earliest release of the repository. The install docs name a CDN and an archive download as routes that need no build tools; each is its own installMethod entry. The homepage names no forum, chat or social account. The README calls it a flexible JavaScript date and time picker: one date, several dates or a continuous range can be selected, it shows one month, several months side by side or a compact week, adds a 12- or 24-hour time picker, and can open from an input field.
