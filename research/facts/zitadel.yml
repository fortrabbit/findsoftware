notes: >
  Legal entities: the privacy policy names Zitadel, Inc. with CAOS AG as an affiliate in St. Gallen, Switzerland; the terms of service (last updated 2023) name CAOS Ltd. with a St. Gallen head office. The about and homepage footers give 1 Embarcadero Center, San Francisco. The maintainer follows the privacy policy (last updated 2025-10-23), which names Zitadel, Inc. in San Francisco as the responsible party; the 2023 terms name CAOS Ltd. in St. Gallen, so the Swiss entity is not recorded as maintainer, and a blog post's headquarters sentence is not used for hqCountry. The Linux install guide says it does not work for ZITADEL 4 and points to Docker, so no binary installMethod is recorded. The homepage announces ZITADEL Next as an alpha product; not recorded as a separate record. The tag v5.0.0-base (2026-03-23) is a tag, not a release; currentMajor stays on the highest stable release v4.20.1. The about page states over 10030 GitHub stars and over 250 contributors; the homepage states 4000 stars and 50+ contributors. Only the GitHub API figures are recorded. Commercial add-ons and SLA support sit on the self-hosted page; prices are not recorded. The regions for ZITADEL Cloud are on the cloud page (Europe, ISO 27001 certified center) and are not recorded because the record is a self-hosted-capable software, not a hosted service. The SDK pages and the Ruby, Node, Java examples are not recorded. LinkedIn (linkedin.com/company/zitadel) is a social link with no field. The API styles gRPC and gRPC-web go to notes; REST is recorded as headlessApi. The sso value oauth2 comes from the sentence "OpenID Connect, OAuth 2.0, or SAML"; SCIM 2.0 (preview, per its docs page) and LDAP (as an external identity provider) are separate sso entries. The pricing page renders its plans in JavaScript and yields no features; not recorded.
  Further statements from the pages read: the homepage says the platform is multi-tenant at its core and that it offers modern gRPC and REST APIs; the compose page says the base stack runs the Go API beside a Next.js login UI in front of PostgreSQL; the community edition is named on the self-hosted page as AGPLv3 with support through GitHub and Discord.
  Further statements from the repository README (read on main): PostgreSQL is listed at 14 or newer; ZITADEL Cloud is available in the US, EU, AU and CH regions; the README says ZITADEL Cloud and self-hosted ZITADEL run the same codebase.
  The self-hosted page words the community license 'AGPLv3 (Copyleft)'; LICENSING.md says AGPL-3.0-only.
  LICENSING.md: proto/ and apps/docs/ are Apache 2.0; apps/login (the Next.js login UI), packages/zitadel-client and packages/zitadel-proto are MIT; contributions are accepted under Apache 2.0 without a CLA.
