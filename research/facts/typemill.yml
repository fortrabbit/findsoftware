notes: >
  The maintainer is an individual, Sebastian Schürmanns, named as the owner in the imprint; no company or legal form is given, so hqCountry is not recorded. The imprint address is not copied into the record. GitHub lists JavaScript as the largest language by bytes, but the server side is PHP (composer.json, 746 KB of PHP in the repository), so language is PHP. The default branch is v2.x and the latest release is v2.27.0 (GitHub). The requirements page on the docs site returns 404; the PHP page lists PHP 8.2 to 8.5 and the install page says PHP 8.2 or higher. The news page for version 2.26.0 says "Typemill now requires PHP 8.2–8.5" and that PHP 8.1 is no longer supported. The homepage describes Typemill as actively developed since 2017; the GitHub repository was created in 2017; that is a development start year and not recorded as firstRelease. The paid licenses are priced on the pricing page, which is recorded as a link only; the license page says one license covers a single Typemill instance for one year, the license agreement says it renews automatically every 12 months, and the core stays under the MIT License. The license agreement names Sebastian Schürmanns as licensor and Paddle.com as merchant of record; no field holds them. Forks (74) are not recorded. The docs navigation lists Multi-Language and Multi-Project pages that were not opened, so i18n and multisite are not recorded. The homepage links a Docker Hub image, and the imprint lists YouTube and LinkedIn accounts; none of these has a field.
