notes: >
  VS Code extension, not a website tool: it edits Markdown files in the editor and its README lists Markdown editing commands, table of contents, table formatting, math with KaTeX and front matter. The registry is the VS Code Marketplace (extension "yzhang.markdown-all-in-one"); the install count is a figure in notes only: vscodeInstalls 14845254 on 2026-10-28 (marketplace extensionquery). The marketplace API gives version 3.6.3 published 2025-03-09 and first published 2017-01-05, which the import reads as firstRelease and latestReleaseDate. The repository has no GitHub release; its tags stop at v3.4.0 (2020-11-14), older than the marketplace version, so the marketplace is the release channel. The package.json at the default branch carries version 3.6.3 and engines vscode ^1.77.0. The repository's GitHub homepage field points at the marketplace listing, which is a listing, not the project's own site, so homepage is absent. The maintainer is "Yu Zhang" as the GitHub account and marketplace publisher name state it; the MIT LICENSE copyright line names the author in Chinese characters, which is not transcribed. Criterion 1 is judged by the scope decision recorded in the candidates CSV (tooling in scope 2026-10-19, generic Markdown editing): the extension builds no website itself. The README names no parent software; VS Code is the host it runs in, and no VS Code record exists, so basedOn is not recorded. Contributors count is the page number of the rel="last" link on the contributors endpoint with per_page=1.
