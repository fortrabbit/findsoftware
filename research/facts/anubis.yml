notes: >
  The homepage and docs site return Anubis's own challenge page to the research client, so the docs were read from the docs source in the repository (docs/docs/*.mdx on main). The homepage is taken from the repository's homepage field. Techaro is the company behind Anubis: the homepage reads "Protected by Anubis From Techaro" and "This website is hosted by Techaro", and BotStopper is sold by Techaro (sales@techaro.lol); the LICENSE copyright line names Xe Iaso, so Xe Iaso is the maintainer and Techaro is kept here, with no hqCountry (the homepage says "Made with ❤️ in 🇨🇦", which is not an address). BotStopper is the commercial version: the paidEdition quote is its own statement, and the Sponsors tier is its price, which is not recorded. The docs mark enterprise-only settings with an EO tag (for example CHALLENGE_TITLE and ASSET_LOOKUP_HEADER), which is BotStopper only. Thoth, the hosted GeoIP lookup from Techaro, is described as cancelled and scheduled for removal, so it is not a hostedOffering. The installation page says one Anubis instance per protected service. The releases include prereleases v1.28.0-pre1 to pre3; v1.28.0 is marked prerelease on GitHub even though its name is a stable version, and the latest stable release is v1.28.2 (2026-10-23). The first GitHub release in the list is v1.12.1 (2025-03-19) and the repository was created 2025-03-17. The README says Anubis "is a bit of a nuclear response": a site behind it is blocked from smaller scrapers and may inhibit "good bots" like the Internet Archive, which bot policy definitions can allowlist explicitly. The GitHub contributor count is 194 from the contributors endpoint across pages. The Patreon page and the GitHub Sponsors page are the project's support channels, not recorded as fields. The HTTP Archive technologies file does not list Anubis. The Docker route uses ghcr.io/techarohq/anubis, which is not a Docker Hub image, so no pull count is recorded. The install routes are the native packages (deb, rpm, tarball), the Windows MSI, the Docker image, a Docker Compose example and a Kubernetes sidecar pattern. The environment pages for nginx, caddy, apache, haproxy and traefik show configuration for the reverse proxy in front, not separate installs. Environment variables stay in the docs: BIND, TARGET, DIFFICULTY, SERVE_ROBOTS_TXT and similar are coined kinds left in notes.
