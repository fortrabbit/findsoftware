notes: >
  The npm package named mdx is a different project (a 2015 package by another maintainer) and is not used; the figure is for @mdx-js/mdx, the core package the getting-started page names. The repository is a monorepo of packages (the @mdx-js packages for bundlers and JSX runtimes), so stars and contributors belong to it. The LICENSE copyright line names two holders, Compositor and Vercel, Inc.; the record takes the line as written, and the README license line reads "MIT © Compositor and Vercel". The homepage footer reads MIT © 2017-2026. Bindings for React, Preact and Vue are separate packages (@mdx-js/react, @mdx-js/preact, @mdx-js/vue) named on the getting-started page; the core is framework-agnostic, so no basedOn. The getting-started page says MDX relies on JSX and that any JSX runtime will do. The homepage says MDX has no runtime and compilation happens during the build stage; no runsAs is recorded from that. The first tag is v0.0.1 of 2017-12-24, the same day the repository was created. The Node.js minimum comes from the getting-started page; the package.json at the latest release has no engines field. The support page names GitHub Discussions for questions. The Rust port mdxjs-rs is named on the getting-started page and is not recorded. The getting-started page says MDX is a programming language, that its authors need to be trusted, and that the @mdx-js packages are ESM only. Sponsors named in the README (Vercel, Motif, HashiCorp, GitBook, Gatsby, Netlify and others) are not recorded.
