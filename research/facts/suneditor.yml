notes: >
  SunEditor is a monorepo with the core package suneditor; the React binding @suneditor/suneditor-react is a separate repository (github.com/suneditor/suneditor-react), and the npm figures come from the core package the README install line names. The GitHub license detection is not in the API response; the LICENSE.txt and the README both state MIT. The LICENSE.txt copyright line names Yi JiHong for 2017 to 2025, and the homepage footer names SunEditor Contributors for 2026; the individual named in the license is the recorded maintainer. The homepage shows "NPM Weekly Downloads 2.9M" and "Daily CDN Hits"; those are not the registry figure for the period and are not recorded, the npm range API figure is. The homepage states the browser baseline in a table in the README (Chrome 119 and later and others) and says the editor works with plain JavaScript, React, Vue, Angular, Svelte and Web Components; these are compatibility statements and go here, not into a field. The README table compares SunEditor with headless editor frameworks and names CKEditor for enterprise document workflows; the CKEditor name is ambiguous between the CKEditor 4 and 5 records, so it is not recorded as alternativeTo. The README says the v2-legacy branch is no longer actively maintained; the record describes the v3 line, and the 2.47.12 release on the npm legacy tag is not used for currentMajor. The security section says SunEditor sanitizes HTML on input, paste and Code View; it is recorded here, not as a field. The homepage lists a Sponsor link to Open Collective; not recorded as a field. The README's Community plugins table says plugins are published to npm under the suneditor-plugin naming pattern; no plugin directory page exists, so none is recorded. The homepage links 25+ language pages and the README shows an optional language file.
