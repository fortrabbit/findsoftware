notes: >
  GitHub reports the license as NOASSERTION. The LICENSE file grants MIT for everything outside three named areas: the website directory under CC BY-SA 4.0, the authentik/enterprise directory under a separate license file that was not read, and client-side JavaScript under MIT Expat. The MIT entry therefore covers the core code outside authentik/enterprise only. The pricing page lists an Open Source tier and an Enterprise tier, and the homepage says "Open-source/Source Available", so licenseModel is open-core. The version scheme is calendar-based (2026.8.4), so currentMajor records the 2026.8 line. The pyproject pins Python ==3.14.*. The pricing page shows the Enterprise price per user; the service-account and external-user rates are not recorded.
