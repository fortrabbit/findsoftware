notes: >
  The homepage answers over https with the cloud service; its title names the product. The open-source edition is the project's own code (MIT, LICENSE file) and its docs page (docs/open-source.markdown in the webhooksite/docs repository, published at docs.webhook.site) documents three install routes: Docker, Kubernetes with the helm folder, and a web server with composer; the self-host route is what keeps the record accepted, and the hosted cloud is recorded as hostedOffering. GitHub reports the license as NOASSERTION because the LICENSE file opens with the sentence "Webhook tester is licensed under the MIT License." and no SPDX header; the readme's "MIT-licensed version" wording is the same license. Criterion 1: the readme says it lets users "Receive Webhooks without needing an internet-facing Web server", and the Docker and web-server routes run the app that sites send webhooks to. The cloud Basic, Pro and Enterprise tiers and their features (Custom Actions, Schedules, Databases, CSV export, SAML SSO on Enterprise) are cloud plan features and are no fact of the open-source record; they are not paidEdition under the hosted-plan rule. The repository contains a Laravel 5.4 application (composer.json, app/) and an Angular.js frontend; the readme names Laravel and Angular.js as build tools, and the record takes no basedOn because it is an end-user web app. The docker-compose file requires Redis and laravel-echo-server for realtime updates and uses Redis for cache and queues; Redis is recorded in databases beside SQLite. The compose command runs a queue worker as a daemon; that command flag is not used for runsAs, which rests on the PHP web server route. The latest tag is 1.3 (2023-06-21); the repository was pushed to on 2026-09-25 with no tag since, so the latest release is four years old at most. The first release is 1.0 (2018-04-29); the repository was created 2016-03-21. The terms page names the law of Denmark as governing law, which is not a headquarters statement, and names no legal entity; no hqCountry or legal name is recorded. The X account comes from the docs mkdocs social entry; the readme's @fredsted link is the author's personal account. The API docs (docs/api) and the Custom Actions pages describe the cloud API and are not self-host facts. The alternative-to pages for ngrok and zapier compare the cloud service; their records are not in the research files yet, so only pipedream is recorded. The Docker Hub image webhooksite/webhook.site is named in the compose file and the readme badge. Contributors is the page number of the rel="last" link on the contributors endpoint with per_page=1.
