notes: >
  The npm package named nue is a different project, an async control-flow library by another author, and is not used. The install page names the package nuekit, so registry figures come from nuekit. The npm latest dist-tag points at 2.0.0-beta.2 and the GitHub latest release is v2.0.0-beta, so currentMajor is 2 and latestReleaseDate is the beta date; the project's own pages describe Nue 2.0 as the current version. The getting-started page states that Nue 2.0 is not backwards compatible with 1.0. The build system page says the development server serves files "directly from your source folder" with no build step. The Nueserver page (https://nuejs.org/docs/nueserver) states "Nueserver currently works for local development only", and no page found states that the built output is static files, so runsAs and renderingModes stay unknown. The LICENSE file on the master branch is the source of the license and the copyright holder, and the GitHub API reports the same MIT license.
