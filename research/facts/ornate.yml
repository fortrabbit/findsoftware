notes: >
  The homepage answers over https and the CSV row's http address redirects to it, so the https address is recorded. The GitHub API reports the license as NOASSERTION because LICENSE.txt adds notices for bundled Foundation 6 and Mermaid to the Apache text; only Apache-2.0 is recorded for Ornate; the MIT license belongs to the bundled third-party Foundation 6 part. The manual says Ornate is based on CommonMark, a Markdown specification, and configured with Typesafe Config; neither is recorded as basedOn. The pages say "multi-page HTML sites" without calling the output static files, so renderingModes is not recorded. The running page says "Note: Ornate requires Scala 2.11" while the v0.6 release notes say "Update to Scala 2.12 and sbt 1.x" and build.sbt sets scalaVersion 2.12.8 on master; the conflict is not resolved, so no runtime version is recorded. The oldest GitHub release is v0.2 (2016-10-09); v0.1 exists only as a tag. The last commit on the default branch is 2020-03-25, and the repository is not archived. The sbt plugin page and the command line page are the install and deployment pages read; the Maven artifact is not a registry in the list and has no figure recorded. The project's own site is the manual for version 0.6, and the repository's build.sbt is at version 0.5-SNAPSHOT on master.
