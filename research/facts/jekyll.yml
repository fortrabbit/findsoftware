notes: >
  The latest release, 4.4.1, is from 2025-01-29, inside the 24-month window as of the check date; the repository is still pushed to (2026-10-13). endoflife.date marks cycle 4 as supported and cycle 3 (3.10.0, 2024-06-24) as unsupported but not EOL. The team page lists only emeritus members by first name, so no active maintainer names are recorded. The docs list theme galleries; only the GitHub topic is a non-directory source, and the others (jekyllthemes.org, jekyllthemes.io, jekyll-themes.com, jamstackthemes.dev, jekyllup.com) are third-party. The plugins page links no directory. Coined fields: rubygemsName and rubygemsDownloads (all-time total from the RubyGems API), hostedBy (a platform that runs the software for users, here GitHub Pages). sponsorship points at the repository's GitHub sponsors section, as linked from the homepage. No i18n feature was found in the docs read.
