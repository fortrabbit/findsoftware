notes: >
  The project's site markdown.cebe.cc answers only over plain http (200 on http://markdown.cebe.cc/); the https address fails to connect on 2026-11-04. Under the brief's rule the site is not linked, so homepage is not recorded and the repository is the only project link. The name is the Packagist package cebe/markdown; the README title is "A super fast, highly extensible markdown parser for PHP" and is not quoted because it is a slogan. The README names three flavors (traditional Markdown, GitHub-flavored Markdown, Markdown Extra), which are notes, not a field. The README says Markdown Extra is "currently not fully supported" and WIP, a note for the reader. The README says the project is used by the Yii Framework's API documentation and guide; that is a usage statement, not basedOn. The command line tool bin/markdown is not a runsAs statement. The release history runs 0.9.0 (2014-02-18) to 1.2.1 (2018-03-26), and the last push to the default branch is 2022-10-04. Under AGENTS.md criterion 4 the import moves a record with no release in four years to stub; the status stays accepted here and the reviewer decides. The prerelease 1.0.0-rc (2014-10-10) is older than the latest release, so no latestPrereleaseDate is recorded. The runtimeMin comes from composer.json at tag 1.2.1; the README's "PHP 5.4 or higher" matches it. The packagistDownloads total and monthly figures are from the Packagist package API on 2026-11-04. The GitHub repository has no maintenance or end statement in its README. The PHP library runs inside the host application, so no runsAs is recorded. The README says the parser reads PHPDoc annotations, so PHP opcache must not strip comments, and that it also runs on HHVM; both are kept in prose and notes only. The README lists third-party extensions, linked as pluginDirectory.
