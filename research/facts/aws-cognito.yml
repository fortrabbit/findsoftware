notes: >
  The record covers the Amazon Cognito service only. The CSV row's GitHub repository, aws/aws-sdk-js-v3, is the AWS SDK for JavaScript, which holds the Cognito client among hundreds of service clients; its license, stars and npm figure are not recorded here. The service runs only in AWS, and no page states a way to install or run it outside AWS, so selfHostOption is unknown. Cognito has three pricing tiers, Lite, Essentials and Plus, plus Advanced security features priced on top; the tiers are recorded without prices, and as a hosted plan they give no paidEdition. The compliance statement on the what-is page says the service is compliant with SOC 1-3, PCI DSS, ISO 27001, and is HIPAA-BAA eligible, and that a customer design can be HIPAA-BAA compliant but not PCI DSS; it is not a field. The identity-pool authorization uses role-based and attribute-based access control for AWS resources, which is no userRoles for an app. Identity pools exchange tokens for temporary AWS credentials and are the AWS-access half of the service; user pools are the sign-in half. The docs name a migration path for users held in another directory (Look up users in another directory and migrate them to Amazon Cognito) without naming a product, so importsFrom is unknown. The privacy page gives Amazon Web Services, Inc. as located in the United States, and its Seattle mailing address.
