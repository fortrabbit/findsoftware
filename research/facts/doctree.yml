notes: >
  The repository is archived on GitHub (archived flag true, archived_at 2026-10-11), and it is the repository the README names as the source, so status is discontinued; the README still describes installation and use, and no README or homepage text states the end of the project. The homepage doctree.org in the CSV does not answer a valid TLS connection (self-signed certificate) and is not recorded as homepage; the archived repository outranks the dead homepage, so the status stays discontinued. The releases are date-stamped tags such as release-2022-06-28-418506c, not semantic versions, so currentMajor is not recorded; the 74 tags include v0.1.0. The README lists Go, Python, Zig and Markdown support and says the project is not yet ready for production use. No page names a maintainer: the repository belongs to the sourcegraph GitHub organization and the README only mentions connecting to Sourcegraph, so maintainer is not recorded. The README says doctree can be used through doctree.org with any GitHub repository, a hosted site whose certificate is self-signed. The tool serves library documentation over HTTP, which passes criterion 1; the CSV category ssg was not kept.
