notes: >
  The docs installation page says "You must have NodeJS version 13 or newer" and, in the next line, "As of v0.2.0 you no longer need NodeJS, Go, or any dependency other than Plenti itself"; the later statement is recorded and no Node runtime is set.  The footer reads "© Plentico 2022" and "By Jantcu LLC", so Jantcu LLC is recorded as maintainer and no parent is recorded, since no page says who owns Plentico. The LICENSE copyright line reads "Copyright 2020 Jim Fisk". The remote CMS (cms-setup page) takes a repository, redirect_url and app_id in plenti.json, which points to an OAuth app on the Git host; no field exists for that, so it is left to the prose. The README says the API may change before a stable v1.0.x release. The docs say the Plenti tutorial videos are on a YouTube playlist, which has no field. The Plentico site lists Plentiform as a separate product; it is not recorded. The install page lists a Scoop bucket for Windows but says "Windows is not yet supported", so scoop is not recorded. The Docker image plentico/plenti is used in the GitHub Actions guide (docker://plentico/plenti:latest). The deployTargets names come from the docs sidebar (GitHub Actions, GitLab Pipelines, Gitea Actions); only the GitHub Actions and Gitea Actions pages were read in full, and the GitLab page answers 404 at the guessed address. The build page says the output has HTML fallbacks that allow navigation without JavaScript. The language is Go per the README, while GitHub reports JavaScript. The Svelte basedOn is recorded because the docs say "The templates are based on Svelte". The CSV homepage https://plenti.co answers 200.
