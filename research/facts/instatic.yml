notes: >
  The README says "this is version 0.0.x" and that "APIs and workflows can still shift before 1.0". The README says the MIT license has "No tiers, no open-core asterisks". The README's one-click deploy section links to Railway templates and Render and Docker guides; Railway is a third-party host, not a hosted Instatic service, and the record does not list the referral links. The README says "We're the team behind Motion.page and Core Framework"; the record keeps the LICENSE copyright holder as the maintainer. The README says one Bun server holds the visual canvas editor, content engine, media, auth, forms, plugins and publisher; the editor shows breakpoint frames side by side, and parts of a page can become Visual Components with typed parameters. Pages, posts, components and custom tables share one store, SQLite or Postgres. The homepage says plugin server code runs in a per-plugin worker with a QuickJS interpreter compiled to WebAssembly, reaching the network only through hosts the manifest lists and the owner approves at install. The homepage says Instatic is also an MCP server and has a built-in AI agent. The content API is not described with a style on the pages read, so headlessApi is left out. Two-factor sign-in uses TOTP; that is not a single sign-on field. The package is not on npm, so no registry figures are recorded.
