notes: >
  Core dna is hosted and has no install route; the docs say the repository holds only templates and front-end assets. The Standard Terms and Conditions name Core dna Group Pty Ltd as the owner of the source code it licenses to clients, and that is the maintainer; the privacy and GDPR pages name CORE DNA TECHNOLOGIES Pty Ltd as the company they call "Core dna". The GDPR page gives a Melbourne office address, and the about page lists offices in Melbourne, Boston and Berlin and names no headquarters, so hqCountry is unknown. The developer GraphQL endpoint is described as "a GraphQL-like query rather than full GraphQL" and reads only, so no graphql headlessApi value is recorded. The about page states "Built in 2004" for the platform, which is not a company founding statement, so foundedYear stays unknown. The compare pages for Contentful, Commercetools, Shopify Plus, Spryker and Znode name those products as the subject of a comparison but contain no alternative or switching sentence, so they are not recorded as alternativeTo; the Sitecore and Liferay pages carry the switching wording. The Sitecore page also says "Want to migrate from Sitecore? Switch to Core dna and get support with your migration" with no documented import tool, so importsFrom is left unknown. The pricing page lists a plan tier table with a price on the entry tier, and no price is recorded here; no free tier is stated. The single sign-on page lists Google, Microsoft (Azure AD) and Facebook as external authenticators that Core dna signs users in through over OAuth 2, and no SAML or OIDC is named. The LinkedIn company page and TikTok account are not fields and go to notes only. The site's AI and MCP server pages describe agent features, which are not fields.
