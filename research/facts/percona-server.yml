notes: >
  Lines: the docs list 8.4 (LTS) and 9.7, and the newest release the release-notes docs list is 9.7.2-2 (2026-09-28), so latestReleaseDate and currentMajor follow it. A tag line 26.7 (Percona-Server-26.7.0-1, commit 2026-10-13) has no release notes page and is not recorded; GitHub has no releases after 2017. The GitHub license field is NOASSERTION; the README names GPLv2 and LICENSE is the MySQL Community license text with Percona's additional permissions, so one entry covers both wordings. The product page says it is a drop-in replacement for MySQL CE, which is recorded as alternativeTo; no page says it is a fork, so forkOf stays out. The privacy page gives the postal address "PO Box 1126, Durham, NC 27702-1126, USA" for Percona LLC, so hqCountry rests on a PO box address that names the country. The Percona Support subscriptions are paid support, not an edition, so paidEdition stays out. The CSV row's build number (8.0.46-39) is not a tag in the repository; the tag is Percona-Server-8.0.46-37. The endoflife.date product for Percona Server is absent. The x link is the company account listed on the product page, not one for the software alone. The 9.7 release notes list OpenID Connect authentication, which signs database clients in and is no sign-in to an admin interface, so sso is not recorded.
