notes: >
  Name: the README title and the GitHub description give "Zenko CloudServer"; the homepage calls the product CloudServer, formerly Scality S3 Server, which the README names as its earlier name. The README install section says node.js 10.x and yarn v1.17.x, while package.json at tag 9.5.2 sets engines node >=24; runtimeMin follows the manifest and the README is stale. The install guide names git clone and yarn, not an npm package; no npm figure is recorded. The Docker image the README links is zenko/cloudserver, whose Docker Hub last_updated date is 2023-01-10; the README pull badge counts scality/s3server (6467292 pulls on 2026-11-03), which is not recorded. Metadata and data stay in local directories or the in-memory backend in the README; multiple backends and the Vault user management need Vault, which the README calls proprietary and separate, a dependency to read before choosing it. The sibling products Zenko Orbit and METALK8S are not recorded. The S3 API is the protocol the software speaks; apiStyles is a coined field and is not recorded. The homepage says the S3 API is what applications integrate with, so the S3 endpoint is the wiring into an app (criterion 1). The x link is from the README badge only, so no quote. The Docker Hub figure is from zenko/cloudserver, the image the README links. The community edition keeps metadata through the data-metadata daemon (LevelDB per the architecture page); package.json scripts also set S3METADATA=mongodb and depend on the mongodb driver, but no page read states MongoDB as a supported store, so it is not recorded. The README says CloudServer is useful in a CI test environment to emulate S3 locally,hence the second runsAs entry. The first tag, 0.0.1-testing, dates from 2016-06-01.
  Further statements from the pages read: the README starts the server with a file backend, an in-memory backend, multiple data backends where a PUT header with a location constraint picks the backend per object, or Vault for user management; the homepage calls CloudServer the core of Zenko, the multi-cloud data controller Scality describes.
