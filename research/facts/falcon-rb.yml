notes: >
  Falcon's homepage states it is "built on top of" the async gems, all by the same maintainer, so basedOn is left out. Priority business support sold through socketry.io is a support agreement, not an edition. The gemspec at tag v0.57.0 sets required_ruby_version to 3.3, and the record takes runtimeMin from it. The RubyGems gem named falcon has 175 versions; its oldest upload (0.1.0, 2011-05-18) is "Background video encoding" by other authors and is not this project, so firstRelease is the 0.2.0 upload of 2017-06-15, the same day the repository was created. The stable line is 0.x: currentMajor records 0 for v0.57.0, and the minor line stays in notes. The Ruby falcon gem's downloads figure counts all versions and all releases of the gem name, which is this project from 0.2.0 onward. No social or forum link appears on the homepage or the getting-started page. The GitHub API reports the license as "MIT" and license.md is headed "MIT License", the same license in two wordings. The gem's authors list names 30 people; the LICENSE copyright line names Samuel Williams as the maintainer.
