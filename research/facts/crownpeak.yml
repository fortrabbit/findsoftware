notes: >
  Stub because the product identity is in doubt: crownpeak.com redirects to rezolve.com and the Crownpeak CMS is now sold as FirstSpirit, a Rezolve solution, with no page serving the Crownpeak product itself; a live Crownpeak product page, or a decision to record FirstSpirit under its own name, would settle it. Hosted service otherwise: the firstspirit.com legal page calls Crownpeak "an established SaaS provider", the product pages describe "a Decoupled, Scalable, and Secure SaaS Platform", and no installation or deployment page of the CMS itself exists or was readable (crownpeak.com redirects to rezolve.com and answers 403 to this client). A public install or self-hosting page would move it back to the register. The product site is firstspirit.com ("FirstSpirit, a Rezolve solution"); crownpeak.com is not linked as homepage because it does not serve the product. The same candidate appears as Crownpeak and Crownpeak DXM; the DXM line is documented at docs.crownpeak.com. The GitHub organization Crownpeak holds SDKs, examples and connectors (for example DXM-SDK-Core, MIT, last pushed 2023-07-14); none of them is the product, so no repository, license or star figure is recorded. The privacy notice names Crownpeak Technology, Inc. as controller with a privacy department address in Denver, and the imprint names Crownpeak Technology GmbH, Dortmund, as operator of firstspirit.com, so no single headquarters country is recorded.
