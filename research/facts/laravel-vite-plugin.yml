notes: >
  The package has no homepage of its own: the repository homepage field and the docs both point to laravel.com/docs/vite, so that page is recorded as docs only. The docs give Node.js "(16+)" as the requirement; the v3.2.0 package.json engines field reads "^20.19.0 || >=22.12.0", and runtimeMin takes that manifest value as node 20. The plugin is installed as an npm dependency of a Laravel application; the installMethod quote is the devDependencies line in the laravel/laravel 13.x package.json, and the docs say the default package.json already includes the plugin. The docs show "dev" and "build" runs of Vite; only the dev server is quoted as local. The LICENSE copyright names Taylor Otwell and the package.json author is "Laravel"; the company behind Laravel is not recorded as maintainer. The npm weekly figure covers 2026-09-28 to 2026-10-04.
