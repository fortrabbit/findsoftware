notes: >
  Boundary ruling: wow.js is a CSS scroll-reveal library that runs in the page, not a framework, so it is accepted under criterion 1 as an animation library. Status is discontinued on the npm deprecation flag: every published version of wow.js (1.1.2 to 1.2.2) carries the message "deprecated in favour of aos (Animate On Scroll)", and aos is a different project, not a new home of WOW.js. The README opens with "wow.js is temporarily deprecated in favour of AOS (Animate on Scroll). Feel free to ignore the warning if you can't use AOS." and lists plans for a 3.0 that are not a release; the repository itself is not archived. No page states where the library runs, so runsAs is absent. The original project is Matthieu Aussaguel's WOW; this repository is a fork of mattdelacdev/WOW that the README says was forked "to remain under the MIT license", and the fork's name is not a record id, so forkOf is left out. The unscoped npm package wowjs (matthieua/WOW) is a different package and is not counted. npm weekly downloads cover 2026-11-01 to 2026-11-07 (the range API). The GitHub repository has no release objects; the registry's latest stable version gives latestReleaseDate, and the repository tag 1.3.0 is not on npm. The Bower package wow-mit points to this repository per the Bower registry and is its own installMethod. The docs' script tag route appears only in code blocks and is not recorded as installMethod. The LICENSE copyright line names Thomas Grainger, who the README also names as the fork's maintainer. The category "scroll" is from the README sentence on scrolling.
