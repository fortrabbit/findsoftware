notes: >
  The record's status is accepted per the candidate row. The README at the 0.12.0 release lists a status checklist and says the project is "currently in the public beta stage"; that is a stage statement, not an end signal. Mathesar's version is 0.12.0 (GitHub release 2026-07-02); the 0.x line has no major number, so currentMajor is 0, and the minor line stays in notes. The newest prerelease on GitHub is 0.2.0-testing.1 (2024-10-15), older than the latest release, so latestPrereleaseDate is not recorded. The language field records python because the backend and the runtime are Python; GitHub reports Svelte as the primary language of the repository, a value the vocabulary does not hold. The Mathesar Foundation is the maintainer; the privacy policy at mathesar.org/privacy is issued by "Center of Complex Interventions, Inc.", Wellesley, Massachusetts, which the policy names as the Company. That entity is not the recorded maintainer and is not recorded as a fact; a reviewer should decide whether it belongs with the Foundation. The mathesar.cloud page places the Foundation as "a US-based nonprofit"; hqCountry follows that statement. The docs reference the MinIO and S3-compatible file storage backends (AGPLv3 for MinIO), which are third-party software and are not recorded. The Mathesar Foundation also lists a LinkedIn account on the homepage, which has no field. The install path documents the Docker image mathesar/mathesar as the local test install; the same image name is recorded as dockerPulls. Fields coined here: none. The API docs say Mathesar has a JSON-RPC API that is built for its front end and is not yet stable; it is not recorded as headlessApi. The version support page tabulates Python and PostgreSQL ranges only up to the 0.9.x line, so runtimeMin is not recorded. Community chat is on Matrix and the README lists mailing lists, neither of which has a field.
