notes: >
  The repository atomiks/tippyjs, which the README names as its source (the LICENSE link and the GitHub repository on the homepage), is archived on GitHub as of 2026-11-16 (archived: true in the repository API); this is the end signal. The README and the homepage carry no end, successor or move statement, so no successor is named. The npm latest 6.3.7 (published 2021-11-10) is not deprecated. The latest stable tag is v6.3.7 with a GitHub release object on 2021-11-10; the oldest registry upload is 0.1.9 on 2017-04-05, which sets firstRelease. The React wrapper @tippyjs/react is named by the README as official, and the Ember wrapper ember-tippy as unofficial; neither is basedOn, and neither is a record here. The README gives no runtime or runsAs sentence, so no runsAs is recorded; the docs say the library positions an element "next to a target element" without naming where it runs. The category tooltip has no mapping in the import, so the record uses ui-library. The npm figure counts the package tippy.js, which the README installs. The CSV row's discontinued ruling is confirmed by the archived flag.
