notes: >
  Doubt: the record's newest GitHub release is 2020-07-31 and its default branch was last committed on 2023-02-01, so the import will move it to stub under the four-year rule unless a newer release or a statement from the project settles it. The README's "New version alert" points to the next branch for coast v1.0; that is a pending successor on a branch, not an end signal, so no successor is recorded. The homepage coast.swlkr.com is the project's own site and the README links the Gitter channel and the docs. The Clojars artifact coast/coast (0.6.9, 3818 total downloads) is a different, older artifact with its own homepage at coastonclojure.com and is not recorded. The Clojars figure is the total downloads of coast-framework/coast.theta at the time of the query, the coordinates pom.xml names. The README names Java as a requirement for the Linux install; it does not state a Java version, so runtimeMin is not recorded. The README shows a coast/server call and a local dev server, which does not state how a live site is hosted, so runsAs is not recorded. Contributors are counted across all pages, and the commit date of the default branch is recorded only in notes.
