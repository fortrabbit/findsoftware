notes: >
  Criterion 1 holds through the project's own pages: the README says Typebot lets you "embed them anywhere on your web/mobile apps", lists the native JS library embed (container, popup, chat bubble) and "easy-to-use APIs". Licensing conflicts: the README body and the LICENSE file (at main and at tag v3.19.1) state the Functional Source License (FSL-1.1-Apache-2.0), and the self-hosting license requirements page says the same; the README badge reads AGPLv3.  The FSL converts to Apache 2.0 after two years: the self-hosting page says "After two years it becomes permissive Open Source software under Apache 2.0." The FSL bars a Competing Use (a product that substitutes for Typebot or its hosted service), per the LICENSE text and the self-hosting FAQ. The maintainer is Typebot SASU, the controller named in the privacy policy, which gives no address or country, so hqCountry is unknown; the LICENSE copyright line reads "Typebot". The README badge reads AGPLv3 but is stale: LICENSE and the README text state the Functional Source License, so the badge is not a license entry. Self-hosting: the stack is two Next.js applications, the builder and the viewer; the manual route needs Node.js 24.x, bun, Nginx and PM2, and runtimeMin is not recorded because the Docker image bundles its runtime. Self-hosted releases come once a month according to the self-hosting page. Hosted cloud: the pricing page lists Free, Starter, Pro and Enterprise plans; SSO and granular access rights are named on the Enterprise plan, and the data location is EU-owned infrastructure per the self-hosting page's cloud section; these are cloud features and are not recorded on the self-hosted record. Self-hosted login options: the Docker page asks for at least one provider (Email, Google, GitHub, Facebook or GitLab) and the configuration page lists GitHub, Google, Azure AD and a custom OAuth provider; these are login providers, not SSO protocols, so sso is unknown. The docker-hub figure is the builder image; the viewer image (baptistearno/typebot-viewer) had 1378213 pulls on the same date. The LinkedIn link (linkedin.com/company/typebot) is a coined social field and is recorded in notes only. The README lists exporting results to CSV and drop-off and completion analytics. The Docker route runs docker-compose up -d and serves the builder on port 8080 and the viewer on port 8081. The Vercel route deploys the builder and the viewer as two Vercel projects, each imported from a fork of the repository. The API reference lives at docs.typebot.com/api-reference, and the self-hosting guides include an S3 storage configuration. The homepage at typebot.io redirects to typebot.com, so the final URL is recorded. The terms and privacy URLs on typebot.com return 404; the footer links to /terms-of-service and /privacy-policy were read instead.
