notes: >
  Monorepo: the repository holds the codegen CLI, its plugins and presets, so the stars and contributors belong to the monorepo, and the npm figure is for @graphql-codegen/cli, the package the installation page names. The GitHub release that is the latest (2026-11-07) names @graphql-codegen/cli@8.0.0 in its body; the npm latest tag is the same version. The npm alpha tag (8.0.0-alpha, 2026-11-07) is older than the stable release and is not recorded as a prerelease. The npm package graphql-code-generator is a separate, stale package (latest 0.18.2, 2019) and is not the install target. The homepage says "85M Weekly npm downloads" and "53+ Plugins and presets"; both are the vendor's own claims, not registry figures, and are not recorded. The homepage says the tool is "Part of the Hive ecosystem by The Guild" and the LICENSE names Dotan Simha, so Dotan Simha is the maintainer and The Guild is the parent; The Guild's legal entity and country are not recorded. The footer of the project's page links Discord, X, LinkedIn and YouTube of The Guild; the Discord, X and YouTube links are recorded as The Guild's accounts, and LinkedIn is not. The engines field in the npm latest version and the 8.0.0 release notes both set Node.js 22.18.0 as the lowest supported version. The GitHub release body also names the minimum graphql peer dependency (16 or 17), which is a dependency, not a runtime, and is not recorded. The docs say the tool loads plugins with require and can break under hoisting in monorepos; runsAs local rests on the homepage sentence about one command in development and CI.
