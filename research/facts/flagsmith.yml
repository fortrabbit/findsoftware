notes: >
  The npm package flagsmith is deprecated with the message that it moved to @flagsmith/flagsmith; a move is not an end, so status stays accepted and npmName records the new package. The npm package is the JavaScript client; the server is the Python/Django API in the repository. The docs describe a cloud and a private cloud deployment alongside self-hosting; these are hosted options of the same software, and the cloud regions and API limits were not read. Enterprise Edition requires a valid Flagsmith Enterprise license; the README says the core functionality is open. The API is written in Django and the Django REST Framework; the dashboard is Node.js and React (Docker guide). Versions: the release tag v2.286.0 is the platform release; api/pyproject.toml still says 2.68.0 at that tag, so the pyproject version is not the release version. pypiName is the Python SDK package, its download counts are not in the PyPI API and were not recorded. The docs copyright names Bullet Train Ltd., and no page gives the company's headquarters. Discord and X links are from the docs homepage.
