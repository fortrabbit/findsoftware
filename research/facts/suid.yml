notes: >
  The repository is a monorepo: the root readme names npm init suid, which runs the create-suid scaffolder, so the core package is @suid/material, the one the package readme installs with npm install @suid/material. The suid.dev pages return only a script shell with no text, so the docs are unread and the homepage is recorded as the address the readme and package metadata give; the shell's meta description repeats the package description. The readme says "SUID is all a set of utils and components ported from MUI Core 5.5.0"; MUI is a port source, not a runtime parent, so it is not recorded as basedOn. The package.json peer dependency solid-js ^1.9.7 is a dependency, not a basedOn statement. The root readme's Node.js v22 and pnpm v10 requirements apply to working on the repository, not to a user's site, so no runtime is recorded. The ROADMAP.md lists component porting progress and states no end. The newest GitHub release of @suid/material is 0.18.0 (2024-09-17), while npm latest is 0.19.0 (2025-06-14) with no GitHub release; both are major 0. The repository was last pushed 2025-07-05. The maintainer is the individual named in the LICENSE copyright line; the repository owner is the swordev organization.
