notes: >
  The project's site wok.mythmon.com answers only over TLS with an expired certificate (http redirects to the same host), so no homepage is recorded and the site is listed as unreadable; the README links its documentation to the same host. The GitHub repository mythmon/wok is archived (read 2026-10-23, last push 2017-07-18), and the README names it as the project's home through its Travis and wiki links, which is the discontinued signal. Under AGENTS.md a dead project site also makes a record a stub, so the reviewer should decide between discontinued and stub; this file keeps discontinued because the archived repository is the project's own source. The README install line is `sudo pip install wok`, but the PyPI project named wok is a different package (its summary is a tool to manage several git repos, latest version 0.1.0.dev1 from 2020), so no pypiName or pypiDownloads is recorded; the install recorded is setup.py from the repository, which the README documents. The GitHub releases list holds v1.1.1 and v1.1.0 (both 2014-04-30, stable) and v1.0.0b and v0.9 (prereleases), so the stable major is 1 and the oldest release year is 2014. The maintainer is the author named in setup.py. The README calls the output plain HTML generated ahead of time, which is recorded as static output; the development server (wok --server) is recorded as local.
