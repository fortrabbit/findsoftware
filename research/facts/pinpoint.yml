notes: >
  The CSV row names the gitbook docs site as homepage; the project's own site is pinpoint-apm.github.io/pinpoint/, which the GitHub organization profile links, and the gitbook is recorded as docs. The current release is v4.0.0 (2026-10-28), newer than the CSV row's v3.1.1 date. The NOTICE file names NAVER Corp. as the copyright holder; the NAVER organization profile on GitHub gives its location as the Republic of Korea, and navercorp.com footers read "©NAVER CORP." with no address or country on the pages read, so the country comes from the GitHub profile. The README compatibility table lists Java 17 for the Collector and the Web at 4.0.x (Agent 8 to 25); the 4.0.x row is the stated Java requirement and is recorded as runtimeMin. The Install with Docker page (getting-started/docker) points to the pinpoint-docker repository; the Docker installMethod comes from the quick-start guide, which points to the pinpoint-docker repository, and the Docker Hub pull count is not recorded. The README also has a section "Deploying Pinpoint to Kubernetes" linking the pinpoint-kubernetes repository; The README links pinpoint-apm/pinpoint-kubernetes, the org's Helm chart (chart 3.1.7 deploys Pinpoint 3.1.1 at the time of reading). The install page's build requirements (JDK 8, 11 and 17 for a source build) are a build requirement, not a runtime one. The Pinpoint Agent is a Java agent attached to an application with -javaagent and reports to the collector over the gRPC ports the install page lists; the PHP and Python agents are in the separate pinpoint-c-agent repository, named in the README, and are not recorded. Other dependencies named on the install page are ZooKeeper (service discovery and routing between components) and Kafka (for Pinot stream ingestion); they are not recorded as databases. Pinpoint Web keeps alarm and Web configuration in MySQL. The web interface is Pinpoint Web, which the install page describes only as a web component; no adminUi statement was quoted, so none is recorded. The project's site lists a Twitter account and a YouTube video; no other social link was recorded. The live demo at a numeric IP address and the Gitter chat and QQ or DingTalk groups are not recorded. The GitHub contributors count comes from the last page of the per_page=1 listing (125).
