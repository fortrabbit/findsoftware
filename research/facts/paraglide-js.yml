notes: >
  The repository moved from opral/paraglide-js (the discovery row and the README badges) to generaltranslation/paraglide-js; GitHub redirects the old name and the npm repository field names the new one, so the new name is recorded, and the LICENSE copyright line names Opral US Inc. The README's Quick Start says "@inlang/paraglide-js is on v2", while the npm latest tag is 3.2.2 (2026-11-10) and the repository has no GitHub release; currentMajor is 3 from the registry, and the README sentence is out of date. The npm package is @inlang/paraglide-js, and the install command names it through npx; the framework adapters (@inlang/paraglide-js-react, -svelte, -vue, -solid) are separate npm packages and are not counted. Framework support is stated as framework-agnostic: the README names React, TanStack Start, SvelteKit, React Router, Astro, Vue, Solid and vanilla JavaScript or TypeScript, and no framework is the parent, so basedOn is empty. The README says Paraglide is built on inlang, the open project file format; inlang is not a record. The runtime node comes from the architecture page, which names Node.js and the browser alike, so no runsAs value is recorded. The comparison page names i18next and React Intl, which is the FormatJS record, and the React library chooser page names Lingui; react-i18next is named on the same pages and is researched in a later wave. General Translation is recommended in the README for translating message files; it is a separate hosted service, not a hosted offering or paid edition of Paraglide. The repository holds the core package at its root and the framework adapters under framework/, so stars and contributors belong to the repository as a whole. The root package.json names "inlang" as author. The ecosyste.ms figures are for @inlang/paraglide-js. The README's "Used in production by" logos are not recorded.
