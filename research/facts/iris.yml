notes: >
  The README News section says the v14 major is coming on a new import path; v12 stays the highest stable release and currentMajor stays 12, since a named successor alone is no end signal. The highest stable GitHub release is v12.2.11 (2024-04-24). The installation page and the About page say Go 1.21 or later, the homepage structured data says "Go 1.23+" and the go.mod at v12.2.11 says go 1.22; the installation page statement is recorded (the About page repeats it), and the other two stay here since the structured data is not visible page text. The README says v12 keeps working and keeps getting fixes. The maintainer is the copyright holder named in the LICENSE file. The About page names Hellenic Development as the company that created and maintains Iris, recorded as parent. The x link is the project's Twitter account from the Support page; the maintainer's personal account linked in the homepage navigation is not recorded. The chat link (chat.iris-go.com, a coined field) is not recorded as a fact, and the README also badges a Gitter room. The View/Templates docs list HTML, Django and Pug engines. The i18n docs describe translated strings and pluralization in the Iris i18n module, recorded as yes. The About page says the framework was first released in 2016, which sets firstRelease; the oldest GitHub release is the prerelease v12.0.0 (2019-10-26). The homepage body text does not hold quotable statements beyond its title and navigation, so the homepage facts are cited to those. No pricing, paid edition or sponsor page was found.
