notes: >
  OpenLiteSpeed is the open source edition of LiteSpeed Web Server Enterprise (LSWS), per the homepage; the Enterprise pages name LSWS features OLS lacks, among them ESI, asynchronous SSL handshake, built-in WordPress brute force protection, and a proprietary ModSecurity engine, and the LiteSpeed Web Server product page names Free Starter, Site Owner and Web Host licenses without prices, so the paid tiers are under the license Enterprise requires. The license is GPL-3.0 as GitHub reports it; the Enterprise page and the README word it as GPLv3, one entry. The homepage says OLS is free under GPLv3 and that proprietary use needs an OEM license, which is not a separate edition and is not recorded. The maintainer's legal name is LiteSpeed Technologies Inc., per the homepage footer and the Enterprise page address (18 Campus Blvd. Suite 100, Newtown Square, PA 19073 USA). The GitHub organization litespeedtech is a user account (type User). The GitHub API lists 146 stable releases; the oldest is v1.0.4 (2013-07-11), the same day the repository was created, so firstRelease is 2013. The release line is 1.9.x; currentMajor is 1 from v1.9.4. The Docker Hub image litespeedtech/openlitespeed is the one the Docker install page links; the pull count is from the Docker Hub API. The docs installation index names a Cloud Image and a Script alongside the repository and Docker routes; the one-click installer is recorded from the homepage wording. The homepage header links X, Facebook, a Google Group, a forum and LinkedIn; LinkedIn has no field and is left in notes. The README names a Google Group for development discussion, not recorded as forum. The Docker install page was read for the Docker Hub link; the Docker Hub URL is recorded as the repository page. LiteSpeed Enterprise is a separate product with its own record (litespeed-enterprise), not an edition of OpenLiteSpeed, so no paidEdition is recorded. The community pages also link a Slack workspace, not recorded.
