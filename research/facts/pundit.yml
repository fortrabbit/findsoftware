notes: >
  The repository has no homepage of its own; the README links the rubydoc API documentation and the GitHub source, so homepage is absent. The maintainer is Varvet AB: the README says "Pundit is built and maintained by Varvet", and the LICENSE.txt copyright line reads "Copyright (c) 2019 Jonas Nicklas, Varvet AB", which gives the legal form; the varvet.com footer ("Varvet AB · Org.nr 559243-1869 · Sweden") names the country, the source for hqCountry. The README says the package is built and maintained by Varvet, a digital product studio in Sweden, and that Jonas Nicklas first released it in 2012; the first release year 2012 comes from the rubygems version list (0.1.0, 2012-11-19), and the GitHub repository was created 2012-11-04. The GitHub repository has no releases; its 22 tags are the release history, and v2.5.2 (rubygems 2.5.2, created 2025-09-24) is the newest stable version, so currentMajor is 2. The gemspec declares no required_ruby_version and the RubyGems entry has none, so runtimeMin is absent. The gemspec description reads "Object oriented authorization for Rails applications" (RubyGems shows it as the gem's info), recorded as basedOn rails, a sentence naming the target framework; the README's generator and Rails controller examples are Rails-specific. The README's Rails section says "Over 100 million downloads, used by 38,000+ repositories on GitHub", recorded as stated under reportedInstalls. The CHANGELOG says Ruby 3.0 support was dropped, which names no minimum, so runtimeMin stays absent. The README names Flask-Pundit as a separate Python project "heavily inspired by" Pundit; that is inspiration, not alternativeTo. The README's "Migrating to Pundit from CanCan" entry is a link label to a third-party post under External Resources, not a sentence of the project, so no importsFrom or alternativeTo is recorded from it. The README's I18n mention concerns error messages in Rails apps, not a Pundit translation feature. The ecosyste.ms rubygems figures are the dependents recorded above. The 116351589 total is the RubyGems downloads field; the stated version downloads are not recorded.
