notes: >
  The npm package create-zudoku is the scaffolder that the install command runs; the registry figures are taken from the core package zudoku, which the scaffolder installs. The quickstart states Node.js 22.12.0+ (or 20.19+), while the engines of the latest release say node >=22.22.0; runtimeMin records the major of the engines value, the stricter of the two. The deployment page names Zuplo, Cloudflare Pages, GitHub Pages, Vercel, Apache and Nginx, and upload or FTP as deployment targets, and mentions SSR deployments only in the context of Markdown content negotiation. The npm license field is empty while the GitHub API reports MIT. The Zuplo, Inc. copyright line sits in LICENSE.md at the repository root; maintainerType is left to the import.
