notes: >
  The npm package laravel-echo and the GitHub repository laravel/echo are the two identifiers; the npm homepage points to packages/laravel-echo inside the repository, so laravel/echo is a monorepo and its stars and contributors belong to the whole repository. The default branch is 2.x; the highest stable release is v2.6.3 published 2026-10-27, which matches the npm latest version, so currentMajor is 2. The npm manifest's engines field asks for Node.js ^20.19.0 or >=22.12.0; that is a build requirement for a library that runs in the browser, so no runtime is recorded. The docs say that event broadcasting is accomplished by a server-side broadcasting driver, so that Echo "can receive them within the browser client", the runsAs browser value; the server side is Laravel's own broadcasting, not a process Echo starts. The docs name four broadcasting drivers, Laravel Reverb, Pusher Channels, Ably and Mercure, and the repository description names Reverb, Pusher and Ably; the drivers are notes, not fields. The docs note that Ably maintains its own broadcaster and Echo client, which the Laravel page recommends over the Pusher compatibility mode it documents. The npm package description names Pusher, Socket.IO and Mercure, while the repository description names Reverb, Pusher and Ably; the two descriptions disagree and the repository's is the one the GitHub API returns. The docs install route is npm with pusher-js as a companion package, which is not recorded as an installMethod. The docs also name the Echo framework bindings @laravel/echo-react, @laravel/echo-vue and @laravel/echo-svelte, which are separate npm packages not recorded here. basedOn Laravel is not recorded: the docs call Echo a JavaScript library that receives Laravel's events, and no sentence calls it a binding or plugin of Laravel. The maintainer is the copyright holder in LICENSE.md, Taylor Otwell. The npm weekly figure is the sum of the daily downloads for 2026-11-01 to 2026-11-07 from the npm range endpoint, and the CSV's 437.6k figure came from an earlier window. The ecosyste.ms dependent counts are for the npm package laravel-echo. firstRelease 2016 comes from the npm upload 0.0.1 dated 2016-04-30, the day the repository was created. The category is library because the docs call Echo a JavaScript library; realtime would map to the backend category, which is the server side that Echo only listens to.
