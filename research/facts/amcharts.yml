notes: >
  The GitHub API reports NOASSERTION for the license because the LICENSE file is a custom text, so the two license entries come from the file. The free license permits use in any project including commercial ones, requires that the branding link is not removed, and forbids use without built-in attribution (logo). The commercial licenses on the license page (Basic, SaaS, OEM, Extended OEM) are sold for usage scenarios the free license does not cover, and the download page says a paid license removes the logo; they change usage rights and branding, not features, so no paidEdition is recorded. A reviewer should confirm that reading. licenseModel is left to the import, which derives it from both license statements. The maintainer follows the LICENSE copyright line; the about page says the company is based in Vilnius, Lithuania, and names Antanas Marcelionis as its founder, but no legal entity name is stated on the terms or privacy pages. hqCountry comes from the site footer address, which carries a Lithuanian street address under the amCharts copyright line; the terms name Antanas Marcelionis as the supplier "amCharts", the same party as the maintainer. The imprint page is a 404 and the contact page is a 404. Framework integrations (React, Vue, Angular, Svelte, React Native, Next.js and others) are listed on the getting-started page; they are official integration pages for the core library, so no basedOn is recorded. The repository is a monorepo: its GitHub releases include sibling tags such as vue-5.0.2 and svelte-5.0.3 for other packages; the core package is @amcharts/amcharts5, named by the install guide, and the stars and contributors belong to the monorepo. Contributors excludes anonymous contributors. npmWeeklyDownloads is the sum of the daily counts for 2026-10-26 to 2026-11-01. The CSV figure of 188.5k per week predates this window. The dependent figures come from ecosyste.ms on the same date. No runsAs is recorded: the docs load the files with script tags but no page states that the library runs in the browser. The online tools (Chart Maker, SVG Map Generator and others) are separate products and are not part of this record.
