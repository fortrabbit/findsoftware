notes: >
  The CSV homepage is the GitHub Pages address, which only redirects to the Google Fonts guide, so the homepage is the Google Fonts icon library that the README names for browsing. The repository has no language; it holds SVG, font and PNG files. The README says Google does not maintain the npm package for this repository past v3 (2016) and names only third-party npm packages (marella's material-symbols, material-icons and the @material-design-icons scope), which Google does not vet. The install docs name no npm package, so no npm figure is recorded. The registry also holds a material-design-icons package whose latest version is 3.0.1 (2016-09-02); it is not named by the install docs and is not used. The README says Material Icons, the classic set, has had no updates since 2022, while Material Symbols is the current set. The latest GitHub release is 4.0.0 (2020-08-31) and the repository was last pushed on 2026-10-23. Four years without a release moves the record to stub at import by the release rule; the status is left as accepted for a reviewer to decide. The README recommends the web font hosted on Google Fonts and also offers pre-generated font files in the repository to include in a project, each its own installMethod entry. The Google Fonts guide for Material Symbols also describes SVG and PNG downloads and a Git repository; those are not recorded as installMethod.
