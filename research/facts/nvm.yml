notes: >
  Boundary row settled in for this wave: a runtime version manager is a developer tool, runsAs local. The repository has no project website; the README is the documentation, so no homepage. Copyright lines disagree: LICENSE.md names Tim Caswell (2010) and Jordan Harband (2014), and the README says "Copyright OpenJS Foundation and nvm contributors"; the README names the sole maintainer as @ljharb, and the GitHub profile of ljharb has the name Jordan Harband (api users/ljharb, recorded as a maintainer fact). The maintainer field takes the LICENSE line; the README's copyright notice line "Copyright OpenJS Foundation and nvm contributors" is not recorded as maintainer or parent. The README's Enterprise Support section names HeroDevs, a third party, and is not recorded. firstRelease is the year of the commit tagged v0.0.1 (2010-04-20, api); the oldest GitHub release is v0.20.0 (2014-12-22). The LICENSE.md line "Copyright (c) 2010 Tim Caswell" is consistent with that year. The language Shell is not in the language vocabulary, so it is dropped on import. Requirements stated by the README: a POSIX-compliant shell (sh, dash, ksh, zsh, bash) on unix, macOS or Windows WSL, git v1.7.10+ for the git install, and a C++ compiler when Node.js is built from source; none is a runtime value. The README says Homebrew installation is not supported and that Fish is not supported. Fields coined here: none.
