notes: >
  flagd is the daemon in the open-feature/flagd monorepo, which also tags core/ (the Go library) and flagd-proxy/ releases. The record follows the flagd/ tags: the highest stable tag is flagd/v0.18.2 (2026-10-28), so currentMajor is 0, and the 0.18 line goes here, not in the field. The install docs name the binary and the ghcr.io image, which is not Docker Hub, so no dockerPulls figure is recorded. The Go module install (go install github.com/open-feature/flagd/flagd@latest) is not recommended by the installation page and is not an install route. The architecture page describes RPC and in-process evaluation; the homepage says flagd runs as a separate process or inside the application. The maintainer is taken as OpenFeature, the project flagd belongs to; openfeature.dev calls it a CNCF incubating project; the CNCF incubation is hosting, so maintainerType is community. The docs say flagd has no UI or persistence layer, so databases and contentStore are not recorded. There is no published npm, PyPI or Packagist package for the daemon, so no registry figure is recorded. Stars and contributors are as read on 2026-11-03.
