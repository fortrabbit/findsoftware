notes: >
  Operating systems: the homepage offers "Download for Windows" and a macOS version ("Herd for macOS"); the FAQ says "We're working on bringing Herd to Linux, but it's not ready to ship just yet." The product is by Beyond Code GmbH: the homepage footer says "Herd is a product by Beyond Code in partnership with Laravel", so Laravel is a partner and no parent is recorded. The hqCountry comes from the privacy page's definition "Country refers to: Germany" beside the company address in Kerken; a reviewer confirms it. The app version is 2.0.3 (changelog, 2026-10-22); the CSV's earlier date came from a Herd 2.0.1 download header. The changelog's oldest listed entry is 1.0.4 from 2023-06-29; older versions are not on the page. The homepage lists Herd Pro with a yearly price and a team plan; no prices are recorded. The homepage says "85,000+ developers use Herd every day" and that free-version users can open issues in the herd-community repository on GitHub, which is not read and not recorded as a repository. The database list comes from the homepage features; the pricing section also lists MySQL, PostgreSQL and Redis under the Pro tier. Herd deploys to Laravel Cloud from its interface; that is a feature of the desktop app, not a hosted offering of Herd.
