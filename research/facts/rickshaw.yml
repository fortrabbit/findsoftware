notes: >
  The homepage the record names, https://shutterstock.github.io/rickshaw, redirects to https://tech.shutterstock.com/rickshaw/, the company's technology site, which carries the project's overview, examples and the "Built on d3.js" and MIT statements; the final URL is recorded as homepage, and a reviewer should confirm that this counts as the project's own site. The Shutterstock tech site is the company's own domain, not another company's. The README says Rickshaw "relies on the fantastic D3 visualization library" under its Dependencies heading; the homepage tagline "Built on d3.js" is the statement recorded as basedOn. The last commit on the default branch is from 2025-01-17 and the newest release is v1.7.0 on GitHub (2020-03-30), with the v1.7.1 tag and the npm 1.7.1 version published on the same day as v1.7.0; the npm latest is the stable version, so latestReleaseDate is 2020-03-30 from the registry. There is no prerelease after v1.6.0-rc.0 (2017), so no latestPrereleaseDate. Bower is a second registry route next to npm. The README says some extensions require jQuery and jQuery UI. The LICENSE copyright line in the README is "Copyright (C) 2011-2024 by Shutterstock Images, LLC", the homepage says "Developed at Shutterstock." The homepage states the library is for "standard SVG" drawing with CSS styling; the browser runtime comes from the README sentence. npm weekly downloads are the sum of the 2026-11-01 to 2026-11-07 range for the rickshaw package. The release is more than four years old, so the import is expected to move this record to stub on release age, as AGENTS.md criterion 4 describes; the status here is copied from the candidate row. The contributors count is the last page number of the contributors endpoint with per_page=1. The repository's first tag v1.1.0 (2012-08-26) gives the firstRelease year. The repository has no discussion forum, Discord or newsletter link on its pages that were read. The examples page is the docs link.
  The homepage lists renderers, legends, hovers and range selectors as the pieces a graph is built from, and its example needs only d3 and the Rickshaw library.
