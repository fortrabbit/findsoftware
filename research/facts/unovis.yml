notes: >
  Monorepo: stars, contributors and releases belong to f5/unovis, which holds the core package @unovis/ts, the framework packages @unovis/react, @unovis/angular, @unovis/svelte, @unovis/vue and @unovis/solid, and @unovis/ssr and @unovis/mcp; the registry figure is the core package that the README install line names. The homepage says the library works with React, Angular, Svelte, Vue and Solid, or without any UI framework; the core is framework-agnostic and the bindings are separate packages, so no basedOn is recorded for any framework. The README says @unovis/ssr renders charts to SVG or PNG in Node, a separate package; no runtime is recorded for the core. The alternativeTo quote is the project's own comparison page, which renders one dataset with Unovis and the libraries it lists; AG Charts, Vega-Lite and TanStack Charts have no record id, so they are not in the list. The page's section on when another library might suit better is advice and is not recorded. The maintainer follows the homepage copyright line; the LICENSE file carries no copyright line, and the package.json author names Nikita Rokotyan together with F5 Inc., recorded here only as a note. The README lists maintainers and contributors by name; none is recorded as the maintainer. The CSV row gave npm figures from an earlier date; the weekly figure here is for 2026-11-01 to 2026-11-07. The homepage nav and footer name a Discord invite, GitHub Discussions and the X account twitter.com/unovisdev, recorded as discord, forum and x.
