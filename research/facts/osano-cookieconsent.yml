notes: >
  The repository is not archived and no page states an end. Doubt on the latest release: the newest GitHub release is 3.1.1 (2019-05-23) and the npm latest is also 3.1.1; the default branch "dev" README describes "Version 4.0" with a script-only setup, but no 4.0 tag, release or npm version exists, so the README's 4.0 text is not recorded. The import lists a record with no release in four years as stub: this is expected to make the record a stub unless a reviewer rules otherwise. The homepage the repository names, https://www.osano.com/cookieconsent, is the marketing page for Osano's hosted consent product; the open source documentation sits at /cookieconsent/documentation/ and says it is the "Open Source Cookie Consent plugin". The record takes the open source documentation page as homepage. The README calls the hosted platform a "completely free" consent platform with paid plans on top. Hosted features (38 languages, consent records stored on a blockchain, REST calls to search consent records, dashboard-managed script blocking, CloudFront hosting) come from the README's hosted section and stay in notes, not in the open source record. The docs page also says "Free and open source. You're free to copy, modify and even sell Cookie Consent. See our license." That is a second wording of the MIT license and stays in notes. Maintainer: LICENSE copyright line "Osano, Inc., A Public Benefit Corporation"; the README says "Our parent company Osano actively maintains this open source project" and the footer of the Osano trust hub reads "Osano, Inc., a Public Benefit Corp". hqCountry follows the North America address on the contact page (Austin, TX, United States); the same page lists a Europe office in Dublin, and no page names the registered seat of Osano, Inc. The npm package cookieconsent names osano/cookieconsent as its repository and carries the same 3.1.1 version. Coined kinds, kept in notes: embedMethod (script tag from jsDelivr or an npm module), privacyClaims (GDPR, CCPA and EU Cookie Law compliance, as the README words it), geolocation (the 3.0 feature that shows the notice only in the relevant countries).
