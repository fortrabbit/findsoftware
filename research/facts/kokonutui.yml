notes: >
  No GitHub release, tag or npm package exists, so the record is judged by lastCommitDate (AGENTS.md criterion 4). The boundary question in the candidate row is settled by that rule. Components install through the shadcn CLI from the project's own registry at kokonutui.com/r, not from npm: no registry figure applies. The LICENSE copyright line reads "kokonutUI" (2025); the homepage says "Built by Dorian Baffier", and the X link in the homepage footer is his account. The changelog page carries dates only for components, not releases. The Pro tier sells components and templates for a one-time price; prices are not recorded. The docs page marks Pro components with a PRO label. No fact was found for a legal entity or an imprint.
