notes: >
  The record follows the single package the README installs, yet-another-react-lightbox on npm, which is the same name as the GitHub repository. The current stable release is 3.33.1 (2026-11-14), the newest on GitHub and on npm. The first release is 1.0.0, uploaded to npm and tagged on GitHub on 2022-05-19. The maintainer is the copyright holder named in LICENSE, Igor Danchenko, and the GitHub owner is that user account. The README lists bundled plugins (captions, counter, download, fullscreen, inline, rotate, share, slideshow, thumbnails, video, zoom); they ship inside the package and are not separate registry packages, so no plugin count is recorded. The README says the component works with React 19, 18, 17 and 16.8.0 or later, and the minimum React version is not recorded as runtimeMin, since it names a framework version and not a runtime. The README states TypeScript type definitions come built-in, which is not a field of the record; RTL compatibility and the documented labels option for UI translations are the i18n entries. The homepage title is the README's tagline. The npm engines field asks for Node.js 14 or later; it belongs to the package build and is not a runtime for a browser library, so no runtime is recorded.
