notes: >
  The npm package elysia publishes no engines field, so runtimeMin is unknown; the Bun and Node versions the framework requires are not stated on the pages read. The Node.js adapter is a separate package, @elysia/node, named on the Node integration page; the record uses the core package for registry figures. The deploy page names a Bun single-binary build with an AVX2 requirement and a Node-compatible JavaScript bundle; neither is recorded as a field. The integration pages (Astro, Nuxt, SvelteKit, Next.js and others) describe how Elysia is used with other frameworks; Elysia is not built on them, so no basedOn is set. The Vercel page says Elysia deploys there with zero configuration (deployTargets is not a dictionary field, so it is not recorded). The Vercel page describes deployment as a Vercel Function. Its rendering mode and per-request behavior are not stated, so runsAs records only the server behavior the deploy page states.
