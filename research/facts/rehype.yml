notes: >
  The repository is a monorepo: the npm package rehype is the core package (unified with rehype-parse and rehype-stringify) that the install section names, and the same repository publishes rehype-parse, rehype-stringify and rehype-cli under their own names. Stars, contributors and the release list belong to the monorepo. The GitHub releases named 13.0.2 and 13.0.1 belong to the rehype package; the rehype-parse and rehype-stringify releases are separate packages. The homepage unifiedjs.com is the site of the unified collective that maintains rehype, as the README's "for more about us" link states, not a site of rehype alone. The README names unified as the core project and says rehype adds support for HTML to it; unified is an accepted candidate whose record comes in its own wave. The rehype package's README says the line is kept compatible with Node.js 16; the package.json has no engines field at the latest release, but the package readme states Node.js 16+ for installing, which is recorded as runtimeMin. The README says rehype can be used on the server, the client, CLIs and in Deno; only the Node.js and Deno statements are recorded as runtime. The firstRelease year comes from the 1.0.0 tag commit, dated 2016-06-19, which matches the first npm upload. The npm weekly figure is the sum of the daily downloads for 2026-11-01 to 2026-11-07. The root README links rehype-sanitize and rehype-dom as related packages; they are not recorded here. The README says rehype is an ecosystem of plugins that work with HTML as structured data, that unified is the core project and rehype adds HTML support to it, that improper HTML use can open a site to cross-site scripting, that rehype-sanitize makes a tree safe, and that plugins can open other attacks. The package README says the package is ESM only. The README says rehype-cli is a CLI around rehype to inspect and format HTML in scripts, and that rehype-dom is the option for browsers when the content is trusted and a smaller bundle matters.
