notes: >
  Language: the README says Phalcon is written in Zephir/C; GitHub reports PHP from its file statistics, and the dictionary has no Zephir or C value, so language stays out. runsAs is not recorded: the install docs say Phalcon "needs to be installed and loaded as a module on your web server", which states how it is installed, not how a request is served. Scope: the record is the v5 line in phalcon/cphalcon, which the README describes as written in Zephir and C; GitHub reports the language as PHP and the CSV says c. The docs and homepage name a 6.0 RC built as pure PHP in the separate phalcon/phalcon repository (Packagist phalcon/phalcon, library, 18564 total and 5241 monthly); it is not recorded here and needs a decision on whether it gets its own record. The stable major is 5 (5.23.0, 2026-10-15), so currentMajor is 5, not the RC. The install docs name PIE (phalcon/cphalcon on Packagist) as preferred and PECL as deprecated; PECL download statistics are not recorded because the PECL package page returned 504. The OS packages and the Ondrej Sury and Remi repositories named in the docs are not recorded. The CSV adoption figure matches the Packagist total. Criterion 1 is met by the README's "open-source web framework" wording.
