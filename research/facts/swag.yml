notes: >
  Checked 2026-11-16. No project site: the README links no homepage, so the repository is the record's page. The GitHub release list marks v2.0.0-rc6 (2026-09-13) and v2.0.0-rc5 as not prerelease, but the tags are release candidates, so they are prereleases here; the newest stable release is v1.16.6 (2025-07-29) and the Go module proxy lists no stable v2. The README names "Swagger Documentation 2.0" as its output; the spec line is recorded in notes only. The go.mod go line (1.24.0) is a build requirement of a tool shipped as a binary and Docker image, so runtimeMin is not recorded. The README's 10 framework integrations (gin-swagger, echo-swagger, buffalo-swagger, http-swagger, flamingo swagger, gofiber swagger, atreugo-swagger, hertz swagger) are separate repositories; they are not records here. Go modules have no download figure; dependentPackages and dependentRepos are the ecosyste.ms go figures for github.com/swaggo/swag. The Open Collective backers and sponsors are not a paidEdition. The LICENSE copyright line names Eason Lin; the repository is owned by the swaggo organization. The contributors count covers all pages of the repository. The docker image is published on GitHub Container Registry, so no Docker Hub pull figure is recorded.
