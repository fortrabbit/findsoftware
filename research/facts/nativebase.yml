notes: >
  Discontinued on two end signals: the README opens with a DEPRECATED heading and says the project enters maintenance mode, and the npm latest version carries a deprecated message; the docs installation page says the docs are no longer maintained and points to gluestack-ui. The homepage says "NativeBase is now gluestack" and names gluestack-ui as the successor; gluestack-ui.yml names NativeBase as its predecessor. No readable install command was found: the README and the installation page both point elsewhere. firstRelease is the oldest GitHub release (2016); the npm package was first published 2016-04-19, and the homepage says the library was first published in April 2016. Maintainer and governing law: the privacy policy names GeekyAnts India Private Limited and says the policy is governed by the laws of India; that is a governing law, not a headquarters statement. The country comes from the contact page, which lists GeekyAnts India Pvt Ltd at a Bangalore address beside UK and US entities. The LICENSE copyright line reads "GeekyAnts India Pvt Ltd". The npm weekly figure counts downloads of the deprecated package over 2026-10-18 to 2026-10-24. The homepage links the company X account too; only the NativeBase account is recorded as x.
