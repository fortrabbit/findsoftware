notes: >
  The CSV row says the source is not public and has no repository; the GitHub repository cloudpanel-io/cloudpanel-ce is public (created 2019, last push 2026-07-01, release v2.5.4), and its README names CloudPanel as the project. GitHub detects no license for it, and only the README was read, so the repository is recorded as a link without a source-code claim. The imprint names MGT-COMMERCE GmbH as the operator; hqCountry comes from the company address in the license terms. Requirements from the requirements page: Ubuntu 26.04, 24.04 and 22.04, Debian 13 and 12, x86 or ARM64, at least 1 core, 2 GB RAM and 10 GB disk. The technology-stack page says CloudPanel supports only virtual machines and no Linux containers. The technology-stack page lists PHP and Node.js versions but does not say how Node.js applications run, so no runsAs value is recorded: the stack lists what hosted sites run on, and no page read describes how CloudPanel itself runs; the pm2 deployment guide in the docs navigation was not read. The pricing page lists a Community Edition as "100% Free to use" for commercial and hobby sites; a managed service exists and is not recorded as a hosted-service. The CSV row lists adoption as "company behind it"; the company is recorded as maintainer, and no adoption figure beyond GitHub stars is recorded.
