unreadable:
  - https://www.typesettercms.com (answers 403 to curl with the research User-Agent; the homepage fact cites the README link instead)
  - https://www.typesettercms.com/Docs (same host, same 403; the docs fact cites the README link only)
notes: >
  The project's own site blocks the research request, so every fact comes from the repository: the README, gpl.txt, composer.json and the GitHub API. The README links the site for its download, demo, documentation and forum pages; those links are recorded as the docs and forum URLs without reading them. The GitHub release v5.1 is dated 2017-08-12 and the last push is 2022-02-09; neither is a signal under the ended-project rules, so the status stays accepted. The README states "PHP 5.6+ as of Typesetter 5.1.1-b1", a version later than the v5.1 tag, so runtimeMin follows that line and the reviewer may want to confirm it. The gpl.txt file is the GPL version 2 text without an "or later" grant, so the license is recorded as GPL-2.0 and no "or later" is claimed. The repository names no maintainer legal entity; the maintainer value is the project name from the README heading, with no legal form. The repository has no copyright line in its source files that names a person or company.
