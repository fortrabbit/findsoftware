notes: >
  Doubt first: the deployment model is unchecked. The service page offers a "Cloud Upgrade Package" that migrates "Censhare Classic" customers to "Censhare Cloud" and a health check of a "Censhare Classic installation", so an installed edition and a cloud edition both exist, but no public install guide was found. The pages read (homepage, content management, headless CMS module, translation, Xeditor, imprint, AI page) say nothing about whether censhare CMS is installed on a customer's servers or only run as a cloud service. The product site (product.censhare.com) names a "Cloud 1.16" release beside a 2026.1 release webinar, and the AI page offers models "on-premise, or in the cloud"; neither settles the CMS. The docs host did not answer. A reviewer settles it from the installation, system requirements or cloud pages: a public self-install guide makes the record accepted, a cloud-only statement makes it hosted-service. The brand covers DAM, PIM and CMS; the CMS is the part judged here, and the reviewer decides whether the record is the platform or a CMS-only record. Headless API style is not named on the pages read: the headless module says it uses "the APIs of the HCMS Module" and names no REST or GraphQL, so headlessApi stays unknown. The imprint lists Entirely, Marmind and Facelift as group brands, and the homepage says Censhare and Marmind are "coming together"; no page states a parent, so none is recorded. ISO 27001 certification and the "250k users" counter are coined or user counts and are not recorded as fields. Criterion 1 holds on the pages read: the headless CMS module is for building customer-facing websites and portals, and the CMS page describes customer portals.
