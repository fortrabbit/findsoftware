notes: >
  The Idera, Inc. legal site hosts the Froala legal page and its Headquarters address; no sentence states that Idera owns Froala, so parent is not recorded.   The homepage is the project's own site under froala.com; the Idera brand pages sit on ideracorp.com. The license statement is the LICENSE.txt sentence: a license must be purchased, and the terms are at the Master Software License Agreement, which names Froala Labs SA, a joint stock company organized under the laws of Romania, with the Austin, Texas address that the terms page lists as headquarters; that PDF is recorded without a quote. The trial license is described in the README and in section 16 of the license agreement (evaluation software, limited period); it is not a free tier and no freeTier value is recorded. The package.json license field points to the pricing page; that is the same commercial statement and is not a second license entry. The LICENSE.txt lists third-party components under MIT (html-docx-js, file-saver, filerobot-image-editor, yjs, y-websocket); these are the bundled components' licenses and are not recorded as Froala licenses. The README names server-side SDKs for PHP, Node.js, .NET, Java and Python; they are separate packages and are not recorded as runtime or installMethod. The GitHub language detection reads CSS for the repository; language is recorded as JavaScript from the README statement. The npm figure is the registry weekly download count for the package the install docs name, with the period in the value. The CSV figure of 168.2k per week is older than the figure recorded here. The installed route "Download as ZIP" on the docs and download pages sits behind a form, so it is not recorded as an installMethod. The docs getting-started page is a client-rendered shell in a plain fetch; the install routes are taken from the README. No page in the sources states that the editor runs in the browser as a sentence, so no runsAs is recorded.
