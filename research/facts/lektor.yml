notes: >
  The homepage lists the Gitter chat room and the Twitter account; Gitter has no field, so only the X link is recorded. The imprint names Armin Ronacher as a private individual in Austria with no company, so no hqCountry is recorded; the LICENSE copyright line reads "2015-2016 by the Armin Ronacher". PyPI JSON for the installed 3.3.14 release states requires_python ">=3.8", while the installation page says "Python 3.6+ is required"; runtimeMin follows the registry and the page is older. The development version needs npm to build the admin UI (installation page, "you need to have npm installed"), recorded here only as a note. The highest stable GitHub release is v3.3.14 (2026-08-07); v3.4.0b15 is a prerelease with an older date, so no latestPrereleaseDate is recorded. The PyPI JSON carries no download counts, so pypiDownloads is not recorded. The oldest stable GitHub release is 1.0 (2015-12-21), which gives firstRelease 2015. The live-preview statement is on the homepage ("A preview is also embedded in the admin interface"), but no page says whether the preview shows unsaved changes, so livePreview is not recorded.
