notes: >
  Accepted: a Shell tool on GitHub (GPL-3.0, not archived, last push 2026-09-19) that installs and configures an NGINX stack with PHP and MariaDB or MySQL on Ubuntu, then manages sites through the sudo site command (install page, documentation pages). The CSV row said control-panel; the homepage says "Manage everything directly from the terminal—no bulky control panels or resource-heavy software", so the categories are web-server and cli. Requirements from the install page, not fields: Ubuntu Server 26.04 or 24.04 (LTS), arm64 or x86_64, 512 MB RAM minimum, Bash shell required. The FAQ says it officially supports the two most recent Ubuntu LTS releases. The software is a Bash script with no runtime value the import knows, so runtime is absent and language is Shell. runsAs is absent: the pages describe the server Webinoly sets up, not a process Webinoly itself keeps running, and no page says nginx or PHP-FPM run as a daemon in those words. The phpMyAdmin interface is an optional tool the stack installs (stack -pma), so adminUi is recorded. The GitHub repository was created 2017-09-16 and the oldest release is v1.0.1 (2017-10-22), so firstRelease is the release year. The maintainer is the individual named in the terms page; the footer copyright reads "© 2017-2026 by QROkes", the GitHub account. No legal form and no country is stated. Community: the Premium page sells sponsor tiers (GitHub Sponsors) that unlock discussions and premium content; sponsorship is donation, not an edition with software features, so paidEdition is absent. The README also lists PayPal and Bitcoin donation routes, not recorded. The install page and homepage carry an affiliate link to DigitalOcean; it is not recorded anywhere. The GitHub contributors endpoint without anon lists one login. The homepage's "Facebook" link is quoted by its label only. The footer and README name X as x.com/Webinoly, the homepage nav as x.com/webinoly; the README form is recorded. The homepage WordPress list says Multisite compatibility, recorded as multisite. Fields coined: none.
