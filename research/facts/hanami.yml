notes: >
  The Hanami site moved from hanamirb.org to hanakai.org; hanamirb.org answers over https and redirects to https://hanakai.org/hanami, so that page is the homepage. The Hanakai community links (forum, Discord, Mastodon, Bluesky, newsletter) sit on the Hanakai site, which hosts Hanami's docs and community; they are the project's community links as the site presents them. The rubygems figure is the total download count of the hanami gem, recorded as stated by the registry. The GitHub tag v0.1.0 dates the first release. The server command page says its development server is for local development and gives Puma as the production start command, which is the runsAs fact. Hanami's guides name SQLite as default database and MySQL and PostgreSQL as supported.
