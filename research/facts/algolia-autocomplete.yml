notes: >
  The homepage field is not recorded: the repository's homepage is alg.li/autocomplete, a short link that redirects (302, checked 2026-10-28) to the Algolia documentation page recorded as docs, so no separate project site exists. The repository is a monorepo: the README's recommended package is @algolia/autocomplete-js, and the registry figures and dependent counts are for that package; the sibling packages in the repository (autocomplete-core, the plugins for recent searches, query suggestions, Algolia Insights, redirect URLs, tags, the Algolia preset and the classic theme) are not records of their own and their downloads are not recorded. The repository's default branch is next; the stable releases are tags of the form v1.x, and the GitHub release list also holds v1.0.0-alpha tags from 2020 to 2021, which set firstRelease. The v1.19.12 release is the highest stable release and matches the npm latest version, which is MIT licensed and not deprecated. The README states that the library works with any Virtual DOM solution (JavaScript, Preact, React, Vue) and names no parent, so basedOn is not recorded. The getting-started guide's browser support section is the source for runsAs browser. The candidates row lists 5.3k stars, which the GitHub API read of 5,266 supersedes. The HTTP Archive technology list has no entry for this library, so no httpArchiveSites figure is recorded. The npm weekly figure is the sum of daily downloads for 2026-10-19 to 2026-10-25 from the npm range endpoint.
