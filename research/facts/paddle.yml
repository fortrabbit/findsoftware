notes: >
  Hosted service: the Node SDK repository PaddleHQ/paddle-node-sdk (Apache-2.0, 105 stars on 2026-11-03, npm @paddle/paddle-node-sdk 229,539 downloads for 2026-10-26 to 2026-11-01, latest 3.10.0) is a client library, so its repository, license, stars and npm figure are notes only. The CSV lastRelease date 2026-08-07 belongs to that SDK. The maintainer is the entity the terms name for buyers outside the United States and outside Ireland's scope ("in all other cases"); the footer copyright reads "Paddle.com Market Ltd.". The terms also name Paddle.com Inc. (Astoria, New York, for US transactions) and Paddle Payments Limited (Dublin, Ireland, for UK and Isle of Man suppliers outside the US); these are the other legal entities. The pricing page states a percentage plus a fixed fee per checkout transaction; the amounts are not recorded. The developer docs name webhooks, Paddle.js, SDKs and an API reference; the footer names SOC 2 and GDPR compliance pages. Social links in the footer: linkedin.com/company/paddle (no field) and youtube.com/@PaddleHQ (recorded as youtube). The pricing page and homepage state no SSO, user-role or language feature, so those stay unknown. The compare pages are the project's own statements of alternatives; the list follows the compare links in the footer that match candidate ids. The Paddle Billing category maps to e-commerce through billing; the merchant-of-record category has no categoryMap entry.
