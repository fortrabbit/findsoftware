notes: >
  Hosted service only: Forge has no public source repository, so no license, release or adoption field is recorded. The forge.laravel.com address redirects to laravel.com/forge, which is recorded as the homepage. The pricing page lists three flat monthly plans (Hobby, Growth, Business); the plans are hosting subscriptions and not paid editions, and no prices are recorded. The Forge API is named on the docs introduction page ("a powerful API that allows you to manage your servers programmatically") and is not recorded as a field. Laravel VPS is a virtual server product that Forge provisions; the homepage describes it as an offering beside Forge, and the reviewer decides whether it is a hostedOffering of this record. The homepage says Forge deploys vanilla PHP, Nuxt, Next.js, WordPress and Statamic apps, and the FAQ says it supports "other stacks, including Node.js"; not recorded as a field. The FAQ names Laravel Cloud as a separate product, and the Envoyer migration tool is recorded as importsFrom only. Forge's first launch year is not stated on any page read; the testimonials say users since 2014 and are not a launch date. The legal entity Laravel Holdings Inc. is named by the privacy page; the terms page at laravel.com/terms returned 404 and is not used. The homepage says "Trusted by 1000+ companies", recorded as reportedInstalls. Fields coined here: none.
