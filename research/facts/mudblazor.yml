notes: >
  The homepage and the docs pages at mudblazor.com are Blazor applications that answer 200 with an empty shell ("An unhandled error has occurred") when read without JavaScript; the homepage row is kept because the title of the page answers, and the docs, the homepage links and the install steps are read from the docs source in the repository at tag v9.11.0 (src/MudBlazor.Docs). The homepage and docs facts therefore carry the source file as their via page. The README version table lists ended majors and calls 9.x the fully supported line; the project itself is not ended. The README says "Static rendering is not supported", so no renderingModes value is recorded for the component library; the library runs inside the apps that host it, and no page of its own states a runsAs value, so runsAs is not recorded. The csproj Authors line reads "Garderoben, Henon and Contributors" and the LICENSE reads "Copyright (c) 2021 MudBlazor"; the maintainer and country are recorded from the docs footer, which names Gardnet AB and Sweden beside the project name; the footer copyright line reads "MudBlazor". The NuGet figure is the all-time total from the search API. ecosyste.ms reports 0 dependent repositories for the NuGet package, which is not recorded as a count. The GitHub release list starts with v1.0.7 (2020-10-18), so firstRelease is 2020. The forum is GitHub Discussions named on the docs help page. The discord and x links are the ones on the project's docs homepage source.
