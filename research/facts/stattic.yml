notes: >
  Stub: the GitHub repository getstattic/stattic is archived (api, archived true, last push 2025-07-22), and the PyPI package names it as Source, but the homepage the repository and PyPI list, stattic.site, no longer serves the software; it now shows an unrelated registry of ventures, so no homepage is recorded and no page of the project's own names the archived repository. Whether the archive is an end signal under criterion 4 cannot be judged from these sources; a later pass should check whether the project named a new home or an end before deciding between stub and discontinued. The documentation domain docs.stattic.site (linked from PyPI) did not resolve. The latest release 1.0.0 (2025-06-20) is the highest stable tag. The maintainer is the PyPI author "Robert DeVore"; the organization getstattic owns the repository. The README lists posts, tags, authors and pagination, so the blog side of the CSV row is in the README but not recorded as a category.
