notes: >
  Doubt: Mailu's pages document a mail server for mail clients (IMAP, SMTP, Submission, webmail) and an administration interface, but name no website or web app that submits mail through it. The only "one token per app or device" wording (https://mailu.io/master/configuration.html) concerns mail clients, and RELAYHOST is an outbound smarthost, not an app endpoint. This stays a stub until a Mailu page shows an application or website sending mail through its SMTP or submission port. The status is stub, not accepted, under the boundary rule for end-user apps. The GitHub license field reports NOASSERTION; the LICENSE.md file states the MIT License with the copyright line "Copyright (c) 2016 All Mailu contributors at the date", so the maintainer is the GitHub organization Mailu, not a named person. The latest release is calendar-versioned (2024.06.67, 2026-10-23), so no currentMajor is recorded. The oldest release in the repository is 1.8-rc (2020-10-26), but tags before it were not dated, so firstRelease is unknown. The compose setup page is the install route named by the docs; the Kubernetes route points to a Helm chart page and is recorded as helm. The MIT statement in the README ("compatible with the MIT license") repeats the LICENSE.md license and is not a separate entry. The admin and webmail interfaces are web apps people log into, which the boundary rule counts as end-user apps.
