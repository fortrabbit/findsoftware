notes: >
  The license is stated two ways. The aimeos repository and its composer.json say MIT; the aimeos-core repository's LICENSE file and Packagist's aimeos/aimeos-core entry say LGPL-3.0-or-later. Both are recorded as separate license entries; the difference is between the Laravel-facing package repository and the core library, and the page does not reconcile them. The homepage field of aimeos-core names https://aimeos.org; the homepage itself returned 503 during the research and was not read. The GitHub API reports aimeos-core as NOASSERTION, so its license comes from the LICENSE file. The docs setup page at aimeos.org/docs/latest/laravel/setup/ states the PHP requirement and the two install paths. The currentMajor is CalVer (year.month.patch), so the value is the year. The aimeos-core package has a newer stable release (2026.10.2, 2026-10-09) than the aimeos package (2026.10.1, 2026-10-05); latestReleaseDate is the aimeos package's. The aimeos-core repository has no releases on GitHub.
