notes: >
  The npm package twind is deprecated with the message "use @twind/core instead", and its dist-tag latest is 0.16.19; the install page names @twind/core, so that is the registry id, and the twind package is not used for figures. The deprecation names a successor package of the same project, so the status stays accepted. The highest stable GitHub release of @twind/core is 1.1.3 (2023-01-24); the repository has commits in 2026 but no release since 2023-01-24, which is inside the four-year window until 2027-01-24. The homepage says twind keeps "feature parity with Tailwind v3" and its API follows Tailwind, which is a compatibility statement, so basedOn is not recorded. The Discord link on the homepage points to chat.twind.style. The Kenoxa GmbH sponsorship is not recorded as a parent. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header.
