notes: >
  No GitHub release objects exist; the versions are git tags. The highest stable tag is v1.4.2 (tagger date 2026-10-14, used as latestReleaseDate); v2.0.0-M2 and the RC tags are prereleases, and the Maven latest value is the milestone 2.0.0-M2, which is not stable. firstRelease is 2023 from the first stable tag v1.0.0 (2023-07-31) and the Maven 1.0.0 upload (2023-08-01); the earlier RC tags are not counted; the forked-from-akka tag is a repository import and is not counted. The project is a module of Apache Pekko; its homepage is the Apache Pekko site, and the docs and downloads are on that site. The docs introduction lists Scala 2.13, 2.12 and 3.3 and JDK 8, 11, 17 and 21; runtimeMin records the lowest listed JDK. The README says the project is not a web framework and names it a general toolkit. The maintainer is recorded as the trademark line on the Apache Pekko site gives it; no legal form beyond "The Apache Software Foundation" appears. The Maven artifact carries the Scala binary suffix (_2.13) and the docs name the artifact pekko-http. runsAs and renderingModes are not stated on any page read.
