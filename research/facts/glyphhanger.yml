notes: >
  Homepage: the repository's homepage field points to https://www.zachleat.com/web/glyphhanger/, which is a blog post by the maintainer announcing the tool (https, 200), not a project site; no homepage is recorded and a reviewer may link it. The repository zachleat/glyphhanger is a fork of filamentgroup/glyphhanger, which GitHub reports archived (last push 2021-07-01); its README links the archived issue list. The move to the fork is a relocation, not an end, so status stays accepted and the repository is the fork. The fork's GitHub releases start at v4.0.0 (2026-06-05); firstRelease is from the npm registry, where version 1.0.0 was uploaded 2017-01-11 under the same package name. The LICENSE copyright line reads "Copyright (c) 2017 Filament Group", while package.json names Zach Leatherman as author; the author is recorded as maintainer and a reviewer may decide otherwise. The README requires pyftsubset (fonttools, Python) for subsetting, and says glyphhanger uses Puppeteer and headless Chrome; these are requirements, not fields. The README's alternatives (unicode-ranger, subfont, glypht) and the related Unicode Range Interchange are named on the project's own pages; no record ids exist for them, so they are not recorded as alternativeTo. The npm weekly figure is the period 2026-09-28 to 2026-10-04, per the brief. Contributors counted across all pages (per_page=1, last page 10).
  The README says the default output is a Unicode range for the characters used on a page or in files; --subset writes TTF, WOFF and WOFF2 files, --css writes a @font-face block, --spider follows local links, --family and --onlyVisible limit the characters read, and --cssSelector limits them to matching elements.
  By default the page reader runs Puppeteer with headless Chrome; a --jsdom mode reads pages without it. The README shows the tool reading multiple URLs. runsAs is not recorded: the README gives command examples, not a statement of where it runs.
