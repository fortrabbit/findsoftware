notes: >
  The repository has no GitHub release and no tag; its last commit on the default branch is dated 2016-08-03 and is the only date recorded. The README links a demo blog at yasbe.surge.sh but never calls it the project's site, so no homepage is recorded. The README lists mistune and toml as dependencies alongside Mako. The maintainer is the name in the LICENSE copyright line; the GitHub login is underr. The README says the engine was made to be modified and ships no themes or plugins.
