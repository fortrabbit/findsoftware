notes: >
  The LICENSE file states the MIT License for the Omi source code and for the binary, with third-party components under their own terms; preact is listed there under the MIT License. The GitHub API reports the license as NOASSERTION, so the license entry rests on LICENSE and the npm package. The LICENSE copyright line names THL A29 Limited, a Tencent company, which is recorded as the maintainer with Tencent as parent. The npm package homepage points to an http address, which is not linked because it answers only over plain http; the homepage above is the project's documentation site. The npm figures count omi, the core package; omi-form, lucide-omi, omiu and the other packages in the repository are not counted. The newest GitHub release is from 2024; npm latest is a later release of the same major, so the npm date is used for latestReleaseDate. The first GitHub release is from 2018; firstRelease takes the earlier npm upload of the omi package in 2017. The Omi site is documented in Chinese and English. The README lists JSX, function components, signals, a router, Suspense, directives and Tailwind CSS as included, describes the omi-suspense package as handling asynchronous dependencies, and names the omi-cli project generator for new projects (npx omi-cli init).
