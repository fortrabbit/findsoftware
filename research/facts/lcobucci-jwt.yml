notes: >
  The stable docs and the latest docs both say "The project is licensed under the MIT license, see LICENSE file", while the LICENSE file on the default branch and composer.json at tag 5.6.1 both say BSD-3-Clause; each statement is its own license entry, and the disagreement is for a reviewer to settle. The maintainer follows the LICENSE copyright line, Luís Cobucci, which composer.json also lists as the author; no page gives a country, so hqCountry is absent. The default branch is 6.0.x, the CI badges name that branch, and no 6.x release exists, so currentMajor is 5 from the 5.6.1 release. The docs call the library framework-agnostic, so no basedOn is recorded. The docs navigation lists Issuing tokens, Parsing tokens, Validating tokens, Configuration, Extending the library and Rotating Keys. The docs point to a Gitter channel for questions; it is the project's own chat but has no field, so it is named here only. The composer.json at tag 5.6.1 requires the ext-openssl and ext-sodium extensions and psr/clock; the PHP minimum is the only runtime value recorded. The oldest release is 1.0.0 from 2014-03-08, which the Packagist upload also shows, so firstRelease is 2014. The stars and contributors are the repository's.
