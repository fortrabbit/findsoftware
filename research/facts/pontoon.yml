notes: >
  Pontoon is Mozilla's own localization platform, which the homepage and the docs present as the tool Mozilla localizers use; the deployment page says it is designed for Google Cloud Platform, with Docker images built from the repository's Dockerfile, and that its production and development servers run on MozCloud. Its release tags are dated versions (v2026.11.02), so no currentMajor is recorded: calendar versions have no major. The oldest tag, dated 2012-04-06 by name, points to a commit dated 2012-04-05, which sets firstRelease. The REST API's write endpoints (translation, pretranslation and suggestion uploads) and the Git and Mercurial sync are the wiring that this record rests on: the API is for localization pipelines and the sync writes translations back into project repositories, so the reviewer decides whether these count as a site or app wired to the software under criterion 1. The record is listed as accepted in the candidates row, and no decision was taken here. The Mozilla foundation's headquarters country is not stated on the pages read (homepage, about, privacy), so hqCountry is unknown. The developer setup page says its steps are for development only; production runs from the Docker images, which the deployment page describes without a process-model sentence, so runsAs is not recorded. Python is the repository language; no page states a Python runtime, so runtime is not recorded. The sync with version control, the scheduled jobs, the notification emails and the community health score are documented features without fact fields. The authentication providers listed (Mozilla Accounts, GitHub, GitLab, Google, Keycloak) are each named as an OAuth application in the deployment docs; the protocol statement is the OAuth sentence only. Contributor count is the non-anonymous page count (136) of the contributors endpoint. The admin guide says only administrators can open the admin console. The README says the instance Docker setup is the way Mozilla deploys and may need adapting for another platform; its developer setup is not for production. The default authentication method is a Django login for accounts created from the command line; the providers are optional.
