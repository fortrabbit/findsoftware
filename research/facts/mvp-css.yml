notes: >
  Pure stylesheet: no runtime and no basedOn. The GitHub releases run from v1.4 (2020-04-24) to v1.18 (2026-09-14, stable); the npm latest is 1.18.0. npmWeeklyDownloads is the sum of daily downloads for 2026-10-18 to 2026-10-24. The HTTP Archive technologies list has no MVP.css entry, so httpArchiveSites is not recorded. The homepage lists the elements it styles, among them text links, link buttons and the article element as a content area, and the README gives the unpkg link tag.
