notes: >
  Stub: the homepage https://shuup.com and https://www.shuup.com fail the TLS handshake (no response over https, plain http answers 409), so the project's own site cannot be read and the record is held until the site answers again; the code, docs and releases are still public. The repository LICENSE and README say OSL-3.0, GitHub detects no license, and the PyPI metadata says "proprietary"; the LICENSE file wins and the PyPI classifier is recorded here only. The latest release is v3.1.0 (2021-08-17) and the last commit on the default branch is 2021-08-18, so the import will move the record to stub on its own after four years without a release. The project was named Shoop before it was renamed Shuup; the changelog lists Shoop 1.0.0 (2015) as the first open source version, which is recorded as firstRelease, and says Shuup 0.4.0 is the same content as Shoop 4.0.0. The requirements page says Python 3.6+, a Django minimum of 2.2 LTS and any database supported by Django, so no database is recorded. A Windows note on the same page lists extra build steps. The readthedocs pages say "Shuup 2.10.2+" in their title while the release is 3.1.0; not recorded. The README roadmap lists v3 for Q4 2021 and v4 for Q1 2022; v4 has no release. The PyPI package and the repository are named shuup. The README gives a Gitter chat room, which has no field. The CSV's pypi 152/wk figure is not reproduced; the pypistats last-month figure is the one read on 2026-10-23.
