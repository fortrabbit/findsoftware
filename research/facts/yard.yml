notes: >
  firstRelease comes from the first RubyGems version (0.2.0, 2009-07-25); the oldest GitHub release is later. runtimeMin comes from the ruby_version requirement the registry lists for the latest gem. The latest stable release is v0.9.45 (2026-07-14), matching the RubyGems version. The RubyGems download figure is the total for the gem, not a period. The README states the license as MIT except for some files that come from the RDoc and Ruby distributions, and those files are not separately recorded. The README says Graphviz is required only for yard graph. The homepage footer reads "Copyright 2007-2020", older than the repository LICENSE, which the record uses. The GitHub API reports owner type User; the homepage names Loren Segal as author. The README describes the yard server as a local preview for a project and for installed gems, with live reloading, and it does not describe publishing the output; runsAs is local only, since no page describes serving the output on a live site. The homepage says YARD also runs a live documentation server for the community, hosting docs for all RubyGems and GitHub projects, at RubyDoc.info; it is a hosted service beside the tool and is not recorded as a field. The README says yardoc generates documentation from lib/**/*.rb by default and writes a .yardoc cache.
