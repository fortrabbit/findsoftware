notes: >
  The GitHub releases page's latest release is v5.47.1 (2026-09-14), but the v6 line is published to npm and as git tags only (v6.9.0 is a tag without a GitHub release object). The registry major (6) is higher than the GitHub major, so currentMajor is 6 and latestReleaseDate is the npm publish date of 6.9.0. The README says v6 drops Ant Design, so no antd basedOn entry is recorded for the current major. The npm engines field of 6.9.0 (node >=22.22.0) and the README's local-development line (Node.js >= 22.22 and pnpm) are toolchain requirements for a React library, so runtime and runtimeMin are not recorded. The library is ESM only. The README says English and Simplified Chinese texts are included, while the homepage says 18 locales; both are statements and each is an i18n entry. The package the install page names is @lobehub/ui; the changelog has no field. firstRelease 2023 matches the first npm version (1.1.0, 2023-05-21) and the repository creation date. The README says the package needs React 19 and the motion, @lobehub/icons and @lobehub/fluent-emoji packages as peer dependencies, and that upgrades from 5.x follow a v6 migration guide.
