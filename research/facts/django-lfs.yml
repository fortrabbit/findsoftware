notes: >
  Whether this shop software is still a usable project is in doubt: the homepage in the PyPI metadata, http://www.getlfs.com, now answers with unrelated gambling pages, so no homepage is recorded and the status is stub under AGENTS.md; the docs at docs.getlfs.com and the demo at demo.getlfs.com do not answer; the GitHub metadata names http://www.iqpp.de, which does not answer over https and is not linked. A current project homepage or a maintainer statement on the project's status would settle it. The last release is 0.11 on PyPI, dated 2017-03-09, and the repository's last commit on main is 2026-09-18; the record is not marked discontinued because no end is stated. The repository's installation page names Python 2.6.x and 2.7.x, while docs/README.md, which describes the documentation build, names Python 3.7+; the conflict is why no runtimeMin is recorded. The installation page says the database should be PostgreSQL in the future and that other databases may be dropped. The first public beta is dated in HISTORY.txt as 2009-12-27, which gives firstRelease. The PyPI JSON API carries no download counts, so no pypiDownloads figure is recorded. The GitHub repository has tags named version/0.11 and earlier and no GitHub releases.
