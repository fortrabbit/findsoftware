notes: >
  The LICENSE copyright line names Danga Interactive, Inc. (2003), which the maintainer field records under the rule for LICENSE copyright lines; a reviewer should decide this. The homepage says "This page is maintained by Dormando", and the about page credits Brad Fitzpatrick as the original developer for LiveJournal in 2003; neither is recorded as the maintainer. The homepage lists Netflix as a supporter and a CacheForge business-support link; neither is a field. The release list starts at 1.2.7 (2009-04-03) and the oldest tag is 1.2.0 (tagger date 2009-03-03); firstRelease follows the project's ChangeLog file, whose oldest entries from June 2003 record versions 1.0.2 to 1.0.4. The docs say Docker can be used but name no image, so the Docker Hub library/memcached count (13,425,578,918 pulls) is not recorded as dockerPulls. The latest tag 1.6.45 is dated 2026-07-10 (annotated tagger date); the release notes and homepage date it 2026-7-9, and that date is recorded. No GitHub release objects exist; the release notes wiki is the project's release record. The mailing list is recorded as forum. The homepage says memcached is "intended for use in speeding up dynamic web applications by alleviating database load" and that its API is "available for most popular languages". Fields coined here: none. The downloads page says a source build needs the libevent development package (libevent-dev on Debian and Ubuntu, libevent-devel on Red Hat and CentOS).
