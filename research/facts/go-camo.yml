notes: >
  Repository only: the repository field names no homepage, so none is recorded. The README is the only project page; it names a Codeberg mirror, Docker Hub and GitHub Packages container images (the README calls the containers untested), and a Heroku Procfile route; these are install routes, the mirror is not a source. The release v3.1 dated 2026-10-23 is the newest stable release and has major 3. The first tag v0.0.1 is dated 2012-07-07 by its commit. The maintainer is the person named by the LICENSE.md copyright line; the GitHub owner cactus is an organization without a name. The README describes "HMAC" URL signing, hex and base64 URL encodings, allow and deny origin filters, upstream HTTP proxying, Prometheus metrics and a Differences from Camo section; "go-camo is an implementation of such a server" names camo (github.com/atmos/camo), which has no record here, so it is not alternativeTo. The README's Known Users list names GitLab, Zulip and PyPI as users of the software and is not a field. The README names no image library and no output format conversion; it states that go-camo "validates the HMAC, decodes the URL, then requests the content from the origin server and streams it to the client." The README recommends fronting go-camo with a CDN where possible and says the container images are untested. The README says "Go-Camo does not daemonize on its own" and recommends launching it in a process supervisor for production, which does not say whether the process keeps running, so runsAs is absent; the listener flags bind an address and port for HTTP. The README says to prefer the statically compiled binary releases unless a container is needed. The Docker Hub image the README links is cactus4docker/go-camo, whose pull count is recorded. The url-tool utility in the release generates and decodes signed URLs from the command line. Go is the language; the README gives no runtime minimum for a binary install, and a go.mod go line is a build requirement, so runtimeMin is absent.
