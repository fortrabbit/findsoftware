notes: >
  Framework bindings: the core package is framework-agnostic. The homepage and README name official React and Vue bindings (Swiper React, Swiper Vue) and Swiper Element web components; they ship from the same project and are not separate records, and the bindings are not basedOn because the README lists "Library Agnostic" among its features and states no parent framework. The README says Swiper does not require jQuery or any other JavaScript library. The package.json engines field asks for node 4.7.0 or later; it is a build requirement of a browser library, so no runtime or runtimeMin is recorded. The install page's CDN example names the swiper package at major 12, while the current major is 14; the major stays in currentMajor and the example version is not recorded. The Premium Solutions Guide lists paid add-ons (templates and plugins) sold by UI Initiative with links to store pages; those are paid add-on plugins, not an edition of Swiper, and the pages state no price or license, so no paidEdition is recorded. Swiper Studio, a visual builder that exports HTML, React or Vue code, is named on the premium guide; the guide does not say whether it is hosted, so no hostedOffering is recorded. The get-started page says the package exports only the core version by default, so modules are imported and configured separately. The compare pages on swiperjs.com (swiper-vs-slick, -splide, -embla-carousel, -flickity, -glidejs, -keen-slider, -owl-carousel) name each peer, so each is an alternativeTo entry with the id of its record (slick means the jQuery plugin, slick-carousel); their ranking language is not repeated. The README names the RTL layout support and the community on GitHub Discussions. The get-started page lists npm, a CDN and a download of the assets from jsDelivr. The oldest tag in the repository is v1.0.0 (commit 2012-03-14), so firstRelease is 2012. The homepage's opening paragraph calls Swiper the most popular slider library; that is a claim the record does not repeat. The npm figure is for swiper, the package the install page names. The repository is a single package repository, so its stars and contributors belong to the package. The README contains a sponsor section with advertising for unrelated products, which is not a fact.
