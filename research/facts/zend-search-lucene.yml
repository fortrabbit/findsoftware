notes: >
  In doubt: the package has no release since 2017-07-12, and the Zend Framework site at framework.zend.com says "Zend Framework is now the Laminas Project!", which a reviewer must read as an end of this component or as a rename the record should follow; a statement from the Zend Framework 1 project or the zf1 account naming this package as ended or succeeded would settle it. The import moves a record with no release in four years to stub by itself, so the status is stub either way. The README says the package "is a part of the Zend Framework 1" and the composer homepage is framework.zend.com; no homepage is recorded because the package has no site of its own and the framework site now describes the framework as Laminas. The Zend Framework 1 parent has no record id (zf1-future is a separate community continuation candidate), so basedOn is not recorded. The LICENSE.txt copyright line reads "Copyright (c) 2005-2015, Zend Technologies USA, Inc.", the copyright holder of the framework code; the maintainer recorded is the zf1 Packagist and GitHub account. The endoflife.date product for Zend Framework does not exist (404), so no endoflifeId is recorded. The composer require says php >=5.2.11, the minimum the package declares for its latest version 1.12.20; the README says nothing about a runtime minimum. Packagist shows no abandoned flag. The package is ZF1 component 1.12.20, the newest of 18 Packagist versions; the GitHub repository has no release objects, only tags.
