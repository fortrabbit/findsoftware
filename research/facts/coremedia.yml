notes: >
  No public repository was found on the project's own pages, so the record has no repository; the homepage is the link. The documentation's Quick Start landing page is a JavaScript shell, so the Docker Compose quick start is read from its version page at quickstart-docker/cmcc-12, which holds the setup text. The product lifecycle page lists "CoreMedia Content Cloud - Self-Managed" v10 to v13, which is the installable edition, and v13 is the newest; the release-cycle page says CMCC 13 changed how features are delivered. The Docker Compose page describes a development setup that needs license files for the cms, mls and rls servers; it names the Spring Boot apps only in a comment, and no readable page states the language or runtime, so those and runsAs stay unknown. The only license statement read is the footer "All Rights Reserved"; licenseModel commercial rests on it. The homepage says the platform runs in cloud, private cloud, on-premises or hybrid, and the imprint names CoreMedia GmbH with its registered office in Hamburg. The feature facts come from the hybrid headless CMS page. The documentation's headless API entry was not read in detail. Criterion 2 rests on the Self-Managed edition and the documented Docker Compose setup; criterion 5 on the imprint.
