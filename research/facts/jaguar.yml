notes: >
  In doubt on criterion 3: the project site is dead and the only install step found is a pub.dev dependency line, not an install page; a live project site or a published install guide would settle it. The homepage is dead. jaguar-dart.github.io answers 301 to jaguar-dart.com, which does not resolve (NXDOMAIN), so no homepage is recorded and the record is set to stub as in the bowman model. The only install step found is the dependency line on the pub.dev page, jaguar: ^3.1.4, which lists a dependency and is not an installation page; the README has no install section either. What would settle it: a live project site, or an install page that the project itself publishes. The GitHub API reports no license for the repository because the LICENSE sits in the jaguar/ package folder, not the root; the BSD-style text there is recorded as BSD-3-Clause, the classification of its own wording. Release figures come from pub.dev because the repository has no GitHub release or tag; the last commit on master is 2024-09-08, the same day as the pub upload, and the repository was not archived. The pub.dev environment sdk constraint >=2.12.0 is recorded as runtimeMin. The CSV row's http homepage was the old site that now redirects to the dead domain. The README's documentation links point at pub.dartlang.org documentation pages; those were not read and no docs field is recorded.
