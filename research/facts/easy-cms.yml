notes: >
  The candidate row's homepage https://easy-cms.dev does not resolve (NXDOMAIN, read 2026-11-04). The project's own site is https://easycms.dev: the repository homepage field names it, the README links it, and it answers 200. The repository is active (pushed 2026-11-04). The package is installable and self-hosted, the homepage says "Embedded, not hosted", and no vendor cloud was found, so the record is accepted on criteria 2 and 3 rather than stubbed. Reviewer to confirm the hosted-service area is the right place for it, or move it to the main register. The one-click Vercel and Netlify buttons deploy a starter and are not an installMethod. GitHub has three releases (v1.0.1, v1.0.0 and the v1.0.0-rc.0 prerelease) and no release object for the later 1.x versions, while npm latest is 1.34.0, published 2026-11-04; latestReleaseDate follows the registry because it is the newer stable date. The core package @easy-cms/core is the one create-easy-cms installs; its first version 0.1.0 and the repository were both created 2026-09-25, so firstRelease is 2026. The homepage says the admin is in English and Thai; that is not recorded as a field. The GraphQL, MCP and shop plugins are marked experimental in the README and are not recorded as separate facts. The maintainer is the LICENSE copyright holder; the GitHub account name is spelled differently and is not recorded. Nothing on the site names a company or a country, so hqCountry is not recorded. The README lists official plugins for SEO, forms, redirects, notifications, AI, nested pages, GraphQL, MCP, multi-tenant sites and a shop, and says the same CMS also runs as a standalone server for other frontends. The compare pages cover Payload, Strapi, Directus, WordPress and Sanity. The always-on runsAs comes from the VPS guide, which keeps the Next.js, Nuxt and standalone server running under systemd; the one-click Vercel and Netlify starters run it serverless and are not recorded. The Move from WordPress recipe supplies an import script that reads a live WordPress site through its REST API. The forum link is the GitHub Discussions page linked from the docs footer. The security review (self-reviewed against OWASP ASVS level 1) is a note only.
