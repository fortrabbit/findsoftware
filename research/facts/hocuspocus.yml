notes: >
  The record covers the Hocuspocus server package @hocuspocus/server; the provider client and the CLI are separate packages (@hocuspocus/provider, @hocuspocus/cli) that are not recorded. latestReleaseDate is the npm publish date of @hocuspocus/server 4.8.0 (npm latest, 2026-10-28), the newest stable release; the GitHub release v4.8.0 of the same day is marked as a prerelease, and v4.7.1 (2026-10-12) is the newest GitHub release marked stable. Both are major 4. runtimeMin comes from the engines field of packages/server/package.json at v4.7.1 and matches npm latest. The docs say the project "is based on Y.js (by Kevin Jahns)"; Yjs has no record of its own, so no basedOn is recorded, and the Yjs compatibility goes here. The README names Redis as the way to scale ("Scales to millions of users with Redis"), an optional dependency for running across nodes. The generic database extension stores documents in any data store that returns a Promise (the docs name PostgreSQL, MySQL, MongoDB and S3 as examples), and a SQLite extension ships; only SQLite is recorded as databases. The documentation names Cloudflare Workers as a runtime since v4 and uWebSockets.js as a Node.js transport, not recorded in runtime. The Tiptap Collab cloud offering is named in the README; no prices are recorded. The firstRelease year is the oldest GitHub release, v1.0.0-beta.2 of 2022-09-28; the repository was created in 2020. The 2026 weekly figure is the range endpoint sum for 2026-10-26 to 2026-11-01 as the rule asks; the candidates row shows 577.3k from an unstated window, so the two figures are not compared here. The Tiptap GmbH legal notice gives the Berlin address; the maintainer is recorded as the LICENSE copyright line states it.
