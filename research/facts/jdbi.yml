notes: >
  Status accepted. Criterion 1: Jdbi is a library an application calls to run SQL, and the homepage says it is not an ORM; it is in the dataset as a helper library, category sql. Criterion 2: Apache-2.0 on GitHub, published to Maven Central. Criterion 3: the developer guide gives the Maven and Gradle coordinates. The jdbi/jdbi repository is a multi-module build; stars and contributors belong to the whole repository, and the Maven artifact is jdbi3-core, the core module the guide names first. Maven Central publishes no download figure. The firstRelease year is the oldest Maven Central upload of org.jdbi:jdbi, version 2.0.1 on 2007-06-26 (the directory listing); the GitHub tag 1.2.2 has a commit dated 2005-01-27, but the first published artifact is the registry date. The maintainer is the jdbi GitHub organization: the LICENSE is the Apache text without a copyright line and the repository has no NOTICE file. The guide says the project receives the Spotify FOSS 2023 Fund, which is funding, not maintenance. The guide says Jdbi runs on Java 17 or later and that releases use Java 17 bytecode; the guide says Jdbi ended support for Java 11 with version 3.50. The databases are the vendors whose modules the guide lists (jdbi3-postgres, jdbi3-mysql, jdbi3-sqlite, jdbi3-oracle12) plus H2 in its testing and SQL sections, which is not in the databases vocabulary. The guide says Apache Freemarker can render SQL statements; that is SQL templating, not web templating, so no templating value is recorded. The guide also documents Kotlin, Scala and Clojure use from the JVM, the Guava, Joda-Time, Spring and Vavr plugins and Commons Text as a SQL renderer; these are not recorded as fields. The guide is the 3.55.1-SNAPSHOT development build of the documentation; the release line is 3.55.0. The homepage is served over HTTPS, so the http link in the candidates list is not used.
