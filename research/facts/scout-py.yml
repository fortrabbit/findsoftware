notes: >
  The install docs name pip install scout, so the PyPI package scout is the registry id (pypiName scout). The PyPI package scout-py is an unrelated project (datawire scout.py, 0.5.0), so the candidates row's pypi 18 per week figure is not this project's and is not recorded; pypistats gives 190 downloads in the last month for scout. The candidates row id scout-py is kept because the research id is the CSV id, and the reviewer should decide whether the id should follow the package name scout. The homepage is the project's documentation on Read the Docs; the http address on scout.readthedocs.org redirects to it, and the https form is recorded. The maintainer is Charles Leifer by the LICENSE copyright line and the pyproject authors field; no legal form or country is stated, so hqCountry is absent. GitHub has no releases for this repository, only tags, and the PyPI release history is the registry source for the release date. The first upload is 0.1.0 on 2015-03-25, the same day the repository was created. The Python 3.8 minimum is taken from the README at tag 4.0.0, because pyproject declares no python_requires. Peewee and Flask are dependencies; Flask is recorded as basedOn because the README says the web application is built with it, and peewee is not recorded. The README says scout is "in the spirit of ElasticSearch" and no comparison field is recorded. The deployment examples for Gevent, Gunicorn and uWSGI are in docs/deployment.rst, and the install page states that the server needs the FTS5 extension of SQLite. The contributor count is taken from the rel="last" page of the contributors endpoint.
