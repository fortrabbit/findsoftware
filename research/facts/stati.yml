notes: >
  Stati is pre-1.0 (tags 0.1.x to 0.5.8), so currentMajor is 0. The last push and the last release are both 2019-05-28; no archived flag and no end statement was found, so the status stays accepted. The project's own pages and README describe it as a static site generator but no page states that the output is static files, so renderingModes and a static runsAs are not recorded. The install page describes running stati build and stati serve in the website directory; it does not say where the generated site is uploaded, so runsAs stays unknown. The README names Liquid filters as a gap, which is the basis for templating. Jekyll compatibility is a stated goal, not a parent, so basedOn is not set. The install page says pygmentize and sass or scss must be on the path for some features; not recorded as a field. The jekyllCompatibility field is coined here for the README's stated limit.
