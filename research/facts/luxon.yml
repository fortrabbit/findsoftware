notes: >
  The repository is moment/luxon; the GitHub organization moment is not named as the maintainer by any page the record reads, so the maintainer follows the LICENSE copyright line, which reads "JS Foundation and other contributors" and is recorded here without the "and other contributors" part; a reviewer may prefer the organization name. The homepage and docs are the GitHub Pages site the repository names, a docsify shell whose text sits in the docs folder as markdown; the docs source is the docs folder of the repository, read at docs/install.md. The install guide says it "Supports Node.js 6+" and also describes browser builds, so the library names both; the Node minimum is a build requirement for a library that also runs in the browser, so no runtime or runtimeMin is recorded. The install guide's Node.js section names npm, the browser section names a download and a CDN, and each route is its own installMethod. The repository has tags and no GitHub releases: currentMajor and latestReleaseDate come from the npm package luxon (3.7.2, 2025-09-05). The newest prerelease, 3.8.0-alpha.1 (2025-08-11), is older than the latest release, so no latestPrereleaseDate is recorded. firstRelease is 2017 from both the npm upload 0.0.1 and the oldest tag 0.0.18. The docs folder has a moment.md page for Moment users, which makes moment an alternativeTo entry. The CSV npm figure (24.2M a week) is replaced by the registry sum for the period. The README features list names DateTime, Duration and Interval types, parsing and formatting, and native time zone and Intl support with no locale or tz files. The stars and contributors belong to the single-package repository.
