notes: >
  The repository john-bokma/tumblelog holds both versions, tumblelog.py (Python) and tumblelog.pl (Perl), with one LICENSE, one README and one star count, so this record and tumblelog-pl share the repository, the stars, the contributors and the last commit date. GitHub reports the repository language as Perl; the Python record takes the language from the README. The repository has no releases and no tags. The CHANGELOG.md in the repository lists versions up to 6.6.0 dated 2026-08-15, but no tag or release backs them, so no currentMajor or latestReleaseDate is recorded and lastCommitDate is used. The Python installation page says the program was tested with Python 3.7.3, which is a test version and not a minimum, so runtimeMin is not recorded. The author's site is served over https (it redirects plain http), so the https address is the homepage. The README says the author makes an effort to keep the output of the Perl and Python versions identical except for minor differences between the render libraries. The Python version needs the commonmark and regex libraries (pip install, per the installation page); the styles are written in Sass and are converted to CSS with a Sass program or the Sass container the repository describes. Listing counts the 127 GitHub stars as the adoption figure for criterion 5.
