notes: >
  No project website: the gem's homepage_uri and the repository description both point at GitHub, so there is no homepage fact. The repository is one gem, so stars and contributors (10) are the repository's own. The install docs name the gem, so the RubyGems figures are for i18n-js; the README's companion JavaScript package (npm i18n-js) is a second package for JavaScript-only use and is not the registry figure here. The repository has no GitHub release objects; the stable line is the tag v4.2.4, which matches the RubyGems latest 4.2.4 (2025-10-31), so currentMajor is 4 and the tag v5.0.0.rc1 (RubyGems 5.0.0.rc1, 2026-06-03) is the prerelease date. The oldest tag, pre-cleanup, points at a commit dated 2010-03-09, and RubyGems' first version 0.1.0 is dated 2010-07-09; both give 2010. The LICENSE.md copyright line names Nando Vieira with the year 2021, and the gem's authors field names the same person. The README's Rails support is named in the repository description only; the gem reads the i18n gem's translations and does not call itself a Rails plugin, so no basedOn. The gem's runtime is the Ruby requirement in the gemspec at the latest tag; the README does not state a Ruby version. The gem also exposes a Node.js lint command (i18n lint:scripts) that needs Node installed; it is a development step and is not recorded as a runtime. The README describes watchers (watchman, guard, and listen) that rerun the export when locale files change, and the lint:translations command that lists keys missing from a locale.
