notes: >
  The service keeps its content in Google Drive: documents and sheets in a project folder shared with the service's bot account are the source, and the API serves the published result as JSON or HTML. The pricing page describes the Developer Plan as "For developers building personal non-commercial projects." The developers page documents a Headless API and an API reference, but does not name a REST or GraphQL style, so headlessApi is unknown. The Developer and Business plans on the pricing page differ in workspaces (Preview and Live) and published document limits; no prices are recorded. The GitHub links on the developers page point to starter projects (doc2-site-bot/uncle-tonys-astrojs, -nextjs and -nuxtjs), not to the service, so no repository is recorded. The homepage, docs and terms all state DOC2.SITE LTD; the legal notice gives no registered address, so hqCountry is unknown. The doc2.live and doc2.email services are named on the same site and are described as delivery services for the same content; they are not separate records. The docs ask for a subdomain on doc2.live and doc2.email for hosting, as stated on the getting-started page.
