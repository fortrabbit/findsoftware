notes: >
  Accepted: a compile-time transformer that a TypeScript project installs from npm and builds with ttsc; the validators it emits are plain JavaScript in the build output. For bundlers such as Vite, Next.js, Webpack, Rollup and esbuild, the README points to the @ttsc/unplugin package from the ttsc project. The setup page says typia is a compile-time transformer, so the build runs through the TypeScript 7 transformer path; the current setup needs typia, typescript and ttsc (0.37.0 or newer), and the legacy setup page covers projects pinned to typia 12 and TypeScript below 7. The setup page states that the stock tsc, ts-node and tsx cannot apply the transform, and that ttsx runs TypeScript directly. Because typia runs at build time, no runtime, runtimeMin or runsAs is recorded: no page names the runtime environment of the emitted code. The README's function list names is, assert, validate, the JSON schema, stringify and parse functions, the LLM harness, Protocol Buffer and random functions, and says typia.is<T>() is transformed into a dedicated type checker by analyzing the type at compile time, with no runtime reflection; these are feature areas and are not recorded as fields. The utilization pages name MCP, the Vercel AI SDK, LangChain, NestJS, tRPC and Hono as places where typia is used; they are integrations the docs describe, not a parent or importsFrom. The homepage names class-validator in a speed comparison and lists Zod, io-ts and class-validator decorators under "Traditional Approach", so class-validator and zod are alternativeTo values; io-ts and class-transformer have no record. The README says typia was inspired by typescript-is; that is a credit, not forkOf or basedOn. The benchmark and speed claims on the homepage and README are the project's own measurements and are not recorded. The first GitHub tag in the repository's tag list, v2.0.2, has a commit dated 2022-04-20, and the first npm upload is 2022-10-20; firstRelease is 2022 either way. The latest stable release is v15.4.1 (2026-11-14), which matches the npm latest 15.4.1. The Open Collective backers link is a sponsorship page, not a paid edition. The repository is owned by the user samchon; LICENSE names Jeongho Nam, so that is the maintainer. The discord link is the badge's target in the README.
