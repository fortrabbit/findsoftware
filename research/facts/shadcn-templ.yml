notes: >
  The project is an unofficial, community-led port of shadcn/ui for Go and templ, in the README's words, so shadcn/ui is not recorded as basedOn; the homepage footer credits the port to Axel Adrian's personal X account, which is not recorded as the project's x. The homepage banner says "shadcn-templ 2.0 is now available" while the docs and the changelog call 2.0 a beta; the GitHub releases list holds v2.0.0-beta.15 as the latest prerelease and v1.13.2 as the latest stable release, so currentMajor is 1 and the 2.0 line is latestPrereleaseDate. The changelog says "templUI is now shadcn-templ" and keeps the v1 docs at templui.io, so the stable v1 release is the templUI line under this repository; the v1.13.2 go.mod declares module github.com/templui/templui. The import workflow page calls the module route "Experimental" and says it "may not survive to 2.0 stable"; the CLI is the page's supported path. No Go module download figure is recorded, as a Go module has no download count in its registry. The repository's GitHub language field reads templ; language is recorded as go, the language the package ships. The docs installation page is the 2.0 beta docs; its runtime statement comes from that page. The scaffold server honors PORT, a dev server of the scaffold, which is no statement about how a site built with the components runs, so runsAs is not recorded.
