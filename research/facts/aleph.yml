notes: >
  The repository is archived on GitHub (archived: true, last push 2025-07-06), and the README states "This project is no longer maintained, we recommend using fresh" (the fresh project at fresh.deno.dev is named as the recommended alternative). Status is stub instead of discontinued because the homepage in the repository record, aleph.deno.dev, returns 404 with "The requested deployment does not exist.", which the rules treat as a dead homepage; a reviewer should decide between stub and discontinued. The README links the docs site, which is in progress and points to aleph.deno.dev, and alephjs.org returned HTTP 522 on the check, so no docs or homepage is recorded. The releases are all alpha and beta tags, with GitHub prerelease flags unset: the oldest is v0.1.5 (2020-09-30) and the newest is 1.0.0-alpha.47 (2022-05-19). No stable release exists, so currentMajor is not recorded, and latestReleaseDate is the newest release object. The README's quoted install command is the project's init script; the install target is the template chosen at init.
