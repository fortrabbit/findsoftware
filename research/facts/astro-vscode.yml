notes: >
  The extension lives in the withastro/astro monorepo at packages/language-tools/vscode, and its tags are astro-vscode@<version>. The repository's stars (63,545) and contributors belong to the monorepo that also ships the Astro framework, so no githubStargazers or contributors figure is recorded for this extension. The VS Code Marketplace listing reports 1,608,375 installs (read 2026-10-28; the gallery API reported 1,607,247 the same day); recorded here as vscodeInstalls with its date, not as a field. The marketplace display name is "Astro", which the record uses; the README title is "Astro support for Visual Studio Code". The social links on astro.build belong to Astro, not to the extension, so none are recorded. The extension is a VS Code extension, so its parent for basedOn is Astro, which the docs call its official extension; VS Code is not a record. The extension's package.json license is MIT and the root LICENSE of the monorepo (copyright 2021 Fred K. Schott) is MIT too. The homepage is the Astro site named by the extension's README; the extension has no site of its own. The firstRelease year comes from the marketplace publishedDate of 2021-05-17, the oldest upload the gallery API reports; the GitHub releases for the extension start at 2.16.0 (2025-10-30). The language is the monorepo's language as GitHub reports it, TypeScript. The Open VSX listing is an install route named by the docs, and the Astro docs also name a Zed extension, a JetBrains plugin and community extensions for Nova, which are not recorded. The README lists the features: syntax and semantic highlighting, diagnostic messages, IntelliSense completions with auto-imports, Emmet completions, props completions for JSX, TSX, Vue and Svelte components, code actions, formatting powered by Prettier and prettier-plugin-astro, symbols, hover information, go to definition and inlay hints, and a TypeScript plugin for importing Astro components into JavaScript and TypeScript files. The language server that powers the extension is in the monorepo under packages/language-tools/language-server.
