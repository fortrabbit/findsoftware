notes: >
  Discontinued on two signals: the homepage and the README both state that PhantomJS development is suspended until further notice, and the repository the homepage names as its source (github.com/ariya/phantomjs) is archived. The last tag is 2.1.1 (commit dated 2016-01-24); the repository has tags but no GitHub release objects, so the tag commit date is the release date, and the README's "latest stable release" is version 2.1. The first tag is 1.0.0 (commit dated 2011-01-17), which sets firstRelease. The npm packages phantomjs (deprecated: renamed to phantomjs-prebuilt) and phantomjs-prebuilt (deprecated) are third-party wrappers of the binary, not the project's own package, so they are not recorded. The download page's FreeBSD pkg command is a third-party package route and is not recorded as an installMethod. The README's CI sentence ("ideal for continuous integration systems") and the homepage's server-side screenshot use both occur, so no runsAs is recorded. The README says PhantomJS is created and maintained by the handle @ariyahidayat, with the help of many contributors; the LICENSE.BSD copyright line is a template with the placeholder COPYRIGHT HOLDER, so the maintainer is the name in the homepage copyright line, "PhantomJS contributors". The homepage's http address redirects to https, so https is recorded. The repository has no successor named by the project.
