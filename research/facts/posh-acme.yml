notes: >
  Scope doubt: the project's pages describe SSL/TLS certificate creation with ACME, DNS and HTTP challenge plugins, a Windows certificate store import (Install-PACertificate, New-PACertificate -Install) and a local HTTP challenge listener. The main docs page never names a website as the module's target, and the tutorial says the module is "only designed to obtain certificates, not deploy them to your web server or service"; the guide "Using Alternate Trust Chains" says "your website/application is still serving the default chain" and names IIS. Criterion 1 is judged in as an ACME client, the same class as certbot and acme-sh, and a reviewer should confirm that the pages say enough about websites to keep it listed. The main docs page says the module runs on Windows PowerShell 5.1 with .NET Framework 4.7.1 or later and on PowerShell 6.2 or later (Core edition) on all supported OS platforms; the -Install switch is Windows-only, per the FAQ. The docs page's install section names the PowerShell Gallery; the GitHub release page is named as the alternate source. The license is MIT; the copyright line in LICENSE reads 2017 while the manifest copyright reads 2018, and the manifest author is "Ryan Bolger". The runtime "powershell" and language "PowerShell" are not values in the field dictionary (src/data/fields.yml), so the import will drop them; a reviewer decides whether to add the value. The DNS plugin list on the docs page is not counted. The PowerShell Gallery download counts are not in the adoption registries this dataset uses, so no install figure is recorded. Fields coined here: none.
