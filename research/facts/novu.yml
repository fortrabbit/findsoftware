notes: >
  The record covers the Novu server and its Docker Compose community edition; the monorepo at novuhq/novu (default branch next) ships the API, worker, WebSocket service, dashboard and the @novu/* client packages. The install docs name the Docker setup and the monorepo; the core release tags are the plain v-prefixed ones: v3.19.0 (2026-08-07) is the newest stable, so currentMajor is 3 and latestReleaseDate follows it. Packages in the same repository were released later (@novu/framework v2.14.0 on 2026-09-28, @novu/js v3.19.2 and @novu/react v3.19.2 on 2026-09-07), but they are client packages, not the server release. The newest core prerelease is v0.5.0-alpha.0 (2022-06-21), older than the latest release, so no latestPrereleaseDate is recorded. No npm figure is recorded: @novu/js is a client SDK (291310 downloads for 2026-10-26 to 2026-11-01), not the server, which installs from Docker images. The npm package @novu/node is deprecated on the registry (its latest 2.6.6 note: end of support on March 20, 2025, moved to @novu/api); it is a sibling SDK, not this record's package, so it is no end signal here. The copyright holder is Noti-fire Apps Ltd. per LICENSE-MIT (the privacy page names the same company as "Noti-Fire Apps Ltd. d/b/a"). The enterprise folder is under the Novu Proprietary Software License (LICENSE-ENTERPRISE), which names Novu Corporation as the licensor; the wave 46 rule keeps the LICENSE copyright holder as maintainer and the other entity here. The community self-hosted edition lacks custom SAML SSO and OIDC providers, RBAC, multi-factor authentication, social sign-in, the Novu branding removal and workflow translations; the cloud comparison table lists these as cloud features, so sso and userRoles are not recorded for the software. Workflow translations exist on Novu Cloud only: "Translations are available on Novu Cloud only. Community Self-Hosted deployments don't include the translations feature." (docs.novu.co/platform/workflow/advanced-features/translations). runsAs is the Docker guide's statement that all services run on one virtual machine through Docker Compose. runtime is not recorded: the only Node.js statement is a developer requirement of the local-run docs. The local-run route (pnpm workspace from the repository) is a development setup and is not recorded as an install route. The docs footer links comparison pages on novu.co (Courier, Knock, MagicBell, SuprSend, building in-house); the docs have migration guides from Courier and Knock, which are not an import tool, so importsFrom is not recorded. alternativeTo records only the ids that have fact files (courier, knock). The Docker setup script generates JWT_SECRET, STORE_ENCRYPTION_KEY and NOVU_SECRET_KEY and runs docker compose up; the community edition uses LocalStack for S3 by default, which the docs say is not started by the community compose file. The contributors count is 377 from the rel="last" page of the contributors endpoint. The README lists workflows with branching and conditions, digests, a no-code email editor and an embeddable Inbox React component; the docs link the self-hosting overview.
