notes: >
  The CSV lists this as a hosted-service, but the boundless-commerce.com open-source page links Docker images and three MIT-licensed GitHub repositories for a self-hosted install, so criterion 2 holds and the status is accepted; a reviewer should confirm. The platform is three repositories (admin with events handler, API, and database) plus the Docker images for Redis, RabbitMQ and Memcached named in the admin compose file; the admin repository is recorded because its README holds the install steps, and the API repository is PHP on Yii2 per its README. The admin repository LICENSE.md copyright line reads "Copyright (c) 2012-2023 Scott Chacon and others", which is not this project's maintainer, and package.json says ISC; both are recorded as separate license entries. The hosted service offers a free trial; its Pricing link is an anchor on the homepage, recorded as pricingPage, and no price is recorded. The docs site at docs.boundless-commerce.com returns a page with no readable text, so it is unreadable and the docs fact is only the link from the homepage. The hqCountry fact is taken from the privacy policy sentence "This website originates from Denmark." and is the only location statement on the site; a reviewer should decide whether it counts as headquarters. The GitHub repository owner is an individual, and the site names no legal entity. The admin repository has no release or tag, so the default-branch commit date is the lastCommitDate. The admin package.json names "Boundless-Commerce" as its package, which is not recorded as an npm id because no registry lookup was made; no npm download figure is recorded.
