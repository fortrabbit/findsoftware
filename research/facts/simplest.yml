notes: >
  No page states the runtime: the README shows npm, npx and pnpm commands but never names Node.js, so runtime stays unknown. The README lists optional Sass, Markdown, Pug and Svelte support next to plain HTML. The GitHub homepage field points to the npm package page, a registry page and not the project's own site, so no homepage is recorded. The npm page answers 403 with a bot challenge, so the npm metadata is read from the registry API. The repository has no GitHub releases and no tags; currentMajor comes from the npm latest tag 0.13.1, which is major 0. The repository has no LICENSE file; the license is the MIT in package.json. package.json declares no engines field, so runtimeMin is unknown. The README names SvelteKit and Astro under "When not to use Simplest"; no alternativeTo is recorded because that section is advice, not a comparison the project makes between its own software and another. The README also describes PHP parsing through the PHP dev server; it is a development setup in a section the README does not present as a hosting requirement, so no per-request runsAs is recorded. The last push and last npm publish are both 2022-09-27, more than four years before the check date, so the import moves the record to stub on its own. npmWeeklyDownloads is the week 2026-10-12 to 2026-10-18.
