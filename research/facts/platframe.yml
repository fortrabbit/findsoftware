notes: >
  Status is accepted: no archive flag, no deprecation and no end statement were found. The latest release is v2.4.2 (2021-01-06) and the last push is 2023-01-24; under AGENTS.md the import moves a record with no release in four years to stub, so the listing will change on its own. The homepage and docs both show version 2.4.2. The oldest GitHub release is v1.1.0 (2018-03-30), which sets firstRelease. Major 2 is the highest stable release. The README describes the project as a frontend platform used as a blueprint or as a static site generator; the static output is recorded only as the rendering mode the README names, since no page says the production build is a set of static files. The docs name Node.js and NPM or Yarn as prerequisites and yarn build as the production build. The package name platframe is not on npm (404), and no npm package was found for it. The maintainer is recorded as the README copyright line gives it; the cygnul.com page names no legal form. The gidhon author line is the repository's author, not the maintainer of record.
