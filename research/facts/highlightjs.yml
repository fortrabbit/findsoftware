notes: >
  The homepage's description is "The Internet's favorite JavaScript syntax highlighter supporting Node.js and the web." The README says "It works in the browser as well as on the server", so the library names both the browser and Node.js: runtime node is recorded and no runsAs. The README's Requirements section lists Node.js and npm versions only for contributors, so no runtimeMin is recorded. The LICENSE copyright line names Ivan Sagalaev; the README names a Core Team and contributors (CONTRIBUTORS.md), which is not a legal entity, so the maintainer follows the copyright line. The README names a second npm package, @highlightjs/cdn-assets, for prebuilt CDN assets; its figure is not recorded, and the npm figure is for highlight.js, the package the install section names first. The README's Getting the Library section also names the @highlightjs/cdn-assets npm package for the prebuilt assets, and a Vue plugin in a separate repository (highlightjs/vue-plugin); the Vue plugin is not recorded as a field. The language count (over 180 core languages, 516 themes) is a coined kind and is not recorded. The repository's tags run from 5.3 (commit dated 2009-08-23); the GitHub repository itself was created in 2011, so firstRelease comes from the oldest tag commit. The GitHub contributors figure counts all pages of the endpoint.
