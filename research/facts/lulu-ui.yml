notes: >
  The project has no version numbers: the README says LuLu UI has no version concept and uses the publish date as the version, so npm versions are dates (2026.7.14, the latest) and no currentMajor is recorded. The GitHub repository has one release (v3.0.0, 2023-03-13) that predates the npm date versions; latestReleaseDate is the npm publish date. The install docs name the npm package lu2; the npm package lulu-ui is a different 2019 project by another author and is not used. The README says the Modern and Peak themes have stopped being maintained, and the Edge theme is the one maintained; the project itself is not declared ended, so the status stays accepted. The Modern and Peak themes are based on jQuery, and the README names jQuery only for those themes, so basedOn is not recorded. The README gives the birth year as 2015; firstRelease is the first npm upload (2020-11-23), since the project states no earlier release. The maintainer is named as 阅文集团 (Yuewen Group) in the README; the Yuewen site footer reads "© 2026 阅文集团版权所有", and the LICENSE copyright line reads "2017 阅文前端". The company's country is not on the pages read, so hqCountry is left out. The README describes five themes (Modern, Peak, Pure, Edge and Hope); Edge is the theme it names as maintained, and its usage and release guide is in Chinese, as is the README.
