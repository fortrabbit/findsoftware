notes: >
  The CSV row says no versioned release found, but the repository has tags up to 4.8.0-R (tagged 2026-09-09) and a 4.9.0-M1 milestone tag (2026-10-15), and the repository has no GitHub Releases; currentMajor is from the Maven Central release of org.eclipse.rap.rwt (4.8.0), which agrees with the highest stable tag. The Maven metadata gives no release dates, so latestReleaseDate comes from the annotated tag object. The project's download page gives 4.8 as published September 9, 2026 and 4.9 M1 as October 9, 2026, while the 4.9.0-M1 tag is dated October 15, so the tag date is recorded. The GitHub tags start in 2008 under names such as v20080103, and the project's anniversary post, linked from the homepage, names October 2007 for RAP 1.0. The repository has no homepage-linked Discord or Mastodon link; the homepage links only the Twitter account. The developer guide's deployment page is marked obsolete in favor of a Tycho WAR build, so it is not cited for runsAs. The homepage describes RAP as a widget toolkit with an SWT API; no basedOn is recorded because no page names a parent project. The installation docs name the Eclipse target platform and the RWT jar, not a Maven artifact, so mavenCoordinates is the registry id only, with no download figure. The Java minimum is not stated on any page read, so runtimeMin is unknown. The homepage says RAP integrates with OSGi and JEE and runs on any JEE servlet container. The application setup page (https://www.eclipse.org/rap/developers-guide/application-setup.html) says the default mode is fully compatible with JEE, and that the SWT compatibility mode starts a separate UI thread for every user session, where code cannot directly access JEE transaction or security contexts. The Eclipse IDE target page (https://www.eclipse.org/rap/developers-guide/target-install.html) and the RWT standalone page (https://www.eclipse.org/rap/developers-guide/rwt-standalone.html) describe the two setups the prose names. The Eclipse Foundation AISBL is named as the entity that makes the project available on the terms page.
