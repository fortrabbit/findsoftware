notes: >
  The CSV homepage is the Tempest package page that redirects to its 3.x path; the final address is recorded. The GitHub homepage field and the README both point to the Tempest docs, and the docs page is the project's own site. The docs describe the highlighter as Tempest's package and the Tempest framework (tempest.yml) is a separate record; no basedOn is recorded because the page calls it a package of the project and does not say it extends or is built on the framework, and the package installs alone with composer. No runsAs is recorded: the docs say server-side but state no process model. Output is HTML with CSS themes, and the docs also describe terminal themes; these are coined output formats and stay in notes. The docs list no supported languages inline and point to the GitHub repository for them. The release history has 1.x tags (1.3.5 on 2026-09-30) beside the 2.x line, and the highest stable release is 2.30.0, which sets the major. The maintainer is named in the LICENCE copyright line, which also names the Tempest framework's maintainer; the repository owner is the tempestphp organization.
