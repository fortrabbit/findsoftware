notes: >
  The project has tags but no GitHub releases; currentMajor and latestReleaseDate come from the tags the documentation site names as v1.19.1, released on 2025-01-14.
  The repository was last pushed on 2025-01-14 and the README describes no later version.
  The PyPI package named wmk is a different project (World Model Kit, journee-live); it is not recorded as this project's registry package.
  The README names a Python version nowhere; the runtimeMin field stays out.
  The firstRelease year comes from the oldest tag, v0.9, committed on 2022-08-24.
  The README's wmk admin command starts a separate project, wmk-admin, which is not recorded here.
  The runsAs value is static for the built htdocs output (the README calls wmk suitable for static websites); the README's watch and webserver commands are for local preview.
  The requirements field is coined here for what the README says the host must provide: a Unix-like environment with bash installed in /bin/bash, and rsync for copying static files. The README gives three install routes: git with pip in a virtual environment, a Homebrew tap, and a Docker image built from the Dockerfile in the repository.
