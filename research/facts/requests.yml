notes: >
  HTTP client, accepted under the wave 60 ruling for HTTP clients; the CSV boundary state is not a record status. Repository and PyPI homepage: the repository names https://requests.readthedocs.io/en/latest/ as its homepage, which is the project's documentation site. The README footer names Kenneth Reitz and the Python Software Foundation (logo links); the NOTICE copyright line names Kenneth Reitz, so maintainer follows it. pyproject.toml lists Ian Stapleton Cordasco and Nate Prewitt as maintainers, not recorded as the maintainer. The README says Requests is "depended upon by 4,000,000+ repositories" and links the GitHub dependents page, so no reportedInstalls figure is recorded. pypistats last_month is a rolling 30-day window read on 2026-11-16. The dependent counts come from ecosyste.ms, last synced 2026-11-16. Requests does not state a runtime for browsers or servers, so no runsAs is recorded. urllib3, idna and charset_normalizer are dependencies and give no basedOn. The responses record mocks this library, and its tagline names it; that is a mocking relationship, not a basedOn statement. Oldest release: PyPI and the v0.2.0 tag both date from February 2011.
