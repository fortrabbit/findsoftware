notes: >
  The record covers the hosted Brevo platform. The SDK repository getbrevo/brevo-node (npm @getbrevo/brevo, 227.4 thousand downloads a week in the candidates row) is a client library and takes no repository, license, stars or npm figure here. The terms of use name Brevo, a simplified joint-stock company, as the contracting party, and its US terms name a separate entity, Brevo INC. US, with an office in Austin, Texas; the privacy page's Brevo SAS is recorded as maintainer. The security page's claims, ISO 27001:2022 certification and GDPR, CASL and CCPA practices, have no field and are not recorded. The pricing page's transactional email features name RESTful APIs, SMTP and outbound webhooks. The homepage's LinkedIn and YouTube links have no field. The developer docs' rate limits page names three tiers, and its values are not recorded because they change more often than yearly.
