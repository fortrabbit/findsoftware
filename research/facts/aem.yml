notes: >
  Stub: the product page (business.adobe.com/products/experience-manager/adobe-experience-manager.html), the homepage the CSV names, and the sites page next to it did not answer curl at all (connection fails) on a retry at 2026-10-24 with the research User-Agent, and adobe.com answers 403, so no homepage is recorded; a later pass that can read the product page would settle it. Criterion 2 holds on the AEM 6.5 on-premise docs, which describe the quickstart jar as a self-hosted install. Adobe publishes no repository, so no GitHub figures are recorded. The Cloud Service is a hosted offering recorded as hostedOffering, not as the install, and AEM Managed Services is a third deployment the same page names. The currentMajor value 6 follows the 6.5 line; AEM as a Cloud Service is not versioned by major. No latestReleaseDate is recorded. The technical requirements page lists Oracle JDK 8 and later (8, 9, 10, 11, 17, 21) and several databases for the repository (MongoDB, Oracle Database, IBM DB2); only MongoDB and Oracle are recorded. The maintainer is recorded as the product name, Adobe; no legal notice or terms page was readable, so the legal form is not recorded. The first-release year and paid editions are not stated on the pages read.
