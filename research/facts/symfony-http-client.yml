notes: >
  Status accepted under Frank's 2026-11-16 ruling that HTTP clients are in; this row was a boundary row. Criterion 1: a library a site or app calls to fetch remote resources, such as an API. Criterion 2: installed with Composer from Packagist (symfony/http-client), the route the package page gives. Criterion 3: the package page and the component docs. Criterion 4: the repository is not archived, no Packagist abandoned flag, and no deprecation; the latest stable release v8.1.11 is dated 2026-11-04. The repository is a read-only split of symfony/symfony: its README sends issues and pull requests to the main Symfony repository, which has 31442 stars and a default branch 8.2 (api, 2026-11-16); the stars, contributors and downloads recorded here belong to the split. The maintainer follows the LICENSE copyright line (Fabien Potencier). The Symfony legal notice at sensiolabs.com names Symfony SAS, a company in Asnières-sur-Seine, France; it is the company behind the framework and not recorded as the maintainer or hqCountry for this package. The docs list interoperability with Symfony Contracts, PSR-18 and PSR-17, HTTPlug and Guzzle, and say that in the Symfony framework the client is available as the http_client service, autowired when type-hinting HttpClientInterface; these are not recorded as fields. HTTP/2 support is named in the docs and not recorded. The firstRelease is 2019, the year of the oldest Packagist version (v4.3.0-BETA1, 2019-04-28); the packages page gives March 2019.
