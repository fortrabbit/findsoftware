notes: >
  The site's "Need help?" link goes to a Gitter chat room, which is no forum or discussion board, so it is not recorded. "Support Us" links to an Open Collective page; no field fits a donation link. The site documents a separate milligram-cli npm package that scaffolds a sample project; it is not the library's install route and no figure is recorded for it. The GitHub repository reports HTML because of its examples; the package ships dist/milligram.css, so language is CSS. The maintainer's e-mail address on the LICENSE is not recorded. The npm registry's first upload is version 0.0.1 on 2015-12-10 and the first GitHub release is 1.0.0 on 2015-12-26, both in 2015. The X link is the project's "On Twitter" navigation link, which points to the maintainer's account. The homepage calls the project a minimalist CSS framework and says it is "not about a UI framework"; that wording is not recorded as a category. The homepage says Milligram uses the CSS Flexible Box Layout Module for its grid, and tells a project to add the main Milligram file and the CSS Reset in the header.
