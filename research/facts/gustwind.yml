notes: >
  The CSV lists the category deno. The npm package, the install docs and the homepage name Node.js; the only Deno mentions are the GitHub template's tasks (deno task start, deno task build) and a line in the gustwind-node README that calls the Deno Twind plugin old, which is too little to record deno as a runtime. basedOn is not recorded: the docs name Vite only for the Node dev server (gustwind-node README, "a Vite-backed Node development server"), which is a dependency, not a parent. Registry figures come from the npm package gustwind, which the install docs name. https://jsr.io/@gustwind answers 404 and the JSR API reports scopeNotFound, so there is no jsrName. firstRelease is not recorded: the first npm publish is 0.1.0 (2024-02-26), but the GitHub repository dates from 2020 and has a v0.1.0 tag from 2021, so no source states the first release. latestReleaseDate is the npm latest (2026-07-10); the GitHub latest release is older. npmWeeklyDownloads covers 2026-10-12 to 2026-10-18.
  The homepage says development mode lets you preview the site and production mode emits static HTML with CSS inlined, that HTMLisp is the default for templating and components, that data sources and route definitions connect content to pages, that plugins can replace parts of the system, and that the APIs change every once in a while. The docs index names concepts, configuration, routing, templating and deployment pages.
