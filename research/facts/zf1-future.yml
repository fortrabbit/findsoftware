notes: >
  The README names the ZF1-Future manual at zf1future.com, which does not resolve; docs points to the original Zend manual the README also names, and the repository's documentation folder is not recorded. The README states the community continues ZF1; GitHub also marks the repository as a fork of zendframework/zf1. The upstream zendframework/zf1 repository is archived and its description says it reached end of life on 2016-09-28; that is the upstream's status, and it does not change this repository's status, which is not archived. The maintainer is the community the README names; the repository belongs to the GitHub user Shardj, and no page names a person or company as maintainer. The LICENSE.txt copyright line reads "Copyright (c) 2005-2015, Zend Technologies USA, Inc.", the original copyright holder, and is not recorded as the maintainer. The license is recorded two ways: GitHub reads BSD-3-Clause from the LICENSE file, and the README says the files are "released under the Zend Framework license"; both are recorded as stated. The README says the framework is tested by users up to PHP 8.2 and that 8.3 and later can have incompatibilities; not recorded as a field. The README's Related Projects section names ZF1 Extras Future and ZF1s; they are separate projects and not recorded here. The Packagist package shardj/zf1-future is the one composer require names; its version count and monthly figure (166298) are not recorded beyond the total.
