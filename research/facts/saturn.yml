notes: >
  The homepage's footer Twitter link (twitter.com/Lambda_Factory) sits under "Created by Lambda Factory" and is that company's account, not presented as the project's channel, so x is not recorded. The NuGet package names Krzysztof Cieslak as author and the README is written in the first person by him; the LICENSE copyright line and the homepage name Lambda Factory, so maintainer follows the project's own legal line. Lambda Factory's site shows no imprint or terms page, so hqCountry is unknown. The NuGet package targets net6.0 (its nuspec), which is the source of runtimeMin. The getting-started page still says dotnet SDK 3.1; that is an older tutorial and is not recorded. The overview names Dapper and Simple.Migrations as the template's default libraries and Giraffe View Engine as the suggested view engine; neither is recorded as templating because the view engine is F# code, not a template language. The overview names Kestrel as the web server, which sets runsAs; Saturn.AzureFunctions and Saturn.Extensions.HttpSys have reference pages without prose and are not read for a deployment target. The guide says the project generator uses only SQLite, which describes the generator, so databases is not recorded. firstRelease is the created date of NuGet package version 0.0.1 (2017-12-31), earlier than the first GitHub release. lambdafactory.io now redirects to an unrelated site and is not linked. The Giraffe and ASP.NET Core links from the overview are the upstream projects, not parent facts beyond basedOn. The site's sidebar and the NuGet package point at saturnframework.org, which answers over https.
