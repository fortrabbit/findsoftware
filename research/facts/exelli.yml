notes: >
  Stub: in doubt on criterion 3 and 4. The README has no installation steps: its only dependency instruction is "Add it to mix.exs" for an extra Elli middleware, and the Hex package page shows a dependency line (configs in the Hex API response) but no install page. The project never tags or releases on GitHub, so the import judges it by lastCommitDate (2022-06-05 on master), which is more than four years old; a documented install or a newer commit would settle it. Hex is the package registry the dependency line names, and its only version is 0.1.0, uploaded 2014-12-06, so currentMajor is 0 and firstRelease is 2014 from the registry upload rather than a GitHub tag. The hexDownloads figure of 781 is the all-time total from the Hex API (downloads.all); the same response gives 15 for the last week, not recorded. GitHub reports the license as NOASSERTION, and the Hex metadata lists Apache 2.0; the LICENSE file is the Apache License 2.0. The Hex package has no retirements. The README links no homepage, docs or forum. Prose sources: the README shows a handler module using Exelli.Handler with get and post blocks, a router module that enables handlers and middleware with prefixes, and a call to Exelli.elli_start to start Elli with them, and says that other Elli middleware can be enabled after adding it to mix.exs. The same README shows Exelli.elli_start accepting a plain list of middleware and handler entries in place of a router.
