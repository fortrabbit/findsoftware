notes: >
  The homepage of the staging host pf-react-staging.patternfly.org is not linked; the production site is. The repository is a monorepo of several React packages; the HTML and CSS library is a separate repository, recorded as patternfly. The install docs name @patternfly/react-core as the core package, so the npm figures are for it. The React packages are maintained together and the develop page says so. The develop page names React 17, 18 and 19 as supported by PatternFly 6; no runtime is recorded because the page states a supported React range, not a runtime of the package. The highest GitHub release v6.7.0 is the major counted. The GitHub contributor count is for the whole monorepo.
