notes: >
  Hosted-service record for the Stytch platform. The GitHub organization stytchauth hosts SDK repositories (stytch-node is the candidates row's repository, with 116 stars and the npm stytch package at 182.8 thousand weekly downloads per the row); none of it is recorded, per the hosted-service rule. The homepage says Stytch has joined Twilio, so parent is Twilio. The terms page at stytch.com/legal/terms-of-service serves the Twilio Terms of Service (last updated July 16, 2026) and links the prior Stytch terms on twilio.com; the Twilio contracting entity is therefore the maintainer by the terms-page rule, and the parent and maintainer are both Twilio. The Stytch brand remains the product name on the homepage and pricing page. The migration page is about moving existing users to Stytch on live deployment, not a self-hosted install; no self-host option was found, so selfHostOption is unknown. The docs pages on stytch.com are a JavaScript shell for most content; the llms.txt index and the enterprise-ready and migration guides were read as markdown or rendered text. The pricing page lists an always-free tier of 10,000 monthly active users and AI agents (freeTier is coined, kept here) and Enterprise custom pricing, and a HIPAA/BAA entry (compliance, coined, kept here); hosted tiers are not a paidEdition. The homepage lists Slack and the Stytch YouTube channel; neither is a field. The Stytch admin portal is an embeddable component for the customers of an app, recorded in notes, not as adminUi.
