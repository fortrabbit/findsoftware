unreadable:
  - https://moodle.org/ (answers 403 with a bot challenge page)
  - https://docs.moodle.org/ (answers 403 with a bot challenge page)
notes: "moodle.org and docs.moodle.org answer 403 with a bot challenge to the generic user agent, so the install requirements, supported databases and runtime model are not recorded from those pages; the record needs them from a readable source before the prose can describe installation. The challenge was not worked around. The README, composer.json at the v5.3.0 tag, the GitHub API and endoflife.date were read instead. The README says Moodle is free and open source software run on the user's own web server, which is recorded as an installMethod; it does not state a runtime model, so runsAs is not recorded. The composer.json license is GPL-3.0-or-later and the README says version 3 of the GPL; both are kept. The moodle.com footer names Moodle Pty Ltd; no headquarters country is stated, so hqCountry stays out. The contributor count includes anonymous contributors where GitHub lists them. The CSV's note says the release date comes from the git tag; endoflife.date gives 2026-10-03 for 5.3.0 and is recorded."
