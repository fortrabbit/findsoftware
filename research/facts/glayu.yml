notes: >
  The project's own site glayu.com no longer shows the software: http://www.glayu.com/ answers with a redirect to a domain-parking page (domains.atom.com, a Cloudflare challenge page that cannot be read), and the README's documentation link points to the same host. The site is served over plain http only, so it is not linked either way; no homepage is recorded, and the status is stub under AGENTS.md criterion 4. The repository has one tag, 0.1.0, and no GitHub release or registry package; the tag's date is not recorded and no currentMajor is taken from it. The last push to the default branch was 2017-08-25. The runtime is Erlang, which the README names as a prerequisite; the README states no minimum version. The install step is the glayu binary linked in the repository at apps/glayu/glayu. The copyright holder is Pablo Martínez in the LICENSE file; the GitHub profile name is "Pablo Martinez". The README also names a preview server and two themes, which are not recorded as fields.
