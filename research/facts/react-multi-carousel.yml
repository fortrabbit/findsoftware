notes: >
  The repository names no homepage; the README links its documentation at react-multi-carousel.surge.sh, cited as docs, and the README's demo link is the SSR example at react-multi-carousel.now.sh, not a homepage, so homepage is left out. The LICENSE copyright line carries the name in brackets, "[YI ZHUANG]", and the README author line reads "Yi Zhuang"; the LICENSE form is recorded. The README says SSR is supported and that the carousel can render on the server, but no sentence names the runtime or where it runs, so runtime and runsAs are not recorded. The package.json declares engines node >=8 for the latest release; that is a manifest floor and no page states a runtime minimum, so runtimeMin is left out. The README says work on a version 3.0 rewrite is under way; no version or date from it is recorded, and the latest stable release is 2.8.6 on npm. The GitHub releases stop at 2.5.4 (2020) and the npm registry holds the newer 2.x releases, so latestReleaseDate takes the registry date. The README features list names RTL support and the props table describes the rtl prop, recorded as i18n rtl. The npm weekly figure is for the react-multi-carousel package the install line names.
