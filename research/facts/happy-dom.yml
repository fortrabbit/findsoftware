notes: >
  No homepage: the repository's homepage field is empty and the npm homepage is the GitHub repository; happy-dom.org, happydom.dev and happy-dom.dev do not resolve, so the record has no own site and the docs are the GitHub wiki. Monorepo: the repository holds packages/happy-dom (npm name happy-dom), the packages/@happy-dom/* scope and integration tests; stars, contributors and the repository license belong to the monorepo, and the npm and dependent figures to the happy-dom package. The engines minimum is in packages/happy-dom/package.json at the 21.0.4 tag. The wiki Home page names JSDOM as an alternative ("can be used as an alternative to JSDOM"); no jsdom record exists in research/facts, so no alternativeTo is set. The wiki calls the library a test environment for Vitest, Jest, Bun and the Node.js test runner, and the README lists Testing Library, LitElement, Vue, React, Svelte and Angular under Works With; these are integrations, not basedOn. No runsAs is recorded: no page states where the library runs for a user, and the testing and server-side rendering uses are not a process model. The Getting started wiki page gives npm install happy-dom as the install command. The runtime node comes from the engines field of the package manifest at the 21.0.4 tag, since no wiki sentence names Node.js as where the library runs. The releases from v0.0.1 (2020-10-04) to v21.0.4 are all stable; the npm package was first published as 0.0.1 on 2019-09-15, which is older, so firstRelease is 2019. The LICENSE and README name David Ortner; the repository owner is the user capricorn86. The README sponsors list (Cloudflare, Sentry, Canonical, Frontend Masters) is not recorded as a field. The README lists the DOM features custom elements, declarative shadow DOM, mutation observer, tree walker and the Fetch API. The wiki Setup as Test Environment page says that waitUntilComplete and abort do not fully work in Vitest by default, because Vitest does not use Happy DOM's timer methods, and it gives a workaround that copies the timer functions into the global scope.
