notes: >
  The GitHub homepage field and the README name http://www.tornadoweb.org, which redirects to https://www.tornadoweb.org/ and then to the docs; the https address answers, so it is recorded as the homepage. The repository has no GitHub release objects, only tags; the newest stable tag is v6.6.0, the same as the PyPI release 6.6, so currentMajor and latestReleaseDate come from PyPI, where the 6.6 files were uploaded on 2026-10-21. The PyPI JSON reports no download counts (its downloads figures are -1), so pypiDownloads comes from pypistats.org (last_month). firstRelease is the year of the oldest PyPI upload (0.2, 2010-05-18), since no GitHub release exists and the repository's creation in 2009 is not a release date; the release notes start at 1.0 (July 2010) and say there were earlier versions. The project states it was originally developed at FriendFeed and that it is not based on WSGI; neither is a field, so both stay in the prose source only. The maintainer is recorded as the copyright line and the PyPI author name, Facebook; no legal form is stated. No page names a database. The index page says Tornado is designed for Unix-like platforms and will also run on Windows, which is not officially supported or recommended for production use and lacks multi-process mode. The index page says Tornado is not based on WSGI, is typically run with one thread per process, and that its code is not thread-safe except for IOLoop.add_callback. The running guide recommends one process per CPU and a load balancer such as nginx in front of processes that listen on different ports. The index page says the project was originally developed at FriendFeed.
