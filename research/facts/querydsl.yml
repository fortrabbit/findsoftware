notes: >
  Doubt: no homepage is linked. The README names https://querydsl.github.io/ as the project homepage, and that address answers over HTTPS with a 301 to http://querydsl.com/, which serves the site over plain HTTP only; the querydsl.com certificate does not match its host name over TLS. Per the homepage rule the record links no homepage, and the reference guide and the tutorial links in the README point to the same plain-HTTP host. The homepage at http://querydsl.com/ (read on 2026-11-16) lists the modules JPA, SQL, Mongodb, JDO, Lucene and Collections, and states that Querydsl is licensed under Apache 2.0; those statements are not recorded as facts because the page is not reachable over HTTPS. The repository also ships Spatial, Scala and Kotlin modules; they are not recorded. The Maven coordinates recorded are the core package the README badge names. The Maven Central search API reports 24 gav entries for querydsl-core and the maven-metadata latest version is 5.1.0 (lastUpdated 2024-01-29); Maven publishes no download figure, so none is recorded. The first GitHub tag is QUERYDSL-20080220, committed 2008-03-06; the oldest Maven Central upload is querydsl-core 0.2.6 under the earlier group id com.mysema.querydsl (2008-08-12), the same year, so firstRelease is 2008. The README says queries are constructed through a fluent API instead of inline strings or XML files. The CHANGELOG 5.0.0 section says the release targets Java 8 minimally; the root pom sets maven-compiler-plugin source and target to 1.8 with a JDK 11 profile for building. The 5.1.0 release has no CHANGELOG section of its own. The repository's querydsl-docs folder is DocBook source for the reference guide, and the README calls its tutorials for JPA, SQL, MongoDB, Lucene, Collections and JDO the way to get started. The databases are the SQL dialects the repository's own SQL tutorial (querydsl-docs, DocBook source) lists with a tested database, plus MongoDB from the README backend sentence; the same list names Cubrid, DB2, Derby, Firebird, H2, HSQLDB and Teradata, which the database vocabulary lacks. The README Docker Compose section lists databases only for the project's own test suite and is not used. The GitHub homepage field of the repository reads https://querydsl.com, which does not complete a TLS handshake on 2026-11-16. The README "Slack" section is a contributor workspace and the "Google Group" is named as a place to ask questions; the GitHub discussions are the forum fact because the README names them for free support. The maintainer is the name the root pom gives for the project; the developer entries in the pom name Mysema Ltd as their organization, which is not recorded as the maintainer. The root pom sets project url to https://querydsl.github.io/. The contributors count is the page number of the last contributors page. Stars and contributors belong to the single repository.
