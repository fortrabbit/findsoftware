notes: >
  The README asks for new maintainers to finalize and release the next major version and lists funding for maintainers. That is a request for help, not an end or maintenance-mode statement, and the 6.x line is still released (last stable release is v6.37.8, 2026-03-07; the last push to main is 2026-11-12), so the status stays accepted. Sequelize 7 is alpha: the README badges point at the npm package @sequelize/core and the 7.x getting-started page installs it as @sequelize/core@alpha, so the npm name sequelize is the 6.x line the stable guide installs; the 7.0.0 alpha tags (latest v7.0.0-alpha.48, 2026-02-04) are older than the stable release and no latestPrereleaseDate is recorded. The homepage and README name the databases; the README and the releases page add DB2 and Snowflake, which are not in the field vocabulary and stay out of the file. The homepage links Twitter (twitter.com/SequelizeJS), recorded as x. The Slack invite and Stack Overflow tag are community channels and are not recorded as forum. The GitHub Discussions link in the README is recorded as forum. LICENSE copyright names "Sequelize Authors", and the homepage footer says "Sequelize Contributors"; the LICENSE line is the recorded maintainer. The package.json engines field at v6.37.8 is node >=10.0.0, recorded as runtimeMin, and the releases page states the same minimum for Sequelize 6. The v6 getting-started guide says "You'll also have to manually install the driver for your database of choice", so each database needs its own driver package next to sequelize. No endoflife.date product exists for sequelize, so endoflifeId is not recorded.
