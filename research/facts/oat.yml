notes: >
  The unscoped npm name oat is another project (Open Api Testrunner, version 2.0.12), and the repository vollq-ai/oat named in its metadata is not this project, so the figure recorded is for @knadh/oat, the package the usage page names. The README says a few dynamic components are WebComponents and use minimal JavaScript; no basedOn is recorded because the project names no framework it is built on. The usage page names unpkg as the CDN and the gh-pages branch as the download source. The author's personal site calls him a hobbyist software developer; no hqCountry is recorded for an individual. The highest GitHub release is v1.0.0 (2026-10-18), which matches npm latest for @knadh/oat. The repository was created 2026-01-15 and the npm package has a first version of 0.1.0 on 2026-02-10, so firstRelease is 2026.
