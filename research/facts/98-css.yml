notes: >
  The highest stable GitHub release is 0.1.18 (2022-05-22), and the npm latest is 0.1.21 (2025-04-28), which has no GitHub release; the registry's stable version is newer, so latestReleaseDate is its date. Both are major 0. The npm figure is the sum of the daily counts from the npm downloads range endpoint for 2026-10-18 to 2026-10-24. The x and Bluesky links are the author's own, named as "my twitter" and "my posts" on the homepage and in the README. The first GitHub release is 0.1.0 (2020-04-21), so firstRelease is 2020. The project's README names XP.css and 7.css as companion projects and does not say 98.css is built on another project, so basedOn is not recorded. The HTTP Archive technologies list (cdn.httparchive.org/v1/technologies) does not carry this project, so httpArchiveSites is not recorded.
