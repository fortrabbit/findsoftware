notes: >
  The pricing page says "BugSnag supports 50+ platforms across mobile, web, desktop, and server apps." (sdk languages, not recorded as a field). The on-premises install is sold as the Enterprise offering, which also lists SAML single sign-on; it is the product as a whole, not an edition of open source software, so no paidEdition is recorded. Status is accepted, not hosted-service as the candidate row says: the on-premises install is documented (the High availability installation guide, the single node and airgapped guides, and the Replicated KOTS steps), so criterion 2 holds for the proprietary self-install. The docs say a first install starts with contacting BugSnag for a license and a guided installation, and that the legacy single-machine version is deprecated. The on-premises install needs a Kubernetes cluster from 1.25 to 1.36 and SMTP credentials; those are noted here, not recorded as fields. The SDK repository (bugsnag/bugsnag-js) and its npm package @bugsnag/js are the client side and are not recorded, per the hosted-service rule; the server code is not public, so no repository is recorded. The homepage links x.com/smartbear and a SmartBear LinkedIn page; both are the parent company's accounts and are not recorded as the product's own links. The maintainer is SmartBear Software Inc. (terms, Somerville, MA, USA); the legal footer of the product site reads "© 2026 SmartBear Software", and the on-premises docs carry SmartBear branding; the parent is not recorded as a separate field. The security page claims "industry's strictest certifications for security, privacy, and control" and the pricing page lists "PCI and PHI compliance via On-Premises"; these are compliance claims and are not recorded as fields. The pricing page lists 30+ third-party integrations and Splunk and Amazon SQS data forwarding; no field fits, so they stay here. The pricing page's Enterprise tier is the only tier that lists SAML single sign-on and on-premises deployment, so the paidEdition fact covers that tier. The privacy and terms pages at the product domain are missing (404); the SmartBear terms are used for the legal name and address.

