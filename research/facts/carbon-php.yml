notes: >
  The name Carbon is shared with the Carbon Design System (id carbon) and with Carbon Charts (id carbon-charts); this record is the PHP date library and keeps the suffixed id. The README says the repository is migrating from briannesbitt/Carbon to CarbonPHP/carbon, that code on both is kept up to date, and that issues and pull requests may need a search of both; Packagist names CarbonPHP/carbon as the repository, so that is the record's repository. The old repository still answers with its own figures and releases: it has 16584 stars and 337 contributors on 2026-11-04, and its latest release is 3.15.1 as well; the stars here are the new repository's, a reviewer decides which repository's figures the record shows. The Packagist figures are the total and the monthly figure the Packagist package page reports. The docs sidebar lists Laravel, Symfony and migration pages; they were not read, so no basedOn or importsFrom is recorded. The docs describe the library as extending the built-in DateTime class; that class is PHP, not a record, so no basedOn is recorded. The docs say that Carbon uses immutable dates, so that operations return new instances; they also name time zone handling, human-readable differences such as "2 days ago", and date comparisons; these are feature statements and stay in notes. The no-Composer route in the README says to extract the archive and require autoload.php. The Packagist p2 record gives the latest stable 3.15.1 with require php ^8.1, so runtimeMin is 8.1. The first upload is 1.0.0 from 2012-09-11, older than the first GitHub release, so firstRelease is 2012. The LICENSE copyright line names Brian Nesbitt alone, so the maintainer is recorded as that name.
