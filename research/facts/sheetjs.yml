notes: >
  The project's source moved from GitHub to git.sheetjs.com; the README on the GitHub mirror (default branch github, last push 2024-04-18) names the new repository, and the repository field follows it. The GitHub stars and contributors belong to the mirror, and the GitHub mirror's tags stop at v0.18.5 while git.sheetjs.com lists 132 tags; the latest tag is v0.20.3, dated 2024-07-18, used for currentMajor and latestReleaseDate. The npm registry stops at 0.18.5 (2022-03-24): the install docs say so and send users to the CDN tarball, so the npm weekly figure counts downloads of the stale xlsx package on the npm registry, which the install docs no longer tell users to install; CDN installs are not counted. The GitHub mirror has no release objects, only tags. The CSV category spreadsheet-io has no mapping in the import, so the record takes library. The CDN lists the project as Apache 2.0 with attribution requirements; the license is one entry. The homepage describes a Community Edition marked "Requires attribution" next to a Professional Edition; the Pro page names features and a sales contact, with no price or license text on the pages read. Pro is recorded as paidEdition from its feature list; its terms were not found. The careers page says SheetJS LLC is based in New Jersey, a state and not a country, so hqCountry is left out. The maintainer follows the LICENSE copyright line ("Copyright (C) 2012-present SheetJS LLC"), which the docs footer repeats. The README adds that all rights not explicitly granted by the Apache 2.0 License are reserved by the original author, which is not a second license. Each route on the CDN page has its own installMethod entry with a sentence from the matching docs page (Node and bundler tarball, standalone script tag and download, AMD, ExtendScript, Deno, Bun); the Deno and Bun pages call that support experimental. The runtime quotes come from the Node, Deno and Bun docs pages. The Pro edition's features on the home page (priority support, powerful features) are not recorded as separate facts.
