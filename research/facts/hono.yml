notes: >
  The npm latest tag is hono 4.13.13, while the GitHub latest release is the @hono/vercel 1.0.1 sub-package, so the release facts come from npm. The npm engines field says node >=16.9.0 and the Node.js guide says the adapter works on versions greater than 18.x, so both runtimeMin entries are kept. The maintainer is the copyright holder named in the LICENSE file, Yusuke Wada, read as an individual. The "similar to Express" sentence is the project's own statement on its docs page, so alternativeTo is recorded from that page only. The Hono docs describe a framework without a frontend, which is not a field here.
