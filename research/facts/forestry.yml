notes: >
  Ended: on 2026-11-04 https://forestry.io/ answers 301 to https://tina.io/forestry/ (the final page is https://tina.io/forestry), and https://forestry.io/docs/ answers 301 to the same page. The Forestry product has no page of its own left, so no homepage is recorded and the redirect is the end signal the wave rules name. The tina.io page, headed "Goodbye Forestry.io, Hello TinaCMS", names TinaCMS as the successor, now maintained by SSW; the successor record is tinacms, and tinacms.yml is not edited here. The record has no fact for the maintainer or for a legal name: the successor page names SSW, which is the successor's maintainer, not Forestry's. The npm package forestry (iamcdonald/forestry, 0.4.1) is an unrelated library and is not the product. The repository forestryio/forestry-vscode (Apache-2.0) is the VS Code extension for Forestry projects; its license is the extension's, so it is not recorded as the product license. The forestryio organization holds 80 public repositories, among them forestry.io (the website, last pushed 2023-07-19) and many starter themes; none is recorded as the product repository. The category comes from the extension README's description of the product. The tina.io page compares the two products: it says TinaCMS has no preview button like Forestry's, and that TinaCMS commits content changes to the repository similar to Forestry. The Forestry product pages are unreachable, so no runtime, hosting or install fact is recorded.
