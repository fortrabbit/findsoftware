notes: >
  The README calls the GitHub Pages site a live demo, not the project's site, so no homepage is recorded; the project has no separate site. The repository has no releases and no tags, so no release fields are recorded and lastCommitDate is the committer date of the newest commit on master (the repository's pushed_at value is later and is not the commit date). The README says the build engine is "~400 lines of F#" and that it uses "No frameworks. No plugins."; the README also names MVP.css, microlight.js and FSharp.Formatting as dependencies, which are not parents and so are not basedOn. The README gives no .NET version, so runtimeMin is absent. The README says the blog is built by GitHub Actions and that the local build needs .NET; the workflow files are not read as a page. No page names a maintainer; the repository owner's GitHub login is mg0x7BE and is not recorded as the maintainer.
