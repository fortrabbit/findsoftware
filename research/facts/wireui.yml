notes: >
  Version 2 is the current major: v2.6.0 (2026-03-24) is the highest stable GitHub release; v1.20.2 is a 1.x line release. The install docs name the Composer package wireui/wireui, which has no npm package; Packagist total downloads are recorded from packagist.org. The README calls it a library of components for Laravel and Livewire, and the homepage describes Blade components for Alpine.js, Tailwind, Livewire and the Tall Stack; basedOn follows the "for X" statements on the README and the homepage. Requirements list Laravel 10.x to 13.x as a Composer dependency, which is no basedOn statement. Maintainer is WireUi as the LICENSE copyright line reads; the README names Pedro Oliveira as creator. The homepage links a LinkedIn company page (linkedin.com/company/wireui); there is no starter-list field for it. The homepage footer shows no legal name or country. The Platinum Sponsors section on the homepage is sponsorship, not a paid edition. The docs for version 1.x sit on v1.wireui.dev and are not read. Read pages: wireui.dev home, getting-started (which covers requirements, installation and publishing), packages, customize, components, and the README in full.
