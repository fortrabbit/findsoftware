notes: >
  The homepage http address redirects to the https address, which answers, so the https address is recorded. The README install section still describes Rails 5.2 and Ruby 2.5 to 2.7; the runtime fact is taken from the release notes of v11.0.0 instead, and the README's database list is the one the install section names. The Gemfile lists mysql2, pg and sqlite3. The application is installed from a release archive or a git clone, not as a gem, so no rubygems figure is recorded; the publify_core engine gem is named in the v11.0.0 release notes and is left out. The project's own homepage calls itself the oldest Ruby on Rails blogware and says it has existed since 2004, which predates the earliest GitHub release (release_7_0_0-beta1, 2013-09-05); firstRelease follows the homepage statement. The project was previously named Typo, a rename stated in the README; no successorOf is recorded. The homepage's demo credentials are not recorded. Current maintainers are four named people in the README; the project's own homepage names the project as the maintainer, which is what is recorded. The homepage Twitter link is a twitter.com address.
