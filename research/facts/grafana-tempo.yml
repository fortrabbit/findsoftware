notes: >
  Accepted as listed in the CSV. The project's own pages describe Tempo as a trace backend that receives traces from applications through OTLP, Jaeger and Zipkin receivers, which is the ingestion endpoint an app sends to. The homepage says the only dependency is object storage; the setup page says microservices mode of v3.0 needs a Kafka-compatible system, and the deploy page says v3.0 needs a Kafka-compatible message queue as part of its architecture. The setup statement is recorded. No page read says Tempo runs as a daemon or service in those words (the configuration page only names the dskit server), so runsAs is not recorded. The install page lists the binary, OS packages and a Docker image as routes; the first three installMethod entries share the page's sentence because it names each route; the Helm, Tanka and Docker Compose entries come from the deploy pages. The getting-started page says Tempo also powers Grafana Cloud Traces and Grafana Enterprise Traces; those products are not recorded. The README links a Tempo Slack channel; there is no field for Slack in the starter list, so it is not recorded. The LICENSE file is AGPL-3.0 and the README wording is AGPL-3.0-only, the same license. The maintainer is the legal entity from the privacy policy; the Tempo homepage names Grafana Labs as the project's lead. The firstRelease follows the oldest GitHub release v0.2.0 (2020-10-23).
