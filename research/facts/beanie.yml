notes: >
  Stars, contributors and downloads belong to the single repository BeanieODM/beanie. The README says the project is working on Beanie v3, a major release in progress; the stable major is 2 (2.2.0). The README names Bunnet, a synchronous version of the ODM, as a separate project; it is not recorded here. The homepage answers over https (the CSV row had http). The README and the homepage say "Data models are based on Pydantic": a dependency statement, not a framework binding, so basedOn is not recorded. The docs are the same site. The pyproject lists the maintainer as "Roman Right" with the BeanieODM organization owning the repository. Installation extras (aws, gcp, srv) are optional PyMongo extras and are not separate install methods. The PyPI upload history starts with 0.1.0 on 2021-02-23.
