notes: >
  Monorepo: the repository holds the core package, the extensions (@hookstate/*), the docs and the demo apps, so the stars and the 28 contributors belong to the monorepo. The npm figure and the latest release date come from @hookstate/core, the package the install docs name; the npm name hookstate returns 404. The GitHub release v4.0.1 (2023-03-31) is older than the npm upload 4.0.2 (2025-03-20), which is why latestReleaseDate takes the npm date; both are major 4. The getting-started page gives the npm route as the command "npm install --save @hookstate/core", with "yarn add @hookstate/core" as the same registry's alternative. The homepage and README say the library "works where React works, including mobile applications and server side rendering" and "supports all recent browsers"; that is compatibility, so no runtime or runsAs is recorded. The README says "a modern alternative to Redux, Mobx, Recoil, etc."; none of those names is a record id, so alternativeTo is not recorded. The homepage link labelled "Discussions" goes to the GitHub issues list filtered to the question label, and the README says "Any questions? Just ask by raising a GitHub ticket."; no forum is recorded. Extensions are published as separate @hookstate/* packages, and the homepage names a browser extension for development tools. The getting-started page states "Hookstate consists of the core package @hookstate/core and optional extensions @hookstate/*". The firstRelease year comes from the oldest tag, 0.9.0, dated 2019-05-31 on the commit. The getting-started page states "The library does not have external or peer dependencies, except React." The homepage lists "standard plugins" for state snapshots, tracked fields, state validation and local storage persistence. The getting-started page says a "Unified API for local, global, nested, scoped, extended and all other Hookstate states" makes the application code easier to maintain.
