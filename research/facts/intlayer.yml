notes: >
  The repository is a monorepo of several packages and apps; the npm package intlayer is the one the install page names, and the stars and contributors belong to the whole repository. The GitHub releases list holds the v9 line (9.8.1 the highest stable tag), and the registry's latest tag is the same version. The maintainer follows the LICENSE copyright line, which names Aymeric PINEAU; the homepage footer reads "© 2026 Intlayer, Inc." and no page gives the company's address, so hqCountry is not recorded. The LICENSE and the npm package both state Apache-2.0, and the terms of service repeat it; the terms add that "Code theft for commercial use is strictly prohibited" and that reusing the code to create direct competitor tools based on Intlayer without significant transformation or substantial value addition is prohibited. The visual editor is part of the open source project; the editor page says it runs on the creator's own infrastructure and loads the application in an iframe against a local editor server. The hosted CMS is the paid service, it can also be self hosted, and the homepage FAQ and the README also call the CMS free to use with extra features for Premium and Enterprise plan members; the plan tiers are for the hosted CMS and are not recorded as paidEdition. The homepage's plan link goes to app.intlayer.org/pricing. The self-hosting guide describes a desktop app, an all-in-one Docker container and a Docker Compose stack for the CMS, whose services include MongoDB, Redis and MinIO plus a REST API backend; only the Docker Compose route is recorded as installMethod, with its sentence, and only MongoDB as database (the stack's primary store). headlessApi is not recorded: the CMS page calls the CMS a headless content database and names an SDK, and the REST API in the self-hosting stack is the CMS backend's, not an API of the library. The library is shown as framework-agnostic, with bindings for React, Vue, Svelte and others; the page calls it a wrapper that can sit around i18next, next-intl and similar libraries, which is an integration and not basedOn. The runtime and its minimum come from the engines field of the latest npm version (Node.js 14.18 or later); no docs page states a minimum. The dependent counts are 0 in ecosyste.ms for the npm package, recorded as the source states them. The why page and the comparison table name next-intl, i18next, react-i18next, react-intl, next-i18next and vue-i18n as alternatives; only i18next has a record. Each migration page has its own importsFrom entry; the react-i18next page calls itself a migration from react-i18next / i18next. The self-hosting guide lists GitHub, Google, GitLab and Microsoft OAuth login variables for the CMS, a social login of the optional part, not recorded as sso. LinkedIn and TikTok links are in the README and the homepage and are not recorded: no field for them. The homepage's "Trusted by" or user counts were not found. The i18n field is not recorded because the library itself is the i18n tool.
