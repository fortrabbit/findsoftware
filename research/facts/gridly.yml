notes: >
  Hosted service. Criterion 1 was judged on the homepage's "Explore CMS" wording and the API docs, which serve content to other systems; the localization modules (translation management, computer-assisted translation) are product scope not recorded as fields. The pricing page lists the SSO feature in the plan comparison; the page does not show which plan carries it, so sso records only the protocol-less statement. The privacy page gives the registered address as Helsingborg, Sweden, and the footer names Gridly AB. The pricing page gives record and API request limits by plan; the figures are not recorded. The homepage links github.com/gridly-spreadsheet-CMS and a gridly-cli repository; as a hosted service nothing is taken from them. The API docs name a Basic, Advanced and Full API level on the pricing page; the endpoint levels are not recorded.
