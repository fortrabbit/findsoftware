notes: >
  Status is discontinued on the README notice in the default branch (dev), the only status signal found; the homepage has no end statement and lists current package versions, and the release list ends at 2016. The homepage answers over https (the http address redirects), so it is recorded as https. The npm package the install page names is concise.css (the CSV's npm name concise-css is not registered); the CLI is named in the README as concise-cli on the homepage. The homepage footer names James Kolce, Keenan Payne and "Concise CSS Contributors"; the MIT LICENSE names Keenan Payne and Jaime Hernandez and is recorded as the maintainer line. The homepage footer links x (Twitter) and the README links Twitter, the first over http and the second an https badge in the README, ; the x value is the README's https link, since the homepage's own link is http-only and is not linked. The language value Sass follows the homepage's own "Sass + PostCSS"; the repository's primary language is JavaScript (the CLI), and the package ships compiled CSS. Contributors counts accounts from the API list with per_page=1 without anonymous accounts, read from the Link header. The homepage also offers a UI kit and utility classes as add-ons; they are not separate records.
  The README describes the Concise CLI, which compiles the main source file into a style sheet.
