notes: >
  The maintainer name ends in 有限公司 (limited company), so maintainerType is company; repoOwnerType (the repository sits on the user account walkor) is left out because the import would derive individual from it. The project's pages are in Chinese; quotes are the Chinese text as the pages state it. protocols and serverNeeds are fields coined here; serverNeeds is the requirements page's Linux section (the page marks the rest as Windows-only: no extensions needed). The homepage lists webman, GatewayWorker and MQTT as projects in its ecosystem; they are separate software and are not recorded here. The homepage names commercial products (a customer service system and an instant messaging system) that are not editions of Workerman, so paidEdition stays unknown. The requirement page says PHP 5.4 or later, which the latest release (composer require php >=8.1) contradicts; runtimeMin follows the latest release and the older page is not used for it. The contributors endpoint without query parameters returns the first page only; a full count of 129 comes from paginating it with anon=true. The repository created_at (2013-12-08) and the Packagist time (2015-05-25) are registration dates, not a first release, so firstRelease stays unknown. Packagist also reports 158962 monthly downloads for the same package; only the total is recorded.
