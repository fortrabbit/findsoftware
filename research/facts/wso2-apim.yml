notes: >
  Homepage: every wso2.com page answered 403 with a Cloudflare challenge, so no homepage fact is recorded and the record stands on its repository; the next pass should add homepage once a page can be read, since the README points to wso2.com/api-management/. The docs were read from the wso2/docs-apim repository at branch 4.7.0, the source of apim.docs.wso2.com; those GitHub blob links are the cited pages. Maintainer: pom.xml names the organization WSO2 Inc, and the docs mkdocs copyright line says the same; no legal notice or country page could be read, so hqCountry stays out. Licenses: the LICENSE file is Apache 2.0 and the README badge says Apache 2.0; one license. Editions: the docs describe an Enterprise package (API Control Plane, Traffic Manager and Classic Gateway, distributed) beside the All-in-one package, and a WSO2 Subscription that gives the private registry images and WSO2 Updates; no page states features the open package lacks, so paidEdition stays out. The subscription pages say WSO2 Updates ship bug and security fixes, which is support, not features. Runtime: the README says the product needs a JDK and the docs name JDK 21 and 25 as tested; the pom at branch 4.7.0 sets a 1.8 source level in one plugin block, which is not a runtime statement, so runtimeMin stays out. The admin web portals are the Management Console, the API Publisher and the Developer Portal, named on the same docs page. Other products in the docs: an AI gateway and an MCP gateway (ai-gateway folder) and a Choreo analytics cloud that its page marks deprecated in favor of a Moesif-powered analytics; none recorded as a field. Fields coined here: none.
