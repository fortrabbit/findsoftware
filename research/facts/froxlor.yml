notes: >
  Stable line is 2.3, released from the 2.3.16 tag (2026-10-20); the default branch main is a Laravel rewrite that its README says is in very early development and not for production. The main README states LGPL-3.0-or-later WITH LicenseRef-froxlor-Extension-Package-Exception; that statement describes the unreleased branch and is not recorded as a license fact. The 2.3.16 COPYING file is GPL version 2, and the homepage calls the panel an "open source (GPL) panel"; one license in two wordings. The team page names "froxlor GmbH" in Friedrichsdorf, Germany as the contact; another legal entity, so it is not the maintainer. The imprint names Michael Kaufmann as owner with a Frankfurt address; hqCountry DE is taken from that address for the recorded maintainer. The team page also states "2 Contributors", matching the API count. The GitHub repository reports homepage http://www.froxlor.org; the https form was read and recorded. The homepage "Buy managed server" link leads to froxlor GmbH's managed operations for SaaS applications, which is not the panel as a hosted service, so no hostedOffering fact. The API documentation names commands and JSON endpoints, but the API guide says it is "not a RESTful API" and takes commands as JSON over HTTP POST, which matches no headlessApi value, so the field is left out. The docs Git (developer) page and the froxlor/container image were not read for dockerPulls; the container repository is a development setup, not an install route named by the install docs. The CLI lists froxlor:cron as "Regularly perform tasks created by froxlor"; the scheduled runsAs fact rests on the configuration page's statement that the cron service is required.
