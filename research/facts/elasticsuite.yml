notes: >
  Status is accepted: the repository is not archived, and the composer package is not abandoned. Highest stable GitHub release is 2.12.2.1 (2026-10-05), so currentMajor is 2; the default branch is 2.11.x and its README still says "Current version 2.10.0", so the README quotes are from the default branch and the release notes are not. The OSL-3.0 license is stated by the GitHub API and composer.json; the subscription terms at elasticsuite.io are a second, commercial statement for Smile's Standard Software, GALLY and ELASTICSUITE, recorded as its own license entry. The LICENCE.md file carries the OSL 3.0 text. The project's own site lists the sibling product Gally, a separate product on the same site and terms; it is not a candidate in candidates-search.csv and is not recorded here. The README names a premium version with recommendations and behavioral optimizers; the docs site marks features as Premium. The pricing page (elasticsuite.io/pricing/) lists plans (Free, Growth, Business, Enterprise) with prices, which are not recorded; the Free plan is named "Open-source search engine". The module needs an Elasticsearch or OpenSearch server (README compatibility table; composer requires opensearch-php); the Packagist package is a PHP package, so runtime is php; no page states a PHP minimum, so runtimeMin is absent. The homepage sells the product as "Open Source Product Discovery" and the terms call it a Magento installation on the customer's site, which is why runsAs is absent. The footer names "Elastic Suite Group" as copyright holder; the legal notice and terms name SMILE as the company, so the maintainer is SMILE. hqCountry FR comes from the legal notice, which gives the headquarters address in Asnières-sur-Seine; the terms give the registered seat there as well. The CSV categories are search-integration only; magento-extension is not in the import's category map. Adoption: Packagist total 5035702, monthly 91874 on the day of the check, recorded as total.
