notes: >
  No project homepage is recorded: the GitHub homepage field and the crates.io homepage field point to docs.rs/tide, which is the generated API reference and not the project's own site, and the README names no site. The highest stable GitHub release is v0.16.0 (2021-01-29), so the major is 0. The only later tag is v0.17.0-beta.1 (2021-12-06), which GitHub lists as a non-prerelease; it has a beta name, so it is recorded as latestPrereleaseDate, not as a release. The README tells readers to add tide = "0.17.0", a version that exists only as that beta. The repository's last push is 2024-01-05, the last release is more than four years old, and neither the README nor the repository says the project has ended, so no status change is recorded. The first upload on crates.io is version 0.0.0 (2018-08-10), earlier than any GitHub tag (oldest tag 0.0.1, committed 2019-01-18), so firstRelease is 2018 from the registry. The license is stated two ways: GitHub reports Apache-2.0, and the README says the crate is licensed under either of Apache 2.0 or MIT; both are recorded. The maintainer is the copyright holder named in LICENSE-MIT, a 2018 line; no current maintainer statement was found in the README, which is why the name is recorded from the license only. The README's Chat link points to a Discord invite, recorded as discord with the href as the quote. The README's listed tide-based crates and example applications are third-party and not recorded.
