notes: >
  The homepage rustapi.cloud answers over https with a 200 and describes the hosted deployment service; its pricing page is linked from the navigation but its address is not stated in the repository, so pricingPage is not recorded and no prices are recorded. The README calls the project RustAPI and states it is built on hyper 1.x and tokio; those are libraries rather than a parent framework, so basedOn is recorded as the README states it. The README also describes native MCP and TOON response formats, which are not in the starter list and are not coined here. Maintainer is the Cargo.toml authors line; the README's sign-off reads "Built by Tunti35." and is not recorded. The GitHub repository is owned by the user Tuntii. The releases from v0.1.410 to v0.1.550 use commit-count versions; the CHANGELOG says semantic versioning starts with v0.2.0, so currentMajor is 0 from the highest stable release v0.2.2. The earliest GitHub release is from 2026-01-23 and the earliest crates.io upload 0.1.0 is 2025-12-30, so firstRelease uses the registry. The crates.io download figure is the 90-day count (recent_downloads); the all-time total is 1030. The hosted service's backend lives in a separate repository (RustAPI-Cloud), which is not read here. The contributors figure is the last page of the contributors endpoint at 1 per page.
