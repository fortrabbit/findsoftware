notes: >
  Boundary ruling for this wave: pygal is accepted because its own pages say the chart is an SVG document meant for web pages: the README calls it "a dynamic SVG charting library", and the documentation has an "Embedding in a web page" page that puts the SVG behind an embed tag or directly into HTML (documentation/web.html), and the output page shows a Flask route that serves the SVG at a URL (documentation/output.html). The output page (documentation/output.html) lists SVG, PNG through optional cairosvg, an etree, a base64 data URI and render_in_browser; those are output formats and are not recorded as fields. The homepage www.pygal.org answers with a redirect to /en/stable/, which is the cited final URL. The docs title reads pygal 3.0.5 while the latest GitHub and PyPI release is 3.1.3; the docs version is not recorded. The changelog lists no dates for its older series, so firstRelease is from the oldest PyPI upload (0.9, 2012-02-15); the oldest GitHub release is 1.6.2 from 2015. Licenses: the LICENSE file is the LGPL text; PyPI says "GNU LGPL v3+" and setup.py classifies it as "GNU Lesser General Public License v3 or later (LGPLv3+)". These are one license and are recorded as one entry. The maintainer follows the README copyright line (Kozea). The kozea.fr legal page names other entities (Kozea SARL as host of the site, Pegasus Network as the operator of the site and its contact records) and addresses that belong to them; no legal name or hqCountry is recorded for the pygal maintainer. Linux distribution packages (Fedora, Gentoo, Ubuntu, Debian, Arch Linux) and a git clone from the repository are further routes on the installation page; they are not recorded as installMethod, since the page gives no install command for the distribution packages. Optional dependencies lxml, cairosvg, tinycss and cssselect are not recorded. The pypistats figure is the last-month count, a rolling window. Contributors are counted across all pages of the contributors endpoint with per_page=1, last page 57.
