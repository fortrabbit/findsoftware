notes: >
  The LICENSE file at main is the Xceed Community License Agreement for Non-Commercial Use, which names Xceed Software Inc. as licensor and the software "an Xceed product"; the README and homepage say versions 8 and beyond are free for open-source and non-commercial use and that commercial use requires a paid license, recorded as its own entry. The FAQ at xceed.com says version 7 "will continue to be governed under the Apache 2.0 license" and the README says version 7 stays open source; that older license is in notes only, since the license fact describes the latest release. The Xceed product page prices a Basic, a Standard and a Small Business license with a subscription requirement; no prices are recorded, and no paidEdition is recorded because the FAQ says versions 8 and above are "the same for free and paying customers", so the paid license is a license of the same software. No hqCountry is recorded: the Xceed product page footer address (Brossard, QC) names no country, and the LICENSE names the Province of Quebec, Canada only as governing law. The maintainer is the LICENSE copyright line's Xceed Software Inc.; the homepage footer reads "© 2026 Dennis Doomen", the About page says Dennis Doomen originally wrote the library and Jonas Nyrup joined in 2018, and the product page says Xceed now supports and maintains it. Xceed is named a partner on the homepage and the README, and the LICENSE calls the software "an Xceed product", so parent is Xceed Software Inc. The homepage links the personal X accounts of Dennis Doomen and Jonas Nyrup, which are not recorded as project links. The GitHub API reports the license as NOASSERTION, so the two statements are recorded as they are worded. The homepage and the README name the supported test frameworks (xUnit, NUnit, MSTest, MSpec, TUnit); they are not basedOn, since the library runs beside them. runtime dotnet comes from the homepage sentence "Works with .NET Standard 2.0 and higher, .NET Framework 4.7 and higher and .NET 6 and higher"; runtimeMin is not recorded because the stated floors are .NET Standard and .NET Framework, which are compatibility targets rather than a runtime minimum of the latest release, and the .NET 10 SDK named in the README is a build requirement. firstRelease is 2011 from the oldest NuGet upload (1.3.0.1, published 2011-01-15), older than the oldest GitHub tag v2.1 (2013-08-24). The NuGet total of 813065109 is the search endpoint's totalDownloads for the package. ecosyste.ms returns 0 dependent repositories for the NuGet package, so only the dependent package count is recorded. The CSV row gives an older NuGet total.
