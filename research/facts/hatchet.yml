notes: >
  The docs and README name SDK languages (Python, TypeScript, Go and Ruby; "It supports applications written in Python, Typescript, Go and Ruby"). The README also compares Hatchet with Celery, BullMQ and DBOS, which have no record.   The record covers the Hatchet platform: the repository's v0 release tags (v0.114.2, 2026-10-26) and the Hatchet Lite and Compose images on ghcr.io. The repository also tags SDK and client releases (py/, rb/, serverless/), the newest of which is dated 2026-10-29; they are separate packages and are not the latest release here. The major is 0 because the platform line is 0.x. The license file reads "Copyright (c) 2023-present Hatchet Technologies Inc." without the comma; the terms name Hatchet Technologies, Inc., which is recorded as maintainer. The language split is Go 8.59 MB, PLpgSQL 0.87 MB and TypeScript 0.12 MB; the server is Go. Container images are published to ghcr.io, not Docker Hub, so no dockerPulls figure is recorded. Not recorded: the SDK packages @hatchet-dev/typescript-sdk (npm, 372.1k downloads a week in the candidates row) and the Python SDK, which the worker install docs name, because they are client libraries and not the server. The pricing page lists SOC 2 Type II and a Custom plan with SSO, RBAC, audit logs and HIPAA; these are Hatchet Cloud plan features and no paidEdition is recorded for them. The docs name OpenTelemetry and Prometheus metrics as features (docs.hatchet.run/v1/opentelemetry and /v1/prometheus-metrics); they are not recorded as fields. The x and discord links are read from the homepage HTML.
