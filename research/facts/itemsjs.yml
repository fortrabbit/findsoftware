notes: >
  The project has no site of its own: the GitHub homepage field is empty and the npm homepage points to the README, so no homepage is recorded. The GitHub organization itemsapi (ItemsAPI) also publishes ItemsAPI, a Dockerized search API server in its own repository at github.com/itemsapi/itemsapi; that is a separate product and is not a source for this record. The README names MiniSearch and Lunr2.x as integrations for full-text search (docs/minisearch-integration.md, docs/lunr2-integration.md); integrations are not recorded as basedOn. The maintainer comes from the npm package.json author field because the Apache-2.0 LICENSE carries no copyright line. The npm weekly figure counts downloads of the itemsjs package, the same package the install command names. The GitHub release v2.4.3 and npm version 2.4.4 share the 2025-11-25 date; the latest npm version is 2.4.4 and has no GitHub release. The README states no end of development; the repository was last pushed on 2025-11-25. The README lists facet filtering, sorting, pagination, text queries and similar-item lookups over the data the application passes in, and an external full-text engine can supply the matching identifiers.
