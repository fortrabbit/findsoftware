notes: >
  The support page sends questions to Stack Overflow (tag ktor) and issues to YouTrack, and points to the Kotlin Slack Ktor channel; none of these is recorded as a field. The homepage and support page both link x.com/kotlin, which is the Kotlin language account, not a Ktor account, so x is not recorded. Ktor's docs pages list the JVM engines (Netty, Jetty, Tomcat, CIO and the servlet engine) and the CIO engine also targets Native, JavaScript and WasmJs; only the JVM runtime is recorded. No minimum JDK is stated on the pages read, so runtimeMin is left out. The first GitHub release is 0.9.0, a prerelease dated 2017-10-31; the oldest stable release is 0.9.2 (2018-04-23), which firstRelease uses. The server creation page also describes deploying a Ktor application as a servlet inside a container such as Tomcat or Jetty. The latest release is 3.6.0; no prerelease is newer. The Maven artifact io.ktor:ktor-server-core first appears in Maven Central as 1.0.0-rc, which the registry gives without a date.
