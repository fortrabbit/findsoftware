notes: >
  The GitHub repository has neither releases nor tags, so the PyPI release list is the version source: 1.8.0 is the newest release, uploaded 2022-12-19, and its major is 1. The README says portray is compatible with MkDocs themes; that is recorded as a theme compatibility statement, not a parent. The basedOn entries follow the README sentence that says portray combines MkDocs rendering with pdocs reference documentation. The PyPI requires_python value is ">3.7", which excludes 3.7.0 itself and admits later 3.7 patch releases, so runtimeMin is 3.7. The README links a Gitter chat; Gitter is not a recorded field. The last push to the GitHub repository is 2023-09-19 and the newest PyPI release is 2022-12-19; both are recorded only as the release date above. The pypistats figure is last month's downloads as the pypistats API reports them, and the stargazers and contributors are the GitHub figures.
