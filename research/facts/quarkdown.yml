notes: >
  The homepage FAQ says "Quarkdown can output to HTML, PDF, Markdown, and plain text"; no field holds output formats. No page states that the HTML output is static files; runsAs static rests on the README comparison row "Static site export". The homepage footer names a personal X account and a LinkedIn profile of the author; they are not recorded. The README says Quarkdown is "Born as an extension of CommonMark and GFM"; those are specifications, not records, so no basedOn is set. The PDF target uses paged.js and the slides target uses reveal.js; these are rendering libraries, not parents, and no basedOn is set. The CLI and language server are AGPLv3 under their own LICENSE files, the rest GPLv3; both license facts are recorded as the README states them. runtime jvm comes from the build script rather than a page, since no docs page names a Java version; the release zips bundle a minimal JRE, so no runtimeMin is recorded. PDF export needs a Chromium-family browser (wiki PDF page); the install scripts install chrome-headless-shell. The README points to setup-quarkdown for GitHub Actions workflows, which is the CI use. The live preview runs a local web server on port 8089 by default (CLI options page), which is a development feature. The release list has a rolling prerelease tag named "latest" dated 2025-05-13; it is not a version and no latestPrereleaseDate is recorded. The homepage lists "Over 15K stars"; the API figure is recorded instead.
