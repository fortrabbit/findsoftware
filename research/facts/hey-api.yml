notes: >
  Status accepted: the repository is public and not archived, the npm latest tag is 0.99.0 (2026-06-22) with no deprecation, and the get-started page documents npm installation (criterion 3). The record is the @hey-api/openapi-ts package, the one the install docs name; the hey-api/hey-api repository is a monorepo that also holds the openapi-python package, spec-types and the other @hey-api packages, so the stars (5563) and contributors (183) belong to the monorepo. The get-started page says "This package is in initial development" and asks users to pin an exact version; no version support policy is recorded. currentMajor is 0 from the 0.99.0 npm latest tag; the GitHub release objects use dates as tag names (2026-06-22) and the openapi-ts package releases use package-version tags, so the registry is the source for the version line. firstRelease is the year of the npm package's first upload (created 2024-03-22); the repository was created 2024-01-10. The homepage links a LinkedIn company page (linkedin.com/company/heyapi) and a personal LinkedIn and X account of the maintainer; the company page is held here and not recorded as a field, and the X account (x.com/mrlubos) is the maintainer's personal account, linked from the homepage and the get-started page, and is recorded as the account those pages list. The hosted registry at app.heyapi.dev is recorded as hostedOffering because the homepage and the get-started page name it and tell users to sign up at app.heyapi.dev; no prices are recorded. ecosyste.ms reports 0 dependent packages and 0 dependent repositories for @hey-api/openapi-ts against about 7.1 million weekly npm downloads, which contradicts the other figures, so no dependent count is recorded. The homepage says the project is used by Vercel, OpenCode and PayPal; no count is stated, so none is recorded. The generated clients target Fetch API, Angular, Axios, Next.js, Nuxt and other HTTP clients; these are output targets and not a basedOn statement. The package accepts any OpenAPI specification (get-started page); the spec version coverage is not recorded as a field. The get-started page header shows a "7% funded" line and the homepage lists sponsor logos; neither is recorded. The get-started page shows the install commands for npm, pnpm, yarn and bun, the CLI run from a package.json script, a createClient call from a script that takes an input and an output directory, and says the package works with 20+ plugins; the plugin count is not recorded as a field because the page gives it as a rounded figure. The install section gives npm install @hey-api/openapi-ts -D -E, the Vite section installs @hey-api/vite-plugin as a dev dependency beside it, and the example input "hey-api/backend" is a name in the hosted registry; the get-started page says the project publishes migration notes for each breaking release.
