notes: >
  Two license statements: the Core is Apache-2.0 (license page and composer.json, whose license field reads Apache-2.0), and the Pro edition is under the ExpressionEngine Pro License Agreement, which the Core page itself points to. The GitHub license field reads NOASSERTION. The maintainer is Packet Tide LLC per the Pro license agreement (expressionengine.com/pro/license) and the license page ("Packet Tide owns and develops ExpressionEngine"); the legal notice gives no country, and the arbitration venue in the Pro license (Florida) is not a headquarters statement, so hqCountry stays unknown. Community also runs on Slack (homepage link to a Slack blog post, a coined field would be slack); not recorded as a field. The composer.json name is expressionengine/expressionengine, and no Packagist package was found for it (404), so no packagist fields. The requirements page's "bare minimums" sentence gives PHP 7.2.5 as the minimum for the current release; the "best experience" line names PHP 7.4 or 8.2. The 7.dev branch is the development line; the released line is 7.x. The wikidata search hit Q11198547 has no label, so no wikidata. pricingPage is the store page with prices, recorded as a link only.
