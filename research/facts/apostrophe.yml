notes: >
  No GitHub releases or tags exist, so the registry package apostrophe is the release source: 4.34.0 as npm latest, major 4, dated 2026-10-14; firstRelease is the first npm version, 0.3.3 in 2013. The install docs name npm create apostrophe, a create-* scaffolder, so the core package apostrophe is the registry id. The README table says Node 20.x and newer, while the development setup page, the hosting page and the npm engines field state Node 22 or later; runtimeMin records 22 from the docs page and the README table conflicts. The README Pro section names Pro extensions and Assembly under a Pro license; the pricing page is the source for the Pro edition. Apostrophe also sells managed hosting ("Hosting built and managed by Apostrophe" on the pricing page, "leave it to us with managed hosting" on the about page), noted here, not as a field, with no prices recorded. Multisite and advanced permissions are listed as Pro features in the README, so multisite is not recorded; userRoles is recorded from the core users guide, and advanced permissions are the Pro part. The Reddit, X and YouTube links are read from homepage markup and carry no quote. The dev setup page states a SQLite option that the installer offers by default; the choosing-a-database page is the source of the database list. The GitHub license detection returned none; the MIT statement is in the README and the npm license field.
