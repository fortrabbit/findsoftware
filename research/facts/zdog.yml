notes: >
  The repository has no LICENSE file; the README states "Licensed MIT." and the npm package declares MIT, so the license is recorded from the README. The README footer says "Made by Metafizzy" (the GitHub organization); the package author is David DeSandro, who introduces himself on the site as Dave, and the package author is the recorded maintainer. The site says Zdog v1 is "a beta-release, of sorts" and to "Expect lots of changes for v2"; that is no end or maintenance statement, and no v2 release exists. The last commit on master is dated 2023-07-18 and the record is not ended on that basis. The site lists third-party ports and wrappers (vue-zdog, zDogPy, Zfont); they are not forks or successors and are not recorded. The npm figure counts the zdog package only. The npm downloads figure uses the range endpoint for 2026-11-01 to 2026-11-07. The README Install section also offers a direct download of zdog.dist.min.js and zdog.dist.js, recorded as its own installMethod entry. No page states where Zdog runs, so runsAs is left out. The bower route is documented on the site but is not an npm route, so it is recorded on its own installMethod entry. The site's "Brought to you by" footer logo is not a text statement and names no company.
