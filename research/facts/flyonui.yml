notes: >
  The GitHub API reports the license as NOASSERTION because the root LICENSE file covers the original code under MIT and also bundles Preline UI and daisyUI components under their own terms; the three license entries record the statements as written. The Pro license at flyonui.com/license covers premium assets sold under a paid license with lifetime access; no prices are recorded. The README says "Created by ThemeSelection" and the LICENSE copyright line reads "Copyright (c) 2024 ThemeSelection", while the privacy policy and terms name CleVision Technologies Private Limited as the company that owns and operates the site; the legal name is recorded and the brand left for a reviewer to decide. The quick start adds the package with an @plugin "flyonui" line in the main CSS file and says FlyonUI offers no CDN support, because its styles are generated on demand for the JavaScript components a project uses; it suggests a CDN only for production once the generated styles are final. The JavaScript plugins cover interactive components such as accordion, dropdown and modal. The homepage says FlyonUI combines features of daisyUI and PrelineJS and thanks both projects; that is not recorded as basedOn. The license page lists Pro components, blocks, templates and Figma files as the Pro resources. The homepage has a newsletter signup form with no address of its own, so newsletter is not recorded. The homepage says it supports HTML, React, Next.js, Vue, Nuxt, Angular and Svelte, which is stated as framework compatibility, not as a dependency, so it is not recorded as basedOn. The npm package "flyonui" is the one the install docs name; its first upload (1.0.0) is 2024-09-24, earlier than the first GitHub release, so firstRelease is 2024 from npm. The npm weekly figure is the sum of the daily counts for 2026-10-18 to 2026-10-24. HTTP Archive lists no entry for FlyonUI. The hqCountry entry follows from the privacy policy's Country definition, Gujarat, India, beside the company's Ahmedabad address. The homepage's "Pro Version" page sells lifetime access; that page is cited by the paidEdition entry. Discord and X are linked from the homepage navigation.
