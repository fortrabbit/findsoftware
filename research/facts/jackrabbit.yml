notes: >
  The CSV boundary note (2026-10-19) puts a content repository library in scope; the record follows that decision. The homepage calls the project a content repository and names Jackrabbit Oak as a complementary implementation of JCR; Oak (apache/jackrabbit-oak) and FileVault are separate projects and are not recorded here. The GitHub repository has no releases; latestReleaseDate and currentMajor come from Maven Central, the registry the install docs point to through the standalone server jar and the jackrabbit-core artifact. The highest stable Maven version is 2.22.5, uploaded 2026-10-06; the newer 2.23.x line is beta and its newest upload (2.23.6-beta, 2026-10-06 09:36) predates the 2.22.5 upload, so latestPrereleaseDate is not recorded. The GitHub default branch is trunk and the repository was pushed 2026-10-20. The standalone server page says the server runs on localhost:8080 once started. The config page says most persistence managers store data in databases but names none, so databases is left out. The categories value is backend, the mapped category closest to a content repository used as the back end of content applications (the import has no mapping for content-repository). The ASF is described as a U.S. 501(c)(3) on its foundation page, which gives hqCountry US. The first Maven Central upload of jackrabbit-core is 1.0, dated 2006-04-13. The deployment models page describes three setups: a repository embedded in an application, a shared resource of an application server, and a repository server. The docs path jackrabbit.apache.org/jcr/ returned 404 for the getting-started and download pages, so the cited pages are at the site root.
