notes: >
  The marko package has GitHub releases only up to marko@5.39.7 (2026-06-15); npm latest is 6.4.6, a higher major, so currentMajor and latestReleaseDate come from npm, as the write-record rules say. The install page lists Node.js v18, v20 and v22 as prerequisites, while the npm package declares engines node >=22; runtimeMin uses the npm value and the docs list is recorded only as the runtime fact. The marko-run adapters page says the same routes can be served by a Node process, deployed to an edge platform, or rendered to static files; the static entry records only the static output mode. Marko Run is powered by Vite, which is a dependency of Marko Run and not a basis for basedOn. The homepage names eBay as a production user; that is not recorded as a fact. The candidate row lists framework and ui-library; both are recorded as categories.
