notes: >
  The homepage is the project's own site over https; the repository names it as homepage. The install page gives the npm route and the prebuilt binaries; the README and homepage name libvips as the image library it uses, and libvips is not a record. The package.json author field names Lovell Fuller and the GitHub owner is a user account; no company is stated, so maintainerType is individual. The README states Node.js (>= 20.9.0), Deno and Bun as runtimes; runtimeMin is the Node minimum from the registry's engines field for the latest version. The package is a library that the consuming Node process loads, and no page states a runsAs value, so runsAs is not recorded; the install page's AWS Lambda section describes packaging node_modules for a deployment package and is not a runsAs statement. The GitHub releases start at v0.20.0 (2018), but the npm registry has version 0.0.1 uploaded on 2013-08-20, so firstRelease takes the registry upload. The major is 0 because every stable release is 0.x; a reviewer may decide how a 0.x major is shown. The release v0.35.5-rc.1 (2026-09-27) is a prerelease of the release recorded as latest and is not newer, so no latestPrereleaseDate is recorded. The npm weekly figure is the sum of the seven days 2026-09-28 to 2026-10-04. The CSV id is sharp-image because the Laravel admin panel Sharp holds the id sharp. The install page's Open Collective libvips link is a funding link and not a field. The category choice rests on the README's "convert large images in common formats to" and the Node-API module description; media-processing and asset-optimizer are both mapped by the import.
