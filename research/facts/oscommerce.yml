notes: >
  The CSV row names the repository oscommerce2, the v2.x line: MIT on GitHub, last release v2.4.2 dated 2016-11-21, last push 2023-02-19. The record covers osCommerce 4, the product the homepage offers for download and the repository osCommerce-V4 that the homepage links as its GitHub source; the v2 line is not recorded here and a reviewer should decide whether it needs its own record. The V4 repository has no GitHub release and no composer.json at its root, so no registry package or release date is recorded; its last push is 2024-10-30. The repository LICENSE.TXT opens with osCommerce v4 programme terms that limit use to testing at the user's own risk, then contains the GPL version 2 text; GitHub reports NOASSERTION. It is recorded as one license statement so the import derives source-available, not open-source with a restricted part. The two runtimeMin values come from different sources: the README says the project template requires PHP 7.2.0, the homepage says support starts at PHP 7.4, and the homepage recommends PHP 8.3. The README line is the Yii 2 advanced project template's wording, so the homepage's 7.4 is listed first and is the one the record shows. The homepage names osCommerce hosting, the Enterprise version and an app store with paid extensions; the Enterprise version page was not read, so paidEdition is not recorded. The legal policies name osCommerce Ltd with an address in Swindon in one box and in Gloucestershire in the imprint; the same company number appears on both. The homepage is served in two variants, and the variant a plain HTTP client gets omits the osCommerce 4 navigation label, so the quotes were checked against both. The terms also name Holbi Group Ltd and Holbi UK appears as a company on the homepage; no ownership relation is stated, so parent is not recorded. The forum link text is the nav label "Forum"; the homepage nav also lists "App Shop", whose address was not recorded.
  The README lists multiple front ends, themes, a visual theme designer, responsive design and full site control via the CMS, and says the database has to be created by hand before the installation runs.
