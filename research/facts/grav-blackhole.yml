notes: >
  No homepage: the repository is the only project page, and the plugin's blueprints.yaml names the repository as its homepage. The repository is archived (last push 2023-02-09), and the README names no end or successor. The GitHub release list holds 10 releases from v0.5.2 (2017-06-01) to v1.1.0 (2022-07-30); v1.1.0 is the highest stable release (major 1). The tags v1.0.0-beta.1 to beta.3 are prereleases and are not counted. The LICENSE.md file reads "MIT License" with the copyright line naming Barry Anders; the blueprints.yaml license line agrees. The README says absolute URLs must be enabled in Grav System Configuration, and the generate command takes the URL of a live Grav site as input. GitHub reports the license as NOASSERTION because of the file's format. The README says the generate command can run from the Grav Admin Panel as well as the command line; that admin use runs on the live Grav site and is not recorded as a separate runsAs value. The README uses the author name Barry Anders; the GitHub profile display name differs and is not used. The language is PHP from the GitHub API; blackhole.php declares the Grav plugin class.
