notes: >
  Status accepted from the CSV. Criterion 4: the newest gem release is 1.12.0 (2022-11-10), more than four years before 2026-11-16, and the last push is 2024-06-17; the repository is not archived and the gem is not deprecated, so no end signal is recorded and the import moves the record to stub on release age alone. Criterion 3: the README install section gives the Gemfile line. No homepage: the rubygems homepage_uri and the repository description point only to the GitHub repository, so repository alone is recorded. The README says the gem is "an adapter for premailer to work with actionmailer out of the box", so basedOn records premailer; it adds that actionmailer "is the email framework used in Rails, which also works outside of Rails" and that the gem "also works in the absence of Rails" (sinatra is named), so Rails is not recorded as the parent. The README says the gem registers a delivery hook, so every delivered email is processed, and that it fetches each linked stylesheet through the strategies :filesystem (a file under public/), :asset_pipeline and :network, in a configurable order. The README states tests on Rails 5 through 7 and no minimum Ruby version; runtimeMin is not recorded. The gemspec summary says "Easily create styled HTML emails in Rails." Tags run from v1.0.0 (2011-09-29); no GitHub releases exist. Stars are from the API (1764; ecosyste.ms shows 1766). Contributors are the page number of the rel="last" link on the per_page=1 endpoint. The rubygems figure is the cumulative total since listing. The README Author section names Philipe Fatio, matching the LICENSE copyright line.
