notes: >
  This package is currently in maintenance mode, which means: It generally does not accept new features. The README (master) says so under its Maintenance Mode heading, next to "v1, v2, and v3 are no longer maintained" and "v4 ... is the only maintained version", so the record is a stub, not discontinued: a maintenance-mode statement is no end signal, and the record stays out of the register until a person settles it. What would settle it: a maintainer statement that the project has ended, or a decision that maintenance mode counts as an end. Status stub is set by the rule for maintenance-mode statements, not by the CSV row, which had accepted. The README names Bob (https://github.com/stephenafamo/bob) and sqlc under "If looking for an actively maintained alternative"; Bob has no fact file yet, so it is kept in this note only, and sqlc is recorded as alternativeTo. The README says Bob "was created by a maintainer of SQLBoiler", which is a relationship in the note, not a fork or successor statement. currentMajor is 4 from v4.19.5 (2025-06-27), the highest stable GitHub release; the README says v4 is the only maintained version. The repository has no homepage of its own; the CSV homepage is the repository, so no homepage is recorded. The docs field is not recorded separately: the README is the documentation, and the badge links to pkg.go.dev are not a project site. The maintainer is the copyright holder named in the LICENSE file, Aaron Lefkowitz; the same file's no-endorsement clause names Vattle or Volatile Technologies Inc., a legal entity that is not the copyright line, so it is kept here and not recorded as the maintainer. The GitHub license detector returns NOASSERTION because the LICENSE text is a modified BSD-style license; the README badge says BSD, and the LICENSE text has three conditions, so BSD-3-Clause is recorded as one entry. The databases quote is the README's own install comment, which names postgresql, mysql, mssql and sqlite3; the CockroachDB driver in the README's driver table is a third-party repository (glerchundi/sqlboiler-crdb) and is not recorded as a database. runtimeMin is the go line of the go.mod at v4.19.5; the README's Requirements section still says Go 1.13, which the manifest at the latest tag supersedes. The go install and go get routes are both named in the README's Download section. Stars and contributors belong to the sqlboiler repository, a single-module repository.
