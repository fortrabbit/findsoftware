notes: >
  The CSV row has no repository; the product's source is split across repositories. couchbase/manifest is the top-level source repository for Couchbase Server (Apache-2.0 for the manifest files themselves), and it is recorded as the repository. The server code is in repositories such as couchbase/kv_engine and couchbase/ns_server, whose LICENSE.txt states that source code is licensed under various licenses and that the Business Source License 1.1 is one of them. The docs introduction calls Couchbase Server open source; the CSV row says the Community edition is free, and the docs editions page states the Community Edition license as free deployment up to five node clusters, which is recorded as its own license entry; the Enterprise Edition adds unique features and is the paidEdition. The couchbase.com edition, community and license pages returned 403. The license and licenseModel facts describe the main branch, not a release, and a reviewer should decide whether the BSL statement describes the 8.0.3 line. The current version is 8.0.3 per the 8.0 release notes ("Release 8.0.3 (September 2026)"); the same notes mention builds "through 8.1.0" without a release page, and endoflife.date lists 8.0.3 as the newest cycle. latestReleaseDate is not recorded because the source gives only a month. The first release is not stated on any page read; endoflife.date's oldest cycle is 6.6 (2020), which is not a first release. The docs introduction describes a key-value store and a query engine for SQL-like queries. The docs authentication pages name LDAP and SAML for external users without saying which edition has them, so sso is not recorded. No page read states that the server is compiled or its implementation language (kv_engine is C++ per its GitHub description, the cluster manager is a separate repository), so no language or runtime is recorded. The Kubernetes Operator and Operational Insights are separate products and are not recorded. The couchbase/docker repository directs users to the couchbase/server Docker Hub repository (13,103,681 pulls), which is the figure recorded; the official library/couchbase image has 90,748,359 pulls and is not recorded, since the README does not name it. The Capella hosted service is recorded as hostedOffering; its pricing is not recorded. Couchbase Lite (couchbase-lite-* repositories) and Sync Gateway are separate products and no basedOn statement is made.
