notes: >
  Doubt first: the homepage ssoready.com and its docs, which the README links for the quickstarts and for "self-host yourself", do not resolve (checked 2026-11-03), and the repository holds no self-hosting guide, only a docker-compose.yaml next to the source, so criterion 3 (documented installation) is unsettled. Settling it needs a readable install guide, from the project's site or its repository. Status is stub for that reason; it is not discontinued because the repository is not archived and neither the README nor any page read states an end. The repository has no tags or releases, so the last commit on the default branch (2025-08-28) is the listing date. Criterion 1: the README documents an HTTP API and SDKs that an application calls ("Get SAML Redirect URL" and "Redeem SAML Access Code" for SAML, "List SCIM Users" for SCIM), so it is a service wired into a product, not an end-user app. The README names a cloud-hosted instance, a self-hosted option and an Enterprise plan with a Management API, custom domains and support; none of it is recorded as a field because the pricing and docs pages are gone. The SDKs live in separate repositories (ssoready-typescript, -python, -go, -java, -csharp, -ruby, -php) and give the service nothing. The repository language is TypeScript per the GitHub API, though go.mod and cmd/ show a Go backend. Y Combinator W24 per the README. The LICENSE copyright line names Codomain Data Corporation (dba SSOReady).
