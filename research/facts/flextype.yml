notes: >
  The CSV homepage flextype.org is not the project's site: it serves an unrelated "Top website engines" blog, so the homepage is the project site named in the repository. The repository's last push is 2022-11-19 and the latest release is v1.0.0-alpha.3 of the same day, the last non-alpha release is v0.9.16, so currentMajor is left out. No end signal exists, so the record stays accepted. The Packagist package flextype/flextype (708 total downloads, 9 in the last month, read 2026-10-20) is not recorded because the install docs name no Composer command. Neither the README nor the documentation states that the project has ended. Fields coined: none.
