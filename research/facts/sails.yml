notes: >
  The homepage and README say the framework is MIT licensed and free; no edition with features the open version lacks is named, so paidEditions stays unknown. The legal page names two hosted or paid offerings beside the open source framework: the Treeline IDE hosted platform and the Sails Flagship support service; no prices are recorded and neither is a hosting edition. The repository created_at is 2012-03-18 and the homepage says Sails was created in 2012; neither is a first release, so firstRelease stays unknown. The GitHub Releases latest entry is v1.5.11 from 2024-05-24, while the npm latest dist-tag is 1.5.18 published 2026-05-27; latestReleaseDate follows npm. The package.json engines field says node ">= 0.10.0", which no page states as a requirement, so runtimeMin stays unknown. The npm downloads figure covers 2026-10-12 to 2026-10-18. The GitHub stars and contributor counts are as read on 2026-10-22. The README says the framework is built on Node.js, Express and Socket.io; only Express, a framework, is recorded under basedOn. The GitHub Releases entry v1.5.11 is older than the tag v1.5.18 that matches the npm release.
