notes: >
  The README calls it a no-code builder with a JSON or HTML output and a Reader React component; the Waypoint pitch names a hosted template builder with dynamic LiquidJS variables, drag and drop, reusable layouts and loops. Accepted as an email templating library under criterion 1: the npm package renders a builder document to HTML with renderToStaticMarkup or a Reader React component, and the README shows that output sent through Nodemailer and through an email API. The README says teams can self-host the builder by forking the repository and running one of its examples; the editor is part of the same repository and is not a separate record. The repository has no releases and no tags. The newest npm version, 0.0.9 published 2026-01-09, is the registry's stable tag, so currentMajor is 0, the pre-1.0 line, and the first npm upload 0.0.1 dates firstRelease to 2024. The install section is a code block with a bash command and no sentence naming npm, so no installMethod is recorded. The npm package is @usewaypoint/email-builder; the repository's block and document-core packages are separate npm packages, and their downloads are not counted. The LICENSE copyright line reads "Waypoint (Metaccountant, Inc.)" and decides the maintainer; the terms page names "Metaccountant, Inc (D.B.A. Waypoint)"; Waypoint is the trade name. The terms name Delaware as the governing law, which is not a headquarters statement, so hqCountry is left out. The package peer-depends on React 16 to 18, which the project does not call a binding, so basedOn is left out. The Reader component is React JSX; it is not recorded as templating. The homepage is the project page on the maintainer's site, which emailbuilderjs.com redirects to; the page title names the project. The repository's own demo is a GitHub Pages playground, not recorded.
