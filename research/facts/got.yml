notes: >
  Boundary ruling for this wave: an HTTP client is a helper library, so the row is accepted; the CSV boundary state is not a record status. No homepage: the repository has none, and the npm package names the GitHub readme as its homepage. The install section shows "npm install got", recorded as installMethod. The README comparison table marks browser support as no, and the Ky line says Ky "works in the browser too", so no runsAs is recorded: the page names no sentence that says where the library runs apart from Node.js. The README says "You probably want Ky instead", and compares node-fetch, Ky, axios and superagent; only axios is a record id; the README links the comparison and an Axios migration guide, so alternativeTo is axios. Migration guides for Request, Axios and Node.js are code migrations, not import from other software. The LICENSE names Sindre Sorhus; the README's Maintainers section also lists Szymon Marczak. The npm weekly figure is the sum of the daily counts for 2026-11-01 to 2026-11-07 (the point endpoint returns a stale window); the npm package is the one the install command names. The ecosyste.ms dependent counts were read on 2026-11-09 from the last sync on 2026-11-08. The README's "Used by 10K+ packages and 5M+ repos" links the GitHub dependents page, so it is not recorded as reportedInstalls. Bundled TypeScript types, Standard Schema validation, native ESM and the RFC 7234 cache are features named in the README and are not recorded as fields. The README also lists retries on by default, advanced timeouts, a pagination API, proxy support, Unix domain sockets, hooks, instances, plugins, and a diagnostics channel. The README says the package provides no CommonJS export, and that v11 is no longer maintained.
