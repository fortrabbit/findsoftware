notes: >
  Status: no end statement found. The repository was last pushed on 2026-11-01 and its default branch is next. The newest stable release is v10.1.2 (2026-06-24), published on GitHub and on @react-spring/web; the unscoped react-spring npm package stops at 10.0.4 (2026-05-22) and is not the package the install docs name, so its figure is not recorded. The latest prerelease, v11.0.0-beta.1 (2026-10-01), is newer than the latest release and is recorded as latestPrereleaseDate. The homepage is linked over http in the candidate row; the http address redirects to https, which is recorded. The repository is a monorepo: stars and contributors are for the whole monorepo, while the npm and dependent counts are for @react-spring/web, the package the install docs name. The README names @react-spring/three as the install for react-three-fiber; it is a companion package, not a field. The README says the library supports react-dom and react-three-fiber, that the install step is to install the target you need (@react-spring/web, or @react-spring/three for react-three-fiber), and that animations can be written declaratively or, if preferred, imperatively. The LICENSE copyright line names Paul Henschel and react-spring, all contributors; the maintainer follows the first holder. The GitHub repository owner is the pmndrs organization, and the homepage links the Poimandres Discord, which is not recorded as this project's own forum. The homepage and docs were read at the pages named, including the getting-started page, which says React Spring can be installed with any package manager (one npm route). The homepage links a Twitter account for all things Poimandres, the organization's account, which is not recorded as this project's own. The homepage testimonials name react-motion and Popmotion in third-party quotes; those are no statement of the project, so no alternativeTo.
