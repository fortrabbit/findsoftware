notes: >
  The README says the components are Vue components built on Reka UI, Tailwind CSS and Tailwind Variants, and that the library works as a module in Nuxt and as a Vite plugin in plain Vue apps, so basedOn holds Vue, Tailwind CSS and Nuxt. The npm package states Node 20.19 or newer (or 22.12 or newer) in its engines field; that is the toolchain for installing the package, and no page states a runtime for the live site, so no runtime is recorded. The homepage names no company; the LICENSE.md copyright line says "Nuxt", and the npm maintainer list names one individual. Vercel is not named on this project's pages, so no parent is recorded. The X, Bluesky and Discord links in the homepage footer are labeled as Nuxt's accounts. The homepage shows a monthly download figure of its own; the recorded figure is the npm weekly sum for 2026-10-18 to 2026-10-24 for @nuxt/ui. The homepage footer says "Published under MIT License"; the repository license field is MIT. The GitHub release list shows the highest release matching npm latest; no prerelease is newer.
