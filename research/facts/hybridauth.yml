notes: >
  Boundary: none; accepted as an authentication library, matching the CSV row. The GitHub API reports the license as NOASSERTION because the MIT statement sits in the README and COPYING.md; the README at the latest release tag is the source, and the composer.json at that tag also says MIT, one value, so one entry. The COPYING.md copyright line reads "Copyright (C) 2009-2019, Hybridauth authors" and also notes that LightOpenID and OAuth Library are covered by similar licenses with different copyright notices; those two notices carry the same MIT permission text, so they add no second license value. The composer.json author is Miled, an individual, and the Packagist maintainers list also names ApacheEx; the COPYING.md line, "Hybridauth authors", is the maintainer recorded. The README Versions Status table lists 2.x as Maintenance, 3.x as Development and 4.x as Future; that is the project's own version status and no end signal. The README's requirements are PHP 5.4+, PHP session and PHP cURL; composer.json lists firebase/php-jwt and phpseclib as suggestions for the Apple provider. The README's usage example shows a provider class, keys and a callback URL, and the methods authenticate, getAccessToken, getUserProfile and apiRequest; these are coined kinds kept here, not fields. The README and the docs site's support page name the StackOverflow tag for questions, recorded as forum; Gitter is a chat channel and no discord field fits it. The firstRelease is the 2012 Packagist upload of v2.1.0, older than the first GitHub tag, 2.5.1 (2015). Stars and contributors are for the repository; Packagist total downloads are as the Packagist package page gives them.
