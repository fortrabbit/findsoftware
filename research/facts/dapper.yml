notes: >
  The CSV homepage http://markbenson.io/dapper/ redirects through https to markdbenson.com/dapper, the maintainer's site page for Dapper, which is recorded as the homepage. The page is a section of the maintainer's site dedicated to Dapper. The page states "Open source" and "Archived" at the top and "It is no longer actively developed", which is an unmaintained statement, so status is discontinued. The GitHub repository is not archived and its last push is 2025-02-03; no archive flag is used because the statement is on the project's own page. The GitHub API reports the license as null; the README states the MIT license, and the MetaCPAN release lists mit, so the license is recorded from the README. The repository has tags v0.08 to v0.19 and no GitHub releases; the highest stable release is version 0.21 on MetaCPAN (2025-01-22), and the registry is the App::Dapper package the README installs with cpanm. The CPAN registry is not one of the listed registries, so no download figure is recorded. The README's install and deployment sections name the TT3 layouts, the MultiMarkdown Markdown processor and YAML configuration; the processor is named in the README and not recorded as a field. The homepage calls Dapper an open-source content management system, and the README calls it a publishing tool for static websites; the README wording is recorded as the description. The runtime minimum is the perl dependency in the MetaCPAN release metadata (5.008000, recorded as 5.8).
