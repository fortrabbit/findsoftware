notes: >
  Doubt: whether a user can install Autumn itself. The CSV row names github.com/useautumn/autumn, which returns 404 to the GitHub API and to the web, so no repository, license or release is recorded. The welcome page says "Autumn is open source. You can self-host anytime, or export all your data." but the docs index has no self-host install page; the install paths shown are the SDKs (npm autumn-js, pip autumn-sdk), the atmn CLI and an edge cache deployed with a CloudFormation stack in the customer's AWS account. A public server repository or a self-host install page would settle it, and then the record would move to accepted or hosted-service. Autumn builds on Stripe: subscriptions and payment details stay in the customer's Stripe account. The welcome page says an app queries Autumn inline to learn what a customer may do, that Autumn manages subscription state, credit balances, feature entitlements and usage enforcement, and that the SDKs default to fail-open and fail-fast. The terms and privacy page name Rebase, Inc., a Delaware corporation doing business as Autumn; the Delaware incorporation is no headquarters country, so hqCountry is unknown. The pricing page lists Free, Pro and Scale plans, recorded without prices; these are hosted plans, so no paidEdition. The homepage links LinkedIn (linkedin.com/company/useautumn) and Discord; LinkedIn is not a field. The SDK repositories (useautumn/typescript, useautumn/autumn-py) are client packages and are not recorded.
