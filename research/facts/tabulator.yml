notes: >
  Status accepted from the CSV row. The CSV homepage (http GitHub Pages) is not linked: the project's site answers over https at www.tabulator.info, and the README's http tabulator.info redirects there. Criterion 4: the newest stable release is 6.7.1 (2026-10-22), the repository is not archived, and no deprecation statement was found. Maintainer: the LICENSE copyright line names Oli Folkerd. The site footer reads "Copyright © 2016 - 2026 Beekeeper Studio Inc" on the community page; that is another legal entity and is kept out of the maintainer field. The commercial support page sells annual support plans and says the library is MIT licensed "and that is not changing"; support is not an edition, so paidEdition is unset and the page is recorded as pricingPage. The alternatives pages state zero runtime dependencies and say the library works with React, Vue and Angular through wrappers and with no framework at all; no basedOn is recorded because the project states it is framework-agnostic. The install page also lists a yarn route (same npm package), a git clone of the repository and an ESM import from the UNPKG CDN; the ESM CDN route is not a separate installMethod because the import collapses routes of one name, and the git clone is its own installMethod, listed under the page's package sources. The homepage shows "Version 6.6.1 Released!", which is older than the GitHub release and not recorded. Stars and contributors belong to the single repository. The npm figure is for the package the install page names, tabulator-tables. firstRelease 2015 comes from release 1.0.0 on 2015-11-06, older than npm's first upload (4.0.0, 2018). The docs license page reads "Copyright (c) 2015-2026 Beekeeper Studio (original copyright Oli Folkerd)" while the repository LICENSE names Oli Folkerd alone; the maintainer follows the repository LICENSE. The docs dependencies page says the core has zero dependencies and that SheetJS is required to export and import Excel spreadsheets, jsPDF (with its AutoTable plugin) to export PDF documents, and Luxon for date and time handling in several formatters, sorters and editors.
