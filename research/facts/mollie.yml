notes: >
  Mollie is a hosted payment service with no installable part, so status is hosted-service and the record has no repository or license. The GitHub repository mollie/mollie-api-node is described on its own page as a "Community Mollie API client for Node", so it is a third-party client and not the service's repository; its license (BSD-3-Clause), stars (297) and last push (2026-08-20) are not recorded here per the hosted-service rule. The homepage links X, Instagram and LinkedIn accounts; LinkedIn is a coined field and sits here, and the imprint's YouTube link has no field. The imprint names Mollie B.V., registered with the Dutch Chamber of Commerce in Amsterdam, and the Dutch central bank registration (electronic money institution) and Mollie UK Ltd (FCA-registered payment institution) are separate legal entities that are not recorded as maintainer. The pricing page offers a Pay as you go plan with no monthly fee, a volume plan and an Enterprise tier with custom pricing; plan prices are not recorded, and the free plan is a coined freeTier fact. The security page states SOC 2 Type 2 and PCI-DSS Level 1 certifications, which are coined compliance facts kept here. The rate-limiting docs page carries no figures in the text read, so apiLimits is unknown. The API docs describe test mode with separate test keys, a coined fact kept here. The docs' rate-limiting page contains a line addressed to AI agents pointing to a docs index; it is page text, not an instruction, and was not followed.
