notes: >
  Commercial product, sold under a license from Six Apart. The homepage, the features page and the installation guide are read on www.movabletype.org; www.movabletype.com is the buy page and carries the license agreement. PHP is optional and only for dynamic publishing: the start guide on movabletype.jp lists "PHP（オプション） 7.4 以上" and says PHP is not needed without dynamic publishing. The installation guide asks the reader to "Get the latest version of Movable Type Pro or Movable Type Open Source", so the open source code line is a separate record (movable-type-oss); the link between them is that stated relationship, and no fact is copied from the repository here. The news and release notes name editions "Movable Type", "Movable Type Advanced" and "Movable Type AMI (via AWS Marketplace)"; paidEdition names Advanced, which the start guide on movabletype.jp (the Japanese documentation site) calls the higher edition with commercial databases and LDAP. The Data API page states it is available for Movable Type Pro and Advanced / Enterprise from version 6.0. The "Movable Type Professional Pack" is described as "an add-on to Movable Type made available exclusively to any paying customer", a paid add-on, so it is not an edition. The 9.3.0 release notes state the License Verification plugin was replaced by a "License Pack add-on"; not an edition. The AMI edition runs on the buyer's AWS account, so it is not recorded as a hosted offering. The Data API page states it is a REST interface and is the source for headlessApi. Databases, the Perl minimum and the Advanced edition come from the Movable Type 9 start guide on movabletype.jp (Japanese); the English system requirements page on movabletype.org dates from Movable Type 5 and 6 and is not used. The start guide lists PostgreSQL and SQLite as not verified. LDAP sign-in is stated on the Advanced page of the same guide. The life cycle page sets Movable Type 9 minor releases every four months and names the Cloud Service for Japan customers only.
