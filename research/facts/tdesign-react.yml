notes: >
  The site answers 200 with a JavaScript shell (title and root element, no page text), so homepage is the repository's homepage field and the site is listed as unreadable. The README's install routes are npm, yarn and pnpm, and the getting-started page in the repository adds an unpkg script route (cdn); each is its own installMethod entry. The README points the bundle documentation at the Tencent/tdesign repository; that is recorded as docs. The README names React 16.x; packages/tdesign-react/package.json at tag tdesign-react@1.18.5 declares peer react >=16.13.1 and states no engines, so runtime and runtimeMin are not recorded. The MIT wording in LICENSE and the README are one license entry. Version history: the oldest GitHub release in the repository is 0.21.0 (2021-12-27); the npm package's first upload is 0.0.1-alpha.0 (2021-10-26); both give 2021. The contributors figure is the last page number of the contributors endpoint at per_page=1. The HTTP Archive technology TDesign (mobile origins 140) covers both the React and Vue packages and is not recorded for either. The npm figure is the package tdesign-react, the one the README installs. The sibling tdesign-vue-next is its own record. The README usage example imports Button from the package and the stylesheet tdesign-react/es/style/index.css. The Tencent/tdesign page docs/develop-install.md lists the build outputs dist (UMD), esm, es and lib (CommonJS).
