notes: >
  No project website exists: the repository is the only page the project names, so no homepage is recorded. The README links an organization of companion packages (github.com/atreugo) for middleware and websockets; it is not recorded as a source. The maintainer is the copyright holder named in the LICENSE. Go modules have no download figure, so none is recorded. No page states how the server process runs (the source comments say only that Serve blocks), so runsAs is left out. The highest stable release is v11.13.2 (2024-07-04); the oldest GitHub release is v3.0.0 (2018-07-16). The README names the module path github.com/savsgio/atreugo/v11 for install, which sets currentMajor to 11.
