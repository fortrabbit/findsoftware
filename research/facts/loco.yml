notes: >
  The homepage and README say Loco follows Rails and is "Rust on Rails", with "strongly inspired by Rails" in the README; no basedOn is recorded because the project does not say it is built on Rails. The framework's stack named on the homepage is SeaORM and Axum; these are not recorded as basedOn either. The repository is the one the CSV row names; The maintainer is the copyright holder named in the LICENSE file. The first release is taken from the oldest crates.io upload (0.1.0, 2023-11-23), which is older than the oldest GitHub release (v0.14.0, 2025-02-19). The crates.io recent_downloads figure for the last 90 days was 135972 at the same read; only the total is recorded. Feature areas named in the docs but not recorded as facts: background jobs with Redis, Postgres or SQLite queues, file storage drivers for S3, Azure and GCS, SMTP mailers, and the built-in authentication suite generated with a database. The "databases" entry comes from the sample config and the database URI reference, not from a supported-databases list; the docs name no MySQL support.
