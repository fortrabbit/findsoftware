notes: >
  The project's docs site (mkaz.github.io/hastie) states that Hastie started as a Go project and was rewritten in Python; the golang branch is named in the README as archived code, and no basedOn or forkOf is recorded for it. Hastie is not on PyPI (the install is from the GitHub repository), so no registry figures were recorded. The first GitHub release in the list is v0.6.0 (2017-01-02); the repository itself was created in 2012. Highest stable GitHub release is v0.9.5 (2023-03-04), so the major is 0. The homepage text names Jekyll, Pelican and other generators as similar tools; these are not recorded as relationships. The homepage's "published anywhere" is the basis of runsAs static. pyproject.toml on trunk carries a version and a Python minimum, but it is a repository file, so neither is recorded.
