notes: >
  Status accepted. Criterion 1: the homepage says the framework is for testing JavaScript code and runs in browsers and Node.js. Criterion 2: the code is MIT-licensed on GitHub and installs with npm. The repository jasmine/jasmine holds jasmine-core; the npm jasmine package, the Node command line tool the install page names, is published from jasmine/jasmine-npm, and its README says the core lives at github.com/jasmine/jasmine and is jasmine-core in npm. Stars and contributors are those of the core repository. The npm figure is for the jasmine package; jasmine-core had 6393974 downloads in the same week (2026-11-01 to 2026-11-07). The latestReleaseDate is the jasmine-core 7.0.2 publish on npm (2026-08-20), a stable release newer than the GitHub release v7.0.1 (2026-08-15). The firstRelease year is the oldest tag, 0.1.0-release, whose commit is dated 2009-10-11; the npm jasmine package was first published in 2014 and is not older. The LICENSE copyright line also names Pivotal Labs for 2008 to 2019; that is history, and the current line names The Jasmine developers. The Node setup page says Jasmine 5.x supports Node 18, 20 and 22, which describes an earlier major, so no runtimeMin is recorded. The FAQ says Jasmine supports a rolling window of Node versions. The global npm install is labelled not recommended on the same page and is not recorded as a route. The jasmine-browser-runner package runs specs in a browser, and its CI sentence ("running specs in CI builds using either headless Chrome or Saucelabs") belongs to that package, so no runsAs is recorded for jasmine. The homepage has a GitHub link to the jasmine organization and no other social link.
