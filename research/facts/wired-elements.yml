notes: >
  The npm dist-tag latest points at 3.0.0-rc.6 (published 2021-04-24), a prerelease, so an install without a version range takes the release candidate; the highest stable npm version is 2.1.2 (2020-06-20), which sets currentMajor and latestReleaseDate. The GitHub releases end at v0.7.0 (2018-07-18), and the tags v2.0.0 to v2.1.2 have no release, so the registry supplies the stable major, as the rule for a registry major above the GitHub one. The repository has no archive flag and no end statement in its README or on the homepage; the default branch was last pushed on 2023-10-07. Four years after the last pre-release, the import may move the record to stub on age; the status is left as the CSV gives it. The npm repository field names wiredjs/wired-elements, which redirects to rough-stuff/wired-elements. The homepage links the maintainer's personal Twitter account, which is not the project's own, so no x field is recorded. The homepage names a sponsor page on Open Collective and GitHub, not a project channel. The GitHub organization rough-stuff holds the Rough suite; the copyright names Preet Shihn, which is recorded as maintainer. No HTTP Archive entry exists for this name.
