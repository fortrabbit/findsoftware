notes: >
  Boundary: WooCommerce is a WordPress plugin, not standalone software; it serves web output only inside a WordPress installation, so whether plugins get their own record or attach to their host is open. The fields pluginOf (host software and its minimum version) and wordpressPluginSlug, wordpressActiveInstalls, wordpressDownloads (WordPress.org plugin registry figures) are coined here. The plugin API says the latest version requires WordPress 7.0, while the server requirements page recommends WordPress 6.9+ for 10.8+. GitHub reports the license as NOASSERTION; the monorepo license.txt and the plugin composer.json state GPL-2.0-or-later. A GraphQL endpoint exists only through the experimental Dual API plugin. Paid extensions are sold on the marketplace; there is no paid edition of WooCommerce itself. Contributors counts GitHub accounts, anonymous excluded.
