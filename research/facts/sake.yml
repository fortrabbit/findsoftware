notes: >
  The repository has no GitHub release or tag, so there is no firstRelease, currentMajor or latestReleaseDate; lastCommitDate is the committer date of the newest commit on the default branch, main. The project has no website, so no homepage is recorded. The LICENSE file is titled "Do-License" and its text is a permissive grant ("Do as you wish"); GitHub reports no SPDX identifier, so the license value is the name the file gives, and whether this counts as open-source is for the reviewer, so licenseModel is not recorded. The README names make, jinja2-cli (installed with pip, as a standalone command-line implementation of Jinja2) and the tools fd, jq and yj as dependencies; runtime records make and python, with the Python side taken from the pip install line. The README's showcase lists two sites that use Sake; they are not recorded as reportedInstalls because the README gives no count. The maintainer is the copyright holder named in LICENSE.
