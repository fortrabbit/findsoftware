notes: >
  The install docs name the devextreme npm package (and devextreme-react for React); the React install page pins version 24.2 in its example, so only the package name is taken from it. The npm figure is for devextreme, the core package. The repository's LICENSE.md only points to the licensing page, and the GitHub API reports NOASSERTION; the license statements are the Licensing page's words. The Licensing page says a commercial application needs a 12-month subscription and that a 30-day trial exists. The buy page lists four subscription tiers (Complete, ASP.NET and Blazor, DXperience, Universal) that bundle DevExtreme with other DevExpress products; prices are not recorded. The product is sold only by subscription, so the paidEdition value names the subscription rather than a feature-limited edition. basedOn is not recorded: the homepage and README name the frameworks the components serve, not a framework the suite is built on. The homepage links a Facebook page and a YouTube playlist, which have no field. The hqCountry comes from the address on the DevExpress About Us page. The latest GitHub prerelease, 26.1.2 (2026-05-20), is older than the latest release, so no latestPrereleaseDate is recorded. The releases API dates 26.1.6 to 2026-10-26, later than the npm publish of the same version on 2026-10-23; latestReleaseDate follows the releases API. firstRelease is 2016, the first npm upload of devextreme (16.1.4), which is older than the oldest GitHub release (17.1.2-beta, 2017). Contributors counts contributor accounts from the API list with per_page=1, read from the Link header.
