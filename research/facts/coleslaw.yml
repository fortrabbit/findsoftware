notes: >
  The CSV row names kingcons/coleslaw; GitHub redirects that name to coleslaw-org/coleslaw, which is recorded as the repository. The project has no GitHub release or tag, so lastCommitDate (2024-12-12, committer date of the newest commit on master) judges the listing; it is within the four-year window. The project names no homepage and no site, so homepage is not recorded. The install docs name the Roswell command and the Quicklisp load of coleslaw-cli; no registry figure is recorded because neither Quicklisp nor Roswell is in the registry list. The runtime value common-lisp is coined here because no Common Lisp value exists yet; the README names SBCL and CCL as the implementations it is tested on. The contentStore value git follows the README feature line "Git for storage". The LICENSE copyright line names Brit Butler, and the repository is owned by the coleslaw-org organization. The README names no project site, so its wiki and mailing list are not recorded as one. The README says the deploy command moves the staging directory to a deploy directory with rsync by default, and lists plugins for hosting via Amazon S3 and GitHub Pages; it calls Coleslaw similar to Frog, Jekyll and Hakyll, which is no alternativeTo statement. The WordPress import is listed as a plugin.
