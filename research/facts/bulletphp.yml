notes: |
  The install section of the README names vlucas/bulletphp with the constraint ~1.7, so the Packagist figures are for that package. The latest Packagist version is v1.7.1, dated 2021-05-28; the GitHub API returns no release objects, and the last push to the repository is 2021-07-23. The README opens with a section titled "PROJECT MAINTENANCE RESUMES" that says Bullet becomes an active project again under a changing of the guard; no page states the project has ended, so no status fact is written and the status stays accepted. The homepage still states PHP 5.3+ as the requirement while the README states PHP 5.6+ and the registry requires >=5.6; runtimeMin follows the registry. The GitHub owner is a user account; the homepage footer names Vance Lucas as the copyright holder. The homepage describes the router: path is for static path segments, param for variable ones, and HTTP method handlers nest inside the path; it also says Bullet is built for REST APIs and web applications. The README's Rules section says apps are built around HTTP URIs and defined paths, and handles one path segment at a time. The README's Apache example rewrites every request that is not an existing file or directory to index.php, and says an application can sit under an existing web app to serve an API or simple dynamic pages.
