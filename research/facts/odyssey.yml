notes: >
  The homepage is the project's documentation site (MkDocs), and the repository's homepage field names it; the repository README names no other site. The copyright holder is YANDEX LLC (LICENSE and homepage footer); the homepage footer also says "Maintained by the Yandex Cloud MDB team", which is not a legal name. The Yandex privacy policy gives YANDEX LLC a head office in Moscow, Russia, recorded as hqCountry RU. Currently Odyssey runs only on Linux. The Docker images are on ghcr.io (GitHub Container Registry), not Docker Hub, so no dockerPulls. The quick start says "Only version starts with 1.5.0 are supported" for the Docker images; not recorded. The release page says "See github releases page for more", and GitHub has 1.0 (2019-12-09) as the oldest release and 1.0rc (2019-05-29) as a prerelease; firstRelease is the year of the oldest stable release. The homepage says the project is production-ready and used in large setups; that is the project's own judgement and is not recorded. PAM and LDAP authentication of database clients is no sign-in to an admin interface, so sso is not recorded. The Prometheus metrics and console features are not fields. The community page names a Telegram chat, which is no social field. Fields coined here: none.
