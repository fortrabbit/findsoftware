notes: >
  The highest stable GitHub release is v0.22.1, published 2026-10-26; the crate version list agrees. The project is on the 0.x line, recorded as currentMajor 0; the current line is 0.22. The GitHub API reports the license as Apache-2.0 alone; the README states the dual license, which is recorded as written. firstRelease is 2020 from the oldest GitHub release v0.1.0 (2020-08-26), in line with the repository creation date. Trunk's guide names Yew and Leptos only as frameworks that work with it, so basedOn is not set. The Cargo manifest at v0.22.1 sets rust-version 1.96.1 (github.com/trunk-rs/trunk/blob/v0.22.1/Cargo.toml); that is a build toolchain requirement, not a runtime, so no runtime or runtimeMin is recorded. crateDownloads is the total download count; the 90-day figure from the same endpoint is recent_downloads 152195 on 2026-10-28. The homepage and the guide describe the build from an index.html source file, and the guide's output section lists dart-sass, lightningcss and swc among the asset tools it uses; those are not recorded. The dist output is named in the homepage text, which is the source for runsAs static.
