notes: >
  The homepage https://frappe.io/charts answers with a redirect to https://frappe.io/products, the Frappe product index, which lists Charts as "JavaScript library for creating interactive charts and visualizations"; the redirect is within the project's own site, so the final URL is the homepage and the docs site is recorded as docs. The GitHub release v1.6.3 (2022-04-27) is the newest stable release; npm's latest tag is 1.6.2 (2021-06-16) and no npm version 1.6.3 exists. The newest prerelease is 2.0.0-rc31 on npm (2026-10-19), which is the latestPrereleaseDate; the GitHub tag v2.0.0-rc25 (2025-03-26) is older. The npm 2.0.0-rc21 version carries a deprecated flag; the stable latest does not, so no end signal. firstRelease is 2017 from the oldest npm upload (0.0.1, 2017-10-31), which is older than the oldest GitHub tag (1.2.0, 2019). The maintainer follows the LICENSE copyright line; the README tells the origin in ERPNext's sales graph and says the author "decided to create a library", while the repository is under the frappe organization. The docs install page shows the script tag route, using unpkg and jsDelivr URLs, after the sentence "or include within your HTML", which does not name the CDN, so no CDN installMethod is recorded. The README's "Links" section names a Medium blog post, which is not recorded. The X, Instagram and YouTube links are the company's, shown on the Frappe products page. The README says Frappe Charts has zero dependencies and the repository description calls it "Simple, responsive, modern SVG Charts with zero dependencies". The README key features list axis, area and trend, bar, line, pie, percentage, mixed axis and heatmap charts. The npm figure covers the package the install docs name. Contributors and stars are the repository's own; the repository holds one package.
