notes: >
  The CSV homepage is http://mobx.js.org; the site answers over https, and its root page is a redirect to README.html, so the redirect target is cited. The repository is a monorepo: the GitHub stars and contributors count every package in it (mobx, mobx-react-lite, mobx-react, mobx-react-plugin, eslint-plugin-mobx and others), and the npm figure counts the mobx package the install page names. The README says a record field is updated with a normal JavaScript assignment and that the reactivity system detects changes and propagates them to where they are used, so computations that depend on the state, such as React components, run only when needed. The installation page names three React bindings (mobx-react-lite, mobx-react-plugin and mobx-react) that are separate packages in the monorepo; they get no records here and are not basedOn, since MobX is documented as framework-independent ("MobX is unopinionated and allows you to manage your application state outside of any UI framework"). The installation page says MobX works in browsers and Node.js environments that provide native Proxy support, and that is the sentence the runtime fact rests on. The pnpm and yarn commands on the installation page are the same npm registry route and are not separate installMethod entries. The CDN route names cdnjs and unpkg. The release date and major come from the mobx@7.1.7 tag, the newest stable tag of the mobx package; the mobx-react and other package tags in the same repository are not the mobx package. The first release year comes from the oldest tag, 0.0.1, whose commit is dated 2015; the npm package history starts in 2016. The README credits Mendix for supporting maintenance of MobX, and the README sponsor list and the Open Collective backers are not fields of this record. The Twitter links on the docs pages point to the authors' personal accounts, so no social field is recorded.
