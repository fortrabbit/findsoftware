notes: >
  No page of the project names a maintainer; the LICENSE copyright lines name Fabien Potencier (2010-2017, from Sami) and William Desportes (2020), so both are recorded. The code-lts GitHub organization owns the repository and is not named as maintainer on any page. The README title says "Fork of Sami", recorded as forkOf with the Sami name only. The phar is the documented install; the Packagist package is code-lts/doctum. The README mentions a GitHub Action only as a badge and a link, which does not state a hosting model, so runsAs is unknown.
