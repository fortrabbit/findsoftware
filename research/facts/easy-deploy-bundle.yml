notes: >
  In doubt: the project's own site no longer shows EasyDeployBundle, so the record stays a stub without a homepage; what would settle it is the vendor's site or a release naming the bundle again, or a statement that the bundle has ended. The CSV homepage https://easycorp.io/EasyDeploy answers 404 (read 2026-10-28), and the homepage https://easycorp.io/ shows only EasyAdmin, the company's admin generator, with no mention of deployment. The repository's own homepage field points to the same 404 URL. The install guide (doc/installation.md, default branch) and README still describe the bundle, so the criterion 3 install steps exist in the repository. The last release is v1.0.6 dated 2020-01-30 and the last commit on the default branch is also dated 2020-01-30; the repository's pushed_at is 2024-01-04, a later push that does not add a release. The import will move a record with no release in four years to stub on its own, so this file records the date and the status is set here by the dead vendor page. The Packagist package easycorp/easy-deploy-bundle reports 318384 total downloads (read 2026-10-28; monthly 1568). The README says the local machine needs "PHP 7.1 or higher" while the v1.0.6 manifest requires php >=7.2.0; runtimeMin follows the manifest. The README lists Symfony 2.7 to 4.x applications, and the manifest's symfony constraints go up to 5.0; neither is an end statement. The license is MIT per the GitHub API and the LICENSE file body; the LICENSE file names Javier Eguiluz, the GitHub organization is EasyCorp, and the easycorp.io footer names EasyCorp as the company. The maintainer is recorded from the LICENSE copyright line. Software built on Symfony: the install guide calls it a bundle to install in each Symfony application, which is the basedOn statement.
