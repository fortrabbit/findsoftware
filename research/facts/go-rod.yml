notes: >
  The homepage is a docsify shell whose text loads in the browser, so the homepage and docs facts cite the README's link to it and the docs source repository go-rod/go-rod.github.io, which holds the get-started, compatibility and why-rod pages; the shell's meta description reads "A Devtools driver for web automation and scraping". The README is the repository's own text and names the documentation site, the API reference on pkg.go.dev and the Discord room. No sentence names an install route: the get-started guide's "Create a module:" line introduces a command block, so no installMethod is recorded. Go module versions and dates come from the GitHub releases and the proxy; no download figure exists for a Go module. The oldest tag is v0.0.1 from January 2020, the oldest release object v0.42.1 from July 2020; firstRelease takes the year both share. The MIT license names Yad Smood as the copyright holder; the owning organization is go-rod. The compatibility page says the Docker way is recommended to run Rod on a server, which is no runsAs statement, and says that auto-downloaded browsers may fail on some platforms. The why-rod page compares Rod with Chromedp, Puppeteer and Selenium under headings and does not call them alternatives, so no alternativeTo is recorded. The README calls the protocol the library is based on the DevTools Protocol; the protocol is not a record and sits in no field. The release tags are v0.x, so currentMajor is 0.
