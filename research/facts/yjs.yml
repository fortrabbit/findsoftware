notes: >
  The docs license page says Yjs has been actively maintained since 2015 by Kevin Jahns, which sets the maintainer. The LICENSE copyright block names Kevin Jahns and RWTH Aachen University; the university is a second legal entity and is not recorded as maintainer. GitHub reports the license as NOASSERTION because of that multi-line copyright block; the MIT text is the same. The README says Yjs is MIT licensed and free to use but asks commercial users for a social expectation to sponsor; that is no paid edition. Editor bindings (ProseMirror, Quill, Monaco, Tiptap and others), connection and persistence providers such as y-websocket and y-indexeddb, and ports to other languages are separate packages or repositories and are not part of this record. The npm figure counts the yjs package only. npm marks version 13.4.8 as deprecated; the latest version is not deprecated, so it is no end signal. The 14.0.0 line is release candidates only (latestPrereleaseDate). The README says Yjs is based on the author's research at RWTH Aachen; that is not a basedOn statement. The docs homepage calls Yjs a "high-performance CRDT"; the record does not repeat that claim. The homepage at yjs.dev and the docs at docs.yjs.dev are both the project's own pages.
