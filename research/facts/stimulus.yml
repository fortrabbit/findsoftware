notes: >
  The project is part of Hotwire, which the homepage presents as a family of projects: the homepage navigation lists Turbo, Stimulus and Native, and its footer reads "Brought to you by the makers of:" followed by site links and "© 2026 37signals". The MIT license copyright line names Basecamp, LLC. The two names are recorded as two maintainer entries, each as its page states it; no parent is recorded because neither page says which company owns the project. The homepage and the handbook introduction say the framework is designed for static or server-rendered HTML and does not render HTML itself; that is recorded in the description and not as a field. The GitHub contributor count is taken from the last page number of the contributors endpoint. The first GitHub release is v0.9.0 (2018-01-30). The handbook introduction says Stimulus continuously monitors the page for data-controller attributes and creates a controller instance for each one, which the prose draws on. The GitHub release list excludes prereleases for currentMajor, so v3.2.2 is the highest stable release.
