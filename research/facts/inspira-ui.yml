notes: >
  No GitHub release, tag or registry release exists, so criterion 4 is judged by the last commit on the default branch, as AGENTS.md states; the commit of 2026-10-17 is recent, so the record is not ended. The CSV's boundary question is answered by that rule. The homepage source text carries no description of the kit, so the homepage field is cited from the docs that link to it. The live site returns 404 for its /docs/ paths and its homepage HTML carries a banner for a sibling product, Akaza UI, so the installation text is read from the docs source in the repository. The Discord, X, Bluesky and forum links come from the docs site's own configuration in the repository (app/app.config.ts); the X account is the maintainer's. The Bluesky link is written with plain http there and recorded with https. The homepage answers 200 but is a JavaScript shell with no readable text. The install docs name @inspira-ui/plugins as a dependency; it is a support package, not the kit, so no npm figure is recorded. The copy-paste model: the component page names the shadcn-vue registry command. The paidEdition value is the sibling Pro product, recorded because AGENTS.md treats a Pro tier as a paid edition. The docs introduction (content/en/1.getting-started/1.index.md) says "Inspira UI is **not** a traditional component library. Instead, it's a curated collection of elegant components you can easily integrate into your applications." The same page says the project is "not officially affiliated" with Aceternity UI and Magic UI, takes inspiration from both, and has "received permission from Aceternity UI's creator to adapt those fantastic designs for the Vue ecosystem"; the README credits Aceternity UI for "the inspiration and permission to adapt the original designs" and Magic UI for design inspiration. The pricingPage link is the Pro site, which this record does not read for prices.
