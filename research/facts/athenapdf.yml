notes: >
  The repository is archived (api, 2026-10-31); its last push was 2023-03-06. The README on the default branch says the project is deprecated, so status is discontinued. The homepage domain serves an Internet Archive snapshot from 2016, so it is not linked, and no homepage is recorded. The README title reads "Athena"; the record is named Athena PDF to tell it apart from the Athena framework record (id athena). The Docker Hub figure is for arachnysdocker/athenapdf-service, the microservice image the quick start names second; the CLI image arachnysdocker/athenapdf had 175481 pulls on the same date. The CLI is an Electron tool and the service is Go; the record's language and runtime follow the repository's dominant language, Go. The README calls the CLI "an alternative / drop-in replacement for wkhtmltopdf", a statement on the project's own page, kept here because wkhtmltopdf has no record. The weaver README names Sentry for error logging and statsd for metrics; these are optional integrations and are not recorded. The arachnys.com link on the README redirects to solytics-partners.com; that site was not read for the maintainer or hqCountry. The Gitter chat badge is a community link with no field and is not recorded. latestPrereleaseDate is v2.16.0, marked prerelease on GitHub; it is newer than the latest stable release v2.13.0.
