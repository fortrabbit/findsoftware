notes: >
  The GitHub description says "ASP.NET 8 and newer"; the NuGet package 8.3.0 lists net8.0, net9.0 and net10.0. The NuGet registration lists 9.0.0-beta.6 (2026-10-25) as the newest prerelease; the project's GitHub has v9.0.0 beta tags but no prerelease release, so the date comes from NuGet. The README links the repository under the earlier owner dj-nitehawk, which GitHub redirects; the record uses the current owner FastEndpoints. The LICENSE.md copyright line names no holder ("Copyright (c) 2021"). The homepage footer names "FastEndpoints" as the copyright holder. The docs have no separate installation or hosting page that states a deployment target, so runsAs is left out.
