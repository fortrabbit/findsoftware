notes: >
  The current README has no installation section; the README of release 2.1.1 (the last GitHub release, before the license change) gives the npm, yarn and CDN link install lines, which settles criterion 3, so the status is accepted. The site is a client-rendered app, so its usage text cannot be read. The npm package is css.gg (2.1.4, 2024-08-26), the GitHub release list ends at 2.1.1 (2023-06-23), and the registry figures follow the npm package. The license is a custom agreement from version 2.1.2 on, which allows personal, non-commercial use and requires permission for commercial use; versions before 2.1.2 are MIT, recorded as their own statement. The npm license field reads "SEE LICENSE" and GitHub reports no detected license, so the LICENSE.md text is the statement. The README names no chat link and its Twitter follow badge gives the x handle; the README links YouTube, Figma, Raycast and GLYF＊APP as other resources, which are not recorded as fields. The 6000 glyphs are a separate product named glyf.app in the README, and no figure is recorded from it.
