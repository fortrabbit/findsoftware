notes: >
  Name taken from the project's pages (Medama Analytics). The GitHub API read on 2026-11-03 reports archived false and a push on 2026-11-01, so no end signal is recorded. The API reports license null because GitHub cannot detect a license for a repository with several; the README states Apache-2.0 for /core and /dashboard and MIT for /tracker, recorded as two entries. The copyright line names Ayuhito, while the GitHub organization medama-io is named Medama Analytics on its profile; the legal entity behind the organization is not stated on any page read, so no hqCountry is recorded. The homepage oss.medama.io redirects from medama.io and is the documentation site. Coined kinds in notes: cookieless (no cookies, no IP addresses, no additional identifiers, from the README features), privacyClaims (GDPR, PECR, README features), embedMethod (script tag served from the analytics server, script.js, with data-api and data-hash options on the tracking snippet page). The API is described as an OpenAPI document served by each instance at /openapi.yaml, with session-cookie authentication and endpoints for websites, stats and users; the pages do not state a REST style, so headlessApi is left out. The Authentication page is placeholder text and is not used for userRoles. The databases are two files, me_meta.db and me_analytics.db, and the pages name no engine. Fly.io and Railway guides quote prices for their platforms; they are not recorded. The Railway link on the pages carries a referral parameter, which is not recorded. Windows is unsupported for the binary and the pages suggest Docker there. The demo is at demo.medama.io. The binary is built for linux amd64 and arm64 and macOS 12+ per the single-binary page.
