notes: >
  The README opens with a maintenance-mode notice: "clean-css is now in a maintenance mode", with pull requests welcome and an occasional bugfix release promised. The project does not state it has ended or is unmaintained, so the status stays accepted and the notice is for review. The repository has no GitHub releases; its release record is the tags, the highest stable tag is v5.3.3 and npm latest is 5.3.3 (2023-11-30), and npm dist-tag 3.4-latest marks an older line that does not change currentMajor. The last push to master is 2024-10-18. The command-line tool is the separate npm package clean-css-cli, and the README links it; its figures are not recorded here. The npm weekly figure counts the clean-css package; the install docs name it. The README also links web interfaces at clean-css.github.io, refresh-sf.com and adamburgess.github.io; only the project's own site is recorded. The README names Gulp, Grunt, Broccoli, Brunch, Metalsmith and others as build tools with third-party plugins, not as a parent project, so no basedOn is recorded. The LICENSE copyright line names JakubPawlowicz.com, a domain, while package.json names Jakub Pawlowicz as author, which is the recorded maintainer. The homepage is a JavaScript shell; its runsAs and rendering statements come from the README only. The runsAs browser value rests on the README's first paragraph, which says the tool is for Node.js and any modern browser.
