notes: >
  The README describes the React package as a React wrapper including the styled API, and the Stitches Core package as framework-agnostic. The repository is archived on GitHub and its default branch is canary; the README says "Update June 19, 2023: Stitches is no longer actively maintained due to changes in the React ecosystem and maintainer availability", and the homepage says "Stitches is no longer maintained". The linked discussion 1149 (read 2026-10-28) says the site is updated to state the project is no longer maintained, and the page shows "This repository was archived by the owner on Apr 25, 2026. It is now read-only."; it names no successor and asks for a new maintainer. The maintainer is the LICENSE copyright holder, WorkOS; the WorkOS terms of service name the company as WorkOS, Inc., but they are the company's terms, not the project's, so the legal form is not recorded as a fact. The README authors section lists Pedro Duarte, Jonathan Neal and Abdulhadi Alhallak. The unscoped npm package stitches is an unrelated package and is not used. The GitHub releases list has only canary and stable tags from 2020 to 2022; the first is the canary v0.0.3-canary.1 and firstRelease is 2020 either way. The React wrapper is a wrapper and is not recorded as basedOn. The homepage nav Discord link and the stitchesjs X link are the project's.
