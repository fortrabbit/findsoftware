notes: >
  The homepage lists the npm route under its install heading as "npm install --save html2canvas", with Yarn as the same registry's alternative. The README says the library "is not suitable to be used in nodejs", so no runtime is recorded; the README also says the script "is still in a very experimental state" and advises against production use, a statement from the README on the default branch and not an end signal. The repository was last pushed 2024-07-18 and its latest release is 1.4.1 (2022-01-22); the release date is from both the GitHub release and the npm 1.4.1 upload. The forum is the GitHub Q&A discussions category linked from the README header, and the Gitter chat is linked from the README badge; neither is a sentence on the project's pages, so neither is recorded. The GitHub repository's first tag, 0.3.0, is committed 2011-09-07, which sets firstRelease to 2011; the first npm upload is 2015. The CSV's 11.2M weekly figure is stale; the recorded figure is the sum for 2026-11-01 to 2026-11-07. The README says the script "reads the DOM and the different styles applied to the elements" and that it "does not require any rendering from the server". The documentation page describes the script as one that "traverses through the DOM of the page it is loaded on", says the result "may not be 100% accurate", that images must reside under the same origin unless a proxy is used, and that plugin content such as Flash or Java applets is not rendered.
