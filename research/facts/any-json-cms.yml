notes: >
  The project has no homepage: the repository is the only project page, so no homepage is recorded. Installation is documented in two other repositories the README names: the admin application server (github.com/evmizulin/cms-admin, Node.js v8+, config.js, npm start and npm run start.prod) and the API server (github.com/evmizulin/cms-api, MongoDB v3+, Sendmail, config.js, npm run start.prod). Both are read through their READMEs; the cms-admin install page names Node.js only, the cms-api page names MongoDB and Sendmail as required. The repository has no GitHub release, only the tags 1.0.0 and 1.1.0, so no latestReleaseDate is recorded; currentMajor comes from the tags, and lastCommitDate from the newest commit on the default branch (2022-01-13). The cms-api repository was last pushed 2022-12-10. The GitHub language field is empty for the main repository; the two parts are JavaScript. The README does not name a REST or GraphQL style; it shows a GET request to /entries with an ApiKey header, which is recorded only as the README's example. Contributors counted from the contributors endpoint (1 on the main repository, 1 on each of the two parts). The maintainer is the package.json author of the two parts; the GPL-3.0 LICENSE file carries no copyright line. firstRelease is the year of the commit behind tag 1.0.0 (2019-05-25). The README shows the production start command but no page says how the process is kept running, so runsAs is not recorded.
