notes: >
  The record is a browser editor library that the install docs describe as embedded in a page through a script tag or npm, so it is in scope under the editor group. No runtime fact is recorded: the homepage lists modern browsers on desktops, tablets and phones, which is a support list, and no page states that Quill runs in the browser, so runsAs is left out and the reviewer may settle it. The maintainer is Slab, as the quickstart, installation and formats pages of quilljs.com say ("developed and maintained by Slab") and the README says ("actively maintained by Slab"); the LICENSE copyright line reads "Copyright (c) 2017-2024, Slab", and the LICENSE also carries "Copyright (c) 2014, Jason Chen" and "Copyright (c) 2013, salesforce.com". The README names Jason Chen and Byron Milligan as its creators. slab.com/terms names Fallacy Labs, Inc. (doing business as Slab) as the operator of Slab's own service; that page is not on quilljs.com and does not name Quill, so the legal form is not recorded as the maintainer. The company address on slab.com/privacy is the source for hqCountry. The homepage describes an API with granular access to the editor's content, changes and events, with JSON as both input and output, and the quickstart initializes Quill with a DOM element that becomes the editor. The Formats page lists a Text Direction format by label only, so no i18n fact is recorded. The first npm upload is version 0.1.0 on 2012-03-25, older than the first GitHub tag v0.0.1 (committed 2013-02-07), so firstRelease is 2012 by the registry rule. The GitHub repository reports BSD-3-Clause and the README says BSD 3-clause; one license entry is recorded. The npm weekly figure is the sum of the daily downloads for 2026-11-01 to 2026-11-07. The repository's latest GitHub release is v2.0.3 from 2024-11-30; its latest prerelease v2.0.0-rc.5 is older than that release and is not recorded. The Community section of the README names Issues and Discussions; the Discussions link is the forum fact. The quickstart page shows a star count and a homepage star badge; those are not recorded. The docs field points to the quickstart page that the README links for documentation.
