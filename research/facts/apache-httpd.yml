notes: >
  The GitHub mirror has no releases; the stable line is the tag 2.4.69, and the release date comes from the project's download and homepage pages (2026-10-01). The homepage's 2.2 end-of-life notice covers the 2.2 line only; the 2.4 line is listed as not end-of-life on endoflife.date. Docker Hub pulls in candidates-server-infra.csv (4.7B) were not recorded: the project's install and download pages name no Docker image. The download page says the Windows builds come from "a number of third party vendors", so no Windows installer is attributed to the project. The docs also list the RPM packaging format and third-party Linux distribution packages, recorded as one installMethod. The license is stated once on the platform page; the LICENSE file on GitHub carries the same Apache-2.0 license. The download page links the historical 1.3, 2.0 and 2.2 families on an archive site; those lines go to notes and are not recorded as release facts. The homepage describes "100+ modules for rewriting, proxying, load balancing, scripting, and more"; that count is the project's own figure but changes over time, so it is not recorded. The Apache Software Foundation is a U.S. 501(c)(3) per its own foundation page, which gives a tax ID; the ID is not recorded. Apache Traffic Server is a separate project in this area and is not treated as a parent or variant of this record. Fields coined here: none.
