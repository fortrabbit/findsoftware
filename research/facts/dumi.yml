notes: >
  The dumi docs are published in Chinese only: the guide, configuration and command pages read here are all in Chinese, and the i18n page describes multi-language sites a project can build with dumi, not a translation of the docs. The README is in English and links the Chinese site. The homepage lists Ant Design, AntV, qiankun and UmiJS among projects that use it; that is a list of users, not a relationship recorded here. The FAQ states that dumi is built on Umi, which is recorded as basedOn. The FAQ deployment section builds into a dist directory and publishes it to GitHub Pages, which is the basis for runsAs static. The npm package dumi is the core package named by the create-dumi install step; the npm figures come from it.
