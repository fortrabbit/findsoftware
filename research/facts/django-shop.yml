notes: >
  The homepage http://www.django-shop.org answers 200 over plain http only; https://www.django-shop.org and https://django-shop.org give no response, so no homepage is linked and the docs are the project's own site. The README links a Gitter chat (gitter.im/awesto/django-shop), which has no field. The features page says the shop plugs into django-CMS and that payments run through Stripe with other providers pluggable; these stay out of the fields. The PyPI project is named "django-SHOP"; the registry figure is the django-shop package on pypistats (371 downloads in the last month, read 2026-10-23), as the PyPI JSON reports none. The CSV row says pypi 9/wk and that figure is not reproduced. The repository has no GitHub releases, only tags, so currentMajor is the PyPI stable release; the last PyPI release is dated 2021-02-02 and the last commit on the default branch is 2021-02-28. The import will move the record to stub after four years without a release, which is not a fact-file decision. The PyPI requirements pin Django below 3.1 and the docs compatibility table ends at Django 3.0; no runtimeMin is recorded because no page or the registry's requires_python states a minimum Python version. The copyright lines in LICENSE.txt name Christopher Glass (2008) and Jacob Rief (2016); the maintainer is recorded as Jacob Rief, the PyPI author and the docs copyright holder. No legal entity is stated. The Docker reference composes a uWSGI application container, an optional worker, and postgres, redis and elasticsearch containers. The docker field is coined here for a documented Docker Compose deployment.
