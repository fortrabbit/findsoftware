notes: >
  The repository holds the Statiq Framework; its README says the project is an evolution of Wyam, recorded as successorOf. Statiq Web, the generator the install docs name (dotnet add package Statiq.Web), and Statiq Docs live in their own repositories and are not recorded here; under AGENTS.md "software built on other software gets its own record", so a reviewer should decide whether statiq-web gets a record of its own. The repository has 78 GitHub releases, all prereleases, the newest v1.0.0-beta.60 from 2024-01-09; NuGet has no stable Statiq.Web version either, so no currentMajor. The support page says Statiq Framework and most peripheral projects, including the web site, are MIT, while Statiq Web and Statiq Docs are dual-licensed under a public license and a private commercial license; the public and private license terms are not recorded as a license value because they are not SPDX identifiers. The GitHub API reports the license as NOASSERTION. The repository also holds Statiq Web and the extensions, and its LICENSE.md is the Statiq Public License 1.0.0, which limits commercial use; the README states the Framework is MIT, so both licenses are recorded. LICENSE.md carries the notice "Copyright Statiq, Inc.", recorded as maintainer next to the site footer's "Statiq/Dave Glick". The site says Content and data can come from input files, databases and services, and that documents are processed by pipelines of modules; it describes the public license as limiting commercial use by size and the private license as per developer. The oldest GitHub release is v1.0.0-alpha.3 (2020-03-08). Twitter is the only social link in the header and footer. nugetDownloads is the total of the Statiq.Web package. The site describes deployment to Netlify and Azure App Service; no field holds deployment targets.
