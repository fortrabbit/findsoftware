notes: >
  PHP-FPM ships inside the PHP source tree, so its release is the PHP release: the record follows php-src tags and the endoflife.date php cycles. The highest stable tag is php-8.5.12 (2026-10-21), so currentMajor is 8 and the 8.5 line goes to notes. The install route is the manual's installation page (install.fpm.install.php), which names the --enable-fpm configure option. The php.net manual states that php-fpm "must not be reachable from an untrusted network". The LICENSE at the 8.5.12 tag is the PHP License, version 3.01. The php.net license page says the PHP License version 4 (SPDX BSD-3-Clause) applies from PHP 8.6, and GitHub detects BSD-3-Clause for the repository; neither is the license of the latest stable release, so both stay in these notes only. An 8.6 beta tag exists (php-8.6.0beta3, 2026-09-08), but it is older than the latest release, so no latestPrereleaseDate is recorded. The runtime is php because FPM runs PHP code and is built from the PHP source tree. firstRelease is the year of PHP 5.3.3, whose NEWS lists "Added FastCGI Process Manager (FPM) SAPI." The maintainer is named by the copyright line as The PHP Group; no legal form is stated. The CSV row's release date (2026-09-24) is older than the 8.5.12 tag and is replaced here.
