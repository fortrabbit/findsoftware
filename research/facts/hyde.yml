notes: >
  hydephp/hyde is the project template installed by composer create-project; development happens in the hydephp/develop monorepo, which splits into hyde/framework and other packages, so the contributor count comes from develop and both Packagist figures are recorded. The about page names one creator and no company, and says the project has no venture funding. Area is php-framework per the queue, though it is a static site generator. Coined fields: contentFormats (source formats it reads), sponsorship, blog.
