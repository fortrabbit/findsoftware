notes: >
  Accepted. The repository conductor-oss/conductor is the continuation of Netflix/conductor, which GitHub reports as archived (last push 2023-12-22); the README FAQ says "Conductor OSS is the continuation of the original Netflix Conductor repository", and the homepage says "Originally created at Netflix". No record id exists for Netflix Conductor, so neither forkOf nor successorOf is set; The maintainer is Orkes Inc. (legal name from the website terms, "doing business as Orkes"); the README calls Orkes "the primary maintainer" and says Orkes Conductor is "built on top of Conductor OSS". No page names the headquarters country, so hqCountry is unknown. The Orkes Cloud and enterprise platform are a separate product and are not recorded beyond hostedOffering. The npm figure counts the CLI package that installs and starts the server JAR; the server itself has no npm package. The Docker image conductoross/conductor is the image the README names. The README names 5 persistence backends and 6 message brokers; the table lists the database configurations recorded above, and Elasticsearch, OpenSearch and the brokers are search indexes or queues, not databases, so they go to notes only. The Slack community link is on the README and the homepage; no slack field exists. The first stable release in this repository is from 2024; the project's history at Netflix is not counted. Workers are written in Java, Python, Go, JavaScript, C#, Ruby or Rust ("Workers in Java, Python, Go, JavaScript, C#, Ruby, or Rust." on the README); this is a coined list and stays in notes. The deployment guide names the server components and the compose files with Cassandra and SQLite backends.
