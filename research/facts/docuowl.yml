notes: >
  The repository has no homepage set; the README links a demo at docuowl.github.io/demo, which is a demo of the output and not recorded as the project's site. The highest stable GitHub release is v0.2.4 (2021-10-25), and the releases run from v0.1 (2021-03-31), so currentMajor is 0. The LICENSE section of the README names two copyright holders, Victor Gama and Real Artists; the maintainer is recorded as the first. The README says Stripe allowed the author to use its API documentation layout. Each section is a folder with a content.md file and an optional sidenotes.md file, each group is a folder with a meta.md file, and the watch mode serves a preview on 127.0.0.1:8000 that reloads when input files change. The README's TODO list names full-text search and tests as not yet done. The last push is 2023-02-25 while the newest commit on master is dated 2021-10-25; the release date is used.
