notes: >
  No project homepage: the repository's homepage field is a bit.ly short link, which is not the project's own site, and the README names none; the record links the repository only. The version line is 0.x: currentMajor is 0. The latest release is 0.18.1 (2026-10-21); the CSV row's date (2026-09-30) is the 0.17.0 release. The README names libvips 8.16 or later as an image library dependency and a Go compiler plus bzr, svn, hg and git for the build. The README lists a second build route as "make docker-build", which builds a unix binary through Docker. Coined kinds, kept in notes: storage backends (filesystem, S3, DigitalOcean S3, Google Cloud Storage, HTTP-loaded sources), key/value stores for generated keys (Redis, Redis cluster, in-memory cache), outputFormats (jpeg, png, gif, bmp, webp, avif), urlSigning (HMAC-SHA1 request signature with a secret key), sentry error reporting. The README says the server will be served "ideally behind an HTTP cache system like varnish", lists Ulule as a production user and names pilbox and thumbor as inspirations (not alternativeTo statements). Maintainer: the LICENSE copyright line names Florent Messa (2014); the README names no other entity.
