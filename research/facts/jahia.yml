notes: >
  The license is dual: the file header reads "THIS FILE IS AVAILABLE UNDER TWO DIFFERENT LICENSES: 1/Apache2 OR 2/JSEL", and license/apache2.txt and license/jsel.txt sit in the repository. GitHub detects no license (the API returns null), and the repository has no root LICENSE or README file. JSEL says that Commercial Use takes effect only with a document signed with Jahia Solutions Group, and that commercial and supported versions (Enterprise Distributions) need a separate written agreement; JSEL is recorded as the license it is, not as an open-source license. The pricing page says "Open-source platform" under Developers; that wording is not recorded because the dual license above states the terms. The pom.xml names a private jahia-private repository as its scm; the public repository holds source code, so sourcePublic is not set to false. The docs domain docs.jahia.org does not resolve, so the Jahia Academy is cited as the documentation. The Docker image is for developers and gives a 30-day trial, after which the page says to contact Jahia for licensing. The tags list has no GitHub releases; firstRelease uses the oldest tag JAHIA_6_5_0_0 (2011-06-04), and latestReleaseDate uses the newest tag JAHIA_8_2_3_0 (2026-01-16). The supported-stack table lists Oracle 19c as Tier 1 support for the current release, so oracle is recorded. The Apache Tomcat 9.0.x application server on that table is the only application server named (coined field serverNeeds, kept here). The plan comparison on the pricing page lists Granular Permissions and Enterprise SSO integrations without saying which edition holds them. The React and GraphQL names appear only in the pricing page's developer stack line, so no templating or headlessApi fact is recorded from them. The pricing page developer line "Headless or hybrid rendering (SSR/CSR)" gives renderingModes.
