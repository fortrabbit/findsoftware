notes: >
  The homepage answered 200 with an empty script shell, so the docs statement comes from the README, which points to redom.js.org for live examples and docs. The highest GitHub release is v4.1.0 (2024-05-29); the npm latest 4.3.0 (2025-01-17) has a tag but no GitHub release, so latestReleaseDate is the npm date and currentMajor is 4 from both. The first upload is npm 0.0.1 on 2016-08-28, the repository creation date. The README names community chat on Gitter and Open Collective backing; neither has a field, so they are not recorded. The README links the project's Twitter account as an image badge with the alt text "Follow @redomjs", recorded as x; the second badge, @pakastin, is the maintainer's personal account and is not recorded. The README links a NO:DOM server-side rendering package, a project generator and devtools as separate repositories; none is counted. The README says "RE:DOM is an MIT-licensed open source project" and its license line and the LICENSE copyright differ only in dash and punctuation, so one license entry is kept, from the LICENSE file. The maintainer is "Juha Lindstedt and contributors" as the copyright line states it. The repository's last default-branch commit is 2025-01-17, and the repository was pushed on 2025-03-10 (not counted as a release).
