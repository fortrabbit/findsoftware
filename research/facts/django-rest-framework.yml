notes: >
  Encode OSS Ltd is the copyright holder in the LICENSE.md; the license page on the docs site carries no legal statement, so the name comes from the repository's LICENSE file. GitHub reports NOASSERTION for the license because the file is an expanded BSD-3-Clause text. firstRelease is the oldest PyPI upload (0.1, 2011), matching the repository's creation year in 2011. basedOn is taken from the PyPI summary "Web APIs for Django, made easy." The forum link is the Google Group the homepage links.
