notes: >
  The candidates row named the default branch of the repository, which the README marks as the active development branch (0.10.0-lighting-feature) and tells readers to check out the latest stable release, tag 0.9.0. The GitHub API reports 0.9.0-master (2022-10-05) as the latest release; the README and the tag 0.9.0 (2022-06-25) are taken as the stable release, so latestReleaseDate is 2022-06-25. The 0.9.0-master build is not recorded as a prerelease: it is a build from the master branch and not an alpha, beta or release candidate. The reviewer should decide whether it counts as the latest release. The latest release is more than four years old on 2026-10-28, so the import moves the record to stub under the four-year rule; status is left accepted here. The stable major is 0, since the 0.x series has no major version of its own; the rule records the major only. The crate name lnx is not recorded: no page names crates.io as an install route. The Cargo workspace at 0.9.0 declares no rust-version, so no runtimeMin is recorded; the development branch README names rustc 1.81 for building from source, and that is the development branch, not the stable release. The homepage quick start runs the Docker image chillfish8/lnx; the image tag is latest, so no version is recorded for it. The 0.9.0 README and the homepage give the REST server, and the docs at docs.lnx.rs are an OpenAPI reference rendered from the server's openapi.json. The README says lnx stands on tokio, hyper and tantivy; those are not records, so no basedOn is recorded and the names are kept here. The homepage footer reads "2021 lnx search", and the LICENSE copyright line names Harrison Burt, the name used as maintainer; the GitHub organization lnx-search is the repository owner, with a location of the United Kingdom that is not a legal notice, so no hqCountry is recorded. The README's Limitations section says lnx is not distributed yet and lists metrics as not yet offered. The homepage names 17 latin languages and says Chinese, Japanese and Korean are planned.
