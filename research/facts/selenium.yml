notes: >
  Monorepo: stars, contributors and the Java core belong to SeleniumHQ/selenium, the umbrella repository the README calls "an umbrella project". The Java core is the Maven artifact org.seleniumhq.selenium:selenium-java, which publishes no download figure, so the registry figures are the packages of the other bindings the getting-started page names: PyPI selenium (pypistats, last month), npm selenium-webdriver (range 2026-11-01 to 2026-11-07), RubyGems selenium-webdriver and NuGet Selenium.WebDriver (totals). dependentPackages and dependentRepos count the npm package selenium-webdriver only. Highest stable GitHub release is selenium-4.52.0 (2026-10-29), which matches PyPI and npm latest; the "nightly" prerelease is not a dated alpha, beta or RC and is not recorded. GitHub's release list only starts in 2021 with backfilled 2.x releases, so firstRelease is the commit date of the oldest tag, rc-0.9.2 (2007-09-20). The maintainer is the copyright holder named in the repository NOTICE file (the LICENSE file names none); the about page says the project is a member of the Software Freedom Conservancy and has no dedicated legal entity of its own, so the conservancy is not recorded as parent. The bluesky link on the about page is the SeleniumConf account, labeled "Selenium BlueSky". The support page also lists an IRC chat room, a Matrix space and a Slack channel, which have no field; the Selenium Developers Group is a contributor mailing list and is not recorded as newsletter. The Selenium Grid is a separate server the project documents; no runsAs is recorded because the bindings are client libraries. Runtimes differ by binding (Java, Python, .NET, Ruby, Node) and no single runtime is stated, so runtime and runtimeMin are left out. Coined kinds: W3C WebDriver conformance (homepage: "using the official W3C WebDriver standard") and Selenium Manager (driver download, getting-started page) are notes only.
