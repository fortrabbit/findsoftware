notes: >
  The repository is a monorepo: the install docs name @rhds/elements, the Web Components package, and that is the record's npm figure. @rhds/tokens and @rhds/icons are separate packages and carry no figure here. The install page lists three ways to load the components: the Red Hat CDN (recommended, through an import map), npm and jsDelivr; installMethod records npm, the Red Hat CDN and jsDelivr, each with its own quote, and the CDNs have no download figure. The Red Hat CDN accepts requests only from *.redhat.com domains, which the install page states; a reviewer should weigh that for a reader outside Red Hat. The GitHub language is HTML, because of the documentation site; the elements source is TypeScript and the published package ships JavaScript modules, so language is javascript. The about page names PatternFly and PatternFly Elements as separate projects it shares design with and takes inspiration from, and no page says the elements are built on PatternFly Elements, so basedOn is not recorded. The install page says jsDelivr and other public CDNs should be used for development purposes only. The releases list holds 34 prereleases from 2022, the first being 1.0.0-beta.1 on 2022-05-10, which is the firstRelease year; no prerelease is newer than v5.0.0. The homepage footer comment "© Red Hat, Inc. CC-BY-4.0 licensed" states a license for the documentation content, not the software; it is not recorded as a license fact. The maintainer is Red Hat, Inc. as the LICENCE copyright line states it; the hqCountry comes from the company's own about page contact block. The ecosyste.ms counts for @rhds/elements are small (2 packages, 5 repositories) and are recorded as stated. The homepage answered 200 and the docs were read from the homepage and the repository.
