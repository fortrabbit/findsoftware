notes: >
  The GitHub homepage field points to https://link.zhgchg.li/, the maintainer's personal link page built with linkyee, not to a site of the project, so no homepage is recorded; the README's live demo is a page on the maintainer's own site. The repository has no release and no tag, so no version or release date is recorded and lastCommitDate is the date the listing uses. The README says linkyee is inspired by Jekyllrb and LinkTree and states no base software, so basedOn is not set; categories holds ssg because the README describes a site rendered at build time and the vocabulary has no entry for link pages. The GitHub language field reads JavaScript, which no page states, so language is not recorded; the Ruby runtime comes from the README, which names Ruby with bundle install for the liquid and nokogiri gems, and Python 3 or Ruby for the preview server. The README states no minimum Ruby version. The README's daily rebuild of plugin data runs through a GitHub Actions schedule and is not recorded as a runtime. The container deployment runs the site on port 8080 and refreshes plugin data at the interval set by REBUILD_INTERVAL. Donations link to PayPal and are not recorded as pricing.
