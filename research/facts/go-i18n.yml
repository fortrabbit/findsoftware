notes: >
  The repository has no project website: the README links the package documentation on pkg.go.dev and the code examples on GitHub, so homepage is left out. The README names the goi18n command as a go install line in a code block (go install with @latest for goi18n) and no sentence names the route for the package, so installMethod is left out; the import path is github.com/nicksnyder/go-i18n/v2. The README describes message files of any format (JSON, TOML, YAML), text/template placeholders and CLDR plural rules for 200+ languages, and the plural-rule code is generated from CLDR data; these are coined kinds and stay in notes. The v1 line (v1.0.0 tag, 2015-04-30 commit; GitHub release 2015-06-09) is the oldest in this repository; the module path for v1 differs, so the current module is the v2 path. The v2.0.0 betas are older than the latest stable release, so no latestPrereleaseDate is recorded. The LICENSE file names the copyright holder as Nick Snyder (2014) with the MIT text; the README wording is the same MIT license. The go.mod at v2.7.0 states go 1.26.0. Stars, contributors and dependents belong to the go-i18n repository and its module.
