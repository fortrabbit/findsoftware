notes: >
  The project is accepted with a stated end of life: the homepage and the Insiders post say critical maintenance runs through May 5, 2027, and the successor Zensical is named. Those are future dates and a successor, so the status stays accepted; the end-of-life date and the successor stay in these notes. The Insiders edition (a paid tier of private features, per the candidate note) was made free in 9.7.0 (blog post of 2025-11-11), so no paidEdition is recorded. Studio and Spark, optional products by the same team, are not editions of this software and are not recorded. The LICENSE copyright line gives 2016-2025. The getting-started page says the Docker image is for local previewing only; that is not recorded as a field. The PyPI JSON carries no download counts, so pypiDownloads comes from pypistats.org. The social links are the maintainer's own accounts as the homepage names them. firstRelease is the oldest GitHub release (0.1.0, 2016-02-09). Maintenance mode (the Insiders post says "Material for MkDocs is entering maintenance mode" and critical maintenance continues through May 5, 2027) and the named successor Zensical (homepage: "Zensical is the successor to Material for MkDocs"). The homepage lists built-in search running in the visitor's browser, code annotations and social cards as features. The reportedInstalls value is the homepage's own wording, a count of individuals and organizations rather than installs. The Bluesky link on the homepage is an icon link (title "bsky.app") and the Discord invite sits in the navigation under "Asking a question"; the URLs themselves are in the page links, not the page text. No newsletter link was found on the homepage.
