notes: >
  Listed: the repository is pushed (last push 2024-07-04) and carries a 2.0.0 release from 2018-11-21; the npm package has 2.0.1 from 2021-03-19, which is the latestReleaseDate because it is the newest stable release on any registry. That date is more than four years old, so the import moves the record to stub by rule. The homepage in the README is plain http; the https address of the same GitHub Pages site answers 200 and is recorded. The README calls the project "in the spirit of Jekyll" and "like a file-based CMS"; neither sets a basedOn or a CMS category, since the project has no admin interface and it does not say it is a parent of anything. The maintainer comes from the LICENSE.md copyright line. The wiki is the documentation; its Server Mode page lists Apache, NGINX, Node HTTP-Server, Node Ecstatic and Python SimpleHTTPServer as supported servers, which must have directory indexing enabled. The README links a newsletter sign-up over plain http only, so newsletter is not recorded. The latest commit on the default branch dates from 2021.
