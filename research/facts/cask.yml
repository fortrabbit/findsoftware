notes: >
  The GitHub API reports the license as NOASSERTION, but the LICENSE file in the repository is the MIT License, so the license fact cites the file. The homepage and the README name Li Haoyi as author; the LICENSE copyright line is recorded as the maintainer. The repository has GitHub releases from 0.0.1 (2018-08-12) to 0.11.0 (2025-10-18); the README and the Maven coordinates name 0.11.3, which has no GitHub release, so the highest stable GitHub release, 0.11.0, sets currentMajor and latestReleaseDate. The Maven Central metadata for cask_3 lists 0.11.3 as the latest and release version. The Scala 3 artifact cask_3 is the one the Mill coordinate with two colons resolves to; other Scala binary versions are not recorded. The page's virtual-thread section says running Cask with virtual threads needs Java 21 or later, which is recorded as the runtime quote; no general minimum Java version is stated, so runtimeMin is not recorded. The homepage describes its Flask inspiration; that is not a basedOn relation, so none is recorded. The full-stack example uses Scalatags and ScalaSql, which belong to example code, so no templating or databases fact is recorded.
