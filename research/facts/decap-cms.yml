notes: >
  Decap CMS is the new name of Netlify CMS since February 2023, per the README; the repository is the same project, so the record carries the GitHub history from 2016. The package the install docs name for the npm route is decap-cms-app, recorded as the registry id with its weekly figure; the CDN build is decap-cms, and the highest stable GitHub tag of that monorepo line is decap-cms 3.17.1. The LICENSE file reads "Copyright (c) 2016 Netlify <decap@p-m.si>", recorded as maintainer; the site footer reads "2026 Decap CMS" and the README names PM (p-m.si) as main partner. Decap Turbo is a hosted backend for the CMS (README: editors log in with Turbo accounts, large collections load from a cache, access is managed per site) with plans on its own pages; it is noted here, not as a field, and no prices are recorded. Decap has no database, no API and no template engine of its own in the sources read, so those fields are unknown. The README describes the admin as a single-page app that runs in the editor's browser, recorded as runsAs browser beside static.
