notes: >
  Docksal is a command-line tool (fin) and a set of Docker Compose stacks, written in Shell; it runs on the developer's machine on macOS, Windows and Linux. Operating systems and runtime per the install page, read 2026-10-28: macOS with VirtualBox or Docker Desktop, Linux (Debian, Ubuntu and Fedora distributions supported by the install script, others by manual Docker setup), and Windows 10 with WSL 1 and either VirtualBox or Docker Desktop; the install page says "Do NOT install or upgrade to WSL 2. It is not yet supported in Docksal". The install page also says "Docker Desktop for Mac v4.29.0" and "Docker Desktop for Windows v4.29.0" as the versions it was checked with; no versions are recorded. The stock images named on the images page include MySQL and MariaDB; only MySQL has a quote for its own version line, so databases records mysql alone. The first release is the oldest GitHub release in this repository: v1.0.0-rc1 dated 2016-11-23, a prerelease; the first stable release is v1.0.0 dated 2017-01-30, and the year 2016 is the rc. The latest stable release is v1.19.0 dated 2024-05-24; the newest prerelease, v1.13.0-rc2 dated 2019-11-26, is older, so no latestPrereleaseDate is recorded. The default branch develop has commits as recent as 2026-10-26 (a merge of a phpMyAdmin image change), so the project is not archived and no end statement was found; the CSV row's commit date of 2025-12-19 is older than the API. The README names GitHub Discussions and a Drupal Slack room; neither has a schema field and both stay out of the record. The homepage footer reads "© 2015-2021 Docksal Team" and lists maintainers Leonid Makarov, Oleksii Chekulaiev and Sean Dietrich, while the LICENSE copyright reads "Docksal"; the maintainer is recorded from the LICENSE. The homepage names FFW Agency, EPAM Systems and Kanopi Studios as supporters; they are not recorded as a parent, a company behind the software in the criterion 5 sense, or a hosting partner. The homepage lists Drupal, WordPress, Magento, Laravel, Symfony, Grav, Hugo and Gatsby boilerplates; these are project templates from the Docksal organization, and no basedOn is recorded because the project states no parent. The docs site lists a Sponsor link and a Versions page, not read further.
