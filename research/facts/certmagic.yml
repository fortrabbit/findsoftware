notes: >
  No project site of its own: the repository is the only project URL, the pkg.go.dev page is the Go documentation index, and caddyserver.com documents Caddy, so homepage is not recorded. An embedded library: no runsAs, as the server-infra rule sets for libraries. The README names the Caddy Web Server as the program that uses this library ("The same library used by the Caddy Web Server"); Caddy is not built on CertMagic, so no basedOn is recorded. The README says "Go 1.21 or newer" in its Requirements section; go.mod at the latest release tag (v0.25.6) declares go 1.26.0, and runtimeMin takes the manifest value. The README text is older than the manifest. The maintainer is the author named in the README; the LICENSE copyright line states the author owns the copyright and names no legal form. The first GitHub release is v0.10.0 of 2020-03-07; tags start at v0.5.0 without releases. currentMajor is 0: the project has published only v0.x releases. The README links the author's X account (x.com/mholt6) as a personal link, not as a project channel, so no x fact is recorded. The README wording "licensed under Apache 2.0" matches the GitHub SPDX id, so one license entry is kept. The runtime vocabulary has no go value, so binary stays for the compiled Go program that embeds the library. The Go module has no download figure and no npm or registry package is recorded.
