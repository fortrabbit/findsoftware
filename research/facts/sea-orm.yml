notes: >
  Maintainer: the LICENSE-MIT copyright line names Seafire Software Limited; the README and the org site name SeaQL.org ("an independent open-source organization run by passionate developers", org about page "We are an independent open-source organization"), no page gives the legal name, a country or an address, so hqCountry stays unknown (the footer flag is no sentence). The maintainer choice is a reviewer decision between the LICENSE line and the org name. Dual license: README lists Apache-2.0 and MIT as two entries; the crates.io license field reads "MIT OR Apache-2.0". runtimeMin 1.94.0 is the rust_version of crate version 2.0.4 on crates.io (a declared minimum, not stated on a page). Registry: crates.io crate sea-orm, all-time total downloads. Stars and contributors belong to the single repository. Databases: the install page lists SQLx MySQL and MariaDB, PostgreSQL and SQLite; MSSQL is offered only through SeaORM X, a separate closed-beta product built on SeaORM 2.0 (sea-ql.org/SeaORM-X), not recorded here and no paidEdition, because it is a product paid as a whole. SeaORM Pro (an admin panel, React and GraphQL, role based access control) and Seaography (a GraphQL framework built for SeaORM) are separate projects with their own docs and are not recorded here, so adminUi, headlessApi and userRoles stay unknown for this record. The README claims "250k+ weekly downloads" and "Production Ready"; neither is recorded (no dated source, and a claim that rots). The compare page "Compare with Diesel" names Diesel, a record id, and is recorded as alternativeTo. The sea-orm-cli README and the CLI docs page say the tool generates entity files from an existing database (MySQL, PostgreSQL and SQLite are the databases the CLI page lists). The README TLS section says SeaORM's default features do not enable TLS and that a TLS backend for SQLx is selected by adding a SQLx dependency with the desired TLS feature. Synchronous support through sea-orm-sync is described on the README and is not a separate record. Latest stable 2.0.4 on crates.io and GitHub, both 2026-09-27.
