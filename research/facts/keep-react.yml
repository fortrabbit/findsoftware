notes: >
  The npm package names react.keepdesign.io as its homepage, and that address now serves unrelated content for every path (an AI book-writing service), so the npm homepage and the documentation links the README gives under react.keepdesign.io are not used. The project's own site is keep-react-pi.vercel.app, the GitHub homepage, and its /docs pages hold the installation guide. The README says the Keep-React name and logos are trademarks of StaticMania. The MIT License file is named License without an extension. The company behind the project is StaticMania, a web agency whose site names it as the agency; no legal form or country was found on its terms or pages, so hqCountry is not recorded. The site's GitHub Discussions link is the forum. The highest stable GitHub release is v1.6.1 (2024-11-10); the npm upload of 1.6.1 is dated 2024-10-23, and the release date recorded is the GitHub one. The npm first upload is 0.0.2 (2023-09-24). The last push is 2025-01-02. Install steps need Tailwind CSS configured with the keepTheme preset, and the Next.js path needs create-next-app with Tailwind.
