notes: >
  Status is stub, not discontinued: the README's first block says "remirror is in maintenance mode and is not recommended for new projects." It says it stays stable and keeps fixing critical bugs, and names ProseKit (https://prosekit.dev) as the replacement for new projects, with a migration guide to move an existing editor over. A maintainer's maintenance statement is a stub with the doubt first; the stub holds until the maintainers or the project's own pages say whether the project continues. The README's alternativeTo quote names ProseKit with "instead"; prosekit has a record. The remirror.io homepage answers with a redirect to https://www.remirror.io/, the Docusaurus site the docs link names. The latest release is remirror@3.0.3 (2025-08-02), and the repository was last pushed 2026-11-11, both as the API reports. The npm figure is the core package remirror that the README badge names; the sum covers 2026-11-01 to 2026-11-07. The stars and the 80 contributors belong to the monorepo. The LICENSE copyright holder is "Remirror Contributors" (2019-2022); the docs footer says the same name for 2026, so the maintainer is recorded as community. The docs intro calls remirror a wrapper library for ProseMirror; the README names ProseMirror as its base, so basedOn is prosemirror. The docs describe ProseMirror as a toolkit for building rich text editors. The README lists collaborative editing with yjs or prosemirror-collab, a11y and ARIA support, mobile support, TypeScript typing and 30+ extensions; these are coined kinds and go here, not into fields. No runtime is recorded: the README names no Node.js or browser runtime statement. The Discord and Twitter links come from the docs footer.
