notes: >
  The repository is a monorepo. The npm package is wattpm, the one the README and quick start install (npm install -g wattpm, npx wattpm create) and the one npm describes as "The Node.js Application Server"; the package named platformatic is described as "Platformatic CLI", has far fewer downloads and is not used for the registry figures. Both declare Node >=22.19.0 in engines. The GitHub repository description names it "Platformatic Open Source monorepo!". The docs and the README title name the software Watt; the record keeps the project name Platformatic. The README lists "Docker deployment" as built in; not recorded as a field. The databases are those of the Database Service (Platformatic DB), which generates the REST and GraphQL APIs. The homepage names ICC (Intelligent Command Center), a Watt control plane, and links to sales; no price is recorded. The Platformatic terms page names "Platformatic, Inc." as the company; the terms page gives its address in San Francisco. The README says Watt runs each Node.js application "as a worker thread", and the homepage says services run "as individually scalable threads under a single process".
