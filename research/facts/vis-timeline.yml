notes: >
  GitHub reports the license as NOASSERTION; the README says "This work is dual-licensed under Apache-2.0 and MIT", and LICENSE.MIT.txt and LICENSE.Apache-2.0.txt carry the texts, so both are recorded from the README and the MIT file. The copyright lines name Almende B.V. and contributors for 2014-2017; the README's current line names vis.js contributors, which the maintainer follows, and Almende B.V. is not recorded as a parent. The README says the legacy build "is deprecated": that is one build, not the project, so the status is not changed. Peer and ESNext builds need vis-data and Moment loaded by the page or a bundler; those are dependency statements and give no basedOn. The docs' second install sentence is the only install route stated in words; the unpkg URLs in the README and docs are code blocks, so no CDN route is recorded. The timeline category has no entry in the import's category map, so only charts maps. firstRelease 2019 comes from the oldest GitHub release (v5.0.0, 2019-07-21); the registry's first upload, 5.0.0, is from 2019-07-19. The repository is a sibling of vis-network; each is its own record. Stars and contributors belong to the visjs/vis-timeline repository.
