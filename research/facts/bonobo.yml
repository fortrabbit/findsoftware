notes: >
  Criterion 3 is in doubt: the only install steps are the Makefile targets (bonobo, debug, fast, install), and no README, docs page or wiki describes them, so a README or docs page with the install route would settle it. The README has no install section; it describes the page format, a JSON metadata block at the top of each Markdown file with title, description, date, language and css keys, and its feature list says RSS is supported, and the Makefile's install target copies the binary to /usr/local/bin. The repository has no GitHub release or tag (the releases and tags endpoints return empty lists), so lastCommitDate is the committer date of the newest commit on master, as AGENTS.md requires. The project is not archived and was last pushed on 2026-04-01, so no end signal is found. The repository description calls it a static site generator, which is the basis for renderingModes static; the README does not state the output form. The repository is the only web presence found, so no homepage is recorded. The contributors endpoint lists one contributor. The Makefile's default target builds with clang, and a tcc target exists for quick builds; the runtime is recorded as binary because the README names no runtime. No runtimeMin or outputDir is stated.
