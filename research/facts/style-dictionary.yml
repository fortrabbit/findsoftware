notes: >
  The project's site and README name no company or person as owner, and the Apache 2.0 LICENSE carries no copyright line, so the maintainer is the GitHub organization name "Style Dictionary" (repoOwnerType organization). The npm manifest lists three individual maintainers, which are not recorded. The installation page's Slack link (join.slack.com/t/tokens-studio) is a Tokens Studio workspace, and the homepage and install page both link it; no field holds a Slack link, so it is not recorded. The homepage says the project is "Forward-compatible with Design Tokens Community Group spec"; that is a standards statement and no field is recorded for it. The live playground is built by RIOTS, a third party, and is not a record fact. The runtime is Node.js for the build step; the install page also says it runs in browsers natively, which is not recorded as runsAs browser because the page does not say a visitor's browser runs the build. The category design-tokens is left out because the import maps it to css-framework. The GitHub release list shows v2.0.0-beta (2017-03-07) as the oldest release, the same date as the oldest npm upload, so firstRelease is 2017. The highest stable release is v5.7.1 (2026-10-24); the newest prerelease, v5.0.0-rc.2, is older than the latest release and is not recorded. The npm weekly figure covers 2026-09-28 to 2026-10-04 for style-dictionary; the CSV row's 1.2M per week was an earlier figure. The contributors figure is the last page of the contributors endpoint with per_page=1.
