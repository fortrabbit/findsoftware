notes: >
  Stub: it is in doubt whether the README's single usage line (python generate.py) is a documented installation, because the script imports mistune and Jinja2 and no requirements file or install step names them; a dependency list in the README or a requirements.txt would settle it. The homepage is the project's own demo site, generated by the software (its content is placeholder posts), and it still describes wg as a static website generator. The repository has no releases or tags, so the import judges it by lastCommitDate (2020-03-07, the newest commit on master). No maintainer is recorded: the only name is the GitHub owner login abelgraham, and config.json and the homepage footer name the author "Your Name Here", a placeholder. The license is GPL-3.0 as GitHub detects it from the LICENSE text (the GPL version 3 text with no copyright line). The docs folder holds the generated site with a CNAME file, which suggests GitHub Pages, but no page of the project says so, so no deployment is recorded.
