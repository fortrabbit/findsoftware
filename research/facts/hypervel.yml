notes: >
  The install page runs composer create-project on hypervel/hypervel, a skeleton; the registry figures come from hypervel/framework, the core package the skeleton requires. Its version 0.3.26 is the current release, so currentMajor is 0. The introduction says the framework "ports many core components from Laravel" and compares itself with Laravel Octane; hypervel/framework does not require any illuminate package in its composer.json, so no basedOn is recorded. Packagist lists v0.3.26 dated 2026-07-22 while the GitHub release is dated 2026-08-14; latestReleaseDate follows the GitHub API. The installation page names the Swoole PHP extension as a requirement, and the deployment page gives Swoole >= 5.1 (not coded as a field). Requirement for PHP 8.2 is from the deployment page, the registry shows the same minimum for v0.3.26.
