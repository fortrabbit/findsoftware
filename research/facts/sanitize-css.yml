notes: >
  The last stable release is 13.0.0 (GitHub release and npm latest, 2021-09-14), so the latestReleaseDate is more than four years old and the import moves the record to stub on its own; the status stays accepted here, and a reviewer decides whether to keep it listed. The README says "Both sanitize.css and normalize.css are maintained in sync", which is no end statement, and the repository was last pushed in 2026-03; no archive flag, npm deprecation or end statement was found. The npm package sanitize.css has its first upload, 1.0.0, on 2015-03-17, earlier than the oldest GitHub tag (4.1.0), so firstRelease is 2015. The README names Jonathan Neal as the project's author and the LICENSE carries no copyright line; the repository owner is the csstools organization, so the maintainer is recorded as the person the README names with maintainerType individual, which a reviewer may change. The README's "Differences" section compares sanitize.css with normalize.css and reset.css; that is a comparison, not a relationship the record states, so alternativeTo is not recorded. The npm dependents and repository counts come from ecosyste.ms for sanitize.css. The README links the stylesheet from the skypack and unpkg CDNs and offers a direct download of the latest stylesheet; both are recorded as installMethod. The HTTP Archive technology list has no sanitize entry, so httpArchiveSites is unknown.
