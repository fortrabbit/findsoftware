notes: >
  The homepage http://chassis.io/ redirects to https://docs.chassis.io/en/latest/, so the https form of the site is recorded; the site is the project's documentation. The docs header reads "Chassis 6.0.0 documentation", but no tag or GitHub release 6.x exists (the highest stable release is 5.4.2, 2024-03-23) and the repository has no 6.x tag; currentMajor follows the releases, so a reviewer should decide whether the docs version is the current major. The GitHub releases/latest endpoint returns 5.4.1 (2023-12-24), not 5.4.2; the highest stable release by version is 5.4.2. The first GitHub release is 2.2 (2019-12-11); the oldest release is recorded, and the repository was created in 2013 with no earlier release. The README says Chassis is built using Vagrant; Vagrant has no record in the dataset, so it stays in notes, and the README does not name WordPress as a parent (Chassis is a tool for a WordPress site). The quickstart requires VirtualBox and Vagrant on macOS, Windows and Linux, and the box runs PHP 8.1, nginx and MySQL; the docs do not state the box as a runtime of the tool, so runtime and databases are not recorded. The docs footer names Ryan McCue and Bronson Quick with a 2021 copyright year; the LICENSE file is the unmodified LGPL-3.0 text with no project copyright line. The repository was last pushed 2026-10-06 and is not archived; the last release is 2024-03-23 (about 2.6 years before the check), which is within the four-year window. The README FAQ compares Chassis with VVV, which has no fact file yet, so no alternativeTo is recorded.
