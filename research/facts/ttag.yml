notes: >
  The README says ttag-cli, a separate package, is used for po file manipulation, and that the project is designed to work with babel-plugin-ttag; neither is recorded as an installMethod. The Community list on the homepage links a Stack Overflow tag, recorded as forum; its Twitter link points to the site root and is not recorded. The GitHub release objects are v0.5.0 and v0.5.1 from 2017, both major 0; the tags v1.0.0 to v1.8.12 have no release objects. The stable line is therefore taken from the npm registry: npm latest is 1.8.12, published 2025-07-01, and its major 1 is higher than the GitHub major, so currentMajor and latestReleaseDate follow npm. The README's CDN section (Usage from CDN, with an unpkg URL to ttag.min.js) has a heading but no sentence naming the route, so no cdn installMethod is recorded. The runtime node rests on the quickstart sentence that the example runs under node; the README also names the browser through the CDN usage, so runsAs stays empty. The README's license line links to another project's repository; the LICENSE file names AlexMost as the copyright holder and is the one recorded. Stars and contributors are checked 2026-11-16, and the last commit on the default branch is also 2025-07-01.
