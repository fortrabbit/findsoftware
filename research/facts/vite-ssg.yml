notes: >
  The project has no homepage of its own; the repository is the only site, so homepage stays unknown. The README says "This library requires Node.js version >= 14", while the npm package engines field for 28.3.0 says node >=20.0.0; runtimeMin records the registry value, the newer and enforced one. The README says the library is ESM-only and that the CJS generation format was dropped, and that Vite 1 support is discontinued; none are recorded as fields. The build command is "vite-ssg build" (README); not recorded as a field. The README heading spells the name "Vite SSG"; the record keeps the repository and package name. The README names Vitesse as an example project; it is not a source for any field here. The npm package has no deprecated flag. The npm weekly figure is for 2026-10-12 to 2026-10-18.
