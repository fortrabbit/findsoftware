notes: >
  Monorepo: the id stands for the Svelte package @skeletonlabs/skeleton-svelte, which the README badge and the SvelteKit install guide both name. The install guide also installs the core package @skeletonlabs/skeleton, which is a sibling of this record and is not counted here. The GitHub releases for this package are tagged per package (@skeletonlabs/skeleton-svelte@<version>); the highest stable release is 5.0.1 (2026-08-19), and the prereleases (5.0.0-next.x) are older than it, so no latestPrereleaseDate is recorded. The oldest release in the repository is 0.30.2 (2022-07-25, a prerelease of the core project), which sets firstRelease; the package's own first release is 1.0.0-next.0 (2024-05-20). The package needs Svelte 5 (peerDependency ^5.40.0) and Tailwind CSS 4, shown as minimum tooling on the Vite guide, and no runtime version is stated. The Skeleton Labs legal name is taken from the LICENSE copyright line and the Skeleton Labs site footer reads "Skeleton Labs LLC. All rights reserved."; no country is stated. The README names Chris Simmons as the creator and Skeleton Labs as the maintainer. The contributor count is the core repository's contributor count, since the repository is shared by the packages. The npm figure is the sum of the daily counts from the npm downloads range endpoint for 2026-10-19 to 2026-10-25 for the Svelte package only. basedOn svelte rests on the SvelteKit install guide, which installs "the Skeleton core and Svelte component packages"; basedOn tailwindcss rests on the homepage. The homepage states no paid tier, and the donation links (GitHub Sponsors and Ko-fi) are not recorded.
