notes: >
  The npm name nes.css was read through the registry latest endpoint; the npm downloads range is the seven days 2026-10-18 to 2026-10-24. One license statement for the software: the code is MIT (README and LICENSE). The README also says the docs are released under Creative Commons without naming a version; that covers the docs only and is not recorded as a license. The LICENSE copyright line and the README both name B.C.Rikko; the homepage footer reads "Black Everyday Company" with a link to kuroeveryday.blogspot.com, and no legal form is given, so it is not recorded as maintainer. The homepage is the project's own GitHub Pages site and serves its own install and usage text. The default branch is develop, last pushed 2024-01-17; the latest release is v2.3.0 (2019-12-17). The README links a Gitter room (gitter.im/nostalgic-css/Lobby) as a badge; no field holds it. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header. Dependent counts are ecosyste.ms figures. The GitHub language field says SCSS; the package ships compiled CSS and a Sass source, so language is CSS. The README says NES.css needs no JavaScript, so no runtime is recorded. The homepage says NES.css only provides components and the layout is the project's own. The HTTP Archive technologies list has no NES.css entry.
