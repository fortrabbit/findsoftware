notes: >
  The project has no homepage of its own: the repository's pubspec names the repository as its homepage, and the GitLab wiki and README are the only documentation. The docs are the wiki Home page, which describes the directives; the install steps are the single README command "dart run src/main.dart", so installMethod is not recorded. The GitLab project has one star (coined gitlabStars, not recorded as a fact). The tag 1.0.0 is the only tag, dated by its commit (2019-08-17); the wiki and pubspec name version 1.0.0. The GitLab project has no releases object. The copyright line names Rizwaan Bhikha, which matches the tag author. The project's templating uses its own HTML and Markdown directives, not a named engine, so templating is left unknown.
