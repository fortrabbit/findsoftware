notes: >
  Doubt: the README says "We no longer release standalone versions of RediSearch" and "Starting with Redis 8, Redis Query Engine (RediSearch) is integral to Redis", while the repository still publishes maintenance releases on the 2.6, 2.8 and 2.10 lines (v2.10.31, 2026-06-17) and was pushed 2026-10-28; this would be settled by deciding whether the standalone end is a discontinued signal, whether the record follows Redis Query Engine inside Redis, or whether the maintenance releases keep it accepted. The first non-prerelease GitHub release is v0.99.0 (2017-11-15); earlier tags are prereleases. No README or LICENSE text names Redis Ltd as the project's owner, so no maintainer is recorded; the Redis licensing page names Redis Ltd only as the licensor of commercial licenses. The license is taken from the v2.10.31 tag; the master branch LICENSE adds AGPLv3 for Redis 8, recorded in notes only. The homepage redisearch.io does not resolve (connection failure), and the docs live on redis.io, so no homepage is recorded. Installation is through Redis 8 or Redis Cloud; no separate install route is recorded because the README says the module is no longer installed separately. Categories are mapped from the README's module description; the CSV's database-extension category maps to database in the import.
