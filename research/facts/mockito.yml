notes: >
  Status accepted. Criterion 1: a mocking library that test code of Java applications depends on, with no application behind it. Criterion 2: published to Maven Central as org.mockito:mockito-core, the install route the homepage names; the README's Shipkit release process uses the same route. Criterion 3: the homepage points to the Central Repository for Maven and Gradle instructions. Criterion 4: the repository is not archived, the default branch main was pushed 2026-11-05, and the latest stable GitHub release is v5.24.0 (2026-09-23). The current major is 5 per the README; the minor line stays in notes. The README says Mockito 5 "requires Java 11", and the build at v5.24.0 sets the Java release to 11 in buildSrc/src/main/kotlin/mockito.java-conventions.gradle.kts, so the runtimeMin matches both. The homepage is the project's own site (mockito.org answers over https); site.mockito.org is named by the README as "The Mockito Site" and holds the documentation. The firstRelease year is the oldest Maven Central upload, version 1.3 on 2008-04-29, which is older than the GitHub tags (the oldest tag v1.0 is 2012-01-29). The LICENSE copyright line reads "Copyright (c) 2007 Mockito contributors", so maintainer is recorded in that wording and the owner of the GitHub organization is mockito. The Tidelift subscription the README names is paid support, not an edition, so no paidEdition is recorded. The project's moderated Google Group mailing list is recorded as forum (the README names it for help) and as newsletter (the homepage says updates are announced there); the Stack Overflow tag the README names is a general site and is not recorded. The project wiki page Mockito vs EasyMock says Mockito started off as an EasyMock fork and shares no code with it; EasyMock has no record, so no forkOf or alternativeTo is recorded. The Twitter links on the homepage belong to individual maintainers, not the project, so no x fact is recorded. The Maven Central download counts are not published, so no download figure is recorded. Ecosystem counts come from ecosyste.ms for the repo1.maven.org registry.
