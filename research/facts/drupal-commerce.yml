notes: >
  Drupal Commerce is a set of Drupal modules, so it is a record of its own with basedOn drupal. Its packages are on drupal.org's Composer repository (packages.drupal.org), not on Packagist; the registry id is recorded as drupalOrgProject (a coined field), and the packages.drupal.org record is the registry source. The drupal.org project page says the project was created on 15 October 2009, which is a project creation date and not a first release, so firstRelease is not recorded. The 3.x line requires Drupal 10.3 or 11 and PHP ^8.1 in its composer require; the Drupal core floor of the Drupal record is higher, so a site on Drupal 11 needs the core floor. The 2.x line (last release on the project page 22 August 2024) is listed on drupal.org for Drupal 9.3 to 10. drupalOrgSites is a coined field for the drupal.org usage counter (41,680 sites report using this module on 2026-10-20). The Centarro legal entity was not stated on centarro.io or the drupal.org pages read, so the maintainer name has no legal form. The drupal.org page states that the operator is responsible for protecting merchants and customers from online payment fraud and points to a PCI compliance white paper.
