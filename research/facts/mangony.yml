notes: >
  Repo-only project: the CSV lists mangony.veams.org as homepage, but it timed out on 2026-10-21 (http and https), and neither the README nor the npm package names another site, so homepage stays absent. The README's "Installation" section gives the npm install command, which meets criterion 3. The repository is not archived and was last pushed 2024-10-30; the npm package latest release is 2.0.3, dated 2024-10-30, and no GitHub release exists. The GitHub API reports the license as NOASSERTION; the npm package declares MIT, and LICENSE.md is the MIT text with no license name, so the license is recorded from npm. The npm figure is for the mangony package for 2026-10-12 to 2026-10-18. The README links grunt-mangony as a separate Grunt plugin; it is not recorded as a record of its own here.
