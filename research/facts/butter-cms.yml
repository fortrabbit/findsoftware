notes: >
  Hosted service: ButterCMS runs as a managed SaaS on Heroku and AWS per its pricing page, with no self-hosted option, so selfHostOption is not recorded. The only repositories are API clients, which are not the service: the JavaScript client buttercms-js shows a GitHub license of NOASSERTION and the npm package buttercms is MIT, and the organization also publishes clients for Ruby, Python, PHP, Go and .NET. None of their license, stars, contributors or npm figures are recorded as the product's. No install page names an npm package. The homepage's developer hub names the Angular, Django, Laravel, Next.js and React frameworks; these are not recorded as basedOn because no page states a parent relation. The features page lists webhooks, a Preview Changes feature and an Image API built on Filestack. The pricing page says the Enterprise plan has custom thresholds and SLAs, which is not recorded as a paid edition. hqCountry is not recorded: the terms give a San Francisco DMCA agent address c/o ButterCMS and name Michigan law, and neither states a headquarters. The pricing page FAQ says paid plans include tools for importing, syncing and reusing content but names no source software. The homepage links to LinkedIn and YouTube, which have no field.
