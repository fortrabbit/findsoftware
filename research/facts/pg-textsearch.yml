notes: >
  No project site beyond the repository and the Tiger Data docs and blog pages. The Tiger Data home page and its docs index do not mention pg_textsearch. The LICENSE is the PostgreSQL License; the GitHub description's "Postgres OSS licensed" is the same license and is not a second entry. CONTRIBUTING.md says the project was originally named Tapir, and pg_textsearch.control carries a 1.6.0-dev version that no release tag matches. The maintainer's name is the legal name from the NOTICE, with Tiger Data as the trade name; no page read gives a country, so hqCountry is absent. The runtime is the PostgreSQL server itself, so no runtime value is recorded. The README's Windows build route is not recorded as its own install method.
