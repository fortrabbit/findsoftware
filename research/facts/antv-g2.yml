notes: >
  The root URL answers in Chinese; the English site is under /en/ and the English pages are the source for every quote. The GitHub repository is a single package (@antv/g2), so its stars and contributors are the package's own. The README states that G2 generates visualizations with the G renderer using Canvas, SVG or WebGL; rendering target is a coined kind and is recorded here only. No page states that the library runs in the browser in those words, so runsAs is left out for the reviewer; the UMD script tag route points to the browser. The maintainer is the LICENSE copyright line, AntV; the site footer names Ant Group Co., Ltd. as copyright holder and that is recorded as parent. The site footer gives no country or full address, so hqCountry is left out. The English migration page (whats-new/migration-from-g2v4) is G2's own version migration, not importsFrom. The npm dist-tag v3-latest (3.5.19) and the GitHub tags for 4.x sit on older majors and are not the current major. The first release year comes from the 1.2.0 tag, whose commit is dated 2016-05-26, the same day the repository was created. The npm weekly figure is the sum of daily downloads for 2026-10-26 to 2026-11-01. The repository owner is an organization.
