notes: >
  Criterion 3 is in doubt: the README and the docs.rs page name no install step (no cargo add line and no Cargo.toml dependency line); docs.rs shows only the dependency list. A README or docs page that names the Cargo dependency line would settle it. The crate is published on crates.io, which is a registry, not an install page of the project. The repository has no GitHub releases or tags; the release dates and the version come from crates.io (stable 0.22.1, first upload 0.2.0). The crate's license is "MIT OR Apache-2.0" on crates.io; GitHub detects Apache-2.0 from the LICENSE-APACHE file and the copyright line is in LICENSE-MIT. The README names a WebDriver process the examples assume (geckodriver or chromedriver for its tests), so no runsAs is recorded: the crate is a client and the process is the browser driver. No page sentence names Rust (the README and the crate docs say "crate" and "WebDriver"), so runtime is left out; runtimeMin is the rust_version crates.io lists for the latest version. The homepage is the repository, so no homepage is recorded. The repository row in the candidates CSV names discovery as the crate; it has no separate site.
