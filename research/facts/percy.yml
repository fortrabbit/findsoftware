notes: >
  Status hosted-service per the CSV row; criterion 2 is waived for hosted services, and the open-source CLI is the client, not the service. The record takes nothing from the client repository github.com/percy/cli, per the rule for SDK and client repositories. That repository's packages/cli/LICENSE is the MIT License with the copyright line "Copyright © Perceptual Inc.", which the record does not use because no page says how that name relates to Percy. The repository has 87 stars; the npm package @percy/cli is at latest 1.32.12 (no deprecation), with 549944 downloads for 2026-09-28 to 2026-10-04 by the build-dev window, where the CSV's 279.8k was stale. The CLI is installed with npm install --save-dev @percy/cli; that install route is not recorded as an installMethod because the service record has none. The maintainer comes from the footer of the product page; the BrowserStack terms page names no legal entity, so no legal form is recorded, and no country is stated, so hqCountry is left out. The terms page names Delaware law, which is not a headquarters statement. The pricing page lists plan screenshot quotas; prices are not recorded, and the free plan's screenshot count differs between the product page and the pricing page, so no freeTier is recorded. The product page says roles and permissions are assigned for projects and tests on the pricing page, but that line is not tied to Percy alone, so userRoles is left out. The data-centers page covers device labs, not Percy's storage, so regions is left out. The percy.io homepage is an application shell; its title is quoted.
