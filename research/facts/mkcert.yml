notes: >
  The domain mkcert.dev answers with a redirect to the GitHub repository, so it is not recorded as homepage. The CSV row recorded about 446k Homebrew installs a year; Homebrew is not a registry in AGENTS.md, so no install figure is recorded. The latest GitHub release is v1.4.4 (2022-04-26) and the default branch was last pushed 2024-08-13; the release date is more than four years old, so the import moves the record to stub on its own. The go.mod at v1.4.4 declares go 1.18 and the README says building from source requires Go 1.13+; neither is recorded as runtimeMin because the published runtime is a compiled binary. The maintainer is the LICENSE copyright holder; the README names no maintainer, and the repository belongs to the GitHub user FiloSottile (Filippo Valsorda). On Linux the README asks users to install certutil first (libnss3-tools, nss-tools or similar); it is a requirement, not recorded as a field. README says building from source needs Go 1.13+ on Linux and Go 1.10+ on Windows. The README describes mkcert as a development tool and does not name websites; whether it meets criterion 1 is for the reviewer.
