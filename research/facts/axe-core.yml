notes: >
  Stars, contributors, npm and the ecosyste.ms counts belong to the axe-core repository, which is a single package. GitHub reports the repository language as HTML because of its test fixtures (HTML 31.2 MB, JavaScript 8.8 MB, TypeScript 13 KB by bytes, read 2026-11-04); the language is JavaScript, with TypeScript declarations. The npm weekly figure is the sum of 2026-10-26 to 2026-11-01, the period in the value; the npm point endpoint returns a stale window. The npm package's oldest upload is 1.0.1 on 2015-06-10, older than the oldest GitHub release (v2.2.0, 2017), so firstRelease is 2015 from the registry. The homepage is the Deque product page for the Axe platform; it lists "Axe-core" among its free tools, and the commercial products on that page (Axe DevTools, Axe Auditor, Axe Monitor, Axe Assistant) are separate products, recorded nowhere here and not paid editions of axe-core. The homepage footer gives "Herndon, VA 20171" with no country named, so hqCountry stays out. The README links Slack chat (accessibility.deque.com/axe-community) and Deque's LinkedIn, YouTube and GitHub links; no Slack or Discord field applies. Runtime: the library runs in the browser of a test; npm engines (node >=4) is not recorded as runtimeMin. The README says it supports Chrome, Firefox, Edge, Safari and, deprecated, Internet Explorer 11, and limited JSDOM support; not recorded as a field. Kinds coined here, kept in notes: results split into violations and "incomplete" items where the engine cannot decide (README); WCAG 2.0, 2.1 and 2.2 at levels A, AA and AAA plus best-practice rules (rule list in doc/rule-descriptions.md); locales for rule messages (18 listed in the README, including Chinese, German, Japanese); "Projects using axe-core" list in doc/projects.md, not a plugin directory. The README's getting-started steps say to include the JavaScript file in each of the iframes of the fixtures or test systems. The repository has no paid tier of axe-core itself. The latest stable release is v4.14.0 (2026-10-05), with no prerelease in the release list read.
