notes: >
  The project homepage at hapticx.github.io/happyx is a single-page JavaScript shell with no readable text, so no homepage fact is written; the README is the project's docs. The README badge states Nim 1.6.14 or later, but the badge is an image URL, so no runtimeMin fact is written. The install docs name nimble, which has no registry figure in the sources used, so no registry fact is written. The README names a Python binding on PyPI and an npm binding; these are bindings, not the framework's install package, and are not recorded. The README says HappyX combines the features of Jester and Karax and improves them, and it sets them against Jester and Karax under "Why Not Jester/Karax?"; alternativeTo records that comparison as the README names it. The README states the default HTTP server is asynchttpserver with httpx, httpbeast and microhttpserver as options; this is not a field in the schema. Criterion 4: the last commit is on 2026-06-03 per the repository's pushed_at; the last release is 2025-01-25, under four years old, so the record stays listed.
