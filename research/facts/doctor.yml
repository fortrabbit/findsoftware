notes: >
  Doubt: criterion 5 (signal of use) is in doubt, since the repository has one star, one contributor and no license, and the docs link on the project's landing page returns 404; a public adoption figure, a named license or a working documentation site would settle it. The page at doctorrrrbuild.github.io is titled "Optician by Doctor" and describes itself as the landing page generator for Doctor, so it is not recorded as Doctor's homepage; its Read Docs link to ./docs/ returns 404, so the README is the only documentation read. The repository has no license file and the GitHub API reports no license; the README says "Doctor is open source." without naming a license, so license stays unknown and only the licenseModel statement is recorded. The GitHub API lists the primary language as HTML, while the repository holds the Python compiler doctor.py, which the README's workflow runs. The repository has no release or tag, so lastCommitDate judges the listing. The owning organization DoctorrrrBuild has no legal name on GitHub, so the organization login is recorded as the maintainer. The README does not state that the output is static files, so renderingModes and a static runsAs value are not recorded.
