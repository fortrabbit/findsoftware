notes: >
  The copyright line names Tom Christie (2014) as the original author; the maintainer is recorded as the ProperDocs Team, which the footer and the Who We Are page name. The Who We Are page says the organization was created in March 2026, and the GitHub organization and first release date from that month. The project's own text puts MkDocs development as abandoned; that statement is about MkDocs and is not recorded here. The README says project configuration is one YAML file, properdocs.yml, which specifies the documentation structure, theme configuration and optional plugin settings. The PyPI JSON carries no download counts, so pypiDownloads is not recorded. PyPI lists requires_python >=3.9 and classifiers up to Python 3.14. The GitHub API reports the license as NOASSERTION; the README names BSD-2-Clause and the PyPI classifier agrees. A twitter.com link on the homepage is not recorded: the page does not say whose account it is. The installation page still shows MkDocs-era sample output (version 1.2.0) and is not used for any version fact. The deployment page names the Read the Docs and GitHub Pages hosting paths; no field holds those. The README links the Python-Markdown extensions and plugins through the catalog; the catalog's count is not recorded.
