notes: >
  Homepage: the README links mustache.github.io as the mustache template language site (its manual and specification), shared by the implementations in many languages; the repository names no site of its own, so no homepage is recorded. The same site answers over https as well as http, so the CSV's http link is not used.
  Release: the latest stable release is v3.2.0 of 2026-05-10. The v3.0.0-alpha1 prerelease of 2025-06-09 is older than v3.2.0 and is not recorded as latestPrereleaseDate. The v2.x upgrade notes in the README state that v3 drops PHP 5.2 to 5.5 support, which matches the composer.json minimum of 5.6.
  runtimeMin comes from the composer.json require section at the v3.2.0 tag, a library's runtime requirement for users, not a dev requirement.
  firstRelease 2010 comes from the tag 0.1 (commit date 2010-04-27); the first GitHub release is v2.4.1 of 2013-08-13 and the repository was created 2010-03-19.
  The Packagist figure is the total downloads for mustache/mustache, the package the README installs. The monthly Packagist figure is 1493152 at the time of reading and is not recorded, to keep one figure per field.
  The maintainer is the copyright holder named in LICENSE; the composer.json author is the same name.
  Stars and contributors belong to the bobthecow/mustache.php repository. The README's "See Also" section links the Ruby mustache implementation, a separate project, so no alternativeTo is recorded.
  The README's usage section creates a \Mustache\Engine and renders a template against a context object. It recommends ENT_QUOTES as entity_flags to reduce the risk of cross-site scripting. Its upgrade section says that v3 changes some defaults (strict_callables, double_render_lambdas) and that previous behavior can be set back through configuration.
