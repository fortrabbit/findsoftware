notes: >
  Hosted-service record for the Locize platform at locize.com. The owning company is inweso GmbH, with a registered address in Altnau, Switzerland, per the DPA. The i18next backend repository (github.com/locize/i18next-locize-backend) is an SDK for the service; its license, stars and npm figure are not recorded per the hosted-service rule. The security page says the company is Swiss-registered and the DPA gives an address in Switzerland; no separate headquarters statement was found, so hqCountry is recorded from the registration. The docs state that OIDC login and SCIM provisioning are not supported; the SAML SSO add-on is priced on the pricing page, with prices not recorded. The alternativeTo entries come from the compare page, which names Tolgee, Lokalise, Crowdin, Phrase and Transifex; Localazy and Weblate are recorded too; Tolgee, Phrase and Transifex had no fact files when checked. The compare page also names i18nexus, SimpleLocalize and Pontoon, which are not records. The pricing page says "Free plan available" (not a field) and lists plan user limits and a 1-user free plan; no prices recorded. Social links on the homepage that are not fields: YouTube (youtube.com/channel/UCPYQjBbbXojUcB8qjeIB3uA). The API docs page is a script shell with no limits text, so apiLimits is unknown.
