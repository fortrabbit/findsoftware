notes: >
  The record covers the Nhost platform in the nhost/nhost monorepo, the Nhost CLI and the Docker Compose self-hosting example. The monorepo holds 1,636 tags across packages (cli, auth, storage, constellation, functions, mcp, engine, postgres, dashboard and client SDKs); the install docs name the CLI, so currentMajor and latestReleaseDate follow the cli tags (cli@1.52.2, published 2026-10-26). The newest prerelease is mcp@0.4.0-beta2 (2026-11-03); latestPrereleaseDate follows it. The GitHub releases list starts 2022-02-15 and the oldest tag commit (@nhost/hasura-auth-js@0.1.11) is dated the same day, so firstRelease is 2022. The homepage says "Nhost is a fully managed, extensible backend platform" and the cloud is listed as "Production-ready infrastructure and security" beside the open-source components; the record keeps hostedOffering for the cloud and does not record cloud prices. The pricing page shows plan tiers named Starter, Pro, Team and Enterprise, with Free forever on Starter, and a Self Hosted tab; plan tiers are hosting tiers and no paidEdition is recorded. The self-hosting pages name a Community Edition (free, Docker Compose reference implementation), a Support Agreement and a Dedicated Cluster; the paid support options are not editions. Coined fields kept out of the fact file: SOC 2 Type II and HIPAA (coming soon) from the pricing page as compliance; "Regions 80+ CDN locations" from the homepage (not a data-region list, so regions is not recorded); Email and password, Magic Link, 2FA and Social OAuth providers from the pricing page as authentication methods; Realtime subscriptions and Event triggers as Hasura features. The Hasura GraphQL Engine is a component the README lists beside PostgreSQL ("Instant GraphQL API: Hasura"); that is a dependency, so basedOn is not recorded. The npm figure counts @nhost/cli, the package the README install section names, which wraps the CLI binary; the client SDK @nhost/nhost-js (the README quickstart package) had 15785 downloads for the same week and is a client library, so it is not recorded as a fact. WebAuthn / FIDO2 on the pricing page is a coined protocols field. The Dart and Flutter client lives in the nhost/nhost-dart repository and is not recorded. The Nhost Cloud and Self Hosted plans are both on the pricing page; prices are not recorded. The terms page names Nhost AB, established in Sweden and registered in the Stockholm commercial register; the website and the privacy policy give the same legal entity. The homepage links Twitter as twitter.com/nhost; the README links x.com/nhost. The README lists serverless functions (Node.js) beside the database and authentication, and the getting-started pages cover the CLI for local development.
