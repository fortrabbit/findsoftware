notes: >
  The GitHub releases/latest entry is create-vite@9.3.0, a sub-package, so the version comes from the npm latest tag (8.3.4, published 2026-10-08). The npm engines field reads "^20.19.0 || >=22.12.0"; the docs state the same minimum. The copyright line on the build page is the only maintainer statement found. npmWeeklyDownloads covers 2026-10-10 to 2026-10-16. The coined field latestVersion carries the npm latest tag.
