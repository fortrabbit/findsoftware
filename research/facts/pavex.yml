notes: >
  Stub: the README says "Pavex is currently in closed beta" and asks readers to sign up on pavex.dev for early access. Installation in docs/getting_started/index.md runs the CLI installer at https://pavex.dev/install.sh, which now redirects to the installer asset of GitHub release 0.2.10. The same page then asks for activation in Pavex's console (console.pavex.dev/wizard/install), which does not resolve (DNS failure on 2026-10-26), so whether a user can complete installation is the open question. What would settle it: a working activation route or a stated public install that does not need the console. Homepage: pavex.dev answers with a 301 to the GitHub repository for its root and for /docs/ and /docs/getting_started/, so the project's own site is gone and no homepage is recorded; the docs are read from the repository docs/ folder. The highest stable version is 0.2.10 on crates.io and GitHub, so currentMajor is 0. firstRelease is 2022 from the first crates.io upload of pavex (0.1.0, 2022-07-09), which is older than the first GitHub release (2024-01-12). The registry figure is the framework crate pavex (96132 total downloads); the pavex_cli crate, which works like a scaffolder, has 73196 total downloads and is left out of the fields. No rust-version is stated on crates.io or in Cargo.toml, so runtimeMin is unknown. The maintainer is the owner of the repository account, recorded from the GitHub profile name; no legal name or company appears on a page read.
