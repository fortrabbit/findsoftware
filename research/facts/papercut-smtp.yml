notes: >
  Desktop email receiver and SMTP server; the homepage calls it "for development" and the docs say the desktop app is both the SMTP server and the viewer, so runsAs local and the optional Windows service or Linux container (always-on) are both recorded. The project's MCP server for AI agents is documented on the service and MCP pages; it is an API for agents, not a site integration, and has no field. The LICENSE file has no copyright line. The Directory.Build.props copyright reads "Copyright © 2008 - 2025 Ken Robertson & Jaben Cargman"; the maintainer is the company the same file names as Company. The first tag RELEASE_V4.2.1 is dated by its commit (2014-10-12); the earliest GitHub release is RELEASE_V4.5 (2016-02-02). The 7.0.0-rc.1 prerelease (2024-10-19) is older than the latest release, so no latestPrereleaseDate. No runtimeMin is recorded: the software ships as an installer and container, and TargetFramework is a build requirement. The service serves a browser-based web UI on port 8080 and has no built-in authentication; the docs say to firewall it or put a reverse proxy with auth in front when it listens beyond localhost. Its rate-limit setting rejects mail with a 4xx or 5xx reply once a quota is reached, so an application can be tested against a throttling mail server. The service web UI is backed by an HTTP API (/api/messages) that the service page says can be scripted against; the MCP page calls it the REST API. The getting-started page lists Windows 10 or later and the WebView2 Runtime as requirements for the desktop app, an operating system requirement that has no runtimeMin value. The portable zip and the Windows service zip are separate install routes beside the installer.
