notes: "Easyweb is a hosted service: the CMS runs on Easyweb Cloud and the site states no installable CMS, so status is hosted-service (criterion 2 waived). The GitHub organization Easyweb-CMS holds a .NET starter template (Easyweb.site_.NET_Default-template) and a TypeScript article-list component; the getting-started doc describes the .NET template as a front end framework powered by .NET Core, and the NuGet package Easyweb.Site.Infrastructure is linked from the homepage. Neither is the CMS itself, so no repository field is recorded and the template is named in prose only. The terms of use on the integrity-policy page name Sphinxly AB (556682-6482) as the provider; the contact page gives a Stockholm address. The terms page says data is stored in Easyweb Cloud servers in Sweden, co-hosted with Binero. The REST API needs OAuth2 client credentials found in the Easyweb API menu. The pricing page is not linked from the pages read: the docs say business plans exist for commercial projects, so pricingPage is unknown. freeTier is a coined field. The homepage language links (sv, de, dk, fi, no) are versions of the project's own website and are not recorded as i18n of the CMS."
