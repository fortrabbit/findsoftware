notes: >
  The GitHub homepage field and the npm repository field point to hankchizljaw/modern-css-reset, which GitHub redirects to Andy-set-studio/modern-css-reset; the redirect target is the repository read here, archived per the API, last pushed 2023-09-26. The homepage field is a blog article by the author that describes the reset, not a project site, so no homepage is recorded. The README names a successor, "a more up to date one" at andy-bell.co.uk, which is no repository in this dataset, so successorOf is not set. The npm package has no GitHub release or tag; the npm latest 1.4.0 is dated 2021-01-18 and is the release date and major used. The npm weekly figure is the sum of the daily counts for 2026-10-18 to 2026-10-24. The README's manual route clones the repository and runs npm run build to produce dist.
