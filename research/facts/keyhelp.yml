notes: >
  No repository and no source code are named on the product page or the install page, so there is no sourcePublic statement and no repository field. The product page's section heading reads "KeyHelp & open source", but the same section says the panel is "made available to the public free of charge" and gives no license; the CSV row calls it proprietary. The license is recorded as the page words it, and licenseModel is left out: no open or commercial license statement was found, a reviewer decision. The install page names Ubuntu LTS or Debian, at least 2 GB RAM, a 64-bit system (amd64 or arm64) and a clean root install; the installer installs and configures all required services, and the page says there is no uninstaller. The product page states "KeyHelp runs on thousands of servers", which is not a count and is not recorded. The product page calls the basic version free of charge and says it is distributed "without licensing". The product page states that KeyHelp manages domains, email mailboxes, FTP users and MySQL databases, offers a REST API with documentation and a demo server; the REST API is not recorded as a field. The install page says the installer installs and configures all required services. The changelog viewer lists the newest entry 26.1.1 on 19 August 2026 and an unreleased 26.2.0; the release line is calendar-style (26.1), so no currentMajor is recorded. The CSV row gives 2026-07-20 from the product page, but the product page does not carry that date. The Keyweb homepage named in the CSV, www.keyhelp.de, redirects to the product page, which is recorded as homepage; the Keyweb product page is also the page for the free edition. Keyweb support is sold as a service and is not an edition. The Pro edition's features are listed on its own page; the page prices are not recorded here because they change more often than yearly. The installer's own service details (runtime, daemon, web server) are not stated on any page read, so runtime and runsAs are left out. The docs field is the project's own docs site, written in German and signed by Keyweb AG; the English tutorials page links the separate knowledge base kb.keyhelp.de for the manuals. The social fields are Keyweb AG's accounts linked from the KeyHelp product page footer. The docs say KeyHelp is a web-based control panel for Linux servers that manages web servers, email, databases and DNS.
