notes: >
  No source repository is named by the project's pages, and GitHub has no repository under the names jamroom/jamroom or jamroom/core, so repository and the GitHub adoption fields stay unknown. The distribution is a zip that the Open Source download link serves, which meets criterion 2 without a repository. The homepage footer shows "© 2003 - 2026" and the news says "20 years of Jamroom" in 2023, but no page names a first release year, so firstRelease stays unknown. The core release date is the Jamroom 7 announcement dated 08/06/23 on the homepage; the homepage also lists marketplace module updates in 2026, so the core and the modules have different dates. The license for the core is stated as MPL; the version comes from the link on the same page to the MPL 2.0 text. The homepage's "Jamroom Hosted" plans are a hosted option and the status stays accepted because the self-hosted download is available. The pricing and plan amounts are not recorded. The licensing page states that premium modules and skins are licensed on a per-site basis. The terms page names Talldude Networks, LLC as the operator of the site. The core announcement dates from 08/06/23 and the homepage lists marketplace module updates dated in 2026; the prose says only that the announced core release is older than some module updates.
