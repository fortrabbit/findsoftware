notes: >
  Also known as Varnish Cache: the project renamed itself, and this record is the continuing project. The repository on code.vinyl-cache.org is a Forgejo instance; its original_url points to github.com/varnishcache/varnish-cache, the predecessor repository the CSV row records, which is not a source for this record's facts. The Forgejo API lists stargazers only for code.vinyl-cache.org, so forgejoStargazers is a new field, not comparable with GitHub figures. Varnish Software distributes its own build under the varnish.org name; that is a separate record. Debian and Ubuntu packages were not provided as of 9.0 per the Debian install page, so installMethod lists only the source tarball and the BSD packages. The Association is described on the homepage as founded 2025-10-29; the bylaws state the project is a voluntary association under Danish law, which is the basis for hqCountry DK and maintainerType community. The LICENSE file copyright lines date from 2006; no firstRelease year is recorded, because the copyright range is not a release date. Coined fields: previousName, configLanguage, forgejoStargazers, topics.
