notes: >
  The repository has no project website; the README links the documentation on pkg.go.dev, so homepage is left out. The README's "A Call for Maintainers" section asks for people to maintain the package; it does not declare the project ended. The README says the package is "the default validator for the gin web framework", a statement about gin's use of this package; it is not a basedOn statement because validator is not built on gin. The README's license line reads "Distributed under MIT License", the same MIT license as the LICENSE file. The README's Maintainers section names Dean Karn as the person to contact about maintaining; the LICENSE copyright line gives the same name. The README states support for the two most recent major versions of Go and a minimum Go version that may rise in a minor release; the go.mod at v10.30.6 states go 1.26.0. The oldest tag is v1.0 (2015-03-01 commit); the first GitHub release is v1.0 on the same date. The repository owner is the go-playground organization. The dependent figures are for the module github.com/go-playground/validator/v10.
