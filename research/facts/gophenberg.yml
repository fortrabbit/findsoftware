notes: >
  Accepted. The gophenberg.org domain does not answer from the research host, and the GitHub repository names no homepage, so the documentation site docs.gophenberg.org, whose landing page is the product description, is recorded as homepage. The admin and theme kit use WordPress packages such as the Gutenberg editor as dependencies, which the license page states, so basedOn is left out. The project is below 1.0 according to its own pages, which is why currentMajor is 0. The README says the admin login cookie is marked secure, so the site needs HTTPS in front; the install guide repeats this. Two license statements are recorded: the source is Apache-2.0 under the README and the license page, and the built frontend artifacts bundle WordPress packages under GPL-2.0-or-later, which the license page says are conveyed under the GPLv3 terms. The install guide and the what-is page describe a read-only JSON content API at /api/content/v1, without authentication, which is not REST or GraphQL by the page's own words, so headlessApi is left out. The docs describe the admin login with session authentication and login rate limiting, with no single sign-on protocol, so sso is left out. The docs' editor preview switches device widths and is not a live preview of unsaved changes, so livePreview is left out. The docs name the media library, RSS plugin and Astro theme support; themes are Astro projects that read the JSON API, and the built-in renderer serves posts if a theme stops. The README Discord badge reads "join the chat" and links the project invite, recorded as discord. Translation runs on POEditor, which is not a field. Go is the runtime; the development instructions also name Node 26 for the frontend, which is not a runtime of the installed software. The GitHub stargazer and contributor counts are the API figures on the research date; the repository has no npm or other registry package. The i18n fact covers the admin interface language only (translation catalogues), the README line is the only statement. The cron page says scheduled jobs run after a request when due, or when a host cron sends POST /api/cron, and describes shared hosts that stop a quiet site, so the always-on value rests on the install guide's serve command alone. The install guide says migrations run at startup, that the account command takes admin, editor, author, member or a role a plugin declares, and that a SQLite file can be checked and migrated but not yet served from. The what-is page lists the public site at /, the admin at /admin and the JSON API at /api. The maintainer comes from the copyright line in the README license section. The what-is page says plugins are Go packages built into the binary, with their own routes and their own database tables. The README says the built-in renderer takes over whenever no theme is active or a theme is down, and the install guide puts a reverse proxy holding the HTTPS certificate in front of the site.
