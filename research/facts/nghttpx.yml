notes: >
  nghttpx is one program of the nghttp2 project, whose library is not a record here; the repository, stars and contributors are the project's shared figures, and the license covers the whole repository. The man page calls it "A reverse proxy for HTTP/3, HTTP/2, and HTTP/1", which is the basis for the category. The README names "long running server programs (nghttpd and nghttpx)" for jemalloc advice; that is the runsAs quote, and no page states a daemon flag. The GitHub language field is C++ for the repository; the record follows it. Releases: v1.70.0 (2026-07-29) is the highest stable release object, so currentMajor is 1; the minor line is not recorded. firstRelease is the oldest release object, v0.1.0 (2013-10-28); the repository was created in 2013-07. The maintainer is the copyright holder named in COPYING; the GitHub organization nghttp2 is the repository owner. The Docker and distribution packages are not recorded: the README and man page name no image, and no distribution package page was read. The README also describes building from a release tar archive, and the howto page describes signals sent to the nghttpx process for hot swapping and log re-opening; the --daemon option on the man page is not taken as a run-mode statement. The README announces a rewrite, nghttp2-v2, as a separate project; no successor field is recorded. Fields coined here: none.
