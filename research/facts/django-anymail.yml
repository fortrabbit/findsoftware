notes: >
  Boundary ruling applied (Frank, wave 57 rulings): accepted, because the project's own quickstart shows a Django project sending mail through it: the regular Django email functions send through the chosen ESP once the backend is set in settings. The project's README says the webhooks of each ESP connect to Django signals, which is the inbound wiring a site uses. The ESPs it names (Amazon SES, Brevo, Mailgun and others) are third-party hosted services that the library calls; Postal is named as a self-hosted ESP, and its own service is not part of this record. The PyPI packages name the mail backends as extras, for example pip install "django-anymail[mailgun]", and the quickstart shows that form. The latest stable release v15.2 is published on 2026-09-05; the PyPI 15.2 upload is the same day. The first release is version 0.1.dev1 of 2016-03-10, a development version tag, which sets firstRelease. The docs and README name Django 6.1 and 6.0 settings forms; those are not recorded as fields. The stars and contributors belong to the single package repository. The maintainer is the copyright holder named in the LICENSE line, Anymail Contributors, a project label with no legal form.
