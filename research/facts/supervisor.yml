notes: >
  The CSV homepage and the PyPI homepage use http://supervisord.org; that host answers only as a redirect to https://supervisord.org/, which answers 200, so the https address is recorded. Criterion 1 is a judgment: Supervisor is a general process manager, and its own pages tie it to web use only through FastCGI process groups ("Supervisor can manage groups of FastCGI processes that all listen on the same socket"), the status stays accepted under the area ruling. The project has no GitHub releases; the 4.3.0 tag commit date (2025-08-23, the same day as the PyPI upload) is the release date. The license is described in setup.py and LICENSES.txt as a BSD-like license from repoze.org; no SPDX identifier matches and GitHub reports NOASSERTION, so the value is recorded as stated. The PyPI author is Chris McDonough; the copyright holder named on the project's pages is Agendaless Consulting, so that is the maintainer. The repository is not archived and was last pushed 2025-12-21. Platform: the introduction page says Supervisor works on just about everything except Windows. Fields coined here: none.
