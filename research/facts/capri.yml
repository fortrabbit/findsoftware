notes: >
  The repository has no GitHub releases; the package named by the install docs is create-capri, a scaffolder, so the core package capri is used for the registry figures: npm latest is 6.1.1 (2026-04-08), currentMajor is 6, and the weekly downloads are 15 for the core package. The candidate row's "last release 2022" is out of date against the registry. The homepage's legal notice names Lionizers GmbH in Hamburg, and the LICENSE copyright line names Felix Gnass; the maintainer fact is the imprint, the legal notice of the project's own site, with its legal form. The LICENSE copyright line (Copyright (c) 2022 Felix Gnass) and the npm package author field name Felix Gnass, a second candidate for maintainer, kept here. The imprint does not say that Lionizers GmbH owns the project, so parent is unknown. The repository is a monorepo whose tags also cover vite-plugin-island; those tags are not counted. The README says the build runs Vite builds but does not name Vite as a parent, so Vite is not recorded in basedOn. The README does not state a Node.js requirement, so runtime is unknown. The "Copyright © 2022" footer on the homepage matches the LICENSE year.
