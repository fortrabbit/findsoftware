notes: >
  The homepage and docs answer 200 over http; the docs site is the project's own documentation, and its source is the gh-pages branch of the same repository. The GitHub releases list is empty, so currentMajor and latestReleaseDate come from npm: latest 1.2.5, published 2017-08-10. The repository was last pushed 2022-04-10, carries no archive flag, and no page states that the project has ended. GitHub reports the repository language as CSS because the project keeps stylesheets and no page names a programming language, so language is unknown. The docs describe a Gulp and AbsurdJS toolchain (gulp-based build, CSS preprocessors selected in TechyFile.js); this is prose material, not a fact field. The npm package depends on gulp 3.6.0, which the registry shows but no page states as a requirement, so it is not recorded. The docs describe pages that read and set values with set and get, call functions the project defines, and use a layout file that wraps the content; the homepage says a page is created by typing techy in a folder that holds Markdown files. The category cms is taken from the project's own wording ("Flat CMS"); the CSV's ssg category is not stated by any project page.
