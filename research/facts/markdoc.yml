notes: >
  Monorepo: the repository holds the core package @markdoc/markdoc (packages/markdoc) and the Next.js integration @markdoc/next.js (packages/next.js), so stars, contributors and the repository's release list belong to both. The newest GitHub release object is @markdoc/next.js 0.6.2 (2026-11-13), a different package; the core package's newest tag is v0.5.12 (2026-11-10), and npm holds 0.5.13 (2026-11-13) with no GitHub release object, so currentMajor and latestReleaseDate follow the core package across both registries. The npm weekly figure covers @markdoc/markdoc only and carries its period. The install page also gives yarn add @markdoc/markdoc; yarn and npm use the same registry, so one installMethod entry. The README says the public renderer types require @types/react and that the React runtime is optional; the renderers are coined kinds and stay here. The homepage names a Next.js plugin for a documentation site with zero boilerplate; that is the @markdoc/next.js package, not a basedOn statement. The npm manifest gives engines node >=14.7.0 for 0.5.13; the README names Node.js only in a TypeScript module setting for code run directly by Node.js and no page states a runtime for the library, so runtime and runtimeMin are left out; the manifest engines field is the only minimum. The npm package author is Ryan Paul; the LICENSE copyright line names Stripe, Inc., which is the maintainer. The homepage says Stripe created Markdoc to power its public docs. The GitHub social link on the homepage names a Stripe developer account on Twitter, recorded as x. hqCountry is not recorded: the Stripe consumer terms give a South San Francisco address without naming the country.
  The homepage lists custom tags and nodes, custom renderers and built-in validation as ways to extend or check content; the docs name the parse, transform and render steps, with Markdoc.renderers.html and Markdoc.renderers.react as renderers.
  Built-in validation is a homepage feature, recorded here as a coined kind.
