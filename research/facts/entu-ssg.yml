notes: >
  No homepage is recorded: the candidate row's ssg.entu.app does not resolve, and the repository names no homepage. The README is the documentation it was read from, including the npm install and build steps under "Installation and usage", which meet criterion 3. The repository is not archived and was last pushed 2026-05-12. The README marks the assets and server.assets options as deprecated in v5.6, and says the static output can be hosted on the user's own server, on Netlify or on S3. The npm package entu-ssg is the one the install steps name; its latest version is 5.6.15 (published 2025-04-07), and the GitHub release 5.6.14 is from 2024-04-09. The owner is the Entu organization, which GitHub lists in Tallinn, Estonia; no page names a legal entity or its country, so hqCountry is not recorded. The Node.js version is not stated in the README or package.json, so runtime is not recorded. The candidate row's 29 npm downloads a week is stale; the current week reads 25.
