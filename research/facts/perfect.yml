notes: >
  Stub: the project's own pages describe it as usable, but the signals disagree. The core repository's description on GitHub reads "Legacy Perfect - Server-side Swift", its README still describes Xcode 11 and the Swift 5 toolchain, and its default branch was last pushed 2024-02-03. The same organization ships Swift 6 rewrites under new names (Perfect-NIO, Perfect-Session, Perfect-CRUD, Perfect-SMTP), and the PerfectTemplate README says the pre-Swift-6 version lives on a legacy branch. None of the pages read names the core framework as replaced. What would settle it: a statement from PerfectlySoft on its own pages that the core framework is ended or succeeded by a named project, or a current release line of the core repository. Version: the releases API lists only v1.0.0 (2016-03-21), so currentMajor 4 comes from the highest stable tag 4.0.1 (commit date 2021-02-08 used as latestReleaseDate; no release object exists for it). Reviewer to decide whether the tag counts. The homepage perfect.org redirects from www.perfect.org over https and carries 2017-era content. The licensing page offers a commercial license for modified source kept confidential or for commercially sold products; recorded as a license statement, not as paidEdition. The README's Slack community link at perfect.ly is plain http, so no forum fact is recorded. The README says the project is divided into several repositories: the database connectors, the HTTP server and the Mustache package are separate repositories named in the core README. The highest stable tag 4.0.1 is a lightweight tag on the commit dated 2021-02-08; the only release object is v1.0.0. Maintainer's legal form not found on the pages read; the name is recorded as the project states it. hqCountry not found.
