notes: >
  The record covers the open source Meteroid platform and its hosted Meteroid Cloud. Meteroid is a simplified joint-stock company (SAS) registered in Lille, France, per the terms; the legal form stays in notes and the maintainer is recorded as the project names itself. The README badge calls the project "experimental", a status a reader should know, and it is not an end signal. GitHub lists v1.0.0-rc1 to v1.0.0-rc7 as non-prerelease releases; these are release candidates, so currentMajor is the highest stable tag, v0.19.0 (major 0), and the latest rc date is recorded as latestPrereleaseDate. The reviewer decides whether 1.0 becomes currentMajor when it is stable. The README's self-hosting section marks the Docker Compose setup as "minimal setup for testing/development", while the compare page calls Docker Compose and Helm self-hosting; the compose file starts Postgres, ClickHouse, Redpanda (a Kafka API), the API, scheduler, metering API and web app, so the record names only Postgres in databases, and the other stores are coined dependency facts kept here. The docs describe the integration with existing systems as "a simple API" (https://docs.meteroid.com/introduction/understanding-meteroid) and list an API Reference; its style is a coined kind and stays in notes. The compare page names Stripe Billing and Recurly, which have no record, so alternativeTo keeps only Chargebee. Stripe is the only payment provider the get-started docs name, which is a dependency kept in notes. The pricing page offers a free sandbox before going live; plan prices are not recorded, and the free sandbox is a coined freeTier fact. The terms state the free version is open-source and can be hosted by anyone, and that the project does not manage self-hosted instances or sell support for them. The YouTube channel is named on the homepage and has no field. The homepage's Discord, X and Reddit links are recorded as social facts without quotes. Stars and contributors are adoption figures recorded with their dates. The repository's language list also includes TypeScript for the web app; the record language is Rust, the backend.
