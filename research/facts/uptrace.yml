notes: >
  Uptrace stores telemetry in ClickHouse, which the install page requires at version 26.3 or later; it is recorded here only. The Datadog and Dynatrace compare pages name products with no record or no sentence quote, so only New Relic and Grafana are alternativeTo. The install page says Uptrace requires Redis for task queues, rate limits, distributed locks and query caching (the Helm chart includes a built-in Redis server); ClickHouse and Redis are not recorded as databases. The Kafka brokers are an Enterprise option (the editions page lists Kafka under Enterprise and the upgrade guide names Kafka brokers), not recorded as a field. The Community Edition is AGPL-3.0 per the repository; the paid tiers (Starter, Team, Business, Enterprise) are self-hosted editions sold under a license, and the binary checks license keys of its edition, so licenseModel is open-core. The Team and Business features that the Community column lacks are RBAC, alert routing, SSO (OIDC / SAML), audit logs and Kafka; the editions page lists them, so paidEdition holds. The pricing page's per-GB Uptrace Cloud plans are hosted plan tiers and are not recorded as paidEdition. Uptrace Cloud runs in Hetzner's Germany datacenters per the pricing page. The maintainer is the GitHub organization uptrace, since no page gives a legal entity; the terms page names "Uptrace.dev" as the company and the privacy policy names no entity, so no hqCountry is recorded; the footer says "Made with care in Moldova, shipped from Germany & Finland", which names no headquarters. The current major is 2: v2.0.3 is the highest stable release (2026-05-13), and the v2.1.0 line exists as beta and rc tags only (latest rc.2, 2026-10-22). The v1 line is not supported for in-place upgrade per the upgrade page; the v0.1.0 tag of 2021-12-25 is the first release. The telegram chat link (t.me/uptrace) and the Slack invite in the README are not fields. The README lists data ingestion using OpenTelemetry, Prometheus, Vector and FluentBit, which is the criterion 1 wiring. The 1,000+ active installations figure is a vendor claim on the pricing page and is recorded as stated. PostgreSQL stores users, projects, metric names and alerts, according to the install and configuration pages.
