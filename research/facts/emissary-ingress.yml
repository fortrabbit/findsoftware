notes: >
  Kubernetes-only controller, in scope as server software. The README says the project "was formerly known as Ambassador API Gateway"; no Ambassador record exists, so no successorOf is recorded. The README says the project is a CNCF Incubating project and that "at this point, Emissary's original parent company has stepped back from direct involvement in the project"; no parent is recorded because the company is no longer the owner. The homepage in the candidates CSV pointed to the company's product page; the project's own site emissary-ingress.dev is recorded. The GitHub language is Python by bytes (about 1.83 MB Python, 1.26 MB Go); the go.mod module is github.com/emissary-ingress/emissary/v3 with go 1.25.0, so the Go share is substantial, and a reviewer should decide whether language is Go. No runtime is recorded because the dictionary has no Go runtime and the controller ships as container images. The docs at emissary-ingress.dev/docs/4.0 are the v4.0 line; the install page links Helm and YAML install guides that are separate pages and were not fetched. No dockerPulls figure is recorded: the install docs name only the registry namespace docker.io/emissaryingress/ and no image, and the Docker Hub emissaryingress/emissary record was last updated 2025-04-03. The oldest GitHub release is 0.35.3 from 2018; the repository was created in 2017, so firstRelease follows the release list. Releases v4.0.0 and v4.1.0 are the v4 line, and the frozen v3.10 and v2.5 branches are not an end signal. Stars and contributors come from the default branch repo. The README names the CNCF Slack channel as the community space, and no X, Discord or other social link is recorded. Fields coined here: none.
