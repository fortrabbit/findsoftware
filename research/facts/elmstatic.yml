notes: >
  The repository has no GitHub releases; its tags stop at v0.7.3, and the npm latest tag is 0.7.3 (2021-08-25), so currentMajor is 0 from the registry fallback. The npm package names "Alex Korban" as author and the GPL-3.0 text has no copyright line, so the maintainer comes from the package author field. The project page shows an output directory of HTML files that is published to a host of your choice, and a test server run on that directory; runsAs rests on those sentences. The runtime value elm is not in the dictionary and the import drops it. Feed generation (RSS per tag and per subsection) and Highlight.js syntax highlighting are described on the page and are not recorded as fields. The GitHub repository was last pushed 2022-06-23 and the npm package was last published 2021-08-25; no page states that the project has ended.
