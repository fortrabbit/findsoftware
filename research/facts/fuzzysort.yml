notes: >
  No homepage or docs site: the GitHub homepage field points to the test and demo page farzher.github.io/fuzzysort/test/test.html, which is a demo and not the project's site, and the README is the only documentation. The repository has 30 tags and no GitHub release object; the registry's stable version 4.0.2 (2026-08-13) is the current major, as the rule for a repository without releases says. The tag list and npm agree on 4.0.2. firstRelease follows npm 0.0.0 on 2017-08-18, the same day the repository was created. The maintainer is the copyright holder in the LICENSE file; the GitHub account farzher carries a different display name and is not used. The npm weekly figure is the sum of the range 2026-10-19 to 2026-10-25; the API returns zero for 19 to 21 October. The README gives a browser script-tag install, but no page states a run mode, so runsAs is not recorded. The README names no runtime beyond JavaScript.
