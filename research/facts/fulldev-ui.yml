notes: >
  Monorepo: the repository holds the Astro components, the React extension and the Shopify Liquid package, and the npm package fulldev-ui holds a versioned copy of the Astro registry, while installs fetch from https://ui.full.dev/r (the shadcn CLI reads the @fulldev registry URL), so npmWeeklyDownloads counts downloads of the archive package, not installs. Its GitHub releases are tagged fulldev-ui@<version>; the newest is fulldev-ui@0.26.0 (2026-10-26), which is also the npm latest, so currentMajor is 0. The repository also carries v0.x tags for another package, which are not used. The npm weekly figure is the sum of the 2026-10-18 to 2026-10-24 daily counts. The maintainer is the copyright holder in the repository's LICENCE file, "Fulldev, Sil Veltman"; the company's terms page gives the company name Fulldev with a Groningen address and a Dutch VAT ID, which sets hqCountry. The README lists a Node.js prerequisite, which is a build requirement of an Astro project, so no runtime is recorded. The docs installation page reads "Installation for Astro" and names the shadcn CLI. The repository was created 2024-01-08 and the npm package was created 2024-05-28, so firstRelease is 2024 on both.
