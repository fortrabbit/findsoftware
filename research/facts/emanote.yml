notes: >
  The GitHub API reports the license as NOASSERTION because the repository mixes licenses; the README names AGPL-3.0-or-later as the default and lists CC0-1.0 OR AGPL-3.0-or-later for default/index.yaml and default/templates, CC0-1.0 for the logo, Apache-2.0 for Stork search, and MIT for Tailwind CSS and Heroicons, which are recorded only as the README states them. The README is at emanote/README.md in the repository. The Hackage page names Sridhar Ratnakumar as author and copyright holder and lists AGPL-3.0-only, which differs from the README's AGPL-3.0-or-later, so both are recorded. The homepage and the getting-started page show a sidebar label "Emanote 2.0.0.0" with no matching GitHub release; the highest stable GitHub release is 1.4.0.0 (2025-08-19), so currentMajor is 1 under AGENTS.md, and Hackage lists no 2.x either, so the 2.0.0.0 label is not treated as a release. The install page says the nixpkgs package is out-of-date and that the author is prohibited from updating it, and advises against it; the warning is not recorded as a field. The repository's first stable release is 0.8.0.0 (2022-11-03). Hackage lists emanote 1.4.0.0, but the install docs name only Nix, so no hackageName is recorded. The getting-started page links an emanote-template repository that includes a GitHub Pages workflow for static site deployment.
