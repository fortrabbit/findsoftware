notes: >
  The repository is a monorepo of packages (renderer, layout, font, render, types and others); its stars and contributors belong to the monorepo, and the registry figures come from @react-pdf/renderer, the package the install line names. The newest GitHub release in the repository is @react-pdf/ui 1.0.0, a different package, so currentMajor and latestReleaseDate follow the renderer package: the registry's latest is 4.9.0, released 2026-08-27. The npm name "react-pdf" belongs to another project, wojtekmaj/react-pdf, which displays existing PDFs; this README says so under "Lost?" and no record is made for it. The project's own site title is "react-pdf", which is the name recorded. Runtime is node because the homepage names both the browser and Node; no runsAs is recorded under the rule for libraries that name both. The homepage says the same document renders to a file, a stream or a blob. The compatibility page says react-pdf is tested against Node.js 18, 20 and 21 and recommends those versions, which is a tested range and not a stated minimum, so runtimeMin is left out. The compatibility page also gives React 16.8 to 19 support, a peer range that is not a field. The LICENSE copyright line names Diego Muracciole as an individual; the README repeats the name.
