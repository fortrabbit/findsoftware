notes: >
  Accepted: the npm packages easy-email-core, easy-email-editor and easy-email-extensions are installed by the README's Getting Started command and form one editor (a monorepo; the figure is for easy-email-core, the first package the install command names). The editor, extensions and core packages each show about the same weekly figure, so the core figure stands for the set. The GitHub repository zalify/easy-email-editor is the one the npm repository field and the GitHub API name (the npm field reads zalify/easy-email); stars and contributors belong to that monorepo. The CSV discovery figures (3.0k stars, 5.2k a week) are stale; the API gives 2988 stars and the npm total above. Install route: the README and easy-email-core's usage section show npm and yarn commands only, with no sentence naming the route, so installMethod is not recorded. Runtime and runsAs: the README's "Browser Compatibility" row says "Only supports Chrome" and the Pro row says "Compatible with various browsers"; a browser support list is not a statement of where the code runs, so no runtime or runsAs is recorded. The packages declare React 18 as a peer dependency; peer dependencies are not basedOn. The GitHub description says "based on React and MJML"; MJML has no record, so only react is basedOn. The README names MJML as the base for output and says the editor "can generate code through drag-and-drop editing"; the homepage meta description says "MJML email building". The homepage is a JavaScript shell; its meta description, read from the raw HTML, is the quote. Maintainer doubt: the LICENSE file names no copyright holder. The GitHub organization zalify is recorded because nothing else names an open-source maintainer. Its profile links zalify.com, whose footer reads "Zalify Inc."; that page is a Shopify growth agency and no page of this project names Zalify Inc. Easy Email Pro is published by Beicas Internet Studio, Shenzhen (terms page, contact ryan@beacas.com), and its About page says Pro "grew from the Easy-Email open-source project". Reviewer decides which entity is the maintainer; hqCountry is left out until that is settled. Easy Email Pro is a paid self-hosted SDK; the README's comparison table gives the open-source versus Pro features (browser support, React 19, responsive design, AMP blocks, Unlayer migration, file manager, technical support). The Pro homepage says it is "a self-hosted React email editor SDK" and its pricing is on a section anchor (#pricing) of the same page, so no pricingPage is recorded. MJML is the output format of the editor and is not recorded as a templating field.
