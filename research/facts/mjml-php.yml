notes: >
  The CSV homepage is a freek.dev blog post, not the project's own site, so no homepage is recorded; the repository README is the only project page. The LICENSE copyright line reads "spatie <freek@spatie.be>". The maintainer is recorded as SPATIE BVBA, the legal name the spatie.be disclaimer gives for the site and its open source work; a reviewer decides whether the LICENSE name "spatie" should stand instead, since both name the same company. The composer.json author is Freek Van der Herten, recorded in no field. The README says the package finds the node executable itself and that the MJML_NODE_PATH environment variable sets its path when it cannot, and it describes toHtml() as returning the converted HTML and convert() as returning the HTML with an errors() list for MJML's non-fatal errors. The README says the mjml JavaScript package must be installed on the server and asks for Node 16 or higher; the README says the package converts MJML and that the JavaScript mjml package must be installed, which is a dependency and no statement that the package wraps or extends MJML, so basedOn is absent (mjml has its own record, and the README's link to MJML sits in the sentence defining MJML); the Node requirement stays in the runtime fact but not in runtimeMin, because runtimeMin takes the manifest at the latest release tag. The README's Sidecar section names a companion package, spatie/mjml-sidecar, that deploys the conversion as a Lambda function through Sidecar in Laravel projects; Laravel is a deployment target there and not a parent, so no basedOn. The Packagist total is the figure the registry gave on 2026-11-16; the monthly figure in the same response was 220946 and is not recorded. The contributors count comes from the last page number of the contributors endpoint.
