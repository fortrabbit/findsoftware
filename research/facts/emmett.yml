notes: >
  The README and installation page say Python 3.9 or higher; the pyproject.toml of the 2.8.2 release and the PyPI metadata say requires-python >=3.10. Both are recorded as separate runtimeMin entries, the PyPI one first, and the docs and registry disagree. The docs site emmett.sh/docs renders with JavaScript and its pages were not read there; the docs were read from the docs folder of the repository. The included server is Granian, named in the deployment page; it is not recorded as a field. Auth creates AuthGroup and AuthPermission tables (auth.md); no userRoles fact is recorded because the docs do not name roles. The PyPI download figure is the last_month value from pypistats.org. The README says Emmett is released under the BSD License, with the contents of the validators and libs folders included under their original licenses. The license is BSD-3-Clause in pyproject.toml and LICENSE, with the copyright line in LICENSE naming Giovanni Barillari. The first GitHub release is v0.1.7 (2014-12-18).
