notes: >
  The CSV homepage http://engineer.readthedocs.org/ redirects to the https documentation root, so the https address is recorded. The docs say Engineer requires Python 2.7+ and has not been tested on Python 3; the runtimeMin value follows that statement. The PyPI JSON carries no download figures, so pypiDownloads is not recorded. The repository has no GitHub release, but tags up to v0.5.2 exist and PyPI lists 0.5.2 as the latest release, dated 2017-05-26. The documentation states 0.5.1 as the current release, which predates PyPI's 0.5.2. The first PyPI upload is 0.2.3, dated 2012-05-07. Emma, the optional management site, has a page that reads "Coming soon", so no adminUi is recorded. The docs say Engineer is not a CMS and that its content is stored in text files. The deployment page names FTP, rsync, Azure and GitHub Pages as ways to publish the output. The contributor count is the page count of the contributors endpoint at per_page=1.
