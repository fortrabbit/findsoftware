notes: >
  The maintainer is the mosparo Association (homepage: "mosparo is a project of the mosparo Association"), a non-profit in Switzerland; the legal notice names it with an address in Mellingen, which gives hqCountry CH. The LICENSE copyright line names "mosparo Core Developers and contributors", recorded here instead of as the maintainer. The license is MIT from the LICENSE file and the README; composer.json at v1.5.13 says "license": "proprietary", a package-manifest wording that is not a license statement and is not recorded. The embed is a script tag and CSS link from the mosparo installation (build/mosparo-frontend.js), with the form data verified by the site backend through API client libraries for Java, JavaScript, .NET, PHP and Python from the core developers, and a community library for Go (gosparo); the documentation lists plugins for CMSs and frameworks (Contao, Django, Drupal, Flarum, Kirby, Symfony, TYPO3, WordPress and others). Coined kinds in notes: embedMethod, verification client libraries, privacyClaims (README: only form data, IP address and user agent are used; data deleted after 14 days; homepage: no cookies needed). Docker Hub pulls for mosparo/mosparo were 86168 on 2026-11-03 (hub.docker.com/v2/repositories/mosparo/mosparo/); the compose file names mosparo/mosparo:latest-alpine. The Docker page requires a MySQL or PostgreSQL database in a container or elsewhere. The CLI page says the database cleanup also runs automatically every 6 hours when a form is loaded, and the cron jobs page recommends cron jobs or a web cron job, hence scheduled beside per-request. The Docker Compose file runs a second container with MOSPARO_ENABLE_CRON=1. A Kubero template is maintained by a third party. The captcha category is not recorded because the project's own pages describe it as spam protection that replaces captcha methods. Requirements: a domain you own, an SSL certificate and 100 MB disk space.
