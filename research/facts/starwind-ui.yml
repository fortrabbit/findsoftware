notes: >
  The README labels the Vue and Svelte adapters as beta. The README describes a shared, framework-neutral Runtime that the Astro, React, Vue and Svelte adapters sit on, and the homepage says "The source lands in your project and stays yours." The npm figure and runtime come from the starwind package, the CLI the install commands run (npx starwind@latest), whose repository is packages/cli; the @starwind-ui adapter packages (Vue and Svelte are betas) are not counted. The starwind.dev legal pages (terms, privacy, imprint, legal) answer 404, so no legal name or country is recorded beyond the LICENSE copyright line. Starwind Pro, sold at pro.starwind.dev as a one-time purchase of premium Astro blocks, is recorded as paidEdition; the free blocks need no account. The starwind CLI package engines field (Node 22) is a tooling requirement and is not recorded as runtime. The starwind.dev homepage footer names the Twitter link and the Discord link; the README badge links an X account, the same one. The "Starwind/shadcn-style ergonomics" phrase in the README is not recorded as basedOn. basedOn lists Astro first, the framework the README calls the project's first target; React, Vue and Svelte are the other adapters the README names.
