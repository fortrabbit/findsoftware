notes: >
  Discontinued on the author's own statement: the README opens its "Important" section with "I don't have any time available to keep maintaining this package", and the same section says pull requests are merged "from time to time" with "no commitment on timelines". No release has been published since 2022 on npm. The repository's homepage field is the http address leandrowd.github.io/react-responsive-carousel, which redirects to react-responsive-carousel.js.org; the https address of that site answers and is the homepage recorded, and the README's Storybook link is the http form of the same site. The reviewer should confirm that a stated lack of time, with pull requests still merged, counts as an end signal under criterion 4; if not, the status is stub. The GitHub release v3.2.7 (2020) is the newest release object; the tag v4.0.0 points at a 2020 commit, has no release object and was never published to npm, so currentMajor is 3. The LICENSE.md file carries the unfilled template line "Copyright (c) [year] [fullname]", so the maintainer comes from the package.json author field, which the import reads before the GitHub owner. The README links no documentation site beyond the demo and Storybook, so docs is not recorded. The npm downloads are for the package the install line names.
