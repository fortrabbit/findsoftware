notes: >
  Stub on a criterion 4 doubt: the developer guide says "Amazon CloudSearch is no longer available to new customers. Existing customers of Amazon CloudSearch can continue to use the service as usual.", so a new user cannot adopt it, while the AWS Big Data Blog post on moving to Amazon OpenSearch Service states that "AWS continues to support CloudSearch and continues to invest in security and availability improvements." The record returns to hosted-service if AWS reopens the service to new customers or a reviewer rules that continued support for existing customers keeps it listed; an AWS end-of-life statement makes it discontinued. The blog names OpenSearch Service as the recommended successor, which is no end signal on its own. The FAQ states IAM integration, which is access control for AWS accounts and is not recorded as sso or userRoles. The pricing page states a free trial offer for new customers; that is not recorded as freeTier, and no prices are recorded. The FAQ lists 2011-02-01 and 2013-01-01 API versions; the record covers the service, not an API version. The developer guide's limits page holds quotas that are not recorded as apiLimits. The AWS terms name Amazon Web Services, Inc. at a Seattle, WA address for the AWS Site, which the record uses as the legal name and country. No repository is recorded: the service is closed source and the candidates row has no repository. The httpArchiveSites figure is not recorded because the HTTP Archive technology list has no entry for CloudSearch. The social links are the AWS-wide links on the product page, not links specific to CloudSearch. The FAQ regions list gives the regions as its own text; the regions field is filled from that sentence and the list is not a statement of data residency.
