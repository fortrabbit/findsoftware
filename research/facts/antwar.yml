notes: >
  webpack is the build tool here, not a parent, so basedOn leaves it out. The repository is archived on GitHub (archived: true, last push 2022-02-11), and the README opens with "Antwar has been superseded by Gustwind", which is recorded as the discontinued signal; the replacement named is Gustwind. The homepage still serves the software and its docs. Gustwind was not read, so its page is not cited. The npm latest dist-tag is 0.29.5-alpha.0 (published 2018-11-27), a prerelease, so currentMajor and latestReleaseDate use the highest stable tag v0.29.4 (2018-11-27). The first version on npm, 0.0.2, is dated 2015-03-01, matching the LICENSE copyright year; the repository has no GitHub releases to take firstRelease from. The npm package antwar is the install target in the getting-started page. The getting-started page shows the build script as "node ./antwar.bootstrap.js build"; the bootstrap file is the user's own script, so it is cited as runtime use of Node only.
