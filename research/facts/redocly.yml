notes: >
  The GitHub releases are tagged per package; the highest stable release of the redoc package is redoc@3.0.1 (2026-10-14), so currentMajor is 3. The v2.5.3 release (2026-05-29) is the previous line and the README points to its own branch. The redoc npm package has no deprecation flag. The LICENSE names two copyright holders: Rebilly, Inc. (2015-present) and Redocly Inc. (2021-present); maintainer is recorded as the Redocly line. The README calls Redoc "Redocly's community-edition product"; its paid hosted product is recorded as paidEdition from the README's list of additional features. Hosting plans (Realm and Reunite) are not recorded as an edition. The telemetry field is coined here; the README states the collection and the opt-out attributes. The README says the CLI build writes a redoc-static.html file, which is the basis of runsAs static. firstRelease is the npm created time of the redoc package.
