notes: >
  The README shows a builder API for content, encoding, error correction, size, margin, a logo and a label, a writer per output format with its own options, and a validation reader that is off by default because it affects performance. No homepage: the README and composer.json name no project site (composer.json homepage is the repository; the GitHub repository's website field also shows endroid.nl; the README byline links endroid.nl, the maintainer's own dashboard page with no mention of the library), so the project is repository-only. The criteria hold from the README, the composer.json at the tag and Packagist. Maintainer: the LICENSE copyright line names Jeroen van den Enden, the composer.json author of the same name; the GitHub profile names an employer, which is not a statement about this library, so no company is recorded. The README is a PHP library with a Symfony bundle in a separate repository (endroid/qr-code-bundle) that adds configuration, multiple configurations, generation routes and Twig functions; the bundle is part of the same project family and is not recorded as a plugin. Output writers named in the README are PNG, WebP, SVG, EPS and binary; these are output formats and are kept here, not in fields. Image writers need the PHP GD extension, and the validation reader and PDF writer need optional packages named in composer.json; these are requirements, not runtime minimums. The sponsor page and a coffee link on the README are not social fields. Latest tag 6.2.0 has no GitHub release object; its Packagist version time equals the tag commit time. The Packagist total is the stats endpoint figure read on 2026-11-08; the monthly figure is read from the same endpoint.
