notes: >
  The Malibu front-end framework (@quintype/framework and related packages, documented at developers.quintype.com/malibu/) is a client of the hosted platform and is not recorded, since hosted-service records take nothing from SDK or client repositories.
  The about page names Quintype Technologies Inc. as headquartered in New York, so maintainer and hqCountry follow it. The terms name Quintype Technologies India Private Limited as the contracting entity and are governed by Indian law; that entity is not recorded as maintainer. The homepage footer carries both Quintype Technologies Inc. and Quintype Technologies India Ltd. copyright lines.
  The developer pages carry a copyright line for 2014 to 2019 and the homepage a 2025 line; neither is a release date, so firstRelease stays unknown.
  The homepage links X (twitter.com/quintype_inc), Facebook, Instagram, LinkedIn and YouTube; only X is recorded because the starter list has no field for the others.
  The product page lists SSO Integration under the commenting and engagement features and the developer docs name Single Sign-On with OAuth 2.0 for Malibu; neither says which SSO protocol the CMS users get, so sso stays unknown.
  The developer docs offer "React + Node.js" as the front-end stack, which is a client choice and not recorded as runtime. The homepage footer lists comparison pages against WordPress, Drupal, Blox Digital and Naviga, recorded as alternativeTo.
