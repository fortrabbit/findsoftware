notes: >
  Status stub, criterion 1 in doubt: the homepage leads with "The one complete suite for AI-first customer support", a helpdesk and shared inbox (a finished application under criterion 1), while the chat widget a site embeds is the site part; a reviewer's decision that the widget meets criterion 1 would move the record to hosted-service. The hosted-service facts below stay. The Crisp SDK repositories (github.com/crisp-im, the Web Chat SDK on client.crisp.chat/l.js) are not a data source for this record. Attachment to a site: the Web Chat SDK "can be installed in a few lines of codes on every website" (docs Web Chat SDK) and the widget is loaded by a script (client.crisp.chat/l.js), recorded here as a note and not as a field. Features on the pricing page not recorded as fields: Developer APIs, Web Hooks Reference, Double-Factor Authentication (hardware-backed TOTP, security practices), GDPR compliance statements, EU-hosted data option on the pricing feature list, Mobile Apps and Desktop Apps. Single sign-on, SAML, OIDC, SCIM and roles are not named on the pricing, security or developer pages read; sso and userRoles are not recorded. The docs Developer Hub says "Build apps for 400k+ Crisp users"; it is a developer-facing figure and is kept here as a note, not as reportedInstalls. The homepage says "Trusted by 10,000 companies of all sizes"; the pricing page says "Trusted by 10,000 companies worldwide" and that is the recorded figure. The privacy page names the DPO address dpo@crisp.chat, not recorded. The legal name and country come from the terms of use notice address. Pricing plans carry prices in euros or dollars on the pricing page; no prices are recorded, and the plan names Free, Mini, Essentials, Plus and Enterprise are recorded only in notes. The regions value is quoted from the security practices page; the statement of messaging and plugin servers is that page's, and the same page states encryption and access controls that are not recorded.
