notes: >
  Repository only: the GitHub homepage field is empty and no project site was found, so no homepage is recorded. The releases are tags only, with the v0.7.0 tag of 2018-07-25 matching the Hex release of the same date; the highest stable release is 0.7.0, major 0. The last push to master is 2019-09-09 and the README and CHANGELOG carry no statement that the project has ended, so the status stays accepted; the reviewer may want to decide whether a 2018 release is stale. The v0.7.0 mix.exs requires Elixir 1.4 and master requires 1.6; no runtimeMin is recorded because an Elixir version is not a BEAM runtime minimum and the README states no OTP version. The README describes route macros for each HTTP method and a handler that can return a body, a status code, a JSON-encodable object or a redirect. The README gives no deployment guide and no database, so runsAs rests on the README's configuration of a port to listen on for incoming HTTP requests, and renderingModes on its template rendering inside route handlers; the README also describes a devserver started with mix trot.server. The README has no mention of a mix hex dependency; install is from GitHub. The Hex package hexDownloads figure is the all-time total. The docs link is the Hex documentation build of v0.7.0.
