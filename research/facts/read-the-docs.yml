notes: >
  The readthedocs.org address answers with a 302 to app.readthedocs.org, the hosted application, so the homepage is recorded as the company site about.readthedocs.com, which names readthedocs.org as the Community site. The Community site is free for open-source projects and the Business site (readthedocs.com) carries the paid plans; the sso, regions and pricingPage facts describe the plans on the pricing page, and no prices are recorded. The version is calendar based (2026.10.21), so no major applies and currentMajor is not recorded. firstRelease 2010 is the year the company page gives for hosting open source documentation; the GitHub releases only begin in 2025. The repository README and the company page say the service is open source at its core, and the install guide is a development setup that the guide itself says is not for production. The privacy policy names the United States as where data is stored and processed, not a headquarters, and the terms of service choose the laws of the State of Oregon, which is not recorded as hqCountry. The docs do not state a database, rate limit or role model that could be quoted, so those stay out. The pricing page lists SSO for GitHub and GitLab (Basic and Advanced), Google (Pro), and SAML (Enterprise).
