notes: >
  The project has no homepage beyond its GitHub repository, so homepage is absent. The README lists the module's distribution as npmjs.com, jsr.io, jsdelivr.com and github.com; npm, JSR and the jsDelivr CDN are each recorded as an installMethod from the same README sentence; github.com is the repository. The README says jose has no dependencies and exports tree-shakeable ESM. The README's CommonJS footnote names Node.js ranges where require of ES modules is enabled; it is a condition for CommonJS use, not a stated minimum, so runtimeMin is left out. The README says some algorithms are not available in every runtime and links one issue per runtime for the list; those issues were not read. The README lists JWT signing and verification, encrypted JWTs, JWS, JWE, key import, export and generation, and JWK thumbprints. firstRelease is 2019 from the oldest GitHub release (v0.9.0, 2019-03-02): the npm package named jose has earlier versions from another project's repository (autoit4you/node-jose), and the first npm upload from this repository is 1.9.2 in 2019. The npm figure counts the jose package named in the install route. Stars and contributors belong to the single repository.
