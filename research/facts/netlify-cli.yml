notes: >
  Netlify CLI is the open-source command-line client of the Netlify hosting platform; the platform itself is hosted and no prices are recorded. The reference page at cli.netlify.com also lists commands that provision and use hosted services (a Postgres database command, agent tasks, Netlify Blobs), so the CLI reaches hosted services for those commands. The get-started guide on docs.netlify.com says Node.js 18.14.0 or later, while the README and package.json at v27.15.0 say 22.13.0 or above; runtimeMin follows the manifest at the latest release tag, and the guide is older text. The docs page says it is for the Netlify CLI and does not show a runsAs value of its own; local comes from the README's statement about running the site locally and from the CLI reference's "Local dev server" and "Build on your local machine" entries. The oldest GitHub release is v1.2.3 (2018-07-10); the repository was created in 2014 and the npm package in 2014, and the oldest release is taken as firstRelease. The privacy statement names Netlify, Inc. as the company behind the software and gives the San Francisco address. The GitHub organization netlify is the repository owner; the LICENSE copyright line names "Netlify <team@netlify.com>". The social and forum links come from the homepage navigation links and carry no quote. The Homebrew formula is listed in the README, but Homebrew installs are not recorded.
