notes: >
  The npm package and the README both state AGPL-3.0 (the README as "GNU Affero General Public License 3.0 (AGPL 3.0)"), one license in two wordings, so one entry. The README also says "For other licenses contact us" (mailto contact@keymetrics.io); that offers other terms without naming a license, so it is not recorded as a license value. The maintainer is KEYMETRICS, a French SAS company, named in the terms of use and privacy policy PDFs (pm2.keymetrics.io/assets/terms_conditions.pdf and /assets/privacy_policy.pdf); the facts taken from the terms PDF carry no quote because quote checks cannot read PDFs; the HTML pages state "© 2014-2026 PM2" without a legal name. The package author in package.json is an individual, Strzelewicz Alexandre, and the npm maintainer list names tknew; the company is the operator the terms name. The README's official site is pm2.keymetrics.io; the CSV's pm2.io is also operated by KEYMETRICS per the terms, and is not used as the homepage. The npm figure comes from the pm2 package, which the install docs name; the weekly sum covers 2026-10-19 to 2026-10-25. PM2 Plus is a separate SaaS dashboard with a monthly plan and an on-premise option; it is recorded as hostedOffering, not paidEdition. PM2 Enterprise is recorded as paidEdition from the pricing page, which lists advanced optimization and profiling features beside the open source runtime with a contact-us price; a reviewer may decide whether an enterprise sales tier counts as an edition. The Docker example in the README is a Dockerfile snippet, not an install route, so installMethod has no docker entry. The changelog and README name no first release; firstRelease 2013 is the year of the first npm upload (2013-06-08) and the GitHub repository creation (2013-05-21). The only prerelease in the GitHub releases list is 4.0.0-rc1 from 2019, older than the latest release, so latestPrereleaseDate is absent. Fields coined here: none.
