notes: >
  Stub: no install step exists in the README, the hexdocs readme or the hexdocs API reference; the Hex package (build tool mix, requiring Elixir >= 1.0.0, an Elixir version and no OTP minimum, so runtimeMin is not recorded) is the only installable form, and that is a registry statement rather than an install step the project gives. What would settle it: an installation section on the project's own pages, or a statement that the Hex package is the supported install. Homepage: the CSV homepage http://hexdocs.pm/placid/ redirects with 308 to https://placid.hexdocs.pm/, which is the Hex documentation the project publishes rather than a site of its own; no homepage is recorded and the docs field points at the hexdocs readme. The repository was last pushed 2026-05-08; the README's TODO list is open and its text describes the toolkit's planned behavior in places. Versions: Hex lists 0.1.0 (2014-09-14) through 0.3.0 (2017-01-25); GitHub tags run v0.1.0 to v0.2.0 (2016-10-08), with no tag for 0.3.0, so currentMajor 0 and latestReleaseDate 2017-01-25 come from the registry's stable version. firstRelease is the first Hex upload year. hexDownloads is the all-time figure the Hex API reports. The README's Internationalization section only says i18n should be considered and that a dependency exists, so no i18n fact is recorded. Plug is named as the basis in the repository description on GitHub, not in the README, and is recorded as basedOn on that statement.
