notes: >
  The record covers the server part of the Uppy monorepo (transloadit/uppy, MIT). Versions, release date, npm name and download figure follow the @uppy/companion package, not the monorepo's Uppy client releases (uppy@6.0.5 and later are client tags). The candidates row's npm figure of 47.9k a week is older; the range endpoint sum for 2026-10-26 to 2026-11-01 is 84,049 and is the figure recorded. The monorepo has 31,057 GitHub stars and 434 contributors on 2026-11-03; they are Uppy's and not recorded as facts. firstRelease is 2016 from the oldest tag in the repository, v0.0.2, whose commit is dated 2016-03-07; the @uppy/companion tags start at 0.14.0 on 2018-08-11, the date of its first npm version. The docs say "Companion 7 is built on Express 5", and the brief rules that basedOn stays empty for the monorepo member; the Uppy and Express relations are recorded here. Maintainer: the transloadit.com imprint says Transloadit is a service operated by Transloadit-II GmbH, Waßmannsdorfer Chaussee 39 A, 12355 Berlin, Germany; the LICENSE copyright line reads "Copyright (c) 2019 Transloadit (https://transloadit.com)" and the uppy.io footer reads "Transloadit". The docs state that a hosted Companion needs a Transloadit plan, that Google Drive does not work on the hosted service with the shared OAuth app, that several instances coordinate over Redis, and that Windows is not a supported platform. The Kubernetes guide in the package folder (KUBERNETES.md) runs the project's Docker container with a Redis dependency. The docs navigation links a forum at community.transloadit.com, which is Transloadit's forum. Companion's own pages say files are never stored in Companion, so no contentStore is recorded. The homepage names no social account on the uppy.io pages read, so no social field is recorded. The Uppy Companion label in the candidates row is the working name; the README title is Companion. The docs describe two modes, a standalone server configured through environment variables and Express middleware mounted in an existing application, and say the Uppy client requests remote files from Companion, which downloads them and uploads them at the same time.
