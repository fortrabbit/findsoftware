notes: The record covers the hosted Datadog service. The Datadog Agent (github.com/DataDog/datadog-agent, Apache-2.0) is open source and runs on hosts, and the agent docs say "The Datadog Agent is open source and its source code is available on GitHub". The agent sends data to the hosted service and does not run it, so no repository, license or selfHostOption is recorded for the service. The SDK repository github.com/DataDog/browser-sdk (Apache-2.0) and npm @datadog/browser-rum go to notes only, per the hosted rule. The docs state that each Datadog site is completely independent and data cannot be shared across sites. The pricing page lists plan tiers without a paid edition record and offers a free trial; no free tier is stated on the pages read. The legal name comes from the subscription agreement, which names Datadog, Inc. as a Delaware corporation and refers to its New York, New York, USA headquarters; the privacy policy gives the New York address. The feature flag product is described as OpenFeature compatible on its docs page. The pricing page states usage units such as hosts, gigabytes ingested and million flag configuration requests. Session Replay and Real User Monitoring are product lines of the same service; the homepage names them, and only the three categories with quotes are recorded. The fields installMethod (agent packages, SDK installation through npm) and firstRelease (founding and product dates are not a release date) are not recorded. The site footer links LinkedIn (linkedin.com/company/datadog), not recorded as a field.
