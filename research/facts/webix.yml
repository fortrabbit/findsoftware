notes: >
  The homepage link http://webix.com redirects to https://webix.com/, so the https form is the homepage. The docs installation URL returns 404; the getting-started page holds the CDN and the homepage FAQ holds the npm route. The npm package license field reads "SEE LICENSE IN license.text", a wording that differs from the repository's license.txt (GPL-3.0); the file is not in the repository, so the wording is noted here only. The commercial license is a paid license with no price in this file; the price on the licenses page is not recorded. Standard (free, GPLv3) and PRO (paid, commercial) share the one product, with the PRO packs holding the enterprise and complex widgets. The LinkedIn showcase link (linkedin.com/showcase/10607867) has no field in the dictionary and is left out. The GitHub organization profile names Minsk, Belarus; no page of the project states a country, so hqCountry is unknown. No GitHub release exists, so firstRelease is the oldest tag (1.1.0, 2013-10-18) and latestReleaseDate is the npm publish date of 11.4.0; the npm package starts at 3.3.0 in 2016. httpArchiveSites is the mobile origin count, the figure adoption.mjs records. The contributor count is read from the Link header of the contributors endpoint without anon, per_page=1.
