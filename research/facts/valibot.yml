notes: >
  Monorepo: open-circle/valibot holds the valibot package in library/, with the codemod, the website and other packages beside it. Stars and contributors belong to the monorepo, and the contributor count (207, anonymous excluded) counts everyone who contributed to it. The npm and JSR figures are for the valibot package named by the install page. The latest release of that package is v1.5.0 (2026-09-09); a release named "v1.3.0 (i18n)" for a translations package is newer by date and is not counted for this package. The first release is v0.1.0 from 2023, the same year the npm package was created. The install page names the runtimes Node, Bun and Deno; the README says the library has no dependencies and can run in any JavaScript environment, which adds no runtime. The install page states a TypeScript minimum (5.0.2) and an ES2020 target: build requirements, not a runtime minimum, so runtimeMin stays out. The Zod migration guide calls the codemod beta; the codemod is recorded as the importsFrom route. The alternativeTo quote is the migration guide's first sentence, which names switching from Zod. The contact and privacy pages name the project and its contributors and give no legal entity or country, so hqCountry is absent. The contact page says the project is non-commercial and relies on sponsors; no paid edition is named. The migration guides from Yup, Joi, TypeBox, class-validator, Superstruct and io-ts each describe moving to Valibot and are recorded as alternativeTo; only the Zod guide offers an import tool. Migration from Zod is also the subject of a blog post linked on the comparison page. The i18n guide describes translated error messages through the @valibot/i18n package. The JSR API lists runtimeCompat for browser, deno, node, workerd and bun; browser is a runsAs value, not a runtime, and no page states where Valibot runs, so only the install page runtimes are recorded. The comparison page benchmarks runtime performance against Zod, Typia and TypeBox, which sets the typia alternativeTo entry. The deno.land/x URL import is a third install route beside npm and JSR; jsrName is @valibot/valibot. The Discord link comes from the README badge and the homepage. ecosyste.ms returns 0 dependent packages and 3 dependent repositories for a package with tens of millions of weekly npm downloads, which is not a usable count, so neither is recorded. The library README (library/README.md) says a schema describes a structured data set, can be compared to a TypeScript type definition, can be executed at runtime to guarantee the type of unknown data, and yields its static type through type inference, that a bundler can drop unused functions because each function is a separate import, and that the functions are small single-task units; the homepage carries the bundle-size claims, which are not recorded. The migration guide describes a pipeline as a function that starts with a schema and is followed by validation or transformation actions.
