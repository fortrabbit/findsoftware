notes: >
  Status stays accepted. The README's "MINI3 it the successor of MINI" sits under the heading "Forks of MINI", was added in 2016, and the same README was updated afterwards (2020) to say MINI works with PHP 7.x and should work with PHP 8.0; it does not say MINI has ended, is unmaintained or is replaced, so no end signal applies. succeededBy is coined here and records the README's statement; fields.yml has no field for it. The README also says "MINI is the successor of php-mvc", recorded as successorOf. The README states the MIT License; the repository has no LICENSE file, so GitHub reports none. The repository has no release and was last pushed 2022-09-17 (api pushed_at). The README also names forks TINY and MINI2 (built with Slim); those get no field. It has no tagged release, so currentMajor, latestReleaseDate and runtimeMin are unknown; the README's "PHP 5.3.0+ (when first released)" is not a minimum for a release. Installation is manual (edit the config, import the SQL, enable mod_rewrite), with a Vagrant variant; no installMethod value fits. The Packagist package panique/mini has no tagged version and the README does not tell users to install it; its figure is kept as found. The repository has no homepage. The README says "MINI is NOT a professional framework", which the record does not repeat. Databases are from the README requirements list ("MySQL"). The README says the code "uses only native PHP code" and "uses PDO for any database requests", which is the basis of the description, with its "clean URLs" claim.
