notes: >
  Stable release line: the highest stable GitHub release is 1.11 (2026-01-13), and the README says the project is currently in version 1.11. The homepage is the site the README names for the current information about the project, which now describes Orchard Core; it is recorded as the project's own site under that statement. The README names Orchard Core as the new generation for new projects and for maintaining projects built on Orchard 1; the successor direction is recorded on orchard-core as successorOf, so this record carries no successor field. The LICENSE file names the .NET Foundation as copyright holder for 2014 and Outercurve Foundation for 2009; the README says the project is delivered under the .NET Foundation, and that is the maintainer. Two license statements are recorded: the API's BSD-3-Clause and the README's New BSD license, which are the same license in two names. The GitHub tags from 1.0 to 1.8.1 carry commit dates of the repository import, and the earliest dated release note the docs hold is for 1.4, published 2012-02-29 with 1.4.1 and 1.4.2 updates; no page read states the first release, so firstRelease is absent. The installation page of the 1.x docs (tested with 1.8) lists four install routes, a built-in database by default with SQL Server or SQL Server Express as the alternative, and ASP.NET 4.5 with IIS as minimum requirements, which is not recorded as runtimeMin because it names ASP.NET and not a .NET Framework version. The GitHub README says Orchard 1 is in development since 2009, a development start rather than a release, so it is not used for firstRelease.
