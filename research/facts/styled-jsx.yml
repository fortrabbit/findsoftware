notes: >
  No project site exists: the vercel.app address answers 404 and the CSV homepage is the npm page, so the repository readme is the documentation and no homepage is recorded. The readme says "Code and docs are for v3", while the newest stable GitHub release and npm latest are 5.1.7 (2025-04-30); currentMajor follows the release, and the reviewer should confirm the readme's v3 line is stale. The readme says styled-jsx transpiles CSS "as an alternative to CSS-in-JS", so categories is css-processor, not the css-in-js value on the candidate row. basedOn React is not recorded: the readme shows React only in examples and FAQ answers, and the npm peer dependency on react is a dependency, not a statement of parent. Next.js configures styled-jsx itself (readme "Using in Next.js"), and server-side rendering is compatibility, so neither goes to renderingModes. The first GitHub release 0.0.1 is dated 2016-12-05, the same day as the npm first version. The npm engines field of the latest version says node >= 12.0.0; for a CSS package that is compatibility, so no runtime is recorded. The contributor count is the page number of the last link across all pages with anon=false. The author accounts linked in the readme are personal and not recorded as project social fields.
