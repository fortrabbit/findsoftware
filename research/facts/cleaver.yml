notes: |
  The homepage shows Version 1.5.7 while the latest GitHub release and the Packagist version are v1.6.4; no version is recorded. The GitHub release v1.6.4 is dated 2022-08-28 and the Packagist version time for v1.6.4 is 2022-01-26; latestReleaseDate follows the releases API. The README says PHP 7.3 or higher and the composer.json of v1.6.4 says >=7.2.5; runtimeMin follows composer.json. Blade comes from the aschmelyun/laravel-blade package in composer.json; the project does not state that it is built on Laravel, so basedOn is not recorded. The repository's last push is 2023-09-09. No end-of-life or abandonment signal found on GitHub, Packagist or the homepage. The Packagist monthly figure is recorded with the total as the source gives both.
