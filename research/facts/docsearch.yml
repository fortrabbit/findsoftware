notes: >
  Accepted as the CSV row says, on the reviewer's call that the frontend packages are installable MIT code while the index exists only on Algolia's servers. A reviewer may decide hosted-service instead: the crawler and index have no self-hosted option, and the frontend packages need an Algolia app ID and search key. Install docs name @docsearch/js (core package, badge in the README) and @docsearch/react; only @docsearch/js figures are recorded. npmWeeklyDownloads is the sum of the daily counts for 2026-10-19 to 2026-10-25 (0 on the first three days, so the sum equals the four days with downloads). The npm latest tag is 5.1.2; the GitHub release named v4.7.1 (flagged latest on GitHub) is the legacy v4 line, not the package the install docs name. firstRelease is the npm registry creation date of the predecessor package docsearch.js (time.created 2015-12-16), published from the same repository. hqCountry comes from the legal notice address in the terms page ("Palo Alto, CA ... United States"); no page says "headquarters" in those words, so a reviewer may want to confirm. The docs say the frontend packages are built on Algolia Autocomplete, which has its own record, so basedOn is algolia-autocomplete. The docs page lists Discord and Twitter links and states the program is free for eligible documentation sites; no price is recorded. The docs page carries the x link as twitter.com/docsearch_. The docs say sites apply to the program and are approved before indexing. The crawler is a separate repository, algolia/docsearch-scraper, not read for this record; the repository named in the README covers the frontend and the website.
