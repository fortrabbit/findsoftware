notes: >
  Status accepted per the CSV row. Rust is the language, and fields.yml lists no rust runtime, so no runtime is recorded; the README calls a source build primarily useful for developing on Oxipng, and runtimeMin is the Rust version for that build. No homepage: the GitHub homepage field is empty and the README names no project website; the repository is the only project site. The README's "Software using Oxipng" list names ImageOptim, Squoosh and others, which are not recorded as they are not the project's own pages. The crate figure is the total download count of crates.io (2280776); the same API reports 597857 recent downloads over 90 days, which is not recorded as the figure. The npm package named oxipng (version 1.0.1) is a separate JavaScript port by another author and is not the project's package, so no npm figure is recorded. The README states the minimum Rust version as 1.85.1, while the Cargo.toml at the v10.2.1 tag and the crates.io record state 1.88.0; runtimeMin follows the manifest at the latest release tag. The first GitHub release is v0.1.0 from 2016-03-03. Docker, the Windows download and the Repology package list are installation routes the README names; pre-commit hook use is a git integration and is not an installMethod. The maintainer is the copyright holder named in the LICENSE; the crates.io owner list names two more users, not recorded. The README's MANUAL.txt is a second docs link; not recorded as docs because the docs.rs page is the library reference.
