notes: >
  The npm package named codedoc is an unrelated 0.0.0 package from 2012 by another author, so it is not used. The install docs name @codedoc/cli, so its registry figures are recorded; @codedoc/core (37 downloads in the same week) is the library the CLI config imports and is not recorded. The repository has no GitHub releases or tags, so currentMajor comes from the npm latest of @codedoc/cli (0.3.0). The docs page for the CLI is the only docs page read; the codedoc.cc docs index was not fetched.
