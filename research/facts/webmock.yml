notes: >
  The repository has no homepage of its own; the GitHub homepage field is empty and the README links only the repository, so no homepage is recorded. Status accepted: the newest stable release is v3.34.0 (2026-10-14), the repository is not archived, and the README names no end. The first gem version, 0.7.0, was uploaded on 2009-11-20 and the repository was created on 2009-11-06, so firstRelease is 2009. The maintainer is the copyright holder named by the LICENSE; the README's acknowledgement of a New Bamboo hack day names no legal entity. The README's supported HTTP libraries (Net::HTTP, Excon, HTTPClient, Typhoeus and others) and the test frameworks it names are integrations, not runsAs or alternativeTo statements. The README names VCR as a companion for recording and replaying HTTP traffic; that is a use together, not an alternative. The README lists MRI 2.6 through 4.0 and JRuby as supported interpreters, and the gemspec at v3.34.0 requires Ruby 2.6 or later, so runtimeMin is the gemspec value. The RubyGems API does not state the gem's required Ruby version, so the gemspec at the release tag is the source. The rubygems figure is the total on the rubygems.org API. No sentence states where the library runs, so no runsAs is recorded. The README's Background section says the library was inspired by FakeWeb and imported some solutions and code from it; that is no fork or basedOn statement, and FakeWeb has no record here. The README's Suggestions section points to the webmock-users Google Group mailing list, recorded as forum.
  The README's feature list says WebMock stubs HTTP requests at the low HTTP client library level, so tests need no change when the HTTP library changes, and it lists support for RSpec, MiniTest and Test::Unit. The README's install section gives gem install webmock, or a gem line in a Gemfile's test group.
