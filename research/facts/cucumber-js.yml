notes: >
  Status stays accepted: the repository is not archived, the latest release is v13.3.0 (2026-10-05) and the last push is 2026-11-03. The install page says the old, deprecated cucumber package should not be used; that package is a different npm name, so it is no end signal for @cucumber/cucumber. The LICENSE copyright line names Julien Biezemans and contributors; the homepage footer names "The Cucumber Open Source Project", which is the project's own name for itself and no legal entity, so the maintainer is the LICENSE line (a reviewer may prefer the project name). The runtimeMin comes from the engines field of the latest npm release ("22 || 24 || >=26"), so the minimum Node major is 22. The docs describe a test run without saying where it runs, so no runsAs is recorded. Plugins and formatters are documented but none is a basedOn statement. The community links come from the cucumber.io community page, which serves the Cucumber project across its implementations; the newsletter is the Buttondown subscribe form on that page. Stars and contributors belong to the cucumber-js repository.
