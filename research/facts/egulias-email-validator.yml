notes: >
  Repository-only project: the README names no site, so homepage is absent; the README is the docs. The default branch is 4.x and the latest GitHub release is 4.0.4 (2025-03-20), which matches the Packagist latest; the Packagist package is egulias/email-validator, and the Packagist total download count is 822644639 (the candidate row's 802.8M figure is older). firstRelease is the year of the first Packagist version, 1.0.0 on 2013-05-19, the same day the repository was created. The Packagist metadata of 4.0.4 requires php >=8.1, the same as the README requirements list, which names PHP 8.1 and Composer. The maintainer follows the LICENSE copyright line, Eduardo Gulias Davis; the Packagist maintainer is the handle egulias. The README says the library "is a port from another library and work" and credits Dominic Sayers' isemail function and two later contributors; a port is not a basedOn statement, so none is recorded. The README's supported versions table marks v3.x and older as end of life and v4.x as supported; the EOL is a per-version statement, not an end signal for the project. Spoof checking and DNS checking need the PHP Intl extension, stated in the requirements section. The README says it aims to support RFC 5321, 5322, 6530, 6531, 6532 and 1035; no field holds RFC lists. The Packagist monthly figure (26638576 at check time) is not recorded: the total is the figure the registry gives as the all-time count. The README's license line says MIT License; the composer.json license is MIT. The README lists the validation strategies: RFCValidation, NoRFCWarningsValidation, DNSCheckValidation (which checks for mail-server DNS records and does not show that the mailbox exists), MultipleValidationWithAnd, MessageIDValidation, and the SpoofCheckValidation extra. The README says developers can implement their own validation by implementing the EmailValidation interface.
