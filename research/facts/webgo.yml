notes: >
  The homepage is the project's GitHub Pages site naughtygopher.github.io/webgo, which answers over https and carries the README text; it is not a separate product site. The first release is the oldest GitHub release, v1.0 (2017-03-29); the repository was created in 2015 and its tags start before the releases list, so firstRelease follows the release list. The highest stable release is v7.1.2 (2026-10-20); the go.mod module path is github.com/naughtygopher/webgo/v7, so the major is 7. The README has no install command and names no Go version; installMethod is the module import path the repository's sample (cmd/main.go) and go.mod use, and runtimeMin is the go directive in go.mod. The README badge for the license links a different repository's LICENSE; the repository LICENSE file is the one recorded. The README does not name a parent project; the Go Reference link in the README is the docs source. The maintainer is named as "Naughty Gopher" in the LICENSE copyright line and the owner is an organization on GitHub; the owner's profile lists Germany as the location, which is not recorded as hqCountry. Contributors are counted on the last page of the contributors endpoint with per_page=1. adminUi and pluginDirectory are not recorded: the README names neither. The module has no download figure and no npm name, as Go modules publish none.
