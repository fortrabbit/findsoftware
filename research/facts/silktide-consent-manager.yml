notes: >
  Accepted on criterion 1 (a consent banner for websites, which is a service added to a site), 2 (MIT source in the repository, with a self-host download) and 3 (the install page's HTML and script steps). The attachment is a stylesheet and a script loaded in the page head, then an init call with consent types; the install page says "The CSS and JS load from jsDelivr CDN" and offers a download of the bundle to self-host, so the two install routes are cdn and download. The jsDelivr URLs pin v2.0.1, the install page's version. The README states that the banner is "A free, lightweight and customizable consent manager for websites, designed to help you comply with GDPR and other privacy regulations"; the GDPR and ePrivacy claims stay in the README and homepage text and are a coined kind, not a field. The homepage's Google Consent Mode v2 and Google Tag Manager integration, the stcm_consent_update dataLayer event and the consent records kept in the browser are coined kinds and stay here. The homepage says the software sends nothing to Silktide: "Each choice is stored in the visitor's browser and nothing is sent to us". Silktide's "Silktide Analytics" integration is named in the README and is a separate product, not recorded. The hosted Silktide platform (governance, accessibility, SEO tools) is a separate paid product that the homepage calls "a paid product" and is not an edition of this code, so paidEdition is not recorded. The homepage's "Free forever" and "No hidden fees" statements are the vendor's words on price and are not recorded. The maintainer is the company named in the LICENSE copyright line. The legal entities on the contact page are Silktide Inc. (Austin, TX, USA), Silktide Ltd (Birmingham, UK), Silktide ApS (Denmark) and Silktide Pty Ltd (Australia), and the contact page names Austin as the Headquarters; the hqCountry US follows that headquarters statement, and the reviewer should confirm that the Inc. entity is the one that publishes this repository. The homepage links X, Facebook and YouTube pages, recorded as facts; the LinkedIn page (https://www.linkedin.com/company/silktide/) is a coined field and stays in these notes. The repository has two tags, v2.0.0 and v2.0.1, both on a commit dated 2026-05-19, and no GitHub release; the release dates come from the project's change log (v1.0 2025-01-28, v2.0 2025-12-03, v2.0.1 2026-07-02). The README and install page do not name an npm package, so no npm figure is recorded. The runtime is the browser only: no page states it, so runsAs is not-found. The MIT license is the same statement in the LICENSE file and the README. The README's "Accessibility" feature and the event callbacks are product features and are not recorded. The README's automatic script injection loads third-party scripts when consent is granted and reloads the page when consent is revoked; that is how the banner works and is stated in the notes, not as a field.
