notes: >
  The GitHub release v1.0.3 (2025-02-03) is the newest GitHub release, but the npm registry's latest is 1.2.2 (2026-02-25) with no GitHub release; the registry is newer, so latestReleaseDate is the npm date. Both the registry and GitHub put the major at 1. The oldest npm upload (0.0.1, 2016-12-28) is older than the oldest GitHub tag (v0.6.0, 2022-01-17), so firstRelease is 2016. The README says "ERPNext uses Frappe Gantt" and that the component "started off as a component for ERPNext" on the homepage; no basedOn is set because a sentence saying where it is used names no parent. The homepage's "zero dependencies" is a feature and not a field. The repository has one package, so stars and contributors belong to it. The README key features say the library can exclude weekends and other holidays from task progress calculation. The npm figure covers frappe-gantt, the package the install docs name. The docs link is the README, since frappe.io/gantt/docs answers 404. The Frappe footer social links (X and Instagram) are the company's, shown on the Gantt page. The LICENSE copyright line names Frappe Technologies Pvt. Ltd.; the privacy notice on docs.frappe.io names the same company and "Frappe is located in India". No runtime or runsAs is recorded: no page says the library runs in the browser.
