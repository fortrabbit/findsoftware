notes: >
  The repository has no GitHub releases; its tags are per package, so currentMajor and latestReleaseDate come from the npm package that the README names, @fluentui/svg-icons, whose latest version is 1.1.344. The install docs name four registries: npm, Maven Central (com.microsoft.design:fluent-system-icons, recorded as mavenCoordinates), CocoaPods (the pod FluentIcons, not recorded as a field) and pub.dev (fluentui_system_icons, recorded as pubName). The Maven Central metadata lists 1.1.315 as latest and pub.dev lists 1.1.273 with a 2025 publish date, both behind the 1.1.344 in the README; the record does not choose between them. The first release year comes from the earliest CocoaPods trunk entry, 1.1.10 on 2020-06-02, which is older than the npm package's first version. The CSV listed 372.3k weekly npm downloads; the 2026-10-18 to 2026-10-24 range for @fluentui/svg-icons is 60358 and the record uses it. GitHub reports the repository language as HTML and the package ships plain SVG files, neither of which is a language value the register holds, so language is left out. The SVG package README marks the color style as deprecated and says it may be removed in a future release. The license is MIT in the LICENSE file and the package.json. The repository has no paid edition, pricing or community channel on its README. The SVG README lists regular, filled and color styles and sizes from 16 to 48, and the README says the Android and iOS libraries are generated by an importer from the assets directory.
