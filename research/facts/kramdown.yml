notes: >
  The homepage is served over https; the CSV row's http address redirects to the same site. The GitHub releases page lists only REL_1_4_0 and REL_1_5_0 (2014) as release objects, while the tags run to REL_2_6_1; the registry's stable version 2.6.1 is the newest release and sets currentMajor to 2 and latestReleaseDate to the RubyGems upload date (2026-11-16). The license before the 1.0.0 release was GPL, which the README states; that older license is in notes only. The README and the docs say the library reads kramdown, Markdown, GFM and HTML and writes HTML, kramdown, LaTeX and PDF through Prawn; these are kinds of output that no field holds. The installation page says the only dependency is Ruby 2.5 or later, matching the Rakefile's required_ruby_version at tag REL_2_6_1. The sponsor line names GROSSWEBER, a consultancy, and patron and donation links; they are not recorded. The GitHub API's license field is NOASSERTION, so the license entries come from the README and COPYING. The RubyGems download figure is the total over all versions, with no period beyond that. The oldest RubyGems upload, 0.1.0 of 2009-11-21, sets firstRelease. hqCountry comes from the legal notice of Thomas Leitner's own website, which the kramdown homepage footer links.
  The RubyGems metadata for 2.6.1 lists rexml as a runtime dependency, although the installation page says "There are no other dependencies" beyond Ruby; the page is not taken as stating the gem's dependencies. The tests page benchmarks kramdown against Maruku, BlueFeather, BlueCloth, RDiscount and Redcarpet as other Ruby Markdown implementations; only Redcarpet has a candidate row, so alternativeTo holds redcarpet and the others stay here. The documentation page says the library uses basically the same API as RedCloth, BlueCloth and Maruku, and that a binary called kramdown ships with the library to convert files on the command line; no runsAs is recorded, since the library runs inside whatever Ruby program calls it.
  The README asks commercial users to contribute changes back or become a sponsor, and it names GROSSWEBER as a consultancy sponsor.
