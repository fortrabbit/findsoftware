notes: >
  Components package is the one the install page names; the global styles package (@cloudscape-design/global-styles) is installed alongside it and is not counted. Maintainer is Amazon Web Services, Inc. from the site footer; the LICENSE file carries no copyright line. hqCountry US comes from the address on the AWS site terms (Seattle, WA), not from a line that says "United States". Homepage says the system "was built for and is used by Amazon Web Services (AWS)"; no installs figure is stated. The GitHub release list starts at 3.0.116 (2022-11-15) and the npm first version is 3.0.0 (2022). Contributors counts accounts from the API list with per_page=1 without anonymous accounts, read from the Link header.
  The install guide imports each component from its own path and states that Cloudscape only supports React. The homepage says the components are built with React, which is recorded as basedOn.
