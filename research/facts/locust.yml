notes: >
  Boundary ruling for this wave: load-testing tools are accepted as testing libraries, so the CSV boundary is settled as accepted with category testing. The homepage is locust.io, which answers 200 with Locust's own site; the GitHub and PyPI homepage field and the site's navigation name locust.cloud, a GitHub Pages site that renders an empty JavaScript shell. The docs changelog (2.43.0) says "Remove references to locust.cloud now that it is shutting down", so Locust Cloud is no hostedOffering, and the homepage line that Locust.cloud provides commercial support is not recorded. The hosted load testing page of the docs describes Azure Load Testing, a Microsoft-managed service that runs Locust tests in the cloud, and says Microsoft sponsors the maintenance of Locust; it is a third-party hosted service, so it is named here and not recorded as hostedOffering. The LICENSE copyright line names three holders (Carl Byström, Jonatan Heyman, Lars Holmberg); the README names Lars Holmberg as maintainer and Jonatan Heyman as original creator, so the maintainer is the README's named maintainer. The docs say the official Docker image is at locustio/locust on the running-in-Docker page, which is the Docker route and its own installMethod; the installation page does not name the image, so no dockerPulls figure is recorded. The installation page also lists uvx as an alternative, and the Kubernetes Operator page installs an operator with Helm; neither has a sentence of its own to quote. The running-without-web-ui page says a single instance runs in headless mode as part of a CI/CD pipeline, which is the runsAs local statement; no page describes a server process model. The first GitHub tag is v0.4 from 2011-12-05, older than the first PyPI upload (1.0 on 2020-05-16), so firstRelease uses GitHub. The pypistats recent endpoint reports a rolling last-week figure, not a dated one; the recorded figure is the dated sum of the without-mirrors category for 2026-11-01 to 2026-11-07. The README links a StackOverflow tag and a Medium blog and the Discord server, and only the Discord link is the project's own chat. The README's extension links point to third-party plugin repositories and the project wiki, so no pluginDirectory is recorded. The requires_python value in the PyPI metadata is 3.11 or later, and it is recorded as runtimeMin from that registry field. The README says scenarios are regular Python where loops, conditions and calculations use ordinary constructs; that tests run from the command line or the web UI, which shows throughput, response times and errors in real time and can export them; that the tool primarily works with web sites and services; that other systems are tested by writing a client; and that load can be distributed over multiple machines.
