notes: >
  Repo-only: no project site is named, and the repository's homepage field is empty. No license: the GitHub API reports none, there is no LICENSE file on the default branch, and composer.json has no license key, so license stays out. The README says the bundle is not yet production ready: its checklist lists testing with more real-life projects, a Symfony Flex recipe and copying assets to the dist folder as still missing. Criterion 4 is not triggered: the repository is not archived and the README declares no end, but the last push and release are from August 2018. Criterion 5 is weak: 11 GitHub stars, one contributor, 151 Packagist downloads in total and 2 in the last month; the threshold is open, so the reviewer decides whether these figures are a public adoption figure enough. The README's install is for Symfony 4, and composer.json requires symfony ^4.1 packages, so the bundle targets that Symfony line; no PHP minimum is stated. The README says the dump command covers static routes (routes without mandatory placeholders) through a built-in request provider; dynamic routes need a custom request provider. The maintainer is the composer.json author; runtime and a local runsAs are not recorded because no page states them.
