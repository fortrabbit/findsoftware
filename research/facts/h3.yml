notes: >
  The guide title says "You are currently reading H3 v2 docs. See v1.h3.dev for legacy docs." The 2.x line is the current major on npm. The latest GitHub release (v2.0.8) and npm latest both date from 2026-10-22; the newest pre-release on npm (2.0.1-rc.33, 2026-10-03) predates it, so no latestPrereleaseDate is recorded. The guide names Cloudflare Workers as a runtime with the words "other runtimes such as Cloudflare Workers". The LICENSE copyright line names an individual; the repository owner is the h3js organization, and no page gives a legal entity. The npm engines field declares ">=20.19.0", recorded as the major 20. The homepage and guide name no company behind the project.
  The guide describes an H3 app as a class that matches routes and generates responses, and shows app.fetch for running the same app in any web-compatible runtime.
