notes: >
  The homepage is the project's own site at zope.dev; the CSV row names zope.readthedocs.io, which is recorded as docs. The installation page's supported Python list (3.10 to 3.15) belongs to the development docs; the latest PyPI release requires Python 3.11 or newer, which is recorded as runtimeMin. The GitHub license field reads NOASSERTION, and the LICENSE file and the README both state ZPL 2.1, so each is its own license entry. Zope has no GitHub releases; the highest stable tag is 6.3, the same version as the PyPI latest, which gives currentMajor and latestReleaseDate. The maintainer is the Plone Foundation, which zope.dev's community page names as copyright holder; the same page says the Zope Foundation passed its responsibilities to the Plone Foundation in 2018. The Zope Book (written for Zope 2) still names the Zope Foundation as copyright holder, a line not used here. The pypiDownloads figure is pypistats last_month for the zope package. The object database (ZODB) is the content store; ZODB is not a value of the databases vocabulary, so databases is absent.
