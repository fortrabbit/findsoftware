notes: >
  The homepage https://www.iviewui.com/ and its install guide return 200 with a page that only asks the reader to enable JavaScript, so no homepage is recorded and the docs link from the README stands as the docs fact. The repository's README says the original iView author maintains this repository under the new name ViewUI, and the latest release is v4.7.0 from 2021-11-19 (npm agrees); no release or pre-release in four years, so the import moves the record to stub. The GitHub API reports the license as NOASSERTION; the LICENSE file says MIT, and npm says MIT too. The npm package named view-ui is a different project with a handful of downloads; the install docs name view-design. The README lists Vue.js 2.x and Vue.js 1.x support, SSR support, Nuxt and Electron as compatibility statements, recorded here only as notes. The README names View UI Pro and View UI Admin Pro as ecosystem links; their pages are JavaScript shells, so no paidEdition fact is recorded. The README links a Gitter chat and a StackOverflow tag, which the field list does not cover. The GitHub profile for view-design lists a location in Beijing; no page states the headquarters country, so hqCountry is unknown. The GitHub contributors count is 159 pages at one per page. httpArchiveSites: no technology entry in the HTTP Archive list matches ViewUI.
