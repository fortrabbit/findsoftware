notes: >
  The homepage names two products: Flamingo (this record) and Flamingo Commerce, which the README lists under its ecosystem as a separate repository (i-love-flamingo/flamingo-commerce) and which the homepage presents as built on Flamingo Core; that repository has no record here. The README's Gophers Slack channel and mailing address have no field. The homepage's Twitter link points to the AOE People account, not to a project account, so no x value is recorded. The README names Dingo for dependency injection and describes the module concept as "based on Dingo"; no basedOn is recorded because the README does not name Dingo as the framework the project is built on. The docs pages for localization and gotemplate answer 404 on master, so the README's feature list is the source for i18n and templating. The go.mod directive at the v3.17.5 tag reads go 1.26.0, but no docs page states a minimum Go version (the Getting Started page still says "Go >= 1.13"), so runtimeMin is left out. The docs site docs.flamingo.me is the documentation the README names. firstRelease is the oldest tag v2.0.0 (2018-06-18); the repository was created 2019-04-02.
