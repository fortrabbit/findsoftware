notes: >
  Accepted from the boundary row: a web app or site wires into Kestra through a webhook trigger, an HTTP API and official SDKs. Webhook trigger: "A Webhook trigger generates a unique URL that lets external applications (such as GitHub, Amazon EventBridge, or any system that can send HTTP requests) start new executions in Kestra", and each webhook URL requires a secret key (kestra.io/docs/workflow-components/triggers/webhook-trigger). The SDK page lists Java, Python, JavaScript/TypeScript and Go. Maintainer: the privacy policy names "Kestra Technologies" with a French address. The about page names two headquarters, "Kestra Technologies Inc." (United States) and "Kestra Technologies SAS" (France), so no hqCountry is recorded. The LICENSE file carries no copyright line. The requirements table lists "Runtime JDK 25; source/target 21" and a default of Java 25, and does not state a minimum Java version to run it, so no runtimeMin is recorded. The requirements page says a standalone server needs at least 4 GiB of memory and 2 vCPUs, and script tasks need Docker-in-Docker, which AWS ECS Fargate does not support. Kestra Cloud runs Enterprise Edition code; its regions are not recorded for the open-source record. firstRelease is the date of the oldest tag commit (v0.1.0, 2020-01-02) because the first GitHub release is v0.4.0 from 2022-02-22; the oldest tag date is not verified across every tag. LDAP and SCIM are licensed Enterprise features, so sso records OIDC only. The Enterprise Edition is paid, with annual subscriptions per instance on the pricing page; no prices are recorded. The Slack link (kestra.io/slack), YouTube and LinkedIn links have no field here. The latest prerelease is older than the latest stable release, so latestPrereleaseDate is left out.
