notes: >
  Hosted service: the record covers the Honeybadger product at honeybadger.io. The SDK repository honeybadger-io/honeybadger-js (MIT, 116 stars, latest release @honeybadger-io/nextjs@6.0.4 of 2026-10-19) and the npm package @honeybadger-io/js (86.5k downloads a week in the candidates row) are client libraries and are not recorded, per the hosted-service rule; the homepage names no open-source server. SDK languages on the homepage: Ruby, JavaScript, Python, Elixir and PHP. The nav lists uptime monitoring and status pages as products, which are not recorded as categories. The plan page lists Developer (free forever), Team and Business tiers with prices; no prices are recorded. The Business plan lists SAML, SSO and custom sign-in and the security page lists user roles and team membership; the plans are hosting tiers, so no paidEdition is recorded. The self-hosted option is named on the plans page as one of the items to ask sales about, with no install guide found, so the record stays hosted-service and selfHostOption records the sales route only. The about page states "SOC Type II certified" with HIPAA and GDPR compliance. The docs link a Discord integration guide, which is not a community link; the Discord invite on the homepage is the honeybadger.io/discord/ redirect. The homepage footer also names LinkedIn. The about page's 2012 line says the founders built an error tracking app; firstRelease uses that year. The vs page offers "Switch from" pages for Sentry, Rollbar, BugSnag, Airbrake and Datadog; Airbrake has no record id. The hqCountry follows the Honeybadger Industries LLC address on the contact page.
