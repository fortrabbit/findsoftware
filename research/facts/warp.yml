notes: >
  No homepage is recorded. The CSV's https://seanmonstar.com/blog/warp/ is the maintainer's personal blog post, not a project site, and the crate and repository have no other site (crates.io lists no homepage), so the project is repo-only and homepage is absent; a reviewer may decide the blog post counts. The highest stable GitHub release is v0.4.1 (2025-08-06); v0.4.2 and v0.4.3 exist as tags without GitHub releases, and crates.io lists 0.4.3 as the newest stable version (2026-05-04), which sets latestReleaseDate; both sit on major 0. The crates.io 90-day figure is 6532104 recent downloads, not recorded because the field is the total. firstRelease 2018 comes from the crates.io first upload (2018-03-29, version 0.0.0), which predates the first GitHub release v0.1.0 (2018-08-08); the year is the same either way. The repository declares no rust_version on crates.io, so runtimeMin is not recorded. runsAs always-on is taken from the README example, which runs the server on a socket address, and no page states the process type in more words; a reviewer may decide that is too thin. The README names Tokio as the async runtime the example needs, recorded only in the installation quote. The maintainer is named in the LICENSE copyright line only. The README calls the Filter "the fundamental building block" that "can be combined and composed to express rich requirements on requests", and says the framework supports path routing, JSON and form bodies, websockets, static files and compression; the example starts the server with warp::serve(hello).run(...).await.
  The prose also relies on the README example, where warp::serve(hello) is run on an address with run(...).await, and on the license, which is MIT.
