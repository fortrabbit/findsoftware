notes: >
  The maintainer follows the LICENSE copyright line, Next Step Webs, Inc. The demo site footer says "SimpleMDE Markdown Editor is created and maintained by Sparksuite", and Sparksuite is the GitHub organization that owns the repository; that statement names a different party than the LICENSE, so a reviewer decides which one the record shows. The npm package is simplemde, the name the README install line uses; simplemde-markdown-editor is not an npm package, and the CSV's earlier npm figure of 13.6k a week is replaced by the figure above. The npm figure counts the simplemde package the README names. The release list tops out at 1.11.2 dated 2016-06-14, and the repository's last push is 2024-06-11; the README and the homepage state no end of the project and no deprecation, so no status fact is recorded. The release age alone is the import's listing decision. The first release year is 2015 from the oldest GitHub release, 1.0.0, which is older than the first npm version. The runtime is left out because no sentence says where SimpleMDE runs: the README describes it as a replacement for a textarea and the quick start loads it on a page, but no sentence names the browser, so runsAs and runtime stay empty for a reviewer to decide. The README names a spell checker and autosave; those are features, not fields. The README's "How it works" section says SimpleMDE began as an improvement of lepture's Editor project but has taken on an identity of its own, is bundled with CodeMirror (the backbone that parses much of the Markdown as it is written) and depends on Font Awesome (used for icons; by default SimpleMDE checks whether Font Awesome is already included and downloads it accordingly, with an autoDownloadFontAwesome option to force or prevent that), and renders previews with Marked using GFM. The bundling and the dependency are not basedOn statements, and the lepture project has no record. The npm package simplemde and the README install lines serve as the docs; the project has no separate docs site.
