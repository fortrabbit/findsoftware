notes: >
  Vanilo is a Laravel package, not a standalone application: the installation page installs it with composer require into a Laravel project, so basedOn names laravel. The maintainer is the company named in the homepage copyright notice, "Vanilo UG", with its legal form; the LICENSE copyright line names Attila Fulop for 2017 and the reviewer may want to decide which statement stands. The homepage's copyright notice is the only legal name found; no imprint page is linked from it. The vanilo.cloud link names a hosted service, Vanilo Cloud; the project's own pages do not state whether it is a separate product or an edition, so it is not recorded as a field. The installation page does not describe how the application is served, so runsAs stays unknown. The CSV row shows the Packagist figure as 80.0k total; the package read on 2026-10-20 shows 80430 total. Its stable line follows the README's statement of 6.0.0.
