notes: >
  Boundary row settled for server-infra: a desktop database client is a developer tool in scope, runsAs local, so status is accepted; the CSV row stays boundary until a reviewer changes it. The criterion 1 question (a desktop client built to manage a site's database, not a site or app builder) is for the reviewer. currentMajor is not recorded: releases are named by calendar-style version (26.2.3, year and month, then patch), and the rule for calendar versions leaves the major out. The download page says a minor Community release comes about every two weeks and a major one quarterly. The Early Access builds are downloads from the project's site, not GitHub prereleases, so latestPrereleaseDate is not recorded. The license entry is the repository's Apache-2.0 from the API; the about page states the same license as "Apache License version 2", one wording. The PRO edition, the Team and Enterprise editions and the CloudBeaver web product run under the DBeaver EULA (dbeaver.com/eula/), a commercial license not recorded as this repository's license; the EULA covers trial, academic and early-access licenses too. CloudBeaver, the web-based sibling product, is a separate product from the same vendor and is not on this record. The maintainer is named "DBeaver Corp" in the EULA and "DBeaver Corporation" in the same sentence of the EULA, and as the Facebook page name; the EULA and privacy pages give no address or country, so hqCountry is unknown. The homepage release notes list localization and the Eclipse plugin route is named on the docs page; the project does not name the parent framework it runs on, so basedOn is absent. Social links without a starter-list field: YouTube, Telegram (t.me/dbeaver_official) and LinkedIn; not recorded. The download page says every distribution bundles OpenJDK 25 and that a user may delete the bundled jre folder to use a locally installed Java, so runtimeMin is the page's own statement, not a server requirement. The contributor count is taken with per_page=1 without anonymous contributors and reads 368 pages. The first GitHub release is 2015-10-26; the company page's history gives the first version as 2010 (a hobby project) and the first open-source version as 2013, so firstRelease is 2010. The README names the DBeaver Corp buy page for the commercial versions, recorded as pricingPage, and GitHub Discussions as the place for questions. The download page lists SAML, SSO, OKTA and Kerberos authentication among the DBeaver PRO features, so no sso is recorded for the Community edition.
