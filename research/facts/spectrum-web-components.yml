notes: >
  Monorepo: the record names @spectrum-web-components/theme, which the getting-started page recommends alongside every component; the bundle package, which the same page says not to use in production, had 761 downloads in the same week, and the bundle's npm history starts 2019-09-17, the source of firstRelease. Registry figures are for the theme package, not the monorepo. The repository's license is Apache-2.0 and the theme package's npm license field is ISC; both statements are recorded. The GitHub releases list holds one stable release, v1.12.2 (2026-07-06); the npm latest, 1.12.5, is dated 2026-10-14 and is newer, so latestReleaseDate uses it. A v2.0.0-beta.3 tag exists (tagger date 2026-09-01) with no GitHub release object; it is older than the latest stable release and is not recorded as latestPrereleaseDate. The maintainer is recorded as the README names it, Adobe Design Engineering, shortened to Adobe; the legal form and hqCountry are on Adobe's legal pages, which returned 403 to the fetch, so hqCountry is not recorded. The homepage and README say the library is built on LitElement; the Spectrum CSS package and the Deprecation Guide in the docs are separate subjects and are not recorded. The Link API deprecation on the button page is a component-level deprecation, not an end statement. The package pages show yarn add as the install command; no npm install line was found. No social or forum link appears on the project's pages.
