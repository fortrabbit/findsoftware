notes: >
  The homepage http://www.feincms.org/ answers only over plain http; https fails the TLS handshake, so no homepage is linked. The http page is the maintainer's 2018 blog post "The future of FeinCMS", which says FeinCMS 1.x is maintained and still used in flagship projects. The README and the install page say feincms3 is where current development happens and that FeinCMS is still maintained; that names a successor and states the project is maintained, so no end signal is recorded. Versions are calendar-style (26.10.1), so no major is recorded. The tag STABLE_20110517 and the old tags are not versions; firstRelease is the earliest PyPI upload (1.0.1, 2009-08-13). The LICENSE file names FEINHEIT GmbH for 2009-2014; the sibling feincms3 LICENSE names Feinheit AG for 2016-now, and the PyPI author is Matthias Kestenholz. The maintainer value is left to the reviewer. PyPI's JSON download fields read -1, so pypiDownloads comes from pypistats (last month). The install page states the feincms module creates no database tables; the page-module docs show content types stored in tables of the Django database. The README names its Google Groups page over http; the same group is recorded at its https address.
