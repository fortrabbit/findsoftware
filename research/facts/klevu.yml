notes: >
  The candidates row named klevu.com and the klevu/frontend-sdk repository. The klevu.com home page now reads "Klevu is now Athos Commerce" and describes a merger of Searchspring, Klevu and Intelligent Reach under the Athos Commerce name; under the rename rule the record follows the new name, and the id stays klevu. The klevu.com page logo reads "Klevu, a division of Athos Commerce"; a reviewer must decide whether the record covers the Klevu search product only, or the combined Athos platform. The GitHub repository klevultd/frontend-sdk, the npm package @klevu/core (362 a week in the candidates row) and the PHP package klevu/php-sdk are client SDKs, not the service, so no repository is recorded and no SDK figure is recorded. The legal name conflicts across pages: the Website Agreement names "B7Interactive, Inc. dba Athos Commerce", the privacy policy names "B7 Interactive, LLC, d/b/a Athos Commerce" in North America, Intelligent Reach Pty Ltd for APAC and Intelligent Reach Limited (co. no. 08986335) for EMEA; the North America entity with the San Antonio address is recorded, and a reviewer should confirm it. The contact page gives a San Antonio, Texas address, and the hqCountry value follows it. The pricing page states that every offering runs on cloud infrastructure with APIs and integrations; it names no self-hosted option, so selfHostOption is not recorded. The pricing page lists plans without prices, and no prices are recorded. The candidates row's G2, Gartner and Capterra links belong to ratings sites and are not recorded. The social links on the Athos home page for X and Facebook point to the Searchspring accounts and are not recorded; the LinkedIn company page for athos-commerce is not a field. The docs site was read through its home page and the APIs page, which names the REST-ful Data Indexing APIs; the storefront and headless SDK pages are the client side and are not recorded as the service's repository. The record klevu and the record searchspring point to the same company: Athos Commerce, the product of the Searchspring, Klevu and Intelligent Reach merger.
