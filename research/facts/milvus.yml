notes: >
  The milvus.io docs answer a cookie challenge that check-quotes cannot pass, so the install quotes are read from the docs source repository (milvus-io/milvus-docs, branch v3.0.x), which is the project's own documentation. The homepage answers only after the same challenge. The project states it is "under [LF AI & Data Foundation]" with Zilliz as major contributor; the foundation is recorded as maintainer, and a reviewer may decide whether Zilliz, which runs the Zilliz Cloud service, is the maintainer instead. The LICENSE file carries no copyright line. The GitHub language field reads Go; the README adds C++, recorded in notes. Milvus Lite is a Python library in the pymilvus package (overview page): the install the README names is a client SDK and an embedded database in the same package, so no PyPI figure is recorded, since pymilvus is not the server. The overview page states that every instance relies on a message queue, object storage and a metadata store, by default Woodpecker, MinIO and etcd; these are dependencies, not recorded as databases. Zilliz Cloud is operated by another company than the open-source project, and no Zilliz pricing is recorded. The latest prerelease, v3.0-beta (2026-05-09), is older than the latest release, so no latestPrereleaseDate is recorded; the client/v3.0.0-beta tag is a client release and is not counted. The highest stable major is 3, from v3.0.4; the v2.6.x line is still released. The first GitHub release is v0.5.0 (2019-10-21). The license is one entry, Apache-2.0; the README words it "Apache 2.0". The README names Zilliz Cloud with Serverless, Dedicated and BYOC options and links LinkedIn, YouTube and Medium; no field is recorded for these. The HTTP Archive technologies list does not carry Milvus. The README's docker badge names milvusdb/milvus, but the install page uses a script, so no docker image is recorded.
