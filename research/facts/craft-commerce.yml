notes: >
  Status check: archived false, pushed 2026-10-19, no ended or unmaintained statement found on the product page, docs or README, so status stays accepted. Scope check: the plugin is a Craft CMS plugin distributed through the Plugin Store and Composer, so it meets criterion 2 through its Composer distributable, under a proprietary license. The stable 5.7.6 package carries no license field on Packagist; the proprietary value comes from the 6.0.0-alpha.9 entry, and the license text is taken from LICENSE.md on the 5.x branch. The GitHub license field reads NOASSERTION. The requirements page says Craft Commerce "requires Craft Pro, and therefore shares its requirements"; the Craft Pro license is a separate paid license, and the pricing page says the Commerce price "Does not include Craft CMS license". The pricing page lists two plans, Pro (price per project, not recorded) and Enterprise (by request); no open or free edition is named, so paidEdition stays unknown. The Craft requirements page is the source for PHP 8.2+ and for the database list; the Commerce requirements page names the SOAP extension, not recorded as a field. The runsAs value rests on the Craft requirements statement that Craft is a PHP application, read as a per-request runtime; the page does not state the web server model in those words. Packagist downloads use craftcms/commerce, the package the install docs name; the 438721 total is the Packagist figure. The repository default branch is 5.x; the 5.x README is the source for the description and categories. The composer require quote is taken from the install page.
