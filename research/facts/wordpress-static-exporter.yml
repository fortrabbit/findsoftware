notes: >
  The CSV named the project "WordPress Static Site Exporter" and its plugin folder is jekyll-exporter; the readme.txt header reads "Static Site Exporter", so that is the name. The repository's homepage field names the WordPress.org plugin page, which is a directory listing, not a project site, so homepage is not recorded. The project is a plugin for WordPress, which the readme.txt requires at 6.4 or later, so WordPress is basedOn. The license is stated two ways: GitHub reports GPL-3.0, while readme.txt and composer.json say GPL-3.0-or-later; the "or later" clause is the only difference and was not resolved. The output is Markdown and YAML files in a zip, not static HTML, and the readme does not say where the plugin runs beyond WordPress, so renderingModes and runsAs stay unknown. The WP-CLI command (wp jekyll-export) and selective export by category or tag are documented in readme.txt and are not recorded as fields. The WordPress.org plugin page shows "Active installations 400+", but the WordPress.org plugin API returns no active_installs value, so reportedInstalls is not recorded until the two sources agree. The stable tag 4.4.0 was published on 2026-10-11 and the repository was pushed on 2026-10-20; it is not archived, so no end signal applies. The contributors count is the GitHub contributors listing at per_page=1 page count.
