notes: >
  Stub because the candidate row says a boundary: the homepage stapy.net does not resolve (no DNS), so the old link is not recorded, and the project's own site and README name stapy.magentix.fr as the official website. Criterion 5 is unjudged: the maintainer is an individual named only by a handle, and no company, star count or registry package was found (PyPI "stapy" is a different project, and the sourcehut repository shows no adoption figure); a later pass should settle whether that is enough. The source is on Sourcehut (git.sr.ht/~magentix/stapy), which is readable, and the tags there are readable too; the commit dates shown there are relative, so the dates come from CHANGELOG.md. The docs describe an optional safe mode for hosting Stapy on a remote server behind Apache for shared work; it is not recorded as runsAs because the live site is the built files. The release archive's license file names BSD 2-Clause, and the README badge names the same license. Install is a release archive; there is no package on a registry.
