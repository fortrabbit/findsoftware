notes: >
  The official repository is on Codeberg, and the homepage names github.com/dotclear/dotclear as a mirror. The mirror's GitHub figures (46 stars, 81 contributors on 2026-10-20) are left out because they describe the mirror, not the project's repository. The Codeberg API has no license value (null), so the license comes from the project's licence and conditions pages. The licence page names the GNU AGPL version 3 and the conditions page names the GPL for the sources; both statements are recorded and the difference is for the reviewer. The homepage lists Dotclear 2.39.3 as the latest version, so currentMajor is 2. The record uses a coined field codebergStargazers (Forgejo API stars_count) because the official repository has no GitHub stars. The pages read are in French; quotes are copied from the French text. The homepage's requirement text names PHP 8.2 to 8.5, so runtimeMin is the lower bound of that range.
