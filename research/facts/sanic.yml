notes: >
  The release line is calendar-versioned (v25.12.1, published 2026-05-31; the 25.12 part is the year and month of the line), so no major is recorded and currentMajor is absent. The two runtimeMin entries disagree: the PyPI metadata for the latest release states requires_python >=3.10, while the getting-started page states Python 3.9 or higher and lists 3.9 to 3.13; a reviewer decides which the record shows. The PyPI JSON carries no download count, so pypiDownloads is the pypistats last-month figure. The oldest PyPI upload is 0.1.0 (2016-10-15), older than the oldest GitHub release 0.1.8 (2016-11-29), so firstRelease is 2016 from the registry. The LICENSE copyright line names Sanic Community, and the GitHub organization is Sanic Community Organization; the legal name is taken from the LICENSE. The docs navigation on the getting-started page links a Discord server, a forums site and a Twitter account, recorded with their hrefs. The homepage carries a sponsored banner for an API gateway company; it is not a field. The Sanic Extensions and Sanic Testing plugins are separate packages and are not separate records.
