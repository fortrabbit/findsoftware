notes: >
  Homepage https://padrinorb.com/ answers over https; the CSV row's http://www.padrinorb.com redirects to it. The GitHub repository has no release objects; the newest version is the tag 0.17.0 and the rubygems upload of 0.17.0 (2026-10-15) is the latest release date, per the registry rule. The first upload on rubygems (0.1.0, 2009-11-17) gives firstRelease. The README (README.rdoc) names the project's Twitter account, an http link that is not on the homepage, so no x fact is recorded. The padrino-framework gem is the package the install docs name. The maintainer is recorded as the rubygems authors field states it: Padrino Team. The LICENSE copyright line reads "Copyright (c) 2010-2025 Padrino." and no legal form is given. The deployment guide says any host that runs Ruby can run the app and that the server is started with padrino start or the server's own command, which is why runsAs is always-on; renderingModes is not stated on any page read. Admin, i18n and userRoles are recorded from the padrino-admin and localization guides; the admin is described as built in, without a source for SSO.
