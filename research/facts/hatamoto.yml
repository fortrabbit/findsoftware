notes: >
  The repository and the first GitHub release are a day old; release age decides nothing, and Zen Labs Corporation behind it meets criterion 5. The docs and the update channel file at hatamoto.dev/releases/channels/stable.json list v0.x releases that predate the first GitHub release v1.0.1, so firstRelease is the year of the oldest GitHub release. The homepage states no paid edition, no licence server and no telemetry beyond an update check that can be turned off. Each install is one site in one language (the docs call this a design decision); the vs-WordPress page lists multisite and multiple languages as WordPress strengths. The software also ships an MCP server at /mcp, AI-crawler analytics, a WordPress importer and signed WebAssembly plugins; plugins and themes are published through a signed registry with a directory at hatamoto.dev/plugins and /themes. Media files are stored in a folder next to the Postgres database. The go.mod go line is the project's build toolchain, and the docs say the target machine needs no Go toolchain, so runtimeMin is left out. Maintainer legal form and country come from the privacy page; the LICENSE and NOTICE copyright line reads Zen Labs Corporation. Release binaries are published for Linux and macOS on x86-64 and ARM. The homepage footer links only to GitHub; no social links were found.
