notes: >
  Maintainer from the LICENSE copyright line: Alex Johansson, an individual; the README's core team lists "Alex / KATT" and the FAQ of ts-rest names the same person. The homepage calls it "MIT licensed". The quickstart's requirement is TypeScript >=5.7.2 with strict mode; it is not a runtime, so no runtimeMin is recorded. Runtime node rests on the standalone adapter page; other adapters (Fetch API, Cloudflare Workers, AWS Lambda) are named on the homepage and are not recorded as runtimes. The docs say tRPC "combines concepts from REST and GraphQL" and "can run standalone or mounted as an endpoint on your existing REST API", so no headlessApi value is stated for tRPC's own API. The quickstart serves through the standalone Node.js adapter, and the docs list adapters for Express, Fastify, Next.js, AWS Lambda and the Fetch API; no page states the process model, so no runsAs is recorded. Subscriptions run over WebSockets or HTTP streams (docs, feature list); not a field. Stars and contributors are the repository's own counts. The install route names the npm packages @trpc/server and @trpc/client; the registry figure is @trpc/server, the package the README badge names. The docs sidebar lists an "OpenAPI (alpha)" adapter; alpha is not a stable feature and is not recorded as a field.
