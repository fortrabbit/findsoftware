notes: >
  The candidate row has no repository. The WordPress.org plugin page links the Trac source browser and the SVN repository, which are recorded as repository; no GitHub repository was found. The maintainer is stated two ways: the terms name Staatic, a Dutch limited liability company, as the Company, and the contact and privacy pages say "Staatic is a registered trademark of A2N B.V." The terms are the source for the maintainer. The plugin page describes Staatic Premium and Staatic Cloud as additions to the Community edition, so the paidEdition fact makes the model open-core; the plugin license is BSD-3-Clause. The deployment targets and the WordPress.org download count are not recorded as facts. runsAs records the live site, which the plugin page says is a set of static files; no page states how the WordPress origin runs. The directory's ratings and rating counts are not recorded. The first release year is not stated: the directory's added date (2021-06-18) is not a release date. The terms page says Staatic Cloud and the Premium plugin are part of the Platform; the pricing link is the one in the homepage navigation; no prices are recorded.
