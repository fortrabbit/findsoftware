notes: >
  In doubt, so stub. The open-source README and the open-source pages show no embed of a form into a site and no API a site calls. Two statements could settle it: the open-source edition's "basic interfaces and data push" on the pricing page (quote: "开源免费版基础接口与数据推送", https://surveyking.cn/pricing/), and the enterprise "标准 API、Webhook" (quote: "企业版标准 API、Webhook、SSO / OAuth2、AD / LDAP，支持现有业务系统集成与二次开发"). The site homepage also says "标准 API 连接现有业务系统" and the pro changelog lists "添加问卷嵌入页面" (a survey embed page, v2.16.0, 2025-07-15). A reviewer must decide whether the open-source edition counts. Also the four-year rule: the newest tag is v0.3.0-beta.3 (2022-02-20), so the import moves the record to stub on its own. Version conflict: GitHub releases stop at v0.3.0-beta.3 (highest stable v0.2.0, major 0), the README badge says v1.13.0 and the homepage says "SurveyKing 3.2 正式发布" (2026-09-30), so currentMajor is left out. The GitHub repository carries no release newer than 2022. The Docker count is the Docker Hub pull_count for surveyking/surveyking. The project's own homepage and pages are in Chinese, with a registered address in Beijing; the legal name in the footer is 北京橙宇言信科技有限公司, not recorded as maintainer because the LICENSE copyright line names SurveyKing. The Gitee mirror and the Alibaba Cloud registry mirror are no separate records. The deployment guide at /open-source/deploy/ (read in Chinese) lists Windows, Docker Compose, Docker single container, aaPanel, NAS and manual Linux routes. Pages read: surveyking.cn homepage, /open-source/deploy/, /pricing/, /pro/quickstart/, /pro/changelog/, /mcp/ and /about/; the open-source deployment pages returned no content at the paths tried.
