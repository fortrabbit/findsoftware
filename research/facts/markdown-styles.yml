notes: >
  The repository has no homepage on GitHub and the readme names no project site, so none is recorded. The repository has no LICENSE file at its root; the license and the maintainer come from package.json, which names Mikito Takada as author. GitHub reports the language as HTML, which describes the layouts rather than the program, so no language is recorded. The project has no GitHub releases; the registry figures use npm latest 3.2.0, released 2021-02-15, which is the highest stable version of the package the readme names. The npm first version is dated 2013-05-17, so firstRelease is 2013. The last push to the repository was 2022-03-25. The weekly npm downloads cover 2026-10-12 to 2026-10-18. The readme says v3.2.0 drops support for Node versions older than v10.12.0, which sets runtimeMin to Node 10.
