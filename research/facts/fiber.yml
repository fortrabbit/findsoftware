notes: >
  Current major is v3 (highest stable release v3.6.1, 2026-10-14). The newest stable release overall is v2.52.16 (2026-10-23), a v2 maintenance release; latestReleaseDate follows v3.6.1. The Go module path is github.com/gofiber/fiber/v3. Storage drivers, template engines and contrib packages (the homepage's "Storage Drivers", "Template Engines" and "Contrib Packages" lists) are separate modules and are not part of the core install; the templating value lists the engines the homepage names. The LICENSE copyright holder is "Fenny and Contributors"; the gofiber organisation owns the repository. Go modules have no download figure, so none is recorded.
