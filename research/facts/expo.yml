notes: >
  The record is Expo Router. The repository is the Expo monorepo (SDK, CLI, Modules API, Router, documentation) and the router lives in its packages/expo-router directory, so repository stars and contributors, which describe the whole monorepo, are not recorded, and neither is the Node requirement of the expo package. The registry figures come from the expo-router package, which the router install page names. The router docs are on docs.expo.dev and the router has its own page on expo.dev. The EAS Hosting introduction calls it "a service for quickly deploying web projects built using the Expo Router library and React Native web"; its plans are not recorded. The expo-router package publishes no engines field, so runtimeMin is unknown. The router introduction also calls it a routing library "built with Expo", which is not recorded as basedOn.
