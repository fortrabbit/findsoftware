notes: >
  The GitHub repository postgres/postgres is a mirror of the project's own Git repository, and the project takes contributions outside GitHub; the repository is recorded as the source link, and its version and date come from the project's own versions.json. The current major is 18 (current true in versions.json; 18 is supported until 2030-11-14 per endoflife.date). Major 19 is in release candidate: PostgreSQL 19 RC 1 was released 2026-10-15 per the homepage, and no stable 19 is listed, so currentMajor stays at 18. The release date 2026-08-13 is the date of the latest minor releases of the supported majors in versions.json. firstRelease 1989 is the first release the history page names: "Version 1 ... was released to a few external users in June 1989". The implementation of POSTGRES began in 1986 (history page) and the about page says the origins date back to 1986; that is the start of the research project, not a release, so it is kept here only. The versions.json list begins at 6.3 (1998). The Docker Hub official image postgres has 12124485399 pulls (last updated 2026-10-28), but the download page names no container image, so dockerPulls is not recorded under the install-docs rule. The license is the PostgreSQL License as the license page states it; GitHub detects no license. The runtime value is "c binary" on the same basis as other compiled servers, not a page quote. Postgres is recorded as a database; the databases field is not used because the project is the database itself. The DB server runs as a background process by the postgres docs. Fields coined here: none.
