notes: >
  The LICENSE names Aslak Hellesøy alone, while the README footer says "Copyright (c) Cucumber and Contributors" and the gemspec lists four authors; the LICENSE line is recorded as maintainer. The README's supported platforms list still names Ruby 3.2, but the gemspec at v12.0.1 requires 3.3 and the 12.0.0 changelog removes 3.1 and 3.2, so runtimeMin follows the gemspec. The rubygems figure is the cumulative download total of the cucumber gem. The newsletter is the Buttondown subscribe form on the community page. Cucumber-rails, the Rails generator, is a separate gem and carries no record here. The sibling implementations (cucumber-js, cucumber-jvm) are separate candidates and are named only in the README. The stars, contributors and dependents belong to the cucumber-ruby repository. The community links come from the cucumber.io community page, which serves the Cucumber project across its implementations. Legal pages on cucumber.io returned 404, so the company's country is unknown.
