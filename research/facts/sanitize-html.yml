notes: >
  The standalone repository github.com/apostrophecms/sanitize-html is archived; its README reads "We have retired this repository in favor of our monorepo", and the package lives at packages/sanitize-html in github.com/apostrophecms/apostrophe. The archive is a move, not an end, so the repository is the monorepo; its stars (4669) and contributors (101) belong to the whole ApostropheCMS monorepo, and the archived repository reported 4106 stars and 86 contributors at the same time. The project has no site of its own: the package homepage is the README in the monorepo, so no homepage is recorded. The package.json author is "Apostrophe Technologies, Inc."; the LICENSE copyright line names "P'unk Avenue LLC", which is the maintainer recorded here. The Terms of Service of apostrophecms.com name Apostrophe Technologies, Inc., a Delaware corporation with a Philadelphia address and "USA" on the address line; that company is another legal entity, so no hqCountry is recorded for the maintainer. The README says the library is "intended for use with Node.js and supports Node 10+", while the published manifest requires node >=22.12.0; runtimeMin takes the manifest, 22. The README also describes browser use with a bundler; that is a use, not a runtime. The README says the library "is built on the excellent htmlparser2 module" and is a dependency, not a record, so no basedOn is recorded. It was "created at P'unk Avenue for use in ApostropheCMS"; ApostropheCMS is the project that uses it, not a parent. The npm figure counts sanitize-html downloads for the week 2026-11-01 to 2026-11-07. Stars and contributors belong to the monorepo, not to the package alone. The README says sanitize-html lets you specify the tags to permit and the attributes permitted on each, that it is well suited for HTML fragments such as those created by rich text editors, and that it is especially handy for removing unwanted CSS when pasting from Word.
