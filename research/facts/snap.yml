notes: >
  Doubt: the homepage the repository and the cabal file name, snapframework.com, does not answer from this environment (DNS resolves to 97.107.130.19, but connections to ports 80 and 443 time out on repeated tries, for both the apex and www), so no page of the project's own site was read and no homepage is recorded; a later check from a working network that finds the site answering over https settles whether the record is accepted, with homepage and the docs and FAQ pages read. The README names the site as http://www.snapframework.com/, which is not https and is not linked. The GitHub repository has tags up to 1.1.3.2 and no GitHub releases, and Hackage holds 1.1.3.3, uploaded by cydparser on 2023-10-23, which is the newest registry version and is recorded as latestReleaseDate; the first component of the PVP version, 1, is the major. firstRelease is the upload date of the oldest Hackage version, 0.3.0. The maintainer field in the cabal file holds only an address, so the author names stand in as the maintainer; a reviewer may want to decide that. The Hackage description gives the install steps (cabal install snap snap-templates, then snap init), and the snap-templates README gives cabal install snap-templates and snap init. An Internet Archive copy of the site exists and was not used as a source.
