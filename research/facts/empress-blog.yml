notes: >
  The homepage is the project's demo blog, the only site its repository and npm metadata point to; it carries the byline "Built by Chris Manson". No page read names a maintainer: the README links Chris Manson's blog as a production example, the npm package.json lists him as author, and the LICENSE has no holder name, so maintainer stays unknown. The README is the only documentation found, so docs is not recorded. The README says the project is mostly compatible with Ghost, that its themes are shallow forks of Ghost themes, and that a beta import command reads Ghost, WordPress and Tumblr exports; the import command is recorded as importsFrom. The repository license is reported by GitHub and npm as MIT. firstRelease is the year the npm package was created. The npm weekly figure is the empress-blog package, which the README names in its quick start.
