notes: >
  The homepage cli.doctave.com is the project's own documentation site, built with Doctave; it was read over https and answers 200. The releases run from 0.1.0 (2020-10-08) to 0.4.2 (2022-04-02) and all are pre-1.0, so currentMajor is 0. The Cargo install is documented as a git install with --tag 0.4.2, and the README says the crate is not listed on crates.io, so no crate name is recorded. The README and homepage say the tool is built and maintained by Doctave.com; the maintainer is recorded as the LICENSE copyright line reads, Doctave. The terms of service of www.doctave.com name Doctave Ltd with a Helsinki registered office, but they describe the online service, so neither the legal name nor hqCountry is recorded. The README says Doctave is not a generic static site generator and only generates documentation sites from Markdown. The README also mentions Doctave.com as a hosted option for public docs; no price or plan is recorded. The last commit on master is 2022-04-02 and the last push 2022-09-19; the release fields are the authority here.
