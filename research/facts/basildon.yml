notes: >
  Composer requires php >=8.2.4 and the homepage says PHP 8.2 or higher; runtimeMin records the page value. License stated two ways: composer.json says GPL-3.0-or-later and GitHub reports the LICENSE file as GPL-3.0; both recorded. The page says it outputs HTML or any other text-based format, and PDF through LaTeX; not recorded as a field. The Docker image freosam/basildon is named on the page; its Docker Hub count is not recorded. The maintainer name is the GitHub account name of the repository owner; the LICENSE.md is the unmodified GPL text and no page on the project's site names a person or legal entity. The output directory is emptied on every run, as the page states.
