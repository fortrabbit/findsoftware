notes: >
  Status accepted: the repository is not archived, no page states that the project has ended, and no registry flags it; Packagist has no package.
  The docs site returned an empty page to curl (only a language list), so the docs field cites the homepage link and the installation facts cite the README.
  maintainer follows the LICENSE copyright line, which names an individual with no legal form. maintainerType is left to the import.
  paidEdition: the PRO page lists PRO plugins (White Labeling, Time Machine, Backup Manager, Gallery) that the open version lacks, available only through a paid Patreon tier; that is an edition with extra features under paid terms, so it counts. The page states no license for the PRO plugins.
  installMethod omits the Docker image, which the README gives for quick testing and not for the live site.
  runsAs per-request: the README states only that a web server with PHP support is needed, the same basis used for other PHP software.
  Coined fact kind contentFormats (markdown, html) for the content editor formats stated on the homepage.
  Themes are listed at themes.bludit.com; no field holds a themes directory yet, so it is not recorded.
  The homepage states built-in SEO tools and privacy-first tracking; neither maps to a starter field, so neither is recorded.
