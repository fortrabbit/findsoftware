notes: >
  The product URL https://www.sitecore.com/products/content-hub-one answers 308 twice and then 200 at https://www.sitecore.com/platform/digital-asset-management, a page for SitecoreAI DAM that names the earlier product "Sitecore Content Hub DAM" and does not mention Content Hub ONE; the insights URL in the chain (/resources/insights/content-management/what-is-content-hub-one) also redirects to /products/content-hub and then to the DAM page. The Content Hub ONE docs at doc.sitecore.com/ch-one are current (developer pages on architecture, Content Management API, Preview and Delivery APIs, CLI, Client SDK, and business-user pages on content modeling, authoring, localization and delivery), so the redirect is not an end signal and the record is hosted-service (wave 54 ruling). The docs pages are used as homepage because the product URL no longer shows the product; a reviewer should confirm that choice. The Client SDK, CLI and starter kit are named on the developer pages; they are coined kinds and are not recorded as fields. The invite-team-members URL on the business-user pages returned 404, so inviting and managing users is unknown beyond the role statement on the overview page. Only SaaS editions are described; no self-install guide was found, so no selfHostOption is recorded. The copyright line gives Sitecore A/S, and no page gives a headquarters address with a country, so hqCountry is unknown.
