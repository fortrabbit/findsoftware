notes: >
  Two.js is a two-dimensional drawing library for web pages, accepted as a graphics library in the dev-libs group. The homepage http://two.js.org/ answers 301 to https://two.js.org/, so the https address is the homepage and the http address is not linked. The GitHub default branch is dev, and the README and LICENSE are read from it. The README says the project has been in operation since 2012, but the oldest tag v0.1.0-alpha has a commit date of 2013-01-29, so firstRelease follows the tag. The LICENSE copyright line names @jonobr1 with the site jono.fyi, and the npm package author field gives the same handle, so the maintainer is jonobr1 and the type is a person. The GitHub API and the npm registry both report MIT. The line of releases is 0.8.x, a pre-1.0 line, so currentMajor is 0 and the minor line stays here. The runtime node comes from the README's headless paragraph; the homepage and README both describe browser use, so no runsAs is set. The README names Epilogue Press as a sponsor, which is no record field. The homepage describes a scenegraph in which shapes and groups keep their rotation, position and scale, a built-in animation loop, an SVG interpreter that brings SVG elements from design tools into a scene, and bitmap support for single images, sprite sheets and image sequences. The README's headless section renders a scene on a server with Node Canvas and writes the frames to files, and says the main import includes every module, so tree shaking is not yet implemented and is on the roadmap; a custom build can exclude renderers by editing the build script. The GitHub stars and contributors belong to the single repository. The npm figure counts the two.js package the install docs name.
