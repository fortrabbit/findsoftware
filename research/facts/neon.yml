notes: >
  Releases: the GitHub release objects are named release-<build number> (245 objects, 2023-09-07 to 2025-07-29) and carry no version number, so currentMajor is not recorded; latestReleaseDate is the newest release object. The repository was pushed on 2026-08-31 and the README describes the project as active, so no end signal is recorded. firstRelease is 2022, the "Technical preview" on the company's about-page timeline (JUN 15, 2022); the open access date on the same timeline is December 2022 and the oldest GitHub release object is from 2023. The README says Neon "can be run on a workstation for small experiments and to test code changes", which is the local runsAs value; no page read describes a self-hosted production deployment. The about page timeline reads "Databricks acquires Neon" (May 2025) and the footer "Neon is part of the Databricks Platform", so parent is Databricks. The maintainer is Neon, as the page footer words it; the GitHub organization is neondatabase, and neither the LICENSE (Apache text without a copyright line) nor any page read names a legal entity. The hosted service is the Neon platform; the pricing page offers it with a free plan and usage-based billing, and no prices are recorded. userRoles is from the organizations documentation, which describes roles of the hosted console. No single sign-on statement was found on the pricing, documentation introduction, security overview or authentication overview pages. The Discord and X links are from the homepage; the X link also appears in the page's structured data sameAs list. The runtime is not recorded: the README describes compiling Rust with build dependencies, and no page states a shipped binary or a runtime minimum. Fields coined here: none.
