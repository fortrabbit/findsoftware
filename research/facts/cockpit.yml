notes: >
  The license page and the core README say MIT; GitHub reports NOASSERTION for the repository because the LICENSE text is not detected by the license API, so the MIT statements come from the page and the file. The Pro addons are proprietary under the Cockpit Pro license on the same page. The imprint names Agentejo with no legal form; the import derives maintainerType from the name. The imprint address is in Buxtehude, Germany, while the about page says the agency is based in Hamburg. The about page says Cockpit was started in 2011 and open-sourced in 2013; that describes the project, not version 2, so firstRelease is not recorded for this record. successorOf is kept: the legacy repository README, cited on the fact, states that Cockpit's next iteration moved to the Cockpit organization, which names this repository as the next iteration of agentejo/cockpit. The Cockpit pages do not name the legacy line. Docker tags and the Docker image name are from the installation page. The Packagist download figure is the total since the package was registered. Coined fields: none.
