notes: >
  The repository moved from facebook/relay to meta/relay; the old name redirects, so the final URL is recorded. It is a monorepo: the npm package relay-runtime is the core package, and the quick start installs it with react-relay, the React binding that shares the same install line. The relay-runtime figure is recorded; react-relay and relay-compiler are separate packages with their own counts, not recorded. Stars, contributors and the release list belong to the monorepo. The latest GitHub release is v21.0.1 (2026-05-27) and the newest stable release of the package is the same; the rc releases of v13 are older than the latest release, so no latestPrereleaseDate is recorded. The first npm upload of react-relay is 0.0.0 dated 2015-03-29, earlier than the GitHub repository's creation date of 2015-08-10, so the year 2015 comes from the registry. The home page says Relay "requires a Babel plugin, and to also run the Relay Compiler"; the quick start installs babel-plugin-relay, graphql and relay-compiler as dev dependencies, which is the same npm route. GitHub reports the repository's primary language as Rust, while the README calls Relay a JavaScript framework; the language field records the README statement. The home page says the runtime works "on the browser or device", which is not a browser-only statement, so no runsAs is recorded. No page states a Node.js runtime for the framework. The maintainer follows the LICENSE copyright line; the page footer names the same legal entity. The home page says components declare their data dependencies and that the compiler aggregates them into efficient requests, while the runtime keeps every component that reads the same data up to date. The docs say Relay is used with React and that the quick start adds the Babel plugin and the compiler as development dependencies. The home page says Relay pre-computes much of its work at build time, and that it relies on GraphQL best practices, including connections and Global Object Identification, which the GraphQL server should follow.
