notes: >
  Betterlytics is an open-source analytics platform that runs as a managed cloud service at betterlytics.io and as a self-hosted Docker Compose install (betterlytics-selfhost repository); the homepage leads with analytics, so it is accepted under criterion 1 even though it also lists uptime monitoring and status pages. The GitHub API and the README both give AGPL-3.0; one entry records it. The vendor is named only as "Betterlytics" (terms and privacy pages); the address line reads "Betterlytics, EU" with no country, so hqCountry is left out and the governing law is Denmark (terms, section 9.6), which is not an HQ. The footer's "Compare vs ..." list is not quoted; the three compare pages named as alternativeTo are the project's own "vs" pages. Google Analytics has a compare page but no record; the Fathom Analytics compare page names the hosted Fathom Analytics, which is not the fathom-lite record, so neither is recorded as alternativeTo. The pricing page offers a free plan (freeTier, a coined kind). Self-hosted installs send a daily report to the project unless the operator turns it off (privacy page, "Telemetry from self-hosted installations"); the record does not carry it as a field. Optional dependencies named on the self-hosting page: MaxMind GeoLite2 (geolocation, needs a free account) and S3-compatible object storage for session recordings. The self-hosting page names no PostgreSQL or other database beyond ClickHouse. Coined kinds, kept here: cookieless tracking, privacy claims (GDPR, CCPA, PECR as the README states), embedMethod (script tag, npm package @betterlytics/tracker, React and Next.js SDKs), and the MCP server (docs). The docker image names on the install page are betterlytics/betterlytics-selfhost and betterlytics/betterlytics; no dockerPulls figure is recorded because the install page does not name one image for the install route. The sso field is left out: the dashboard login uses Google and GitHub OAuth (README), which is social login, not an identity protocol.
