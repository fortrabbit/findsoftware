notes: >
  Stable docs (0.21.0) describe Splinter as a way to "write web browser automation scripts" over Selenium, zope.testbrowser, Django and Flask drivers; the README calls it "a simple and consistent API for web application automation". The git tags run to 0.21.0 (the tag commit date of the oldest, 0.0.1, is 2010-11-21), but GitHub holds release objects only up to 0.19.0 (2023-01-17); the PyPI release 0.21.0 uploaded 2024-01-16 is the newest stable version, so currentMajor is 0 and the minor line 0.21 is not recorded. The PyPI requires_python field is empty; its classifiers list Python 3.8 to 3.12, while the install page says 3.7 and up, and runtimeMin takes the page statement. The GitHub repository and the PyPI project both name the license as BSD (BSD-3-Clause on GitHub, BSD on PyPI); the LICENSE file reads "Copyright (c) 2012, splinter authors", which names no legal entity, so the maintainer is the PyPI author field, CobraTeam. Figures: 70935 is the pypistats last-week total for the rolling last seven days, read on 2026-11-16. The community page names a Google Groups mailing list for help and announcements and a Freenode IRC channel (not recorded). The homepage link in the CSV was http; the stable docs are served over https, so the https stable index is recorded. runsAs is left out: the pages say what the library is for (automation and testing) but not where it runs, and a test library's use in CI is not stated on them.
