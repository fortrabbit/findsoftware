notes: >
  No homepage is recorded. The gleam.toml links list names https://lustre.build as the website, but that address redirects to the Lustre framework documentation on hexdocs.pm, which does not describe lustre_ssg, so it is not the project's own site. The README is the documentation; its badge links the Hex docs page, recorded as docs. The repository has no LICENSE file; the license is MIT from the Hex package metadata and gleam.toml. The GitHub organization lustre-labs has no display name, so the maintainer is recorded as the owner's login on GitHub, which is an organization login and not a legal name. The Hex owner is the user hayleigh, and the gleam.toml sponsor link names hayleigh-dot-dev; neither gives a legal name, so neither is recorded as the maintainer. The highest stable GitHub release is v0.12.0 (2025-05-21), while the Hex package lists 0.11.0 as its newest version; the GitHub release is used because the repository has releases and the major is the same. The GitHub releases list starts at v0.2.0 (2023-09-19), and the repository was created on 2023-09-17. The Hex total of 8770 downloads is the all-time figure from the package API (week 26, day 10). Lustre is named as the project the generator serves, but the README does not say it is built on Lustre, so basedOn is not recorded. The usage section declares routes in a build.gleam file that the project runs with gleam run -m build, and the README states that the package has no CLI, no built-in server, no data fetching and no client-side hydration.
