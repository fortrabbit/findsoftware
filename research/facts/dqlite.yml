notes: >
  Criterion 1 reads as a library, not a site tool: dqlite is an embedded database engine that an application links against, the same class as the SQLite-like rows settled in this wave. Its homepage says it "extends SQLite across a cluster of machines"; basedOn names sqlite from the homepage's own words; the import keeps it once a sqlite record exists. The categories are "database" and "sqlite"; both reach the record as database. The license is one statement in three wordings: the LICENSE file "licensed under the LGPLv3" with a special exception for static linking, the README "a slightly modified version of LGPLv3", and the homepage "Published under the LGPLv3 license with a static linking exception"; the GitHub API reports NOASSERTION, so the license entry comes from the LICENSE file and the model from the homepage. The maintainer is Canonical Ltd, from the copyright lines on the homepage ("© 2026 Canonical Ltd.") and the LICENSE ("Copyright (C) 2017-2025 Canonical Ltd."). The parent is Canonical Group Limited as the privacy policy names the group entity. Canonical's contact page lists "Canonical Group Limited" in London and "Canonical Limited" in Douglas, Isle of Man, and does not say which one is the copyright holder, so hqCountry is absent. The first GitHub release is v0.1.0 (2018-07-30); the repository was created in 2017. The latest release is v1.18.7 (2026-07-02), the only major is 1; the newest prerelease, v1.17.0-rc1 (2024-10-18), is older than the latest release. The README requires a Linux kernel with native async I/O and lists libuv and SQLite as build dependencies; no runtimeMin is stated. The README names go-dqlite, the Go client in another repository, and the wire protocol page, which redirects; neither is a field here. The CSV row gives the Ubuntu dev PPA as the install route; the README calls it the latest development release. The social links on the dqlite.io page are Ubuntu-wide (Facebook, Instagram, LinkedIn, YouTube) and are not recorded. No runsAs is recorded: the docs describe the library inside an application, and no page says a dqlite process runs as a daemon or service.
