notes: >
  The Hex package beacon has two retired versions, 1.0.0 and 1.1.0, which Hex marks as "from a previous project unrelated to Beacon CMS"; Hex's latest stable version is therefore 1.1.0 and is not this project's. The Hex download total (19,472 on 2026-10-24) includes those unrelated versions, so it is not recorded as a field. The highest stable GitHub release is v0.5.1 (2025-04-01), so currentMajor is 0. The first GitHub release is v0.1.0-rc.2 (2024-09-20) and the first stable release is v0.1.0 (2024-10-09). The maintainers Leandro Pereira and Andrew Berrien are named on Hex and in mix.exs; they are not recorded as the maintainer because the LICENSE copyright line names DockYard, Inc. The homepage's DockYard links and newsletter sign-up are the company's, so no newsletter is recorded. The Elixir Slack link on the homepage is a community chat, not the project's forum, and is not recorded. The Beacon LiveAdmin package, which the install guide installs alongside Beacon, is the admin interface. The README says "You can expect incomplete features and breaking changes before a stable v1.0 is released", and that the page builder is in its initial stages; the page does not state how pages are rendered, so renderingModes is left out.
