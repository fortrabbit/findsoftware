notes: >
  Doubt: none on status. The maintenance page says "Vue I18n v9 and Vue I18n v10 has reached EOL and is no longer actively maintained" and "v11 will continue to be maintained"; the end statement covers old majors only, so the record stays accepted at major 11. The docs site's version selector and banner show v8.x, which is a docs version label and not a project status. The GitHub release list names v11.4.21 (2026-11-17) as the newest stable release; the v12.0.0-alpha.12 prerelease (2026-11-17, 04:57 UTC) is older than the stable release (05:01 UTC), so no latestPrereleaseDate is recorded. The npm package vue-i18n is the one the install page names (npm install vue-i18n@11); the repository is a monorepo (packages/vue-i18n holds the npm package) and the npm figure is from that package. The npm 2.2M per week in the CSV is a stale point count; the range sum is recorded. firstRelease is 2014 from the oldest npm upload of the same package name (0.0.0, 2014-05-04), which predates the GitHub repository (created 2020-01-05) and the oldest GitHub tag (v9.0.0-alpha.1, 2020-04-07). The npm package of v11 declares engines node >= 22; that is a build and install requirement of the package, recorded in notes and not as runtime. The introduction says "Vue I18n is internationalization plugin of Vue.js" and the homepage "Internationalization plugin for Vue.js"; both name Vue as the plugin host; the introduction adds "that is one of Intlify projects" and "It easily integrates some localization features to your Vue.js Application", so basedOn vue is recorded. The homepage links the GitHub repository, the changelog, the Intlify project and a Twitter account at twitter.com/intlify, recorded as x without a quote. The homepage says the Vue I18n copyright is "2015-present kazuya kawaguchi", and the LICENSE copyright line reads "2016-present kazuya kawaguchi and contributors"; the LICENSE line is used. The homepage is the documentation site, which is the project's own site. The sponsor and donation links are not fact fields. The repository's description reads "Vue I18n for Vue 3", a Vue 3 compatibility statement; the installation page states "Vue.js 3.0.0 +" as the compatibility note. The Ecosystem page of the docs names the Intlify packages, not recorded here. The pages hold no statement of where the library runs, so no runsAs is recorded.
