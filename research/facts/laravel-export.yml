notes: >
  The repository's homepage field points to spatie.be/open-source, the company's open-source listing, which does not name this package; no project site is recorded, so homepage stays out. The docs URL spatie.be/docs/laravel-export/v1 returns 404, so the README is the documentation. Maintainer is Spatie bvba as spatie.be/privacy states it; the MIT copyright line agrees. Scope was widened on 2026-10-19 from boundary to a static export package for Laravel (CSV note). Not archived, last push 2026-08-07, release 1.5.0 on 2026-06-26. The README describes the output as static files, while the export itself runs from a Laravel application that must be installed and run.
