notes: >
  Release line: 5.7.1 (2026-10-31) is the highest stable GitHub release; the repository also carries 1.x, 4.x and rc tags, all older by version. The tag prealpha_0-1-0-0 (commit 2004-08-11) is the oldest tag and sets firstRelease to 2004 under the rule that prereleases count; a reviewer may decide that a tag carried over from the project history is no release. The first NuGet upload is 2011-01-07 per ecosyste.ms, not recorded. The runtime needs the .NET framework; runtimeMin 2.0 is the lowest .NET Core target group of the 5.7.1 nuspec (the others are net6.0, net8.0, net10.0 and .NET Standard 2.0 and 2.1); the .NETFramework 4.6.1 and 4.8 targets are a .NET Framework minimum and go to notes, not runtimeMin. The NuGet nuspec states the license as LGPL-2.1-only, the same license in another wording, so it is one license entry. The README states a second license, the GNU Free Documentation License 1.1, for the documentation only; it is not a license entry of the software. The nuspec repository element names fredericDelaporte/nhibernate-core; the project's own homepage and README name nhibernate/nhibernate-core, which is recorded. Databases: the reference's SQL dialects table (section 3.6.1 of the reference, the dialect table) names DB2, Firebird, Informix, Ingres, Microsoft SQL Server, MySQL, Oracle, PostgreSQL, SQLite and Sybase, and the table rows are recorded one entry per database for the five that the field list has; DB2, Firebird, Informix, Ingres and Sybase appear in the same table and have no value in the field list. The homepage says the ORM "Supports all popular relational databases". The maintainer is the NHibernate Community as the homepage footer names it; the NuGet authors line names NHibernate community and Hibernate community. Stars and contributors belong to nhibernate-core. The homepage download link to SourceForge is the binary route; the Cloudsmith nightly feed is a development build route and is not recorded. Two forums are named on the README; the Google Group nhusers is recorded, the development group is not a user forum. The homepage's "used in thousands of successful projects" is no count and is not recorded as reportedInstalls.
