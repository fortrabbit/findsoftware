notes: >
  The README says the repository is a read-only mirror of packages/http in appwrite/appwrite, where development happens; repository stays the package's own repository because it is the one Composer installs, and the mirror is not archived. The project has no site of its own: utopia-php.github.io answers 404 and the README links only the GitHub organization, so homepage is not recorded. The README says the library is an MVC framework that relies on the standalone Utopia DI package; that is a dependency, not basedOn. The Packagist stable line ends at 1.2.5 (2026-03-16); the 2.0 line is published only as release candidates (2.0.0-rc34 on 2026-10-08 requires PHP 8.5 or later), so currentMajor is 1 and the GitHub latest release, 2.0.0-rc7 from 2026-06-10, is a pre-release and is not used. The README does not state whether the FPM or Swoole adapter runs per request or as a long-lived process, and its php -S command is an example for local use, so runsAs is not recorded. The maintainer is the Appwrite team as the README names it; the appwrite.io legal pages checked returned 404 and the home page names no legal entity. The contributors count is the GitHub contributors listing with pagination.
