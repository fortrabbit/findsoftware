notes: >
  Legal entity: the privacy notice names Gravitee Topco Limited, company number 13233796, registered in England, registered office 71-75 Shelton Street, London, WC2H 9JQ, United Kingdom. The recorded maintainer is Gravitee.io, the name on the homepage copyright line; the LICENSE file has no copyright line. Reviewer decides whether the legal entity becomes the maintainer and whether its registered office makes hqCountry GB. Runtime conflict: the zip guide says "The Gateway and the Management API require Java 25." while the RPM guide says "Install Java 21" (sudo yum install java-21-openjdk), so runtimeMin is left out. License: the repository is Apache-2.0 per the API; the Enterprise Edition license is not recorded as a license fact, only as paidEdition. Releases: the repository has no GitHub release objects, only tags; latestReleaseDate is the committer date of tag core_4.13.5 and the newest stable tag, and the tag 4.13.1 in candidates-server-infra.csv is older. Stable tags are both core_4.x and bare 4.x names; the highest stable is core_4.13.5. Docs name four self-hosted images (apim-gateway, apim-management-api, apim-management-ui, apim-portal-ui); the Docker Hub count is for apim-gateway, the Gateway being the always-on process. The docs also publish a "Gamma" platform-management line (docs.gravitee.io gravitee-gamma paths, MongoDB and Elasticsearch datastores) that is not recorded here: a reviewer decides whether it is a separate product or the same product under a new name. Social fields: LinkedIn and YouTube links are on the homepage and have no field in the dictionary. The homepage compare pages also cover Tyk, Apigee, MuleSoft and cloud gateways; only Kong has a record, so alternativeTo names only it. Fields coined here: none.
