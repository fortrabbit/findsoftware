notes: >
  Boundary ruling for wave 69: an HTTP client is a helper library, so the row is accepted; the CSV boundary state is not a record status. The README title and the Plugins section name the project as "SuperAgent" in prose and "superagent" as the package. The homepage is the GitHub Pages site the repository names; its first line reads "SuperAgent is light-weight progressive ajax API crafted for flexibility, readability, and a low learning curve". The LICENSE copyright line names TJ Holowaychuk, and the README says the project is "Maintained for Forward Email and Lad"; the maintainer follows the LICENSE line. The npm package page still names the older ladjs owner as its homepage, and the repository now sits under forwardemail; the record uses the repository and the site the repository names. The README lists browsers in a table and names the Node.js module with the same API in its description, so runtime is node and no runsAs is recorded. The README Plugins section names about twenty superagent-* plugins by name and links a wiki for extensions; the wiki link the README gives for extensions is recorded as pluginDirectory. The README names no alternative library and no migration from another library, so alternativeTo and importsFrom are absent. The npm weekly figure is the sum of the daily counts for 2026-11-01 to 2026-11-07 for the package the install command names. The ecosyste.ms dependent counts were read on 2026-11-16. The first npm upload is 2011-08-22 and the GitHub repository was created in April 2011, so firstRelease is 2011. The README's "Supported Platforms" lists browser versions from a browserslist file; those are compatibility, not fields. The CDN route is the README's Browser section (its VanillaJS part loads the build with a script tag), which names jsdelivr and unpkg as the browser-ready builds. The yarn command beside the npm one is the same registry route.
