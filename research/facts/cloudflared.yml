notes: >
  The client has no major version of its own: releases are dated YYYY.M.patch (latest 2026.10.5), so currentMajor is absent. The GitHub tag count is 280 and the first non-prerelease release is 2020-06-30. The Cloudflare Tunnel service the client connects to is hosted by Cloudflare and needs a Cloudflare account and a website added to it (the README's "Before you use Cloudflare Tunnel" section); the hosted service is not a record of its own here, and the reviewer decides whether a client for a hosted service stays in, which the wave rules answer yes when the pages say it exposes web servers (the overview says "you can connect HTTP web servers"). The CSV row's homepage (developers.cloudflare.com/cloudflare-one/connections/connect-networks/) answers 200; the project's repository names the tunnel overview page as its homepage, and that page is used. The Go toolchain minimum sits in the README's development section (go 1.27.3 or later) and is a build requirement, not a runtime, so no runtimeMin is recorded. Docker Hub official status is not claimed: the image is cloudflare/cloudflared. The CSV lastRelease (2026-10-15) differs from the API release (2026-10-27); the API value is recorded. Fields coined here: none; hostedOffering is not a dictionary field, so the hosted service is recorded in notes only.
