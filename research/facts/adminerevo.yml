notes: >
  The status is discontinued on two signals: the repository is archived (GitHub API, archived true, last push 2025-01-24), and the README states the closure in its own words: "I'm going to close the repository", and names pematon/adminer as the option the maintainer points to. The README calls the maintainer "L." and no legal name or company appears on the project's pages, so the maintainer is the GitHub organization adminerevo, recorded as community. The GitHub homepage field points to docs.adminerevo.org, which does not resolve; no other homepage was found, so homepage is left out and no homepage fact is written. The README's "Information from the original developer" table gives the supported databases and "Requirements PHP 5+"; those statements come from the original developer and describe Adminer, so they are recorded only as the README states them. The license is stated once in two wordings (SPDX identifier and "dual-licensed under Apache 2.0 and GPL 2.0"), recorded as one entry. The API lists three releases, v4.8.2 (2023-07-21), v4.8.3 and v4.8.4 (2024-04-07); the repository holds tags back to v4.1.0, which are not releases and are not used for firstRelease. The README gives no statement on how the file is served, so runsAs is not recorded; Elasticsearch is listed in the README and has no databases value in the dictionary. The CSV row says the archive followed Adminer resuming development; the README does not say that, so the record does not state it.
