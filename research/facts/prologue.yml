notes: >
  The mkdocs theme in the site footer links a BSD-3-Clause page, which reads as theme boilerplate; LICENSE, the README badge and the GitHub API say Apache-2.0, so only that is recorded. The GitHub organization is planety; LICENSE carries no copyright line and no page names a maintainer, so maintainer is not recorded. The Discord link is a README badge. GitHub releases run from v0.1.6 (2020-03-22) to v0.6.8 (2026-01-11), and the highest stable one sets currentMajor. The site's views page says Prologue ships no template engine and recommends karax, recorded as templating. The Chronos backend through the kairos server is an option named in the README and is not recorded as a separate fact.
