notes: >
  The GitHub releases are all betas (v1.0.0-beta.4 to v1.0.0-beta.17, first 2024-01-21), and the NuGet flat container for BlazorStatic lists only 1.0.0-beta.1 to 1.0.0-beta.17, so no stable version exists and currentMajor is not recorded. The README install step names BlazorStatic.Templates, a project-template package that scaffolds an app with the BlazorStatic package; the registry id recorded is the library package BlazorStatic, as for a scaffolder. The NuGet search index returns no hit for the BlazorStatic package itself, so nugetDownloads is unknown. The homepage was read over https (200) and the candidate row's http URL is not used. The contributor count comes from the Link header of the per_page=1 contributors request, last page 6. The Discord link is the Blazor Community Discord, which the README names as the place to start discussions about the project. The homepage footer links an x account, tesar-tech, which is the personal account of the GitHub user the README names as the contact, so it is not recorded as the project's x. The README states that the library supports YAML front matter and that the site itself is a sample of the library; neither is a field.
