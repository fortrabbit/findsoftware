notes: >
  Status accepted: MIT on the repository, the gemspec and RubyGems; a release 0.8.3 on GitHub dated 2026-10-26, the same day as the RubyGems upload; the default branch was pushed the same day. The CSV row's date 2026-10-15 is stale. The only GitHub release is v0.8.3 (the tags go back to 0.0.x), and the first RubyGems upload is 0.0.1 dated 2015-10-17, so firstRelease is 2015 from the registry. currentMajor is 0 (the 0.x series). runtimeMin is the gemspec's required_ruby_version at the tag v0.8.3. The README's "Built on facil.io" names a C core library, which has no record, so no basedOn is recorded; the README also says it runs Rack and NeoRack apps, and NeoRack is a separate gem, not a parent. The project has no website of its own: the gemspec and RubyGems give the repository as the homepage, so homepage is absent and the rubydoc API reference stands as docs. rubygemsDownloads is RubyGems' total (555457 at the check date); ecosyste.ms reports 555231 for the same total, and the RubyGems figure is recorded. The README's comparison table with Puma and its benchmark are the project's own claims and a single local measurement, so they are not recorded as facts. The Pub/Sub engine can use Redis or Valkey (RESP3) through an option, and an optional LAN mesh over UDP; these are features, not dependencies, so no databases value is recorded. The README's Windows support is single-process mode, a platform note. The README lists built-in WebSockets, SSE, Pub/Sub, static file serving, TLS and hot application restarts, and says one master process monitors worker processes; it names no process manager or service. Contributors counted over all 24 pages at per_page=1. The GitHub primary language is C; the Ruby share is recorded here only in this note (C 5.9 MB, Ruby 0.4 MB of code).
