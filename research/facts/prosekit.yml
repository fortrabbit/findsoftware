notes: >
  The GitHub repository is a monorepo: stars, contributors and the license belong to it, and the npm figures are for the prosekit package the quick start installs (packages/prosekit in the repository). The release line is 0.x: 0.23.3 on 2026-11-14 is the highest stable release; betas of 0.22.0 are prereleases older than it. The npm package has a first upload of 0.0.0 on 2023-04-19 and the GitHub repository was created 2023-07-09, so firstRelease is 2023 either way. The install page lists pnpm, npm and yarn tabs for one registry; the quote is the npm command, and the sentence before the tabs ("First, you'll need to install the prosekit package.") does not name a registry. The README and quick start also offer a copy-in route through the shadcn CLI (npx shadcn@latest add @prosekit/react-example-full), recorded as a second installMethod. The migration guide maps Tiptap, Remirror and plain ProseMirror patterns to ProseKit; Remirror has no record, so alternativeTo holds tiptap only. The maintainer name follows the LICENSE copyright line, while the homepage footer spells it Ocavue. The homepage lists React, Vue, Preact, Svelte and Solid adapters beside vanilla JavaScript, and the collaboration support is Yjs or Loro (homepage); these are not fields. The homepage calls the editor headless by design and the Tailwind components copy-paste; headless and styled are notes only. The Discord link in the navigation goes to prosekit.dev/chat, which redirects to the Discord invite recorded here. The X and Bluesky links are the maintainer's own accounts, listed under Community on the homepage. No page states where the editor runs as a runsAs value: the server-side rendering guide says ProseKit can run in Node.js and that DOM-dependent APIs are unavailable there unless a DOM implementation is provided, so runtime is node and runsAs is not recorded.
