notes: >
  Status is discontinued from the README's own deprecation statement on the default branch. The README says critical security issues are still triaged and fixed until 12 months after Angular CLI's Web Test Runner support is marked stable, and names Web Test Runner and jasmine-browser-runner as direct browser-based alternatives and Jest and Vitest as Node-based alternatives, each recorded as alternativeTo. The http homepage karma-runner.github.io redirects to the https docs at /latest/index.html, which is the URL recorded. The docs site and README describe v6.4, the latest GitHub release (v6.4.4, 2024-07-29), and the npm latest tag matches it. The runtimeMin is the engines field of the npm latest package; the installation page also says Karma works on all LTS releases of Node.js, a supported-version statement that is not recorded. The README says "Karma just launches an HTTP server, and generates the test runner HTML file", and the Gitter chat link has no field and stays in notes. firstRelease is the 2012 tag v0.0.1 commit, older than the npm package created 2013-03-09; the project was published as testacular on npm from 2012-03-08, a package whose registry description says it was renamed to Karma. Adoption: npm weekly downloads and GitHub stars and contributors on 2026-11-16. The LICENSE copyright line names Google, Inc. for 2011-2021, and the record follows it as the maintainer.
