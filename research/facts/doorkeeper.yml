notes: >
  Maintainer: the MIT-LICENSE copyright line names Applicake; the README says "Created in Applicake. Maintained by the community." The community maintenance line is not recorded as a second maintainer. Grape: the README names Ruby on Rails and Grape together as the applications the gem adds OAuth 2 provider functionality to, so basedOn lists both. Databases: the ORM table names Active Record by default and MongoDB, Sequel, Couchbase and RethinkDB as extension ORMs; no sentence names a database, so databases is not recorded. Extensions (OpenID Connect, JWT, assertion grant, device grant) are separate gems and are not recorded. The OpenID Connect layer is an extension, so sso lists oauth2 only. Stars and contributors: the repository is the only one counted. Latest stable release 5.9.9 (2026-09-24); the 6.0.0.rc2 prerelease (GitHub, 2026-09-24 12:10Z) is older than 5.9.9, so latestPrereleaseDate is not recorded. firstRelease: RubyGems version 0.1.0 uploaded 2011-11-28; the GitHub repository was created 2011-11-18, so no tag predates 2011. Figures: rubygemsDownloads is the RubyGems total; dependentPackages and dependentRepos come from ecosyste.ms for the rubygems registry. i18n: the guides page says Doorkeeper supports multiple languages with the language files in the I18n repository; the README lists those translations (doorkeeper-gem/doorkeeper-i18n) among the extensions not included by default, and the install generator adds an English locale file. The README says Doorkeeper supports Ruby on Rails >= 5.0 (gemspec railties >= 5). Token cleanup: the README says Doorkeeper does not remove expired or revoked tokens and grants, so the oauth_access_tokens and oauth_access_grants tables grow indefinitely unless the bundled rake task doorkeeper:db:cleanup is run periodically; this is maintenance of the host app's database, not a runsAs value. The README sponsor block links oauth.io as a cloud-based SaaS version; that is a sponsor's product, not a hosted offering of the project.
