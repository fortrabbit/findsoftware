notes: >
  The project has no GitHub release or tag; the registry's latest stable version (npm 2.0.0, published 2026-10-08) is used for currentMajor and latestReleaseDate, as the rule for registry-only releases says. The first npm version is 1.0.0 from 2019-08-15, the same day the repository was created. The CMS is distributed through the sample and empty project repositories (apHarmony/jsharmony-cms-sample and apHarmony/jsharmony-cms-empty), which hold the install steps read above. The homepage is https and answers 200. The Getting Started and documentation pages name the same features as the homepage; the page editor's preview of styles is not recorded as livePreview because no page says it shows unsaved changes, and the headless integration named on the homepage and README states no API style, so headlessApi is unknown. The pricing page lists a free self-hosted plan and paid hosting and support plans; those are hosting plans, not editions, so paidEdition is unknown. The system-config page says the CMS adds configuration on top of the jsHarmony framework settings in app.config.js, which is the basis for basedOn. The package depends on jsharmony and jsharmony-factory, which the pages do not describe as a stated parent. The content store is not stated on any page read (the git and SFTP options are configuration, not a store), so contentStore is unknown. The starter templates carry their own licenses (CC BY 3.0 for two of three) and their own authors; they are not part of this record. The repository does not declare an engines field, so runtimeMin is unknown. The Node.js requirement comes from the installer README, not the core repository. The CMS is a Node server for editing that publishes static files to deployment targets, so runsAs holds always-on and static. The static CMS blog post says enterprise features such as single sign on can integrate into the CMS; no page names an edition, so sso and paidEdition are unknown.
