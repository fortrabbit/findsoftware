notes: >
  The buefy.org pages are client-rendered. The homepage HTML carries the title, the meta description and the JSON-LD block, which name the Discord and X links, and the documentation pages are a shell that says the site needs JavaScript; the docs are read from the README and the docs source in packages/docs. The README requires Vue.js version 3.0 or later and says Vue 2 is not supported. The README versioning section still describes a v0.Y.Z scheme, while the releases in use are 3.x. The maintainer is the buefy GitHub organization; the LICENSE copyright line names the contributors graph ("these people") rather than a company or person, and the README names Rafael Beraldo as the original author. The npm weekly figure is the sum of the daily counts for the period in the value. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header. The releases list starts with v0.1.0 on 2017-04-09, and the npm history starts in 2017. The README says that including buefy through a script tag is not working at present and links an issue for it, while the docs installation page lists CDN links with no such caveat; the two disagree and neither is recorded as a constraint. The docs support page names GitHub Discussions as the primary support forum, Discord and Stack Overflow.
