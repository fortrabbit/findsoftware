notes: >
  The project's own site is phpdoc.org; the GitHub organization and the README agree. The maintainer is recorded from the MIT LICENSE copyright line, which names Mike van Riel, the individual; the GitHub organization is phpDocumentor, so a reviewer should decide whether the record names the person or the organization, and maintainerType individual is a choice to confirm. Diagrams are not a field: the homepage says "Gives you a UML Class Diagram for your project using PlantUML or GraphViz." The README names RestructuredText and Markdown as the markup it supports, recorded as contentFormats. The README says of Composer: "we do not endorse nor actively support installing phpDocumentor using Composer". The README runs it from the command line ("phpdoc run -d <SOURCE_DIRECTORY> -t <TARGET_DIRECTORY>"). runsAs local rests on the homepage statement that it integrates into a CI pipeline; no page says it never runs on a live site. The copyright year 2010 is the copyright line, not a first release, so firstRelease stays unknown. The homepage quotes "de-facto", which the record prose must not repeat.
