notes: >
  The homepage www.graphql-tools.com answers with a redirect to https://the-guild.dev/graphql/tools, the page of The Guild, the company behind the project; the final URL is recorded. The repository holds the @graphql-tools/* packages (a monorepo), so stars and contributors belong to the monorepo. The install docs name @graphql-tools/schema, so its npm figures, currentMajor and latestReleaseDate come from that package; the umbrella npm package graphql-tools (10.0.8, 893724 downloads in the same week) is not recorded as the registry id. The umbrella package's own source at packages/graphql-tools/src/index.ts warns "This package has been deprecated and now it only exports makeExecutableSchema. And it will no longer receive updates. We recommend you to migrate to scoped packages such as @graphql-tools/schema". That names the scoped packages as the successor of the same project, so under the rules it is a move and the status stays accepted; a reviewer may decide otherwise. The repository's GitHub releases are changesets-style "release-<timestamp>" tags with no package version, so currentMajor comes from npm. The npm alpha tags (11.0.9-alpha-2026110903...) are published per commit and read as canary builds, not prereleases, so latestPrereleaseDate is absent. The repository's first tag, the umbrella package's first npm version 0.1.0 (2016-04-08), sets firstRelease. The maintainer is "The Guild, Inc." by the LICENSE copyright line. The terms of use PDF names a different legal entity, Software Products Guilda Ltd., "a company registered in Israel", and the privacy policy names it too; that entity is not the LICENSE holder, so hqCountry is absent (reviewer decision). The Guild's footer links X and a newsletter; they are recorded as company links on the homepage. The shared Discord invite in the Guild footer serves every Guild product, so it is not recorded as the project's discord. The migration pages name graphql-import, graphql-toolkit and merge-graphql-schemas as predecessors; none has a record, so importsFrom is absent. The introduction says the packages work with any GraphQL-JS schema and in the browser; no basedOn is recorded, and no runsAs because the packages run as library code. The @graphql-tools/schema engines field states Node 22.18.0 or later for the latest version.
