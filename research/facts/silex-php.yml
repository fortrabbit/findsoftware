notes: >
  The homepage silex.symfony.com redirects to the Symfony blog post "The end of Silex" (January 12, 2018); the status fact cites that post and the README, and the homepage is recorded as the project's own domain only, with no quote. The README says the project is in maintenance mode, and the blog says the end of life is set to June 2018; the blog also says Symfony 4 with Flex is the replacement the project points to, which is not recorded as successorOf because the blog names no successor project as such. Packagist flags the package abandoned with replacement symfony/flex; that is a registry signal and is recorded only as a status fact. The repository is archived (api, checked 2026-10-23). The repository has tags but no GitHub releases; the highest stable tag is v2.3.0 (commit dated 2018-04-20), so currentMajor is 2. firstRelease is the oldest tag, v1.0.0 (commit dated 2013-05-03). The docs folder is the repository doc directory; the documentation site redirects. The doc folder web_servers.rst routes requests to index.php, but no page states the runtime model, so runsAs is unknown. Symfony is named as the component source in the README; no parent company is recorded for Silex because no page states one. The Packagist total and monthly figures are recorded with their period.
