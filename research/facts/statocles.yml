notes: >
  The homepage preaction.me/statocles, listed on GitHub and in the candidate row, answers 404 (an nginx default page earlier), so no homepage is recorded and status is stub under AGENTS.md (the project's own site no longer shows the software). Criterion 3 is met through the deployment guide Statocles::Help::Deploy, read from fastapi.metacpan.org. The repository has no GitHub releases; the newest tag v0.099 points to a commit dated 2026-08-23, which is recorded as latestReleaseDate, and the metacpan release record gives version 0.099 for the same day. GitHub reports no license (NOASSERTION); the LICENSE file and the POD say the software is free software under the same terms as the Perl 5 programming language, recorded in those words. The contributor count is the rel="last" page number of the contributors endpoint. The POD lists an installation by CPAN only through the distribution name, so no installMethod is recorded.
