notes: >
  The repository moved from adamghill/django-unicorn to django-commons/django-unicorn; the homepage footer, the PyPI project URLs and the Discuss link still name the old path, which redirects, so the API repository is recorded and the old path is used only where the page states it. The installation page says Python 3.8 or greater, and the changelog records Python 3.8 and 3.9 support as dropped; pyproject.toml requires >=3.10 and PyPI reports the same requires_python, so both statements are recorded as runtimeMin entries. The homepage banner still shows 0.65.2; the latest GitHub release and the PyPI release are 0.67.0 (2026-03-07), and currentMajor is 0 because the project is in the 0.x line. The first release is the PyPI upload 0.1.0 of 2020-07-22, older than the oldest GitHub release (0.6.5, 2020-09-19). The homepage names Django as the framework it is for, and the pyproject description repeats it; basedOn Django is recorded for the parent named there, while no Django record exists in the register.
