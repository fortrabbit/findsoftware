notes: >
  Latest stable release v1.49.0 (2026-10-23); v1.50.0-beta.1 (2026-10-28) is newer than the stable release and is recorded as latestPrereleaseDate. The CSV row dates the release 2026-10-06; the facts hold today's values. The self-hosting page says self-hosting "is supported as of the 1.0 release", and that the support team "does not guarantee direct support for self-hosted instances", pointing dedicated support to enterprise options; no paidEdition fact is written because those are support terms, and the pricing page's paid add-ons (HIPAA, advanced observability) are add-ons. The SDKs listed in the README are TypeScript and JavaScript, Python, Go, and Kotlin and Java. The go.mod Go version is a build requirement for a product shipped as a binary and image, so no runtimeMin is recorded. The npm figure is for inngest-cli, the package the self-hosting and README name for the server; the SDK package inngest is not the server and its download figure is not recorded. The npm registry's license field reads "SEE LICENSE IN LICENSE.md" and is not recorded as a separate statement; the README statement carries the license. The pricing page's cloud FAQ says "Inngest is open-source and can be self-hosted", which the self-hosting docs also state through their section "Why self-host Inngest?"; the quote used for hostedOffering is from the same FAQ. Two address statements: the privacy page gives 600 California St, San Francisco, and the terms page gives 821 Howard St, San Francisco for "Inngest Inc"; the privacy address is recorded and both address pages are the same company. Wiring: an app calls the SDKs and sends events to the Event API over HTTP, which the self-hosting docs describe; that meets the app-services test. The X and Discord links come from the homepage, the newsletter link from the README.
