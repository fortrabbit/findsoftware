notes: >
  Repository: groonga/groonga. Repository description says "Groonga is the successor project to Senna" (successorOf Senna, which has no record in this dataset). The project's own pages name Mroonga (MySQL storage engine), PGroonga (PostgreSQL extension) and the Ruby binding as related projects; they are separate software and are not basedOn Groonga here. firstRelease 2009 is the commit of the oldest tag in the repository (release-0.0.3, 2009-04-25, after the rename "Senna -> groonga" on 2009-01-14); the project's news pages for Groonga start with 0.7.6 in 2010, so the tag is the earliest dated source. The entries on the "News in Senna period" page (2005 and 2006) belong to Senna and are not Groonga releases. The homepage gives a 2009 copyright range for the project. The docs describe the library and the server command (characteristic page), so runsAs is always-on for the server and the library runs inside the application that links it. The HTTP interface is named as a built-in server protocol (HTTP, memcached binary protocol and Groonga Query Transfer Protocol), not as REST or GraphQL, so headlessApi is not recorded. Tokenizers include word tokenizers (MeCab when installed) and n-gram tokenizers; no language field is recorded. The documentation says the project is in C; no runtime or runtimeMin is recorded because the native build needs no runtime version. The project's license statement on the homepage is the only license wording found; the repository's COPYING file is LGPL-2.1 per the GitHub API. Contributors count is the page number of the rel=last link with per_page=1.
