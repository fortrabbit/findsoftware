notes: >
  The repository has no GitHub releases; its tags run from v0.1.0 (commit dated 2010-10-13), and the npm registry's stable latest is 1.6.1, published 2025-04-01, so currentMajor and latestReleaseDate come from npm. The CSV row lists the category ui-library, but the project describes itself as a framework for structuring JavaScript applications with models, collections, views and events; no UI component kit is stated, so the recorded category is mvc. The homepage is served over https (it answers 200), so the plain-http form in the CSV is not used. The homepage says Backbone depends on Underscore.js (>= 1.8.3) and that jQuery is needed only for RESTful persistence and DOM manipulation with views; no basedOn fact is recorded because the project does not name a parent framework. The LICENSE copyright line names Jeremy Ashkenas and DocumentCloud, and the homepage describes Backbone as an open-source component of DocumentCloud. The npm weekly and HTTP Archive figures carry their own periods; the HTTP Archive figure is the desktop origin count for "Backbone.js" in the technologies list. The npm figure is the sum of the daily downloads API for 2026-10-18 to 2026-10-24. The README also names a Stack Overflow tag and a Matrix room for questions.
