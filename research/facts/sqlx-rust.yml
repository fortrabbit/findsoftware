notes: >
  No homepage: the repository has no homepage field, the crate has none on crates.io, and the README names only the repository and the crate docs. The repository moved: launchbadge/sqlx redirects to transact-rs/sqlx (the GitHub API answers for the new owner, not a fork), but the README, the Cargo.toml at v0.9.0 and the crate's repository field still say launchbadge/sqlx, and the README's links still point there. The record uses the current repository. The LICENSE-MIT copyright lines name "SQLx Contributors" and "LaunchBadge, LLC"; the LaunchBadge line is the legal entity, recorded as the maintainer, and the README credits The LaunchBadge team and links launchbadge.com. The launchbadge.com pages show no country, so hqCountry is absent. The GitHub API reports Apache-2.0 alone, and the README states both licenses under "Licensed under either of", so each is its own entry. The MSSQL driver was removed after version 0.7 pending a rewrite under the "SQLx Pro initiative" (a GitHub discussion); that project is not recorded as a paid edition, because no page states a paid edition of this software. The first crate version 0.1.0 was published 2019-06-06 on crates.io, which sets firstRelease. The alpha 0.9.0-alpha.1 (2025-10-15) is older than the stable 0.9.0 (2026-05-21), so no latestPrereleaseDate is recorded. The README's "If you are looking for an (asynchronous) ORM" paragraph links the Ecosystem wiki page and names SeaORM and ormx only as links, not as an alternativeTo statement. The installMethod quote is the Cargo dependency line from the Install section; no sentence in the README names cargo, so a reviewer decides whether the code block is enough. The Ecosystem wiki (https://github.com/launchbadge/sqlx/wiki/Ecosystem) lists ORMs and crates built on SQLx; it is a community list, not a plugin directory, so pluginDirectory is absent. The crate's total downloads are the crates.io figure; the 90-day figure is not recorded. The README says the compile-time checked query macros connect to a development database at build time (the DATABASE_URL environment variable), and that offline mode caches the query analysis for builds without one. The GitHub repository has no releases; versions and dates come from crates.io.
