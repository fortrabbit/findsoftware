notes: >
  The repository has no homepage of its own; the README links the WizTools.org site the generator builds, which is not recorded as the software's homepage. The stable GitHub releases are the four stagen-0.x tags from 2014, and the latest is stagen-0.3.2 (2014-11-22), so currentMajor is 0 and the release date is from 2014. The README states "Prerequisite: Java 17 or later" for the current master; the latest release is from 2014, so runtimeMin is not recorded. The README says "We do not support themes or blog-like-static-pages". The maintainer is the WizTools.org organization account, whose profile name is WizTools.org. Last push to master was 2025-03-24.
