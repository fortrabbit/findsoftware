notes: |-
  The v3.5 README says the Superdesk server provides the API that processes all client requests and the client provides the user interface, as separate applications. Homepage http://www.superdesk.org/ redirects to https://www.superdesk.org/, which is recorded. The x field is the Twitter link in the homepage's "Follow us" list, which names the publisher account (Sourcefabric), not the software; a reviewer decides whether it stays. Latest stable GitHub release is v3.5 (2026-07-14). The homepage blog announces Superdesk 3.6 (2026-10-06), but no v3.6 tag or release exists on GitHub at check time, so currentMajor stays 3. The release/3.6 branch README, the branch the homepage blog announces, states Python (3.12) and is the source of runtimeMin; the v3.5 README states Python (3.8) and the server Dockerfile builds on Ubuntu 22.04, so the figure differs between branches. The oldest GitHub release is pa-editor, a prerelease dated 2016-01-29, which sets firstRelease. Elasticsearch (7+) and Redis are required services in the v3.5 README but are not content stores, so they are not recorded in databases. contentStore is not recorded because the sources name MongoDB as a required service, not where content is stored. The homepage names no framework the server is built on, so basedOn is not recorded. The publisher's legal form z.ú. is taken from the homepage footer.
   The services page says Sourcefabric offers cloud hosting, training, maintenance and support next to the open source code; no prices are recorded. The about page describes the client as an AngularJS single-page application with some React components and says tasks and messaging use Celery and RabbitMQ. Interface languages are the multilingual statement on the features page, not a statement about multilingual content. The same requirements list names Node.js (with npm) for the client.
