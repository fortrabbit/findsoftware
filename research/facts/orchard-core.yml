notes: >
  Stable release line: highest stable GitHub release is v3.0.1 (2026-07-09), matching the NuGet package. firstRelease is the first stable release, v1.0.0 of 2021-07-22; the oldest GitHub release is the 1.0.0-beta1 prerelease of 2018-06-23. The install docs name the template package OrchardCore.ProjectTemplates; the core package OrchardCore.Application.Cms.Targets is the one the NuGet getting-started section names, and its figure is used. The homepage states that the project is backed by the .NET Foundation, and the LICENSE file names no copyright holder beyond the BSD text; maintainer is recorded as the .NET Foundation as the homepage words it. No runtimeMin is recorded: the repository's global.json pins the build SDK, which is not a stated runtime minimum. The homepage says content, users and roles, media, search and workflows are built in. The docs describe a document abstraction called YesSql over a relational database, and Liquid templates that editors can change. The docs state that Orchard Core runs on Windows, Linux and macOS and ships Docker images; runsAs and renderingModes are not stated in those words. The CSV category headless-cms is not recorded as a category: the homepage calls the GraphQL API a headless back end, and the category list shows only cms and framework. The successorOf value is Orchard 1, which the Orchard Core docs call the original of this redevelopment; the Orchard 1 README also names Orchard Core as its successor. The homepage comparison with Umbraco and ABP is recorded as alternativeTo under the project's own comparison text. The docs site names Microsoft Entra ID (Azure AD) integration under SSO and lists OpenID Connect as a feature; sso is recorded as OIDC.
