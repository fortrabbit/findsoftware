notes: >
  The GitHub homepage link is ratpack.io, which answers over https and is the project's own site; the CSV's gh star figure of about 1.9k matches the API figure of 1947. The highest stable GitHub release is v1.9.0 (2021-06-29), and it is also the highest stable version on Maven Central, whose release tag points to the 2.0.0-rc-1 release candidate; the 2.0.0 line is therefore a prerelease, recorded as latestPrereleaseDate from the Maven upload of 2.0.0-rc-1 on 2022-05-12. The GitHub repository's tag list also carries v2.0.0-rc-1 with a 2022-05-12 commit date. The first release is recorded as 2014 from the Maven upload of 0.9.0 (2014-01-02), which is one day older than the GitHub release v0.9.0 (2014-01-03). Two older tags, 0.5.2 (2012-07-21) and 0.6.1 (2012-11-29), predate the GitHub repository's creation on 2013-01-22 and read as imported history, so they do not move firstRelease; a reviewer may decide otherwise. The project's own homepage and README call Ratpack a set of libraries and a toolkit, not an all-encompassing framework, so categories is library and the CSV's framework is not used. The manual's quick start shows a single Groovy script and the Gradle plugins as install routes. The single-page manual states that Ratpack is built on, and requires, Java 8, recorded as runtimeMin. The sso value comes from the manual's pac4j chapter. No page calls Ratpack a framework; the homepage says it is not an all-encompassing framework. The homepage links GitHub and Twitter; the Twitter link is recorded as the x field, and the homepage also links a Slack community and a Stack Overflow tag, and no field is recorded for them. The maintainer is recorded as "The Ratpack project", the name the manual gives its credits page; no legal entity or country was found.
