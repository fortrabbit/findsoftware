notes: >
  The homepage commonmark.thephpleague.com answers 200 over https and names the project as league/commonmark, the README title. The default branch of the repository is 2.10, not main; the README and the commit date come from that branch. The README and the homepage say the library is "based on the CommonMark JS reference implementation" (commonmark.js, John MacFarlane). That is a reference specification implementation, not a framework, and the statement describes a port, not software built on it, so it stays here and basedOn is not recorded (commonmark-js has its own record). The LICENSE at tag 2.10.7 also carries copyright lines for commonmark.js (2014-2018, John MacFarlane) and commonmark-java (2015-2016, Atlassian Pty Ltd); the license fact is the BSD-3-Clause statement of the library itself. The GitHub license detection matches. The maintainer follows the LICENSE copyright line (Colin O'Dell); the README governance section says the project is "primarily maintained by" him. The maintainerType value individual is a fallback because the repository owner is an organization. The packagistDownloads total and monthly figures come from the Packagist package API on 2026-11-04. The contributors count is the page number of the rel="last" link on the contributors endpoint with per_page=1. The GitHub stars count is the repository of the thephpleague organization, which holds the library itself. The homepage and README list integrations (Drupal, Laravel, Symfony, Twig, CakePHP) and community extensions; these are a list of named software that uses or extends the library, and no field records them. Tidelift support and the sponsor list are not paid editions. The releases page at commonmark.thephpleague.com/releases documents the version history; the earliest GitHub release is 0.4.0 (2014-12-16). The spec statement "fully supports the CommonMark and GitHub-Flavored Markdown specifications" and the HTML-input security defaults ("All CommonMark features are supported by default, including raw HTML and unsafe links") are on the homepage; they are kept in prose and notes, not fields. The README's pluginDirectory link is a Packagist search with a type parameter. The README says only UTF-8 and ASCII encodings are supported and asks for conversion to UTF-8 first. It advises the html_input and allow_unsafe_links options for untrusted input, and an HTML filter such as HTML Purifier when raw HTML is allowed. The GithubFlavoredMarkdownConverter adds autolinks, disallowed raw HTML, strikethrough, tables and task lists, per the README.
