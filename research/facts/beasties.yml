notes: >
  The maintainer is the 2024 copyright holder in LICENSE, Daniel Roe, who also owns the repository; the package.json author is still "The Chromium Authors" from the fork origin and LICENSE also carries "Copyright 2018 Google Inc.". No homepage: the repository's homepage field points to https://npmx.dev/beasties, a third-party registry browser, and beasties.dev does not resolve. The README describes Beasties as "a maintained fork of GoogleChromeLabs/critters" (https://github.com/GoogleChromeLabs/critters); critters is a record, so the fork relation is recorded as forkOf; the README does not call Beasties its successor, so successorOf stays empty. The README also says "doesn't use a headless browser to render content", and it lists the webpack plugin beasties-webpack-plugin and the Vite plugin vite-plugin-beasties as separate packages of the same repository. A subpath export, beasties/runtime, runs in a server process; the README says to "Create the processor once and reuse it", so no per-request runsAs is recorded, and a reviewer may decide whether that server use belongs in runsAs. The license is Apache-2.0 in the GitHub API and the npm latest manifest; the README says "Apache 2.0" and LICENSE carries the Apache License, Version 2.0 text, so one entry. The repository has 19 non-prerelease GitHub releases from v0.0.26 (2024-10-25) to v0.5.5 (2026-10-12); firstRelease is the oldest of them. The npm weekly figure is the sum of the seven days 2026-09-28 to 2026-10-04. The ecosyste.ms counts are 0 dependent packages and 0 dependent repositories for beasties as read on 2026-10-28.
