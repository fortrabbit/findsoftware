notes: >
  Attaches to a site as a script tag: "Download the files ( Github or NPM ) and place the folder /tarteaucitron/ at the root of your website", then a script tag and a tarteaucitron.init call (install guide, https://tarteaucitron.io/en/free-installation-open-source/). The consent interface and service controls run in the visitor's browser; no page uses the word "browser" for it, so runsAs is not recorded. The README lists a banner, service-level preferences, consent-based loading of configured services, and Google Consent Mode v2 support. It also states that initializing the banner alone does not automatically block scripts already loaded elsewhere on the website, and that using the library does not by itself guarantee GDPR compliance. The LICENSE copyright line reads "Copyright (c) 2014 AmauriC" and the legal notice names "Amauri Champeaux", so the maintainer is the legal notice's name; the street address on the legal notice is not recorded. The npm figure counts the package tarteaucitronjs, which the README's npm badge names; the install guide names the registry only as "NPM", so the registry id comes from the README. The Pro service is a separate managed console at tarteaucitron.io with a paid licence: it is a SaaS console, so no paidEdition is recorded, and no prices are recorded. The homepage states "Une licence Pro couvre tous vos sites" and "36 langues" for the online console; these describe the managed service and are not recorded as library i18n. The homepage also states "+100 contributeurs" and "plus de 1300 commits", both superseded by the contributors endpoint (117). The homepage links no social account. The earliest GitHub release is v1.0, whose tag commit is dated 2018-08-28, so firstRelease is 2018. The version line is 1.x: the newest release is v1.37.0 (2026-10-15).
