notes: >
  The repository is on Codeberg, so no GitHub stargazer, contributor or release figure is recorded; the Codeberg repository reports 424 stars when read, and Codeberg has no contributors endpoint, so contributors is not recorded. The CSV homepage simonrepp.com/faircamp answers with a 301 to https://faircamp.org/, which is recorded as homepage. Releases come from the Codeberg tags: 2.0.1 is the highest stable tag, and the changelog page lists it as released on Oct 01, 2026 while a 2.0.2 entry reads "Unreleased" and is not recorded. The oldest tag is 0.8.0 (2023-10-13), so firstRelease is 2023 and earlier history is not tagged. The installation guide gives Windows, macOS and Linux downloads with Homebrew, AUR, Alpine and RPM/Debian packages; the list in the download page is abbreviated in the fact file. The docs call the desktop app and the CLI two editions; the desktop app is recorded as adminUi. The Rust 1.92 minimum in BUILD.md applies to building from source only, so runtimeMin is not recorded. The documentation is CC0-1.0, the software AGPL-3.0-or-later, and the built sites redistribute the Barlow font under OFL-1.1; the README names the font, which is not recorded as a license. The homepage states the output needs no database and no programming, which is a statement about the built site, so databases is not recorded. The docs' "migrate" command moves v1 sites to v2 and is not an import from other software. The alternatives list is taken from the project's own ALTERNATIVES.md and is recorded as named there.
