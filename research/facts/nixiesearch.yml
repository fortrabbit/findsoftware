notes: >
  Lucene is named by the project's own README ("Powered by Apache Lucene") and is not a record id, so it stays out of basedOn. The README states 39 languages for the lexical analyzers, and it says the project is "not a database" and "not a tool to search for logs"; none of this is recorded as a fact. The README says the project has "no paid addons and enterprise tier", so no paidEdition fact is recorded. The help pages offer "Enterprise support" by call, which is support and not an edition. The help page on usage statistics says telemetry is sent by default and can be switched off with the NIXIESEARCH_CORE_TELEMETRY variable or core.telemetry: false; not recorded as a field. The docs describe a GraalVM native image on Lambda marked "Highly experimental - stability not guaranteed"; only the JDK image is recorded as runtime. The docs run the searcher on AWS Lambda as "pay per request"; runsAs per-request is left out because no page names it that way. The Slack invite on the homepage and the Substack blog linked as "Blog" are not fields in the schema and are left out. Maintainer: "© 2025 Nixiesearch" is the only owner name on the docs; no legal name, legal form or country appears on the pages reached, so hqCountry stays unknown. The distributed deployment overview describes searcher pods that load indexes from S3 and a single indexer pod that builds them and uploads them to S3. The README's example config.yml holds the index schema and the embedding model settings. The Lambda page says the searchers run on Lambda and the indexer runs separately on Kubernetes, ECS or EC2, and that ONNX embedding inference is not recommended on Lambda because the CPU is limited, so API-based embeddings are used there. The persistence pages name three places the search index can live: S3-compatible object storage, a local directory and memory (the S3 page: "S3 persistence stores search index segments in S3-compatible object storage"). The README log sample names version 0.5.0 and the help page names 0.4.1; neither is recorded because the GitHub release is the source for currentMajor. The HTTP Archive technologies list does not carry Nixiesearch. The README's comparison list ("How it's different from popular search engines?") gives the alternativeTo entries.
