notes: >
  The package is a React library: its README calls it "a collection of React UI components" and its install guide names React and Emotion as peer dependencies, and the npm package declares react ^17.0 or ^18.0 as peers. No runtime or runtimeMin is recorded: the package declares node 16.x, 18.x or >=20.x in engines, which describes the build tooling and the package, not a runtime the site needs. The repository's LICENSE.txt is dual-licensed under the Server Side Public License v1 and the Elastic License 2.0, or an Apache License 2.0 compatible license, or the Elastic License 2.0 alone, each noted in the file header; the GitHub API reports NOASSERTION, so the license is recorded as the LICENSE file states it. The Elastic licensing FAQ (https://www.elastic.co/pricing/faq/licensing) answers the question "I'm using EUI or Elastic Charts in my application outside of Kibana, how does this affect me?" with "If your application is not a hosted or managed service, you may not be affected at all." The FAQ tells readers to contact elastic_license@elastic.co for clarification; it is not recorded as a field. The install guide says to use yarn and that npm is not supported, while the package is published on npm. firstRelease is the first npm upload (2017-10-31); the oldest GitHub release is v0.0.25 (2018-03-11). The GitHub repository was created 2017-10-18. The maintainer is Elasticsearch B.V. as the NOTICE file states it; the elastic.co legal page names the same entity in its footer, and no page found states its headquarters country or its parent company. contributors counts contributor accounts from the API list with per_page=1, read from the Link header. httpArchiveSites is absent: the library is not in the HTTP Archive technologies list.
