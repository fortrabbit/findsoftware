notes: >
  No homepage is recorded: the CSV homepage is the pkg.go.dev reference page for the module, a Go documentation index rather than the project's own site, and the repository has no site of its own. The repository says it is a library used inside handlers, so no runsAs is recorded: the README shows no deployment, only go get and in-code use. The CSV scope changed on 2026-10-19 from boundary to accepted as a helper library; criterion 1 holds because the README describes it as a library for request parsing and response writing in HTTP handlers. The module path is github.com/rluders/httpsuite/v3; the validation adapter at github.com/rluders/httpsuite/validation/playground is a separate optional module the README names, and it is not recorded. The README names Chi, Gorilla Mux and net/http as the routers it works with; these are not recorded as basedOn because the project does not describe itself as built on them. There is no Go module download figure, so none is recorded. The GitHub contributors endpoint returns one contributor with no further page.
