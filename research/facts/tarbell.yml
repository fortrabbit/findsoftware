notes: >
  The homepage is the Read the Docs site of the project, the only site the GitHub repository names; it documents version 1.0.5 and says "Tarbell 1.0.5 documentation" on every page, so the 1.0.5 docs are the newest the project publishes. The README calls Tarbell "a very simple content management system", but no page describes an admin interface, so categories stay at ssg and adminUi is unknown. Content comes from an optional Google Spreadsheet read by the tool, so contentStore is left out. Publishing to Amazon S3 is documented (tarbell publish <target>); no field holds a publish target, so it is not recorded. The highest stable GitHub release is 1.0.8, and PyPI lists 1.0.9 and 1.0.10 (2017-12-19) with no GitHub release, so the release date is from PyPI. The docs state Tarbell does not work on Windows. The repository's license file is BSD-3-Clause (LICENSE.md, GitHub API), while setup.py and the docs footer say MIT; only the LICENSE.md entry is recorded as the license, and the setup.py and docs wording is not. pypiDownloads is the last-month figure from pypistats.org, not the PyPI JSON, which carries no download counts. The maintainer is the setup.py author, "Tarbell Project"; LICENSE.md copyright lines name David Eads, Chicago Tribune and Kenneth Reitz. The docs state Tarbell requires Python 2.7 and does not support Python 3; runtimeMin is 2.7 from that statement. The repository has no GitHub release newer than 2017, so the import will judge it by latestReleaseDate.
