notes: >
  Repository vuejs/language-tools (MIT, TypeScript) ships the Vue (Official) VS Code extension (marketplace id Vue.volar, publisher Vue), vue-tsc and the language server. The README says the toolset is "based-on Volar.js"; Volar.js has no record, so it is not a basedOn value; basedOn vue follows the README description of the extension as Vue language support. vscodeInstalls: 9841862 installs on the VS Code Marketplace on 2026-10-28 (extensionquery statistic "install"); the marketplace shows version 3.3.13 dated 2026-10-10 while the GitHub release v3.3.13 is dated 2026-10-20, so latestReleaseDate follows GitHub. Highest stable GitHub release is v3.3.13 (major 3); the v4.0.0-alpha.0 tag has no release. firstRelease 2020 is the oldest tag, v0.11.0 (author date 2020-10-03); the oldest GitHub release is v1.8.0 (2023-06-16) and the vue-tsc npm package was created 2021-03-02. Vetur, the earlier official extension for Vue 2, is named on vuejs.org but has no record. The repository homepage field points to deepwiki.com, a third-party site, so no homepage is recorded. The Discord link in the README (discord.gg/vue) belongs to the Vue community server and is left out. The LICENSE copyright names Johnson Chu; the reviewer decides whether the vuejs organization or the copyright holder is the maintainer.
