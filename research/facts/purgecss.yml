notes: >
  The repository is a pnpm monorepo that publishes several packages (purgecss core, postcss-purgecss, purgecss-webpack-plugin, gulp, grunt, rollup, vue-cli plugins); the npm package purgecss is the core one the install docs name, and its GitHub releases (v8.0.0 is the highest stable, 2026-01-24) are used. The npm package has a next dist-tag at 6.0.0-alpha.0, which is a prerelease and is not recorded. The npm registry's first upload is 0.1.0 (2017-07-08), which sets firstRelease. The LICENSE copyright line says "Full Human" and the homepage footer says "Full Human LTD"; the footer is recorded as maintainer. The comparison page on the project's site compares PurgeCSS with UnCSS and PurifyCSS: neither has a record, so no alternativeTo is written. The npm weekly figure is the sum of the seven daily counts for 2026-09-28 to 2026-10-04. No page names Node.js or an engines range, so runtime and runtimeMin are not recorded; the install is through npm. The homepage links a site at full-human.health, which is not identified on the project's pages as the company's, so it is not recorded. The CSV category css-processor maps to css-framework in the import; build-tool is recorded, as for the other asset-optimizer tools. The README says PurgeCSS analyzes the content and CSS files, matches the selectors in the CSS to the content, and removes the unused selectors from the CSS; the CLI page says PurgeCSS is available via a command line interface and can be used by itself or with a configuration file; the README's package table lists the plugins for PostCSS, webpack, Gulp, Grunt and Rollup as separate packages.
