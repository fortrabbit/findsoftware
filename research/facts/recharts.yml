notes: >
  The httpArchiveSites figure is the HTTP Archive technology named "Recharts" (mobile origins). The LICENSE line reads "Copyright (c) 2015-present recharts", and the README and install guide name the copyright holder "Recharts Group" (2015-2026); the legal entity is recorded here only and the maintainer follows the LICENSE. The npm package recharts is the one the install guide names; the Deno route is recorded as its own route and installs from the same npm registry. The install guide and README name react-is as a required companion package, a dependency, not a basedOn statement. Canary builds (v3.11.0-canary series, GitHub prereleases) are not recorded as latestPrereleaseDate. The README says the release branch reflects the latest release and main is the development branch. The first npm upload (0.1.0) is from 2015, which predates the GitHub releases list, the oldest of which is a 2023 re-release; the year follows the npm upload. The README says the library renders native SVG with minimal dependencies and that its components are separate React components, one per chart element; a rendering target is a coined kind and stays here. The README says react-is needs to match the version of the installed react package. The GitHub stars and contributors are the repository's own counts; it is a single repository. The UMD build loads React from unpkg at version 18 in the install example; that is an example, not a requirement recorded here.
