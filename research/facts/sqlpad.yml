notes: >
  The project's own site getsqlpad.com (the CSV homepage) now answers with an unrelated product page, so no homepage is recorded and the repository and docs carry the record. The GitHub homepage field points to sqlpad.github.io, the docs site, recorded as docs. Status is discontinued on the README heading "This Project is Archived", with the repository archived on GitHub (archived true, last push 2025-08-23); the changelog entry for 7.5.7 says "Prep repo for archival". The docs introduction says "SQLPad is in maintenance mode." and that the project will not be transferred to another owner, and the README recommends forking. The npm package named sqlpad is a different project (rickbergfalk/sqlpad, 3.1.0, "npm install no longer suppported. Build from git repo"), so no npm figure or npmName is recorded. The current tag v7.5.7 is 2025-08-22, the newest GitHub release; GitHub releases go back to v4.1.0 (2020-02-25), and the oldest tag v0.0.4 is dated 2014-08-08 by its commit, so firstRelease is 2014. The changelog's 1.0.0 entry has no date. Node minimum is from server/package.json at the v7.5.7 tag; the Dockerfile uses node:20-slim. Docker Hub pull count is for sqlpad/sqlpad as read on 2026-10-30. The docs list other projects under Alternatives as not exactly alternatives, and they are not recorded as alternativeTo. The maintainer is the copyright holder of the LICENSE file; the GitHub owner is the sqlpad organization. Contributors counted without anon across all pages (last page 73). The Docker image is sqlpad/sqlpad (docker-examples README). Fields coined here: none.
