notes: >
  The repository has no GitHub release and no tag, so lastCommitDate is the committer date of the newest commit on master, 2022-11-19; the import moves a record with no release in four years to stub, so this record reaches that point on 2026-11-19 unless the repository gets a commit before then. That is a reviewer decision: keep, or accept the stub. The repository description says "This branch will be HashOver 2.0", and the docs site lists "HashOver 2.0 (in development)" beside "HashOver 1.0". The project's blog on www.barkdull.org lists "HashOver 1.0.2: One for the Wingdings!" dated March 16th, 2016 and "HashOver 1.0.1" dated October 13th, 2015; those are project releases on the author's site, not GitHub releases, so currentMajor is absent. The author's site lists HashOver with the date March 25th, 2014, which matches the repository creation date. The homepage is the HashOver 2.0 page on docs.barkdull.org, the author's documentation site for his projects; the hashover.org domain does not resolve (DNS failure on 2026-11-03), and the README names no other site. The README says "replacement for services like Disqus" (Disqus has a record in this dataset, so alternativeTo disqus) and the docs page says "various proprietary software-as-a-service comment systems". The runtimeMin is the minimum the setup page states for the 2.0 development line. The attachment is a script tag, /hashover/comments.php, and an element with the ID hashover; a PHP call is an alternative route; the API page lists comment count, latest comments, RSS and JSON APIs. Comment data is stored in flat files or in SQL as the setup page describes, and the admin login is HashOver-specific, not a server account. The docs footer names a Creative Commons Attribution-ShareAlike license for the site. The README says comments can be posted anonymously and that the only required information is the comment itself. The setup page asks the operator to fill in a notification email address, an encryption key and an admin name and password in /hashover/backend/classes/secrets.php, and says SQL settings are optional. The license of the software is AGPL-3.0 as the repository reports it; the docs name "GNU Affero General Public License".
