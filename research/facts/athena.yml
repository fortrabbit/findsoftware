notes: >
  The CSV row pointed at the monorepo athena-framework/athena, which holds the component shards and reports no release newer than v0.15.1 (2021-12-14). The web framework is athena-framework/framework, which the monorepo's own README links for "the web framework created using these shards"; its releases run from v0.16.0 (2022-01-11) to v0.23.0 (2026-10-18), so this record uses that repository and the stub rule does not apply. The monorepo's 240 stars and 7 contributors are not recorded; the framework repository's figures are. Crystal shards are not one of the registries in the import, so no download figure is recorded. no page read states a process model, so runsAs is left out; the install page only names OpenSSL and zlib "for its HTTP server". The site's own name is "Athena", and the page titles it "Athena Framework".
