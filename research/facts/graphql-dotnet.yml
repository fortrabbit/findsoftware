notes: >
  The homepage at graphql-dotnet.github.io is a landing page whose visible text is the project name; its description is the GitHub repository's "GraphQL for .NET" and the docs supply the rest. The maintainer line in LICENSE.md names three people and "et al.", so the maintainer is the three names as the LICENSE states them, and the record prose says maintained by them. The README lists separate NuGet packages for serialization, document caching, DataLoader and dependency injection, all in the same repository. The README says the GraphQL specification is developed by the GraphQL Foundation and that the lexer and parser come from another repository by Marek Magdziak; neither is recorded as a field. The NuGet package GraphQL targets netstandard2.0, netstandard2.1, net5.0 and net6.0 in its csproj and catalog entry; those are compatibility targets, so no runtimeMin is recorded and no .NET Framework minimum is recorded. The ASP.NET Core guide describes the separate GraphQL.Server package set, kept in another repository, and states no process model for the library, so runsAs is not recorded; the runtime dotnet covers hosting. The README's OpenCollective badges and sponsors are not recorded. The docs install page names the NuGet packages with the dotnet CLI; no sentence names NuGet on that page, so the installMethod quote is the command. The NuGet figure is the total the search API reports; the project publishes preview packages to GitHub Packages, which is not a public registry figure and is not recorded.
