notes: >
  The homepage is only reachable over plain http (http://pickyrb.com answers 200; https does not answer), so it is not linked, and the docs at http://pickyrb.com/documentation.html are cited from the GitHub source instead. The site at http://florianhanke.com/picky is the gem's homepage in the gemspec, and it answers over http only too. The last release is 4.31.3 on 2015-09-02 (RubyGems and the v4.31.3 tag); the default branch's last commit is 2025-04-18, and the repository has tags, so lastCommitDate is not recorded. Since the latest release is older than four years, the import will move the record to stub on its own; status stays accepted here. The README names "Ruby 1.9" as a requirement and the v4.31.3 gemspecs state no required_ruby_version; the master gemspec requires Ruby 3.2 or later but is unreleased, so no runtimeMin is recorded. The gem licenses are MIT and LGPL in the gemspecs and LGPL 3 in the LICENSE files of server and client; the wordings are recorded as separate entries. The index types (memory, Redis, SQLite and file) are documented in the source; the file type has no section. The "In use on" list in the README (laut.de, cocoapods.org, wadoku.eu and others) is not recorded: it is the project's own list of users with no figures.
