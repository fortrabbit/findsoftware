notes: >
  Renamed: the README says "Fecshop更名为FecMall" (Fecshop renamed to FecMall) and the record name follows the project's current spelling; the id stays fecshop as in the CSV. Reviewer to confirm the name. The CSV homepage https://www.fecshop.com is not the project: it is the site of Fecify, a commercial product the FecMall timeline describes as unrelated to FecMall. The project's own site is https://www.fecmall.com. The GitHub repository fancyecommerce/yii2_fecshop resolves to fecshop/yii2_fecshop, and the Packagist package named in the README is fancyecommerce/fecshop. Project status: the README says the open-source project has "全部开发完毕" (all development completed), and the timeline says on 2022-01-01 the system is "已经完善" (complete); neither says ended or unmaintained, so status stays accepted; the reviewer should decide. Last release 2.17.4 on 2021-09-02; repository last pushed 2026-09-05. The license page copyright reads 2015-2021. The timeline dates the project's planning to 2015-10-10 and its framework to 2016-02-01; neither is a first release, so firstRelease stays unknown. The FecBDC, FecWig and FecWBBC lines on the product list are marked 付费授权 (paid license); they are separate products on the same site, not recorded as paidEdition, reviewer to decide. The install guide calls Docker not recommended. Search engines (Xunsearch, Elasticsearch) and Redis for cart storage are configurable options, not recorded as fields.
