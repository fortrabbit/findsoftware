notes: >
  No project site: the repository and its README are the only pages, and the README links no site, so homepage is not recorded. GitHub detects no license (NOASSERTION); the LICENSE file is a two-condition BSD-style text with no SPDX name, and composer.json at v3.3.4 names BSD-2-Clause, which is the license recorded. The LICENSE copyright line names "2011-2013". The v1.0 tag commit is dated 2012-05-20, which gives firstRelease; the GitHub releases list starts at v2.5.1 (2016), so the release list alone would be wrong. Stars and contributors belong to the single repository. The README links an Azure Blob Storage project as a usage example; that is not a fact of this record. The repository owner is a user account (beberlei), not an organization. The CSV's second category, assertions, is left out because the import maps it to testing, which the library does not claim. Packagist also reports 2400569 monthly downloads in the same JSON; the total is the figure recorded.
