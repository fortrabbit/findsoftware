notes: >
  The homepage is the DNN community site, which the project's own pages name as the home of DNN Platform. The name "DNN Platform" is the one the repository and homepage use; the project was called DotNetNuke from February 2003 and the name DNN is used since. The History page dates the DotNetNuke release to February 2003, which firstRelease follows; the same page says IBuySpy Workshop, released on Christmas Eve 2002, eventually became DNN. The oldest GitHub release is v7.2.0 (2015-03-03). The highest stable GitHub release is v10.4.0 (2026-10-06); v10.4.1-rc1 (2026-10-21) is the newest release candidate and is recorded as latestPrereleaseDate. The default branch is develop. The requirements page says the database is a single Microsoft SQL Server database; contentStore follows the same sentence. The homepage FAQ (structured data) calls Evoq "a commercial offering maintained by DNN Software (IgniteTech) that builds on DNN"; it is a separate product there and no page calls it an edition of DNN Platform, so paidEdition is not recorded. The requirements page lists Windows 10, Windows 11, Windows Server 2016 or later and Azure App Service as operating systems and says the Microsoft IIS feature must be installed. The homepage FAQ (structured data) says DNN Platform is a member project of the .NET Foundation. The Website-Metrics page loads its figures by script, so no site count was read and reportedInstalls is absent. The installation page links its IIS and SQL Server step guides on dnndocs.com, which were not used as a source; the requirements page is the primary source. The LICENSE copyright line reads "Copyright (c) .NET Foundation and Contributors"; the maintainer is recorded as the DNN Association named on the community site footer. The features page describes the persona bar as the back end, which is the adminUi value.
