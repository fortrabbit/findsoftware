notes: >
  Status is accepted. The version scheme is release YY.MM.patch (release24.09.08), a calendar version, so currentMajor is absent. The latest tag release24.09.08 is dated by its tag object (2026-10-21); the download page says the 24.09 series release it describes is the seventh, released June 2026, so the page is behind the tags and the tag is used. The GitHub tags begin at release17.12.01 (2020), but the project's own pages say that older releases exist in the Apache archive and in a release history; no first release year is stated on a page that was read, so firstRelease is absent; the Apache archive's oldest file is from 2010 and the homepage says top level project since 2006, so neither is the first release. The trunk README and the 24.09.08 INSTALL both name a JDK; the stable tag requires version 17. The admin interfaces named in the trunk README are the order back office, the accounting back office and the webtools administrator. The trunk README links Docker documentation, recorded as an install method; the Docker pages themselves were not read. The homepage names Apache OFBiz as an ERP suite; the enterprise and CRM terms are the project's own. The Slack channel and the YouTube and Vimeo channels are not recorded.
