notes: >
  The README installs coastercms/coastercms with composer create-project, and packagistDownloads is that package's total. It replaced web-feet/coastercms, which Packagist marks abandoned with coastercms/coastercms as its replacement and which carries most of the project's downloads (8954 total on 2026-10-20). An abandoned package that names its replacement is a move, so the status stays accepted. The Windows install page on coastercms.org still names web-feet/coastercms. The repository is not archived, and coastercms/coastercms is not abandoned. The maintainer name comes from the contact page, which also gives the address under Web-Feet.co.uk Ltd; no legal form beyond Ltd is stated, so the import derives maintainerType. The docs show only php artisan serve for local use and no deployment page, so runsAs is not recorded. The license is stated two ways: composer.json and Packagist say GPL-3.0-or-later, GitHub detects GPL-3.0.
