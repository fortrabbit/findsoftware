notes: >
  The homepage links the X account only as http://x.com/antdesignui, so x is not recorded (https is required); its Medium and StackOverflow links are http as well. The LICENSE copyright line names Ant UED; the homepage says the library is made by Ant Group and the Ant Design community, a credit that is not a legal name, so it is not recorded as maintainer. The introduction page says React is used to encapsulate the component library and that the community is welcome to implement the design system in other front-end frameworks. Stable releases: 6.6.8 is the highest stable tag, published 2026-10-26; the newest prerelease, 5.30.0-guidelines-alpha.1, is older than that and sets no latestPrereleaseDate. First npm upload is 2015-06-23 and first GitHub release 0.7.0 on 2015-07-21. The npm weekly figure is the sum of daily downloads for 2026-10-18 to 2026-10-24 from the range endpoint, because the last-week endpoint returned the window 2026-06-25 to 2026-07-01. The introduction page says antd is intended to be used with a build tool and strongly discourages loading the whole script files in a browser, while describing script and link tags as a way to import it. The HTTP Archive figure is the mobile origin count for the "Ant Design" entry. The introduction page states that antd provides a built-in TypeScript definition, so @types/antd is not needed. The environment table on the same page lists the supported browsers and server-side rendering, and records dropped support for IE after antd 5.0 and for React 16 and 17 after antd 6.0.
