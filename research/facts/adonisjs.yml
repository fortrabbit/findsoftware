notes: >
  The homepage says "374 contributors and 38 sponsors"; the GitHub API count for the core repository is 75 with anonymous contributors included, so the figure recorded is the API count and the site figure is not recorded. The site lists AdonisJS Plus (paid starter kits and components) and Adocasts (paid video courses); neither has a price on the page read, so paidEditions stays unknown; Plus is not a plugin directory and is not recorded as one. The installation page names starter kits as values of --kit; the starters list is the official ones, and the community kits Slim and MCP are not recorded. The docs state Node.js 24.x or later and npm 11.x or later; runtimeMin records the major version. The deployment page lists Nginx, Caddy, Traefik and Apache as reverse proxies and Amazon S3, Cloudflare R2 and Google Cloud Storage for uploads, with no named host. The field templating records edge and Inertia.js starters, which is a coined value set; the starter list has no separate frontend field.
