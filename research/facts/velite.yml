notes: >
  The homepage and introduction say the documentation "is not yet complete", which is a warning from the project and not a fact field. The LICENSE names the copyright holder as "zce" with an email address and links https://zce.me, the author's site, which gives the name Lei Wang; the record uses that name, and the email is left out. The homepage footer reads "© 2026 Lei". The CLI has a build command and a dev command that rebuilds on changes. The project is ESM-only, as its quick start states. The npm package "velite" carries a 0.0.0 upload dated 2021-01-17, before the repository was created in 2023, so firstRelease is taken from the oldest stable GitHub release, v0.1.0; earlier tags are alpha, beta and rc builds. The Node floor is the major of the 18.20 the quick start states; the npm engines field reads ^18.20.0 || >=20.3.0. Releases are tags only; the latest stable is v0.4.0 and the newest pre-release is v1.0.0-alpha.3.
