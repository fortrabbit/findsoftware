notes: |-
  GitHub reports the repository license as NOASSERTION; the LICENSE file and the npm package both say MIT, and both are recorded. The repository is a monorepo: the install docs name @microsoft/fast-element, the core package at major 3, and the figures are for it; its latest stable tag is 3.1.2. The npm package @microsoft/fast-components is deprecated on npm ("Package no longer supported") and @microsoft/fast-foundation is not; neither is the package the install docs name, so neither carries figures here. The homepage lists Fluent UI as a showcase; @fluentui/web-components is named in the README as built on fast-element and is a separate project. The firstRelease is the oldest v-tag in the repository (v1.2.0, committed 2018-05-10). The copyright holder and the maintainer are the same company. The homepage's Medium link is a blog, not a field. The docs' 1.x and 2.x sections are older versions. The introduction page says FAST is built directly on the W3C Web Component standards and does not create its own component model. The README says FAST Elements can be used with any front-end framework or even without one. The quick-start guide assumes a browser bundle built with TypeScript through a build tool such as Vite or Webpack. The quick-start guide says FASTElement extends the standard Web Component APIs with additional features on top of them, and the README says @fluentui/web-components is built with @microsoft/fast-element and lives in the Fluent UI monorepo.
   The browser support page says the FAST Element client runtime expects a browser Window environment and that worker and server-side JavaScript runtimes are outside its supported runtime boundary, so no runtime or runtimeMin is recorded. The server-rendering page says servers emit HTML and hydration markers while the client runtime stays in the browser. The x link is the Twitter entry in the homepage footer (href https://twitter.com/FAST_UI), which has no readable text to quote.
