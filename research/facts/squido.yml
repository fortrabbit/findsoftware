notes: >
  The project has no GitHub releases and no tags; currentMajor is 1 from the npm latest tag 1.0.26. The repository's default branch is main. The install docs name npx mrvautin/squido for the README commands and npm install -g squido on the docs site; the registry package squido is the one recorded. The docs site lists plugins, a Swagger API docs feature and a demo blog; none is recorded beyond what fields hold. The product page says the project is free to host on Netlify or GitHub Pages; no price or hosting plan is recorded. The homepage Netlify and GitHub Pages instructions sit on the deployment page, which says the site can be hosted anywhere static websites are supported. The "Built : /my-website/build/index.html" line is an example command output on the product page; it is the only statement of the build directory, so outputDir is recorded as build from it. The runtime line in the README is the only Node statement and it sets 18 as the minimum. The repository was last pushed 2024-06-23 and the last npm publish is 2023-12-16; no end statement or deprecation was found, so the record stays listed.
