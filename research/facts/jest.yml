notes: >
  Status accepted. Criterion 1: the project's homepage describes a JavaScript testing framework used to test JavaScript codebases, and the framework runs tests on Node.js. Criterion 2: MIT-licensed on GitHub, installed from npm. Criterion 3: the getting-started page gives the npm install command. The jestjs/jest repository is a monorepo; stars, contributors and the license belong to the whole repository, and the npm figure is for the jest package the install page names. The npm jest package was first published in 2012 under another author's project (Empeeric, a REST layer, version 0.0.6), so firstRelease is taken from the oldest Jest tag, 0.4.19, whose commit is dated 2015-08-14. The LICENSE names Meta Platforms, Inc. and affiliates; the homepage footer says Copyright OpenJS Foundation and Jest contributors, and the footer names the OpenJS Foundation as a foundation with its bylaws and trademark policy, which is hosting, so the foundation is recorded here and not as maintainer. The homepage's Community section links Reactiflux, a general React community chat, and Stack Overflow's jestjs tag page; neither is the project's own forum or chat, so no forum or discord fact is recorded. The homepage Twitter link is the x fact. The runtimeMin comes from the engines range the npm registry gives for jest 30.5.2 (Node 18.14 minimum). The getting-started page names yarn and pnpm forms of the same npm install and they are one route. The CLI page says Jest assumes it is running in a CI environment under the --ci option, which is the runsAs local statement. The homepage says Jest works with Babel, TypeScript, Node, React, Angular and Vue; those are projects it tests, not a binding of Jest to a framework, so no basedOn is recorded.
