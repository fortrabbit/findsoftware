notes: >
  The crates.io name tako belongs to another project (its repository is tako-sh/tako, an SDK for tako.sh, latest 0.2.1), so the crate recorded is tako-rs, the name the README and the crate's repository field give for rust-dd/tako. The crate's total downloads are recorded; the figure is all-time. The highest stable GitHub release is v2.5.0 (2026-10-19), which matches the crate's newest version. The GitHub release list holds a tako-v.0.1.0 tag from 2025-06-23 as its oldest release, and the crate's first version is dated 2025-06-21, so firstRelease is 2025 either way. The maintainer is the README's own statement, "by the Tako contributors"; the LICENSE copyright line reads "Copyright (c) 2025 Daniel Boros / Rust-DD" and the README names no legal entity. The homepage, the deployment page and the Tako vs Axum vs Actix Web page were read in full text; the benchmark numbers are not recorded. The quickstart page says the default feature set is HTTP/1.1 on Tokio and that several protocols are opt-in features, which is not a field. No database, template engine, admin interface or pricing page appears in the pages read.
