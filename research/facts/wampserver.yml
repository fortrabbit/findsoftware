notes: >
  Stub: the official site www.wampserver.com answers a "Site retired" page that says it has not been hosted there since 27 October 2026, the day before this check, while the SourceForge project is alive (the add-on file list shows PHP add-on uploads on 2026-10-28, and the main installer folder is current). A stated end of the project, or a new official site, would settle whether the software is still shown by its own project. No homepage is recorded. Facts come from the SourceForge project page and file lists only. The SourceForge summary also says "free (under GPML license)" next to the GPLv2 entry in its license field; the two are not reconciled here and only the SourceForge license field is recorded. The SourceForge page names the accounts alterway, herveleclerc, neustradamus and otomatic as the people the project is brought to you by; none is a legal name, so no maintainer is recorded. The date and major come from the main installer file in the WampServer 3.0.0 folder; add-on and application uploads after it are not releases of the installer. The summary says WampServer is not compatible with Windows XP, SP3 or Windows Server 2003. SourceForge user ratings and reviews are not recorded.
