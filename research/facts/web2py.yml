notes: >
  The CSV lists http://www.web2py.com; that address redirects to https://www.web2py.com/, which answers 200, so the https address is recorded. The GitHub homepage field and the CSV both give the http address. The highest stable GitHub release is v3.1.1 (2025-12-22) and the highest release of v2 is v2.27.1 (2025-12-22); tags v3.3.1, v3.3.2 and v3.3.3 exist without GitHub releases, and the homepage shows "Current version: 3.3.3-stable", so latestReleaseDate is the date in the homepage's current-version string (2026-04-28), which names 3.3.3 as current. currentMajor 3 is the same either way. GitHub reports no license (the repository has LICENSE.web2py.txt, not LICENSE). The README says web2py 3.x "is in limited maintenance mode" and "We do not recommend using Web2py for new projects but we recommend upgrading to py4web", and the homepage says "We recommend users move on to web2py's successor py4web". The project is still maintained (the default branch had a commit on 2026-10-26), so no status signal is recorded; the status question is for a reviewer. py4web is recorded as alternativeTo only because the project's own README names it as the upgrade path. firstRelease 2007 is the README's statement that web2py "was created in 2007"; GitHub's oldest release is R-2.0.2 (2013), and the repository's own CHANGELOG could not be read at the root. The DAL chapter names more backends (Firebird, Oracle, IBM DB2, Informix, Ingres); only the four in the quoted sentence are recorded. REST is not named; the services chapter lists XML, JSON, RSS, CSV, XMLRPC, JSONRPC, AMFRPC and SOAP, so headlessApi is not recorded. The Windows binary "works out of the box" with four databases; the quote is kept to that statement. The appliances page at web2py.com/appliances lists community example applications, not plugins, so pluginDirectory is not recorded. The contributors count is the rel=last page of the contributors endpoint with per_page=1. The social link x points to twitter.com/web2py/ and is an anchor with no visible text, so it has no quote. The homepage describes the install as including a "fast multi-threaded web server", which the prose relies on for the built-in server.
  The prose also relies on the README, which says "To start web2py there is NO NEED to install it. Just unzip and do:" and gives the startup line python web2py.py.
