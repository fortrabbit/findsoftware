notes: >
  No repository and no installable software: the control panel is hosted, so criterion 2 is waived for hosted-service. The homepage describes the product as self-managed hosting on the customer's own servers, and the pricing page lists Vultr servers and PeakFreq managed servers as the places sites are hosted; the install method is the provisioning command that the knowledge base says to run as root on the user's own server, after the server is created at a provider. The copyright line gives the maintainer as GridPane, Inc; the privacy notice's Michigan address is for GridPane, Inc. No license or terms for the software itself were found: the terms of use cover the website and its content only. Pricing: plan names and the free Core plan are recorded without prices. The Facebook group link (facebook.com/groups/selfmanagedwordpress) is a community group and is not recorded as the facebook field. A status page (status.gridpane.com) is linked from the homepage and is not a field. The knowledge base lists migration guides (Migrate Guru, All in One WP Migration) under "Migrating to GridPane"; they describe moving sites to GridPane and are not recorded as importsFrom because the page names WordPress migration tools, not an import from other hosting software. userRoles is not recorded: the privacy notice lists "team members and their roles" as account data, which is one clause and no feature statement. The database page names two types, Percona and MariaDB, for servers on Ubuntu 26.04; only MariaDB is in the databases vocabulary and Percona is recorded here. The features page names built-in API support for DigitalOcean, Vultr, Linode (now Akamai), Amazon Lightsail and UpCloud, and says GridPane can also be deployed to providers like Google Compute Engine, Hetzner and OVH with one command on a custom server. Fields coined here: none.
