notes: >
  Maintainer: the LICENSE-MIT copyright line names Tsang Hao Fung; the README and the org site name SeaQL.org as the independent open-source organization behind SeaQuery and SeaORM, and no page on the org site gives a legal name, country or address, so hqCountry stays unknown. The org site has no SeaQuery page (sea-ql.org/SeaQuery returns 404), so homepage is the SeaQL organization site named as the GitHub homepage; the software is documented on docs.rs and in the README. Dual license: README lists Apache-2.0 and MIT as two entries. The GitHub license detection reads NOASSERTION, the crates.io license field reads "MIT OR Apache-2.0". Latest stable 1.0.2 is the highest stable release of the repository, the crate's main package (sea-query-derive and sea-query-rusqlite are separate tags in the same repository). The 1.0.0 release is dated 2026-05-30 and the 1.0.0 release candidates are older prereleases; the crates.io download figure is all-time total. Install: the README's Install section is a Cargo.toml block and the only route; the quote is that dependency line without reading the version as a fact. MS SQL Server support is named on the README as available under SeaORM X, a separate closed-beta product, not recorded as a database here. The SeaQuery README says SeaQuery is the foundation of SeaORM; that statement belongs to the sea-orm record (basedOn sea-query) and is not a basedOn here. Stars and contributors belong to the single repository. The SeaQL site footer also links a LinkedIn company page, which has no field here. The README mentions integrations with SQLx, postgres and rusqlite; these are integrations, not a basedOn statement.
