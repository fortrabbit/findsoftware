notes: >
  Status accepted per the CSV row; the record stays on criterion 1 as a local development environment for web developers, the category the brief names for build-dev. Operating systems are Windows 10, Windows Server 2016 or later, on NTFS; the README says Linux, macOS and 32-bit systems are not supported. The site's English pages say the project is non-commercial and distributed free of charge; the paid items are voluntary support and a paid download-speed service, which are not editions and are not recorded as paidEdition. The license is stated two ways: the repository LICENSE is the MIT License with copyright 2010-2026 Open Server Panel Dev Team, and the site's license agreement grants free use without license fees for an unlimited time; GitHub detects the repository license as NOASSERTION, not MIT. The license field records both wordings, Freeware is not an SPDX id, so the reviewer decides whether the second entry stays. The site says the project was first written with a Ukrainian programmer and moved to the ospanel.io domain in 2016; no dated first release was found, so firstRelease is left out. The footer copyright is "2010-2026 OSPanel.io"; the privacy page names the operator, an individual entrepreneur (sole proprietor) with a business address in Belarus, recorded as maintainer and hqCountry; the LICENSE copyright line names "Open Server Panel Dev Team". The repository contains an Inno Setup script and configuration folders, not the Delphi program source; sourcePublic is left out for the reviewer. The GitHub releases list has one release, v6.5.1 from 2026-03-19. The reportedInstalls figure is the homepage counter labeled "Total downloads"; it changes with every download, so it carries no quote. Telegram chat and the GitHub discussions are community channels without a field.
