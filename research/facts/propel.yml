notes: >
  Status accepted from the CSV. Criterion 4: the GitHub repository is not archived, the Packagist package is not abandoned, and the newest stable release is 2.0.1 (2026-08-21). Criterion 3: the installation page gives the Composer route. The Propel2 repository's oldest tag is 2.0.0-alpha1 (2013-06-05), which sets firstRelease; the homepage says the Propel project started in 2005, and the 1.x line is not in this repository and was not checked. The installation page is stale: it says "PHP 7.4" and shows a composer.json requiring "~2.0@beta", while the 2.0.1 composer.json requires PHP >=8.0 and the README badge says >= 7.4; runtimeMin follows the manifest at the latest tag, and the stale page statements are not recorded. The installation page is the only source for the database list; the homepage names MySQL, SQLite and PostgreSQL for schema migration, a subset of that list. The composer.json homepage is http://www.propelorm.org/; the https address of the same site is recorded. The LICENSE copyright line names four holders (Hans Lellelid, David Zuelke, Francois Zaninotto and William Durand) with no "and others", and the Packagist author is William Durand; the maintainer is recorded as the project name Propel; the about page calls the team "a group of volunteers". The README lists Symfony components (Config, Console, Filesystem, Finder, Translation, Validator, Yaml) as requirements; that is a dependency, not basedOn. The homepage's "powers thousands of websites" and "over 10k users each month" are not recorded as reportedInstalls because they are not counts of sites with a source date. The homepage says the schema is written as XML or exported from an existing database with the database:reverse command, and that Propel provides a query-builder, schema migration and reverse engineering beside the ORM. The support page links the preferred Gitter channel, the CommerceQuest community forum (recorded as forum, without the tracking parameters of the link) and the GitHub issue tracker. The Packagist total download figure is cumulative since listing.
