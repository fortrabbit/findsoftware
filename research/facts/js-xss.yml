notes: >
  The CSV homepage http://jsxss.com answers 301 to https://jsxss.com/, so the https address is recorded; the site's own pages are under /en/ and /zh/, and the root address serves a script that redirects to /en/index.html. The repository's GitHub Pages site redirects to jsxss.com. The GitHub API reports the repository language as HTML, which does not describe the module; the language is JavaScript from the npm package. GitHub detects no license (NOASSERTION) while LICENSE carries the MIT text, which is the statement recorded. The npm package xss is the module the README names, and the repository is js-xss; the npm latest version 1.0.17 has no GitHub release object, and the newest tag is v1.0.17, so the registry version sets currentMajor and latestReleaseDate. The npm engines field says ">= 0.10.0" for Node.js, which sets runtime node and runtimeMin 0.10 as the stated minimum. The README names both the browser (script tags in its On Browser section) and Node.js, so no runsAs value is recorded. The README's Install section has an NPM and a Bower heading, each with its command, which are the two installMethod entries; the site's Quick Start page is the docs link. The README says that when the style attribute is allowed its value is processed by the separate cssfilter module (js-css-filter), a dependency and not basedOn; the module includes a default CSS whitelist. The README and the site also document an xss command line tool that processes HTML files, which is a side feature, so no runsAs is recorded for it. The README's "They are using xss module" list (nodeclub, cnpmjs.org, cocalc.com) names users without counts, so reportedInstalls is not set. The README benchmark compares the module with the validator package for reference only, which is no alternativeTo statement. The site's Community page lists only the GitHub issue tracker. firstRelease is 2012 from the npm upload of 0.0.1 on 2012-09-19; the oldest tag v0.0.5 is dated 2013 and the repository was created in 2012. The npm weekly figure is the sum of the daily figures for 2026-11-08 to 2026-11-14.
