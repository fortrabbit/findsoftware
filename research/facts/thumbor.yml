notes: >
  Accepted, with the image-server rules: output formats, image library and URL signing are in notes only. Output formats: the homepage says "Thumbor supports webp" and lets browsers that accept WebP receive it automatically; no other format is named on the pages read. Image library: the master pyproject.toml lists Pillow as a dependency, and the README offers an optional OpenCV extra ("pip install thumbor[opencv]"); the detection docs were not read in full, so the library is not recorded as a field. URL signing: the README and getting-started page show the "unsafe" path segment for local tests; the signing key mechanism was not read in full and is not recorded. Storage: the homepage says thumbor "comes packaged with file, http, redis and mongo implementations for loaders and storages"; these are image storage backends, so databases and contentStore are not recorded. The Docker image is on GitHub Container Registry and is not a Docker Hub figure, so dockerPulls is not recorded. The docs state "Current thumbor releases require Python 3.11 or newer", while the manifest at the latest tag 7.8.0 says requires-python >=3.10 and PyPI shows >=3.10; runtimeMin follows the manifest at the latest tag, and the 3.11 docs line is for a reviewer to decide. The homepage says thumbor is "trusted by hundreds of companies worldwide" in the README; no count is recorded. The homepage https://thumbor.org/ does not answer over https (no response to a bare-domain request); the record uses the https address www.thumbor.org, which answers, and the http request for thumbor.org redirects there. The maintainer is Globo.com as the LICENSE copyright names it; the legal entity and country are not recorded because no imprint page was read. Repository and release dates: the highest stable GitHub release is 7.8.0 (2026-05-30), not a prerelease. The oldest tag is 0.1.0, whose commit is dated 2011-03-21, so firstRelease is 2011; the oldest release is 3.11.1 (2013), and the tag is older. The GitHub repository was created in 2011. The README states "thumbor is an HTTP server" and the getting-started page says to "start the process with thumbor in a console"; runsAs is always-on from the README sentence. The pypistats figure is the last month's count (16614), and last week's count is 6316.
