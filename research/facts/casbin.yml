notes: >
  Apache Casbin is an Apache Software Foundation project in incubation ("Apache Casbin (Incubating)" in the NOTICE); the maintainer follows the NOTICE copyright line, The Apache Software Foundation, as the other Apache records do; the NOTICE also names "The casbin Authors" for portions originally developed by the Casbin project. The repository apache/casbin is the Go edition; the README table lists sibling ports (jCasbin, node-casbin, PHP-Casbin, PyCasbin, Casbin.NET, casbin-cpp, casbin-rs) that are separate candidates, not basedOn. The Go module is github.com/casbin/casbin/v3 and has no download figure, so no registry figure is recorded; the ecosyste.ms counts are the only adoption figures. The go.mod at the latest tag has no go line, so runtimeMin is absent; runtime is go from the README sentence naming it a library for Golang projects. The homepage lists the storage backends; Redis, Cassandra and AWS S3 are outside the database vocabulary and are not recorded. The docs' adapter page lists MySQL, PostgreSQL, SQL Server and SQLite3 for third-party SQL adapters, which are separate packages beside the core library. The README says a web-based UI for model and policy management exists at docs/admin-portal; it is a separate tool, not part of the Go module, so adminUi is left out. The README says the core does not do authentication or manage users; no userRoles fact is recorded. The Discord link is a README badge, quoted as its markup. The homepage says "Hundreds of projects use Apache Casbin", a rounded claim with no count, so reportedInstalls is not recorded. Major 3 is the highest stable GitHub release line (v3.11.0, 2026-08-20). The oldest release is v0.0.1 (2017-04-13). Contributors counted with the per_page=1 last-page method.
