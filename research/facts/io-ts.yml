notes: >
  The package needs fp-ts, which the README names as a peer dependency; a dependency is not basedOn, so none is recorded. The README's stable features are the index module, and the experimental modules (Decoder, Encoder, Codec, Eq, Schema) from version 2.2 are described as backward-incompatible with the stable ones and at risk of changing without notice; the README says so, and no record field covers it. The GitHub topics name runtime, types, typescript, inference and validation; the category is recorded from the homepage sentence about validating types at runtime. The CSV row also lists schema; it is left out because the only schema is the experimental Schema module, which the README says is an advanced feature in flux. The latest release (2.2.22) and the last push are both dated 2024-12-10; the npm latest tag is the same version and the package is not deprecated. The oldest tag is 0.0.1, dated 2017-02-01, which matches the npm first upload. The repository holds 109 tags.
