notes: >
  The docs URL docs.elastic.co/search-ui redirects to elastic.co/docs/solutions/search/site-or-app/search-ui. Monorepo: the npm figures and npmName are for @elastic/search-ui, the core package the install line names first; the React and Views packages are separate packages and their downloads are not counted. The npm figure counts downloads of the core package from every install route, as the install docs name it. GitHub reports TypeScript as the repository language; the docs call the library JavaScript, so the record lists TypeScript from the repository and the docs wording stays in the description. Elastic describes the library as headless: it separates logic from presentation, offers built-in React components or custom ones built from the ground up, keeps searches, paging and filters in the URL, and works with React, vanilla JavaScript or any front-end framework; the docs name no built-in basedOn parent, so basedOn is absent, and no page says it runs in the browser, so runsAs is absent, a reviewer decision. Connectors named on the docs: Elasticsearch and Elastic Site Search (Swiftype). The docs say "Important Enterprise Search is not available in Elastic Stack 9.0+", a statement about Enterprise Search, not this library. The App Search and Workplace Search tutorials are marked deprecated; that is a tutorial status, not an end signal. Releases: the highest stable GitHub release is v1.24.2 (2025-08-05), major 1; the oldest GitHub release is v0.5.0 (2019-03-06) and the oldest npm upload 0.1.0 (2019-01-03), so firstRelease is 2019 either way. The README says "Maintained by Elastic, the team behind Elasticsearch." The legal name Elasticsearch B.V. is from the docs footer copyright line; the privacy statement names Elastic N.V. as the group company, not recorded as parent because no page states that Elasticsearch B.V. is its subsidiary. The terms of use name offices in Amsterdam, which is no registered-seat statement, so hqCountry is absent.
