notes: |-
  The project's homepage https://www.rooftopcms.com answers 200 with an empty body and the docs URL redirects back to it, so no homepage is recorded and both pages are listed as unreadable. The repository lists http://www.rooftopcms.com, which redirects to the https address; the empty page is the reason it is not linked. The README is the only readable project page and says "Rooftop CMS is no longer supported or maintained" and points to the WP REST API and WP-GraphQL plugins as the replacement; that is the end statement, and the repository is archived (archived true from the API, last push 2022-04-04). The repository has no GitHub releases; its tags run from 0.0.1 (commit dated 2015-09-11) to 1.2.6 (commit dated 2019-09-19), so the highest tag is used for currentMajor and latestReleaseDate, and firstRelease is the year of the oldest tag. The GitHub description calls it an API-first WordPress CMS, which is recorded as basedOn WordPress. The install steps, runtime and content store are not stated on any readable page: the README is 222 bytes and the wiki holds no install page, so criterion 3 is not judged and the record is discontinued without them. The maintainer is the GitHub organization that owns the repository, since no page names a legal entity; the GPL-3.0 LICENSE file carries only the Free Software Foundation boilerplate.
   The GitHub organization description reads "Rooftop CMS was a hosted API-first WordPress implementation. It has been superseded by native WP functionality.", so a hosted service existed next to the code; nothing about it is recorded and no prices. GitHub reports the repository as mostly Ruby (deploy tooling) with PHP and Shell, which does not state what the CMS is written in, so language is unknown. Criterion 3 is in doubt: no readable page holds installation steps; the record stays discontinued because of the end statement.
