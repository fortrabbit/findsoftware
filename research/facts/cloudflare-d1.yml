notes: >
  Cloudflare D1 has no public repository of its own; the workers-sdk repository holds Wrangler and the client tooling, which the hosted-service rules take nothing from. The record sits on the D1 docs at developers.cloudflare.com, whose overview names it a managed serverless database for Workers and Pages projects. Plans: the overview says it is "Available on Free and Paid plans" and the pricing page is linked without prices. The Free plan and Workers Paid plan limits differ (database size, storage, queries per invocation); only the query limit is recorded as apiLimits, and the database-size and storage limits are on the limits page for the reviewer to add if wanted. Data location: the default placement is automatic, and a database can be restricted to the European Union or to FedRAMP-compliant data centers; this is recorded under regions. The firstRelease year is the public beta in the changelog (2023-09-28); the changelog shows a legacy alpha before it and no general-availability date, so the reviewer decides whether a beta counts as a first release. The maintainer legal name and the headquarters city are from the website terms (Cloudflare, Inc., 101 Townsend St, San Francisco); the terms also name California law, so the country is taken from the company address. Plans are stated on the overview as "Available on Free and Paid plans"; no installation route exists, so no installMethod is recorded. Coined fields: none. The read-replication feature is in beta on the changelog and is not recorded as a field. 
