notes: >
  The project's site answers only over plain http (http://cppcms.com serves the wiki; https://cppcms.com does not connect), so no homepage and no docs link are recorded; the wiki pages are cited over http as sources. The home page labels the 2.x.x line as stable. The home page labels the 2.x.x line as stable and links it to the page titled "CppCMS 1.x.x - Stable"; the documentation page's own title says 1.x.x, so the version is taken from the GitHub release v2.0.1 (2025-11-02), the highest stable. GitHub reports the license as NOASSERTION; the repository's COPYING.TXT and MIT.TXT state MIT, and the project's home page says MIT from version 1.2 on, so licenses before 1.2 are not stated and not recorded. The build page lists a C++ compiler, zlib and PCRE as mandatory and ICU and gcrypt or OpenSSL as recommended; these are not recorded as databases or fields. The project describes itself as a framework and not as a CMS, so categories is framework. The project has no package in a registry in the sources read. The first version in the changelog with a date is 0.99.1 of 2010-06-24; the GitHub tags start at v1.0.5 of 2014, so the changelog date is used.
