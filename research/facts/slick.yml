notes: >
  The repository has no homepage on GitHub and the README names no website, so no homepage is recorded; the Hackage home page field points to the README on GitHub, which is the repository. The README calls slick the spiritual successor to the author's SitePipe project; SitePipe is not a candidate, so successorOf is not recorded. The repository has no GitHub release or tag; currentMajor and latestReleaseDate come from the Hackage package slick, the registry's stable version. The install steps, the build command and the output folder (docs) come from the slick-template repository the README links, not from slick itself. The basedOn value is Shake because the README says slick provides tools for building static websites on top of the Shake build system. Per the README, content is read with Pandoc (Markdown or LaTeX) and templates are Mustache. Hackage shows no download figure. The LICENSE copyright line names 2018, and the GitHub license field reads BSD-3-Clause.
