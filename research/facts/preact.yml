notes: >
  Stable releases on GitHub run 10.29.8 (2026-08-01) and then 11.0.0 (2026-09-30) and 11.0.1 (2026-10-08); currentMajor is 11. The npm package preact has 11.0.1 as latest, MIT, and no deprecation flag. The LICENSE copyright names Jason Miller while the GitHub owner is the preactjs organization; the maintainer is recorded as the LICENSE states it. The homepage describes Preact as a fast alternative to React and the getting-started guide describes an aliasing route for React code (preact/compat); that is a factual relationship and does not make Preact basedOn React. The getting-started page says Preact "is packaged to be used directly in the browser" and the no-build route imports from esm.sh; the pages read do not say browser-only, so runsAs stays unknown. No engines field is declared on the npm package, so runtimeMin stays unknown. The bluesky and twitter links are from the homepage footer.
