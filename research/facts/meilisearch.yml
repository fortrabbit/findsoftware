notes: >
  The license is stated two ways. The LICENSE file names MIT for the code and BUSL-1.1 for Enterprise Edition parts, and the pricing page names MIT for the open-source server. GitHub reports the license as Other (NOASSERTION), so the API value is not recorded. The hostedService field is coined here for the Cloud offer beside the self-hosted server. The Cloud pricing figures on the pricing page are not recorded: they are plan prices that change, and the page presents them as an estimate. The npm package meilisearch (0.62.0) is the JavaScript client, not the server, and is not used as the version source. The docs page says Meilisearch is written in Rust and gives Linux glibc 2.35+, macOS 14+ and Windows Server 2022+ as OS requirements.
