notes: >
  The documentation site mobile.ant.design answers 200 but serves a JavaScript shell for the homepage and the quick start guide, so both are listed unreadable; the homepage value is the repository's linked "English Doc" address, and the docs field points there too. The README is the readable source: it gives npm install antd-mobile, the four feature statements (fast, customizable through CSS variables, atomic, fluent), and the Discord invite. The README does not name the framework; the docs FAQ in the repository (docs/guide/faq.en.md) says antd-mobile itself only supports the React stack, which is the basedOn statement, and the quick-start page gives compatible React versions. The same docs hold an i18n page listing supported locales, a pre-built bundles page for UMD files on unpkg and jsdelivr, and an SSR page that marks server-side rendering support as experimental and in an initial stage. The npm package antd-mobile is the one the README installs; its first publish on the registry is 0.0.0 on 2016-07-13, earlier than the first GitHub release 0.7.0 on 2016-07-29. The highest stable GitHub release is v5.43.0, published 2026-09-14; the newest prerelease, v5.0.0-rc.28 from 2022, is older and sets no latestPrereleaseDate. The npm weekly figure is the sum of daily downloads for 2026-10-18 to 2026-10-24 from the range endpoint, because the last-week endpoint returned the window 2026-06-25 to 2026-07-01. No HTTP Archive technology entry matches this package. The README lists its features as fast, customizable through CSS variables, atomic (each component does one job and nothing more) and fluent (gestures and animation), and says a CodeSandbox template can be used in the browser without a local setup. Only the CSS-variable, atomic and gesture-and-animation items are used in the record prose.
