notes: >
  The repository holds several artifacts: Hepek Components (a UI library with grids, forms and markdown rendering), Hepek SSG (the static site generator, the subject of this record), hepek-cli, and framework integrations for Sharaf, Play, Http4s and ZIO. The record covers the project as a whole, the way the homepage presents it, and the integrations are not recorded as separate fields. The SSG page says text is written with Scalatags and Markdown, and that Hepek SSG needs Node.js for code snippets and math, which is a build requirement and is not recorded as a runtime. The starter template hepek-starter has a Netlify deploy button; that is the starter's, not the project's, so deployTargets is not recorded. The maintainer is the copyright holder named in the LICENSE file. The Maven packages are not a registry in the list of supported registries, so no download figure is recorded. The first GitHub release is v0.14.0 (2023-10-26), a prerelease; tags for earlier versions exist, the oldest being 0.1.2, whose commit dates from 2018-08-06, and firstRelease rests on that tag. The highest stable GitHub release is v0.33.0 (2025-05-14); the tag v0.34.0 has no release. The current major is 0 for that reason.
