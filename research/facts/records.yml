notes: >
  The project names no website of its own: the PyPI homepage and the GitHub repository point to the same GitHub page, so no homepage is recorded. The README says the library is powered by SQLAlchemy and Tablib; that is a dependency named as a power source, not a basedOn statement, and neither has a record here. The README says database drivers are not included, so the drivers a user installs are outside this record. The README says rows read by column name, index or as a dictionary, query parameters are named, queries can be read from SQL files, and transactions and bulk queries are available; it also describes a command-line records tool for exporting queries, and export to CSV, XLS, JSON, YAML, HTML tables and Pandas DataFrames through Tablib; these are coined kinds and stay here. The README's installation line names pipenv; the install vocabulary has no pipenv value, so a reviewer may map the route to pip. The PyPI record states no requires_python, so no runtimeMin is recorded. The latest GitHub release v0.6.0 and the PyPI 0.6.0 upload are the same day. The first PyPI upload (0.1.0) is from February 2016, the same month as the oldest tag. The LICENSE copyright line names Kenneth Reitz with an email address, which is not recorded.
