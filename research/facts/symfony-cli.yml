notes: >
  The docs list HTTPS support for the local server, Docker integration and management of multiple PHP versions as the tool's features. The download page names Symfony CLI as "The Symfony CLI is a developer tool to help you build, run, and manage your Symfony applications directly from your terminal." and the docs call it "free and open source" under the AGPL-3.0 license file of the repository. basedOn symfony follows the download page wording that the CLI is a tool for Symfony applications; the CLI itself is written in Go. The repository symfony-cli/symfony-cli was created on 2021-12-30 and its first release is v5.0.0 on that day; the archived repository symfony/cli, whose description now reads "Repository for reporting issues related to the Symfony CLI", holds releases from v4.0.1 (2019-05-10), so the old project history sits in another repository and firstRelease follows the repository the project names as source; a reviewer may decide on 2019 instead. The archived symfony/cli names no end and the source repository is not archived, so no status signal applies. The download page offers "Symfony Cloud (powered by Upsun)" next to the tool; the cloud is a hosted service beside the open source CLI, and no price is recorded. The maintainer is the GitHub organization profile name "Symfony CLI", which the org profile lists with symfony.com as its website; no page names a legal entity or the sponsoring company. The contributors count is the last page of the contributors endpoint at per_page=1. No npm, Packagist or PyPI package is recorded because the install docs name a binary, not a registry package.
