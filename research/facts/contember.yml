notes: >
  The homepage now presents Contember Fabrika, a managed platform for company apps, and lists "Contember Framework" and "Contember Cloud" among its products; the open-source platform is still described by the README and the docs, so status stays accepted. Contember Cloud is the managed hosting next to the open-source engine, and the going-live page of the docs lists it beside self-hosting. The GitHub API reports the license as NOASSERTION; the LICENSE file says the content outside its third-party restrictions is Apache License 2.0, and the npm packages say Apache-2.0. The terms say Contember is incorporated and registered in Ireland and give a registered office in Dublin, but name no headquarters, so hqCountry is not recorded; the GitHub organization profile gives its location as the Czech Republic. The install docs name @contember/create, a scaffolder, which installs Contember Interface, so the core package @contember/interface is recorded; @contember/engine-server is a second core package with about 292 weekly downloads. The highest stable GitHub release is v2.0.2 (2025-03-26), and the npm package @contember/interface has a later stable version (2.0.8, 2026-07-14), so latestReleaseDate follows npm; latestPrereleaseDate is npm's 2.1.0-rc.4. The docs also mention Contember AI Studio, a hosted product. The x value is the Twitter link in the docs header, which the docs support text names. The docs call Contember Interface a React framework; no parent is recorded for that. Runtime is not stated: the install page names npm and Docker only.
