notes: >
  The record covers the open source part: the Encore.ts and Encore.go SDKs and the Encore CLI, under MPL-2.0 (the license page names the backend framework, parser and compiler), with the Docker self-hosting path. Encore Cloud is a hosted platform run by the same company, under the Terms of Service at encore.dev/legal, and is not recorded as a licenseModel, because its Terms of Service define a service and do not license the software; its plans are on the pricing page and are not recorded here. The legal entity in the terms and the about page is Encoretivity AB, Stockholm. The homepage and about page say the company was founded in 2021; the founding year is not recorded as firstRelease, and no first-release date was found. Two runtime entries: node (npm engines of the TypeScript SDK) and go (the self-host page names a scratch base image for Go apps and a compiled application); no Go version requirement was found, so runtimeMin is the Node major only. The npm encore.dev package is the TypeScript SDK; the install docs name the brew-installed CLI, so npm figures are the SDK package and not the CLI. The self-host page says the Docker image "runs your services" on port 8080 but "doesn't run database migrations or trigger cron jobs", for which the self-host page says to apply migrations separately and call each cron endpoint from your own scheduler. An app that uses databases, caches, Pub/Sub, object storage or secrets needs an infrastructure configuration file passed to encore build docker with --config. The pricing page names the resources defined in code as "services, databases, cron jobs, caches, storage buckets, Pub/Sub topics & subscriptions, and secrets". Provisioning in the user's own AWS or GCP account is an Encore Cloud feature: the pricing page lists "Deploy to your own AWS & GCP" and "Automatic infrastructure provisioning" under the paid Pro plan; the open source CLI provisions infrastructure locally (PostgreSQL in Docker). The npm figure is for the week 2026-10-12 to 2026-10-18. The candidate row shows 27k npm downloads a week; the current week reads 25216, so the row is stale. The GitHub API reports the license as MPL-2.0.
