notes: >
  In doubt: which line the project offers for use. The default branch is a pre-alpha v2 rewrite and the v1 line on the dev branch takes security fixes only; a v2 release that runs would settle it. The default branch is v2, a rewrite whose README says "Status: pre-alpha" and "Nothing runs yet", and whose SECURITY.md lists no security support until its first tag. Every fact here is read from the dev branch, the v1 line that the v2 README calls the previous version. The dev branch SECURITY.md says v1 receives "Security fixes only. No new features." That is a maintenance statement, not an end signal, so the record is held as a stub until v2 runs. The v2 README states ".NET 10" and a Blazor admin UI, and it describes the v1 line as having "no migration path" to v2; neither is recorded here. The GitHub releases end at v0.0.5 (2024-12-16) and are not on the default branch. LiteDB is named on the dev README as a supported database, but it is not in the databases vocabulary, so the import will drop it until the vocabulary gains it. The homepage and the dev README agree on the feature list; the homepage shows counts that are not recorded. The terms page and privacy page name Momentaj Inc., Richmond Hill, Ontario, Canada.
  The dev README says the project was created by Momentaj, a Toronto AI engineering firm, and lists a Blazor-based component library, a plugin system and a Blazor admin dashboard.
