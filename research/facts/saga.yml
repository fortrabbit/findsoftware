notes: >
  The LICENSE and the copyright line name Loopwerk without a legal form, so the maintainer is recorded as Loopwerk; a legal form and a country are not stated on the pages read, so hqCountry is unknown. The docs deploying page says the output folder is deploy by default, which is recorded as outputDir. The requirements name macOS 14 and Linux as well as Swift 6.0; the platform list is not a field and is left in the notes. The CLI lives in a separate repository, loopwerk/saga-cli, which the install docs name; it is not recorded as a separate record. The Saga 3 major is taken from the highest stable release 3.8.2, and the releases list has no prerelease tag. The README feature comparison with other generators is not recorded, since it compares rather than describes. Commercial support is available from Loopwerk, as the README states; it is not an edition, so paidEdition is not recorded. The getting-started page of the docs returned 404, so the install page is recorded for the docs field. The homepage links to GitHub, the Saga plugin packages and the Loopwerk support page, and names no social profile for Saga.
