notes: >
  The homepage says "Note: Neuron will soon be superceded by a next-gen successor", and the README, in a details block, says "Neuron is being superceded by Emanote" and links github.com/srid/emanote; the repository description repeats the successor. Both pages still describe neuron as the app to install and use, so this is a named successor and not an end signal under AGENTS.md; status stays accepted; emanote.yml records the succession as successorOf neuron. The latest stable GitHub release (1.9.35.0) is dated 2021-08-11, which the import reads as a stale release history; the repository was pushed in 2026. The Nix install is the development version. The static binary page says there is no static binary per se for the current version, offers a self-contained Linux executable built with nix-bundle, and describes a static binary of the last stable release for the older v1; none is recorded as an installMethod. The README links a Matrix room for chat, which has no field. The maintainer is the Author line of the Hackage package page; hackageName is a field coined here for the package id. The install page does not name Haskell as a runtime, so runtime is absent and the GitHub language field is recorded as language. The homepage, the README and the install page do not say the output is served by a live process. The Docker workflow is named on the install page without a source page, so it is named in installMethod only.
  The README lists a directory of markdown files, linking syntax, hierarchical tagging and editor integrations. The install page lists the commands gen, new, open, search and query, and says gen generates and serves the static site.
