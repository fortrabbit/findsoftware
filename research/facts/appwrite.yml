notes: >
  The home page announces "Appwrite 2.0" and the latest GitHub release is 2.5.0 (2026-10-13); currentMajor follows the 2.0 announcement. The license is BSD-3-Clause per the API; the LICENSE file names Appwrite as copyright holder. The "npm appwrite" package in candidates-appwrite.csv (24.6k per week) is the client SDK, not the server, so no npmName is recorded for the server. The pricing page lists dedicated tiers from Starter at $10/mo and serverless database compute from $10/mo per database; only the Starter tier is recorded in paidEditions, and the serverless tier is left out because its price is a per-database rate with overage. The self-hosting docs list minimum system requirements of 2 CPU cores, 4GB RAM and 2GB swap. The Docker Hub count is not read. Fields coined here: none.
