notes: |-
  The homepage is a Storybook shell whose text is rendered by JavaScript, so it is unreadable from the raw page; the homepage fact is quoted from the repository README, which links the same address as the documentation, and the docs pages were read from the repository's own MDX files (docs/introduction/2-getting-started.mdx, 3-component-lifecycle.mdx, 5-browser-support.mdx). The root README calls the project the SumUp Circuit Design System, which is recorded in the homepage fact; design-system is not a category value here because the package README states only the component library. The package is a monorepo: the install docs name @sumup-oss/circuit-ui, and the release tags for that package are the ones read for currentMajor and latestReleaseDate. The npm first stable version is 9.0.0 (2024-10-30); 9.0.0-next.0 was published 2024-08-19 as a prerelease, so firstRelease is 2024 on the stable line. The README names one maintainer, Connor Bär, a person; the maintainer field is the company, as the README's "Like all SumUp Open Source projects" states. The sumup.com legal page names two entities, SumUp Inc. in its footer and SumUp Payments Limited in its copyright line; neither is recorded as the legal maintainer and the reviewer should decide. The root README lists the sibling packages in the repository: design-tokens, icons, illustrations, and the ESLint and Stylelint plugins. The getting-started page says to import the fonts and design tokens before the component styles. The installation page also lists required peer dependencies (react, react-dom, @sumup-oss/design-tokens, @sumup-oss/icons, @sumup-oss/intl, temporal-polyfill) and the yarn command. The component lifecycle page sorts components into stable, internal, experimental, under review, legacy and deprecated; experimental and legacy components are imported from separate paths, which is recorded here only. The ecosyste.ms index lists no dependent repositories or packages for this scoped name, so the zero counts are recorded as the source states them. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header.
   The internationalization page says "Most translatable strings must be localized by developers and be passed to the design system components via props", with default translations for a handful of essential strings. The getting-started page offers app templates for Astro and Next.js. The package manifest declares engines.node as a minimum for installing the package; it is not recorded as runtimeMin because no page names Node as a runtime for the library. The sumup.com legal pages name SumUp Payments Limited (London, United Kingdom) and SumUp Inc. (Wilmington, United States), so hqCountry is left out.
