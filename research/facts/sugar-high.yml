notes: >
  Sugar High is a pnpm monorepo (huozhi/sugar-high) with the core package sugar-high, @sugar-high/react and @sugar-high/remark; stars and contributors belong to the monorepo, and the npm figures come from the core package the README install line names. GitHub detects no license (the repository root has no LICENSE file); the README's License section and the npm registry both say MIT, and the record uses those. The repository owner is the user account huozhi; the maintainer name is the account's profile name, Jiachi Liu, since the README and package.json name no other person. The homepage footer links the author's personal GitHub and X accounts, which are not recorded as project links. The README says the library runs in browsers and JavaScript runtimes and returns HTML without requiring a DOM; neither runtime nor runsAs is recorded because the sentence names browsers and JavaScript runtimes without naming one runtime. The benchmark on the homepage and README compares the core package with PrismJS and highlight.js; the benchmark is recorded as alternativeTo. The docs in the repository (API, benchmark, migration) are the project's own pages on GitHub; the API page is the docs link. The missing license detection is resolved by the README and npm statements.
