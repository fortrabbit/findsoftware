notes: >
  The homepage given in the CSV, https://cesium.com/cesiumjs/, redirects to https://cesium.com/platform/cesiumjs/, which is recorded. The LICENSE copyright line names CesiumJS Contributors, which is the maintainer recorded; the homepage footer reads "Cesium GS, Inc. 2026", a legal entity other than the copyright holder, so it is noted here and no hqCountry is recorded because the page gives no country. The README calls the platform open-core, with CesiumJS as the open source runtime and an optional commercial subscription to Cesium ion; the license fact says the library is free for commercial and non-commercial use, so licenseModel is open-source and the open-core wording stays here. Cesium ion is a hosted service next to the library and is recorded as hostedOffering because the README names it as the place to host and stream 3D tiles. The npm package engines field asks for Node.js 22.17 or higher; it is a build and tooling requirement for a browser library, so runtimeMin is not recorded. The version 1.147 is a monthly minor line; currentMajor is 1 as the semver major of the tag, and a reviewer decides whether the monthly line makes the major meaningless. The README links a Forum at community.cesium.com, recorded as the forum; the homepage also links a LinkedIn page, which has no field. The license is stated once in the README, as "Apache 2.0" there and Apache-2.0 on the repository. The repository has 224 tags; firstRelease is 2014 from tag 1.0, whose tag object is dated 2014-08-01, earlier than the oldest GitHub release (1.35, 2017) and the npm first upload (2014-11-08). The stars and contributors belong to the repository, which holds CesiumJS only.
