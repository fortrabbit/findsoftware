notes: >
  The homepage is the v3 development site, which lists the features used here. Stable documentation is under /v2/, whose download page names the stable release v2.44.1 (2026-10-07) and the install routes recorded as installMethod. The v3 line is only a beta on GitHub (v3.0.0-beta.2, 2026-10-18, prerelease), so currentMajor is 2 and the beta date is latestPrereleaseDate. The GitHub API reports Apache-2.0 as the repository license; Cargo.toml and the homepage state MIT OR Apache-2.0 and the LICENSE-MIT file is the MIT license, so one dual-license entry is recorded. Crate figures are not recorded: the footer links crates.io, but the stable install page names no cargo install route. dockerPulls is the Docker Hub count for joseluisq/static-web-server, which the Docker feature page names next to the GHCR image. The building-from-source page asks for a Rust toolchain, which is a build requirement and no runtime minimum. The footer Docker Hub link on the homepage points to the same joseluisq image. Runtime is binary (Rust, no runtime dependencies); runtimeMin is not recorded because the Rust toolchain needed to build is not a runtime minimum. The Windows Service statement is from the v2 page; the homepage v3 text says the same. Category is web-server only: the CSV's static category maps to ssg in the import. The maintainer is the individual named in LICENSE-MIT and Cargo.toml; the GitHub owner is the static-web-server organization. Contributors counted without anon across all pages (last page 54). The Docker images are joseluisq/static-web-server on Docker Hub and ghcr.io/static-web-server/static-web-server (Docker feature page). Fields coined here: none.
