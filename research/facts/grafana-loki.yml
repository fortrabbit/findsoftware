notes: >
  Accepted as a boundary row: the project's own pages document ingest endpoints that applications send log data to (POST /loki/api/v1/push, native OpenTelemetry log ingestion over HTTP), so it is a log ingestion endpoint an app sends to. The install page states that Grafana Loki does not come with an authentication layer and that a reverse proxy must be placed in front of it. Grafana Cloud is recorded as the hosted offering the homepage names; its free tier and plans are not recorded. The homepage states 66k+ active users; that is a user count, not an install count, and is not recorded. The firstRelease follows the oldest GitHub release v0.1.0 (2019-06-03), while the homepage says the project started at Grafana Labs in 2018. The repository's tag list includes operator tags (operator/v0.12.0); only the Loki tags are used for currentMajor and latestReleaseDate. The LICENSE file is AGPL-3.0 and the README wording is AGPL-3.0-only, the same license. The maintainer is the legal entity from the privacy policy; the Loki page names Grafana Labs as the lead of development. Coined kinds: httpApi, compatibleWith. The runtime go binary combines the docs' single binary statement with GitHub's language field. The alternativeTo entry follows the homepage comparison pages, which set Elasticsearch against Grafana Cloud rather than the open source edition; the Datadog and Splunk comparisons are not recorded. The dockerPulls figure is for grafana/loki, the image the Docker install page runs.
