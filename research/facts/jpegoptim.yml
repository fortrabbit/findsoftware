notes: >
  The homepage was http://www.iki.fi/tjko/projects.html in the candidates row; that address redirects to https://www.kokkonen.net/tjko/projects.html, which answers 200 over https, so the https address is recorded. The page is the maintainer's personal project list and the only page naming the project's own source archives; the project has no site of its own, and a reviewer may decide that this page is not a project homepage. The repository's main branch README (named README, no extension) says "Jpegoptim v1.5.7beta"; that beta has no GitHub release or tag, so it is no latestPrereleaseDate. The GitHub releases start at v1.4.7 (2022-04-13); the README history lists v1.0 as the first public release without a date, so firstRelease is the year of the oldest GitHub release and may be earlier. The COPYRIGHT file states "SPDX-License-Identifier: GPL-3.0-or-later" while the GitHub license and the LICENSE file are GPL version 3; one license in two wordings, recorded once in the COPYRIGHT wording. The man page is the usage source: it describes files given on the command line, so runsAs is local. Homebrew formula analytics (formulae.brew.sh, read 2026-10-28) show 4953 installs in 365 days for the jpegoptim formula, which is not a registry in the adoption list and is kept here only. The README requires the Independent JPEG Group's libjpeg version 6b or later (libjpeg-turbo or mozjpeg also named); that requirement is recorded here, not as a field. The maintainer's legal name is the copyright holder named in the COPYRIGHT file; no company or country is stated. The man page says that by default jpegoptim modifies the input files when they are optimized, and that the -d option saves the optimized files to another directory.
