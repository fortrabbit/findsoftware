notes: >
  The CSV homepage http://functionalprogramming.ro/scalatic does not resolve (curl exit 6, no DNS answer), over http or https, so the record is a stub without homepage, modelled on bowman. The GitHub repository has no homepage set. The LICENSE copyright line names Tom Preston-Werner (2015), which matches neither the repository owner padurean nor anything in the README and looks like a template leftover, so no maintainer fact is recorded. The README requires header.html and footer.html files in the source folder and links a Gitter chat badge. The README says the generator calls the GitHub API to render Markdown, so building needs network access to GitHub. The repository has one GitHub release, 0.1.0 (2015-07-02), with a single jar download. The GitHub contributors count is 2 with anonymous contributors excluded.
