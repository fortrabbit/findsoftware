notes: >
  The default branch is 5.x, and the repository has no GitHub releases. The stable release is the npm package 5.0.10 (2026-07-31), which the tag list also carries, so currentMajor and latestReleaseDate come from the registry. The npm "next" tag, 5.1.0-beta.40 (2026-11-02), is the latest prerelease. The first tag, 1.0.0, has a commit dated 2012-05-21; the npm package starts at 3.3.5 (2017-04-10), so firstRelease is the tag year. The LICENSE.txt copyright line reads "2010 - 2018" and the README reads "2010 - 2026"; both name Robin Herbots under MIT, so one license entry. The README's donation request ("be so honest to make a small donation") is no license term and no paid edition. The framework wrappers (@inputmask/react, vue, svelte, angular, jquery) are first-party packages that wrap the framework-agnostic core, so the record has no basedOn. The docs describe the vanilla dependency library, jQuery and jqlite; no sentence says it runs in the browser, so no runsAs is recorded. The category is forms, the nearest value for an input mask. The install routes quote the docs source Documentation.md,, and the npm route is quoted from the install command under the Module bundlers section. The npm weekly figure is the range for 2026-11-01 to 2026-11-07 of the inputmask package the install docs name; the CSV point figure was stale. Stars and contributors belong to the repository, which is not a monorepo.
