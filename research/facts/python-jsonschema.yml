notes: >
  The default branch is main. The v4.26.0 tag and the GitHub release of the same name are the newest stable release (2026-01-07, same date as the PyPI upload); the highest stable tag is 4.26.0, so currentMajor is 4 and the minor line is not recorded. The tag's pyproject.toml states requires-python = ">=3.10" and license = "MIT" (license-files COPYING); the COPYING copyright line names Julian Berman, who is the maintainer, and the README's About section says "I'm Julian Berman." The GitHub owner python-jsonschema is an organization, but the project's own pages name Julian Berman as the person behind it, so the maintainer stays the person. firstRelease is 2012: the oldest tag v0.1 is committed 2012-01-02, the same day as the oldest PyPI upload (0.1a), and the GitHub repository was created 2011-12-30 with no release before that. The README's Draft support (Draft 3, 4, 6, 7, 2019-09 and 2020-12) is spec compliance and is in notes only, as is the Features line on lazy validation that can iteratively report all validation errors. The README says the command-line tool is a separate package, check-jsonschema, and the Tidelift subscription is a support offer; neither is a field. The README's Community section names the JSON Schema specification's own Slack, a general community chat that is not recorded, and the project's GitHub discussions page, which is the forum fact. The pypistats figure is last_month as read on 2026-11-16; ecosyste.ms counts are the dependent packages and repositories of the jsonschema PyPI package. The contributors count is the page number of the rel="last" link on the authenticated contributors endpoint with per_page=1 (109).
