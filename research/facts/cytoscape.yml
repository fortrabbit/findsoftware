notes: >
  The homepage js.cytoscape.org is one long documentation page; the install, CDN and license statements are read from it, and the README at tag v3.34.4 is read in full. The default branch is unstable; the license statement and the MIT line come from the homepage factsheet and LICENSE. The LICENSE copyright line names The Cytoscape Consortium, and the README says the library was created at the University of Toronto, with no legal entity or country stated, so hqCountry stays unknown. The homepage says the library runs in "All modern browsers" and "Legacy browsers with ES5 and canvas support", and the README says it works "server-side analysis in a Node.js app or for a rich user interface"; both names are stated, so runtime is node and no runsAs is recorded. The homepage also lists a headless Node.js mode and Cytosnap for rendering images on Node.js; no separate statement sets a runsAs value. The README badge names a blog at blog.js.cytoscape.org (news and tutorials) and links its extensions badge to js.cytoscape.org/#extensions, which is the pluginDirectory; no count is recorded. The homepage lists the Amazon, Apache Software Foundation, Cisco and Elastic logos under "Big-name tech" as usage statements; they are not recorded as reportedInstalls. The homepage states "Used in commercial projects and open-source projects in production"; no count. The npm figure is the range 2026-10-26 to 2026-11-01; the CSV figure of 11.3k a week is a stale point count. The npm registry's first upload is 2.0.0beta1 on 2012-10-18; the oldest GitHub tags (2.0.x) were not dated, so firstRelease is taken from npm. The HTTP Archive technologies list has no Cytoscape entry. The contributors figure is the repository's count; the repository holds no monorepo packages.
