notes: >
  The npm figure covers 2026-10-26 to 2026-11-01; the CSV's 232.0M a week came from the stale point endpoint. The runtime is Node.js; the environments page also documents browser use with bundles on cdnjs, and no page says the library runs only in the browser, so no runsAs value is recorded. The runtimeMin comes from the README sentence "supports browsers and Node.js 18.x - current"; the npm manifest of the latest version has no engines field. The maintainer is the copyright holder named in the LICENSE file; the repository belongs to the ajv-validator organization. Companion packages the docs name are separate npm packages and are not recorded: ajv-cli, ajv-formats, ajv-keywords, and ajv-draft-04 (ajv-i18n is recorded under i18n) for draft 04 support. The README names chat on Gitter and SimpleX as badges, not a forum or a field. The project has sponsorship pages (GitHub Sponsors, Open Collective, Tidelift), which are not fields. firstRelease is 2015 from the npm upload of 0.0.4, and the GitHub tag 0.3.0 is also from 2015.
