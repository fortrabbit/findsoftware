notes: >
  Doubt: whether a host intrusion-prevention daemon belongs beside WAFs and reverse proxies, which the boundary rule admits only when its own pages say it protects websites or web apps. The README names sshd and Apache logs among its out-of-the-box inputs, and the project describes services in general; no page read says it protects a website or web app. The wiki's list of filters, read on its own pages, would settle it. The README names www.fail2ban.org as the project website; it redirects to https://github.com/fail2ban/fail2ban, so no homepage is recorded: the repository is not a project site. The README's runtime line, "Python >= 3.5 or PyPy3", is on master, and setup.py at tag 1.1.1 names no Python version, so runtimeMin is not recorded. The GPL wording is one entry: the README says "version 2 of the License, or (at your option) any later version" and COPYING is the GPL version 2 text. The THANKS file says Cyril Jaquier originally developed it until 2010 and that it grew into a community-driven project, so the maintainer is the GitHub organization and the type is community. The forum fact is the users mailing list the README names. The repository ships filters for Apache logs under config/filter.d (apache-auth, apache-badbots and others), which is not a statement that the project protects websites. No category value in the import map fits a host intrusion-prevention daemon; the categories fact is left for the reviewer. No PyPI package exists under fail2ban (pypi.org returns 404).
