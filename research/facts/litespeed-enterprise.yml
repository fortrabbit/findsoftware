notes: >
  No license name is stated on the pages read, so license is absent; licenseModel commercial comes from the choosing-a-license page, which says "LiteSpeed Enterprise (LSWS) is a paid for product" and names OpenLiteSpeed as the free open source product. OpenLiteSpeed is its own candidate (openlitespeed). paidEdition is recorded from the pricing page: the free Starter plan exists and the paid Web Host tiers add listener binding (from Professional) and anti-DDoS protection (Elite), named features rather than limits only; the same page is no price record. The plans differ in domain limit, worker count and memory, and carry prices, which are not recorded; the pricing page is the pricingPage link. The license plan names are Free Starter, Site Owner, Site Owner Plus, Web Host Lite, Essential, Professional, Enterprise and Elite. Installing needs a serial number or trial key in serial.no, and the install page says https://license.litespeedtech.com must be reachable from the server. The product page calls the server an Apache alternative and says LiteSpeed is not a frontend proxy; the only record of the server process is the release log's Systemd service line. The version line is LSWS 6.x (the release log headings run 6.4, 6.3 down to 5.4), so currentMajor is 6; stable 6.3.7 is dated 2026-09-23. The install page lists Linux and FreeBSD x86_64 enterprise builds. LSWS 6.4.0 RC2 carries the same 2026-09-23 date and is not newer, so no latestPrereleaseDate. The release log begins at LSWS 5.4 RC1 (2019-01-03), so firstRelease is not recorded. The about page names the company as LiteSpeed Technologies, Inc., founded 2002, headquartered in the USA and based in New Jersey; the docs footer reads LiteSpeed Technologies Inc. The product page links LinkedIn as well and no linkedin field is recorded. QUIC.cloud CDN and LiteSpeed Memcached are separate products in the docs and are not recorded as hostedOffering; the install page's "Set up LiteSpeed Web Server on Cloud" is a deployment option and is not recorded. Fields coined here: none.
