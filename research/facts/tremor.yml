notes: >
  The current docs install by copy and paste ("Tremor Raw", for React 18.2 and Tailwind CSS 4) and no longer name @tremor/react, so the npm package's figures are not recorded here: it is published from the separate repository tremorlabs/tremor-npm (not archived, last pushed 2025-01-13, npm latest 3.18.7, weekly downloads 284,466 for 2026-10-19 to 2026-10-25, 1,346 dependent repositories and 27 dependent packages on ecosyste.ms). The npm site npm.tremor.so still shows "npm i @tremor/react". lastCommitDate on tremorlabs/tremor decides criterion 4 because that repository has no release. The homepage and every page carry the banner "Tremor is joining Vercel"; the sentence says joining, so no parent is recorded. The homepage says "Build faster with 300+ Premium Blocks", while the blocks page says "Blocks & Templates are now free and open-source"; no paidEdition is recorded. The terms page gives a Dover, DE mailing address and a company registered in Delaware; no country is stated as the headquarters, so hqCountry is unknown. The Next.js and Vite guide pages returned 404 or "Updating Soon". The HTTP Archive technologies list has no Tremor entry. The homepage links the GitHub repository and an X account; no Discord, newsletter or Bluesky link was found. Radix UI and Recharts are named as building blocks on the homepage; neither is recorded as basedOn because the project names them as dependencies, and neither has a record.
