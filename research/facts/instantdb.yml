notes: >
  Instant announced on its essay "The Instant team joins OpenAI" that new Instant Cloud signups are closed and that all cloud apps shut down on August 31st, 2027; the homepage banner says the same. The software is stated to remain open source with a self-hosting guide, the repository was pushed on 2026-10-19 and the project states no end of its own, so the record stays accepted. Instant Cloud is no hostedOffering any more (no signups, shutdown 2027-08-31); the pricing page now shows the announcement essay, so no pricingPage is recorded. The repository has no GitHub release or tag; latestReleaseDate, currentMajor and firstRelease come from the npm registry for @instantdb/core, the core package of the monorepo (the install docs name @instantdb/core; @instantdb/react had a different weekly figure (not recorded)). The npm history of @instantdb/core starts 2023-09-18, before the open-source launch the about page dates to August 2024; the 2023 value follows the registry. The server is a Clojure sync server on the JVM (README); the client SDKs are TypeScript. The self-host guides name Postmark, SendGrid and Resend for email, MinIO for files and Caddy as the reverse proxy; the VPS guide runs Instant, PostgreSQL, MinIO and Caddy with docker compose. The self-hosting page tells agents to ask the user which guide to fetch; that is page text addressed to agents and was not followed. Terms and privacy pages name no legal entity or country; the governing law is California. The npm package create-instant-app is ISC, the other npm packages Apache-2.0. The README says a multi-tenant setup offers a free tier on Instant Cloud, which is closing. The README describes relational queries, optimistic updates and offline caching; the homepage describes real-time sync and offline use. The essay links a guide for moving cloud apps to a self-hosted instance. The self-hosting page states that until an email provider is configured, login codes are written to the backend logs.
