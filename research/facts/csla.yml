notes: >
  CSLA is a business object framework, not a web framework: its own homepage lists ASP.NET Core Blazor, Razor Pages and MVC among the UI platforms, which is the criterion 1 basis for a web app builder. The homepage also lists .NET Framework 4.6.2 and later; runtimeMin records the .NET 8 minimum and the .NET Framework 4.6.2 minimum as separate entries from the same supported-platform list. The project's homepage says "Created by Rockford Lhotka", a person named on the site and the NuGet owner list; the maintainer is recorded as the copyright holder in license.md, Marimer LLC. The Marimer LLC store at store.lhotka.net has no terms or imprint page with a company address; the GitHub organization profile gives Minnesota, US, but that is not a legal page, so hqCountry is left out. The store sells books and videos, which are not editions of the software. The first GitHub tag is 4.5.500 (commit of 2014-01-07), so firstRelease is 2014, although the repository was created in 2013. The docs field points to the repository's docs readme, which says the primary documentation is books and videos; the homepage's version 10 API reference is not recorded as docs. The NuGet figure is the package Csla, the package the homepage links.
