notes: >
  Discontinued on the project's own homepage, docs and README, which name the end and a thoughtbot blog post on replacing the library with native CSS; the post is not a named successor, so no successorOf is recorded. The repository is archived on GitHub (api, pushed 2024-09-13). The install docs name the RubyGems gem, so rubygemsName and rubygemsDownloads are recorded; the README also installs the npm package bourbon (same version and author), so its npm figure is recorded too. The README lists Sass 3.4+ or LibSass 3.3+ as the requirement, so using the library needs a Sass compiler. firstRelease is the RubyGems upload of 0.0.5 on 2011-07-03, older than the earliest GitHub release (v4.0.0, 2014-04-20). The LICENSE.md copyright line reads "Copyright © 2011-2020 thoughtbot, inc."; the homepage footer reads 2011 to 2024. The GitHub language is Ruby because the repository ships the gem wrapper; the library's own files are Sass, which the homepage describes. The x link is the twitter.com address the homepage links. No hqCountry is stated on the pages read.
