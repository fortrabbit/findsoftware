notes: >
  GitHub reports the license as NOASSERTION. The repository's license.txt is the AAPANEL Open Source License Agreement, a custom license with no SPDX id, so license and licenseModel carry its own wording; it reads the source, allows use for profit or non-profit projects, bars publishing modified copies, and bars encrypting or obfuscating the source. The homepage calls the product an "Open Source Solution" and no page names an open-source license, so that wording is not recorded as a license. The Pro edition sells extensions and accounts; the free edition is named on the homepage as the version that manages websites, WP Toolkit, mail servers, FTP, MySQL, file management and the code editor. The install page says "Install aaPanel 8.0.7", which sets currentMajor 8; the highest stable GitHub release is 7.65.0 (2026-01-22), so no latestReleaseDate is recorded. The legal name conflicts: license.txt names the "main body" as Dongguan Baita Network Technology Co., Ltd., which is the maintainer, and no country is recorded for it; the About page names AAPANEL LIMITED with a Hong Kong registered office. The privacy policy gives "Country refers to: New York, United States", which is the policy's jurisdiction and not a company seat. The homepage lists a Trustpilot profile and a Telegram channel (t.me/aapanel_official), which have no field here. The installer's OS table lists CentOS 7.x, Debian 10 to 12, Ubuntu 18.04 to 22.04, CloudLinux, AlmaLinux and Rocky Linux, and the hardware minimum is 1 core CPU with 512MB RAM, recommended 1 core with 1G RAM; neither has a field. The reportedInstalls statements disagree: the install page figure is recorded; the homepage and About page say "3,000,000+" servers and a homepage counter shows "3.6M Installs". runsAs is not recorded: the install page lists "service bt start, stop, restart" commands but no page calls the panel a service or daemon. The second subreddit, r/aaPanel_Hosting_Panel, is not recorded. The Pro install script is a second route to the same shell installer and is not a separate installMethod entry. A "Docker Manager" and an OpenClaw install script run containers from the panel and are not the panel's own install route.
