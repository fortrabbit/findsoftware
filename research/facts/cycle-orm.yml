notes: >
  The installation page's requirements list "PHP 8.0+", while composer.json at v2.18.1 requires "php": ">=8.1"; runtimeMin follows the manifest, and the annotated-schema package (cycle/annotated) is 3.x for PHP 8.0 according to that page. The README says the engine is designed to work in classic and daemonized PHP applications, and the database list is quoted as printed, "PostgresSQL". The package name and the GitHub organization are both cycle; the maintainer is Spiral Scout, the company the README names as maintainer and the LICENSE copyright names. The README links a comparison with Eloquent and Doctrine, but its link text is a label and no alternativeTo fact is recorded from it. Spiral's own integrations (spiral/cycle-bridge, yiisoft/yii-cycle, the Laravel adapter) are separate packages and carry no basedOn. The installation page lists PHP-PDO and the PDO drivers for the chosen databases as requirements. Stars, contributors and dependents belong to the cycle/orm repository, and the Cycle organization holds several extension repositories. The Discord link comes from the README badge.
