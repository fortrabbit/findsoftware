notes: >
  Status: no end statement found. The repository was last pushed on 2026-07-16, the npm latest 5.10.2 is not deprecated, and the newest stable release is 5.10.2 (2025-07-11); release age does not end a record. The README names KeystoneJS as the project it was first built for; no field covers that, so it is not recorded. The README says the project is funded by Thinkmill and Atlassian, and that the maintainer's personal Twitter account is followed; neither is a project channel, so no x or sponsor fact. The v5 release is a rewrite from JavaScript to TypeScript; the types for v4 and earlier are on @types/react-select. The latest prerelease, 5.0.0-beta.1 (2021), is older than the latest release, so no latestPrereleaseDate. The LICENSE copyright line names Jed Watson, and the package.json author is the same person. The repository is a single package. The docs site is a JavaScript shell, so its pages were read as source files in the repository (docs/pages); the homepage page there shows the yarn and npm install commands of one registry route. The docs say server rendering works through Emotion with renderToString, Next.js or Gatsby; that is a compatibility statement and no runtime or runsAs value. The docs footer names a copyright holder, Jed Watson, with a personal Twitter link, and thanks Thinkmill and Atlassian. The README describes an async select, a creatable select, option groups and portal support as features, not fields.
