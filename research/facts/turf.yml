notes: >
  Monorepo: the repository holds the @turf/* packages, so stars and contributors belong to Turfjs/turf as a whole. The npm figure is @turf/turf, the package the README badge and the getting-started guide name first. The homepage says the library is for browsers and Node.js; the README names Node as a first class runtime and says Deno and Bun are not officially supported, so runtime is node and no runsAs is recorded. No minimum Node version is stated, so runtimeMin is left out. The maintainer follows the LICENSE copyright line, Morgan Herlocker, while the homepage footer reads Copyright 2013 Turf org and npm lists Turf Authors as author; the copyright line is the one recorded. The x link is the Twitter link in the homepage footer, and the Stack Overflow tag in its Community list is recorded as forum; the README's Gitter badge is a chat room, not recorded. The npm package lists several maintainers, which are not recorded. The oldest tag is 1.3.0, committed 2014-12-18. Checked 2026-11-16.
