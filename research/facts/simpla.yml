notes: >
  Stub: the homepage simplajs.org and its docs at docs.simplajs.org both answer with the same parked page, which says the domain may be for sale, so the project's own site no longer shows the software and no homepage is recorded. The repository and the npm package still publish the code, and the README gives install steps, so criterion 3 is met from the README. A later pass settles it by finding whether the project still owns a domain or names a new homepage in its repository. No GitHub release exists: the repository has tags up to v3.0.1 and no releases, so the version and date come from the npm package simpla, which the README installs. The npm oldest upload (1.0.0, 2016-07-08) sets firstRelease. The last commit on the default branch is dated 2017-12-21. The copyright line in LICENSE names two people, recorded together as the maintainer. Simpla keeps content in a GitHub repository through an OAuth adapter (the README shows the Netlify adapter); the adapter is not recorded. The README installs the components with Bower and HTML imports, and says npm and JS support for them is coming. runsAs holds static only, from the README line about pushing data to a static CDN; no page states where the library runs.
