notes: >
  The repository has no README at its root: the project's pages are the Sphinx documentation at docs.fluentvalidation.net, and the homepage fluentvalidation.net redirects there with a script and a meta refresh, so the final URL is recorded. The docs ask for sponsorship through GitHub Sponsors and OpenCollective; sponsorship is not a paid edition. The LICENSE file (Apache License 2.0) names no copyright holder, so the maintainer comes from the docs copyright line. The ecosyste.ms record for the NuGet package lists 0 dependent repositories under a different repository URL (JeremySkinner/fluentvalidation), so dependentRepos is not recorded. The first tag is 1.2, committed in March 2010 (GitHub tags API), and the changelog gives April 29 2010 for the 1.2 release. The docs say FluentValidation 11 runs on .NET Standard 2.0 and newer runtimes; that older line is not recorded. Blazor integration is third-party only, per the Blazor page.
