notes: >
  The maintainer is The Apereo Foundation as the LICENSE copyright line states it; the foundation's about page calls it a global nonprofit and names no country, so hqCountry is unknown. The firstRelease year is the committer date of tag v3.0, the oldest tag, because the oldest GitHub release is v3.5.2 and v4.0.0 from 2014-12-20 and the tag predates them; the date sits in imported history and is recorded as the repository states it. The install guide recommends a WAR overlay built with Gradle, deployed to a servlet container such as Apache Tomcat, and says no Gradle install is needed beforehand; the servlet container and build-tool facts have no field. runsAs always-on rests on the Getting Started page calling it a CAS server deployment; the Service Management style java -jar commands are not the evidence. The Docker page says the images are mostly meant as quickstarts and demos, and the dockerPulls figure is the Docker Hub count for apereo/cas. The forum entry is the community discussion mailing list on the support page; the README also names an Apereo Slack workspace, which has no field. The adminUi and database questions found no answer on the pages read: the JDBC drivers page lists no database names and the README lists ticket and service registry backends, which are not recorded as the databases of the software. The Java 25 minimum comes from gradle.properties at tag v8.0.3, which matches the install guide. The v8.1.0 release candidates are older than v8.0.3, so no latestPrereleaseDate is recorded.
