notes: >
  Docker4Drupal is a set of Docker Compose files and images, not a Drupal module or an application; the record is a local development environment for Drupal sites. The README and the local docs page name Docker as the required runtime: "Install Docker (Linux, Docker for Mac or Docker for Windows (10+ Pro))" and, on Linux, docker compose (docs page, read 2026-10-28). Operating systems per the same page: Linux, macOS and Windows 10 Pro or later, with macOS and Windows sections on file permissions and synchronization. The stack's containers, read from the README table: Nginx or Apache, Drupal CMS or vanilla Drupal, PHP, MariaDB or PostgreSQL, Valkey or Redis, Memcached, Solr, OpenSearch, Varnish (Vinyl), Node.js, Mailpit, Traefik and others; the databases facts cover the two database containers. The first release is the oldest GitHub release in this repository, 1.0.0 dated 2016-07-28 (the repository was created 2016-07-13); the repository holds 135 non-prerelease releases, and the newest is 6.2.15 dated 2026-10-24. The 6.0.4-rc prerelease is not used. The README links the project's Discord and Slack; the Slack link (slack.wodby.com) has no schema field and stays here. The terms name the company as Wodby Inc. and the site footer says Wodby, Inc.; no country of the company is stated on the terms, privacy or about pages (the terms name Delaware law, which is a governing law, not a headquarters), so hqCountry is not recorded. The homepage is the Wodby page for the project, and the README links the docs at wodby.com; the docs are the Wodby documentation. Wodby Cloud is the hosted option, with its prices on its own pages; those are not recorded. A Drupal stack built on Drupal is not a basedOn statement: the README calls it "optimized for Drupal" and does not name Drupal as the software it extends.
