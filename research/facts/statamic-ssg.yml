notes: >
  No homepage: the repository's homepage field is empty, and the Statamic documentation does not describe this package, so the record has no homepage. License is unknown: the repository root has no LICENSE file, composer.json has no license key, and Packagist lists none; GitHub reports none. The package requires statamic/cms ^6.0.0 (composer.json), so the Statamic CMS license terms and its PHP requirement apply to a site built with it; runtimeMin is not recorded for this package. The README says the optional spatie/fork package enables multiple workers for page generation, which is not recorded as a fact. The contributor count is the anonymous-included count from the contributors API Link header. The README gives deployment examples for four hosts, which are not recorded. The Statamic static caching page mentions this package as an alternative; that page is cited for runsAs only.
