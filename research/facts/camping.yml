notes: >
  Status is stub because the project's own site shows only a Coming Soon placeholder while the repository is active: the gem's homepage rubycamping.org (https) carries a page titled "Coming Soon" and no software, so no homepage is recorded; a live project site that shows the software, or the repository named as the project's home, would settle it. The repository is active (last push 2026-08-24, not archived) and its latest stable release is 3.2.6 (2024-08-09). The README credits why the lucky stiff with the original work and says the project is now maintained by the community, so the maintainer is recorded as the community. The first gem version is 1.0 (2009-07-25), the oldest RubyGems upload. The README says Camping supports multiple apps that run together, each with its own models, routes and controllers, and that a complete application can live in a single file organized as Model-View-Controller. The README points to a wiki on GitHub, which is not a dictionary field. The publishing chapter names the CGI, Rack and Camping::Server hosting paths; only the CGI and always-on statements are recorded as runsAs values. runtimeMin is the required_ruby_version of the latest gem (>= 3.1.2), read from the RubyGems API.
