notes: >
  The record covers the hosted Axiom service, sold as Axiom Cloud with a free Personal plan. The CSV row's repository, axiomhq/axiom-js, is a client SDK (npm @axiomhq/js), so no repository, license, stars or npm figure is recorded here. No page of the docs or the site states a way to install or run Axiom outside Axiom's own cloud; the pricing page's "Self-Hosted GCP/AWS" row describes a competitor, not Axiom. Compliance statements on the security page: ISO 27001, SOC 2 Type II, GDPR, CCPA and HIPAA with a business associate agreement as a self-serve add-on; these are not fields. The SAML SSO, RBAC and audit-log features are paid add-ons on the Axiom Cloud plan, and SCIM directory sync is an add-on as well. The privacy page names Axiom, Inc. at 1390 Market Street in San Francisco; its terms name the same company as the provider. The docs describe Axiom Cloud only. The LinkedIn and status page links on the homepage are not fields. The site also has compare pages against Elastic, Datadog and Splunk; only ClickHouse is a record id here.
