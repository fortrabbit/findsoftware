notes: >
  Status accepted: the repository is not archived, Packagist has no abandoned flag, the repository was pushed 2026-09-03, and no page states that the project has ended. The latest GitHub release is v1.4 (2021-09-02), shown with the record as latestReleaseDate.
  GitHub detects the license as NOASSERTION; the LICENSE file says BSD without a clause count and Packagist says BSD-3-Clause. Both are recorded with their sources; the reviewer decides which the record shows.
  maintainer is the name the README and the site footer state ("Yupe! team", "Yupe team!"); no legal form appears on the pages read, so none is recorded.
  The README is in Russian; its quotes are in Russian and the record prose is written from the English-language facts only.
  The docs domain docs.yupe.ru serves Yupe Brain pages (brain.yupe.ru); the install page cited is the one the docs link leads to.
  runsAs per-request is based on the README's PHP requirement only, the same basis as other PHP records; reviewer should confirm.
  packagistDownloads is the total; Packagist reports 0 monthly at this date, not recorded.
  The README and site claim more than 30000 projects and over 15000 online shops; that is the project's own claim without a dated source, so it is not recorded as an adoption figure.
  yupe.ru lists "Yupe CRM" and "Yupe Platform" as products; the pages read do not say they are paid editions of this software, so paidEdition is left out.
  The README says the modules can be used selectively ("используйте только то, что необходимо") and that the platform suits shops, blogs and community or business sites.
  The documentation at brain.yupe.ru is in Russian.
