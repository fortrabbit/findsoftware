notes: >
  Monorepo: the repository holds the framework-agnostic core @tanstack/table-core, the adapters (react-table, preact-table, octane-table, vue-table, solid-table, svelte-table, angular-table, ember-table, lit-table, alpine-table) and the devtools packages. Stars and contributors belong to the monorepo. The npm figures, dependent counts and the stable release date are those of the core package; the React adapter @tanstack/react-table had 35347746 downloads for 2026-11-01 to 2026-11-07, and 480 dependent packages and 4954 dependent repositories on ecosyste.ms. The README says "Framework-agnostic core with bindings for React, Preact, Octane, Vue, Solid, Svelte, Angular, Ember, Lit, and Alpine", so no basedOn is recorded for a framework. The docs say the core can be used directly to build an adapter. The docs overview contrasts the library with the pre-built AG Grid component, which gives alternativeTo ag-grid. The README calls the library "server-side friendly" and the docs describe server-side pagination and sorting with TanStack Query, which are not runtime statements. The adapter line "The @tanstack/react-table package works with React 18 or newer" is a binding requirement, not a runtime. The core's package.json engines field (node 20) is a build requirement of a browser library and is not recorded as runtime. The latest stable core is 9.3.1 (2026-10-12); the devtools packages are at 9.3.2 (2026-11-14) and are not the core. The docs site labels the version "v9 Latest". The LICENSE copyright line names Tanner Linsley, and the homepage footer names TanStack LLC, recorded only as text. The docs' AI agent note (the TanStack Intent package installed with npx) is a third-party package on the install page and is not an installMethod. The X, Bluesky and YouTube links come from the footer component of the tanstack.com site source (the footer renders client-side, so a plain page fetch does not show them); its LinkedIn link is not recorded because no field exists for it. The repository was created on 2016-10-20 and its oldest GitHub release is v3.0.0 (2016-10-31); the older react-form-era npm uploads of the name react-table (2014) belong to another author and repository, so firstRelease stays 2016.
