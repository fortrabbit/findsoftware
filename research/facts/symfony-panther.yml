notes: >
  Status accepted: a testing library that drives real browsers, in criterion 1's sense it is used to test and to scrape a site or web app; a testing library is in scope under the dev-libs ruling. Criterion 2: installed with Composer from Packagist (symfony/panther), the route the package page gives, as a dev dependency. Criterion 3: the package page and the end-to-end testing docs. Criterion 4: not archived, no abandoned or deprecated flag; the latest stable release v2.4.0 is dated 2026-01-08 and no newer prerelease is listed. Its README names the main Symfony repository for issues and pull requests, and its stars and contributors are counted on its own repository. The maintainer follows the LICENSE copyright line (Kévin Dunglas); the README says the library was created by Kévin Dunglas and sponsored by Les-Tilleuls.coop, which is recorded as neither parent nor maintainer. The tagline names Symfony as a target, so basedOn is symfony; the docs say the library works outside a Symfony application when the vendor autoload is required. The README says the library is built on top of PHP WebDriver and other FOSS libraries; PHP WebDriver is not a record, so it is not recorded. The docs list taking screenshots, executing JavaScript on pages and testing real-time applications (WebSockets, Server-Sent Events) as features, say PantherTestCase starts the application with the built-in PHP web server and extends PHPUnit's TestCase, and say that for a Symfony application it extends WebTestCase. The docs name Chrome and Firefox with ChromeDriver and geckodriver, which the browser-driver-installer or the operating system package manager installs; these are requirements of the test setup and not recorded as fields. The README says the library was inspired by Nightwatch.js, which is not an alternativeTo statement and is not recorded. The firstRelease is 2018, the year of the oldest Packagist version (v0.1.0, 2018-07-17); the packages page gives July 2018.
