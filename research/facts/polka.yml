notes: >
  Status is accepted: the repository is not archived, the package is not deprecated and no end statement was found. The GitHub repository has no homepage, so none is recorded. The latest stable GitHub release is v0.5.0 (2018-09-18) and npm latest is 0.5.2 (2019-02-08), both major 0, so currentMajor is 0. The newest pre-release is v1.0.0-next.28 (2024-09-19); it is recorded as latestPrereleaseDate because it is newer than the last stable release, and it keeps the project inside the four-year window the import uses. The oldest GitHub release is v0.2.0 (2018-01-12), which sets firstRelease. The README names Trouter as the library Polka extends and Express.js as the framework it presents itself as an alternative to; both are recorded as stated. The README has no install, deploy or runtime requirements beyond Node.js features; no minimum Node version is recorded.
