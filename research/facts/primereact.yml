notes: >
  Moved into PrimeUI in 2026 (Frank's decision 2026-10-28, the record follows the product). The public repository primefaces/primereact receives security fixes only; its README says it "is no longer under active development and receives security fixes only" and that development continues at PrimeUI. The current line (11.2.2, released 2026-10-22) ships compiled under the PrimeUI License. No repository is recorded: the npm packages name primefaces/primereact-nextchapter, which answers 404 for an anonymous and an authenticated request, and the public primefaces/primereact repository holds the 10.x line. Both repositories are listed here; neither supplies stars or contributors for the current line, so none are recorded (the old repository showed 8310 stars and 347 contributors on 2026-10-28). License: the 11 line's npm packages (primereact, @primereact/ui, @primereact/core, all 11.2.2) carry a PrimeUI License file that requires a license key; its LICENSE.md says the package "is part of PrimeUI, a family of commercial UI libraries", with a Community License free for eligible organizations (under $1,000,000 annual gross revenue, fewer than 5 developers, fewer than 10 employees, under $3,000,000 outside funding; individuals, students, non-profits and non-commercial open source projects also qualify) and a paid Commercial License per developer. The 10.x line is MIT (LICENSE.md, "Copyright (c) 2016-2025 PrimeTek"); license facts describe the latest release, so it is not recorded as a license. The install docs for the 11 line name @primereact/ui, so npmName and npmWeeklyDownloads follow it; the legacy package primereact averaged 207280 downloads in the week 2026-10-19 to 2026-10-25 (npm range API), and its dependents are 316 packages and 2807 repositories (ecosyste.ms), which are not recorded because the install docs name a different package. The GitHub language breakdown of the old repository is CSS by bytes, then JavaScript; language is recorded as JavaScript because the package ships React components. The primereact.org address redirects to primereact.dev. The primeui.dev company page names the legal entity and its Ankara address. The HTTP Archive technologies list has no PrimeReact entry.
