notes: >
  Doubt: the GitHub repository the CSV names (primefaces/primereact) is at its 10.x line, with a README that says it "is no longer under active development and receives security fixes only" and that "Development continues at a new home", the PrimeUI site. The current line (11.2.2, released 2026-10-22) lives in primefaces/primereact-nextchapter, named in the npm repository field, which answers 404 here, so its source, its README and its license file in the repository cannot be read. The announcement at primeui.dev/nextchapter says "PrimeReact remains PrimeReact" and that PrimeUI provides a unified license for the core libraries, which reads as a continuation under the same name; a reviewer decides whether that is a move (accepted) or a replacement (discontinued), and whether the 11 line's commercial license leaves the record on the open-source register. Settled by a readable copy of the nextchapter repository or a PrimeUI statement that names PrimeReact's status. License: the 11 line's npm packages (primereact, @primereact/ui, @primereact/core, all 11.2.2) carry a PrimeUI License file that requires a license key; the tarball LICENSE.md says the package "is part of PrimeUI, a family of commercial UI libraries", with a Community License free for eligible organizations (under $1,000,000 annual gross revenue, fewer than 5 developers, fewer than 10 employees, under $3,000,000 outside funding; individuals, students, non-profits and non-commercial open source projects also qualify) and a paid Commercial License per developer. The 10.x line on GitHub is MIT (LICENSE.md, "Copyright (c) 2016-2025 PrimeTek"); it is an older license and goes here, not in the license field. The install docs for the 11 line name @primereact/ui, so npmName and npmWeeklyDownloads follow it; the legacy package primereact averaged 207280 downloads in the week 2026-10-19 to 2026-10-25 (npm range API), and its dependents are 316 packages and 2807 repositories (ecosyste.ms), which are not recorded because the install docs name a different package. The GitHub language breakdown is CSS by bytes, then JavaScript; language is recorded as JavaScript because the package ships React components. The primereact.org address redirects to primereact.dev. The primeui.dev company page names the legal entity and its Ankara address. The HTTP Archive technologies list has no PrimeReact entry. The npm package primereact has no deprecation flag. The repository's contributors are counted from the per_page=1 Link header.
