notes: >
  Boundary row settled for server-infra: a desktop database client is in, runsAs local, like the build-dev desktop apps. The CSV row's "lastRelease 2026-08-03" is stale: v12.22 was published 2026-10-25 and is the newest stable release. The v13 line is a preview: the download page offers a Windows v13 preview zip and Linux and macOS v13-preview work is on the homepage, but there is no GitHub prerelease and no dated preview release, so latestPrereleaseDate is absent. The homepage says HeidiSQL was "Invented in 2002 by Ansgar"; firstRelease is 2002 from that sentence, a project statement that beats GitHub releases; the oldest GitHub release is 9.0 from 2017-11-02. Interbase and Firebird are named by the homepage and the help page, but the databases dictionary has no value for them, so they are left out of the databases fact; MSSQL is recorded as sqlserver. The Linux and macOS builds use Lazarus and FreePascal, the Windows build Delphi; the homepage names the compilers, not a parent framework, so basedOn is absent. The maintainer is Ansgar Becker, the person named in the imprint, while the GitHub organization is HeidiSQL; the imprint gives a full postal address for him, so hqCountry follows the wave 41 ruling for an individual maintainer and a reviewer should confirm it. The Facebook link on the homepage sits inside an HTML comment and is not recorded; the Instagram link is live. The GitHub license is GPL-2.0; the help page says "GPL (GNU GENERAL PUBLIC LICENSE)" with a link to license.txt, the same license in another wording, so one entry. The help page's "Windows x64 Portable" and the Windows package-manager lines are recorded as separate install routes. The desktop category is not in the import's categoryMap, so the category is db-admin only, which maps to admin-panel.
