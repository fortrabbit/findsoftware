notes: >
  The GitHub repository has no release objects; latestReleaseDate is the Packagist time of v3.10.1, which matches the tag. The GitHub API reports the license as NOASSERTION; the MIT entries come from the Packagist metadata and LICENSE.md, whose copyright line names AnomalyLabs, Inc. (2018), the earlier company name. The footer and the PRO License name the current company. The README says the software is "built with Laravel 5", while the home page says "Built on the worlds most popular PHP framework."; basedOn uses the home page, and the laravel record carries the framework. The installation docs page is the 3.9 docs (the version selector shows 3.9 as the newest docs), and its PHP minimum (PHP >= 7.3) is for that docs version; composer.json of v3.10.1 and its streams-platform dependency state no PHP constraint, so runtimeMin stays out. The Streams Platform is a separate Composer package (anomaly/streams-platform) that the docs present as a platform and that the release composer.json requires; it has no record here, and the reviewer decides whether it needs one. The docs list API, Sites, Comments and other modules with a PRO tag. The /pricing page returns a server error; /pro is the page for the PRO subscription. The Packagist downloads figure is for pyrocms/pyrocms, the package the install docs name (composer create-project); its monthly count is small and the addon packages carry separate counts. The PHP extension list is taken from the 3.9 docs. A Wikidata search for PyroCMS returned no entry, so wikidata stays out.
