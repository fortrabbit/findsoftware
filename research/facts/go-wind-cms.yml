notes: >
  Accepted. Name taken from the README title; the intro page calls the same project GoWind CMS. The English README and the Chinese intro page disagree on the admin frontend: the English README names React 19 with Ant Design, the intro page names Vue 3 with Ant Design Vue and Vben Admin, so no admin framework is recorded. The English README lists RESTful and gRPC interfaces and a read-only GraphQL content API; gRPC has no headlessApi value, so rest and graphql are recorded. The intro page and the English README name the same backend services: an admin service on REST port 6600, an app service on REST port 6700, and a core service reached over gRPC; the admin and app services are the HTTP surface. The installation page lists PostgreSQL as the default database and MySQL as the other one. The backend uses Redis, MinIO or local storage, OpenSearch, etcd or Consul, and Jaeger; these are dependencies and not fields. The Go 1.25 requirement sits under the development environment table of the installation page, so runtimeMin is left out. The homepage footer reads Copyright 2026-present GoWind Team while the LICENSE names Bobo; the maintainer follows the LICENSE. The README Draft Preview opens a draft in a new tab and does not say it shows unsaved changes, so livePreview is left out. The demo sites under the README's Demo table use one default account and are a demonstration, not a hosted offering with prices; no pricing or hosted service page was found, so pricingPage is left out. The homepage gowind.cloud describes an ecosystem of several products, and its CMS entry is the one recorded. The LICENSE copyright line names Bobo, with the year 2022; the GitHub owner tx7do is a user account. The first release tag is v1.0.0 from 2026-10-08, and the repository has commits from 2022, so firstRelease is the year of the first release. The releases are v1.0.0 to v1.3.0, all stable. The Node.js 18+ requirement is for building the frontends, and no runtime for the running CMS is named other than Go. The intro page says each site has its own domain, title, logo and SEO settings, and that the CMS covers content, categories, tags, comments, pages, navigation and media. The English README lists four app frontends: Vue (Nuxt.js), React (Next.js), Taro for WeChat Mini Programs and H5, and Flutter for native apps. The intro page lists the infrastructure services the backend uses: PostgreSQL, Redis, MinIO, OpenSearch, etcd, and Jaeger for tracing.
