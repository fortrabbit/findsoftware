notes: >
  Status accepted: the repository is not archived and the 2026.3 line has tags. Calendar versions: the tags are scylla-YYYY.N.P, so no currentMajor; the line is 2026.3 (scylla-2026.3.4 is the newest stable tag, commit dated 2026-10-15) and the install page says "The two latest versions are supported." The repository has no GitHub releases; latestReleaseDate and latestPrereleaseDate come from tag commit dates via the API, and the newest candidate tag is an rc (scylla-2026.4.0-rc1-candidate-20261027041740). License history: LICENSE.AGPL (AGPL-3.0) is present up to the 6.x line (scylla-6.0.0, scylla-6.2.3); commit f3eade2f6 of 2024-12-18 "relicense to ScyllaDB-Source-Available-1.0" dropped it, and tag scylla-2025.1.0 carries LICENSE-ScyllaDB-Source-Available.md. The file is now version 1.1 (last updated April 12, 2026). Its eligibility clause limits the license to Never Customers and bars existing commercial customers from downloading in the last twelve months; the license is recorded as stated, and the GitHub API reports NOASSERTION. Criterion 2 holds on the distributable and source, and the record stays accepted. The Enterprise page names LDAP integration with client authentication, which is for database clients, not a sign-in to an admin interface, so no sso is recorded. The maintainer is ScyllaDB Ltd. (Israel, per the privacy page and the license); the trademark line in the terms page names ScyllaDB, Inc., recorded here only as a second legal name. The homepage links github.com/scylladb/scylla, which redirects to scylladb/scylladb; the repository is the one recorded. Docker image scylladb/scylla is the image the install page names. Contributors counted with per_page=1 (rel last page 187). firstRelease 2015 is the company page's "ScyllaDB 1.0 launched" entry; the oldest tag is scylla-0.10 (commit 2015-10-12). The Seastar framework is named in the repository description only, not in the README, so no basedOn. Community channels: the Slack link (slack.scylladb.com) and LinkedIn have no field. ScyllaDB Operator is offered to Enterprise customers only (enterprise page). Alternator, the DynamoDB-compatible API, must be enabled (README). Fields coined: none.
