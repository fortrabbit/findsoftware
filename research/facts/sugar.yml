notes: >
  The homepage sugar-framework.github.io answers over https and the docs index is read on the same site; the install steps are on the homepage (mix new, a mix.exs dependency, mix sugar.init, iex -S mix). The README has a getting-started section that starts the web server with mix server, and it names Cowboy as the only supported web server through the Plug adapter; the README and the homepage hold no statement that the project has ended or is unmaintained, and the repository is not archived. The newest release on Hex is 0.5.0 (inserted 2017-02-04); the GitHub releases list holds only v0.1.0 (2014-02-07) and v0.3.0 (2014-05-15), with tags up to v0.4.9, so latestReleaseDate follows Hex and the repository's last push (2019-05-31) is not a release. The Hex package sugar names the MIT license and the GitHub repository; the MIT copyright line in LICENSE names Shane Logsdon for 2014, and the GitHub organization is sugar-framework, so the maintainer is recorded as the copyright line states it and a reviewer should check whether that person still maintains the project. The Hex all-time download figure is 11433. The homepage links the Twitter account sugar_framework under "Tweet us"; the README also links a Gitter room, which is not a field and is left out. The README says that ecto and postgrex were removed from the dependencies as of 0.5.0, which is not a database statement, so databases is left out. The homepage's Templates project is a separate library, so templating is left out.
