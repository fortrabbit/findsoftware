notes: >
  Boundary row settled as accepted: the project's own docs document a record API that applications call with a Bearer token (POST /api/table/{tableId}/record and the other record endpoints), which is the wiring criterion 1 asks for; the spreadsheet and app builder is an end-user app, and the record API is more than an API over its own data only because applications push records into it. The README says the repository is the Teable Community Edition, free for self-hosting under AGPL-3.0 with the packages directory under MIT, and the official image ships the complete product with paid plans unlocking AI features and advanced enterprise capabilities, activated with a license key; the Docker guide names a community image (ghcr.io/teableio/teable-community) for the open-source feature set only. The license field describes the default branch because the release tags are timestamps (release.2026-11-03T05-42-34Z.3718), so no currentMajor is recorded. The earliest GitHub release is dated 2024-03-11, the repository was created in November 2022. The maintainer is Teable AI, Inc., the company the about and privacy pages name; the LICENSE copyright line reads Teable, Inc. The docs say the app runs from a single image with PostgreSQL and Redis beside it, and a Docker Compose file; no page sentence states the process model, so runsAs is unknown. Redis is not in the databases vocabulary. headlessApi is unknown: the API reference shows HTTP endpoints and the README says "HTTP APIs", and no page says REST or GraphQL. The homepage says Teable is now on iPhone, iPad and Android; that is a product feature. LinkedIn and YouTube links on the homepage are not fields. The paid self-hosted plan page on app.teable.ai answers 403 (bot check) and stays unread.
