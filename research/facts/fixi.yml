notes: >
  The project has no GitHub release, only tags from 0.0.1 (2025-01-16) to 0.9.4, so currentMajor and latestReleaseDate come from the npm package fixi-js, whose latest version is 0.9.4 (npm publication 2026-04-25). The npm package named fixi is an unrelated 2017 DOM library (version 0.2.0-alpha.2, geigerzaehler/fixi) and is not used. The repository ships no LICENSE file; GitHub reports no license and the README carries the license text ("Zero-Clause BSD"). The README says "Zero-Clause BSD" while the project site and the npm package metadata say "BSD-0"; all three wordings name the license recorded as 0BSD. The homepage is https fixiproject.org, the site of the fixi project, which lists fixi.js beside moxi, paxi, ssexi and rexi; only fixi.js is recorded here. The discord fact is the htmx Discord channel that the README names for fixi support, not a server of its own. The site and README were read; the site links one YouTube video and no social account. The maintainer is the GitHub organization name Big Sky Software; no page read gives a legal name or country. The README names fixi-js as the npm package. The fixi project site instead gives "npm install the-fixi-project", which is the all-in-one bundle of fixi, moxi, ssexi, paxi and rexi (latest 0.1.1, 5 downloads in the same week); it is not recorded as the library's package. The 40 weekly downloads figure covers 2026-10-18 to 2026-10-24.
