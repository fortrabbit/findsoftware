notes: >
  The monorepo holds the core gem sunspot, the Rails integration sunspot_rails and the bundled Solr distribution sunspot_solr, all MIT-licensed at v2.7.1; the rubygems figure is for the core gem sunspot. The README says sunspot_solr is a pre-packaged Solr distribution "for use in development. Not for use in production", so a production site needs its own Solr server, which runs as an always-on process; no runsAs is recorded for the library itself. basedOn is solr, from the homepage title "Solr-powered search for Ruby objects"; rails is not a parent: the README says the sunspot_rails gem integrates Sunspot into Rails and the homepage says "Use it with or without Rails", so Rails is the integration target, not the parent of the core. The gemspecs and the CI matrix list Ruby 2.5 to 3.x in CI, but no required_ruby_version is stated in the gemspec at v2.7.1, so runtimeMin is not recorded. The LICENSE copyright line names Mat Brown (2008); the gemspec authors list has several names, which are not recorded as the maintainer. The homepage is served over https and the gemspec homepage is the same address. The rubygems homepage_uri still points to an older address, which is not recorded. The RubyGems version history starts with 0.9.7 (2009-09-24), and the oldest GitHub tag v0.0.2 is a 2009-02-14 commit, so firstRelease is 2009 either way. The GitHub releases start with v2.2.8 (2018), and the 2.x tags are the stable line.
