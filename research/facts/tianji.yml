notes: >
  Accepted: the homepage title and first line lead with website analytics ("Tianji = Website Analytics + Uptime Monitor + Server Status"), so the record is analytics under the homepage rule; the uptime monitor and status page features are the same product and are not treated as a separate criterion 1 question, though a reviewer may read them as a finished application. Attachment to a site: the tracker script is one script tag with the src "https://<your-self-hosted-domain>/tracker.js" and a data-website-id attribute (docs Tracker Script); the script's data-do-not-track and data-auto-track attributes are configuration, not recorded. Privacy claims: "Track website visitors without cookies (GDPR/CCPA compliant)" from the API page and "We do not track user's activity with cookies" from the homepage; recorded here as notes, not as a field. The REST API is enabled with ALLOW_OPENAPI=true and takes API keys created in the dashboard; tianji.dev/api is its reference. Versions: the highest stable GitHub release is v1.33.13 (2026-10-27), so currentMajor is 1 and the minor line 1.33 is left out; the oldest release is v0.0.1 (2023-10-31), so firstRelease is 2023. runtimeMin comes from the manual install requirements; the root package.json at v1.33.13 has no engines field. ClickHouse is configured through environment variables beside PostgreSQL (GitHub, Google and custom OAuth or OIDC providers are listed there as sign-in options). The Docker Hub image is moonrailgun/tianji, the image the compose file names; its pull count is recorded as stated by the Hub API. The homepage Discord link and its Twitter link (twitter.com/moonrailgun, listed under Community) are recorded as discord and x; the Twitter account is the one the homepage gives. The homepage footer names "Tianji, Inc." as the copyright holder and gives no address or country, so hqCountry is not recorded. The LICENSE file carries no copyright line. The one-click deploy buttons (Hostinger, Sealos, RepoCloud, Render, ClawCloud) are third-party deploy templates and are not recorded as installMethod entries. The docs have an Install in Helm page. Languages: the homepage language switcher lists English, French, German, Indonesian, Japanese, Simplified Chinese and Spanish; the README names the locale files, which is recorded as i18n. The API page's "Settings → API Keys" flow is the dashboard. The homepage lists Survey, Feeds, Docker Status, Telemetry and Short Link as features; they are not recorded as fields. Redis is optional: without REDIS_URL the cache stays in memory and the auth rate limits are off; ClickHouse is configured beside PostgreSQL the same way. The pricing page lists self-hosting and a Cloud Hosting plan marked 'Coming Soon' with a waitlist, while the homepage links app.tianji.dev ('Get Start in Cloud'). The README says Tianji is inspired by umami and uptime-kuma. The docs' Install in aaPanel page (aaPanel app store) is recorded as an installMethod.
