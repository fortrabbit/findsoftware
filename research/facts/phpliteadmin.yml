notes: >
  The readme says the code repository is available both on Bitbucket and GitHub, and the homepage links GitHub; the recorded repository is GitHub phpLiteAdmin/pla, with stars and contributors (without anonymous) from it on 2026-10-30. The Bitbucket repository https://bitbucket.org/phpliteadmin/public, described as "The new official phpLiteAdmin project location", holds the issue tracker and wiki (installation, configuration, themes), whose pages answered 404 and were not read. The files in the source repositories are meant for development, not for use in production. The homepage says the tool is for SQLite what phpMyAdmin is for MySQL, and the readme calls its feature set comparable to phpMyAdmin; no alternativeTo is recorded. GitHub reports no license (license null) and the repository holds no LICENSE file; the license comes from the readme's License section, GPL version 3 or later. There are no GitHub releases; the newest tag 1.9.8.2 has commit date 2019-09-05, the same date as the readme and download page, and the download page names it as the stable version. The last push to the GitHub clone is 2024-05-19, the last Bitbucket commit is 2024-02-08 and the last release is 2019-09-05; under the four-year rule the import will move this record to stub, while the status stays accepted here. firstRelease is left out: tags 1.1 and 1.2 date from 2013 and 1.1@316 from 2011, the last being an import-era tag, and no page states a first release year. The maintainer is the name of the Bitbucket workspace phpLiteAdmin, a personal workspace; neither the readme nor the source names a person. The Docker image the download page mentions is unofficial and is not recorded. The GitHub repository was created 2015-01-19; its oldest tags carry 2011 and 2013 commit dates, from an earlier history that the repository imported.
