notes: >
  Accepted on the README's statement that Asynqmon "is also a library which can be imported into an existing web application", with the net/http and gorilla/mux examples as the wiring. The record has no homepage: the GitHub homepage field is empty and the repository is the only project site. The GitHub releases list ends at v0.7.1 (2022-05-06); the tag v0.7.2 has no GitHub release object, and the Go module proxy lists it as v0.7.2 at 2023-07-03. The latestReleaseDate follows the proxy, the module registry the project publishes to; a reviewer should decide whether a tag without a GitHub release counts, because the GitHub-only reading would put the last release at 2022-05-06 and move the record to stub under the four-year rule. The newest commit on the default branch is dated 2023-07-04, while the repository's pushed_at is 2024-05-21 on another ref. The GitHub language field reads TypeScript for the web UI; the Go server is the language recorded here. The Go module has no download figure, so none is recorded. The README names Asynq as the task queue it monitors; no record exists for asynq and it is no basedOn, since the README calls Asynqmon a UI for it. Building from source also needs Node.js and Yarn for the frontend, which the README states; the Go minimum is the README's 1.16 and go.mod's. The README also builds a Docker image locally with make docker. The Prometheus integration (metrics exporter and query address) is a flag, not a field. The Docker Hub pull count is the image the README's docker pull names.
