notes: >
  Whether a user can install and run Marble without the hosted service is in doubt: CONTRIBUTING.md describes a local development setup that needs a Postgres database (Neon or Docker), Upstash Redis, Google and GitHub OAuth apps and Cloudflare R2, apps/api/README.md deploys the API as a Cloudflare Worker, and the docs index at docs.marblecms.com/llms.txt has no self-hosting or deployment page; a self-hosting or deployment guide from the project would settle it. The docker-compose.yml in the repository starts Postgres and Redis only, not the application. The repository has no tags or GitHub releases, so no release date or major is recorded and lastCommitDate holds the newest commit on main. The homepage sells hosted plans (Free, Hobby, Pro) on marblecms.com/pricing; no prices are recorded. Its license is AGPL-3.0 per the GitHub API and the LICENSE file, and the record does not claim a commercial license. The repository is a pnpm monorepo with a Hono REST API, a Next.js dashboard and an Astro marketing site, per CONTRIBUTING.md. The GitHub organization name is usemarble; the maintainer's legal name is not stated on any page read (the footer says "© 2026 all rights reserved", the LICENSE holds only the AGPL text, and the terms are governed by Nigerian law, which does not state a headquarters). The repository was created 2024-11-16 per the GitHub API; firstRelease is not recorded because no release or tag exists.
