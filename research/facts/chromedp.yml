notes: >
  No project site is named in the README, so no homepage is recorded; the Go reference on pkg.go.dev is a Go documentation host and not recorded. Stars, contributors and releases belong to the repository chromedp/chromedp. The README points to the examples repository (45 programs) and to a GitHub Discussions board; the README sends questions and feature ideas to the GitHub Discussions board, recorded as forum. What the README describes: the package starts a browser (headless by default) or connects to one that is already running, and runs actions against its tabs; the examples cover clicking, reading text, filling and submitting forms, request interception, cookies, screenshots, PDF printing, device emulation and several tabs; it needs no external driver, uses only the Go standard library and the cdproto module, and talks to the browser it starts through a pipe. The maintainer is the copyright holder named on the LICENSE line; the owning GitHub organization is chromedp. The v0.1.0 tag dates from 2018, which is the oldest tag; the repository itself was created in 2017. The README names the Chrome DevTools Protocol as the protocol it speaks; the protocol is not a record and sits here, not in basedOn. The Go minimum is recorded as runtimeMin, but the import does not map Go minimums, so review the record page for it.
