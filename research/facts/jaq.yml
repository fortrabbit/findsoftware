notes: >
  The repository has no GitHub release and no tag, so no version, release date or major is recorded, and lastCommitDate is the date the listing uses. The README says GitHub Pages does not whitelist the jekyll-asciidoc plugin, so the workflow builds the site and the template needs it. The README says the workflow pushes the generated content to the gh-pages branch, from which it is hosted; it does not say the output is static files, so runsAs and renderingModes are not recorded. The README names the Jekyll Installation page for Ruby and RubyGems but states no minimum version. The GitHub language field reads CSS, which no page states, so language is not recorded; the Ruby runtime comes from the README.
