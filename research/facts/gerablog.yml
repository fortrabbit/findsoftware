notes: >
  No project website is recorded: the CSV homepage is the repository, and the blog linked from the README is the author's own site, not the project's. The README is the only documentation page; the Rubygems documentation link is a generated rubydoc page and is not read. The GitHub API reports no release; the tags gem_0.1.0 to gem_0.2.1 are older than the registry's latest version 0.2.2, so the registry supplies currentMajor, latestReleaseDate and firstRelease (the first registry version, 0.1.0, 2017-01-15). The Rubygems downloads figure is the gem's total. The LICENSE file names the copyright holder and the MIT license; the Rubygems metadata carries the same MIT license. The README describes Tenjin as the template system for the layout files and prism for syntax highlighting; prism is not recorded as a field. The minimum Ruby version is the registry's ruby_version field for the latest version.
