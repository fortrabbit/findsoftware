notes: >
  Archived on GitHub by its maintainer: the README on the dev branch opens with "This project is archived" and says the maintainer has not worked on it for four years and will hand the project to a trusted maintainer; the README also names Storybook Docs, Histoire and pure Astro websites as alternatives (both are records and are recorded as alternativeTo). The repository description says "Created from react styleguidist for Vue Components", recorded as basedOn react-styleguidist; the README does not call the project a port. Maintainer Bart Ledoux comes from the npm package author field; the LICENSE copyright names "Vue Styleguidist" and the README credits Artem Sapegin, Rafael Escala and Bart Ledoux as authors. The npm package vue-styleguidist is the install target; the same repository also publishes vue-docgen-api and vue-docgen-cli, whose latest tags (2024-08-01) are not this package. npm latest 4.72.4 is not deprecated; the npm dist-tag next (4.0.0-beta.19) is dated 2019, older than the latest release, so no latestPrereleaseDate. The Discord badge in the README links to a channel of the Vue Land server (the GettingStarted page says it requires a Vue Land account), a Vue community space, so no discord fact is recorded. The homepage's Vue CLI plugin and Deployment pages list hosting providers (Netlify, GitHub Pages, surge.sh) that are no facts here. firstRelease 2017 is the author date of the oldest release tag, v1.0.3 (2017-06-12); the repository was created 2017-06-11. Runtime node: the npm engines field requires node 10 or later for the latest version.
