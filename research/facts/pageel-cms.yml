notes: 'The README badge and the LICENSE file both say MIT; GitHub detects the license as NOASSERTION, so the license entry cites the LICENSE file. The LICENSE copyright line names "Le Hong Tien (tienledigital) and REDD CO., LTD"; the company name with its legal form is recorded as maintainer. The address is taken from the LICENSES.md notice. The first release is v1.0.0 of 2025-12-12. The npm package @pageel/cms is the Astro integration bridge (packages/cms-bridge) and is recorded as npmName; the README documents installing by cloning the repository. The Git providers are not a field: the deployment doc (https://github.com/pageel/pageel-cms/blob/main/docs/deployment.md) names GitHub as the default service and Gitea and Gogs as options through CMS_SERVICE, and the homepage marks Gitea and Gogs as beta. The README names Pageel Workhub as a commercial product for team workflow, review and permissions; it is a separate product and no page was read that describes an edition of the CMS, so no paidEdition is recorded. The README describes three login modes (server, connect, open), which are not recorded as userRoles or sso. The homepage shows version v2.0.0 (OSS) while the latest GitHub release is v2.5.8; the repository is the source of record. The deployment doc says the rate limiter resets on each cold start on Vercel.'
