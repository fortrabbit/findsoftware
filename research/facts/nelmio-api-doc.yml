notes: >
  No homepage: the GitHub homepage field is empty, and the README links only the symfony.com documentation, so that page is recorded as docs. basedOn Symfony rests on the package manifest at v5.13.2, which declares the type "symfony-bundle"; the README adds that the minimum Symfony version is 6.4, and the symfony.com page lists the bundle under Symfony's bundle documentation. The composer.json at 5.13.2 requires PHP >=8.2; the README's 5.0 migration note says the bundle requires PHP 8.1 or higher, which is the 5.0 statement and is superseded by the manifest at the latest tag. The README says version 4.0 brought OpenAPI 3.0 support and that Swagger 2.0 is in version 3; the spec versions are compatibility and stay here. The symfony.com page says the bundle supports Symfony route requirements, PHP attributes, Swagger-Php attributes, FOSRestBundle attributes and applications using Api-Platform, supports models through the Symfony serializer, the JMS serializer and the willdurand/Hateoas library, supports Symfony form types, and provides a sandbox to interactively experiment with the API; its UI routes include Swagger UI, Redocly, Stoplight and Scalar, which is compatibility and no alternativeTo statement. The README says the bundle runs under FrankenPHP worker mode and other long-running workers; no runsAs statement is recorded because the README names no process model for the live site. The default branch is 5.x, and the highest stable release is 5.13.2 from 2026-10-30; the 4.x tags are older lines. The first tag is 1.0.0, whose commit is dated 2012, the same date as the oldest Packagist upload; the oldest GitHub release is 2.4.0 from 2013. The README sponsorship note from JetBrains concerns tool licenses for the maintainers and is no fact of the project. The composer.json authors line names "Symfony Community", while the LICENSE copyright line names Nelmio. The packagist figure is for nelmio/api-doc-bundle, the package the install command names.
