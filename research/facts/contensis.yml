notes: >
  Contensis is a hosted service; criterion 2 is waived. The JavaScript Delivery API client contensis-delivery-api (contensis/contensis-delivery-api, ISC per npm, GitHub reports no license, npm package of the same name, first published 2019, major 1) is a client of the service, not the service, so its license, stars, contributors, npm figures and release dates are not recorded as the product's. The GitHub organization also holds the management API client, the CLI and Blocks examples. The docs describe Blocks as Docker images pushed to Contensis for release, which is a deployment path on the hosted platform, not a self-host option. The "preview page" setting on content types is a preview URL, not a live preview of unsaved edits, so livePreview is not recorded. The Management API is described for importing content from other systems without naming a source system, so importsFrom is not recorded. The legal entity is Zengenti Limited, the name the privacy notice uses; the footer says Zengenti Ltd. The pricing page is rendered by script and shows no plan details in raw text, so none are recorded. The docs point users to a Contensis community on Slack, which has no field.
