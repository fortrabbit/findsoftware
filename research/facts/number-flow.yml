notes: >
  Doubt: no page read states an install command or an install sentence. The README names no install route and links to the site for the docs; the site's React, Vue, Svelte and vanilla pages show only import statements for @number-flow/react, @number-flow/vue, @number-flow/svelte and number-flow, and the vanilla page gives an esm.sh import in a code comment ("if not using a bundler"). What would settle it: an install command or sentence on number-flow.barvian.me or in the README, naming npm or a CDN. The framework bindings are separate packages with their own versions (@number-flow/react, @number-flow/vue, @number-flow/svelte); the core is framework-agnostic, so basedOn is not recorded. The npm figures are for the number-flow package the README badge names. The repository, its stars and contributors cover the monorepo, which also holds the binding packages and the site. The npm registry shows the first upload of number-flow 0.1.0 on 2024-09-30, after the GitHub release v0.1.6 of 2024-08-20, which sets firstRelease. The README's "You may also like" section links TextMorph, which is not a comparison or alternative statement. The site footer and author links name the creator on X, which is a personal account and is not recorded as the project's x field. The site's runtime is not stated; no runsAs is recorded because no page says the component runs in the browser.
