notes: >
  Monorepo: the pablo-abc/felte repository holds the core packages and the framework bindings, so stars and the contributor count belong to the monorepo. The npm figures count the felte package, the core the Svelte install page names. Official bindings in the same repository, named in the README: @felte/solid, @felte/react and @felte/preact (React and Preact), @felte/vue (marked experimental), and @felte/element (web components, the vanilla JavaScript route). Reporter packages (@felte/reporter-svelte, -react, -dom, -tippy, -cvapi) and validator packages (@felte/validator-yup, -zod, -superstruct, -vest) are packages of the same repository named in the README. The repository has no GitHub releases; its tags stop at v0.4.0, and the newest stable version is the npm release 1.3.0, which the registry date and major come from. The npm dist-tag next (1.0.0-next.27) is a prerelease and is not recorded. The homepage links the maintainer's personal Mastodon account (sivar.cafe/@pablo); it is not the project's account, so no mastodon field is recorded. The README says the library "should work in all evergreen browsers", a browser support list, so no runsAs is recorded. The v0 documentation lives at v0.felte.dev, linked from the homepage. Maintainer from the LICENSE.md copyright line; no company or foundation is named in the repository.
