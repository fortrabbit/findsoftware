notes: >
  The README's opening notice ("Kindly note that this library has been deprecated.") is the only end signal: the repository is not archived, the npm package has no deprecated flag, and the homepage shows no notice. The notice names a newer version, cleave-zen (github.com/nosir/cleave-zen), which has no record here, so no successorOf is recorded. The CSV row says accepted; the reviewer decides whether this status stands. The README's feature list names ReactJS and AngularJS (1.x) bindings and a phone addon per country, which are part of the package; no basedOn is recorded because the project does not call itself a binding of those frameworks. The README's only browser mention is a code comment, so no runsAs value is recorded and hosting stays empty. The Apache-2.0 license is stated in the README and by the GitHub license detection; the README's Get in touch line links the author's personal Twitter account, which is not recorded as the project's x; the LICENSE file has no copyright line, so the maintainer comes from the homepage credit. The npm figure counts downloads of cleave.js for the week 2026-10-26 to 2026-11-01; the registry package is the one the README installs. The GitHub tags and releases run from 2016 to v1.6.0 (2020-05-19). The README also states that libphonenumber is included under Apache-2.0. Prose sources: the README's usage section gives the CommonJS, AMD and ES module forms, the phone addon, and the documentation links; the feature list gives presets for card numbers, phones, dates and numerals, and the homepage adds time formatting and custom delimiters, prefixes and block patterns.
