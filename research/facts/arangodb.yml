notes: >
  The CSV row names arangodb.com, which redirects to arango.ai, the site of the company Arango, where ArangoDB is still the name of the database product; the homepage is arango.ai. The maintainer is ArangoDB, Inc., the Licensor named in the BSL LICENSE of the latest tag; the privacy page names ArangoDB GmbH (Cologne, Germany) as owner of the site, which is left here and gives no hqCountry for the recorded maintainer. The license is the BSL 1.1 of the latest tag v3.12.13 with a 4-year change date to Apache-2.0 for each release; the repository's GitHub detection shows no license. The downloads page describes the Community Edition as free for non-commercial use and datasets up to 100 GB and, from 3.12.5, as including all Enterprise features with no time limits; this is the same BSL license in the vendor's words. The pricing page FAQ states that Enterprise Edition adds features beyond Community Edition, recorded as paidEdition; the two pages differ on features and the downloads wording stays here. Version: the highest stable tag is v3.12.13, tagged 2026-10-28 with no GitHub release object, so latestReleaseDate is that tag's commit date; the minor line 3.12 is not recorded. firstRelease comes from tag v1.0.99 (2012-09-03), the earliest tag of a numbered release line; tags v0.0.1 (2011) are repository setup tags and no changelog on the default branch lists dates. The Docker image is the official library image arangodb, the pull count is the Docker Hub figure for library/arangodb; the arangodb/arangodb namespace has its own count and is not recorded. The Linux install page says Windows and macOS packages stopped at 3.12. The LinkedIn and YouTube links on the homepage have no field and stay in these notes. The Slack or community forum was not located on the pages read.
