notes: >
  Mercurial is the primary source: the homepage and download page point to freenginx.org/hg/nginx, and the GitHub repository is a mirror ("Mirror of http://freenginx.org/hg/nginx/"); the GitHub repository is recorded because it is the one the API reads. The project has no GitHub releases; release data comes from the homepage news and the download page. The homepage puts both 1.30.2 (stable) and 1.31.5 (mainline) on 2026-10-27; currentMajor is 1 under the major-only rule, and the stable line 1.30 and mainline line 1.31 go here; nginx.yml still records "1.30" and reviewer should align it. No freenginx.org page uses the word "fork", and the GitHub description says "Mirror of", so forkOf is left out; the homepage says "an effort to preserve free and open development of nginx", and the 2024 news entry says "The goal of the project is to keep nginx development free from arbitrary corporate actions". Mailing lists on the support page are the community channel. The homepage states the license as "2-clause BSD-like license", GitHub reports no license, and the LICENSE file at freenginx.org/LICENSE names the copyright holders Igor Sysoev (2002-2021) and Nginx, Inc. (2011-2024); the legal entity is not named as maintainer because the project names none, so maintainer is the GitHub organization. The 2024 news list ends with the project announcement dated 2024-02-14; the first release entry is 1.25.4 dated 2024-02-20. The control documentation states the master process and worker processes model that backs runsAs. Fields coined: none.
