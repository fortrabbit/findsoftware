notes: >
  The homepage istanbul.js.org answers over https and names the nyc command-line client. Its footer reads "Istanbul · v1 · Revised BSD License", which describes Istanbul v1, an older release; the current license is the ISC license in LICENSE.txt, so the Revised BSD statement is not recorded as a license entry. The LICENSE.txt copyright line names "Contributors" with no legal name, so the maintainer is the author named in package.json at the highest stable tag, Ben Coe; npm lists three maintainers and the repository owner is the istanbuljs organization. The README's community link is a general community Slack, not the project's forum, so no forum is recorded. The README's Tidelift section sells commercial support for dependencies; it is a subscription, not an edition of nyc. The README's CI badge links to another repository and is not a fact. The README names Jest and tap as runners that already include Istanbul coverage and do not need nyc; that is no alternativeTo statement. The README says nyc instruments ES5 and ES2015+ JavaScript and gives source-mapped coverage for Babel and TypeScript projects, and that it wraps a test command such as mocha; the homepage shows the command "nyc mocha" in a package.json test script. These are in the description and the install route rather than fields.The highest stable release nyc-v18.0.0 (2026-02-22) is also the npm latest version; the oldest tag v1.1.0 has the commit date 2015-05-10, and the npm first upload 1.0.1 (2015-05-09) sets firstRelease. The engines field of package.json at the highest stable tag allows Node 20 and Node 22 or newer, so runtimeMin is recorded as node 20. runsAs local comes from the README's dev-dependency sentence, since the tool runs on a developer's machine or in CI and not on a live site. Stars and contributors belong to the repository, which is a single package.
