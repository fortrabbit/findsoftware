notes: >
  The candidate row lists http://www.gradio.app; that address answers with a 301 to https and the project's own site is https://gradio.app, which answers 200, so the https address is the homepage. Gradio is a Python package the install docs name as pip install gradio; the package itself has no license statement beyond the README and the GitHub API, both Apache-2.0. The maintainer is recorded as the GitHub organization name "Gradio" because the repository names no legal entity on its pages; the PyPI author field lists the Hugging Face team address, and no page names Hugging Face as owner, so parent is left out for the reviewer to decide. The README says Gradio is built on top of many open-source libraries and shows their logos (FastAPI, Svelte, Vite and others); no single parent is named in text, so basedOn is left out. The README names the Gradio Python and JavaScript clients, Hugging Face Spaces and server mode as ecosystem parts; they are not recorded as separate records. The highest stable gradio package release is gradio@6.30.0 (2026-10-08), so currentMajor is 6; the repository tags also carry many other packages, which are not counted. The oldest GitHub release in the repository is v2.3.6 (2021-10-08); the oldest PyPI upload is 0.1.0 (2019-02-19), so firstRelease is 2019. PyPI's JSON carries no download figure; pypiDownloads is the pypistats last_month figure. The homepage's "Share Instantly" feature creates a public link through demo.launch(share=True) and describes it as pointing at a demo running on the user's local computer; that is a feature of the library, not a hosted offering, and is not recorded as one. The Hugging Face hosting claim is recorded without its price. Contributors are counted across all pages with per_page=1.
