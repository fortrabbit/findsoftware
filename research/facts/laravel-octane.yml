notes: >
  The repository default branch is 2.x. Octane's own README names the Laravel website as its documentation home; the docs page is the homepage. The LICENSE copyright line names Taylor Otwell; the Laravel LLC and Laravel Holdings Inc. names are not stated as Octane's maintainer on a page read, so they are not recorded. The basedOn fact follows the composer.json description, "Supercharge your Laravel application's performance."; neither the README nor the docs use the words "based on". The application servers Octane serves through (FrankenPHP, RoadRunner, Swoole and Open Swoole) are separate projects that Octane supports; the records frankenphp, roadrunner and swoole exist, and none is named as a parent. The first upload is v0.1.0 of 2021-04-06 on Packagist, a prerelease on GitHub; no stable release predates it. The Packagist figure is the total downloads count (the monthly figure is 3340878 on the same page); the CSV's 35.3M figure is older. Fields coined here: none.
