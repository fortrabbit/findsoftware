notes: >
  Discontinued: the README opens with "This repository has been archived", and the archived repository is the one the project's pages name as its source. The successor named there is Baz (github.com/technologylab-ai/baz), a Zig successor built for Zig 0.16.0 on bounded/http, offered as the alternative on the way. The README says Zap does not work on Windows because of facil.io; WSL2 or a container is its suggestion. The homepage zigzap.org now redirects to an unrelated domain, and zap.zigzap.org does not resolve, so no homepage or docs link is recorded; the README's docs link zigzap.org/zap goes to the same redirect. The last non-prerelease release is v0.11.0 (2025-08-28); the oldest GitHub release is a 2023 prerelease. The runtime value "zig" is new; Zig has no runtime of its own, so the record names the compiler. The Zig version comes from the README FAQ.
