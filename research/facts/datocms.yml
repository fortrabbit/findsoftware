notes: >
  DatoCMS is SaaS only; no installable server part was found. repository, license, language and stars describe the open-source JavaScript API clients monorepo, not the service; its releases are tagged per package (latest @datocms/dashboard-client@6.10.0 on 2026-10-14), so no single latestVersion is recorded. @datocms/cma-client-node had 74,050 weekly npm downloads in the same week. The about page names three cofounders by role; names were not extracted. Social links in the page markup were not resolvable to official accounts beyond LinkedIn and GitHub. Hosting regions are not stated on the pages read.
