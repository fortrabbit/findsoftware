notes: >
  Maintainer from the LICENSE copyright line: ZURB, Inc. The same file also names Jeff Collins (2014) and Matt York (2012) as copyright holders of older code. The README describes it as "a cross-browser @mention engine written in ES6, no dependencies". Stars and contributors are the repository's own counts. The README's framework section lists bindings that are separate projects (vue-tribute, angular-tribute, ngx-tribute, ember-tribute, tribute-rb), so none is basedOn. The README names the editor integration Froala, a third-party product, and the browser list "Firefox, Chrome, iOS Safari, Safari, IE 9+, Edge 12+, Android 4+, and Windows Phone" is a support list, so neither is recorded as a field. The README's first install sentence lists Bower, but gives no Bower command, so no bower route is recorded. npm's latest tag is 5.1.3, while the GitHub latest release is 5.1.4 (2025-01-30); both are major 5. The RubyGems gem "tribute" is at version 3.6.0.0 (2019-02-27) and its download count is all-time; the gem is listed under the README's Ruby Gem section, and its homepage is the repository. runsAs browser rests on the README sentence calling Tribute a cross-browser engine; no sentence says in so many words that it runs only in the visitor's browser.
