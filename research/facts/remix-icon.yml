notes: >
  The License file of the repository (Remix Icon License v1.0, version 1.0 dated January 2026) is the license the README names for the latest release. The npm package remixicon declares Apache-2.0 for 4.9.1, and GitHub detects no license for the repository (NOASSERTION); both statements are recorded as their own entries. licenseModel is not recorded: the custom license allows free use with restrictions (no standalone icon sales, no competing icon library, no brand use), and the import reads the Apache-2.0 statement as open source. The reviewer decides the model and whether the npm statement stays. The homepage remixicon.com returns an application shell with the title and meta description in its HTML; the description matches the README. firstRelease 2018 is the first npm upload (1.0.0, 2018-12-17), older than the first GitHub release (2019). The Sponsor and donate links are not editions and are not recorded. The RemixIcon-MCP, RemixIcon-Slides and Figma plugin sub-projects are not listed as plugins.
