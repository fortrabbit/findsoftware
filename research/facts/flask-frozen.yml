notes: >
  The candidate id is Flask-Frozen; the README title, the documentation and PyPI call the project Frozen-Flask. The pyproject Homepage URL points to the repository. The oldest PyPI upload is 0.2 (2011-02-21), which is firstRelease; the GitHub releases start later (v0.12, 2016-08-28) and run to v1.0.2 (2024-02-09), which gives currentMajor 1 and latestReleaseDate. The README says the project is maintained by CourtBouillon, previously by two named individuals and originally created by Simon Sapin; the maintainer is recorded as the current maintainer, and no legal form is stated on the pages read. The docs call the package an extension for a Flask application and PyPI lists flask as a dependency, and the documentation says "This documentation assumes that you already have a working Flask application", so basedOn flask is recorded. The category is ssg for the static output; the project is a library that a developer calls from a script. The GitHub license field reports NOASSERTION, while the README states BSD 3-clause, so BSD-3-Clause is recorded from the README. The docs say a developer creates a Freezer from the app object and calls its freeze method from a script, that Frozen-Flask finds URLs by simulating requests at the WSGI level and following links built with url_for, and that pages it cannot find need URL generators registered on the Freezer.
