notes: >
  No company is named on the site; the footer reads "© 2026 Hexo" and the project lives in the hexojs GitHub organization, so maintainer is the organization and maintainerType community. The homepage links an X account but the fetched text gave no handle, so x is absent. npm weekly downloads for hexo (20113) sit beside hexo-cli (16635), the global CLI the docs install first. The docs list a Node.js minimum per Hexo version; only the current line is recorded. The templates docs use EJS examples without naming a default engine; the homepage names EJS, Pug and Nunjucks support. The themes count (456) is the homepage claim; the plugins page shows 512 items. Coined fields: contentFormats, themeDirectory, themeCount (theme total shown by the project), deployCommand (built-in one-command deploy). contributors is the GitHub API count including anonymous contributors.
