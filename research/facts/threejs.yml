notes: >
  The default branch is dev, and the GitHub release line is numbered r187 (published 2026-10-30), not semantic versions; the npm package is 0.187.0, so a major would read 0 and no currentMajor is recorded. The LICENSE copyright line names "three.js authors", a group, which is recorded as stated; the GitHub owner mrdoob is a user account and is not recorded as the maintainer. The homepage only carries its title, "Three.js – JavaScript 3D Library", so the category quote is from the README. The README names SVG and CSS3D renderers as addons; renderers are not fields. The README's "Questions" link is Stack Overflow, a general site, and is not recorded as the project's forum; the homepage's forum link is discourse.threejs.org. The CDN route is the import-map route the page names as "Option 2: Import from a CDN". The npm figure is for the three package the install page names; stars and contributors are from the repository, which also contains the manual and examples. firstRelease 2010 is the oldest tag r1, whose commit is 2010-04-24, earlier than the npm package's first version (0.54.0, 2012-12-07). The three.js manual lives in the repository at manual/pages; the website's manual page is a script shell and was not used as a quote source.
  The README's usage section says its example code "creates a scene, a camera, and a geometric cube" and adds the renderer's viewport to the document body element. The README says the library's renderers are WebGL and WebGPU in the current builds, with SVG and CSS3D renderers as addons. The installation guide's production step says that a build with the vite build command produces a dist folder "ready to be hosted on your website", and its CDN route is the import map it describes as Option 2, which needs no build tools but a local server to run the page.
