notes: >
  Wix Headless is a project type inside a Wix account. Wix-managed headless runs the creator's frontend on Wix infrastructure (the Astro integration, or other frameworks with limited integration); self-managed headless connects a frontend the creator hosts to Wix's backend through the JavaScript SDK or REST API. The backend is Wix's hosted service in both cases, so no part of it is installable. The docs say Wix Headless is free to start and that a premium plan unlocks payments, analytics and custom domains; no prices are recorded. The docs also list SOC 2 Type II, HIPAA and GDPR compliance, a coined kind kept here in notes. Wix's own website builder is the editor-built Wix site, which is not this record; the headless project is scoped by the business APIs it exposes, so it is not a website builder with no API. The npm package @wix/sdk and its download figure are SDK sources and give this record nothing. The Wix Terms name Wix.com Ltd. as the contracting company, and the privacy page gives its Tel Aviv address; the affiliated companies are not recorded. The docs overview links the Wix premium plans page; a premium plan unlocks payments, analytics and custom domains. The docs link www.wix.com/headless as the Wix Headless homepage.
