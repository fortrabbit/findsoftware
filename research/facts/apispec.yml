notes: >
  apispec has no GitHub release objects: its newest stable version is the 6.10.1 tag, which is also the PyPI latest version (uploaded 2026-11-04), so the release date and major come from PyPI and the tag. The PyPI releases start with 0.3.0 (2015-10-03); the oldest git tag, 0.1.0, has a commit dated 2015-09-14, which sets firstRelease. The project describes itself as framework-agnostic and states built-in support for marshmallow, a schema library it uses, and the Flask plugin is in a separate apispec-webframeworks package; neither is a basedOn statement, so none is recorded. The default branch is dev. The install page also gives a route from the development branch with pip and git; that route is a source route and is not recorded as a separate installMethod. Maintainer is the copyright line of the LICENSE file. Requires-python in the pyproject at the 6.10.1 tag is the runtime minimum; PyPI reports the same. PyPI's own API reports no download counts, so pypiDownloads comes from pypistats: last_month as of 2026-11-04, a rolling window.
