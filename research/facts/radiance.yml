notes: >
  The GitHub repository Shirakumo/radiance is archived, and its README says the project moved to Codeberg in August 2025 and no longer takes issues or pull requests there; the project's own page shirakumo.org/projects/radiance redirects to codeberg.org/shirakumo/radiance, so Codeberg is recorded as the repository and the archive is not a discontinued signal under AGENTS.md. The CSV row said discontinued; the status is accepted because the project moved, and the status follows the release rule. The Codeberg repository has no releases and no tags, and the GitHub repository had none either, so currentMajor and firstRelease are not recorded: radiance.asd and the docs page both state version 2.1.2, which is a declared version and not a release, and the Quicklisp dist at dist.shirakumo.org lists commit hashes only. The newest commit on the default branch is dated 2026-10-15 on Codeberg, recorded as lastCommitDate. The GitHub stargazer count (340) belongs to the archived mirror and is not recorded as githubStargazers; the Codeberg repository shows 7 stars. The shirakumo.org home page calls Shirakumo a collective for open source software and a video game studio, and lists Yukari Hafner as lead author; no imprint with a legal form or country was found, so hqCountry is not recorded. The docs page at shirakumo.org/docs/radiance is the project's own generated documentation and is used as homepage and docs; the project's shirakumo.org/projects page is a redirect to Codeberg. The GitHub profile location of the organization is not used. The tutorial (Part 7, deployment) describes running Radiance as a long-running Lisp process behind an existing HTTP server, so runsAs is always-on; its server implementations are Hunchentoot (default), Wookie and Woo, and the database implementations listed are Postgres (Postmodern) and SQLite (Lambdalite is the default). The tutorial does not give a Lisp implementation requirement beyond "a running Lisp implementation", so runtimeMin is not recorded. The radiance-bootstrap project is a separate repository and is not recorded as a fact here.
