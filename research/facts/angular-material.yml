notes: >
  The docs site material.angular.dev answers 200 but its pages are a JavaScript shell; the homepage is listed unreadable and the homepage value comes from the repository's homepage field. The getting-started guide was read from its source file in the repository, guides/getting-started.md. The guide says ng add installs Angular Material and the Component Dev Kit (CDK) and asks for a prebuilt or custom theme and typography styles. The README states that Angular Material and the CDK follow the same support and release policy as the Angular framework, and that the components target the two most recent versions of major browsers. Package is @angular/material; the CDK is a separate package in the same repository and is not counted. Monorepo tags are shared across packages (v22.2.4 and so on); the highest stable tag is v22.2.4, published 2026-10-21, and v22.3.0-next.3 is a prerelease published minutes later on the same day, which sets latestPrereleaseDate. The first GitHub tag is 2.0.0-alpha.0 (2016-03-15); the @angular/material npm package was created 2016-09-22. The README says the Angular Components team is part of the Angular team at Google; no parent is recorded for that statement. The HTTP Archive figure is the mobile origin count for the "Angular Material" entry. The npm weekly figure is the sum of daily downloads for 2026-10-18 to 2026-10-24 from the range endpoint, because the last-week endpoint returned the window 2026-06-25 to 2026-07-01. Discord and X links come from the docs site's source in the repository (docs/src/app/shared/support/support.html), since the deployed site is a JavaScript shell; both are the Angular project's accounts. The guide says ng add also adds the Roboto font and the Material Symbols icon font to index.html, and sets global styles on body and html.
