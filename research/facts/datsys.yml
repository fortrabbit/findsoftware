notes: >
  Stub: the project has no GitHub release and no tag, so the import judges it by lastCommitDate (2017-06-15 on the default branch dev), which is more than four years old, and criterion 4 moves it to stub; a newer commit on the default branch or a tagged release would settle it. The CSV row says no versioned release found and was not a rejection. The README names Datsys as formerly Catalysis, which is a rename of this project, not a successor. The README says the project is a fork of Rente, whose repository it does not link, so forkOf is recorded by name only. The homepage field is empty and the README has no project site; the Heroku deploy button and app.json are not recorded as a deployment field. The project.clj carries version 0.0.1-alpha3, which is not a GitHub release and is not recorded as currentMajor. The runtime is not stated on any page the README links, so runtime is unknown here. The README roadmap and Datsync, Datview, Datreactor and Datspec are sibling libraries, not parents, and no basedOn is recorded. The README links a Gitter chat channel (https://gitter.im/metasoarous/datsys) and a Heroku deploy section its author says was copied from Rente and not tried, so neither is recorded as a field. Prose sources: the README's architecture section names the four libraries Datsync, Datview, Datreactor and Datspec, says they are modular and can be used on their own, and says the system is assembled with Stuart Sierra's Component library. The Usage section says the system is started from the REPL with (run) and that the app is opened in a browser at localhost on the port set by PORT.
