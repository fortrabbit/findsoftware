notes: >
  Hosted service: no self-install was found. The product has no GitHub repository of its own; the hyvor GitHub organization holds SDK and client code (hyvor-talk-libraries for JS, TS, React, Vue and Svelte; hyvor-talk-wordpress-plugin; hyvor-talk-examples for SSO back ends), recorded here only as notes under the hosted-service rule and not as the project's license, stars or downloads. The docs say the embed starts with "a simple HTML/JS snippet that you add to your website"; the homepage lists WordPress, Ghost, Shopify and other platforms as integrations. Plans are Personal, Premium, Business and Enterprise with credit-based usage on the pricing page (the pricing FAQ says a team can choose a paid plan after the trial), and a 14-day trial with all features except the custom email domain; no prices are recorded. The pricing page places user SSO on the paid plans and OIDC SSO for teams on the Enterprise plan; the homepage lists OIDC SSO for teams in the enterprise column. Stateless SSO (docs "SSO Introduction") lets a site's own accounts comment; it is a custom token flow, not a named login protocol, so sso holds OIDC only. The Data API ("All endpoints use the HTTP GET method, and returns a JSON response") and the Console API (resource reads and writes over HTTP methods, JSON) are recorded as headlessApi rest; the docs do not use the word REST. Webhooks, the Console API, the Data API, moderation rules and badges are features, not fields; the homepage describes the webhooks as notifications of events such as new comments and new members. The homepage states GDPR, CCPA and SSO compliance badges and "ISO 27001 Soon"; compliance has no field and is not recorded. The homepage says "Hyvor Talk is used by thousands of websites with millions of users", "10k+ Websites" and "30M+ Monthly Users"; none is a count, so reportedInstalls is not recorded. The legal entity is "HYVOR" on the terms, privacy and product terms pages, and no page read adds a legal form (the hyvor-relay record cites "HYVOR, SARL" from that project's own repository, a different source). The terms page gives the notice address "HYVOR, 10 Rue de Penthièvre, 75008 Paris, France". The YouTube channel link is on the homepage.
