notes: >
  The homepage is the documentation site of the project (jekyll.github.io/jekyll-admin) and it is the project's own site, so it is recorded as homepage; the repository is github.com/jekyll/jekyll-admin. The docs pages read were home, configs, api, architecture, development and self-hosting. The gem is installed through Bundler in a Jekyll site; the admin is served by Jekyll's own server at /admin and the API at /_api, per the architecture page. The self-hosting page shows a systemd service that runs jekyll serve with Restart=always behind nginx, so always-on is recorded next to local. The API page states it is pre-release before 1.0.0. The rubygems author line names Mert Kahyaoğlu and GitHub Open Source; the LICENSE copyright line is used for maintainer. The RubyGems versions API states ruby_version >= 2.7.0 for the latest version, which is the runtimeMin. The highest stable GitHub release is v0.12.0 (2025-02-27); the two v0.1.0 prereleases are not stable releases.
