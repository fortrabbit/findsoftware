notes: >
  The homepage and the docs site (Jekyll, Just the Docs theme) are readable; the README points to viewcomponent.org for documentation. The gem's runtime is Ruby; runtimeMin is the gemspec's required_ruby_version at the v4.20.0 tag, which the compatibility page repeats as Ruby (>= 3.2). The maintainer is the gemspec author "ViewComponent Team"; the LICENSE copyright line reads "2018-present ViewComponent contributors", and the GitHub owner is the ViewComponent organization. The first GitHub release is v1.0.0 (2019-08-20), after the repository was created in 2019-08; the RubyGems version list begins later, so the GitHub tag is the earliest. The RubyGems download figure is the gem's total; the CSV figure of 64.8M is older. Long-Term Support and feature-complete (homepage: "As of version 4, ViewComponent is in Long-Term Support and considered feature-complete") is no end statement. No latestPrereleaseDate: the 4.0 alpha releases of 2025 are older than the latest release. The README says nothing about a runtime server, so runsAs is not recorded. The compatibility page lists Rails (>= 7.1) as supported; it is recorded only as basedOn rails from the README statement. The homepage describes components as Ruby objects that encapsulate a template, and links no discord, forum or social account. Ecosystem counts from ecosyste.ms cover the rubygems package.
