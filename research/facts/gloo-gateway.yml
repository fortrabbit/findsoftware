notes: >
  Status is discontinued: the repository README carries an end-of-life notice for Gloo OSS, the open source edition in this repository, with releases still published (v1.22.7, 2026-10-21). The same README says Gloo OSS was donated to the CNCF "rebranded as kgateway", and calls kgateway "the natural successor to Gloo OSS" at https://kgateway.dev; kgateway is not a candidate in any candidates CSV and has no record, so successorOf is absent and a reviewer should decide whether kgateway becomes its own candidate and whether this record follows it. The solo.io product page for Gloo Gateway now presents kgateway ("Solo Enterprise for kgateway"), and the docs at docs.solo.io/gateway/latest present the Solo Enterprise for kgateway edition; the rename rule would make this record follow kgateway, which is a reviewer decision. GitHub reports solo-io/gloo as a fork of kgateway-dev/kgateway (created 2024-11-07); the README does not state a fork, so forkOf is absent. firstRelease is 2018 from the author date of the oldest tag in the repository (0.2.26, 2018-05-30); the GitHub release list starts in 2024 because the repository is a fork created then, which carries the old tags. The kgateway site says the project "was launched in 2018 as Gloo"; that date is not a release date of this repository and is not used. currentMajor is 1 from the highest stable release v1.22.7; the minor line 1.22 is not recorded. The install route is quoted from the docs landing page, and the glooctl CLI from its sidebar; Helm appears only in the docs option list, which is not quoted. The solo.io product page for Gloo Gateway is a sales page for Solo Enterprise for kgateway, so it is no homepage for this community edition, and its enterprise extensions are a separate kgateway product, so paidEdition is absent. The README's Enterprise Trial link is not a statement of an edition. The maintainer is the LICENSE copyright line. The CSV's stars (171) are this fork's own count. Fields coined here: none.
