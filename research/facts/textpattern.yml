notes: >
  The download page and the requirements page both state the PHP minimum; the requirements page gives PHP 5.6.0 as the minimum for 4.9, which is the value recorded. The homepage counts 882 GitHub stars and the API 885, so the API figure is recorded. The license is stated as GPL-2.0 by the repository API and as GPLv2 on the license page, which does not say whether a later version applies; both are recorded. The maintainer is recorded as the project's copyright holder, The Textpattern Development Team, as the project states it. The homepage describes the project as "over 23 years of development" and the about page gives "since 2004", neither is a first release year, so firstRelease is unknown. The installation guide names MySQL only; MariaDB is not stated. The plugin directory is the project's own site; the number of plugins is not stated as a count, so pluginCount is unknown.
