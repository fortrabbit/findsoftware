notes: >
  The homepage words the license as "Licensed under the Apache License 2.0", the same license as the Apache-2.0 entry. The repository has no GitHub releases; release dates come from the project's download page (couchdb.apache.org/downloads.html, "DOWNLOAD 3.5.3 (2026-10-12)"). The tag 3.5.3.post1 exists on the repository (commit 2026-10-20, tag dated 2026-10-21) and is not on the download page; it is a post-release, not an RC, so a reviewer must decide whether it is the current stable line. The CSV row put the date at 2026-10-09 from the 3.5.3 tag; the download page gives 2026-10-12. The earliest tag is 0.8.0 (2008-12-12), so firstRelease is 2008; no page read dates an earlier release, so it is not recorded. The Docker Hub image the install docs name is apache/couchdb (65,458,189 pulls); the Docker Hub official image library/couchdb has 207,536,321, which the CSV figure used. The Docker install page calls apache/couchdb the upstream release and says the Docker's top-level couchdb image mirrors it, so the upstream figure is recorded. The runtime is recorded from the download page, which says the binary packages ship with Erlang/OTP 27.3.4.18; the source install page lists Erlang OTP (26, 27, 28) among the dependencies of an install from the source tarball, so runtimeMin is OTP 26. The installation page says CouchDB uses cookie authentication, proxy authentication and JWT authentication (config/auth page); none of these is recorded as sso because the page does not name SAML, OIDC or LDAP. The homepage links twitter.com/CouchDB and fosstodon.org/@couchdb, recorded as x and mastodon. The Slack invitation, the Libera IRC channel and the mailing lists are community channels with no field. The homepage describes PouchDB as the counterpart for mobile and browsers; PouchDB is a separate project and not a basedOn. The docs describe storage as JSON documents; the categories field uses database only, since the import maps a document category to media.
