notes: >
  The gem is a test dependency: the README's Gemfile group :test and the RSpec and Minitest configuration show it is loaded by test suites, so no runsAs is recorded, since no page states where it runs. The README's Compatibility section names Ruby 3.3+, Rails 7.2+, RSpec 3.x and Minitest 5.x; the Rails version is not recorded, only the runtime and the gemspec minimum. The README says the gem also works in non-Rails apps that use ActiveRecord or ActiveModel, with a configuration block naming the library, and lists one community extension, shoulda-matchers-cucumber. The README's Team section names Pedro Paiva and Matheus Sales as current maintainers; the maintainer follows the LICENSE copyright line (Tammer Saleh and thoughtbot, inc.), and the README states that this repository is maintained and funded by thoughtbot, inc. The first RubyGems upload is 1.0.0.beta1 of 2011-01-19, earlier than the first git tag dated 2011-11-02, so firstRelease is 2011. The latest stable release is v8.0.1 (GitHub release 2026-06-12) and matches the RubyGems version. The RubyGems total download figure is recorded with its period.
