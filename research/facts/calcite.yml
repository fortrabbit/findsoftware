notes: >
  The get-started page is the install source; the page names the npm package and the CDN script, and states a prerequisite ArcGIS account. The licensing page states that Calcite is available with an ArcGIS Online, ArcGIS Enterprise or ArcGIS Location Platform account and is subject to the Esri Master Services Agreement. The account requirement is no field: the get-started page names a free ArcGIS Online and/or ArcGIS Location Platform account as a prerequisite, and the licensing page says Calcite is available with an ArcGIS Online, ArcGIS Enterprise or ArcGIS Location Platform account. The GitHub API reports the repository license as NOASSERTION; the package files state the MLA and "SEE LICENSE.md", so the GitHub value is not recorded. licenseModel is source-available as a reading of the MLA terms: the source is public, and use is granted under the agreement. The repository is a monorepo: the install docs name @esri/calcite-components, and currentMajor and the release date come from its stable tags. The default branch carries 6.0.0-next.6 in the package manifest, and the npm next tag is the newest prerelease. basedOn Lit rests on the "Built With Lit" badge in the components README, the project's own words. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header. The npm weekly figure is the sum of the daily counts for the period in the value. The homepage says the system "includes a UI kit, icons, color schemes, and a web component library". The licensing page says use is subject to the Esri Master Services Agreement, and the LICENSE file points to its use restrictions. The repository is public and holds the component source.
  The x link is the Esri developers account in the documentation site footer, not a Calcite-only account. The community page links the Esri Community forum and says Esri Technical Support is available with a paid subscription plan, which is support and no edition.
