notes: >
  No source repository: a GitHub search for control-webpanel and centos-webpanel names returned nothing for this project, and the homepage and docs link no repository, so no repository, stars or package field is recorded. The CSV row says the homepage is https://control-webpanel.com; it answers over https. The product is free to use under a proprietary license: the terms page says the software is free to use by everyone and forbids modification and reuse of the code, so license is recorded as stated; no open-source license is claimed. The CSV row's version 1.12 is stale: the changelog now lists 1.26 released 2026-10-26. currentMajor is 1 from the changelog entry "Version 1.26"; the changelog header "CWP7" names the product line (it follows CentOS 7 and covers EL8 and EL9 systems) and is not recorded as a major. licenseModel is left to the import, which derives it from the license statement. The changelog's oldest dated entry is 0.9.8.1166 on 2023-08-08, so firstRelease stays unknown from these pages. The CWPpro page sells CWPpro licenses on monthly and yearly terms; the prices are not recorded. The install page lists the supported systems as AlmaLinux 8 and 9, CentOS 7, 8 and 9, Rocky Linux and Oracle Linux, with at least 2 GB of RAM, and says CWP must be installed on a fresh OS and has no uninstaller; these are not recorded as fields. The homepage counters "0 Servers Running CWP" and "0 Partners" are placeholders and are not recorded. The homepage footer names LINANTO LLC (Georgia/Tbilisi); the terms page gives the company address in Tbilisi. The docs site pages read are from 2019 and 2020 and say nothing about current versions. YouTube (youtube.com/c/centoswebpanel_cwp) is linked from the docs site and the homepage; no youtube field is in the starter list, so it is not recorded. The wiki at wiki.centos-webpanel.com answers over https and is linked from the homepage; no wiki field is in the starter list. The homepage says a modules marketplace is planned for pro users; no marketplace page was found, so pluginDirectory is not recorded.
