notes: >
  The candidate homepage http://qpage.ir redirects to http://www.qpage.ir/, which answers only over plain http, so the record links https://www.qpage.ir/, which answers 200 with the QPage site. The README lists the Code Documents at http://www.qpage.ir/doc/index.html; the https address of that page answers 200 and is the one recorded. The maintainer is the copyright holder named in LICENSE; the README credits Sepand Haghighi and Mohammad Mahdi Rahimi as authors of the project's citation, and the second name is recorded here only in notes. The only GitHub release is v2.0 (2017-01-31), and the earliest tag v1.0 is dated 2015-10-08 by its commit, so firstRelease comes from that tag; the PyPI package has releases from 2016. A Python 3 requirement is recorded as runtimeMin 3 from the README wording "written in Python3". No page states the category, rendering mode or where the output runs: the homepage says to "upload output folder's content directly in your host" but never calls the output static, so renderingModes and runsAs are left out and the category comes from the candidate list. The coined category homepage-generator is not recorded. The latest release is from 2017, so the import judges listing by its own rule. The homepage quick guide says to install Python 3 "or use exe-file and skip this step". The README says it was developed on Windows and also runs on Linux and Mac OS X.
