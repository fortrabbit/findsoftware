notes: >
  Two release lines: the LTS tags (v3.20.253-lts is the newest, 2026-11-03, not marked as a prerelease) and beta tags (v3.21.87-beta, 2026-11-02). The beta is older than the latest LTS release by date, so latestPrereleaseDate stays out. currentMajor is 3 on both lines. The install docs name the image tooljet/tooljet (ee-lts-latest); the README's quick-try command uses tooljet/try, which is not recorded because the install docs name tooljet/tooljet. The Docker image is an EE image; the docs say a Basic license needs no key and a Trial or Paid license unlocks premium features. The README lists RBAC, SCIM provisioning, audit logs, workflows and embedded apps under "ToolJet AI (Enterprise)", and the licensing page names OpenID SSO login and audit logs as premium, so the README's Enterprise RBAC and the licensing page's premium features are treated as paid features: the sso values saml, ldap and oidc come from setup pages that carry a Team Plan label, and the three default workspace roles come from the user roles page. The README's Community Edition list does include "SSO support" and "granular access control", which conflicts with the licensing page; a reviewer may decide. The Docker install needs an external Redis for separate worker containers (setup docker page); Redis is a queue, not a database value. The embed feature ("Embed ToolJet apps securely within other applications or portals") and the webhook-triggered workflows are the wiring into other sites that criterion 1 asks for; the README names them, and the enterprise tier covers the workflows. The docs have a user roles page (user-management role-based access) that calls RBAC "pre-defined user roles and the ability to create custom groups". The migration page "Switch from Retool" offers an AI-assisted migration service, not a documented import, so importsFrom stays out. The Terms of Use name arbitration in Bangalore; that is no headquarters statement. The GitHub license field reads AGPL-3.0 and the README reads "ToolJet © 2023, ToolJet Solutions Inc - Released under the GNU Affero General Public License v3.0". The homepage links LinkedIn (https://www.linkedin.com/company/tooljet), not a field here. The compare pages name Retool and Superblocks as alternatives; neither is a record, so only appsmith is recorded. Plan labels on the SSO setup pages: SAML, LDAP and OIDC setup say Team Plan, multiple OIDC providers say Enterprise Plan; GitHub and Google SSO carry no plan label. The Slack invite (tooljet.com/slack) is in the README and homepage and no social field holds it; the Slack invite was not recorded as a field. The README lists a visual app builder with 80+ components, 90+ data sources, ToolJet Database (a built-in no-code database), multi-page apps, workflows, and embedded apps ("Embed ToolJet apps securely within other applications or portals"). The Docker page says ToolJet requires a PostgreSQL database to store application definitions and encrypted data source credentials.
