notes: >
  The project's own site has no separate about, pricing or terms page; the maintainer is the project team as its support page names it. The LICENSE.md file names MPL-2.0 only; no copyright holder is stated. The repository has no stable release before 1.2.0 (2024-05-01): the support page says all earlier releases are release candidate, beta or alpha builds, so firstRelease is the oldest release of any kind (v1.0.0rc1, 2019-11-17) and the stable line starts later. The highest stable release is v1.12.0 (2026-11-01), so currentMajor is 1 and the minor line stays here. The repository also ships a Python module (pykanidm) and an rlm_kanidm FreeRADIUS module, and the support page says the Python module trails the core Rust code; these are not separate records. The homepage names a Gitter channel and the GitHub discussions as the contact points; neither is a field here. The evaluation quickstart says a production deployment should follow the installation chapter because of security considerations, and the support page gives each stable release a limited support window after its release date. The homepage lists "User Self Service via the WebUI" and "Complete CLI tooling for Administration"; no administration web interface is stated, so adminUi is not recorded. The server install chapter names containers as the preferred deployment and says Kanidm will alternately run as a daemon/service. The server supports WebAuthn, OAuth 2.0, OpenID Connect, LDAP and RADIUS (homepage). The community page names William Brown as creator and project lead; the Cargo workspace authors list William Brown and James Hodgkinson. The migration paths are sync tools for FreeIPA and for LDAP servers that support RFC4533. The Homebrew and AUR routes are listed on the client tools page. The homepage names no legal entity. No npm package is recorded: the install docs name no npm package.
