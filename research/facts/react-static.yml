notes: >
  Status is discontinued on the maintainer's own statements: the README says the project is in maintenance-only mode with no new major versions, and the maintainer's discussion #1661 says "I'm going to let go of the project". The repository was last pushed 2022-10-31 and its last release is v7.6.0 (2021-10-11), so the import will also move the record to stub on release age. The CSV homepage https://github.com/react-static/react-static/discussions is a discussion page, not a site, so it is not recorded. The site react-static.js.org answers 200 with a js.org redirect interstitial that does not name its target; it is not read as the project's site, so homepage is unknown and a reviewer should decide. currentMajor 7 comes from the highest stable GitHub release v7.6.0; npm latest is 7.6.2, also major 7. The GitHub releases list holds five releases (v4.1.0 from 2017 is the oldest). The discussion #1661 author is an organization member (SleeplessByte). The npm package create-react-static belongs to another project and is not used. The docs folder's README is read in full and docs/config.md is searched for runtime and output terms; the docs folder has no separate deployment page.
