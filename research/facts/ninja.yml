notes: >
  The repository has tags but no GitHub releases; the newest tag is ninja-7.0.0, and the Maven Central artifact org.ninjaframework:ninja-core has 7.0.0 as its newest version, released 2023-12-07, so the registry gives currentMajor and latestReleaseDate. The first Maven upload is 0.4 of 2012-07-19, older than the oldest GitHub tag (1.2, committed 2013-03-27), so firstRelease is 2012. The site states Ninja is built using Servlets, Guice, JPA, Flyway and Maven, and that it does not reinvent the wheel; these are named as technologies used, not as a parent, so basedOn is not recorded. The site's version line reads "Version: 7.0.1-SNAPSHOT" and is not recorded. The site, the repository and the Maven artifacts are unchanged since 2023 apart from GitHub activity (last push 2026-04-03), so no end signal is recorded. The homepage answers over http with a redirect to https; the https address is used. Deployment has two modes: standalone with an embedded Jetty server, and WAR files for servlet containers; the homepage quote about a standalone application started on the server is used for runsAs. The homepage lists HTML, XML, JSON, JPA and caching as features, and the documentation menu lists WebSockets, validation, a scheduler, a cache and internationalization. The deployment guide says Ninja provides basic support for SSL and no support for GZip out of the box, and leaves both to the application container or a reverse proxy like nginx. The JPA page says JPA support is implemented by Hibernate and that the example application works with an in-memory H2 database.
