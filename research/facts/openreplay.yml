notes: >
  The GitHub API reports the license as NOASSERTION, because the monorepo carries several licenses: the AGPLv3 for most files, MIT for some directories, and the Enterprise License under ee/, each recorded as its own entry from the LICENSE file or the README. The docs call Docker Compose "an experimental feature" on the Docker deployment page; the Helm chart is the route the Kubernetes page documents. The README gives a baseline of 2 vCPUs, 8 GB of RAM and 50 GB of storage for a single VM; no runtimeMin applies. The homepage lists a Slack community and the Kubernetes page sends users to Slack for help, a coined community field, so the Slack link (slack.openreplay.com, join.slack.com invite) is recorded here only: https://slack.openreplay.com. Redis is required for the Kubernetes install per the docs but is a cache, not a database field value, so it is named here, not in databases. The tracker is an SDK installed in the monitored app; @openreplay/tracker (MIT on npm, version 19.0.5) is the package the tracker docs install, it is a client package, so no npm figure is recorded as a field (445269 downloads in the 2026-10-26 to 2026-11-01 window). The README names the Cloud as a hosted service beside self-hosting, and lists Dedicated and BYOC plans. No paidEdition is recorded: the ee/ license text says it adds "additional features, functionality and support" without naming any feature of the self-hosted product. The README says SSO is "for enterprise authentication" without naming an edition. The homepage contains no X, Discord or Bluesky link. The docs path for self-hosting that the README links is the deployment overview, which states "You can also deploy from source" as a route.
