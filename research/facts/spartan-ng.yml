notes: >
  The project calls the packages spartan/ui; the record keeps the CSV name Spartan. The install guide names @spartan-ng/cli for the Quick Start and @spartan-ng/brain for the primitives; the registry figures use the CLI, the first package named, and the brain package had 55,534 downloads in the same week (range 2026-10-19 to 2026-10-25). The repository is a monorepo that also ships spartan/stack, an optional full-stack set built on Supabase, Angular, tRPC, Tailwind, AnalogJs, Nx and Drizzle; it is not recorded here. The homepage and documentation say the components are SSR compatible and zoneless ready; that is compatibility, recorded in prose only. The homepage footer says Zerops powers spartan.ng and Angular teams, and the sponsor line names Zerops; that is a hosting and sponsor statement, not a hosted version of the software, so no hostedOffering fact is recorded. The project says it adapted patterns from shadcn/ui and Radix UI; that is an inspiration statement, so no alternativeTo or basedOn fact is recorded. The LICENSE copyright line names Robin Goetz (2024); the maintainer is taken from it. The homepage's MIT statement and the LICENSE file agree. The GitHub contributors count is the API count without anonymous contributors; the site shows 168. The first npm version 0.0.1-alpha.323 is dated 2023-11-28, before any GitHub release; the GitHub releases list starts with v1.0.0 on 2026-06-24. The RTL page states right-to-left support for the components and is recorded as i18n.
