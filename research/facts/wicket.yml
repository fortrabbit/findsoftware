notes: >
  No GitHub release exists on apache/wicket (the releases API returns none); the repository has tags only, with the release tags named rel/wicket-<version>. Per the rule for a project without GitHub releases, currentMajor and latestReleaseDate are taken from the registry: Maven Central's wicket-core metadata names 10.11.0 as release. The Maven Central search API returned no upload date for 10.11.0, so latestReleaseDate is the date on the project's own versions page, 30 Aug 2026. The homepage says 10.11 LTS and that 9.24.0 and 8.19.0 are the last releases of their lines; Wicket 11.0 is announced as due in the first week of October 2026 (news post of 11 Sep 2026), and no 11.x version was on Maven Central at checkedAt, so no prerelease is recorded. firstRelease is the oldest dated release in the Apache archive listing (archive.apache.org/dist/wicket/), 1.3.0-beta2 of 2007-06-29; the versions page lists 1.0.x to 1.2.x releases with no date, so the true first release is older, and the oldest GitHub tag wicket-1.0 (2007-07-27) is a repository import, not a release. The homepage says the project has been open source since 2004 and an Apache project since 2007; neither is a release date. The NOTICE file says Copyright 2006-2023; the site copyright line says 2026, and the site line is recorded. The ASF is a U.S. 501(c)(3) per apache.org, which states the legal form but not the headquarters, so hqCountry is unknown. Mailing lists (users@wicket.apache.org, a Slack channel on the ASF workspace) are on the community page; no list is recorded as forum because a mailing list is not a forum page. The deployment-mode page says the same WAR file runs on the server, so runsAs is always-on; the quick start runs an application from a main method with an embedded Jetty. Wicket's own pages list no paid edition, pricing page or hosted service.
