notes: >
  Status stays accepted: the repository is not archived, the last push is 2026-11-04, and no end statement appears. The docs page says "The latest version is coverage.py 7.17.2, released November 4, 2026", but PyPI lists 7.17.1 (2026-11-03) and no 7.17.2 at the check; the record keeps the registry figure. The Tidelift "For Enterprise" section sells a subscription that covers many packages, so it is no paidEdition. The docs call the command line the simplest way to use it, with an API for more control, but no sentence states where it runs, so no runsAs is recorded. The discord link is the #coverage channel on the Python Discord server and the forum is the Python discussion forum, both named on the docs home page as the help venues. The maintainer follows the LICENSE copyright line; the PyPI author field names "Ned Batchelder and many others", which is no separate legal entity. The PyPI name matches the install docs; firstRelease is 2009 from the oldest tag (a beta). The docs point to the general Python discussion forum and a channel on Python Discord for help; both belong to the Python community, not the project, so forum and discord are not recorded.
