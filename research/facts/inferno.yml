notes: >
  The guide pages on infernojs.org (the docs index and /docs/guides/installation) serve the navigation and footer only, with the content loaded by script, so the install routes come from the repository README and the docs source repository (infernojs/inferno-website, src/docs/guides), which is the source of those pages. The README's install commands are npm packages (inferno, inferno-server, inferno-router and others), and the registry figures use the core package inferno, as the README's first install line names it. The homepage's visible text gives the description and the MIT line, and its links to the project itself are the GitHub repository and Discord. The HTTP Archive technology list has an entry named "InfernoJS" (mobile 3, desktop 5) under JavaScript frameworks; the Wappalyzer definition behind it names https://infernojs.org as its website, so it is this library and mobile is recorded. The npm package inferno shows a 0.0.1 upload dated 2013-08-25, before the repository was created (2015-02-01) and before the oldest GitHub release (0.4.0, 2015-12-20); that version is no longer listed, so it cannot be tied to this project. The oldest listed npm version (0.1.2, 2015-07-20) carries the description "A framework for building lightning fast user interfaces", author Dominic Gannaway and a repository that now redirects to infernojs/inferno, so firstRelease is 2015; the oldest GitHub release is 0.4.0 (2015-12-20). The README's runtime requirements section is for Inferno v9, so no runtimeMin is recorded for the current major. The v10 migration guide says the v10 babel and TypeScript JSX plugins need a recent Node.js to compile JSX, and the README says JSX compiled by older plugin versions does not work with Inferno 10 and that each plugin's major version matches Inferno's. The README's "Differences from React" and "Differences from Preact" sections are repeated on the homepage and are the basis for alternativeTo. Create Inferno App is described by the installation guide as legacy.
