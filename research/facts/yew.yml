notes: >
  The registry package is the crate yew, the one the getting-started page adds to Cargo.toml; the repository is a monorepo that also publishes yew-router and yew-agent, which are not recorded. The highest stable GitHub release is yew-v0.23.0, published 2026-03-10, the same day as crate version 0.23.0; major 0 is the 0.x series. The manifest at that tag still reads version 0.22.1 while master reads 0.23.0; runtimeMin is taken from the tag's manifest, where rust-version is 1.84.0, and the getting-started page states the same MSRV. The crate's 90-day download figure is about 440,000 (recent_downloads 440422 in the crates API); only the total is recorded. The GitHub API reports Apache-2.0 as the repository license while the crate and the LICENSE-MIT file state MIT OR Apache-2.0; both are recorded as statements. The maintainer is named in the LICENSE-MIT copyright line; the crate's authors list adds Justin Starry, which is not recorded as the maintainer. The homepage lists Discord and Twitter (twitter.com address) links, recorded as discord and x. The yew.rs page sets client rendering as the default and describes server-side rendering as an option through ServerRenderer; both are recorded. The deployment page has the built Trunk output served by any HTTP server, recorded as static next to browser.
