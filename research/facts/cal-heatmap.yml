notes: >
  Stub: the homepage the repository and npm list, cal-heatmap.com, now answers with unrelated pages. A plain request redirects to other domains (www.todo-electrico.com over http and https), and a followed request ends on a casino-style page under a different domain, so the project's own site no longer shows the software. Under AGENTS.md that is stub, with no homepage recorded. The repository's README links only to that site for documentation, and the gh-pages branch of the repository holds the project's documentation source (install.md, quickstart.md, index.md): it gives a CDN route (unpkg cal-heatmap@4.0.0-beta.4) and an npm route (npm install cal-heatmap@4.0.0-beta.4), both pinned to a beta, and says the v4 documentation is still work in progress. The docs source states install steps, so criterion 3 holds, but no installMethod sentence is recorded because the install steps are commands. The LICENCE file names Tyler Kellen, contributors; the README links ./LICENSE, which the repository does not contain. The package.json author is Wan Qi Chen; the LICENCE line is recorded as maintainer, and the reviewer decides between the two. The CHANGELOG's v4.3.0 entry has no date; the newest prerelease on GitHub is 4.3.0-beta.4 (2024-03-03), and npm's dist-tag beta points to the same version. What settles the status: a working project site or a maintainer statement naming a new one, after which the record returns to accepted with the site recorded as homepage. The README feature list also names right-to-left support.
