notes: >
  Stub: the sources show a local Docker-based install and a demo shop under a proprietary evaluation license, but no source states that Spryker Commerce OS can be run on the operator's own servers, and the homepage sells a PaaS+ cloud. The Spryker docs section "Running production" and the commercial terms of the platform would settle criterion 2. The repository spryker-shop/b2c-demo-shop is the demo shop only (its LICENSE allows a 45-day evaluation and forbids a productive live system); the platform source is not in a public repository that was found. The GitHub path spryker/spryker returns 404; spryker/spryker-shop also answers publicly and was not read. The license fact records the demo shop license, not a platform license. The README badge gives the minimum PHP version as 8.3; the badge text is recorded as the quote for runtime only. The docs describe Spryker Cloud Commerce OS as a platform-as-a-service solution built from over 750 modules released on Packagist under a proprietary value; no page read describes an install on the operator's own servers. The homepage also links YouTube, which no field takes. The imprint gives Spryker Systems GmbH, registered in Hamburg, with an address in Berlin, Germany.
