notes: >
  The LICENSE file in the repository says BSD 3-Clause; the documentation page at crowcpp.org/master/ carries the MIT permission text inside an HTML comment without naming a license, so no MIT entry is recorded. GitHub reports NOASSERTION for the repository. The project's homepage at https://crowcpp.org redirects to /master/, where the documentation and the homepage text are. The home page's chat link goes to gitter.im/crowfork/community, which is not a field here. The setup page requires a C++17 compiler and Asio headers 1.28 to 1.30; runtimeMin is left out because C++17 is a compiler standard, not a runtime version. The GitHub release v1.3.5 is a prerelease dated 2026-10-03, newer than the stable v1.3.4, so it is recorded as latestPrereleaseDate. The tags start at v0.1 (commit of 2017-09-17), earlier than the repository creation in 2018. The guides page for systemd is the source for always-on: it describes a Crow application as a program that a systemd service unit starts.
