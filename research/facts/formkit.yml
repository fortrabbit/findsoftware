notes: >
  Monorepo: formkit/formkit holds @formkit/core, @formkit/vue, @formkit/react, @formkit/inputs and the Pro package, so stars (4,785) and contributors (69) belong to the monorepo. The npm figure is @formkit/core, the framework-agnostic core that the React install route names; the Vue package @formkit/vue had no weekly figure recorded. The README and the what-is page describe a framework-agnostic core with official React and Vue bindings, so no basedOn is set. The React install route is the only one with commands on the installation page: its commands install @formkit/react, @formkit/core and @formkit/inputs, and the Vue route is shown only by a wizard that does not render in the static HTML, so no Vue installMethod is recorded. No installMethod is recorded: the page names npm only in a prerequisite line and in shell commands, and no sentence names the route. The Vue npm readme says "Vue 3 form development", and no runtime or runsAs is recorded because no page says the library runs in the browser. Pro is a paid tier of inputs (autocomplete, datepicker, rating and more) on pro.formkit.com with a free-during-development period; no prices are recorded. FormKit publishes the Repeater and Toggle inputs as free, which needs no field. The homepage's "Trusted by" logos are marketing, not a count, so reportedInstalls is not set. The terms and privacy pages name FormKit, Inc. as a Delaware corporation headquartered in Virginia and the about page names Charlottesville, VA; no country is stated, so hqCountry is unknown. The Standard Agents and Tempo products are coined or separate products and are not recorded. The "Why not...?" section of the what-is page names Vuetify, Buefy, VeeValidate, Vuelidate and vue-form-generator as other tools, but the sentences compare rather than name alternatives, so alternativeTo is not set; a reviewer may decide. Schema, theming, i18n locale builder, plugins and the coding-agent skill are features and are not fields. The @formkit/vue npm readme and the README use the same tagline, and the GitHub repository description is "The form framework for coding agents"; the description field is written from the what-is page.
