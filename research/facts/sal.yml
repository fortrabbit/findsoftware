notes: >
  The four-year rule applies: the newest npm release, 0.8.5, dates from 2021-05-01 and the repository has no GitHub release, only tags v0.5.0 to v0.8.5; its last push is 2023-01-07, so the import will move this record to stub under AGENTS.md criterion 4 unless a release lands. The status is left as the CSV row has it. The homepage is the GitHub Pages site the repository names; its "Github / Docs" link points to the repository. The LICENSE copyright line reads "Mirosław Ciastek" while the README and the homepage say "Mirek Ciastek"; the LICENSE line is recorded. The README calls the library "less than 2.8 kb" and "No dependencies!"; bundle size is a coined kind and stays here. The README says the library is "based on the Intersection Observer", a browser API, not a parent project, so no basedOn is recorded. No sentence states that it runs in the browser, so runsAs is left out for the reviewer to decide. The README describes the usage: an element with a data-sal attribute naming the animation (fade, slide-up and others) is animated when a script calls sal(), with data-sal-duration, data-sal-delay and data-sal-easing options, and sal:in and sal:out events. The npm figure counts sal.js downloads for the week 2026-11-01 to 2026-11-07. The GitHub repository reports HTML as its language because of its demo site; the package is JavaScript. The README asks for the sal.css stylesheet to be imported with the script, says the library is based on the Intersection Observer API, which it calls experimental and for which it suggests a polyfill, and asks sites that must work without JavaScript to add a noscript block that turns the animation styles off.
