notes: >
  Hosted service. The product is the cloud testing platform; its CLI is an npm package named chromatic that uploads builds to it, and the repository chromaui/chromatic-cli is the client. Per the hosted-service rule, the client's license (MIT, unchecked here), stars, npm downloads and release dates are not recorded on this record. The repository fact is the client, the only repository the project names. Pricing has Free, Starter, Pro and Enterprise plan tiers, which are not paidEdition; no prices are recorded. The about page says the company maintains Storybook and that the Chromatic service comes from the same team; no parent company is named, so parent is not recorded. The docs describe integrations with Storybook, Vitest, Playwright and Cypress; these are integrations, not a basedOn statement. The about page says "Thousands of companies use our tools", an unquantified customer claim, not an install count; reportedInstalls is not recorded. The privacy policy gives San Francisco as the headquarters address, and the terms name the State of California as governing law. The category is testing: the vocabulary has no visual-testing value. The homepage lists a YouTube channel (youtube.com/@chromaticui) with no matching field in the starter list.
