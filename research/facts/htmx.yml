notes: >
  currentMajor follows the GitHub release v4.0.0; latestReleaseDate follows the npm package tag latest, 2.0.11. The homepage says htmx 4.0 has been released and is not marked latest on npm so that 2.x users are not upgraded; the GitHub release v4.0.0 was published 2026-08-28, not as a prerelease, and the homepage says latest will move at some point in 2027. The homepage names no legal entity and the LICENSE carries no copyright holder; the GitHub organization is named Big Sky Software, but no page states a maintainer, so none is recorded. The npm first version (0.0.1) dates from 2020-05-02, but no page states a first release, so firstRelease is not recorded. The license has two sources: the LICENSE file and the npm registry, both 0BSD.
