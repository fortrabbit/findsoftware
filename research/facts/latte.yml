notes: >
  The record is the Latte engine itself, so the templating language is Latte and no templating fact is recorded, as in the jinja record. The maintainer follows the license.md copyright line, David Grudl; the homepage JSON-LD names the Nette Foundation as publisher, and the foundation is not the maintainer here. The license.md file words the choice as the New BSD License or the GNU General Public License version 2 or 3, which is the same set of licenses as composer.json names (BSD-3-Clause, GPL-2.0-only, GPL-3.0-only); one entry per license, the wording goes here. GitHub reports NOASSERTION because the file is license.md rather than LICENSE. The Packagist package is latte/latte, not nette/latte, so packagistName is the Packagist name. The develop page gives the supported PHP range per line: Latte 3.1 on PHP 8.2 to 8.6 and Latte 3.0 on 8.0 to 8.6; runtimeMin follows the latest release line, 3.1.7. The homepage compares Latte with Twig ("Latte vs Twig") and its diagram shows Blade and other systems; neither Twig nor Blade has a record, so alternativeTo stays empty; the Tools menu's twig2Latte converter is the importsFrom Twig entry, and the php2Latte tool is a PHP-template converter recorded here only. The Discord invitation, the forum link and the X account on the homepage belong to the Nette community that Latte is part of, not to Latte alone. The PhpStorm and Visual Studio Code plugins on the develop page are third-party marketplace products, not editions of Latte, so no paidEdition is recorded. The develop page says Latte compiles templates directly into PHP code, caches them on disk, regenerates the cache when the source file changes, and accepts parameters as arrays or as typed objects; the homepage lists n:attributes and context-sensitive escaping as its two defining features, and the Nette Foundation appears only in the homepage's JSON-LD publisher field. The GitHub stars and contributors are the repository's. The homepage says expressions in Latte are written exactly as in PHP and that the Latte team has developed it for over 18 years, while the first release of the standalone package is dated 2014 on both GitHub and Packagist. The develop page's section on the locale setting says it requires the PHP intl extension. The Nette Framework uses Latte as its templating system, a dependency in the other direction, so Nette is not recorded as a parent.
