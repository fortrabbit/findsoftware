notes: >
  In doubt: the project's own pages document no API, SDK, webhook or embed that a website or web app calls or sends to, so the boundary test "wired into an app" is not met on the sources read; a documented integration in the README or a docs page would settle it, and until then status stays stub. The README describes a browser interface where people register accounts and convert their own files; ALLOW_UNAUTHENTICATED, UNAUTHENTICATED_USER_SHARING and WEBROOT are settings of that interface, not an integration. The repository has no docs folder and no API reference. The README names no person, so the maintainer is the GitHub account C4illin; the profile of that account names a person, which the README does not repeat. No homepage: the project has no site beyond the repository. The README's compose example is the primary install route; a source build is documented only for development (bun install, bun run dev), so no installMethod for it is recorded. The CHANGELOG mentions api only inside the word vaapi. The README shows a compose file and a docker run command; both mount ./data into the container. The README lists the converter tools behind the conversions, among them Inkscape, LibreOffice, Pandoc, ImageMagick and FFmpeg; the list is not recorded as a field.
