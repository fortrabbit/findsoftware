notes: >
  Checked 2026-11-16. Maintainer: the LICENSE.txt copyright line names Charlie Poole (2009-2019), Rob Prouse (2014-2025) and Terje Sandstrom (2026) "and Contributors", so the project names itself on the homepage: "The NUnit Project is a member of the .NET Foundation", and the core team is listed there (Terje Sandstrom as lead). The .NET Foundation is hosting, not maintenance, so it is not recorded as parent. The homepage footer reads "Copyright © 2026, Charlie Poole, Rob Prouse" for the website, a CC BY-NC-SA 4.0 notice for the site, not the software. No legal entity or country is stated, so hqCountry is absent. License: the homepage says NUnit 3 and higher is MIT and earlier releases used the NUnit license (nunit.org/nuget/license.html); the latter is older-release history and is not recorded as a license entry. firstRelease is 2009 from tag 2.9.1, whose commit is dated 2009-08-27: the repository holds NUnit 2.x tags. The NUnit docs say "NUnit 2 is a different product, with its own design and its own documentation"; if a reviewer reads firstRelease for the NUnit 3-and-later product only, the first GitHub release is 3.0.0 on 2015-11-16 (3.0.0-rc-3 on 2015-11-14, a prerelease). The README says the project "is a unit-testing framework", and the homepage says it was "Initially ported from JUnit"; that is history, not basedOn. The NUnit download page says the NuGet package totals passed 600 million downloads on NuGet.org; the recorded figure is the NuGet search total of 741044921. The homepage link to Slack (join.slack.com) is the project's chat; it has no field. The installMethod entries are three routes from the installation and download pages: the NuGet package, the dotnet new template and the Visual Studio template dialog. runtimeMin is the modern .NET target in the nuspec of the latest release (net8.0, beside net10.0); the same nuspec lists .NET Framework 4.6.2, which is not a runtimeMin value. The GitHub contributors count includes all pages.
