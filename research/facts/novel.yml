notes: >
  Accepted: no end signal; the repository is not archived and the npm package is not deprecated. The repository is a monorepo: packages/headless publishes the npm package novel (version 1.0.0 in its manifest, 1.0.2 on npm latest), and apps/web is a demo Next.js app that the README runs locally with OPENAI_API_KEY and BLOB_READ_WRITE_TOKEN. Stars and contributors belong to the monorepo. The npm name novel has a 0.0.0 version from 2014 that predates the repository (created 2023-03-21) and belongs to another project, so firstRelease is 2023, the oldest upload of the project's package on npm (0.1.0, 2023-08-31); the oldest GitHub release object is novel@1.0.8 (2023-09-01). The GitHub release object novel@1.0.2 is dated 2025-02-11, while the npm upload of 1.0.2 is 2025-01-18; latestReleaseDate uses the npm date. The README says "While Novel is built for React" and lists community packages for Svelte (novel.sh/svelte) and Vue (novel.sh/vue), which are not recorded as bindings. The README's stack list names Next.js, Vercel AI SDK, OpenAI and Vercel for the demo app; none is recorded as basedOn because the list describes the app. The npm package has a React peer dependency (>=18), which is no basedOn statement. The Mintlify footer links on the docs page belong to Mintlify and are not recorded. The quickstart says the package has no styles and is a collection of custom configs and components for Tiptap, and shows it exporting components such as EditorRoot, EditorContent, EditorCommand and EditorBubble, which the page compares to Radix Primitives. The introduction page calls Novel a headless editor and lists Tiptap, TypeScript, Radix UI and cmdk as the technologies it is built on.
