notes: >
  Status: the CSV row says hosted-service, but the repository xataio/xata is an Apache 2.0 platform whose README says it is for self-hosting on Kubernetes and gives a local install with kind and Tilt; the pricing page lists an Open Source plan, free and self-managed, to self-host on your own infrastructure. The self-install route is the basis for accepted: the xata.io open-source quickstart and Xata Core pages document a Helm install on a Kubernetes cluster ("helm repo add xata https://charts.xata.io", "helm install xata xata/xata"), beyond the README's kind and Tilt development setup. The docs deployment-models page covers Xata Cloud and bring-your-own-cloud, not self-management. The CSV repository, xataio/client-ts, is the archived Lite SDK for TypeScript (deprecated, Apache 2.0, 125 stars) and is not the software; its figures are not recorded. The TypeScript SDK (ts-sdk) and CLI repositories are active but are clients, not the platform. The homepage shows 12.3k next to the sign-in links, which the repository API does not match (1105 stars), so the homepage figure is not recorded. No GitHub release or tag exists, so lastCommitDate is the committer date of the newest commit on main. Maintainer: the terms and privacy pages name Xatabase, Inc., and the privacy page gives its legal mailing address in San Francisco, US; the homepage footer copyright reads Xatabase Inc. without the comma. Cloud and self-host: the pricing page lists a Xata Cloud plan with observability, SOC 2 and GDPR compliance and AWS and GCP multi-region, a BYOC option where Xata installs the data plane in the customer's cloud (AWS, Azure, GCP, Hetzner or on-premises, by the deployment-models page), and an AWS Marketplace listing for BYOC; plan tiers are hosting, so paidEdition stays out. Compliance (the security page says SOC-2, HIPAA and GDPR compliant) is a coined kind and goes here: compliance SOC-2, HIPAA, GDPR. Regions: the pricing page names providers for multi-region, not region names, and no EU hosting statement was found, so regions stays out. The sso page covers the Xata console sign-in for organizations, and SAML is not supported out of the box. The README says the platform uses Keycloak for its auth service; that is no sso field value. The README advises against the open-source platform for a single Postgres instance, which it says would be overkill on a Kubernetes cluster, and against offering it as a public Postgres-as-a-Service to end customers, where it points to BYOC. Fields coined here: none beyond the notes above.
