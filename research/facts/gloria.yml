notes: >
  The README says "We're going to have a discord or something some day", so no chat link is recorded. The license is not SPDX: GitHub reports NOASSERTION, npm reads "SEE LICENSE IN LICENSE", and the LICENSE file grants use "with specific restrictions FOR the purposes of satire, evil, or advancing evil". licenseModel stays empty: the file is no open-source or source-available license text. The README calls the project "a satire of other projects". The npm package "gloria" (0.18.0, 2017, another author) is not the install package and is not used. The domain gloriajs.com serves unrelated content and is not used as a source. The first-release year is unknown: the npm package gloriajs starts at 2.1.6 (2023-02-25) and the older tags have no dates. The Node version in the deploy page is a CI setting, not a requirement, so runtimeMin is not recorded. The npm author name dvidsilva is a registry login, not a maintainer name a page states, so maintainer is not recorded. The npm figure is the last full week in the API response.
