notes: >
  The GitHub license field is NOASSERTION; the license is stated in the README and LICENSE.txt as the Repoze Public License, a BSD-derived license, and the PyPI metadata gives the same statement, so both license entries are recorded. The homepage the repository names, http://kotti.pylonsproject.org, answers only over plain http and redirects to the documentation at kotti.readthedocs.io, so the https documentation site is recorded as the homepage; the PyPI home page field is the http address. The highest stable tag is 2.0.9, matching the PyPI latest version uploaded 2022-05-05, so latestReleaseDate is from PyPI and status is left as the CSV row sets it; the import moves the record to stub on its own under the four-year rule. The download figure is the PyPI statistics count for the last month. The installation page states Python >= 3.5 as the requirement. The help page links a Google Groups mailing list only over plain http, so forum is not recorded. The docs name Waitress as the default WSGI server and the Apache mod_wsgi or uWSGI options as alternatives; runsAs is recorded from the pserve command. The Kotti docs say its CMS is contextual: editors edit content where it appears; the admin UI field records that. The contentStore field is not recorded, since the docs name SQL databases without saying where content lives beyond the database support list. The firstRelease year is the first PyPI upload 0.1 dated 2011-05-04, the same year as the repository creation.
