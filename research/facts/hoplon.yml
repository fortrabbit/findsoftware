notes: >
  The homepage https://hoplon.io/ answers 200 but the HTML holds only a title and a script that renders the page, so no homepage is recorded; the content comes from the README and the wiki. The Clojars page lists "26,944 Downloads" for the artifact beside a separate per-version count ("714 This Version"), so the first is the total across versions. The wiki's Home page says Hoplon uses Javelin "under the hood" and the README says it "tightly integrates with Javelin"; no basedOn is recorded because Javelin is a dependency the project names, not its parent software. The oldest tag 0.1.0 has a commit date of 2013-10-18, which gives the first release year. The last commit on master and the last push are both 2024-03-18, after the latest stable release 7.5.0 of 2023-11-15; no archive flag, deprecation or end statement was found. The Get Started wiki page covers the build and hosting steps.
