notes: >
  Two license statements: the README says GNU General Public License 3.0, the terms page says GNU General Public License v3 or later; both are recorded, and Packagist reports GPL-3.0-or-later, which matches the terms page. The GitHub license field is null. The paid edition is TypeRocket Pro, sold under a subscription; the open edition is free. Registry figures use typerocket/core, the framework package the README badges point at; typerocket/typerocket is the project skeleton the composer install page names, with fewer downloads. The version 6.1 requirements page states PHP >= 8.2 and the v6 line PHP >= 8.0.2; runtimeMin follows the latest release, v6.1.1. The maintainer is Robojuice, LLC as the terms page names it; the footer calls TypeRocket an open source project developed by Robojuice. The copyright range starts in 2014, which is not a release date, so firstRelease stays unknown. The v6 install pages say Pro users get composer access on Plus and Max licenses only.
