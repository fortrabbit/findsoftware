notes: >
  The project has no homepage: the GitHub homepage field is empty and the README names only the repository, so no homepage is recorded. The GitHub repository has tags v0.0.1 to v0.6.1 but no GitHub releases; the registry release 0.6.1 (2016-02-20) is the latest, so latestReleaseDate comes from RubyGems and the last commit date is not needed. The last push to the repository is 2020-12-30 with no release after 2016, which the import will move to stub under criterion 4; no archive flag, deprecation or end statement was found. The README links the extension repository hobbit-contrib as the place for extensions, which is not a record. The README's Rack basedOn is the one the project states in its own description. The README shows `rackup` as the way to run the example, which is a start command and states no hosting model, so runsAs and renderingModes are absent. No minimum Ruby version is stated on a page, so runtimeMin is absent.
