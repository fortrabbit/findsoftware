notes: >
  The npm package @svar-ui/svelte-core is the one the getting-started page names; the older wx-svelte-core package is deprecated on npm with the text "Moved to the @svar-ui namespace. Use @svar-ui/svelte-core instead.", and the docs say the core packages migrated from wx-svelte-* to the @svar-ui namespace, so the record follows the new name and the old 1.x packages are not separate records. The repository has no GitHub releases; its version tags run from 1.1.4 (commit 2024-06-12) to v2.6.1 (commit 2026-09-01), and the npm latest 2.6.1 matches the highest tag, so currentMajor and latestReleaseDate come from the registry. The footer of svar.dev gives the company as "XB Software Sp. z o.o." with a Warsaw address, which is the hqCountry source. The readme names Menu, Toolbar, Tasklist, Comments and File uploader as separate repositories and packages; they are not recorded here. The readme's "yarn" note for working on the repository is not an install route for users. The homepage says "MIT" in its navigation, consistent with the LICENSE file.
