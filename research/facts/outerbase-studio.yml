notes: >
  The project's docs link on outerbase.com returns 404, so no docs fact is recorded. The Dockerfile at tag v0.10.2 builds with node:20-alpine and starts node server.js, but no page the project names states a runtime minimum or a run mode, so runtimeMin stays out for a reviewer to decide. The Cloudflare route runs through the repository's deploy script (opennextjs-cloudflare), which no page describes as per-request. The README says MySQL and PostgreSQL support is beta and that the desktop app enables their drivers; Turso/LibSQL, Cloudflare D1, rqlite, StarbaseDB and Val.town are named as SQLite-based databases. The owner is Outerbase, Inc. under Delaware law (terms page); no page names an HQ country. The outerbase.com Pricing page covers the Outerbase platform (Free, Pro, Enterprise), not Studio, so no pricingPage or paidEdition fact is recorded. The studio.outerbase.com homepage states it runs in the browser, and the repository default branch has commits after v0.10.2 (pushed 2026-03-25); the latest release is 2025-03-31. An npm package @outerbase/studio (ISC, 0.2.7) exists but no project page or the README names it, so it is not recorded. Stars read 2026-10-30; the outerbase.com studio page shows an older count. runsAs local is the desktop app, a desktop database client; the web version is a server app and no page states how it is hosted. The studio.outerbase.com homepage is a JavaScript app with no readable text, so it carries no quote.
