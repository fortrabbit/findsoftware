notes: >
  The CSV homepage is https://mobx-state-tree.js.org/, which answers with a redirect to intro/welcome; the redirect target is cited. The README names MobX as the engine the project is built on, which is the basedOn fact. The package.json declares MobX as a peer dependency at major 7, and a peer dependency alone is not basedOn; the README sentence carries the relationship. The README says the package has zero dependencies other than MobX, and that it works with TypeScript, React and React Native; those are not fields, and the runtime fact rests on the installation page's supported-environments line, which names browsers, Node and React Native (the yarn command on that page is the same npm registry route as the npm one). The README thanks Infinite Red for supporting ongoing maintenance and Mendix for sponsoring the project; the maintainer is recorded from the LICENSE copyright line, and neither company is a parent. The README says MobX is one of the most popular Redux alternatives, a sentence about MobX and not about this project, and Redux has no record, so alternativeTo is absent; the docs' Compare page is about React Context, which has no record. The README calls MobX the engine of a state management system and mobx-state-tree the structure around it. The installation page states the TypeScript typings ship inside the packages, and that the CDN build exposes the library as window.mobxStateTree. The README describes the model system through types.model and types.reference, snapshots through onSnapshot, and transactional actions in its thanks section. The CDN route is the unpkg build named on the installation page. The npm figure counts the mobx-state-tree package the install page names. The first release year comes from the first npm upload, 0.0.1, dated 2016; the oldest git tag, 0.1.1, is dated 2017. The README's onSnapshot example describes listening to changes outside React; no field covers it.
