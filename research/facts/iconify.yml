notes: >
  Monorepo: the record follows the iconify-icon web component, the package the install docs name; the other packages in the repository are not counted. Maintainer: the about page names Iconify OÜ, an Estonian company, and the LICENSE copyright line names Vjacheslav Trushkin (2021 to present); the company is recorded as the maintainer and the person is in this note. One license statement is recorded: the README and the iconify-icon npm package say MIT, and the repository's license.txt is the MIT text with a copyright line naming Vjacheslav Trushkin. The footer of the iconify.design docs pages reads "Released under the Apache 2.0 License." beside "Copyright © 2020-PRESENT Iconify OÜ"; it sits on the documentation site and does not say it covers the package, so it is not recorded as a license of the software. The README adds that its license does not cover the icons, which are released under the licenses of each icon set. The iconify-icon docs page says the API is third-party by default and can be self-hosted, and the component fetches icon data from the Iconify API at runtime; the public Iconify API is recorded as the hosted offering, from the API docs page. The iconify-icon docs say the component is used by providing an icon name in the icon attribute, and that it retrieves the icon data from the Iconify API and renders the SVG in a shadow DOM. The homepage and about page link a Discord invite, X, Bluesky and Mastodon accounts under the developer's handle (cyberalien), which the site presents as the project's contact links; they are recorded as such. The support page names another community's Discord server for help. The repository has no GitHub releases, so currentMajor and latestReleaseDate come from the iconify-icon npm package. firstRelease is the npm upload of @iconify/react in this monorepo, 2019-01-22. The download figure is the sum of the daily counts for 2026-10-18 to 2026-10-24.
