notes: >
  Doubt: headless mode is a Pro feature of the hosted Hashnode blog platform, not a product page of its own, and the listed page hashnode.com/headless answers 200 with "User not found"; a dedicated product page would settle whether it is a product or a feature of Hashnode, so it stays a stub until a later pass decides. The terms list "Headless CMS" among the Service's features, as using the Hashnode API to build and host your own blog interface. The Pro page says headless mode uses Hashnode as a headless CMS to power a custom frontend, with the GraphQL API for reading and writing publication data; the GraphQL endpoint is not documented on a separate page read here. The homepage states "Hosted blog" and the terms name LinearBytes Inc. as provider, with no address or country, so hqCountry is unknown. Pro is priced per seat and per year on the pro page; no amounts are recorded. The Pro page also lists a bulk Markdown zip import, which names no software, so importsFrom is not recorded. Hashnode's MCP server and gql skill (hashnode.com/agents) are tools for the same API and are not recorded as fields. The GitHub repository Hashnode/gql-skill is a client tool and not used.
