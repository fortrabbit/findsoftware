notes: >
  The record follows facil-io/cstl, the repository the site's 0.8.x docs and its GitHub link name as current. The site's 0.8.x line is stable and described as a single-header C core with IO reactor, HTTP, Pub/Sub and TLS, and its home text describes a mini-framework for web applications with an HTTP, WebSocket and SSE server, so criterion 1 holds. The legacy 0.7.x line (the classic evented framework with HTTP, WebSockets, Pub/Sub and Redis) lives in boazsegev/facil.io, whose README says development moved to cstl; its figures are not recorded, and firstRelease (2017) comes from that repository's oldest release. The CSV row names boazsegev/facil.io. Both lines are major version 0. The iodine Ruby server is named on the site as powered by facil.io; that is a fact for the iodine record, not a basedOn fact here.
