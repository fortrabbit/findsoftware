notes: >
  The README says this repository holds the plugins that make up the core and that the application template lives in croogo/app. Status check: archived false, no ended or unmaintained statement on the homepage or README, so status stays accepted. Packagist and GitHub do not flag croogo/app or croogo/croogo as abandoned or deprecated. The README links docs.croogo.org; its pages are the Croogo Docs 2.0.0 Sphinx build, so the documentation is older than the current release and no fact is cited from it. The croogo.org/docs page renders "Error: Not Found" and is listed as unreadable. The install docs name croogo/app, so packagistDownloads uses croogo/app (7198 total); the core plugin package croogo/croogo shows 16362 total on Packagist and is the figure the CSV row carries. The homepage states "Supports PHP 7.4", which differs from the 7.1 minimum in the composer.json and README; both are recorded as sources and the reviewer decides which one the record shows. The GitHub license field reads NOASSERTION, so the license is taken from LICENSE.txt. The homepage team name is recorded as the maintainer because no page gives a legal entity; the LICENSE copyright lines name two individuals with "and other contributors". The GitHub contributor count is taken from the paginated link header with anon=true. The homepage was read from its server-rendered HTML; the rendered data comes from its API cache.
