notes: >
  The LICENSE.md, COMM-License.md and gemspec state the license in three ways: LGPLv3 for the open source code, a commercial license for Pro, Advanced and Enterprise, and a community version that may be used commercially for free. Each statement is its own license entry. The gemspec lists "LGPL-3.0" and "Commercial" as the gem's licenses. The pricing page sells add-on bundles and feature gems on top of the community plan; the paidEdition entry rests on COMM-License.md naming the Pro, Advanced and Enterprise versions, which are tiers of the product and not add-on plugins. The REST API (headlessApi), SSO and role-based access control sit behind paid add-ons or the Enterprise plan. The docs require Ruby on Rails 6.1 or later; it is not a field. The maintainer's legal name is Dependev SRL on the terms page and DEPENDEV SRL in the copyright line; the company's country is not stated on the pages read (the terms name Romanian governing law and Bucharest courts only), so hqCountry is left out. The highest stable GitHub release is v4.3.4 (2026-10-22); RubyGems lists avo 4.3.5 published 2026-10-23, which has no GitHub release yet. The README calls the software a Rails admin panel and CMS; the docs install a gem into a Rails app.
