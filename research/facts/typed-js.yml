notes: >
  Status accepted; no end signal. The repository is not archived and the npm latest 3.0.0 is not deprecated. GitHub detects no license (NOASSERTION): LICENSE.txt is the GPL-3.0 text with a notice granting version 3 or any later version, so the entry is GPL-3.0-or-later; the README table words the same license as GPL-3.0 beside two commercial licenses, each its own entry with the README table as its source; the README's paid tiers differ only in how many projects a license covers, so no paidEdition; licenseModel is left to the import, which derives it from the GPL and commercial entries. The GitHub repository's latest release v3.0.0 (2026-01-24) is the newest stable; the prerelease v2.0.0-beta.1 (2017) is older, so no latestPrereleaseDate. firstRelease 2014 is the oldest tag v1.0. Maintainer follows the LICENSE.txt copyright line. The README's install section gives npm and Yarn as one route; the CDN route is the unpkg script tag for the UMD build, pinned to 3.0.0 in the README, and is recorded as the script tag route without the pinned address. runsAs browser rests on the README sentence about use in the browser. The Vue.js and web component bindings the README links are third-party repositories and no basedOn is recorded; the README calls the library usable with a React application, which is not a basedOn statement. The homepage demos show looping, a fade-out option, start, stop, reset and destroy controls, and strings that contain HTML tags; the README shows a React component that creates the instance in an effect and destroys it on cleanup, and strings read from HTML already on the page so that bots, search engines and visitors without JavaScript see the text. The README's Twitter link is the author's personal account and is not recorded as a project social link. The README's "Wonderful sites" list and the SEO and pause features are not recorded. Stars and contributors belong to this repository alone.
