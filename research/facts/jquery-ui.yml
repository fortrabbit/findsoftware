notes: >
  The project is in maintenance-only mode, stated in the README ("jQuery UI is in maintenance-only mode.") and on the jQuery homepage; no end is stated and the repository is not archived, so the status stays accepted and the mode is for the reviewer to weigh. The stable release 1.14.2 (2026-01-29) is the highest on GitHub and the npm latest; the npm publish time is 2026-01-28 23:49 UTC, the GitHub release 17:38 UTC on the same day. GitHub reports the license as NOASSERTION because LICENSE.txt has several parts: the MIT terms for all parts (npm also says MIT), CC0 for the sample code in the demos directory, and an exception for externally maintained libraries under their own licenses, which are not recorded. The install docs name no npm package; the npm package jquery-ui is the registry name of the same project and its figures are recorded as such. The download page gives the CDN and manual download; the npm figure counts the npm package only. The maintainer is the OpenJS Foundation per the LICENSE copyright line and the site footer. The firstRelease year is from the changelog page, where version 1.5 is dated June 8, 2008; the GitHub repository was created in 2010 and its oldest tag is 1.5.1. The httpArchiveSites figure is the mobile origin count of the HTTP Archive technology "jQuery UI", following the adoption script's convention.
