notes: >
  No page or file names the maintainer as a person: the repository has no NOTICE or author file and the Gradle build names no developer, so the GitHub organization kotlin-orm is recorded. The site's Articles link to a personal blog of the author and the sponsor page lists personal payment accounts; neither is recorded as the project's maintainer or a project account. Runtime jvm follows from the language: the README calls Ktorm an ORM framework for Kotlin, which runs on the JVM, and no page states a minimum JDK or Kotlin version, so runtimeMin stays unknown. Spring Support is an integration page for Spring JDBC, not a statement that Ktorm is built on Spring, so no basedOn. The dialect table lists five database modules (MySQL, PostgreSQL, SQLite, SQL Server, Oracle); the connection page also uses H2 in an example, which is not a dialect module, so H2 is not recorded. The Android logging adapter and the Kotlin KSP compiler modules in the repository are not recorded. The Apache 2.0 license is also stated on the site footer. Maven Central publishes no download figure, so none is recorded. The oldest Maven Central upload is 1.0-beta of 2018-12-02 under the earlier group me.liuwj.ktorm, which sets firstRelease; the current group org.ktorm starts at 3.2.0-RC1.
  The README describes a strongly typed SQL DSL and entity sequence APIs with no configuration files, XML or annotations, and the dialects page says the core module only provides standard SQL, so the database modules add the features of each database. The Spring Support page covers the Spring JDBC integration; it is a separate integration, not a basis.
