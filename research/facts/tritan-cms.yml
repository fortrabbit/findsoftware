notes: |
  The README lists PHP 7.1 or later with Apache or Nginx as the requirements. The project's own site does not answer: tritancms.com does not resolve or respond, learn.tritancms.com and rest.tritancms.com (the docs and REST docs the README links) do not answer, and www.tritancms.com shows a parked domain offered at a Namecheap auction, so no homepage is recorded and the docs field is absent. The repository recorded is nomadicjosh/TriTan-CMS, the row in the candidates file; the parkerj/TriTan-CMS repository carries the same README notice and is also archived, and its README downloads the release from parkerj. The project has no GitHub releases; its version tags r0.9 (2017-11-15) to r0.9.9 (2018-09-07) are the releases, so currentMajor is 0 and the dates come from the tags' commit dates. The README calls it "a lightweight content management system (CMS) and content management framework (CMF)" and also says the codebase is derived from WordPress but "TriTan is not a fork of WordPress", which is why basedOn is WordPress and forkOf is not recorded. The README names the Liten Framework as the framework used in its build. The replacedBy field name is coined here: the README names Devflow (github.com/getdevflow/cmf) as the replacement, and Devflow is a separate project. The archived flag and the README statement together make the discontinued status. The maintainer is the author composer.json names, Joshua Parker; neither the README nor the LICENSE names one. The README says the project is in beta and not for production before a 1.0 release. It lists Fenom and Foil among the composer libraries, but no page says which template engine the CMS itself uses, so templating is unknown. The plugin repository the README links (gitlab.gitspace.us) does not answer.
