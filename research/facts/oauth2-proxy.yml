notes: >
  Homepage: the repository's homepage field is http://oauth2-proxy.github.io/oauth2-proxy/ (plain http, not linked); the https docs site is the docs field, and the project's own site www.oauth2-proxy.dev is the homepage. The dev site says "Originally created in 2012", which is recorded as firstRelease per the rule for a project's own invented-in year; the oldest GitHub release is v3.0.0 (2019-01-14), and v3.0.0 and up are from the fork per the docs. The maintainer is the umbrella "OAuth2 Proxy a Series of LF Projects, LLC"; MAINTAINERS.md names five individuals with affiliations; no single person is the maintainer of record, and affiliations are no field. The LICENSE file holds the MIT text with no copyright line, so the maintainer is the docs site copyright line. The dev site states "15,000+ GitHub stars", "430+ Contributors" and "1.8 million+ Daily downloads"; these are self-reported figures with no registry source and no field, so not recorded; the GitHub API figures are recorded. The images are published on quay.io, not Docker Hub, so no dockerPulls. The Quay.io pull statement on the community page is not recorded. The CNCF Slack channel and the Community Call are not social fields. The configuration overview's listen address is the runsAs quote: a process that listens for clients. The docs and README state that the repository was forked from bitly/OAuth2_Proxy on 2018-11-27; that repository is no record id, so forkOf is not recorded. The README and the docs footer call the project a CNCF Sandbox project and a series of LF Projects, LLC. Fields coined here: none.
