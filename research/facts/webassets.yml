notes: >
  Python library, not a web framework: the docs say it is dependency-independent and ships framework integration pages for Django, Flask and Pyramid, which are integrations and not a parent. The docs introduction says it supports a wide variety of filters and compilers such as CoffeeScript or Sass. Bundles are defined in code or in an external configuration file; a bundle's urls() call merges and compresses the sources and returns the output URL, or in debug mode the URL of each source file. The version in the output URL is a hash over the output file's content (docs bundles page). A Jinja2 integration page exists. Install: the README says "install it via pip install webassets==dev"; the docs and README name no pip command for a release, so the release install is read from PyPI (pypi.org/pypi/webassets). PyPI classifier reads "Development Status :: 3 - Alpha" and the project is not stated as ended. The docs site title reads "webassets 0.12.1 documentation" while the latest release is 3.0.0; the docs are not a current source for the version. GitHub has one release (3.0.0, 2025-08-17) and 19 tags; the oldest tags are 0.1-googlecode (commit 2008-06-12) and 0.1 (2008-07-26), so firstRelease is 2008. PyPI's first upload is 0.4 on 2010-08-21. pypiDownloads is the pypistats last-month figure and the total from pypistats overall is not recorded. Two license statements: GitHub detects BSD-2-Clause and PyPI states BSD; the LICENSE file names the copyright holder Michael Elsdörfer, while PyPI author email reads Michael Elsdoerfer. Repository last pushed 2025-08-17. No project website beyond the docs and repository; the docs URL is recorded as docs, homepage is left out for the reviewer.
