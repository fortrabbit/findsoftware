notes: >
  Stub: criterion 5 is in doubt, since the maintainer is an individual and no public adoption figure (stars, downloads, or a count of sites) appears on the project's own pages; a figure from a primary source would settle it, and the awesome.haunt.page list is a directory and is not used. The release dates were resolved from the project's own forge at git.dthompson.dev (cgit): the v0.4.0 tag is dated 2026-07-10, which is newer than the 0.3.0 release the homepage still lists (2024-02-19), so the homepage is stale and the forge tag is recorded as latestReleaseDate. The reference manual at files.dthompson.dev describes Haunt 0.3.0 and is recorded as docs with that caveat. The homepage at dthompson.us answers with a 301 to dthompson.dev, so the canonical address is recorded. The forge is a cgit instance, so repository is the Git URL the homepage names, and the release date comes from the tag page. The README says "GNU GPLv3 or later." and the homepage says "GNU GPLv3+"; the forge's COPYING file is the GNU GPL version 3 text; the homepage states "GNU GPLv3+", which is recorded as GPL-3.0-or-later. The README gives GNU Guile >= 2.0.11 and the homepage gives >= 2.0; the README is the current statement, so runtimeMin is 2.0.11. The project has no GitHub repository, so no GitHub figures are recorded. The homepage names the #guile channel on the Libera.chat IRC network for discussion, which has no field here. The contributors count is not recorded because the forge shows only the authors of the current log page, not all contributors.
