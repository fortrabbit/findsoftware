notes: >
  The homepage says "Released under the MIT License, source on Github" and links github.com/jackmoore/colorbox, which GitHub reports as archived (pushed last 2024-07-06), so the project's named source is archived and the status is discontinued. The homepage's sentence "I'm afraid I no longer have time to answer personal requests" is a limit on personal help, not an end statement, and is not used as a signal. The repository has no GitHub release; the registry package jquery-colorbox (not deprecated) has latest version 1.6.4, published 2016-05-10, and that date is latestReleaseDate. The npm figure is for jquery-colorbox over 2026-10-26 to 2026-11-01. The install route is "Install via NPM" with the command npm install jquery-colorbox on the homepage; the label is not a sentence, so no installMethod is recorded. The homepage lists compatibility with jQuery 1.3.2+ and browsers, which is a support list and not runsAs. The npm package named in the homepage install link is jquery-colorbox. The homepage states use on "a million-plus websites" (linked to a BuiltWith trends page), recorded as reportedInstalls as the project states it.
