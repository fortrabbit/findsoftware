notes: >
  The candidate row lists https://graphweaver.com, which answers over https and is recorded as homepage. The repository is a pnpm monorepo, so the npm figure is the core package @exogee/graphweaver (503 downloads in the week 2026-10-12 to 2026-10-18); the CLI package graphweaver that the quick start names had 317 in the same week and is not recorded. License: GitHub reports Other (NOASSERTION); LICENSE.md is the Apache License 2.0, the README says Apache 2.0, the core package is Apache-2.0 on npm, and the README's features line and badge say MIT; the Apache text is recorded. The release list has no prereleases; beta builds (1.0.0-beta.x) are on npm dist-tags only and are older than the latest stable release. The oldest GitHub release is v1.0.0 (2024-06-12), so firstRelease is 2024 although the repository dates from 2022. The project's own pages describe itself as a GraphQL API layer with an admin panel and do not call it a CMS; the candidate row's headless-cms category is therefore not recorded. The databases field lists the data sources the software connects to, not a store of its own, and no contentStore is recorded. The docs deployment overview links three guides (AWS CDK for Lambda and ECS, Docker without CDK, standalone server), all read; the Docker guide builds an image from a Dockerfile the user writes, so no published image is recorded. The built admin-ui folder is static files and the built backend is a Node process (node index.js), so runsAs holds only always-on: the whole software cannot be served from static hosting. The contributor count reads the rel="last" page of the contributors endpoint with per_page=1. The chat link is the Slack invite the homepage links. The README quick start lists PNPM as a prerequisite next to Node. The AWS CDK guide names ECS and Lambda as the two compute platforms for the server.
