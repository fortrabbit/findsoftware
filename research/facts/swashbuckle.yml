notes: >
  The project has no homepage: the repository's homepage field is empty and the README names none, so the record is repository-only and listed under notFound. The LICENSE copyright line names Richard Morris alone. The README says the project embeds swagger-ui through its Swashbuckle.AspNetCore.SwaggerUI package and that the generator and UI packages are used together; swagger-ui stays a separate record and is not basedOn, because the README describes it as one of the packaged components. The Redoc UI is an add-on package (Swashbuckle.AspNetCore.ReDoc), not a parent. The README's embedded Redoc 3 collects anonymous telemetry by default, which the project says can be turned off through disableTelemetry; that is a privacy note and not a field. The runtime dotnet is ASP.NET Core's runtime. The README compatibility table lists ASP.NET Core versions per release only as a badge table, with no sentence stating a minimum, and the target frameworks in the build files are not a stated requirement, so runtimeMin is not recorded. Getting started says to register the generator in the application's startup path and to add the middleware to expose the document and the interactive documentation. The first release is the oldest tag, v1.0.0-rc1, committed 2017-01-03; the repository itself was created in 2015. The Swashbuckle.AspNetCore.Cli add-on package is a .NET tool installed with dotnet tool install, its own package and not an install route of the library. The NuGet figure is the total for the metapackage named by the install section, with its registry id Swashbuckle.AspNetCore.
