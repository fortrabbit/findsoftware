notes: >
  The project has no site of its own: the README is the documentation and the repository is the only page, so homepage is left out. The Packagist package mcamara/laravel-localization is the one the README installs. The README's architecture note says the package generates routes per request, so php artisan route:cache is not supported out of the box, and it names niels-numbers/laravel-localizer as the recommended successor for new projects, with a migration guide for the swap; the same note says this package remains actively maintained, so the successor is no end signal and status stays accepted. Laravel-localizer has no fact file, so no alternativeTo value names it. The README's feature list names language detection from the browser, smart redirects that save the locale in a session or cookie, translatable routes, an option to hide the default locale in the URL, and helpers such as a language selector. The README's caching section says the package is by default not compatible with Laravel's route caching and describes a route:trans:cache command and a LoadsTranslatedCachedRoutes trait. The maintainer is the LICENSE copyright holder mcamara; the composer.json author is Marc Cámara, and the README names jordyvanderhaegen as the current maintainer of the package. The README's Laravel compatibility table lists Laravel 10 to 13 with PHP 8.2 or later, which the composer.json require lines match. The basedOn Laravel value rests on the README's one-line description, which names Laravel as what the package localizes; per the wave rules for packages named for Laravel it stands. The stable major is 2, from v2.4.2 published 2026-08-24 on GitHub. firstRelease is 2014 from the Packagist upload 0.8 dated 2014-01-19, older than the oldest GitHub release of 2014-09.
