notes: >
  The repository is the mui/material-ui monorepo, shared with Joy UI (see the joy-ui record); the registry figures are for @mui/material, the package the install page names, and the star and contributor counts cover the whole monorepo. The firstRelease is the oldest GitHub release v0.1.29 (2014-11-05); the @mui/material npm package starts at 5.0.0-rc.0 in 2021. The legal page gives the company as "Material UI SAS, trading as MUI" and the privacy page as "Material-UI SAS"; the copyright line is recorded. The pricing page lists plans for MUI X (Pro, Premium, Enterprise) beside a Community plan that includes Material UI, free and MIT-licensed, and MUI X is a separate open-core product, so no paidEdition is recorded. The MUI Store sells templates, which the record does not cover. The install page gives the peer range react ^17 through ^19 for react and react-dom; that is a peer dependency, not a runtime, so no runtime is recorded. The install page shows pnpm and yarn commands in tabs beside npm; only the npm command is quoted. The HTTP Archive technology "MUI" (64,978 mobile origins) covers all MUI products (the MuiBox-root class also matches Joy UI and @mui/system), so httpArchiveSites is not recorded. The homepage carries links to LinkedIn and YouTube; the record has no field for them, so they are not recorded. No discord link was found on the pages read.
