notes: >
  Repository only: the GitHub homepage field is empty and the README and pyproject name no project site, so no homepage is recorded. The repository has no GitHub releases, only tags; latestReleaseDate is the commit date of tag 0.8.2 and firstRelease the commit date of tag 0.1.0 (2014-11-08, the repository creation date). The PyPI package 0.8.2 (uploaded 2026-09-27) is the current stable release, so currentMajor is 0 (0.x line). PyPI reports license and requires_python as null; the license comes from the LICENSE file and pyproject.toml sets no Python minimum, so runtimeMin is absent. The README documents a command line program, sqlite_web, with an optional gevent WSGI server (sqlite_wsgi), serving a page on localhost by default (host default 127.0.0.1, option -H to change it); runsAs records local from the README usage line and always-on from the WSGI server line. The README names Flask, peewee and pygments as dependencies, which are not recorded as basedOn. The Docker image is published to GitHub Container Registry, not Docker Hub, so no dockerPulls figure is recorded. Contributors counted without anon=true across all pages of the contributors endpoint (per_page=1, last page 9). The ecosyste.ms endpoint for PyPI gives 2 dependent packages and 37 dependent repositories. The Docker image is ghcr.io/coleifer/sqlite-web (README). Fields coined here: none.
