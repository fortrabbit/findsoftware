notes: >
  Monorepo: the repository holds Floating UI's packages (@floating-ui/dom, core, react, react-dom, react-native, vue, utils) and the website; the stars and contributors count belong to the whole monorepo, and the npm figure is for @floating-ui/dom, the package the getting-started page names first for the vanilla route. The tag list also holds the v2.x line of Popper v2, which is not the package the install docs name, so currentMajor is 1 from @floating-ui/dom 1.8.0 (GitHub release of 2026-07-11, also the npm latest). The README says "Popper is now Floating UI!" and points to Popper v2 on its own branch; the migration page says "Floating UI forked Popper 2" and "Learn how to migrate from Popper v2 to Floating UI." No record id popper exists in research/, so forkOf, successorOf and importsFrom stay unrecorded here; a Popper record would take them. The homepage names Base UI as "A new headless React component library built on top of Floating UI"; that is Base UI's statement and is recorded on its own record (base-ui basedOn react), not here. The LICENSE copyright line names "Floating UI contributors", a group with no legal form; the package.json author of @floating-ui/dom is "atomiks", recorded in notes only. No page states a legal entity or a country, so hqCountry stays out. The homepage links GitHub and Open Collective only; no social or newsletter link appears on the pages read. The category is ui-library because the categories import map has no positioning or tooltip value. The getting-started page says "Use on the web with vanilla JavaScript" and names Canvas, WebGL and React Native as other platforms a Platform can target; no sentence says it runs in the browser, so runsAs is not recorded. The npm download figure is the sum of the daily values from api.npmjs.org for 2026-11-01 to 2026-11-07. The React and Vue bindings are npm packages of the same project, not a basedOn statement, since the getting-started page presents them as platforms of one library.
