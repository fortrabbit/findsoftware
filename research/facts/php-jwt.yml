notes: >
  The package the install docs name is firebase/php-jwt on Packagist; its source is the repository googleapis/php-jwt, which the candidate row names, and the README badges point to github.com/firebase/php-jwt. The GitHub homepage field and the composer.json homepage differ: the field points to the Google Cloud PHP reference page, which is recorded as docs, and composer.json points to the repository, so no homepage is recorded. The repository is marked as a fork of luciferous/jwt by the GitHub API; neither the README nor composer.json says so, so forkOf is not recorded. The LICENSE file has one copyright line (Neuman Vong, 2011), so he is the maintainer; composer.json lists Neuman Vong and Anant Narayanan as authors and the README names no maintainer. The v0.0.0 tag is dated 2011-03-25, before the first release line, and is the repository's import of older history; firstRelease uses 1.0.0 (2014-08-28), the same date as the oldest Packagist upload. The composer.json extra.component block names googleapis/php-jwt.git as the target of a component of a larger repository, which is Google's own packaging, not a second product. The README's PS256 section says PHP's OpenSSL extension does not support RSASSA-PSS, so PS256 needs phpseclib as a soft dependency, and EdDSA needs libsodium or paragonie/sodium_compat; these are optional packages and no basedOn or parent is recorded. The Packagist total is the figure the package page gives; the monthly figure is not recorded. The README says the application must specify the algorithms it supports, decoding header values before verification is not supported, and a leeway of a few minutes can absorb clock skew between servers. Decode failures throw exceptions for an invalid key, an unsupported algorithm, a bad signature, a token used before its not-before or issued-at time, an expired token and a malformed token. The CachedKeySet class takes any PSR-7 compatible HTTP client, any PSR-6 cache pool, and refreshes the cache when a key ID is unknown, with an optional rate limit of 10 requests a second for lookups of unknown keys. The contributors count is the page number of the rel="last" link on the contributors endpoint with per_page=1. Keys can be PEM strings, a JSON Web Key Set parsed with JWK::parseKeySet, or a CachedKeySet; the README says decode returns the generic PHP object stdClass, and that encoding takes the payload, the key and the algorithm.
