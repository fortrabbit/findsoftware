notes: >
  Homepage https://salvo.rs answers over https and names the project as a Rust web framework; the docs are the guide under /guide/. The homepage states "MIT Licensed | Copyright © 2019-present Salvo Team", while the README, the LICENSE file and the GitHub API all say Apache License 2.0; each statement is recorded as its own license entry, and the disagreement is for a reviewer to decide. The release v1.0.1 has a GitHub publish date of 2026-10-04 and the CHANGELOG heading says 2026-10-05; the releases API date is recorded. The oldest GitHub tag is v0.18.3 (commit 2022-04-11) and the earliest release is v0.48.0 (2023-07-19), both later than the crate's creation on crates.io (2020-02-04), so firstRelease is taken from the crate registry. The crate salvo is the one the quick start installs with cargo add salvo; the crate's total downloads are recorded, and the 90-day figure from the same API is 980501, not recorded as a separate field. The homepage also links a QQ group (qm.qq.com), which has no field in this schema. The README installs a CLI through cargo install salvo-cli; it is not recorded. The database guide shows Diesel, sqlx, rbatis and SeaORM as libraries and no engine is stated in its prose, so databases is not recorded. The maintainer is named by the homepage copyright line only, with no legal form.
