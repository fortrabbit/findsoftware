notes: >
  The project's source is Codeberg (the README's Source code line and the PyPI project links), and the GitHub repository pennersr/django-allauth is a mirror whose description says so: the repository field names Codeberg, while the GitHub mirror's stars (10383) and contributors (399) are kept here only and not recorded as fields; the Codeberg repository shows 129 stars. The Codeberg repository has no releases endpoint output, so the release date and major come from the PyPI upload for 65.21.1 (2026-10-30) and the Codeberg tag list, and the changelog top entry 65.22.0 is marked unreleased. Stack Overflow tag, the Weblate translations line, the React SPA and Django demo sites, the headless API and the commercial support line (a contact address) are not recorded as fields: the API page names only the OpenAPI specification, and no REST or GraphQL sentence was found. The admin fact is the social app configuration in the Django admin, which the README names. The docs say the Django admin login does not go through django-allauth, which is not an adminUi fact. Requirements list Django 4.2 or later, which is not recorded as a runtime version. pypiDownloads uses pypistats recent last-week figures. The PyPI info field author and maintainer are empty; the maintainer comes from the LICENSE copyright line. repoOwnerType is left out because the Codeberg owner has no GitHub user type. The IdP (OpenID Connect provider) docs page states a single supported protocol, recorded as a second oidc entry under sso.
