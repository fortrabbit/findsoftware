notes: >
  Halfmoon ships no JavaScript of its own; the docs say it relies on bootstrap.bundle.js from Bootstrap, which is recorded as basedOn because the project names that bundle as the source of its behavior. The docs describe the sidebar component as the one feature Halfmoon adds over Bootstrap. The maintainer is the copyright holder named in the LICENSE and the homepage footer, Tahmid Khan, the same name as the npm author. The first GitHub release is v1.0.0 dated 2020-06-30. The docs credit the Bootstrap team for the code and docs, and the docs license is CC BY 3.0. The repository's last push is 2024-12-16, after its last release.
