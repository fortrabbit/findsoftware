notes: >
  The GitHub repository has no release objects, only tags; the highest tag v11.0.0 matches npm latest, so currentMajor comes from npm. The npm latest version 11.0.0 is dated 2020-03-20. The repository was created on 2015-12-27, the same day as the first npm version 0.0.1, which sets firstRelease. The homepage footer links a Twitter account, twitter.com/electerious, which belongs to the author; it is not recorded as x because the footer shows only icons, so no quote can be taken from the page text. The README requirement "Node.js (v8.9.0 or newer)" is the only stated minimum; the package.json declares no engines field, so runtimeMin may be out of date. The README lists handlers for EJS, Nunjucks, Twig, Less, PostCSS and SASS; those are separate npm packages, so no templating field is recorded for the core package. The homepage lists a rosid serve command that starts a server with live reloading; the README describes it as a development server. The README tip says an install with npm's --no-optional flag skips the dependencies that serve needs, so serve is not possible after such an install. The npm weekly download figure and the star count are for the week 2026-10-12 to 2026-10-18 and the date of this read. The CLI doc says a single rosidfile.json or rosidfile.js in the working directory is required. The README lists handler packages for EJS, Nunjucks, Twig and others, including rosid-handler-sass for Sass.
