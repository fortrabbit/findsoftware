notes: >
  The GitHub releases list names vinxi@0.5.8 (2025-06-29) as the highest stable vinxi tag, so currentMajor is 0; the npm latest tag is 0.5.11 (2026-01-19), which has no GitHub release, and the registry major is also 0. The repository is a monorepo with tags per package, so only the vinxi tags count. The README names SolidStart as a framework being developed on vinxi and AngularStart (analog) as an experiment; those are separate records and no field here records them. runsAs records the node server (always-on) and the static preset (static); the deployment page lists many other SERVER_PRESET values (vercel, bun, cloudflare and others) without saying how each runs, so those are not recorded. The README defines a router as a brief specification of how a group of URLs is handled, created in the routers array of createApp, with types static, http, spa, client and custom. The CLI page says the default build preset is node-server, and the deployment page says the presets come from Nitro. The page does not state a minimum Node version, and the npm metadata for the latest version has no engines field, so runtimeMin is unknown. firstRelease is not recorded: the npm package exists since 2021 but its first versions describe other projects, and the repository was created in 2023.
