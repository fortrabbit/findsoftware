notes: >
  Accepted: the SDKs (the README counts 24) are how an app wires in, and the self-hosted server is the same code as the cloud product. The LICENSE file says the bulk is MIT and that the listed enterprise directories are under the GrowthBook Enterprise License; GitHub reports NOASSERTION. The self-host page is the install source; the Helm chart is named there. The npm figure counts the JavaScript SDK package (packages/sdk-js), not installs of the server; the server is not on npm. The Enterprise paid plan is on the self-hosted comparison table of the pricing page; the cloud plan tiers are not recorded as editions. The SSO line is the pricing page's Enterprise FAQ, which names SAML-based SSO and SCIM. No runtimeMin is recorded: the repository package.json declares Node 24 for developing the repository, while the self-host guide runs a prebuilt Docker image. The compare pages name more products (Statsig, Unleash, PostHog and others) that have no record; only LaunchDarkly and Firebase do. Community links: the README names a Slack workspace (slack.growthbook.io), which the record does not hold a field for; the LinkedIn and YouTube links on the homepage are not fields here. The homepage quote is the visible heading of the page. firstRelease is the oldest tag v0.1.0 (commit 2021-05-08), and the latest release v5.2.0 was published the same day as this check. The server runs as an ExpressJS API with a Python stats engine and a Next.js front-end; the Dockerfile and docker-compose are in the repository, and the image is distroless. The Docker Hub figure counts growthbook/growthbook, the image the self-host page names.
