notes: >
  The GitHub repository has only prereleases (76 releases, the newest v0.31.12 on 2026-03-01), so latestReleaseDate is not recorded and latestPrereleaseDate carries the newest date. The current-status page says "Hence it is at version 0.x.", which gives currentMajor 0; the homepage's "Current version 0.31.12" is a dot release and is not recorded. The oldest GitHub release is v0.22.2 (2023-03-06), which gives firstRelease 2023; the site's own history dates the project from 2022. The about page gives the copyright as "Copyright (c) 2022-2025 Paul Trafford"; the about page and the homepage name no company, so maintainerType and hqCountry are not recorded. The about page and the features page name rsync over ssh and Netlify as deployment targets; the homepage shows a Netlify run. The requirements page names Wget and rsync as dependencies and the homepage's run shows WP-CLI as optional. The FAQ and in-depth pages say Netlify support was introduced in 0.22. The limitations page says the tool is not a dynamic crawler and does not run JavaScript, which is recorded as prose material only. The about page names WordPress and Drupal as examples of the content management systems whose sites it converts, the features page names the Wayback Machine, and the limitations page says the tool does not run JavaScript and that comments, discussions and surveys lose their interactivity in the static output. The category mirror from the CSV has no dictionary entry and is left out; the project is also listed as static-export.
