notes: >
  The download page says Java EE "has been contributed to the Eclipse Foundation" and links an archived Java EE GlassFish project in a separate place; the page does not call Eclipse GlassFish its successor or a rename, so successorOf and formerName are absent. firstRelease is 2012 from the oldest Maven Central upload of org.glassfish.main.distributions:glassfish (3.1.2, 2012-02-17). The oldest GitHub release is 6.0.0-M2-servlet5 (2020-07-20), so a reviewer may prefer 2020 under the same-repository rule. The GitHub license field is NOASSERTION; NOTICE.md on the main branch gives the dual EPL-2.0 OR GPL-2.0 with Classpath exception statement, recorded as two license entries with the same quote. The LICENSE file on main is the EPL 2.0 text. NOTICE.md and LICENSE were read on main, not at the 8.0.5 tag. The maintainer is Eclipse Foundation AISBL from the copyright line of eclipse.org's legal page. The foundation's organisation page says it is "based in Brussels", a city, and names no country, so hqCountry is absent. The Docker image is published to GitHub Container Registry (ghcr.io); no Docker Hub figure is recorded because the install docs name the ghcr.io image. The compatibility page says GlassFish "is a Compatible Implementation of a number of Jakarta EE Specifications" and the FAQ says the project was "started by Sun Microsystems, then sponsored by Oracle Corporation, and now living at the Eclipse Foundation"; neither names a parent record, so basedOn and parent stay absent. Professional services and support companies listed on the support page are not recorded. The social links in the glassfish.org footer belong to the Eclipse Foundation and are not recorded. Fields coined here: none.
