notes: >
  The repository is archived on GitHub, and the README says the project is no longer maintained and that its NuGet package is deprecated; both are recorded as status discontinued under AGENTS.md. The repository is the project's own source and has no homepage. The project has no GitHub release objects, only the tags 0.9.0 to 0.9.2.1, so the release fields come from NuGet, whose latest version 0.9.2.1 was published 2018-07-31 and is flagged deprecated there. The maintainer is the copyright holder on the LICENSE file; the GitHub login is tomzorz. The README names Mustachio as the library the project is based on and Mustache as its templating language.
