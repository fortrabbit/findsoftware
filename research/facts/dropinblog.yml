notes: >
  Hosted blog platform for sites built on other software (Shopify, BigCommerce, Framer, Webflow and about 50 more platforms) and for custom sites through an HTML embed or an API. The SDK packages in the DropInBlog GitHub organization (react-core, react-nextjs, react-express, react-catalyst, react-tanstack-start, astro, laravel-rendered; all MIT, none archived) and the n8n node are SDK sources and go here only. The API reference offers a Rendered API that returns HTML and a Raw API that returns structured JSON, and it names no REST or GraphQL style, so headlessApi is absent; the homepage calls the Raw API a "JSON API". The address on the privacy policy is the only postal address found; the company page names no office, so the reviewer decides whether the Sheridan, WY address stays as hqCountry. The company page states "Established in 2013 and launched in 2015"; firstRelease takes the launch year. Plans: Solo, Team, Business and Business Plus with per-user and monthly prices, an enterprise tier, and a seven-day trial; no free plan; no prices are recorded. The pricing table's SSO row does not map cleanly onto the plan columns, so no sso fact is recorded. The features page labels "Live Preview" with no sentence, so no livePreview fact. Other items kept in notes: an MCP server for AI-driven blog management, a Zapier integration, Blog Voice AI, Mention Boost, Blog Pilot and Smart Snippets (feature names), a backup and data export feature and the "Link Guard" and version history plan rows. The LinkedIn link on the homepage is coined and not recorded as a field. The company is self-funded per its company page.
