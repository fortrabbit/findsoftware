notes: >
  No homepage: the repository names no site. The README links an article on envoy.engineering, which is not the project's own site and did not answer (no connection) when read on 2026-10-26. The repository holds 12 GitHub releases, the oldest v4.0.3 (2018-04-16), so firstRelease is 2018; earlier tags have no release. The tag v5.0.0-rc is not a stable release and is not used. The README links an article titled "Embedded web server for iOS UI testing" and names Ambassador, a web framework built on Embassy (a separate project, not recorded here). Stars and contributors are the API counts at 2026-10-26. The copyright holder in the LICENSE is Outrageous Labs, Inc, which the record takes as the maintainer.
