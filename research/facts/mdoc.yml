notes: >
  The record is a markdown tool that writes markdown: the Scala code blocks it evaluates are replaced by their output. Its DocusaurusPlugin builds a static site from that markdown with Docusaurus (docusaurus.html: "Generate a static website with docs / docusaurusCreateSite"). The Docusaurus page lists node and yarn as requirements to run Docusaurus; basedOn stays empty because Docusaurus is a separate tool.
  The highest stable GitHub release is v2.9.2, which the installation page also names as the sbt-mdoc version.
  The README lists the JDK versions per release: JDK 8 up to v2.6.1, and JDK 11 or newer for the latest release.
  Maven Central is the artifact source; it is not in the registry list, so no registry figure is recorded.
  The homepage is served over https. The runsAs value is local: the docs/mdoc task runs in a developer's sbt build. The installation page lists three integrations: sbt-mdoc, the command line and a library API.
