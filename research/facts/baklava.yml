notes: >
  The homepage https://baklava.design/ answers 200 with a Storybook shell whose documentation loads in JavaScript, so its text cannot be quoted; it is recorded as homepage because the README links it as the Storybook documentation and the repository's homepage field repeats it. The Storybook documentation sources are in the repository's docs/ folder at the v3.5.0 tag, and the install and framework pages there (using-baklava-in-vue, using-baklava-in-react, using-baklava-in-next) are the install pages read. The npm registry name is the scoped @trendyol/baklava; the unscoped baklava package on npm belongs to another project and is not used. The CSV figure of npm 1.6k per week was not reproduced: the last-week endpoint answered with a stale window (2026-06-25 to 2026-07-01), so the sum of the daily downloads for 2026-10-18 to 2026-10-24 from the range endpoint is recorded. The GitHub repository's default branch is next; the stable release v3.5.0 is the highest stable release object, and v3.5.0-beta.12 is the newest prerelease, dated 2026-10-26. The first release is taken from the oldest GitHub release object (v2.0.0-beta.2, a prerelease); the npm package's first upload is 2.0.0-beta.10 on 2022-07-01, so 2022 holds either way. The Lit dependency is stated in the requirements page; no version of Lit is recorded. The README says the web components can be used within web frameworks including Vue, React or Angular. Trendyol's company legal name and country are not stated on any page read, so hqCountry is absent.
