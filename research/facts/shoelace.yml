notes: >
  Discontinued on two signals from the project: the GitHub repository is archived (API read 2026-10-28), and the README and the documentation say "Shoelace is sunset" with no active development, pointing issues and pull requests to Web Awesome. Web Awesome is named in notes only: no web-awesome record exists, so successorOf is not recorded. The homepage banner and the repository description say "Shoelace is now Web Awesome"; Web Awesome is a separate product with its own repository, so the record stays discontinued and Web Awesome is the successor in notes. The CSV homepage (webawesome.com) is the successor's site, so the project's own site shoelace.style is used. The README and npm package name Node 14.17 or higher only for building and running the repository locally, so no runtime is recorded. The Web Awesome license and privacy pages name no legal entity or country, so hqCountry is not recorded. The license statement is MIT in the LICENSE.md file and the GitHub API; one wording, one entry. The oldest release entry is 1.0.0-beta1 of 2017-07-26, which sets firstRelease. Dependent counts are from ecosyste.ms for the npm package; the npm weekly figure is the sum for 2026-10-19 to 2026-10-25.
