notes: >
  Boundary decision: accepted. The project's own pages document apps and scripts sending through its HTTP API: the homepage says "Publishing messages is just a HTTP request, so pretty much everything under the sun can integrate with ntfy", and the publish page says "Publishing messages can be done via HTTP PUT/POST or via the ntfy CLI". The install page describes running the server as a permanent service. A reviewer should confirm this reading, since the record is an end-user push server with an API.
  Maintainer: the contact page says "This service is run by Philipp C. Heckel." The homepage footer reads "Made with heart by Philipp Heckel © 2026 ntfy LLC. All rights reserved.", so ntfy LLC is a second legal entity named by the project and is not recorded as maintainer; no page gives its country, so hqCountry is unknown. The LICENSE file in the repository carries no copyright line.
  License: the repository's LICENSE is the Apache 2.0 text and the repository also ships LICENSE.GPLv2; the homepage states the dual license, recorded as two license entries. The GitHub API reports Apache-2.0 only.
  Hosted plans: the public server ntfy.sh offers a free tier without sign-up and Supporter, Pro and Business plans on the homepage; the homepage pricing section is the only readable source, because ntfy.sh/pricing returns a page that requires JavaScript. Plan prices and limits are not recorded. Plans are hosted tiers, so no paidEdition is recorded. The homepage also says "If you use ntfy without sign-up, the topic is essentially a password, so pick something that's not easily guessable."
  Coined fields, to notes only: webhooks ("Webhooks (publish via GET)" on the publish page), apiStyles (HTTP PUT or POST, JSON, SSE, raw and WebSocket subscriptions), sdkLanguages (the publish page shows code samples in curl, CLI, HTTP, JavaScript, Go, PowerShell, Python and PHP; these are samples, not published SDK packages), deployShape (single binary, Docker, Kubernetes, Helm chart from a third party named HelmForge, which the project says it does not maintain), freeTier (see above), e-mail notifications and phone calls (both on the publish page; the homepage counts daily e-mails and phone calls per plan).
  Clients: the homepage lists Google Play, F-Droid and the Apple Store for the mobile app, and a web app for subscribing in a browser.
  Community: the Matrix space is at matrix.to/#/#ntfy-space:matrix.org (contact page) and GitHub Issues is the bug tracker; neither has a field.
  Adoption: GitHub stars and the Docker Hub pull count are recorded with their dates; the homepage shows a different star count, which is not recorded.
