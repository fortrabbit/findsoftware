notes: >
  The GitHub and npm homepage fields say http://pixijs.com/, which is not linked because it is plain http; https://pixijs.com answered 200 without a redirect on 2026-11-16, so that is the homepage. The LICENSE on the default branch (dev) carries the copyright line "2013-2023 Mathew Groves, Chad Engler", recorded as the maintainer. The homepage describes PixiJS 3D as "PixiJS 3D is an extension, not a fork"; it is not a separate record. The quick start's "Install Node.js v20.0 or higher" is for the npm create pixi.js scaffolder, so no runtime or runtimeMin is recorded. The README names Discord, Bluesky and X; the homepage navigation gives a second Discord invite (discord.gg/CPTjeb28nH) and the README invite (discord.gg/QrnxmQUPGV) is the one recorded; the reviewer decides whether both count. The homepage carries a sponsor block with logos of advertisers unrelated to PixiJS, which is not recorded. The npm figure is pixi.js for 2026-11-01 to 2026-11-07. The GitHub figures are for the repository, which holds the 2D package source. The first GitHub release is v1.3.0 (2013-08-18); the npm package pixi.js was created on 2014-01-05. The CSV lastRelease (2026-10-01) predates v8.23.0 (2026-11-11). The Environments guide says PixiJS runs in browsers by default and that a Web Worker, Node.js or other non-browser environment needs a custom adapter; no runtime is recorded for that. The FAQ says PixiJS is a "creation engine" and not a game engine, and gives GitHub Discussions beside Discord for questions (forum). The FAQ and Versions pages give the npm and CDN routes; the CDN file is the browser build pixi.min.js.
