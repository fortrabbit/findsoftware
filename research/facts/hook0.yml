notes: >
  Hook0 is named as a webhook server in its README and documentation, and the homepage's sample request is a POST to the REST event endpoint (POST your event once; the API receives events from an application), which is the wiring test for an end-user app: an application calls the API to send events. The GitHub repository is the mirror the candidates row names; the README gives GitLab (gitlab.com/hook0/hook0) for issues and the roadmap, and the docs name GitLab as the source. Two copyright names: the README footer says "© Hook0 SAS", the terms name FGRibreau SARL as the operator with a registered office in Chantonnay, France; the record uses the terms' legal notice name and the reviewer decides between the two. LICENSE.txt is the MongoDB Server Side Public License v1 text with no project copyright line, so the LICENSE line does not settle the maintainer. The self-hosting pages (Docker Compose, bare metal, Kubernetes) are headed "Development Only", set DISABLE_TARGET_IP_CHECK to true and direct production workloads to Hook0 Cloud, and they say the DISABLE_TARGET_IP_CHECK flag lets a local stack deliver to localhost and must stay false on any deployment that accepts subscriptions you do not control; the pricing page offers an On-Premise tier and states no enterprise tier holds features back, so no paidEdition is recorded; the reviewer decides whether the dev-only headers make the self-install not a production install. currentMajor is unknown: GitHub releases are per component (api/v1.0.2 from 2026-05-13, frontend/v1.2.1, mcp/v3.0.0, cli/v1.0.1, output-worker/v1.0.7), the root tags run to v2.0.8 (2026-05-05), and api/Cargo.toml on the default branch reads 3.0.0; the reviewer picks the line. latestReleaseDate is the newest stable release of the server component (api/v1.0.2, 2026-05-13); the dashboard component has later releases (frontend/v1.2.1, 2026-09-21). The pricing page lists Developer, Startup, Pro and Enterprise plans and the on-premise tiers with prices; no prices recorded. Docker Hub is not named by the install docs (the README's Docker Hub badge is commented out), so no pull figure. Compare pages Hook0 vs Svix, vs Requeue, vs Convoy and vs Hookdeck name projects; Requeue has no candidate id. The homepage says the API is a "Fully documented RESTful JSON API" and the product "Built for GDPR"; the pricing page offers a Developer plan "free forever for side-projects"; the homepage footer links LinkedIn. Hook0 SDKs and the MCP server are documented but not recorded. The homepage's star figure matches the API figure and is not recorded from the page. Community links taken from the homepage footer and the community page. Contributors count from the contributors endpoint with one per page, last page 13.
