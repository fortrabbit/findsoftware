notes: >
  Criterion 4 is in doubt: the project has alpha releases only and no stable release; a stable release would settle it.   No stable release exists: the GitHub releases are v1.0.0-alpha.1 to v1.0.0-alpha.9, which the API marks as not prerelease although the tag names say alpha, and the repository tags run to v1.0.0-alpha.10, which the docs site header shows as the current version without a release object. The latest prerelease date is the alpha.9 release; no currentMajor is recorded because no stable release exists, and the reviewer decides whether a record with alpha releases only meets criterion 4. The first release is alpha.1 (2026-07-05); the repository dates from 2015 and carries no earlier tags, so firstRelease 2026 is the oldest release in the repository. The README names the license MIT with copyright "2015-2026 Dubalu LLC"; no legal form or country for Dubalu LLC was found on dubalu.com, whose homepage does not name it. The bundled Xapian fork under src/xapian carries Xapian's GPL license, recorded as a second license statement without a version, since the README says only "(GPL)"; the Xapian record gives GPL v2 or later. The README names the build requirement as C++20 with CMake 3.16 and OpenSSL 3 for the default TLS build; this is a build requirement, not a runtime minimum, so runtimeMin is not recorded. The project describes its clustering as per-shard primary election over Raft with pull-based replication; this is not a field here. The docs site title reads "Search and Storage Server".
