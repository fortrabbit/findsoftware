notes: >
  The CSV homepage is plain http; the site answers over https at www.locomotivecms.com (the apex domain does not answer), so the https www address is recorded. The GitHub repository has no releases; the latest stable is the 4.1.1 gem on RubyGems, matched by the tag v4.1.1, and currentMajor and latestReleaseDate come from RubyGems. The 4.2.0.alpha1 and alpha2 pre-releases (2024) are the latest pre-release. The CSV lastRelease date (2022-10-13) is the 4.1.1 date. The getting-started page states Ruby 2.6, MongoDB 3.4 and Rails 5.2.4.1, which describes an older install line; the README's Ruby 3+, Rails 7 and MongoDB 6 are recorded as the current runtime. The MIT-LICENSE file reads Copyright (c) 2010-2023 NoCoffee, the README reads 2010-2024; both are recorded as the project words them. The GitHub license field reports NOASSERTION because MIT-LICENSE is not named LICENSE. The terms of use name the laws of France and a Toulouse court, which is not a statement of headquarters, so hqCountry is not recorded. The pricing page lists hosting plans in dollars per month; no prices are recorded and the hosting tiers are not an edition. Wagon, the local site tool (github.com/locomotivecms/wagon), is a separate repository; this record covers only the engine. The rubygems downloads figure is the total for the gem. The firstRelease is the commit date of the oldest stable tag, v2.0.0 (2013-04-03); the release candidates before it start in 2012. The home page links a Gitter chat, which has no field.
