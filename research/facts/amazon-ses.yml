notes: >
  The record covers the hosted SES service. The GitHub repository aws/aws-sdk-js-v3 is the JavaScript SDK that calls the service, not the service, so no repository, license or stars are recorded: in notes only, it is Apache-2.0 with 3678 stars (api, 2026-10-31). The npm package @aws-sdk/client-ses is that SDK; its sum of downloads for 2026-10-23 to 2026-10-29 is 5601349 (api), and its latest version 3.1161.0 is Apache-2.0 and not deprecated; the candidates row figure of 2.3M a week is stale and not used. The AWS Free Tier text on the pricing page names SES only as a service that new customers' credits can be applied to, so no free tier is recorded. The regions page names no list of regions, so the regions value only states that the service is offered in several AWS Regions. The privacy page gives the mailing address in Seattle, Washington. The parent value rests on the privacy page's statement that Amazon.com, Inc. controls the affiliates it names, including Amazon Web Services. Amazon Web Services, Inc. is named as the contracting party in the terms; no separate page for the SES product's own legal entity was read.
  The developer guide's welcome page states that SES sends marketing emails, transactional emails and newsletters, that it can receive email, that bounce and complaint notifications go to Amazon Simple Notification Service, and that IAM controls user access to sending. These statements are not recorded as fields.
