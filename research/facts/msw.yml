notes: >
  The homepage says the library works in the browser and in Node.js; the title names both, so runtime is node and no runsAs is recorded, per the rule for libraries that name both. The FAQ says MSW does not support Node.js versions below 22 (quote: "MSW does not support Node.js versions below version 22"); that minimum is a runtime support note, so no runtimeMin is recorded. The npm package msw engines field says node 22.12.0 or later.
  firstRelease is 2018, the oldest upload of msw on npm (version 0.1.0); the oldest GitHub tag found is v0.3.2 in 2019 and the first GitHub release is v0.6.0 in 2020.
  The alternativeTo entries come from the comparison page's own sections for Nock, JSON Server, Mirage (miragejs), Cypress and Playwright. Each quote is the first sentence of the tool's own section on that page.
  The Discord link on the homepage is kettanaito.com/discord, which redirects to discord.com/invite/z29WbnfDC5; the final URL is recorded. The X link is twitter.com/ApiMocking, which redirects to x.com/ApiMocking.
  The npm figure counts downloads for the package msw that the quick start installs. Stars and contributors belong to the mswjs/msw repository. The homepage and README name companies that use MSW and say it is trusted by hundreds of thousands of engineers; neither is an install count, so reportedInstalls is not recorded.
  The GitHub Sponsors profile and the Egghead courses (paid training material, linked from the README) are not an edition of the library and are not recorded as paidEdition or pricingPage.
  The maintainer is the copyright holder in LICENSE.md; the homepage footer says the site was created by kettanaito, the same person's handle.
  The README describes Express-like routing syntax, with parameters, wildcards and regular expressions in the match. It says the same request handlers serve local development, debugging and testing. The homepage says that in the browser MSW uses the Service Worker API, while in Node.js it intercepts requests at the socket level, and names REST, GraphQL, Server-Sent Events and WebSocket APIs as mockable.
  The README says the application's code and tests stay unaware of whether something is mocked.
