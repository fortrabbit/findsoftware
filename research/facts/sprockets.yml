notes: >
  No homepage: the GitHub homepage field points at the repository itself, so none is recorded. The README is the documentation; the rubydoc page for the gem names the same library and is not read. The maintainer is the copyright line of MIT-LICENSE and the gemspec author list, both naming Sam Stephenson and Joshua Peek; the GitHub owner is the rails organization, which is not used because the project names its authors. The README says the library is usually used "through another framework (such as the Rails asset pipeline)", which is no basedOn statement because it does not say Sprockets is built on Rails. The gem depends on Rack (>= 2.2.4, < 4), which is not a record, so no basedOn. The README's Serving Assets section says production assets are generated to a directory on disk and served by a web server, which is the runsAs static value; no page states rendering modes. The gem metadata for 4.4.1 gives the same Ruby minimum as the gemspec at tag v4.4.1. The tag v4.4.1 is the latest version, but GitHub releases stop at v4.2.2 (2025-08-19); the tags v4.3.0, v4.4.0 and v4.4.1 have no GitHub release, so latestReleaseDate comes from the RubyGems release of 4.4.1 (2026-08-25). The first version is the tag 1.0.0 whose commit is dated 2009-02-18, earlier than the 2015 repository creation, because the history was imported later; the RubyGems entries for 0.9.0 carry the same 2009 year. The contributors figure is the last page of the contributors endpoint with per_page=1. The rubygemsDownloads figure is the gem total the RubyGems API states, with no period. The ecosyste.ms counts are for the RubyGems package sprockets. Prose-level mentions of CoffeeScript, Sass and SCSS as source languages stay in the README and are not recorded as fields.
