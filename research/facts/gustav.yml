unreadable:
  - https://gustav.futape.de (redirects to https://github.com/futape/gustav, which the record takes as the repository)
  - https://github.com/futape/gustav/wiki/Getting-started (rendered as a JavaScript shell; the same text read from the doc branch of the repository)
notes: >
  The homepage address gustav.futape.de redirects to the GitHub repository, so no project website is recorded. The documentation is the GitHub wiki, which the README links; its pages are mirrored as Markdown on the doc branch, which the Getting-started and Generating-destination-files quotes read. The wiki's System-requirements page states PHP 5.3+ and designed for an Apache server; it was last edited with the 1.1.1 tag. The Getting-started setup points an Apache ErrorDocument 404 at generate.php, so a missing destination file is generated by PHP on the server when it is requested; the live site needs Apache and PHP, and runsAs static is not recorded even though destination files can be static. Releases: the repository has tags 0.1.0 to 1.1.1 and no GitHub releases; latestReleaseDate is the date of tag 1.1.1. No page states that the project has ended, so status stays accepted. The GitHub API reports license null because the LICENSE file sits in src/futape/gustav; both license entries come from the README (the CC license covers the logo and documentation). The source is not on Packagist. The maintainer is the author named in the README.
