notes: >
  The README links a Netlify deploy button for a separate template repository, which is not recorded as a host dependency. The docs say the output folder is cleaned and regenerated on every build. The npm package ships the command as dist/cli.js. The README features list says the site can have a global layout and page-specific ones, site metadata from a global file and data per page, and partials; the docs say page data is YAML front matter, that site data lives in site.config.js, and that each page is saved as index.html in a folder named after its source file, except a file already named index. The docs say nanogen start rebuilds the site on any file change and refreshes the browser. The GitHub Pages site is the project's own site, so it is the homepage. The npm figure of 1 download for the week of 2026-10-12 to 2026-10-18 replaces the 2 in the candidate row; the figure is recorded as the API states it.
