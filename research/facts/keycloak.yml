notes: >
  The homepage says the project is a Cloud Native Computing Foundation incubation project; that describes its hosting, not an owning company, so no maintainer or parent is recorded. The runtimeMin of 21 comes from the release notes listing Java 21 support and Java 17 deprecated; the getting-started zip page asks for OpenJDK 25. The downloads page lists a JavaScript release on a separate cycle, which is not recorded. The endoflife.date cycle 26.8 is the current line. Keycloak is self-hostable by design, but no selfHostOption wording was copied, so the field is not recorded.
