notes: >
  The homepage names the repository as its source and the documentation at kamal-deploy.org/docs; the repository's README points to kamal-deploy.org for installation, configuration and commands. The RubyGems package kamal is the install route the docs name; its figures are recorded. The gemspec declares no required_ruby_version, so runtimeMin is not recorded. Kamal is named after an ancient navigational tool and "was formerly known as MRSK" (homepage): the record follows the current name and no successorOf is recorded. The homepage's "Why not just run Capistrano, Kubernetes or Docker Swarm?" section compares Kamal with those tools; the comparison names Capistrano, Kubernetes and Docker Swarm; Capistrano is recorded as alternativeTo, Kubernetes and Docker Swarm are not records and stay in this note. The docs installation page names the Docker container route, with the limitation the page gives. The latest GitHub release is v2.12.0 (2026-06-18); the docs site also offers version 1.9.2. The deployed app runs in containers on the target servers (installation page: "Start a new container with the version of the app"); the brief's rule records Kamal itself as local, a reviewer may decide whether runsAs should also show always-on for the deployed containers. The maintainer is 37signals LLC as the terms and footer name it; the MIT-LICENSE copyright line names David Heinemeier Hansson. The README says "Originally built for Rails apps, Kamal will work with any type of web app that can be containerized with Docker". It also says Kamal uses kamal-proxy to switch requests between containers, uses SSHKit to run commands across several servers, and was originally built for Rails apps. The installation page says kamal setup installs Docker on servers that lack it (using get.docker.com, with root access over SSH), logs into the registry, builds and pushes the image, and routes traffic to the new container once it answers GET /up with 200 OK. The installation page lists the steps of kamal setup, among them pulling the image from the registry onto the servers.
