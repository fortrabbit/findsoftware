notes: >
  Status accepted. Criterion 1: a test-double library that projects add as a dev dependency, so it is part of building and testing a PHP application, not an application. Criterion 2: installed with Composer from Packagist (mockery/mockery), the route the README install section names. Criterion 3: the README Installation section gives the composer command. Criterion 4: the repository is not archived; the default branch is 1.6.x and the latest GitHub release 1.6.15 is dated 2026-08-19. The README says the project transferred from padraic/mockery to mockery/mockery; the new location is the one recorded. The first tag is 0.6.0 (2010-05-27), the oldest tag and older than the Packagist uploads, so firstRelease is 2010. Currently 1.x is the major; the README says Mockery 1.3 was the last version to support HHVM 3 and PHP 5. The README calls the project "released under a New BSD License"; the LICENSE file names the BSD 3-Clause License, so one license entry is recorded. The docs homepage says Mockery is "designed as a drop in alternative to PHPUnit's phpunit-mock-objects library"; phpunit-mock-objects has no record, so the statement stays in notes and alternativeTo is not recorded. Mockery integrates with PHPUnit through helpers (MockeryTestCase and traits) without being built on it, so basedOn is not recorded. The runtimeMin 7.3 comes from the require.php of the 1.6.15 Packagist metadata. The README versioning section says some of Mockery's internals are private and open to change at any time, and that a class which is not final or a method which is not private is not part of the API the versioning scheme covers. The Packagist total download figure is cumulative since the package was first listed. The contributors count is the page number of the last contributors page, 200.
