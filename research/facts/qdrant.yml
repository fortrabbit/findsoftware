notes: >
  The homepage link is https. The Impressum names Qdrant Solutions GmbH at Chausseestraße 86, Berlin, and the terms name the same company; country is Germany. The homepage links to a Discord invite (qdrant.to/discord) and to twitter.com/qdrant_engine; the homepage also links YouTube and LinkedIn, which no field records. The README names Qdrant Edge, a beta embedded library that runs inside the application process; it is a separate product and is not recorded on this record. The README names Agent Skills and the official client libraries (Go, Rust, JavaScript, Python, .NET, Java); the clients are not the server and no client package figure is recorded. The source build needs a Rust toolchain: Cargo.toml at v1.20.0 sets rust-version 1.98; this is a build requirement, so no runtimeMin is recorded. The paidEdition fact is the Qdrant Private Cloud Enterprise Operator, a commercial Kubernetes offering installed in the customer's infrastructure; the installation page compares it with the Helm chart. The sso fact comes from the Qdrant Cloud Premium tier on the pricing page; the pricing page does not name SAML or OIDC. The Qdrant Cloud regions and prices are not recorded. The README names a gRPC interface beside the REST API; the installation page says the storage must be POSIX block-level storage, that NFS and object storage are not supported, and that Docker on Windows with mounts is known to cause data loss. The v1.20.0 release sits in the major 1 line. The homepage states 35k+ GitHub stars; the API figure is recorded.
