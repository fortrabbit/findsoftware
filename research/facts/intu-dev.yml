notes: >
  The candidate's name INTUITION.DEV is the company that publishes the repository; the project's own README title is "MetaBake ( Intuition v1 )" and the CLI is mbake, so the record is named MetaBake. The npm homepage http://www.INTUITION.DEV does not connect, and intuition.dev now serves "Intuition Robotics", an unrelated company, so no homepage is recorded and the record is a stub, as bowman is. The candidate homepage intuition-dev.github.io/intuDocs/ is a docsify page whose HTML is an empty shell that loads its content in the browser, so it is unreadable. A reviewer should decide whether the intuDocs docs site counts as the project's own site instead. The npm package named intu-dev belongs to another project (intuware/intu-dev) and is not used. The GitHub repository is not archived (last push 2023-01-09), so the stub status comes from the homepage, not from an end signal. The GitHub releases run from v1.9.20 (2019-10-01) and include v5.06.08 (2019-05-18); the npm package mbake is at 8.5.4, a higher major, so currentMajor is taken from npm under the registry-fallback rule. The mbake package's npm repository field points to git.metabake.net, not the GitHub repository. The LICENSE file in the GitHub repository is MIT; the npm package states LGPL-3.0-only; both are recorded as license entries. The runtime and its minimum come from the engines field of the npm package. The README points readers to a main project, github.com/INTUITION-dev/INTU, which is not read here. The first release year uses the first npm version publication (3.7.40, 2018-07-20). The LICENSE copyright line names Cekvenich, and the npm maintainers list is longer; the copyright line is used as the maintainer. GitHub reports no primary language, so language is not recorded.
