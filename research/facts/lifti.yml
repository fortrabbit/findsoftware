notes: >
  The candidates row named a 202-star repository with 307.8k NuGet downloads; the current NuGet total for Lifti.Core is 315177 and is recorded with its date. The NuGet package Lifti.Core is the one the landing page's install line names (Install-Package Lifti.Core); the lifti package in the NuGet flat container is a different project and is not used. The landing page at the root of the site still says "(netstandard 2.0)", while the docs' last change removes netstandard references and the csproj at v7.0.2 targets net8.0, net9.0 and net10.0; runtimeMin follows the manifest at the latest tag, so the minimum recorded is .NET 8.0 and the netstandard wording is not recorded. The GitHub releases run from v2.0.0-beta17 in July 2020; the NuGet registration holds Lifti.Core 1.0.0 published 2018-01-19, which is older than the GitHub releases and gives the firstRelease year. The repository was created in 2019 and the NuGet upload predates it; no page states the reason. The repository's last push date is 2026-05-10, and its NuGet versions published that day are pull-request build numbers (8.0.0-pr-135), which are not releases and are not recorded as a prerelease. The maintainer is the individual Mike Goatly, as the LICENSE copyright line and the csproj Authors line state; GitHub gives the location as UK, which is not a legal notice, so hqCountry is not recorded. The docs describe the serialization of an index to a stream and to a backing file, and the in-memory design; no page states a runsAs value, so none is recorded. The README lists indexing loose text, indexing object properties, a query language with AND, OR and NOT operators, a thesaurus and a compact binary serialized format. The docs name client applications such as Blazor, UWP, Xamarin, WPF, Uno Platform and Avalonia UI, and ASP.NET applications that search a long list of words, as use cases. The contributors count is 4 across all pages. The license is MIT in the LICENSE file and in GitHub's detection, one entry each.
