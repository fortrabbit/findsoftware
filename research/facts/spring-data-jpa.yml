notes: >
  Status accepted: the repository is public and not archived, the last push is recent, and the README gives the Maven install route (criterion 2 and 3). The CSV row and the spring.io page name the same project. Stars, contributors and the release list are read from the spring-projects/spring-data-jpa repository, a single-module repository, so the figures are the project's own. currentMajor is 4 from 4.1.2 (2026-10-23), the highest stable GitHub release; 4.0.8 carries the same date. The newest prerelease, 4.2.0-RC1 (2026-10-23T08:05:22Z), is older than 4.1.2 (08:06:22Z), so no latestPrereleaseDate is recorded. The Maven Central latest version is the 4.2.0-RC1 pre-release, which is not used for currentMajor or latestReleaseDate. firstRelease is 2011 from the 1.0.0.M1 tag (commit 2011-02-10); the repository was created on GitHub in 2010, but its earliest tag is from 2011. The maintainer is the legal name in the spring.io legal line: the site footer names Broadcom Inc. and says the term Broadcom refers to Broadcom Inc. and its subsidiaries. The reference documentation footer reads "© 2008-2026 VMware, Inc." and the LICENSE file has no copyright line (the Apache template), so the footer of the project site is the recorded source; the spring.io site also names VMware in its training and support text, which is not a legal line. Spring Data JPA is part of the Spring Data family, whose README says it builds on Spring Framework. The runtime value jvm comes from the README sentence naming Java for an application using the repositories; the README's Building from Source section names JDK 17 for building the project, which is a build requirement, and no page states a minimum runtime for consumers, so runtimeMin is left out. The getting-started page names start.spring.io and Spring Tools as ways to bootstrap a project, and the README names StackOverflow questions tagged spring-data-jpa as the place to ask. The reference page names Jakarta Persistence API as the specification the repository support is provided for; a specification is not basedOn. The databases field is left out because no page names a database the project supports; the H2 example is a configuration sample. The homepage lists Spring Data's wider family of projects and training offers, which are not recorded. The Spring Data JPA project is one module of the Spring Data family; the other Spring Data modules are separate projects with their own records if added.
