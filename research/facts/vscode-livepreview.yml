notes: >
  Homepage. The CSV homepage is http://aka.ms/live-preview, which answers over plain http with a 301 to the Visual Studio Marketplace listing; the project has no site of its own, so no homepage is recorded and the listing is the registry, not the project's site. Registry: VS Code Marketplace item ms-vscode.live-server (publisher ms-vscode, display name Live Preview). The Marketplace page shows 13,949,981 installs on 2026-10-28, recorded here as vscodeInstalls for the notes only. Version: the highest stable GitHub release is v0.4.20 (2026-08-12); the v0.5 releases dated 2026-07-02 to 2026-09-23 are GitHub prereleases, and the newest of them sets latestPrereleaseDate. The Marketplace currently offers 0.5.2026092301 as its version. The README opens with "WARNING: This extension is still under development!"; that is a status statement, not an end signal, so the record stays accepted. Runtime: the manifest's engines field names VS Code (^1.109.0), not Node.js, so no runtime value is recorded. Contributors count across all pages. The MIT license copyright line reads "Copyright (c) 2021 Microsoft", and the legal name comes from Microsoft's privacy statement.
