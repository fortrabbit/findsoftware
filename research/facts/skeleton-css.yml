notes: >
  The project site is served over plain http only (http://www.getskeleton.com redirects to http://getskeleton.com/); the https address does not answer, so the homepage is not linked, and the README's documentation link points to the same http site, so no docs fact is recorded. The site's content (the grid, the element styles and the download) was read over http for the description, and the GitHub README carries the install routes. The highest GitHub release is 2.0.4 (2014-12-29); the latest push to the repository is 2023-11-14 and no release follows it, so the import will judge listing by latestReleaseDate. The npm registry is not named by the install docs and no npm package is recorded. The first GitHub release is v1.2 (2014-12-08); the repository was created in 2011. The README names community extensions for LESS and Sass that are not the project. The project names itself a "starting point, not a UI framework" on its site; the css-framework category follows the README's description of styled elements and a grid.
