notes: >
  The README also asks anyone who needs a feature to send a pull request, so that a new version can be built. The README says the project is not maintained actively, which is the unmaintained signal, so the status is discontinued and the README quote is the citation. The Maven Central artifact net.bootsfaces:bootsfaces has versions 0.6.0 to 2.0.1; its earliest upload (2015-01-11) is later than the GitHub release v0.5.0 (2014-10-31), so firstRelease is 2014. The highest stable GitHub release is v2.0.1 (2024-09-22); v2.0.0 is a prerelease. The pom.xml on master sets the Java source and target to 11, matching the README. The quick-start page still describes Java EE 6 and 7 with JSF 2.2 and 2.3, which contradicts the README's JSF 4.0 and Jakarta requirement for 2.0.0; the README is the later statement and it is the one quoted. The homepage was read over https; the http address does not answer. The pom.xml developer list names BootsFaces Team, with TheCoder4EU as its organization, and Stephan Rauh, with BeyondJava.net; the maintainer is recorded as the pom states it, because no legal notice was found. The privacy page names no operator. The CSV row lists component-library, but the pages call the project a framework and no component-library wording appears on them, so framework is recorded. The Jakarta Faces basedOn value comes from the README's JSF 4.0 and JakartaEE requirement. The x link is the follow button in the homepage footer. The runtime value jvm and runtimeMin 11 come from the README. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header.
