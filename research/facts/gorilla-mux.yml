notes: >
  Current major is v1 (highest stable release v1.8.1, 2023-11-05); the repository's last push is 2024-08-15 and no release, tag or archive flag marks an end. The gorilla homepage is the project's own site for the whole Gorilla web toolkit; the record describes the mux package, which the toolkit lists first among its packages, and names no other toolkit package as a basedOn or parent. The LICENSE copyright line names "The Gorilla Authors", recorded as the maintainer; the homepage names the Gorilla toolkit without a legal name. The homepage also lists a Slack channel and a mailing list, which are not recorded because no starter field covers them; its GitHub Discussions link is the forum. The README is the package's documentation and has no separate docs site; the docs field is unknown. The homepage's gorilla/pat entry calls it an alternative to gorilla/mux; that is the same project's sibling, not recorded as alternativeTo. The Go module needs no registry download figure. The README describes matching by host, path prefix, methods, headers, query values and custom functions, subrouters that share conditions, named routes whose URLs are built back from their patterns, and middleware.
