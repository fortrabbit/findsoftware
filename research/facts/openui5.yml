notes: >
  The npm figure counts @openui5/sap.ui.core, the core library the repository is built around; the UI5 CLI (@ui5/cli), which the getting-started guide names for setting up projects, is a separate package and is not counted. The GitHub repository was created in 2013, but its first GitHub release is from 2019-05-01; firstRelease takes the first npm upload of @openui5/sap.ui.core in 2018. The LICENSE.txt file is the Apache License 2.0 text and the README says third-party modules carry their own licenses in THIRDPARTY.txt. The homepage at http://openui5.org redirects to the https address, which is the one recorded. The Slack workspace the README names for OpenUI5 is not a recorded field. The imprint page at sap.com answers with 403 to this research client, so hqCountry is not recorded. The homepage and README describe an MVC architecture, data binding to JSON, XML and OData models, and responsive controls for all devices; the UI5 CLI manages framework dependencies and builds application packages, as its getting-started guide states.
