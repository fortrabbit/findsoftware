notes: >
  The README describes Basecoat as an implementation of the shadcn/ui design system for any web stack, without React, Radix or framework runtime dependencies, and the homepage headline names shadcn/ui; both tailwindcss and shadcn/ui are recorded as basedOn. The first release is the earliest npm version, 0.1.0, published 2025-05-08; the GitHub release objects start at 0.3.3 on 2025-11-05, so the GitHub list is not used for firstRelease. The highest stable release is 1.1.0, which matches npm latest. The npm dist-tag beta points to 1.0.0-beta.7, published 2026-06-25, which is older than 1.1.0, so no latestPrereleaseDate is recorded. The npm package is basecoat-css, as the installation page's CDN URLs name it; the npm package named basecoat is a different 2017 project and is not used. The homepage "Discord" button links to basecoatui.com/chat, which redirects to a Discord invite. npmWeeklyDownloads is the sum of the daily range 2026-10-18 to 2026-10-24, because the last-week endpoint answered with a stale window. The GitHub repository language field reads MDX; the README's own description of the package is recorded as language instead. The LICENSE copyright holder is the legal name Ronan Berder; the npm author and the GitHub owner are both hunvreus. The templating facts come from the README's list of Nunjucks and Jinja templates.
