notes: >
  The latest stable GitHub release is 1.0.0 (2018-09-09), which matches the npm latest version of materialize-css; the default branch is v1-dev, whose last commit is dated 2020-06-01 (the repository's pushed_at date reflects another branch). The project's own pages state no end: the homepage and getting-started page still present 1.0.0 as the current release, and the README has no end statement. The about page of the project (materializecss.com/about.html) names a team of students and no successor. The fork MaterializeWeb (materialize) says on its own about page that the original developers were inactive and that it continues the project; that statement is the fork's, and the original's age goes to the import's listing rule (latest release older than four years). The README carries a Gitter badge, not the homepage; the x account comes from the homepage's follow button. Material Design is the design language the framework follows, not software it is built on. The HTTP Archive technology "Materialize CSS" covers both this project and the fork, so no httpArchiveSites figure is recorded. The first release year comes from the oldest GitHub release (v0.62, 2014-11-04, a prerelease; the first stable release is v0.82, also 2014). Contributors counts contributor accounts from the API with per_page=1, read from the last page link.
