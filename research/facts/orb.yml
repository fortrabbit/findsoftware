notes: >
  Hosted-service record: criterion 2 waived. The SDK repository orbcorp/orb-node (Apache-2.0, last push 2026-07-15) and its npm package orb-billing are client libraries; their license, stars and downloads are kept out of the record per the hosted-service rule. The docs landing page names REST API and the SDKs; the SDKs cover "Python, Node, Ruby, Go" (docs.withorb.com landing page), recorded here as a coined sdkLanguages fact only: Python, Node.js, Ruby, Go. The security page says Orb "uses Amazon Web Services as its cloud infrastructure provider" and holds a SOC-2 Type II report, which is a compliance claim recorded here, not as a field; it names no data region, so regions is absent. Free trial and a free tier are stated on the pricing page but are coined fields (freeTier), so they are not recorded as facts. The pricing page is a feature table whose plan columns did not survive text extraction; the SAML or OIDC single sign-on line and the viewer, editor and admin roles line are recorded as the page words them, with the plan they belong to unresolved, so the reviewer should check the table in a browser. The Platform Terms (https://www.withorb.com/terms) are governed by the laws of the State of California; that is a governing-law clause, not a headquarters statement, so hqCountry is absent. The about page footer names "Orb, Inc."; no other legal name was found. The homepage LinkedIn link has no field. The Terms of Service name no contracting party, and the privacy policy gives no address.
