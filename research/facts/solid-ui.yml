notes: >
  The docs installation URL returns a page-not-found view, so the Vite, SolidStart and manual installation pages were read at docs/installation/manual. The homepage and introduction call the project a port of shadcn/ui and tremor-raw; that is recorded in the description and not as basedOn, because the project does not call itself a fork. The introduction says the project is not a component library and is not distributed through npm, yet the CLI solidui-cli is published on npm; the npm figures count that CLI, not component copies. The npm package named solid-ui belongs to another project (SolidOS) and is not used. The homepage's X link is the shadcn account, not the project's, so no x fact is recorded. Tailwind CSS is recorded in basedOn because the Vite installation page has the user install and configure it before running the CLI. The LICENSE file carries two copyright lines, shadcn 2023 and Stefan E-K 2023, both under MIT; the maintainer is the second, as the about page credits the port to Stefan E-K and Michael Essiet. currentMajor is the CLI package's major, 0, from the GitHub release solidui-cli@0.7.2; the component code has no separate version. The project's own about page names shadcn, tremor-raw, Kobalte, corvu, tabler and Lucide as credits.
