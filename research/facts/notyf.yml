notes: >
  Accepted: no end signal found. The repository is not archived, the npm package is not deprecated, and the README and homepage do not state an end. Latest stable release is 3.10.0 (npm, 2021-06-08; tag v3.10.0 at commit 2021-06-08); the GitHub release object v3.0.0 (2019-03-20) is older, and npm dist-tag next (3.0.0-beta.4) is a prerelease not recorded. The latest release date is more than four years before 2026-11-16, so the import moves this record to stub under AGENTS.md criterion 4 unless that rule changes; status is left accepted here. The README names Angular, React, Aurelia, Vue and Svelte as recipes in recipes/README.md; these are integration notes, not bindings, so no basedOn is recorded. The README says the package ships TypeScript typings and that the message content is not sanitized ("Notyf doesn't sanitize the content when rendering your message"), which is a constraint for prose. The GitHub language is JavaScript; the README states typings are available. The homepage link names the project's own site (carlosroso.com/notyf/) and its footer reads Carlos Roso; the homepage fetch is plain HTTPS and answers 200. Stars and npm figures are adoption data only; the npm range sums the seven daily counts from 2026-11-01 to 2026-11-07. The README feature list says the library is dependency-free and responsive, ships ES6, CommonJS, UMD and IIFE bundles, lets users create their own toast types, and renders custom HTML content inside toasts. The README's CDN sentence names jsDelivr as the host of the stylesheet and script.
