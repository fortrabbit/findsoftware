notes: >
  Highest stable GitHub release is v4.45.2 (2026-10-05), so currentMajor is 4. The license is stated as MIT in the LICENSE file and in the npm metadata; the GitHub API reports NOASSERTION, which is not recorded. The runtimeMin value is the npm engines minimum of @stencil/core (node >=16.0.0); the docs ask for a recent LTS version of Node.js instead, and no page gives a number. The docs list three output targets (dist, www, dist-custom-elements); www is the website output and is the one the static site generation page describes. The framework integration page lists Angular, React, Vue and Ember (community) wrappers emitted as output targets; the overview page says Stencil can be used with or without a framework. The newest prerelease is 5.0.0-beta.26 on the npm beta tag, published after the latest 4.x release; the GitHub release list holds no prerelease. The site header reads "An OutSystems Company", recorded as parent; the LICENSE names Drifty Co. as the copyright holder, recorded as maintainer. The starters marked community and the Ionic starters are not recorded. firstRelease is the year of the first npm publish.
