notes: >
  Make is a hosted service with no installable part, so the record has no repository or license. The site footer names Celonis, Inc. as the copyright holder; the legal entity in the terms could not be read because the terms, legal, imprint, about, security and pricing pages answered 403 to the research user agent and were not retried, so the terms entity is unread. hqCountry rests on the New York address of Celonis, Inc. in the privacy notice at https://www.make.com/privacy-notice, and the non-/en pages /about, /security, /terms-and-conditions, /privacy-notice and /compare answered 200. The pricing page lists Enterprise-only single sign-on through an OAuth2 or SAML2 identity provider and custom roles; free tier and prices are not recorded. The about page names Prague as a headquarters of the Make teams; it is not the maintainer address. The compare page make-vs-zapier names Zapier, which has no record. The homepage states SSO, role-based access and audit logs, and SOC 2 Type II and SOC 3 certification with GDPR compliance; the certifications are coined compliance facts and are kept here as text only. The developer hub at developers.make.com describes a Make API, Custom Apps, a White Label option, an MCP server, a CLI, event subscriptions and an SDK; the API and SDK are documented, which is the wiring a site would use, which meets the wiring rule for this record. The homepage names a library of over 3500 integrations; a count rots and is not recorded. The LinkedIn and YouTube links on the homepage have no field. The homepage's help center is recorded as docs. The homepage's Enterprise plans are named but their price and terms are unread.
