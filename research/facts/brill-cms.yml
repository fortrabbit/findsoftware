notes: >
  Stub: the homepage www.brill.software resolves in DNS but did not answer (connection timed out on two attempts, 2026-10-23), so no homepage is recorded and the Developers Guide that the README links could not be read. Settle it by reading the site once it answers, or the developer guide at its own address. The client README says the Node.js server is for development only; production serves the built client from the Java server. The client repository is recorded as the CSV names it. The server, github.com/brill-software/brill_server (Java, Spring Boot, Gradle; its README configures MySQL in the local example), is public under the same MIT and Enterprise statements and is not a separate record. The GitHub repository has no release or tag, so lastCommitDate is recorded. The license statements in the client LICENSE file are recorded one per entry.
