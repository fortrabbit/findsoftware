notes: >
  Release age: the latest stable release is 3.7.3 (npm, 2020-09-29); there are 67 git tags, none with a GitHub release object, and the repository was pushed 2024-06-07. Per the release rule the import judges listing by the release date, so the record is listed as a stub unless a later stable or prerelease appears. Status is accepted, as the CSV row says; no end signal (not archived, not deprecated on npm, no end statement in the README). Framework bindings: the README names official bridges for Angular (angularjs-dragula), Angular 2 (ng2-dragula) and React (react-dragula); the core is framework-agnostic, so basedOn stays empty and the bridges are separate packages. Runtime and runsAs: the README says "Browser support includes every sane browser and IE7+", which is a support statement, not a sentence on where the library runs, so runsAs is not recorded. Support: the README points to a Slack channel (dragula.slack.com); there is no field for it, so it is not recorded. Maintainer: the LICENSE copyright line names Nicolas Bevacqua; the npm package also lists leaverou as maintainer, which the LICENSE does not name, so it is left out. The npm figure is the dragula package the install docs name; stars and contributors belong to the repository. The homepage is the project's own demo site, linked from the README.
