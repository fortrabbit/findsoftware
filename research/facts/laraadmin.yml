  - https://laraadmin.com/docs/1.1 (404)
notes: >
  The latest GitHub release is 1.0.41 (2023-07-08) and the Packagist package dwij/laraadmin lists the same version as latest; the repository's default branch carries a 1.1.0 composer.json that the README calls a template ("LaraAdmin 1.1 is not a package anymore. Now it's a template."), and its documentation is marked not ready. Reviewer decision: the documented install path (laraadmin.com/docs) describes the 1.0 package on Laravel 5.2 and pins dwij/laraadmin:1.0.40, while the release is 1.0.41; the 1.1 template has no install page, so criterion 3 is met only for the packaged 1.0 line. The release composer.json requires illuminate/support 5.* and declares no PHP version, so runtimeMin stays unknown. The default branch was last pushed 2024-01-05, which is not an ended signal. Packagist monthly downloads are 44 per the package page, far below the 68832 total, and the total is the figure recorded. The README lists user management and workflows as under development, while the homepage names role permissions; both are recorded as the sources state. The docs page names Laravel 5.2 as the supported version. Contributors read from the API with anon=true. The maintainer has no legal form in the sources: the LICENSE names Dwij IT Solutions and the homepage calls it a company in Pune, India. The 1.0.41 composer.json description names CRUD Generation, Module Manager, Media, Menus and Backups, which the description field and the prose draw on.
