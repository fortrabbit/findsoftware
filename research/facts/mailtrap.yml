notes: >
  Hosted service: the id is the hosted email platform, and Mailtrap Local is a separate local tool recorded as a possible candidate (mailtrap-local). Mailtrap Local facts, all read 2026-11-03: repository https://github.com/mailtrap/mailtrap-local (organization-owned), MIT license, Go, a single self-contained binary with SQLite storage, installs through Homebrew, Snap, Nix, Docker, prebuilt binaries and source build, latest release v0.4.1 on 2026-09-07, first tag v0.1.0 in 2026, 113 stars, 6 contributors, 6599 Docker Hub pulls, an SMTP server, a web sandbox and a REST API, designed for development and testing only per https://docs.mailtrap.io/email-sandbox/local. Its README says "Not a Mailtrap Sandbox replacement." Local runs without the vendor's service; its Send to Cloud button passes captured mail to the hosted Email Sandbox. The hosted sandbox, API and email marketing product are not open source. The privacy notice names Railsware Products Studio LLC, incorporated in Delaware with a Pasadena, CA business address, as the service operator. The pricing page lists a Free plan and paid tiers; free tier is a coined kind and stays in notes, with no prices. SSO appears on the Enterprise plan row only. Compliance per the security page: SOC 2 Type II, ISO 27001:2022 and SOC 3; compliance is a coined kind and stays in notes. The Mailtrap SDK repository github.com/mailtrap/mailtrap-nodejs is a client library; its figures are left out per the hosted-service rule. The About page says Mailtrap was built at Railsware and bootstrapped since 2011; that year is not a release date. The trust center (https://trust.mailtrap.io/) answered 403 and is unread. No page states user roles, so userRoles is unknown. The homepage and docs offer migration from SendGrid, Mailgun, Mailchimp, Amazon SES and Postmark; only Mailgun and Amazon SES have records.
