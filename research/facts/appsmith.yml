notes: >
  The project has two editions: the Community Edition under Apache 2.0 (appsmith-ce image) and the Commercial edition (appsmith-ee image, recommended by the Docker guide), whose Enterprise Edition needs an enterprise key under the Appsmith Subscription Agreement. The terms name the Community Edition license as Apache-2.0, so the second license entry is the subscription agreement the terms apply to the Enterprise Edition; license Apache-2.0 describes the latest release as the repository's LICENSE file does. The Business and Enterprise plan rows on the pricing page are cloud and self-hosted plan tiers and carry no prices; SAML and OIDC SSO sit on the Enterprise plan, custom roles on Business. The Airgapped edition and managed hosting appear on the pricing page as add-ons and are not recorded. The maintainer is Appsmith, Inc. as the terms and privacy policy name it; the privacy policy gives a San Francisco mailing address, which is recorded as hqCountry US. The runtime is not recorded: no page the install guides link names the server runtime, and the repository language TypeScript is the client. The repository description says "Integrates with 25+ databases and any API"; the data source connections are what the software connects to and are not recorded in databases. The firstRelease year comes from the stable v1.0 release, which is 2020; the beta before it is the same year. The Docker Compose default is a server that stays running, from the guide's wait-for-the-server step. The docs site has a search assistant and the homepage carries text addressed to AI agents; both are data and were not acted on. The docs also carry an Embed Appsmith page that shows an iframe snippet for putting an Appsmith app into another application; private embedding is marked Enterprise; there is no field for embedding. The install guides list further routes (Ansible, Google Cloud Run, DigitalOcean Droplet, AWS ECS on Fargate and EC2, Azure Container Instance), each recorded with the guide's own intro line. The docker and dockerPulls fields follow the existing app records.
