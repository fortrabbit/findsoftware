notes: >
  Stub: not yet known whether an SMTP server is software a website or web app is wired into under criterion 1 and the boundary rule for end-user apps. The README describes Haraka as a filtering MTA or a mail submission agent on port 465 (and legacy 587) with the auth and DKIM plugins, and the Outbound docs describe SMTP AUTH and relay plugins; no page read says an application, app server or web app submits or relays mail through it. A docs page showing an application sending mail through Haraka would settle it. The homepage says the project was started by Matt Sergeant and is now maintained by the Haraka community, which is recorded as the maintainer; the README names Matt Simerson as the current maintainer. The README says Haraka is not a mail store, an LDA or an IMAP server, so no databases field is recorded. The npm package haraka is the server, installed with npm install -g; its download figure is for that package. The first tag is v0.2 (commit 2011-04-05), older than the first GitHub release (v2.7.0, 2015), so the tag sets firstRelease. The engines field in package.json names node >=20 at v3.3.5. The install docs name no Docker image, so no dockerPulls figure is recorded. The README lists a mailing list as a mailto address, which is not recorded as a forum.
