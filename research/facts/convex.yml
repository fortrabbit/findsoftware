notes: >
  No currentMajor: the stable releases are date-tagged (precompiled-YYYY-MM-DD-hash), so the line is a calendar version; the npm convex package is the client and CLI the self-hosting guide uses and is on major 1, recorded here only. latestReleaseDate is the newest non-prerelease tag; the newest prerelease, the same build series, is 2026-11-03. The candidates row names get-convex/convex-backend, which redirects to convex/convex-backend; the canonical name is recorded. The FSL-1.1-Apache-2.0 license is the LICENSE file (copyright Convex, Inc., 2026); the GitHub API reports NOASSERTION. Competing Use is defined in the license as making the software available in a commercial product or service that substitutes for the software, substitutes for another Convex product, or offers substantially similar functionality; the Apache 2.0 future license applies after the FSL period. The self-hosted README says self-hosted builds contain an anonymous beacon that can be disabled with a flag on the backend binary; the flag is not recorded as a field. The README says the test suites are not part of the open-source offering. The hosted plans (free, Starter, Professional, Business, Enterprise) are plan tiers with prices, so no paidEdition is recorded and no prices are recorded. The homepage has no Discord link in its markup, so Discord is taken from the repository README. Hosted SDK and client packages stay out of the record except the npm convex figure above. The plans page places SAML/SSO in the Business and Enterprise plan column. The README says Convex provides a database, a place to write server functions, and client libraries. The README says developers perform business logic by writing pure TypeScript. Not record fields: linkedin https://www.linkedin.com/company/convex-dev (https://www.convex.dev/).
