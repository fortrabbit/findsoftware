notes: >
  Doubt about the homepage: the project's own site cannot be read, so the homepage is unknown, and a working project site or a new one named by the project would settle it. The CSV row lists quire.io, which is the Quire task manager and is named in the README's "Who Uses" list as a user of Stream, not the project's site. The address rikulo.org, where the project's own site was, now answers 200 with unrelated content (a gambling site's text, with the title "Home - Rikulo"), so no homepage is recorded and the record is a stub under AGENTS.md; the stub should be revisited when the project names a new site or the rikulo.org domain returns the project. The repository was pushed on 2026-10-06 and the pub.dev package has a 5.x line (5.0.0 on 2026-06-01, 5.1.0 on 2026-08-24, and a 5.1.1 entry in CHANGELOG marked not released yet). The highest stable GitHub release is v2.3.0 (2020-05-07), and the registry major is higher, so currentMajor and latestReleaseDate come from pub.dev as the rule for a higher registry major says. The first pub.dev upload is 0.5.0 on 2013-01-18, which is the firstRelease year; the GitHub tag history starts at 2.0.1. The README links Stream's own API reference on pub.dev; no page states that the server runs as always-on or as per-request, so runsAs is left unknown. The README says the rspc executable compiles RSP templates to Dart files, recorded as buildCommand; it writes one Dart file per template next to it, so no outputDir is recorded. The README also lists file-based static resources, request routing, filtering, WebSocket and the MVC design pattern among the features, and says the examples cover static files, RSP templating, MVC and Ajax. The maintainer is recorded as the AUTHORS file states it, "Tom Yeh/Potix"; no legal notice gives a legal name or a headquarters country.
