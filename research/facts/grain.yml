notes: >
  The CSV row links sysgears.com/grain, which redirects to sysgears.com/work/grain-framework/; that page is recorded as homepage. The maintainer is the copyright holder in the repository NOTICE file; the SysGears site lists offices in Cyprus, Ukraine and Poland and its terms name a Cyprus company, which is not the NOTICE holder, so hqCountry is unknown. The x link is the Twitter account the README names. The GitHub API reports the license as NOASSERTION, while the LICENSE file and README state Apache 2.0; the README also says subcomponents carry separate copyright notices. The highest stable GitHub release is v0.6.6 (2015-08-27), so currentMajor is 0. The earliest release is v0.5.0 (2013-12-24). The SysGears page and the README say commercial support is offered, which is a service, not a paid edition, so paidEdition is unknown. The deploy command is a shell command configured in the deployment section of the General Docs, not a built-in destination.
