notes: >
  Status ruling for a reviewer: the newest release is 1.2.0 (2020-06-07), both on GitHub and npm, and the repository was last pushed 2024-08-10. The import moves a record with no release in four years to stub, so this record will be hidden on the next import. The repository is not archived and the npm package is not deprecated, so no end signal applies. The homepage is https; http://bookshelfjs.org redirects to it. The README says Bookshelf is "built on the Knex SQL query builder"; no Knex record exists, so basedOn is not recorded. The installation section gives the npm command "npm install bookshelf" in a code block; the one sentence recorded as installMethod names npm for the database drivers. The engines field of the latest npm version is node ">=6", recorded as runtimeMin. The npm figure is the sum of the seven daily counts from 2026-10-26 to 2026-11-01; the value carries that period. The license file states MIT with the copyright line for Tim Griesser, who is also the npm author. Stars and contributors are the repository's.
  The README says initialization passes a Knex client instance, which holds the connection pool.
