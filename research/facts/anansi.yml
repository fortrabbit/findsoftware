notes: >
  Status is accepted. The CSV row is "boundary" because no GitHub release or tag exists, but the crate ananc is published on crates.io with 22 versions, the newest 0.14.2 created 2023-03-19, so the registry gives the release date and lastCommitDate does not apply. The repository's last commit is 2023-04-05 and anansi-cli/Cargo.toml names 0.14.3, which is not on crates.io. The four-year rule moves the record to stub after 2027-03-19 unless a new release appears; the reviewer decides whether the stale project stays listed now. The install page names the crate ananc. The contributors endpoint returns an empty list while the commit history carries one author login, so contributors is left out. crateDownloads is the all-time total. The repository names no runtime requirements and no deployment page, so runsAs is absent. The anansi crate is the framework library and ananc the command-line tool; both published 0.14.2 on 2023-03-19 and the figures here are for ananc, the package the install page names.
