notes: >
  The project has no GitHub release object; its tags run from v0.1.0 (commit dated 2011-10-08) to v0.7.0 (commit dated 2023-11-27), and the npm package passport matches the latest stable version 0.7.0 (published 2023-11-27), so the registry gives currentMajor 0 and latestReleaseDate. The homepage shows "500+ Strategies Now!" and the features page "500+ authentication strategies", while the README says "over 480"; both are recorded as stated, the homepage and features page being the project's own site, and the README count is older. The strategy directory link on the homepage (/packages/) answers 404, so pluginDirectory is not recorded. The README and concepts page say Passport is middleware for Node.js; the README describes it as "Express-compatible" and the homepage as usable in "any Express-based web application", which is compatibility, not a basedOn statement, so basedOn is left out. The engines field in package.json at v0.7.0 says "node": ">= 0.4.0"; that is a historical lower bound that the project does not state as a supported minimum, so runtimeMin is left out and a reviewer may record it. The README's sponsors section names Auth0, WorkOS, Descope, FusionAuth and Stytch; they are sponsors, not facts about the project. The docs index names OAuth 2.0 and API authentication concept pages; the OAuth strategies are plugins, so the sso value rests on the features page only. The homepage links the project's X and Facebook accounts, which are recorded without a quote as link facts. The LICENSE copyright line is "Copyright (c) 2011-2021 Jared Hanson", the README copyright line gives the same name. The npm figure counts passport, the package the README installs. The README says Passport does not mount routes or assume any particular database schema, and that its strategies are plugins; it links passport-local, passport-facebook and other strategies as separate repositories. The concepts page names Middleware, Strategies and Sessions as its three fundamental concepts. The README says strategies can range from verifying username and password credentials, to delegated authentication using OAuth, or federated authentication using OpenID.
