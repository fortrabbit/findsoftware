notes: >
  The CSV homepage was http://slatejs.org; that address redirects to https://www.slatejs.org/, which is recorded as the homepage. Slate is a monorepo: the stars and contributors belong to the monorepo, the npm figure and currentMajor come from the slate core package the install guide names, and latestReleaseDate is that package's release. The newest stable release is slate-react 0.147.6 dated 2026-11-11, a separate package for React bindings; it is not the record's date. The basedOn react statement is the README's own words, "built on top of React"; the install guide imports createEditor from slate and the React components from slate-react, which the React bindings package provides. Slate is "currently in beta" per the README, with APIs that may change; that is a reader constraint for prose, not a status. The docs and the README use http links for the documentation and the demo; the https form was checked and answers. The npm package slate has a 0.0.1 upload dated 2012 that predates this repository (created 2016); it is another project's history and is not used for firstRelease, which is 2016 from the 0.1.0 upload (2016-07-11). The Slack invitation in the README is the project's own chat, recorded in notes because the record has no chat field. The resources page names slate-angular, slate-vue3, slate-yjs and Plate as third-party bindings and plugins; they are not records here. The README says all of Slate's logic is implemented with a series of plugins, that Slate is contributor-driven and not backed by any huge company, and that it is built on top of React as a pluggable contenteditable implementation. The FAQ says Slate's core prescribes no schema, so pasted content is parsed as plain text unless the application overrides the insert_data command, and that Slate does not work in Internet Explorer. The installing guide says Slate's peer dependencies are react and react-dom, and that a pre-bundled dist/slate.js file is available. The README Why section names Draft.js, Prosemirror and Quill as libraries the author tried before creating Slate; that is history, not an alternative statement, so no alternativeTo is recorded. The Ruby slate record is a different project with the same name and keeps its own id. The runtime is left out: the README names React and the browser only through the React statement, and no sentence states where the core runs.
