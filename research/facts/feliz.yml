notes: >
  Feliz publishes no GitHub release or tag; the NuGet registry is the release source, so currentMajor and latestReleaseDate come from the NuGet package 3.3.3, and firstRelease is the NuGet upload of 0.1.0 on 2019-07-21 (the repository was created the day before). The getting-started page shows Feliz 2.9.0 in its install snippets while the Overview and Upgrade pages cover v3, so the install snippet version is not recorded. The NuGet catalog lists Zaid Ajaj and FreymaurerK as authors; the GitHub owner is the fable-hub organization, which the project's own pages do not name as maintainer. The Getting Started page lists the .NET 10 SDK and Node.js as prerequisites; a minimum Node version is not stated. The Getting Started page names the .NET 10 SDK as a prerequisite; no page says Feliz runs on a .NET server (the output is JavaScript), so neither runtime nor runtimeMin is recorded. The page lists the .NET SDK and Node.js with npm as prerequisites. The README describes Html and CSS helpers, hooks (including React.useElmish through a separate package) and a Femto-compatible install; the template scaffolds Vite, Vitest and Tailwind CSS. Feliz runs in the browser after Fable compiles it to JavaScript, but no page says so in those words, so runsAs is not recorded. The docs site and the GitHub repository both name the project as React-based. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header (74). The nuget.org ecosyste.ms entry reports zero dependent repositories, which is recorded as returned.
