notes: >
  The NOTICE file is the only copyright line in the repository: LICENSE is the unmodified Apache template with no copyright line, so the maintainer comes from NOTICE. The README states the license as "SwaggerUI is licensed under Apache 2.0 license", the same license as the LICENSE file, so it is one license entry. The npm figure is for swagger-ui, the first module the install page names; swagger-ui-dist had 17956972 downloads in the same week (2026-11-01 to 2026-11-07), and it is the module the install page calls meant for server-side projects. swagger-ui-react is the same project packaged as a React component, a binding that stays in these notes and is not a separate record. The README compatibility table lists OpenAPI 2.0 through 3.2 and the JSON Schema 2020-12 dialect; spec compliance is a coined kind and stays here. The README's older versions are the 2.x branch and tags from 2011 (v1.0, dated by its commit 2011-10-11); firstRelease is the oldest tag. The README says installs run anonymized analytics through Scarf, which can be turned off with SCARF_ANALYTICS=false. The Docker image is served from docker.swagger.io, not Docker Hub, so no dockerPulls figure is recorded. The swagger.io footer also links a LinkedIn page for SmartBear, a coined field, kept here. The commercial Swagger products on swagger.io (Swagger Enterprise, SwaggerHub) are separate products, not an edition of this project, so no paidEdition is recorded. Stars and contributors belong to the single package repository. The README lists a Packagist badge for swagger-api/swagger-ui, the same repository published as a Composer package, so composer is an install route from the registry API; its total figure is recorded. The Docker page says the image starts nginx on a port, which is the always-on statement.
