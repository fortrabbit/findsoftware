notes: >
  The homepage pouchdb.com answers with a meta refresh to pouchdb.apache.org, so the final URL is the homepage; the Apache site says the project "is currently undergoing Incubation at the Apache Software Foundation" and the NOTICE names "The Apache Software Foundation" as copyright holder. Under the foundation-hosting rule the maintainer is the project as it names itself; a reviewer may decide the foundation belongs there instead. The repository is the Apache mirror of the project, and its stars and contributors belong to that repository. The GitHub releases stop at 9.0.0 (2024-06-21) while the repository was pushed in 2026; the npm latest is the same 9.0.0. Tags v0.0.10 and v0.0.16 are older git tags whose commit dates the API could not return, so firstRelease rests on the npm upload 0.0.2 (2012-10-25). The README says PouchDB is "inspired by Apache CouchDB" and the homepage says the data syncs "with CouchDB and compatible servers": both are statements about a relationship with CouchDB, not basedOn or alternativeTo. The homepage says "Works in Firefox, Chrome, Opera, Safari, IE and Node.js", so runtime node is recorded with no runsAs. The homepage "Discuss" list links GitHub Discussions of the repository, recorded as forum; it also links a Slack workspace of the CouchDB project, StackOverflow and a Google Groups mailing list, which are general community channels and not recorded. The about page says PouchDB "is a JavaScript implementation of CouchDB" that emulates its API and syncs with CouchDB, Couchbase and Cloudant through the CouchDB sync protocol; that is a relationship statement, not a basedOn or alternativeTo fact. The adapters page says PouchDB "is not a self-contained database; it is a CouchDB-style abstraction layer over other databases", with IndexedDB by default in the browser and LevelDB in Node.js; none of these is a databases value in the dictionary. The npm install route is the sentence on the homepage that also names the script tag; it is the only npm statement the homepage and getting-started page make.
