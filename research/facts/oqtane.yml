notes: >
  The CSV lists http://www.oqtane.org; the same site answers over https, so the https address is recorded. The homepage footer names Oqtane Labs Inc with a Florida address, and the LICENSE copyright line names the .NET Foundation (2018-2026); the footer is recorded as the maintainer and the license holder is not reconciled. The FAQ says Oqtane is not a successor to DotNetNuke, so successorOf is absent; alternativeTo DotNetNuke comes from the project's own comparison post of January 6, 2020. No basedOn is recorded: the pages name Blazor as the technology the framework is for, not as a parent. The first public release is the May 9, 2019 announcement, and the repository was created on 2019-05-05. The highest stable GitHub release is v10.2.6 (2026-09-14), which matches NuGet. The homepage renderingModes quote names Blazor render modes, recorded as server and spa; no static mode is stated. runsAs is absent: the IIS guide describes hosting setup without stating whether the process runs always on or per request. The docs site at docs.oqtane.org says it was last generated for 10.00.04 on 2026-02-10. The homepage names OIDC and OAuth2 integrations only in an image caption that is not page text, so sso is absent; the homepage X link is an icon-only href, recorded with the href as its quote. The homepage says the framework is extended with custom modules and themes, and offers shared and isolated tenancy models. The Windows IIS installation post states that Blazor supports one app pool per app and that Oqtane does not support IIS sub-applications. The contributors count is 60 from the contributors endpoint with per_page=1 (the rel last page number).
