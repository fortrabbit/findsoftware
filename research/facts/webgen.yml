notes: >
  The homepage answers over https (it redirects from http) and states the software as a static website generator; its news and version line ("Latest webgen version 1.7.2 released on 2021-03-07") is older than the 1.7.3 release on GitHub and RubyGems, so no version is taken from it. The install docs name the gem webgen, which is the registry package recorded. The GitHub releases list holds one release (REL_1_3_0, 2014-08-15); the stable line continues in tags to REL_1_7_3 (2024-01-01), which RubyGems also lists as the latest version, so currentMajor and latestReleaseDate follow REL_1_7_3. firstRelease is the REL_0_5_0 tag commit date (2008-07-09), the oldest tag in the repository. The installation page is an older page (it names Ubuntu 14.10 and Ruby 2.0.0 as tested), so runtimeMin records what it states as the minimum and is not a current requirement. The license is stated two ways: COPYING gives GPL version 3 or later, and README says GPLv3; only the COPYING entry is recorded and the README wording is noted here. The RubyGems license field reads GPL and the GitHub API reports NOASSERTION, and neither is recorded. The maintainer is recorded from the legal notice on gettalong.org, which names Thomas Leitner as an individual; no legal form and no postal address are recorded. The main documentation is a separate page (documentation), with the Getting Started Guide and manual linked from it.
