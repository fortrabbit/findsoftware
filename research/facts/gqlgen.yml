notes: >
  The LICENSE copyright line reads "Copyright (c) 2025 gqlgen authors", which names neither a person nor a company, so the maintainer is recorded as the 99designs organization that owns the repository (profile name 99designs, location Melbourne, Australia); no page of the project gives a legal name or a headquarters country, so hqCountry is left out. The feature-comparison page at gqlgen.com compares gqlgen with gophers (graph-gophers), graphql-go and thunder (samsarahq); the README invites a comparison with other Go GraphQL implementations, and the page links graphql-go/graphql, which is the graphql-go record, so alternativeTo is graphql-go; graph-gophers/graphql-go has no record, and the thunder record is a different project. The getting-started tutorial says init creates the project layout and the config file, and that the generate command compares the schema file with the models and binds to them where it can. The README says gqlgen is based on a schema-first approach and prioritizes type safety; the FAQ says field resolvers run concurrently in separate goroutines, with worker_limit on the configuration page. These are described in the prose and not recorded as fields. The current release line is 0.17 (v0.17.98, released 2026-10-22), the major is 0 because the version is pre-1.0, and the minor line stays in these notes. The README's Quick start names the tool dependency route; the getting-started page gives go get -tool github.com/99designs/gqlgen in a code block, and the sentence quoted under installMethod names the route. The module has no npm or other download figure, so none is recorded. firstRelease is 0.2.0 (2018-06-21), the oldest release and tag of the repository (created 2018-02-11). The dependent counts are ecosyste.ms for the proxy.golang.org module github.com/99designs/gqlgen. The README and homepage link no forum, chat or social account, so none is recorded. Stars and contributors belong to the repository.
