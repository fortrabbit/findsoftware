notes: >
  Stub: the README lists http://www.cactusformac.com as the "Cactus app site" among its examples, and the GitHub homepage field is empty. On 2026-10-23 neither cactusformac.com nor www.cactusformac.com resolved (dig returns nothing, also through 1.1.1.1), so no homepage is recorded, as with bowman. The dead host is an example site of the README, not a site the project names as its own, so a reviewer should decide whether stub is right; the import also moves a record with no release in four years to stub. The repository koenbok/Cactus redirects to eudicots/Cactus, which is recorded. The repository has no GitHub release; the highest tag is v3.3.3 and the PyPI package Cactus has the same version (2016-02-21), so currentMajor and latestReleaseDate come from PyPI. firstRelease is the earliest PyPI upload (2.2.1, 2013-11-26). The README's Python note says Cactus is tested on Python 2.6, 2.7, 3.4 and 3.5, which is a tested list and not a minimum. The README describes deployment to S3; the 3.0 news also names support for multiple deployment backends (Google Sites), which no page read here describes further. The README says plugins enable blogging, spriting and versioning, and that Cactus can set up nameservers for an S3 website (Amazon only).
