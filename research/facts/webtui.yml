notes: >
  The package the install docs name is @webtui/css; no npm package named webtui exists, so the CSV's npm figure (3.7k per week) was not reproduced: the weekly figure here is the sum for 2026-10-19 to 2026-10-25 of @webtui/css. The repository language is MDX because the docs site lives in the same repository; the package ships CSS, so language is CSS. The CSV row lists the Terminal style as a category; no page of the project gives it a field, so it is left out. The homepage and docs are under the webtui.ironclad.sh domain; the project names no company, and the maintainer is the copyright holder in the MIT LICENSE, with npm maintainer ironcladdev. The official plugins are themes and tools in the docs, not community records, and the community plugin list reads "None yet". The HTTP Archive list has no WebTUI entry.
