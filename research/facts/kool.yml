notes: >
  Kool has two products: the MIT-licensed CLI in kool-dev/kool and Kool Cloud on kool.dev, a managed cloud ("Quick start on our infrastructure") plus "Anywhere PaaS (BYOC)", which deploys to DigitalOcean, Hetzner, AWS or any VPS the user brings. The cloud is recorded as hostedOffering; hosting plans are no paidEdition, so none is recorded. Windows is supported only through WSL, per the installation page ("You must run kool on Windows via WSL"); macOS and Linux use the install script. The LICENSE copyright names Kool Dev Sistemas de Informacao LTDA, the legal form LTDA is recorded as company; the terms and privacy pages say only "Kool Dev" and the about page says "Based in Brazil". Highest stable GitHub release is 3.7.0 (2026-10-09). firstRelease is the oldest GitHub release 1.0.0 (2020-07-06), the same day as the repository's creation. The CSV's 727 stars became 726 on the API read of 2026-10-28. The Community Slack (kool.dev/slack) has no field, so it is left out. The Docker Compose V2 requirement is documented but not recorded as runtimeMin, since it is a requirement of Docker, not a version of the CLI runtime.
