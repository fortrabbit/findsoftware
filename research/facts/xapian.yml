notes: >
  The GitHub repository is described as "Mirror of the Xapian repository"; the project's own source host was not readable, so the repository fact names the mirror. GitHub detects no license (null) for the repository; the license comes from the project's homepage ("GPL v2+") and xapian-core/COPYING, which is the GPL version 2 text, one license in two wordings. The latest stable release is 2.1.0 (released 2026-08-13 per the homepage); the 1.4 branch is the previous stable line, and the download page says the 1.2 branch no longer gets support. The GitHub repository has no release objects, only tags; the highest stable tag is v2.1.0. The history page dates the first official release as 0.5.0 without a date; the year 2002 is the commit date of the v0.5.0 tag. The project says the library is used through bindings for Perl, Python, PHP, Java, Tcl, C#, Ruby, Lua, Erlang, Node.js and R; these are not recorded as separate fields. The project's Omega application (in the same repository) is built on the library and is not a separate record here. Commercial support is offered by a listed company, Oligarchy Ltd, which is not the project and is not recorded. The project's maintainer is named only as "The Xapian Project"; no legal name or country was found.
