notes: >
  The docs homepage says "Glider.js is not truly a carousel" and "not a drop-in replacement for carousels" in its FAQ; the categories value follows the project's own "carousel alternative" wording. The docs homepage describes it as "a fast, lightweight, responsive, dependency-free scrollable list with customizable paging controls". The install route is named only by the README heading "Install using package managers NPM / YARN" and by code blocks, and the docs say "Include Glider.js in your document before the </body> tag" without naming a route, so no installMethod is recorded; the CDN links in the README appear only in code blocks. No runsAs is recorded: "Glider.js should run on all modern browsers" in the docs FAQ is a browser support statement, not a statement of where it runs; no runtime is recorded because the project names no runtime. The repository's LICENSE.txt carries no copyright line; the maintainer comes from the README license section, which states "Copyright (c) 2018 Nick Piscitelli". The GitHub release v1.7.10 is dated 2026-04-16 and the npm package version 1.7.10 is dated 2026-05-06; latestReleaseDate takes the newer registry date. The homepage names the template designer HTML5 UP, which is no maintainer. The homepage Github Pages address is the one the README names for demos and documentation. npmWeeklyDownloads is the daily sum from the api.npmjs.org range endpoint for 2026-11-01 to 2026-11-07.
