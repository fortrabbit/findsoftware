notes: >
  The homepage has no pricing page of its own: the Pricing item is an anchor on the homepage, and seekstorm.com/pricing.html and /pricing answer 404, so pricingPage is not recorded. The hosted offer is SeekStorm Cloud (the homepage calls it managed cloud and "Search-as-a-Service"); its plans and prices are not recorded. The license is stated once: GitHub detects Apache-2.0, the README says Apache License 2.0, and the homepage says Permissive open-source. The maintainer is the legal name in the terms of service, last modified 2020-06-20. The about page names founding in 2020, which is not the first release; firstRelease is the oldest GitHub release (v0.1.8, 2024-03-17), which matches the crates.io creation date. The latest stable release is v3.4.5 (2026-10-27), not a prerelease. The crate manifests at v3.4.5 declare edition 2024 and no rust-version, so no runtimeMin is recorded. The homepage links a LinkedIn company page; no field exists for it. The SeekStorm client SDK repositories (Python, TypeScript, Rust, C#, Java, Go) are client code and are not recorded. The documentation page is a JavaScript shell; the docs fact rests on its title, and the body is unread. The README calls the software a library embedded in an application as well as a server; the library needs no separate process, and the MCP server runs as a child process over stdio, so only the server is recorded as always-on. The project's homepage says it is "From the author of" SymSpell, PruningRadixTrie and WordSegmentationTM; those are no basedOn statement.
