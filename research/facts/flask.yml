notes: >
  Endoflife.date has no Flask entry, so endoflifeId is not recorded. The PyPI metadata gives requires_python >=3.9 and the docs repeat it. The GitHub release tag 3.1.3 and the PyPI version match. The pypistats figure is a rolling last-week count as of the request date. The Pallets organisation page is the maintainer statement; the Pallets page also lists core libraries, which are not recorded here. The homepage quote is from the docs landing page and is copied verbatim from the page text.
