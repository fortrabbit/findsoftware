notes: >
  The project's homepage https://code52.org/pretzel/ fails TLS verification (the certificate names another host). The plain http address http://code52.org/pretzel/ answers 200 and its page says "Pretzel is a single exe. Download from GitHub or from Chocolatey", but AGENTS.md says a site that answers only over plain http is not linked, so no homepage is recorded. The install steps are on the repository wiki. The README and the homepage name the same project; the homepage is read only over http. The README states the project was archived and that it follows Jekyll conventions; The wiki page "Jekyll differences" says "based on Jekyll", which is recorded as basedOn. The README names Wyam, Statiq.Web, Jekyll on Windows and other generators as alternatives to use; no alternativeTo or successorOf is recorded. The wiki says Windows is the main platform: the README targets "Windows users". The maintainer is "Code 52", the GitHub organisation name that the project's plain http homepage calls "a code 52 project". The organisation has no legal name on the GitHub profile. The GitHub repository is archived, and the README gives the reason. The first release year comes from the oldest GitHub release, v0.2.0 dated 2015-01-25. The lowercase name "pretzel" is the project's own spelling in its README title.
