notes: >
  The repository rspec/rspec is the RSpec monorepo, created in 2024; the gem named by the install section, rspec, is the umbrella gem for rspec-core, rspec-expectations and rspec-mocks (rubygems 3.13.2 latest). Its stars (126) and contributors (366) belong to the monorepo. The earlier repository rspec/rspec-core is archived with a README saying "This is the old rspec core repository, please see the monorepo rspec/rspec for new issues and releases"; it had 1226 stars when read, and that is a move, not an end, so it is not recorded. The monorepo has no GitHub release objects; its tags name each gem, and the rspec-metagem tag v3.13.0 gives currentMajor 3. The 4.0.0.beta1 prerelease of 2026-02-18 is older than the newest stable gems, so no latestPrereleaseDate is recorded. latestReleaseDate is the 3.13.7 upload of rspec-core on 2026-11-06, newer than the rspec umbrella gem (3.13.2, 2025-10-21); runtimeMin is the rspec-core gemspec at that tag, which is what the registry reports for the release. firstRelease is the oldest RubyGems upload of the rspec gem (0.0.10, 2009-07-25), older than the monorepo's own tags, which date from 2024 (for example rspec-core-v3.13.2, 2024-10-18). The LICENSE copyright lines name several holders, the last one "The RSpec Development Team"; maintainer follows the line that names a team. The rspec-rails gem is a separate Rails testing library and is not recorded here. The About page gives a history from 2005 and a list of project leads; no legal entity is named. The help page also names an IRC channel on freenode, which has no URL and is not recorded. The README lists rspec-core, rspec-expectations, rspec-mocks and rspec-support; rspec-core provides the structure for writing executable examples, and the docs page says the parts can be used independently with tools like Cucumber or Minitest, which is compatibility and no alternativeTo. The homepage link to docs is the rspec.info documentation tree, and the docs page lists the four parts of RSpec.
