notes: >
  GitHub reports the license as NOASSERTION; the LICENSE.md file is BSD-3-Clause with copyright lines for "Project contributors" (2011-2022), "Sideway Inc" (2011-2020), Walmart and Yahoo, and the npm package declares BSD-3-Clause. The maintainer is recorded as the "hapi.js team" from the copyright line on hapi.dev, because the Sideway Inc line in LICENSE.md ends in 2020. The tutorial states it is "compatible with hapi v17 and newer", a compatibility note, not an end signal. The support page says "Free support is always available on GitHub" and names a Slack channel alongside Discord; the Slack invite is not recorded as a field. The homepage nav includes a Shop; no edition or paid product is named on the pages read, so paidEditions stays unknown. The npm engines field declares ">=14.15.0", recorded as the major 14.
  The tutorial creates a server with a port and host option and starts it. The support page says free support is available on GitHub and names a Discord server and a Slack channel.
