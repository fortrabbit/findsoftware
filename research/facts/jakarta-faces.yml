notes: >
  The homepage eclipse-ee4j.github.io/mojarra is the project's own site (GitHub Pages of the repository). Its text still shows Jakarta Faces 2.3 documentation, so the homepage is cited only for the description line and the name of the implementation. Mojarra implements the Jakarta Faces specification and is not built on another project, so basedOn is not recorded. The README and the pom.xml name a Maven artifact org.glassfish:jakarta.faces; no download figure is recorded because Maven publishes none. The oldest Maven Central upload of the implementation is javax.faces:jsf-impl 1.2_05 from 2007 (its pom: "Sun's Implementation of the JSF 1.2 Specification"), older than the GitHub tag 2.3.3.102 dated 2018-06-07, so firstRelease follows Maven Central. The record describes Mojarra, the implementation; name, repository and Maven artifact all belong to it, and the Jakarta Faces specification is a separate document. The LICENSE file names EPL 2.0 only, and the pom names EPL 2.0 with GPL2 w/ CPE as the secondary license; each statement is recorded as the project words it. The README header carries the same secondary license as an SPDX line inside an HTML comment, which the quote checker cannot read, so it is not recorded separately. hqCountry comes from the foundation contact page. The README does not state a rendering mode or a runtime for the servlet container, so renderingModes and runsAs are not recorded.
