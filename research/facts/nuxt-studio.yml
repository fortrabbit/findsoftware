notes: >
  Studio was offered first as a hosted platform; the introduction says it "has evolved into an open-source Nuxt module" and compares the module with "the previous hosted platform". The project does not say the hosted platform has ended, so the record lists the module only, with no status change. The README says Studio was originally offered as a standalone premium platform; firstRelease is the first stable release of the module (v1.0.0), since npm holds only alpha and beta builds before it. basedOn lists Nuxt only, because the project calls itself a Nuxt module; the pages say it edits Nuxt Content websites and "allows content edition of Nuxt Content websites only", which is a scope and not a parent, so nuxt-content is not recorded as basedOn. The X link on the homepage is the nuxtstudio account. The introduction says the module "requires a server-side route for authentication" and that static generation remains supported; the rendering fact quotes the server requirement. Authentication is GitHub, GitLab or Google OAuth, the Nuxt Studio SSO server, or a custom flow the README lists as "password, SSO, LDAP"; the sso fact records only the SSO server provider the auth page documents. The AI features call the Vercel AI Gateway, a third-party service, and the record does not treat it as a dependency of the software. The homepage calls the module free forever under MIT; no prices appear on the pages read.
