notes: >
  Nchan has no GitHub releases, only tags, so latestReleaseDate comes from the project's own changelog sentence on nchan.io; the newest tag v1.3.8 has a commit date of 2026-02-15 (UTC), one day after the page's date, and the reviewer decides which to keep. currentMajor 1 is the highest stable tag. firstRelease is 2009 from the oldest tag (0.68, commit 2009-11-06), and the homepage says the first iteration was written in 2009-2010 as the Nginx HTTP Push Module, the predecessor the record does not link. The license file is named LICENCE, and GitHub reports NOASSERTION for it; the license statement is the file's own sentence. The npm package named "nchan" on the homepage is the browser client NchanSubscriber.js, not the server, so no npmName is recorded. The nchan.io homepage names Redis as an optional storage backend (nchan_use_redis), which is a dependency and not a database of the software, so databases is absent. Acceptance: apps publish by an HTTP POST to a publisher location, and clients subscribe over WebSocket, EventSource or long-polling, which is the wiring a site uses. Coined or unrecorded kinds: the subscriber protocols (WebSocket, EventSource, long-polling, interval polling, chunked transfer, multipart/mixed), channel groups and limits, and the NchanSubscriber.js browser client. The installMethod routes come from the install section of the homepage; the Heroku buildpack named there is a third-party repository and is not recorded.
