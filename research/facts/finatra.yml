notes: >
  Versions are calendar-style (finatra-24.5.0, finatra-22.12.0), so no major is recorded. The newest tag finatra-24.5.0 has no GitHub release object and its CHANGELOG entry is "No Changes"; Maven Central's finatra-http-server_2.12 metadata tops out at 24.2.0, which is the version the docs install. latestReleaseDate is the upload date of 24.2.0 on Maven Central, the newest version published there; the tag finatra-24.5.0 (commit 2024-05-06) has no release object or Maven artifact and is not used. firstRelease is the tag finatra-0.0.1 (2012-07-12). The README states the project "is being actively developed and maintained" and the default branch is develop, last pushed 2025-08-18. The README states the copyright holder as Twitter, Inc. and the website footer repeats it. The Gitter chat named in the README has no field.
