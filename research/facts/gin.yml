notes: >
  The homepage answers 200 over https. The docs say "Gin requires Go version 1.25 or above"; the repository go.mod names go 1.26.0, a minimum the docs do not state, so the docs figure is recorded. The oldest GitHub release object is v1.0rc1 (2015-05-22), an rc by name; firstRelease takes the oldest stable one, v1.1 (2016-12-03), and the v1.0 tag is from 2016-10-12. The deployment page lists hosted platforms (Railway, Seenode, Koyeb, Qovery, Render, Google App Engine) that deploy Gin projects; these are third-party platforms named by the docs and are not recorded as hostedOffering. The deployment page also says Gin projects "can also be deployed in a self-hosted manner". The homepage describes Gin as "The fastest full-featured web framework for Go" in its tagline; the record does not repeat the claim. The homepage links to GitHub and the examples repository only; no Discord, X or newsletter link appears. The copyright holder named in the LICENSE is an individual, Manuel Martínez-Almeida, with the copyright range 2014-present; no page states a company or a country, so hqCountry is left out. The docs name Go templates through the html/template package; recorded as templating. Go modules have no download figure in the registries this dataset reads, so no registry figure is recorded.
