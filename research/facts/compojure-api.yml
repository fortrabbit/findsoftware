notes: >
  The GitHub homepage field points to metosin.github.io/compojure-api/doc/, which is generated API reference only, so no homepage is recorded. The README's first line reads "If you're starting a new project, why not try out reitit?"; it does not call reitit an alternative or a replacement and does not say the project has ended, so no successorOf and no alternativeTo is recorded. The newest Clojars and tag versions are 2.0.0-alpha builds dated the same day as 1.1.14, so latestPrereleaseDate is not recorded. The highest stable tag is 1.1.14 (2024-05-01); the GitHub releases list stops at 1.0.0 (2016), and Clojars latest_version is the snapshot 1.1.15-SNAPSHOT, so the release date and major come from the tag. The Clojars figure is total downloads across versions, read 2026-10-26. The maintainer is the GitHub organization Metosin; no legal name or imprint was found on the project's pages, and the metosin.fi home page names no legal entity, so hqCountry is not recorded. Two license statements are recorded: the GitHub licence (EPL-1.0) and the LICENSE file, which says Eclipse Public License v 1.0. The README names Clojure 1.9.0 and Java 1.8 as requirements; runtimeMin records the Java version. Last push 2024-11-04; not archived.
