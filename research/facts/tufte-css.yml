notes: >
  Status is active by the criteria: the README says "This project is maintained but not under active development. It is considered essentially feature-complete." That is no end signal, so the status stays accepted. The README says refactoring and new functionality are a very low priority and that contributions to fix bugs or add functionality are still welcome. The README scopes the project to CSS only and rules out JavaScript solutions and integration with static site generators. The homepage says the project "was created by Dave Liepmann and is now an Edward Tufte project", and the README names Dave Liepmann as creator and project maintainer and Edward Tufte as editor and director; maintainer follows the homepage, which says the project is now an Edward Tufte project; the README names Dave Liepmann as creator and project maintainer (creator and maintainer before the handover). The LICENSE copyright line names Dave Liepmann (2014). Maintainer is an individual; no company or legal form is stated, so hqCountry is unknown. The README and homepage say the project is "directly inspired by and based on" Tufte-LaTeX and the R Markdown Tufte Handout; neither has a record, so basedOn is not recorded. The install documentation names copying tufte.css and the et-book directory and no package manager. The package tufte-css is published on npm (weekly downloads for 2026-10-19 to 2026-10-25 summed from the range endpoint: 691; 2 dependent packages and 16 dependent repositories on ecosyste.ms), but the install docs do not name npm, so no npm figures are recorded; the reviewer decides whether to add them. The repository has no GitHub release. Tags run from v0.1 to v1.8.0, and the npm latest is 1.9.0 published 2026-06-25 with no matching tag; the major is 1 on both. firstRelease is the date of the annotated tag v0.1, which was created 2016-09-21; its commit is dated 2015-02-22. The homepage carries no social link. The GitHub repository is the source for the stylesheet; the default branch is gh-pages.
