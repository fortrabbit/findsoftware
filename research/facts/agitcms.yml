notes: >
  Stub, pending a decision on criterion 1: the README describes a local editor that writes the Markdown files of a Hugo or Jekyll site, built for those generators and not built on them, so basedOn is empty. Whether a local editor counts as a tool a web creator adds to a site is the question to settle; if it does, set the status to accepted. The repository has no project site. The latest GitHub release v2.0.3 is dated 2022-09-21; npm's latest 2.0.6 (2022-12-27) has the same major and is not used for the date. The repository was last pushed 2025-08-18. Contributors counted with per_page=1 on the contributors endpoint, without anonymous ones. The Quick Start page, the Explanation page and the Plugins page were read; the package.json homepage (0xsuk.github.io/agitcms) answers 404 from GitHub Pages, so no homepage is recorded.
