notes: >
  Hosted service, so no repository is recorded: the CSV row has no repository, and no SDK repository was checked. The legal entity is Usercentrics A/S (Havnegade 39, 1058 Copenhagen, Denmark, company registration DK34624607) per the legal notice, which the terms also name as the contracting party. The founding year is 2012 per the about page ("I created the first CMP in 2012"); it is not recorded as firstRelease because the page does not give a first release. Sign-in is described as "Single Sign-On (SSO)" on the Advanced plan with no protocol named, so sso is not recorded. The userRoles fact is scoped to the Advanced plan (role management is listed in that plan's feature column on the pricing page) and the i18n fact to the Premium plans (47+ languages is listed in their feature columns); neither is a statement about the Free plan. The Advanced plan lists "API & SDK integrations" without a named API style, so no headlessApi is recorded. The homepage states "600,000+ customers", which counts accounts, not sites, so it is not recorded as reportedInstalls. Plans are hosted tiers (Free, Premium, Advanced) with prices on the pricing page; prices, the free tier and the tier names are not recorded, and the hosted tiers are not paidEdition. The terms say the consent log is stored in a data center with Microsoft Ireland Operations, a cloud vendor; no regions field is recorded because that describes the consent log, not the service. The developer docs describe a script tag with data-cbid and a client-side Cookiebot object, which is the runsAs browser quote. Coined and not recorded as fields: the Google Consent Mode and regional regulation coverage, the cross-device consent sharing feature, the review and release workflow, the visitor question add-on, the free tier, and the Shopify integration named in the footer. The Facebook link is an icon in the footer and carries no quote. The newsletter sign-up exists on the legal notice and home pages with no separate URL, so no newsletter field is recorded.
