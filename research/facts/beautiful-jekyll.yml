notes: >
  The rubygemsDownloads figure is the total from the RubyGems API for beautiful-jekyll-theme, the gem the getting-started page names; the API gives no period. The first release is the gem's 1.0.0 (2016-12-09, RubyGems, author Dean Attali); the oldest GitHub release is 2.0.0 (2020-04-27) and the latest is 6.0.1 (2023-06-08). The plans page lists sponsor tiers (ad removal, a dark mode skin, office hours); none is described as an edition under a non-open license, so paidEdition is not recorded and pricingPage is the link only. The README calls the project a template; the record uses theme, the word the getting-started page uses for the Jekyll setting. The x link is the maintainer's account in the site footer, labeled "X (Twitter)"; the footer also links Facebook, YouTube and Patreon, which have no field. The getting-started page says Ruby is needed only for the Ruby and jekyll gem method, and the README says no support is given for the Ruby gem route; runtime is left out because the fork-on-GitHub route builds on GitHub Pages. No page states that the built site is static files, so renderingModes and runsAs are not recorded; the homepage says it is powered by GitHub Pages and Jekyll. The GitHub language (HTML) is not a page statement and is not recorded.
