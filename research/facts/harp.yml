notes: >
  The README states "Authored and maintained by @sintaxi" and a license section with the copyright holder Chloi Inc (2012 to 2021); the maintainer field follows the first. The GitHub repository has no LICENSE file and reports no license; the MIT statement is the README license section and the npm package license. The GitHub releases end at v0.40.3 (2021-06-07), while the npm package has 0.50.1 published 2026-07-06; latestReleaseDate follows npm. The docs site blog stops at v0.20.0. The Harp Platform is a hosted service next to the open source tool: the page https://harp.sh/docs/deployment/harp-platform calls it "A platform purpose-built for hosting Harp apps through Dropbox", and the docs overview offers a free trial. No prices were recorded. The docs say "Harp doesn't auto-reload" in the quick start, which is a constraint for prose. The npm figures cover 2026-10-12 to 2026-10-18.
  The docs say Harp serves layouts and partials and reads metadata from _data.json, and that it compiles assets as the browser needs them (homepage).
