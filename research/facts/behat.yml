notes: >
  The homepage https://behat.org answers 200 after a redirect to https://docs.behat.org/en/latest/, the project's Sphinx documentation; the README calls behat.org the main website. The README lists current maintainers Andrew Coulton, Carlos Granados and Christophe Coevoet and names Konstantin Kudryashov as the original developer; the LICENSE copyright line names Konstantin Kudryashov, which is the maintainer recorded. The quick-start page still says "at least PHP 5.3.3", an old statement; the composer.json at v4.0.0 requires PHP >=8.2 <8.6, which is the runtimeMin recorded. The v4 line is the stable major (v4.0.0, 2026-09-28); v4.0.0-alpha1 is a prerelease and is older. The oldest tag 0.1.0 has a commit dated 2010-09-06, which gives firstRelease; the GitHub repository was created in 2011. The default branch is 4.x. The community page links a Gitter channel, which has no field here; its Twitter link gives the x field. The quick-start page shows Composer and a behat.phar download as install routes, calls Behat an executable run from the command line, and says "at least PHP 5.3.3" (old, see above). The docs home says the codebase uses Symfony components internally, which is a dependency and no basedOn statement, and calls Behat the PHP implementation of Cucumber. Stars and contributors are for the single repository.
