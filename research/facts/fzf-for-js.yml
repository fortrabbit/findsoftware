notes: >
  The docs site fzf.netlify.app answers 200 but returns only its title in the static HTML (a JavaScript shell), so the homepage and docs facts rest on the README link list and the GitHub homepage field, and no quote comes from the site. The README says the library is a port of the FZF CLI's algorithm (junegunn/fzf, linked as the origin); that CLI is a separate project with no record here, and no basedOn or forkOf is recorded, the reviewer decides. The npm package named fzf has version 0.0.1 uploaded on 2017-02-13, before the repository was created on 2021-06-27, and belongs to another project, so it is not this project's history; firstRelease follows the oldest GitHub release (v0.3.1, 2021-08-01). The latest stable release is v0.5.2 (2023-04-25), which matches npm latest; the npm dist-tag unstable (0.4.0-alpha.0) is older and is not a prerelease date. Release age: no release since 2023-04-25; the register moves a record with no release for four years to stub on 2027-04-25. The npm weekly figure is the sum of the range 2026-10-19 to 2026-10-25; the API returns zero for 19 to 21 October. The package.json at v0.5.2 declares BSD-3-Clause and no engines field, so no runtimeMin is recorded.
