notes: >
  Row status accepted; the repository is a read-only subtree split of laravel/framework, which has no releases of its own, so the release date and major come from the Packagist metadata for illuminate/database. The Laravel docs page is the Eloquent section of the framework documentation, and it is the primary source for the ORM's behaviour; this record covers the standalone package, which the readme describes as usable outside Laravel through Capsule. The package is a component of Laravel, so basedOn names Laravel; the boundary against the laravel/framework record is for the record author to settle. The packagist download figure is the all-time total (period total). The installation command for standalone use was not found on the readme, so installMethod is not recorded.
