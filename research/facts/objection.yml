notes: >
  Development moved from Vincit/objection.js to ditojs/objection. The project's current site and the npm package name ditojs/objection as the repository, and the README says Vincit removed the maintainer's access to Vincit/objection.js in 2026 and that development continues at ditojs/objection. The Vincit repository still exists and is not archived; its last tag is 3.1.5, its last push is 2026-06-23, and its site (vincit.github.io/objection.js) still serves the 3.x documentation. The record uses the ditojs repository, homepage and figures because they hold the current 4.x line and the npm releases; this is a reviewer decision, since the CSV row names the Vincit repository. The stargazer count of 17 belongs to ditojs/objection, created 2026-06-25; the Vincit repository had 7338 stars on the same day, so the count does not measure the project's adoption as a whole. The contributor count is for ditojs/objection. The npm package named objection also has versions from 2012 that are not this project's history, so firstRelease is the oldest Vincit tag, 0.1.0, committed 2015-06-13. The v3 line is kept on a 3.x branch and published under the npm dist-tag legacy. The README says all databases knex supports work with objection and names SQLite3, Postgres and MySQL as the thoroughly tested ones; the databases field takes only those names. The README says the library was created by @koskimas and has been maintained by @lehni since 2023; the maintainer entry follows the LICENSE copyright line. The README's feature list names declarative models with relationships between them, eager loading, transactions and optional JSON schema validation. The guide says objection is an ES module and that CommonJS code can still load it with require. The TypeScript typings (shipped with the package), optional JSON schema validation and storing complex documents as single rows are coined kinds and stay in notes. The README calls Hibernate an excellent attempt at a traditional ORM; that is not an alternative statement and is not recorded. The pages read name no paid edition or hosted service.
