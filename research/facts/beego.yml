notes: >
  The homepage beego.wiki does not resolve (NXDOMAIN, 2026-10-24) and beego.me answered 403 to the research user agent on a retry (2026-10-24), so no homepage is recorded and status is stub. The repository's own README links the new documentation site as unavailable and points to the beego-doc repository, which holds the documentation source and is recorded as docs. The Go module path github.com/beego/beego/v2 is the install target named by the README. The GitHub API reports the license as NOASSERTION; the LICENSE file and the README both state Apache-2.0. The release list starts with v1.8.3 (2017-05-19), so firstRelease is 2017. The highest stable release is v2.3.10 (2026-04-03), no prerelease is newer. The quick start docs state Go 1.16 or higher, which is recorded as runtimeMin; go.mod at v2.3.10 declares go 1.24.2 and is not recorded. The database list is the drivers the ORM docs say are registered automatically; the same docs also list an Oracle driver constant. The README links a Slack workspace and a QQ group, which are not fields. The admin service is a monitoring dashboard (statistics and task checks), not a content editor. The features the README lists (MVC, ORM, session, cache, task, i18n) are modules of the framework; the README describes beego as inspired by Tornado, Sinatra and Flask, which is not recorded as basedOn. The grace page documents a hot upgrade where old processes serve earlier connections, which backs always-on. Contributors counted with per_page=1 and the rel="last" page: 348.
