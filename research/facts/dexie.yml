notes: >
  Dexie.js is a wrapper library, not a framework: the README names React, Vue, Svelte and Angular tutorials and the official bindings dexie-react-hooks and dexie-cloud-addon, so no basedOn is recorded. Dexie Cloud (hostedOffering) is a separate SaaS with a free tier and paid plans on the pricing page; its on-premise Business and Enterprise editions sell the Dexie Cloud server, not the library, so no paidEdition is recorded and the cloud pages are the source for those. The pricing page's self-hosted Dexie Cloud server (Docker image, full source) is a Dexie Cloud product: selfHostOption belongs to a hosted-service record. The homepage JSON-LD gives the publisher's address country as SE (script-only text, not quotable) and the footer gives the Awarica AB address in Stockholm; hqCountry is left out for reviewer decision. The npm install route ("## Install via npm", code block "npm install dexie") has no sentence that states it, so no installMethod is recorded for npm. The npm week figure is the sum of daily downloads for 2026-10-26 to 2026-11-01. The repository is an organization repository with a Discord badge in the README. Apache-2.0 is the license of the latest release. The GitHub mirror and npm package are both current; the oldest npm upload is 0.9.9 on 2014-08-21, which sets firstRelease. Stars and contributors belong to the single-package repository. runsAs is left out: the README and homepage name browsers, Electron, Capacitor and Node.js as platforms, which is a support list, so the record holds runtime node and no process model.
