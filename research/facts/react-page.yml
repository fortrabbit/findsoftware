  - https://react-page.github.io/docs/ (the documentation site returns a script shell with only the word "Document", so the docs fact stands on the README link)
notes: >
  The README opens with a banner, "LOOKING FOR MAINTAINERS", that links issue 1329; in that issue, open since 2024-11-05, the author says they no longer have a project that uses ReactPage and could not keep maintaining it. A banner asking for maintainers is no end statement, and a release still shipped on 2026-07-28 (v5.4.6, a dependency security fix), so the status stays accepted. The README says the project was "Formerly known as ORY Editor" and was originally created by aeneasr and ory; no record exists for the older name, so forkOf and successorOf are not recorded. The LICENSE carries two copyright lines, "Copyright (c) 2016-2019 Aeneas Rekkas" and "Copyright (c) 2020 react-page"; the current line is recorded as the maintainer. The package.json of the editor package names a different author, which the LICENSE line overrides. The npm package @react-page/editor starts at 0.15.0 in 2019 and the GitHub repository's oldest release is v0.0.1 from 2016, so firstRelease follows the repository. The homepage lists a rich text editor "powered by Slate" as one feature; the README and docs do not say the editor as a whole is built on Slate, so no basedOn slate. The docs say server-side rendering should work out of the box and that the editor needs React 17 for now; these are compatibility statements, not runtime or renderingModes. The README Attributions section links the original author's personal X account, which is not the project's. The sponsors listed in the README are not recorded.
