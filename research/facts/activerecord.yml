notes: >
  Active Record is one gem in the rails/rails monorepo, so stars (58,844) and contributors (371) belong to the whole Rails project and are recorded from the repository, not from the library. The homepage is the Rails project site; Active Record has no site of its own, so the homepage quote is from rubyonrails.org. The README says "Source code can be downloaded as part of the Rails project on GitHub" and points to the activerecord directory, so the repository is the monorepo root. The rubygems figure is the activerecord gem total; the rubygems version list holds no release before 2009 although the GitHub tags start at v0.9.1 in 2008. The version 8.1.4.1 is the newest stable gem and tag and was released 2026-11-04; the 7.2 and 8.0 maintenance lines are older majors. The gemspec reads the version from RAILS_VERSION, so the gem version is the monorepo version. The copyright line in MIT-LICENSE also names Arel's authors ("Arel originally copyright (c) 2007-2016 Nick Kallen, Bryan Helmkamp, Emilio Tagua, Aaron Patterson"); other legal entities go to notes, so the maintainer follows the first line only. The README calls Active Record "Object-relational mapping in Rails" and says "Active Record is an implementation of the object-relational mapping (ORM) pattern"; the gemspec summary says "(part of Rails)", which is the basedOn statement. The guide names MySQL, MariaDB, PostgreSQL and SQLite; the README names built-in adapters for MySQL, PostgreSQL and SQLite3. The README lists associations, validations, callbacks, transactions, migrations and database adapters as its features. The README says Active Record "provides a base class that, when subclassed, sets up a mapping between the new class and an existing table in the database".
