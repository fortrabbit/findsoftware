notes: >
  The homepage and docs are on www.neoteroi.dev, read with the FindSoftware research user agent. The PyPI JSON for blacksheep reports downloads as -1 (not provided), so pypiDownloads is the last-month figure from the pypistats API. The CSV figure of 19.9k per week predates this read. The first changelog entry is 0.2.3 (2020-08-22), so firstRelease is 2020, although the repository was created in 2018. The README names Flask, ASP.NET Core and the uvloop work as inspirations; none is recorded as basedOn because the project does not state it is built on them. The optional HTTP/2 client support and PyPy support are described in the README but are not fields. The project's docs also describe an MVC project template and an empty project template, both external repositories, not recorded. The docs describe production deployment only as the ASGI server's own guidance: the README says to refer to the chosen ASGI server's documentation, so no separate deployment page is recorded.
