notes: >
  The homepage idlisite.wiosdesigns.xyz does not resolve (DNS lookup fails, checked 2026-10-23), so no homepage is recorded and status is stub, modelled on bowman; the status fact cites that address and no page text. The repository has no release or tag, so lastCommitDate is the committer date of the newest commit on master, 2020-06-18; the repository's pushed date is later, 2023-05-22, which the commits endpoint does not show. The content is read from a Google Doc published to the web: the build fetches that document's HTML, so the Google Doc is the content store and is not recorded as contentStore. The README lists paid setup and training support from WIOS Designs; no price is recorded. The runtime.txt file in the repository pins Python 3.7; it is not recorded as runtimeMin because it is a repository file, not a page or a registry, reviewer decision. The README does not state that the output is static files; the build writes an index.html file.
