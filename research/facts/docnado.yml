notes: >
  The homepage is the project's own GitHub Pages site and lists the "Pricing" section as a free tier only ($0), no paid edition, so pricingPage is not recorded. The GitHub repository has no releases or tags; the registry package docnado on PyPI (1.0.13, 2022-02-22) is the stable release used for currentMajor and latestReleaseDate, and its requires_python >=3.6.0 gives runtimeMin. The PyPI JSON has no download counts (-1), so pypiDownloads comes from pypistats (last month). The PyPI author line and the homepage copyright both name Hardy & Ellis Inventions LTD. The README describes the optional PDF output through wkhtmltopdf, which is a separate binary, and the localhost server; runsAs holds local for the localhost server and static for the HTML export. The GitHub repository's pushed_at is 2023-05-22 while its newest commit's committer date is 2022-02-22; the release date used is the registry date.
