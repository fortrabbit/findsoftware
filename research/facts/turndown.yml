notes: >
  Turndown is a helper library for converting HTML to Markdown, accepted under the rule for general helpers in the markdown group. The README names Node.js and browser usage, so runtime is node and no runsAs is set. The browser route is a script tag shown only in a code block under a "Browser:" label, so it is no installMethod entry. The LICENSE copyright line names Dom Christie, and the README states the same MIT license in one sentence, so one license entry. The README's project updates say to-markdown was renamed to Turndown and that the repository moved to mixmark-io; the rename stays in notes because it is the same project, not a successor, and the migration guide is a rename note, not an importsFrom. The oldest tag v0.0.1 has a commit date of 2014-07-08, which is firstRelease; the npm package turndown was first published in 2017. The homepage is the project's GitHub Pages demo, which names the library in its first paragraph; the README is the documentation, so no docs field. The package.json engines field names node 18 and npm 9 at 7.2.5; a Node engines field of a library that also runs in browsers is no runtimeMin, so runtimeMin stays out. The GitHub stars and contributors belong to the single repository. The npm figure counts the turndown package that the install docs name, and the ecosyste.ms counts are its dependent packages and repositories. The README names turndown-plugin-gfm as a separate plugin package for tables and strikethrough; it is not a record of its own here. The demo page says the converter aims to be CommonMark compliant. The README says the converter takes an HTML string or a DOM node, its options cover heading style, horizontal rules, bullet markers, code block style and fences, emphasis and strong delimiters, and link style, and its rules run in a fixed order in which added rules come before the CommonMark rules, keep and remove filters come after them, and a default rule handles the rest. The README also says the escaping rules can be quite aggressive, and that a developer who is confident in doing so may override the escape method.
