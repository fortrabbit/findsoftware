notes: >
  The project has no site of its own: the CSV homepage is the README anchor on GitHub, and the GitHub profile blog is a personal site, so no homepage is recorded. The documentation is the README and the docs folder of the repository; the docs folder was not read beyond its listing. The npm package named by the install docs is cash-dom; the unscoped cash package has a much smaller weekly count and is not the package the docs name. The README table names the library as actively maintained and the README comparison names jQuery; the release history stops at 8.1.5 on 2023-04-13 and the repository has commits in 2026, so no end signal applies. The README says the library is for modern browsers and gives IE11+ in the same sentence while its table says it does not support older browsers; the figure is not recorded. The license file, the README and the package manifest all state MIT, and the license file names Ken Wheeler for 2014 to 2020 as well as Fabio Spampinato; the maintainer is recorded as the README names him. GitHub's language statistics list more JavaScript than TypeScript bytes, but the source folder holds .ts files and the README feature table says the codebase is typed in TypeScript, so TypeScript is recorded. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header. The npm weekly figure is the sum of the daily counts for the period in the value. The README says 100% feature parity with jQuery is not a goal and that the methods it implements should be compatible with jQuery's. The README is the documentation; the project has no separate website. The docs folder holds a migration guide from jQuery, a guide to extending Cash and a guide to partial builds that drop individual methods. The GitHub profile of the author lists a personal site and x account; they are not the project's. The README says the library is available through jsDelivr as well as npm.
