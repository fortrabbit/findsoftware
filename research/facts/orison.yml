notes: >
  The homepage at https://orison.alexlockhart.me answers 200; the http address redirects to it. The GitHub repository has no LICENSE file on its main branch and the GitHub API reports no license; the ISC license is stated on the project's own page https://orison.alexlockhart.me/license (copyright Alex Lockhart) and in the npm package metadata. The homepage describes Orison as based upon lit-html and lists lit, express and markdown-it as the libraries it uses. lit-html has no record id in this dataset, so basedOn is not recorded. The README states that Orison uses @lit-labs/ssr and markdown-it. The repository language field on GitHub reads HTML, which is not the language of the source, so language is left unrecorded. The npm package requires Node.js 24.16.0 or later in its engines field; the README line "nvm use 24.16.0" sets up development of Orison itself, so it is not used. firstRelease is the year the npm package was created. The npmWeeklyDownloads figure covers the week from 2026-10-12 to 2026-10-18.
