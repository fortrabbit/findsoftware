notes: >
  The master README opens "Webpacker has been retired" and says the Rails team will no longer evolve Webpacker in an official Rails capacity. The README names jsbundling-rails with webpack, import maps (importmap-rails) and Shakapacker as the routes for existing apps; Shakapacker (github.com/shakacode/shakapacker) continues the unreleased v6 line and is not recorded as a successor record. The README says security issues on the Ruby side follow the normal Rails maintenance schedule, and that the JavaScript libraries are no longer updated. The repository is not archived; its last push is 2024-07-16 and the README is the only end statement. The GitHub repository has no releases; the last gem release is 5.4.4 on RubyGems (2023-01-31), so latestReleaseDate and currentMajor come from RubyGems. The install steps come from the 5-x-stable README (gem 'webpacker', '~> 5.x' and the install task). The maintainer is not recorded: the gemspec names David Heinemeier Hansson and Gaurav Tiwari as authors, and no page names a maintainer of record. The first RubyGems version is 0.1 (2016-12-07), the repository creation date. No homepage exists; the repository is the only project page. The gemspec sets the Ruby floor for the 5.x line, Ruby 2.4.0 or later. The 5-x-stable README says Webpacker ships two binstubs, ./bin/webpack and ./bin/webpack-dev-server, and hooks webpacker:compile into assets:precompile; the 5-x-stable docs/webpack.md says Webpacker generates config/webpack files for the test, development and production environments.
