notes: >
  The homepage answers over https at https://alvarotrigo.com/fullPage/; the http address redirects there. The README says "Created by @imac2" and names no legal name; the maintainer is the author named in the footer of the pricing page, and the legal form is not stated. The LICENSE file is the GPL text without a project copyright line. The README names the GPLv3 under which the open source use is licensed and the commercial license for non-open-source sites, themes, projects and applications; both are recorded as license entries, and the pricing page shows the commercial plans (Hobby, Professional, Business, OEM/SaaS) for the whole library, which is not recorded as paidEdition because the commercial license is the non-GPL form of the same library. The extensions need an activation key and a license key; they are paid add-ons and are not recorded as paidEdition. The README's Vue, React and Angular wrappers are official separate packages (vue-fullpage.js, react-fullpage, angular-fullpage) and are not recorded as basedOn; the jQuery plugin use is optional and is not basedOn. The README names the npm package fullpage.js in its install section, which is the figure recorded; the CSV's 6.0k per week figure is older. The highest stable GitHub release is 4.0.41 (2026-03-04); the first GitHub release is v1.7 dated 2014-02-25. The README has a "Who is using fullPage.js" list and sponsors list, which are not recorded. The runtime is not recorded: the README states compatibility with browsers, which is a support list and not a sentence about where the library runs.
