notes: >
  Status is discontinued on the project's own statement in its repository description: ATutor is "NO LONGER USER LEVEL SUPPORTED", and developers who want to maintain it are asked to request collaborator access, so nobody maintains it now. The repository is not archived and the homepage still offers the last release for download without mentioning the status; release age was not used. The README names the developers as Inclusive Design Research Centre, OCAD University and ATutorSpaces but gives no legal name, so maintainer is not-found. The README gives "GPL" with no version, so the license fact is not an SPDX id, and GitHub reports no license. The homepage links a support forum archive and AContent, a separate product not recorded here.
