notes: >
  Stub: the homepage hyperapp.dev answers 200 with a parked page reading "This domain may be for sale.", so no homepage is recorded and the record waits for the project's own site or a statement of it: the repository homepage field, the README or the npm package pointing at a live site would settle it. The repository's homepage field is empty and the npm package names the same parked domain, so the project's own pages give no other site. The repository was moved from jorgebucaran/hyperapp to hyperapp/hyperapp; the facts use the current repository. The GitHub release list ends at 2.0.0 (2019-07-26), while npm latest is 2.0.22 (2022-03-25); currentMajor is 2 on both, and the npm date is used for latestReleaseDate. The first npm upload is 0.0.0 on 2017-01-05. The repository was last pushed on 2025-03-20, and no archive or deprecation signal appears. The README's first example imports the library from unpkg, which is recorded nowhere as an install route because no sentence states it. The docs are the repository's own tutorial and reference, linked from the README. Contributors is the page number of the rel="last" link with per_page=1.
