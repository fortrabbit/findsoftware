notes: >
  Hosted service: the platform runs at caisy.io, with a free plan, paid tiers and an Enterprise tier that adds custom SSO, custom user roles and on-premise hosting. The record stays hosted-service because no page documents installing it: the Enterprise on-premise line is the only mention, so whether it is installable by the user is unsettled and a documented install route would settle it. The pricing page names the Enterprise tier, not a price. The old docs host docs.caisy.io still does not resolve; the docs are read at caisy.io/developer/docs (developer) and caisy.io/guide/docs (user guide). The GitHub organization caisy-io publishes many repositories, among them the caisy-io/cport import and export tool (MIT, described as for caisy and other headless CMS) and example and starter projects for several frontend frameworks; no single repository is the project's source, so no repository fact is recorded. The features page names the CLI and generic import and export formats, not a named source. The maintainer is stated as cyclus.digital GmbH on the imprint, where caisy is a brand of that company and the registered address is in Stuttgart, Germany. The SDKs are described as TypeScript-focused on the features page. The Discord link sits in the homepage's page data next to the X (twitter.com) link, so it is recorded without a quote. The homepage footer also links to Instagram and LinkedIn, which have no field.
