notes: >
  Doubt: gathercontent.com answers with a 301 to the Bynder "Content Workflow" product page, which does not name GatherContent. A Bynder blog post of 15 November 2023, "GatherContent is now Content Workflow by Bynder", states that Bynder acquired GatherContent in 2022, that the product continues under the name Content Workflow by Bynder, and that the GatherContent brand and website are retired; so the name is replaced by Content Workflow, which is not a candidate in this register yet, and the product itself is not stated to have ended. The old brand and domain are gone, which is why the record is a stub without homepage; what would settle it is a decision on whether Content Workflow by Bynder, an authoring and approval service with a REST API, is listed under its new name and meets criterion 1. The API reference at docs.gathercontent.com (v2, with the older v0.5 tab) is still served and describes the GatherContent API. The homepage is not recorded because the domain now serves another company's page. No maintainer, legal name or registered country is stated on any page read, so those fields are unknown. The API reference lists components, items, templates, folders, files and webhooks; a webhooks endpoint ("Create a webhook that subscribes to a system event.") exists and has no field in the starter list. The help center redirects to Bynder support, which is a bot challenge at the time of reading.
