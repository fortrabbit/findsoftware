notes: >
  The self-host docs say "We don't do tagged releases for self-hosted PostHog" and that all commits become available for self-hosted instances, so no currentMajor or latestReleaseDate is recorded and lastCommitDate on the default branch (master) decides listing. The newest product tag is release-1.38.1, dated 2022-08-16 by its commit, and the oldest tag 1.0.0 is from 2020. The GitHub releases list holds only component builds (desktop app, agent, agent skills, hobby installer), no release of the server. The repository is not archived and no page states an end. Paid edition: the ee directory is under the PostHog Enterprise license, which allows production use only with a valid Enterprise license for a number of seats; the self-host disclaimer page lists paid-plan features (RBAC, SAML, SSO enforcement, unlimited projects, audit logs) as missing from the open source deployment, and the self-host docs call "PostHog's paid open source product using Kubernetes" no longer supported. The MIT license also appears as "MIT Expat" in the LICENSE and as "an MIT license" on the self-host and disclaimer pages: one license. Stack: the architecture page names a Django web app and REST API, Rust services for event capture, feature flags and replay, a Node.js CDP worker, Kafka as the message bus, Celery, Temporal and Dagster background workers, and ClickHouse, PostgreSQL, Redis and blob storage as data stores; Kafka and blob storage stay in notes. The docs describe the open source deployment as one Docker Compose stack on a single machine, and the README names the hobby deploy script; the Helm chart is sunset per the docs. The migration guides (Mixpanel, Amplitude, Google Analytics, Heap, Plausible, Matomo, LaunchDarkly and others) target PostHog Cloud projects, so importsFrom is not recorded for the self-hosted record; the compare and alternatives pages render no text without JavaScript. Self-hosted instances take sign-up with GitHub and GitLab through environment variables; no page names the protocol. The PostHog Cloud regions (US and EU) come from the README. The posthog-foss repository the README names is a separate repository with proprietary code removed, not a second record. The README states that open source deployments should scale to approximately 100k events per month, after which it recommends PostHog Cloud, and that the project provides no customer support or guarantees for open source deployments. The README and homepage state "500,000+ teams" without separating cloud from self-hosted installs, so it is not a reportedInstalls figure. Maintainer: the LICENSE copyright line names PostHog Inc. Coined kinds, kept in notes: embedMethod (JavaScript snippet, SDKs, API), surveys, error tracking, logs, tracing, data pipelines, AI observability.
