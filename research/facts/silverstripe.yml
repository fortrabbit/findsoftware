notes: >
  The homepage is the project's site that the docs home page links to; the site itself answers with a bot challenge, so it is not read directly. The CSV names silverstripe-cms; the install docs name silverstripe/installer, which has 1034996 total and 11990 monthly downloads on Packagist, and silverstripe/framework has 3922263 total and 61432 monthly. The figures recorded are for silverstripe/cms, the CMS package, which the CSV's Packagist count also matches. The Composer requirements page lists PostgreSQL, SQL Server and SQLite only as third-party community modules, so they are not recorded as databases. The docs site is read at its version 6 path, and the endoflife.date cycles give 6.2 supported to 2027-04-30 and 6.1 ending 2026-10-18. The repository's default branch README returns 404; the README and LICENSE are read on the 6 branch. The copyright line is dated 2016 with no legal form beyond Ltd, recorded as the LICENSE states it. The runsAs value rests on the requirements page stating that the web server rewrites URL paths to public/index.php; the page does not use the word per-request.
