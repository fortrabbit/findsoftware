notes: >
  Cypress Cloud is a paid service for recording tests, recorded as hostedOffering and sold beside the free Cypress App; the comparison page against Selenium names no record, so only Playwright is recorded as alternativeTo; the premium UI Coverage and Accessibility products are separate services, so no paidEdition is recorded. The homepage says "The Cypress App is free and open source." The docs say Electron is deprecated as a test browser and will be removed in a future version, a warning that is not an end statement. The npm figure is the sum of the seven daily counts from 2026-10-26 to 2026-11-01; the discovery CSV's 3.2M weekly figure is superseded. The homepage's own claims of weekly downloads and dependent repositories are not recorded, since the registry and ecosyste.ms figures carry dates. The firstRelease is the oldest tag of the cypress-io/cypress repository (v0.3.12, commit of 2016-11-14); the npm package carries older uploads from the predecessor repositories cypress-node and cypress-cli, which are not this repository. The runtimeMin follows the engines field of the latest npm version, and the install page lists Node.js 22.x, 24.x and 26 or later. The why-cypress page calls the Cypress App a locally installed app for writing and running tests, and the install page says the Docker images include all of the required dependencies. The Docker route names the official Cypress Docker images; no image name is recorded, so dockerPulls is not recorded. The Discord link is the footer link labelled Discord (on.cypress.io/chat redirects to it) and the newsletter is the footer link "Subscribe to our newsletter". The LICENSE copyright line reads "Cypress.io" without a legal form, so the maintainer is the legal name from the terms. The footer also links a LinkedIn company page (https://www.linkedin.com/company/cypress.io), which is no field. The repository owner's company is Cypress.io, Inc., Atlanta, Georgia, per the about page's mailing address. The homepage says the workflow "runs locally and in CI"; that is no statement of a process model, so runsAs is not recorded.
