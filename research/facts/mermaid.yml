notes: >
  Status is accepted. The README and the docs ask for more maintainers (the intro page says "mermaid needs more Collaborators" and asks for a core team); that is a request for help, not a statement that the project has ended, so the status stays accepted. The GitHub repository has releases named per package, so the currentMajor and latestReleaseDate come from the mermaid@12.3.0 release only; the sibling packages @mermaid-js/tiny, @mermaid-js/layout-elk and @mermaid-js/examples have their own releases. The stars and contributor count belong to the monorepo that holds these packages. The npm figure covers the mermaid package the install page names. The latest prerelease is 13.0.0-alpha.3 on npm, published 2026-11-11; GitHub lists no prerelease releases for this repository, and the npm package of that alpha names the repository mermaid-js/mermaid-v13 with the directory packages/mermaid, a separate repository whose description is empty. The docs say "Try the v13 Alpha", which is the same line. The Node.js 22.12.0 requirement on the usage page is for installing the npm package to host Mermaid on a page; it is a build requirement, so no runtime node is recorded. The runsAs browser value comes from the usage page sentence about loading the HTML in a browser; the medium-editor and medium-zoom pages state no such sentence, so they carry no runsAs. The intro page says the project is a JavaScript based diagramming and charting tool, and the README names no parent, so no basedOn is recorded. The homepage at mermaid.ai describes "the collaborative platform built on top of it" with team features, and the README links the Mermaid Live Editor at mermaid.live; these are separate offerings, no prices are recorded, and no hosted offering fact is recorded because the platform's own pages were not read as a hosted service. The README lists flowchart, sequence, class, state, ER, Gantt, pie, journey and C4 diagram types, each with a text example. Mermaid CLI, Mermaid Tiny and Mermaid Live Editor are separate projects or packages named in the README and the intro page. The README's security section warns that user-supplied diagram text can contain scripts that run when the diagram is shown, says sanitizing is attempted, and describes a sandboxed iframe rendering level for sites with external users that blocks script in diagrams and also blocks some interactive functionality; it is a configuration option, not a field. The README names a command line interface, the live editor and a third-party HTTP server as related projects. The Twitter link is taken from the README badge, so it has no quote. The README says Mermaid was created by Knut Sveidqvist, matching the LICENSE copyright line.
