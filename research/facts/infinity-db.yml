notes: >
  A database server for AI applications: the server runs as a process the install starts (Docker container, systemd service from the deb or rpm package) and clients connect over the network; the Python client infinity-sdk is the install the README names for the client side, and pypiDownloads counts that client only. The client needs Python 3.11 to 3.13 (requires_python is at least 3.11 and below 3.14); no runtimeMin is recorded because the server is not written in Python. The README Docker example and the dev docs use a nightly tag; the docs banner gives v0.7.4 as the latest documented version. The newest GitHub prerelease, a nightly dated 2026-01-20, predates v0.7.4, so no latestPrereleaseDate is recorded. The README lists an HTTP API reference; the page does not say REST or GraphQL, so headlessApi is not recorded. The footer copyright names InfiniFlow with no legal form and no country; the owner is an organization on GitHub. The README also lists an embedded mode: Infinity "Embedded in Python as a module", beside the server deployments with client and server as separate processes. The CSV homepage was empty and the site is infiniflow.org.
