notes: >
  No project website exists: the repository is the only page, so no homepage is recorded and the README is the docs. The PyPI package states MIT and the GitHub repository and its LICENSE file state BSD-3-Clause; both are recorded as separate license entries, and the difference is not resolved here. The first PyPI upload is version 0.1 (2016-01-20) and the oldest GitHub release is v2.10.0 (2022-07-10); firstRelease follows the registry's first upload. The current stable release is v4.0.6 (2026-09-30), the highest stable tag; the README says 4.0.0 is a ground-up rebuild with breaking changes from 3.x. The maintainer is recorded as the LICENSE copyright line names it; the line also carries an email address, which is not recorded. The README describes publishing to Amazon S3, Google Cloud Storage and Azure Blob Storage, and a local directory export; the CI/CD line is the only deployment statement that places it on a build machine. PyPI carries no download figure in its JSON, so pypiDownloads is absent. The rendering command is distill generate, and distill publish uploads the generated files to a configured target.
