notes: >
  The CSV homepage is the project site, sculpin.io, which answers 200. Its get-started path returns a 404 page, so the installation guide was read on the download page instead. The homepage announces an easier installer for summer 2026; the statement is a plan, so no fact records it. The latest GitHub release is 3.3.1, so currentMajor is 3; the 4.0.0-alpha releases on Packagist are pre-releases and are not taken. The maintainer is the LICENSE copyright line, which carries the legal form Inc.; the site footer names Dragonfly Development without it. The LICENSE copyright years are 2012-2019, which the file states and this record does not reinterpret. The contributor count is what the GitHub anonymous contributor list returns. The download page names vendor/bin/sculpin as the entry point for commands; no page states where Sculpin runs beyond the static output, so no runsAs local is recorded. The homepage lists bundles, which are the plugin set.
