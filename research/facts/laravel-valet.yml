notes: >
  The docs page is the only project page; the repository homepage field points to it, so it is recorded as docs and homepage stays out. The docs say Valet "requires macOS and Homebrew" and that PHP 8.0 or higher is needed for Valet's own scripts; runtimeMin takes the composer.json constraint at v4.12.0 (^7.1|^8.0), so the 8.0 statement is not recorded as the minimum. The docs point to Laravel Herd, which includes Valet, PHP and Composer, for developers who want the same on macOS or Windows; the pointer is no end signal. Valet runs Nginx and DnsMasq on the developer's Mac. The LICENSE copyright names Taylor Otwell and Adam Wathan (angle brackets keep it out of the quote check), and composer.json lists Taylor Otwell first among three authors; no page names a company as owner of the repository. The Packagist total is the figure from packagist.org on 2026-10-28.
