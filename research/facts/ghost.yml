notes: "Ghost is a full CMS with its own Handlebars theme layer and can also feed external frontends through the read-only Content API, so it sits at the edge of the headless-selfhosted area. The Ghost Foundation calls itself non-profit and fully remote and states no jurisdiction, so hqCountry stays out. The docs require Node 22 LTS while the npm engines field also accepts ^24.20.0. SQLite appears only as an optional npm dependency; the production stack names MySQL 8 only. The Docker Compose install is labeled preview and is required for self-hosting ActivityPub and Tinybird analytics; the ghost image on Docker Hub is a Docker Official Image, not stated as maintained by Ghost. The homepage reports 15,292 new publications in the last week and $100,000,000+ yearly publisher revenue, recorded nowhere as a field. The founding date (April 2013) is of the organization, recorded under the coined field founded. Coined here: founded (organization founding year), dockerPulls, hostedOffering, integrationsDirectory, repoCreated."
