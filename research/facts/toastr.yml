notes: >
  Stub: the homepage http://www.toastrjs.com resolves in DNS (184.168.131.241) but every request timed out over http and https on 2026-11-16, so no homepage is recorded. A live project site, or the maintainers naming one, would settle it; the README names only the GitHub Pages demo at codeseven.github.io/toastr/demo.html, which answered 200 and is for a reviewer to decide on as a homepage. The repository is not archived (last push 2023-02-27). The GitHub release object is 2.1.1 (2015-03-13), but the tags run to 2.1.4 and the npm latest is 2.1.4 (published 2017-12-08), so currentMajor and latestReleaseDate come from the npm registry. firstRelease is the oldest tag, 1.1.5 (2013-02-17), which predates the npm upload (2014-07-24). The README Install section also names a Ruby on Rails gem, toastr-rails, a third-party package that is not recorded as an installMethod. The LICENSE copyright line names the Toastr Maintainers; the README authors (John Papa, Tim Ferrell, Hans Fjallemark) are not recorded. Browser-only library: no runtime or runsAs, since no page states where it runs. The npm figure counts downloads of the toastr package from the install docs.
