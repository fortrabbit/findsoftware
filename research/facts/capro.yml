notes: |
  The project is in alpha: the homepage notice says Capro "has not been thoroughly tested for production usage", the getting-started page states the alpha too, and the install command requires @alpha. The GitHub releases are all 1.0.0-alpha tags and the latest is 1.0.0-alpha.37 from 2025-12-15, so no stable major is recorded in currentMajor. The repository was last pushed on 2026-09-24 and is not archived. The homepage and the getting-started page say the site is built with PHP's Blade template engine, which the project presents as from Laravel; Capro does not state that it builds on Laravel, so no basedOn fact is written. The composer.json requires "php": "8.*", which is less specific than the 8.0+ the docs state; runtimeMin follows the docs. The homepage lists collections such as blog posts that need no configuration, Markdown support, and API and view templates that fill a template with data from an API and turn it into pages. The getting-started page says capro new builds the site into the public directory, capro build rebuilds it after changes, and capro serve rebuilds on each file change during development. The getting-started page also says that YAML front matter at the top of a view becomes variables for the view, its layout and the Capro class that filters collections. None of these is a field, so they stay in this note. Packagist's first version is dated 2022-12-10. The maintainer name comes from the LICENSE line, which gives no legal form.
