notes: >
  The tutorial page states the license as GPL3 and the GitHub API gives GPL-3.0; the LICENSE file is the GPL version 3 text.
  The maintainer is the name the opam file gives; the tutorial page credits its authors as "grm" and "xvw". The opam file states GPL-3.0-or-later, the tutorial and the GitHub license field state GPL3 without the "or later" clause.
  The opam package is named yocaml on opam, which has no registry in the rules here, so no registry figure is recorded.
  The tutorial page names a development server and an opam install of yocaml_unix as a runtime context; the runtime field records the OCaml language only.
  The oldest GitHub release and tag is v1.0.0 (2023-11-16); the repository was created in 2021.
