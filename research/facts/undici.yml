notes: >
  Accepted as an HTTP client under the wave 69 ruling. Node.js bundles a built-in fetch() that the README says is powered by undici, and undici's own page compares the two under "Undici vs. Fetch"; no record id is named, so no field holds it. The repository nodejs/undici is a Node.js project under the nodejs organization, and the LICENSE copyright line names Matteo Collina and Undici contributors; the README's Collaborators and Releasers lists name more people, recorded in no field. The stars and contributors belong to the repository, which holds only this package. The README says the HTTP/1 parser requires WebAssembly and that Client and dispatcher requests fail where WebAssembly is unavailable, for example Node.js started with --jitless, so the module does not run there. The README's Long Term Support table lists 5.x, 6.x, 7.x and 8.x lines with their Node.js ranges; only the current major is recorded, and runtimeMin is the 8.x line's minimum from the package.json at the v8.12.4 tag. The README's API methods are request, stream, pipeline, connect and fetch, and its Benchmarks table names node-fetch, axios, request, got and superagent in a results table with no sentence calling them alternatives, so no alternativeTo is recorded; a reviewer may decide. The README also points questions to GitHub Discussions and to the OpenJS Slack channel; the Slack link is a general foundation chat and is not recorded. The homepage footer links the Node.js and OpenJS accounts and Discord, which are not undici's own, so no social field is recorded. The npm weekly figure is for the undici package the install line names, over 2026-11-01 to 2026-11-07.
