notes: >
  Shiki is a library, so it has no site of its own; it runs at build time in a static site generator or in the visitor's browser, and both appear in runsAs. The install page lists integrations for Nuxt, Astro, VitePress, Next, markdown-it and Rehype; these are the integrations the docs name, not a count. The npm package is ESM-only, according to the install page. The maintainer is the shikijs GitHub organization; no page names a company, so maintainerType community follows from the organization. The npm registry lists several individual maintainers; their names are left out of the record. The npm weekly figure is the registry's last full week.
