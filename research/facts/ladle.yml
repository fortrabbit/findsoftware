notes: >
  Ladle is React-only: the docs say "Ladle supports only React", so react is recorded in basedOn next to vite; react and react-dom are also peer dependencies of @ladle/react (npm latest 5.1.1). Highest stable release is @ladle/react 5.1.1 (2025-11-04); the repository also tags website@0.x, which are not releases of the package. firstRelease is 2021 from the npm first upload 0.0.1 (2021-02-03), older than the oldest GitHub @ladle/react tag 0.10.1 (2022-03-29). npmWeeklyDownloads is the sum of the daily counts for 2026-09-28 to 2026-10-04 (391,572); the CSV's 221.7k came from a stale last-week window. ecosyste.ms reports 251 dependent packages and 162 dependent repositories; its last-month download figure is not recorded, since the npm weekly figure is the one used. The docs links on www.ladle.dev redirect to a broken host (ladle.devdocs), so the docs were read on ladle.dev/docs/ and the homepage on ladle.dev. The LICENSE names Vojtech Miksu; the site's footer reads only "Ladle", and the npm maintainers list names miksu and ladle-ci. No legal form or country is stated, so maintainerType and hqCountry are left out. The runtime and runtimeMin are read from the 5.1.1 tag (node >=20.0.0); the main branch now declares node >=22.12.0, which is not recorded because no release states it. The Ladle docs say the build "creates a build folder and outputs Ladle assets into it" and that it can be deployed, so runsAs static is recorded next to local.
