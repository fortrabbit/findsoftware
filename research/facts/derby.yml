notes: >
  The homepage is recorded as https://derbyjs.com, which answers 200. The getting-started page names Node.js and MongoDB as requirements ("While DerbyJS is written to support any database, the MongoDB adapter is the most complete.") and gives an npm install only for the derby-examples repository, not for the derby package, so installMethod records that path and no npm command. Redis is named as optional ("It can be used to scale pub/sub beyond one server process"), not recorded as a database. The examples are started with node server.js; the docs do not say the process must keep running, so runsAs is not recorded. The docs introduction says "DerbyJS is a full-stack framework for writing modern web applications."; the README calls it an MVC framework, and categories keep the README's word. The docs introduction says "Templates can be rendered in the browser and on the server." and the apps page says "Derby projects support one or more single-page apps." The site footer states "Code licensed under MIT, documentation under CC BY 3.0." The latest GitHub release and the npm latest are both dated 2024-10-24, and the repository is not archived, which is no end signal. The maintainer is the copyright holder named in the README; the derbyjs organization is the repository owner. npmWeeklyDownloads is the week 2026-10-12 to 2026-10-18. The README says "Derby includes a powerful data synchronization engine called Racer". The apps page says apps have "a full MVC structure, including a model provided by Racer, a template and styles based view, and controller code" and that "On the server, apps provide a router middleware for Express."
