notes: >
  The homepage names the project as an open collection of web components; the README says it is "a community-driven collection of high-quality web components". The README says "The Elix project is led by Component Kitchen, which offers professional support for Elix." Component Kitchen is recorded as maintainer from the LICENSE copyright line ("Copyright © 2016-2018 Component Kitchen, Inc. and contributors to the Elix project") and the homepage footer; the company's About page says it was founded in 2014 and started the Elix project. The homepage footer gives "Seattle, WA USA" for hqCountry. The README says the components have no shared runtime and load directly in the browser; runsAs browser rests on that sentence. The repository's last push is 2023-03-01 and its last release is 15.0.1 (2021-11-13); the status is accepted because no end signal was found on the repository, package or site, and a reviewer may want to check the staleness against the criteria. firstRelease is the oldest npm upload by the project (1.0.0-alpha.20170719, repository elix/elix); the 2013 uploads (0.0.0, 0.0.1) belong to an unrelated project that held the package name before, and the first GitHub release is 1.0.0 (2018-02-08). The x link is Component Kitchen's account, linked in the footer of the Elix pages. The npm package reports no deprecation. contributors counts contributor accounts from the API list with per_page=1, read from the Link header.
