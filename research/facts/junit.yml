notes: >
  Repository: junit-team/junit-framework holds JUnit Platform, Jupiter and Vintage (JUnit 5 and 6 lines); stars and 268 contributors belong to it. The GA line is 6.1.3 (r6.1.3, 2026-08-07); the README lists 6.2.0-M1 as a preview dated 2026-11-15, and Maven Central lists it as latest, so latestPrereleaseDate is that preview. The maintainer is The JUnit Team from the homepage footer; the repository has no LICENSE copyright line naming a legal entity, and no country is stated. The paid support by OpenElements (support subscription on the homepage) is no edition. Maven Central holds the separate junit:junit artifact (JUnit 4.13.2 is its latest release); it is not the record's coordinate and its dependent figures (97,532 packages, 1,583,666 repositories per ecosyste.ms) are not recorded. firstRelease is left out: the earliest Maven Central upload of junit:junit (2005-09-20) is a bulk import of versions 3.7 to 3.8.1, not a release date. The repository itself was created 2015-01-11. The user guide names runtime Java 17 or higher and the Maven and Gradle sections; the install route is a dependency declaration on the Maven or Gradle build, shown in the build support page. The overview says the platform provides a Console Launcher to launch it from the command line, the runsAs local statement. The Vintage engine runs tests from the two older generations on the platform; the Jupiter programming model is the newer API. The overview says build tools and IDEs run the platform. The overview calls the Vintage engine deprecated, to be used only temporarily while migrating tests to Jupiter or another framework with native platform support. The homepage also links a Codeberg mirror and a LinkedIn page.
