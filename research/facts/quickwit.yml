notes: >
  Quickwit joined Datadog (blog post dated January 9, 2025, which states the team will build a new product with Datadog and release a new version under Apache 2.0). The repository is active (pushed 2026-10-27) and has stable releases to v0.9.3, so no end signal; the parent fact is for reviewer decision. The homepage says the engine is powered by tantivy, a Rust search library; no tantivy record exists, so basedOn is omitted. The homepage's logs and traces wording is not recorded as a second category, because log-search has no mapped value. Releases tagged lambda-* and nightly are not versioned stable releases; currentMajor follows v0.9.3. The installation page lists libssl as an external dependency for production systems, which is not recorded as a fact. The homepage links LinkedIn and YouTube (no field for them). The homepage footer names Quickwit, Inc. with no legal address or country; hqCountry stays unknown. The docs version selector shows 0.9.0 while the latest GitHub release is v0.9.3.
