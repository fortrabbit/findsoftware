notes: >
  Zesty.io is a hosted service: the docs describe a cloud content instance, a Private Cloud with Akamai and a SaaS platform, and name no installable part beyond the Private Cloud option, where customers own and operate portions of the architecture that manage data. The homepage links a GitHub organization (github.com/zesty-io) that holds client code, not the platform, so no repository is recorded. The docs describe the instance API as read only over JSON (Instant API), a REST Instances API and a GraphQL endpoint set that a user switches on in the Manager UI. The pricing page lists SSO only under the Enterprise plan and does not name a protocol. The Community plan limits (users, bandwidth, storage) and the plan API call counts are plan limits with no prices recorded. The copyright line gives 2010 as the start of the copyright span, which is a company date and not a first release, so firstRelease is left out. The docs' Getting Started page says the platform has open-source user interfaces and that the core is built in Go and Node.js, which the hosted service runs; no license is stated and no fact is recorded from it.
