notes: >
  Editor.js is one package in the repository, so the stars and contributors belong to codex-team/editor.js; the npm figure is @editorjs/editorjs, the package the install page names, and counts downloads from 2026-11-01 to 2026-11-07. The default branch is next, which holds the 2.32 release candidates; the latest stable release is v2.31.7 (2026-09-17) and the newest prerelease is v2.32.0-rc.3 (2026-11-01). The npm latest tag is 2.31.7 under Apache-2.0. The LICENSE copyright line reads "Copyright © 2015-present CodeX"; codex.so names "CodeX Team" and gives no legal entity or address on its privacy page, so hqCountry is not recorded. The oldest tag is 1.4.0, committed 2017-01-24; the repository was created in 2015 and no earlier tag was found, so firstRelease is 2017 from the tag, not from the repository creation. The output is JSON, with each block provided by a plugin (the README says so); this is recorded here and not as a field. The homepage has no X, Discord or newsletter link of its own: the header links a "Digest" on mailbob.io, a link label that is not a newsletter sentence, so no newsletter fact is recorded. The i18n documentation says the API localizes UI texts of the core and plugins through a messages dictionary. The runtime is not stated on any page read: the README lists web, iOS and Android among places the JSON can be used, which is output use, not where the editor runs, so no runtime or runsAs is recorded for the reviewer to decide. The getting-started page names the Node package, a CDN and a local file as routes; each is its own installMethod entry. The README links an awesome list of plugins, recorded as pluginDirectory. The homepage links Open Collective and donation pages, which are not fields. No comparison or alternatives page was found in the pages read, so alternativeTo is not recorded.
