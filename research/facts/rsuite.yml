notes: >
  Status: the README says the 5.x line "will no longer receive new features" and that its security fixes last "until 7.x is in progress". That is a support-window statement for an older major, not an end of the project; the current major is 6 (GitHub release v6.2.5, published 2026-10-04, matching npm latest). The npm first upload is 0.0.1 on 2016-06-30, the same project (repository created 2016-06-06), so firstRelease is 2016 from the registry, earlier than the oldest GitHub release (1.0.4, 2017). The npm figure is the rsuite package the install docs name. Its peer dependencies are react and react-dom at 18 or later; a peer dependency is not a runtime and is not recorded. The README says React Suite "supports server side rendering" and names Next.js; no page states a runtime or a deployment mode for the library, so runsAs is not recorded; renderingModes lists server because the README states server side rendering support. The README's Vercel sponsor line is no parent. The homepage and guide advertise an LLMs.txt, an MCP server and agent skills; these are features, not fields. The usage guide and the homepage state no paid edition. The maintainer is the LICENSE copyright name, React Suite Team, with no legal form on any page read. The homepage text is read from the server-rendered page; its embedded demo labels are not recorded. The README says "React Suite supports server side rendering."; that is compatibility of a UI library, so renderingModes is not recorded.
