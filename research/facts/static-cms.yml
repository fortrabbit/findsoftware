notes: >
  The README opens with "Static CMS has been archived" and says the decision "was made to cease development"; the GitHub repository is archived, and the homepage links to the StaticJsCMS organization that owns it. The README names Decap CMS and Tina CMS as alternatives; they are not recorded as successors. The docs list backends for GitHub, GitLab, Bitbucket, Gitea and Git Gateway, and an optional editorial workflow with Draft, Ready for Review and Ready To Publish states. The README describes two installs: a single HTML file plus a configuration file loading the CMS from a CDN, and a bundled install with npm. The docs sit at staticjscms.netlify.app; the docs source is in the repository at packages/docs. The LICENSE copyright line names no holder, so the maintainer is the name on the project's own site.
