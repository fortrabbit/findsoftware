notes: >
  The CSV homepage is plain http; the same site answers over https, so the https address is recorded. The GitHub API license field is Apache-2.0 and the README and LICENSE agree. The latest stable release is 0.94.1 (2026-09-01); the 1.0.0 release candidates are not stable, so currentMajor is 0. The newest release candidate (1.0.0-rc.17, 2026-03-30, from the release notes) is older than the stable release, so latestPrereleaseDate is not recorded. The runtimeMin is the require_min_otp_vsn in rebar.config at the 0.94.1 tag, the latest stable release; the documentation site describes the development line, where the requirements page recommends Erlang/OTP 28. The installation requirements name PostgreSQL as the store for CMS content. The templating language is not stated by a page that says Zotonic uses it (the tag pages mention ErlyDTL and Django only as a compatibility target), so templating is not recorded. The x and mailing-list links on the support page use http addresses (twitter.com/Zotonic, groups.google.com/group/zotonic-users), so they are not recorded; the Gitter chat link there is a chat, not a field. The module list names OAuth 2.0 as a provider and social-login modules, which is no SSO statement.
