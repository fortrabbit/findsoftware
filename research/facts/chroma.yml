notes: >
  The repository is the only project site: the README names no homepage, so none is recorded. The README says "Chroma is based heavily on [Pygments]" and includes translators for Pygments lexers and styles; Pygments is not a record, so the statement sits here and not in basedOn. Stars, contributors and releases belong to the repository alecthomas/chroma, which is the library itself. GitHub reports no license (NOASSERTION) because COPYING holds the MIT text for the code and the SIL Open Font License 1.1 for the bundled Liberation, Arimo, Tinos and Cousine fonts in the SVG formatter; both are recorded as license entries. The v3.0.0-alpha.1 to alpha.5 tags appear on GitHub without the prerelease flag, so releases/latest reports an alpha: currentMajor takes v2.27.0 and latestPrereleaseDate takes alpha.5. runtime go and runtimeMin Go 1.25 come from go.mod at the latest stable tag; the import does not read Go as a hosting runtime or a runtime minimum, so review hosting on the record page. No Go module download figure exists. The README names Hugo and moor as projects that use Chroma; they are not recorded as fields. Usage as the README describes it: a program imports the module and picks a lexer, a style and a formatter from the registry each package holds; a quick-start function highlights text in one call; the HTML formatter can emit inline styles or CSS classes and optional line numbers; terminal output is available in 8-color, 256-color and true-color; the command-line interface installs from the releases page and can act as a preprocessor for less. Chroma has a Slack channel badge on the Gophers workspace, left out as a general Go community channel.
