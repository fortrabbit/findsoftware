notes: >
  The repository is the monorepo for React Spectrum, React Aria, React Stately and the internationalization packages. This record takes the figures of @adobe/react-spectrum, the package the getting-started page installs; React Aria (react-aria-components, latest 1.22.1) and React Stately are separate candidates and their figures are not used here. The @react-spectrum/s2 package (latest 1.8.2) is a separate package with its own release line, not recorded. The GitHub release list has no release for @adobe/react-spectrum after 3.45.0 (2025-10-02); the npm registry lists 3.47.7 as latest, published 2026-10-09, and that registry date is recorded as latestReleaseDate. The major is 3 on both sources. The Adobe legal notice is not readable (adobe.com answers 403 to the privacy and terms pages), so the legal form and hqCountry are unknown; the maintainer is recorded as "Adobe" from the copyright line on the getting-started page. The npm package named the install page is the one whose figures are recorded; the repository's organization is adobe. The homepage links only to the GitHub repository. The first npm upload is 2020 (package created 2020-07-07), older than the first GitHub release of this package (2023-02-24), so firstRelease follows the registry. The getting-started page says the components adapt to interactions and screen sizes and include screen reader and keyboard navigation support, and that application settings such as the locale are set in a Provider component that takes a theme. The README says React Aria and React Stately are unstyled hooks and components for building components with one's own DOM and styling, and that React Spectrum is the Spectrum-styled library. The README says all components are designed to work with mouse, touch and keyboard interactions.
  The adobe.com privacy and terms pages were tried again on 2026-10-28 and still answer 403 to the research user agent, so hqCountry stays unknown.
