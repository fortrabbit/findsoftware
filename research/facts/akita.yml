notes: >
  End signal: the README opens with "THE LIBRARY IS NOT MAINTAINED ANYMORE - DON'T USE IT" and recommends Elf (ngneat.github.io/elf) as a newer state management solution; the GitHub repository salesforce/akita is archived (API flag true, read 2026-11-04). Elf is not a record here and is named in notes only. The homepage salesforce.github.io/akita redirects to opensource.salesforce.com/akita/, which is recorded. The site says Akita is built on RxJS; no rxjs record exists in research/facts, so the parent sits here and is not in basedOn. The site also says Akita can serve Angular, React, Svelte and vanilla JavaScript, and has integration docs for those; these are not basedOn. The repository is a monorepo: stars and contributors belong to salesforce/akita, and the registry figures are for @datorama/akita, the package the install docs name, at the akita-8.0.1 tag. The npm weekly figure covers 2026-10-26 to 2026-11-01; the npm latest 8.0.1 is not deprecated. The CSV's 26.5k a week figure predates the current window. The site footer links a personal Twitter account and a Gitter lobby; the Twitter account is not the project's, and Gitter has no field. The CSV's category angular is not in the import's category map, so it is not recorded. hqCountry is not recorded: the maintainer's address was not looked up because the record is discontinued.
