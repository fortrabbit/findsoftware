notes: >
  The GitHub homepage field is empty; the project's own site at srackham.github.io/hindsite is recorded as homepage. The GitHub repository was pushed in 2026 and is not archived. Highest stable GitHub release is v2.0.2 (2022-06-07), so the major is 2; the oldest GitHub release in the list is a prerelease from 2018, which sets firstRelease. The site's own quick start runs hindsite serve, a development server; that is the local use and is not recorded as a runtime. The site states Hindsite can read Jekyll and Hugo front matter; this is not a migration path and is not recorded as importsFrom. The "Quick Start" uses the built-in blog template, which the site names as hindsite init -from blog.
