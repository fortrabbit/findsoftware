notes: >
  Maven Central publishes no download figure. The ecosyste.ms counts belong to the Maven package com.graphql-java:graphql-java. Stars and contributors belong to the single repository, which is not a monorepo.
  The highest stable GitHub release is v26.1 (2026-08-24); the getting-started page still shows the v25 versions (25.0) in its Gradle and Maven snippets, so no version from it is recorded.
  The getting-started page (v25 docs) says "requires at least Java 11". The README says the current development version requires Java 17 or later, which is the development line. The v26.1 build file sets options.release = 11, consistent with the docs.
  The Gradle and Maven routes are recorded from the headings of the dependency snippets on the getting-started page.
  The LICENSE file names "Andreas Marek and Contributors" with 2015; the homepage footer says "Copyright © 2026 Andreas Marek". The maintainer follows the LICENSE line.
  feddi (feddi.dev) is a separate company and product that the README and homepage describe as built on GraphQL Java; it is not this record's parent, and no fact about it is recorded here.
  The homepage's book link (Leanpub, Amazon) is no field and is not recorded.
