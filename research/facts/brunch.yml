notes: >
  The npm package name "brunch" is now held by an unrelated project: the registry describes the latest version as "AI chat interface built on HASH" (published 2026-05-06). Its download figures are not this project's, so npmName and npmWeeklyDownloads are unknown. The README boilerplate lists over 50 starter projects (coined field, not recorded). The original author's last release is 4.0.2 (GitHub release 2023-01-10); currentMajor and runtimeMin come from that version's registry metadata, which carries the deprecation notice. Status is discontinued on the README notice and the npm deprecation notice on 4.0.2. The deprecation flag on 4.0.2 is confirmed on the registry; the latest dist-tag (5.0.1) is the unrelated package and carries none. The repository is not archived and was last pushed 2026-04-19. The docs install command, npm install -g brunch, resolves to the unrelated package today; the README tells users to pin brunch@4.0.2.
