notes: >
  The homepage ddphotos.donohoe.info is the project's demo site, answering over https, and it names the project in its footer. The companion desktop app is a separate open-source repository, github.com/dougdonohoe/ddphotos-app, and is named in the README as the easiest way to run DD Photos; its own figures are not recorded here. The maintainer is recorded as the homepage footer words it, "Doug and Cindy Donohoe", as the copyright holders of the site; the README gives no legal name for the maintainer, so a reviewer should decide the name. The LICENSE.txt is the unmodified GNU AGPL v3 text and its copyright line names the Free Software Foundation, so it does not name the maintainer. The README also says the author offers the software under different terms on request ("If you'd like to use this project under different terms, contact"), which is not a license statement with terms, so no second license or licenseModel is recorded. The Docker Hub image is named in the README, and its pull figures are not recorded because Docker Hub is not one of the registries in the list. The first release is dated 2026-04-03 by the oldest GitHub release, so firstRelease is 2026. The highest stable release is v1.34.4 (2026-10-21), major 1. The developer setup needs Go, Node.js and libvips, and the Go minimum is the go directive in go.mod; no version number is stated on the page, so runtimeMin is absent. Deployment options in docs/DEPLOY.md are a static export for any static host, rsync to Apache or nginx, and S3 with CloudFront; the README calls the output static. The README notes that album photos are encrypted in the browser, with the password never stored on the server; this is not a field here.
