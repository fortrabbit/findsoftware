notes: >
  No homepage: the repository's GitHub homepage field is empty, the README names no project site, and the README links only the wiki and the pyenv-installer repository. The README says the project "was forked from rbenv and ruby-build, and modified for Python"; the rbenv record is the only parent with a record, so forkOf is rbenv; ruby-build has no record. The README says pyenv "was made from pure shell scripts", so no runtime is recorded: the runtime vocabulary has no shell value, and the language Shell falls outside the language vocabulary, so the import drops it (as with phpenv). The LICENSE names two copyright holders, "Yamashita, Yuu" and "Sam Stephenson"; the maintainer follows the first line, and the second holder is the rbenv author. The README does not say the tool runs on a developer machine or in CI; runsAs local follows the boundary ruling for runtime version managers, and the quote is the README's per-user statement. firstRelease is 2012 from the oldest tag, v0.1.0 (commit 2012-08-31), which predates the oldest GitHub release (v1.0.9, 2017-03-24) and has no release entry. The CSV lastRelease (2026-10-14) is stale: v2.8.14 is the newest stable release (2026-10-26), and v2.8.14 is the highest stable version, so currentMajor is 2. The GitHub repository was created 2012-08-31. The README links the Gitter chat through a badge; no chat field exists, so it is not recorded. The README says pyenv does not officially support Windows and does not work outside the Windows Subsystem for Linux, and points to the pyenv-win fork. The Homebrew install is named as an option in the README; the README also names an automatic installer, recorded as its own route.
