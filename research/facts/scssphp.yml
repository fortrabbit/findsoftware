notes: >
  Maintainer: the LICENSE.md and homepage copyright line name Leaf Corcoran; the composer.json authors are Anthon Pang and Cédric Morin, and composer authors are not maintainers, so the copyright line is recorded. A reviewer confirms the value. The MAINTENANCE.md says the project is "not an official implementation" of Sass and tests against a pinned sass-spec. The homepage says feature requests for new Sass language features "will be rejected" and "must be submitted to the upstream Sass project instead", and that the project "does not support Sass modules yet": a relationship a reviewer may read as basedOn sass; the record leaves basedOn unset because the project does not say it is built on the Sass implementation. The Packagist package is not marked abandoned and the repository is not archived. The Packagist p2 metadata shows the stable version v2.1.0. The repository's first GitHub release is 1.0.0 from 2019-06-05. The Packagist figures are the total and the monthly counts the Packagist API reports. The repository contains a bin directory; the README gives no command-line usage, so runsAs stays unknown.
