notes: >
  Hosted-service record: the open-source part is the uploadcare/uploadcare-js-api-clients repository (MIT, 64 stars, the @uploadcare/upload-client package at 115.7k weekly downloads in the candidates row), a client library for the hosted API; its license, stars, npm figure and versions are not recorded here, and the repository field is left empty for that reason. The homepage and pricing page name the File Uploader widget, the Image CDN and Video CDN, and the Enterprise plan with SSO through Okta; the pricing page's Free plan and the Pro, Business and Enterprise plans are recorded without prices. The pricing page states a 99.9 percent SLA on paid plans; no regions list was found on the pages read, so regions is left empty. The terms name Uploadcare Inc. in Boston, Massachusetts, USA; the privacy policy gives Uploadcare Inc. a Wilmington address, which is the registered address and is not used. The homepage links to a LinkedIn company page, which has no field. The pricing page states "HIPAA and SOC2 compliant" for the Enterprise plan; compliance claims are not a field. The pricing page lists team seats per plan (3 and 4 seats on the Business and Enterprise plans) with no role names, so userRoles is left out. The docs pages read (landing, security) and the FAQ state no data regions. The Uploadcare docs were checked at the landing page only; the install and integration pages (Integrations, API, CLI) are client SDKs and were not used for fields. The candidates row lists the SDK repository as the record's repository; hosted-service rules keep the vendor's product page as the homepage.
