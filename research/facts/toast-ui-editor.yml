notes: >
  The README opens with a notice: "This project is no longer maintained." and "TOAST UI Editor is deprecated, and this repository is archived. No new features or bug fixes will be released." The repository is archived (archived: true in the repository API, 2026-11-16), and the README notice is the end statement, so the status is discontinued even though a release is dated after the notice. The stable release editor@3.2.3 on the GitHub releases list and the npm latest 3.2.3 are both dated 2026-11-15, which sets latestReleaseDate and currentMajor; the npm metadata of that version also carries a deprecation message ("Package no longer supported"), recorded as the registry's signal and not as a quote. The previous stable, 3.2.2, is dated 2023-02-24. The repository is a monorepo: the package is apps/editor, and stars and contributors belong to the monorepo. The oldest tag is 0.0.1, whose commit date is 2015-08-28; the repository was created in 2015 and its first GitHub release is v0.0.1 from 2017-10-13. The React and Vue wrappers (@toast-ui/react-editor, @toast-ui/vue-editor) and the five plugins are separate packages in the same repository and are not basedOn. The chart and syntax-highlight plugins render with TOAST UI Chart and Prism.js; neither is basedOn. The README's "Used By" list names apps, not counts, so it is not recorded as reportedInstalls. The editor's getting-started guide names a usageStatistics option that sends the hostname of the page that loads it unless the creator turns it off. The homepage is served over https after a redirect from the http address in the discovery row.
