notes: >
  The old JTL-Shop product path on jtl-software.com returns 404; the product page is now the eCommerce platform page on jtl-software.com, which is the homepage, and the documentation at guide.jtl-software.com is the docs field. The CSV row said facts not checked; the install, requirements and edition pages were read. The source is a public GitLab project, gitlab.com/jtl-software/jtl-shop/core, under the jtl-software namespace; no jtl-software.com page links it, so the repository fact rests on the GitLab API alone. Its LICENSE.md says "Released under MIT License" while includes/composer.json says "proprietary"; both are recorded as license statements and the license terms of the whole package are not settled by either. The requirements page says JTL-Shop 5 "wird mit offenem Quelltext ausgeliefert" (ships with unencoded source code, in the context of the IonCube loader, which is not needed to run it); that is a statement about encoding, not an open-source claim. The latest release is the highest stable tag in the GitLab project, v5.8.2. Orders from JTL-Shop are automatically transferred to JTL-Wawi, the JTL ERP, which the homepage lists as an integration; no field takes it. The Community Free Edition is limited to 500 articles, and the operator arranges hosting. The requirements page lists an Apache 2.2 or 2.4 web server with mod_rewrite and .htaccess support, which is not recorded as runsAs because no page ties it to the live site running per request. hqCountry is not recorded because the legal notice gives a German address without naming the country.
