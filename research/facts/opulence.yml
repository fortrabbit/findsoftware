notes: >
  The install docs name opulence/project, a skeleton whose composer.json requires opulence/opulence; opulence/opulence is the package of the repository this record names, so the registry figures come from it. opulence/framework is a separate split package with far fewer downloads and is not used. Packagist's newest tagged version of opulence/framework is v1.2.2 (PHP ^7.3 || ^8.0); GitHub's latest release is v1.2.3 (2023-01-24), so the PHP minimum is taken from the docs. The website and README show no archive, abandonment or end-of-life notice. runsAs is not recorded: the docs' Server Config section (document root, tmp directory, Apache, Nginx, Caddy configs) shows how to configure a server but does not state the run model.
