notes: >
  The GitHub homepage field is empty and PyPI's project_urls homepage is the repository, so the record is repo-only and has no homepage; the documentation site is the docs fact. The default branch is dev, and the packaging sits in the python/ folder: python/pyproject.toml at tag v9.0.43 names the author, the license and requires-python. The Python port wording ("This is a Python port of Google's libphonenumber library") is a port statement, not a basedOn statement, and Google's project is not a record. The stars and contributors belong to the repository, which holds the Python package and the libphonenumber resources. The repository ships a second package, phonenumberslite, without the geocoder, carrier and timezone metadata; the README describes it, and it is not recorded as its own record. The README names the optional geocoder, carrier and timezone packages and the stub files for static typing; those are features, kept out of the fields. The major 9 is the tag line (v9.0.43 is the highest stable tag, and PyPI's stable 9.0.43 agrees); no page on this repository states that the version follows upstream libphonenumber. The runtimeMin 2.5 is the requires-python floor the package declares, and the README says it supports Python 2.5-2.7 and Python 3.x; the classifiers list Python 3.3 to 3.12, so the floor is the declared range and not a tested one. The LICENSE file is the Apache 2.0 text with no copyright line; the maintainer comes from the pyproject author list. The Java code is copyrighted by The Libphonenumber Authors (README, 2009-2015), which is the upstream project's notice and not a second maintainer. The pypiDownloads figure is the pypistats.org last_month count read on 2026-11-16, the period is stated in the value. The dependent counts come from ecosyste.ms for the PyPI package. The README says the normal metadata loads region by region on first use, and that the geocoding, carrier and timezone metadata sits in separate packages that must be imported explicitly. Its examples show that parse raises NumberParseException for a number with neither a plus sign nor a default region, and that is_possible_number and is_valid_number are separate checks. The README also describes a set of type stub files for static type checking and the AsYouTypeFormatter and PhoneNumberMatcher objects, which are features and not fields. The README's examples format numbers in the national, international and E164 layouts, and say the library includes a lot of metadata.
