notes: >
  The GitHub homepage field is empty and the README names no site of its own, so no homepage is recorded. The repository has no GitHub releases and no tags; currentMajor comes from the npm latest tag 3.2.0. firstRelease is 2017 from the npm created time; the repository itself was created in 2016 and no release from that year is on record. The copyright line in LICENSE says "fiatjaf" with no legal name or legal form, so the maintainer is recorded as the project states it. The npm package metadata names "Giovanni T. Parra" as author; it is not recorded because the repository's own package.json and LICENSE name fiatjaf. The README says the project is "powered by react" and uses browserify, and records React as basedOn; browserify is a bundler and is not recorded as a parent. The templating quote is the README tutorial as the npm registry carries it, because the checker strips tags from README files. No contentStore is recorded: the README shows a helper that lists Markdown files, and also feeds content from a headless CMS, a Google Document or other sources, so the project has no store of its own. The README does not state where generate.js runs, so no runsAs local is recorded. The last repository push is 2019-07-08 and the last npm publish is 2019-03-14; the project makes no end statement, so the import moves the record to stub on its own.
