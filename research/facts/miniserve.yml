notes: >
  Accepted row, no boundary question. Criterion 1 doubt for the reviewer: miniserve serves a file or a directory over HTTP, so it is recorded as server software in the web-server category, not as an application; the README's SPA mode, systemd unit and TLS options are the server-side evidence. The homepage is not recorded: the repository is the only project page, and the README has no site. currentMajor 0 stands for the 0.x line. runtimeMin is not recorded: Cargo.toml (edition 2024) and the crates.io record state no rust-version; the README only says "a recent version of Rust" for Cargo installs. The README binds to all interfaces by default and says a public interface may need the systemd unit's address rules overridden. firstRelease 2018 is the oldest GitHub release and matches the repository creation year. The Docker Hub figure is for svenstaro/miniserve, the image the README's Docker route names. The README also compares miniserve with Python's built-in web server and netcat, which have no record. Fields coined: none.
