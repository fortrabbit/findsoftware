notes: >
  Stub: criterion 4 cannot be judged from the sources. Release age is unknown: the download page asks for a name and email address before it offers the installer, and no page read carries a version number, a release-notes page or a changelog for DevKinsta, so no release date is recorded. A public release-notes page, a changelog, or an installer URL with a Last-Modified header would settle it. The docs pages carry "Last updated" dates, which are page dates and are not release dates. The installation page states the platforms: Windows 10 64-bit (Pro, Enterprise or Education, build 16299 or later, or Windows 10 Home 1903 or later with WSL 2), macOS 12.0 or newer on Apple silicon or Intel hardware from 2010, and Ubuntu 20.04 LTS or later; other Debian-based distributions are not officially supported. The installation page's requirement table lists Docker Desktop minimum v2.0.0, preferred v4.17.0 or later, and Docker Engine minimum v2.0.0, preferred v2.5.0 or later on Ubuntu. The installation page value (macOS 12.0) is the one recorded; the FAQ page still says macOS 10.14 or newer. No open-source license is stated for the app. The Kinsta terms of service list DevKinsta local website development software among the Services; they do not state a license for the app, so license and licenseModel are unknown. The homepage states "Used by 60,000+ developers, web designers, and freelancers"; a user claim, not an install count, so it is not recorded. The public GitHub organization kinsta lists 65 repositories and none named for DevKinsta, so no repository is recorded; the homepage is the project's own page. The homepage and docs say the app pushes sites to Kinsta hosting: the hosting side is recorded as hostedOffering, with no prices.
