notes: >
  The README and docs name Self-Hosted SigNoz (Docker through Foundry, Linux with systemd, Kubernetes with Helm) and SigNoz Cloud; the docs say the open-source edition is "Self-Hosted Community" without a license. Enterprise Self-Hosted, BYOC and Enterprise Cloud are paid tiers; the SSO overview page says SAML 2.0 and OIDC are available on SigNoz Cloud and Enterprise Self-Hosted only (the same page lists Google Workspace OAuth2 as available on Community Edition, recorded as sso), and fine-grained RBAC (beta, needs an active license), custom retention, health monitoring and the Noz AI teammate are listed as enterprise or cloud features, so none of them is recorded as a self-hosted fact. The legacy install.sh and bundled Compose files are deprecated as of v0.130.0 and Foundry is the supported install path (docker install page). The license split is two statements: MIT for everything outside ee/ and cmd/enterprise/, and the SigNoz Enterprise License for ee/, both recorded above as worded. Stable release 0.148.1 is the latest; the last release candidate (v0.132.0-rc.2, 2026-07-01) is older than it, so no latestPrereleaseDate. The major is 0 (pre-1.0 semver line), the minor line 148 stays out of the field. The hqCountry comes from the privacy policy contact address (San Francisco, CA), recorded as the country of the company; the reviewer may want to confirm it against the terms. alternativeTo datadog and new-relic come from the opening sentences of the project's compare pages; the Grafana, Dynatrace and Dash0 compare pages carry no such sentence. Migration guides exist for Datadog, Grafana, ELK, New Relic and Honeycomb; roles VIEWER, EDITOR and ADMIN appear only on the SSO page's role-mapping line, and the Identity & Access docs apply to Cloud and licensed Enterprise Self-Hosted, so userRoles is not recorded. The API reference landing page and docs intro say "Programmatic access to your telemetry data" with no REST wording, so headlessApi stays out. Slack is a community link kept in notes. The homepage says "We've transitioned from Grafana to SigNoz", a statement about a user migration with no import tool named, so it is not an importsFrom fact. Coined kinds left out of fields: compliance (SOC 2 Type II and HIPAA on the pricing page, cloud), linkedin, the Slack community, (a separate repository). The API and OpenTelemetry-native ingestion through the 4317 and 4318 ports make it a wiring target for apps; the OTLP wording is the project's own. The docs list ClickHouse and PostgreSQL as installed components; language is listed for both TypeScript and Go from the GitHub language breakdown. No dockerPulls: the install docs do not name a single image. The LICENSE copyright line names SigNoz Inc. Not record fields: compatibleWith OTLP (https://signoz.io/docs/install/docker/).
