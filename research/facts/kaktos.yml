notes: |-
  The repository has no LICENSE file; GitHub's license API returns null, and the README names MIT and the copyright line, so the license is recorded from the README. The release list holds only rolling tags named main-<sha>, not version numbers, so currentMajor, firstRelease and latestReleaseDate are not recorded; lastCommitDate is recorded instead. The README names Frozen-Flask and Vite as tools the build invokes; neither is recorded as basedOn because the README states them as tools, not as a parent project. The homepage is the project's demo site, generated by Kaktos, and the README links further demo deployments on Netlify, Amplify and Render, which are not recorded. The README's deploy buttons are not recorded as installMethod. The contributor count is the single account on the repository.
   Per the README, "python3 kaktos.py" runs a development loop with LiveReload that rebuilds on each save, and "python3 kaktos.py serve" starts a web server for the build folder; the Python build runs Vite and Frozen-Flask, and the site UI is styled with Tailwind CSS.
