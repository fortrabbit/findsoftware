notes: >
  No project site: the repository names no homepage, and oapi-codegen.dev did not answer when checked on 2026-11-16, so the record is repository-only. The LICENSE file has no copyright line, so the maintainer is the GitHub organisation oapi-codegen as the README names it; the README says the project is maintained in two people's free time and links sponsorship pages for them, and their names are not recorded. The v2.8.2 README gives the Go requirement twice: the tool needs Go 1.25+ to build and install, and the generated code has lower requirements that depend on the server target (1.24+ or 1.25+ in the Supported Servers table at that tag), so runtimeMin follows the go.mod line at the tag. The Go module has no download figure, so no registry figure is recorded. The current major is the Go module path major v2; the v1 line starts with the 2019 tag and is in the same repository. Supported output targets (Chi, Echo, Echo v5, Fiber, Fiber v3, Gin, gorilla/mux, Iris and net/http) and the OpenAPI 3.0 and 3.1 support are coined kinds and stay in notes. The Go module path moved from the deepmap organisation at v2.3.0, as the README states; the earlier path is not an alternative and is not recorded. Blog posts and sponsorship pages in the README are not recorded as facts.
