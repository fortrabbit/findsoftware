notes: >
  Two version lines exist: the npm package elm-pages and the Elm package of the same name, which the README ties together with a Compatibility Key; currentMajor records the npm line that the install step uses, and the Elm package is at a different major. The getting-started page says elm-pages requires the Lamdera compiler, a superset of the Elm compiler, and that the starter installs it as an npm dev dependency. The page says elm-pages supports "all and only supported release lines of node" without a number, so runtimeMin stays unknown. Server-rendered routes run on a traditional server or a serverless provider, and the pages read do not say which process model applies, so runsAs lists only static, which the adapters page states for pre-rendered-only builds. The npm figures come from the elm-pages package the install step names. The GitHub repository has no release object, so latestReleaseDate comes from the npm registry.
