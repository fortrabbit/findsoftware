notes: >
  The Apache Software Foundation is the legal owner named in the NOTICE file ("Copyright 2017-2026 The Apache Software Foundation"); the maintainer follows the project's own name, and the foundation is recorded here, not as the maintainer. The project's own homepage and README name the agents for Java, .Net Core, PHP, NodeJS, Golang, LUA, Rust, C++, Client JavaScript and Python; the agents are the app-side wiring, coined as sdkLanguages and not recorded as a field. The Helm chart repository (apache/skywalking-helm) has its own docs page and is recorded as helm; the Kubernetes operator and the source build (README: Compiling project) carry no install sentence and are not recorded. The backend storage page lists BanyanDB, MySQL and PostgreSQL, and Elasticsearch and OpenSearch as pluggable storage; each is recorded from its sentence. The homepage links GitHub Discussions, a dev mailing list, a Slack invitation by mailing-list request, Bilibili and Juejin. The runtime requirement is stated for the binary distribution ("the binary distribution runs on any of these"). The OAP Java runtime requirement is recorded as the minimum for every route; the docs call Java 25 the default Docker image base. The LICENSE file is Apache License 2.0 with no copyright line; the NOTICE file gives the copyright. The first release is the 1.0-alpha1 prerelease tag (2015-12-31), prereleases included for firstRelease. The 11.0.0 release is the newest stable release on the releases API and no prerelease is newer. Coined kinds left out of fields: sdkLanguages, the Zipkin and Prometheus ingestion routes, the eBPF Rover agent, and the Slack invitation route. Not record fields: protocols gRPC (https://skywalking.apache.org/docs/main/v11.0.0/en/setup/backend/backend-setup/). compatibleWith OTLP (https://skywalking.apache.org/docs/main/v11.0.0/en/setup/backend/otlp-trace/).
