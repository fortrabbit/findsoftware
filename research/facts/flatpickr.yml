notes: >
  The repository is an organization (flatpickr) and the LICENSE copyright line names Gregory Petrosyan, so that name is recorded as maintainer. The npm package's author field names Gregory without a surname, and the repository has no other legal entity. The latest GitHub release and npm version are both 4.6.13, dated 2022-04-14; the repository was last pushed 2024-08-02. The release is more than four years before the check date, which the import's rule (AGENTS.md criterion 4) would move to stub; the status is kept as the candidates row has it, for the reviewer to decide. The Getting Started page gives npm and a jsDelivr script tag as the two install routes; the jsDelivr route is the sentence before the tags. The npm figure is the package the install page names, counted for the week. The homepage calls flatpickr a datetime picker that "doesn't depend on any libraries"; no page says in words that it runs in the browser, so no runsAs is recorded. The mobile support page says flatpickr "detects a mobile browser"; that describes behaviour, not where it runs. The README lists framework wrappers for React, Angular, Vue and others, and a jQuery plugin entry point on the Getting Started page; these are bindings, not basedOn statements. The first tag is v1.0, dated 2015-08-15; the repository was created 2015-08-10. The README compatibility line lists browser versions, which is compatibility, not a runtime. The repository language is TypeScript; the README does not name it.
