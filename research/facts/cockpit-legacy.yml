notes: >
  The repository README, on its next branch, opens by saying Cockpit's next iteration moved to a dedicated Cockpit organization on GitHub, which names the cockpit record as the successor. The status stays accepted: the README says development moved to a new repository and does not say this line has ended, is unmaintained or is replaced, a move to a new repository is not an end signal, the repository is not archived, and no package carries an abandoned or deprecated flag. The README heading calls the project Cockpit Next; the record keeps the CSV name. The repository has no GitHub releases; the latest tag 0.12.2 is dated by its commit on 2021-09-06, so currentMajor is 0 under the rule for a 0.x line. GitHub detects JavaScript as the language; the server requirements in the README are PHP, so no language fact is recorded. The README homepage link is http, the Cockpit site serves https; the record uses https. The agentejo/cockpit package is not on Packagist (404). The about page says Cockpit was open-sourced in 2013, and the agentejo/cockpit repository was created in October 2013, so firstRelease stays on this record. Coined fields: none.
