notes: >
  The record follows the project to its current home: the repository masonitedev/masonite, the PyPI package masonite-framework and the sites www.masonite.dev and docs.masonite.dev. The legacy repository MasoniteFramework/masonite and the PyPI package masonite (Masonite 4 and earlier) are marked deprecated in the new README and no longer receive updates; the move is not an end of the project. firstRelease is the first upload of the masonite package (2017-12-21); the docs state the framework was created in 2017. The homepage footer says the project is maintained by the community; the LICENSE copyright line names Masonite X Inc. and the README lists core maintainers. The README names Python 3.10 to 3.13 and the installation page the same range; the PyPI requires_python agrees. The star count is that of the new repository; the contributor count includes the history carried over. The ecosyste.ms dependent counts for masonite-framework are zero and are not recorded. The PyPI figure is the last-month count from pypistats. The ORM is a separate package (masonite-framework-orm).
