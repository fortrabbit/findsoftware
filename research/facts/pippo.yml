notes: >
  Installable with Maven from ro.pippo:pippo-core; the server page states it needs a Servlet container and that Jetty is the embedded server by default, Tomcat an option; not recorded as a field. The templates page lists Freemarker as the default engine with Jade, Groovy, Pebble, Trimou and Velocity as built-in alternatives, each its own pippo-<engine> artifact. GitHub has no release objects: the tags release-1.0.0 through release-1.14.0 are the releases, and currentMajor and latestReleaseDate come from the highest stable tag release-1.14.0 (commit 2023-02-05), which matches Maven Central's latest. firstRelease is the year of the oldest tag pippo-parent-0.1.0 (2014-10-30); Maven Central's first pippo-core upload is 0.4.0 in 2015. The last push is 2025-12-22. No maintainer legal name appears on the pages or in the pom beyond the parent name "Pippo Parent" and the site pippo.ro; no maintainer is recorded: neither the pom, the LICENSE nor a docs page names a person or organization, and the GitHub owner login is not a statement by the project. The mailing list is a Google Groups link over plain http and the Gitter badge in the README is a chat link; neither is recorded as a forum. Pages read: homepage, server, getting started, deployment, README, LICENSE, pom.xml.
