notes: >
  The package manifest names Node 18 for building the app and Electron as its shell; no runtime is recorded, since the app installs as a desktop application. The site footer reads "Copyright © 2019-present Alex Xu" while package.json names Pengfei Xu. The compare page also covers Docker, which has no matching record here. Operating systems: Windows (installer and portable .exe), macOS (Apple Silicon and Intel .dmg, and brew), Linux (.deb and .rpm, x64 and arm64), per the download page and the README. The download page says Windows builds are code-signed through SignPath Foundation; no field holds that. Two license statements disagree: the README and the LICENSE file say BSD 3-Clause, and package.json at v4.20.2 says MIT. Both are recorded as entries, the latest release is the source for both, and a reviewer must pick the one the record shows. The copyright line in LICENSE reads "Copyright (c) 2023, 徐鹏飞 (Pengfei Xu)"; the record uses the package.json author name. The first GitHub release is v4.0.0 (2024-07-29), and older tags v1.0.0 (2020-04-19 commit) to v3.x exist without releases; firstRelease uses the v1.0.0 tag commit date, so a reviewer may prefer 2024 from the release list. The product is a desktop application: it installs and runs runtimes and services on the operating system. The desktop app's dependency list includes electron ^39.8.10 in devDependencies, recorded only as a fact in this note, and no runtime value for it. The paid license sells premium features; the price is not recorded. The Chinese-language README and the README table comparing it with Laragon and Laravel Herd are not recorded as alternativeTo. The GitHub repository has a discussions board that is not a field. The download and license pages were read at the URLs above, and the release versions match v4.20.2 on GitHub.
