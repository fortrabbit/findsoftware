notes: >
  Operating systems: the download page offers macOS 12.0+ and Windows 10/11 or Windows Server 2012+ (the Windows build is v1.34.4, dated Oct 3, 2026); the intro page says "for macOS and Windows". Releases: the download page lists the stable macOS build v1.34.5 dated Oct 4, 2026 and the Windows build v1.34.4 dated Oct 3, 2026; the GitHub releases API dates v1.34.5 to 2026-10-03 (UTC). The release-notes page's newest entry is 1.33.0 and it is not updated to 1.34.x; the dates here come from the download page and the API. ServBay v2 is listed as "Coming Soon", so the current major is 1. The beta channel is v1.33.0-beta.26 (Sep 6, 2026) on the download page; it is older than the stable release and not recorded. The GitHub repository holds a README, translated READMEs and images, and no source code. The maintainer is the name the terms give ("the property of ServBay or its licensors"); no legal name, legal form or country is on the terms, privacy or homepage pages, so hqCountry stays unknown. The license is a proprietary statement from the terms page, which covers the services; the GitHub repository carries no license. The homepage nav links the Twitter and Facebook accounts, recorded as x and facebook. The paid plans are Pro and Team with prices on the homepage; no prices are recorded. The homepage claims "Trusted by over 100,000 developers worldwide" and shows "200,000+" beside "Install": the install count is not clearly labelled, so reportedInstalls stays unknown. The homepage also describes an MCP server, a free AI Gateway and local models as features; no field for them exists. The PHP, Node.js and database versions are packages the app installs, not the runtime of ServBay itself; runtime stays unknown.
