notes: >
  The maintainer is the copyright holder named in the MIT LICENSE, Philip O'Toole, who is an individual; the repository owner is the rqlite organization on GitHub, and the homepage footer names "rqlite authors" without a legal name, so the individual is recorded. No country is stated for him, so hqCountry is absent. basedOn sqlite is "built on SQLite", the project's words on the features page. The features page names Raft as the replication algorithm. firstRelease 2014 is the project's own "in development since 2014" statement on its design page; the oldest GitHub release is v2.0 (2016-04-09) and the repository was created 2014-08-23. currentMajor 10 is the v10.6.6 release (2026-10-28), the highest stable release tag. The install page's Chainguard FIPS and hardened images are built by a third party and are not recorded as install methods. The support page says rqlite "has been maintained by the same developer since 2014" and sells contracts, reviews and training; those are services, not a paid edition, so paidEdition is absent. The homepage says applications query it over plain HTTP and JSON with no drivers to install. The Google Group is the forum fact; the Slack invitation has no field. The FAQ answers "How is it different from" dqlite, Litestream and LiteFS, recorded as alternativeTo. The FAQ says rqlite is "distributed primarily for high availability and fault tolerance, not for performance", and that it is not a drop-in replacement for SQLite because writes must go through the HTTP API. Docker Hub count is the pull_count of rqlite/rqlite read 2026-10-30. Fields coined: none.
