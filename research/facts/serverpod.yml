notes: >
  The CSV homepage is the project's own https site, serverpod.dev, which answers 200 and is recorded. The repository has no GitHub release for the main package: the only GitHub releases are embedded-postgres builds, and the project's tags run from release-0.8.3 to release-1.1.1 with no date for the newest. The registry is the install source (pub.dev serverpod, with serverpod_cli installed by dart install), and its stable version 4.0.4 (2026-10-06) has a higher major than the GitHub tags, so currentMajor is 4 and latestReleaseDate is 2026-10-06. The newest pub version is 4.1.0-rc.1 (2026-10-23), a release candidate, recorded as latestPrereleaseDate; the main pubspec on master is the same 4.1.0-rc.1. The first pub upload is 0.8.0 (2021-05-19), two days before the GitHub repository was created, so firstRelease is 2021. The pub API gives no download figure, so no pubDownloads is recorded. The license is split: the GitHub API reports BSD-3-Clause for the repository, the README states that all packages are BSD-3 except the main serverpod package under SSPL, and packages/serverpod/LICENSE is the Server Side Public License; each statement is its own entry. The maintainer is Serverpod AB, named in CLA.md as the entity that makes the projects available; the CLA's Swedish governing law and court do not state headquarters, so hqCountry is not recorded. Serverpod Cloud is recorded as hostedOffering; its pricing page lists hosting plans and usage, which are not an edition, so paidEdition is not recorded. runsAs comes from the custom-hosting guide, which says the server listens on ports by default. The docs say the built-in web server is based on Relic and built on the Relic framework; that describes the web server only, so basedOn is not recorded. The runtimeMin is the minor of the Dart version bundled with the Flutter version the quickstart requires. The X, Bluesky and GitHub Discussions links on the homepage are href-only and carry no quote; the Discord link is the homepage's relative /discord link, recorded with its resolved address. Coined: none.
