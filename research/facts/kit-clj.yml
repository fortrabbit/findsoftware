notes: >
  The project has no GitHub release and no tag, so currentMajor and latestReleaseDate come from the Clojars artifact io.github.kit-clj/kit-core, the library the README names as the core lib; the Clojars page states the push date. The install command creates the project from the io.github.kit-clj/kit template, which the README lists beside the libs. The README says "integrant as the basis of the project" under its thanks section; it is recorded as basedOn because the project names the parent. The runtimeMin value "JDK 11" is in the import's runtime vocabulary only as jvm, so it stays unmapped until the importer knows JDK. firstRelease is the push date of kit-core 1.0.0 on its Clojars version page. The kit-core Clojars downloads figure is the library's total count across all versions. Kit's LICENSE names the "Kit framework team" with no individual, and the GitHub organization kit-clj is named as the repository owner. The docs site has no index page; the guestbook tutorial is the documentation page the homepage links to. The docs sidebar also lists an xtdb module, which the README describes as a binding to a XTDB database node; xtdb is not in the databases vocabulary, so it is left out.
