notes: >
  The homepage huma.rocks answers over HTTPS and serves the documentation; the repository is danielgtaylor/huma. The Go module is github.com/danielgtaylor/huma/v2, which has no download figure, so nothing is recorded for it. currentMajor is 2 from the highest stable release v2.39.1; the module's v1 line is not a current release. The oldest tag is v1.0.0 (2022-02-17), though the repository was created in 2020; firstRelease follows the tags. The LICENSE on main is LICENSE.md, and the GitHub license API reports MIT. The README links a Bump.sh tutorial and third-party posts only; no project-owned social or community link was found. The homepage carries a sponsor advertisement, which is not recorded.
