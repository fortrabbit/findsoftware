notes: >
  Uniform sells a hosted platform only; the MSA states SaaS use rights and the pricing page lists contract tiers (Lite, Professional, Enterprise, and a personalization and A/B testing package) with no free tier, only a trial account on request, and no prices are recorded here. The MSA (dated June 5, 2024, "Updated June 5th, 2024") names Uniform Systems, Inc. and gives a San Francisco, CA notice address without naming a country, so hqCountry is left unknown; the privacy policy and DPA name the same company and affiliates. Single sign-on appears on the Enterprise plan on the pricing page; the SSO page lists SAML 2.0 and inbound SCIM 2.0. The Siphon migration toolkit is licensed and provided separately from the platform subscription, per the Siphon page. The GitHub organization uniformdev holds 115 public repositories; the SDK and client code (for example @uniformdev/canvas, 20.87.0 at the time of reading, and its license) is recorded here only, not as the record's license, stars or downloads. The npm package @uniformdev/canvas had 21,747 downloads in the period 2026-10-26 to 2026-11-01 (api.npmjs.org range). Visual editing, Scout, Canvas, Mesh and Insights are product names on the docs and pricing pages; they are not fields. The homepage links the company's LinkedIn page; no field exists for it yet. The trust center at uniform.dev/trust redirects to a Drata page that answers 403 to this research agent, so security certifications are unread. The Gartner recognition on the homepage is a third-party claim and is not recorded.
