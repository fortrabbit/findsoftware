notes: >
  The GitHub repository marijnh/heckle is archived and its README says it "has been moved" to code.haverbeke.berlin/marijn/heckle, a move of the same project, so status stays accepted and the new home is the repository. The new host answers (Forgejo API: not archived, created 2026-03-17, default branch main) and its README matches the GitHub copy. The new repository has no license file and no releases, only the tag 0.2.0 from 2017. The candidate row marks it discontinued; the archived GitHub repository is a move, not an end, so the CSV status should become active. The README calls the project a work in progress that "may be radically changed or pitilessly abandoned at any time", which is a stability warning, not an end statement, so it is not a status fact. GitHub reports the license as NOASSERTION; the MIT terms are read from the LICENSE text. The GitHub release list is empty and the only tag is 0.2.0, so no release date, first release or major is recorded. The npm package named heckle (0.0.1, repository tmcw/heckle, 2022) is a different project and is not recorded. Stars and contributors are not recorded because the GitHub figures belong to the archived repository. The README describes the templating as Mold and reads "_posts", "_layouts" and "_includes" folders like Jekyll.
