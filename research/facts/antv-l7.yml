notes: >
  The GitHub repository is a pnpm monorepo (packages core, l7, layers, maps, scene, three, utils and others); its stars and contributors belong to the monorepo, and the npm figure is the core package @antv/l7 that the install page names. The @antv/l7-maps basemap package is a companion the README names and is not a separate record. The English README says the library is WebGL-powered and renders 2D and 3D layers; the base maps are third-party services (Mapbox, Amap) the README names. No page states that the library runs in the browser in those words, so runsAs is left out for the reviewer. The root README is Chinese; the English one is README.en-US.md. The registry stable 2.29.1 (2026-07-13) is newer than the last GitHub release object v2.22.5 (2025-03-11) and is recorded as the latest release; the 2.30.0-beta.1 prerelease (2026-07-30) is recorded as latestPrereleaseDate. The first release year comes from the npm 1.0.0 upload of 2018-11-20; the repository was created 2018-11-21. The maintainer is the LICENSE copyright line, AntV team; the site footer names Ant Group Co., Ltd. as copyright holder and that is recorded as parent. The site footer gives no country or full address, so hqCountry is left out. The npm weekly figure is the sum of daily downloads for 2026-10-26 to 2026-11-01. The repository owner is an organization.
