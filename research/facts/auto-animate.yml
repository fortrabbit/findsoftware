notes: >
  The homepage says AutoAnimate takes a parent element and animates its immediate children, can be applied to existing markup including third-party code, and that its three triggers are a child added, removed or moved. Framework-agnostic core: the README says "You can use it with Vue, React, Solid or any other JavaScript application", so basedOn is empty. Official bindings named on the homepage: React (useAutoAnimate hook), Vue (v-auto-animate directive, useAutoAnimate composable, Nuxt module), Preact, Solid, Svelte, Angular and Marko, each on its own import path under @formkit/auto-animate. Runtime is not stated: the homepage says Marko's plugin functions are a client-only path under SSR, which is one binding's detail, so runsAs is left out. Maintainer per the terms page is FormKit, Inc.; the LICENSE reads "Copyright 2022 FormKit Inc.". The privacy page gives a Charlottesville, VA address and calls the company a Delaware corporation headquartered in Virginia, with no country named, so hqCountry is left out. The homepage shows Discord and Twitter as icon links without visible text; the facts take their URLs from the link targets. Stars and contributors belong to this repository alone.
