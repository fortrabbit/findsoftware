notes: >
  The current major is 10: 10.2.0 is the highest stable release. The 11.0.0-M1 milestone (2026-07-02) is a prerelease older than the latest release, so no latestPrereleaseDate is recorded; the downloads page calls it a milestone not for production. The Web Profile, MicroProfile, Plus and Plume flavors are all open source downloads; no paid edition is named. The download page's security notice says the software is maintained by unpaid volunteers with no guarantee that vulnerabilities get fixed; it is not recorded as a status fact. The NOTICE names the CDDL for schema files included from Glassfish; the version is not stated, so the value is CDDL. The firstRelease 2011 is the TomEE 1.0.0-beta-1 "plus" row in the project's download archive, dated 2 Oct 2011; the reviewer may check the archive for an earlier TomEE row. The install page on the site is an old OpenEJB Eclipse instruction and is not used. The Docker build in the README is a build route, not a published image, so no dockerPulls. The Maven plugin named in the README is a build artifact of the project, not an install route, so no mavenCoordinates. The homepage counts 100 contributors and the API count is 133; the API count is recorded. Fields coined here: none.
