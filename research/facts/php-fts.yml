notes: >
  The GitHub homepage field points to the Packagist package, not to a project site, so no homepage is recorded. The project has no site; the README and repository are its only pages. The LICENSE and composer.json name the author only as Olivier, with no legal name or country. The Packagist total is 29 downloads and 3 in the last month, as the package page states. The README says the library is for projects where a dedicated search service is not an option and names Elasticsearch, Meilisearch and Typesense as alternatives; this is not recorded as an alternativeTo fact because it is a recommendation, not a factual relationship. The 2.0.0 release is a rewrite: the README says a 1.x index cannot be opened by 2.x. The 1.x releases (1.1.4 as a GitHub release, 1.0.0 as a tag and Packagist version) are not the latest line. The README says the library has no extensions, no external services and no dependencies. The README says to keep the index directory outside the web root, because documents are stored in it in readable form. The README says the index is not for millions of documents and that writes are one writer at a time; these limits are not recorded as fields. The Packagist page lists the release date of 1.0.0 on 2026-05-06, the same day as the repository creation. The README claims 26 writing systems; this is search behaviour, not an i18n field.
