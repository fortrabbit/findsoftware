notes: >
  The install docs name create-sphido, a scaffolder, so the npm figures come from its core package @sphido/core, as the import rule requires; the scaffolder itself had 7 downloads in the same week and is not recorded. The site has no imprint or legal notice; the maintainer is the copyright holder in the repository LICENSE, which matches the npm author field of @sphido/core. The project is a monorepo of packages (core, markdown, frontmatter, sitemap, feed, dev server and others); the record covers the monorepo through the core package. The homepage and create page say the generator writes the site into public/; runsAs records only the build step the create page shows; no page says the output is served as static files. The repository created_at is 2018-09-28 and the npm version history starts 2019; neither is stated as a first release, so firstRelease stays unknown. currentMajor follows the GitHub release v4.1.1, while npm latest of @sphido/core is 3.1.1. The npm downloads figure covers 2026-10-12 to 2026-10-18.
