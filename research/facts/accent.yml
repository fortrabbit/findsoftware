notes: >
  Accent has no GitHub release, only tags; the newest stable tag is v1.32.1, dated by its commit (2026-10-16), and it is recorded as latestReleaseDate. The oldest tag v0.0.2 has a commit date of 2019-01-11, and firstRelease uses it, since the repository was created in 2018 and the changelog gives no early dates. The web app is wired into a translated app through the accent-cli npm package, which the getting-started guide installs with npm install -g accent-cli; its weekly downloads are recorded as the npm figure, and they count the CLI client, not the server. The GraphQL API that powers the UI is documented and open, per the README; it is not recorded as headlessApi because Accent is not a headless CMS. The README links the Gitter chat and a demo instance at accent-demo.fly.dev, which is for demonstration only according to the site. The license file names Mirego for the copyright years 2015 to 2018, and the Mirego site lists Canadian office addresses, so hqCountry follows the office addresses. runtimeMin is the Erlang requirement in the README at the latest tag; its elixir ~> 1.15 line differs from mix.exs at the tag (~> 1.19) and is not recorded, and the Dockerfile builds with a newer OTP. The language is recorded as Elixir from mix.exs; the GitHub language field reports TypeScript for the web client and the CLI.
