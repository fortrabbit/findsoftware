notes: >
  The homepage typeitjs.com redirects to www.typeitjs.com and, with the docs at typeitjs.com/docs, answered 503 with a usage limit message on 2026-11-16, so neither was read; the README names the docs there as the only place the documentation lives, and the homepage address comes from the GitHub repository field and the npm package. A package published on a registry counts as a documented install route, so the npm entry cites the registry document; the README has no install section, and its feature list says the library is offered as an ES module for modern bundlers and as a UMD build for script tags, which is the script tag entry. The repository is a monorepo: packages/typeit is the vanilla library and packages/typeit-react is a React wrapper with its own npm package; stars, contributors and the repository's tags belong to the monorepo. The React wrapper is not a basedOn statement for typeit. Licenses: the GitHub license file is the GPL-3.0 text with no copyright line; the README names a free GPL use for open source and personal projects and a paid license for commercial use, recorded as a second entry; the paid licenses differ in scope, so no paidEdition. The npm dist-tag next (7.0.0-rc14) dates from 2020, older than the latest stable, so no latestPrereleaseDate. The repository has no end signal: not archived, the npm latest is not deprecated. The maintainer comes from the package.json author field, since the GPL file has no copyright line. The README's feature list also names starting the effect when the target element becomes visible, looping, strings defined in the HTML as a fallback without JavaScript, and nested HTML tags with their attributes preserved.
