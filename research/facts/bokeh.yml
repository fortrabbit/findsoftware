notes: >
  Boundary ruling: accepted because the homepage and the README describe Bokeh as a library for plots that run "in modern web browsers", and the output pages say the result is HTML or static files. A reviewer should confirm this reading for the Python plotting group. The homepage is https://bokeh.org and answers without redirect. The documentation says Bokeh is a fiscally sponsored project of NumFOCUS; the foundation is not recorded as maintainer. The LICENSE copyright line names "Anaconda, Inc., and Bokeh Contributors"; no page reached gives Anaconda's country, so hqCountry is not recorded. The default branch is branch-4.0; GitHub has no releases object, so the stable and prerelease dates come from PyPI. The newest stable version is 3.10.1 (2026-10-13) and the newest prerelease 3.10.2rc1 (2026-10-26). Stars and contributors belong to the repository, which holds the library itself. The server quote on the deployment page states the process model, so runsAs is always-on for Bokeh server applications; the library's static output is recorded as renderingModes.
