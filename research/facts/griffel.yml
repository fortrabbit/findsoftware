notes: >
  The repository has no GitHub releases and no tags, so currentMajor and latestReleaseDate come from the npm registry, latest version 1.7.8, the registry fallback. The first npm version is 1.0.0 dated 2022-01-20. The homepage banner reads "For React.js" and the README has a "Griffel with React" section, which is the basis for basedOn React. Griffel is a runtime engine by default and can also run at build time through webpack and Vite transforms, per the install page; no page states a runsAs value. hqCountry is not read: the Microsoft privacy statement the homepage links was not opened. The page at griffel.js.org/react/getting-started answers 404, and the install page was read in its place. The package named by the install page is @griffel/react; the core package is not separately named there. The CSV boundary decision of 2026-10-19 placed styling tooling in scope.
