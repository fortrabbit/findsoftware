notes: >
  The project's own website is the only documentation source the README names, and it returned a bot check, so every fact comes from the repository (README, composer.json, install.php, COPYING, the GitHub API). The website's install, plugin and forum pages were not read; a reviewer should check them by hand before the record is published. DokuWiki names its releases by date (release-2026-07-14c, "Mort" [57.3]) and has no major version, so currentMajor is not recorded. The copyright line gives 2004 as the start of the project, which is not a first release, so firstRelease is not recorded. The composer.json license is "GPL v2" and the GitHub license is GPL-2.0; both name the same license, so one fact is recorded. contentStore comes from the repository's data/ directory (data/pages and data/media), which the API listing shows. Contributor count is the sum of the paginated GitHub API lists.
