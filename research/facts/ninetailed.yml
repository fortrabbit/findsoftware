notes: >
  Doubt first: it is not settled whether Ninetailed is still sold as its own product or was folded into Contentful Personalization, so the record stays a stub until a readable page settles it. ninetailed.io answers 308 to https://www.contentful.com/products/personalization/ and docs.ninetailed.io answers 308 to https://www.contentful.com/help/personalization/ (both read 2026-11-04). Every contentful.com page answered HTTP 429 to the research user agent, so neither target could be read, and no Ninetailed page states the merger. The parent fact rests on the redirect alone; a readable Contentful or Ninetailed statement would settle it. No homepage and no docs are recorded because the project's own site and docs now redirect to another company's pages. The repository ninetailed-inc/experience.js is the SDK repository: its license (MIT), copyright line (Copyright 2024 Ninetailed GmbH), stars, the npm package @ninetailed/experience.js and the repository's activity go to these notes only, per the hosted-service rule. The SDK README describes the repository as Ninetailed's plugins and SDKs for JavaScript, Node.js, React and Next.js. Maintainer and hqCountry are not recorded: the imprint of ninetailed.io was not readable, and the SDK license line is not a company statement for the service.
