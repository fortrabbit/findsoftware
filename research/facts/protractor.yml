notes: >
  Three end signals agree. The homepage says "Protractor is deprecated and will reach end-of-life in August 2023." and "Protractor reached end-of-life in August 2023.", and asks new users not to adopt it: "We discourage any new users from adopting Protractor and recommend existing users migrate to other end-to-end testing solutions." The repository angular/protractor is archived (GitHub API archived true, last push 2023-05-24). The npm latest version 7.0.0 carries a deprecation message: "Protractor is deprecated and will reach end-of-life by Summer 2023." The migration sentence names no tool, so alternativeTo is not recorded. The GitHub release object that is newest is 5.4.3 (2020-01-31), but the tag 7.0.0 has no release object and the npm latest is 7.0.0 (2020-05-13), so currentMajor is 7 and latestReleaseDate is the npm date. The CSV homepage is plain http; https answers 200 and is recorded. The README says Protractor is a Node.js program built on top of WebDriverJS, a Selenium component that is not a record; the install route and the Node.js runtime come from the setup docs and README in the repository, because the docs site is a single-page app with no static text. The setup doc's Node.js floor and the README's compatibility line describe old versions, so runtimeMin is not recorded. The README points questions to Stack Overflow, a Gitter chat room and the Angular discussion group, which is a general Angular group, so no forum is recorded. Maintainer is the copyright holder in the LICENSE file, Google, Inc., as the project states it.
