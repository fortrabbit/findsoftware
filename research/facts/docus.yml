notes: >
  Docus is a monorepo (cli, layer and docs packages, per the README), so the npm figures come from the docus layer package, which create-docus scaffolds the user project around. Nuxt Studio, an editor for Nuxt Content sites that the Docus migration page names as self-hosted, is a separate product and not part of this record. The README says Docus was rewritten from scratch and is inspired by undocs, which is recorded as no relationship. Rendering mode and runsAs are not stated on the pages read, so they stay unknown. Pages read: the homepage, the installation, introduction, migration and project structure pages at docus.dev/en, and the README. The installation page describes Docus as a Nuxt layer: a project adds extends: ['docus'] to its nuxt.config.ts. The homepage lists Markdown content extended with MDC syntax for Vue components, navigation generated from the content structure, and full-text search.
