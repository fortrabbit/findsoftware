notes: >
  The homepage is recorded as the https address; bottlepy.org answers over http with a redirect to https, and the docs site is the page read. The PyPI JSON API returns no download counts, so pypiDownloads comes from the pypistats recent endpoint, last month. Maintainer is Marcel Hellkamp as the LICENSE copyright line names him; the project is maintained by the community per its docs, which is not recorded as a maintainer. The first upload is 0.4.3 on PyPI (2009-07-07), older than the first GitHub release. The major version is 0 because the highest stable GitHub release is 0.13.4 (2025-06-15). The Python support matrix in the docs lists a minimum of 3.8 for the 0.13 line, the line of the latest release. The deployment page lists the CGI adapter and the built-in development server, and both are recorded as runsAs values.
