notes: >
  Simple.css is a CSS file, so it has no runtime and no runsAs. The GitHub repository reports HTML as its language; the package ships CSS, so the language is recorded as CSS. firstRelease is the first upload of the npm package simpledotcss (2021-02-25), older than the first GitHub release v1.1.2 (2022-01-17). The homepage footer has two hidden rel=me Mastodon links (fosstodon.org/@kev and fosstodon.org/@purecommons) and neither carries a label saying which one belongs to the project, so no mastodon fact is recorded. The npm figure is the sum of the daily counts from the npm downloads range endpoint for 2026-10-19 to 2026-10-25. The package simple.css on npm is a different registry name and is not used. The homepage footer also links Buy Me A Coffee and Ko-fi; these are donation links and are not recorded.
