notes: >
  Accepted on the boundary question: DuckDB-Wasm is a JavaScript and WebAssembly build that web applications embed (the wasm overview says it is "embedded as a JavaScript + WebAssembly library"), so the project is used to build web apps; the record stays in on that basis, which a reviewer should confirm. The core engine is an embedded library, so no runtime is recorded: the Python client needs Python and the Node client needs Node.js, and the browser build needs a browser, and the docs name no single runtime for the whole project. The npm figure counts the Node.js client package named in the install page, not the wasm package; the wasm package's figure is not recorded. The Docker Hub figure is for the duckdb/duckdb image the install page names. The LICENSE copyright line and the foundation page both name the Stichting DuckDB Foundation; the foundation page says the Foundation holds the core intellectual property and trademarks of DuckDB, DuckLake and Quack. DuckLake and Quack are named on the homepage as sibling projects and are not records here. The homepage's http address redirects to https; https is recorded. The docs URL carries the 2.0 line, the current major. The 2019 firstRelease is the oldest GitHub release (v0.1.0), which the release list marks as a prerelease. Fields coined here: none.
