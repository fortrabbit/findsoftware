notes: >
  The license is stated two ways. The LICENSE.txt file names a triple license (AGPLv3 only, SSPL v1, Elastic License 2.0) as the default for the repository, and Elastic License 2.0 alone for code in the x-pack folder. GitHub reports the license as Other (NOASSERTION), so the API value is not recorded. The homepage calls it open source; the license file's triple license is recorded as the statement of terms. The endoflife.date entry lists 9.5 as the current cycle with 9.5.5 as the latest release; the latest release date is from the GitHub release v9.5.5. The hostedService field is coined here for Elastic Cloud beside the self-hosted server.
