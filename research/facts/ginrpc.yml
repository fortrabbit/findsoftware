notes: >
  The repository has no GitHub release or tag. The only published version is v1.0.0 on the Go module proxy (github.com/xxjwxc/ginrpc, uploaded 2019-08-05), so currentMajor, firstRelease and latestReleaseDate come from the proxy; the module has no download figure. The repository was last pushed 2025-11-20 and its newest commit on master is dated 2025-07-05; lastCommitDate is recorded from it, as the only dated sign of activity next to the 2019 module release. The repository homepage field points to a blog post on a personal site (xxjwxc.github.io/post/ginrpc/), a Chinese-language article by an author named there as xiexiaojun, not a project site, so no homepage is recorded. The README calls the project an automatic parameter binding tool for go-gin and says it is "base on" go-gin; the module is an add-on to Gin rather than a standalone framework, and categories follow the CSV's api-framework value. The CSV scope note marks it as widened from boundary to accepted for an add-on of Gin; AGENTS.md leaves general-purpose plugins out unless they turn the parent into another kind of software. The README documents Swagger and Markdown export through ginrpc.WithOutDoc and gRPC-style handlers returning a response and an error. The README's examples point to the gmsec project for a full demo; that project is not a source for facts here.
