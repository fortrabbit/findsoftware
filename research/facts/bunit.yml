notes: >
  The homepage's GitHub link (github.com/egil/bunit) and the docs' discussion and Gitter links still use the old egil account; GitHub redirects them to bUnit-dev, so the current organization is recorded. The NuGet project URL (bunit.egilhansen.com) is an older domain, and the homepage at bunit.dev is recorded instead. The LICENSE copyright line reads "Copyright (c) .NET Foundation and Contributors", and the docs say the project is "Supported by the .NET Foundation"; the .NET Foundation is a foundation, so per the wave 46 rule it is kept out of the maintainer field and the shared build properties file (src/Directory.Build.props) names Egil Hansen as the company, and that is recorded instead. The homepage links the maintainer's personal Twitter account; it is not the project's own, so x is absent. The docs also link a bUnit Gitter chat room (gitter.im/egil/bunit), a chat and not a forum, so no field is recorded. The NuGet search index reported version 1.40.0 at the time of the check, while the NuGet registration index lists 2.13.3 published 2026-10-25 as the newest version; the registration index and the GitHub release agree on 2.13.3. The NuGet total of 20,862,267 downloads is the search index total. The GitHub tag history starts with 0.1.0-preview7 (2019-08-06), so firstRelease is 2019. The docs say the test framework is xUnit, NUnit, MSTest or TUnit and that bUnit is no test runner; those are described in prose only. The README's Blazor wording describes the subject ("a testing library for Blazor components") and names no parent, so basedOn is absent. The sponsor logos are not an edition. The bunit.template package is a dotnet new project template that creates a test project for xUnit, xUnit v3, NUnit or MSTest (no template for TUnit), recorded as its own installMethod; the bunit.generators and bunit.web.query packages are companion packages the README lists, not separate records. The homepage and README say bUnit builds on top of existing unit testing frameworks such as xUnit, NUnit, MSTest and TUnit; none has a record, so basedOn stays empty. The docs' compatibility statement is "bUnit works with net8.0 and above as well", and the README matrix lists 2.x for .NET 8 and above, which agrees with the csproj target frameworks at v2.13.3.
