notes: >
  The repository is a monorepo; the npm package theme-ui is the core package at packages/theme-ui, which the README and install page name. The GitHub release tags v0.x are the theme-ui package; the highest stable is v0.17.4, so currentMajor is 0. The npm dist-tag latest is 0.17.4. The develop prerelease v0.17.5-develop.1 (2026-03-05) is the newest prerelease. The README says the project is "the next evolution of Styled System" and works with Styled System components; no Styled System record exists, so the relation is not a field. The README names Gatsby as a use and a Gatsby plugin package; the plugin is not a basedOn statement. The peer dependencies at packages/theme-ui/package.json are react >=18 and @emotion/react >=11.1.1; the README names React JSX and the install line names @emotion/react. The README says the library is built with Emotion for scoped styles. The first upload on npm is 0.0.0-0 (2019-04-02) and the first real version 0.0.1 is 2019-04-10; the first GitHub tag is v0.6.1 (2021), older tags are absent. The license in LICENSE.md and the README is the same MIT license. The HTTP Archive technology list has no Theme UI entry. The Discord link https://discord.gg/theme-ui is the target of the README badge whose alt text reads "Join our Discord community". The getting-started page shows wrapping the app in ThemeUIProvider with a theme object, and enabling the sx prop with a jsxImportSource comment at the top of a file or a jsxImportSource setting in the Babel config. A React statement comes from the repository description; the package peer dependency react is not a basedOn statement.
