notes: >
  The homepage is https://mochajs.org/, which answers over https. The LICENSE names "OpenJS Foundation and contributors" as the copyright holder, and the README says Mocha is "an independent open-source project, maintained exclusively by volunteers" and gives the copyright as "2011-2026 OpenJS Foundation and contributors". The maintainer follows the LICENSE line, so the OpenJS Foundation is recorded; a reviewer decides whether the README's independence statement means the project should be recorded as maintained by its volunteers instead. The getting started page states that as of v12.0.0 Mocha requires Node.js "^20.19.0 || >=22.12.0". Because the project runs in the browser as well, that Node.js minimum is a build requirement and gets no runtimeMin, per the dev-libs rule; runtime node comes from the sentence naming Node.js. The getting started page shows describe and it blocks in a test file, the npx mocha command and a package.json test script. The README's Discord badge carries the Discord link; the homepage nav repeats it. The npm figure counts the mocha package the getting started page names. The first release year comes from the first npm upload, 0.0.1-alpha1, dated 2011, and the oldest git tag of the same name is from the same year. The README's claim that Mocha is one of the most depended-upon npm modules cites libraries.io and is a third-party statement, so no dependents figure is recorded. The rc tags on the release list are prereleases and do not set the current major.
