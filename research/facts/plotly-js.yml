notes: >
  The npm figure is for plotly.js-dist-min, the package the README names for npm installs; the plotly.js package itself had 1009099 downloads for 2026-11-01 to 2026-11-07, recorded here only as a note because the install route names the dist package. The first upload of the plotly.js npm package is 1.0.0 on 2015-11-17, the same day as the first GitHub tag. The LICENSE.txt copyright line runs 2016-2024; the README's footer line says "Code and documentation copyright 2025 Plotly, Inc.", so the legal entity Plotly Technologies Inc. comes from the LICENSE line and the README name is noted here. The README says plotly.js also powers the Python and R modules named plotly, which are separate records. The rendering target is SVG, and the README names WebGL for 3D graphs; those are notes, not fields. The README says MathJax v3 or v4 can render math in plots when loaded separately. The forum link is the plotly-js category of the Plotly community forum, a general forum of the vendor, and a reviewer decides whether it counts as the project forum. The homepage at plotly.com/javascript lists Plotly Studio and Plotly Cloud links, which are hosted products and not recorded. The CDN route is https://cdn.plot.ly; the README shows it in its script examples.
  The README says a figure is drawn with the newPlot method from data and layout objects into a div element, and lists statistical, 3D, scientific, SVG and tile map, and financial chart types. The dist README says the standard bundle includes en-US and British English and that other localizations are separate files loaded after the script tag, which is the i18n statement. The README's text on loading in node.js is the runtime statement; the plotly.js package declares a Node engines minimum, but the package the install docs name, plotly.js-dist-min, declares none, so no runtimeMin is recorded. The README says MathJax is not included in the bundle and must be loaded separately. The README also describes custom bundles (CUSTOM_BUNDLE.md) and a build from source (BUILDING.md); these are not recorded as routes. The CDN statement sits in the README's bundles section.
