notes: >
  The install route is the composer require command under the Installation section of the other-frameworks page, recorded as the quote for the Composer route. The docs root https://graphqlite.thecodingmachine.io/ answers with a script shell that shows only navigation, so the /docs page is recorded as the homepage. The repository has 35 GitHub releases from v3.0.0 (2019-04-26) to v8.3.1 (2026-07-16), none flagged as prerelease; the repository was created 2019-01-29, which sets firstRelease. The current major is 8, from v8.3.1, the highest stable release. The Packagist package has the same name and the 8.3.x line requires PHP >=8.2 in composer.json at the tag. The README and docs say GraphQLite "relies on the webonyx/graphql-php library internally", and composer.json requires webonyx/graphql-php ^v15.0; that is a dependency, not a statement that GraphQLite is built on it, so basedOn is absent (the graphql-php candidate row exists in the dev-libs CSV). The Symfony and Laravel integrations are separate repositories (graphqlite-bundle, graphqlite-laravel) and are not basedOn. The docs say the library is framework agnostic and names PSR-11 and PSR-16 requirements, which are not fields. The GitHub language field reads MDX because of the docs site; the PHP value comes from composer.json. The legal notice gives "TheCodingMachine SAS" at 29 rue des Pyramides, 75001 Paris, and a French VAT number; the LICENSE line names "TheCodingMachine" without a legal form, so the record keeps that name and takes the country from the legal notice of the same brand (reviewer decision). The GitHub Discussions link in the README is recorded as forum. The package description on Packagist says the library is written "(using webonyx/graphql-php)"; the same dependency sentence, not a basedOn statement.
