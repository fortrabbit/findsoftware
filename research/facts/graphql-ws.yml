notes: >
  The repository is owned by a personal account (enisdenjo) and the LICENSE copyright line names Denis Badurina, so that is the maintainer. The homepage https://the-guild.dev/graphql/ws is a page on the site of The Guild, and the homepage says the library is "Part of the Hive ecosystem by The Guild"; no page says The Guild maintains the repository, so no company maintainer is recorded. The footer X and newsletter links are the company's, as on the GraphQL Tools record. The Guild footer's shared Discord invite is not recorded. The README calls the library "GraphQL over WebSocket Protocol compliant"; the protocol is a specification, named in notes and not basedOn. The README's disclaimer says the library is not cross-compatible with the deprecated subscriptions-transport-ws; that package has no record, so alternativeTo and importsFrom are absent. The get-started page names the WebSocket servers it has adapters for (ws, uWebSockets.js, Fastify, Bun, Deno, crossws) and a server it starts inside the app, so no runsAs is recorded: the library runs inside the application's own process. The install tabs name npm, yarn, pnpm and bun for the same registry; the record names npm as the one route, quoting the npm command. The GitHub release objects run from v0.0.1 (2020-07-29) to v6.4.1 (2026-10-15) with no prerelease flag; the npm alpha and rc tags are per-commit builds and older than the stable line, so latestPrereleaseDate is absent. The npm figure is the sum of the daily downloads for 2026-11-01 to 2026-11-07. The ecosyste.ms counts are read on 2026-11-09. The contributors figure is the rel="last" page number at one per page.
