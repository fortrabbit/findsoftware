notes: >
  The README describes Blitz as "The Missing Fullstack Toolkit for Next.js" and the homepage says "Blitz picks up where Next.js leaves off, providing battle-tested libraries and conventions for shipping and scaling world wide applications.", so basedOn is Next.js. The homepage names Blitz RPC ("Read and write data from the client with full typesafety and without messing with HTTP or serialization") and authentication ("Easily add social third party integrations like Google, Github") ; neither is a field here. The homepage also says "Prisma is the default database client". The getting-started page gives "blitz new myAppName" to create an app, and the docs page "Add Blitz.js to an Existing Next.js Project" names the @blitzjs/next package for an existing Next.js app. The GitHub release 3.0.2 is the latest release and the npm latest tag matches it. The README holds sponsor and contributor lists only; no maintenance status is stated there. The LICENSE copyright line names Blitz Revolution Inc., while the docs footer reads "Copyright © 2024 Brandon Bayer and Blitz.js Contributors"; maintainer follows the LICENSE. The npm package blitz is the one the README installs with npm install -g blitz.
