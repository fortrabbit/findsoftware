notes: >
  Boundary question from the CSV: GitHub holds only v2.0.0 release candidates (v2.0.0-rc.1 to rc.88, the newest on 2026-07-24), and the default branch is rc. The newest stable release is 1.37.8 on npm, dated 2022-12-01, so currentMajor is 1; v2.0.0 has no stable release yet. The record stays accepted because the stable line is on npm and prerelease activity falls inside four years. The repository is a monorepo: the install docs name the npm package @master/css, which the figures use. The docs page states "v 1.37.8 v2.0 release candidate is now available". The 1.x runtime is not stated; the docs show server rendering with an Express example but name no runtime version. runsAs browser comes from the docs' browser support paragraph, which says generated CSS is injected into the browser. The homepage links GitHub Discussions, recorded as forum. The README says the enhanced syntax is inspired by Sass and TypeScript; that is not a basedOn statement. The homepage shows a sample product price and the docs link to sponsor and donate pages; no prices and no paid edition were recorded. The npm package named master-css (1.4.5) is a different project by other authors and is not used. The footer and LICENSE give the maintainer as Aoyue Design LLC; the npm author is the same company.
