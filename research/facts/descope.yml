notes: The record covers the hosted Descope service, which the pricing page sells in plan tiers (Free Forever, Pro, Growth, Enterprise) without prices recorded here; plan tiers are not a paid edition. The SDK repository github.com/descope/descope-js (MIT) and npm @descope/web-js-sdk go to notes only, per the hosted rule. The GitHub organization github.com/descope publishes client, backend and mobile SDKs; none of them is the service and none is recorded. The pricing page lists "Custom deployments" on the Enterprise plan; no page read gives a self-install, so selfHostOption is not recorded and the status stays hosted-service. The pricing page states usage units such as monthly active users, active tenants and SSO connections. Fine-grained authorization (FGA), SCIM and audit features appear on the pricing page; only the protocol statements with quotes are recorded. The homepage footer links the community Slack and LinkedIn (linkedin.com/company/descope), not recorded as fields. The legal name and Delaware incorporation come from the terms page, and the headquarters country from the privacy notice. The migration guides list Shopify and a custom data store as further sources; importsFrom names only providers.
