notes: >
  The highest stable GitHub release is v1.9.0 (published 2024-09-24), so currentMajor is 1. The npm package solid-js is at 1.9.17 (published 2026-10-07), recorded as latestReleaseDate from the registry. The 2.0.0 line is in release candidates on GitHub and npm (rc.17 on 2026-10-22), recorded as latestPrereleaseDate and not as the major. The queue row tags the project ui-library; the docs call it a framework, so the categories field follows the docs. The package create-solid scaffolds a project and can add SolidStart, the full-stack framework, which has its own docs and is not recorded here. The docs list hosting platforms under deployment options for SolidStart; none are recorded for the library. The quick start prerequisite names Node.js, Bun or Deno for creating a project; that is a development tool requirement and is not recorded as runtime, which follows the README's browser and server support statements. Cloudflare Workers, also named there, is not a value in the runtime list. The maintainer is the copyright holder in the LICENSE file. firstRelease is the year of the first npm publish.
