notes: >
  Current major line is v0.5.x per the homepage ("v0.5.x - Latest"); v0.3.14 is marked "Previous" on the same page and a v0.3.x patch (v0.3.14, 2026-03-26) was released after v0.5.10. The homepage version label is the 0.5 minor line; currentMajor records 0, the major of the tag v0.5.17. The GitHub API reports the license as Apache-2.0 and the LICENSE text is the Apache License 2.0; no second license statement was found. The source is Go, and the source build page requires Go 1.25 or later (the go.mod at v0.5.17 says "go 1.25.0"); runtimeMin is not recorded because the runtime is a binary. The Go library (github.com/benbjohnson/litestream) is documented as an embeddable API that is "not considered stable"; it is not a separate install entry. The maintainer is the GitHub owner: the homepage, docs and LICENSE name no person or legal entity (the LICENSE copyright line is the template placeholder). The homepage X link is twitter.com/litestreamio. The tips page states that Litestream only works with SQLite's WAL journaling mode and that the application needs a busy timeout, because Litestream takes short write locks while it checkpoints; the how-it-works page says Litestream runs as a separate background process. The VFS extension and the Kubernetes, systemd, Docker and Windows service guides describe deployment shapes; no hosted offering is named on the pages read. Docker Hub repository counts are for litestream/litestream, the image the Docker guide names. The docs field points to the getting started guide because the site has no separate docs domain. Fields coined here: none. The alternatives page also names rqlite, dqlite, Verneuil and LiteReplica, which have no record here.
