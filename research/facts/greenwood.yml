notes: >
  The hosting page names AWS, Cloudflare, GitHub, Netlify and Vercel as deploy targets, with adapter plugins for serverless SSR; no hosted service of the project's own is stated. The npm weekly figure for @greenwood/cli (540, 2026-10-12 to 2026-10-18) differs from the queue row (1.7k per week); the figure here is the one the registry returns now. The npm dist-tag alpha points at 0.35.0-alpha.3, matching the newest GitHub prerelease. runsAs static rests on the hosting page's static hosting paragraph; always-on on its self-host steps. The Ecosystem menu lists Lit, Tailwind and similar tools as integrations, not as basedOn. Maintainer is the copyright line of the LICENSE.md.
