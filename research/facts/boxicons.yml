notes: >
  The current product is version 3, stated on the docs pages (footer "Current version: v 3.0.8"); the repository has no GitHub release or tag. The npm packages the current install docs name are the @boxicons/* family, and @boxicons/core is recorded as npmName because it is the core package; its latest version is 1.0.6, published 2026-03-01, so latestReleaseDate comes from it and does not match the docs version. The legacy npm package boxicons (2.1.4, last published 2022-09-19, 37,868 downloads in the week of 2026-10-18 to 2026-10-24) is not named by the current docs and is not recorded; its first version, 1.0.0 on 2018-06-17, sets firstRelease. The repository field on the core package points at box-icons/boxicons-core. The homepage lists Pro plans with prices on the pricing page; no price is recorded. The docs state the CDN delivery of the font and SVG files, which carry a version in their URLs; the CDN is not recorded as an install method.  The core package page says @boxicons/core contains all icon SVGs, font files and the SKILL.md documentation for AI assistants. The Pro license covers the paid icon packs and tools for individual and team seats.
