notes: >
  The maintainer is the project's own name, Typecho 团队 (Typecho team), from the about page; the about page gives no legal entity and the footer copyright reads "Typecho". The about page says Typecho needs PHP 5 or later and the docs and requirements pages say PHP 7.4 or later for version 1.3; the current pages are recorded. The requirements page says the installer checks PHP extensions and that the database versions are listed in the README only; the database versions are not recorded. The homepage describes the plugin and template mechanism ("完整的插件与模板机制"), which the description reflects, and the about page names Magike as the predecessor, recorded as successorOf. The docs' contact list includes a Telegram channel and the homepage links Weibo and Segmentfault; these have no field and are not recorded. The installation page says the installer runs in the browser after the archive is extracted. The GitHub API reports no releases after v1.3.0 and the default branch is master, which the installation page warns is not for production. Forks (2,122) are not recorded.
