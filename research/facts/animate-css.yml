notes: >
  Status: the CSV row is accepted, and this file leaves it so. Criterion 4 release age applies: the newest stable release is v4.1.1 dated 2020-09-07, more than four years before the read date, so the import will list the record as stub. No discontinued signal was found: the repository is not archived (last push 2024-07-29), npm latest 4.1.1 carries no deprecated flag, and the README does not say the project has ended. A reviewer should confirm the stub outcome.
  License: the license fact describes the latest release. The v4.1.1 release carries LICENSE "The MIT License (MIT)" and package.json "license": "MIT", which npm also reports for the latest version. The main branch LICENSE, package.json ("Hippocratic-2.1"), README and homepage name the Hippocratic License 2.1, a custom license that is not an OSI license; it is not recorded as a license fact because the latest release does not carry it. The GitHub API reports NOASSERTION. licenseModel is left to the import.
  Maintainer: the main branch LICENSE names Daniel Eden for 2021; the v4.1.1 LICENSE names Daniel Eden for 2020. The README credits Daniel Eden as creator and maintainer. No company or legal entity is named.
  Runtime: a pure CSS package with no runtime. No page states that the library runs in the browser, so no runsAs is recorded. The homepage says the yarn route works with tooling such as Webpack or Parcel, and that a page without a bundler can use the CDN method instead.
  Figures: npmWeeklyDownloads is the sum of the daily counts for 2026-10-26 to 2026-11-01. The contributors count excludes anonymous contributors. The dependent counts come from ecosyste.ms on the read date. The CSV figure of 320.8k per week predates this window.
  The GitHub release v2.1.1 dated 2013-11-09 is the oldest release, which sets firstRelease. The npm package starts at 3.1.1 in 2014 and the repository was created in 2011.
  The homepage is the project's own site and is served over https. An "Another thing from Daniel Eden" link appears on the homepage; it is not recorded.
