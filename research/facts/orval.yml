notes: >
  Monorepo: the README describes workspace packages and the install docs name the orval package, so stars and contributors belong to orval-labs/orval and the npm figure is the orval package, 2026-11-01 to 2026-11-07. The README's "Supported clients" list (React Query, SWR, Vue Query, Pinia Colada, Svelte Query, Solid Query, Angular, Hono, zod, Effect, Valibot, native fetch, MCP) names output targets the generated code uses, not a framework the tool is built on, so no basedOn. The docs describe Orval as "a dev dependency in your project" but say no process model, so no runsAs is recorded. The Docker image is on ghcr.io (GitHub Container Registry), not Docker Hub, so no dockerPulls. The playground at orval.dev/playground is a hosted demo, not a service the record offers. Open Collective sponsors are not recorded. The latest prerelease, v8.0.0-rc.6 (2026-01-12), is older than the latest stable release, so no latestPrereleaseDate. The maintainer is taken from the LICENSE copyright line (Victor Bury), the GitHub organization is orval-labs. Discord link taken from the README and the homepage.
