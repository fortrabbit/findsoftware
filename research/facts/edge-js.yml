notes: >
  Edge is one package, so the stars, contributors and npm figure belong to the repository and the package edge.js. The npm figure counts downloads of edge.js; the install page names the npm route. Edge is ESM-only: the getting-started page says "Edge is an ESM-only package", which is recorded here and not as a field. The README calls the project a Node.js template engine and the homepage names no framework it is built on; the AdonisJS documentation uses Edge inside AdonisJS applications, a use relationship and not a parent, so basedOn is not recorded. The getting-started page shows a Node.js HTTP server that calls edge.render for each request and says the templates are rendered "during an HTTP request"; it does not state a process model, so renderingModes and runsAs are not recorded. The repository default branch is 6.x and the latest GitHub release is v6.5.1 (2026-05-21). The oldest tag v1.0.0 has the commit date 2017-03-30, the same day as the npm 1.0.0 upload. The homepage edgejs.dev answers over https and redirects to /docs/introduction, which is the URL cited. The documentation names Sublime Text, VSCode, Zed, Vim and WebStorm for syntax highlighting, which is editor support, not a field. The template language is Edge's own syntax, so no templating value is recorded from another product. The alternatives page names Nunjucks and Pug only as a comparison ("A better comparison will be Nunjucks vs. Edge or Pug vs. Edge."), which does not say alternative or switching, so alternativeTo is not recorded.
