notes: >
  The homepage at freelancing-gods.com/thinking-sphinx/ and the RubyGems homepage at pat.github.io/thinking-sphinx/ both answer with a redirect page to the v5 documentation; no v6 documentation path answered (404 under /v6/), so the only docs read are the v5 pages, and v5 install and deployment statements may not match v6. The README names Sphinx 2.2.11 or newer or Manticore 2.8 or newer as the search server, and says Sphinx is installed through the extended documentation; that search server is no basedOn record here. The v5 installing_sphinx page is the source for Sphinx's own install routes and was not recorded as installMethod. The README's requirements table lists ActiveRecord 6.1 to 8.1 as tested, which is a version statement and not recorded. The LICENCE file names Pat Allan as copyright holder for 2011, while the README copyright line reads 2007 to 2026; both name the same MIT license. Version 6.0.0 has a RubyGems release of 2026-01-11 and no GitHub release or tag; the latest GitHub release is v5.6.0 (2024-07-07), and the major is 6 on the README's own statement. Installing the gem also needs a MySQL gem for the Sphinx connection, which the README mentions and is not recorded here.
