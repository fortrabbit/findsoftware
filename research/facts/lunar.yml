notes: >
  The task brief named lunarphp.io; the repository and the site itself use lunarphp.com. Lunar is a package added to an existing Laravel application, not a standalone application, so it has no own rendering mode; the docs say "no external API to call", and no REST or GraphQL API is documented, so headlessApi stays out. The homepage says premium add-ons may come later; no paid edition exists today. The lunarphp/lunar Packagist entry points at the lunarphp/admin split repository. A getcandy/getcandy repository exists but no Lunar page states a predecessor relationship, so successorOf stays out. Lunar 1.0.0 was published 2025-08-15. Coined here: latestPrerelease (newest pre-release tag and date), usageClaim (an adoption figure the vendor states on its own site). Contributors counts GitHub accounts, anonymous excluded.
