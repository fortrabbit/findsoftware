notes: >
  The CSV row lists the homepage as http://pagegen.phnd.net; the https address answers 200 and the plain http address redirects to it, so the https address is recorded. The GitHub releases list (14 releases, 3.1.0 from 2021-12-13 as the oldest) does not show the 2015 PyPI history: PyPI has pagegen 2.1.0 uploaded 2015-05-01, so firstRelease comes from PyPI. The latest stable release is 4.1.0 on PyPI (uploaded 2025-04-23) while the newest GitHub release is 4.0.0 (2025-02-16); latestReleaseDate follows PyPI. The repository has no LICENSE file and GitHub reports no license; the license comes from the GPLv3+ classifier in the PyPI metadata. The PyPI JSON carries no download counts; the figure comes from pypistats.org. The Mako templates plugin ships inside the package, so no basedOn is recorded: the project does not name a parent.
