notes: >
  The homepage jaspr.site is the project's own site and its docs are at docs.jaspr.site. The homepage links two Discord invitations (discord.gg/XGXrGEk4c6 and discord.gg/Ej3Fkt5SGx); the README names XGXrGEk4c6 as the community server, so that one is recorded. The LICENSE copyright line names The Jaspr Authors, not a legal entity, and the homepage footer says "Copyright © 2025 Jaspr"; the repository owner is a user account. The pub.dev latest version is 0.23.5 (2026-09-25); the GitHub releases list ends at jaspr-v0.23.0 (2026-04-17), and the tags for 0.23.1 to 0.23.5 have no GitHub release, so latestReleaseDate uses the registry. Major 0 comes from both sources. The rendering mode "client" in the docs is recorded as spa, which is the closest vocabulary value. The docs name Firebase Hosting and GitHub Pages as static deploy targets; the docs name Docker or any Dart hosting provider for server mode, which is not separately recorded. The homepage names Serverpod integration and a Riverpod package, neither recorded as basedOn because the docs do not say Jaspr is built on them. The Jaspr docs say static mode is recommended for most websites and server mode for applications with backend integration; not recorded as a fact. The docs list a jaspr_content package for content-driven sites; it is a Jaspr package, not a plugin turning Jaspr into another kind of software, and is not recorded.
