notes: >
  The homepage also links LinkedIn and YouTube; no field takes them. The README links a Vespa Slack community; no field takes it. Vespa Cloud has a free trial with usage credits; the amounts are plan terms and are not recorded. The docs getting-started page redirects to the tutorials index; install facts come from the self-managed pages. The Vespa CLI (brew install vespa-cli) is a client, not the server, so it is not an installMethod. Java 17 and Maven 3.6.3 are build requirements (build guide), so no runtimeMin is recorded. The core is C++ according to the build guide (C++ and Java building on AlmaLinux 8); the GitHub language is Java, both are recorded in notes only. firstRelease is 2017, the year of the blog post announcing the open source release; the first GitHub release is from 2021. The lsp-v tags are a language server, excluded from currentMajor. Fields coined: none.
