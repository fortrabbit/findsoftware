notes: >
  The package the install docs name is corvu on npm, latest 0.7.2 (2025-01-24), which sets currentMajor 0; the GitHub tags are older (v0.2.1) and the repository's other releases belong to single primitives (@corvu/resizable, solid-prevent-scroll), so they are not the package's release. The docs say every primitive is a separate package (@corvu/drawer and so on), and the npm peer dependency is solid-js ^1.8. The LICENSE copyright line gives "Copyright (c) 2023-2025 Jasmin Noetzli"; the docs footer reads "Developed and designed by Jasmin". The org location is Switzerland on the GitHub profile, which is not a legal statement, so hqCountry is absent. The discord value is the SolidJS community server, where the docs point to a #corvu channel. The installation page also describes a Tailwind CSS plugin and a UnoCSS preset. Contributors is the page number of the rel="last" link on the contributors endpoint with per_page=1.
