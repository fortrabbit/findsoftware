notes: >
  Status accepted: the repository is not archived and no page states an end, but the last push is 2023-10-08 and no GitHub release exists, so a later pass should check whether the project is still maintained. The homepage and the README both name the project Spark or Spark Framework and say it is a micro framework; the CSV's "Spark Java" is the community name and is not used as the record name, which avoids confusion with Apache Spark. The README says Spark 2.9.4 is out, and Maven Central lists 2.9.4 (2022-07-10) as the release; no tag 2.9.4 exists on GitHub, and the newest tag is 2.9.3, so the registry is the source for currentMajor and latestReleaseDate. The oldest GitHub tag, 0.9.9.4, has a commit dated 2013-02-07 and the oldest Maven upload is 1.0 on 2013-06-29, so firstRelease is 2013 either way. The README's "Java 8" is recorded as runtimeMin with the README quote, which describes the library as built for that Java version. The maintainer is Per Wendel, named on the contact page as founder and main maintainer; the pom.xml declares no developers and the LICENSE has no copyright holder. The x link is the homepage footer link and carries no quote because markup is not readable text. The docs page names Jetty as the embedded server and the runsAs value comes from its "Standalone Spark" sentence. Maven publishes no download figure, so none is recorded. Stack Overflow with the spark-java tag is named for usage questions and is not a forum field. The homepage Facebook Downloader sponsor line is not recorded.
