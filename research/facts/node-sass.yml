notes: >
  The GitHub homepage field points to the npm package page, which is a registry page, so no homepage is recorded; the project has no website of its own. The README names its successor: it says "Projects that still use it should move onto Dart Sass" and links the Dart Sass site, and the npm deprecation message names "sass" or "sass-embedded"; no record exists for them, so the successor is named here and not recorded as successorOf. The README builds on LibSass, the C implementation of Sass; LibSass is not a record, so it is named here and not recorded as basedOn. The repository is archived and the npm package deprecated, and the README states end of life, so status is discontinued. The latest release is v9.0.0 (2023-05-20); the README's Node version table lists Node 20 with node-sass 9.0+ as the newest supported pairing. The maintainer is named by the LICENSE copyright line; the repository belongs to the sass GitHub organization, which is not named as maintainer because the legal line names Andrew Nesbitt. The README does not state where the software runs, so no runsAs value is recorded.
