notes: "Directus ships under its own Monospace Sustainable Core License 1.0 (abbreviated MSCL-1.0-GPL in the file), which permits any use except a Competing Use and forbids circumventing license-key-protected functionality; the pricing page grants full access free to organizations under $5M revenue and 50 employees, and the Core plan caps seats, collections and flows, so the self-hosted edition is gated by license key. Docker is the documented install method; the deploy page shows no npm install path. The org location on GitHub (Brooklyn, NY) is the only HQ source; the about page calls the company fully remote. directus.chat is unlabeled on the community page, recorded under the coined field chat. The homepage lists framework integrations (Next.js, Nuxt, React, Django, Laravel, Flutter) and a native MCP server. Coined here: dockerPulls (Docker Hub pull_count), hardwareMin, hostedOffering, repoCreated, totalDownloads (self-reported download total), chat (community chat URL of unstated platform). The repository dates from 2012, well before the current codebase; no firstRelease year is stated on the project pages."
