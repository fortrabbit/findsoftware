notes: >
  Name collision: the PHP micro framework Slim is research/facts/slim.yml; this Ruby template engine takes the id slim-template, which follows its homepage and repository. The homepage footer names the maintainer as minad, the README lists Daniel Mendler, Andrew Stone and Fred Wu as authors, and the LICENSE copyright line names "Slim Team", which is the name recorded. The alternativeTo entries come from the README "Language ports/Similar languages" list (Haml and Pug have fact files here; the other names have none); the Haml importsFrom entry is the Haml2Slim converter the README lists under Template Converters. The README says Slim works on Ruby 2.5 and newer in its testing section, which matches the gemspec minimum at v5.2.2. Temple and Tilt are runtime dependencies of the gem, and Slim works with Rails, Sinatra and Tilt; these are compatibility statements, not basedOn. The README's embedded-engine section (Markdown, Textile and others through Tilt) is not a templating fact of this record. No page states a process model, so no runsAs is recorded; the "slimrb" command is a developer tool and the Rails streaming feature is no runsAs statement either. The i18n value is the translator plugin the README names among its plugins, not a core feature. The GitHub release list and the RubyGems version list agree on v5.2.2 (2026-07-24) as the newest stable release. The rubygems download figure is the total of all versions. The repository was last pushed on 2026-10-25.
