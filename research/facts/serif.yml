notes: >
  The repository is archived on GitHub, and the README links it as the project's source ("Visit the GitHub repository for Serif"). The README states no end, so the status fact rests on the archive flag alone. The CSV homepage aprescott.com/posts/serif answers 404, so no homepage is recorded. The gem summary on RubyGems states "an optional admin interface complete with drag-and-drop image uploading", recorded as adminUi; the README does not describe one. The Markdown renderer is Kramdown, with Liquid templates; no field exists for it, so it is not recorded. GitHub has tags from v0.1 to v0.6 and no GitHub releases, so currentMajor comes from the RubyGems stable version 0.6.
