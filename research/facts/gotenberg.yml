notes: >
  The homepage states "100M+" Docker pulls and "13k+" GitHub stars; neither is recorded here (the pull count is read from Docker Hub and the star count from the API). Copyright line on the homepage and the LICENSE file both name Julien Neuhart; the GitHub organization is gotenberg. The homepage gives no legal entity or country, so hqCountry is absent. The clients page names the official PHP client (gotenberg/gotenberg-php) and points to community clients on the Awesome Gotenberg list, which is discovery only. The footer names sponsors (TheCodingMachine, pdfme, PDFBolt, FileToPDF); they are not recorded as alternatives. Installation also covers Helm and a Kubernetes example through a community chart (MaikuMori/helm-charts), and a community web UI (nktnet1/gotenui); neither is recorded as a fact of the project. The homepage features webhooks and S3 upload and download, described as Gotenberg features; they are in the docs, not recorded as fields. The runtime is not stated on any page read: GitHub reports Go as the language, and the docs do not say the server is a Go binary, so no runtime is recorded. Coined kinds: httpApi, dependencies. The sdkLanguages and installMethod values follow the glitchtip and mailpit files. Not record fields: sdkLanguages PHP (https://gotenberg.dev/docs/getting-started/clients).
