notes: >
  The repository is a monorepo with one release tag per package. currentMajor, latestReleaseDate and firstRelease come from @kuma-ui/core, the package the install docs name; its latest release 1.6.4 is dated 2026-04-08 in the registry and in the GitHub tags. The npm package named "kuma-ui" (version 0.0.6) is a different, unrelated project and is not used. The install guide states "Kuma UI is compatible with React 18 and above" and gives Next.js and Vite plugins (@kuma-ui/next-plugin, @kuma-ui/vite); a dependency or peer requirement is not recorded as basedOn. The docs describe the styling as build-time extraction, but no page states where the software runs, so runsAs and runtime are left out. The LICENSE names poteboy as copyright holder; the homepage footer reads "MIT 2025 © poteboy". The homepage is served over https; plain http redirects to it.
