notes: >
  The row's homepage is the project's own site, echo.labstack.com, which answers over https. The README says Echo is built on Go's standard net/http and interoperates with it; the standard library is not a record, so no basedOn is recorded. The README states the framework is minimalist and does not state that it is for APIs, so only framework and micro-framework are recorded. The README says the current major is released 2026-01-18 and the previous major receives security updates until 2026-12-31; that end date is not recorded as a fact field. The quick start page states the minimum Go version; the README says Echo supports the three most recent Go releases, which is a support policy and is not recorded. Go modules have no download figure, so none is recorded. The "Used by" table lists projects that run Echo; it is not a count and is not recorded. No page read states how a live Echo application is run (the quick start uses go run), so runsAs is not recorded.
