notes: >
  urql is a monorepo: the stars and contributors belong to urql-graphql/urql, and the registry figures come from the urql package the install docs name (npm install --save urql). The core package @urql/core, the bindings and the exchanges are separate npm packages of the same repository. The highest stable release of the urql package is 5.0.4 (2026-08-21); @urql/core is on major 6 (6.0.3), which is not the package the install docs name. The README names React, Preact, Vue, Solid and Svelte in one package; the docs add next-urql for Next.js, and the comparison page marks Angular bindings as not supported. The framework bindings are official parts of the project, so no basedOn is recorded. The npm description of urql still says "for React", an older wording, so it is not used for basedOn either. The runtime is node from the docs sentence about the core package, which the basics page says can be used directly in Node.js; no runsAs is recorded, because the browser and Node.js are both named. Relay and Apollo are the comparison clients on the project's own comparison page; Apollo Client and Relay have fact files and are recorded as alternativeTo. graphql-request's comparison page also names urql, which is recorded on that record's side. The LICENSE names two copyright lines: 2018-2020 Formidable, and the current urql GraphQL Team with other contributors; the current line gives the maintainer, and the README's founding by Formidable is noted here only. firstRelease 2018 is the npm upload of urql 0.0.1 on 2018-01-17, earlier than the oldest GitHub release (v1.0.0 of 2019-02-22). The Discord link is the project's own, at urql.dev/discord, from the README badge. No Bluesky, X or newsletter link was found on the project pages.
