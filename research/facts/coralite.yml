notes: >
  The project names Codeberg as its source (homepage link and README clone URL), so repository is the Codeberg repository. A GitHub repository tjdav/coralite carries the same README but the project does not name it as its source; none of its figures are recorded. No project page states the implementation language, so language is unknown. The npm latest dist-tag is 0.47.1 (published 2026-08-22); the npm rc tag is 1.0.0-rc.5 (published 2026-09-21), recorded as latestPrereleaseDate. The homepage says "Licensed and will always be free and open source." and the README states "This project is licensed under the Mozilla Public License 2.0". The homepage credits "Brought to you by Thomas David" and the npm maintainer is cak3; the LICENSE file has no copyright line, so maintainer follows the homepage. The README describes components as native Custom Elements written with HTML modules and a "server()" block, and says "append the no-hydration attribute to your HTML tag" to skip client-side hydration. The SSR page says the "server" block "runs strictly on the server during the build phase", that top-level imports in a component's script block "are treated as server-side only" unless the client block accesses them, and that using browser APIs such as window or localStorage in the server block "will cause the build to fail". The README names three packages in the core framework and a plugin ecosystem; no field records them.
