notes: >
  No homepage: the repository's homepage field and the README both point to docs.rs/grass, the crate's documentation, and the project has no site of its own. The GitHub repository has tags up to 0.13.4 but no GitHub releases; latestReleaseDate and currentMajor come from crates.io, the registry that the install docs name (cargo install grass). The last commit on master is 2025-07-25, read from the commits endpoint, which the record does not need because the crate has releases; the four-year stub rule is not reached (last crate release 2024-08-04). The README says grass aims for feature parity with dart-sass and targets dart-sass 1.54.3; dart-sass and libsass are named as references, not as parents, so basedOn is not recorded. The crate's recent 90-day downloads were 461846 at the read date; the recorded figure is the total. ecosyste.ms counts were read from the crates.io entry. The MSRV in runtimeMin is the rust_version of crate version 0.13.4 in the crates.io registry. The README's known missing features are tracked in an issue, not a field. The crate's license is MIT in the GitHub and crates.io metadata; the LICENSE copyright matches.
  The README says grass aims for complete feature parity with dart-sass, the reference implementation, that a deviation counts as a bug except in error messages and spans, that @forward and more complex uses of @use are the rough edges, and that known missing features and bugs are tracked in one issue. It also says grass is not a drop-in replacement for libsass, and that stylesheets moved from libsass need changes that a move to dart-sass would also need.
