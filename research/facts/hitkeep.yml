notes: >
  Criterion 1: the tracker is added to a site's pages (README "Track Your First Site": "add the tracker to your pages"), and the analytics server runs on the creator's side or in HitKeep Cloud, so it is accepted under the tracker rule. Repository: the CSV row names PascaleBeier/hitkeep, which now redirects to HitKeep/hitkeep (the organization the README links), so the current repository is recorded. Maintainer: the imprint names Pascale Beier as operator at a Recklinghausen address; the LICENSE copyright line names the same person. HitKeep Cloud is a managed service with EU and US regions on the same code: hostedOffering. The license is MIT for the complete product; the README says custom tracking domains and team SSO are in the same public codebase, not a paid edition. The tracker sets no analytics cookies and respects Do Not Track (README): cookieless and privacy claims are kept here because no field exists for them. The MCP endpoint and A2A access are read-only and aggregate-only (reference pages); HitKeep is an OAuth authorization server for integrations and MCP clients (Authorization Code with PKCE S256), from 2.15.0, recorded as sso oauth2; team sign-in uses OIDC (first sso entry); Google, GitHub and Microsoft social sign-in is not recorded as sso; they are AI-era interfaces, coined and kept here. The NSQ message queue is embedded, not a database (architecture page); the README says the product needs no separate database, queue or cache. The Cloud pricing page says workspace analytics data and backups stay in the region the team chooses. The SSO guide lists the same OIDC setup for cloud and self-hosted installs. The Search Console integration, ecommerce reports, goals, funnels, Web Vitals and AI visibility reports are features (README), not fields. Imports exist for Plausible and Simple Analytics exports (docs), both with a CLI route; Simple Analytics has no record, so only Plausible is written to importsFrom. Pageviews, events and vitals are published to the embedded NSQ queue before store-local batching (architecture page). The LinkedIn company page is https://www.linkedin.com/company/hitkeep (linkedin is a coined field). The Docker Hub image is pascalebeier/hitkeep; the GitHub Container Registry also carries it (ghcr.io/hitkeep/hitkeep), which the Docker Hub figure does not count. The release list has many snapshot builds marked as prereleases; those are automated builds, not alpha, beta or RC releases, so no latestPrereleaseDate is recorded. The oldest release is v1.0.0 (2025-11-21). No runtimeMin is recorded: the binary install page gives only an OS and glibc note. The docs also describe a WordPress integration (plugin) and an @hitkeep/tracker npm package for React, Vue, Angular and Astro; both attach the tracker to a site and are not the server. The vs pages also name Simple Analytics, Fathom, Pirsch, Cloudflare Web Analytics, Google Analytics, Adobe Analytics, Piwik PRO and Clamp, which have no record. The migration page says no Matomo, Umami or Fathom history import exists.
