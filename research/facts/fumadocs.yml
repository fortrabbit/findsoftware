notes: >
  basedOn is left out: the pages say Fumadocs composes into a React framework and lists five it supports, but none says it is built on one. The install page lists the frameworks it supports as Next.js, Astro (with React), Waku, React Router and TanStack Start; the list is not a field. The install docs name create-fumadocs-app, a create-* scaffolder, so the registry figures come from the core package fumadocs-core. The GitHub releases endpoint returns the sub-package fumadocs-twoslash@4.0.3, so latestReleaseDate comes from the npm time field of fumadocs-core 16.17.7. The static rendering comes from the deploying page's SPA note; the docs say a Next.js app is powered by the React framework's own deployment guides, and Docker deployment is shown for Next.js, so no server mode is recorded as a Fumadocs mode. Fumapress, a separate site generator at press.fumadocs.dev, is not recorded here. Maintainer is the LICENSE copyright holder; the home page says "designed by Fuma Nama".
