notes: >
  Development happens in SVN; github.com/WordPress/wordpress-develop is the Git mirror of the development repository (3,487 stars) and github.com/WordPress/WordPress mirrors the built release (21,480 stars, no GitHub releases). Neither mirror's contributor list reflects authorship, so contributors is left out. WordPress is not published on Packagist by the project. endoflife.date marks every branch since 4.7 as not EOL because of security backports; only 7.1 is in active support. runtimeMin comes from the version-check API (minimum to run), runtimeRecommended from the requirements page; databaseMin likewise. Coined fields: runtimeRecommended, databaseMin, themeCount, versionShare (the stats API that returns install share per version, refreshable by script). i18n was not checked on a primary page and is left out. Docker Hub's "wordpress" image is a Docker Official Image, not published by the project.
