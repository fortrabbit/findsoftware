notes: >
  The package the getting-started page installs is @ariakit/react; the repository is a monorepo, so the GitHub release tags are per package and the highest stable @ariakit/react tag is 0.4.42 (2026-10-14), which sets currentMajor 0 and latestReleaseDate. The first upload of @ariakit/react is 0.0.1 on 2022-10-08 in the npm registry, older than the first GitHub release tag (0.1.0, 2023-04-11), so firstRelease is 2022. npmWeeklyDownloads is the sum of the daily range 2026-10-18 to 2026-10-24. The repository license is not detected by GitHub (no LICENSE file at the root); the README licensing table names three licenses for three paths, and each is recorded as stated. The Ariakit Plus License covers the Plus recipes under app/src/recipes; the README calls it the license of Ariakit Plus customers. No price for Ariakit Plus was found: the /plus page carries no pricing text and /pricing answers 404, so pricingPage is not recorded. The LICENSE copyright line names Ariakit FZ-LLC, and the homepage footer names Diego Haz as copyright holder, a person named by the project, so the legal entity is the maintainer. No page read states where Ariakit FZ-LLC is registered, so hqCountry is not recorded. The predecessor Reakit has no candidate row. The packages @ariakit/solid and @ariakit/tailwind are marked experimental in the README and are not the package the install page names, so their figures are not recorded. The getting-started page states React v17 and above is required, but no runtimeMin is recorded because React is the framework, not the runtime. The homepage links GitHub Discussions, recorded as forum. The CDN method on the getting-started page is for development only.
