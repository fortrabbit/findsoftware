notes: >
  The homepage phpfusion.com answered 503 on every request during this run, so the homepage fact comes from the repository's homepage field through the API and the docs were read from the PHPFusion/docs repository. The project's site source at github.com/PHPFusion/site shows a PHP 10 platform, while the stable release on GitHub is v9.10.31 (2025-02-20) and the default branch is 10.00.00-dev; currentMajor follows the stable tag, so the reviewer should decide whether 10 is stable yet. The docs in the repository state the v9 minimum as PHP 7.0 and MySQL 5.6 or MariaDB 10.1, while the v9.10.31 README states PHP 8.1.0 and MySQL 8.0.13 and its heading still reads 9.10.03A-DEV; runtimeMin and databases follow the README at the release tag. The license statement about purchasing a license to remove copyrights is recorded as a second license entry. The docs and the README name no Packagist or npm package; the composer.json name phpfusion/v9 has no Packagist entry (404 on repo.packagist.org). The maintainer is the copyright holder named in the source file headers at the v9.10.31 tag; the docs call it PHPFusion Inc. The docs also say "To legally remove our Copyrights you need to Purchase a License"; the licensing page behind it is unreadable, so no second license entry is recorded and the sentence is kept here. The Adoption stars and contributors are the repository's own counts.
