notes: >
  Status stays accepted: the repository is not archived, the Packagist package is not flagged abandoned, and the last release is 0.11.0 (2026-10-06). The homepage calls Marko "early-stage and open source" ("Marko is early-stage and open source."); that is the project's own word and is not a status field. The homepage GitHub link goes to github.com/markshust/marko, which redirects to marko-php/marko; the repository now sits under marko-php. The homepage credits Mark Shust ("Built with pixels and passion by Mark Shust"), and the README says "Created by Mark Shust", so the maintainer is recorded from the site; the LICENSE copyright line names Devtomic LLC, whose relation to him no page states. The install command names marko/skeleton; registry figures come from marko/core, the core package, because the install command names only the skeleton. The description is built from the docs sentence "Every feature is a Composer package." The docs sentence "A modular PHP 8.5+ framework combining Magento's extensibility with Laravel's developer experience" names two other products; the record does not use the comparison.
