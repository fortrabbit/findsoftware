notes: >
  No legal name is recorded: the imprint (impressum.html) names only a contact form and an e-mail address, and the GPL-3.0 LICENSE file carries no copyright holder line; a reviewer must decide the maintainer field. The GitHub organization is named "Ilch CMS". The project's own pages are in German; the English quotes come from the master README, and the v2.2.20 tag README is in German. The documentation pages on ilch.de under doku-*11 cover Ilch 1.1 and are not used for version 2 facts. The version 2 installation steps are in the README only. The repository was last pushed on 2026-10-18 and is not archived. The default branch and the v2.2.20 tag both name PHP 8.1 or newer in composer.json. The 'Module und Designs' sentence on the homepage describes installable modules and designs; the pluginDirectory fact cites the download page filter "Alle Downloads, Module, Designs, Sonstiges", and a reviewer should confirm the download page as the module directory.
