notes: >
  The repository is archived on GitHub and its README states that the owner no longer maintains it, so the status is discontinued; the README adds that it still works as far as the owner knows, which is recorded as nothing beyond that statement. The project has no website, so no homepage is recorded. It has no GitHub release or tag, so there is no firstRelease, currentMajor or latestReleaseDate; lastCommitDate is the committer date of the newest commit on the default branch. No page names the maintainer beyond the GitHub owner handle Zedelghem, which the README uses as the author in its example post header, so no maintainer fact is recorded. The PyPI name pystatic belongs to an unrelated project (vascop/pystatic), so no pypiName is recorded. The README's roadmap to publish the package on PyPI was not done and is not recorded.
