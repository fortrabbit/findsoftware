notes: >
  The former name is OpenX Source: the about page says the project started in summer 2013 when OpenX Source was purchased by the Revive Adserver team, so the project is not recorded as a fork. The install page says upgrades from any version of OpenX Source are supported; that is an upgrade path, not an importsFrom statement. The GitHub API reports GPL-2.0 for the repository, and the LICENSE.txt at v6.0.8 is the GPL version 2 text; the composer.json at the same tag states GPL-2.0-or-later, the project's own wording, recorded as the single license entry. The repository has no GitHub releases (releases/latest returns 404), so the version and date come from the download page; the v6.0.8 tag commit is dated 2026-06-25. The oldest tag is v3.0.0 (commit 2013-09-13). The current requirements page says the minimum PHP version is 8.1.x, and composer.json at v6.0.8 sets the platform to 8.1.0; the require block of the same file lists no PHP version. The download page's Hosted edition is a subscription at revive-adserver.net and starts at a monthly price that is not recorded. The ad-server category is not in the import's categoryMap, so the record maps to no category until the map gains a value. The FAQ links the community forum at forum.revive-adserver.com over http only and the host does not resolve over https, so forum is not recorded. Coined kinds, recorded here only: zone invocation codes that a site places on its pages, the MaxMind GeoLite2 data used for geotargeting, third-party cookies for frequency capping and conversion tracking, and HTTPS required for those cookies. No page states a process model (no always-on or per-request statement), so runsAs is not recorded. The LinkedIn company page (linkedin.com/company/reviveadserver) is a coined field and stays here. The about page gives no legal entity and no address for Aqua Platform, so hqCountry is unknown. The about page says the Download edition and the Hosted edition were both transferred to Aqua Platform in 2024. The download page says hosted subscriptions start at a monthly price, which is not recorded. The previous owner, Revive Software and Services BV, incorporated in the Netherlands in 2015 per the privacy page, is named here only. The active-installations page shows a graph without a stated number, so reportedInstalls is not recorded.
