notes: >
  The homepage says FlatPress has been "around since 2006"; that is an existence claim, not a first release, so firstRelease stays unknown. The imprint names Frank Hochmuth as the operator of flatpress.org, and CONTRIBUTORS.md says he has taken over the project since 2026; the imprint's address is not recorded and no hqCountry is recorded because the operator is a person, not a company. The README says no database is needed, so no databases fact is recorded. The LICENSE.md file is the GPL version 2 text; the GitHub license field reads GPL-2.0, and the README says "Free software under GNU GPLv2", so the SPDX id is recorded without a -only or -or-later suffix. The Wikidata id Q61735310 comes from a label search on "Flatpress" with the description "free blog software"; its official website property (P856) is https://www.flatpress.org/, which confirms it. The CSV homepage https://flatpress.org redirects to www.flatpress.org. The Mastodon link is taken from the README badge, and the forum link from the README. The current release line is 1.5 ("Stringendo"); the last release 1.5.1 is from 2026-03-24.
