notes: >
  Discontinued on two signals: the README opens with "This project has been taken over by Phalanx" and says "This project has not been maintained for a long time.", and the GitHub repository is archived. The last push to master is 2021-12-10. The README names https://github.com/mosuka/phalanx as the successor; that is a separate project and is not recorded as a fact here, so a Phalanx candidate would need its own row. The project's own site is absent: the repository has no homepage, so none is recorded. The highest stable GitHub release is v0.10.0 (2021-01-18), and go.mod at that tag declares go 1.14, which is the runtimeMin recorded. The Go module path github.com/mosuka/blast has no registry download figure. The Dockerfile uses golang:1.15.6 for the build stage, not a runtime. The README notes that some Bleve extensions need C/C++ libraries (cld2, icu, libstemmer, leveldb) at build time, and the Japanese analyser uses kagome. The README lists faceted search, spatial search, search result highlighting and index replication with Raft consensus, these are features and not fields. The maintainer name is from the MAINTAINER line of the Dockerfile; the LICENSE carries no copyright line. The README's example data directory and docker container show the node stores the index and Raft logs in a data directory; the page does not name a storage kind, so contentStore is absent.
