notes: >
  The homepage struts.apache.org answers over https and names the project and the Apache Software Foundation in its copyright line, which is the maintainer. The GitHub releases list gives STRUTS_7_4_0 published 2026-09-17 as the highest stable release; the homepage and download page say 7.4.0 GA was released on 2 October 2026, which is the later date and is recorded as latestReleaseDate. The GitHub releases list is the source for currentMajor, and Maven Central's metadata gives 7.4.0 as the latest and release version. The first Maven Central upload of struts2-core in the search index is 2.0.5 (timestamp 1171072302000, 2007-02-10); endoflife.date's 2.1 cycle is dated 2007-10-29, and the GitHub tags start at struts2-parent-2.0.10. The announcements page for 2002 and prior dates Struts 1.0 at 15 Jun 2001, which is the project's first release and the firstRelease. The JSP value comes from the Hello World tutorial and the Velocity value from the bundled plugins list on the plugins page, which also lists an Embedded JSP Plugin marked deprecated since 6.0.0; the primer page calls Velocity and FreeMarker first class citizens for Struts, so FreeMarker is recorded as a second templating entry; the README's list of JSP, Velocity and FreeMarker is in the past tense and is not the source. The Java minimum is from the 7.0.0 version notes. The primer page describes the servlet container that hosts the web application, recorded as always-on. The homepage says the REST, AJAX and JSON plugins exist, which is not a headless content API, so headlessApi is left out. The user mailing list is not recorded as a forum. The homepage says some Struts versions are no longer supported and receive no further security patches, and recommends migrating to the latest release; the end-of-life list on endoflife.date holds the supported versions.
