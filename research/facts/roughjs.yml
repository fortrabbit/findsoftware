notes: >
  The homepage http://roughjs.com in the candidate row answers with a redirect to https://roughjs.com/, so the https address is recorded. The GitHub releases stop at v3.1.0 (2019-03-14); the npm registry carries 4.x (latest 4.6.6, 2023-11-20) and its major is higher, so currentMajor is 4 from npm and latestReleaseDate comes from npm. The first upload on npm and the oldest GitHub tag v1.0.0 both date to 2018-03-02. The repository was pshihn/rough before it moved to rough-stuff; the API figures are for rough-stuff/rough. The GitHub language field reads HTML; the TypeScript value rests on the npm package declaring bin/rough.d.ts as its types file. The README states "Rough.js is a small (<9 kB) graphics library" and the homepage "<9kB gzipped": a coined bundle-size fact, kept in notes. The runtime and runsAs are left empty: the homepage and README name Canvas and SVG as the drawing targets and "Browser IIFE" as a bundle name, but no page says the library runs in the browser. The README says the library defines primitives to draw lines, curves, arcs, polygons, circles and ellipses and also draws SVG paths. Contributors count is the last page of the contributors endpoint at per_page=1. The homepage lists Excalidraw, diagrams.net, Terrastruct, Cube, SheetJS, Poster Maker and Chartle as supporters; they are sponsors, not dependencies, and are not recorded.
