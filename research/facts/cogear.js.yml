notes: >
  The README opens with "THE PROJECT IS DEPRECTATED" (the spelling is the project's) and the repository is archived on GitHub (archived: true, last push 2021-01-06); both are recorded as the discontinued signal. The homepage cogearjs.org returned HTTP 522 (origin not reachable) on the check, so it is listed as unreadable and the homepage fact comes from the repository record only; the docs at cogearjs.org/docs were not read for that reason. The LICENSE.md file links to cogearjs.org/docs/license, which was not readable, so the license comes from package.json of the package the README installs (cogear on npm, version 1.3.4, same major as the highest GitHub tag 1.3.2; the repository has no GitHub releases). The package.json repository field names codemotion/cogear.js, which resolves to the same archived repository. The maintainer is recorded as package.json names the author, "Dmitriy Beliaev"; the GitHub profile spells the name "Dmitriy Belyaev", and no legal notice was reachable. The runtimeMin value is the README's stated requirement for the install, not the latest release's engines field, which is not set.
