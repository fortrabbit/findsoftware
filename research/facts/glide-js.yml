notes: >
  The npm name for this record is @glidejs/glide, the package the install page names; the unscoped npm name glide belongs to another project (picdorsey/glide, 0.2.0) and is not used. The homepage Github link points to github.com/jedrzejchalubek/glidejs; the repository recorded here is glidejs/glide, the one the README badge and the install page name. runtime and runsAs are not recorded: the README names browser support as a list of browser versions, the docs say the library is "Written in vanilla JavaScript", and no sentence states that it runs in the browser. Only the installation page names the CDN and download routes; the setup page links the jsDelivr and unpkg copies of @glidejs/glide. The README and docs name no community forum, chat or social account; the README sends implementation questions to StackOverflow with the glidejs tag, a general forum, so no forum fact is recorded. The homepage footer names the maintainer as Jędrzej Chałubek with no legal form or address, so no hqCountry is recorded. Stars and contributors belong to the glidejs/glide repository. npmWeeklyDownloads is the daily sum from the api.npmjs.org range endpoint for 2026-11-01 to 2026-11-07.
