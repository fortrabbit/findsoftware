notes: >
  The package named by the install docs is create-rspress, a scaffolder that the getting-started page runs as "npm create rspress@latest"; the core package @rspress/core is recorded, with 40723 downloads in the week 2026-10-12 to 2026-10-18. The unscoped npm package rspress is the 1.x line (latest 1.47.2, 9259 downloads the same week) and is not the record's package. The site footer reads "© 2023-present ByteDance Inc." and the LICENSE reads "Bytedance, Inc. and its affiliates"; the footer legal form is recorded as maintainer. The copyright line states no ownership relation, so parent is not recorded. The README says Rspress is part of Rstack, a toolchain family; that is a relation between packages, not recorded as a field. The introduction page calls Rspress React-based, so React is recorded as basedOn. The README's Features list names built-in full text search, a plugin system and component demos; those are not recorded as fields. The latest prerelease 2.1.0-beta.1 (npm beta tag, published 2026-10-14) is newer than 2.0.23 (npm latest, 2026-09-29). The README links three different Discord invites; the one in its Community section is recorded. The official plugins (@rspress/plugin-*) are listed in the docs, with no directory of third-party plugins. The docs site's version selector shows a 1.x line as well. Field kinds coined here: none.
