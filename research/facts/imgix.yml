notes: >
  The record is the hosted image service at imgix.com; its API and client libraries are documented on docs.imgix.com, and the library repositories are not recorded (hosted-service rule). Maintainer: the terms name Imgix, Inc. as the contracting party; the privacy policy says the same entity. HQ: hqCountry is not recorded; the only full address in the terms is the designated-agent address for copyright notices (535 Mission St, San Francisco, CA 94105), which is no notice address of the company. The terms are governed by the laws of California with San Francisco County courts. Single sign-on: the SSO setup page offers "enterprise-grade Single Sign-On (SSO)" through an identity provider, self-service onboarding with Auth0, and no protocol is named, so no sso value is recorded. User roles are documented as "roles and permissions" with the permissions Account Admin, Billing and Asset Manager Edit. The pricing page moved to a credits model ("Enterprise includes", "$0.14 per credit" and similar); prices and plan tiers are not recorded. Coined, recorded here only: SOC 2 compliance (pricing page); a status page at status.imgix.com; the web API the terms call "API Services", which controls image actions without uploading the images (terms); a LinkedIn company page (linkedin is a coined kind); Asset Manager and storage sources such as S3, Google Cloud Storage, Cloudflare R2, Azure and Wasabi (documentation); bot management and block or allow lists (documentation). The "Migrating from imgix.video to Imgix Video" documentation concerns imgix's own product line and is not an importsFrom fact. The imgix about page gives the founding year 2011, which is a company fact and not a first release, so firstRelease is absent. The regions of data processing are not stated on the pages read.
