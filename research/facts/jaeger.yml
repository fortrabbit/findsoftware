notes: >
  The README names the Cloud Native Computing Foundation as host and Uber Technologies as creator; neither is recorded as maintainer. Jaeger receives trace data over the OpenTelemetry Protocol (OTLP) and accepts Zipkin formats (APIs page). The homepage links a CNCF Slack channel (cloud-native.slack.com, archives/CGG7NFUJ3); no field holds chat links, so it is not recorded. The v2 line is built on the OpenTelemetry Collector framework (download and blog pages); that parent has no record id, so it stays here. The v1 line reached end-of-life on 2025-12-31 (endoflife.date and the download page); the project itself is not ended, so the record stays accepted. Jaeger UI is the trace viewer that query serves; it is not recorded as adminUi because it is not an administration interface. The architecture page names one binary running in the roles all-in-one, collector, query and ingester, and the Windows page covers hosting its processes as services. The homepage says Jaeger maps the flow of requests and data across a distributed system. ClickHouse is named as an experimental storage backend behind a feature gate and is not in the databases value. Badger and in-memory storage are embedded options named on the storage page and are not recorded as databases. The GitHub repository has releases, so no lastCommitDate is needed. The first release is the oldest GitHub release (v0.5.0, 2017-07-01). runtimeMin is not recorded: the go.mod at v2.22.0 names go 1.27.0, the build toolchain, and the installed binary carries no stated minimum.
