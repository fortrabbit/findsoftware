notes: >
  The root LICENSE says the enterprise/ directories and the packages/ directories carry their own license files, and that the rest is MIT. The enterprise/ path could not be read through the GitHub contents API (404 on the next branch), so the enterprise license is not recorded; a reviewer should check it. GitHub reports the repository license as NOASSERTION, which is why the license fact cites the LICENSE file. The default branch is next. The Business and Enterprise plans on the pricing page list features the Community plan lacks (role based access control, multi-tenancy, publishing workflows, team management, single sign-on, audit logs); userRoles and multisite are recorded with the plan that includes them, and sso is recorded as Enterprise edition from the README licensing section, which names no protocol. The pricing page names managed hosting for the Enterprise plan ("Managed or Self-hosted"), which is a hosted option next to the open source software; no prices are recorded. The docs architecture page names a second deployment target, Webiny Standalone, described as a single long-running Node process backed by SQL storage, in alpha and local only; the README says Webiny only runs on AWS, so the standalone target is noted here and not recorded as runsAs. The README statement that Webiny runs only on AWS is the project's own; the docs call AWS the only production-ready target. The legal entity is "Webiny Inc." from the LICENSE copyright; no headquarters country was found on the pages read, so hqCountry is not recorded. The npm package recorded is @webiny/cli, the CLI the project uses after create-webiny-project, which is a create-* scaffolder.
