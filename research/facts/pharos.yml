notes: "Monorepo: ithaka/pharos holds @ithaka/pharos (the component library, the package the install page names), @ithaka/pharos-cli and @ithaka/pharos-site. Every figure and the currentMajor come from @ithaka/pharos; GitHub release tags are per package, and the highest stable tag of @ithaka/pharos is in the 14 line. The default branch is develop. The getting-started page names yarn and npm. The core README says the package only exports component classes that the application registers on the custom element registry under a scoping prefix, that every component sets a data-pharos-component attribute so bundler minification of class names needs a keep-names setting, and that scoped custom element registries are not yet finalized, so a polyfill is required. The React wrappers live in lib/react-components. The getting-started install tree lists icon assets, design token styles and typography styles inside the package. The LICENSE copyright names Ithaka Harbors, Inc., the legal name recorded as maintainer. The Pharos site footer carries the copyright line of ITHAKA, recorded as parent; the site's \"JSTOR is part of ITHAKA\" sentence describes JSTOR, not Pharos. No page read gives the headquarters, so hqCountry is not recorded. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header."
