notes: >
  Status accepted. Criterion 1: JMeter is a load-testing tool that test engineers use against a site or service; the testing category follows the dataset's rule for load-testing tools (the load-testing group is not in the category vocabulary). Criterion 2: Apache-2.0 source on GitHub, and binary releases from the project's download page. Criterion 3: the user manual's installation paragraph gives the unzip route. Stars and contributors are those of the apache/jmeter repository. The firstRelease year is the changelog entry Apache JMeter 1.0 of Dec 15 1998 (Initial version); the oldest GitHub tag is 5.2-rc4. The download page lists the 5.6.3 binaries with the note Requires Java 8+, which matches the user manual. The NOTICE copyright line names The Apache Software Foundation, and the homepage footer names the foundation too; the foundation is the maintainer here because the project is an ASF project and the NOTICE names it. The build from source route (apache-jmeter-5.6.3_src) is listed on the download page and is not recorded as a separate installMethod. The distributed-testing server mode (jmeter-server) and the CLI mode are documented in the user manual; the homepage lists a command-line mode to load test from any Java compatible OS, the runsAs local statement. The homepage names the Twitter account ApacheJMeter in its footer; it is the project's x fact. The homepage also names Maven, Gradle and Jenkins integrations for continuous integration through third-party libraries; those are not install routes for JMeter itself. The homepage says JMeter is not a browser: it works at protocol level and does not execute the JavaScript in HTML pages or render them. The user manual says GUI mode should only be used for creating the test script and CLI mode must be used for load testing, and that the release is started with the jmeter script in its bin directory.
