notes: >
  The homepage and docs routes are client-rendered: the HTML carries only the site title, so the quoted title is the only text read at arco.design, and the docs page named by the README was not readable. The docs fact rests on the README link, not on the docs page. The npm latest tag is 2.66.18 (2026-10-12) with no GitHub release yet; the highest stable GitHub release is 2.66.17 (2026-10-10), so currentMajor is 2 from either and latestReleaseDate is the npm date. The npm beta tag is 2.67.0-beta.0 dated 2025-04-14, older than the latest stable, so no latestPrereleaseDate is recorded. The package named in the install docs is @arco-design/web-react, which this repository publishes; the Vue library Arco Design Vue is a separate repository and candidate. The LICENSE copyright line names "Bytedance, Inc. and its affiliates", recorded as Bytedance, Inc.; no hqCountry or parent company is stated on the pages read. The README names a Design Lab, a Material Market, an Icon Box and Arco Pro on arco.design as platforms next to the library; these are not priced or costed here, and no paid tier is stated on the pages read. The i18n and CDN facts come from the docs source in the repository, since the docs site is client-rendered. The GitHub contributors count is read from the Link header of per_page=1. npmWeeklyDownloads is the sum of the daily range 2026-10-18 to 2026-10-24: the point/last-week endpoint answered with the week of 2026-06-25 at read time.
