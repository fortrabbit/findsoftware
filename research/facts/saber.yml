notes: >
  Archived on GitHub; the repository is the one the project's site and README name as its source, so status is discontinued. The archive date is not recorded because the API response does not give it; the last push is 2023-01-03 and the last GitHub release is 2020-05-19. The docs' disclaimer says the project "is currently in beta stage", which is not recorded as a field. The npm package saber has versions from 2013-04-09, before the repository was created on 2018-05-23, so the npm history belongs to another project and firstRelease comes from the oldest GitHub release (saber@0.3.2, 2019-03-31). The npm alpha 0.12.0-alpha.20 (2022-02-15) has no GitHub release; it is recorded as latestPrereleaseDate because it is newer than the latest release and the registry is the primary source for it. currentMajor is 0 by the project's own version numbers. The GitHub releases list also carries packages of the monorepo (saber-utils, saber-plugin-*); only the saber@ tags count. The docs state no hosting provider or database. The pages page says that .js, .vue and .md files in the pages folder become pages, and the layouts page says layout components wrap the page content.
