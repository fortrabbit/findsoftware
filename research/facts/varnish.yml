notes: >
  Accepted. The CSV row is boundary; the earlier notes settled that both rows stay in, and the Vinyl Cache record names this distribution as separate. The homepage says Varnish Cache is "a distribution of the open-source Vinyl Cache project" with extra modules and tooling, so basedOn is vinyl-cache. The LICENSE file of varnish/varnish now reads "Copyright (c) 2026 The Vinyl Cache Project" and names the software "Vinyl Cache", so it names no maintainer of this distribution; the README gives "Copyright (c) 2016-2026 Varnish Software AS". The maintainer is Varnish Software AB, the name and headquarters on the contact page (Stockholm, Sweden); "Varnish Software AS" is the name in the older LICENSE and README lines. firstRelease is absent: the GitHub repository varnish/varnish has releases only from 2026-03-16 (varnish-6.0.17), and the varnish.org release table lists versions without dates beyond the supported ones; the 2006 copyright line in LICENSE is not a release date. latestReleaseDate is the date in the varnish.org release table for 9.1.0 (2026-09-23); the GitHub release carries 2026-09-21. The paidEdition quote is the Varnish Enterprise page; it lists a Massive Storage Engine, in-process WAF and extra VMODs beyond the open-source core, and the pricing page is a link only. The Varnish Software CDN product is a service on the Varnish stack, not a hosted Varnish Cache, so hostedOffering is absent. The LinkedIn group and the Stack Overflow tags on the getting-help page are not fields. The varnish.org about, privacy, imprint, enterprise and license URLs return a 404 page, so none is cited.
