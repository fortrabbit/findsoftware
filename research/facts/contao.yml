notes: >
  Coined fields: projectReportedSites (the homepage's stated count of websites built with Contao, no period given) and projectDownloadCount (the download page's running download counter, no period given); both are adoption figures recorded as stated, shown with their dates, never ordered. The install guide installs Contao with the Contao Manager or on the command line with composer create-project contao/managed-edition, a project skeleton whose composer.json requires contao/manager-bundle; packagistDownloads is the contao/manager-bundle total. Other totals on 2026-10-20: contao/managed-edition 112354, contao/core-bundle 1747168, and the monorepo package contao/contao 14993. The download page also offers Contao as a Symfony bundle for an existing Symfony application. The homepage says "Proven. Since 2006." without naming a first release, so firstRelease is not recorded. The legal notice names Contao Association with no legal form; the address is in Lyss, Switzerland. The license is stated as LGPL-3.0 in the GitHub API and on the homepage.
