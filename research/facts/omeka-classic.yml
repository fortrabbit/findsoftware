notes: "The maintainer is the copyright holder the README names, 'Corporation for Digital Scholarship', recorded as stated. The project page says Omeka is a Digital Scholar project and a registered trademark of Digital Scholar, which is not the copyright holder named in the README. The repository README states GPL version 3 'or (at your option) any later version', recorded as a second license entry; the API reports GPL-3.0. The requirements page states the minimum PHP version of Omeka Classic 3.2; the page states that 3.2.1 supports PHP up to 8.5. The install page is an older text that refers to Omeka 1.3.1; the system requirements page is the current source for runtime and database. Omeka.net is a hosting service run by the same project; it is not recorded as a hosted-service candidate. No ended signal was found; status stays accepted."
