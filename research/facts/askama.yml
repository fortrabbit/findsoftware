notes: >
  Maintainer: the LICENSE-MIT copyright line names Dirkjan Ochtman (2017-2020); the crates.io owner list names djc only; the repository is owned by the askama-rs organization, which lists no maintainer on the pages read. Reviewer decision whether the recorded maintainer should be the organization. License: GitHub detects Apache-2.0 alone (the detected text is the Apache file), but the workspace Cargo.toml at v0.16.1 states MIT OR Apache-2.0 and both LICENSE-MIT and LICENSE-APACHE are in the tag; recorded once as the Cargo wording. Lineage: the README says Askama was forked into Rinja and the fork was merged back into Askama; the repository is under askama-rs (created 2024-06-17), while the crate's first upload is 0.1.0 of 2017-02-15, so firstRelease is the crate upload year. A GitHub release named rinja/v0.4.0+deprecated (2025-03-29) sits in the repository; it is a Rinja artifact and is not counted as an Askama release. Not recorded: basedOn for Jinja (the template syntax is based on Jinja, which is not a record of its own); the book's install snippet shows askama 0.14.0 while the current stable is 0.16.1, so the book snippet is outdated and no version is recorded from it. Runtime: the README states "Works on stable Rust"; the crate is compiled into the user's crate, so no server runtime or runsAs is recorded. The homepage, README, Cargo manifests and the book's print page were read: the book describes web framework integration through the askama_web crate (actix-web, axum, warp and others) and states no database or i18n support. Playground at play.askama.rs and the book source (book/src) are the project's own pages. The crate's download count is the crates.io total; 90-day recent downloads are 16686769 at the same endpoint.
