notes: >
  Stable line: 5.0.4 is the highest stable GitHub release (2026-04-17); 4.0.7 and 3.0.14 were released the same day and stay on the releases list, so the 3 and 4 lines are maintained alongside 5. GitHub reports the license as null: the README names two licenses and an MPL 1.1 family statement, and each is recorded as its own entry. The GitHub release list begins in 2016, so firstRelease comes from the project's historical reference, where the earliest release entry is a beta of 1.0.0 dated 2001-08-15; earlier 0.9.5 snapshot builds are dated 2001-05-24 and are not releases. Reviewer to decide whether a snapshot counts. The about page names the funding body as the Firebird Foundation (memberships and donations), and the LinkedIn page is "firebird-foundation-firebirdsql"; the foundation is not named as maintainer and no legal form or hqCountry is stated on the pages read. The server packages page lists HQbird as a commercial distribution for version 2.5 from another company: not recorded as paidEdition because it is not the project's own edition. Links not recorded as fields: LinkedIn, YouTube (youtube.com/SQLFirebird). The features page lists Windows Trusted Authentication and Active Directory integration for database logins; it is not recorded as sso because the value list holds web single sign-on protocols. The community page links a Substack, Telegram and LinkedIn group, which have no field. Fields coined: none.
