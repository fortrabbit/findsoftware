notes: >
  The homepage fractal.thephpleague.com answers over https (the http address redirects to it) and is the project's own site; the GitHub repository field homepage carries it without a scheme. The maintainer follows the LICENSE copyright line (Phil Sturgeon, 2013). The homepage says Fractal "is maintained by Graham Daniels and Jason Lewis", and the README lists Korvin Szanto and Matt Trask as maintainers; neither is recorded. "The League of Extraordinary Packages", named on every page, is a project group and no legal entity, so it is not the maintainer. The installation page says "You need PHP >= 5.4.0", which contradicts the README and composer.json (>= 7.4); runtimeMin follows composer.json at tag 0.21. The installation page's Going Solo section registers an autoloader for the src directory, the second installMethod. The release line is 0.x, so currentMajor is 0; the current release is 0.21 (2025-12-16), and the prior release is 0.20.2 (2025-02-14). The Packagist total is 72,720,052 on the day of research; the CSV figure of 71.1M is stale. The id league-fractal keeps this package apart from the component workbench in fractal.yml. Coined kinds, kept out of fields: output formats (DataArraySerializer, ArraySerializer, JsonApiSerializer; the serializer page calls HAL and JSON-API "two popular ones") and pagination adapters (Illuminate, Pagerfanta, Laminas, Phalcon, Zend). The README calls the library a protective layer between source data and output, so schema changes do not affect users; the transformers page defines a transformer as a class that extends TransformerAbstract and has a transform() method, and the serializers page says a serializer sets how transformed data is structured. The Packagist and ecosyste.ms counts are for league/fractal only.
