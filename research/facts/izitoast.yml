notes: >
  The homepage and the README both give the project as marcelodolza/iziToast; the npm package's repository field names dolce/iziToast, which redirects to the same repository, and the npm author is spelled Marcelo Dolce, while the homepage footer says Marcelo Dolza. The footer names no company. The latest GitHub release and the latest npm version are both 1.4.0: GitHub dates it 2018-08-06 and npm 2018-08-13, and the registry date is recorded. The homepage's changelog also lists a version 1.5.0 "Updated on Apr 5, 2020", but no tag or npm version exists for it, so it is not recorded as a release; the reviewer should decide whether the site's changelog counts. The last push to the repository is 2024-08-07, and no page says the project has ended. The latest release is more than four years before the check date, so the import's rule for criterion 4 moves the record to stub; the status is kept as the candidates row has it. The README's Installation section gives npm, Yarn and Bower command lines; npm and Yarn share one registry and are one route, and Bower is its own route. The homepage's Start section also has HTML steps that include the CSS and JS files from the dist folder, which name no route. The candidates row's notifications value would map to email, which does not fit a toast popup plugin, so the category is the UI component kind, taken from the homepage's own description of the project as a notification plugin. The README's third-party routes (Angular, Vue wrappers, a Rails gem) are not the project and are not recorded. The homepage says all modern browsers are supported, which is compatibility, so no runsAs is recorded. The options table lists an rtl option, which is a label only, so no i18n value is recorded. The oldest tag is v1.0.1, dated 2016-11-18, the same day as the first npm upload.
