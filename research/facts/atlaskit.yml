notes: >
  The design system is the product and @atlaskit/button is the representative npm package for the Atlaskit React components; the npm figures are for that one package, and the design system has hundreds of packages (ecosyste.ms counts 286 dependent packages for the button). The npm weekly figure is the sum of the daily downloads API for 2026-10-18 to 2026-10-24. The package's repository field points at the Bitbucket mirror atlassian/atlassian-frontend-mirror, not GitHub, so no GitHub figures exist. The install docs on atlassian.design are not readable as static text, so installMethod comes from the npm package readme and no runtime is recorded. Two license statements exist: the npm package says Apache-2.0, and the design system page on atlassian.design grants a proprietary license for use of the ADS, its documentation, assets and code packages, restricting modification, redistribution and reverse engineering, granting the license for use in add-ons and integrations that interoperate with Atlassian software and cloud products, and ending if Atlassian ceases to offer the design system generally; both are recorded as their own entries. The firstRelease year comes from the earliest version upload of @atlaskit/button in the npm registry (1.0.0, 2017-01-29). Atlassian's headquarters are not stated on the pages read; the only Sydney reference is a design studio, so hqCountry is absent.
