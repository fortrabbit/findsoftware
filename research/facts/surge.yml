notes: >
  The CLI is the repository's software; the hosted platform at surge.sh is the service it publishes to, recorded as hostedOffering, with its locations and limits on the homepage and pricing page. The homepage Pro plan and the Free plan are hosted plan tiers, so no paidEdition is recorded; the pricing page lists Password protection and Redirects and rewrites under Pro and gives prices, which are not recorded. The pricing page also lists collaborators, previews and scoped tokens on every plan; no userRoles fact is recorded because it is not stated as roles. The homepage links a community Slack invite; Slack has no field. The README gives the license as ISC, the repository's GitHub license detection is null, and the package.json and npm latest both say ISC. GitHub releases stop at v0.19.0 (2017-03-18) while the tags continue to v0.52.4 without releases; the registry major is 0 as well, so currentMajor is 0 and latestReleaseDate comes from the npm latest publish. The npm first upload 2014-07-18 is older than the oldest GitHub release (v0.7.4, 2015-03-02), so firstRelease is 2014. The homepage describes the project as "since 2014". The homepage states "100k+ Installs of the CLI from npm every month", a download claim that is not recorded as reportedInstalls. The homepage counter of deployments (18,791,349 at the time of reading) is a live figure and is not recorded. The surge.sh homepage, pricing and terms are read live; the legal name is "Chloi Inc." in the README and terms, and the contact line says Chloi, Inc.
