notes: >
  The homepage comrak.ee answers 200 over https and states the project's own description, license and documentation pointers. The repository's GitHub license detection reports NOASSERTION; the license is BSD-2-Clause as the homepage and the crate metadata state. The README's LICENSE statement at main gives copyright 2017-2026 for "Comrak contributors", and the COPYING file at tag v0.59.0 gives 2017-2025; no person is named in the copyright line. The maintainer is the project-named contributors line of the COPYING file ("Comrak contributors"); Asherah Connor, whom the README names under Contact and as the author for security reports, is noted here only. The repository owner is a user account. The firstRelease year comes from the commit of tag 0.1.0 (2017-04-07), which matches the crate's creation date; the repository was created 2016-11-17. The release list on GitHub runs from 0.1.8 (2017-08-20) to v0.59.0 (2026-10-26); v0.45.0-rc.1 is a prerelease older than the latest release, so no latestPrereleaseDate is recorded. The currentMajor is 0 because the highest stable version is 0.59.0; the minor line 0.59 is the version the README and crate show. The runtimeMin 1.89 is the rust-version of Cargo.toml at tag v0.59.0; the README sentence "Comrak's library supports Rust 1.89+" carries the same value inside markup and is not quoted. The crate figure is the crates.io total download count (about 3.3 million of them in the last 90 days). The homepage says Comrak can be used on the command line and as a Rust library, and that a WASM target runs in webpages; with both contexts named, runsAs is not recorded. The CommonMark compliance statement ("Compliant with CommonMark 0.31.2 by default") and the GFM extension list (four of five extensions; the tagfilter extension was deprecated in 0.55.0 and removed in 0.56.0) are kept in notes as coined kinds. The README states that raw HTML and dangerous links are scrubbed by default and can be allowed with the unsafe option. By default none of Comrak's own extensions (footnotes, math, alerts and others) are enabled; each parse enables them individually. The README says the Disallowed Raw HTML (tagfilter) extension was deprecated and removed, and that it should not be used. When the unsafe option is set, the README recommends a sanitisation library such as ammonia, configured for the application. The Bindings section lists commonmarker (Ruby), MDEx (Elixir), comrak and comrak-ext (Python) and comrak-wasm (TypeScript); commonmarker is recorded with basedOn comrak on its own record, and the others are not in the candidates list for this area. The Users section lists crates.io, docs.rs, GitLab, Deno and Reddit (a fork); these are named users, not counts, and no field records them. The GitHub stars and contributors belong to the repository, which holds the library and its CLI. The install routes are cargo (library, cargo install for the CLI) and prebuilt binaries; Homebrew, Scoop, pacman, dnf and nix are third-party packages named on the README and are not recorded as installMethod entries.
