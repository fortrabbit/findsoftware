notes: >
  The site at react.daisyui.com answers over https (the CSV row lists http) and serves a Storybook shell with no readable text on this check; the README is the source of the link and the component list. The install section names TailwindCSS and daisyUI as requirements to install beside the package; they are dependencies, so only daisyui and react are recorded as basedOn. The npm package react-daisyui has a beta tag for a checkbox-server branch build, which is not a release line and is not recorded as a prerelease. The npm figure counts downloads of the react-daisyui package from the registry; the GitHub release list starts at v1.0.0 (2022-03-12), and the npm history starts at 0.0.1 (2022-03-01), so firstRelease is 2022 either way. The README marks two components as deprecated, which is a component status and no project end signal. The HTTP Archive technologies list carries daisyUI, not this React package, so no site count is recorded here. The LICENSE copyright line names "daisyui", which is recorded as stated. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header.
