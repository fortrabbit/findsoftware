notes: >
  The LICENSE file is the MIT License with the copyright line "A-Frame authors". The community page names Stack Overflow as "the official place to ask questions and get technical support", recorded as forum. Built on three.js: the README says A-Frame is "a powerful framework on top of three.js", but no three.js record exists in research/facts, so the parent is left out of basedOn and sits here. The import has no category for the "vr" word, so it is not recorded. The Discord link is the Supermedium server with an #aframe channel on the community page, so it is recorded as the discord fact; the page also names a general WebXR Discord and a general WebVR subreddit, both outside this project and not recorded. The community page's "A-Frame Components" entry is an npm tag search, not a directory the project runs, so pluginDirectory is not recorded. The npm weekly figure covers 2026-10-26 to 2026-11-01. The GitHub release v1.8.0 is dated 2026-06-24 and the npm upload 2026-06-23, the GitHub date is used. The CSV's npm figure (19.9k a week) predates the current window. firstRelease is the npm upload of 0.0.0 in 2015, older than the first GitHub tag.
