notes: >
  The README title is "Rust I18n" and the crate is rust-i18n, so the record takes the README name. Doubt on the maintainer: Cargo.toml lists Jason Lee as author, but the LICENSE copyright line names Longbridge, which the record follows; no page read states where Longbridge is headquartered, so hqCountry stays out. The README says the API is inspired by ruby-i18n and Rails I18n, which is no basedOn or alternativeTo statement. The README's Extractor section marks the cargo i18n command as experimental and installs it through the separate rust-i18n-cli crate, which is no installMethod of this library. The optional features (log-miss-tr, load-path) and the translation file layouts are described in the README and are not recorded as fields. The README's Use Cases list names other projects and their star counts, which are not recorded. The first crate version 0.1.0 and the first GitHub tag date from December 2021. The currentMajor is 4 from the stable v4.2.4 release, and the minor line stays out of the record. The crates.io download figure is the crate's all-time total. The GitHub stars and contributors belong to the single repository. The project publishes a Rust crate only, so no npm figures are recorded.
