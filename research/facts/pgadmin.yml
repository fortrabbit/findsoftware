notes: >
  The homepage announces version 9.19 on 2026-10-29 and PyPI carries it (upload 2026-10-29), but the repository has no tag after REL-9_18, which is dated 2026-09-17 (annotated tag, tagger date); currentMajor comes from the tag and is 9 on either line, and latestReleaseDate takes the PyPI release because it is the newest stable release. The docs record version 4.0 with the release date 2019-01-10 in its release notes; firstRelease is the oldest tag, REL-1_0-BETA1 (2016-06-08), and REL-1_0 is dated 2016-09-27. GitHub reports the license as NOASSERTION, so the license entries come from the licence page and the LICENSE file, which say the same. The release notes name Python 3.9 and 3.10 and Flask-Security-Too versions, but state no minimum Python version, so runtimeMin is left out. The "Deploy Cloud Instance" wizard and the PostgreSQL Cloud Deployment page concern PostgreSQL instances on pgEdge's cloud, not a pgAdmin service, so no hostedOffering is recorded. The PyPI figure is last month's downloads from pypistats (the PyPI API does not report downloads); the Docker Hub count is for dpage/pgadmin4, the image the homepage names. The support page names a support mailing list (hosted on postgresql.org) as the place for questions and says there is no paid support; PyPI declares no requires_python for the latest release. Contributors counted across all pages with per_page=1 and the last-page link.
