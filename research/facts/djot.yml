notes: >
  The repository holds the syntax description, cheatsheet, editor tooling and a web folder with the sandbox page, but no parser; the parser the homepage installs is the npm package @djot/djot, whose registry entry names no repository, so its source is not confirmed here and the reviewer decides whether the repository or the package is the record's source. The homepage lists implementations in JavaScript, Lua, Prolog, Rust, Go and PHP, and the repository README lists seven, each published separately; none is recorded as a fact of this record. The homepage says the syntax "isn't completely stable yet" and that the official JavaScript implementation "is complete and ready for use". The GitHub repository language reads Lua, which is the pandoc filter in doc/, so no language fact is recorded. The category markup has no entry in the import's category map, so the reviewer decides which category the register shows. The npm figure is the package the homepage installs, summed over 2026-10-26 to 2026-11-01. The npm package's latest version is 0.3.2 and the repository's latest GitHub release is 0.2.0; both are major 0. The GitHub release for 0.1.0 is dated 2022-07-30, after the repository was created on 2022-07-11. The docs link is the syntax description the homepage links, read from the repository. The homepage's "Discussion forum" link goes to the repository's discussions. The GitHub statistics belong to the repository, which holds the syntax, not the npm package. The homepage shows converting a GitHub-flavored Markdown document to djot with the JavaScript implementation and pandoc; GitHub-flavored Markdown has no record, so no importsFrom is recorded.
