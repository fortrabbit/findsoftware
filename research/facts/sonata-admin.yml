notes: >
  The candidate row's homepage (sonata-project.org/bundles/admin) and the GitHub homepage field both return 404; sonata-project.org redirects to the Sonata documentation site, which is recorded as the homepage. The install page says the bundle needs a storage bundle (SonataDoctrineORMAdminBundle or SonataDoctrineMongoDBAdminBundle) before it can talk to a database, so databases come from those bundles' descriptions. No page states how the bundle runs on a host, so runsAs is unknown; the bundle runs inside a Symfony application. The repository branch 4.x is the default. The docs site lists the bundle under its main section, not under its abandoned list. Maintainer is the LICENSE copyright holder; the repository sits under the GitHub organization Sonata Project. The contributors count is the anonymous-included count from the contributors API Link header.
