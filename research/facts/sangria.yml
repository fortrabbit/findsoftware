notes: >
  The README names no JVM: it says "a scala GraphQL library", and the getting-started page says "Sangria is a Scala GraphQL implementation", so runtime is left out for the reviewer to decide. The README and the getting-started page name no minimum runtime. The download page lists Scala 2.11 and 2.12 for the artifacts and states a stale latest version; the release tag v4.2.20 and the Maven metadata are used instead. The Maven artifact sangria_2.13 is the one the README badge names; a sangria_3 artifact also exists on Maven Central, not recorded. Maven publishes no download figure, so none is recorded. The oldest Maven Central upload under the sangria name is sangria_2.11 0.2.0 from 2015-08-02, which sets firstRelease; the sangria_2.13 artifact starts later. The 4.3.0-RC1 pre-release on Maven Central predates the latest release, so no latestPrereleaseDate is recorded. The build.sbt developers list names Oleg Ilyenko first and Yann Simon second; the first is recorded as the maintainer, and the license wording in the README is the only one (build.sbt says "Apache License, ASL Version 2.0", the same license). The README calls the library "a spec compliant GraphQL implementation" that works with Apollo, Relay and GraphiQL; that compatibility is not a field. The project chat is on Gitter and questions go to StackOverflow; neither has a field in the register. The sangria-relay, sangria-circe and other companion artifacts are separate packages, not recorded. The home page has no social links. The getting-started page builds a schema in Scala code, then exposes it over HTTP with akka-http and Play; the sangria-playground repository is named as an example of a GraphQL server written with Play.
