notes: >
  Stub: no page of the project states how to add the crate to a project; the README, the docs.rs crate and function pages, the examples and the CHANGELOG carry no dependency line. The README points to the docs.rs documentation and to the examples folder for getting started; docs.rs shows code only and the examples are Rust files with no install step, and no rust-version is stated in the current manifest (the CHANGELOG's minimum Rust versions are historical, so runtimeMin is not recorded). What would settle it: a page or README section stating the Cargo dependency line, or the crate's getting-started guide. The project has no homepage of its own; the crates.io entry and the GitHub repository name no site, so homepage is absent. The README says database handling and templating are not directly handled by the library. It says the library creates a listening socket, and its FAQ says each request is handled in its own dedicated thread with synchronous I/O. The crates.io figure is the 90-day count (recent_downloads); the all-time total is 18142691. The last crate upload is 3.6.2 on 2023-04-24 and the last push on the default branch is 2025-06-17; no archive flag, deprecation or end statement was found. The GitHub releases start at v3.1.0 in 2021, but the crate's first upload is 0.1.0 on 2016-01-24, older than any GitHub release, so firstRelease uses the registry. The maintainer is the Cargo.toml author; no legal name is stated.
