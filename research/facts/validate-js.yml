notes: >
  Discontinued on the project's own README, which carries an "Archive Notice": the maintainer no longer has the time to maintain the project, no new features will be added and no bugs will be fixed, and the repository is archived on GitHub (archived true, pushed 2021-12-11). The notice sits in the README of the repository the project names as its source. The homepage at validatejs.org answers over https and still says the library "can be considered fit for production"; that text is older and states no status, so it does not contradict the notice, but a reviewer should confirm the decision. The homepage changelog dates 0.13.1 to June 2018 while the GitHub release and the npm upload date it to June 2019; latestReleaseDate follows the release object. The npm package was created in 2013 and the first tag, 0.1.0, is from the same year. The LICENSE copyright line names Nicklas Ansman and also "2013 Wrapp"; the homepage says validate.js is an open source component of Wrapp and the changelog records a repository move from wrapp to ansman. Wrapp is a legal entity other than the recorded maintainer, so it stays in notes and no parent is recorded. The install section lists Browser/CDN, npm, Bower and component, and the downloads section offers a production build; each is its own installMethod, the CDN one quoted without the version segment of the URL. The homepage states the runtime as ECMAScript 5.1 in both the browser and node.js; no runsAs is recorded because the page names both. The package has no engines field, so runtimeMin is absent. The npm figure is the validate.js package the install commands name. The homepage says the validation constraints can be declared in JSON and shared between clients and the server, and that the library has no required external dependencies. Stars and contributors belong to the repository.
