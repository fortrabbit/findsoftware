notes: >
  Infection is the only repository of the infection/infection package, and the install docs name that package for Composer. The release line is 0.35 (0.35.11 is the newest stable release, 2026-11-15); currentMajor is 0 under the major-only rule, and the 0.x line is the minor line. The first GitHub release is 0.1.0 (2017-07-01). The homepage's own counters (installs, packages depending on it) differ from the Packagist and ecosyste.ms figures and are not recorded. Stars and contributors belong to the repository, which is not a monorepo. The PHP minimum comes from the composer.json at tag 0.35.11 and matches the guide's "requires PHP 8.3+". The runsAs local fact rests on the CI sentence of the guide's CI page. Installation routes recorded: PHAR download, Phive, Composer global, Homebrew. Phive is recorded as its own route; the git clone route is left out because the page describes it as suitable for Infection development or a quick local trial. The guide names four test frameworks (PHPUnit, PhpSpec, Codeception, Testo) and the Phar bundles them; the key list has no field for them, so they stay here. The category is testing: mutation testing is a testing tool. The compare page says Humbug is discontinued and refers its users to Infection; Humbug has no record, so no successorOf. The GitHub organization infection is the repository owner; the LICENSE copyright line names Maks Rafalko, who is recorded as maintainer. The Playground at infection-php.dev runs in the browser as a demo, not a hosted service, so there is no hostedOffering fact.
