notes: >
  The install docs name @tsed/cli (1171 npm downloads in the week 2026-10-12 to 2026-10-18), a scaffolder, and the repository is a monorepo, so by the rule the core package @tsed/core is recorded as npmName (@tsed/core latest is 8.x, @tsed/cli is 7.x). runsAs is not recorded: the getting-started page only shows a console log line "Listen server on" from a run, and the docs also document serverless adapters. The LICENSE copyright names Romain Lenzotti; team.json lists further maintainers, so the maintainer field follows the license line. The docs name Node.js and Bun.js runtimes; the Bun runtime is experimental in the CLI prompt. Serverless targets (AWS, Serverless HTTP) are documented as platform adapters; their runtime is not recorded. Release date is the GitHub release v8.44.0. Stars and contributors come from the repository API.
