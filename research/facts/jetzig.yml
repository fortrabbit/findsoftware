notes: >
  The homepage jetzig.dev is the project's own site, served over https, and the GitHub README links it as the official website. The quickstart says Jetzig requires the Zig master (nightly) build, and the README says the main branch tracks the latest Zig nightly and that older Zig versions are not supported; no minimum version is recorded because the requirement is a moving build, not a version. The repository has one tag (v0.14.1, annotated, tagger date 2025-09-17) and a branch or tag named dev, and no GitHub release; the tag date is used as latestReleaseDate, and firstRelease is left unknown because the tag list holds no earlier release. The repository was created 2024-01-20 and was last pushed 2026-06-12. The LICENSE names Robert Farrell as copyright holder and the homepage footer names the Jetzig Framework with copyright years 2023 to 2024. The homepage lists Zmpl, http.zig and JetQuery; they are the project's dependencies or sibling packages and are not recorded as basedOn because the docs do not say Jetzig is built on them. The database documentation says PostgreSQL is the only adapter and SQLite is planned. The about page has a checklist of production readiness items whose status marks are not readable in the raw text, so nothing is taken from it. The downloads page shows pre-compiled CLI builds and the zig build install route; the runtime is the compiled application binary. The about page lists Linux, OS X and Windows as supported operating systems. The roadmap on the about page lists "Build-time static content rendering" as completed and the homepage names it under Zmpl, but no page states a static-only deployment, so renderingModes stays unrecorded.
