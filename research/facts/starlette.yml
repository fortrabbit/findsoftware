notes: >
  Criteria 2 and 3 hold on the README and the starlette.dev documentation: the framework installs with pip and the README names uvicorn as the ASGI server it runs under. The homepage is https and is the project's own documentation site; the docs source is the docs folder of the repository. The PyPI JSON for starlette returns -1 for download periods, so pypiDownloads is the last_month figure of the pypistats API. The LICENSE.md copyright holder is Encode OSS Ltd, which the maintainer field records with its legal form; the pyproject names the license BSD-3-Clause, which matches the GitHub API. The GitHub release tags have no v prefix (1.10.0). The PyPI first upload, version 0.1.0 on 2018-06-25, is the same day as the repository's creation and older than the first GitHub release listed, so firstRelease is 2018. The docs say an ASGI server such as uvicorn is installed to run the application, recorded as always-on. The docs list Jinja2 templates as an optional dependency, which is recorded as templating; no other template engine is named. The GitHub owner is the user Kludex, and the README names no company for the project beyond the copyright line.
