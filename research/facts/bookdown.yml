notes: >
  The project has no working homepage: bookdown.io, which the README and the repository description name, has an expired certificate and serves an unrelated site, so no homepage is recorded.
  The documentation is the GitHub Pages site bookdown.github.io, published from the organization's bookdown.github.io repository; its getting-started page documents installation with composer create-project on the bookdown/project skeleton, not on the library package.
  The repository README itself documents no installation, only running the tests after composer install.
  The repository is not archived, Packagist does not flag the package abandoned, and no page states an end, so the status stays accepted; the last release is from 2019 and the last push from 2022, which decide nothing.
  The default branch is 1.x; a 2.x branch exists whose composer.json requires PHP 7.4 or later, but Packagist lists no 2.x release, so currentMajor is 1 and runtimeMin follows the documentation page.
  The LICENSE names Paul M. Jones as the copyright holder; maintainer follows the composer.json author line.
  The documentation does not name a server for the generated HTML beyond GitHub Pages and PHP's built-in server for review.
