notes: >
  Status is discontinued on the maintainer's own word: the GitHub repository description reads "[Deprecated] Charts for Laravel", the end note the wave 60 rule counts. The README and charts.erik.cat carry no deprecation sentence, and the candidates CSV accepted the row; a reviewer must confirm the status. The README warns that the v7 version has its own history and links an issue comment from 2022; no v7 release exists, so currentMajor is 6 from the highest stable release 6.9.0, published 2026-03-18. The homepage is the project's documentation site (charts.erik.cat, with a Documentation section and the GitHub link), and the README calls it the documentation for version 6. The installation page reads "Last Updated" in 2019 while the releases run to 2026; the install route is recorded as the page states it. The README says the library "supports multiple charting libraries" and the docs name a Supported Libraries section; that page did not resolve at the path tried (404) and the charting libraries are not recorded. The install page says Laravel Charts needs no other dependency and that a service provider and a published configuration file (vendor:publish, charts_config) are optional setup steps, which are notes only. The maintainer is the copyright holder named in LICENSE, Èrik Campobadal Forés, with the homepage footer's 2018-present copyright; no legal entity or country is stated, so hqCountry is not recorded. firstRelease 2016 comes from the creation time of the Packagist package consoletvs/charts, 2016-09-24; the GitHub repository and the versions Packagist still lists start in August 2022, when the repository was created, and the package's earlier versions are gone from the Packagist listing. The ecosyste.ms dependent counts are for the Packagist package consoletvs/charts. The Packagist package carries no abandoned flag. The coined kind for chart rendering libraries is left to notes. The CSV row's 4.2M total Packagist figure is replaced by the current 4393706 total, read on 2026-11-16. The categories are charts and library: it is a PHP library that runs inside the Laravel application on the server, so hosting follows its runtime.
