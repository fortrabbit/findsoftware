notes: >
  The README says Rage "uses Rails compatibility as a foundation" and that a Rails integration exists; that is a compatibility statement, not a parent project, so basedOn is not recorded. The docs (rage-rb.dev) were read on intro, rails, deferred, controllers, common-patterns, logging, openapi, websockets, sse, telemetry, event-system, routing and rspec; no paid edition, hosted offering, pricing page, SSO, i18n or admin UI was stated. The homepage nav lists Docs, API and Blog and a View on Github link; the docs pages carry an X link in the header and a GitHub Discussions link in the footer Community list, recorded as x and forum; no discord, bluesky, mastodon or newsletter link was found. The firstRelease comes from the project's own blog post for version 0.1, dated September 15, 2023, which is older than the first GitHub tag in the releases list (v1.0.0, 2024-03-13). The gemspec states required_ruby_version >= 3.3.0, and the README badge says Ruby 3.3+; the gemspec is recorded. The registry figures are for the gem rage-rb, which the install docs name; the RubyGems total download figure is recorded as the API states it (all versions, no period). The GitHub stargazer and contributor counts are from the repository and its contributors endpoint, which the rage-rb organization owns. The maintainer legal name is the copyright line in LICENSE.txt and the gem's author; no imprint or terms page was found on rage-rb.dev. The sitemap lists no deployment page: the deployment statements come from the Rails guide's Docker example and the deferred job page.
