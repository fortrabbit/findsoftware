notes: >
  No homepage: the GitHub repository is the only project page, and the CSV row points to it. The npm package has no repository field; the repository has tags up to v1.1.3 but no GitHub release, so currentMajor and latestReleaseDate come from the npm latest tag 1.1.3 (published 2012-12-12). The LICENSE copyright line names Nodejitsu Inc.; the README names Charlie Robbins as author. The README marks layout properties in layouts/layout-name.json as not yet supported and lists an RSS feed and nested partials on its roadmap; both are stated on the page. The package depends on older Plates, Marked and flatiron releases, which are not recorded as facts.
