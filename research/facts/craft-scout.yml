notes: >
  No homepage is recorded: the project has no website of its own. The studioespresso.co site (Studio Espresso, a consultancy) lists Scout among its plugins and its footer names only "Studio Espresso" with no legal form or country, so hqCountry stays out. The plugin store listing is Craft's marketplace page and is recorded as pluginDirectory, not as a homepage. The README says the plugin requires Craft CMS 4.x or later and PHP 8.0.2 or later; the composer.json at the 6.0.0 tag requires PHP ^8.2.0 and craftcms/cms ^5.0.0-beta.1, and the plugin store lists compatibility with Craft 3, 4 and 5. The manifest at the release tag sets runtimeMin, and the README's older requirement is stated in this note only. The basedOn quote is the README's requirement sentence, which predates the composer constraint; the README is the statement that Craft is the parent. The algolia/algoliasearch-client-php dependency and the README configuration (application_id, admin_api_key) show that search runs on Algolia, a hosted service; no Algolia pages are read, so the Algolia relationship is noted and no hosted-service record is written for it. The composer.json authors also name Rias (rias.be) as a co-author; the maintainer is recorded as the project states it, Studio Espresso, from the license copyright. The README defines each index with an element type, a criteria function and a transformer in the config file, which the prose describes. The GitHub default branch is v6 and the README and composer links use it. The packagist first upload is 0.1.1 dated 2017-12-12, the oldest version in the p2 feed, so firstRelease is 2017. The plugin store shows a 5 out of 5 rating and reviews, which are not recorded. The download count is Packagist's total; the monthly figure is 2286 and is not recorded. The ecosyste.ms and Packagist figures are read on 2026-10-28.
