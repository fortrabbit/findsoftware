notes: >
  The GitHub API reports the license as NOASSERTION, so the license entries come from the README statement and the crates.io record, which both read MIT OR Apache-2.0. The latest stable release is v0.5.2 on GitHub (2026-10-23); the homepage shows the same version dated Oct 25, 2026, and the GitHub date is recorded. The first GitHub release is v0.1.0 (2016-12-23); tags v0.0.10 and v0.0.11 from 2016 are not releases, and the year is 2016 either way. The crates.io figure of 14538405 is the all-time total; crates.io's recent figure is for 90 days and is not recorded. runtimeMin is the rust-version the crates.io record gives for the latest version. Rendering is not stated on the guide pages read, so renderingModes is absent. The README's Matrix chat is not a field. databases comes from the rocket_db_pools driver tables and the state guide.
