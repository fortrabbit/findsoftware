notes: >
  Status: accepted from the CSV row. Spotlight works without a Sentry account: the getting-started page says "You don’t need a Sentry account to use Spotlight", so the hosted-service rule does not apply. Runs locally: the README calls the Sidecar "a local proxy server running on your machine"; runsAs is local because the pages say the tool is for local development. Install routes: npx (quick start), global npm CLI, desktop app for macOS, Linux and Windows (download page on GitHub Releases), and the ghcr.io container image; the container image is on GitHub Container Registry, not Docker Hub, so no dockerPulls. Criterion 1 wiring: an app adds Spotlight to its Sentry SDK configuration with spotlight set to true in development; the homepage says the tool is "powered by Sentry SDKs, supporting 100+ languages"; that SDK wiring is the criterion 1 statement, and the SDK packages themselves are the Sentry record's concern. Legal name: the homepage footer reads "© 2025 Functional Software, Inc. (d.b.a. Sentry)"; the LICENSE copyright line names Sentry, so the maintainer is Sentry and the legal entity is in notes; the homepage says "Developed by Sentry.io", which is no ownership statement, so no parent. The GitHub license detection shows Other, but the LICENSE file is the Apache-2.0 text; the npm package states Apache-2.0. Versions: the monorepo ships the spotlight package, its releases are tagged per package, so currentMajor and latestReleaseDate follow @spotlightjs/spotlight; the oldest tag is the sidecar package of 2023-11-14. The newest prerelease is dated 2024-08, older than the latest release, so no latestPrereleaseDate. No runtime is stated on the pages read (the npm package ships a Node CLI, which is not a page statement), so runtime is left out. The Discord link is taken from the docs footer. No hosted offering, paid edition or pricing page was found.
