notes: >
  The project has no GitHub release and no tag, so no major version or release date is recorded; lastCommitDate is the committer date of the newest commit on master, and the import judges listing by it.
  The homepage and README name Pelican and Sphinx as the tools the theme and plugins work with; no page states that m.css is built on either, so basedOn is not set.
  The repository holds a Pelican theme (pelican-theme/), a Doxygen C++ documentation theme with doxygen.py, and a Python documentation theme with python.py; the generators are recorded as docs-generator in categories.
  The homepage gives Gitter as a chat, which has no field; the copyright on the homepage reads 2017 to 2024.
  The GitHub license detection reads NOASSERTION, so the license comes from the README statement.
  The homepage is served over https. The Pelican theme and plugins state Python 3.5 and newer, and the Python and Doxygen documentation generators state Python 3.6, so no single runtimeMin is recorded. The language comes from the GitHub API, which reads Python, since no page states it.
