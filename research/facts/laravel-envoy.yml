notes: >
  Operating systems: the docs say "Currently, Envoy only supports the Mac and Linux operating systems." and that Windows support is achievable with WSL2. Default branch is 2.x; latest stable release v2.12.2 is 2026-04-01, the first Packagist upload (1.0.0) is 2014-02-10, and the oldest GitHub release is v1.6.2 from 2019. The composer.json at v2.12.2 states php "^7.2|^8.0" (runtimeMin 7.2), while its illuminate and symfony requirements span newer majors; runtimeMin follows the manifest as written. The maintainer is the copyright holder in LICENSE.md; the Laravel organization owns the repository. Dependency counts come from ecosyste.ms for the Packagist package laravel/envoy.
