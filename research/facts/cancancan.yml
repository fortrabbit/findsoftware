notes: >
  No homepage: the gem's RubyGems homepage_uri and the gemspec homepage point to github.com/CanCanCommunity/cancancan, which redirects to coorasse/cancancan; the repository is recorded at its current address. The README says "CanCanCan 3.x is tested with Ruby 2.7+ and Active Record 5.2 to 8.1"; the gemspec at tag 3.7.0 states required_ruby_version '>= 2.2.0', and runtimeMin takes the manifest. Active Record is not a dependency of the gem. The README calls the Rails helpers one of two parts of the gem; no basedOn is recorded because no sentence says the gem is built on Rails or is a plugin of it. The LICENSE copyright line names Ryan Bates; the gemspec authors are Alessandro Rodi (Renuo AG), Bryan Rite, Ryan Bates and Richard Wilson, and the README lists sponsors (Membean, Goboony, Renuo AG) that are no maintainers. The first RubyGems upload 1.7.0 (2014-02-19) is the oldest version on RubyGems. The rubygemsDownloads figure is the total from the RubyGems API, with no period beyond total. The Gemfile line is the install route, quoted as its sentence.
