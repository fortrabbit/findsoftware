notes: >
  Highest stable GitHub release is v53.0.0 (2026-09-16), so currentMajor is 53. The npm package @slidev/cli is the one the getting-started page installs, and its latest version matches the release. The CSV carries the ssg tag; the docs call the build output a single-page application, so no ssg category is recorded. Criterion 1 holds through the static build output; the presentation use is the stated purpose. Zephyr Cloud and Docker images are third-party hosting options named on the hosting page, not recorded. The docs page names the Theme Gallery and Addon Gallery; only the Theme Gallery link is recorded as pluginDirectory. The README lists embedding Vue components in slides. The Why Slidev page has comparison sections against Microsoft PowerPoint / Apple Keynote and Reveal.js, which are the basis of alternativeTo. firstRelease is the year of the first npm publish, since the GitHub release list is not read beyond its first page.
