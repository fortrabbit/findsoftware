notes: Phlex does not follow SemVer; the README says it follows BreakVer, so the major in currentMajor is the break version (2), from the highest stable GitHub release. The homepage footer names Joel Drapper and Will Cosgrove as the people who made it; the LICENSE copyright names Joel Drapper, so he is the maintainer and Will Cosgrove is recorded here only. The gem's source_code_uri metadata points to github.com/phlex-ruby/phlex, which redirects to yippee-fun/phlex, the repository recorded here. The getting-started page states that Phlex is a standalone Ruby library with zero dependencies, that most users add it to a Rails app through the phlex-rails gem (which the install step names), and that Sinatra, Roda, Hanami or any other Ruby framework works too with rendering started by the application; no page states that Phlex runs as a separate process, so runsAs is not recorded. The first gem upload (0.1.0, 2022-06-03) comes from the RubyGems versions API. The repository's default branch is main. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header. The rubygemsDownloads figure is the gem's total as the RubyGems API reports it. The docs live on www.phlex.fun; the v1 docs on v1.phlex.fun are not recorded.
