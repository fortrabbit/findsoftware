notes: >
  The GitHub repository has no LICENSE file (the raw LICENSE path returns 404), so GitHub reports license null; the GPL-3 statement comes from DESCRIPTION and the CRAN page. The DESCRIPTION names Hugo as the static site generator the package supports best, with Jekyll and Hexo also supported, and its SystemRequirements name Hugo and Pandoc; no basedOn is recorded because the project states it supports Hugo rather than builds on it, which a reviewer may decide differently. The DESCRIPTION copyright line names Posit Software, PBC as copyright holder (cph, fnd) and the CRAN and pkgs pages name Yihui Xie as author and maintainer; parent is left out because the copyright holder is not stated as the owner. Contributors are counted across all 60 pages of the per_page=1 contributors request. The CRAN page reports version 1.24 published 2026-06-19 and the GitHub release v1.24 has the same date; NEWS.md lists version 1.25 as in development, which is not a release. The CRAN download figures are not in the sources read here, so no download figure is recorded.
