notes: >
  Current major is v1 (highest stable release v1.62.0, 2026-10-01); the repository's default branch is development and has no release flagged as a prerelease. The README and the homepage are the project's own pages; the docs live at gofr.dev/docs, read through its introduction, deployment, cloud deployment, configuration, datasource, RBAC, authentication, GraphQL, migrations and MCP pages. Two Discord invites exist: the README links discord.gg/wsaSkQTdgq and the team page links discord.gg/5ACeSKGt37; the README invite is recorded. The team page footer also links Reddit and X. The maintainer is recorded as the team page names the group, "GoFr core team", since no legal name appears on the LICENSE or the site. The Apache license file carries no copyright line. The cloud deployment guide also names GRPC_PORT and METRICS_PORT. GoFr is a Go module with no download figure, so no registry figure is recorded. The importsFrom values come from the migration guides under gofr.dev/migrate and the alternativeTo values from the comparison pages under gofr.dev/comparison, both linked in llms.txt. The GraphQL page describes a schema-first API, and the authentication page lists basic auth, OAuth 2 and JWT; neither is recorded under a field, since no starter field covers them.
