notes: >
  Highest stable GitHub release is v0.15.2 (2026-08-29), which is also npm latest; the major is 0 because the project is pre-1.0, and the docs ("Versioning" section) say breaking changes are released with a new minor version until a 1.0 release. The docs footer says "Copyright 2016-2026 MoleculerJS Documentation"; the maintainer is taken from the LICENSE copyright line, which names Icebob. The candidate row lists the category microservices toolkit; the install docs and the homepage describe a framework for Node.js and TypeScript. The homepage lists transporters (TCP, NATS, Redis, Kafka, MQTT, AMQP) and an API Gateway module in the docs navigation; neither is recorded as a field. Criterion 1: the docs page "What is Moleculer?" says "Moleculer works as a regular web framework too (with moleculer-web as the HTTP layer)". The firstRelease year is the year of the first npm publish. The npm engines field declares node >= 22.x.x.
