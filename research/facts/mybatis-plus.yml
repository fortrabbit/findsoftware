notes: >
  Release: the newest stable GitHub release is v3.5.18.1 (2026-10-27). Maven Central's com.baomidou:mybatis-plus newest version is 3.5.18, so the GitHub release is the newer one. The default branch is 3.0; its README is the install guide the record reads.
  firstRelease 2016 comes from the oldest Maven Central upload of com.baomidou:mybatis-plus, version 1.0 of 2016-01-27, the same day as the GitHub tag v1.0.
  runtime jvm and runtimeMin: the install page of the documentation site says the 3.0 line is built on JDK 8 and lists JDK 8+ as the requirement. The README's table of optional SQL parser modules states JDK 11+ for the default module and for two others, and JDK 8+ for one; that is a requirement of those modules, so it is not the recorded minimum. The pom compiler setting is not used.
  The install guide names Spring Boot starters (mybatis-plus-boot-starter and the Spring Boot 2, 3 and 4 variants) as Maven Central artifacts; the core artifact com.baomidou:mybatis-plus is the one recorded for mavenCoordinates, as the English site's install snippet names it. Spring Boot is not recorded as basedOn, because the project describes itself as an extension of MyBatis.
  databases: the English introduction lists the supported databases (PostgreSQL, MySQL, MariaDB, Oracle, OceanBase, GaussDB, SQLite, SQL Server, H2, DB2, HSQL, Phoenix, ClickHouse, Sybase, Firebird, Cubird, Goldilocks, Informix, TDengine, RedShift, Derby, DuckDB, Vastbase, GoldenDB, and several Chinese databases); only the six the field dictionary knows are recorded, and the quote names them. The page also says any database that performs CRUD with MyBatis and standard SQL is in scope.
  The English site calls the Mybatis-Mate module an enterprise-level module for MyBatis-Plus. Neither page says it is paid or sold under another license, so no paidEdition is recorded and the module is not part of this record.
  The site footer reads "© 2016-2026 Baomidou™", and no legal name or country is stated on the pages read, so hqCountry is not recorded; the Chinese filing numbers in the footer are not an address.
  The introduction page lists a built-in code generator, pagination, a performance analysis plugin and a global intercept plugin for full-table updates and deletes. The README lists a base interface with out-of-the-box methods, a lambda-style wrapper, an active record mode and automatic paging. The Baomidou ecosystem page lists separate projects (an IDE plugin, Mybatis-Mate, a dynamic datasource component and others) that are not part of this record.
  The introduction page says the code generator produces Mapper, Model, Service and Controller layer code. The README says plugins that parse SQL, such as the pagination plugin, require one of the optional parser modules.
