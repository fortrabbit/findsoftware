notes: >
  Hosted-service: the product is the NotCMS service with a dashboard (dash.notcms.com) that connects a Notion workspace and issues the secret key and workspace id the SDK reads, per the docs introduction and the README init step. The SDK and CLI are one npm package, notcms, built from packages/notcms of github.com/qqpann/notcms (TypeScript, user-owned repository, MIT per the npm license field, 19 stars and 283 downloads in the last week on 2026-10-23, oldest release 2026-01-17, latest release 2026-10-13); these are SDK figures and are not recorded as the product's license, adoption or release facts. The pricing page lists paid plans with prices; no price is recorded. No self-hosting of the service is stated, so selfHostOption is not recorded. The WordPress migration is a consultation offered by the vendor, so it is recorded as importsFrom only with the page's own words. Notion's user roles are Notion features, not NotCMS features, so userRoles is not recorded. The terms say Japanese law governs and the operator's address is given on request, so hqCountry is not recorded. The docs call the content API rate limited per Cloudflare location. Writers edit in Notion and the site reads synchronized content, so the content store is not recorded for NotCMS.
