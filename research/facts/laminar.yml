notes: >
  The homepage and the documentation page (which states it is for version 17.2.1) were read in full. The repository has tags and no GitHub releases, so the highest stable version comes from Maven Central, where com.raquo:laminar_sjs1_3 lists 17.2.1 as the newest stable version; 18.0.0-M5 is a milestone and its tag date is the latestPrereleaseDate. The latestReleaseDate is the commit of tag v17.2.1, which matches the Maven upload on 2025-03-26. firstRelease is the date of tag v0.1, the oldest tag. The install line in the documentation is the sbt key "com.raquo" %%% "laminar", and the README badge names the Scala 3 Scala.js artifact laminar_sjs1_3, recorded as mavenCoordinates. The README states the requirement "Requires Scala.js 1.16.0+", a build toolchain rather than a runtime, so no runtime is recorded, the same choice as the scalajs-react record. Laminar depends on Airstream, a library in the same GitHub account; no record exists for Airstream and the docs name it as a dependency, not a parent, so no basedOn is set. The license entries: the MIT license covers the code and the LICENSE file; the README also says comments in the defs directory, derived from Mozilla content, are CC-BY-SA v2.5, recorded as its own entry. The README's author line links the maintainer's personal X account; it is not recorded as the project's x. The homepage links a Gitter lobby besides Discord; it is not recorded. No Maven download figure exists. The maintainer is an individual, so maintainerType is left to the import.
