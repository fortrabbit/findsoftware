notes: >
  The repository's homepage field names a Shopify engineering blog post that introduces the project; it is not the project's own site, so no homepage is recorded. The README is the documentation; docs/setup.md is the installation guide the README links. The legal name Shopify Inc. and the Ottawa address come from the terms page, which names "Shopify Inc., a Canadian corporation"; the LICENSE copyright line names Shopify. The README states "Shipit requires a database (MySQL, PostgreSQL or SQLite3), redis, and Ruby 2.6 or superior"; the gemspec on main gives required_ruby_version '>= 3.2.0' while the gemspec at the v0.39.0 tag has no required_ruby_version, so runtimeMin is not recorded and the README minimum stays in notes. Redis is a required service and is not a database field value. The GitHub releases list has one entry, v0.39.0, which is the only GitHub release; the RubyGems package shipit-engine has versions after it (latest 0.45.3), published without GitHub releases, so latestReleaseDate takes the RubyGems upload date and currentMajor takes the GitHub release, both major 0. A reviewer should decide whether the GitHub release date or the RubyGems date stands as latestReleaseDate. The oldest tag is v0.0.1.pre and its commit date is 2015-05-21; the repository was created in 2014, so firstRelease takes the tag commit date. The setup guide's Rails template runs with Rails 8.0 and the GitHub App webhook URL is the homepage of the deployed app plus /webhooks; those are steps, not facts. The runsAs always-on value rests on the setup guide's statement that the app receives webhooks and needs a GitHub App; a reviewer may decide whether that is enough. The dependentRepos figure is the ecosyste.ms count for the RubyGems package, which has no dependent packages.
