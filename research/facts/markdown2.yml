notes: >
  The repository is the only project site: the README links the repository wiki and no separate website, and the PyPI home page is the repository, so homepage is absent. GitHub reports the license as NOASSERTION; LICENSE.txt states the MIT license for the source package. The same file says that test and performance files in the repository, not in the source package, carry other licenses: a Python License file (perf/recipes.pprint), GPL files (test/php-markdown-cases and test/php-markdown-extra-cases), a GPL 2 or BSD file (test/markdown.py), and BSD-style files (test/markdown.php and test/Markdown.pl). They are kept here as notes because the license fact describes the latest release. The repository has no GitHub release objects; tags run to 2.5.5 and the registry's stable version 2.5.5 (PyPI upload 2026-03-02) sets currentMajor and latestReleaseDate. The earliest PyPI upload is 1.0.1.6 on 2008-09-09, before the GitHub repository was created in 2011, so firstRelease is 2008. The README says the library matches the behavior of the original Perl-implemented Markdown.pl and that it supports extras for tables, footnotes, header IDs, table of contents, Smarty Pants and syntax coloring of pre blocks; syntax coloring needs Pygments, which the all extra installs. The README also names python-markdown (markdown.py) as another Python implementation and compares speed and correctness; the README states no switch or migration, so alternativeTo is absent. The README's Python 3.5 statement is older than setup.py's python_requires, so runtimeMin follows setup.py. The contributors count is the page number of the last contributors page at per_page=1. The PyPI download figure is the pypistats.org last_month count, read on 2026-11-16.
  The README Install section lists pip, pypm for ActivePython, easy_install and python setup.py install as alternatives, and says everything needed to run it is in lib/markdown2.py, which can be copied onto the PythonPath as a module or to the executable path as a script; each is its own install route. The README Quick Usage shows the module API (markdown and Markdown().convert) and a command-line script form, python markdown2.py or the markdown2 command that pip installs; the README gives no sentence on where the library runs, so no runsAs. The README says the change log is CHANGES.md and the test suite runs with make test.
