notes: >
  The project site named in the README and the API documentation on it both sit on wintersmith.io, which does not resolve; the record is a stub without homepage, modelled on bowman. The repository is active on the API side (last push 2021-07-15) and its README and wiki still describe the software, so the record is kept. The README lists the Pug and Markdown plugins as shipped and points to the wiki for other plugins. The repository has no GitHub release after 2.1.0 (2014); the npm registry carries 2.5.0 (2018-11-19), which is the latestReleaseDate. The repository's CHANGES.md records 2.5.0 as the latest entry. The npm package declares no engines field, so no runtime minimum is recorded.
