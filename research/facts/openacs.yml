notes: >
  The homepage openacs.org, which the repository names as its homepage, resolves in DNS but did not answer over either http or https in repeated 30-second attempts on 2026-10-26, so no homepage is recorded and the status is stub, following the dead-homepage rule. The documentation the README names is read in the repository (packages/acs-core-docs), where the installation guide still describes OpenACS 5.9.0 and AOLserver 4, so the install facts are older than the current tag. No GitHub release exists; the highest final tag is openacs-5-10-1-final, and the major is taken from it. The overview page says OpenACS relies on AOLserver, a Tcl-enabled application server, so the runtime is Tcl on AOLserver; the dictionary has no Tcl runtime value, so it is not recorded as a runtime fact. The project would settle its status once openacs.org answers: its own pages stating the current release, install steps and runtime would then be read.
