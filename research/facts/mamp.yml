notes: >
  Desktop app with no source repository and no registry package; the download page is the install route. Two platforms: macOS (system requirement "macOS 11.0 Big Sur or higher", ARM and Intel builds on the download page) and Windows (MAMP PRO 5.0.7 for "Microsoft Windows 10+", .NET Framework 4.0 named in the Windows installation page). Versions differ by platform: the macOS line is at 7.4.0 (2026-02-02), the Windows MAMP PRO line at 5.0.7 (2026-10-23), so currentMajor and latestReleaseDate follow the macOS line the download page leads with; the Windows line (5.0.7, released 2026-10-23) is noted here only. firstRelease 2006 comes from the first entry in the macOS release-notes feed; the feed may not list every early version, so it is the earliest the project's own page shows. MAMP PRO creates a separate local host per project, installs WordPress, Joomla or Drupal with a few clicks, and keeps snapshots of a project's files and database (macOS product page). The terms grant a licence to install and use the software for personal or internal business purposes and forbid copying except for backup, modification and resale. The license is quoted from the terms page, which says licence agreements differ per product (MAMP and MAMP PRO License Agreement, NAMO, MAMP Cloud). MAMP Cloud is a one-time purchase that backs up a project to Dropbox, OneDrive, Google Drive or an own (S)FTP server; it is a backup feature of the desktop app, so it is no hostedOffering. Purchase options (lifetime or annual subscription) are on the store page; no prices are recorded.
