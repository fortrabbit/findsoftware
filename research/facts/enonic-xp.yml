notes: >
  The candidate row lists https://enonic.com, which redirects to https://www.enonic.com/; the https www address is recorded as homepage. Versions: the highest stable GitHub release is v8.1.1 (2026-10-21); the 7.16.x line is maintained alongside and is not the current major. The oldest GitHub release is v5.0.0 (2015-04-22), so firstRelease is 2015 from the release list, though the repository dates from 2012. Pre-releases (RC and beta tags) are all older than the latest stable release and are not recorded. The developer docs and the platform pages live under /docs/platform/stable/...; the CMS guide is at /docs/cms. Content Studio ships with XP per the README; the CMS guide describes Content Studio and the GraphQL headless API as one stack. The docker page names Elasticsearch only in its heap sizing guidance, so no search field is recorded. The licensing page says selected Enonic applications use the source-available Enonic License; those are apps, not XP, and are not recorded. The enterprise applications page offers Content Studio+ and other apps to subscription customers; they are separate paid apps that extend XP, recorded as paidEdition for the reviewer to confirm. The licensing page also says commercial licensing may be available from Enonic. The footer of the developer site and the homepage link LinkedIn and YouTube; only YouTube is a starter field. The page editor is a visual editing mode, not a documented unsaved-changes preview, so livePreview is not recorded. The hosting plans on the pricing page are named Free, Professional and Enterprise; no prices are recorded. The ID provider docs name no SSO protocol; the sso value records the third-party systems they name. The contributor count reads the rel="last" page of the contributors endpoint with per_page=1.
