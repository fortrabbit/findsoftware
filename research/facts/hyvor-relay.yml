notes: >
  Current stable release 0.0.48 (2026-10-21); the 0.0.x line is pre-1.0, so currentMajor is 0 and the minor line stays out of the fact. Reviewer decision: the import reads the enterprise-license statement as open-core, while the hosting page says "Both licenses include the same features" and the license FAQ says "No. All our self-hosted products offer the same features with both open-source and enterprise licenses"; no paidEdition is recorded for that reason. The homepage pricing section lists a Cloud plan under "Join Waitlist" with the line "Cloud pricing is estimated and will be finalized at launch", so no hostedOffering fact is written; reviewer decision whether the waitlist counts as a hosted service. The hosting page names AWS SES, Mailgun and SendGrid in one alternative sentence; mailgun and sendgrid are candidate ids. The homepage links HYVOR's own X and Discord accounts, which serve the company's products as well as this one. The Go and PHP minimum versions in the repository manifests are build requirements for a product shipped as a Docker image, so no runtimeMin is recorded. The cloud instance is "not open for public signups" (docs getting-started page). The product requires an external OIDC provider for sign-in (sso). Project docs say the server needs PostgreSQL and a public IPv4 address per sending queue; the SMTP ports (25, 587) and DNS (53) are required by the easy deploy page's firewall list. The CSV row dated the release 2026-08-10; the current stable release is 0.0.48 dated 2026-10-21. Release history: 0.0.1 was published 2025-07-09 and the repository was created 2025-05-29. Contributors counted across all pages.
