notes: >
  The homepage lists the project's Zulip chat at https://asciidoctor.zulipchat.com; no field in the dictionary holds a Zulip link, so it is not recorded. The homepage states "Asciidoctor is the successor to AsciiDoc.py" (coined field successorOf, so kept here and not as a fact). AsciiDoc is the language and Asciidoctor is the processor, as the homepage states; the homepage also names two other processors of the same language, Asciidoctor.js for JavaScript and AsciidoctorJ for the JVM, which have their own records and are not parents of this one. PDF and EPUB 3 converters are separate gems, per the homepage, and are not recorded here. The GitHub license field is NOASSERTION; the MIT license comes from the LICENSE file and from the RubyGems license field. runtimeMin is the lower bound of the CRuby range the homepage states. The first release is the first RubyGems version, uploaded in 2012; the oldest GitHub release object is from 2013. The latest stable release is the GitHub release dated latestReleaseDate; the newest prerelease is older and is not recorded. rubygemsDownloads is the total download count from the RubyGems API. The Asciidoctor Docker image is named on the install page without a repository name, so the docker field is not recorded. The install page names no runsAs value or deployment target, so runsAs and renderingModes are not recorded.
