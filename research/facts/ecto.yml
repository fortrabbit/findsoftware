notes: >
  Accepted: a library that a site or app adds as a Hex dependency and whose SQL adapters (ecto_sql, postgrex, myxql, tds, ecto_sqlite3, ecto_ch) are separate packages; the adapter packages are not recorded as fields. The repository is the one the Hex package names; the homepage is the hexdocs site the GitHub repository names as homepage (no separate project site). The copyright lines are in the README's License section: "Copyright (c) 2013 Plataformatec" and "Copyright (c) 2020 Dashbit"; LICENSE.md is the standard Apache text with no holder line. The maintainer is the 2020 holder, Dashbit; Plataformatec (2013) is the original holder and is named here only. The GitHub release objects end at v3.4.5 (2020-07-28); the tags run to v3.14.3, which has no release object. The newest stable version is Hex 3.14.3 (2026-11-04), so the major 3 and the latest release date come from Hex. The earliest release object is v0.1.0 (2014-05-01), matching the Hex 0.1.0 upload. The mix.exs at v3.14.3 requires "~> 1.14"; the master branch requires "~> 1.15" and is not used. No OTP minimum is stated, so runtimeMin is not recorded. The README table lists ETS through Etso, an in-memory adapter rather than a database; it is not recorded as databases. The Hex requirements (decimal, jason, telemetry) are dependencies, not basedOn. The README links a "Mailing list" (groups.google.com elixir-ecto); the link label alone is not recorded as a forum. The CSV discovery figures (6.5k stars, 577.4k a week on Hex) are older; the GitHub API gives 6500 stars and Hex gives 151146358 total downloads. The README's example defines a schema with Ecto.Schema and queries with Ecto.Query, run through a Repo, and states that Ecto is also commonly used to map data from any source into Elixir structs, whether or not a database backs it.
