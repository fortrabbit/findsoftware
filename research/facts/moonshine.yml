notes: >
  The package moonshine/moonshine is the one the install page names, so the registry figures come from it. The docs and the repository's default branch are for version 4; the Packagist stable line is 4.x. The GitHub README and the site both carry comparison tables and marketing claims; neither is recorded. The site footer says "CutCode" and the Composer authors list Danil Shutsky; the LICENSE copyright line gives the name recorded as maintainer, and the organization name is not recorded as a fact. The plugin marketplace is recorded as a directory; its listings are not counted. The Forty-Five and MoonVibe packages named in the README are separate projects and are not recorded. The install page states a minimum Laravel version, which has no field; runsAs is left out because the docs do not state how the panel runs in production, and the Laravel record carries that for its own runtime.
