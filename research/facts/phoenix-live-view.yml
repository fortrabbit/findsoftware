notes: "No separate project site is recorded: the README links the docs at phoenix-live-view.hexdocs.pm and no LiveView-only site was found, so homepage is not recorded; the Phoenix framework site covers Phoenix itself. The welcome page of the docs says LiveView is included by default in Phoenix applications and that using it requires an installed Phoenix application, recorded as basedOn phoenix; the mix.exs dependency on phoenix alone would not be a statement. The README describes the older-app route as a link to a previous installation guide. The LICENSE copyright names Chris McCord; the Hex package lists chrismccord, josevalim and steffend as owners, which are not recorded as the maintainer. The runtimeMin is the Elixir requirement of the latest release tag, v1.2.13; the BEAM is not stated in the page read, so runtime is the Elixir language. The first release is the 0.1.0 upload on Hex, dated 2019-08-25. The latest pre-release, v1.2.0-rc.3 (2026-05-29), is older than the latest stable release, so no latestPrereleaseDate is recorded. hexDownloads is the Hex API total and week figures; the API's recent field has no stated period and is not recorded. httpArchiveSites is the mobile origin count for the technology \"Phoenix LiveView\", the same convention as the other records. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header."
