notes: >
  Status stays accepted: the latest release (2022-06-27) and last push (2022-11-05) are past the four-year listing rule, so the import moves the record to stub on its own; no end statement appears on the homepage, the README or the repository. The README's link to a 2.x roadmap repository is no end signal. The maintainer follows the LICENSE copyright line (Getme Limited); the homepage names Anthony Blackshaw as the creator and says the project is maintained by the crew at getme, so no person is recorded as maintainer. No hqCountry: no page gives Getme's address. The README lists bower and npm as install routes, but both appear only as headings over shell commands with no sentence stating the route, so no installMethod is recorded for them; the npm package is the one the CDN URLs in the README name. The getting-started page says the project uses CoffeeScript and Sass, a build detail left out of language. Tags begin in 2016; the repository was created in 2015. Stars and contributors are for this repository only.
