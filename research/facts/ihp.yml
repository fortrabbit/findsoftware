notes: >
  The pricing page lists "Docker Support" under the features of the Pro tier and above, and "Pro User Auth", "Feature Voting", "Stripe Integration" and "I18n (soon)" beside it; the deployment guide also documents deploying with Docker, so both statements are recorded as worded. Coined and not recorded as facts: slack (the community Slack at ihp.digitallyinduced.com/Slack, linked from the homepage) and deployTargets (the deployment guide has sections for deploy-to-nixos on AWS EC2, Docker and bare metal). The installation guide requires the Nix package manager, supports macOS and Linux, and says native Windows is not supported (WSL2 instead). The pricing page says the Basic tier is "Free Open Source", which is the open-source part of the licensing; the Pro and Business licenses are commercial. The architecture guide states "Warp listens on the configured port", which is the always-on server model. The guide states "IHP doesn't ship a built-in i18n framework", so i18n is left out. The Internationalization guide documents a pattern, not a feature. The repository is default branch master, the release v1.6.0 is the highest stable tag, and prerelease tags (v1.0.0-rc2 and earlier) are not used for currentMajor. The oldest tag is v28022020 (2020-02-28); the repository was created in 2017, and firstRelease follows the tag, not the creation date. The contributors count reads the rel="last" page of the contributors endpoint with per_page=1. The legal entity is digitally induced GmbH from the imprint and the MIT LICENSE copyright line, with the homepage footer giving Düsseldorf, Germany.
