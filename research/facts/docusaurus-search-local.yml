notes: >
  Registry id is the scoped package @easyops-cn/docusaurus-search-local; the unscoped npm name docusaurus-search-local is a different package (latest 0.0.0, maintainers gabrielcsapo, a fork-era package) and is not used. The CSV npm figure (220.8k) predates the 2026-10-19 to 2026-10-25 range used here. The README says the project was originally forked from cmfcmf/docusaurus-search-local and then rewritten in TypeScript; that is a fork statement with no record id in this dataset, so forkOf is not set. The repository is a yarn monorepo: the root package.json is private and carries engines node >=20 for the development workspace; runtimeMin uses the published package's manifest (docusaurus-search-local/package.json at v0.55.3, engines node >=12). The manifest's peer dependencies name Docusaurus ^2 or ^3 and React 16 to 19; basedOn is docusaurus from the README's own wording "for Docusaurus v2/v3". The README names lunr-languages for language support and Chinese tokenisation uses a jieba dependency; the search engine itself (lunr) is a dependency only and is not recorded as a searchBackends value. The Ask AI option is opt-in and calls an external AI service configured by the site (apiUrl); the README suggests the Open Ask AI Server, which is a separate project. The maintainer is the organization named in LICENSE ("优维科技"); its site uwintech.cn shows "UWinTech" in the footer, no legal form is stated on the pages read. hqCountry is not recorded: the GitHub organisation location is "China" and the company site footer shows a Chinese ICP filing, but no page states the headquarters; a reviewer may decide. The homepage is the project's live demo, which the README calls "Live Demo"; its social links point to Docusaurus, not this project. The homepage is served over https. firstRelease is the first npm version of the scoped package (0.4.0, 2020-10-13), which predates the oldest GitHub release in the listing. runsAs is not recorded: the README never states that the index is static files or that search runs in the browser (only "when fetching index" for the hashed option).
