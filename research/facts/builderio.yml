notes: >
  Status is hosted-service from the candidate row: the platform is a hosted service and the sources name no self-hosted build of it, so criterion 2 is waived and no install steps are recorded. The pricing page lists Project Hosting and an Enterprise tier with SSO, and the developers page says the customer keeps control of its components, codebase and hosting; no prices are recorded. The /c/docs/self-hosting address answers 404. The repository holds the SDKs, examples, starters and plugins, not the platform; its LICENSE covers those under MIT, and the GitHub language field is TypeScript. The repository is a monorepo, so the registry figures come from the core package @builder.io/sdk, and currentMajor and latestReleaseDate come from its GitHub releases of the same name: 6.3.3 is the highest stable tag, and 0.1.60 (2019-02-12) gives firstRelease. The x account is Builder.io's company account, linked from the homepage, and the forum link is from the README. The homepage describes the product as an AI agent platform in its title, while the headless CMS page describes the CMS features recorded here. No headquarters country is stated on the pages read, so hqCountry is not recorded.
