notes: >
  Doubt: the homepage in the repository metadata, http://nvd3.org/, does not resolve (no DNS), so the project's own site cannot be read for its status, license or maintainer; the repository, README and LICENSE.md are readable and the GitHub Pages examples and documentation site the README names answers 200 and is recorded as docs. A live project site, or a maintainer statement on whether the project continues, would settle it. The status is stub for that reason, and the import's four-year rule for a project with no release applies on top of it: the highest stable release v1.8.6 (2017-08-24) has no later release, and the last push to the default branch is 2023-09-15. The repository is not archived and no end statement is found. The LICENSE.md holds two license statements: the nvd3.js code under Apache-2.0 and the reproduced d3.js license for a bundled part, which is the three-clause BSD license; GitHub detects no license for the file, and the npm manifest of the latest release says Apache-2.0. The copyright holder is Novus Partners, Inc. from the LICENSE.md line; the README names Novus and a community organization, and no page gives a country or address, so hqCountry is not recorded. The README requires d3.js as a dependency (a minimum version is stated in the README, not recorded here). No basedOn is recorded because a dependency is no based-on statement, and the title "A reusable D3 charting library" names the library's subject, not a parent; a reviewer may decide otherwise. The README says the d3.js 4.x line is not supported and names a work-in-progress fork under another organization; that is not recorded. The README gives browser support, not a process model, and no page says the library runs in the browser, so no runsAs is recorded. The README says the nv.d3.js script should appear after the d3.js script on the page, and that the examples and documentation are served from the GitHub Pages site it names.The first tag v0.9 has the commit date 2013-05-10 and sets firstRelease; the GitHub release list starts at v1.2.0 (2015) and the npm package starts at 0.9.0 (2014). Stars and contributors belong to the repository, which is a single package.
