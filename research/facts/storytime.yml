notes: >
  No project site: the GitHub homepage field is empty, the gem's homepage_uri is null, and cultivatelabs.com in the README is the company's site, so homepage is not recorded and the repository is the project page. The gem's source_code_uri and the MIT-LICENSE name FlyoverWorks (the 2014-2015 copyright line reads FlyoverWorks Inc.), and https://github.com/FlyoverWorks/storytime redirects to CultivateLabs/storytime; the README copyright line reads CultivateLabs Inc. for the same years, so the maintainer is recorded as the README states it and the MIT-LICENSE holder FlyoverWorks Inc. is noted here only. The GitHub releases end at v2.0.0 (2015-04-13) while tags run to v2.1.7 and rubygems lists 2.1.7 as the newest version (2026-07-01); currentMajor is 2 either way, and latestReleaseDate follows the registry. The oldest rubygems upload is 0.0.1 created 2014-05-28, which is earlier than any GitHub release, so firstRelease is 2014. The gemspec requires rails 7.0 or later and the Ruby version is not stated on any page read, so runtimeMin is left out. The wiki pages name the migrations and the Imagemagick requirement for image upload, but no database product; the search page names Postgres, MySQL and SQLite search adapters, which is no statement of supported databases, so databases is left out; the gemspec lists pg only under development. The ruby_version of the latest gem on RubyGems is >= 0, so no Ruby minimum is recorded. Devise is named on the Setup page as the host's authentication, which is not single sign-on, so sso is left out. The README says Storytime is responsible for editing content, copy and basic formatting, and that the host app is responsible for page structure, styling and interactions. The README and the Setup, Multi-site Support and Admin of Rails Models wiki pages were read; the other wiki pages were not opened.
