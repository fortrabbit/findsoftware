notes: >
  The stack documented on the architecture page comprises BTCPay Server, PostgreSQL, NBXplorer, Bitcoin Core and Nginx; no field exists for required services, so they are listed here only. The installation page calls for "a dedicated Linux host" sized by the server specifications guide. Deployment page says BTCPay can be self-hosted or run on a third-party host, which does not change status. Language C# is from the GitHub API; the pages read did not name the .NET runtime, so runtime is not recorded. The MIT copyright line names btcpayserver, which is recorded as maintainer; no maintainer type or country is stated.
