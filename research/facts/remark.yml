notes: >
  A monorepo (remarkjs/remark) with the stars and the 132 contributors of all its packages; the npm package remark is the core the package readme's Install section names and the README badge links. The monorepo's newest GitHub release is remark-cli 12.0.1 (2024-04-30), a separate package; the remark package's newest release is 15.0.1 (2023-09-18), the npm latest, so latestReleaseDate is 2023-09-18. firstRelease is 2014 from the oldest tag (0.0.2, commit of 2014-07-31), older than the first GitHub release (2.2.2, 2015). The package readme says "remark is an ecosystem" and that the core is "unified processor": the README says "remark adds support for markdown to unified" and "unified is the core project", and unified is an accepted candidate whose record comes in its own wave. The README recommends micromark for turning markdown into HTML; that is a recommendation, not an alternativeTo statement, so no alternativeTo. The Node.js 16 statement is the install section's runtime; the 15.0.1 package.json has no engines field, but the package readme states Node.js 16+ for installing, which is recorded as runtimeMin. The npm weekly figure is the sum of daily downloads for 2026-11-01 to 2026-11-07. The homepage remark.js.org answers 200 with the README text and names unifiedjs.com as the collective's site. The README's "world's most popular markdown parser" is a claim without a figure and is not recorded. The license file names Titus Wormer; the README's license line links the same name. The package readme says the package is ESM only and that remark is a unified processor with support for parsing from markdown and serializing to markdown. The README's support and contribute links point to the remarkjs organization's health files, which hold no forum of the project, so no forum is recorded.
