notes: >
  The homepage says Siteleaf has been "Trusted for 13+ years", which gives no year, so firstRelease stays unknown.
  The homepage says Siteleaf is compatible with Jekyll and lets users use any existing Jekyll theme; Jekyll is not recorded as basedOn, because the page names compatibility and not a parent.
  The homepage describes a two-way GitHub sync; it is a hosted feature with no starter-list field, so it stays in these notes.
  The plans page gives the feature rows and the prices are not recorded.
  The plans page calls the older plan legacy v1 and the current one v2; the site numbering is not a major version, so currentMajor stays unknown.
  The plans page lists Rackspace as a publishing target next to Amazon S3, FTP and private GitHub repositories; the homepage list is the one recorded in deployTargets.
  The terms page is dated November 10, 2015 and names Oak Studios LLC; a reviewer may confirm it is still current. The API rate limit on the rate-limits page is 500 requests per 5 minute period. The features page says the importers for WordPress, Tumblr, Ghost, Drupal and more are the community-supported Jekyll importers. The homepage footer links the community forum, Twitter and Mastodon.
