notes: >
  Stub: the project names https://self-hosted-metrics.com/ as its website in the README, and that site answers 404 with the plain text "404 page not found" on /, /docs and /en, so the project's own site does not show the software; the code is public and the README is complete, so criterion 3 holds from the repository. Settle this by reading the site again; if it still shows no software, the record stays a stub with no homepage, and if it comes back, record the homepage with a quote. The repository has no homepage field beyond that site. Criterion 1 is read from the SDK wiring, not from the dashboard: the README and API.md describe Go and Node.js SDKs that a developer embeds in an application, and that application sends signed snapshots to an endpoint the SHM server exposes (POST /v1/snapshot); the dashboard is a server for self-hosted software's telemetry, not a finished end-user app. The maintainer is btouchard as the README footer states it ("by btouchard using Go, AlpineJS & Tailwind"); the GitHub profile of btouchard shows the name Benjamin Touchard, which is not a legal notice, so it is not recorded. The repository owner kOlapsis is an organization; the README does not name it as maintainer. The LICENSE file is the AGPLv3 text with no copyright holder named. The SDK in the sdk/ directory is MIT (README: "The SDK (in the /sdk subdirectory) is distributed under the MIT License"), recorded as its own license entry with the server's AGPL-3.0 entry. The npm figure counts the SDK package @kolapsis/shm-sdk, which the README installs with npm install; the Go SDK is installed with go get and has no download figure. The npm weekly figure is the sum of 2026-10-26 to 2026-11-01 and includes a single-day count of 109 on 2026-11-01. The server ships as a Docker image named in the Compose file (ghcr.io); there is no Docker Hub figure. The README badge "Go 1.25+" and the Node.js 22+ badge describe build and SDK requirements, so no runtimeMin is recorded. The privacy properties are the README's words: no IP addresses are collected unless the reverse proxy logs them, Ed25519-signed requests, Trust on First Use registration, DO_NOT_TRACK support, and no PII; these are coined kinds and stay here. The dashboard has no authentication by default (DEPLOYMENT.md "Security Warning"); the Traefik ForwardAuth examples name Authelia, Authentik and Keycloak as external login providers in front of the server, which is not an sso statement of the software. The GitHub Discussions link in the README is recorded as forum. The API is a telemetry ingest and admin API (API.md), so headlessApi is rest on its own words, not a content API. The repository's identity file and the rate limits are configuration, not fields.
