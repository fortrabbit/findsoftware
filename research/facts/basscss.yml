notes: >
  The README says "Basscss v8 is the final version of Basscss, which means no major, breaking changes will be introduced" and that minor features and patches may still be added; this is not an end signal, so the status stays accepted. The last npm publish is 8.1.0 (2019-05-08) and the last commit on master is dated 2022-12-30; a reviewer should decide whether the release age is a problem for criterion 4. The GitHub release v1 (2014-02-16) is the oldest release and is older than the npm package, which starts at 4.0.0 on 2014-09-25. The highest stable GitHub release is 8.0.0 (2016-02-13) and the npm latest is 8.1.0, both major 8. The homepage shows the install line with version 8.0.2, which is older than npm latest; the version is not recorded. The npm weekly figure is the sum of daily downloads for 2026-10-18 to 2026-10-24 from the range endpoint, because the last-week endpoint returned the window 2026-06-25 to 2026-07-01. The docs are the homepage's Getting Started and module sections; the README links the sibling packages basscss/basic, basscss/addons and basscss/ace, which are not recorded.
