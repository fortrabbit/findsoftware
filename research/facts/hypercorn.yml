notes: >
  Status accepted: MIT on GitHub, a pip install from PyPI, a release 0.18.0 uploaded 2025-11-08 (the same date as the last push on the default branch), and no end statement. The repository has no GitHub release and no tag other than the version tags; the PyPI upload date is used as latestReleaseDate, and the newest stable tag's commit date agrees with it on the registry date. The docs site (readthedocs, the "latest" build) reads "Hypercorn documentation - Hypercorn 0.17.3", so the docs are one minor version behind the registry release 0.18.0; the Python minimum is therefore taken from the PyPI metadata of 0.18.0 (requires_python >=3.10), not the docs installation page, which says 3.8 or higher. currentMajor is 0: the project is in the 0.x series with no 1.0 release, and the major is recorded as the number the registry gives. The docs and README say the project was "initially part of Quart" and "forked from version 0.5.0 of Quart"; quart is a record, so forkOf names it. The docs also say the project is "inspired by Gunicorn", which is not a fork, base or successor statement, so no alternativeTo is recorded. The README says the project is "based on the sans-io hyper, h11, h2, and wsproto libraries"; these libraries have no records, so they are not basedOn values. The copyright line in LICENSE names "P G Jones" while the GitHub profile name is "Phil Jones" and the docs footer says "Philip Jones"; the LICENSE line is the legal notice used for maintainer. pypiDownloads comes from pypistats (last_week 1,821,519 at the check date). The ecosyste.ms monthly figure is the same count as pypistats' last_month (6,267,514) and is not recorded again. GitHub has no homepage for the repository and the docs site is the only project site, so homepage is absent. The README calls it an ASGI and WSGI web server, "inspired by Gunicorn", with asyncio, uvloop or trio worker types. The README describes optional HTTP/3 through aioquic as an extra, which is a protocol note, not a field.
