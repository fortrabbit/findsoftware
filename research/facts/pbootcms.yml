notes: >
  The homepage is Chinese-language; the quotes are in Chinese, verbatim from the page text. The maintainer is the name the project's free-license page uses for its author, 星梦; no company or legal entity is named on the site or in the repository, and the copyright footer says only "PbootCMS". The maintainer type is left to the import: the repository owner is a user account. The site's ICP filing and a Gitee mirror under hnaoyun were seen but no page states who operates the site, so hqCountry is not recorded. The homepage states the system is its own framework (自主研发的高速多层开发框架), so no basedOn is recorded. The about page lists "mysql. pgsql" as options, while the README names only mysql as the alternative to the default sqlite; databases records the README. The README says the PHP minimum applies to new installs and full-package upgrades; existing sites upgraded online keep their PHP version. The homepage states a cumulative count of sites, recorded as reportedInstalls. The homepage says the system offers many HTTP interfaces (系统提供大量HTTP接口); the content-API vocabulary has no value for it, so headlessApi is not recorded. The homepage links an online shop feature as "暂未开发" (not yet developed), which is not recorded as a capability. The authorization is per domain, validated offline: the freesn page says the code needs no online check. Each site needs an authorization code: the free per-domain code is issued on the project's site and, per the freesn page, is permanent; the about page also sells a universal code valid for any domain. These are licence scopes, not an edition with extra features, so paidEdition is not recorded, and neither code nor price is record data. The repository's default branch is master and the latest GitHub release is V3.2.29 dated 2026-10-12.
  The homepage lists custom content models and fields, custom forms and multi-condition search among the features; these are the project's own feature statements.
