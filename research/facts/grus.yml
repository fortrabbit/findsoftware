notes: >
  The homepage http://get-grus.io is not linked: it answers only over plain http, redirects to unrelated gambling sites, and no longer shows the software. The GitHub repository was archived by its owner, which is a status signal for the repository the project names as its source, so status is discontinued; the dead homepage alone would have made it a stub. The README names no maintainer; the name recorded is the GitHub account's profile name. The Apache-2.0 license file has no copyright line. Highest stable GitHub release is v0.1.1 (2018-03-17), so the major is 0. The README also lists a Scala library and an sbt plugin under org.senkbeil; no Maven figures were recorded.
