notes: >
  Go library, so the runtime is go and no runsAs is recorded: no page states a run mode. The code-gen page adds ent to the project's go.mod with go get, and the README quick install shows go install of the cmd/ent code generator; the module has no download figure. runtimeMin is the go.mod go line at the v0.14.6 tag (the main branch already reads go 1.26.0). The docs address https://entgo.io/docs/getting-started/ is the documentation the README names. The maintainer is the homepage footer's "The Ent Authors"; the Apache-2.0 LICENSE carries no copyright line, and no page names a company or country. The README lists the storage drivers MySQL, MariaDB, TiDB, PostgreSQL, CockroachDB, SQLite and Gremlin; TiDB, CockroachDB and Gremlin are not in the databases vocabulary, so they stay in this paragraph: TiDB and CockroachDB are preview support on the dialects page, and Gremlin is experimental without migrations. Coined: the Go code generation, the graph traversal API and the Atlas migration engine are not recorded as fields. The Go proxy shows v0.14.6 as the newest version, and the GitHub release of the same tag is dated 2026-03-23, which is the date used. currentMajor is 0 because the module is at v0; the minor line is v0.14. firstRelease is 2020 from the oldest GitHub release v0.1.0 of 2020-02-03. The Slack and tutorial links on the site are not recorded (no field for chat other than discord, and the tutorial is a docs page). The discussions link is the project's own GitHub discussions, so it stands as forum. The GraphQL docs page says the framework supports GraphQL using 99designs/gqlgen and generates a GraphQL schema for nodes and edges defined in an Ent schema, with Query and Mutation resolvers; that is an API the library generates for the user's app, not an API the software serves, so headlessApi is absent. The README says the project was inspired by an entity framework used at Meta, created by two engineers from the Facebook Connectivity team, and is developed and maintained by the Atlas team; it names no legal entity, so maintainer stays the footer wording.
