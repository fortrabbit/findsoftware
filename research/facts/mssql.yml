notes: >
  No public repository: the pages read name no source repository for the product, so sourcePublic and repository are left out and criterion 2 rests on the documented self-install (Windows setup, Linux packages, container). The license entry is the wording the learn page gives; the Microsoft licensing docs page names "Product Terms" for current use terms, and the license model is left to the import. Versions: the editions page names SQL Server 2025 as product version 17.x, recorded as currentMajor 17; the year name is not a major. The build list gives CU10 as the latest update with the release date October 22, 2026, replacing the month-only date in the candidates CSV. The learn quickstart shows a 2017 container tag, which is stale, so no container tag is recorded. The Docker Hub count does not apply: the image is published on mcr.microsoft.com. paidEdition is not recorded: the editions page lists Standard and Enterprise (licensed per core or per server with CAL) and calls Express the free edition, but does not call Standard or Enterprise paid, so no paid quote exists on it. hostedOffering lists the two Azure services the what-is page names as using the Database Engine. firstRelease is not on any page read. Fields coined: none. Applications connect with Transact-SQL, and the editions page calls Express the entry-level, free database.
