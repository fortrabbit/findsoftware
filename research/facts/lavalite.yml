notes: >
  The project's own site and its documentation answer 403 to this research client, so the installation fact comes from the project's documentation source repository, LavaLite/docs, whose installation.md documents composer create-project and php artisan lavalite:install; criterion 3 is met there. That repository was last pushed in 2022 and still names PHP >= 7.1, so its runtime line is not recorded against the composer.json requirement. The repository has no LICENSE file at the root (GitHub reports license null); the MIT statement comes from composer.json and readme.md. The readme.md states "The Lavalite CMS is open-sourced software licensed under the [MIT license]", and composer.json declares "license": "MIT". GitHub's latest release is v10.1.0 (2023-08-03), while Packagist's newest stable version is v10.1.2 (2023-09-03), and the latestReleaseDate is taken from Packagist. The default branch was last pushed 2023-09-28, which is not an end signal by itself; no archived flag, abandoned package or deprecation was found in the readable sources. No legal notice names a legal entity, so the maintainer is the GitHub organization name as the project states it. The GitHub organization profile names India as its location; that is not recorded as hqCountry because it is not a company statement. Packagist monthly downloads are 10 per the package page; the total is recorded. The composer.json requires lavalite/framework and litecms/* packages, which are sibling packages not recorded here.
