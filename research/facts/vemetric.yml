notes: >
  Boundary row settled as hosted-service. The repository holds the full platform under AGPL-3.0 (apps, packages, docker-compose.yml), but no page documents an install or deployment: the README says self hosting is "planned" as a Community Edition "in the future", and the FAQ answers "Can I self-host Vemetric?" with "Not yet, but I'm working on a Community Edition". Under AGENTS.md a vendor's open-source server beside the SaaS changes status only with a self-install, so the record stays hosted-service. The repository docker-compose.yml starts PostgreSQL and Redis containers; no page calls it a deployment, so it is not recorded as an installMethod. The legal notice on vemetric.com names seriouscode GmbH at Siedlungsgasse 16, 2111 Kleinrötz, Austria, and the terms of service name seriouscode GmbH as the contracting party; hqCountry AT comes from that address. The homepage says the company is "Based in the EU" and the FAQ says all servers are in the EU. The pricing page lists a free plan with 2,500 events per month and paid Professional and higher plans; no prices are recorded, and the free tier stays in notes as a coined fact. The SDKs (HTML script, JavaScript, React, Astro, Node.js, PHP, Python, Go) are client and server SDKs listed on the docs page; their repositories are not read for this record. The Discord link on the homepage is vemetric.com/discord, which redirects to the invite recorded. The homepage also links a LinkedIn company page (https://www.linkedin.com/company/vemetric), kept here as a note since linkedin is not a field. The repository has no tags or releases, so firstRelease, currentMajor and latestReleaseDate are absent. The stars and contributors figures are the platform repository's, not an SDK's.
