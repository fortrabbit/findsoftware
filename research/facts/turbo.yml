notes: >
  The homepage lists the parts of the framework: Turbo Drive for links and form submissions, Turbo Frames for independent page sections, Turbo Streams for page changes over WebSocket, SSE or form responses, and Turbo Native for iOS and Android apps. The homepage and handbook name Stimulus as the other side of Hotwire for the remaining JavaScript; it has its own record.
  Active: the repository is not archived, the npm latest is 8.0.23 without a deprecation flag, the homepage says "Current version: 8.0.23 — released Jan 29, 2026", and the default branch had commits in September 2026. The release list holds v7.0.0-beta.1 (2020-12-22) as the oldest entry without the prerelease flag, so firstRelease is 2020; the major is 8 from v8.0.23. The handbook names four install routes (jsDelivr script tag, unpkg download, npm or yarn, and the turbo-rails gem for Rails), each with its own installMethod entry. The npm weekly figure is the sum for 2026-10-19 to 2026-10-25, of package @hotwired/turbo. The maintainer is 37signals LLC: the README footer, the terms page ("Company" refers to 37signals LLC) and the MIT license name the company; the homepage footer and "Brought to you by the makers of" list the company's other products, which does not make it a parent. The privacy page names 37signals as a U.S. company, which sets hqCountry. The homepage Community link points to discuss.hotwired.dev. The homepage has no X, Bluesky or Mastodon link. The newsletter sign-up ("Subscribe to project updates over email") links to world.hey.com/hotwired. The HTTP Archive technology "Turbo" has website turbo.hotwired.dev, so httpArchiveSites is its origins.mobile figure (19598). Stimulus and Hotwire Native are sibling projects with their own pages and are not basedOn.
