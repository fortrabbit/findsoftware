notes: >
  Report: the candidate row said repo not found, but the homepage links github.com/Innovationgate/OpenWGA, which exists and holds the source: the row was stale. The repository root has no LICENSE file and GitHub reports no license; the GPL-3.0 text is in the Debian package tree (OpenWGA/distros/wgaDeb/dist/all/openwga/src/var/lib/openwga/COPYING), and the homepage states the plugin exception. The current release tags are plain version numbers (7.12.6, 2026-10-26). The Debian package control still requires a Java 7 JDK and the build sets Java source compatibility 1.7, so no runtimeMin is recorded: those are build-time statements and no current page states a minimum. The database modules (hsqldb, mysql, mssql, postgresql) are listed in the source tree; the MySQL content store module describes its requirement as a MySQL server of version 5 or higher, which is recorded only here. The firstRelease year comes from the oldest GitHub release entry, a 7.2.0 build dated 2016-05-29. The README names a JavaEE web application archive, which gives the jvm runtime, and the Debian package ships an init.d service script that starts Tomcat, which gives always-on. The Debian build file states the license as GPL 2.0 with the plugin exception while the homepage says GPL version 3 or higher; both are recorded as written. The contributor count is 1 for the standard endpoint; 5 with anonymous contributors included. The Innovation Gate homepage in the repository sample names Womodo CMS as another product, which is not recorded.
