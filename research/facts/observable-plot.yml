notes: >
  The repository the CSV row names is the current one. The GitHub homepage field and the README both name https://observablehq.github.io/plot/ as the documentation site, so that is the homepage; the CSV's observablehq.com/plot/ address returned HTTP 429 when checked (rate limited), so it is not recorded. The LICENSE copyright line names Observable, Inc.; its location is not stated on the pages read, so hqCountry is unknown. Runtime is not recorded: the getting-started page says Plot returns a detached SVG or HTML figure element to insert into a page, and that vanilla HTML can load it from a CDN, which places it in a browser, but it names Node only as the environment for installing with npm, and no page says it runs in Node. A reviewer may add runsAs browser on that basis. The npm figures are for @observablehq/plot, the package the getting-started page installs; the weekly figure is the sum of the daily counts for 2026-11-01 to 2026-11-07. The 0.x line has no major of its own, so currentMajor is 0; the latest GitHub release is 0.6.19, and the npm next tag 0.6.18-alpha.3 is older than it, so no latestPrereleaseDate is recorded. The getting-started page says Plot is available by default in Observable notebooks, that it loads the D3 dependency automatically from the CDN-hosted module bundle, and that it can be loaded from a UMD bundle. The why-plot page says Plot builds on D3 and uses it to implement a wide variety of features; D3 is a dependency there, so basedOn is not recorded. The community page also links the Observable forum (talk.observablehq.com) and the Observable community Slack, which no field holds. The marks, scales, transforms, projections, facets and interactions, the SVG and HTML output, and server-side rendering with React are coined kinds and stay in notes. The first tag, v0.1.0, is from 2021-05-04, the same day as the first npm version. The stars and the 30 contributors belong to the single-package repository.
