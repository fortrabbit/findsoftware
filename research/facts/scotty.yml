notes: >
  The CSV homepage is the Hackage package page, a registry listing rather than the project's own site, and the cabal Homepage field points at the repository, so no homepage is recorded. The highest stable GitHub release is 0.12.1 (2022-11-17, the only release object); the registry's stable version is 0.30, uploaded to Hackage on 2026-01-07 with a changelog entry dated 2026.01.06, which is the newer one, so latestReleaseDate takes the Hackage upload and currentMajor is 0 under the rule that 0.x stays 0 (both versions share major 0). The project has no GitHub release for 0.30. The cabal Maintainer field is "The Scotty maintainers", and the LICENSE copyright line names Andrew Farmer, so the maintainer is recorded as the cabal states it, with maintainerType community; no legal entity appears. The README "Package versions" section states the project follows the Package Versioning Policy. The README has no cabal or stack install steps for the library; the only install-like step is running the example with runghc or stack, recorded as installMethod. The README states no runtime minimum and cabal's base bound (>=4.14) is a dependency range, not recorded. The README names no databases, admin interface, template language or content store. The Scotty wiki holds third-party tutorials and a starter project, so it is recorded as docs and is not a source for any field. Coined: none.
