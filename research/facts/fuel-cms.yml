notes: >
  The README opens with a warning that the project is no longer in active development, the ended-project signal in the write-record skill; the CSV row says accepted, so the status is changed to discontinued and the reviewer should confirm it. The GitHub API reports no license; the license is the README statement "FUEL CMS is licensed under Apache 2", and the fuel/licenses/fuel_license.txt file the README points to carries a CodeIgniter (EllisLab) copyright notice, which is not recorded as a separate statement. The requirements page says "PHP version 5.7x - 8.1x", which is ambiguous, so runtimeMin is unknown. The installation pages under docs.getfuelcms.com returned 404 for the paths tried, so the requirements page is the one read from the docs host. The latest tag 1.5.2 is dated 2022-08-15; the README's upgrade notes refer to FUEL 1.4 on CodeIgniter 3.x. Fields coined: none.
