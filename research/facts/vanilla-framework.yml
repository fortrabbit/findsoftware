notes: >
  The README says the framework is designed to be used directly or through themes that extend or supplement its patterns. The GitHub API reports the language as HTML (the repository holds the docs and examples); the package ships compiled CSS and Sass source, and the homepage states it is written in Sass, so language is recorded from that page. The npm package is the one the install guide names; its first registry upload is 2015-03-18, older than the first GitHub release (1.0.0-rc3, a prerelease, 2016-09-22), so firstRelease takes the registry date. The highest stable GitHub release is v4.61.0 (2026-10-16), the same as the npm latest tag. The GitHub prereleases run from 1.0.0-rc2 to v4.0.0-rc.1 and are older than the latest stable, so no latestPrereleaseDate is recorded. The README states the code is LGPLv3 by Canonical Ltd; the LICENSE file is the LGPL text, which carries no project copyright line, so the maintainer comes from the README. Canonical's legal page (canonical.com/legal) names Canonical Ltd; no page read gives its headquarters, so hqCountry is not recorded. The project's chat is a Matrix room, linked from the README and the homepage; no forum field is recorded for a chat room. Reviewer decision: whether a Matrix room gets its own field. The docs' hotlink route points at a CDN file on assets.ubuntu.com and the docs name a GitHub download for the latest version; these are recorded as their own installMethod entries. The HTTP Archive "Vanilla" technology is a forum software, not this framework, so httpArchiveSites is not recorded. The npm weekly figure is the sum of daily downloads for 2026-10-19 to 2026-10-25; the homepage's download figures are not recorded. Contributors counts contributor accounts from the API list with per_page=1, read from the Link header (page 86).
