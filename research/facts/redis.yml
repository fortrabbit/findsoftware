notes: >
  The GitHub API reports license NOASSERTION for the repository, so no SPDX value is taken from it; the two license entries come from LICENSE.txt and the legal page. The tri-license applies to Redis 8.0 and later, per LICENSE.txt; 7.2 and earlier remain BSD-3-Clause, and the legal page also names 7.4.x to 7.8.x as RSALv2/SSPLv1. Redis Cloud and Redis Software are commercial products from Redis Ltd; their prices were not read, so paidEditions is not recorded. The current open-source release on the download page is 8.10 (8.10.2 on GitHub); the homepage names Redis 8.8. The Docker Hub pull count in candidates-server-infra.csv (11.5B) was not re-read. Fields coined here: none.
