notes: >
  Scope. The CLI is a client of Vercel's hosted platform: the docs describe it as the way to "interact with the Vercel platform", and the platform itself is a hosted service with no self-hosted option found on these pages. Criterion 2 holds through the npm package. The CSV boundary note reads "CLI of a hosting platform"; the reviewer decides whether a deploy client counts as a build or dev tool. Version: the highest stable GitHub release of the package is vercel@58.4.4 (2026-07-30); the npm latest tag is 65.5.0, published 2026-10-28, with no GitHub release yet. The registry major is higher, so currentMajor and latestReleaseDate follow npm. Repository: the vercel/vercel monorepo holds the package in packages/cli; stars and contributors are the monorepo's. The docs page is the homepage, since the CLI has no site of its own. The npm package keeps optional native binaries; the docs say the install "still requires Node.js to run its launcher". npmWeeklyDownloads covers 2026-09-28 to 2026-10-04 for the package vercel. The HTTP Archive entry named Vercel is the hosting platform's detection and is not recorded for the CLI. Vercel Inc. is the name in the terms; the privacy notice gives a Covina, California contact address, recorded as the country.
