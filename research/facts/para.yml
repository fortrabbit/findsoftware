notes: >
  Java backend server in the Erudika/para repository, with a REST API signed with Amazon's Signature V4 and JWT tokens (README), an embedded Jetty server in the executable JAR, and an MCP server (README and docs). The Maven artifact com.erudika:para-server has versions from 2015-04-05 (Maven Central search, first upload); the GitHub tags begin in 2014, so firstRelease is 2014. The README says the project is "fully funded and supported by" Erudika, an independent, bootstrapped company. The imprint names the legal entity Erudika EOOD at Sofia, Bulgaria; the privacy page names "Erudika Ltd." at the same address, a second wording of the same entity that is not recorded as maintainer. The company site lists an X account at x.com/erudika and a LinkedIn page, which belong to the company rather than the project, so no x field is recorded. The Para Cloud page says the managed service is free for developers and the README says premium accounts exist; no free tier or paid edition is recorded as a field, since hosting plans are not editions. The README names a comparison blog post that covers LoopBack, Usergrid, BaasBox, Deployd and Telepat; the link text names none of them, so that post gives no alternativeTo; the homepage comparison table of Para, Supabase, Firebase and Parse is the recorded statement. The README has a Gitter chat badge, which has no field. runtimeMin is not recorded: the server ships as an executable JAR, and the Java version in the pom is a build requirement. Caffeine and Hazelcast (cache), Lucene and Elasticsearch (search), and Spring Security are named in the README features list and are recorded here as stated, without fields. The webhooks feature (signed payloads, custom events) and the emailer (JavaMail or AWS SES) are documented under concepts and integrations and have no field. The new.paraio.org address linked from the homepage did not answer on 2026-11-03.
