notes: >
  Splide Premium: the premium page sells a sponsor-only package, "Splide Shader Carousel", that extends the Splide class with three.js transitions; the page says the package is provided under the MIT License and may be used for commercial purposes only once the user becomes a sponsor, so it is a paid add-on package beside the library, not an edition of it, and no paidEdition is recorded. Maintainer: the LICENSE copyright line and the premium page footer both name Naotoshi Fujita (2022); the GitHub organization Splidejs is the repository owner, and the npm package's maintainer is "splidejs". Language: the homepage says written in TypeScript; GitHub reports TypeScript. Versions: GitHub's newest stable release is v4.1.3 (2022-09-24) and npm's latest is 4.1.4 (2022-11-09) without a GitHub release, so latestReleaseDate is the npm date. firstRelease: the oldest GitHub release is v1.1.0 (2019-08-22) and the npm 1.0.0 upload is from 2019-07-25; both are 2019. The getting-started page lists framework integrations for React, Vue and Svelte (react-splide, vue-splide, svelte-splide), which are notes only, and says the latest version supports Vue 3 only. npm weekly figure is the sum of daily counts for 2026-11-01 to 2026-11-07. The homepage links only GitHub among its social or community links; the README names GitHub Discussions as the Q&A place. The v4 guide compares jsDelivr hit counts with another carousel library, which is no statement of an alternative. runsAs and runtime are left out because the pages state browser use only as a feature list, not as a sentence about where the library runs.
