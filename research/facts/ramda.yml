notes: >
  Doubt: Ramda is a general-purpose utility library, not specific to the web: its homepage describes it as a functional library for JavaScript programmers, with curried, immutable helpers for data such as arrays and objects, so whether general utilities count as web helpers is the scope call the dev-libs boundary group leaves open, as for lodash. It stays stub until that call is made. Criteria 1 to 3 hold for it as a helper library: npm install is documented in the README Installation section, and the MIT license is stated. The README's Deno route imports the module from deno.land/x at a pinned older release and the Nest.land route does the same; each is its own installMethod entry, and the Deno runtime value comes from the sentence "To use directly in Deno". The README describes the browser script tags, which add the variable R to the global scope, and a bookmarklet; the bookmarklet is no installMethod. The README's What's Different section says Ramda emphasizes a purer functional style with immutability and side-effect free functions, that its functions are automatically curried, and that the data to operate on is generally supplied last. Its Translations section links five community translations of the documentation (Chinese, Ukrainian, Portuguese (BR), Russian, Spanish), which are not recorded as i18n because they are links by label. Runtime is node and deno because the README names both as ways to use the library; no runsAs is recorded, as the README names the browser beside Node.js. The LICENSE file names Scott Sauyet and Michael Hurley for the 2013-2025 copyright, and the maintainer follows that line. The first GitHub tag is v0.1.0, committed 2013-12-27; the first npm upload is 0.1.0 on 2014-05-16, so firstRelease is the older tag year, 2013. The current major is 0, since the newest stable release is v0.32.0 and the project has not released a 1.0. The npm package declares no engines field at the latest version, so no runtimeMin is recorded. The Gitter room linked from the README and homepage is a chat, not a forum, and the Open Collective link is a funding page; neither is recorded as a field. The GitHub stars and contributors belong to the repository.
