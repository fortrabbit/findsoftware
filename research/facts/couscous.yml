notes: >
  The GitHub API reports the license as NOASSERTION; the LICENSE file and README state MIT, so license follows the README. The homepage's description sentence is not used. The homepage says the phar download is at couscous.io, and the composer.json of 1.10.0 names the Packagist package couscous/couscous, which is the one recorded. The latest release is 1.10.0 dated 2023-02-21 and the repository was last pushed 2024-08-01. No end-of-life or abandonment signal was found; the README shows isitmaintained badges and nothing else about status. The project's own homepage gives the Twig templates as a feature and the GitHub Pages deployment as its publish step. The repository owner is the CouscousPHP organization.
