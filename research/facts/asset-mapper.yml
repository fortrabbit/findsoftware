notes: >
  The record is the AssetMapper component of Symfony, a PHP package on Packagist. The install docs name symfony/asset-mapper with symfony/asset and symfony/twig-pack, so the Packagist figures are for symfony/asset-mapper. Packagist's own page reports 213 dependents; the ecosyste.ms count of 32 dependent packages and 23 dependent repositories is recorded instead. The homepage and docs state that the component works without a build system, and the docs name the bundles for Tailwind, Sass, TypeScript and minification as integrations. The docs state that in dev the Symfony app returns the versioned asset URLs and that asset-map:compile writes the files into public/assets for the web server, so runsAs is static for the compiled output only; the PHP application that renders the importmap is per-request, which no page states as runsAs, so it is left out. The maintainer is the LICENSE copyright holder, Fabien Potencier (2023-present), who composer.json also lists as an author; the project's site carries the line "is a trademark of Symfony SAS", and Symfony SAS is the company behind the Symfony project. The GitHub releases list starts with 6.3.0-BETA1 (2023-05-01) and the first stable is v6.3.0 (2023-05-30), so firstRelease is 2023 either way. The hqCountry of Symfony SAS is not stated on the pages read. The 8.2 README and LICENSE are read on the branch, the composer.json and runtime on the v8.1.9 tag. The docs add that the Symfony Flex recipe creates the starter files (assets/app.js, assets/styles/app.css, config/packages/asset_mapper.yaml and importmap.php); that importmap:require downloads packages from a CDN by default; that local npm packages can be used by registering a node_modules directory as an asset path; that the component does not minify assets and points to a separate minify bundle; and that Tailwind, Sass, TypeScript and linting integrate through dedicated bundles. The base template calls importmap('app') to render the map and the entry script.
