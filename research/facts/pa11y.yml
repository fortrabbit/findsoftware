notes: >
  The record is the pa11y npm package, which the README installs; the other tools on pa11y.org (Pa11y CI, Pa11y Dashboard, Pa11y Webservice) are separate repositories and are not recorded here. The default test runner is HTML_CodeSniffer and the README also names axe as a runner; reporters are cli, csv, html, json and tsv. The README says the package is installed "most commonly as a development dependency"; runsAs local rests on the sentence naming the command line and Node.js. The site and documentation license on pa11y.org is CC-BY-NC 4.0; it covers the site, not the software, so it is not a license entry. The copyright line names "Team Pa11y and contributors", which is no legal entity; no legal form or hqCountry is recorded. The runtimeMin comes from the npm engines field of the latest release, ^22.13.0 or >=24, because the README's Node.js version sentence splits its value across a reference link. The categoryMap maps accessibility to ui-library, so only testing is recorded. The Slack community invite on the homepage has no field. The npm figure counts downloads of the pa11y package. Contributors counted with per_page=1.
