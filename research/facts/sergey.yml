notes: >
  Archived on GitHub, which the project's homepage and repository both name, so status is discontinued. The archive date is not in the API response; the last push is 2022-07-22. The repository has no GitHub releases or tags, so currentMajor and latestReleaseDate come from the npm package sergey, whose latest version is 0.0.13. The npm package has a license field of ISC, while the LICENSE file and the GitHub API say MIT; both are recorded as separate license entries. The homepage says the project "is still in it's infancy", which is not recorded as a field. The README's link to sergey.cool now redirects to an unrelated domain, so that address is not recorded as a homepage. The project's own homepage is sergey.trysmudford.com, which the repository lists. The homepage says the slots are named and default. The docs page cited is the homepage's command line options page; no separate docs site was found.
