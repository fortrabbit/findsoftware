notes: >
  Status accepted; no end signal. The repository is not archived and the npm latest 13.5.0 is not deprecated (the deprecated npm versions are the 6.1.0 prereleases). The GitHub release v13.5.0 (2026-09-22) is the newest stable; the beta v13.4.1-beta.1 (2026-07-20) is older, so no latestPrereleaseDate. firstRelease 2017 is the oldest tag v2.2.0. Maintainer follows the LICENSE copyright line, The Typegoose Team; the earlier copyright line in the same file names Akos Szokodi (2017 to 2019) and is not recorded as the maintainer. Mongoose is the parent by the project's own words ("wrapper" in the quick start, "Define Mongoose models" in the README), but no mongoose fact file exists, so basedOn is left out. The requirements block names Mongoose as a peer dependency at a pinned range and TypeScript decorator settings; the Mongoose compatibility page maps each Typegoose line to a Mongoose range. The databases value mongodb rests on the search index page of the docs, which names MongoDB; the quick start itself names no database and the README's connection string is a code sample. The forum link is the GitHub Discussions link in the homepage footer. The quick start's extra examples show static methods, instance methods and hooks written on the class, its Do's and Don'ts say Typegoose does not modify any functions of Mongoose, and the compatibility page says Mongoose may break something such as types even in patch versions. The runtimeMin 20 is the Node major of the stated minimum 20.19.0. The install section gives npm, Yarn, pnpm and Bun commands, all of the npm registry, recorded as one route. Stars and contributors belong to the repository.
