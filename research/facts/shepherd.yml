notes: >
  The license is two entries: the LICENSE.md file names AGPL-3.0 for open source and non-commercial use and a Commercial License for commercial use, and the pricing page sells the commercial license in tiers, which are license tiers and no paidEdition; no prices are recorded. GitHub detects no license (NOASSERTION) because the file is LICENSE.md, and the npm package 16.0.0 declares AGPL-3.0. The latest stable is the npm tag v16.0.0 (tag v16.0.0-shepherd.js, npm time 2026-11-11), which has no GitHub release object; the GitHub releases list holds react-shepherd wrapper releases, so the package's own releases are read from the tags and the npm registry. The repository is a monorepo; stars and contributors belong to it, and the npm figure is for shepherd.js. The CSV npm figure of 215.9k a week is out of date; the range sum for 2026-11-01 to 2026-11-07 is recorded. The README lists wrappers for React (packages/react in the same repository), Angular, Vue and Ember (separate repositories), and says it works with React, Ember, Angular, Vue.js, ES Modules or plain JavaScript; the core is framework-agnostic, so no basedOn is recorded. The npm engines field requires Node 20 or later; a Node engines field of a browser library is no runtime, so none is recorded. The pages name a LinkedIn company page on the contact page, a coined kind left out of fields. The project's own page "About" names a Ship Shape consultancy and lists companies using it, which are not recorded as adoption figures. The apex shepherdjs.dev redirects (308) to www.shepherdjs.dev, which is recorded. The privacy page says the library runs entirely in the browser of the embedding application (runsAs browser). The about page describes steps as dialogs that attach to elements in the interface, highlight them with a modal overlay and walk users through what to do next. It also says Shepherd ships with keyboard navigation support, focus trapping and aria attributes, and the pricing page lists a Business, an Enterprise and a consulting offer; the paid parts are commercial licenses and services, no prices recorded. The LICENSE.md file carries no project copyright line, so the maintainer is the about page's "maintained by Ship Shape" statement; the about page calls Ship Shape a software consultancy and gives no legal form.
