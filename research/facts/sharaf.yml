notes: >
  Sharaf is an Apache-2.0 Scala 3 library on Maven Central (ba.sake, artifact sharaf-undertow_3 named by the install docs); the highest stable GitHub release is 0.20.0, so currentMajor is 0, matching the pre-1.0 numbering. The oldest GitHub release is 0.7.0 (2024-05-29), and the earliest Maven upload in the metadata is 0.10.0, so firstRelease is taken from GitHub. The maintainer is named in the POM developer element as Sakib Hadžiavdić, with the GitHub owner sake92 as a user account; no page gives a company or country. The homepage is an https GitHub Pages site. The docs describe Undertow as the stable server, http4s and the JDK HTTP server as beta, and Scala Native executables as experimental or examples. runsAs comes from the Hello World tutorial, which starts the server and says it started on localhost; no page states a deployment model beyond that. The SQL tutorial uses an in-memory H2 database in its example, which is a tutorial choice, so databases is left out. The docs state OpenAPI-first route generation but no REST or GraphQL statement that fits headlessApi, so it is left out. The README describes route matching on method and path, request parsing into case classes with optional validation, HTML through an html interpolator, server-sent events, OpenAPI-first generation of models and routes through OpenApi4s, GraalVM and Scala Native examples, and an AWS Lambda starter that runs the Undertow app through the Lambda Web Adapter. The homepage and README state no paid tier, pricing page, or sponsorship link.
