notes: >
  The README says Amagaki "Renders pages at request time (unlike other static generators which watch and rebuild)", while the same README and the site call it a static site generator; the fact file records the category as the site states it and leaves processModel unknown. The site names no Node version; the runtimeMin comes from the npm package engines field. The npm package is @amagaki/amagaki, and the GitHub repository is blinkk/amagaki, so the two registry ids are recorded separately. The site describes Editor.dev as a companion tool that is "coming soon", which is not a paid edition and is not recorded. The README names a plugin system with no count, so pluginCount stays unknown. The field templating is recorded with the README's default engine only.
