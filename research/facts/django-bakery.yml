notes: >
  The docs site at palewi.re is the project's own documentation and is recorded as the homepage. The docs footer links the maintainer's personal Mastodon account, which is not recorded as a project channel. The maintainer is recorded as the LICENSE copyright line states it (2015); the docs footer copyright line names Ben Welsh (2026) and the PyPI author field is Ben Welsh. PyPI carries no license name and no download figure in its JSON, so pypiDownloads is absent. The highest stable GitHub release is v0.14.0 (2026-08-25), which matches the PyPI version. The first PyPI release is 0.1 (2012-03-13); the first GitHub release is v0.3.0 (2014-02-04). The docs say it can also publish to Amazon S3 with the publish command, and the README says it can rebuild and publish objects through Celery; the S3 target is the one the getting-started page documents, and no Celery page was read. The docs name Tarbell and Frozen-Flask under "Considering alternatives" and state that django-bakery is better suited to projects with a database, which is not recorded as a comparison. The docs present the output as flat files for a static-file service; the buildserver command serves them locally. The docs say a flat site has no online database for writes, so user-generated content and complex searches are outside what it does.
