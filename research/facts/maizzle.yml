notes: >
  The privacy page names the controller as Maizzle OÜ at Sepapaja tn 6, Tallinn, Harju maakond, Estonia; the homepage footer shows the same company with the copyright year and no country. The homepage and the docs introduction describe the product as a framework; it ships 30+ email components, so it is not a bare starter. The install page names the starter repository maizzle/maizzle for npx maizzle new and the CLI package maizzle on npm (described as the CLI tool for the Maizzle Email Framework); the npm figure recorded is the core package @maizzle/framework that the README badge names, and the CLI package has its own figure that is not recorded. The npm framework package reports no engines field and no page states a Node.js version, so no runtime is recorded. The Migrate pages for React Email and MJML are migration guides with component maps, so both are importsFrom and alternativeTo entries; the vite dependency is a build step and is not a basedOn value. The installation pages carry framework guides for Laravel, Nuxt, Next.js, Astro, SvelteKit, Solid, TanStack, AdonisJS and Qwik. Mailviews (mailviews.com), linked from the footer as Components, Templates and Builder, is a separate paid subscription of components and templates by the same makers; it is not an edition of the open framework, so no paidEdition is recorded. The deployment pages name sending services (Nodemailer, SendGrid, Mailgun, Postmark, Resend, AWS SES, Cloudflare) as delivery targets, and no record is made for them. The x link on the homepage footer points to an individual account; it is recorded as the homepage states it. Dev server features (live preview, Ethereal test mail) run on the developer machine and are the basis of the runsAs local value. The first release is the npm upload 0.1.0 of 2019-03-28, the oldest registry upload. The introduction page says the build renders the components to HTML, runs transformers that inline CSS and produce email-safe output, and the CLI page says build writes HTML files to an output directory. The built-in components named in the prose are the Container, Button and Heading components of the component reference. The dev server page describes device sizes, compatibility checks, dark mode emulation and test emails sent through Ethereal or a configured SMTP transport. The CLI page describes the serve and build commands as the developer's own terminal workflow. Mailviews is a paid subscription, described on its homepage as one subscription for the components and templates. The README says the repository contains the core code of the framework and points to the starter repository for building emails, so the stars and contributors belong to the core code.
