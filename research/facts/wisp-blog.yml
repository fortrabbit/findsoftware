notes: >
  Hosted headless CMS for blogs; Wisp is not the Gleam framework of the same name (research/facts/wisp.yml). The parent Synscribe describes itself on its own homepage as a programmatic SEO agency in Singapore (footer "pSEO Agency Singapore", "2026 Synscribe"); its legal name and address were not found, and the terms choose Singapore law, which is no headquarters fact, so hqCountry is absent: the reviewer decides whether to record it. The terms name only "wisp" as the operator. The free plan adds attribution to every post (terms section 9): the attribution may promote wisp, Synscribe or AgentMole; the pricing page calls the line "Powered by Mole. AI Agent for SEO & GEO". The Multi-site page says each blog is its own instance with its own plan ("Choose different plans for each blog"). The free plan is "Free Forever" and the REST API needs a paid plan (REST API page: "REST API access is only available on paid plans."); prices and plan names are not recorded. Pro is priced per user per month and an Indie Hacker Pass is sold as a limited lifetime deal; no prices are recorded. Open source parts go here only: the GitHub organization Wisp-CMS holds a Next.js starter (nextjs-blog-cms-wisp, MIT, not archived), a Nuxt starter (MIT), a documentation repository that is archived, and forks; the npm client @wisp-cms/client has latest 0.0.23. Coined kinds without a field: custom content types (feature page "Create Custom Content Types with Wisp"), comments, custom React components and contextual calls to action. The compare page at /compare names Contentful, Strapi, Sanity, Ghost, Directus, Payload, Hygraph, DatoCMS, TinaCMS, Decap CMS and Keystone among others, with no alternative wording, so no alternativeTo fact. No user management, SSO, translation or live preview page was found; the pricing page calls the Pro plan "ideal for growing businesses and teams" only. The founder's About page calls the company bootstrapped and names no legal entity.
