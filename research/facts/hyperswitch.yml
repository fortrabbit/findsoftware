notes: >
  Current stable release v1.129.0 (2026-11-02). The CSV row's star count (45.4k) and release date (2026-10-16) are older; the facts carry today's values. The repository holds the Rust app server; the control center, web SDK, client SDKs, vault and encryption service, and the Helm and Terraform repositories are separate repositories named in the README, and they are not records here. The README calls the project a "commercial open-source payments stack"; the license is Apache 2.0 for the repository as shipped. The pricing page lists "Self-Host Community Edition", "Self-Host Enterprise Edition" (contact sales) and "Hosted Cloud" tiers, and three modules (Revenue Recovery, Cost Observability, Reconciliation) as "Paid add-on"; no paidEdition fact is written because the Enterprise tier is described as support and the add-ons are priced modules, not an edition. Reviewer decision: whether that reading holds. Production route: the self-hosting pages say the Docker Compose and the Helm quick start are "for evaluation only", and production self-hosting is documented as the Enterprise self-hosting (BYOC) program with three support tiers; criterion 3 is met by the install pages, the production statement goes to the reviewer. The legal name differs in spelling by page: "Juspay Technologies Private Limited" in the merchant terms, "Juspay Technologies Pvt Ltd" in the privacy notice; both name the same company and the terms name the legal form. The homepage footer links twitter.com/juspay, a company account; the recorded x value is the project account from the README badge. The README lists SDKs in Kotlin, Swift, TypeScript, Dart and ReScript. Redis is recorded under databases because the system requirements page names it with postgres; the docs call it a cache. The Docker images the compose file pulls are on docker.juspay.io, not Docker Hub, so no dockerPulls figure. runtime binary comes from the two [[bin]] targets (router, scheduler) in crates/router/Cargo.toml at v1.129.0. The scheduler is documented as producer and consumer processes that execute queued tasks, consistent with a second always-on process.
