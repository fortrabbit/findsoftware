notes: >
  The repository is a monorepo: the GitHub tags and releases are per package (cssnano@9.9.0, cssnano-preset-advanced@10.0.0), and the record follows the cssnano package the install guide names, so currentMajor, latestReleaseDate and the npm figures come from cssnano. The homepage is the project's GitHub Pages site (cssnano.github.io/cssnano). The docs fact points at the getting-started guide the README links; the site folder of the repository is the source of that site. The maintainer is the LICENSE-MIT copyright line; the package.json author is the same person, with the site at beneb.info. The README and the site say the project is built on PostCSS ("built on top of the PostCSS ecosystem", "cssnano is built upon PostCSS plugins"); PostCSS has no record, so no basedOn is set and the parent is kept here. The first upload is cssnano 1.0.0 on npm (2015-04-14) and the first GitHub release is v1.0.0 (2015-05-02), so firstRelease is 2015 from both. The runtimeMin value comes from the engines field at the 9.9.0 tag. The site's Node version line applies to the same minimum. The last prerelease tags are from 2017 (v4.0.0-rc.2), older than the latest release, so no latestPrereleaseDate. The getting-started guide recommends compressing during the deployment step, so runsAs stays local. The site offers a playground and the README links Open Collective backer and sponsor pages and a Gitter chat for PostCSS; none is a field here. The getting-started guide says cssnano "is a PostCSS plugin, so running cssnano also requires installing PostCSS". The README and the site describe a default preset with safe transforms and an advanced preset with more aggressive ones, and the README says Browserslist changes the output where a transform depends on the browsers a project supports.
