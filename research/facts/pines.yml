notes: |
  Accepted on the boundary row: the repository has no release or tag, so criterion 4 is judged by lastCommitDate, the committer date of the newest commit on main (2025-08-23), which is well inside the four-year window. Criterion 2 holds because the repository ships the element sources (elements/*.html) that users copy. The project states it has no package to install: the homepage says "No package to install, no build step to configure", so no npm figure is recorded. The How to Use page loads Alpine and Tailwind from unpkg.com and cdn.tailwindcss.com in its example and states that the Tailwind CDN should not be used in production; no runsAs or runtime is recorded because no page states that the elements run in the browser. The maintainer is DevDojo LLC from the homepage footer; the LICENSE copyright line reads "Copyright (c) DevDojo". The forum is the DevDojo questions board named in the README. The repository owner is an organization, thedevdojo. The homepage's Twitter link is the DevDojo account, which serves the whole company, so no x field is recorded.
