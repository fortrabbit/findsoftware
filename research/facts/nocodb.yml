notes: >
  The project is licensed under the Sustainable Use License, which is not an SPDX identifier and the GitHub license field reads NOASSERTION; the LICENSE.md text is recorded and the license model is source-available because the license limits use to internal business or non-commercial purposes. The license grant is quoted as the LICENSE.md states it. currentMajor is absent: the releases use calendar versions (2026.09.1), which have no major. The highest release is 2026.09.1. The homepage names MySQL and PostgreSQL as connectable databases; the install docs name SQLite and PostgreSQL, so only those are recorded as databases. The npm package named nocodb is not the package the install docs name, so no npm figure is recorded. Boundary question from the CSV settled as a self-hostable web app with a spreadsheet interface and REST API, in the database category as its README states it; it is not a content backend by its own pages. The SSO listed on the pricing page belongs to the paid self-hosted plans. The maintainer is NocoDB Inc as the terms of service state it; they give no headquarters, and the Delaware address in the privacy policy is a mailing address, so hqCountry is not recorded. The Docker Hub image is nocodb/nocodb. NocoDB Cloud is the hosted service next to the open source part; its plans are on the pricing page and are not recorded.
