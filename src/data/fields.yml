# The field dictionary. One entry per field a record may carry, and the only
# place any of it is written down: the zod schema builds its enums from these
# vocabularies, the record page builds its rows from `group` and `label`, and the
# filter panel builds itself from the entries that carry `facet`.
#
# Provisional: derived from the first 66 research fact files (MR-457) and to be
# reworked in MR-409. The keys and their meaning follow FindSoftware's dictionary.
#
# - `id`     the frontmatter field name.
# - `label`  what a reader is shown, on the record page and as a filter heading.
# - `group`  which section of the record page the field appears in.
# - `facet`  the URL segment where the field is filterable.
# - `values` the vocabulary. Absent means free text, a number or a date.
# - `render` how a value is drawn where it is not a label lookup.
# - `relation` the value is another record's id.
# - `refresh`  `api` when a script reads the value from a registry. Absent means
#              the yearly review checks it: a record is due once its `checkedAt`
#              is a year old. Nothing that changes faster than once a year is
#              typed in: majors not dot releases, minimums not exact ranges.

