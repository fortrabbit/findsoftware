# What puts a record in the default view, applied at build time to the figures
# scripts/momentum.mjs measured into momentum.json. Move a number and rebuild;
# nothing needs measuring again. Aim: about 600 records shown once research is done.
# The About page states these numbers.

# A release, pre-release or push to the repository within this many months.
activeMonths: 12

# Then any one of the three below.

# Commits in the last 13 weeks, with the last 26 weeks at least `trend` times the 26 before.
commits:
  last13Weeks: 200
  trend: 2

# Downloads up by `growth` (1 is 100%) against the same window a year ago.
# Today's figure must reach the floor, so a jump from 10 to 20 is no growth;
# a small year-ago figure counts, so a young package can pass. An unmeasured one shows no growth.
downloads:
  growth: 1
  npm28Floor: 100000
  packagistDailyFloor: 1000

# An active record in this top share of usage (0.1 is the top tenth on /usage/) stays in on its own.
popularityTop: 0.1
